id: gcp.cloud_sql_instance
label: Cloud SQL
description: Managed PostgreSQL or MySQL with a private IP on the enclosing VPC.
category: database
icon: gcp/cloud_sql.svg
kind: leaf
allowed_parents: [gcp.vpc]
size: {w: 120, h: 90}
props:
  type: object
  required: [database_version, tier, region]
  properties:
    database_version:
      type: string
      group: Engine
      title: Engine
      default: POSTGRES_16
      enum: [POSTGRES_16, POSTGRES_15, POSTGRES_14, MYSQL_8_0, MYSQL_8_4]
    tier:
      type: string
      group: Engine
      title: Tier
      default: db-f1-micro
      enum: [db-f1-micro, db-g1-small, db-custom-1-3840, db-custom-2-7680, db-custom-4-15360]
    region:
      type: string
      group: Placement
      title: Region
      default: europe-west1
      enum: [us-central1, us-east1, us-east4, us-west1, europe-west1, europe-west2, europe-west3, europe-west4, europe-north1, asia-east1, asia-southeast1, asia-northeast1, australia-southeast1]
    disk_gb:
      type: integer
      group: Storage & availability
      title: Storage (GB)
      default: 10
      minimum: 10
      maximum: 65536
    high_availability:
      type: boolean
      group: Storage & availability
      title: Regional (HA)
      default: false
terraform:
  module: gcp/cloud_sql_instance
  inputs_from_parent:
    network_id: parent.network_id
    private_service_connection: parent.private_service_connection
  import: {resource: google_sql_database_instance, name: name, props: {database_version: database_version, region: region, tier: settings.0.tier}}
outputs: [connection_name, private_ip, instance_name]
