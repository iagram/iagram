id: gcp.project
label: GCP Project
description: The Google Cloud project everything below is deployed into. Credentials come from Application Default Credentials (gcloud auth application-default login), never from iagram.
category: account
icon: gcp/project.svg
caption_prop: region
kind: container
provides:
  project: "${project_id}"
  region: "${region}"
style: {border: "#5f6368", dash: solid, label: left}
allowed_parents: [root]
size: {w: 1200, h: 800}
terraform:
  role: account
  import: {from: project, prop: project}
  provider_args:
    project: ${project}
    region: ${region}
props:
  type: object
  required: [project, region]
  properties:
    project:
      type: string
      title: Project ID
      pattern: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
    region:
      type: string
      title: Default region
      default: europe-west1
      enum: [us-central1, us-east1, us-east4, us-west1, europe-west1, europe-west2, europe-west3, europe-west4, europe-north1, asia-east1, asia-southeast1, asia-northeast1, australia-southeast1]
