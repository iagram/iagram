# Link resources drawn as lines (see catalog/aws/_links.yaml).
links:
  google_compute_network_peering:
    label: VPC peering
    from: {attr: network, output: self_link}
    to: {attr: peer_network, output: self_link}
    style: {direction: none}
  google_network_connectivity_spoke:
    label: hub spoke
    from: hub
    to: {attr: linked_vpc_network, output: self_link, types: [google_compute_network]}
    style: {direction: none, color: "#7AA116"}
