id: gcp.zone
label: Zone
description: A zone column inside a project, VPC or subnetwork. Zonal resources drawn inside it take their zone from it.
category: network
icon: gcp/zone.svg
kind: container
transparent: true
allowed_parents: [gcp.project, gcp.vpc, gcp.subnetwork]
size: {w: 320, h: 420}
caption_prop: zone
style: {border: "#4285F4", dash: dashed, label: center}
provides:
  zone: "${zone}"
props:
  type: object
  required: [zone]
  properties:
    zone:
      type: string
      title: Zone suffix
      default: b
      enum: [a, b, c, d, f]
