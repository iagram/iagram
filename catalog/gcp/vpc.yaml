id: gcp.vpc
label: VPC Network
description: Global VPC network with custom subnetworks and a private-services range so Cloud SQL can attach with a private IP.
category: network
icon: gcp/vpc.svg
kind: container
style: {border: "#4285F4", dash: dashed, label: left}
allowed_parents: [gcp.project]
size: {w: 900, h: 520}
props:
  type: object
  properties:
    routing_mode:
      type: string
      title: Routing mode
      default: REGIONAL
      enum: [REGIONAL, GLOBAL]
terraform:
  module: gcp/vpc
  import: {resource: google_compute_network, name: name, props: {routing_mode: routing_mode}}
outputs: [network_id, network_name, network_self_link, private_service_connection]
