id: aws.rds_instance
label: RDS Instance
category: database
icon: aws/rds.svg
kind: leaf
allowed_parents: [aws.subnet]
size: {w: 120, h: 90}
props:
  type: object
  required: [engine, instance_class]
  properties:
    engine:
      type: string
      title: Engine
      default: postgres
      enum: [postgres, mysql, mariadb]
    engine_version:
      type: string
      title: Engine version
      description: Empty means the engine default.
    instance_class:
      type: string
      title: Instance class
      default: db.t3.micro
      enum: [db.t3.micro, db.t3.small, db.t3.medium, db.m6g.large, db.m6g.xlarge, db.r6g.large, db.r6g.xlarge]
    allocated_storage_gb:
      type: integer
      title: Storage (GiB)
      default: 20
      minimum: 20
      maximum: 65536
    multi_az:
      type: boolean
      title: Multi-AZ
      default: false
terraform:
  module: aws/rds_instance
  inputs_from_parent:
    vpc_id: parent.parent.vpc_id
  collect:
    subnet_ids: {type: aws.subnet, under: parent.parent, output: subnet_id, min: 2, distinct: az}
outputs: [endpoint, address, port, security_group_id]
