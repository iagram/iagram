id: aws.subnet
label: Subnet
category: network
icon: aws/groups/private_subnet.svg
icon_variants:
  public: aws/groups/public_subnet.svg   # used when props.public is true
caption_prop: cidr
kind: container
style: {border: "#00A4A6", dash: solid, label: left}
style_variants:
  public: {border: "#7AA116", dash: solid, label: left}
allowed_parents: [aws.vpc]
size: {w: 360, h: 260}
props:
  type: object
  required: [cidr, az]
  properties:
    cidr:
      type: string
      group: Networking
      title: CIDR block
      format: cidr
      default: 10.0.1.0/24
    az:
      type: string
      group: Networking
      title: Availability zone suffix
      description: a, b, c… appended to the region; Local Zones and Wavelength Zones use their suffix with a leading dash (-lax-1a, -wl1-bos-wlz-1).
      default: a
      pattern: "^([a-f]|-[a-z0-9-]+)$"
      examples: [a, b, c, -lax-1a, -wl1-bos-wlz-1]
    public:
      type: boolean
      group: Networking
      title: Public (route to internet gateway)
      default: false
terraform:
  module: aws/subnet
  import: {resource: aws_subnet, parent: vpc_id, name: tags.Name, props: {cidr: cidr_block, az: "availability_zone|last", public: map_public_ip_on_launch}}
  inputs_from_parent:
    vpc_id: parent.vpc_id
    internet_gateway_id: parent.internet_gateway_id
outputs: [subnet_id, availability_zone]
