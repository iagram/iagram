id: aws.alb
label: Application Load Balancer
category: network
icon: aws/alb.svg
kind: leaf
allowed_parents: [aws.vpc]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.ec2_instance,    kind: routes_to, label: routes to, terraform: {set: from, input: target_instance_ids, value: to.instance_id}}
    - {to: aws.lambda_function, kind: routes_to, label: routes to, terraform: {set: from, input: target_lambda_arns, value: to.function_arn}}
props:
  type: object
  required: [scheme]
  properties:
    scheme:
      type: string
      title: Scheme
      default: internet-facing
      enum: [internet-facing, internal]
    listener_port:
      type: integer
      title: Listener port
      default: 80
      minimum: 1
      maximum: 65535
terraform:
  module: aws/alb
  inputs_from_parent:
    vpc_id: parent.vpc_id
  collect:
    subnet_ids: {type: aws.subnet, under: parent, output: subnet_id}
outputs: [dns_name, alb_arn]
