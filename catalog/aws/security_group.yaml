id: aws.security_group
label: Security Group
description: Stateful firewall. Connect it to the resources it protects; rules are derived from the traffic arrows pointing at those resources.
category: security
icon: aws/security_group.svg
kind: leaf
allowed_parents: [aws.vpc]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.ec2_instance,    kind: protects, label: protects, style: {direction: none, dash: dashed}, terraform: {set: to, input: security_group_ids, value: from.security_group_id}}
    - {to: aws.rds_instance,    kind: protects, label: protects, style: {direction: none, dash: dashed}, terraform: {set: to, input: security_group_ids, value: from.security_group_id}}
    - {to: aws.alb,             kind: protects, label: protects, style: {direction: none, dash: dashed}, terraform: {set: to, input: security_group_ids, value: from.security_group_id}}
    - {to: aws.lambda_function, kind: protects, label: protects, style: {direction: none, dash: dashed}, terraform: {set: to, input: security_group_ids, value: from.security_group_id}}
props:
  type: object
  properties:
    description:
      type: string
      group: General
      title: Description
      default: managed by iagram
    ingress_ports:
      type: string
      group: Ingress
      title: Ingress ports
      description: Comma-separated TCP ports opened from ingress_cidr, e.g. "80,443".
      default: "443"
    ingress_cidr:
      type: string
      group: Ingress
      title: Ingress CIDR
      format: cidr
      default: 0.0.0.0/0
terraform:
  module: aws/security_group
  import: {resource: aws_security_group, parent: vpc_id, name: name, props: {description: description}}
  inputs_from_parent:
    vpc_id: parent.vpc_id
outputs: [security_group_id]
