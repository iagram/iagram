id: aws.route53_zone
label: Route 53 Zone
description: Hosted zone. Arrows to load balancers or distributions create alias A records (apex for the first target, <target name>.<domain> for each).
category: network
icon: aws/route53.svg
kind: leaf
allowed_parents: [aws.region, aws.account]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.alb,                     kind: resolves_to, label: resolves to, terraform: {set: from, input: alias_targets, value: to.alias_target}}
    - {to: aws.cloudfront_distribution, kind: resolves_to, label: resolves to, terraform: {set: from, input: alias_targets, value: to.alias_target}}
props:
  type: object
  required: [domain]
  properties:
    domain:
      type: string
      title: Domain
      pattern: "^([a-z0-9-]+\\.)+[a-z]{2,}$"
terraform:
  module: aws/route53_zone
  import: {resource: aws_route53_zone, name: name, props: {domain: name}}
outputs: [zone_id, name_servers]
