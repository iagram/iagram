id: aws.lambda_function
label: Lambda Function
category: serverless
icon: aws/lambda.svg
kind: leaf
allowed_parents: [aws.region, aws.subnet]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.s3_bucket,    kind: reads_writes, label: reads/writes, terraform: {set: from, input: s3_bucket_arns, value: to.bucket_arn}}
    - {to: aws.rds_instance, kind: connects_to,  label: connects to,  terraform: {set: to, input: ingress_security_group_ids, value: from.security_group_id}}
props:
  type: object
  required: [runtime, handler]
  properties:
    runtime:
      type: string
      group: Runtime
      title: Runtime
      default: python3.12
      enum: [python3.12, python3.13, nodejs20.x, nodejs22.x, go1.x, java21, provided.al2023]
    handler:
      type: string
      group: Runtime
      title: Handler
      default: app.handler
    memory_mb:
      type: integer
      group: Resources
      title: Memory (MB)
      default: 256
      minimum: 128
      maximum: 10240
    timeout_s:
      type: integer
      group: Resources
      title: Timeout (s)
      default: 30
      minimum: 1
      maximum: 900
terraform:
  module: aws/lambda_function
  import: {resource: aws_lambda_function, parent: vpc_config.0.subnet_ids.0, name: function_name, props: {runtime: runtime, handler: handler, memory_mb: memory_size, timeout_s: timeout}}
  inputs_from_parent:
    subnet_id: parent.subnet_id
    vpc_id: parent.parent.vpc_id
outputs: [function_arn, function_name, security_group_id]
