id: aws.cloudfront_distribution
label: CloudFront Distribution
description: Global CDN. Point it at an S3 bucket (origin access control + bucket policy are generated) and/or an ALB.
category: network
icon: aws/services/amazon_cloudfront.svg
kind: leaf
allowed_parents: [aws.region, aws.account]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.s3_bucket, kind: serves_from, label: serves from, terraform: {set: from, input: origin_buckets, value: to.cdn_origin}}
    - {to: aws.alb,       kind: serves_from, label: serves from, terraform: {set: from, input: origin_alb_dns_names, value: to.dns_name}}
props:
  type: object
  properties:
    price_class:
      type: string
      group: Delivery
      title: Price class
      default: PriceClass_100
      enum: [PriceClass_100, PriceClass_200, PriceClass_All]
    default_root_object:
      type: string
      group: Delivery
      title: Default root object
      default: index.html
    enabled:
      type: boolean
      group: Delivery
      title: Enabled
      default: true
terraform:
  module: aws/cloudfront_distribution
  import: {resource: aws_cloudfront_distribution, name: comment, props: {price_class: price_class, default_root_object: default_root_object, enabled: enabled}}
outputs: [domain_name, distribution_id, alias_target]
