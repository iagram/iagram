# Spanning groups: elements drawn as a band across several containers. The
# containers the band covers become the value of a list attribute (an Auto
# Scaling group spans the subnets in vpc_zone_identifier). Ghost tiles show
# the capacity without creating Terraform resources.
spans:
  aws_autoscaling_group:
    label: Auto Scaling group
    attr: vpc_zone_identifier
    over: [aws_subnet]
    ghost: {count: desired_capacity, icon: aws/resources/amazon_ec2_instance.svg}
    icon: aws/groups/auto_scaling_group.svg
    style: {border: "#ED7100", dash: dashed, label: center}
