id: aws.organizational_unit
label: Organizational Unit
description: An organizational unit (aws_organizations_organizational_unit). Nested units are created under it; accounts drawn inside are grouped visually.
category: account
icon: aws/resources/aws_organizations_organizational_unit.svg
kind: container
allowed_parents: [aws.organization, aws.organizational_unit]
size: {w: 600, h: 400}
style: {border: "#E7157B", dash: solid, label: left}
terraform:
  role: resource
  resource: aws_organizations_organizational_unit
  attrs:
    name: "${name}"
  inputs_from_parent:
    parent_id: parent.id
outputs: [id, arn]
