id: aws.vpc
label: VPC
category: network
icon: aws/vpc.svg
kind: container
allowed_parents: [aws.region]
size: {w: 800, h: 480}
props:
  type: object
  required: [cidr]
  properties:
    cidr:
      type: string
      title: CIDR block
      format: cidr
      default: 10.0.0.0/16
    enable_dns_hostnames:
      type: boolean
      title: DNS hostnames
      default: true
terraform:
  module: registry/aws/vpc
outputs: [vpc_id]
