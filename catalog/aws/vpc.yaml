id: aws.vpc
label: VPC
category: network
icon: aws/groups/virtual_private_cloud_vpc.svg
caption_prop: cidr
kind: container
style: {border: "#8C4FFF", dash: solid, label: left}
allowed_parents: [aws.region]
size: {w: 800, h: 480}
props:
  type: object
  required: [cidr]
  properties:
    cidr:
      type: string
      title: CIDR block
      format: cidr
      default: 10.0.0.0/16
    enable_dns_hostnames:
      type: boolean
      title: DNS hostnames
      default: true
terraform:
  module: aws/vpc
  import: {resource: aws_vpc, name: tags.Name, props: {cidr: cidr_block, enable_dns_hostnames: enable_dns_hostnames}}
outputs: [vpc_id, internet_gateway_id]
