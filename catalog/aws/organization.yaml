id: aws.organization
label: AWS Organization
description: The organization root. Organizational units drawn inside it are created under this root; accounts drawn inside are grouped visually (their membership is managed in AWS Organizations, not by iagram). Has no Terraform of its own.
category: account
icon: aws/services/aws_organizations.svg
kind: container
allowed_parents: [root]
size: {w: 1400, h: 900}
style: {border: "#E7157B", dash: dashed, label: left}
caption_prop: root_id
provides:
  parent_id: "${root_id}"
props:
  type: object
  required: [root_id]
  properties:
    root_id:
      type: string
      title: Root id
      description: The organization root (r-xxxx), parent of top-level organizational units.
      pattern: "^r-[a-z0-9]{4,32}$"
