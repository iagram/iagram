id: aws.sqs_queue
label: SQS Queue
category: integration
icon: aws/services/amazon_simple_queue_service.svg
kind: leaf
allowed_parents: [aws.region]
size: {w: 120, h: 90}
connections:
  in:
    - {from: aws.ec2_instance,    kind: sends_to, label: sends to, terraform: {set: from, input: sqs_queue_arns, value: to.queue_arn}}
    - {from: aws.lambda_function, kind: sends_to, label: sends to, terraform: {set: from, input: sqs_queue_arns, value: to.queue_arn}}
  out:
    - {to: aws.lambda_function, kind: triggers, label: triggers, terraform: {set: to, input: sqs_trigger_arns, value: from.queue_arn}}
props:
  type: object
  properties:
    fifo:
      type: boolean
      group: Queue
      title: FIFO
      default: false
    visibility_timeout_s:
      type: integer
      group: Queue
      advanced: true
      title: Visibility timeout (s)
      default: 30
      minimum: 0
      maximum: 43200
    retention_s:
      type: integer
      group: Queue
      advanced: true
      title: Message retention (s)
      default: 345600
      minimum: 60
      maximum: 1209600
terraform:
  module: aws/sqs_queue
  import: {resource: aws_sqs_queue, name: name, props: {fifo: fifo_queue, visibility_timeout_s: visibility_timeout_seconds, retention_s: message_retention_seconds}}
outputs: [queue_arn, queue_url]
