id: aws.region
label: Region
category: account
icon: aws/groups/region.svg
caption_prop: region
kind: container
style: {border: "#00A4A6", dash: dashed, label: left}
allowed_parents: [aws.account]
size: {w: 1000, h: 650}
terraform:
  role: region
  import: {from: arn.region, prop: region}
  provider_args:
    region: ${region}
props:
  type: object
  required: [region]
  properties:
    region:
      type: string
      title: Region
      default: eu-west-1
      enum: [us-east-1, us-east-2, us-west-1, us-west-2, ca-central-1, eu-west-1, eu-west-2, eu-west-3, eu-central-1, eu-north-1, eu-south-1, ap-southeast-1, ap-southeast-2, ap-northeast-1, ap-northeast-2, ap-south-1, sa-east-1, me-south-1, af-south-1]
