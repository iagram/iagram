id: aws.ec2_instance
label: EC2 Instance
category: compute
icon: aws/ec2.svg
kind: leaf
allowed_parents: [aws.subnet]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.rds_instance, kind: connects_to,  label: connects to}
    - {to: aws.s3_bucket,    kind: reads_writes, label: reads/writes}
props:
  type: object
  required: [instance_type]
  properties:
    instance_type:
      type: string
      title: Instance type
      default: t3.micro
      enum: [t3.micro, t3.small, t3.medium, t3.large, m6i.large, m6i.xlarge, c6i.large, c6i.xlarge, r6i.large]
    ami:
      type: string
      title: AMI
      description: An AMI id, or "al2023-latest" to resolve the newest Amazon Linux 2023 at plan time.
      default: al2023-latest
    root_volume_gb:
      type: integer
      title: Root volume (GiB)
      default: 20
      minimum: 8
      maximum: 16384
    public_ip:
      type: boolean
      title: Associate public IP
      default: false
terraform:
  module: registry/aws/ec2_instance
  inputs_from_parent:
    subnet_id: parent.id
    vpc_id: parent.parent.id
outputs: [instance_id, private_ip, public_ip]
