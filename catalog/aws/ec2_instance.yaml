id: aws.ec2_instance
label: EC2 Instance
category: compute
icon: aws/resources/amazon_ec2_instance.svg
caption_prop: instance_type
kind: leaf
allowed_parents: [aws.subnet]
size: {w: 120, h: 90}
connections:
  out:
    - {to: aws.rds_instance, kind: connects_to,  label: connects to,  terraform: {set: to, input: ingress_security_group_ids, value: from.security_group_id}}
    - {to: aws.s3_bucket,    kind: reads_writes, label: reads/writes, style: {direction: both}, terraform: {set: from, input: s3_bucket_arns, value: to.bucket_arn}}
props:
  type: object
  required: [instance_type]
  properties:
    instance_type:
      type: string
      group: Compute
      title: Instance type
      default: t3.micro
      enum: [t3.micro, t3.small, t3.medium, t3.large, m6i.large, m6i.xlarge, c6i.large, c6i.xlarge, r6i.large]
    ami:
      type: string
      group: Compute
      advanced: true
      title: AMI
      description: An AMI id, or "al2023-latest" to resolve the newest Amazon Linux 2023 at plan time.
      default: al2023-latest
    root_volume_gb:
      type: integer
      group: Storage
      title: Root volume (GiB)
      default: 20
      minimum: 8
      maximum: 16384
    public_ip:
      type: boolean
      group: Networking
      title: Associate public IP
      default: false
terraform:
  module: aws/ec2_instance
  import: {resource: aws_instance, parent: subnet_id, name: tags.Name, props: {instance_type: instance_type, ami: ami, public_ip: associate_public_ip_address}}
  inputs_from_parent:
    subnet_id: parent.subnet_id
    vpc_id: parent.parent.vpc_id
outputs: [instance_id, private_ip, public_ip, security_group_id]
