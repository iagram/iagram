id: aws.availability_zone
label: Availability Zone
description: A zone column inside a Region or VPC. Subnets, instances and volumes drawn inside it take their availability zone from it.
category: network
icon: aws/availability_zone.svg
kind: container
transparent: true
allowed_parents: [aws.region, aws.vpc]
size: {w: 320, h: 420}
caption_prop: zone
style: {border: "#00A4A6", dash: dashed, label: center}
provides:
  az: "${zone}"
  availability_zone: "${region}${zone}"
props:
  type: object
  required: [zone]
  properties:
    zone:
      type: string
      title: Zone suffix
      description: a, b, c… appended to the Region; Local Zones and Wavelength Zones use their suffix with a leading dash (-lax-1a).
      default: a
      pattern: "^([a-f]|-[a-z0-9-]+)$"
      examples: [a, b, c, -lax-1a, -wl1-bos-wlz-1]
