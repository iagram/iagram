# Link resources: Terraform resources whose meaning is "connect A to B". They
# are drawn as lines between the two elements (as in the official diagrams)
# and configured on the line, never as boxes. `from`/`to` name the attribute
# receiving each end; "a|b" offers alternatives picked by the target's type;
# an object form sets the referenced output or restricts the accepted types.
links:
  aws_vpc_peering_connection:
    label: VPC peering
    from: vpc_id
    to: peer_vpc_id
    style: {direction: none}
  aws_ec2_transit_gateway_vpc_attachment:
    label: VPC attachment
    from: transit_gateway_id
    to: vpc_id
    style: {direction: none, color: "#7AA116"}
  aws_ec2_transit_gateway_peering_attachment:
    label: Transit Gateway peering
    from: transit_gateway_id
    to: peer_transit_gateway_id
    style: {direction: none}
  aws_vpn_connection:
    label: Site-to-Site VPN
    from: customer_gateway_id
    to: transit_gateway_id|vpn_gateway_id
    style: {direction: none, dash: dashed, color: "#1d8bd6"}
    defaults: {type: ipsec.1}
  aws_dx_gateway_association:
    label: Direct Connect gateway association
    from: dx_gateway_id
    to: associated_gateway_id
    style: {direction: none, color: "#8C4FFF"}
  aws_dx_connection_association:
    label: LAG association
    from: connection_id
    to: lag_id
    style: {direction: none}
  aws_route53_zone_association:
    label: VPC association
    from: zone_id
    to: vpc_id
    style: {direction: none, dash: dashed}
  aws_networkmanager_vpc_attachment:
    label: Core network attachment
    from: core_network_id
    to: {attr: vpc_arn, output: arn}
    style: {direction: none, color: "#7AA116"}
  aws_lb_target_group_attachment:
    label: target
    from: {attr: target_group_arn, output: arn}
    to: {attr: target_id, types: [aws_instance, aws_lambda_function, aws_lb]}
    style: {dash: dotted}
  aws_ram_resource_association:
    label: shared via RAM
    from: {attr: resource_share_arn, output: arn}
    to: {attr: resource_arn, output: arn, types: [aws_subnet, aws_ec2_transit_gateway, aws_route53_resolver_rule, aws_ec2_capacity_reservation, aws_networkmanager_core_network]}
    style: {direction: none, dash: dashed}
  aws_sns_topic_subscription:
    label: subscription
    from: {attr: topic_arn, output: arn}
    to: {attr: endpoint, output: arn, types: [aws_sqs_queue, aws_lambda_function, aws_kinesis_firehose_delivery_stream]}
    style: {dash: dashed}
    defaults: {protocol: sqs}
  aws_lambda_event_source_mapping:
    label: event source
    from: {attr: event_source_arn, output: arn, types: [aws_sqs_queue, aws_kinesis_stream, aws_dynamodb_table, aws_msk_cluster, aws_mq_broker]}
    to: {attr: function_name, output: arn, types: [aws_lambda_function]}
    style: {dash: dashed}
  aws_cloudwatch_event_target:
    label: target
    from: {attr: rule, output: name, types: [aws_cloudwatch_event_rule]}
    to: {attr: arn, output: arn, types: [aws_lambda_function, aws_sqs_queue, aws_sns_topic, aws_sfn_state_machine, aws_kinesis_stream, aws_kinesis_firehose_delivery_stream, aws_ecs_cluster, aws_cloudwatch_event_bus, aws_cloudwatch_log_group, aws_codepipeline, aws_codebuild_project, aws_batch_job_queue, aws_ssm_document, aws_sagemaker_pipeline, aws_redshift_cluster, aws_api_gateway_rest_api]}
    style: {dash: dashed}
  aws_organizations_policy_attachment:
    label: policy attachment
    from: {attr: policy_id, types: [aws_organizations_policy]}
    to: {attr: target_id, types: [aws_organizations_organizational_unit, aws_organizations_account, aws_organizations_organization]}
    style: {direction: none, dash: dotted}
  aws_wafv2_web_acl_association:
    label: WAF association
    from: {attr: web_acl_arn, output: arn, types: [aws_wafv2_web_acl]}
    to: {attr: resource_arn, output: arn, types: [aws_lb, aws_api_gateway_stage, aws_api_gateway_rest_api, aws_appsync_graphql_api, aws_cognito_user_pool, aws_apprunner_service, aws_verifiedaccess_instance]}
    style: {direction: none, dash: dashed, color: "#DD344C"}
  aws_route53_resolver_rule_association:
    label: resolver rule association
    from: {attr: resolver_rule_id, types: [aws_route53_resolver_rule]}
    to: {attr: vpc_id, types: [aws_vpc]}
    style: {direction: none, dash: dashed}
  aws_rds_integration:
    label: zero-ETL integration
    from: {attr: source_arn, output: arn, types: [aws_rds_cluster, aws_dynamodb_table, aws_db_instance]}
    to: {attr: target_arn, output: arn, types: [aws_redshiftserverless_namespace, aws_redshift_cluster]}
    style: {dash: dashed}
  aws_ram_principal_association:
    label: shared with
    from: {attr: resource_share_arn, output: arn, types: [aws_ram_resource_share]}
    to: {attr: principal, output: arn, types: [aws_organizations_organizational_unit, aws_organizations_account, aws_organizations_organization]}
    style: {direction: none, dash: dotted}
