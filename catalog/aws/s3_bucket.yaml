id: aws.s3_bucket
label: S3 Bucket
category: storage
icon: aws/resources/amazon_simple_storage_service_bucket.svg
kind: leaf
allowed_parents: [aws.region]
size: {w: 120, h: 90}
props:
  type: object
  properties:
    versioning:
      type: boolean
      group: Data protection
      title: Versioning
      default: false
    block_public_access:
      type: boolean
      group: Data protection
      title: Block public access
      default: true
terraform:
  module: aws/s3_bucket
  import: {resource: aws_s3_bucket, name: bucket}
outputs: [bucket_name, bucket_arn, cdn_origin]
