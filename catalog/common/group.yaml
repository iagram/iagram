id: common.group
label: Group
description: A labelled box with no Terraform meaning (tier, stage, tenant, cell, "data ingestion"). Elements inside behave as if they were placed in the group's parent.
category: annotation
icon: common/folder.svg
kind: container
transparent: true
allowed_parents: ["*"]
size: {w: 420, h: 280}
style: {border: "#7D8998", dash: dashed, label: center}
style_variants:
  solid: {dash: solid}
props:
  type: object
  properties:
    solid:
      type: boolean
      title: Solid border
      default: false
    color:
      type: string
      title: Border colour
      description: CSS colour; empty keeps the grey of the official groups.
