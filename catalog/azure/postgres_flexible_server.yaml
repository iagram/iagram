id: azure.postgres_flexible_server
label: PostgreSQL Flexible Server
description: Public endpoint locked down by firewall rules; VMs connected with an arrow are allowed by their public IP.
category: database
icon: azure/postgresql.svg
kind: leaf
allowed_parents: [azure.resource_group]
size: {w: 120, h: 90}
props:
  type: object
  required: [pg_version, sku_name]
  properties:
    pg_version:
      type: string
      group: Engine
      title: PostgreSQL version
      default: "16"
      enum: ["16", "15", "14"]
    sku_name:
      type: string
      group: Engine
      title: SKU
      default: B_Standard_B1ms
      enum: [B_Standard_B1ms, B_Standard_B2s, GP_Standard_D2s_v3, GP_Standard_D4s_v3, MO_Standard_E2s_v3]
    storage_mb:
      type: integer
      group: Storage
      title: Storage (MB)
      default: 32768
      minimum: 32768
      maximum: 16777216
    admin_username:
      type: string
      group: Access
      title: Admin username
      default: pgadmin
terraform:
  module: azure/postgres_flexible_server
  inputs_from_parent:
    resource_group_name: parent.resource_group_name
    location: parent.location
  import: {resource: azurerm_postgresql_flexible_server, name: name, props: {pg_version: version, sku_name: sku_name, storage_mb: storage_mb, admin_username: administrator_login}}
outputs: [fqdn, server_id]
