id: azure.aks_cluster
label: AKS Cluster
description: Managed Kubernetes with a system node pool on the enclosing subnet and a system-assigned identity.
category: compute
icon: azure/aks.svg
kind: leaf
allowed_parents: [azure.subnet]
size: {w: 120, h: 90}
connections:
  out:
    - {to: azure.container_registry, kind: pulls_from, label: pulls from, terraform: {set: from, input: container_registry_ids, value: to.registry_id}}
props:
  type: object
  required: [node_size]
  properties:
    node_size:
      type: string
      title: Node size
      default: Standard_D2s_v5
      enum: [Standard_B2s, Standard_D2s_v5, Standard_D4s_v5, Standard_D8s_v5]
    node_count:
      type: integer
      title: Node count
      default: 2
      minimum: 1
      maximum: 100
    sku_tier:
      type: string
      title: SKU tier
      default: Free
      enum: [Free, Standard]
    kubernetes_version:
      type: string
      title: Kubernetes version
      description: Empty means the default for the region.
terraform:
  module: azure/aks_cluster
  inputs_from_parent:
    subnet_id: parent.subnet_id
    resource_group_name: parent.resource_group_name
    location: parent.location
  import: {resource: azurerm_kubernetes_cluster, parent: default_node_pool.0.vnet_subnet_id, name: name, props: {node_size: default_node_pool.0.vm_size, node_count: default_node_pool.0.node_count, sku_tier: sku_tier}}
outputs: [cluster_name, cluster_id, kubelet_identity_object_id]
