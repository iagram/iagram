# Link resources drawn as lines (see catalog/aws/_links.yaml).
links:
  azurerm_virtual_network_peering:
    label: VNet peering
    from: {attr: virtual_network_name, output: name}
    to: remote_virtual_network_id
    style: {direction: none}
    defaults: {resource_group_name: changeme}
  azurerm_virtual_hub_connection:
    label: hub connection
    from: virtual_hub_id
    to: remote_virtual_network_id
    style: {direction: none, color: "#7AA116"}
  azurerm_private_dns_zone_virtual_network_link:
    label: VNet link
    from: {attr: private_dns_zone_name, output: name}
    to: virtual_network_id
    style: {direction: none, dash: dashed}
    defaults: {resource_group_name: changeme}
