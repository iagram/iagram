id: azure.resource_group
label: Resource Group
category: account
icon: azure/resource_group.svg
kind: container
allowed_parents: [azure.subscription]
size: {w: 1000, h: 650}
props:
  type: object
  required: [location]
  properties:
    location:
      type: string
      title: Location
      default: westeurope
      enum: [westeurope, northeurope, francecentral, germanywestcentral, uksouth, swedencentral, eastus, eastus2, westus2, westus3, centralus, canadacentral, brazilsouth, southeastasia, japaneast, australiaeast]
terraform:
  module: azure/resource_group
  import: {resource: azurerm_resource_group, name: name, props: {location: location}}
outputs: [resource_group_name, location]
