id: azure.zone
label: Availability Zone
description: A zone column inside a resource group, VNet or subnet. Zonal resources drawn inside it take their zone from it.
category: network
icon: azure/zone.svg
kind: container
transparent: true
allowed_parents: [azure.resource_group, azure.vnet, azure.subnet]
size: {w: 320, h: 420}
caption_prop: zone
style: {border: "#0078D4", dash: dashed, label: center}
provides:
  zone: "${zone}"
props:
  type: object
  required: [zone]
  properties:
    zone:
      type: string
      title: Zone
      default: "1"
      enum: ["1", "2", "3"]
