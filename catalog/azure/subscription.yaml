id: azure.subscription
label: Azure Subscription
description: The subscription everything below is deployed into. Credentials come from az login or the usual ARM_* environment, never from iagram.
category: account
icon: azure/subscription.svg
kind: container
style: {border: "#5f6368", dash: solid, label: left}
allowed_parents: [root]
size: {w: 1200, h: 800}
terraform:
  role: account
  import: {from: arm.subscription, prop: subscription_id}
  provider_args:
    features: {}
    subscription_id: ${subscription_id}
    tenant_id: ${tenant_id}
props:
  type: object
  required: [subscription_id]
  properties:
    subscription_id:
      type: string
      title: Subscription ID
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    tenant_id:
      type: string
      title: Tenant ID (optional)
