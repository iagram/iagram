name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  IAGRAM_TELEMETRY: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: frontend
        run: cd web && npm ci && npm run build
      - name: go
        run: |
          go vet ./...
          go test ./...
          go build -o iagram ./cmd/iagram
      - name: cache opentofu + providers
        uses: actions/cache@v4
        with:
          path: |
            ~/.iagram/bin
            ~/.iagram/plugin-cache
          key: iagram-tofu-${{ hashFiles('internal/tofu/install.go', 'catalog/*/_provider.yaml') }}
      - name: runner e2e (real OpenTofu, no cloud)
        run: IAGRAM_E2E=1 go test ./internal/tofu/ -run TestRunnerPlanRoundTrip -v
      - name: generated terraform validates (aws, gcp, azure)
        run: |
          TOFU=$(ls ~/.iagram/bin/tofu-*)
          for ex in aws-three-tier gcp-web azure-web; do
            echo "== $ex"
            ( cd "examples/$ex" && "$GITHUB_WORKSPACE/iagram" validate && "$GITHUB_WORKSPACE/iagram" generate \
              && cd .iagram/tf && "$TOFU" init -backend=false -input=false -no-color >/dev/null && "$TOFU" validate -no-color )
          done
      - name: import from state
        run: |
          "$GITHUB_WORKSPACE/iagram" import --state examples/import/terraform.tfstate -o /tmp/imported.json --name imported
          "$GITHUB_WORKSPACE/iagram" validate -f /tmp/imported.json
      - name: example catalog check
        run: |
          mkdir -p /tmp/extcat/aws
          cp catalog/aws/_provider.yaml /tmp/extcat/aws/
          cat > /tmp/extcat/aws/sqs_queue.yaml <<'YAML'
          id: aws.sqs_queue
          label: SQS Queue
          category: integration
          kind: leaf
          allowed_parents: [aws.region]
          props: {type: object, properties: {fifo: {type: boolean, default: false}}}
          terraform: {module: aws/sqs_queue}
          YAML
          "$GITHUB_WORKSPACE/iagram" catalog check /tmp/extcat
