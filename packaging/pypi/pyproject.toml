[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iagram"
version = "0.0.0"
description = "Infrastructure as diagram: draw your cloud architecture, OpenTofu builds it. Local-only; this package installs the iagram binary."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{ name = "iagram maintainers" }]
keywords = ["terraform", "opentofu", "infrastructure-as-code", "diagram", "aws", "gcp", "azure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/iagram/iagram"
Documentation = "https://github.com/iagram/iagram#readme"
Source = "https://github.com/iagram/iagram"
Issues = "https://github.com/iagram/iagram/issues"

[project.scripts]
iagram = "iagram.__main__:main"

[tool.hatch.build]
# The repo .gitignore has "/iagram" (the Go binary); do not let it hide the package.
ignore-vcs = true

[tool.hatch.build.targets.sdist]
only-include = ["iagram", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
only-include = ["iagram"]
