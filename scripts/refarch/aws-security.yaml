# AWS reference architectures: security, identity and governance
# Format: see FORMAT.md. 22 distinct official architectures.

- slug: control-tower-landing-zone
  title: Control Tower multi-account landing zone
  category: security
  tags: [control tower, organizations, landing zone, scp, log archive, audit account]
  source: https://docs.aws.amazon.com/controltower/latest/userguide/how-control-tower-works.html
  description: Control Tower creates a Security OU holding a Log Archive account and an Audit account, plus a Sandbox OU for workload accounts, under the organization root managed from the management account. Preventive controls are enforced as service control policies on OUs, detective controls run as Config rules aggregated in the Audit account, and the organization trail lands in the Log Archive bucket.
  containers:
    - region: us-east-1
      account: management
      groups: [{label: Security OU}, {label: Sandbox OU}]
    - region: us-east-1
      account: log-archive
    - region: us-east-1
      account: audit
  elements:
    - {tf: aws_organizations_organizational_unit, name: security-ou, in: group:Security OU}
    - {tf: aws_organizations_organizational_unit, name: sandbox-ou, in: group:Sandbox OU}
    - {tf: aws_organizations_policy, name: mandatory-guardrails-scp, in: account:management}
    - {tf: aws_cloudtrail, name: org-trail, in: account:management}
    - {tf: aws_ssoadmin_permission_set, name: admin-permission-set, in: account:management}
    - {tf: aws_s3_bucket, name: cloudtrail-logs, in: account:log-archive}
    - {tf: aws_s3_bucket, name: config-snapshots, in: account:log-archive}
    - {tf: aws_config_configuration_aggregator, name: org-config-aggregator, in: account:audit}
    - {tf: aws_sns_topic, name: security-notifications, in: account:audit}
  actors: [users]
  flows:
    - {from: mandatory-guardrails-scp, to: security-ou, link: aws_organizations_policy_attachment}
    - {from: mandatory-guardrails-scp, to: sandbox-ou, link: aws_organizations_policy_attachment}
    - {from: users, to: admin-permission-set, label: SSO sign-in, step: 1}
    - {from: org-trail, to: cloudtrail-logs, label: log delivery, step: 2}
    - {from: sandbox-ou, to: org-config-aggregator, label: Config data, step: 3}
    - {from: sandbox-ou, to: config-snapshots, label: Config snapshots, step: 4}
    - {from: org-config-aggregator, to: security-notifications, label: drift alerts, step: 5}

- slug: sra-log-archive-centralized-logging
  title: SRA Log Archive account centralized logging
  category: security
  tags: [security reference architecture, log archive, cloudtrail, config, object lock, kms]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/log-archive.html
  description: The Log Archive account holds a central logs S3 bucket that receives the CloudTrail organization trail, S3 access logs, Route 53 Resolver DNS query logs and VPC flow logs, alongside an Amazon Security Lake data lake, with access limited to tightly scoped IAM permissions and roles. Security Hub CSPM, Security Hub, GuardDuty, Macie, AWS Config, IAM Access Analyzer and the organization trail are the log sources, run from the Security Tooling account so that ownership of the archive stays separate from the services that write to it.
  containers:
    - region: us-east-1
      account: log-archive
      at: [1, 1]
    - region: us-east-1
      account: security-tooling
      at: [1, 1]
  elements:
    - {tf: aws_iam_policy, name: log-archive-permissions, in: region, at: [1, 1]}
    - {tf: aws_iam_role, name: log-archive-roles, in: region, at: [1, 2]}
    - {tf: aws_s3_bucket, name: central-logs, in: region, at: [1, 3]}
    - {tf: aws_securitylake_data_lake, name: security-lake, in: region, at: [1, 4]}
    - {tf: aws_route53_resolver_query_log_config, name: dns-query-logs, in: region, at: [2, 3]}
    - {tf: aws_flow_log, name: vpc-flow-logs, in: region, at: [2, 4]}
    - {tf: aws_securityhub_account, name: security-hub-cspm, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_securityhub_organization_admin_account, name: security-hub, in: region:us-east-1, at: [1, 2]}
    - {tf: aws_guardduty_detector, name: guardduty-admin, in: region:us-east-1, at: [1, 3]}
    - {tf: aws_macie2_account, name: macie-admin, in: region:us-east-1, at: [1, 4]}
    - {tf: aws_config_configuration_aggregator, name: config-aggregator, in: region:us-east-1, at: [1, 5]}
    - {tf: aws_accessanalyzer_analyzer, name: access-analyzer, in: region:us-east-1, at: [1, 6]}
    - {tf: aws_cloudtrail, name: org-trail, in: region:us-east-1, at: [1, 7]}
  flows:
    - {from: org-trail, to: central-logs, label: from CloudTrail organization trail, step: 1}
    - {from: dns-query-logs, to: central-logs, label: DNS logs, step: 2}
    - {from: vpc-flow-logs, to: central-logs, label: flow logs, step: 3}
    - {from: log-archive-roles, to: central-logs, label: least-privilege access}
    - {from: log-archive-permissions, to: log-archive-roles, label: permissions}
    - {from: config-aggregator, to: central-logs, label: Config delivery}
    - {from: guardduty-admin, to: central-logs, label: findings export}
- slug: sra-security-tooling-delegated-admin
  title: SRA Security Tooling account with delegated administrators
  category: security
  tags: [security hub, guardduty, delegated administrator, detective, inspector, macie, security reference architecture]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/security-tooling.html
  description: A dedicated Security Tooling account in the Security OU is the delegated administrator for Security Hub CSPM, Security Hub, GuardDuty, Detective, Inspector, Macie, Config, Firewall Manager, Audit Manager, IAM Access Analyzer and Security Lake across the organization, and also hosts the CloudTrail organization trail with its CloudWatch log group, a Private CA, an EventBridge bus that triggers Lambda response functions, KMS keys and the least-privilege permissions and roles that operate the tooling. Findings from every member account aggregate there while long-term exports go to S3 buckets in the Log Archive account.
  containers:
    - region: us-east-1
      account: management
    - region: us-east-1
      account: security-tooling
      at: [3, 5]
    - region: us-east-1
      account: log-archive
    - region: us-east-1
      account: workload
  elements:
    - {tf: aws_organizations_organizational_unit, name: security-ou, in: account:management, at: [1, 1]}
    - {tf: aws_iam_role, name: delegated-admin-roles, in: account:security-tooling, at: [1, 1]}
    - {tf: aws_cloudwatch_log_group, name: cloudwatch-logs, in: account:security-tooling, at: [1, 2]}
    - {tf: aws_cloudtrail, name: org-trail, in: account:security-tooling, at: [1, 3]}
    - {tf: aws_acmpca_certificate_authority, name: private-ca, in: account:security-tooling, at: [1, 4]}
    - {tf: aws_inspector2_enabler, name: inspector-admin, in: account:security-tooling, at: [1, 5]}
    - {tf: aws_auditmanager_framework, name: audit-manager, in: account:security-tooling, at: [2, 2]}
    - {tf: aws_config_configuration_aggregator, name: config-aggregator, in: account:security-tooling, at: [2, 3]}
    - {tf: aws_cloudwatch_event_bus, name: security-events-bus, in: account:security-tooling, at: [2, 4]}
    - {tf: aws_securitylake_data_lake, name: security-lake, in: account:security-tooling, at: [2, 5]}
    - {tf: aws_guardduty_detector, name: guardduty-admin, in: account:security-tooling, at: [3, 1]}
    - {tf: aws_securityhub_standards_subscription, name: security-hub-cspm, in: account:security-tooling, at: [3, 2]}
    - {tf: aws_securityhub_account, name: security-hub-admin, in: account:security-tooling, at: [3, 3]}
    - {tf: aws_fms_admin_account, name: firewall-manager, in: account:security-tooling, at: [3, 4]}
    - {tf: aws_lambda_function, name: response-lambda, in: account:security-tooling, at: [1, 1]}
    - {tf: aws_accessanalyzer_analyzer, name: org-access-analyzer, in: account:security-tooling, at: [4, 2]}
    - {tf: aws_macie2_account, name: macie-admin, in: account:security-tooling, at: [4, 3]}
    - {tf: aws_detective_graph, name: detective-graph, in: account:security-tooling, at: [4, 4]}
    - {tf: aws_kms_key, name: findings-kms-key, in: account:security-tooling, at: [4, 5]}
    - {tf: aws_s3_bucket, name: findings-archive, in: account:log-archive, at: [1, 1]}
    - {tf: aws_guardduty_detector, name: guardduty-member, in: account:workload, at: [1, 1]}
    - {tf: aws_securityhub_account, name: security-hub-member, in: account:workload, at: [2, 1]}
  actors: [users]
  flows:
    - {from: guardduty-member, to: guardduty-admin, label: member findings, step: 1}
    - {from: security-hub-member, to: security-hub-admin, label: aggregated findings, step: 2}
    - {from: guardduty-admin, to: security-hub-admin, label: GuardDuty findings, step: 3}
    - {from: inspector-admin, to: security-hub-admin, label: vulnerabilities, step: 4}
    - {from: macie-admin, to: security-hub-admin, label: sensitive data findings, step: 5}
    - {from: guardduty-admin, to: detective-graph, label: behavior graph, step: 6}
    - {from: guardduty-admin, to: findings-archive, label: export beyond 90 days, step: 7}
    - {from: security-hub-cspm, to: security-hub-admin, label: CSPM control findings, step: 8}
    - {from: security-hub-admin, to: security-events-bus, label: findings events, step: 9}
    - {from: security-events-bus, to: response-lambda, label: automated response, step: 10}
    - {from: security-hub-admin, to: security-lake, label: findings source}
    - {from: org-trail, to: cloudwatch-logs, label: trail events}
    - {from: users, to: security-hub-admin, label: security operators}

- slug: security-hub-central-configuration
  title: Security Hub central configuration across OUs and Regions
  category: security
  tags: [security hub, central configuration, home region, configuration policy, organizational unit]
  source: https://docs.aws.amazon.com/securityhub/latest/userguide/central-configuration-intro.html
  description: The delegated Security Hub administrator defines configuration policies in a home Region that enable Security Hub, standards and controls on accounts and OUs across linked Regions, preventing configuration drift. Linked Regions send findings to the home Region, which acts as the cross-Region aggregation point for the organization.
  containers:
    - region: us-east-1
      account: security-tooling
      groups: [{label: home region}]
    - region: eu-west-1
      account: security-tooling
      groups: [{label: linked region}]
    - region: us-east-1
      account: management
      groups: [{label: Workloads OU}]
    - region: us-east-1
      account: prod-workload
  elements:
    - {tf: aws_securityhub_organization_admin_account, name: delegated-admin, in: group:home region}
    - {tf: aws_securityhub_configuration_policy, name: fsbp-policy, in: group:home region}
    - {tf: aws_securityhub_finding_aggregator, name: cross-region-aggregator, in: group:home region}
    - {tf: aws_securityhub_account, name: linked-region-hub, in: group:linked region}
    - {tf: aws_organizations_organizational_unit, name: workloads-ou, in: group:Workloads OU}
    - {tf: aws_securityhub_account, name: prod-hub, in: account:prod-workload}
    - {tf: aws_securityhub_standards_subscription, name: fsbp-standard, in: account:prod-workload}
  actors: [users]
  flows:
    - {from: users, to: fsbp-policy, label: define policy, step: 1}
    - {from: fsbp-policy, to: workloads-ou, link: aws_securityhub_configuration_policy_association}
    - {from: workloads-ou, to: prod-hub, label: inherits configuration, step: 2}
    - {from: prod-hub, to: fsbp-standard, label: enables standard, step: 3}
    - {from: linked-region-hub, to: cross-region-aggregator, label: findings replication, step: 4}
    - {from: prod-hub, to: delegated-admin, label: member findings, step: 5}

- slug: automated-security-response
  title: Automated Security Response on AWS
  category: security
  tags: [security hub, remediation, step functions, ssm automation, playbooks, cis]
  source: https://docs.aws.amazon.com/solutions/latest/automated-security-response-on-aws/solution-overview.html
  description: Security Hub custom actions or automatic rules send findings through EventBridge to a Step Functions orchestrator in the security administrator account, which assumes a cross-account role and runs Systems Manager Automation runbooks that remediate the resource in the member account. Every action is logged to CloudWatch Logs and notified via SNS, with playbooks mapped to CIS, FSBP, PCI DSS and NIST 800-53 controls.
  containers:
    - region: us-east-1
      account: security-admin
    - region: us-east-1
      account: member
  elements:
    - {tf: aws_securityhub_account, name: security-hub, in: account:security-admin}
    - {tf: aws_cloudwatch_event_rule, name: finding-custom-action-rule, in: account:security-admin}
    - {tf: aws_sfn_state_machine, name: orchestrator, in: account:security-admin}
    - {tf: aws_lambda_function, name: check-finding-lambda, in: account:security-admin}
    - {tf: aws_sns_topic, name: remediation-notifications, in: account:security-admin}
    - {tf: aws_cloudwatch_log_group, name: remediation-audit-log, in: account:security-admin}
    - {tf: aws_kms_key, name: solution-cmk, in: account:security-admin}
    - {tf: aws_iam_role, name: remediation-role, in: account:member}
    - {tf: aws_ssm_document, name: remediation-runbook, in: account:member}
    - {tf: aws_s3_bucket, name: noncompliant-bucket, in: account:member}
  actors: [users]
  flows:
    - {from: users, to: security-hub, label: custom action, step: 1}
    - {from: security-hub, to: finding-custom-action-rule, label: finding event, step: 2}
    - {from: finding-custom-action-rule, to: orchestrator, link: aws_cloudwatch_event_target}
    - {from: orchestrator, to: check-finding-lambda, label: validate finding, step: 3}
    - {from: orchestrator, to: remediation-role, label: AssumeRole, step: 4}
    - {from: remediation-role, to: remediation-runbook, label: StartAutomationExecution, step: 5}
    - {from: remediation-runbook, to: noncompliant-bucket, label: remediate, step: 6}
    - {from: orchestrator, to: remediation-notifications, label: notify, step: 7}
    - {from: orchestrator, to: remediation-audit-log, label: log actions}

- slug: macie-multi-account-remediation
  title: Macie sensitive data remediation across accounts
  category: security
  tags: [macie, sensitive data, quarantine, step functions, eventbridge, delegated administrator]
  source: https://aws.amazon.com/blogs/security/building-sensitive-data-remediation-workflows-in-multi-account-aws-environments/
  description: An Organizations tag policy from the management account and an AWS Config rule in the development/production account enforce bucket tagging, with compliance events forwarded over EventBridge to the security account, where a Lambda function posts notifications to a Microsoft Teams DLP channel. Macie in the delegated administrator account publishes findings for the scanned bucket to EventBridge and a results bucket; a Step Functions workflow records the object in a DynamoDB quarantine tracker, moves it to quarantine and notifies the channel through Lambda, and the DLP admin releases objects through an API Gateway endpoint that starts a release workflow.
  containers:
    - region: us-east-1
      account: management
      at: [1, 2]
    - region: us-east-1
      account: member
      at: [1, 2]
    - region: us-east-1
      account: security
      at: [1, 1]
  elements:
    - {tf: aws_organizations_policy, name: tag-policy, in: account:management, at: [1, 1]}
    - {tf: aws_macie2_account, name: macie-member, in: account:member, at: [1, 1]}
    - {tf: aws_s3_bucket, name: scanned-bucket, in: account:member, at: [1, 1]}
    - {tf: aws_config_config_rule, name: tag-compliance-rule, in: account:member, at: [1, 3]}
    - {tf: aws_cloudwatch_event_bus, name: member-event-bus, in: account:member, at: [1, 4]}
    - {tf: aws_macie2_account, name: macie-admin, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_cloudwatch_event_bus, name: security-event-bus, in: region:us-east-1, at: [1, 2]}
    - {tf: aws_lambda_function, name: tag-compliance-notifier, in: region:us-east-1, at: [1, 4]}
    - {tf: aws_s3_bucket, name: results-bucket, in: region:us-east-1, at: [2, 1]}
    - {tf: aws_dynamodb_table, name: quarantine-tracker, in: region:us-east-1, at: [2, 2]}
    - {tf: aws_sfn_state_machine, name: process-findings-workflow, in: region:us-east-1, at: [2, 3]}
    - {tf: aws_lambda_function, name: macie-finding-notifier, in: region:us-east-1, at: [2, 4]}
    - {tf: aws_lambda_function, name: quarantine-notifier, in: region:us-east-1, at: [3, 4]}
    - {tf: aws_sfn_state_machine, name: release-workflow, in: region:us-east-1, at: [4, 2]}
    - {tf: aws_api_gateway_rest_api, name: release-api, in: region:us-east-1, at: [4, 4]}
  actors: [{type: saas, name: Microsoft Teams, at: [3, 2]}, {type: user, name: DLP admin, at: [3, 3]}]
  flows:
    - {from: tag-policy, to: scanned-bucket, label: enforce tag policy, step: 1}
    - {from: tag-compliance-rule, to: scanned-bucket, label: evaluate tag compliance, step: 2}
    - {from: tag-compliance-rule, to: member-event-bus, label: send Config events, step: 3}
    - {from: member-event-bus, to: security-event-bus, label: send Config events, step: 4}
    - {from: security-event-bus, to: tag-compliance-notifier, label: notify of compliance change, step: 5}
    - {from: tag-compliance-notifier, to: Microsoft Teams, label: notify admins, step: 6}
    - {from: macie-member, to: scanned-bucket, label: scan bucket, step: 7}
    - {from: macie-admin, to: security-event-bus, label: publish findings, step: 8}
    - {from: macie-admin, to: results-bucket, label: discovery results}
    - {from: security-event-bus, to: process-findings-workflow, label: process findings, step: 9}
    - {from: process-findings-workflow, to: macie-finding-notifier, label: notify of Macie finding, step: 10}
    - {from: macie-finding-notifier, to: Microsoft Teams, label: notify admins, step: 11}
    - {from: process-findings-workflow, to: quarantine-tracker, label: add object to tracking DB, step: 12}
    - {from: process-findings-workflow, to: scanned-bucket, label: move object to quarantine, step: 13}
    - {from: process-findings-workflow, to: quarantine-notifier, label: notify of quarantine, step: 14}
    - {from: quarantine-notifier, to: Microsoft Teams, label: notify admins, step: 15}
    - {from: Microsoft Teams, to: DLP admin, label: DLP channel notification}
    - {from: DLP admin, to: release-api, label: release object, step: 16}
    - {from: release-api, to: release-workflow, label: release object from quarantine, step: 17}
    - {from: release-workflow, to: quarantine-tracker, label: update quarantine tracking DB, step: 18}
    - {from: release-workflow, to: scanned-bucket, label: release object from quarantine, step: 19}
- slug: kms-multi-region-keys-global-tables
  title: KMS multi-Region keys for client-side encryption of global data
  category: security
  tags: [kms, multi-region keys, encryption at rest, dynamodb global tables, client-side encryption]
  source: https://aws.amazon.com/blogs/security/encrypt-global-data-client-side-with-aws-kms-multi-region-keys/
  description: A KMS multi-Region primary key in us-east-1 is replicated to eu-west-1 so the replica key shares the same key ID and key material, and both ARNs differ only by Region. Data encrypted client-side with the primary key and replicated by DynamoDB global tables can be decrypted locally with the replica key, avoiding cross-Region KMS calls.
  containers:
    - region: us-east-1
      account: app
      at: [1, 1]
    - region: eu-west-1
      account: app
      at: [1, 2]
  elements:
    - {tf: aws_kms_key, name: primary-mrk, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: orders-global-table, in: region:us-east-1, at: [2, 1]}
    - {tf: aws_kms_replica_key, name: replica-mrk, in: region:eu-west-1, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: orders-replica-table, in: region:eu-west-1, at: [2, 1]}
  flows:
    - {from: primary-mrk, to: replica-mrk, label: replicate key material (same key ID), step: 1}
    - {from: orders-global-table, to: orders-replica-table, label: global table replication of ciphertext, step: 2}
- slug: secrets-manager-lambda-rotation
  title: Secrets Manager automatic rotation with a Lambda function
  category: security
  tags: [secrets manager, rotation, lambda, rds, kms, vpc endpoint]
  source: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
  description: Secrets Manager stores database credentials encrypted with a KMS key and invokes a rotation Lambda function on a schedule; the function runs inside the database VPC, sets a new password in the database and updates the secret version. The application retrieves the current credentials at runtime through a Secrets Manager VPC endpoint instead of embedding them.
  containers:
    - region: us-east-1
      vpcs:
        - name: app
          cidr: 10.0.0.0/16
          subnets:
            - {name: app-a, cidr: 10.0.1.0/24, az: a}
            - {name: db-a, cidr: 10.0.2.0/24, az: a}
  elements:
    - {tf: aws_secretsmanager_secret, name: db-credentials, in: region}
    - {tf: aws_secretsmanager_secret_rotation, name: thirty-day-rotation, in: region}
    - {tf: aws_kms_key, name: secrets-cmk, in: region}
    - {tf: aws_lambda_function, name: rotation-function, in: subnet:app-a}
    - {tf: aws_lambda_function, name: app-function, in: subnet:app-a}
    - {tf: aws_db_instance, name: orders-db, in: subnet:db-a}
    - {tf: aws_vpc_endpoint, name: secretsmanager-endpoint, in: subnet:app-a}
    - {tf: aws_iam_role, name: rotation-role, in: region}
  actors: [users]
  flows:
    - {from: thirty-day-rotation, to: rotation-function, label: scheduled rotation, step: 1}
    - {from: rotation-function, to: orders-db, label: set new password, step: 2}
    - {from: rotation-function, to: secretsmanager-endpoint, label: PutSecretValue, step: 3}
    - {from: secretsmanager-endpoint, to: db-credentials, label: new version, step: 4}
    - {from: secrets-cmk, to: db-credentials, label: encrypts}
    - {from: users, to: app-function, label: request, step: 5}
    - {from: app-function, to: secretsmanager-endpoint, label: GetSecretValue, step: 6}
    - {from: app-function, to: orders-db, label: SQL over TLS, step: 7}

- slug: identity-center-external-idp-federation
  title: IAM Identity Center federation with an external identity provider
  category: identity
  tags: [iam identity center, saml, scim, permission sets, workforce identity, organizations]
  source: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html
  description: IAM Identity Center in the management account trusts an external SAML 2.0 identity provider and receives users and groups through SCIM provisioning. Permission sets are assigned to groups per account, so users sign in once at the AWS access portal and assume short-lived roles in the production and development accounts.
  containers:
    - region: us-east-1
      account: management
    - region: us-east-1
      account: production
    - region: us-east-1
      account: development
  elements:
    - {tf: aws_ssoadmin_instance_access_control_attributes, name: identity-center-instance, in: account:management}
    - {tf: aws_identitystore_group, name: platform-admins, in: account:management}
    - {tf: aws_identitystore_group, name: developers, in: account:management}
    - {tf: aws_ssoadmin_permission_set, name: admin-access, in: account:management}
    - {tf: aws_ssoadmin_permission_set, name: developer-access, in: account:management}
    - {tf: aws_iam_role, name: prod-admin-role, in: account:production}
    - {tf: aws_iam_role, name: dev-developer-role, in: account:development}
    - {tf: aws_cloudtrail, name: sign-in-audit-trail, in: account:management}
  actors: [users, idp]
  flows:
    - {from: idp, to: identity-center-instance, label: SCIM provisioning, step: 1}
    - {from: users, to: idp, label: corporate login, step: 2}
