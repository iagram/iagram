- slug: network-firewall-centralized-inspection
  title: Centralized Network Firewall inspection VPC with Transit Gateway
  category: security
  tags: [network firewall, inspection vpc, transit gateway, east-west, egress filtering]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/deployment-models-for-aws-network-firewall/
  description: Spoke VPCs attach to a Transit Gateway whose route tables send all inter-VPC and egress traffic through a dedicated inspection VPC, where Network Firewall endpoints sit in their own subnets separate from the Transit Gateway attachment subnets. A central egress path through a NAT gateway and internet gateway lets the firewall enforce stateful domain and Suricata rules on all outbound flows.
  containers:
    - region: us-east-1
      vpcs:
        - name: inspection
          cidr: 10.100.0.0/16
          subnets:
            - {name: tgw-attach-a, cidr: 10.100.0.0/28, az: a}
            - {name: firewall-a, cidr: 10.100.1.0/28, az: a}
            - {name: public-a, cidr: 10.100.2.0/24, az: a, public: true}
        - name: spoke-a
          cidr: 10.1.0.0/16
          subnets:
            - {name: spoke-a-private, cidr: 10.1.1.0/24, az: a}
        - name: spoke-b
          cidr: 10.2.0.0/16
          subnets:
            - {name: spoke-b-private, cidr: 10.2.1.0/24, az: a}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_networkfirewall_firewall, name: central-firewall, in: subnet:firewall-a}
    - {tf: aws_networkfirewall_firewall_policy, name: inspection-policy, in: vpc:inspection}
    - {tf: aws_networkfirewall_rule_group, name: egress-domain-rules, in: vpc:inspection}
    - {tf: aws_nat_gateway, name: central-nat, in: subnet:public-a}
    - {tf: aws_internet_gateway, name: inspection-igw, in: vpc:inspection}
    - {tf: aws_networkfirewall_logging_configuration, name: firewall-logs, in: vpc:inspection}
    - {tf: aws_s3_bucket, name: firewall-log-bucket, in: region}
    - {tf: aws_instance, name: spoke-a-app, in: subnet:spoke-a-private}
    - {tf: aws_instance, name: spoke-b-app, in: subnet:spoke-b-private}
  actors: [internet]
  flows:
    - {from: hub-tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:inspection, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: spoke-a-app, to: hub-tgw, label: east-west traffic, step: 1}
    - {from: hub-tgw, to: central-firewall, label: route to inspection, step: 2}
    - {from: central-firewall, to: spoke-b-app, label: inspected traffic, step: 3}
    - {from: central-firewall, to: central-nat, label: egress after inspection, step: 4}
    - {from: central-nat, to: inspection-igw, label: NAT, step: 5}
    - {from: inspection-igw, to: internet, label: outbound, step: 6}
    - {from: firewall-logs, to: firewall-log-bucket, label: flow and alert logs}

- slug: verified-access-multi-account-zero-trust
