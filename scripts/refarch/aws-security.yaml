- slug: backup-vault-lock-cross-account
  title: Immutable cross-account backups with Backup Vault Lock
  category: security
  tags: [aws backup, vault lock, immutable, cross-account copy, organizations backup policy, ransomware]
  source: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
  description: An Organizations backup policy applied to workload OUs creates backup plans in every member account, and each plan copies recovery points to a locked vault in a dedicated backup account encrypted with its own KMS key. Vault Lock in compliance mode and cross-account monitoring from the delegated backup administrator guarantee retention that cannot be shortened even by account administrators.
  containers:
    - region: us-east-1
      account: management
      groups: [{label: Workloads OU}]
    - region: us-east-1
      account: workload
    - region: us-east-1
      account: central-backup
  elements:
    - {tf: aws_organizations_organizational_unit, name: workloads-ou, in: group:Workloads OU}
    - {tf: aws_organizations_policy, name: daily-backup-policy, in: account:management}
    - {tf: aws_backup_vault, name: local-vault, in: account:workload}
    - {tf: aws_backup_plan, name: daily-plan, in: account:workload}
    - {tf: aws_db_instance, name: orders-db, in: account:workload}
    - {tf: aws_ebs_volume, name: app-data-volume, in: account:workload}
    - {tf: aws_backup_vault, name: locked-vault, in: account:central-backup}
    - {tf: aws_backup_vault_lock_configuration, name: compliance-lock, in: account:central-backup}
    - {tf: aws_kms_key, name: backup-cmk, in: account:central-backup}
    - {tf: aws_sns_topic, name: backup-job-events, in: account:central-backup}
  actors: [users]
  flows:
    - {from: daily-backup-policy, to: workloads-ou, link: aws_organizations_policy_attachment}
    - {from: workloads-ou, to: daily-plan, label: effective backup plan, step: 1}
    - {from: daily-plan, to: orders-db, label: snapshot, step: 2}
    - {from: daily-plan, to: app-data-volume, label: snapshot, step: 2}
    - {from: daily-plan, to: local-vault, label: recovery point, step: 3}
    - {from: local-vault, to: locked-vault, label: cross-account copy, step: 4}
    - {from: compliance-lock, to: locked-vault, label: WORM retention}
    - {from: backup-cmk, to: locked-vault, label: encrypts}
    - {from: locked-vault, to: backup-job-events, label: copy job status, step: 5}
    - {from: users, to: backup-job-events, label: monitor}

- slug: config-rules-auto-remediation
  title: Config rules with automatic SSM remediation
  category: security
  tags: [aws config, conformance pack, remediation, ssm automation, compliance, sns]
  source: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
  description: Config records resource configuration and evaluates managed and custom rules; when a resource becomes non-compliant, a remediation configuration invokes a Systems Manager Automation runbook under an IAM role that fixes the resource, for example re-enabling S3 public access block or EBS encryption. Compliance changes are published to SNS and configuration history is delivered to an S3 bucket.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_config_configuration_recorder, name: recorder, in: region}
    - {tf: aws_config_delivery_channel, name: delivery-channel, in: region}
    - {tf: aws_config_conformance_pack, name: security-best-practices-pack, in: region}
    - {tf: aws_config_config_rule, name: s3-public-read-prohibited, in: region}
    - {tf: aws_config_remediation_configuration, name: block-public-access-remediation, in: region}
    - {tf: aws_ssm_document, name: disable-public-access-runbook, in: region}
    - {tf: aws_iam_role, name: remediation-role, in: region}
    - {tf: aws_s3_bucket, name: config-history, in: region}
    - {tf: aws_sns_topic, name: compliance-changes, in: region}
    - {tf: aws_s3_bucket, name: noncompliant-bucket, in: region}
  actors: [users]
  flows:
    - {from: recorder, to: noncompliant-bucket, label: record configuration, step: 1}
    - {from: recorder, to: s3-public-read-prohibited, label: evaluate, step: 2}
    - {from: security-best-practices-pack, to: s3-public-read-prohibited, label: contains rule}
    - {from: s3-public-read-prohibited, to: block-public-access-remediation, label: NON_COMPLIANT, step: 3}
    - {from: block-public-access-remediation, to: disable-public-access-runbook, label: StartAutomationExecution, step: 4}
    - {from: disable-public-access-runbook, to: remediation-role, label: assumes}
    - {from: disable-public-access-runbook, to: noncompliant-bucket, label: PutPublicAccessBlock, step: 5}
    - {from: delivery-channel, to: config-history, label: configuration snapshots}
    - {from: delivery-channel, to: compliance-changes, label: compliance notifications, step: 6}
    - {from: compliance-changes, to: users, label: alert}

- slug: network-firewall-tls-inspection
  title: TLS inspection of encrypted traffic with Network Firewall
  category: security
  tags: [network firewall, tls inspection, acm, private ca, encryption in transit, deep packet inspection]
  source: https://aws.amazon.com/blogs/security/tls-inspection-configuration-for-encrypted-traffic-and-aws-network-firewall/
  description: Ingress traffic enters through the internet gateway, whose ingress route table sends it to the Network Firewall endpoint in a dedicated firewall subnet before the firewall subnet and customer subnet route tables forward it to the EC2 instances. The firewall policy runs packets through the stateless rules engine and then the stateful rules engine; a TLS inspection configuration that references an ACM certificate issued by Private CA lets the firewall decrypt in-scope TLS sessions, inspect the plaintext and re-encrypt before forwarding.
  containers:
    - region: us-east-1
      vpcs:
        - name: ingress
          cidr: 10.110.0.0/16
          at: [1, 2, 5, 1]
          subnets:
            - {name: firewall-a, cidr: 10.110.0.0/28, az: a, at: [1, 1]}
            - {name: app-a, cidr: 10.110.2.0/24, az: a, at: [2, 1]}
  elements:
    - {tf: aws_networkfirewall_rule_group, name: stateless-rule-group, in: region, at: [1, 1]}
    - {tf: aws_networkfirewall_rule_group, name: stateful-rule-group, in: region, at: [2, 1]}
    - {tf: aws_networkfirewall_firewall_policy, name: tls-policy, in: region, at: [3, 1]}
    - {tf: aws_networkfirewall_tls_inspection_configuration, name: inbound-tls-config, in: region, at: [4, 1]}
    - {tf: aws_internet_gateway, name: ingress-igw, in: vpc:ingress, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: tls-firewall, in: subnet:firewall-a, at: [1, 1]}
    - {tf: aws_instance, name: app-server-1, in: subnet:app-a, at: [1, 1]}
    - {tf: aws_instance, name: app-server-2, in: subnet:app-a, at: [1, 2]}
    - {tf: aws_route_table, name: ingress-route-table, in: region, at: [1, 3]}
    - {tf: aws_route_table, name: firewall-subnet-route-table, in: region, at: [2, 3]}
    - {tf: aws_route_table, name: customer-subnet-route-table, in: region, at: [3, 3]}
    - {tf: aws_acmpca_certificate_authority, name: internal-ca, in: region, at: [4, 3]}
    - {tf: aws_acm_certificate, name: inspection-cert, in: region, at: [5, 3]}
  actors: [internet]
  flows:
    - {from: internet, to: ingress-igw, label: HTTPS}
    - {from: ingress-route-table, to: ingress-igw, label: edge association to firewall endpoint}
    - {from: ingress-igw, to: tls-firewall, label: ingress route, step: 1}
    - {from: tls-firewall, to: tls-policy, label: inspect, step: 2}
    - {from: stateless-rule-group, to: tls-policy, label: 2A stateless engine}
    - {from: stateful-rule-group, to: tls-policy, label: 2B stateful engine}
    - {from: inbound-tls-config, to: tls-policy, label: decrypt and re-encrypt in-scope TLS}
    - {from: internal-ca, to: inspection-cert, label: issues certificate}
    - {from: inspection-cert, to: inbound-tls-config, label: server certificate}
    - {from: firewall-subnet-route-table, to: subnet:firewall-a, label: 0.0.0.0/0 to internet gateway}
    - {from: tls-firewall, to: app-server-1, label: forward to customer subnet, step: 3}
    - {from: tls-firewall, to: app-server-2, label: forward to customer subnet}
    - {from: customer-subnet-route-table, to: subnet:app-a, label: 10.110.0.0/16 local}
- slug: audit-manager-continuous-compliance
  title: Continuous compliance evidence collection with Audit Manager
  category: security
  tags: [audit manager, compliance, evidence, config, security hub, cloudtrail, assessment report]
  source: https://docs.aws.amazon.com/audit-manager/latest/userguide/what-is.html
  description: Audit Manager in the delegated administrator account runs assessments built from prebuilt frameworks such as PCI DSS or SOC 2 against in-scope accounts, continuously collecting evidence from Config rule evaluations, Security Hub checks and CloudTrail activity. Evidence is attached to controls, assessment reports are written to an encrypted S3 destination, and EventBridge events notify control owners when review is needed.
  containers:
    - region: us-east-1
      account: security-tooling
    - region: us-east-1
      account: workload
  elements:
    - {tf: aws_auditmanager_account_registration, name: audit-manager, in: account:security-tooling}
    - {tf: aws_auditmanager_framework, name: pci-dss-framework, in: account:security-tooling}
    - {tf: aws_auditmanager_assessment, name: annual-pci-assessment, in: account:security-tooling}
    - {tf: aws_securityhub_account, name: security-hub, in: account:security-tooling}
    - {tf: aws_config_configuration_aggregator, name: config-aggregator, in: account:security-tooling}
    - {tf: aws_s3_bucket, name: assessment-reports, in: account:security-tooling}
    - {tf: aws_kms_key, name: evidence-cmk, in: account:security-tooling}
    - {tf: aws_cloudwatch_event_rule, name: assessment-events-rule, in: account:security-tooling}
    - {tf: aws_sns_topic, name: control-owner-notifications, in: account:security-tooling}
    - {tf: aws_cloudtrail, name: workload-trail, in: account:workload}
    - {tf: aws_config_config_rule, name: encrypted-volumes-rule, in: account:workload}
  actors: [users]
  flows:
    - {from: pci-dss-framework, to: annual-pci-assessment, label: framework controls, step: 1}
    - {from: encrypted-volumes-rule, to: config-aggregator, label: evaluations, step: 2}
    - {from: config-aggregator, to: annual-pci-assessment, label: compliance evidence, step: 3}
    - {from: security-hub, to: annual-pci-assessment, label: security check evidence, step: 3}
    - {from: workload-trail, to: annual-pci-assessment, label: user activity evidence, step: 3}
    - {from: annual-pci-assessment, to: assessment-reports, label: assessment report, step: 4}
    - {from: evidence-cmk, to: assessment-reports, label: encrypts}
    - {from: assessment-events-rule, to: control-owner-notifications, link: aws_cloudwatch_event_target}
    - {from: users, to: annual-pci-assessment, label: review controls, step: 5}

- slug: automated-forensic-disk-collection
  title: Automated forensic disk collection into a forensics account
  category: security
  tags: [incident response, forensics, step functions, ebs snapshots, guardduty, evidence bucket]
  source: https://aws.amazon.com/blogs/security/how-to-automate-forensic-disk-collection-in-aws/
  description: A GuardDuty finding in the monitored account is forwarded by Security Hub to the administrator in the security account, where an EventBridge rule invokes a Lambda function that starts a Step Functions workflow. The workflow assumes a member automation role, snapshots the compromised instance's attached EBS volumes as encrypted snapshots, shares them with the security account, creates volumes from the shared snapshots and attaches them to a collector instance that streams bit-for-bit disk images into an evidence S3 bucket.
  containers:
    - region: us-east-1
      account: workload
      at: [2, 2]
      vpcs:
        - name: app
          cidr: 10.120.0.0/16
          subnets:
            - {name: private-a, cidr: 10.120.1.0/24, az: a}
    - region: us-east-1
      account: forensics
      at: [1, 1]
      vpcs:
        - name: forensics
          cidr: 10.130.0.0/16
          at: [3, 3]
          subnets:
            - {name: collector-a, cidr: 10.130.1.0/24, az: a}
  elements:
    - {tf: aws_guardduty_detector, name: guardduty, in: account:workload, at: [1, 1]}
    - {tf: aws_securityhub_account, name: securityhub-member, in: account:workload, at: [1, 2]}
    - {tf: aws_ebs_volume, name: attached-ebs-volumes, in: account:workload, at: [2, 1]}
    - {tf: aws_instance, name: compromised-instance, in: subnet:private-a, at: [1, 1]}
    - {tf: aws_iam_role, name: member-automation-role, in: account:workload, at: [2, 3]}
    - {tf: aws_ebs_snapshot, name: encrypted-snapshots, in: account:workload, at: [3, 1]}
    - {tf: aws_securityhub_organization_admin_account, name: securityhub-administrator, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_cloudwatch_event_rule, name: finding-trigger-rule, in: region:us-east-1, at: [1, 2]}
    - {tf: aws_s3_bucket, name: evidence-bucket, in: region:us-east-1, at: [1, 3, 2, 1]}
    - {tf: aws_sfn_state_machine, name: disk-collection-workflow, in: region:us-east-1, at: [2, 1]}
    - {tf: aws_lambda_function, name: invoke-function, in: region:us-east-1, at: [2, 2]}
    - {tf: aws_ebs_snapshot, name: shared-snapshots, in: region:us-east-1, at: [3, 1]}
    - {tf: aws_ebs_volume, name: created-ebs-volumes, in: region:us-east-1, at: [3, 2]}
    - {tf: aws_instance, name: collector-instance, in: subnet:collector-a, at: [1, 1]}
  flows:
    - {from: guardduty, to: securityhub-member, label: finding, step: 1}
    - {from: securityhub-member, to: securityhub-administrator, label: aggregated finding, step: 2}
    - {from: securityhub-administrator, to: finding-trigger-rule, label: finding event, step: 3}
    - {from: finding-trigger-rule, to: invoke-function, link: aws_cloudwatch_event_target}
    - {from: invoke-function, to: disk-collection-workflow, label: StartExecution, step: 4}
    - {from: disk-collection-workflow, to: member-automation-role, label: AssumeRole, step: 5}
    - {from: member-automation-role, to: compromised-instance, label: DescribeInstances}
    - {from: compromised-instance, to: attached-ebs-volumes, label: list volumes}
    - {from: attached-ebs-volumes, to: encrypted-snapshots, label: CreateSnapshot, step: 6}
    - {from: encrypted-snapshots, to: shared-snapshots, label: share snapshot}
    - {from: shared-snapshots, to: created-ebs-volumes, label: CreateVolume}
    - {from: created-ebs-volumes, to: collector-instance, label: AttachVolume, step: 7}
    - {from: collector-instance, to: evidence-bucket, label: stream disk image}
