            - {name: firewall-a, cidr: 10.100.1.0/28, az: a}
            - {name: public-a, cidr: 10.100.2.0/24, az: a, public: true}
        - name: spoke-a
          cidr: 10.1.0.0/16
          subnets:
            - {name: spoke-a-private, cidr: 10.1.1.0/24, az: a}
        - name: spoke-b
          cidr: 10.2.0.0/16
          subnets:
            - {name: spoke-b-private, cidr: 10.2.1.0/24, az: a}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_networkfirewall_firewall, name: central-firewall, in: subnet:firewall-a}
    - {tf: aws_networkfirewall_firewall_policy, name: inspection-policy, in: vpc:inspection}
    - {tf: aws_networkfirewall_rule_group, name: egress-domain-rules, in: vpc:inspection}
    - {tf: aws_nat_gateway, name: central-nat, in: subnet:public-a}
    - {tf: aws_internet_gateway, name: inspection-igw, in: vpc:inspection}
    - {tf: aws_networkfirewall_logging_configuration, name: firewall-logs, in: vpc:inspection}
    - {tf: aws_s3_bucket, name: firewall-log-bucket, in: region}
    - {tf: aws_instance, name: spoke-a-app, in: subnet:spoke-a-private}
    - {tf: aws_instance, name: spoke-b-app, in: subnet:spoke-b-private}
  actors: [internet]
  flows:
    - {from: hub-tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:inspection, link: aws_ec2_transit_gateway_vpc_attachment}
