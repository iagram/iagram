- slug: cognito-api-gateway-fine-grained-authz
  title: Fine-grained API authorization with Cognito, API Gateway and IAM
  category: identity
  tags: [cognito, api gateway, lambda authorizer, jwt, fine-grained authorization, dynamodb]
  source: https://aws.amazon.com/blogs/security/building-fine-grained-authorization-using-amazon-cognito-api-gateway-and-iam/
  description: A user authenticates against a Cognito user pool and presents the token to API Gateway, which passes it to a custom authorizer Lambda function that verifies the JWT and looks up the matching IAM policy document in a DynamoDB policy store. The authorizer returns the policy and context to API Gateway, which evaluates the policy before invoking the service Lambda function with that context.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_cognito_user_pool, name: customer-user-pool, in: region, at: [1, 1]}
    - {tf: aws_lambda_function, name: authorizer-function, in: region, at: [1, 2]}
    - {tf: aws_dynamodb_table, name: group-policy-table, in: region, at: [1, 3]}
    - {tf: aws_iam_policy, name: api-invoke-policy, in: region, at: [1, 4]}
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: region, at: [2, 2]}
    - {tf: aws_lambda_function, name: orders-backend, in: region, at: [2, 3]}
  actors: [{type: user, name: user, at: [1, 1]}]
  flows:
    - {from: user, to: customer-user-pool, label: authenticate, step: 1}
    - {from: user, to: orders-api, label: token, step: 2}
    - {from: orders-api, to: authorizer-function, label: token, step: 3}
    - {from: authorizer-function, to: customer-user-pool, label: verify token, step: 4}
    - {from: authorizer-function, to: group-policy-table, label: lookup / return policy, step: 5}
    - {from: group-policy-table, to: api-invoke-policy, label: stored IAM policy document}
    - {from: authorizer-function, to: orders-api, label: policy + context, step: 6}
    - {from: orders-api, to: api-invoke-policy, label: evaluate policy, step: 7}
    - {from: orders-api, to: orders-backend, label: context, step: 8}
- slug: private-ca-cross-account-sharing
  title: Private CA hierarchy shared across accounts with RAM
  category: security
  tags: [acm pca, private ca, certificate hierarchy, ram, tls, encryption in transit]
  source: https://aws.amazon.com/blogs/security/how-to-use-aws-ram-to-share-your-acm-private-ca-cross-account/
  description: A private CA runs in ACM Private CA in a central account and is added to an AWS Resource Access Manager resource share, which is shared either with the whole organization or organizational units (4a) or with individual accounts as principals (4b). Teams in the shared accounts request private certificates through ACM from the shared CA, so certificate private keys never leave their account while CA control stays central.
  containers:
    - region: us-east-1
      account: central
      at: [1, 1]
    - region: us-east-1
      account: organizational-accounts
      at: [1, 1]
      groups: [{label: shared with organization (4a), at: [1, 1]}]
    - region: us-east-1
      account: individual-accounts
      at: [1, 1]
      groups: [{label: shared with individual accounts (4b), at: [1, 1]}]
  elements:
    - {tf: aws_acmpca_certificate_authority, name: private-ca, in: region, at: [1, 1]}
    - {tf: aws_ram_resource_share, name: private-ca-share, in: region, at: [1, 2]}
    - {tf: aws_acm_certificate, name: organizational-certificates, in: group:shared with organization (4a), at: [1, 1]}
    - {tf: aws_acm_certificate, name: individual-certificates, in: group:shared with individual accounts (4b), at: [1, 1]}
  flows:
    - {from: private-ca, to: private-ca-share, label: add Private CA to resource share, step: 1}
    - {from: private-ca-share, to: organizational-certificates, label: share with organization or OUs, step: 2}
    - {from: private-ca-share, to: individual-certificates, label: share with account principals, step: 3}
    - {from: organizational-certificates, to: private-ca, label: RequestCertificate from shared CA, step: 4}
    - {from: individual-certificates, to: private-ca, label: RequestCertificate from shared CA}
- slug: ddos-resilient-edge-waf-shield
