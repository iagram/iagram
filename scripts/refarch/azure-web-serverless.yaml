    - subscription: workload
      resource_group: {name: rg-aks-private, location: westeurope}
      vnets:
        - name: vnet-aks-spoke
          cidr: 10.0.0.0/16
          subnets:
            - {name: AksSubnet, cidr: 10.0.0.0/20}
            - {name: VmSubnet, cidr: 10.0.16.0/24}
            - {name: AppGatewaySubnet, cidr: 10.0.17.0/24}
            - {name: AzureBastionSubnet, cidr: 10.0.18.0/26}
  elements:
    - {tf: azurerm_firewall, name: fw-premium, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_kubernetes_cluster, name: aks-private, in: subnet:AksSubnet}
    - {tf: azurerm_application_gateway, name: appgw-agic, in: subnet:AppGatewaySubnet}
    - {tf: azurerm_bastion_host, name: bastion-spoke, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_linux_virtual_machine, name: vm-jumpbox, in: subnet:VmSubnet}
    - {tf: azurerm_private_endpoint, name: pe-acr, in: subnet:VmSubnet}
    - {tf: azurerm_private_endpoint, name: pe-keyvault, in: subnet:VmSubnet}
    - {tf: azurerm_container_registry, name: acr-private, in: resource_group:rg-aks-private}
    - {tf: azurerm_key_vault, name: kv-aks-private, in: resource_group:rg-aks-private}
    - {tf: azurerm_log_analytics_workspace, name: law-aks-private, in: resource_group:rg-aks-private}
  actors: [users, internet, user]
  flows:
    - {from: vnet:vnet-hub, to: vnet:vnet-aks-spoke, link: azurerm_virtual_network_peering, label: peering}
    - {from: users, to: appgw-agic, label: HTTPS (WAF v2), step: 1}
    - {from: appgw-agic, to: aks-private, label: AGIC routes to pod IPs, step: 2}
    - {from: aks-private, to: fw-premium, label: egress via UDR (userDefinedRouting), step: 3}
    - {from: fw-premium, to: internet, label: SNAT egress (AzureKubernetesService FQDN tag), step: 4}
    - {from: internet, to: fw-premium, label: DNAT inbound}
    - {from: aks-private, to: pe-acr, label: image pull}
    - {from: pe-acr, to: acr-private, label: private link}
    - {from: aks-private, to: pe-keyvault, label: workload identity secrets}
    - {from: pe-keyvault, to: kv-aks-private, label: private link}
    - {from: user, to: bastion-spoke, label: SSH over TLS}
    - {from: bastion-spoke, to: vm-jumpbox, label: SSH}
    - {from: vm-jumpbox, to: aks-private, label: kubectl to private API server}
    - {from: fw-premium, to: law-aks-private, label: diagnostics}

