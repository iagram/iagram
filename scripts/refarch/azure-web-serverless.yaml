  description: A private AKS cluster with outbound type userDefinedRouting runs in a spoke virtual network with dedicated subnets for the cluster, a jump box and private endpoints, Application Gateway WAF v2 and Azure Bastion, and all egress is routed to Azure Firewall Premium in the hub. The firewall allows outbound traffic with network and application rules using the AzureKubernetesService FQDN tag and publishes inbound workloads with DNAT rules, while Container Registry and Key Vault are reached through private endpoints.
