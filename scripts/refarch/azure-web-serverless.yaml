            - {name: snet-appservice-integration, cidr: 10.0.1.0/24}
            - {name: snet-privateendpoints, cidr: 10.0.2.0/24}
  elements:
    - {tf: azurerm_cdn_frontdoor_profile, name: afd-wordpress-waf, in: resource_group:rg-wordpress}
    - {tf: azurerm_service_plan, name: asp-wordpress, in: subnet:snet-appservice-integration}
    - {tf: azurerm_linux_web_app, name: web-wordpress, in: subnet:snet-appservice-integration}
    - {tf: azurerm_private_endpoint, name: pe-mysql, in: subnet:snet-privateendpoints}
    - {tf: azurerm_private_endpoint, name: pe-blob, in: subnet:snet-privateendpoints}
    - {tf: azurerm_mysql_flexible_server, name: mysql-wordpress-ha, in: resource_group:rg-wordpress}
    - {tf: azurerm_storage_account, name: st-wordpress-static, in: resource_group:rg-wordpress}
    - {tf: azurerm_private_dns_zone, name: pdns-mysql, in: resource_group:rg-wordpress}
    - {tf: azurerm_application_insights, name: appi-wordpress, in: resource_group:rg-wordpress}
  actors: [internet]
  flows:
    - {from: internet, to: afd-wordpress-waf, label: HTTPS (WAF), step: 1}
    - {from: afd-wordpress-waf, to: web-wordpress, label: origin request on cache miss, step: 2}
    - {from: web-wordpress, to: pe-mysql, label: MySQL via vnet integration, step: 3}
    - {from: pe-mysql, to: mysql-wordpress-ha, label: private link (primary + standby)}
