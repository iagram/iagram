- slug: acr-geo-replication-image-flow
  title: Geo-replicated Azure Container Registry serving regional AKS clusters
  category: containers
  tags: [container registry, geo-replication, acr tasks, webhooks, private endpoint, regional endpoints, aks]
  source: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication
  description: A Premium container registry in its home region is geo-replicated to additional regions so that a single global endpoint routes pushes and pulls to the nearest active-active replica, with content synced across replicas under eventual consistency. ACR Tasks build images in the home region, webhooks fire per replica when replication completes, and AKS clusters in each region pull their images from the local replica through the global or regional endpoint, optionally over private endpoints.
  containers:
    - subscription: workload
      resource_group: {name: rg-acr-global, location: westeurope}
    - subscription: workload
      resource_group: {name: rg-aks-westeurope, location: westeurope}
    - subscription: workload
      resource_group: {name: rg-aks-eastus, location: eastus}
  elements:
    - {tf: azurerm_container_registry, name: acr-premium-geo, in: resource_group:rg-acr-global}
    - {tf: azurerm_container_registry_task, name: acr-task-build, in: resource_group:rg-acr-global}
    - {tf: azurerm_container_registry_webhook, name: acr-webhook-replicated, in: resource_group:rg-acr-global}
    - {tf: azurerm_key_vault, name: kv-acr-cmk, in: resource_group:rg-acr-global}
    - {tf: azurerm_kubernetes_cluster, name: aks-westeurope, in: resource_group:rg-aks-westeurope}
    - {tf: azurerm_private_endpoint, name: pe-acr-westeurope, in: resource_group:rg-aks-westeurope}
    - {tf: azurerm_kubernetes_cluster, name: aks-eastus, in: resource_group:rg-aks-eastus}
    - {tf: azurerm_private_endpoint, name: pe-acr-eastus, in: resource_group:rg-aks-eastus}
  actors: [user]
  flows:
    - {from: user, to: acr-task-build, label: git commit triggers ACR Task, step: 1}
    - {from: acr-task-build, to: acr-premium-geo, label: push image to home region, step: 2}
    - {from: acr-premium-geo, to: acr-premium-geo, label: replicate to eastus replica (eventual consistency), step: 3}
    - {from: acr-premium-geo, to: acr-webhook-replicated, label: push event per replica, step: 4}
    - {from: aks-westeurope, to: pe-acr-westeurope, label: pull myregistry.westeurope.geo.azurecr.io, step: 5}
    - {from: pe-acr-westeurope, to: acr-premium-geo, label: private link to westeurope replica}
    - {from: aks-eastus, to: pe-acr-eastus, label: pull myregistry.eastus.geo.azurecr.io, step: 5}
    - {from: pe-acr-eastus, to: acr-premium-geo, label: private link to eastus replica}
    - {from: acr-premium-geo, to: kv-acr-cmk, label: customer-managed key}

- slug: aro-cluster-master-worker-subnets
  title: Azure Red Hat OpenShift 4 cluster in a virtual network with master and worker subnets
  category: containers
  tags: [azure red hat openshift, openshift, control plane, worker nodes, custom domain, managed identity]
  source: https://learn.microsoft.com/en-us/azure/openshift/create-cluster
  description: An Azure Red Hat OpenShift 4 cluster is created in a virtual network that has two empty subnets, one for the control plane (master) nodes and one for the worker nodes, and the cluster VMs are placed in a managed resource group. The API server and the ingress controller each receive an IP address, and when a custom domain is used, DNS A records for api and *.apps point at those addresses.
  containers:
    - subscription: workload
      resource_group: {name: aro-rg, location: eastus}
      vnets:
        - name: aro-vnet
          cidr: 10.0.0.0/22
          subnets:
            - {name: master-subnet, cidr: 10.0.0.0/23}
            - {name: worker-subnet, cidr: 10.0.2.0/23}
  elements:
    - {tf: azurerm_redhat_openshift_cluster, name: aro-cluster, in: subnet:worker-subnet}
    - {tf: azurerm_user_assigned_identity, name: id-aro-cluster, in: resource_group:aro-rg}
    - {tf: azurerm_dns_zone, name: dns-aro-example-com, in: resource_group:aro-rg}
    - {tf: azurerm_dns_a_record, name: a-api, in: resource_group:aro-rg}
    - {tf: azurerm_dns_a_record, name: a-wildcard-apps, in: resource_group:aro-rg}
    - {tf: azurerm_log_analytics_workspace, name: law-aro, in: resource_group:aro-rg}
  actors: [users, user]
  flows:
    - {from: user, to: a-api, label: resolve api.<domain>, step: 1}
    - {from: user, to: aro-cluster, label: oc login to API server, step: 2}
    - {from: users, to: a-wildcard-apps, label: resolve *.apps.<domain>, step: 3}
    - {from: users, to: aro-cluster, label: HTTPS to OpenShift ingress router, step: 4}
    - {from: aro-cluster, to: id-aro-cluster, label: managed identity for cluster operations}
    - {from: aro-cluster, to: law-aro, label: cluster logs and metrics}

- slug: batch-parallel-workload
  title: Azure Batch pool running an intrinsically parallel workload
  category: compute
  tags: [batch, hpc, parallel, pool, job, tasks, storage, data factory]
  source: https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
  description: A client application uploads input files and application packages to a storage account, then creates a pool of compute nodes, a job and tasks in a Batch account, and Batch schedules the tasks onto the nodes. Each task downloads its inputs from storage, runs the application and uploads results back to storage, where the client downloads them; the same job can also be orchestrated from Azure Data Factory as a custom activity.
  containers:
    - subscription: workload
      resource_group: {name: rg-batch, location: westeurope}
  elements:
    - {tf: azurerm_storage_account, name: st-batch-io, in: resource_group:rg-batch}
    - {tf: azurerm_batch_account, name: batch-render, in: resource_group:rg-batch}
    - {tf: azurerm_batch_application, name: batch-app-transcoder, in: resource_group:rg-batch}
    - {tf: azurerm_batch_pool, name: pool-linux-spot, in: resource_group:rg-batch}
    - {tf: azurerm_batch_job, name: job-render-frames, in: resource_group:rg-batch}
    - {tf: azurerm_data_factory, name: adf-pipeline, in: resource_group:rg-batch}
  actors: [client]
  flows:
    - {from: client, to: st-batch-io, label: upload input files and application, step: 1}
    - {from: client, to: batch-render, label: create pool, job and tasks (HTTPS), step: 2}
    - {from: batch-render, to: pool-linux-spot, label: provision compute nodes}
    - {from: job-render-frames, to: pool-linux-spot, label: schedule tasks on nodes, step: 3}
    - {from: pool-linux-spot, to: st-batch-io, label: download inputs, upload task output, step: 4}
    - {from: batch-app-transcoder, to: pool-linux-spot, label: application package install}
    - {from: client, to: batch-render, label: monitor task execution, step: 5}
    - {from: client, to: st-batch-io, label: download output files, step: 6}
    - {from: adf-pipeline, to: batch-render, label: custom activity (optional orchestration)}

- slug: app-service-environment-zone-redundant
  title: High availability enterprise deployment that uses App Service Environment
  category: web
  tags: [app service environment, ase v3, zone redundancy, application gateway, azure firewall, private endpoint, redis]
  source: https://learn.microsoft.com/en-us/azure/architecture/web-apps/app-service-environment/architectures/app-service-environment-high-availability-deployment
  description: Application Gateway WAF v2 in its own subnet forwards internet traffic to an internal-load-balancer App Service Environment v3 whose zone-redundant plans host a web app, a private API and a function app. Outbound traffic leaves through Azure Firewall, dependencies such as Azure Managed Redis, Service Bus, Cosmos DB, SQL Database and Key Vault are reached over private endpoints with private DNS zones, and GitHub Actions deploys through a jump box VM inside the network.
  containers:
    - subscription: workload
      resource_group: {name: rg-ase-ha, location: westeurope}
      vnets:
        - name: vnet-ase
          cidr: 10.0.0.0/16
          subnets:
            - {name: snet-appgw, cidr: 10.0.1.0/24}
            - {name: snet-ase, cidr: 10.0.2.0/24}
            - {name: snet-redis, cidr: 10.0.3.0/24}
            - {name: AzureFirewallSubnet, cidr: 10.0.4.0/26}
            - {name: snet-privateendpoints, cidr: 10.0.5.0/24}
            - {name: snet-jumpbox, cidr: 10.0.6.0/27}
  elements:
    - {tf: azurerm_application_gateway, name: appgw-waf-v2, in: subnet:snet-appgw}
    - {tf: azurerm_app_service_environment_v3, name: ase-v3-ilb, in: subnet:snet-ase}
    - {tf: azurerm_service_plan, name: asp-isolated-v2-zr, in: subnet:snet-ase}
    - {tf: azurerm_linux_web_app, name: web-app, in: subnet:snet-ase}
    - {tf: azurerm_linux_web_app, name: api-private, in: subnet:snet-ase}
    - {tf: azurerm_linux_function_app, name: func-app, in: subnet:snet-ase}
    - {tf: azurerm_redis_cache, name: redis-zr, in: subnet:snet-redis}
    - {tf: azurerm_firewall, name: fw-egress, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_private_endpoint, name: pe-sql, in: subnet:snet-privateendpoints}
    - {tf: azurerm_private_endpoint, name: pe-cosmos, in: subnet:snet-privateendpoints}
    - {tf: azurerm_private_endpoint, name: pe-servicebus, in: subnet:snet-privateendpoints}
    - {tf: azurerm_private_endpoint, name: pe-keyvault, in: subnet:snet-privateendpoints}
    - {tf: azurerm_linux_virtual_machine, name: vm-jumpbox, in: subnet:snet-jumpbox}
    - {tf: azurerm_mssql_server, name: sql-ase, in: resource_group:rg-ase-ha}
  actors: [internet, saas]
  flows:
    - {from: internet, to: appgw-waf-v2, label: HTTPS (WAF), step: 1}
    - {from: appgw-waf-v2, to: ase-v3-ilb, label: internal load balancer endpoint, step: 2}
    - {from: ase-v3-ilb, to: web-app, label: zone-redundant plan instances, step: 3}
    - {from: web-app, to: api-private, label: private API call, step: 4}
    - {from: web-app, to: redis-zr, label: cache-aside}
    - {from: api-private, to: pe-sql, label: TDS via private endpoint}
    - {from: pe-sql, to: sql-ase, label: private link}
    - {from: func-app, to: pe-servicebus, label: Service Bus trigger}
    - {from: api-private, to: pe-cosmos, label: Cosmos DB}
    - {from: web-app, to: pe-keyvault, label: secrets}
    - {from: web-app, to: fw-egress, label: outbound traffic}
    - {from: saas, to: vm-jumpbox, label: GitHub Actions deployment}
    - {from: vm-jumpbox, to: ase-v3-ilb, label: deploy to App Service plans}

- slug: signalr-serverless-realtime-web
  title: Serverless real-time web app with Azure SignalR Service and Functions
  category: web
  tags: [signalr, real-time, websockets, functions, serverless mode, negotiate, api management]
  source: https://learn.microsoft.com/en-us/azure/azure-signalr/signalr-concept-serverless-development-config
  description: Browser clients call an HTTP-triggered negotiate function to obtain a SignalR Service access token and endpoint, then connect to the SignalR Service instance configured in Serverless mode. Client messages are delivered to functions through the SignalR trigger and an upstream endpoint, and functions broadcast messages to all, grouped or specific users through the SignalR output binding, with API Management optionally adding CORS in front of the function app.
  containers:
    - subscription: workload
      resource_group: {name: rg-signalr-serverless, location: westeurope}
  elements:
    - {tf: azurerm_signalr_service, name: signalr-serverless, in: resource_group:rg-signalr-serverless}
    - {tf: azurerm_service_plan, name: asp-functions, in: resource_group:rg-signalr-serverless}
    - {tf: azurerm_linux_function_app, name: func-signalr-hub, in: resource_group:rg-signalr-serverless}
    - {tf: azurerm_storage_account, name: st-func-host, in: resource_group:rg-signalr-serverless}
    - {tf: azurerm_api_management, name: apim-cors, in: resource_group:rg-signalr-serverless}
    - {tf: azurerm_key_vault, name: kv-signalr-keys, in: resource_group:rg-signalr-serverless}
    - {tf: azurerm_application_insights, name: appi-signalr, in: resource_group:rg-signalr-serverless}
  actors: [users]
  flows:
    - {from: users, to: apim-cors, label: "POST /api/negotiate", step: 1}
    - {from: apim-cors, to: func-signalr-hub, label: negotiate function (SignalRConnectionInfo), step: 2}
    - {from: users, to: signalr-serverless, label: WebSocket connection with access token, step: 3}
    - {from: signalr-serverless, to: func-signalr-hub, label: upstream endpoint (SignalR trigger), step: 4}
    - {from: func-signalr-hub, to: signalr-serverless, label: SignalR output binding broadcast, step: 5}
    - {from: signalr-serverless, to: users, label: real-time messages, step: 6}
    - {from: func-signalr-hub, to: kv-signalr-keys, label: connection string / key rotation}
    - {from: func-signalr-hub, to: st-func-host, label: host storage}
    - {from: func-signalr-hub, to: appi-signalr, label: telemetry}

- slug: spring-apps-vnet-injection
  title: Azure Spring Apps deployed in a virtual network (VNet injection)
  category: web
  tags: [spring apps, spring boot, vnet injection, service runtime subnet, apps subnet, route table, private dns]
  source: https://learn.microsoft.com/en-us/azure/spring-apps/basic-standard/how-to-deploy-in-azure-virtual-network
  description: An Azure Spring Apps Standard instance is injected into a customer virtual network with two dedicated subnets, one for the service runtime and one for the Spring applications, so that apps are isolated from the internet and can reach on-premises systems and services in other virtual networks. Azure Spring Apps manages network resources in two managed resource groups, supports bring-your-own route tables for egress control and resolves app endpoints through the private.azuremicroservices.io private DNS zone; the Basic, Standard and Enterprise plans entered retirement on 17 March 2025.
  containers:
    - subscription: workload
      resource_group: {name: rg-spring-apps, location: eastus}
      vnets:
        - name: azure-spring-apps-vnet
          cidr: 10.1.0.0/16
          subnets:
            - {name: service-runtime-subnet, cidr: 10.1.0.0/24}
            - {name: apps-subnet, cidr: 10.1.1.0/24}
  elements:
    - {tf: azurerm_spring_cloud_service, name: asa-standard, in: subnet:service-runtime-subnet}
    - {tf: azurerm_spring_cloud_app, name: app-gateway-service, in: subnet:apps-subnet}
    - {tf: azurerm_spring_cloud_app, name: app-order-service, in: subnet:apps-subnet}
    - {tf: azurerm_route_table, name: rt-service-runtime, in: subnet:service-runtime-subnet}
    - {tf: azurerm_route_table, name: rt-apps, in: subnet:apps-subnet}
    - {tf: azurerm_private_dns_zone, name: pdns-private-azuremicroservices-io, in: resource_group:rg-spring-apps}
    - {tf: azurerm_application_insights, name: appi-spring-java-agent, in: resource_group:rg-spring-apps}
  actors: [users, datacenter]
  flows:
    - {from: users, to: app-gateway-service, label: HTTPS via private endpoint resolved in private DNS, step: 1}
    - {from: pdns-private-azuremicroservices-io, to: app-gateway-service, label: "*.svc.private.azuremicroservices.io"}
    - {from: app-gateway-service, to: app-order-service, label: service-to-service call, step: 2}
    - {from: asa-standard, to: app-order-service, label: service runtime manages app instances}
    - {from: app-order-service, to: datacenter, label: on-premises data access via route table, step: 3}
    - {from: rt-apps, to: datacenter, label: "0.0.0.0/0 to egress gateway"}
    - {from: app-order-service, to: appi-spring-java-agent, label: Java agent telemetry}

- slug: redis-cache-aside-web-app
  title: Web app with Azure Cache for Redis using the Cache-Aside pattern
  category: web
  tags: [redis, cache-aside, app service, sql database, distributed cache, performance]
  source: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
  description: App Service web app instances read frequently accessed items from a shared Redis cache first and, on a cache miss, load the item from the SQL data store, add it to the cache with an expiration and return it. On updates the app writes to the data store first and then invalidates the cached key, so a subsequent read repopulates the cache with fresh data.
  containers:
    - subscription: workload
      resource_group: {name: rg-web-cache, location: westeurope}
  elements:
    - {tf: azurerm_service_plan, name: asp-web, in: resource_group:rg-web-cache}
    - {tf: azurerm_linux_web_app, name: web-catalog, in: resource_group:rg-web-cache}
    - {tf: azurerm_redis_cache, name: redis-catalog, in: resource_group:rg-web-cache}
    - {tf: azurerm_mssql_server, name: sql-catalog, in: resource_group:rg-web-cache}
    - {tf: azurerm_mssql_database, name: sqldb-catalog, in: resource_group:rg-web-cache}
    - {tf: azurerm_application_insights, name: appi-web-cache, in: resource_group:rg-web-cache}
  actors: [users]
  flows:
    - {from: users, to: web-catalog, label: HTTPS, step: 1}
    - {from: web-catalog, to: redis-catalog, label: GET key (cache hit), step: 2}
    - {from: web-catalog, to: sqldb-catalog, label: read on cache miss, step: 3}
    - {from: web-catalog, to: redis-catalog, label: SET key with expiration, step: 4}
    - {from: web-catalog, to: sqldb-catalog, label: write update, step: 5}
    - {from: web-catalog, to: redis-catalog, label: DELETE key (invalidate), step: 6}
    - {from: web-catalog, to: appi-web-cache, label: telemetry}

- slug: wordpress-app-service-front-door
  title: WordPress on App Service with Azure Front Door and Azure Database for MySQL
  category: web
