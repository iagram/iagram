    - {from: pe-blob, to: st-wordpress-static, label: private link}
    - {from: st-wordpress-static, to: afd-wordpress-waf, label: static web content origin}
    - {from: pdns-mysql, to: vnet:vnet-wordpress, label: linked private DNS zone}
    - {from: web-wordpress, to: appi-wordpress, label: telemetry}
