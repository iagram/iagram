- slug: app-service-baseline-zone-redundant
  title: Baseline highly available zone-redundant App Service web application
  category: web
  tags: [app service, application gateway, waf, private endpoint, zone redundancy, sql database]
  source: https://learn.microsoft.com/en-us/azure/architecture/web-apps/app-service/architectures/baseline-zone-redundant
  description: Application Gateway with Web Application Firewall is the single public entry point and forwards requests over a private endpoint to a zone-redundant App Service plan whose public network access is disabled. App Service uses virtual network integration to reach SQL Database, Key Vault and Storage through private endpoints in a dedicated subnet, and self-hosted deployment agents inside the network upload release packages to the private storage account.
  containers:
    - subscription: workload
      resource_group: {name: rg-webapp-baseline, location: westeurope}
      vnets:
        - name: vnet-webapp
          cidr: 10.0.0.0/16
          subnets:
            - {name: GatewaySubnet, cidr: 10.0.1.0/24}
            - {name: AppServiceSubnet, cidr: 10.0.0.0/24}
            - {name: PrivateEndpointsSubnet, cidr: 10.0.2.0/27}
            - {name: AgentsSubnet, cidr: 10.0.2.32/27}
  elements:
    - {tf: azurerm_application_gateway, name: appgw-waf, in: subnet:GatewaySubnet}
    - {tf: azurerm_service_plan, name: asp-premium-zr, in: subnet:AppServiceSubnet}
    - {tf: azurerm_linux_web_app, name: web-app, in: subnet:AppServiceSubnet}
    - {tf: azurerm_private_endpoint, name: pe-webapp, in: subnet:PrivateEndpointsSubnet}
    - {tf: azurerm_private_endpoint, name: pe-sql, in: subnet:PrivateEndpointsSubnet}
    - {tf: azurerm_private_endpoint, name: pe-keyvault, in: subnet:PrivateEndpointsSubnet}
    - {tf: azurerm_linux_virtual_machine, name: vm-deploy-agent, in: subnet:AgentsSubnet}
    - {tf: azurerm_mssql_server, name: sql-webapp, in: resource_group:rg-webapp-baseline}
    - {tf: azurerm_key_vault, name: kv-webapp, in: resource_group:rg-webapp-baseline}
    - {tf: azurerm_storage_account, name: st-deploy-packages, in: resource_group:rg-webapp-baseline}
    - {tf: azurerm_application_insights, name: appi-webapp, in: resource_group:rg-webapp-baseline}
    - {tf: azurerm_log_analytics_workspace, name: law-webapp, in: resource_group:rg-webapp-baseline}
  actors: [users]
  flows:
    - {from: users, to: appgw-waf, label: HTTPS, step: 1}
    - {from: appgw-waf, to: kv-webapp, label: TLS certificate, step: 2}
    - {from: appgw-waf, to: pe-webapp, label: HTTPS via private endpoint, step: 3}
    - {from: pe-webapp, to: web-app, label: private link, step: 4}
    - {from: web-app, to: pe-sql, label: TDS via vnet integration, step: 5}
    - {from: pe-sql, to: sql-webapp, label: private link}
    - {from: web-app, to: pe-keyvault, label: secrets}
    - {from: pe-keyvault, to: kv-webapp, label: private link}
    - {from: vm-deploy-agent, to: st-deploy-packages, label: upload publish zip}
    - {from: web-app, to: st-deploy-packages, label: run from package}
    - {from: web-app, to: appi-webapp, label: telemetry}
    - {from: appi-webapp, to: law-webapp, label: logs}

- slug: app-service-multi-region-active-active-front-door
  title: Multi-region active-active App Service web app behind Azure Front Door
  category: web
  tags: [app service, front door, multi-region, active-active, disaster recovery, waf]
  source: https://learn.microsoft.com/en-us/azure/architecture/web-apps/guides/multi-region-app-service/multi-region-app-service
  description: Identical App Service plans and web apps are deployed in two regions and Azure Front Door routes traffic to both origins with equal priority, while direct public access to the apps is restricted to the Front Door instance. Front Door health probes detect a failed region and send all traffic to the surviving region, and back-end services such as databases and storage are configured for geo-redundancy separately.
  containers:
    - subscription: workload
      resource_group: {name: rg-web-global, location: westeurope}
    - subscription: workload
      resource_group: {name: rg-web-region1, location: westeurope}
    - subscription: workload
      resource_group: {name: rg-web-region2, location: northeurope}
  elements:
    - {tf: azurerm_cdn_frontdoor_profile, name: afd-web, in: resource_group:rg-web-global}
    - {tf: azurerm_application_insights, name: appi-web-availability, in: resource_group:rg-web-global}
    - {tf: azurerm_service_plan, name: asp-region1, in: resource_group:rg-web-region1}
    - {tf: azurerm_linux_web_app, name: web-region1, in: resource_group:rg-web-region1}
    - {tf: azurerm_mssql_server, name: sql-region1, in: resource_group:rg-web-region1}
    - {tf: azurerm_storage_account, name: st-content-gzrs, in: resource_group:rg-web-region1}
    - {tf: azurerm_service_plan, name: asp-region2, in: resource_group:rg-web-region2}
    - {tf: azurerm_linux_web_app, name: web-region2, in: resource_group:rg-web-region2}
    - {tf: azurerm_mssql_server, name: sql-region2, in: resource_group:rg-web-region2}
  actors: [users, internet]
  flows:
    - {from: users, to: afd-web, label: HTTPS (WAF), step: 1}
    - {from: afd-web, to: web-region1, label: origin priority 1, step: 2}
    - {from: afd-web, to: web-region2, label: origin priority 1, step: 2}
    - {from: web-region1, to: sql-region1, label: TDS, step: 3}
    - {from: web-region2, to: sql-region2, label: TDS, step: 3}
    - {from: sql-region1, to: sql-region2, label: failover group replication}
    - {from: web-region1, to: st-content-gzrs, label: mounted share (GZRS)}
    - {from: web-region2, to: st-content-gzrs, label: mounted share (GZRS)}
    - {from: appi-web-availability, to: afd-web, label: availability tests}

- slug: multitier-vm-web-app-ha-dr
  title: Multitier VM web application built for high availability and disaster recovery
  category: web
  tags: [virtual machines, load balancer, traffic manager, site recovery, sql server always on, availability zones]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/infrastructure/multi-tier-app-disaster-recovery
  description: Traffic Manager sends users to a public load balancer in the primary region that fronts web tier VMs, which call business tier VMs through an internal load balancer and then a SQL Server Always On availability group through a second internal load balancer, with each tier in its own subnet and VMs spread across availability zones. Site Recovery or SQL Always On asynchronous replication keeps a mirrored deployment in a secondary region, and Traffic Manager fails over to that region's public IP when the primary region is unavailable.
  containers:
    - subscription: workload
      resource_group: {name: rg-app-primary, location: eastus}
      vnets:
        - name: vnet-primary
          cidr: 10.10.0.0/16
          subnets:
            - {name: snet-web-primary, cidr: 10.10.1.0/24}
            - {name: snet-business-primary, cidr: 10.10.2.0/24}
            - {name: snet-data-primary, cidr: 10.10.3.0/24}
    - subscription: workload
      resource_group: {name: rg-app-dr, location: westus}
      vnets:
        - name: vnet-dr
          cidr: 10.20.0.0/16
          subnets:
            - {name: snet-web-dr, cidr: 10.20.1.0/24}
            - {name: snet-business-dr, cidr: 10.20.2.0/24}
            - {name: snet-data-dr, cidr: 10.20.3.0/24}
  elements:
    - {tf: azurerm_traffic_manager_profile, name: tm-app, in: resource_group:rg-app-primary}
    - {tf: azurerm_lb, name: lb-web-public, in: subnet:snet-web-primary}
    - {tf: azurerm_windows_virtual_machine, name: vm-web-1, in: subnet:snet-web-primary}
    - {tf: azurerm_lb, name: lb-business-internal, in: subnet:snet-business-primary}
    - {tf: azurerm_windows_virtual_machine, name: vm-business-1, in: subnet:snet-business-primary}
    - {tf: azurerm_lb, name: lb-sql-internal, in: subnet:snet-data-primary}
    - {tf: azurerm_mssql_virtual_machine, name: sqlvm-primary, in: subnet:snet-data-primary}
    - {tf: azurerm_recovery_services_vault, name: rsv-site-recovery, in: resource_group:rg-app-dr}
    - {tf: azurerm_lb, name: lb-web-public-dr, in: subnet:snet-web-dr}
    - {tf: azurerm_windows_virtual_machine, name: vm-web-dr, in: subnet:snet-web-dr}
    - {tf: azurerm_windows_virtual_machine, name: vm-business-dr, in: subnet:snet-business-dr}
    - {tf: azurerm_mssql_virtual_machine, name: sqlvm-dr, in: subnet:snet-data-dr}
  actors: [users]
  flows:
    - {from: users, to: tm-app, label: DNS resolution, step: 1}
    - {from: tm-app, to: lb-web-public, label: primary endpoint, step: 2}
    - {from: lb-web-public, to: vm-web-1, label: HTTPS, step: 3}
    - {from: vm-web-1, to: lb-business-internal, label: HTTP, step: 4}
    - {from: lb-business-internal, to: vm-business-1, label: HTTP, step: 5}
    - {from: vm-business-1, to: lb-sql-internal, label: TDS 1433, step: 6}
    - {from: lb-sql-internal, to: sqlvm-primary, label: availability group listener, step: 7}
    - {from: sqlvm-primary, to: sqlvm-dr, label: Always On async replication}
    - {from: vm-web-1, to: rsv-site-recovery, label: Site Recovery replication}
    - {from: vm-business-1, to: rsv-site-recovery, label: Site Recovery replication}
    - {from: tm-app, to: lb-web-public-dr, label: failover endpoint}
    - {from: lb-web-public-dr, to: vm-web-dr, label: HTTPS after failover}

- slug: static-web-apps-functions-api
  title: Static Web Apps front end with Azure Functions API back end
  category: web
  tags: [static web apps, functions, jamstack, api, bring your own functions]
  source: https://learn.microsoft.com/en-us/azure/static-web-apps/apis-functions
  description: Azure Static Web Apps hosts the static front end and exposes a serverless API on the fixed /api route, either as managed HTTP-only functions deployed with the site or as a linked, self-managed Azure Functions app that supports all triggers, bindings, managed identity and Key Vault references. Requests to /api are proxied by Static Web Apps to the linked function app without custom CORS rules, and Application Insights on the function app collects logs.
  containers:
    - subscription: workload
      resource_group: {name: rg-swa-api, location: westeurope}
  elements:
    - {tf: azurerm_static_web_app, name: swa-frontend, in: resource_group:rg-swa-api}
    - {tf: azurerm_service_plan, name: asp-functions-flex, in: resource_group:rg-swa-api}
    - {tf: azurerm_linux_function_app, name: func-api, in: resource_group:rg-swa-api}
    - {tf: azurerm_storage_account, name: st-func-host, in: resource_group:rg-swa-api}
    - {tf: azurerm_key_vault, name: kv-api-secrets, in: resource_group:rg-swa-api}
    - {tf: azurerm_application_insights, name: appi-api, in: resource_group:rg-swa-api}
  actors: [users]
  flows:
    - {from: users, to: swa-frontend, label: HTTPS static content, step: 1}
    - {from: users, to: swa-frontend, label: "GET /api/*", step: 2}
    - {from: swa-frontend, to: func-api, label: linked backend proxy, step: 3}
    - {from: func-api, to: kv-api-secrets, label: Key Vault references}
    - {from: func-api, to: st-func-host, label: host storage}
    - {from: func-api, to: appi-api, label: logs}

- slug: apim-ecommerce-web-app-migration
  title: Migrate an e-commerce web app by using Azure API Management
  category: web
  tags: [api management, app service, e-commerce, strangler fig, hybrid, legacy migration]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/apps/apim-api-scenario
  description: A travel e-commerce company hosts a new browser-based UI and new HTTP APIs on App Service while API Management acts as a facade over both the new APIs and the existing on-premises SOAP services, which only accept calls from the API Management IP address over TLS with client certificates. Users can be directed to the new UI or the legacy UI side by side, and functionality moves gradually behind the API Management configuration without changing the front end.
  containers:
    - datacenter: on-premises
    - subscription: workload
      resource_group: {name: rg-ecommerce-apim, location: westeurope}
  elements:
    - {tf: azurerm_api_management, name: apim-ecommerce, in: resource_group:rg-ecommerce-apim}
    - {tf: azurerm_service_plan, name: asp-ecommerce, in: resource_group:rg-ecommerce-apim}
    - {tf: azurerm_linux_web_app, name: web-new-ui, in: resource_group:rg-ecommerce-apim}
    - {tf: azurerm_linux_web_app, name: api-new-backend, in: resource_group:rg-ecommerce-apim}
    - {tf: azurerm_application_insights, name: appi-apim, in: resource_group:rg-ecommerce-apim}
    - {tf: azurerm_log_analytics_workspace, name: law-ecommerce, in: resource_group:rg-ecommerce-apim}
  actors: [users, server]
  flows:
    - {from: users, to: web-new-ui, label: HTTPS new UI, step: 1}
    - {from: web-new-ui, to: apim-ecommerce, label: HTTPS API calls, step: 2}
    - {from: apim-ecommerce, to: api-new-backend, label: HTTPS (APIM VIP only), step: 3}
    - {from: apim-ecommerce, to: datacenter, label: HTTPS + client certificate to legacy SOAP services, step: 4}
    - {from: users, to: server, label: HTTPS legacy UI}
    - {from: server, to: datacenter, label: internal calls to existing services}
    - {from: apim-ecommerce, to: appi-apim, label: telemetry}
    - {from: appi-apim, to: law-ecommerce, label: logs}

- slug: functions-scalable-web-api-cosmos-apim
  title: Serverless web API with Azure Functions, Cosmos DB and API Management
  category: serverless
  tags: [functions, cosmos db, api management, http trigger, serverless api]
  source: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scenarios
  description: HTTP-triggered Azure Functions define the endpoints of a web API and write documents to Azure Cosmos DB through the Cosmos DB output binding, while API Management exposes the function endpoints as managed serverless APIs with an OpenAPI definition. A second function uses the Cosmos DB change feed trigger to react to database changes, and the function host stores its state in a storage account.
  containers:
    - subscription: workload
      resource_group: {name: rg-serverless-api, location: westeurope}
  elements:
    - {tf: azurerm_api_management, name: apim-serverless, in: resource_group:rg-serverless-api}
    - {tf: azurerm_service_plan, name: asp-flex-consumption, in: resource_group:rg-serverless-api}
    - {tf: azurerm_linux_function_app, name: func-http-api, in: resource_group:rg-serverless-api}
    - {tf: azurerm_linux_function_app, name: func-change-feed, in: resource_group:rg-serverless-api}
    - {tf: azurerm_cosmosdb_account, name: cosmos-api-data, in: resource_group:rg-serverless-api}
    - {tf: azurerm_storage_account, name: st-func-host, in: resource_group:rg-serverless-api}
    - {tf: azurerm_application_insights, name: appi-serverless, in: resource_group:rg-serverless-api}
  actors: [client]
  flows:
    - {from: client, to: apim-serverless, label: HTTPS REST, step: 1}
    - {from: apim-serverless, to: func-http-api, label: HTTP trigger, step: 2}
    - {from: func-http-api, to: cosmos-api-data, label: Cosmos DB output binding, step: 3}
    - {from: cosmos-api-data, to: func-change-feed, label: change feed trigger, step: 4}
    - {from: func-http-api, to: st-func-host, label: host storage}
    - {from: func-http-api, to: appi-serverless, label: telemetry}

- slug: event-grid-fanout-handlers
  title: Event Grid custom topic fan-out to Functions, Service Bus, Event Hubs and Storage queues
  category: serverless
  tags: [event grid, fan-out, publish-subscribe, functions, service bus, event hubs, storage queue, logic apps]
  source: https://learn.microsoft.com/en-us/azure/event-grid/event-handlers
  description: A publisher application posts events to an Event Grid custom topic, and one event subscription per destination pushes filtered copies of each event to an Azure Function, a Service Bus queue, an Event Hubs instance, a Storage queue and a Logic Apps webhook. Push delivery retries for 24 hours with exponential backoff, and each handler processes its copy of the event independently.
  containers:
    - subscription: workload
      resource_group: {name: rg-eventgrid-fanout, location: westeurope}
  elements:
    - {tf: azurerm_eventgrid_topic, name: egt-orders, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_service_plan, name: asp-consumption, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_linux_function_app, name: func-order-handler, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_servicebus_namespace, name: sb-orders, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_servicebus_queue, name: sbq-fulfilment, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_eventhub_namespace, name: evhns-analytics, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_eventhub, name: evh-order-events, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_storage_account, name: st-audit-queue, in: resource_group:rg-eventgrid-fanout}
    - {tf: azurerm_logic_app_workflow, name: logic-notify, in: resource_group:rg-eventgrid-fanout}
  actors: [client]
  flows:
    - {from: client, to: egt-orders, label: publish CloudEvents over HTTPS, step: 1}
    - {from: egt-orders, to: func-order-handler, link: azurerm_eventgrid_event_subscription, label: Event Grid trigger, step: 2}
    - {from: egt-orders, to: sbq-fulfilment, link: azurerm_eventgrid_event_subscription, label: Service Bus queue handler, step: 2}
    - {from: egt-orders, to: evh-order-events, link: azurerm_eventgrid_event_subscription, label: Event Hubs handler, step: 2}
    - {from: egt-orders, to: st-audit-queue, link: azurerm_eventgrid_event_subscription, label: Storage queue handler, step: 2}
    - {from: egt-orders, to: logic-notify, link: azurerm_eventgrid_event_subscription, label: webhook handler, step: 2}

- slug: service-bus-queue-based-load-leveling
  title: Queue-based load leveling with Service Bus and Azure Functions
  category: serverless
  tags: [service bus, queue-based load leveling, functions, app service, target-based scaling, dead-letter]
  source: https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling
  description: App Service web app instances post work messages to a Service Bus queue instead of calling the data store directly, so bursts of requests are buffered rather than overwhelming the back end. An Azure Functions app reads the queue and performs the reads and writes against the data store at a controlled rate, scaling on queue backlog within configured bounds and routing unprocessable messages to a dead-letter queue.
  containers:
    - subscription: workload
      resource_group: {name: rg-load-leveling, location: westeurope}
  elements:
    - {tf: azurerm_service_plan, name: asp-web, in: resource_group:rg-load-leveling}
    - {tf: azurerm_linux_web_app, name: web-frontend, in: resource_group:rg-load-leveling}
    - {tf: azurerm_servicebus_namespace, name: sb-leveling, in: resource_group:rg-load-leveling}
    - {tf: azurerm_servicebus_queue, name: sbq-work-items, in: resource_group:rg-load-leveling}
    - {tf: azurerm_service_plan, name: asp-functions, in: resource_group:rg-load-leveling}
    - {tf: azurerm_linux_function_app, name: func-queue-worker, in: resource_group:rg-load-leveling}
    - {tf: azurerm_storage_account, name: st-func-host, in: resource_group:rg-load-leveling}
    - {tf: azurerm_mssql_server, name: sql-data-store, in: resource_group:rg-load-leveling}
  actors: [users]
  flows:
    - {from: users, to: web-frontend, label: HTTPS, step: 1}
    - {from: web-frontend, to: sbq-work-items, label: send message, step: 2}
    - {from: sbq-work-items, to: func-queue-worker, label: Service Bus trigger (target-based scaling), step: 3}
    - {from: func-queue-worker, to: sql-data-store, label: read/write at controlled rate, step: 4}
    - {from: func-queue-worker, to: sbq-work-items, label: dead-letter unprocessable messages}
    - {from: func-queue-worker, to: st-func-host, label: host storage}

- slug: event-hubs-serverless-stream-processing
  title: Event Hubs streaming ingestion with Functions, Stream Analytics and Capture
  category: serverless
  tags: [event hubs, kafka, functions, stream analytics, capture, consumer groups]
  source: https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-about
  description: Producers send events over AMQP, Kafka or HTTPS to a partitioned event hub in an Event Hubs namespace, where they are retained for a configurable period. Separate consumer groups let an Azure Functions app and a Stream Analytics job read the same stream independently with checkpointing, while Capture writes the raw events to Blob Storage or Data Lake Storage for long-term retention.
  containers:
    - subscription: workload
      resource_group: {name: rg-streaming, location: westeurope}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-telemetry, in: resource_group:rg-streaming}
    - {tf: azurerm_eventhub, name: evh-telemetry, in: resource_group:rg-streaming}
    - {tf: azurerm_storage_account, name: st-capture, in: resource_group:rg-streaming}
    - {tf: azurerm_service_plan, name: asp-functions, in: resource_group:rg-streaming}
    - {tf: azurerm_linux_function_app, name: func-stream-processor, in: resource_group:rg-streaming}
    - {tf: azurerm_stream_analytics_job, name: asa-realtime, in: resource_group:rg-streaming}
    - {tf: azurerm_cosmosdb_account, name: cosmos-hot-path, in: resource_group:rg-streaming}
    - {tf: azurerm_application_insights, name: appi-stream, in: resource_group:rg-streaming}
  actors: [device, client]
  flows:
    - {from: device, to: evh-telemetry, label: AMQP / Kafka produce, step: 1}
    - {from: client, to: evh-telemetry, label: HTTPS produce, step: 1}
    - {from: evh-telemetry, to: func-stream-processor, label: Event Hubs trigger (consumer group A), step: 2}
    - {from: evh-telemetry, to: asa-realtime, label: consumer group B, step: 2}
    - {from: evh-telemetry, to: st-capture, label: Capture (Avro), step: 2}
    - {from: func-stream-processor, to: cosmos-hot-path, label: write processed events, step: 3}
    - {from: func-stream-processor, to: st-capture, label: checkpoints}
    - {from: func-stream-processor, to: appi-stream, label: telemetry}

- slug: durable-functions-stateful-workflows
  title: Durable Functions stateful serverless workflows
  category: serverless
  tags: [durable functions, orchestrator, fan-out fan-in, function chaining, task hub, storage provider]
  source: https://learn.microsoft.com/en-us/azure/durable-task/durable-functions/durable-functions-overview
  description: Durable Functions extends Azure Functions with orchestrator, activity and entity functions so that function chaining, fan-out/fan-in, monitor and human-interaction workflows run reliably over long periods. The runtime checkpoints orchestration state, retries and recovery into a task hub in the configured storage provider, and HTTP APIs start and query orchestration instances.
  containers:
    - subscription: workload
      resource_group: {name: rg-durable, location: westeurope}
  elements:
    - {tf: azurerm_service_plan, name: asp-durable, in: resource_group:rg-durable}
    - {tf: azurerm_linux_function_app, name: func-orchestrations, in: resource_group:rg-durable}
    - {tf: azurerm_storage_account, name: st-task-hub, in: resource_group:rg-durable}
    - {tf: azurerm_key_vault, name: kv-durable, in: resource_group:rg-durable}
    - {tf: azurerm_application_insights, name: appi-durable, in: resource_group:rg-durable}
    - {tf: azurerm_log_analytics_workspace, name: law-durable, in: resource_group:rg-durable}
  actors: [client]
  flows:
    - {from: client, to: func-orchestrations, label: HTTP start orchestration, step: 1}
    - {from: func-orchestrations, to: st-task-hub, label: orchestration state and checkpoints, step: 2}
