- slug: aks-baseline-hub-spoke
  title: Baseline architecture for an AKS cluster
  category: containers
  tags: [aks, hub-spoke, azure firewall, application gateway, private cluster, container registry, key vault]
  source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/containers/aks/baseline-aks
  description: A private AKS cluster with system and user node pools runs in a spoke virtual network peered to a hub that hosts Azure Firewall, a gateway subnet and Azure Bastion, with all cluster egress forced through the firewall by user-defined routes. Application Gateway with WAF terminates TLS and forwards to an internal load balancer and in-cluster ingress, and the cluster reaches Container Registry and Key Vault only through private endpoints.
  containers:
    - subscription: connectivity
      resource_group: {name: rg-enterprise-networking-hubs, location: eastus2}
      vnets:
        - name: vnet-hub
          cidr: 10.200.0.0/24
          subnets:
            - {name: AzureFirewallSubnet, cidr: 10.200.0.0/26}
            - {name: GatewaySubnet, cidr: 10.200.0.64/27}
            - {name: AzureBastionSubnet, cidr: 10.200.0.96/26}
    - subscription: workload
      resource_group: {name: rg-bu0001a0008, location: eastus2}
      vnets:
        - name: vnet-spoke-aks
          cidr: 10.240.0.0/16
          subnets:
            - {name: snet-clusternodes, cidr: 10.240.0.0/22}
            - {name: snet-clusteringressservices, cidr: 10.240.4.0/28}
            - {name: snet-applicationgateway, cidr: 10.240.4.16/28}
            - {name: snet-privatelinkendpoints, cidr: 10.240.4.32/28}
  elements:
    - {tf: azurerm_firewall, name: fw-hub, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_bastion_host, name: bastion-hub, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_application_gateway, name: appgw-waf, in: subnet:snet-applicationgateway}
    - {tf: azurerm_lb, name: ilb-ingress, in: subnet:snet-clusteringressservices}
    - {tf: azurerm_kubernetes_cluster, name: aks-baseline, in: subnet:snet-clusternodes}
    - {tf: azurerm_private_endpoint, name: pe-acr, in: subnet:snet-privatelinkendpoints}
    - {tf: azurerm_private_endpoint, name: pe-keyvault, in: subnet:snet-privatelinkendpoints}
    - {tf: azurerm_container_registry, name: acr-baseline, in: resource_group:rg-bu0001a0008}
    - {tf: azurerm_key_vault, name: kv-aks-baseline, in: resource_group:rg-bu0001a0008}
    - {tf: azurerm_log_analytics_workspace, name: law-aks, in: resource_group:rg-bu0001a0008}
  actors: [users, internet, user]
  flows:
    - {from: vnet:vnet-hub, to: vnet:vnet-spoke-aks, link: azurerm_virtual_network_peering, label: peering}
    - {from: users, to: appgw-waf, label: HTTPS (WAF, TLS termination), step: 1}
    - {from: appgw-waf, to: ilb-ingress, label: HTTPS to internal load balancer, step: 2}
    - {from: ilb-ingress, to: aks-baseline, label: ingress controller to pods, step: 3}
    - {from: aks-baseline, to: fw-hub, label: "0.0.0.0/0 via UDR", step: 4}
    - {from: fw-hub, to: internet, label: allowed egress (FQDN rules), step: 5}
    - {from: aks-baseline, to: pe-acr, label: image pull}
    - {from: pe-acr, to: acr-baseline, label: private link}
    - {from: aks-baseline, to: pe-keyvault, label: Secrets Store CSI driver}
    - {from: pe-keyvault, to: kv-aks-baseline, label: private link}
    - {from: user, to: bastion-hub, label: operator access}
    - {from: bastion-hub, to: aks-baseline, label: private API server}
    - {from: aks-baseline, to: law-aks, label: container insights}

- slug: aks-private-cluster-azure-firewall
