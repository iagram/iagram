- slug: aks-gitops-flux-cicd
  title: GitOps for AKS with Flux v2 and GitHub Actions CI/CD
  category: containers
  tags: [aks, gitops, flux, github actions, container registry, cluster extension, pull-based deployment]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/gitops-aks/gitops-blueprint-aks
  description: GitHub Actions builds a container image from committed application code, pushes it to Container Registry and updates the image tag in the Kubernetes manifests stored in the Git repository. The Flux v2 cluster extension on each AKS cluster polls the repository, detects drift and reconciles manifests, Helm charts or Kustomizations into the cluster without exposing cluster endpoints to build agents, so the same repository keeps primary and disaster-recovery clusters in a consistent state.
  containers:
    - subscription: workload
      resource_group: {name: rg-aks-gitops, location: westeurope}
  elements:
    - {tf: azurerm_container_registry, name: acr-apps, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_kubernetes_cluster, name: aks-primary, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_kubernetes_cluster_extension, name: flux-ext-primary, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_kubernetes_flux_configuration, name: flux-config-primary, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_kubernetes_cluster, name: aks-dr, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_kubernetes_cluster_extension, name: flux-ext-dr, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_kubernetes_flux_configuration, name: flux-config-dr, in: resource_group:rg-aks-gitops}
    - {tf: azurerm_log_analytics_workspace, name: law-gitops, in: resource_group:rg-aks-gitops}
  actors: [user, saas]
  flows:
    - {from: user, to: saas, label: commit code and manifests to GitHub, step: 1}
    - {from: saas, to: acr-apps, label: GitHub Actions builds and pushes image, step: 2}
    - {from: saas, to: saas, label: GitHub Actions updates manifest image tag, step: 3}
    - {from: flux-config-primary, to: saas, label: Flux polls Git repository, step: 4}
    - {from: flux-config-dr, to: saas, label: Flux polls Git repository, step: 4}
    - {from: flux-config-primary, to: aks-primary, label: reconcile manifests, step: 5}
