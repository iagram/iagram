    - {from: api-alb, to: checkout-service, label: forward, step: 2}
    - {from: otel-collector-config, to: checkout-task-with-adot, label: AOT_CONFIG_CONTENT from Parameter Store, step: 3}
    - {from: checkout-service, to: checkout-task-with-adot, label: "app container -> sidecar OTLP localhost:4317", step: 4}
    - {from: checkout-task-with-adot, to: checkout-traces, label: awsxray exporter PutTraceSegments, step: 5}
    - {from: checkout-task-with-adot, to: app-metrics, label: prometheusremotewrite exporter, step: 6}
    - {from: checkout-task-with-adot, to: adot-collector-logs, label: awslogs driver}
    - {from: ecs-task-role, to: checkout-task-with-adot, label: xray + logs + aps permissions}
    - {from: app-metrics, to: checkout-dashboard, label: metrics widgets}

- slug: centralized-logging-opensearch-fluent-bit
  title: Centralized Logging with OpenSearch for application and AWS service logs
  category: observability
  tags: [opensearch, fluent bit, kinesis, lambda, centralized logging, solutions library]
  source: https://docs.aws.amazon.com/solutions/latest/centralized-logging-with-opensearch/application-log-analytics-pipeline.html
  description: Fluent Bit agents on EC2 instances (with the SSM Agent) and EKS nodes in a sources VPC upload application logs over a VPC peering connection and interface endpoints into a log buffer in the main account, either a Kinesis Data Streams stream or an S3 log bucket. In option (a) the stream emits events through Amazon EventBridge that trigger the Log Processor Lambda function, which reads the logs and bulk-uploads them into the Amazon OpenSearch Service domain; in option (b) S3 notifications on an SQS queue feed an OpenSearch Ingestion Service pipeline that reads the bucket and bulk-uploads to the same domain, and both paths write failed records to an S3 backup bucket.
  containers:
    - region: us-east-1
      groups: [{label: log buffer, at: [1, 3]}, {label: log processing, at: [1, 4]}]
      vpcs:
        - name: sources
          cidr: 10.71.0.0/16
          at: [1, 1]
          subnets:
            - {name: app, cidr: 10.71.1.0/24, az: a, public: false, at: [1, 1]}
        - name: logging
          cidr: 10.70.0.0/16
          at: [1, 5]
          subnets:
            - {name: private-a, cidr: 10.70.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: private-b, cidr: 10.70.2.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_instance, name: app-server-fluent-bit, in: subnet:app, at: [1, 1]}
    - {tf: aws_eks_cluster, name: app-cluster-fluent-bit, in: subnet:app, at: [1, 2]}
    - {tf: aws_vpc_endpoint, name: log-buffer-endpoints, in: vpc:sources, at: [2, 1]}
    - {tf: aws_kinesis_stream, name: app-log-buffer, in: group:log buffer, at: [1, 1]}
    - {tf: aws_s3_bucket, name: app-log-bucket, in: group:log buffer, at: [2, 1]}
    - {tf: aws_cloudwatch_event_rule, name: log-event-rule, in: group:log processing, at: [1, 1]}
    - {tf: aws_lambda_function, name: log-processor, in: group:log processing, at: [1, 2]}
    - {tf: aws_sqs_queue, name: log-queue, in: group:log processing, at: [2, 1, 1, 2]}
    - {tf: aws_opensearch_domain, name: central-logs, in: vpc:logging, at: [2, 1, 1, 2]}
    - {tf: aws_s3_bucket, name: failed-records-backup, in: region, at: [2, 5]}
  flows:
    - {from: app-server-fluent-bit, to: app-log-buffer, label: Upload logs (Fluent Bit), step: 1}
