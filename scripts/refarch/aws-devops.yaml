    - {tf: aws_ecs_service, name: checkout-service, in: subnet:private-a}
    - {tf: aws_ssm_parameter, name: otel-collector-config, in: region}
    - {tf: aws_iam_role, name: ecs-task-role, in: region}
    - {tf: aws_xray_group, name: checkout-traces, in: group:telemetry backends}
    - {tf: aws_cloudwatch_log_group, name: adot-collector-logs, in: group:telemetry backends}
    - {tf: aws_prometheus_workspace, name: app-metrics, in: group:telemetry backends}
    - {tf: aws_cloudwatch_dashboard, name: checkout-dashboard, in: group:telemetry backends}
