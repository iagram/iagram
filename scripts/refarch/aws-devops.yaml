# AWS reference architectures: DevOps, CI/CD and observability.
# Format: see FORMAT.md. 20 items, provider aws.
# Sources: AWS docs (CodePipeline, CodeDeploy, SAM, CloudWatch, X-Ray, AMP, Incident Manager,
# Config, CUR), AWS Solutions Library, AWS DevOps / Security / Cloud Operations blogs.

- slug: cross-account-codepipeline-codedeploy-kms
  title: Cross-account deployment pipeline with CodePipeline, KMS and CodeDeploy
  category: devops
  tags: [codepipeline, cross-account, codedeploy, kms, multi-account, s3 artifacts]
  source: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
  description: A pipeline in the tooling account encrypts its S3 artifact store with a customer managed KMS key whose key policy and bucket policy grant the workload account access, and the CodePipeline service role is allowed to assume a cross-account role there. The deploy action runs with that role ARN against a CodeDeploy application and deployment group owned by the workload account, whose EC2 instance profile can read the artifact bucket and decrypt with the key.
  containers:
    - region: us-east-2
      account: tooling
      groups: [{label: pipeline}]
    - region: us-east-2
      account: workload
      vpcs:
        - name: app
          cidr: 10.10.0.0/16
          subnets:
            - {name: private-a, cidr: 10.10.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_codecommit_repository, name: app-repo, in: group:pipeline}
    - {tf: aws_codepipeline, name: cross-account-pipeline, in: group:pipeline}
    - {tf: aws_codebuild_project, name: app-build, in: group:pipeline}
    - {tf: aws_s3_bucket, name: pipeline-artifact-bucket, in: group:pipeline}
    - {tf: aws_kms_key, name: artifact-cmk, in: group:pipeline}
    - {tf: aws_iam_role, name: codepipeline-service-role, in: account:tooling}
    - {tf: aws_iam_role, name: cross-account-deploy-role, in: account:workload}
    - {tf: aws_codedeploy_app, name: workload-codedeploy-app, in: account:workload}
    - {tf: aws_autoscaling_group, name: app-asg, in: subnet:private-a}
    - {tf: aws_iam_role, name: ec2-instance-role, in: account:workload}
  actors: [user]
  flows:
    - {from: user, to: app-repo, label: git push, step: 1}
    - {from: app-repo, to: cross-account-pipeline, label: source action, step: 2}
    - {from: cross-account-pipeline, to: app-build, label: build action, step: 3}
    - {from: app-build, to: pipeline-artifact-bucket, label: build artifact encrypted with CMK, step: 4}
    - {from: artifact-cmk, to: pipeline-artifact-bucket, label: SSE-KMS}
    - {from: codepipeline-service-role, to: cross-account-deploy-role, label: "sts:AssumeRole (roleArn on action)", step: 5}
    - {from: cross-account-pipeline, to: workload-codedeploy-app, label: CodeDeploy deploy action in workload account, step: 6}
    - {from: workload-codedeploy-app, to: app-asg, label: deployment group targets, step: 7}
    - {from: app-asg, to: pipeline-artifact-bucket, label: agent GetObject + kms Decrypt, step: 8}
    - {from: ec2-instance-role, to: app-asg, label: instance profile}

- slug: lambda-canary-sam-codedeploy
  title: Gradual Lambda deployment with AWS SAM and CodeDeploy canary traffic shifting
  category: devops
  tags: [lambda, sam, codedeploy, canary, alias, rollback]
  source: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
  description: AWS SAM publishes a new Lambda version, keeps a live alias, and hands traffic shifting to a CodeDeploy application on the Lambda compute platform using a preference such as Canary10Percent10Minutes or Linear10PercentEvery1Minute. Pre-traffic and post-traffic hook functions validate the release, and CloudWatch alarms on the alias error metrics trigger an automatic rollback if they fire during the shift.
  containers:
    - region: us-east-1
      groups: [{label: deployment}, {label: application}]
  elements:
    - {tf: aws_s3_bucket, name: sam-artifacts, in: group:deployment}
    - {tf: aws_cloudformation_stack, name: sam-stack, in: group:deployment}
    - {tf: aws_codedeploy_app, name: lambda-deploy-app, in: group:deployment}
    - {tf: aws_lambda_function, name: pre-traffic-hook, in: group:deployment}
    - {tf: aws_lambda_function, name: post-traffic-hook, in: group:deployment}
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: group:application}
    - {tf: aws_lambda_function, name: orders-handler, in: group:application}
    - {tf: aws_lambda_alias, name: live-alias, in: group:application}
    - {tf: aws_cloudwatch_metric_alarm, name: alias-errors-alarm, in: group:application}
  actors: [user, client]
  flows:
    - {from: user, to: sam-artifacts, label: sam deploy uploads code.zip, step: 1}
    - {from: sam-artifacts, to: sam-stack, label: CloudFormation change set, step: 2}
    - {from: sam-stack, to: orders-handler, label: publish new version (AutoPublishAlias), step: 3}
    - {from: sam-stack, to: lambda-deploy-app, label: DeploymentPreference creates deployment, step: 4}
    - {from: lambda-deploy-app, to: pre-traffic-hook, label: PreTraffic hook, step: 5}
    - {from: lambda-deploy-app, to: live-alias, label: shift 10% then 100% of traffic, step: 6}
    - {from: alias-errors-alarm, to: lambda-deploy-app, label: ALARM triggers rollback}
    - {from: lambda-deploy-app, to: post-traffic-hook, label: PostTraffic hook, step: 7}
    - {from: client, to: orders-api, label: HTTPS}
    - {from: orders-api, to: live-alias, label: invoke alias}
    - {from: live-alias, to: orders-handler, label: weighted versions}

- slug: ec2-bluegreen-codedeploy-autoscaling
  title: EC2 blue/green deployment with CodeDeploy, Auto Scaling and a load balancer
  category: devops
  tags: [codedeploy, ec2, auto scaling, blue/green, elb, codepipeline]
  source: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-create-console-blue-green.html
  description: A CodeDeploy deployment group on the EC2/On-premises platform copies the current (blue) Auto Scaling group into a replacement (green) group, installs the revision from the pipeline artifact bucket on the new instances, and registers them with the load balancer target group once healthy. Traffic is rerouted from the original instances to the replacement instances, and the original Auto Scaling group is terminated after a configurable wait so a rollback simply reregisters the blue fleet.
  containers:
    - region: eu-west-1
      groups: [{label: pipeline}]
      vpcs:
        - name: web
          cidr: 10.20.0.0/16
          subnets:
            - {name: public-a, cidr: 10.20.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.20.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.20.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_codecommit_repository, name: web-app-repo, in: group:pipeline}
    - {tf: aws_codepipeline, name: web-pipeline, in: group:pipeline}
    - {tf: aws_codebuild_project, name: web-build, in: group:pipeline}
    - {tf: aws_s3_bucket, name: revision-bucket, in: group:pipeline}
    - {tf: aws_codedeploy_app, name: web-codedeploy-app, in: group:pipeline}
    - {tf: aws_lb, name: web-alb, in: subnet:public-a}
    - {tf: aws_launch_template, name: web-launch-template, in: vpc:web}
    - {tf: aws_autoscaling_group, name: blue-asg, in: subnet:private-a}
    - {tf: aws_autoscaling_group, name: green-asg, in: subnet:private-b}
    - {tf: aws_iam_role, name: codedeploy-service-role, in: region}
  actors: [user, users]
  flows:
    - {from: user, to: web-app-repo, label: git push, step: 1}
    - {from: web-app-repo, to: web-pipeline, label: source action, step: 2}
    - {from: web-pipeline, to: web-build, label: build appspec.yml bundle, step: 3}
    - {from: web-build, to: revision-bucket, label: revision artifact, step: 4}
    - {from: web-pipeline, to: web-codedeploy-app, label: CodeDeploy deploy action, step: 5}
    - {from: web-codedeploy-app, to: green-asg, label: copy blue ASG and launch replacement instances, step: 6}
    - {from: revision-bucket, to: green-asg, label: CodeDeploy agent pulls revision, step: 7}
    - {from: web-codedeploy-app, to: web-alb, label: register green targets and reroute traffic, step: 8}
    - {from: web-codedeploy-app, to: blue-asg, label: deregister and terminate after wait, step: 9}
    - {from: users, to: web-alb, label: HTTPS}
    - {from: web-launch-template, to: green-asg, label: launch template}

- slug: eks-deploy-action-codepipeline
  title: Continuous deployment to Amazon EKS with the CodePipeline EKS deploy action
  category: devops
  tags: [codepipeline, eks, kubernetes, helm, kubectl, ecr, codeconnections]
  source: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-EKS.html
  description: A V2 CodePipeline pulls application source through a CodeConnections GitHub connection, builds and pushes the image with the ECRBuildAndPublish action, then runs the EKSDeploy action, which applies Kubernetes manifests or a Helm chart from the source artifact on CodePipeline-managed CodeBuild compute. The action reaches private clusters through subnets and security groups of the cluster VPC and authenticates with an EKS access entry granted to the pipeline service role.
  containers:
    - region: us-west-2
      groups: [{label: pipeline}]
      vpcs:
        - name: eks
          cidr: 10.30.0.0/16
          subnets:
            - {name: private-a, cidr: 10.30.1.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.30.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_codestarconnections_connection, name: github-connection, in: group:pipeline}
    - {tf: aws_codepipeline, name: eks-pipeline, in: group:pipeline}
    - {tf: aws_ecr_repository, name: service-images, in: group:pipeline}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: group:pipeline}
    - {tf: aws_cloudwatch_log_group, name: pipeline-action-logs, in: group:pipeline}
    - {tf: aws_eks_cluster, name: prod-cluster, in: vpc:eks}
    - {tf: aws_eks_access_entry, name: pipeline-access-entry, in: vpc:eks}
    - {tf: aws_lb, name: ingress-alb, in: subnet:private-a}
    - {tf: aws_iam_role, name: pipeline-service-role, in: region}
  actors: [saas, users]
  flows:
    - {from: saas, to: github-connection, label: GitHub App webhook, step: 1}
    - {from: github-connection, to: eks-pipeline, label: source action, step: 2}
    - {from: eks-pipeline, to: service-images, label: ECRBuildAndPublish pushes image tagged with execution id, step: 3}
    - {from: eks-pipeline, to: pipeline-artifacts, label: artifact store}
    - {from: eks-pipeline, to: prod-cluster, label: "EKSDeploy: helm upgrade / kubectl apply via cluster VPC", step: 4}
    - {from: pipeline-service-role, to: pipeline-access-entry, label: mapped to cluster RBAC}
    - {from: eks-pipeline, to: pipeline-action-logs, label: /aws/codepipeline/<pipeline> logs}
    - {from: prod-cluster, to: service-images, label: pull image, step: 5}
    - {from: users, to: ingress-alb, label: HTTPS}
    - {from: ingress-alb, to: prod-cluster, label: ingress to pods}

- slug: stacksets-multi-account-multi-region-pipeline
  title: Multi-account, multi-Region infrastructure pipeline with CloudFormation StackSets actions
  category: devops
  tags: [codepipeline, cloudformation, stacksets, multi-account, multi-region, organizations]
  source: https://docs.aws.amazon.com/codepipeline/latest/userguide/tutorials-stackset-deployment.html
  description: A pipeline in the administration account takes a zipped template, parameters file and accounts list from an S3 source bucket, then runs a CloudFormationStackSet action to create the stack set and a CloudFormationStackInstances action to roll the stacks out to target accounts and Regions with failure tolerance and concurrency limits. Self-managed permissions use AWSCloudFormationStackSetAdministrationRole in the administration account and AWSCloudFormationStackSetExecutionRole trusted from each target account.
  containers:
    - region: us-east-1
      account: admin
      groups: [{label: pipeline}]
    - region: us-east-1
      account: workload-a
    - region: eu-central-1
      account: workload-b
  elements:
    - {tf: aws_s3_bucket, name: template-source-bucket, in: group:pipeline}
    - {tf: aws_codepipeline, name: stackset-pipeline, in: group:pipeline}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: group:pipeline}
    - {tf: aws_cloudformation_stack_set, name: baseline-stackset, in: account:admin}
    - {tf: aws_iam_role, name: stackset-admin-role, in: account:admin}
    - {tf: aws_cloudformation_stack, name: baseline-stack-a, in: account:workload-a}
    - {tf: aws_iam_role, name: stackset-exec-role-a, in: account:workload-a}
    - {tf: aws_cloudformation_stack, name: baseline-stack-b, in: account:workload-b}
    - {tf: aws_iam_role, name: stackset-exec-role-b, in: account:workload-b}
  actors: [user]
  flows:
    - {from: user, to: template-source-bucket, label: upload template.yml + parameters + accounts zip, step: 1}
    - {from: template-source-bucket, to: stackset-pipeline, label: S3 source action, step: 2}
    - {from: stackset-pipeline, to: pipeline-artifacts, label: artifact store}
    - {from: stackset-pipeline, to: baseline-stackset, label: CloudFormationStackSet action creates/updates stack set, step: 3}
    - {from: stackset-admin-role, to: stackset-exec-role-a, label: sts AssumeRole}
    - {from: stackset-admin-role, to: stackset-exec-role-b, label: sts AssumeRole}
    - {from: baseline-stackset, to: baseline-stack-a, label: CloudFormationStackInstances us-east-1, step: 4}
    - {from: baseline-stackset, to: baseline-stack-b, label: CloudFormationStackInstances eu-central-1, step: 5}

- slug: codepipeline-multi-region-cross-region-actions
  title: Multi-Region application deployment with CodePipeline cross-Region actions
  category: devops
  tags: [codepipeline, multi-region, cross-region actions, cloudformation, codedeploy, ec2]
  source: https://aws.amazon.com/blogs/devops/using-aws-codepipeline-to-perform-multi-region-deployments/
  description: A single pipeline in the primary Region takes application code from an S3 source bucket and declares one artifact store bucket per target Region; CodePipeline replicates the input artifact to the artifact store of each Region before a cross-Region action runs there. Parallel CloudFormation deploy actions in us-west-2, us-east-1 and ap-southeast-2 create or update stacks that provision EC2 instances with the CodeDeploy agent and hand the revision to CodeDeploy, so every Region receives the same release in one execution.
  containers:
    - region: us-west-2
      groups: [{label: primary pipeline}]
    - region: us-east-1
    - region: ap-southeast-2
  elements:
    - {tf: aws_s3_bucket, name: source-bucket, in: group:primary pipeline}
    - {tf: aws_codepipeline, name: multi-region-pipeline, in: group:primary pipeline}
    - {tf: aws_s3_bucket, name: artifact-store-usw2, in: region:us-west-2}
    - {tf: aws_cloudformation_stack, name: app-stack-usw2, in: region:us-west-2}
    - {tf: aws_codedeploy_app, name: app-codedeploy-usw2, in: region:us-west-2}
    - {tf: aws_s3_bucket, name: artifact-store-use1, in: region:us-east-1}
    - {tf: aws_cloudformation_stack, name: app-stack-use1, in: region:us-east-1}
    - {tf: aws_codedeploy_app, name: app-codedeploy-use1, in: region:us-east-1}
    - {tf: aws_s3_bucket, name: artifact-store-apse2, in: region:ap-southeast-2}
    - {tf: aws_cloudformation_stack, name: app-stack-apse2, in: region:ap-southeast-2}
    - {tf: aws_codedeploy_app, name: app-codedeploy-apse2, in: region:ap-southeast-2}
    - {tf: aws_iam_role, name: codepipeline-service-role, in: region:us-west-2}
  actors: [user]
  flows:
    - {from: user, to: source-bucket, label: upload application revision zip, step: 1}
    - {from: source-bucket, to: multi-region-pipeline, label: S3 source action, step: 2}
    - {from: multi-region-pipeline, to: artifact-store-usw2, label: artifact store (primary), step: 3}
    - {from: artifact-store-usw2, to: artifact-store-use1, label: CodePipeline replicates artifact, step: 4}
    - {from: artifact-store-usw2, to: artifact-store-apse2, label: CodePipeline replicates artifact, step: 4}
    - {from: multi-region-pipeline, to: app-stack-usw2, label: CloudFormation deploy action, step: 5}
    - {from: multi-region-pipeline, to: app-stack-use1, label: cross-Region CloudFormation action, step: 5}
    - {from: multi-region-pipeline, to: app-stack-apse2, label: cross-Region CloudFormation action, step: 5}
    - {from: app-stack-usw2, to: app-codedeploy-usw2, label: EC2 instances with CodeDeploy agent, step: 6}
    - {from: app-stack-use1, to: app-codedeploy-use1, label: EC2 instances with CodeDeploy agent, step: 6}
    - {from: app-stack-apse2, to: app-codedeploy-apse2, label: EC2 instances with CodeDeploy agent, step: 6}
    - {from: codepipeline-service-role, to: multi-region-pipeline, label: service role}

- slug: cdk-pipelines-self-mutating-multi-account
  title: CDK Pipelines self-mutating pipeline deploying stages to multiple accounts
  category: devops
  tags: [cdk, codepipeline, codebuild, self-mutation, multi-account, cloudformation]
  source: https://docs.aws.amazon.com/cdk/v2/guide/cdk_pipeline.html
  description: A CDK Pipelines construct provisions a CodePipeline whose synth step runs cdk synth in CodeBuild, a self-mutate step that updates the pipeline itself when its definition changes, and asset publishing steps that push Docker images and file assets to the bootstrapped buckets and ECR repositories of each target environment. Application stages then deploy CloudFormation stacks into the test and production accounts through the CDK bootstrap roles, optionally gated by manual approvals and grouped into waves.
  containers:
    - region: us-east-1
      account: tooling
      groups: [{label: pipeline}]
    - region: us-east-1
      account: test
    - region: us-east-1
      account: prod
  elements:
    - {tf: aws_codestarconnections_connection, name: github-connection, in: group:pipeline}
    - {tf: aws_codepipeline, name: cdk-pipeline, in: group:pipeline}
    - {tf: aws_codebuild_project, name: synth-project, in: group:pipeline}
    - {tf: aws_codebuild_project, name: self-mutate-project, in: group:pipeline}
    - {tf: aws_codebuild_project, name: asset-publish-project, in: group:pipeline}
    - {tf: aws_s3_bucket, name: cdk-staging-bucket, in: account:tooling}
    - {tf: aws_ecr_repository, name: cdk-container-assets, in: account:tooling}
    - {tf: aws_cloudformation_stack, name: app-stack-test, in: account:test}
    - {tf: aws_iam_role, name: cdk-deploy-role-test, in: account:test}
    - {tf: aws_cloudformation_stack, name: app-stack-prod, in: account:prod}
    - {tf: aws_iam_role, name: cdk-deploy-role-prod, in: account:prod}
  actors: [saas, user]
  flows:
    - {from: user, to: saas, label: push CDK app to GitHub, step: 1}
    - {from: saas, to: github-connection, label: GitHub App event, step: 2}
    - {from: github-connection, to: cdk-pipeline, label: source action, step: 3}
    - {from: cdk-pipeline, to: synth-project, label: cdk synth produces cloud assembly, step: 4}
    - {from: cdk-pipeline, to: self-mutate-project, label: cdk deploy PipelineStack (self-mutation), step: 5}
    - {from: cdk-pipeline, to: asset-publish-project, label: cdk-assets publish, step: 6}
    - {from: asset-publish-project, to: cdk-staging-bucket, label: file assets}
    - {from: asset-publish-project, to: cdk-container-assets, label: docker image assets}
    - {from: cdk-pipeline, to: app-stack-test, label: "stage Test: CloudFormation deploy", step: 7}
    - {from: cdk-pipeline, to: app-stack-prod, label: "stage Prod: after manual approval", step: 8}
    - {from: cdk-deploy-role-test, to: app-stack-test, label: cfn-exec role}
    - {from: cdk-deploy-role-prod, to: app-stack-prod, label: cfn-exec role}

- slug: github-actions-oidc-federated-deploy
  title: GitHub Actions deploying to AWS with OIDC federation instead of access keys
  category: devops
  tags: [github actions, oidc, iam, sts, ecr, ecs, keyless]
  source: https://aws.amazon.com/blogs/security/use-iam-roles-to-connect-github-actions-to-actions-in-aws/
  description: An IAM OpenID Connect identity provider trusts token.actions.githubusercontent.com, and an IAM role trust policy restricts sts AssumeRoleWithWebIdentity to a specific repository and branch through the sub and aud claims. The workflow uses aws-actions/configure-aws-credentials to exchange the GitHub-issued JWT for short-lived credentials, then pushes an image to ECR and updates an ECS service, so no long-lived IAM user keys are stored as GitHub secrets.
  containers:
    - region: us-east-1
      groups: [{label: identity}, {label: deployment target}]
  elements:
    - {tf: aws_iam_openid_connect_provider, name: github-oidc-provider, in: group:identity}
    - {tf: aws_iam_role, name: github-deploy-role, in: group:identity}
    - {tf: aws_ecr_repository, name: app-images, in: group:deployment target}
    - {tf: aws_ecs_cluster, name: app-cluster, in: group:deployment target}
    - {tf: aws_ecs_service, name: app-service, in: group:deployment target}
    - {tf: aws_s3_bucket, name: static-assets, in: group:deployment target}
    - {tf: aws_cloudtrail, name: api-audit-trail, in: region}
  actors: [saas, user]
  flows:
    - {from: user, to: saas, label: push to main, step: 1}
    - {from: saas, to: github-oidc-provider, label: "workflow requests JWT (aud: sts.amazonaws.com)", step: 2}
    - {from: saas, to: github-deploy-role, label: "sts:AssumeRoleWithWebIdentity scoped by repo:org/repo:ref", step: 3}
    - {from: saas, to: app-images, label: docker push with temporary credentials, step: 4}
    - {from: saas, to: app-service, label: aws ecs update-service with new task definition, step: 5}
    - {from: saas, to: static-assets, label: aws s3 sync}
    - {from: github-deploy-role, to: api-audit-trail, label: role session logged}

- slug: devsecops-pipeline-sca-sast-dast-security-hub
  title: DevSecOps pipeline with SCA, SAST and DAST scans reporting to Security Hub
  category: devops
  tags: [devsecops, codepipeline, codebuild, security hub, sast, dast, sca, elastic beanstalk]
  source: https://aws.amazon.com/blogs/devops/building-end-to-end-aws-devsecops-ci-cd-pipeline-with-open-source-sca-sast-and-dast-tools/
  description: A CodeCommit push starts a CodePipeline in which CodeBuild projects run OWASP Dependency-Check (SCA) and SonarQube or PHPStan (SAST) in parallel, reading scanner secrets from Parameter Store; a Lambda function converts the scan reports to the AWS Security Finding Format and imports them into Security Hub, failing the stage when vulnerabilities exceed the threshold. Clean builds are deployed by CodeDeploy to an Elastic Beanstalk staging application where a CodeBuild project runs OWASP ZAP (DAST), and after a manual approval a second CodeDeploy stage promotes the release to production; EventBridge rules publish pipeline state changes to an SNS topic that emails the team, CloudWatch Logs keeps the build logs, and IAM roles, CloudTrail and AWS Config provide audit and governance.
  containers:
    - region: us-east-1
      groups: [{label: pipeline, at: [2, 1, 1, 4]}, {label: security, at: [3, 2, 1, 3]}, {label: environments, at: [1, 5, 2, 1]}, {label: audit and governance, at: [3, 1]}]
  elements:
    - {tf: aws_sns_topic, name: pipeline-notifications, in: region, at: [1, 1]}
    - {tf: aws_cloudwatch_event_rule, name: build-state-rule, in: region, at: [1, 2]}
    - {tf: aws_cloudwatch_log_group, name: build-logs, in: region, at: [1, 3]}
    - {tf: aws_ssm_parameter, name: scanner-credentials, in: region, at: [1, 4]}
    - {tf: aws_codepipeline, name: devsecops-pipeline, in: group:pipeline, at: [1, 1, 1, 6]}
    - {tf: aws_codecommit_repository, name: app-repo, in: group:pipeline, at: [2, 1]}
    - {tf: aws_codebuild_project, name: sca-dependency-check, in: group:pipeline, at: [2, 2]}
