          cidr: 10.60.0.0/16
          subnets:
            - {name: private-a, cidr: 10.60.1.0/24, az: a, public: false}
            - {name: public-a, cidr: 10.60.0.0/24, az: a, public: true}
  elements:
    - {tf: aws_lb, name: api-alb, in: subnet:public-a}
