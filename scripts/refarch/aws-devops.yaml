- slug: cloudwatch-synthetics-canary-endpoint-monitoring
  title: Endpoint and user-journey monitoring with CloudWatch Synthetics canaries
  category: observability
  tags: [cloudwatch synthetics, canary, lambda, x-ray, alarms, vpc]
  source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
  description: Synthetics canaries are Node.js, Python or Java scripts that CloudWatch runs as Lambda functions on a rate or cron schedule to exercise a public API and a browser user journey with Playwright or Puppeteer, and an in-VPC canary checks an internal endpoint. Each run stores HAR files, screenshots and logs in an S3 artifact bucket and publishes SuccessPercent and Duration metrics in the CloudWatchSynthetics namespace; alarms on those metrics notify SNS, and X-Ray active tracing places the canaries on the trace map next to the services they call.
  containers:
    - region: us-east-1
      groups: [{label: synthetic monitoring}]
      vpcs:
        - name: app
          cidr: 10.80.0.0/16
          subnets:
            - {name: private-a, cidr: 10.80.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_synthetics_canary, name: api-heartbeat-canary, in: group:synthetic monitoring}
    - {tf: aws_synthetics_canary, name: checkout-journey-canary, in: group:synthetic monitoring}
    - {tf: aws_synthetics_canary, name: internal-service-canary, in: subnet:private-a}
    - {tf: aws_s3_bucket, name: canary-artifacts, in: group:synthetic monitoring}
    - {tf: aws_cloudwatch_metric_alarm, name: canary-success-alarm, in: group:synthetic monitoring}
    - {tf: aws_sns_topic, name: availability-alerts, in: group:synthetic monitoring}
    - {tf: aws_cloudwatch_dashboard, name: availability-dashboard, in: group:synthetic monitoring}
    - {tf: aws_iam_role, name: canary-execution-role, in: region}
    - {tf: aws_lb, name: public-api-alb, in: vpc:app}
    - {tf: aws_lb, name: internal-service-alb, in: subnet:private-a}
  actors: [internet]
  flows:
    - {from: api-heartbeat-canary, to: public-api-alb, label: GET /health every 1 minute, step: 1}
    - {from: checkout-journey-canary, to: public-api-alb, label: headless browser flow with screenshots, step: 2}
    - {from: internal-service-canary, to: internal-service-alb, label: in-VPC HTTP check, step: 3}
    - {from: api-heartbeat-canary, to: canary-artifacts, label: HAR, screenshots, logs, step: 4}
    - {from: api-heartbeat-canary, to: canary-success-alarm, label: SuccessPercent metric, step: 5}
    - {from: canary-success-alarm, to: availability-alerts, label: ALARM action, step: 6}
    - {from: canary-execution-role, to: api-heartbeat-canary, label: execution role}
    - {from: checkout-journey-canary, to: availability-dashboard, label: Duration and SuccessPercent widgets}
    - {from: internet, to: public-api-alb, label: real user traffic}

- slug: incident-manager-alarm-response-plan-runbook
  title: Automated incident response with CloudWatch alarms, EventBridge and Incident Manager
  category: devops
  tags: [incident manager, eventbridge, cloudwatch alarms, runbook, systems manager automation, on-call]
  source: https://docs.aws.amazon.com/incident-manager/latest/userguide/incident-creation.html
  description: A CloudWatch alarm with a Systems Manager action and an EventBridge rule targeting a response plan both create incidents in Incident Manager, which deduplicates them, records the involved resources and opens a linked OpsItem in OpsCenter. The response plan engages on-call contacts through an escalation plan, posts to a chat channel via SNS and AWS Chatbot, and automatically starts a Systems Manager Automation runbook that receives the incident ARN and involved resource ARNs as parameters to remediate the fault.
  containers:
    - region: us-east-1
      groups: [{label: detection}, {label: incident response}, {label: workload}]
  elements:
    - {tf: aws_cloudwatch_metric_alarm, name: api-5xx-alarm, in: group:detection}
    - {tf: aws_cloudwatch_event_rule, name: health-event-rule, in: group:detection}
    - {tf: aws_ssmincidents_response_plan, name: sev2-response-plan, in: group:incident response}
    - {tf: aws_ssmcontacts_contact, name: primary-oncall, in: group:incident response}
    - {tf: aws_ssmcontacts_plan, name: escalation-plan, in: group:incident response}
    - {tf: aws_sns_topic, name: incident-chat-topic, in: group:incident response}
    - {tf: aws_chatbot_slack_channel_configuration, name: ops-slack-channel, in: group:incident response}
    - {tf: aws_ssm_document, name: restart-service-runbook, in: group:incident response}
    - {tf: aws_iam_role, name: runbook-service-role, in: region}
    - {tf: aws_ecs_service, name: checkout-service, in: group:workload}
  actors: [users]
  flows:
    - {from: checkout-service, to: api-5xx-alarm, label: HTTPCode_Target_5XX metric, step: 1}
    - {from: api-5xx-alarm, to: sev2-response-plan, label: "Systems Manager action: create incident", step: 2}
    - {from: health-event-rule, to: sev2-response-plan, link: aws_cloudwatch_event_target, label: AWS Health event}
    - {from: sev2-response-plan, to: escalation-plan, label: start engagement, step: 3}
    - {from: escalation-plan, to: primary-oncall, label: page via SMS / voice / email, step: 4}
    - {from: sev2-response-plan, to: incident-chat-topic, label: incident updates, step: 5}
    - {from: incident-chat-topic, to: ops-slack-channel, link: aws_sns_topic_subscription}
    - {from: sev2-response-plan, to: restart-service-runbook, label: StartAutomationExecution with involved resources, step: 6}
    - {from: runbook-service-role, to: restart-service-runbook, label: AssumeRole}
    - {from: restart-service-runbook, to: checkout-service, label: force new deployment, step: 7}
    - {from: users, to: checkout-service, label: HTTPS}

- slug: cur-athena-quicksight-cost-observability
  title: Cost observability with Cost and Usage Reports, Athena and QuickSight
  category: analytics-bi
  tags: [cost and usage report, athena, glue, quicksight, finops, cost intelligence]
  source: https://docs.aws.amazon.com/cur/latest/userguide/cur-query-athena.html
  description: A Cost and Usage Report configured for Athena integration is delivered in Parquet to an S3 bucket, and the CloudFormation template shipped alongside it creates a Glue database, a Glue crawler and two Lambda functions that are triggered by S3 event notifications to refresh partitions whenever a new report lands. Athena queries the resulting table through a dedicated workgroup and QuickSight connects to Athena as a data source to build cost dashboards, with query results and SPICE refreshes scheduled daily.
  containers:
    - region: us-east-1
      groups: [{label: billing export}, {label: query and visualize}]
  elements:
    - {tf: aws_cur_report_definition, name: hourly-cur-parquet, in: group:billing export}
    - {tf: aws_s3_bucket, name: cur-bucket, in: group:billing export}
    - {tf: aws_lambda_function, name: cur-initializer, in: group:billing export}
    - {tf: aws_lambda_function, name: cur-crawler-trigger, in: group:billing export}
    - {tf: aws_glue_crawler, name: cur-crawler, in: group:billing export}
    - {tf: aws_glue_catalog_database, name: athenacurcfn-db, in: group:query and visualize}
    - {tf: aws_athena_workgroup, name: cost-analytics-workgroup, in: group:query and visualize}
    - {tf: aws_s3_bucket, name: athena-results-bucket, in: group:query and visualize}
    - {tf: aws_quicksight_data_source, name: athena-cost-datasource, in: group:query and visualize}
    - {tf: aws_iam_role, name: glue-crawler-role, in: region}
  actors: [user, users]
  flows:
    - {from: hourly-cur-parquet, to: cur-bucket, label: daily Parquet delivery, step: 1}
    - {from: cur-bucket, to: cur-crawler-trigger, label: S3 event notification, step: 2}
    - {from: cur-crawler-trigger, to: cur-crawler, label: StartCrawler, step: 3}
    - {from: cur-crawler, to: athenacurcfn-db, label: update table and partitions, step: 4}
    - {from: glue-crawler-role, to: cur-crawler, label: crawler role}
    - {from: cur-initializer, to: cur-crawler, label: initial crawl on stack create}
    - {from: cost-analytics-workgroup, to: athenacurcfn-db, label: SQL over CUR table, step: 5}
    - {from: cost-analytics-workgroup, to: athena-results-bucket, label: query results}
    - {from: athena-cost-datasource, to: cost-analytics-workgroup, label: QuickSight Athena connector, step: 6}
    - {from: user, to: cost-analytics-workgroup, label: ad hoc cost queries}
    - {from: users, to: athena-cost-datasource, label: cost dashboards (SPICE), step: 7}
