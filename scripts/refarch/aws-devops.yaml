- slug: ecr-build-publish-container-image-pipeline
  title: Container image pipeline with the ECRBuildAndPublish action and ECS deploy
  category: devops
  tags: [codepipeline, ecr, docker, container image, ecs, codeconnections, inspector]
  source: https://docs.aws.amazon.com/codepipeline/latest/userguide/tutorials-ecr-build-publish.html
  description: A V2 pipeline sources a repository containing a Dockerfile and imagedefinitions.json through a GitHub App connection, then the managed ECRBuildAndPublish build action logs in to ECR, builds the image on CodePipeline-managed CodeBuild compute and pushes it without a buildspec. An Amazon ECS standard deploy action registers a new task definition revision with the pushed image URI and updates the service; ECR enhanced scanning with Amazon Inspector evaluates each pushed image for vulnerabilities.
  containers:
    - region: us-east-1
      groups: [{label: pipeline}, {label: runtime}]
  elements:
    - {tf: aws_codestarconnections_connection, name: github-connection, in: group:pipeline}
    - {tf: aws_codepipeline, name: image-pipeline, in: group:pipeline}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: group:pipeline}
    - {tf: aws_ecr_repository, name: hello-world-images, in: group:pipeline}
    - {tf: aws_inspector2_enabler, name: ecr-enhanced-scanning, in: group:pipeline}
    - {tf: aws_cloudwatch_log_group, name: build-action-logs, in: group:pipeline}
    - {tf: aws_ecs_cluster, name: web-cluster, in: group:runtime}
    - {tf: aws_ecs_service, name: hello-world-service, in: group:runtime}
    - {tf: aws_lb, name: web-alb, in: group:runtime}
  actors: [saas, users]
  flows:
    - {from: saas, to: github-connection, label: commit with Dockerfile + imagedefinitions.json, step: 1}
    - {from: github-connection, to: image-pipeline, label: source action, step: 2}
    - {from: image-pipeline, to: hello-world-images, label: ECRBuildAndPublish docker build and push, step: 3}
    - {from: image-pipeline, to: build-action-logs, label: managed compute logs}
    - {from: ecr-enhanced-scanning, to: hello-world-images, label: Inspector scan on push, step: 4}
    - {from: image-pipeline, to: hello-world-service, label: Amazon ECS deploy action (new task definition revision), step: 5}
    - {from: hello-world-service, to: hello-world-images, label: pull image, step: 6}
    - {from: image-pipeline, to: pipeline-artifacts, label: artifacts}
    - {from: users, to: web-alb, label: HTTP}
    - {from: web-alb, to: hello-world-service, label: forward}

- slug: terraform-module-test-pipeline-checkov
  title: Terraform CI pipeline with Checkov static analysis and terraform test
  category: devops
  tags: [terraform, codepipeline, codebuild, checkov, terraform test, infrastructure testing]
  source: https://aws.amazon.com/blogs/devops/terraform-ci-cd-and-testing-on-aws-with-the-new-terraform-test-framework/
  description: Pushes to a CodeCommit repository holding a Terraform module trigger a CodePipeline that stores the source in an artifacts S3 bucket and runs two CodeBuild projects, the first pulling the bridgecrew/checkov image from Docker Hub to run Checkov static analysis and the second pulling the hashicorp/terraform image to run terraform init, terraform validate and terraform test, which creates, asserts and destroys ephemeral resources. Test state is managed by Terraform for the duration of the run, and a failing check blocks promotion of the module.
  containers:
    - region: us-east-1
      groups: [{label: pipeline, at: [1, 1]}]
  elements:
    - {tf: aws_codecommit_repository, name: terraform-module-repo, in: group:pipeline, at: [1, 1, 2, 1]}
    - {tf: aws_codepipeline, name: terraform-ci-pipeline, in: group:pipeline, at: [1, 2, 1, 2]}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: group:pipeline, at: [1, 4]}
    - {tf: aws_codebuild_project, name: checkov-static-analysis, in: group:pipeline, at: [2, 2]}
    - {tf: aws_codebuild_project, name: terraform-test-runner, in: group:pipeline, at: [2, 3]}
  actors: [{type: user, name: developer, at: [1, 1]}, {type: saas, name: Docker Hub checkov image, at: [2, 2]}, {type: saas, name: Docker Hub terraform image, at: [2, 3]}]
  flows:
    - {from: developer, to: terraform-module-repo, label: git push module + tests/*.tftest.hcl, step: 1}
    - {from: terraform-module-repo, to: terraform-ci-pipeline, label: source action, step: 2}
    - {from: terraform-ci-pipeline, to: pipeline-artifacts, label: artifacts}
    - {from: terraform-ci-pipeline, to: checkov-static-analysis, label: checkov -d ., step: 3}
    - {from: terraform-ci-pipeline, to: terraform-test-runner, label: terraform init / validate / test, step: 4}
    - {from: Docker Hub checkov image, to: checkov-static-analysis, label: pull bridgecrew/checkov image}
    - {from: Docker Hub terraform image, to: terraform-test-runner, label: pull hashicorp/terraform image}

- slug: ssm-patch-policy-quick-setup-organization
  title: Organization-wide EC2 patching with Systems Manager patch policies
  category: devops
  tags: [systems manager, patch manager, quick setup, state manager, compliance, organizations]
  source: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-policies.html
  description: A Quick Setup patch policy defined in the management account creates State Manager associations in every target account and Region that run the AWS-RunPatchBaseline document on separate scan and install schedules against the patch baseline selected per operating system. Patch compliance results are reported per account-Region pair, exported as CSV to an S3 bucket, and can be forwarded to Security Hub, while custom baselines are shared through an S3 bucket of baseline overrides.
  containers:
    - region: us-east-1
      account: management
      groups: [{label: patch policy}]
    - region: us-east-1
      account: workload
      vpcs:
        - name: app
          cidr: 10.40.0.0/16
          subnets:
            - {name: private-a, cidr: 10.40.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ssm_patch_baseline, name: linux-security-baseline, in: group:patch policy}
    - {tf: aws_ssm_patch_baseline, name: windows-baseline, in: group:patch policy}
    - {tf: aws_s3_bucket, name: baseline-overrides-bucket, in: group:patch policy}
    - {tf: aws_s3_bucket, name: compliance-reports-bucket, in: group:patch policy}
    - {tf: aws_ssm_association, name: scan-association, in: account:workload}
    - {tf: aws_ssm_association, name: install-association, in: account:workload}
    - {tf: aws_ssm_document, name: aws-runpatchbaseline, in: account:workload}
    - {tf: aws_instance, name: app-server, in: subnet:private-a}
    - {tf: aws_iam_role, name: ssm-instance-role, in: account:workload}
  actors: [user]
  flows:
    - {from: user, to: linux-security-baseline, label: define approval rules in Quick Setup, step: 1}
    - {from: linux-security-baseline, to: baseline-overrides-bucket, label: baseline override JSON, step: 2}
    - {from: baseline-overrides-bucket, to: scan-association, label: policy deployed via StackSets to each account-Region, step: 3}
    - {from: scan-association, to: aws-runpatchbaseline, label: "Operation=Scan daily", step: 4}
    - {from: install-association, to: aws-runpatchbaseline, label: "Operation=Install weekly", step: 5}
    - {from: aws-runpatchbaseline, to: app-server, label: SSM Agent runs patch command, step: 6}
    - {from: ssm-instance-role, to: app-server, label: instance profile}
    - {from: app-server, to: compliance-reports-bucket, label: patch compliance CSV report, step: 7}
    - {from: windows-baseline, to: baseline-overrides-bucket, label: baseline override JSON}

- slug: cloudwatch-cross-account-observability-oam
  title: Central monitoring account with CloudWatch cross-account observability
  category: observability
  tags: [cloudwatch, oam, cross-account, dashboards, alarms, logs, x-ray]
  source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
  description: A monitoring account creates an Observability Access Manager sink, and source accounts across the organization create links to it that share CloudWatch metrics, log groups, X-Ray traces and Application Signals data without copying it. Dashboards, metric alarms and Logs Insights queries in the monitoring account then span every linked account, and alarm actions publish to an SNS topic for the operations team.
  containers:
    - region: eu-west-1
      account: monitoring
      groups: [{label: central observability}]
    - region: eu-west-1
      account: workload-a
    - region: eu-west-1
      account: workload-b
  elements:
    - {tf: aws_oam_sink, name: observability-sink, in: group:central observability}
    - {tf: aws_cloudwatch_dashboard, name: fleet-dashboard, in: group:central observability}
    - {tf: aws_cloudwatch_metric_alarm, name: cross-account-error-alarm, in: group:central observability}
    - {tf: aws_sns_topic, name: ops-alerts, in: group:central observability}
    - {tf: aws_oam_link, name: link-a, in: account:workload-a}
    - {tf: aws_lambda_function, name: order-service-a, in: account:workload-a}
    - {tf: aws_cloudwatch_log_group, name: order-service-a-logs, in: account:workload-a}
    - {tf: aws_oam_link, name: link-b, in: account:workload-b}
    - {tf: aws_ecs_cluster, name: web-cluster-b, in: account:workload-b}
    - {tf: aws_cloudwatch_log_group, name: web-cluster-b-logs, in: account:workload-b}
  actors: [user]
  flows:
    - {from: order-service-a, to: order-service-a-logs, label: metrics, logs, traces, step: 1}
    - {from: web-cluster-b, to: web-cluster-b-logs, label: metrics, logs, traces, step: 1}
    - {from: link-a, to: observability-sink, label: share metrics, logs, traces, step: 2}
    - {from: link-b, to: observability-sink, label: share metrics, logs, traces, step: 2}
    - {from: observability-sink, to: fleet-dashboard, label: cross-account widgets, step: 3}
    - {from: observability-sink, to: cross-account-error-alarm, label: alarm on source-account metric, step: 4}
    - {from: cross-account-error-alarm, to: ops-alerts, label: ALARM action, step: 5}
    - {from: user, to: fleet-dashboard, label: single-pane dashboard}

- slug: xray-serverless-api-tracing
  title: Distributed tracing of a serverless API with AWS X-Ray active tracing
  category: observability
  tags: [x-ray, lambda, api gateway, dynamodb, sqs, tracing, service map]
  source: https://docs.aws.amazon.com/xray/latest/devguide/xray-services-lambda.html
  description: API Gateway with X-Ray tracing enabled samples incoming requests and propagates the trace header to a Lambda function with active tracing, where the Lambda-managed daemon emits the invocation segment and the X-Ray SDK records subsegments for DynamoDB and SQS calls. A downstream Lambda consumer of the queue is linked to the producer trace so the service map and trace timeline show the whole request path, and an X-Ray group filters traces with faults for a CloudWatch alarm.
  containers:
    - region: us-east-1
      groups: [{label: application}, {label: tracing}]
  elements:
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: group:application}
    - {tf: aws_lambda_function, name: create-order, in: group:application}
    - {tf: aws_dynamodb_table, name: orders-table, in: group:application}
    - {tf: aws_sqs_queue, name: fulfilment-queue, in: group:application}
    - {tf: aws_lambda_function, name: fulfil-order, in: group:application}
    - {tf: aws_xray_sampling_rule, name: api-sampling-rule, in: group:tracing}
    - {tf: aws_xray_group, name: orders-faults-group, in: group:tracing}
    - {tf: aws_cloudwatch_metric_alarm, name: fault-rate-alarm, in: group:tracing}
    - {tf: aws_sns_topic, name: oncall-alerts, in: group:tracing}
  actors: [client]
  flows:
    - {from: client, to: orders-api, label: POST /orders, step: 1}
    - {from: orders-api, to: create-order, label: invoke with X-Amzn-Trace-Id, step: 2}
    - {from: create-order, to: orders-table, label: PutItem (SDK subsegment), step: 3}
    - {from: create-order, to: fulfilment-queue, label: SendMessage with trace header, step: 4}
    - {from: fulfilment-queue, to: fulfil-order, link: aws_lambda_event_source_mapping, step: 5}
    - {from: api-sampling-rule, to: orders-api, label: sampling decision}
    - {from: create-order, to: orders-faults-group, label: "segments (filter: fault = true)", step: 6}
    - {from: orders-faults-group, to: fault-rate-alarm, label: ApproximateTraceCount metric, step: 7}
    - {from: fault-rate-alarm, to: oncall-alerts, label: ALARM action}

- slug: amp-amg-eks-prometheus-monitoring
  title: EKS metrics with Amazon Managed Service for Prometheus and Amazon Managed Grafana
  category: observability
  tags: [prometheus, grafana, eks, managed collector, remote write, alertmanager]
  source: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-collector.html
  description: An AWS managed collector (scraper) attached to the EKS cluster discovers Prometheus-compatible endpoints such as the API server, kube-state-metrics and application pods, and remote-writes the samples into an Amazon Managed Service for Prometheus workspace through ENIs in the cluster subnets and a VPC endpoint, with no agent to operate. Amazon Managed Grafana queries the workspace with SigV4 through the AWS data source configuration, and workspace alerting rules route firing alerts to an SNS topic.
  containers:
    - region: us-west-2
      groups: [{label: managed observability}]
      vpcs:
        - name: eks
          cidr: 10.50.0.0/16
          subnets:
            - {name: private-a, cidr: 10.50.1.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.50.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_eks_cluster, name: platform-cluster, in: vpc:eks}
    - {tf: aws_prometheus_scraper, name: eks-managed-collector, in: subnet:private-a}
    - {tf: aws_vpc_endpoint, name: aps-workspaces-endpoint, in: subnet:private-b}
    - {tf: aws_prometheus_workspace, name: platform-metrics, in: group:managed observability}
    - {tf: aws_grafana_workspace, name: platform-grafana, in: group:managed observability}
    - {tf: aws_sns_topic, name: prometheus-alerts, in: group:managed observability}
    - {tf: aws_iam_role, name: grafana-workspace-role, in: region}
    - {tf: aws_cloudwatch_log_group, name: scraper-vended-logs, in: region}
  actors: [user, idp]
  flows:
    - {from: eks-managed-collector, to: platform-cluster, label: scrape /metrics via ENIs (access entry), step: 1}
    - {from: eks-managed-collector, to: aps-workspaces-endpoint, label: remote_write, step: 2}
    - {from: aps-workspaces-endpoint, to: platform-metrics, label: PrivateLink to aps-workspaces, step: 3}
    - {from: platform-grafana, to: platform-metrics, label: PromQL query with SigV4, step: 4}
    - {from: grafana-workspace-role, to: platform-grafana, label: aps:QueryMetrics}
    - {from: platform-metrics, to: prometheus-alerts, label: alert manager definition routes alerts, step: 5}
    - {from: eks-managed-collector, to: scraper-vended-logs, label: vended logs}
    - {from: idp, to: platform-grafana, label: SAML / IAM Identity Center sign-in}
    - {from: user, to: platform-grafana, label: dashboards, step: 6}

- slug: adot-ecs-sidecar-traces-metrics
  title: OpenTelemetry collection on Amazon ECS with the ADOT collector sidecar
  category: observability
  tags: [adot, opentelemetry, ecs, x-ray, cloudwatch, prometheus, sidecar]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/trace-data.html
  description: Each ECS task definition adds an aws-otel-collector sidecar container that receives OTLP spans and metrics from the instrumented application container over localhost, and its configuration is loaded from an SSM Parameter Store parameter. The collector exports traces to AWS X-Ray, application metrics to CloudWatch (EMF) or to an Amazon Managed Service for Prometheus workspace, and its own logs to CloudWatch Logs through the task role permissions.
