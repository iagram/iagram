    - {from: hub-inbound-policy, to: hub-peering-zone-project1, label: DNS peer project1.gcp.example.com, step: 7}
    - {from: hub-inbound-policy, to: hub-peering-zone-project2, label: DNS peer project2.gcp.example.com, step: 7}
