- slug: cloud-dns-private-zones
  title: Cloud DNS private zones for internal names
  category: networking
  tags: [cloud dns, private zone, reverse lookup zone, service directory zone, internal dns]
  source: https://docs.cloud.google.com/dns/docs/zones/zones-overview
  description: In a Shared VPC organization each service project owns a private managed zone (service1.example.com, service2.example.com) that is bound across projects to the Shared VPC network of the host project, so instances in the shared subnet resolve internal names from both zones. The network admin grants the dns.networks.bindPrivateDNSZone IAM permission on the host project, and each application admin holds dns.managedZones.create on their own service project to create the zone and attach it to the shared network.
  containers:
    - project: host-project
      region: us-central1
      account_at: [2, 1, 2, 1]
      vpcs:
        - name: shared-vpc
          cidr: 10.170.0.0/16
          at: [1, 1]
          subnets:
            - {name: shared-subnet, cidr: 10.170.0.0/24, region: us-central1, at: [1, 1]}
    - project: service-project1
      region: us-central1
      account_at: [2, 2]
    - project: service-project2
      region: us-central1
      account_at: [3, 2]
  elements:
    - {tf: google_dns_managed_zone, name: service1-private-zone, in: project:service-project1, at: [1, 1]}
    - {tf: google_dns_managed_zone, name: service2-private-zone, in: project:service-project2, at: [1, 1]}
  actors: [{type: user, name: Network admin, at: [1, 2]}, {type: user, name: App1 admin, at: [2, 3]}, {type: user, name: App2 admin, at: [3, 3]}]
  flows:
    - {from: Network admin, to: project:host-project, label: gives dns.networks.bindPrivateDNSZone IAM permission on the host project, step: 1}
    - {from: App1 admin, to: service1-private-zone, label: gets dns.managedZones.create on service project1 and creates the zone, step: 2}
    - {from: App2 admin, to: service2-private-zone, label: gets dns.managedZones.create on service project2 and creates the zone, step: 2}
    - {from: service1-private-zone, to: vpc:shared-vpc, label: zone association to the Shared VPC network, step: 3}
    - {from: service2-private-zone, to: vpc:shared-vpc, label: zone association to the Shared VPC network, step: 3}

- slug: cross-cloud-interconnect-multicloud
  title: Cross-Cloud Interconnect to another cloud provider
  category: networking
  tags: [cross-cloud interconnect, multicloud, aws, azure, vlan attachment, cloud router, redundancy]
  source: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/cci-overview
  description: Google provisions dedicated physical ports between its network and a remote cloud provider such as AWS or Azure in colocation facilities; in each of two metropolitan areas the customer orders a primary and a redundant Cross-Cloud Interconnect connection in separate edge availability domains, each linking a Google router to a router run by the remote cloud. Cloud Routers in two regions of the VPC run BGP over VLAN attachments on those connections so Compute Engine VMs reach the remote virtual network with 99.99% availability, while a single metro pair gives 99.9%.
  containers:
    - datacenter: remote-cloud
      at: [1, 2]
    - project: net-hub
      region: us-east4
      account_at: [1, 1]
      groups: [{label: Colocation facility in first metro, at: [1, 2]}, {label: Colocation facility in second metro, at: [2, 2]}]
      vpcs:
        - name: multicloud-vpc
          cidr: 10.180.0.0/16
          at: [1, 1, 2, 1]
          subnets:
            - {name: region-1, cidr: 10.180.0.0/24, region: us-east4, at: [1, 1]}
            - {name: region-2, cidr: 10.180.1.0/24, region: us-west2, at: [2, 1]}
  elements:
    - {tf: google_compute_router, name: cloud-router-region-1, in: subnet:region-1, at: [1, 1]}
    - {tf: google_compute_router, name: cloud-router-region-2, in: subnet:region-2, at: [1, 1]}
    - {tf: google_compute_instance, name: compute-engine-vms, in: subnet:region-2, at: [2, 1]}
    - {tf: google_compute_interconnect, name: google-router-metro1-ead1, in: group:Colocation facility in first metro, at: [1, 1]}
    - {tf: google_compute_interconnect, name: google-router-metro1-ead2, in: group:Colocation facility in first metro, at: [2, 1]}
    - {tf: google_compute_interconnect, name: google-router-metro2-ead1, in: group:Colocation facility in second metro, at: [1, 1]}
    - {tf: google_compute_interconnect, name: google-router-metro2-ead2, in: group:Colocation facility in second metro, at: [2, 1]}
  actors: []
  flows:
    - {from: cloud-router-region-1, to: google-router-metro1-ead1, label: VLAN attachment and BGP session, step: 1}
    - {from: cloud-router-region-1, to: google-router-metro1-ead2, label: VLAN attachment and BGP session, step: 1}
    - {from: cloud-router-region-2, to: google-router-metro2-ead1, label: VLAN attachment and BGP session, step: 1}
    - {from: cloud-router-region-2, to: google-router-metro2-ead2, label: VLAN attachment and BGP session, step: 1}
    - {from: google-router-metro1-ead1, to: datacenter, label: primary Cross-Cloud Interconnect connection to a router run by the remote cloud (EAD 1), step: 2}
    - {from: google-router-metro1-ead2, to: datacenter, label: redundant Cross-Cloud Interconnect connection to a router run by the remote cloud (EAD 2), step: 2}
    - {from: google-router-metro2-ead1, to: datacenter, label: primary Cross-Cloud Interconnect connection to a router run by the remote cloud (EAD 1), step: 2}
    - {from: google-router-metro2-ead2, to: datacenter, label: redundant Cross-Cloud Interconnect connection to a router run by the remote cloud (EAD 2), step: 2}
    - {from: compute-engine-vms, to: cloud-router-region-2, label: private inter-cloud traffic to the remote virtual network, step: 3}

- slug: cloud-router-bgp-dynamic-routing
  title: Cloud Router BGP dynamic routing with global routing mode
  category: networking
  tags: [cloud router, bgp, dynamic routing, global routing mode, custom route advertisement, md5]
  source: https://docs.cloud.google.com/network-connectivity/docs/router/concepts/overview
  description: Cloud Router is the managed BGP speaker for Cloud VPN, Cloud Interconnect and router appliances; it learns on-premises prefixes as dynamic routes and advertises VPC subnet ranges plus custom prefixes. With the VPC in global dynamic routing mode, routes learned by a Cloud Router in one region are programmed into all regions of the VPC.
  containers:
    - datacenter: on-premises
    - project: net-hub
      region: europe-west1
      vpcs:
        - name: global-vpc
          cidr: 10.190.0.0/16
          subnets:
            - {name: app-ew1, cidr: 10.190.0.0/24, region: europe-west1}
            - {name: app-asse1, cidr: 10.190.1.0/24, region: asia-southeast1}
  elements:
    - {tf: google_compute_router, name: cloud-router-ew1, in: subnet:app-ew1}
    - {tf: google_compute_ha_vpn_gateway, name: ha-vpn-gw-ew1, in: subnet:app-ew1}
    - {tf: google_compute_vpn_tunnel, name: tunnel-0, in: subnet:app-ew1}
    - {tf: google_compute_vpn_tunnel, name: tunnel-1, in: subnet:app-ew1}
    - {tf: google_compute_external_vpn_gateway, name: onprem-peer-gw, in: datacenter}
    - {tf: google_compute_router, name: onprem-bgp-router, in: datacenter}
    - {tf: google_compute_instance, name: app-ew1-vm, in: subnet:app-ew1}
    - {tf: google_compute_instance, name: app-asse1-vm, in: subnet:app-asse1}
  actors: [datacenter]
  flows:
    - {from: onprem-peer-gw, to: ha-vpn-gw-ew1, label: IPsec tunnels, step: 1}
    - {from: cloud-router-ew1, to: onprem-bgp-router, label: BGP session with MD5 auth, step: 2}
    - {from: onprem-bgp-router, to: cloud-router-ew1, label: advertise on-premises prefixes, step: 3}
    - {from: cloud-router-ew1, to: onprem-bgp-router, label: advertise all subnets plus custom ranges, step: 4}
    - {from: app-asse1-vm, to: onprem-bgp-router, label: uses route learned in europe-west1 via global routing, step: 5}

- slug: network-intelligence-center-observability
  title: Network Intelligence Center for topology and connectivity testing
  category: observability
  tags: [network intelligence center, connectivity tests, network topology, firewall insights, network analyzer, performance dashboard]
  source: https://docs.cloud.google.com/network-intelligence-center/docs/overview
  description: Network Intelligence Center provides Network Topology visualization, Connectivity Tests that simulate packets between endpoints across VPCs and hybrid links, Performance Dashboard latency and packet loss metrics, Firewall Insights and Network Analyzer for misconfiguration detection. Connectivity Tests are created as resources that evaluate reachability between a source and destination such as a VM, load balancer IP or on-premises address.
  containers:
    - datacenter: on-premises
    - project: workload
      region: europe-west1
      vpcs:
        - name: app-vpc
          cidr: 10.200.0.0/16
          subnets:
            - {name: app-ew1, cidr: 10.200.0.0/24, region: europe-west1}
            - {name: db-ew1, cidr: 10.200.1.0/24, region: europe-west1}
  elements:
    - {tf: google_network_management_connectivity_test, name: vm-to-db-test, in: project:workload}
    - {tf: google_network_management_connectivity_test, name: vm-to-onprem-test, in: project:workload}
    - {tf: google_compute_instance, name: app-vm, in: subnet:app-ew1}
    - {tf: google_compute_instance, name: db-vm, in: subnet:db-ew1}
    - {tf: google_compute_network_firewall_policy, name: app-fw-policy, in: vpc:app-vpc}
    - {tf: google_compute_ha_vpn_gateway, name: ha-vpn-gw, in: vpc:app-vpc}
    - {tf: google_compute_router, name: vpn-router, in: vpc:app-vpc}
    - {tf: google_compute_external_vpn_gateway, name: onprem-peer-gw, in: datacenter}
  actors: [datacenter, user]
  flows:
    - {from: user, to: vm-to-db-test, label: run connectivity test, step: 1}
    - {from: vm-to-db-test, to: app-vm, label: source endpoint, step: 2}
    - {from: vm-to-db-test, to: db-vm, label: destination endpoint evaluated against firewall policy, step: 3}
    - {from: vm-to-onprem-test, to: ha-vpn-gw, label: trace via VPN tunnel and Cloud Router routes, step: 4}
    - {from: onprem-peer-gw, to: ha-vpn-gw, label: IPsec}
    - {from: app-fw-policy, to: user, label: Firewall Insights on shadowed and unused rules, step: 5}
