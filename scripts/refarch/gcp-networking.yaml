    - {tf: google_dns_managed_zone, name: onprem-forwarding-zone, in: project:dns-hub, at: [1, 2]}
    - {tf: google_dns_managed_zone, name: hub-private-zone, in: project:dns-hub, at: [2, 2]}
    - {tf: google_dns_managed_zone, name: hub-peering-zone-project1, in: project:dns-hub, at: [1, 3]}
    - {tf: google_dns_managed_zone, name: hub-peering-zone-project2, in: project:dns-hub, at: [2, 3]}
    - {tf: google_dns_managed_zone, name: spoke-a-private-zone, in: project:workload-a, at: [1, 1]}
    - {tf: google_dns_managed_zone, name: spoke-a-peering-zone, in: project:workload-a, at: [1, 2]}
    - {tf: google_compute_instance, name: app-a, in: subnet:spoke-a-ew1, at: [1, 1]}
    - {tf: google_dns_managed_zone, name: spoke-b-private-zone, in: project:workload-b, at: [1, 1]}
    - {tf: google_dns_managed_zone, name: spoke-b-peering-zone, in: project:workload-b, at: [1, 2]}
