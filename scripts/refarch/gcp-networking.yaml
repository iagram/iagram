# Google Cloud reference architectures: networking and hybrid connectivity.
# Sources: Cloud Architecture Center and Google Cloud networking documentation.

- slug: ncc-hub-and-spoke
  title: Hub-and-spoke with Network Connectivity Center
  category: networking
  tags: [network connectivity center, hub and spoke, vpc spokes, hybrid spoke, ha vpn]
  source: https://docs.cloud.google.com/architecture/deploy-hub-spoke-vpc-network-topology
  description: In a single project a hub (routing) VPC and two workload spoke VPCs are attached as VPC spokes to a Network Connectivity Center hub, which exchanges subnet routes so the spokes reach each other and the hub with full bandwidth and transitivity. Each VPC has a subnet with a Compute Engine VM and a Cloud NAT gateway for outbound internet access; the second spoke also hosts a GKE cluster.
  containers:
    - project: net-hub
      region: europe-west1
      account_at: [1, 1]
      vpcs:
        - name: hub-vpc
          cidr: 10.0.0.0/16
          at: [1, 1, 1, 2]
          subnets:
            - {name: hub-ew1, cidr: 10.0.0.0/24, region: europe-west1, at: [1, 1, 2, 1]}
        - name: spoke-a
          cidr: 10.1.0.0/16
          at: [3, 1]
          subnets:
            - {name: spoke-a-ew1, cidr: 10.1.0.0/24, region: europe-west1, at: [1, 1]}
        - name: spoke-b
          cidr: 10.2.0.0/16
          at: [3, 2]
          subnets:
            - {name: spoke-b-ew1, cidr: 10.2.0.0/24, region: europe-west1, at: [1, 1]}
  elements:
    - {tf: google_network_connectivity_hub, name: ncc-hub, in: project:net-hub, at: [2, 1, 1, 2]}
    - {tf: google_compute_instance, name: hub-vm, in: subnet:hub-ew1, at: [1, 1]}
    - {tf: google_compute_router_nat, name: hub-nat, in: vpc:hub-vpc, at: [2, 2]}
    - {tf: google_compute_instance, name: app-a, in: subnet:spoke-a-ew1, at: [1, 1]}
    - {tf: google_compute_router_nat, name: spoke-a-nat, in: vpc:spoke-a, at: [2, 1]}
    - {tf: google_compute_instance, name: app-b, in: subnet:spoke-b-ew1, at: [1, 1]}
    - {tf: google_container_cluster, name: gke-b, in: subnet:spoke-b-ew1, at: [2, 1]}
    - {tf: google_compute_router_nat, name: spoke-b-nat, in: vpc:spoke-b, at: [2, 1]}
  actors: [{type: internet, at: [1, 2]}]
  flows:
    - {from: ncc-hub, to: vpc:hub-vpc, link: google_network_connectivity_spoke, label: hub VPC spoke}
    - {from: ncc-hub, to: vpc:spoke-a, link: google_network_connectivity_spoke, label: workload 1 VPC spoke}
    - {from: ncc-hub, to: vpc:spoke-b, link: google_network_connectivity_spoke, label: workload 2 VPC spoke}
    - {from: app-a, to: app-b, label: inter-spoke traffic via the NCC hub, step: 1}
    - {from: gke-b, to: hub-vm, label: spoke to hub traffic via the NCC hub, step: 2}
    - {from: hub-nat, to: internet, label: outbound internet via Cloud NAT, step: 3}
    - {from: spoke-a-nat, to: internet, label: outbound internet via Cloud NAT, step: 3}
    - {from: spoke-b-nat, to: internet, label: outbound internet via Cloud NAT, step: 3}

- slug: peering-hub-and-spoke
  title: Hub-and-spoke with VPC Network Peering
  category: networking
  tags: [vpc peering, hub and spoke, custom route export, non-transitive]
  source: https://docs.cloud.google.com/vpc/docs/vpc-peering
  description: Each spoke VPC is peered with a central hub VPC (importing and exporting custom routes) that hosts a shared-services subnet, an HA VPN gateway and a Cloud Router speaking BGP to on-premises; with global dynamic routing the hub exports the on-premises prefixes so spokes learn them, and each VPC also keeps its own static routes such as the default route to the internet gateway. Spoke A spans two regions; peering is non-transitive, so spokes cannot talk to each other through the hub unless a network virtual appliance or NCC is added.
  containers:
    - datacenter: on-premises
      at: [1, 4]
    - project: net-hub
      region: us-central1
      account_at: [1, 2]
      vpcs:
        - name: hub-vpc
          cidr: 10.10.0.0/16
          at: [1, 1]
          subnets:
            - {name: hub-shared-svc, cidr: 10.10.0.0/24, region: us-central1, at: [1, 1]}
    - project: workload-a
      region: us-central1
      account_at: [1, 1]
      vpcs:
        - name: spoke-a
          cidr: 10.11.0.0/16
          at: [1, 1]
          subnets:
            - {name: spoke-a-usc1, cidr: 10.11.0.0/24, region: us-central1, at: [1, 1]}
            - {name: spoke-a-eun1, cidr: 10.11.1.0/24, region: europe-north1, at: [2, 1]}
    - project: workload-b
      region: us-central1
      account_at: [1, 3]
      vpcs:
        - name: spoke-b
          cidr: 10.12.0.0/16
          at: [1, 1]
          subnets:
            - {name: spoke-b-usc1, cidr: 10.12.0.0/24, region: us-central1, at: [1, 1]}
  elements:
    - {tf: google_compute_instance, name: shared-services-vm, in: subnet:hub-shared-svc, at: [1, 1]}
    - {tf: google_compute_ha_vpn_gateway, name: hub-vpn-gw, in: vpc:hub-vpc, at: [2, 1]}
    - {tf: google_compute_router, name: hub-router, in: vpc:hub-vpc, at: [3, 1]}
    - {tf: google_compute_route, name: hub-default-internet-route, in: vpc:hub-vpc, at: [4, 1]}
    - {tf: google_compute_instance, name: app-a, in: subnet:spoke-a-usc1, at: [1, 1]}
    - {tf: google_compute_instance, name: app-a2, in: subnet:spoke-a-eun1, at: [1, 1]}
    - {tf: google_compute_route, name: spoke-a-default-internet-route, in: vpc:spoke-a, at: [3, 1]}
    - {tf: google_compute_instance, name: app-b, in: subnet:spoke-b-usc1, at: [1, 1]}
    - {tf: google_compute_route, name: spoke-b-default-internet-route, in: vpc:spoke-b, at: [2, 1]}
  actors: [datacenter]
  flows:
    - {from: vpc:hub-vpc, to: vpc:spoke-a, link: google_compute_network_peering, label: peering importing and exporting custom routes}
    - {from: vpc:hub-vpc, to: vpc:spoke-b, link: google_compute_network_peering, label: peering importing and exporting custom routes}
    - {from: hub-vpn-gw, to: datacenter, label: VPN to on-premises network, step: 1}
    - {from: hub-router, to: datacenter, label: BGP over VPN to on-premises network, step: 2}
    - {from: app-a, to: shared-services-vm, label: shared services over peering, step: 3}
    - {from: app-a2, to: shared-services-vm, label: shared services over peering from the second region, step: 3}
    - {from: app-b, to: datacenter, label: on-premises via exported custom dynamic routes, step: 4}

- slug: vpn-hub-and-spoke
  title: Hub-and-spoke with HA VPN between VPC networks
  category: networking
  tags: [ha vpn, hub and spoke, transitive routing, bgp, vpc to vpc]
  source: https://docs.cloud.google.com/network-connectivity/docs/vpn/how-to/creating-ha-vpn2
  description: Two VPC networks are connected with a pair of HA VPN gateways, one per network, and four IPsec tunnels (two per gateway interface) with BGP sessions on Cloud Routers in each network. Used as a hub-and-spoke option when transitive routing between spokes through the hub is required and the bandwidth ceiling of VPN tunnels is acceptable.
  containers:
    - project: net-hub
      region: europe-west4
      vpcs:
        - name: hub-vpc
          cidr: 10.20.0.0/16
          subnets:
            - {name: hub-ew4, cidr: 10.20.0.0/24, region: europe-west4}
    - project: workload-a
      region: europe-west4
      vpcs:
        - name: spoke-a
          cidr: 10.21.0.0/16
          subnets:
            - {name: spoke-a-ew4, cidr: 10.21.0.0/24, region: europe-west4}
    - project: workload-b
      region: europe-west4
      vpcs:
        - name: spoke-b
          cidr: 10.22.0.0/16
          subnets:
            - {name: spoke-b-ew4, cidr: 10.22.0.0/24, region: europe-west4}
  elements:
    - {tf: google_compute_ha_vpn_gateway, name: hub-vpn-gw, in: vpc:hub-vpc}
    - {tf: google_compute_router, name: hub-router, in: vpc:hub-vpc}
    - {tf: google_compute_ha_vpn_gateway, name: spoke-a-vpn-gw, in: vpc:spoke-a}
    - {tf: google_compute_router, name: spoke-a-router, in: vpc:spoke-a}
    - {tf: google_compute_ha_vpn_gateway, name: spoke-b-vpn-gw, in: vpc:spoke-b}
    - {tf: google_compute_router, name: spoke-b-router, in: vpc:spoke-b}
    - {tf: google_compute_vpn_tunnel, name: hub-to-a-tunnel-0, in: vpc:hub-vpc}
    - {tf: google_compute_vpn_tunnel, name: hub-to-a-tunnel-1, in: vpc:hub-vpc}
    - {tf: google_compute_vpn_tunnel, name: hub-to-b-tunnel-0, in: vpc:hub-vpc}
    - {tf: google_compute_vpn_tunnel, name: hub-to-b-tunnel-1, in: vpc:hub-vpc}
    - {tf: google_compute_instance, name: app-a, in: subnet:spoke-a-ew4}
    - {tf: google_compute_instance, name: app-b, in: subnet:spoke-b-ew4}
  actors: []
  flows:
    - {from: hub-vpn-gw, to: spoke-a-vpn-gw, label: HA VPN 4 tunnels, step: 1}
    - {from: hub-vpn-gw, to: spoke-b-vpn-gw, label: HA VPN 4 tunnels, step: 2}
    - {from: hub-router, to: spoke-a-router, label: BGP}
    - {from: hub-router, to: spoke-b-router, label: BGP}
    - {from: app-a, to: app-b, label: transitive spoke-to-spoke via hub, step: 3}

- slug: shared-vpc-host-service-projects
  title: Shared VPC host and service projects
  category: networking
  tags: [shared vpc, host project, service project, subnet iam, centralized network admin]
  source: https://docs.cloud.google.com/vpc/docs/shared-vpc
  description: A host project owns the VPC network and its subnets; service projects are attached to the host and deploy Compute Engine, GKE and load balancer resources into shared subnets using internal IPs. Network administration stays centralized in the host project while subnet-level IAM delegates usage to service project teams.
  containers:
    - project: shared-vpc-host
      region: europe-west1
      vpcs:
        - name: shared-vpc
          cidr: 10.30.0.0/16
          subnets:
            - {name: team-web-ew1, cidr: 10.30.0.0/24, region: europe-west1}
            - {name: team-data-ew1, cidr: 10.30.1.0/24, region: europe-west1}
            - {name: proxy-only-ew1, cidr: 10.30.255.0/24, region: europe-west1}
    - project: service-web
      region: europe-west1
    - project: service-data
      region: europe-west1
  elements:
    - {tf: google_compute_router, name: shared-router, in: vpc:shared-vpc}
    - {tf: google_compute_router_nat, name: shared-nat, in: vpc:shared-vpc}
    - {tf: google_compute_network_firewall_policy, name: shared-fw-policy, in: vpc:shared-vpc}
    - {tf: google_dns_managed_zone, name: shared-private-zone, in: vpc:shared-vpc}
    - {tf: google_compute_instance, name: web-vm, in: subnet:team-web-ew1}
    - {tf: google_compute_forwarding_rule, name: web-internal-alb, in: subnet:team-web-ew1}
    - {tf: google_compute_backend_service, name: web-backend, in: project:service-web}
    - {tf: google_compute_instance, name: data-vm, in: subnet:team-data-ew1}
    - {tf: google_compute_address, name: data-internal-ip, in: subnet:team-data-ew1}
  actors: [users]
  flows:
    - {from: users, to: web-internal-alb, label: HTTPS from corporate network, step: 1}
    - {from: web-internal-alb, to: web-backend, label: proxy from proxy-only subnet, step: 2}
    - {from: web-backend, to: web-vm, label: HTTP, step: 3}
    - {from: web-vm, to: data-vm, label: internal IP across service projects, step: 4}
    - {from: data-vm, to: shared-nat, label: egress via Cloud NAT, step: 5}

- slug: dedicated-interconnect-9999-availability
  title: Dedicated Interconnect with 99.99% availability
  category: networking
  tags: [dedicated interconnect, vlan attachment, redundancy, two metros, cloud router]
  source: https://docs.cloud.google.com/network-connectivity/docs/interconnect/tutorials/dedicated-creating-9999-availability
  description: Four Dedicated Interconnect connections (int-lga1, int-lga2, int-iad1, int-iad2) are provisioned in two metropolitan areas, LGA (New York) and IAD (Ashburn), two per metro in separate colocation facilities and edge availability domains, each terminating on an on-premises customer router (ASN 12345). One VLAN attachment per connection lands on a Cloud Router in us-central1 or us-east1 with its own BGP session on a 169.254.x.x/29 link, and the VPC uses global dynamic routing so any region reaches on-premises over any surviving path.
  containers:
    - datacenter: on-premises
      at: [1, 3]
    - project: net-hub
      region: us-central1
      account_at: [1, 1]
      groups: [{label: Metro LGA (New York), at: [1, 2]}, {label: Metro IAD (Ashburn), at: [2, 2]}]
      vpcs:
        - name: hybrid-vpc
          cidr: 10.40.0.0/16
          at: [1, 1, 2, 1]
          subnets:
            - {name: us-central1, cidr: 10.40.0.0/24, region: us-central1, at: [1, 1]}
            - {name: us-east1, cidr: 10.40.1.0/24, region: us-east1, at: [2, 1]}
  elements:
    - {tf: google_compute_router, name: rtr-cent1, in: subnet:us-central1, at: [1, 1, 2, 1]}
    - {tf: google_compute_interconnect_attachment, name: attachment-lga1-central1, in: subnet:us-central1, at: [1, 2]}
    - {tf: google_compute_interconnect_attachment, name: attachment-lga2-central1, in: subnet:us-central1, at: [2, 2]}
    - {tf: google_compute_router, name: rtr-east1, in: subnet:us-east1, at: [1, 1, 2, 1]}
    - {tf: google_compute_interconnect_attachment, name: attachment-iad1-east1, in: subnet:us-east1, at: [1, 2]}
    - {tf: google_compute_interconnect_attachment, name: attachment-iad2-east1, in: subnet:us-east1, at: [2, 2]}
    - {tf: google_compute_interconnect, name: int-lga1, in: group:Metro LGA (New York), at: [1, 1]}
    - {tf: google_compute_interconnect, name: int-lga2, in: group:Metro LGA (New York), at: [2, 1]}
    - {tf: google_compute_interconnect, name: int-iad1, in: group:Metro IAD (Ashburn), at: [1, 1]}
    - {tf: google_compute_interconnect, name: int-iad2, in: group:Metro IAD (Ashburn), at: [2, 1]}
  actors: []
  flows:
    - {from: rtr-cent1, to: attachment-lga1-central1, label: BGP session 169.254.58.49/29}
    - {from: rtr-cent1, to: attachment-lga2-central1, label: BGP session 169.254.68.49/29}
    - {from: rtr-east1, to: attachment-iad1-east1, label: BGP session 169.254.78.49/29}
    - {from: rtr-east1, to: attachment-iad2-east1, label: BGP session 169.254.88.49/29}
    - {from: attachment-lga1-central1, to: int-lga1, label: VLAN attachment on lga-zone1-16 (Digital Realty | Telx New York), step: 1}
    - {from: attachment-lga2-central1, to: int-lga2, label: VLAN attachment on lga-zone2-1422 (DataBank New York LGA1), step: 1}
    - {from: attachment-iad1-east1, to: int-iad1, label: VLAN attachment on iad-zone1-1 (Equinix DC1-DC15 Ashburn), step: 2}
    - {from: attachment-iad2-east1, to: int-iad2, label: VLAN attachment on iad-zone2-1 (Equinix DC21 Ashburn), step: 2}
    - {from: int-lga1, to: datacenter, label: "10G Dedicated Interconnect to customer router (ASN 12345, 169.254.58.50)", step: 3}
    - {from: int-lga2, to: datacenter, label: "10G Dedicated Interconnect to customer router (ASN 12345, 169.254.68.50)", step: 3}
    - {from: int-iad1, to: datacenter, label: "10G Dedicated Interconnect to customer router (ASN 12345, 169.254.78.50)", step: 3}
    - {from: int-iad2, to: datacenter, label: "10G Dedicated Interconnect to customer router (ASN 12345, 169.254.88.50)", step: 3}

- slug: partner-interconnect-redundant
  title: Partner Interconnect with redundant VLAN attachments
  category: networking
  tags: [partner interconnect, service provider, vlan attachment, layer 3, redundancy]
  source: https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-overview
  description: On-premises connects to Google Cloud through a supported service provider whose peering edge meets the Google peering edge in a colocation facility; two Partner Interconnect VLAN attachments in separate edge availability domains terminate on a Cloud Router in the VPC region. For Layer 3 partners the provider's routers peer with the Cloud Router; for Layer 2 partners the customer's on-premises router runs BGP directly to the Cloud Router.
  containers:
    - project: net-hub
      region: europe-west3
      account_at: [1, 1, 2, 1]
      groups: [{label: Colocation facility, at: [2, 2]}]
      vpcs:
        - name: hybrid-vpc
          cidr: 10.50.0.0/16
          at: [1, 1, 2, 1]
          subnets:
            - {name: hybrid-ew3, cidr: 10.50.0.0/24, region: europe-west3, at: [1, 1, 1, 3]}
  elements:
    - {tf: google_compute_router, name: partner-router, in: vpc:hybrid-vpc, at: [2, 1]}
    - {tf: google_compute_interconnect_attachment, name: partner-vlan-ead1, in: vpc:hybrid-vpc, at: [2, 2]}
    - {tf: google_compute_interconnect_attachment, name: partner-vlan-ead2, in: vpc:hybrid-vpc, at: [2, 3]}
    - {tf: google_compute_interconnect, name: google-peering-edge, in: group:Colocation facility, at: [1, 1]}
  actors:
    - {type: saas, name: service provider peering edge (provider side), at: [1, 2]}
    - {type: saas, name: service provider peering edge (colocation), at: [2, 2]}
    - {type: client, name: on-premises subnet, at: [1, 3]}
    - {type: server, name: on-premises router, at: [2, 3]}
  flows:
    - {from: on-premises subnet, to: on-premises router, label: on-premises traffic}
    - {from: on-premises router, to: service provider peering edge (provider side), label: circuit to the service provider network, step: 1}
    - {from: service provider peering edge (provider side), to: service provider peering edge (colocation), label: service provider network, step: 2}
    - {from: service provider peering edge (colocation), to: google-peering-edge, label: cross-connect in the colocation facility, step: 3}
    - {from: google-peering-edge, to: partner-vlan-ead1, label: partner VLAN attachment EAD 1, step: 4}
    - {from: google-peering-edge, to: partner-vlan-ead2, label: partner VLAN attachment EAD 2, step: 4}
    - {from: partner-router, to: on-premises router, label: Border Gateway Protocol, step: 5}
    - {from: subnet:hybrid-ew3, to: partner-router, label: routes to on-premises}

- slug: ha-vpn-to-on-premises
  title: HA VPN to a peer VPN gateway
  category: networking
  tags: [ha vpn, ipsec, bgp, cloud router, external vpn gateway, 99.99% sla]
  source: https://docs.cloud.google.com/network-connectivity/docs/vpn/concepts/topologies
  description: An HA VPN gateway in us-central1 of VPC network-a has two interfaces, each carrying an IPsec tunnel over the internet to one interface of the on-premises peer VPN gateway, which is registered in the project as an external VPN gateway with two interfaces. Both tunnels must be up for the 99.99% availability SLA on the Google side; a missing tunnel on interface 1 leaves the connection without redundancy.
  containers:
    - datacenter: on-premises
      at: [2, 1]
    - project: net-hub
      region: us-central1
      account_at: [1, 1]
      vpcs:
        - name: network-a
          cidr: 10.60.0.0/16
          at: [1, 1]
          subnets:
            - {name: us-central1, cidr: 10.60.0.0/24, region: us-central1, at: [1, 1]}
  elements:
    - {tf: google_compute_ha_vpn_gateway, name: ha-vpn-gw, in: subnet:us-central1, at: [1, 1, 2, 1]}
    - {tf: google_compute_vpn_tunnel, name: ha-vpn-interface-0, in: subnet:us-central1, at: [1, 2]}
    - {tf: google_compute_vpn_tunnel, name: ha-vpn-interface-1, in: subnet:us-central1, at: [2, 2]}
    - {tf: google_compute_external_vpn_gateway, name: peer-vpn-gateway, in: project:net-hub, at: [2, 1]}
  actors: [{type: internet, name: Internet, at: [1, 2]}]
  flows:
    - {from: ha-vpn-gw, to: ha-vpn-interface-0, label: interface 0}
    - {from: ha-vpn-gw, to: ha-vpn-interface-1, label: interface 1}
    - {from: ha-vpn-interface-0, to: Internet, label: IPsec tunnel 0 to peer gateway interface 0, step: 1}
    - {from: ha-vpn-interface-1, to: Internet, label: missing tunnel (IPsec tunnel 1 to peer gateway interface 1), step: 1}
    - {from: Internet, to: peer-vpn-gateway, label: peer gateway interfaces 0 and 1, step: 2}
    - {from: peer-vpn-gateway, to: datacenter, label: on-premises network, step: 3}

- slug: psc-published-service
  title: Private Service Connect published service (producer and consumer)
  category: networking
  tags: [private service connect, service attachment, producer, consumer, internal load balancer, nat subnet]
  source: https://docs.cloud.google.com/vpc/docs/configure-private-service-connect-producer
  description: A service producer fronts its workload with an internal load balancer, allocates a PSC NAT subnet and publishes the load balancer through a service attachment with an accept list of consumer projects. Consumers create an endpoint (a forwarding rule with an internal IP in their own VPC) that targets the service attachment, so traffic never leaves Google's network and address spaces need not be unique.
  containers:
    - project: producer
      region: us-central1
      vpcs:
        - name: producer-vpc
          cidr: 10.70.0.0/16
          subnets:
            - {name: producer-backend, cidr: 10.70.0.0/24, region: us-central1}
            - {name: psc-nat-subnet, cidr: 10.70.100.0/24, region: us-central1}
    - project: consumer
      region: us-central1
      vpcs:
        - name: consumer-vpc
          cidr: 10.70.0.0/16
          subnets:
            - {name: consumer-app, cidr: 10.70.0.0/24, region: us-central1}
  elements:
    - {tf: google_compute_instance, name: service-vm, in: subnet:producer-backend}
    - {tf: google_compute_backend_service, name: service-backend, in: vpc:producer-vpc}
    - {tf: google_compute_forwarding_rule, name: producer-ilb, in: subnet:producer-backend}
    - {tf: google_compute_service_attachment, name: service-attachment, in: subnet:psc-nat-subnet}
    - {tf: google_compute_address, name: endpoint-ip, in: subnet:consumer-app}
    - {tf: google_compute_forwarding_rule, name: psc-endpoint, in: subnet:consumer-app}
    - {tf: google_compute_instance, name: consumer-vm, in: subnet:consumer-app}
    - {tf: google_dns_managed_zone, name: consumer-private-zone, in: vpc:consumer-vpc}
  actors: []
  flows:
    - {from: consumer-vm, to: consumer-private-zone, label: resolve service name to endpoint IP, step: 1}
    - {from: consumer-vm, to: psc-endpoint, label: connect to internal endpoint IP, step: 2}
    - {from: psc-endpoint, to: service-attachment, label: PSC connection with NAT, step: 3}
