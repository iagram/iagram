    - {from: vpc:hub-vpc, to: vpc:spoke-b, link: google_compute_network_peering, label: VPC Network Peering}
    - {from: app-a, to: spoke-a-peering-zone, label: query corp.example.com, step: 1}
    - {from: app-b, to: spoke-b-peering-zone, label: query corp.example.com, step: 1}
    - {from: spoke-a-peering-zone, to: onprem-forwarding-zone, label: DNS peer example.com to hub VPC, step: 2}
    - {from: spoke-b-peering-zone, to: onprem-forwarding-zone, label: DNS peer example.com to hub VPC, step: 2}
    - {from: onprem-forwarding-zone, to: on-premises DNS servers, label: "forward corp.example.com queries from 35.199.192.0/19", step: 3}
    - {from: hub-interconnect, to: on-premises DNS servers, label: Cloud Interconnect}
