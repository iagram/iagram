          subnets:
            - {name: spoke-b-ew1, cidr: 10.162.0.0/24, region: europe-west1, at: [1, 1]}
  elements:
    - {tf: google_dns_policy, name: hub-inbound-policy, in: vpc:hub-vpc, at: [1, 1]}
