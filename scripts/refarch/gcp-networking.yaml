          at: [1, 1, 2, 1]
          subnets:
            - {name: hub-ew1, cidr: 10.160.0.0/24, region: europe-west1, at: [2, 1]}
    - project: workload-a
      region: europe-west1
      account_at: [2, 2]
      vpcs:
        - name: spoke-a
          cidr: 10.161.0.0/16
          at: [2, 1, 1, 2]
          subnets:
            - {name: spoke-a-ew1, cidr: 10.161.0.0/24, region: europe-west1, at: [1, 1]}
    - project: workload-b
