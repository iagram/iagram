    - {from: default-v1, to: mysql-password, label: read credentials, step: 2}
    - {from: default-v1, to: gae-mysql, label: "/cloudsql Unix socket (public IP)", step: 3}
    - {from: default-v1, to: gae-connector, label: private IP alternative}
