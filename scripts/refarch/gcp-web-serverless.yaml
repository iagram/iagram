- slug: cloud-deploy-pipeline-gke-dev-prod
  title: Cloud Deploy delivery pipeline promoting releases across dev and prod GKE targets
  category: devops
  tags: [cloud deploy, delivery pipeline, gke, skaffold, release, rollout, promotion]
  source: https://docs.cloud.google.com/deploy/docs/deploy-app-gke
  description: A Cloud Deploy delivery pipeline defines a serial progression of two targets, each pointing at a GKE cluster, and a Skaffold configuration describes the Kubernetes manifests to render. Creating a release with a digest-qualified image from Artifact Registry automatically rolls out to the dev target; promoting the release creates a rollout to the prod target, and Cloud Deploy stores rendered manifests in a Cloud Storage bucket.
  containers:
    - project: deploy-gke-prj
      region: europe-west1
      vpcs:
        - name: deploy-vpc
          cidr: 10.120.0.0/16
          subnets:
            - {name: dev-sub, cidr: 10.120.0.0/20, region: europe-west1}
            - {name: prod-sub, cidr: 10.120.16.0/20, region: europe-west1}
  elements:
    - {tf: google_clouddeploy_delivery_pipeline, name: my-gke-demo-app, in: project:deploy-gke-prj}
    - {tf: google_clouddeploy_target, name: qsdev, in: project:deploy-gke-prj}
    - {tf: google_clouddeploy_target, name: qsprod, in: project:deploy-gke-prj}
    - {tf: google_container_cluster, name: quickstart-cluster-qsdev, in: subnet:dev-sub}
    - {tf: google_container_cluster, name: quickstart-cluster-qsprod, in: subnet:prod-sub}
    - {tf: google_artifact_registry_repository, name: release-images, in: project:deploy-gke-prj}
    - {tf: google_storage_bucket, name: rendered-manifests, in: project:deploy-gke-prj}
    - {tf: google_service_account, name: clouddeploy-sa, in: project:deploy-gke-prj}
  actors: [users]
  flows:
    - {from: users, to: my-gke-demo-app, label: create release with Skaffold config, step: 1}
    - {from: release-images, to: my-gke-demo-app, label: SHA-qualified image}
    - {from: my-gke-demo-app, to: rendered-manifests, label: render manifests, step: 2}
    - {from: my-gke-demo-app, to: qsdev, label: automatic first rollout, step: 3}
    - {from: qsdev, to: quickstart-cluster-qsdev, label: kubectl apply, step: 4}
    - {from: users, to: my-gke-demo-app, label: promote release, step: 5}
    - {from: my-gke-demo-app, to: qsprod, label: rollout to prod, step: 6}
    - {from: qsprod, to: quickstart-cluster-qsprod, label: kubectl apply, step: 7}
    - {from: clouddeploy-sa, to: my-gke-demo-app, label: execution identity}

- slug: batch-job-cloud-storage-volume
  title: Batch job on Compute Engine VMs mounting a Cloud Storage bucket
  category: compute
  tags: [batch, cloud storage fuse, compute engine, hpc, service account, job tasks]
  source: https://docs.cloud.google.com/batch/docs/create-run-job-storage
  description: A Batch job specification declares a Cloud Storage bucket as a volume, so Batch provisions Compute Engine VMs from an instance template, mounts the bucket with Cloud Storage FUSE under /mnt/disks and runs each indexed task's script against that path. The job runs as a service account with Storage Object Viewer or Admin on the bucket, task logs stream to Cloud Logging, and a Cloud NAT gateway lets VMs without external IPs fetch packages.
  containers:
    - project: batch-prj
      region: europe-west1
      vpcs:
        - name: batch-vpc
          cidr: 10.130.0.0/16
          subnets:
            - {name: batch-sub, cidr: 10.130.0.0/20, region: europe-west1}
  elements:
    - {tf: google_compute_instance_template, name: batch-vm-template, in: region}
    - {tf: google_compute_instance, name: batch-task-vm-0, in: subnet:batch-sub}
    - {tf: google_compute_instance, name: batch-task-vm-1, in: subnet:batch-sub}
    - {tf: google_service_account, name: batch-job-sa, in: project:batch-prj}
    - {tf: google_storage_bucket, name: batch-io-bucket, in: project:batch-prj}
    - {tf: google_compute_router, name: batch-router, in: vpc:batch-vpc}
    - {tf: google_compute_router_nat, name: batch-nat, in: vpc:batch-vpc}
    - {tf: google_logging_project_sink, name: batch-logs, in: project:batch-prj}
  actors: [users, internet]
  flows:
    - {from: users, to: batch-vm-template, label: submit job spec with storage volume, step: 1}
    - {from: batch-vm-template, to: batch-task-vm-0, label: Batch provisions VMs, step: 2}
    - {from: batch-vm-template, to: batch-task-vm-1}
    - {from: batch-job-sa, to: batch-task-vm-0, label: VM service account}
    - {from: batch-task-vm-0, to: batch-io-bucket, label: "Cloud Storage FUSE mount /mnt/disks", step: 3}
    - {from: batch-task-vm-1, to: batch-io-bucket, label: write task output}
    - {from: batch-task-vm-0, to: batch-nat, label: package downloads}
    - {from: batch-router, to: batch-nat}
    - {from: batch-nat, to: internet}
    - {from: batch-task-vm-0, to: batch-logs, label: task stdout/stderr}

- slug: app-engine-standard-cloud-sql
  title: App Engine standard web app connecting to Cloud SQL over Unix socket or private IP
  category: web
  tags: [app engine standard, cloud sql, unix socket, serverless vpc access, secret manager, mysql]
  source: https://docs.cloud.google.com/sql/docs/mysql/connect-app-engine-standard
  description: An App Engine standard service in the same region as a Cloud SQL for MySQL instance connects through the /cloudsql Unix socket that App Engine provides, authorized by the app's service account holding Cloud SQL Client. For private IP the app uses a Serverless VPC Access connector into the instance's VPC, and database credentials are read from Secret Manager rather than environment variables; static assets are served from a Cloud Storage bucket.
