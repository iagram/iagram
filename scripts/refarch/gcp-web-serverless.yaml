- slug: iap-compute-engine-web-app
  title: Web app on Compute Engine protected by Identity-Aware Proxy behind an HTTPS load balancer
  category: security
  tags: [identity-aware proxy, iap, compute engine, managed instance group, https load balancer, zero trust]
  source: https://docs.cloud.google.com/iap/docs/enabling-compute-howto
  description: A managed instance group behind a global external HTTPS load balancer is the IAP-protected backend service; enabling IAP on the backend service makes every request pass Google sign-in and an IAM check for the IAP-secured Web App User role before it reaches a VM. The app verifies the signed JWT header that IAP adds, a Cloud DNS record maps the domain to the load balancer IP, and a firewall rule allows only IAP and health-check ranges to reach the instances.
  containers:
    - project: iap-prj
      region: europe-west1
      vpcs:
        - name: iap-vpc
          cidr: 10.170.0.0/16
          subnets:
            - {name: app-sub, cidr: 10.170.1.0/24, region: europe-west1}
  elements:
    - {tf: google_dns_managed_zone, name: app-zone, in: project:iap-prj}
    - {tf: google_compute_global_forwarding_rule, name: app-https-rule, in: project:iap-prj}
    - {tf: google_compute_target_https_proxy, name: app-https-proxy, in: project:iap-prj}
    - {tf: google_compute_managed_ssl_certificate, name: app-cert, in: project:iap-prj}
    - {tf: google_compute_url_map, name: app-url-map, in: project:iap-prj}
    - {tf: google_compute_backend_service, name: iap-backend, in: project:iap-prj}
    - {tf: google_compute_region_instance_group_manager, name: app-mig, in: subnet:app-sub}
    - {tf: google_compute_firewall, name: allow-iap-and-hc, in: vpc:iap-vpc}
    - {tf: google_iap_client, name: iap-oauth-client, in: project:iap-prj}
  actors: [users, idp]
  flows:
    - {from: users, to: app-zone, label: DNS lookup}
    - {from: users, to: app-https-rule, label: HTTPS, step: 1}
    - {from: app-https-rule, to: app-https-proxy, step: 2}
    - {from: app-cert, to: app-https-proxy}
    - {from: app-https-proxy, to: app-url-map, step: 3}
    - {from: app-url-map, to: iap-backend, label: IAP enabled, step: 4}
    - {from: iap-backend, to: idp, label: Google sign-in and IAM check, step: 5}
    - {from: iap-oauth-client, to: iap-backend, label: OAuth client}
    - {from: iap-backend, to: app-mig, label: "request with X-Goog-IAP-JWT-Assertion", step: 6}
    - {from: allow-iap-and-hc, to: app-mig, label: allow 35.235.240.0/20 and health checks}

- slug: cloud-armor-recaptcha-bot-management
  title: Bot management with Cloud Armor and reCAPTCHA on a global external Application Load Balancer
  category: security
  tags: [cloud armor, recaptcha, bot management, waf, action token, challenge page, global external application load balancer]
  source: https://docs.cloud.google.com/armor/docs/bot-management
  description: reCAPTCHA WAF keys for action tokens, session tokens and a challenge page are created for the site and associated with a Cloud Armor security policy attached to the load balancer's backend service. Rules evaluate the reCAPTCHA token inline at the edge and allow, deny, rate-limit or redirect suspicious requests to the reCAPTCHA challenge page, while legitimate users pass through to the Cloud Run backends via a serverless NEG.
  containers:
    - project: bot-mgmt-prj
      region: europe-west1
  elements:
    - {tf: google_recaptcha_enterprise_key, name: action-token-key, in: project:bot-mgmt-prj}
    - {tf: google_recaptcha_enterprise_key, name: session-token-key, in: project:bot-mgmt-prj}
    - {tf: google_recaptcha_enterprise_key, name: challenge-page-key, in: project:bot-mgmt-prj}
    - {tf: google_compute_security_policy, name: bot-policy, in: project:bot-mgmt-prj}
    - {tf: google_compute_global_forwarding_rule, name: shop-https-rule, in: project:bot-mgmt-prj}
    - {tf: google_compute_target_https_proxy, name: shop-https-proxy, in: project:bot-mgmt-prj}
    - {tf: google_compute_url_map, name: shop-url-map, in: project:bot-mgmt-prj}
    - {tf: google_compute_backend_service, name: shop-backend, in: project:bot-mgmt-prj}
    - {tf: google_compute_region_network_endpoint_group, name: shop-neg, in: project:bot-mgmt-prj}
    - {tf: google_cloud_run_v2_service, name: shop-service, in: project:bot-mgmt-prj}
  actors: [users]
  flows:
    - {from: users, to: shop-https-rule, label: "HTTPS with X-Recaptcha-Token", step: 1}
    - {from: shop-https-rule, to: shop-https-proxy, step: 2}
    - {from: shop-https-proxy, to: shop-url-map, step: 3}
    - {from: shop-url-map, to: shop-backend, step: 4}
    - {from: bot-policy, to: shop-backend, label: security policy attached}
    - {from: action-token-key, to: bot-policy, label: token evaluated inline}
    - {from: session-token-key, to: bot-policy, label: session cookie scoring}
    - {from: challenge-page-key, to: bot-policy, label: redirect suspicious traffic to challenge}
    - {from: shop-backend, to: shop-neg, label: allowed requests, step: 5}
    - {from: shop-neg, to: shop-service, step: 6}
