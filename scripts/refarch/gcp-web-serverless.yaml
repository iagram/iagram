    - {tf: google_service_account, name: gae-sa, in: project:gae-prj}
    - {tf: google_sql_database_instance, name: gae-mysql, in: vpc:gae-vpc}
    - {tf: google_vpc_access_connector, name: gae-connector, in: subnet:connector-sub}
    - {tf: google_secret_manager_secret, name: mysql-password, in: project:gae-prj}
    - {tf: google_storage_bucket, name: gae-static, in: project:gae-prj}
  actors: [users]
  flows:
