- slug: global-alb-mig-cloud-sql-three-tier
  title: Three-tier web app on managed instance groups behind a global external Application Load Balancer
  category: web
  tags: [global external application load balancer, managed instance group, cloud sql, memorystore, three tier, compute engine]
  source: https://docs.cloud.google.com/load-balancing/docs/https/setup-global-ext-https-compute
  description: A global forwarding rule on a reserved anycast IP hands HTTPS to a target HTTPS proxy holding a Google-managed certificate; the URL map routes to a backend service whose backends are regional managed instance groups built from an instance template and watched by an HTTP health check. The web tier reads session state from Memorystore for Redis and persists data in a regional Cloud SQL instance reached over private IP, while a Cloud NAT gateway gives the private VMs outbound access for package updates.
  containers:
    - project: web-tier-prj
      region: europe-west1
      vpcs:
        - name: web-vpc
          cidr: 10.10.0.0/16
          subnets:
            - {name: web-sub, cidr: 10.10.1.0/24, region: europe-west1}
            - {name: data-sub, cidr: 10.10.2.0/24, region: europe-west1}
  elements:
    - {tf: google_compute_global_address, name: web-ip, in: project:web-tier-prj}
    - {tf: google_compute_global_forwarding_rule, name: web-https-rule, in: project:web-tier-prj}
    - {tf: google_compute_target_https_proxy, name: web-https-proxy, in: project:web-tier-prj}
    - {tf: google_compute_managed_ssl_certificate, name: web-cert, in: project:web-tier-prj}
    - {tf: google_compute_url_map, name: web-url-map, in: project:web-tier-prj}
    - {tf: google_compute_backend_service, name: web-backend, in: project:web-tier-prj}
    - {tf: google_compute_health_check, name: web-hc, in: project:web-tier-prj}
    - {tf: google_compute_instance_template, name: web-template, in: region}
    - {tf: google_compute_region_instance_group_manager, name: web-mig, in: subnet:web-sub}
    - {tf: google_redis_instance, name: session-cache, in: subnet:data-sub}
    - {tf: google_sql_database_instance, name: app-db, in: subnet:data-sub}
    - {tf: google_compute_router, name: web-router, in: vpc:web-vpc}
    - {tf: google_compute_router_nat, name: web-nat, in: vpc:web-vpc}
  actors: [users, internet]
  flows:
    - {from: users, to: web-https-rule, label: HTTPS to anycast IP, step: 1}
    - {from: web-https-rule, to: web-https-proxy, step: 2}
    - {from: web-cert, to: web-https-proxy, label: Google-managed certificate}
    - {from: web-https-proxy, to: web-url-map, step: 3}
    - {from: web-url-map, to: web-backend, step: 4}
    - {from: web-backend, to: web-mig, label: HTTP to healthy instances, step: 5}
    - {from: web-hc, to: web-mig, label: health checks}
    - {from: web-template, to: web-mig, label: instance template}
    - {from: web-mig, to: session-cache, label: Redis sessions, step: 6}
    - {from: web-mig, to: app-db, label: private IP SQL, step: 7}
    - {from: web-mig, to: web-nat, label: outbound updates}
    - {from: web-nat, to: internet}

- slug: static-site-backend-bucket-cloud-cdn
  title: Static website on Cloud Storage served through Cloud CDN and an HTTPS load balancer
  category: web
  tags: [cloud storage, cloud cdn, backend bucket, static website, https load balancer, cloud dns]
  source: https://docs.cloud.google.com/cdn/docs/setting-up-cdn-with-bucket
  description: A multi-region Cloud Storage bucket holds the site files and is wrapped in a backend bucket with Cloud CDN enabled so content is cached at Google edge locations. A URL map, target HTTPS proxy with a Google-managed certificate and a global forwarding rule on a reserved static IP expose the bucket; a Cloud DNS zone points the custom domain at that address.
  containers:
    - project: static-web-prj
      region: europe-west1
  elements:
    - {tf: google_dns_managed_zone, name: site-zone, in: project:static-web-prj}
    - {tf: google_compute_global_address, name: site-ip, in: project:static-web-prj}
    - {tf: google_compute_global_forwarding_rule, name: site-https-rule, in: project:static-web-prj}
    - {tf: google_compute_target_https_proxy, name: site-https-proxy, in: project:static-web-prj}
    - {tf: google_compute_managed_ssl_certificate, name: site-cert, in: project:static-web-prj}
    - {tf: google_compute_url_map, name: site-url-map, in: project:static-web-prj}
    - {tf: google_compute_backend_bucket, name: site-cdn-backend, in: project:static-web-prj}
    - {tf: google_storage_bucket, name: site-assets, in: project:static-web-prj}
  actors: [users]
  flows:
    - {from: users, to: site-zone, label: DNS lookup, step: 1}
    - {from: users, to: site-https-rule, label: HTTPS, step: 2}
    - {from: site-https-rule, to: site-https-proxy, step: 3}
    - {from: site-cert, to: site-https-proxy}
    - {from: site-https-proxy, to: site-url-map, step: 4}
    - {from: site-url-map, to: site-cdn-backend, label: Cloud CDN cache, step: 5}
    - {from: site-cdn-backend, to: site-assets, label: origin fetch on cache miss, step: 6}

- slug: cloud-run-global-alb-serverless-neg-cloud-armor
  title: Cloud Run behind a global external Application Load Balancer with a serverless NEG and Cloud Armor
  category: web
  tags: [cloud run, serverless neg, global external application load balancer, cloud armor, cloud cdn, multi-region]
  source: https://docs.cloud.google.com/load-balancing/docs/https/setup-global-ext-https-serverless
  description: Cloud Run services in two regions are registered in regional serverless network endpoint groups that are the backends of one global backend service, so a single anycast IP with a Google-managed certificate routes users to the nearest healthy region. A Cloud Armor security policy attached to the backend service filters traffic at the edge and Cloud CDN caches cacheable responses; ingress on the services is restricted to internal-and-load-balancer traffic.
  containers:
    - project: run-web-prj
      region: europe-west1
  elements:
    - {tf: google_compute_global_address, name: app-ip, in: project:run-web-prj}
    - {tf: google_compute_global_forwarding_rule, name: app-https-rule, in: project:run-web-prj}
    - {tf: google_compute_target_https_proxy, name: app-https-proxy, in: project:run-web-prj}
    - {tf: google_compute_managed_ssl_certificate, name: app-cert, in: project:run-web-prj}
    - {tf: google_compute_url_map, name: app-url-map, in: project:run-web-prj}
    - {tf: google_compute_backend_service, name: app-backend, in: project:run-web-prj}
    - {tf: google_compute_security_policy, name: app-edge-policy, in: project:run-web-prj}
    - {tf: google_compute_region_network_endpoint_group, name: app-neg-ew1, in: project:run-web-prj}
    - {tf: google_compute_region_network_endpoint_group, name: app-neg-ew4, in: project:run-web-prj}
    - {tf: google_cloud_run_v2_service, name: app-ew1, in: project:run-web-prj}
    - {tf: google_cloud_run_v2_service, name: app-ew4, in: project:run-web-prj}
  actors: [users]
  flows:
    - {from: users, to: app-https-rule, label: HTTPS, step: 1}
    - {from: app-https-rule, to: app-https-proxy, step: 2}
    - {from: app-cert, to: app-https-proxy}
    - {from: app-https-proxy, to: app-url-map, step: 3}
    - {from: app-url-map, to: app-backend, label: Cloud CDN enabled, step: 4}
    - {from: app-edge-policy, to: app-backend, label: Cloud Armor rules}
    - {from: app-backend, to: app-neg-ew1, label: nearest region, step: 5}
    - {from: app-backend, to: app-neg-ew4, label: failover region}
    - {from: app-neg-ew1, to: app-ew1, step: 6}
    - {from: app-neg-ew4, to: app-ew4}

- slug: cloud-run-cloud-sql-postgres-secret-manager
  title: Cloud Run service connected to Cloud SQL for PostgreSQL with Secret Manager credentials
  category: serverless
  tags: [cloud run, cloud sql, postgresql, secret manager, direct vpc egress, private ip]
  source: https://docs.cloud.google.com/sql/docs/postgres/connect-run
  description: A Cloud Run service runs under a dedicated service account holding the Cloud SQL Client role and reads the database password from a Secret Manager secret mounted at deploy time. With Direct VPC egress the revision gets an address in the VPC subnet and talks TCP 5432 to the private IP of a regional Cloud SQL instance in the same region; the container image is pulled from Artifact Registry.
  containers:
    - project: run-sql-prj
      region: europe-west1
      vpcs:
        - name: app-vpc
          cidr: 10.20.0.0/16
          subnets:
            - {name: run-egress-sub, cidr: 10.20.1.0/24, region: europe-west1}
            - {name: db-sub, cidr: 10.20.2.0/24, region: europe-west1}
  elements:
    - {tf: google_cloud_run_v2_service, name: api-service, in: subnet:run-egress-sub}
    - {tf: google_service_account, name: api-sa, in: project:run-sql-prj}
    - {tf: google_secret_manager_secret, name: db-password, in: project:run-sql-prj}
    - {tf: google_sql_database_instance, name: orders-pg, in: subnet:db-sub}
    - {tf: google_artifact_registry_repository, name: api-images, in: project:run-sql-prj}
  actors: [users]
  flows:
    - {from: users, to: api-service, label: HTTPS run.app URL, step: 1}
    - {from: api-sa, to: api-service, label: runtime identity, step: 2}
    - {from: api-service, to: db-password, label: secret mounted as env var, step: 3}
    - {from: api-service, to: orders-pg, label: "TCP 5432 private IP", step: 4}
    - {from: api-images, to: api-service, label: image pull}

- slug: cloud-run-memorystore-direct-vpc-egress
  title: Cloud Run service reaching Memorystore for Redis over Direct VPC egress
  category: serverless
  tags: [cloud run, memorystore, redis, direct vpc egress, serverless vpc access, caching]
  source: https://docs.cloud.google.com/memorystore/docs/redis/connect-redis-instance-cloud-run
  description: A Memorystore for Redis instance is authorized on a VPC network and only exposes a private IP, so the Cloud Run service is deployed with Direct VPC egress into a subnet of that network and reaches Redis on port 6379 without a managed connector. A Serverless VPC Access connector is the alternative path for projects that cannot use Direct VPC egress, and the Redis host and port are passed to the container as environment variables.
  containers:
    - project: run-cache-prj
      region: europe-west1
      vpcs:
        - name: cache-vpc
          cidr: 10.30.0.0/16
          subnets:
            - {name: run-sub, cidr: 10.30.1.0/24, region: europe-west1}
            - {name: connector-sub, cidr: 10.30.8.0/28, region: europe-west1}
  elements:
    - {tf: google_cloud_run_v2_service, name: counter-service, in: subnet:run-sub}
    - {tf: google_redis_instance, name: counter-redis, in: vpc:cache-vpc}
    - {tf: google_vpc_access_connector, name: legacy-connector, in: subnet:connector-sub}
    - {tf: google_service_account, name: counter-sa, in: project:run-cache-prj}
    - {tf: google_artifact_registry_repository, name: counter-images, in: project:run-cache-prj}
  actors: [users]
  flows:
    - {from: users, to: counter-service, label: HTTPS, step: 1}
    - {from: counter-service, to: counter-redis, label: "INCR over 6379, Direct VPC egress", step: 2}
    - {from: counter-service, to: legacy-connector, label: alternative Serverless VPC Access}
    - {from: legacy-connector, to: counter-redis}
    - {from: counter-sa, to: counter-service, label: runtime identity}
    - {from: counter-images, to: counter-service, label: image pull}

- slug: cloud-run-job-cloud-scheduler
  title: Cloud Run job executed on a cron schedule by Cloud Scheduler
  category: serverless
  tags: [cloud run jobs, cloud scheduler, cron, batch, oauth service account]
  source: https://docs.cloud.google.com/run/docs/execute/jobs-on-schedule
  description: A Cloud Scheduler job fires on a unix-cron expression and sends an authenticated HTTP POST to the run endpoint of a Cloud Run job, using a service account that holds the Cloud Run Invoker role. The job runs its container tasks to completion, writes results to a Cloud Storage bucket and its logs land in Cloud Logging; the scheduler region does not need to match the job region.
  containers:
    - project: run-jobs-prj
      region: europe-west1
  elements:
    - {tf: google_cloud_scheduler_job, name: nightly-report-cron, in: project:run-jobs-prj}
    - {tf: google_service_account, name: scheduler-invoker-sa, in: project:run-jobs-prj}
    - {tf: google_cloud_run_v2_job, name: report-job, in: project:run-jobs-prj}
    - {tf: google_storage_bucket, name: report-output, in: project:run-jobs-prj}
    - {tf: google_artifact_registry_repository, name: job-images, in: project:run-jobs-prj}
    - {tf: google_logging_project_sink, name: job-log-sink, in: project:run-jobs-prj}
  actors: []
  flows:
    - {from: nightly-report-cron, to: report-job, label: "POST :run with OAuth token, 0 2 * * *", step: 1}
    - {from: scheduler-invoker-sa, to: nightly-report-cron, label: Cloud Run Invoker identity}
    - {from: job-images, to: report-job, label: image pull, step: 2}
    - {from: report-job, to: report-output, label: write results, step: 3}
    - {from: report-job, to: job-log-sink, label: task logs}

- slug: eventarc-cloud-storage-trigger-cloud-run
  title: Cloud Storage object events delivered to Cloud Run through Eventarc
  category: serverless
  tags: [eventarc, cloud storage, cloud run, pub/sub, cloudevents, event-driven]
  source: https://docs.cloud.google.com/eventarc/docs/run/quickstart-storage
  description: An Eventarc trigger subscribes to google.cloud.storage.object.v1.finalized events from one bucket in the same region; Cloud Storage publishes each event to a Pub/Sub topic that Eventarc creates as the transport and a push subscription delivers the CloudEvent as an HTTP request to a Cloud Run service. The trigger runs as a service account with Eventarc Event Receiver and Cloud Run Invoker roles, and the Cloud Storage service agent needs Pub/Sub Publisher.
  containers:
    - project: events-run-prj
      region: europe-west1
  elements:
    - {tf: google_storage_bucket, name: uploads, in: project:events-run-prj}
    - {tf: google_eventarc_trigger, name: object-finalized-trigger, in: project:events-run-prj}
    - {tf: google_pubsub_topic, name: eventarc-transport-topic, in: project:events-run-prj}
    - {tf: google_pubsub_subscription, name: eventarc-push-sub, in: project:events-run-prj}
    - {tf: google_cloud_run_v2_service, name: helloworld-events, in: project:events-run-prj}
    - {tf: google_service_account, name: trigger-sa, in: project:events-run-prj}
  actors: [users]
  flows:
    - {from: users, to: uploads, label: upload object, step: 1}
    - {from: uploads, to: eventarc-transport-topic, label: object.finalized notification, step: 2}
    - {from: eventarc-transport-topic, to: eventarc-push-sub, step: 3}
    - {from: object-finalized-trigger, to: eventarc-push-sub, label: filter and route}
    - {from: eventarc-push-sub, to: helloworld-events, label: HTTP POST CloudEvent, step: 4}
    - {from: trigger-sa, to: object-finalized-trigger, label: Event Receiver + Run Invoker}

- slug: cloud-run-functions-pubsub-trigger
  title: Event-driven Cloud Run function triggered by Pub/Sub messages
  category: serverless
  tags: [cloud run functions, pub/sub, eventarc, cloudevents, event-driven]
  source: https://docs.cloud.google.com/functions/docs/tutorials/pubsub
  description: A CloudEvent function is deployed to Cloud Run functions with an Eventarc trigger filtered on google.cloud.pubsub.topic.v1.messagePublished for one topic. Publishing a message creates an HTTP request that carries the base64-encoded payload to the function, which decodes and processes it; the function source is built by Cloud Build into an Artifact Registry image and logs go to Cloud Logging.
  containers:
    - project: fn-events-prj
      region: europe-west1
  elements:
    - {tf: google_pubsub_topic, name: orders-topic, in: project:fn-events-prj}
    - {tf: google_eventarc_trigger, name: orders-published-trigger, in: project:fn-events-prj}
    - {tf: google_cloudfunctions2_function, name: process-order-fn, in: project:fn-events-prj}
    - {tf: google_storage_bucket, name: fn-source, in: project:fn-events-prj}
    - {tf: google_artifact_registry_repository, name: fn-images, in: project:fn-events-prj}
    - {tf: google_service_account, name: fn-runtime-sa, in: project:fn-events-prj}
  actors: [client]
  flows:
    - {from: client, to: orders-topic, label: publish message, step: 1}
    - {from: orders-topic, to: orders-published-trigger, label: messagePublished event, step: 2}
    - {from: orders-published-trigger, to: process-order-fn, label: HTTP CloudEvent, step: 3}
    - {from: fn-source, to: process-order-fn, label: source upload}
    - {from: fn-images, to: process-order-fn, label: built image}
    - {from: fn-runtime-sa, to: process-order-fn, label: runtime identity}

- slug: api-gateway-cloud-run-function-backend
  title: API Gateway securing a Cloud Run function backend with API keys
  category: serverless
  tags: [api gateway, openapi, cloud run functions, api keys, service account]
  source: https://docs.cloud.google.com/api-gateway/docs/quickstart
  description: An API Gateway API holds an API config generated from an OpenAPI spec whose x-google-backend points at a Cloud Run function URL, and a gateway deployment exposes a gateway.dev hostname. The config runs as a service account with invoker permission on the function, and clients must present an API key restricted to the API or receive UNAUTHENTICATED.
  containers:
    - project: apigw-prj
      region: europe-west1
  elements:
    - {tf: google_api_gateway_api, name: hello-api, in: project:apigw-prj}
    - {tf: google_api_gateway_api_config, name: hello-api-config, in: project:apigw-prj}
    - {tf: google_api_gateway_gateway, name: hello-gateway, in: project:apigw-prj}
    - {tf: google_apikeys_key, name: hello-api-key, in: project:apigw-prj}
    - {tf: google_service_account, name: gateway-backend-sa, in: project:apigw-prj}
    - {tf: google_cloudfunctions2_function, name: hello-get-fn, in: project:apigw-prj}
    - {tf: google_storage_bucket, name: fn-source, in: project:apigw-prj}
  actors: [client]
  flows:
    - {from: client, to: hello-gateway, label: "GET /hello?key=API_KEY", step: 1}
    - {from: hello-api-key, to: hello-api, label: key restricted to API}
    - {from: hello-api-config, to: hello-gateway, label: deployed OpenAPI config}
    - {from: hello-api, to: hello-api-config}
    - {from: hello-gateway, to: hello-get-fn, label: x-google-backend with ID token, step: 2}
    - {from: gateway-backend-sa, to: hello-api-config, label: backend auth identity}
    - {from: fn-source, to: hello-get-fn, label: source}

- slug: apigee-x-global-alb-psc-cloud-run
  title: Apigee X runtime exposed through a global external Application Load Balancer and Private Service Connect
  category: serverless
  tags: [apigee, private service connect, psc neg, global external application load balancer, cloud run, api management]
  source: https://docs.cloud.google.com/apigee/docs/api-platform/architecture/overview
  description: The Apigee organization's runtime instance lives in a Google-managed tenant project and is reached from the customer VPC through a Private Service Connect service attachment; a PSC network endpoint group makes that attachment the backend of a global external Application Load Balancer with a managed certificate. API proxies deployed to the Apigee environment forward to target services such as a Cloud Run backend, and Cloud Armor on the backend service protects the public entry point.
  containers:
    - project: apigee-prj
      region: europe-west1
      vpcs:
        - name: apigee-vpc
          cidr: 10.40.0.0/16
          subnets:
            - {name: psc-neg-sub, cidr: 10.40.1.0/24, region: europe-west1}
  elements:
    - {tf: google_compute_global_address, name: api-ip, in: project:apigee-prj}
    - {tf: google_compute_global_forwarding_rule, name: api-https-rule, in: project:apigee-prj}
    - {tf: google_compute_target_https_proxy, name: api-https-proxy, in: project:apigee-prj}
    - {tf: google_compute_managed_ssl_certificate, name: api-cert, in: project:apigee-prj}
    - {tf: google_compute_url_map, name: api-url-map, in: project:apigee-prj}
    - {tf: google_compute_backend_service, name: apigee-backend, in: project:apigee-prj}
    - {tf: google_compute_security_policy, name: api-armor-policy, in: project:apigee-prj}
    - {tf: google_compute_region_network_endpoint_group, name: apigee-psc-neg, in: subnet:psc-neg-sub}
    - {tf: google_apigee_organization, name: apigee-org, in: project:apigee-prj}
    - {tf: google_apigee_instance, name: apigee-runtime-ew1, in: project:apigee-prj}
    - {tf: google_apigee_environment, name: prod-env, in: project:apigee-prj}
    - {tf: google_cloud_run_v2_service, name: orders-backend, in: project:apigee-prj}
  actors: [client]
  flows:
    - {from: client, to: api-https-rule, label: HTTPS API call, step: 1}
    - {from: api-https-rule, to: api-https-proxy, step: 2}
    - {from: api-cert, to: api-https-proxy}
    - {from: api-https-proxy, to: api-url-map, step: 3}
    - {from: api-url-map, to: apigee-backend, step: 4}
    - {from: api-armor-policy, to: apigee-backend, label: Cloud Armor}
    - {from: apigee-backend, to: apigee-psc-neg, step: 5}
    - {from: apigee-psc-neg, to: apigee-runtime-ew1, label: PSC service attachment, step: 6}
    - {from: apigee-org, to: apigee-runtime-ew1}
    - {from: prod-env, to: apigee-runtime-ew1, label: environment attached to instance}
    - {from: apigee-runtime-ew1, to: orders-backend, label: proxy target endpoint, step: 7}

- slug: firebase-hosting-cloud-run-rewrites
  title: Firebase Hosting serving static assets with rewrites to a Cloud Run backend
  category: serverless
  tags: [firebase hosting, cloud run, rewrites, cdn, dynamic content, firestore]
  source: https://firebase.google.com/docs/hosting/cloud-run
  description: Firebase Hosting serves the static site from its global CDN and a rewrite rule in firebase.json forwards requests that match a path pattern to a Cloud Run service in a named region, which must allow unauthenticated invocations because Hosting calls it directly. The dynamic service reads and writes application data in a Firestore database and its container image comes from Artifact Registry.
  containers:
    - project: firebase-web-prj
      region: europe-west1
  elements:
    - {tf: google_firebase_project, name: firebase-project, in: project:firebase-web-prj}
    - {tf: google_firebase_hosting_site, name: web-site, in: project:firebase-web-prj}
    - {tf: google_cloud_run_v2_service, name: dynamic-api, in: project:firebase-web-prj}
    - {tf: google_firestore_database, name: app-firestore, in: project:firebase-web-prj}
    - {tf: google_artifact_registry_repository, name: api-images, in: project:firebase-web-prj}
    - {tf: google_storage_bucket, name: hosting-uploads, in: project:firebase-web-prj}
  actors: [users]
  flows:
    - {from: users, to: web-site, label: HTTPS static assets from CDN, step: 1}
    - {from: firebase-project, to: web-site}
    - {from: web-site, to: dynamic-api, label: "rewrite /api/** to Cloud Run", step: 2}
    - {from: dynamic-api, to: app-firestore, label: document reads and writes, step: 3}
    - {from: dynamic-api, to: hosting-uploads, label: user files}
    - {from: api-images, to: dynamic-api, label: image pull}

- slug: firestore-document-triggers-functions
  title: Firestore document triggers running Cloud Functions for Firebase via Eventarc
  category: serverless
  tags: [firestore, cloud functions for firebase, eventarc, document triggers, pub/sub, firebase]
  source: https://firebase.google.com/docs/functions/firestore-events
  description: Second-generation Cloud Functions for Firebase register onDocumentCreated, onDocumentUpdated, onDocumentDeleted or onDocumentWritten handlers on a document path such as users/{userId}; Eventarc delivers each Firestore change as a CloudEvent carrying before and after snapshots. The handlers fan out side effects, for example publishing to a Pub/Sub topic and sending notifications, and must avoid writing back to the triggering document to prevent loops.
  containers:
    - project: firestore-fn-prj
      region: europe-west1
