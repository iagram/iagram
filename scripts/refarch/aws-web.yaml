        - name: beanstalk
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: db-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: db-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_elastic_beanstalk_application, name: php-app, in: region}
    - {tf: aws_elastic_beanstalk_environment, name: php-prod, in: vpc:beanstalk}
    - {tf: aws_s3_bucket, name: app-versions, in: region}
    - {tf: aws_internet_gateway, name: eb-igw, in: vpc:beanstalk}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_lb, name: eb-alb, in: vpc:beanstalk}
    - {tf: aws_autoscaling_group, name: eb-asg, in: vpc:beanstalk}
    - {tf: aws_instance, name: php-a, in: subnet:app-a}
    - {tf: aws_instance, name: php-b, in: subnet:app-b}
    - {tf: aws_db_instance, name: app-db, in: subnet:db-a}
    - {tf: aws_db_instance, name: app-db-standby, in: subnet:db-b}
  actors: [users, user]
  flows:
    - {from: user, to: php-app, label: eb deploy application version, step: 1}
    - {from: php-app, to: app-versions, label: store bundle, step: 2}
    - {from: php-app, to: php-prod, label: deploy to environment, step: 3}
    - {from: php-prod, to: eb-alb, label: provisions}
    - {from: php-prod, to: eb-asg, label: provisions}
    - {from: eb-asg, to: php-a, label: launches}
    - {from: eb-asg, to: php-b, label: launches}
    - {from: users, to: eb-alb, label: HTTPS, step: 4}
    - {from: eb-igw, to: eb-alb}
    - {from: eb-alb, to: php-a, step: 5}
    - {from: eb-alb, to: php-b}
    - {from: php-a, to: app-db, label: RDS_HOSTNAME environment property, step: 6}
    - {from: app-db, to: app-db-standby, label: Multi-AZ synchronous replica}
    - {from: php-a, to: nat-a}
    - {from: nat-a, to: eb-igw}

- slug: lightsail-ha-wordpress-lb
