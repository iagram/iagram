    - {from: moodle-a, to: nat-a, label: outbound, step: 4}
    - {from: moodle-b, to: nat-b, label: outbound}
    - {from: nat-a, to: moodle-igw}
    - {from: nat-b, to: moodle-igw}
    - {from: lms-alb, to: moodle-a, label: HTTP to Nginx PHP-FPM tasks}
    - {from: lms-alb, to: moodle-b, label: HTTP to Nginx PHP-FPM tasks}
    - {from: moodle-fargate, to: moodle-a, label: runs ECS tasks on Fargate, step: 5}
    - {from: moodle-fargate, to: moodle-b, label: runs ECS tasks on Fargate}
