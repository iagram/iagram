- slug: web-app-alb-asg-rds-multi-az
  title: Classic three-tier web application across two Availability Zones
  category: web
  tags: [three tier, alb, auto scaling, rds multi-az, elasticache, cloudfront, waf]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/web-application-architecture/web-application-architecture.html
  description: Route 53 and CloudFront front an internet-facing Application Load Balancer that spreads web servers in an Auto Scaling group across two Availability Zones, with AWS WAF filtering requests at the edge. Web instances read a Multi-AZ RDS database through an ElastiCache layer, and NAT gateways in the public subnets give the private tier outbound access.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
      vpcs:
        - name: web
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: app-zone, in: region}
    - {tf: aws_cloudfront_distribution, name: app-cdn, in: group:global edge}
    - {tf: aws_wafv2_web_acl, name: app-waf, in: group:global edge}
    - {tf: aws_s3_bucket, name: static-assets, in: region}
    - {tf: aws_internet_gateway, name: web-igw, in: vpc:web}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b}
    - {tf: aws_lb, name: web-alb, in: vpc:web}
    - {tf: aws_autoscaling_group, name: web-asg, in: vpc:web}
    - {tf: aws_instance, name: web-a, in: subnet:app-a}
    - {tf: aws_instance, name: web-b, in: subnet:app-b}
    - {tf: aws_elasticache_cluster, name: session-cache, in: subnet:data-a}
    - {tf: aws_db_instance, name: app-db, in: subnet:data-a}
    - {tf: aws_db_instance, name: app-db-standby, in: subnet:data-b}
  actors: [users]
  flows:
    - {from: users, to: app-zone, label: DNS lookup, step: 1}
    - {from: users, to: app-cdn, label: HTTPS, step: 2}
    - {from: app-waf, to: app-cdn, label: web ACL}
    - {from: app-cdn, to: static-assets, label: static origin}
    - {from: app-cdn, to: web-alb, label: dynamic origin, step: 3}
    - {from: web-alb, to: web-a, label: HTTP target, step: 4}
    - {from: web-alb, to: web-b, label: HTTP target}
    - {from: web-asg, to: web-a, label: scales}
    - {from: web-asg, to: web-b, label: scales}
    - {from: web-a, to: session-cache, label: cache read/write, step: 5}
    - {from: web-a, to: app-db, label: SQL, step: 6}
    - {from: app-db, to: app-db-standby, label: synchronous replication}
    - {from: web-a, to: nat-a, label: outbound updates}
    - {from: nat-a, to: web-igw}

- slug: wordpress-ha-cloudfront-efs-aurora
  title: Highly available WordPress with CloudFront, EFS, and Aurora
  category: web
  tags: [wordpress, cms, efs, aurora mysql, elasticache, cloudfront, auto scaling]
  source: https://docs.aws.amazon.com/whitepapers/latest/best-practices-wordpress/reference-architecture.html
  description: CloudFront caches content close to users, pulling static files from an S3 bucket and dynamic pages from an Application Load Balancer in front of an Auto Scaling group of WordPress instances. Every instance mounts a shared EFS file system through a mount target in each Availability Zone, caches queries in ElastiCache, and stores the WordPress database in Aurora MySQL.
  containers:
    - region: eu-west-1
      groups:
        - {label: global edge}
      vpcs:
        - name: wordpress
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: web-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: web-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: blog-zone, in: region}
    - {tf: aws_acm_certificate, name: blog-cert, in: region}
    - {tf: aws_cloudfront_distribution, name: blog-cdn, in: group:global edge}
    - {tf: aws_s3_bucket, name: media-assets, in: region}
    - {tf: aws_internet_gateway, name: wp-igw, in: vpc:wordpress}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b}
    - {tf: aws_lb, name: wp-alb, in: vpc:wordpress}
    - {tf: aws_autoscaling_group, name: wp-asg, in: vpc:wordpress}
    - {tf: aws_instance, name: wp-a, in: subnet:web-a}
    - {tf: aws_instance, name: wp-b, in: subnet:web-b}
    - {tf: aws_efs_file_system, name: wp-content, in: vpc:wordpress}
    - {tf: aws_elasticache_cluster, name: wp-cache, in: subnet:data-a}
    - {tf: aws_rds_cluster, name: wp-aurora, in: subnet:data-b}
  actors: [users]
  flows:
    - {from: users, to: blog-zone, label: DNS, step: 1}
    - {from: users, to: blog-cdn, label: HTTPS, step: 2}
    - {from: blog-cert, to: blog-cdn, label: TLS certificate}
    - {from: blog-cdn, to: media-assets, label: static content origin, step: 3}
    - {from: blog-cdn, to: wp-alb, label: dynamic content origin, step: 3}
    - {from: wp-alb, to: wp-a, step: 4}
    - {from: wp-alb, to: wp-b}
    - {from: wp-asg, to: wp-a, label: scales}
    - {from: wp-a, to: wp-content, label: NFS mount target per AZ, step: 5}
    - {from: wp-b, to: wp-content, label: NFS mount target per AZ}
    - {from: wp-a, to: wp-cache, label: object cache, step: 6}
    - {from: wp-a, to: wp-aurora, label: MySQL, step: 7}
    - {from: wp-a, to: nat-a, label: plugin updates}
    - {from: nat-a, to: wp-igw}

- slug: drupal-ha-efs-aurora-cloudfront
  title: Drupal reference architecture with shared EFS and Aurora
  category: web
  tags: [drupal, cms, efs, aurora, elasticache, cloudfront, acm]
  source: https://aws.amazon.com/efs/resources/aws-refarch-drupal/
