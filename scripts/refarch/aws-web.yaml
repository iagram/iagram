    - {from: store-cdn, to: magento-igw, label: origin requests, step: 3}
    - {from: magento-igw, to: varnish-alb, label: forward, step: 4}
    - {from: varnish-alb, to: varnish-a, label: HTTP, step: 5}
    - {from: varnish-alb, to: varnish-b, label: HTTP}
