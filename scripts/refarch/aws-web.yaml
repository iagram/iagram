    - {from: rtmp-input, to: live-encoder, label: attached input, step: 2}
    - {from: live-encoder, to: live-channel, label: ABR ladder over HLS ingest, step: 3}
    - {from: live-channel, to: live-cdn, label: HLS/DASH/CMAF origin endpoints, step: 4}
    - {from: demo-player, to: live-cdn, label: player page origin}
    - {from: users, to: live-cdn, label: playback, step: 5}
    - {from: live-encoder, to: stream-health, label: channel metrics}
    - {from: live-channel, to: stream-health, label: egress metrics}

