    - {tf: aws_lb, name: magento-alb, in: vpc:magento, at: [1, 3, 2, 1]}
    - {tf: aws_autoscaling_group, name: magento-asg, in: vpc:magento, at: [3, 4]}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a, at: [1, 1]}
    - {tf: aws_instance, name: bastion-a, in: subnet:public-a, at: [2, 1]}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b, at: [1, 1]}
