    - {tf: aws_route53_zone, name: lms-zone, in: group:edge, at: [1, 1]}
    - {tf: aws_cloudfront_distribution, name: lms-cdn, in: group:edge, at: [2, 1]}
    - {tf: aws_acm_certificate, name: lms-cert, in: group:edge, at: [3, 1]}
    - {tf: aws_internet_gateway, name: moodle-igw, in: vpc:moodle, at: [1, 1]}
    - {tf: aws_secretsmanager_secret, name: db-secret, in: vpc:moodle, at: [2, 1]}
    - {tf: aws_ecr_repository, name: moodle-images, in: vpc:moodle, at: [3, 1]}
    - {tf: aws_lb, name: lms-alb, in: vpc:moodle, at: [1, 3]}
    - {tf: aws_ecs_cluster, name: moodle-fargate, in: vpc:moodle, at: [2, 3]}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a, at: [1, 1]}
    - {tf: aws_ecs_service, name: moodle-a, in: subnet:app-a, at: [1, 1]}
    - {tf: aws_elasticache_cluster, name: cache-a, in: subnet:data-a, at: [1, 1]}
