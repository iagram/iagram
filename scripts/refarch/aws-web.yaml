- slug: multi-region-active-active-cloudfront-s3
  title: Multi-Region active-active static content with CloudFront and S3
  category: resilience
  tags: [multi-region, active-active, cloudfront, origin group, s3 replication, lambda@edge, route 53]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/using-amazon-cloudfront-and-amazon-s3-to-build-multi-region-active-active-geo-proximity-applications/
  description: Content is written to an S3 bucket in each Region (US and AP) and kept in sync with two-way replication, and a single CloudFront distribution runs an origin-request Lambda@Edge function that identifies the edge region of each cache miss and rewrites the origin to the bucket nearest the requesting edge location, which fetches the object through an origin access identity. A CloudFront origin group retries against the other Region when the primary returns an error, so a regional S3 impairment does not take the site down.
  containers:
    - region: us-east-1
      at: [1, 1, 1, 2]
      groups:
        - {label: CloudFront, at: [1, 1]}
    - region: ap-southeast-1
      at: [2, 2]
  elements:
    - {tf: aws_cloudfront_distribution, name: site-cdn, in: group:CloudFront, at: [1, 1, 2, 1]}
    - {tf: aws_lambda_function, name: origin-router-us, in: group:CloudFront, at: [1, 2]}
    - {tf: aws_cloudfront_origin_access_identity, name: edge-location-us, in: group:CloudFront, at: [1, 3]}
    - {tf: aws_lambda_function, name: origin-router-ap, in: group:CloudFront, at: [2, 2]}
    - {tf: aws_cloudfront_origin_access_identity, name: edge-location-ap, in: group:CloudFront, at: [2, 3]}
    - {tf: aws_s3_bucket, name: content-us, in: region:us-east-1, at: [1, 2]}
    - {tf: aws_s3_bucket, name: content-ap, in: region:ap-southeast-1, at: [1, 1]}
  actors: [{type: client, name: client, at: [1, 1]}]
  flows:
    - {from: client, to: site-cdn, label: HTTPS request, step: 1}
    - {from: site-cdn, to: origin-router-us, label: origin request on cache miss, step: 2}
    - {from: site-cdn, to: origin-router-ap, label: origin request on cache miss, step: 2}
    - {from: origin-router-us, to: edge-location-us, label: identify edge region and modify request, step: 3}
    - {from: origin-router-ap, to: edge-location-ap, label: identify edge region and modify request, step: 3}
    - {from: edge-location-us, to: content-us, label: fetch with origin access identity, step: 4}
    - {from: edge-location-ap, to: content-ap, label: fetch with origin access identity, step: 4}
    - {from: content-us, to: content-ap, label: two-way S3 replication}

- slug: s3-static-contact-form-ses
  title: Dynamic contact form for an S3 static website with Lambda and SES
  category: web
  tags: [static website, contact form, api gateway, lambda, ses, cors]
  source: https://aws.amazon.com/blogs/architecture/create-dynamic-contact-forms-for-s3-static-websites-using-aws-lambda-amazon-api-gateway-and-amazon-ses/
  description: A static marketing site hosted on S3 under a Route 53 domain embeds a contact form whose JavaScript posts the fields to an API Gateway endpoint with CORS enabled. A Lambda function validates the payload and sends an email through Amazon SES, which relays it via the recipient's third-party mail server to the business owner.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_route53_zone, name: site-zone, in: region, at: [1, 1]}
    - {tf: aws_s3_bucket, name: site-bucket, in: region, at: [1, 2]}
    - {tf: aws_api_gateway_rest_api, name: contact-api, in: region, at: [2, 1]}
    - {tf: aws_lambda_function, name: contact-handler, in: region, at: [2, 2]}
    - {tf: aws_ses_domain_identity, name: mail-domain, in: region, at: [2, 3]}
  actors: [{type: users, name: users, at: [1, 1]}, {type: server, name: third-party-mail-server, at: [1, 3]}, {type: user, name: business-owner, at: [1, 4]}]
  flows:
    - {from: users, to: site-zone, label: DNS for the static site and the form API, step: 1}
    - {from: site-zone, to: site-bucket, label: static website hosting}
    - {from: users, to: contact-api, label: HTTP POST request from the contact form (CORS), step: 2}
    - {from: contact-api, to: contact-handler, label: Lambda proxy integration, step: 3}
    - {from: contact-handler, to: mail-domain, label: SendEmail, step: 4}
    - {from: mail-domain, to: third-party-mail-server, label: SMTP delivery, step: 5}
    - {from: third-party-mail-server, to: business-owner, label: notification email, step: 6}
