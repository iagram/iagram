- slug: saas-serverless-multi-tenant
  title: Serverless multi-tenant SaaS with pooled and siloed tiers
  category: web
  tags: [saas, multi-tenant, cognito, api gateway, lambda authorizer, dynamodb, tenant isolation]
  source: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/serverless-saas.html
  description: A shared web application hosted on S3 signs tenants in through a Cognito user pool whose JWTs carry tenant ID and tier as custom claims. API Gateway usage plans throttle each tier and a Lambda authorizer maps the claims to scoped credentials before the JWT with tenant context reaches the application microservices, each a set of Lambda functions with its own data store partitioned by tenant, while a column of shared services (registration, user and tenant management, provisioning, system and tenant admin, billing and metrics) onboards and operates tenants.
  containers:
    - region: us-east-1
      groups:
        - {label: web application, at: [1, 2, 1, 2]}
        - {label: API gateway, at: [2, 2, 1, 2]}
        - {label: order microservice, at: [3, 1]}
        - {label: product microservice, at: [3, 2]}
        - {label: customer microservice, at: [3, 3]}
        - {label: catalog microservice, at: [4, 1]}
        - {label: reporting microservice, at: [4, 2]}
        - {label: inventory microservice, at: [4, 3]}
        - {label: shared services, at: [1, 4, 4, 1]}
  elements:
    - {tf: aws_cognito_user_pool, name: tenant-users, in: region, at: [1, 1]}
    - {tf: aws_s3_bucket, name: saas-web, in: group:web application, at: [1, 1]}
    - {tf: aws_api_gateway_usage_plan, name: tier-usage-plans, in: region, at: [2, 1]}
    - {tf: aws_api_gateway_rest_api, name: saas-api, in: group:API gateway, at: [1, 1]}
    - {tf: aws_lambda_function, name: tenant-authorizer, in: group:API gateway, at: [1, 2]}
    - {tf: aws_lambda_function, name: order-service, in: group:order microservice, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: orders, in: group:order microservice, at: [2, 1]}
    - {tf: aws_lambda_function, name: product-service, in: group:product microservice, at: [1, 1]}
    - {tf: aws_rds_cluster, name: products, in: group:product microservice, at: [2, 1]}
    - {tf: aws_lambda_function, name: customer-service, in: group:customer microservice, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: customers, in: group:customer microservice, at: [2, 1]}
    - {tf: aws_lambda_function, name: catalog-service, in: group:catalog microservice, at: [1, 1]}
    - {tf: aws_s3_bucket, name: catalog-assets, in: group:catalog microservice, at: [2, 1]}
    - {tf: aws_lambda_function, name: reporting-service, in: group:reporting microservice, at: [1, 1]}
    - {tf: aws_redshift_cluster, name: reporting-warehouse, in: group:reporting microservice, at: [2, 1]}
    - {tf: aws_lambda_function, name: inventory-service, in: group:inventory microservice, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: inventory, in: group:inventory microservice, at: [2, 1]}
    - {tf: aws_lambda_function, name: registration, in: group:shared services, at: [1, 1]}
    - {tf: aws_lambda_function, name: user-manager, in: group:shared services, at: [1, 2]}
    - {tf: aws_lambda_function, name: provisioning, in: group:shared services, at: [2, 1]}
    - {tf: aws_lambda_function, name: tenant-manager, in: group:shared services, at: [2, 2]}
    - {tf: aws_lambda_function, name: system-admin, in: group:shared services, at: [3, 1]}
    - {tf: aws_lambda_function, name: tenant-admin, in: group:shared services, at: [3, 2]}
    - {tf: aws_lambda_function, name: billing-manager, in: group:shared services, at: [4, 1]}
    - {tf: aws_lambda_function, name: metrics-manager, in: group:shared services, at: [4, 2]}
  actors: [{type: users, name: users, at: [1, 1]}]
  flows:
    - {from: users, to: saas-web, label: HTTPS web application, step: 1}
    - {from: saas-web, to: tenant-users, label: "sign in, JWT with tenantId and tier claims", step: 2}
    - {from: saas-web, to: saas-api, label: JWT (tenant context), step: 3}
    - {from: saas-api, to: tenant-authorizer, label: Lambda authorizer validates JWT and scopes credentials, step: 4}
    - {from: tier-usage-plans, to: saas-api, label: per-tier throttling and quotas}
    - {from: saas-api, to: order-service, label: JWT (tenant context), step: 5}
    - {from: saas-api, to: product-service, label: JWT (tenant context)}
    - {from: saas-api, to: customer-service, label: JWT (tenant context)}
    - {from: saas-api, to: catalog-service, label: JWT (tenant context)}
    - {from: saas-api, to: reporting-service, label: JWT (tenant context)}
    - {from: saas-api, to: inventory-service, label: JWT (tenant context)}
    - {from: order-service, to: orders, label: tenant-partitioned items, step: 6}
