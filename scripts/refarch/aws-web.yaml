  source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/ecommerce-caching-valkey.html
  description: Stateless web servers behind an Application Load Balancer keep user sessions and shopping carts in an ElastiCache for Valkey replication group with a Multi-AZ replica, so any instance can serve any request and the tier scales horizontally. Product catalog reads use a cache-aside pattern that falls back to the RDS database on a miss, while writes go to the database and invalidate the cached keys.
