    - {tf: aws_s3_bucket, name: demo-player, in: group:origin}
    - {tf: aws_cloudfront_distribution, name: live-cdn, in: group:global edge}
    - {tf: aws_cloudwatch_dashboard, name: stream-health, in: region}
