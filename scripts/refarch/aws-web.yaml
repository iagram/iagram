- slug: apigw-waf-cloudfront-perimeter
  title: API perimeter protection with CloudFront, WAF, and API Gateway
  category: edge
  tags: [api gateway, waf, cloudfront, origin verify, lambda, secrets manager]
  source: https://aws.amazon.com/blogs/security/protect-apis-with-amazon-api-gateway-and-perimeter-protection-services/
  description: Clients reach a regional REST API only through a CloudFront distribution protected by an AWS WAF web ACL and AWS Shield; a Lambda@Edge function on the origin request signs each call with SigV4 so API Gateway, configured for IAM authorization, accepts only requests that passed through the edge. A client that calls the API Gateway endpoint directly is rejected because its request carries no valid signature.
  containers:
    - region: us-east-1
      groups:
        - {label: perimeter, at: [1, 1]}
  elements:
    - {tf: aws_wafv2_web_acl, name: edge-waf, in: group:perimeter, at: [1, 1]}
    - {tf: aws_shield_protection, name: shield, in: group:perimeter, at: [2, 1]}
    - {tf: aws_cloudfront_distribution, name: api-cdn, in: region, at: [1, 2]}
    - {tf: aws_lambda_function, name: edge-signer, in: region, at: [1, 3]}
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: region, at: [1, 4]}
  actors:
    - {type: client, name: direct-client, at: [1, 1]}
    - {type: client, name: client, at: [2, 1]}
  flows:
    - {from: client, to: edge-waf, label: HTTPS API call, step: 1}
    - {from: edge-waf, to: api-cdn, label: WAF rules and Shield DDoS protection on the distribution, step: 2}
    - {from: shield, to: api-cdn, label: DDoS protection}
    - {from: api-cdn, to: edge-signer, label: origin request event, step: 3}
    - {from: edge-signer, to: orders-api, label: SigV4 signed request, step: 4}
    - {from: direct-client, to: orders-api, label: direct call without signature rejected by IAM authorization, step: 6}

- slug: apigw-edge-optimized-custom-domain
  title: Edge-optimized REST API with a custom domain
  category: web
  tags: [api gateway, edge-optimized, custom domain, acm, route 53, lambda]
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-edge-optimized-custom-domain-name.html
  description: An edge-optimized REST API is reached through an API Gateway managed CloudFront distribution, so requests enter at the nearest point of presence and travel the AWS backbone to the regional API endpoint. A custom domain name with an ACM certificate issued in us-east-1 is mapped to the API stage and published as a Route 53 alias record, while Lambda functions and DynamoDB implement the resources.
