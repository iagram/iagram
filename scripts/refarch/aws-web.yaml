    - {tf: aws_instance, name: varnish-a, in: subnet:private-a, at: [1, 1]}
    - {tf: aws_mq_broker, name: mq-a, in: subnet:private-a, at: [2, 1]}
    - {tf: aws_instance, name: magento-a, in: subnet:private-a, at: [1, 2]}
    - {tf: aws_opensearch_domain, name: catalog-search-a, in: subnet:private-a, at: [1, 3]}
    - {tf: aws_elasticache_replication_group, name: redis-primary, in: subnet:private-a, at: [1, 4]}
    - {tf: aws_rds_cluster, name: aurora-primary, in: subnet:private-a, at: [1, 5]}
    - {tf: aws_instance, name: varnish-b, in: subnet:private-b, at: [1, 1]}
    - {tf: aws_mq_broker, name: mq-b, in: subnet:private-b, at: [2, 1]}
    - {tf: aws_instance, name: magento-b, in: subnet:private-b, at: [1, 2]}
    - {tf: aws_opensearch_domain, name: catalog-search-b, in: subnet:private-b, at: [1, 3]}
    - {tf: aws_elasticache_replication_group, name: redis-replica, in: subnet:private-b, at: [1, 4]}
    - {tf: aws_rds_cluster_instance, name: aurora-replica, in: subnet:private-b, at: [1, 5]}
