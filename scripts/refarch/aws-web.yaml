- slug: amplify-appsync-mobile-web-backend
  title: Modern serverless mobile and web backend with Amplify, Cognito, and AppSync
  category: web
  tags: [amplify, appsync, graphql, cognito, mobile backend, dynamodb, pinpoint]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/modern-serverless-mobile-web/modern-serverless-mobile-web.html
  description: Mobile and web clients built with the Amplify libraries authenticate against a Cognito user pool and exchange the JWT for AWS credentials through an identity pool. Authenticated clients run GraphQL queries, mutations, and subscriptions on AppSync, whose resolvers read DynamoDB directly or invoke Lambda for business logic, while user files land in S3 and Pinpoint records analytics events.
  containers:
    - region: us-west-2
      groups:
        - {label: identity}
        - {label: api}
        - {label: data}
  elements:
    - {tf: aws_amplify_app, name: client-app, in: region}
    - {tf: aws_cognito_user_pool, name: user-pool, in: group:identity}
    - {tf: aws_cognito_identity_pool, name: identity-pool, in: group:identity}
    - {tf: aws_appsync_graphql_api, name: graphql-api, in: group:api}
    - {tf: aws_lambda_function, name: business-logic, in: group:api}
    - {tf: aws_dynamodb_table, name: app-data, in: group:data}
    - {tf: aws_s3_bucket, name: user-uploads, in: group:data}
    - {tf: aws_pinpoint_app, name: analytics, in: group:data}
  actors: [mobile, users]
  flows:
    - {from: mobile, to: user-pool, label: sign in, step: 1}
    - {from: user-pool, to: mobile, label: JWT tokens, step: 2}
    - {from: mobile, to: identity-pool, label: exchange JWT for AWS credentials, step: 3}
    - {from: mobile, to: graphql-api, label: GraphQL query/mutation/subscription, step: 4}
    - {from: users, to: graphql-api, label: GraphQL from web client}
    - {from: graphql-api, to: user-pool, label: token authorization}
