    - {from: store-secrets, to: magento-a, label: database credentials}
    - {from: magento-a, to: store-email, label: transactional email}
    - {from: bastion-a, to: magento-a, label: SSH}
    - {from: bastion-b, to: magento-b, label: SSH}
