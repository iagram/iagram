- slug: elasticache-valkey-ecommerce-session-cache
  title: E-commerce web tier with ElastiCache for Valkey sessions and caching
  category: web
  tags: [elasticache, valkey, session store, cache-aside, leaderboards, rds]
  source: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/ecommerce-caching-valkey.html
  description: Stateless web servers behind an Application Load Balancer keep user sessions and shopping carts in an ElastiCache for Valkey replication group with a Multi-AZ replica, so any instance can serve any request and the tier scales horizontally. Product catalog reads use a cache-aside pattern that falls back to the RDS database on a miss, while writes go to the database and invalidate the cached keys.
  containers:
    - region: eu-west-1
      vpcs:
        - name: shop
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: web-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: web-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: cache-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: cache-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: shop-igw, in: vpc:shop}
    - {tf: aws_lb, name: shop-alb, in: vpc:shop}
    - {tf: aws_autoscaling_group, name: web-asg, in: vpc:shop}
    - {tf: aws_instance, name: web-a, in: subnet:web-a}
    - {tf: aws_instance, name: web-b, in: subnet:web-b}
    - {tf: aws_elasticache_replication_group, name: session-cache, in: subnet:cache-a}
    - {tf: aws_elasticache_cluster, name: catalog-cache, in: subnet:cache-b}
    - {tf: aws_db_instance, name: catalog-db, in: subnet:cache-b}
  actors: [users]
  flows:
    - {from: users, to: shop-alb, label: HTTPS, step: 1}
    - {from: shop-igw, to: shop-alb}
    - {from: shop-alb, to: web-a, label: no sticky sessions needed, step: 2}
    - {from: shop-alb, to: web-b}
    - {from: web-asg, to: web-a, label: scales}
    - {from: web-a, to: session-cache, label: GET/SET session and cart with TTL, step: 3}
    - {from: web-b, to: session-cache, label: same session visible from any instance}
    - {from: web-a, to: catalog-cache, label: cache-aside read, step: 4}
    - {from: web-a, to: catalog-db, label: on miss read from RDS then populate cache, step: 5}
    - {from: web-a, to: catalog-db, label: "writes, then invalidate keys"}

- slug: vod-mediaconvert-cloudfront
  title: Video on demand with S3, MediaConvert, and CloudFront
  category: media
  tags: [video on demand, mediaconvert, hls, cloudfront, s3, lambda, sns]
  source: https://docs.aws.amazon.com/solutions/latest/video-on-demand-on-aws-foundation/architecture-overview.html
  description: Uploading a source video to an S3 bucket triggers a job-submit Lambda function that creates a transcoding job in AWS Elemental MediaConvert using a stored job template. MediaConvert writes its logs to CloudWatch and HLS adaptive-bitrate renditions to a destination bucket that a CloudFront distribution serves to players, while EventBridge routes the job state change to a job-complete Lambda that reads the outputs, records job metadata back in the source bucket and publishes the status to SNS.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_s3_bucket, name: source-bucket, in: region, at: [1, 1]}
    - {tf: aws_media_convert_queue, name: vod-queue, in: region, at: [1, 2, 1, 2]}
    - {tf: aws_s3_bucket, name: destination-bucket, in: region, at: [1, 4]}
    - {tf: aws_cloudfront_distribution, name: vod-cdn, in: region, at: [1, 5]}
    - {tf: aws_lambda_function, name: job-submit, in: region, at: [2, 1]}
    - {tf: aws_cloudwatch_log_group, name: mediaconvert-logs, in: region, at: [2, 2]}
    - {tf: aws_cloudwatch_event_rule, name: mediaconvert-status, in: region, at: [2, 3]}
    - {tf: aws_lambda_function, name: job-complete, in: region, at: [2, 4]}
    - {tf: aws_sns_topic, name: job-notifications, in: region, at: [2, 5]}
  actors: []
  flows:
    - {from: source-bucket, to: job-submit, label: "s3:ObjectCreated event on upload", step: 1}
    - {from: job-submit, to: vod-queue, label: CreateJob with template, step: 2}
    - {from: source-bucket, to: vod-queue, label: read source video, step: 3}
    - {from: vod-queue, to: mediaconvert-logs, label: job logs, step: 4}
    - {from: vod-queue, to: mediaconvert-status, label: job state change event, step: 5}
    - {from: mediaconvert-status, to: job-complete, label: EventBridge target, step: 6}
    - {from: destination-bucket, to: job-complete, label: read output details}
    - {from: job-complete, to: source-bucket, label: write job metadata}
    - {from: job-complete, to: job-notifications, label: publish COMPLETE/ERROR, step: 7}
    - {from: vod-queue, to: destination-bucket, label: write HLS renditions and thumbnails, step: 8}
    - {from: destination-bucket, to: vod-cdn, label: origin for HLS playback, step: 9}

- slug: live-streaming-medialive-mediapackage
