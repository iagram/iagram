    - {from: site-cdn, to: app-alb, label: dynamic origin, step: 5}
    - {from: app-alb, to: app-server}
    - {from: origin-igw, to: app-alb}
    - {from: site-cdn, to: viewer-response-headers, label: viewer response adds security headers, step: 6}
    - {from: site-cdn, to: users, label: response, step: 7}

- slug: cloudfront-lambda-edge-private-content
