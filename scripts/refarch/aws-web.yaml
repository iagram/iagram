- slug: moodle-lms-ha
  title: Moodle learning management system for high availability
  category: web
  tags: [moodle, lms, education, efs, aurora, elasticache, cloudfront]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/moodle-for-high-availability-on-aws/moodle-for-high-availability-on-aws.html
  description: Route 53 directs students to CloudFront, secured with an ACM certificate, which forwards dynamic requests through the internet gateway to an Application Load Balancer in front of Nginx and PHP-FPM containers running as ECS tasks on AWS Fargate in private subnets of two Availability Zones, with NAT gateways in the public subnets for outbound access. Each zone holds ElastiCache, EFS, and an Aurora DB writer that replicate with their peers, Secrets Manager supplies the database credentials, and Amazon ECR stores the container images.
  containers:
    - region: ap-southeast-2
      groups:
        - {label: edge, at: [1, 1]}
      vpcs:
        - name: moodle
          cidr: 10.0.0.0/16
          at: [1, 2]
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: app-a, cidr: 10.0.10.0/24, az: a, public: false, at: [2, 1]}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false, at: [3, 1]}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: app-b, cidr: 10.0.11.0/24, az: b, public: false, at: [2, 1]}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false, at: [3, 1]}
