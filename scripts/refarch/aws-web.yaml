    - {tf: aws_api_gateway_rest_api, name: petstore-api, in: group:backend}
    - {tf: aws_lambda_function, name: get-pets, in: group:backend}
    - {tf: aws_lambda_function, name: create-pet, in: group:backend}
    - {tf: aws_dynamodb_table, name: pets, in: group:backend}
    - {tf: aws_cognito_user_pool, name: api-users, in: group:backend}
  actors: [client, mobile]
  flows:
    - {from: client, to: api-zone, label: DNS lookup api.example.com, step: 1}
    - {from: api-zone, to: api-example-com, label: alias record to distribution domain, step: 2}
    - {from: client, to: api-example-com, label: HTTPS at nearest edge POP, step: 3}
    - {from: mobile, to: api-example-com, label: HTTPS}
    - {from: api-cert, to: api-example-com, label: TLS certificate}
    - {from: api-example-com, to: petstore-api, label: base path mapping to stage, step: 4}
    - {from: petstore-api, to: api-users, label: Cognito authorizer}
    - {from: petstore-api, to: get-pets, label: GET /pets, step: 5}
    - {from: petstore-api, to: create-pet, label: POST /pets}
    - {from: get-pets, to: pets, label: Query, step: 6}
    - {from: create-pet, to: pets, label: PutItem}

- slug: elastic-beanstalk-ha-php-rds
  title: High-availability Elastic Beanstalk application with an external RDS database
  category: web
  tags: [elastic beanstalk, php, alb, auto scaling, rds multi-az, s3]
  source: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/php-ha-tutorial.html
  description: An Elastic Beanstalk web server environment provisions an Application Load Balancer, an Auto Scaling group across two Availability Zones, and the EC2 instances that run the application, with application versions stored in an S3 bucket. The database is a Multi-AZ RDS instance created outside the environment so it survives environment rebuilds and blue/green swaps, and its endpoint is passed to the application as environment properties.
  containers:
    - region: us-west-2
