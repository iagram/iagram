      vpcs:
        - name: shop
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: web-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: web-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: cache-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: cache-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: shop-igw, in: vpc:shop}
    - {tf: aws_lb, name: shop-alb, in: vpc:shop}
    - {tf: aws_autoscaling_group, name: web-asg, in: vpc:shop}
    - {tf: aws_instance, name: web-a, in: subnet:web-a}
    - {tf: aws_instance, name: web-b, in: subnet:web-b}
    - {tf: aws_elasticache_replication_group, name: session-cache, in: subnet:cache-a}
    - {tf: aws_elasticache_cluster, name: catalog-cache, in: subnet:cache-b}
    - {tf: aws_db_instance, name: catalog-db, in: subnet:cache-b}
  actors: [users]
  flows:
    - {from: users, to: shop-alb, label: HTTPS, step: 1}
    - {from: shop-igw, to: shop-alb}
    - {from: shop-alb, to: web-a, label: no sticky sessions needed, step: 2}
    - {from: shop-alb, to: web-b}
    - {from: web-asg, to: web-a, label: scales}
    - {from: web-a, to: session-cache, label: GET/SET session and cart with TTL, step: 3}
    - {from: web-b, to: session-cache, label: same session visible from any instance}
    - {from: web-a, to: catalog-cache, label: cache-aside read, step: 4}
    - {from: web-a, to: catalog-db, label: on miss read from RDS then populate cache, step: 5}
    - {from: web-a, to: catalog-db, label: "writes, then invalidate keys"}

- slug: vod-mediaconvert-cloudfront
  title: Video on demand with S3, MediaConvert, and CloudFront
  category: media
  tags: [video on demand, mediaconvert, hls, cloudfront, s3, lambda, sns]
  source: https://docs.aws.amazon.com/solutions/latest/video-on-demand-on-aws-foundation/architecture-overview.html
  description: Uploading a source video to an S3 bucket triggers a Lambda function that submits a transcoding job to AWS Elemental MediaConvert using a stored job template. MediaConvert writes HLS adaptive-bitrate renditions to a destination bucket that a CloudFront distribution serves to players, a completion Lambda publishes job status to SNS, and CloudWatch logs and job metadata are kept for tracking.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
        - {label: ingest}
        - {label: transcode}
  elements:
    - {tf: aws_s3_bucket, name: source-bucket, in: group:ingest}
    - {tf: aws_lambda_function, name: job-submit, in: group:ingest}
    - {tf: aws_media_convert_queue, name: vod-queue, in: group:transcode}
    - {tf: aws_s3_bucket, name: destination-bucket, in: group:transcode}
    - {tf: aws_lambda_function, name: job-complete, in: group:transcode}
    - {tf: aws_sns_topic, name: job-notifications, in: group:transcode}
    - {tf: aws_cloudwatch_event_rule, name: mediaconvert-status, in: group:transcode}
    - {tf: aws_cloudfront_distribution, name: vod-cdn, in: group:global edge}
  actors: [user, users]
  flows:
    - {from: user, to: source-bucket, label: upload source video, step: 1}
    - {from: source-bucket, to: job-submit, label: "s3:ObjectCreated event", step: 2}
    - {from: job-submit, to: vod-queue, label: CreateJob with template, step: 3}
    - {from: vod-queue, to: source-bucket, label: read source}
    - {from: vod-queue, to: destination-bucket, label: write HLS renditions and thumbnails, step: 4}
    - {from: vod-queue, to: mediaconvert-status, label: job state change event, step: 5}
    - {from: mediaconvert-status, to: job-complete, label: EventBridge target, step: 6}
    - {from: job-complete, to: job-notifications, label: publish COMPLETE/ERROR, step: 7}
    - {from: users, to: vod-cdn, label: HLS playback, step: 8}
    - {from: vod-cdn, to: destination-bucket, label: origin via OAC, step: 9}

- slug: live-streaming-medialive-mediapackage
  title: Live streaming with MediaLive, MediaPackage, and CloudFront
  category: media
  tags: [live streaming, medialive, mediapackage, hls, dash, cloudfront, contributor encoder]
  source: https://docs.aws.amazon.com/solutions/latest/live-streaming-on-aws/solution-overview.html
  description: A contribution encoder pushes a live feed to an AWS Elemental MediaLive input, and a MediaLive channel encodes it into an adaptive bitrate ladder that is sent to a MediaPackage channel. MediaPackage packages the stream as HLS, DASH, and CMAF endpoints that a CloudFront distribution delivers to viewers, with an optional demo player hosted on S3.
  containers:
    - region: us-west-2
      groups:
        - {label: global edge}
        - {label: ingest}
        - {label: origin}
  elements:
    - {tf: aws_medialive_input, name: rtmp-input, in: group:ingest}
    - {tf: aws_medialive_channel, name: live-encoder, in: group:ingest}
    - {tf: aws_media_package_channel, name: live-channel, in: group:origin}
    - {tf: aws_s3_bucket, name: demo-player, in: group:origin}
    - {tf: aws_cloudfront_distribution, name: live-cdn, in: group:global edge}
    - {tf: aws_cloudwatch_dashboard, name: stream-health, in: region}
  actors: [device, users]
  flows:
    - {from: device, to: rtmp-input, label: RTMP/RTP contribution feed, step: 1}
    - {from: rtmp-input, to: live-encoder, label: attached input, step: 2}
    - {from: live-encoder, to: live-channel, label: ABR ladder over HLS ingest, step: 3}
    - {from: live-channel, to: live-cdn, label: HLS/DASH/CMAF origin endpoints, step: 4}
    - {from: demo-player, to: live-cdn, label: player page origin}
    - {from: users, to: live-cdn, label: playback, step: 5}
    - {from: live-encoder, to: stream-health, label: channel metrics}
    - {from: live-channel, to: stream-health, label: egress metrics}

- slug: headless-web-store-ecommerce
  title: Headless e-commerce web store on AWS
  category: web
  tags: [e-commerce, headless commerce, retail, appsync, opensearch, personalize, cognito]
  source: https://docs.aws.amazon.com/solutions/web-store-on-aws/
  description: A React storefront is delivered from S3 through CloudFront with AWS WAF, and the browser calls a GraphQL API on AppSync and REST APIs on API Gateway that Lambda functions serve. Shoppers authenticate with Cognito, catalog search runs on OpenSearch, orders and carts live in DynamoDB, and product recommendations come from Amazon Personalize.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
        - {label: api}
        - {label: commerce services}
  elements:
    - {tf: aws_route53_zone, name: store-zone, in: region}
    - {tf: aws_cloudfront_distribution, name: storefront-cdn, in: group:global edge}
    - {tf: aws_wafv2_web_acl, name: storefront-waf, in: group:global edge}
    - {tf: aws_s3_bucket, name: storefront-bucket, in: region}
    - {tf: aws_cognito_user_pool, name: shoppers, in: group:api}
    - {tf: aws_appsync_graphql_api, name: commerce-graphql, in: group:api}
    - {tf: aws_api_gateway_rest_api, name: commerce-rest, in: group:api}
    - {tf: aws_lambda_function, name: cart-service, in: group:commerce services}
    - {tf: aws_lambda_function, name: order-service, in: group:commerce services}
    - {tf: aws_dynamodb_table, name: carts-orders, in: group:commerce services}
    - {tf: aws_opensearch_domain, name: product-search, in: group:commerce services}
    - {tf: aws_personalize_dataset_group, name: recommendations, in: group:commerce services}
  actors: [users]
  flows:
    - {from: users, to: store-zone, label: DNS, step: 1}
    - {from: users, to: storefront-cdn, label: HTTPS storefront, step: 2}
    - {from: storefront-waf, to: storefront-cdn, label: web ACL}
    - {from: storefront-cdn, to: storefront-bucket, label: static React app, step: 3}
    - {from: users, to: shoppers, label: sign in, step: 4}
    - {from: users, to: commerce-graphql, label: GraphQL with Cognito JWT, step: 5}
    - {from: users, to: commerce-rest, label: REST checkout}
    - {from: commerce-graphql, to: product-search, label: search resolver, step: 6}
    - {from: commerce-graphql, to: cart-service, label: Lambda resolver}
    - {from: commerce-rest, to: order-service, label: Lambda integration, step: 7}
    - {from: cart-service, to: carts-orders, label: cart items}
    - {from: order-service, to: carts-orders, label: orders, step: 8}
    - {from: commerce-graphql, to: recommendations, label: GetRecommendations}

- slug: serverless-microservices-ecommerce
  title: Highly available serverless microservices e-commerce site
  category: web
  tags: [e-commerce, microservices, api gateway, lambda, dynamodb, sqs, step functions, cognito]
  source: https://aws.amazon.com/blogs/architecture/architecting-a-highly-available-serverless-microservices-based-ecommerce-site/
  description: A static frontend on S3 and CloudFront talks to independently deployable product, cart, and order microservices exposed through API Gateway and implemented as Lambda functions, each owning its DynamoDB table. Checkout hands off to an SQS queue and a Step Functions workflow that processes payment and fulfilment asynchronously and confirms the order over SES, while Cognito authenticates shoppers.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
        - {label: product service}
        - {label: cart service}
        - {label: order service}
  elements:
    - {tf: aws_cloudfront_distribution, name: shop-cdn, in: group:global edge}
    - {tf: aws_s3_bucket, name: shop-frontend, in: region}
    - {tf: aws_cognito_user_pool, name: shoppers, in: region}
    - {tf: aws_api_gateway_rest_api, name: shop-api, in: region}
    - {tf: aws_lambda_function, name: product-fn, in: group:product service}
    - {tf: aws_dynamodb_table, name: products, in: group:product service}
    - {tf: aws_lambda_function, name: cart-fn, in: group:cart service}
    - {tf: aws_dynamodb_table, name: carts, in: group:cart service}
    - {tf: aws_lambda_function, name: order-fn, in: group:order service}
    - {tf: aws_sqs_queue, name: order-queue, in: group:order service}
    - {tf: aws_sfn_state_machine, name: checkout-workflow, in: group:order service}
    - {tf: aws_dynamodb_table, name: orders, in: group:order service}
    - {tf: aws_ses_domain_identity, name: shop-mail, in: region}
  actors: [users]
  flows:
    - {from: users, to: shop-cdn, label: HTTPS, step: 1}
    - {from: shop-cdn, to: shop-frontend, label: static origin}
    - {from: users, to: shoppers, label: sign in, step: 2}
    - {from: users, to: shop-api, label: REST with JWT, step: 3}
    - {from: shop-api, to: shoppers, label: Cognito authorizer}
    - {from: shop-api, to: product-fn, label: GET /products, step: 4}
    - {from: product-fn, to: products}
    - {from: shop-api, to: cart-fn, label: PUT /cart}
    - {from: cart-fn, to: carts}
    - {from: shop-api, to: order-fn, label: POST /checkout, step: 5}
    - {from: order-fn, to: order-queue, label: enqueue order, step: 6}
    - {from: order-queue, to: checkout-workflow, label: start execution, step: 7}
    - {from: checkout-workflow, to: orders, label: persist order state, step: 8}
    - {from: checkout-workflow, to: shop-mail, label: order confirmation email, step: 9}

- slug: saas-serverless-multi-tenant
  title: Serverless multi-tenant SaaS with pooled and siloed tiers
  category: web
  tags: [saas, multi-tenant, cognito, api gateway, lambda authorizer, dynamodb, tenant isolation]
  source: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/serverless-saas.html
  description: A shared web application on S3 and CloudFront signs tenants in through Cognito user pools whose JWTs carry tenant ID and tier as custom claims. API Gateway calls a Lambda authorizer that maps the claims to scoped IAM credentials, so pooled tenants share Lambda functions and DynamoDB tables partitioned by tenant while premium tenants get dedicated siloed stacks, and an onboarding service provisions each new tenant.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
        - {label: shared services}
        - {label: pooled tier}
        - {label: siloed tenant}
  elements:
    - {tf: aws_cloudfront_distribution, name: saas-cdn, in: group:global edge}
    - {tf: aws_s3_bucket, name: saas-web, in: region}
    - {tf: aws_cognito_user_pool, name: tenant-users, in: group:shared services}
    - {tf: aws_lambda_function, name: tenant-onboarding, in: group:shared services}
    - {tf: aws_dynamodb_table, name: tenant-registry, in: group:shared services}
    - {tf: aws_api_gateway_rest_api, name: pooled-api, in: group:pooled tier}
    - {tf: aws_lambda_function, name: tenant-authorizer, in: group:pooled tier}
    - {tf: aws_lambda_function, name: product-service, in: group:pooled tier}
    - {tf: aws_dynamodb_table, name: pooled-products, in: group:pooled tier}
    - {tf: aws_api_gateway_rest_api, name: silo-api, in: group:siloed tenant}
    - {tf: aws_lambda_function, name: silo-product-service, in: group:siloed tenant}
    - {tf: aws_dynamodb_table, name: silo-products, in: group:siloed tenant}
  actors: [users, user]
  flows:
    - {from: user, to: tenant-onboarding, label: tenant sign-up, step: 1}
    - {from: tenant-onboarding, to: tenant-users, label: create user pool group / pool, step: 2}
    - {from: tenant-onboarding, to: tenant-registry, label: register tenant and tier}
    - {from: users, to: saas-cdn, label: HTTPS web app, step: 3}
    - {from: saas-cdn, to: saas-web, label: static origin}
    - {from: users, to: tenant-users, label: "sign in, JWT with tenantId and tier claims", step: 4}
    - {from: users, to: pooled-api, label: API call with JWT, step: 5}
    - {from: pooled-api, to: tenant-authorizer, label: Lambda authorizer, step: 6}
    - {from: tenant-authorizer, to: tenant-registry, label: look up tenant}
    - {from: tenant-authorizer, to: pooled-api, label: policy plus scoped STS credentials, step: 7}
    - {from: pooled-api, to: product-service, step: 8}
    - {from: product-service, to: pooled-products, label: leading-key condition on tenantId, step: 9}
    - {from: users, to: silo-api, label: premium tenant traffic}
    - {from: silo-api, to: silo-product-service}
    - {from: silo-product-service, to: silo-products, label: dedicated table}

- slug: multi-region-active-active-cloudfront-s3
  title: Multi-Region active-active static content with CloudFront and S3
  category: resilience
  tags: [multi-region, active-active, cloudfront, origin group, s3 replication, lambda@edge, route 53]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/using-amazon-cloudfront-and-amazon-s3-to-build-multi-region-active-active-geo-proximity-applications/
  description: Content is written to an S3 bucket in each Region and kept in sync with two-way replication, and a single CloudFront distribution uses an origin-request Lambda@Edge function to route each cache miss to the bucket nearest the requesting edge location. A CloudFront origin group retries against the other Region when the primary returns an error, so a regional S3 impairment does not take the site down.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
    - region: eu-west-1
  elements:
    - {tf: aws_route53_zone, name: site-zone, in: region:us-east-1}
    - {tf: aws_acm_certificate, name: site-cert, in: region:us-east-1}
    - {tf: aws_cloudfront_distribution, name: site-cdn, in: group:global edge}
    - {tf: aws_lambda_function, name: origin-router-edge, in: group:global edge}
    - {tf: aws_s3_bucket, name: content-us, in: region:us-east-1}
    - {tf: aws_s3_bucket, name: content-eu, in: region:eu-west-1}
    - {tf: aws_s3_bucket_replication_configuration, name: us-to-eu, in: region:us-east-1}
    - {tf: aws_s3_bucket_replication_configuration, name: eu-to-us, in: region:eu-west-1}
  actors: [users]
  flows:
    - {from: users, to: site-zone, label: DNS, step: 1}
    - {from: users, to: site-cdn, label: HTTPS at nearest edge, step: 2}
    - {from: site-cert, to: site-cdn, label: TLS certificate}
    - {from: site-cdn, to: origin-router-edge, label: origin request on cache miss, step: 3}
    - {from: origin-router-edge, to: site-cdn, label: set origin to closest bucket, step: 4}
    - {from: site-cdn, to: content-us, label: primary origin for Americas, step: 5}
    - {from: site-cdn, to: content-eu, label: primary origin for Europe, step: 5}
    - {from: site-cdn, to: content-eu, label: origin group failover on 5xx from us-east-1}
    - {from: us-to-eu, to: content-eu, label: replicate new objects}
    - {from: eu-to-us, to: content-us, label: replicate new objects}
    - {from: content-us, to: us-to-eu, label: source}
    - {from: content-eu, to: eu-to-us, label: source}

- slug: s3-static-contact-form-ses
