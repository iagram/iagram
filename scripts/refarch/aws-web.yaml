    - {tf: aws_lambda_function, name: origin-request-edge, in: group:global edge}
    - {tf: aws_s3_bucket, name: static-origin, in: region}
    - {tf: aws_internet_gateway, name: origin-igw, in: vpc:origin}
    - {tf: aws_lb, name: app-alb, in: vpc:origin}
    - {tf: aws_instance, name: app-server, in: subnet:app-a}
  actors: [users]
  flows:
    - {from: users, to: site-cdn, label: HTTPS, step: 1}
    - {from: site-cdn, to: viewer-request-rewrite, label: viewer request, step: 2}
    - {from: viewer-request-rewrite, to: site-cdn, label: "normalized URI, A/B cookie, redirect", step: 3}
    - {from: site-cdn, to: origin-request-edge, label: origin request (Lambda@Edge) on miss, step: 4}
