- slug: cognito-alb-authentication
  title: Application Load Balancer built-in authentication with Cognito
  category: web
  tags: [cognito, alb authentication, oidc, session cookie, auto scaling]
  source: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
  description: An HTTPS listener on the Application Load Balancer redirects unauthenticated users to the identity provider's authorization endpoint, exchanges the returned authorization code at the token endpoint, fetches claims from the user-info endpoint, and sets an encrypted session cookie. Subsequent requests are validated by the load balancer and forwarded to the target with the user claims in headers, so the application code carries no login logic; here the identity provider is a Cognito user pool.
  containers:
    - region: eu-central-1
      groups:
        - {label: identity provider, at: [2, 1, 1, 2]}
      vpcs:
        - name: app
          cidr: 10.0.0.0/16
          at: [1, 2]
          subnets:
            - {name: app-a, cidr: 10.0.10.0/24, az: a, public: false, at: [1, 1]}
  elements:
    - {tf: aws_lb, name: app-alb, in: vpc:app, at: [1, 1]}
    - {tf: aws_lb_target_group, name: target, in: subnet:app-a, at: [1, 1]}
    - {tf: aws_cognito_user_pool, name: employee-pool, in: group:identity provider, at: [1, 1]}
  actors:
    - {type: users, name: users, at: [1, 1]}
  flows:
    - {from: users, to: app-alb, label: HTTPS request without session cookie, step: 1}
    - {from: app-alb, to: employee-pool, label: redirect the browser to the authorization endpoint, step: 2}
    - {from: employee-pool, to: app-alb, label: browser redirected back with authorization code, step: 3}
    - {from: app-alb, to: employee-pool, label: authorization code to the token endpoint, step: 4}
    - {from: employee-pool, to: app-alb, label: ID and access tokens, step: 5}
    - {from: app-alb, to: employee-pool, label: access token to the user-info endpoint, step: 6}
    - {from: employee-pool, to: app-alb, label: user claims, step: 7}
    - {from: app-alb, to: users, label: set AWSELBAuthSessionCookie and redirect to the original URL, step: 8}
    - {from: app-alb, to: target, label: forward with x-amzn-oidc-* headers, step: 9}
    - {from: target, to: app-alb, label: response, step: 10}
    - {from: app-alb, to: users, label: response, step: 11}

- slug: lambda-edge-image-resizing
  title: On-the-fly image resizing with CloudFront and Lambda@Edge
  category: edge
  tags: [lambda@edge, cloudfront, image optimization, s3, viewer request, origin response]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/resizing-images-with-amazon-cloudfront-lambdaedge-aws-cdn-blog/
  description: A viewer-request Lambda@Edge function normalizes the requested dimensions and format into a canonical cache key, and on a cache miss the origin-response function fetches the source image from S3, resizes it, writes the derived image back to the bucket, and returns it. Later requests for the same variant are served from the CloudFront cache or directly from the pre-generated object.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
  elements:
    - {tf: aws_route53_zone, name: img-zone, in: region}
    - {tf: aws_acm_certificate, name: img-cert, in: region}
    - {tf: aws_cloudfront_distribution, name: image-cdn, in: group:global edge}
    - {tf: aws_lambda_function, name: viewer-request-normalize, in: group:global edge}
    - {tf: aws_lambda_function, name: origin-response-resize, in: group:global edge}
    - {tf: aws_s3_bucket, name: image-bucket, in: region}
  actors: [users]
  flows:
    - {from: users, to: img-zone, label: DNS, step: 1}
    - {from: users, to: image-cdn, label: "GET /images/cat.jpg?d=200x200", step: 2}
    - {from: img-cert, to: image-cdn, label: TLS certificate}
    - {from: image-cdn, to: viewer-request-normalize, label: viewer request event, step: 3}
    - {from: viewer-request-normalize, to: image-cdn, label: rewritten URI /images/200x200/webp/cat.jpg, step: 4}
    - {from: image-cdn, to: image-bucket, label: origin fetch on cache miss, step: 5}
    - {from: image-cdn, to: origin-response-resize, label: origin response event on 404, step: 6}
    - {from: origin-response-resize, to: image-bucket, label: "GET source, PUT resized variant", step: 7}
    - {from: origin-response-resize, to: image-cdn, label: return resized image, step: 8}
    - {from: image-cdn, to: users, label: cached response, step: 9}

- slug: cloudfront-functions-viewer-request
  title: Lightweight edge logic with CloudFront Functions
  category: edge
  tags: [cloudfront functions, url rewrite, header manipulation, a/b testing, cache key]
  source: https://aws.amazon.com/blogs/aws/introducing-cloudfront-functions-run-your-code-at-the-edge-with-low-latency-at-any-scale/
  description: CloudFront Functions run sub-millisecond JavaScript at every edge location on viewer-request and viewer-response events for cache-key normalization, URL rewrites and redirects, header manipulation, and cookie-based A/B routing, so each client is served by the edge location closest to it. Heavier logic such as network calls or origin selection runs in Lambda@Edge at the regional edge location, which fetches from the origin on a cache miss.
  containers:
    - region: us-east-1
      groups:
        - {label: edge-location-a, at: [1, 1]}
        - {label: edge-location-b, at: [2, 1]}
        - {label: edge-location-c, at: [3, 1]}
        - {label: regional-edge-location, at: [2, 2]}
  elements:
    - {tf: aws_cloudfront_function, name: viewer-function-a, in: group:edge-location-a, at: [1, 1]}
    - {tf: aws_cloudfront_function, name: viewer-function-b, in: group:edge-location-b, at: [1, 1]}
    - {tf: aws_cloudfront_function, name: viewer-function-c, in: group:edge-location-c, at: [1, 1]}
    - {tf: aws_lambda_function, name: origin-request-edge, in: group:regional-edge-location, at: [1, 1]}
    - {tf: aws_cloudfront_distribution, name: site-cdn, in: region, at: [1, 2]}
  actors:
    - {type: client, name: client-a, at: [1, 1]}
    - {type: client, name: client-b, at: [2, 1]}
    - {type: client, name: client-c, at: [3, 1]}
    - {type: server, name: origin, at: [2, 3]}
  flows:
    - {from: client-a, to: viewer-function-a, label: viewer request, step: 1}
    - {from: client-b, to: viewer-function-b, label: viewer request, step: 1}
    - {from: client-c, to: viewer-function-c, label: viewer request, step: 1}
    - {from: viewer-function-a, to: origin-request-edge, label: cache miss to regional edge cache, step: 2}
    - {from: viewer-function-b, to: origin-request-edge, label: cache miss to regional edge cache, step: 2}
    - {from: viewer-function-c, to: origin-request-edge, label: cache miss to regional edge cache, step: 2}
    - {from: origin-request-edge, to: origin, label: origin request (Lambda@Edge), step: 3}
    - {from: site-cdn, to: origin-request-edge, label: distribution behaviours associate the functions}

- slug: cloudfront-lambda-edge-private-content
