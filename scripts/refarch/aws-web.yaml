- slug: web-app-alb-asg-rds-multi-az
  title: Classic three-tier web application across two Availability Zones
  category: web
  tags: [three tier, alb, auto scaling, rds multi-az, elasticache, cloudfront, waf]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/web-application-architecture/web-application-architecture.html
  description: Route 53 and CloudFront front an internet-facing Application Load Balancer that spreads web servers in an Auto Scaling group across two Availability Zones, with AWS WAF filtering requests at the edge. Web instances read a Multi-AZ RDS database through an ElastiCache layer, and NAT gateways in the public subnets give the private tier outbound access.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
      vpcs:
        - name: web
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: app-zone, in: region}
    - {tf: aws_cloudfront_distribution, name: app-cdn, in: group:global edge}
    - {tf: aws_wafv2_web_acl, name: app-waf, in: group:global edge}
    - {tf: aws_s3_bucket, name: static-assets, in: region}
    - {tf: aws_internet_gateway, name: web-igw, in: vpc:web}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b}
    - {tf: aws_lb, name: web-alb, in: vpc:web}
    - {tf: aws_autoscaling_group, name: web-asg, in: vpc:web}
    - {tf: aws_instance, name: web-a, in: subnet:app-a}
    - {tf: aws_instance, name: web-b, in: subnet:app-b}
    - {tf: aws_elasticache_cluster, name: session-cache, in: subnet:data-a}
    - {tf: aws_db_instance, name: app-db, in: subnet:data-a}
    - {tf: aws_db_instance, name: app-db-standby, in: subnet:data-b}
  actors: [users]
  flows:
    - {from: users, to: app-zone, label: DNS lookup, step: 1}
    - {from: users, to: app-cdn, label: HTTPS, step: 2}
    - {from: app-waf, to: app-cdn, label: web ACL}
    - {from: app-cdn, to: static-assets, label: static origin}
    - {from: app-cdn, to: web-alb, label: dynamic origin, step: 3}
    - {from: web-alb, to: web-a, label: HTTP target, step: 4}
    - {from: web-alb, to: web-b, label: HTTP target}
    - {from: web-asg, to: web-a, label: scales}
    - {from: web-asg, to: web-b, label: scales}
    - {from: web-a, to: session-cache, label: cache read/write, step: 5}
    - {from: web-a, to: app-db, label: SQL, step: 6}
    - {from: app-db, to: app-db-standby, label: synchronous replication}
    - {from: web-a, to: nat-a, label: outbound updates}
    - {from: nat-a, to: web-igw}

- slug: wordpress-ha-cloudfront-efs-aurora
  title: Highly available WordPress with CloudFront, EFS, and Aurora
  category: web
  tags: [wordpress, cms, efs, aurora mysql, elasticache, cloudfront, auto scaling]
  source: https://docs.aws.amazon.com/whitepapers/latest/best-practices-wordpress/reference-architecture.html
  description: Route 53 resolves the site to CloudFront, which caches content close to users, pulling static assets from an S3 bucket and dynamic pages through the internet gateway to an Application Load Balancer in front of an Auto Scaling group of WordPress instances in the private application subnets of two Availability Zones. NAT gateways and a bastion host live in the public subnets, every instance mounts a shared EFS file system through a mount target in each zone, caches queries in an ElastiCache for Memcached node per zone, and stores the WordPress database in an Aurora MySQL cluster whose writer is joined by a read replica.
  containers:
    - region: eu-west-1
      vpcs:
        - name: wordpress
          cidr: 10.0.0.0/16
          at: [1, 2, 3, 1]
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: web-a, cidr: 10.0.10.0/24, az: a, public: false, at: [1, 2]}
            - {name: web-b, cidr: 10.0.11.0/24, az: b, public: false, at: [1, 2]}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false, at: [1, 3]}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false, at: [1, 3]}
  elements:
    - {tf: aws_route53_zone, name: blog-zone, in: region, at: [1, 1]}
    - {tf: aws_cloudfront_distribution, name: blog-cdn, in: region, at: [2, 1]}
    - {tf: aws_s3_bucket, name: media-assets, in: region, at: [3, 1]}
    - {tf: aws_efs_file_system, name: wp-content, in: region, at: [2, 3]}
    - {tf: aws_internet_gateway, name: wp-igw, in: vpc:wordpress, at: [1, 1]}
    - {tf: aws_lb, name: wp-alb, in: vpc:wordpress, at: [2, 1]}
    - {tf: aws_autoscaling_group, name: wp-asg, in: vpc:wordpress, at: [3, 2]}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a, at: [1, 1]}
    - {tf: aws_instance, name: bastion, in: subnet:public-a, at: [1, 2]}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b, at: [1, 1]}
    - {tf: aws_instance, name: wp-a, in: subnet:web-a, at: [1, 1]}
    - {tf: aws_instance, name: wp-b, in: subnet:web-b, at: [1, 1]}
    - {tf: aws_elasticache_cluster, name: memcached-a, in: subnet:data-a, at: [1, 1]}
    - {tf: aws_elasticache_cluster, name: memcached-b, in: subnet:data-b, at: [1, 1]}
    - {tf: aws_rds_cluster, name: wp-aurora, in: subnet:data-b, at: [1, 2]}
    - {tf: aws_rds_cluster_instance, name: aurora-read-replica, in: subnet:data-b, at: [1, 1]}
  actors: [{type: users, name: users, at: [1, 1]}]
  flows:
    - {from: users, to: blog-zone, label: DNS}
    - {from: users, to: blog-cdn, label: HTTPS, step: 1}
    - {from: blog-cdn, to: media-assets, label: static assets origin, step: 2}
    - {from: blog-cdn, to: wp-igw, label: dynamic content origin, step: 3}
    - {from: wp-igw, to: wp-alb, label: HTTPS, step: 4}
    - {from: wp-b, to: nat-b, label: outbound updates via NAT gateway, step: 5}
    - {from: nat-b, to: wp-igw}
    - {from: wp-a, to: nat-a, label: outbound updates via NAT gateway}
    - {from: nat-a, to: wp-igw}
    - {from: wp-alb, to: wp-a, label: forward to WordPress instances, step: 6}
    - {from: wp-alb, to: wp-b}
    - {from: wp-asg, to: wp-a, label: scales}
    - {from: wp-asg, to: wp-b, label: scales}
    - {from: bastion, to: wp-a, label: SSH administration}
    - {from: wp-a, to: memcached-a, label: object cache, step: 7}
    - {from: wp-b, to: memcached-b, label: object cache}
    - {from: wp-a, to: wp-aurora, label: MySQL writes to the master, step: 8}
    - {from: wp-b, to: wp-aurora, label: MySQL}
    - {from: wp-aurora, to: aurora-read-replica, label: Aurora replication}
    - {from: wp-a, to: wp-content, label: NFS via mount target per AZ, step: 9}
    - {from: wp-b, to: wp-content, label: NFS via mount target per AZ}

- slug: drupal-ha-efs-aurora-cloudfront
  title: Drupal reference architecture with shared EFS and Aurora
  category: web
  tags: [drupal, cms, efs, aurora, elasticache, cloudfront, acm]
  source: https://aws.amazon.com/efs/resources/aws-refarch-drupal/
  description: Drupal web servers in an Auto Scaling group behind an Application Load Balancer share the sites/default/files directory over an EFS file system so uploaded content is visible from every instance. CloudFront terminates TLS with an ACM certificate and caches pages, ElastiCache holds the Drupal cache bins, and an Aurora cluster provides the database across two Availability Zones.
  containers:
    - region: us-west-2
      groups:
        - {label: global edge}
      vpcs:
        - name: drupal
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: web-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: web-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: drupal-zone, in: region}
    - {tf: aws_acm_certificate, name: drupal-cert, in: region}
    - {tf: aws_cloudfront_distribution, name: drupal-cdn, in: group:global edge}
    - {tf: aws_internet_gateway, name: drupal-igw, in: vpc:drupal}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_lb, name: drupal-alb, in: vpc:drupal}
    - {tf: aws_autoscaling_group, name: drupal-asg, in: vpc:drupal}
    - {tf: aws_instance, name: drupal-a, in: subnet:web-a}
    - {tf: aws_instance, name: drupal-b, in: subnet:web-b}
    - {tf: aws_efs_file_system, name: drupal-files, in: vpc:drupal}
    - {tf: aws_elasticache_cluster, name: drupal-cache, in: subnet:data-a}
    - {tf: aws_rds_cluster, name: drupal-aurora, in: subnet:data-b}
  actors: [users]
  flows:
    - {from: users, to: drupal-zone, label: DNS, step: 1}
    - {from: users, to: drupal-cdn, label: HTTPS, step: 2}
    - {from: drupal-cert, to: drupal-cdn, label: TLS certificate}
    - {from: drupal-cdn, to: drupal-alb, label: origin, step: 3}
    - {from: drupal-alb, to: drupal-a, step: 4}
    - {from: drupal-alb, to: drupal-b}
    - {from: drupal-asg, to: drupal-a, label: scales}
    - {from: drupal-a, to: drupal-files, label: sites/default/files over NFS, step: 5}
    - {from: drupal-b, to: drupal-files, label: NFS}
    - {from: drupal-a, to: drupal-cache, label: cache bins, step: 6}
    - {from: drupal-a, to: drupal-aurora, label: MySQL, step: 7}
    - {from: drupal-a, to: nat-a, label: composer/module updates}
    - {from: nat-a, to: drupal-igw}

- slug: magento-adobe-commerce-refarch
  title: Magento Open Source and Adobe Commerce on AWS
  category: web
  tags: [magento, adobe commerce, e-commerce, opensearch, elasticache, efs, aurora]
  source: https://docs.aws.amazon.com/whitepapers/latest/migrating-magento-open-source-adobe-commerce-to-aws/reference-architecture.html
  description: Users reach the store through Route 53, AWS WAF, and CloudFront; an Application Load Balancer sends requests to Varnish cache instances in each Availability Zone, and cache misses go through a second load balancer to Magento EC2 instances in an Auto Scaling group. Magento uses Amazon MQ, OpenSearch for catalog search, ElastiCache for Redis for sessions and full-page cache, Aurora MySQL with a read replica, and S3 as remote storage for media, with Secrets Manager holding credentials, SES sending email, and NAT gateways and bastion hosts in the public subnets.
  containers:
    - region: us-east-1
      groups:
        - {label: edge, at: [1, 1]}
      vpcs:
        - name: magento
          cidr: 10.0.0.0/16
          at: [1, 2]
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false, at: [1, 2]}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false, at: [1, 2]}
  elements:
    - {tf: aws_route53_zone, name: store-zone, in: group:edge, at: [1, 1]}
    - {tf: aws_wafv2_web_acl, name: store-waf, in: group:edge, at: [2, 1]}
    - {tf: aws_cloudfront_distribution, name: store-cdn, in: group:edge, at: [3, 1]}
    - {tf: aws_secretsmanager_secret, name: store-secrets, in: group:edge, at: [4, 1]}
    - {tf: aws_ses_domain_identity, name: store-email, in: group:edge, at: [5, 1]}
