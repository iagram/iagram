          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: web-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: web-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: drupal-zone, in: region}
    - {tf: aws_acm_certificate, name: drupal-cert, in: region}
    - {tf: aws_cloudfront_distribution, name: drupal-cdn, in: group:global edge}
    - {tf: aws_internet_gateway, name: drupal-igw, in: vpc:drupal}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_lb, name: drupal-alb, in: vpc:drupal}
    - {tf: aws_autoscaling_group, name: drupal-asg, in: vpc:drupal}
    - {tf: aws_instance, name: drupal-a, in: subnet:web-a}
    - {tf: aws_instance, name: drupal-b, in: subnet:web-b}
    - {tf: aws_efs_file_system, name: drupal-files, in: vpc:drupal}
    - {tf: aws_elasticache_cluster, name: drupal-cache, in: subnet:data-a}
    - {tf: aws_rds_cluster, name: drupal-aurora, in: subnet:data-b}
  actors: [users]
  flows:
    - {from: users, to: drupal-zone, label: DNS, step: 1}
    - {from: users, to: drupal-cdn, label: HTTPS, step: 2}
    - {from: drupal-cert, to: drupal-cdn, label: TLS certificate}
    - {from: drupal-cdn, to: drupal-alb, label: origin, step: 3}
    - {from: drupal-alb, to: drupal-a, step: 4}
    - {from: drupal-alb, to: drupal-b}
    - {from: drupal-asg, to: drupal-a, label: scales}
    - {from: drupal-a, to: drupal-files, label: sites/default/files over NFS, step: 5}
    - {from: drupal-b, to: drupal-files, label: NFS}
    - {from: drupal-a, to: drupal-cache, label: cache bins, step: 6}
    - {from: drupal-a, to: drupal-aurora, label: MySQL, step: 7}
    - {from: drupal-a, to: nat-a, label: composer/module updates}
    - {from: nat-a, to: drupal-igw}

- slug: magento-adobe-commerce-refarch
  title: Magento Open Source and Adobe Commerce on AWS
  category: web
  tags: [magento, adobe commerce, e-commerce, opensearch, elasticache, efs, aurora]
  source: https://docs.aws.amazon.com/whitepapers/latest/migrating-magento-open-source-adobe-commerce-to-aws/reference-architecture.html
  description: Magento web and admin nodes run in Auto Scaling groups behind an Application Load Balancer, sharing media and var directories through EFS and caching sessions and full pages in ElastiCache for Redis. Catalog search runs on an OpenSearch domain, the store database on Aurora MySQL, and CloudFront with AWS WAF delivers the storefront and shields it from bots.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge}
      vpcs:
        - name: magento
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.0.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.0.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.0.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_cloudfront_distribution, name: store-cdn, in: group:global edge}
    - {tf: aws_wafv2_web_acl, name: store-waf, in: group:global edge}
    - {tf: aws_s3_bucket, name: store-media, in: region}
    - {tf: aws_internet_gateway, name: magento-igw, in: vpc:magento}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_lb, name: store-alb, in: vpc:magento}
    - {tf: aws_autoscaling_group, name: web-asg, in: vpc:magento}
    - {tf: aws_instance, name: web-a, in: subnet:app-a}
    - {tf: aws_instance, name: web-b, in: subnet:app-b}
    - {tf: aws_instance, name: admin-cron, in: subnet:app-a}
    - {tf: aws_efs_file_system, name: magento-shared, in: vpc:magento}
    - {tf: aws_elasticache_replication_group, name: redis-cache, in: subnet:data-a}
    - {tf: aws_opensearch_domain, name: catalog-search, in: subnet:data-b}
    - {tf: aws_rds_cluster, name: store-aurora, in: subnet:data-b}
  actors: [users]
  flows:
    - {from: users, to: store-cdn, label: HTTPS, step: 1}
    - {from: store-waf, to: store-cdn, label: bot control and managed rules}
    - {from: store-cdn, to: store-media, label: static media origin}
    - {from: store-cdn, to: store-alb, label: storefront origin, step: 2}
    - {from: store-alb, to: web-a, step: 3}
    - {from: store-alb, to: web-b}
    - {from: web-asg, to: web-a, label: scales}
    - {from: web-a, to: magento-shared, label: pub/media and var over NFS}
    - {from: admin-cron, to: magento-shared, label: NFS}
    - {from: web-a, to: redis-cache, label: sessions and full page cache, step: 4}
    - {from: web-a, to: catalog-search, label: product search, step: 5}
    - {from: web-a, to: store-aurora, label: MySQL, step: 6}
    - {from: admin-cron, to: store-aurora, label: indexers and cron}
    - {from: web-a, to: nat-a}
    - {from: nat-a, to: magento-igw}

- slug: moodle-lms-ha
