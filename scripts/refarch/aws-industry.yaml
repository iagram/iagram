- slug: retail-product-substitutions-opensearch-knn
  title: Retail product substitutions with OpenSearch k-NN embeddings
  category: industry
  tags: [retail, personalization, product substitution, opensearch, k-nn, embeddings]
  source: https://aws.amazon.com/solutions/guidance/product-substitutions-on-aws/
  description: Guidance for Product Substitutions on AWS embeds product names and descriptions with Lambda and stores the vectors in an Amazon OpenSearch Service k-NN index seeded from product data in S3 and DynamoDB. A Cognito-authenticated API Gateway endpoint invokes a query Lambda that finds the nearest neighbours of an out-of-stock item and returns substitute products, with CloudWatch metrics and SNS alerts for operations.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: query-api}]
  elements:
    - {tf: aws_s3_bucket, name: product-catalog-data, in: group:ingestion}
    - {tf: aws_dynamodb_table, name: product-seed-table, in: group:ingestion}
    - {tf: aws_lambda_function, name: embed-and-load, in: group:ingestion}
    - {tf: aws_opensearch_domain, name: product-knn-index, in: region}
    - {tf: aws_cognito_user_pool, name: api-users, in: group:query-api}
    - {tf: aws_api_gateway_rest_api, name: substitutions-api, in: group:query-api}
    - {tf: aws_lambda_function, name: find-substitutes, in: group:query-api}
    - {tf: aws_sns_topic, name: ops-alerts, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: search-latency-alarm, in: region}
  actors: [client]
  flows:
    - {from: product-catalog-data, to: embed-and-load, label: product descriptions, step: 1}
    - {from: product-seed-table, to: embed-and-load, label: seed items}
    - {from: embed-and-load, to: product-knn-index, label: index embeddings, step: 2}
    - {from: client, to: substitutions-api, label: GET substitutes for SKU, step: 3}
    - {from: substitutions-api, to: api-users, label: Cognito authorizer}
    - {from: substitutions-api, to: find-substitutes, label: Lambda proxy, step: 4}
    - {from: find-substitutes, to: product-knn-index, label: k-NN query, step: 5}
    - {from: product-knn-index, to: search-latency-alarm, label: metrics}
    - {from: search-latency-alarm, to: ops-alerts, label: alarm action}

- slug: payments-iso20022-event-driven-messaging
  title: ISO 20022 payment messaging workflows with SQS FIFO microservices
  category: industry
  tags: [financial services, payments, iso 20022, event-driven, sqs, dynamodb, multi-region]
  source: https://docs.aws.amazon.com/solutions/iso-20022-messaging-workflows-on-aws/
  description: Guidance for ISO 20022 Messaging Workflows on AWS receives payment messages through a Cognito-protected API Gateway reached via Route 53 and protected by AWS WAF, assigns a transaction ID recorded in DynamoDB, and passes the message through incoming, consuming and releasing microservices connected by FIFO SQS queues, with FIPS 140-2, KYC/AML and fraud/liquidity microservices invoked during consumption. Each stage persists the ISO 20022 payload to S3 and updates the transaction status (ACCP, ACTC, ACSP, ACSC or RJCT); a timeout function rejects transactions that exceed the SLA, SNS notifies consumers when an outgoing message is ready, and reader and writer MQ microservices bridge Amazon MQ to an on-premises messaging queue, mainframe and Db2 database over Direct Connect or Site-to-Site VPN.
  containers:
    - datacenter: on-premises
      at: [2, 2]
    - region: us-east-1
      at: [1, 2]
      account_at: [1, 2, 1, 3]
      groups:
        - {label: api-layer, at: [1, 1, 3, 1]}
        - {label: compliance-msas, at: [1, 2, 1, 3]}
        - {label: api-consumers, at: [1, 6]}
        - {label: workflow, at: [2, 2, 1, 5]}
        - {label: data-layer, at: [3, 2, 1, 5]}
  elements:
    - {tf: aws_route53_zone, name: api-dns, in: account, at: [1, 1]}
    - {tf: aws_wafv2_web_acl, name: api-waf, in: group:api-layer, at: [1, 1]}
    - {tf: aws_api_gateway_rest_api, name: payments-api, in: group:api-layer, at: [2, 1]}
    - {tf: aws_cognito_user_pool, name: api-consumer-auth, in: group:api-layer, at: [3, 1]}
    - {tf: aws_lambda_function, name: fips-msa, in: group:compliance-msas, at: [1, 1]}
    - {tf: aws_lambda_function, name: kyc-aml-msa, in: group:compliance-msas, at: [1, 2]}
    - {tf: aws_lambda_function, name: fraud-liquidity-msa, in: group:compliance-msas, at: [1, 3]}
    - {tf: aws_lambda_function, name: outgoing-msa, in: region, at: [1, 5]}
    - {tf: aws_lambda_function, name: writer-mq-msa, in: group:api-consumers, at: [1, 1]}
    - {tf: aws_lambda_function, name: reader-mq-msa, in: group:api-consumers, at: [2, 1]}
    - {tf: aws_lambda_function, name: incoming-msa, in: group:workflow, at: [1, 1]}
    - {tf: aws_lambda_function, name: consuming-msa, in: group:workflow, at: [1, 2]}
    - {tf: aws_lambda_function, name: releasing-msa, in: group:workflow, at: [1, 3]}
    - {tf: aws_lambda_function, name: transaction-msa, in: group:workflow, at: [1, 4]}
    - {tf: aws_lambda_function, name: timeout-msa, in: group:workflow, at: [1, 5]}
    - {tf: aws_sqs_queue, name: incoming-queue, in: group:data-layer, at: [1, 1]}
    - {tf: aws_sqs_queue, name: consuming-queue, in: group:data-layer, at: [1, 2]}
    - {tf: aws_sqs_queue, name: releasing-queue, in: group:data-layer, at: [1, 3]}
    - {tf: aws_sns_topic, name: outgoing-notifications, in: group:data-layer, at: [1, 4]}
    - {tf: aws_dynamodb_table, name: transaction-status, in: group:data-layer, at: [1, 5]}
    - {tf: aws_s3_bucket, name: iso20022-messages, in: region, at: [4, 3]}
    - {tf: aws_mq_broker, name: messaging-queue, in: region, at: [3, 6]}
  actors: [{type: client, at: [1, 1]}, datacenter, {type: server, name: mainframe, at: [2, 3]}, {type: database, name: db2, at: [2, 4]}]
  flows:
    - {from: client, to: api-dns, label: resolve api.example.com and auth.example.com}
    - {from: client, to: api-consumer-auth, label: OAuth 2.0 token, step: 1}
    - {from: client, to: payments-api, label: POST transaction, step: 2}
    - {from: api-waf, to: payments-api, link: aws_wafv2_web_acl_association}
    - {from: payments-api, to: transaction-msa, label: create transaction ID}
    - {from: transaction-msa, to: transaction-status, label: status ACCP}
    - {from: transaction-msa, to: outgoing-notifications, label: subscribe consumer to notifications, step: 3}
    - {from: payments-api, to: incoming-queue, label: ISO 20022 pacs.008, step: 4}
    - {from: incoming-queue, to: incoming-msa, link: aws_lambda_event_source_mapping, step: 5}
    - {from: incoming-msa, to: iso20022-messages, label: incoming path}
    - {from: incoming-msa, to: consuming-queue, label: status ACTC}
    - {from: consuming-queue, to: consuming-msa, link: aws_lambda_event_source_mapping, step: 6}
    - {from: consuming-msa, to: fips-msa, label: FIPS 140-2 check}
    - {from: consuming-msa, to: kyc-aml-msa, label: KYC and AML check}
    - {from: consuming-msa, to: fraud-liquidity-msa, label: fraud and liquidity check}
    - {from: consuming-msa, to: transaction-status, label: ACSP or RJCT}
    - {from: consuming-msa, to: releasing-queue, label: confirmation or rejection}
    - {from: releasing-queue, to: releasing-msa, link: aws_lambda_event_source_mapping, step: 7}
    - {from: releasing-msa, to: iso20022-messages, label: outgoing path}
    - {from: releasing-msa, to: outgoing-notifications, label: outgoing message ready}
    - {from: outgoing-notifications, to: outgoing-msa, link: aws_sns_topic_subscription, step: 8}
    - {from: outgoing-msa, to: transaction-status, label: status ACSC}
    - {from: timeout-msa, to: transaction-status, label: SLA breach RJCT, step: 9}
    - {from: datacenter, to: messaging-queue, label: on-premises messaging queue over Direct Connect or Site-to-Site VPN, step: 10}
    - {from: mainframe, to: datacenter, label: "firewall, Network Load Balancer and messaging queue"}
    - {from: mainframe, to: db2, label: Db2 reads and writes}
    - {from: messaging-queue, to: reader-mq-msa, label: read incoming MQ messages, step: 11}
    - {from: reader-mq-msa, to: payments-api, label: POST transaction}
    - {from: outgoing-notifications, to: writer-mq-msa, link: aws_sns_topic_subscription}
    - {from: writer-mq-msa, to: messaging-queue, label: write outgoing message, step: 12}

- slug: fraud-detection-sagemaker-realtime-inference
  title: Real-time transaction fraud detection with SageMaker endpoints
  category: industry
  tags: [financial services, fraud detection, sagemaker, xgboost, random cut forest, api gateway]
  source: https://aws.amazon.com/blogs/machine-learning/detect-fraudulent-transactions-using-machine-learning-with-amazon-sagemaker/
  description: Historical card transactions and the trained model artifacts live in one S3 bucket; an unsupervised Random Cut Forest anomaly detector and a supervised XGBoost fraud classifier trained in SageMaker are deployed to two managed real-time endpoints. Client applications call an API Gateway REST API whose Lambda function invokes both endpoints and streams the anomaly score and fraud prediction through Kinesis Data Firehose to a results S3 bucket, which an optional QuickSight dashboard visualises.
  containers:
    - region: us-east-1
      groups:
        - {label: anomaly-detection, at: [1, 3]}
        - {label: fraud-detection, at: [2, 3]}
        - {label: optional, at: [3, 4]}
  elements:
    - {tf: aws_api_gateway_rest_api, name: fraud-scoring-api, in: region, at: [1, 1, 2, 1]}
    - {tf: aws_lambda_function, name: invoke-models, in: region, at: [1, 2, 2, 1]}
    - {tf: aws_sagemaker_endpoint, name: rcf-anomaly-endpoint, in: group:anomaly-detection, at: [1, 1]}
    - {tf: aws_sagemaker_endpoint, name: xgboost-fraud-endpoint, in: group:fraud-detection, at: [1, 1]}
    - {tf: aws_s3_bucket, name: model-and-data, in: region, at: [1, 4, 2, 1]}
    - {tf: aws_kinesis_firehose_delivery_stream, name: predictions-firehose, in: region, at: [3, 2]}
    - {tf: aws_s3_bucket, name: predictions-archive, in: region, at: [3, 3]}
    - {tf: aws_quicksight_dashboard, name: fraud-results-dashboard, in: group:optional, at: [1, 1]}
  actors: [{type: client, name: client, at: [1, 1]}]
  flows:
    - {from: client, to: fraud-scoring-api, label: POST transaction, step: 1}
    - {from: fraud-scoring-api, to: invoke-models, label: Lambda proxy, step: 2}
    - {from: invoke-models, to: rcf-anomaly-endpoint, label: InvokeEndpoint anomaly score, step: 3}
    - {from: invoke-models, to: xgboost-fraud-endpoint, label: InvokeEndpoint fraud probability}
    - {from: model-and-data, to: rcf-anomaly-endpoint, label: RCF model artifact}
    - {from: model-and-data, to: xgboost-fraud-endpoint, label: XGBoost model artifact}
    - {from: invoke-models, to: predictions-firehose, label: PutRecord, step: 4}
    - {from: predictions-firehose, to: predictions-archive, label: buffered delivery, step: 5}
    - {from: predictions-archive, to: fraud-results-dashboard, label: optional analysis, step: 6}

- slug: healthcare-hipaa-eligible-three-tier-web-app
  title: HIPAA-eligible three-tier patient web application
  category: industry
  tags: [healthcare, hipaa, phi, three-tier, encryption, audit]
  source: https://aws.amazon.com/compliance/hipaa-compliance/
  description: A patient-facing web application built only from HIPAA Eligible Services under an AWS Business Associate Addendum, with CloudFront and WAF in front of an Application Load Balancer and ECS tasks in private subnets. Protected health information is stored in an encrypted Aurora cluster and S3 bucket using KMS customer managed keys, Cognito handles patient identity, and CloudTrail plus CloudWatch Logs provide the audit trail HIPAA requires.
  containers:
    - region: us-east-1
      vpcs:
        - name: phi-app
          cidr: 10.20.0.0/16
          subnets:
            - {name: public-a, cidr: 10.20.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.20.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.20.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.20.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.20.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.20.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_cloudfront_distribution, name: patient-portal-cdn, in: region}
    - {tf: aws_wafv2_web_acl, name: portal-waf, in: region}
    - {tf: aws_cognito_user_pool, name: patient-identity, in: region}
    - {tf: aws_lb, name: portal-alb, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: portal-services, in: subnet:app-a}
    - {tf: aws_rds_cluster, name: phi-aurora, in: subnet:data-a}
    - {tf: aws_s3_bucket, name: medical-documents, in: region}
    - {tf: aws_kms_key, name: phi-cmk, in: region}
    - {tf: aws_secretsmanager_secret, name: db-credentials, in: region}
    - {tf: aws_cloudtrail, name: phi-audit-trail, in: region}
    - {tf: aws_cloudwatch_log_group, name: application-logs, in: region}
  actors: [users]
  flows:
    - {from: users, to: patient-portal-cdn, label: HTTPS TLS 1.2+, step: 1}
    - {from: patient-portal-cdn, to: portal-waf, label: managed rules}
    - {from: patient-portal-cdn, to: portal-alb, label: origin request, step: 2}
    - {from: portal-alb, to: portal-services, label: HTTPS to tasks, step: 3}
    - {from: portal-services, to: patient-identity, label: OIDC token validation}
    - {from: portal-services, to: db-credentials, label: GetSecretValue}
    - {from: portal-services, to: phi-aurora, label: encrypted SQL, step: 4}
    - {from: portal-services, to: medical-documents, label: SSE-KMS PutObject, step: 5}
    - {from: phi-aurora, to: phi-cmk, label: encryption at rest}
    - {from: medical-documents, to: phi-cmk, label: encryption at rest}
    - {from: portal-services, to: application-logs, label: application logs}
    - {from: phi-audit-trail, to: medical-documents, label: audit log delivery}

- slug: healthcare-healthlake-fhir-interoperability
  title: FHIR interoperability platform with AWS HealthLake
  category: industry
  tags: [healthcare, fhir, healthlake, interoperability, smart on fhir, athena]
  source: https://docs.aws.amazon.com/healthlake/latest/devguide/what-is-amazon-health-lake.html
  description: Provider EHRs, HIEs, payors and monitoring devices land bulk FHIR R4 bundles and legacy C-CDA or CSV exports in S3 staging buckets, from which a Lambda function starts HealthLake bulk import jobs (via the HealthLake Data Transformation Agent for non-FHIR formats) into a managed FHIR data store. SMART on FHIR applications authenticate with an external identity provider and call the data store's FHIR APIs through API Gateway, while Lake Formation governs Redshift and Athena query engines and SageMaker and QuickSight analysis over the data store.
  containers:
    - {datacenter: healthcare-data-sources, at: [1, 1]}
    - region: us-east-1
      groups:
        - {label: ingestion, at: [1, 1, 2, 1]}
        - {label: fhir-access, at: [1, 2]}
        - {label: query-engines, at: [2, 3]}
        - {label: data-analysis, at: [2, 4]}
  elements:
    - {tf: aws_s3_bucket, name: bulk-fhir-staging, in: group:ingestion, at: [1, 1]}
    - {tf: aws_s3_bucket, name: ccda-csv-staging, in: group:ingestion, at: [2, 1]}
    - {tf: aws_lambda_function, name: healthlake-import, in: group:ingestion, at: [1, 2, 2, 1]}
    - {tf: aws_api_gateway_rest_api, name: fhir-proxy-api, in: group:fhir-access, at: [1, 1]}
    - {tf: aws_lambda_function, name: fhir-request-signer, in: group:fhir-access, at: [1, 2]}
    - {tf: aws_lakeformation_resource, name: fhir-lake-formation, in: region, at: [2, 2]}
