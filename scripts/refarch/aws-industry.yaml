    - {from: pricing-service, to: pricing-table, label: prices and promotions}
    - {from: customer-service, to: customer-graph, label: customer relationships}
    - {from: commerce-aggregation-api, to: saas, label: service desk and content management APIs, step: 3}
    - {from: commerce-aggregation-api, to: oms-cots-app, label: order management, step: 4}
    - {from: oms-cots-app, to: oms-database, label: SQL}
    - {from: commerce-aggregation-api, to: datacenter, label: warehouse management and ERP integration, step: 5}
    - {from: product-service, to: commerce-events, label: domain events, step: 6}
    - {from: oms-cots-app, to: commerce-events, label: OrderPlaced event, step: 6}
    - {from: commerce-events, to: commerce-data-lake, label: event archive, step: 7}
