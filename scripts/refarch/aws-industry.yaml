    - {tf: aws_api_gateway_rest_api, name: events-api, in: group:api-endpoint, at: [1, 1]}
    - {tf: aws_lambda_function, name: events-authorizer, in: group:api-endpoint, at: [2, 1]}
    - {tf: aws_dynamodb_table, name: applications-and-keys, in: group:api-endpoint, at: [3, 1]}
    - {tf: aws_kinesis_stream, name: game-events-stream, in: group:optional-real-time-analytics, at: [1, 1]}
    - {tf: aws_kinesisanalyticsv2_application, name: realtime-metrics-flink, in: group:optional-real-time-analytics, at: [1, 2]}
    - {tf: aws_opensearch_domain, name: live-ops-dashboards, in: group:optional-real-time-analytics, at: [1, 3]}
    - {tf: aws_kinesis_firehose_delivery_stream, name: events-to-s3, in: group:data-lake-mode, at: [1, 1]}
    - {tf: aws_s3_bucket, name: analytics-data-lake, in: group:data-lake-mode, at: [1, 2]}
    - {tf: aws_glue_catalog_database, name: game-events-catalog, in: group:data-lake-mode, at: [1, 3]}
    - {tf: aws_athena_workgroup, name: game-analytics-queries, in: group:data-lake-mode, at: [1, 4]}
    - {tf: aws_kinesis_stream, name: warehouse-events-stream, in: group:data-warehouse-mode, at: [1, 1]}
    - {tf: aws_redshift_cluster, name: game-warehouse, in: group:data-warehouse-mode, at: [1, 2]}
