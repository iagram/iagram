- slug: telecom-5g-core-open5gs-eks
  title: Open source 4G/5G mobile core on Amazon EKS with Multus
  category: industry
  tags: [telecom, 5g core, open5gs, eks, multus, docdb, network functions]
  source: https://aws.amazon.com/blogs/opensource/open-source-mobile-core-network-implementation-on-amazon-elastic-kubernetes-service/
  description: Open5GS control-plane network functions (MME, HSS, PCRF, SGW-C, SMF/PGW-C, NRF and the Web-UI) run as pods on a control-plane EKS managed node group and the user-plane functions (SGW-U, UPF/PGW-U) on a separate user-plane node group, with Multus CNI attaching additional ENIs in the control-plane and user-plane subnets for the S1-MME, S1-U, Sx/N4 and N6/SGi interfaces. An srsLTE UE/eNodeB simulator attaches over S1, subscriber profiles live in Amazon DocumentDB reached through the default Kubernetes subnet, and Route 53 private hosted zones give the network functions service discovery.
