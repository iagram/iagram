- slug: gaming-session-based-multiplayer-gamelift-flexmatch
  title: Session-based multiplayer game backend with GameLift FlexMatch
  category: industry
  tags: [gaming, game backend, gamelift, flexmatch, matchmaking, api gateway, dynamodb]
  source: https://docs.aws.amazon.com/solutions/multiplayer-session-based-game-hosting-on-aws/
  description: Guidance for Multiplayer Session-Based Game Hosting on AWS has game clients read Regional endpoints from a DynamoDB table to measure latency, then call an API Gateway HTTP API that validates the player against a custom identity component and whose Lambda function submits a StartMatchmaking request to Amazon GameLift FlexMatch; the GameLift queue places the match on the lowest-latency location of a multi-location fleet. Matchmaking events flow to an SNS topic and a Lambda function records ticket status in a DynamoDB matchmaking table, the client polls for the game session IP and port through a second Lambda function, connects directly to the game server and the fleet instances ship logs and metrics to CloudWatch.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_lambda_function, name: custom-identity-component, in: region, at: [1, 1]}
    - {tf: aws_lambda_function, name: get-match-status, in: region, at: [1, 3]}
    - {tf: aws_dynamodb_table, name: matchmaking-tickets, in: region, at: [1, 4]}
    - {tf: aws_lambda_function, name: process-matchmaking-events, in: region, at: [1, 5]}
    - {tf: aws_api_gateway_rest_api, name: matchmaking-api, in: region, at: [2, 2]}
    - {tf: aws_lambda_function, name: request-matchmaking, in: region, at: [2, 3]}
    - {tf: aws_gamelift_game_session_queue, name: placement-queue, in: region, at: [2, 4]}
    - {tf: aws_sns_topic, name: matchmaking-events, in: region, at: [2, 5]}
    - {tf: aws_dynamodb_table, name: regional-endpoints, in: region, at: [3, 2]}
    - {tf: aws_gamelift_fleet, name: game-server-fleet, in: region, at: [3, 4]}
    - {tf: aws_cloudwatch_log_group, name: game-server-logs, in: region, at: [3, 5]}
  actors: [{type: client, name: game-client, at: [1, 1]}]
  flows:
    - {from: game-client, to: regional-endpoints, label: latency probe to Regional endpoints, step: 1}
    - {from: game-client, to: matchmaking-api, label: POST request-matchmaking with latencies, step: 2}
    - {from: matchmaking-api, to: custom-identity-component, label: validate player identity, step: 3}
    - {from: matchmaking-api, to: request-matchmaking, label: Lambda proxy}
    - {from: request-matchmaking, to: placement-queue, label: StartMatchmaking via FlexMatch, placed on the queue, step: 4}
    - {from: placement-queue, to: game-server-fleet, label: game session placement on the lowest-latency location, step: 6}
    - {from: placement-queue, to: matchmaking-events, label: MatchmakingSucceeded event, step: 7}
    - {from: matchmaking-events, to: process-matchmaking-events, link: aws_sns_topic_subscription, step: 8}
    - {from: process-matchmaking-events, to: matchmaking-tickets, label: write match result}
    - {from: game-client, to: matchmaking-api, label: GET match status, step: 9}
    - {from: matchmaking-api, to: get-match-status, label: Lambda proxy}
    - {from: get-match-status, to: matchmaking-tickets, label: GetItem ticket, step: 10}
    - {from: game-client, to: game-server-fleet, label: UDP or TCP game session connect, step: 11}
    - {from: game-server-fleet, to: game-server-logs, label: CloudWatch agent, step: 12}

- slug: gaming-analytics-pipeline-telemetry
  title: Game analytics pipeline for real-time and batch telemetry
  category: industry
  tags: [gaming, game analytics, telemetry, kinesis, flink, opensearch, firehose, athena]
  source: https://docs.aws.amazon.com/solutions/game-analytics-pipeline-on-aws/
  description: Guidance for Game Analytics Pipeline on AWS accepts telemetry from game clients and servers through an API Gateway endpoint backed by Lambda and DynamoDB for authentication and administration. An optional real-time path writes events to a Kinesis data stream processed by Managed Service for Apache Flink into OpenSearch dashboards, the data lake mode batches events through Kinesis Data Firehose as Parquet into an S3 data lake with Glue tables queried by Athena, and the data warehouse mode streams events from a second Kinesis data stream into Redshift.
