  source: https://docs.aws.amazon.com/solutions/video-on-demand-on-aws/
  description: Guidance for Video on Demand on AWS stores source mezzanine files in an S3 bucket with a lifecycle policy to Glacier, and Step Functions state machines orchestrate Lambda functions for the ingest, processing and publishing stages. AWS Elemental MediaConvert transcodes to HLS and DASH, job metadata is recorded in DynamoDB, EventBridge rules capture MediaConvert notifications, SNS and SQS publish workflow outputs, optional MediaPackage repackages the assets and CloudFront delivers the distribution bucket to viewers.
  containers:
    - region: us-east-1
      groups: [{label: ingest}, {label: processing}, {label: publishing}]
  elements:
    - {tf: aws_s3_bucket, name: source-media, in: group:ingest}
    - {tf: aws_sfn_state_machine, name: ingest-workflow, in: group:ingest}
    - {tf: aws_lambda_function, name: validate-source, in: group:ingest}
    - {tf: aws_sfn_state_machine, name: process-workflow, in: group:processing}
    - {tf: aws_media_convert_queue, name: transcode-queue, in: group:processing}
    - {tf: aws_dynamodb_table, name: workflow-metadata, in: group:processing}
    - {tf: aws_cloudwatch_event_rule, name: mediaconvert-complete, in: group:processing}
    - {tf: aws_sfn_state_machine, name: publish-workflow, in: group:publishing}
    - {tf: aws_s3_bucket, name: distribution-media, in: group:publishing}
    - {tf: aws_cloudfront_distribution, name: vod-cdn, in: group:publishing}
    - {tf: aws_sns_topic, name: workflow-notifications, in: region}
    - {tf: aws_sqs_queue, name: workflow-outputs, in: region}
  actors: [users, client]
  flows:
    - {from: client, to: source-media, label: upload source file, step: 1}
    - {from: source-media, to: ingest-workflow, label: S3 event starts execution, step: 2}
    - {from: ingest-workflow, to: validate-source, label: MediaInfo task}
    - {from: validate-source, to: workflow-metadata, label: PutItem}
    - {from: ingest-workflow, to: process-workflow, label: encoding profile, step: 3}
    - {from: process-workflow, to: transcode-queue, label: CreateJob HLS and DASH, step: 4}
    - {from: transcode-queue, to: distribution-media, label: transcoded outputs, step: 5}
    - {from: mediaconvert-complete, to: publish-workflow, link: aws_cloudwatch_event_target, step: 6}
    - {from: publish-workflow, to: workflow-metadata, label: update job status}
    - {from: publish-workflow, to: workflow-notifications, label: publish complete, step: 7}
    - {from: workflow-notifications, to: workflow-outputs, link: aws_sns_topic_subscription}
    - {from: users, to: vod-cdn, label: playback, step: 8}
    - {from: vod-cdn, to: distribution-media, label: origin}

- slug: gaming-session-based-multiplayer-gamelift-flexmatch
  title: Session-based multiplayer game backend with GameLift FlexMatch
  category: industry
  tags: [gaming, game backend, gamelift, flexmatch, matchmaking, api gateway, dynamodb]
  source: https://docs.aws.amazon.com/solutions/multiplayer-session-based-game-hosting-on-aws/
  description: Guidance for Multiplayer Session-Based Game Hosting on AWS has game clients measure Region latency, then call an API Gateway backend whose Lambda function submits a StartMatchmaking request to Amazon GameLift FlexMatch; the GameLift queue places the match on the lowest-latency fleet location. Matchmaking events flow to an SNS topic and a Lambda function records ticket status in DynamoDB, the client polls for the game session IP and port, connects directly to the game server and instances ship logs and metrics to CloudWatch.
  containers:
    - region: us-east-1
      groups: [{label: backend-api}, {label: game-hosting}]
  elements:
    - {tf: aws_cognito_user_pool, name: player-identity, in: group:backend-api}
    - {tf: aws_api_gateway_rest_api, name: matchmaking-api, in: group:backend-api}
    - {tf: aws_lambda_function, name: request-matchmaking, in: group:backend-api}
    - {tf: aws_lambda_function, name: get-match-status, in: group:backend-api}
    - {tf: aws_dynamodb_table, name: matchmaking-tickets, in: group:backend-api}
    - {tf: aws_gamelift_build, name: game-server-build, in: group:game-hosting}
    - {tf: aws_gamelift_fleet, name: game-server-fleet, in: group:game-hosting}
    - {tf: aws_gamelift_game_session_queue, name: placement-queue, in: group:game-hosting}
    - {tf: aws_sns_topic, name: matchmaking-events, in: region}
    - {tf: aws_lambda_function, name: process-matchmaking-events, in: region}
    - {tf: aws_cloudwatch_log_group, name: game-server-logs, in: region}
  actors: [client]
  flows:
    - {from: client, to: matchmaking-tickets, label: latency probe to Regional endpoint, step: 1}
    - {from: client, to: matchmaking-api, label: POST request-matchmaking with latencies, step: 2}
    - {from: matchmaking-api, to: player-identity, label: JWT validation, step: 3}
    - {from: matchmaking-api, to: request-matchmaking, label: Lambda proxy, step: 4}
    - {from: request-matchmaking, to: placement-queue, label: StartMatchmaking via FlexMatch, step: 5}
    - {from: placement-queue, to: game-server-fleet, label: game session placement, step: 6}
    - {from: game-server-build, to: game-server-fleet, label: server build}
    - {from: placement-queue, to: matchmaking-events, label: MatchmakingSucceeded event, step: 7}
    - {from: matchmaking-events, to: process-matchmaking-events, link: aws_sns_topic_subscription, step: 8}
    - {from: process-matchmaking-events, to: matchmaking-tickets, label: update ticket status}
    - {from: client, to: matchmaking-api, label: GET match status, step: 9}
    - {from: matchmaking-api, to: get-match-status, label: Lambda proxy}
    - {from: get-match-status, to: matchmaking-tickets, label: GetItem ticket, step: 10}
    - {from: client, to: game-server-fleet, label: UDP or TCP game session connect, step: 11}
    - {from: game-server-fleet, to: game-server-logs, label: CloudWatch agent, step: 12}

- slug: gaming-analytics-pipeline-telemetry
  title: Game analytics pipeline for real-time and batch telemetry
  category: industry
  tags: [gaming, game analytics, telemetry, kinesis, flink, opensearch, firehose, athena]
  source: https://docs.aws.amazon.com/solutions/game-analytics-pipeline-on-aws/
  description: Guidance for Game Analytics Pipeline on AWS accepts telemetry from game clients and servers through an API Gateway backend backed by Lambda and DynamoDB for authentication and administration, and writes events to a Kinesis data stream. An optional real-time path processes the stream with Managed Service for Apache Flink into OpenSearch dashboards, while Kinesis Data Firehose batches events as Parquet into an S3 data lake with Glue tables queried by Athena, or alternatively streams them into Redshift Serverless.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: real-time}, {label: data-lake}]
  elements:
    - {tf: aws_api_gateway_rest_api, name: events-api, in: group:ingestion}
    - {tf: aws_lambda_function, name: events-authorizer, in: group:ingestion}
    - {tf: aws_dynamodb_table, name: applications-and-keys, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: game-events-stream, in: group:ingestion}
    - {tf: aws_kinesisanalyticsv2_application, name: realtime-metrics-flink, in: group:real-time}
    - {tf: aws_opensearch_domain, name: live-ops-dashboards, in: group:real-time}
    - {tf: aws_kinesis_firehose_delivery_stream, name: events-to-s3, in: group:data-lake}
    - {tf: aws_s3_bucket, name: analytics-data-lake, in: group:data-lake}
    - {tf: aws_glue_catalog_database, name: game-events-catalog, in: group:data-lake}
    - {tf: aws_glue_job, name: events-etl, in: group:data-lake}
    - {tf: aws_athena_workgroup, name: game-analytics-queries, in: group:data-lake}
    - {tf: aws_redshift_cluster, name: game-warehouse, in: group:data-lake}
  actors: [client, server, users]
  flows:
    - {from: client, to: events-api, label: POST /events, step: 1}
    - {from: server, to: events-api, label: server telemetry, step: 1}
    - {from: events-api, to: events-authorizer, label: API key authorizer, step: 2}
    - {from: events-authorizer, to: applications-and-keys, label: GetItem}
    - {from: events-api, to: game-events-stream, label: PutRecords, step: 3}
    - {from: game-events-stream, to: realtime-metrics-flink, label: Flink source, step: 4}
    - {from: realtime-metrics-flink, to: live-ops-dashboards, label: aggregated metrics}
    - {from: game-events-stream, to: events-to-s3, label: Firehose source, step: 5}
    - {from: events-to-s3, to: analytics-data-lake, label: Parquet partitions, step: 6}
    - {from: analytics-data-lake, to: events-etl, label: ETL}
    - {from: events-etl, to: game-events-catalog, label: Hive or Iceberg tables}
    - {from: game-events-catalog, to: game-analytics-queries, label: SQL, step: 7}
    - {from: game-events-stream, to: game-warehouse, label: streaming ingestion, step: 8}
    - {from: users, to: live-ops-dashboards, label: live dashboards}

- slug: public-sector-govcloud-secure-web-application
  title: Secure public sector web application in AWS GovCloud (US)
  category: industry
  tags: [public sector, govcloud, fedramp high, cui, fips endpoints, web application]
  source: https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/whatis.html
  description: A citizen-facing web application deployed in the AWS GovCloud (US-West) Region for Controlled Unclassified Information, using FIPS 140-3 endpoints, WAF and an Application Load Balancer in front of an ECS service in private subnets and an encrypted Aurora cluster. Identity is federated from an agency IdP through Cognito, KMS customer managed keys encrypt all data at rest, and CloudTrail, AWS Config, GuardDuty and Security Hub provide the continuous monitoring evidence required by FedRAMP High.
  containers:
    - region: us-gov-west-1
      vpcs:
        - name: agency-app
          cidr: 10.50.0.0/16
          subnets:
            - {name: public-a, cidr: 10.50.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.50.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.50.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.50.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.50.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.50.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_wafv2_web_acl, name: agency-waf, in: region}
    - {tf: aws_lb, name: agency-alb, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: agency-services, in: subnet:app-a}
    - {tf: aws_rds_cluster, name: cui-aurora, in: subnet:data-a}
    - {tf: aws_s3_bucket, name: cui-documents, in: region}
    - {tf: aws_cognito_user_pool, name: citizen-identity, in: region}
    - {tf: aws_kms_key, name: cui-cmk, in: region}
    - {tf: aws_cloudtrail, name: agency-audit-trail, in: region}
    - {tf: aws_config_configuration_recorder, name: compliance-recorder, in: region}
    - {tf: aws_guardduty_detector, name: threat-detection, in: region}
    - {tf: aws_securityhub_account, name: fedramp-findings, in: region}
  actors: [users, idp]
  flows:
    - {from: users, to: agency-waf, label: HTTPS FIPS endpoint, step: 1}
    - {from: agency-waf, to: agency-alb, label: filtered requests, step: 2}
    - {from: agency-alb, to: agency-services, label: HTTPS to tasks, step: 3}
    - {from: users, to: citizen-identity, label: sign-in}
    - {from: idp, to: citizen-identity, label: SAML federation, step: 4}
    - {from: agency-services, to: cui-aurora, label: encrypted SQL, step: 5}
    - {from: agency-services, to: cui-documents, label: SSE-KMS PutObject, step: 6}
    - {from: cui-aurora, to: cui-cmk, label: encryption at rest}
    - {from: cui-documents, to: cui-cmk, label: encryption at rest}
    - {from: agency-audit-trail, to: cui-documents, label: audit log delivery}
    - {from: compliance-recorder, to: fedramp-findings, label: config compliance}
    - {from: threat-detection, to: fedramp-findings, label: findings}

- slug: adtech-real-time-bidder-eks-dynamodb
  title: Ad tech real-time bidder on EKS with DynamoDB and Kinesis
  category: industry
  tags: [advertising, ad tech, real-time bidding, eks, dynamodb, kinesis, graviton]
  source: https://docs.aws.amazon.com/solutions/building-a-real-time-bidder-for-advertising-on-aws/
  description: Guidance for Building a Real Time Bidder for Advertising on AWS receives OpenRTB bid requests from supply-side platforms on a public load balancer and routes them to bidder pods on an EKS cluster running Graviton instances. The bidder reads audience, campaign and budget tables in DynamoDB through VPC endpoints, updates budgets on wins, and sends compressed transaction micro-batches to Kinesis Data Streams and Firehose for delivery to S3, with KMS encryption and ECR-hosted container images.
  containers:
    - region: us-east-1
      vpcs:
        - name: rtb
          cidr: 10.60.0.0/16
          subnets:
            - {name: public-a, cidr: 10.60.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.60.1.0/24, az: b, public: true}
            - {name: bidder-a, cidr: 10.60.10.0/24, az: a, public: false}
            - {name: bidder-b, cidr: 10.60.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_lb, name: bid-request-nlb, in: subnet:public-a}
    - {tf: aws_eks_cluster, name: bidder-cluster, in: vpc:rtb}
    - {tf: aws_eks_node_group, name: graviton-bidder-nodes, in: subnet:bidder-a}
    - {tf: aws_ecr_repository, name: bidder-images, in: region}
    - {tf: aws_dynamodb_table, name: audiences, in: region}
    - {tf: aws_dynamodb_table, name: campaigns, in: region}
    - {tf: aws_dynamodb_table, name: budgets, in: region}
    - {tf: aws_vpc_endpoint, name: dynamodb-endpoint, in: vpc:rtb}
    - {tf: aws_kinesis_stream, name: bid-transactions, in: region}
    - {tf: aws_kinesis_firehose_delivery_stream, name: transactions-to-s3, in: region}
    - {tf: aws_s3_bucket, name: bid-analytics, in: region}
    - {tf: aws_kms_key, name: rtb-cmk, in: region}
  actors: [saas]
  flows:
    - {from: saas, to: bid-request-nlb, label: OpenRTB bid request from SSP, step: 1}
    - {from: bid-request-nlb, to: graviton-bidder-nodes, label: bidder pods, step: 2}
    - {from: bidder-cluster, to: bidder-images, label: pull pre-built images}
    - {from: graviton-bidder-nodes, to: dynamodb-endpoint, label: private access}
    - {from: dynamodb-endpoint, to: audiences, label: segment lookup, step: 3}
    - {from: dynamodb-endpoint, to: campaigns, label: campaign match}
    - {from: dynamodb-endpoint, to: budgets, label: budget check and win update}
    - {from: graviton-bidder-nodes, to: saas, label: bid response}
    - {from: graviton-bidder-nodes, to: bid-transactions, label: compressed 25 KB micro-batches, step: 4}
    - {from: bid-transactions, to: transactions-to-s3, label: Firehose source, step: 5}
    - {from: transactions-to-s3, to: bid-analytics, label: analytics and reporting, step: 6}
    - {from: bid-analytics, to: rtb-cmk, label: SSE-KMS}

- slug: adtech-clean-rooms-advertiser-publisher-collaboration
  title: Advertiser and publisher data collaboration with AWS Clean Rooms
  category: industry
  tags: [advertising, clean rooms, data collaboration, privacy, glue, athena, measurement]
  source: https://docs.aws.amazon.com/clean-rooms/latest/userguide/what-is.html
  description: An advertiser and a publisher each register S3 datasets as Glue Data Catalog tables and associate them as configured tables with analysis rules in an AWS Clean Rooms collaboration, so neither party sees the other's raw rows. The member allowed to query runs aggregation or list queries that Clean Rooms executes against the original data locations, writes the results to the querying member's S3 bucket and catalogues them for Athena reporting, with CloudTrail logging every query.
  containers:
    - region: us-east-1
      account: publisher
      groups: [{label: publisher-data}]
    - region: us-east-1
      account: advertiser
      groups: [{label: advertiser-data}, {label: results}]
  elements:
    - {tf: aws_s3_bucket, name: publisher-impressions, in: group:publisher-data}
    - {tf: aws_glue_catalog_database, name: publisher-catalog, in: group:publisher-data}
    - {tf: aws_cleanrooms_configured_table, name: impressions-configured-table, in: group:publisher-data}
    - {tf: aws_s3_bucket, name: advertiser-conversions, in: group:advertiser-data}
    - {tf: aws_glue_catalog_database, name: advertiser-catalog, in: group:advertiser-data}
    - {tf: aws_cleanrooms_configured_table, name: conversions-configured-table, in: group:advertiser-data}
    - {tf: aws_cleanrooms_collaboration, name: campaign-measurement, in: account:advertiser}
    - {tf: aws_s3_bucket, name: query-results, in: group:results}
    - {tf: aws_athena_workgroup, name: measurement-reports, in: group:results}
    - {tf: aws_cloudtrail, name: collaboration-audit, in: account:advertiser}
  actors: [users]
  flows:
    - {from: publisher-impressions, to: publisher-catalog, label: Glue table, step: 1}
    - {from: publisher-catalog, to: impressions-configured-table, label: aggregation analysis rule, step: 2}
    - {from: advertiser-conversions, to: advertiser-catalog, label: Glue table, step: 1}
    - {from: advertiser-catalog, to: conversions-configured-table, label: aggregation analysis rule, step: 2}
    - {from: impressions-configured-table, to: campaign-measurement, label: table association, step: 3}
    - {from: conversions-configured-table, to: campaign-measurement, label: table association, step: 3}
    - {from: users, to: campaign-measurement, label: run SQL aggregation query, step: 4}
    - {from: campaign-measurement, to: publisher-impressions, label: read in place}
    - {from: campaign-measurement, to: advertiser-conversions, label: read in place}
    - {from: campaign-measurement, to: query-results, label: aggregated output, step: 5}
    - {from: query-results, to: measurement-reports, label: SQL reporting, step: 6}
    - {from: campaign-measurement, to: collaboration-audit, label: query logs}
