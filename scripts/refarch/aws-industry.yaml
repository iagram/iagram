- slug: retail-unified-commerce-headless-api
  title: Unified commerce with headless AppSync API and EventBridge event backbone
  category: industry
  tags: [retail, e-commerce, unified commerce, headless, mach, appsync, eventbridge]
  source: https://docs.aws.amazon.com/solutions/unified-commerce-on-aws/
  description: Guidance for Unified Commerce on AWS applies MACH principles so web, mobile and store frontends call one AWS AppSync aggregation API that fronts differentiating microservices on DynamoDB and Neptune, SaaS commerce applications and COTS applications on EC2 and RDS. Every microservice publishes events to EventBridge custom buses; decoupled consumers stream them to an S3 data platform queried with Athena and feed SageMaker forecasts and real-time personalization back to the engagement channels.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      groups: [{label: experience-api}, {label: microservices}, {label: cots-applications}, {label: data-platform}]
  elements:
    - {tf: aws_cloudfront_distribution, name: storefront-cdn, in: region}
    - {tf: aws_cognito_user_pool, name: shopper-identity, in: group:experience-api}
    - {tf: aws_appsync_graphql_api, name: commerce-aggregation-api, in: group:experience-api}
    - {tf: aws_lambda_function, name: cart-service, in: group:microservices}
    - {tf: aws_dynamodb_table, name: cart-and-orders, in: group:microservices}
    - {tf: aws_neptune_cluster, name: product-graph, in: group:microservices}
    - {tf: aws_instance, name: oms-cots-app, in: group:cots-applications}
    - {tf: aws_db_instance, name: oms-database, in: group:cots-applications}
    - {tf: aws_cloudwatch_event_bus, name: commerce-events, in: region}
    - {tf: aws_s3_bucket, name: commerce-data-lake, in: group:data-platform}
    - {tf: aws_athena_workgroup, name: commerce-analytics, in: group:data-platform}
    - {tf: aws_sagemaker_endpoint, name: demand-forecast-endpoint, in: group:data-platform}
  actors: [users, mobile, saas, datacenter]
  flows:
    - {from: users, to: storefront-cdn, label: HTTPS storefront, step: 1}
    - {from: storefront-cdn, to: commerce-aggregation-api, label: GraphQL, step: 2}
    - {from: mobile, to: commerce-aggregation-api, label: GraphQL}
    - {from: commerce-aggregation-api, to: shopper-identity, label: JWT validation}
    - {from: commerce-aggregation-api, to: cart-service, label: resolver, step: 3}
    - {from: cart-service, to: cart-and-orders, label: PutItem}
    - {from: commerce-aggregation-api, to: product-graph, label: product relationships}
    - {from: commerce-aggregation-api, to: saas, label: SaaS commerce APIs, step: 4}
    - {from: commerce-aggregation-api, to: oms-cots-app, label: order management, step: 5}
    - {from: oms-cots-app, to: oms-database, label: SQL}
    - {from: commerce-aggregation-api, to: datacenter, label: ERP and WMS integration}
    - {from: cart-service, to: commerce-events, label: OrderPlaced event, step: 6}
    - {from: commerce-events, to: commerce-data-lake, label: event archive, step: 7}
    - {from: commerce-data-lake, to: commerce-analytics, label: SQL over S3}
    - {from: commerce-data-lake, to: demand-forecast-endpoint, label: training data, step: 8}

- slug: retail-product-substitutions-opensearch-knn
  title: Retail product substitutions with OpenSearch k-NN embeddings
  category: industry
  tags: [retail, personalization, product substitution, opensearch, k-nn, embeddings]
  source: https://aws.amazon.com/solutions/guidance/product-substitutions-on-aws/
  description: Guidance for Product Substitutions on AWS embeds product names and descriptions with Lambda and stores the vectors in an Amazon OpenSearch Service k-NN index seeded from product data in S3 and DynamoDB. A Cognito-authenticated API Gateway endpoint invokes a query Lambda that finds the nearest neighbours of an out-of-stock item and returns substitute products, with CloudWatch metrics and SNS alerts for operations.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: query-api}]
  elements:
    - {tf: aws_s3_bucket, name: product-catalog-data, in: group:ingestion}
    - {tf: aws_dynamodb_table, name: product-seed-table, in: group:ingestion}
    - {tf: aws_lambda_function, name: embed-and-load, in: group:ingestion}
    - {tf: aws_opensearch_domain, name: product-knn-index, in: region}
    - {tf: aws_cognito_user_pool, name: api-users, in: group:query-api}
    - {tf: aws_api_gateway_rest_api, name: substitutions-api, in: group:query-api}
    - {tf: aws_lambda_function, name: find-substitutes, in: group:query-api}
    - {tf: aws_sns_topic, name: ops-alerts, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: search-latency-alarm, in: region}
  actors: [client]
  flows:
    - {from: product-catalog-data, to: embed-and-load, label: product descriptions, step: 1}
    - {from: product-seed-table, to: embed-and-load, label: seed items}
    - {from: embed-and-load, to: product-knn-index, label: index embeddings, step: 2}
    - {from: client, to: substitutions-api, label: GET substitutes for SKU, step: 3}
    - {from: substitutions-api, to: api-users, label: Cognito authorizer}
    - {from: substitutions-api, to: find-substitutes, label: Lambda proxy, step: 4}
    - {from: find-substitutes, to: product-knn-index, label: k-NN query, step: 5}
    - {from: product-knn-index, to: search-latency-alarm, label: metrics}
    - {from: search-latency-alarm, to: ops-alerts, label: alarm action}

- slug: payments-iso20022-event-driven-messaging
  title: ISO 20022 payment messaging workflows with SQS FIFO microservices
  category: industry
  tags: [financial services, payments, iso 20022, event-driven, sqs, dynamodb, multi-region]
  source: https://docs.aws.amazon.com/solutions/iso-20022-messaging-workflows-on-aws/
  description: Guidance for ISO 20022 Messaging Workflows on AWS receives payment messages through a Cognito-protected API Gateway, assigns a transaction ID recorded in DynamoDB, and passes the message through incoming, processing and releasing microservices connected by FIFO SQS queues. Each stage persists the ISO 20022 payload to S3 and updates the transaction status (ACCP, ACTC, ACSP, ACSC or RJCT); a timeout function rejects transactions that exceed the SLA and SNS notifies consumers when an outgoing message is ready.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      groups: [{label: api-layer}, {label: workflow}]
  elements:
    - {tf: aws_cognito_user_pool, name: api-consumer-auth, in: group:api-layer}
    - {tf: aws_api_gateway_rest_api, name: payments-api, in: group:api-layer}
    - {tf: aws_lambda_function, name: transaction-msa, in: group:api-layer}
    - {tf: aws_dynamodb_table, name: transaction-status, in: region}
    - {tf: aws_sqs_queue, name: incoming-queue, in: group:workflow}
    - {tf: aws_lambda_function, name: incoming-msa, in: group:workflow}
    - {tf: aws_sqs_queue, name: processing-queue, in: group:workflow}
    - {tf: aws_lambda_function, name: processing-msa, in: group:workflow}
    - {tf: aws_sqs_queue, name: releasing-queue, in: group:workflow}
    - {tf: aws_lambda_function, name: releasing-msa, in: group:workflow}
    - {tf: aws_s3_bucket, name: iso20022-messages, in: region}
    - {tf: aws_sns_topic, name: outgoing-notifications, in: region}
    - {tf: aws_lambda_function, name: timeout-msa, in: group:workflow}
    - {tf: aws_kms_key, name: payments-cmk, in: region}
  actors: [client, datacenter]
  flows:
    - {from: client, to: api-consumer-auth, label: OAuth 2.0 token, step: 1}
    - {from: client, to: payments-api, label: POST transaction, step: 2}
    - {from: payments-api, to: transaction-msa, label: create transaction ID, step: 3}
    - {from: transaction-msa, to: transaction-status, label: status ACCP}
    - {from: payments-api, to: incoming-queue, label: ISO 20022 pacs.008, step: 4}
    - {from: incoming-queue, to: incoming-msa, link: aws_lambda_event_source_mapping, step: 5}
    - {from: incoming-msa, to: iso20022-messages, label: incoming path}
    - {from: incoming-msa, to: processing-queue, label: status ACTC}
    - {from: processing-queue, to: processing-msa, link: aws_lambda_event_source_mapping, step: 6}
    - {from: processing-msa, to: transaction-status, label: ACSP or RJCT}
    - {from: processing-msa, to: releasing-queue, label: confirmation or rejection}
    - {from: releasing-queue, to: releasing-msa, link: aws_lambda_event_source_mapping, step: 7}
    - {from: releasing-msa, to: iso20022-messages, label: outgoing path}
    - {from: releasing-msa, to: outgoing-notifications, label: publish, step: 8}
    - {from: timeout-msa, to: transaction-status, label: SLA breach RJCT, step: 9}
    - {from: iso20022-messages, to: payments-cmk, label: SSE-KMS}
    - {from: datacenter, to: payments-api, label: MQ reader and writer bridge}

- slug: fraud-detection-sagemaker-realtime-inference
  title: Real-time transaction fraud detection with SageMaker endpoints
  category: industry
  tags: [financial services, fraud detection, sagemaker, xgboost, random cut forest, api gateway]
  source: https://aws.amazon.com/blogs/machine-learning/detect-fraudulent-transactions-using-machine-learning-with-amazon-sagemaker/
  description: Historical card transactions in S3 train an unsupervised Random Cut Forest model and supervised XGBoost models in SageMaker, which are deployed to managed real-time endpoints. Client applications call an API Gateway REST API whose Lambda function invokes both endpoints and streams the anomaly score and fraud prediction through Kinesis Data Firehose to S3 for analysis.
  containers:
    - region: us-east-1
      groups: [{label: training}, {label: inference}]
  elements:
    - {tf: aws_s3_bucket, name: transactions-training-data, in: group:training}
    - {tf: aws_sagemaker_notebook_instance, name: fraud-model-notebook, in: group:training}
    - {tf: aws_sagemaker_model, name: xgboost-fraud-model, in: group:training}
    - {tf: aws_sagemaker_endpoint, name: rcf-anomaly-endpoint, in: group:inference}
    - {tf: aws_sagemaker_endpoint, name: xgboost-fraud-endpoint, in: group:inference}
    - {tf: aws_api_gateway_rest_api, name: fraud-scoring-api, in: group:inference}
    - {tf: aws_lambda_function, name: invoke-models, in: group:inference}
    - {tf: aws_kinesis_firehose_delivery_stream, name: predictions-firehose, in: region}
    - {tf: aws_s3_bucket, name: predictions-archive, in: region}
  actors: [client]
  flows:
    - {from: transactions-training-data, to: fraud-model-notebook, label: labelled transactions, step: 1}
    - {from: fraud-model-notebook, to: xgboost-fraud-model, label: training job, step: 2}
    - {from: xgboost-fraud-model, to: xgboost-fraud-endpoint, label: deploy, step: 3}
    - {from: fraud-model-notebook, to: rcf-anomaly-endpoint, label: deploy RCF}
    - {from: client, to: fraud-scoring-api, label: POST transaction, step: 4}
    - {from: fraud-scoring-api, to: invoke-models, label: Lambda proxy, step: 5}
    - {from: invoke-models, to: rcf-anomaly-endpoint, label: InvokeEndpoint anomaly score, step: 6}
    - {from: invoke-models, to: xgboost-fraud-endpoint, label: InvokeEndpoint fraud probability}
    - {from: invoke-models, to: predictions-firehose, label: PutRecord, step: 7}
    - {from: predictions-firehose, to: predictions-archive, label: buffered delivery, step: 8}

- slug: healthcare-hipaa-eligible-three-tier-web-app
