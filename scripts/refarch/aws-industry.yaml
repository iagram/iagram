- slug: retail-unified-commerce-headless-api
  title: Unified commerce with headless AppSync API and EventBridge event backbone
  category: industry
  tags: [retail, e-commerce, unified commerce, headless, mach, appsync, eventbridge]
  source: https://docs.aws.amazon.com/solutions/unified-commerce-on-aws/
  description: Guidance for Unified Commerce on AWS applies MACH principles so web, mobile, store and in-game channels reach frontend experience apps (CloudFront, S3, Cognito, WAF), serverless web and POS apps on Lambda and DynamoDB, and one AWS AppSync aggregation API that fronts product, pricing and customer microservices on DynamoDB and Neptune, Internet SaaS applications, COTS order management on EC2 and RDS in a VPC, and enterprise WMS/ERP systems. Every service publishes events to an EventBridge custom bus; consumers stream them to an S3 data platform catalogued as a data lake and queried with Redshift and Athena, drive Pinpoint customer engagement, and feed SageMaker Canvas and SageMaker forecasts back to the channels.
  containers:
    - datacenter: on-premises
      at: [3, 4]
    - region: us-east-1
      account_at: [2, 1, 1, 3]
      groups:
        - {label: frontend-experience-apps, at: [1, 1]}
        - {label: web-app, at: [1, 2]}
        - {label: pos-app, at: [1, 3]}
        - {label: aggregation-api, at: [2, 2]}
        - {label: microservices, at: [3, 2, 1, 2]}
        - {label: personalization-marketing, at: [4, 3]}
        - {label: data-platform, at: [5, 1, 1, 2]}
        - {label: ai-ml, at: [5, 3]}
      vpcs:
        - name: cots-applications
          cidr: 10.10.0.0/16
          at: [3, 1]
          subnets:
            - {name: cots-private-a, cidr: 10.10.1.0/24, az: a, public: false, at: [1, 1]}
  elements:
    - {tf: aws_cloudfront_distribution, name: storefront-cdn, in: group:frontend-experience-apps, at: [1, 1]}
    - {tf: aws_s3_bucket, name: storefront-assets, in: group:frontend-experience-apps, at: [1, 2]}
    - {tf: aws_cognito_user_pool, name: shopper-identity, in: group:frontend-experience-apps, at: [1, 3]}
    - {tf: aws_wafv2_web_acl, name: storefront-waf, in: group:frontend-experience-apps, at: [1, 4]}
    - {tf: aws_lambda_function, name: web-app-function, in: group:web-app, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: web-app-table, in: group:web-app, at: [1, 2]}
    - {tf: aws_lambda_function, name: pos-app-function, in: group:pos-app, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: pos-app-table, in: group:pos-app, at: [1, 2]}
    - {tf: aws_appsync_graphql_api, name: commerce-aggregation-api, in: group:aggregation-api, at: [1, 1]}
    - {tf: aws_ecs_task_definition, name: product-service, in: group:microservices, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: product-table, in: group:microservices, at: [1, 2]}
    - {tf: aws_ecs_task_definition, name: pricing-service, in: group:microservices, at: [1, 3]}
    - {tf: aws_dynamodb_table, name: pricing-table, in: group:microservices, at: [1, 4]}
    - {tf: aws_ecs_task_definition, name: customer-service, in: group:microservices, at: [1, 5]}
    - {tf: aws_neptune_cluster, name: customer-graph, in: group:microservices, at: [1, 6]}
    - {tf: aws_instance, name: oms-cots-app, in: subnet:cots-private-a, at: [1, 1]}
    - {tf: aws_db_instance, name: oms-database, in: subnet:cots-private-a, at: [1, 2]}
    - {tf: aws_cloudwatch_event_bus, name: commerce-events, in: region, at: [4, 2]}
    - {tf: aws_s3_bucket, name: commerce-data-lake, in: group:data-platform, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: data-lake-catalog, in: group:data-platform, at: [1, 2]}
    - {tf: aws_redshift_cluster, name: commerce-warehouse, in: group:data-platform, at: [1, 3]}
    - {tf: aws_athena_workgroup, name: commerce-analytics, in: group:data-platform, at: [1, 4]}
    - {tf: aws_pinpoint_app, name: customer-engagement, in: group:personalization-marketing, at: [1, 1]}
