    - {from: portal-services, to: medical-documents, label: SSE-KMS PutObject, step: 5}
    - {from: phi-aurora, to: phi-cmk, label: encryption at rest}
    - {from: medical-documents, to: phi-cmk, label: encryption at rest}
    - {from: portal-services, to: application-logs, label: application logs}
    - {from: phi-audit-trail, to: medical-documents, label: audit log delivery}

- slug: healthcare-healthlake-fhir-interoperability
