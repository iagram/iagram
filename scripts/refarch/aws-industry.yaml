- slug: automotive-connected-mobility-vehicle-ingestion
  title: Connected vehicle ingestion pipeline with IoT Core, MSK and Flink
  category: industry
  tags: [automotive, connected vehicle, iot core, msk, flink, appsync, telematics]
  source: https://docs.aws.amazon.com/solutions/connected-mobility-on-aws/
  description: In Guidance for Connected Mobility on AWS, vehicles authenticate to IoT Core with X.509 mTLS and Basic Ingest rules write compressed telemetry straight to an Amazon MSK topic using SCRAM credentials from Secrets Manager, with batch uploads going to S3 through pre-signed URLs. Managed Service for Apache Flink decodes and enriches the stream, republishes it to MSK and writes the vehicle last-known state to DynamoDB global tables, which AppSync exposes to companion apps through GraphQL subscriptions behind CloudFront.
