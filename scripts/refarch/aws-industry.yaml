- slug: public-sector-govcloud-secure-web-application
  title: Secure public sector web application in AWS GovCloud (US)
  category: industry
  tags: [public sector, govcloud, fedramp high, cui, fips endpoints, web application]
  source: https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/whatis.html
  description: A citizen-facing web application deployed in the AWS GovCloud (US-West) Region for Controlled Unclassified Information, using FIPS 140-3 endpoints, WAF and an Application Load Balancer in front of an ECS service in private subnets and an encrypted Aurora cluster. Identity is federated from an agency IdP through Cognito, KMS customer managed keys encrypt all data at rest, and CloudTrail, AWS Config, GuardDuty and Security Hub provide the continuous monitoring evidence required by FedRAMP High.
  containers:
    - region: us-gov-west-1
      vpcs:
        - name: agency-app
          cidr: 10.50.0.0/16
          subnets:
            - {name: public-a, cidr: 10.50.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.50.1.0/24, az: b, public: true}
            - {name: app-a, cidr: 10.50.10.0/24, az: a, public: false}
            - {name: app-b, cidr: 10.50.11.0/24, az: b, public: false}
            - {name: data-a, cidr: 10.50.20.0/24, az: a, public: false}
            - {name: data-b, cidr: 10.50.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_wafv2_web_acl, name: agency-waf, in: region}
    - {tf: aws_lb, name: agency-alb, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: agency-services, in: subnet:app-a}
    - {tf: aws_rds_cluster, name: cui-aurora, in: subnet:data-a}
    - {tf: aws_s3_bucket, name: cui-documents, in: region}
    - {tf: aws_cognito_user_pool, name: citizen-identity, in: region}
    - {tf: aws_kms_key, name: cui-cmk, in: region}
    - {tf: aws_cloudtrail, name: agency-audit-trail, in: region}
    - {tf: aws_config_configuration_recorder, name: compliance-recorder, in: region}
    - {tf: aws_guardduty_detector, name: threat-detection, in: region}
    - {tf: aws_securityhub_account, name: fedramp-findings, in: region}
  actors: [users, idp]
  flows:
    - {from: users, to: agency-waf, label: HTTPS FIPS endpoint, step: 1}
    - {from: agency-waf, to: agency-alb, label: filtered requests, step: 2}
    - {from: agency-alb, to: agency-services, label: HTTPS to tasks, step: 3}
    - {from: users, to: citizen-identity, label: sign-in}
    - {from: idp, to: citizen-identity, label: SAML federation, step: 4}
    - {from: agency-services, to: cui-aurora, label: encrypted SQL, step: 5}
    - {from: agency-services, to: cui-documents, label: SSE-KMS PutObject, step: 6}
    - {from: cui-aurora, to: cui-cmk, label: encryption at rest}
    - {from: cui-documents, to: cui-cmk, label: encryption at rest}
    - {from: agency-audit-trail, to: cui-documents, label: audit log delivery}
    - {from: compliance-recorder, to: fedramp-findings, label: config compliance}
    - {from: threat-detection, to: fedramp-findings, label: findings}

- slug: adtech-real-time-bidder-eks-dynamodb
  title: Ad tech real-time bidder on EKS with DynamoDB and Kinesis
  category: industry
  tags: [advertising, ad tech, real-time bidding, eks, dynamodb, kinesis, graviton]
  source: https://docs.aws.amazon.com/solutions/building-a-real-time-bidder-for-advertising-on-aws/
  description: Guidance for Building a Real Time Bidder for Advertising on AWS receives OpenRTB bid requests from a publisher's supply-side platform on a public load balancer and routes them to bidder pods on an EKS cluster running Graviton instances. Through three VPC endpoints the bidder reads audience, campaign and budget tables in DynamoDB (or an Aerospike cluster on EC2), updates budgets on wins, pulls container images from ECR and sends compressed transaction micro-batches to Kinesis Data Streams and Firehose for delivery to S3; KMS and IAM secure the stack, which CodePipeline, CodeBuild and CloudFormation deploy.
  containers:
    - region: us-east-1
      groups:
        - {label: nosql-database, at: [1, 2, 1, 2]}
        - {label: data-pipeline, at: [2, 2, 1, 2]}
        - {label: security-identity-compliance, at: [3, 3]}
        - {label: deployment-pipeline, at: [4, 2, 1, 2]}
      vpcs:
        - name: rtb
          cidr: 10.60.0.0/16
          at: [1, 1, 4, 1]
          subnets:
            - {name: public-a, cidr: 10.60.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.60.1.0/24, az: b, public: true}
            - {name: bidder-a, cidr: 10.60.10.0/24, az: a, public: false}
            - {name: bidder-b, cidr: 10.60.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_lb, name: bid-request-nlb, in: subnet:public-a, at: [1, 1]}
    - {tf: aws_eks_cluster, name: bidder-cluster, in: vpc:rtb, at: [1, 2, 3, 1]}
    - {tf: aws_eks_node_group, name: graviton-bidder-nodes, in: subnet:bidder-a, at: [1, 1]}
    - {tf: aws_vpc_endpoint, name: dynamodb-endpoint, in: vpc:rtb, at: [1, 3]}
    - {tf: aws_vpc_endpoint, name: kinesis-endpoint, in: vpc:rtb, at: [2, 3]}
    - {tf: aws_vpc_endpoint, name: ecr-endpoint, in: vpc:rtb, at: [3, 3]}
    - {tf: aws_dynamodb_table, name: budgets, in: group:nosql-database, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: campaigns, in: group:nosql-database, at: [2, 1]}
    - {tf: aws_dynamodb_table, name: audiences, in: group:nosql-database, at: [1, 2, 2, 1]}
    - {tf: aws_instance, name: aerospike-cluster, in: subnet:bidder-b, at: [1, 1]}
    - {tf: aws_kinesis_stream, name: bid-transactions, in: group:data-pipeline, at: [1, 1]}
    - {tf: aws_kinesis_firehose_delivery_stream, name: transactions-to-s3, in: group:data-pipeline, at: [1, 2]}
    - {tf: aws_s3_bucket, name: bid-analytics, in: group:data-pipeline, at: [1, 3]}
    - {tf: aws_ecr_repository, name: bidder-images, in: region, at: [3, 2]}
    - {tf: aws_kms_key, name: rtb-cmk, in: group:security-identity-compliance, at: [1, 1]}
    - {tf: aws_iam_role, name: bidder-service-role, in: group:security-identity-compliance, at: [1, 2]}
    - {tf: aws_codebuild_project, name: bidder-image-build, in: group:deployment-pipeline, at: [1, 1]}
    - {tf: aws_codepipeline, name: bidder-release-pipeline, in: group:deployment-pipeline, at: [1, 2]}
    - {tf: aws_cloudformation_stack, name: bidder-infrastructure-stack, in: group:deployment-pipeline, at: [1, 3]}
  actors: [{type: users, name: publisher, at: [1, 1]}, {type: saas, name: ssp-auction-server, at: [2, 1]}]
  flows:
    - {from: publisher, to: ssp-auction-server, label: ad impression to sell}
    - {from: ssp-auction-server, to: bid-request-nlb, label: OpenRTB bid request from SSP, step: 1}
    - {from: bid-request-nlb, to: graviton-bidder-nodes, label: bidder pods 1 to n, step: 2}
    - {from: graviton-bidder-nodes, to: dynamodb-endpoint, label: private access}
    - {from: dynamodb-endpoint, to: budgets, label: budget check and win update, step: 3}
    - {from: dynamodb-endpoint, to: campaigns, label: campaign match}
    - {from: dynamodb-endpoint, to: audiences, label: segment lookup}
    - {from: graviton-bidder-nodes, to: aerospike-cluster, label: alternative key-value store}
    - {from: graviton-bidder-nodes, to: ssp-auction-server, label: bid response}
    - {from: graviton-bidder-nodes, to: kinesis-endpoint, label: compressed 25 KB micro-batches}
    - {from: kinesis-endpoint, to: bid-transactions, label: PutRecords, step: 4}
    - {from: bid-transactions, to: transactions-to-s3, label: Firehose source}
    - {from: transactions-to-s3, to: bid-analytics, label: analytics and reporting}
    - {from: graviton-bidder-nodes, to: ecr-endpoint, label: image pull}
    - {from: ecr-endpoint, to: bidder-images, label: pull pre-built images}
    - {from: bid-analytics, to: rtb-cmk, label: SSE-KMS}
    - {from: bidder-service-role, to: bidder-cluster, label: IAM roles for service accounts}
