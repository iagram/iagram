    - {from: device, to: datacenter, label: UE attaches via srsLTE UE/eNodeB simulator}
    - {from: datacenter, to: control-plane-nfs, label: S1-MME to MME pod, step: 1}
    - {from: control-plane-nfs, to: subscriber-db, label: HSS and PCRF subscriber profiles, step: 2}
    - {from: control-plane-nfs, to: user-plane-nfs, label: Sx / N4 from SGW-C and SMF/PGW-C to SGW-U and UPF/PGW-U, step: 3}
