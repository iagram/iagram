          cidr: 10.30.0.0/16
          at: [1, 1, 2, 1]
          subnets:
            - {name: data-a, cidr: 10.30.40.0/24, az: a, public: false, at: [1, 1]}
            - {name: control-plane-a, cidr: 10.30.10.0/24, az: a, public: false, at: [2, 1]}
            - {name: user-plane-a, cidr: 10.30.20.0/24, az: a, public: false, at: [3, 1]}
