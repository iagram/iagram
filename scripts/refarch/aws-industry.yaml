    - region: eu-west-1
      groups: [{label: connectivity}, {label: stream-processing}, {label: telemetry-distribution}]
  elements:
    - {tf: aws_iot_thing, name: vehicle-tcu, in: group:connectivity}
    - {tf: aws_iot_topic_rule, name: telemetry-to-kafka, in: group:connectivity}
    - {tf: aws_secretsmanager_secret, name: msk-scram-credentials, in: group:connectivity}
    - {tf: aws_s3_bucket, name: batch-telemetry-uploads, in: group:connectivity}
    - {tf: aws_msk_cluster, name: vehicle-telemetry-kafka, in: group:stream-processing}
    - {tf: aws_kinesisanalyticsv2_application, name: decode-enrich-flink, in: group:stream-processing}
    - {tf: aws_dynamodb_table, name: vehicle-last-known-state, in: group:stream-processing}
    - {tf: aws_cloudfront_distribution, name: companion-api-cdn, in: group:telemetry-distribution}
    - {tf: aws_appsync_graphql_api, name: vehicle-status-api, in: group:telemetry-distribution}
    - {tf: aws_cloudwatch_event_bus, name: vehicle-events, in: group:telemetry-distribution}
    - {tf: aws_elasticache_cluster, name: connection-state-cache, in: group:telemetry-distribution}
  actors: [device, mobile]
  flows:
    - {from: device, to: vehicle-tcu, label: CAN signals}
    - {from: vehicle-tcu, to: telemetry-to-kafka, label: MQTT over mTLS Basic Ingest, step: 1}
    - {from: telemetry-to-kafka, to: msk-scram-credentials, label: SASL/SCRAM secret}
    - {from: telemetry-to-kafka, to: vehicle-telemetry-kafka, label: Kafka rule action, step: 2}
    - {from: vehicle-tcu, to: batch-telemetry-uploads, label: pre-signed URL batch upload, step: 3}
    - {from: vehicle-telemetry-kafka, to: decode-enrich-flink, label: consume raw topic, step: 4}
    - {from: decode-enrich-flink, to: vehicle-telemetry-kafka, label: publish enriched topic}
