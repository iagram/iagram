    - {from: commerce-aggregation-api, to: product-service, label: resolver, step: 2}
    - {from: commerce-aggregation-api, to: pricing-service, label: resolver, step: 2}
    - {from: commerce-aggregation-api, to: customer-service, label: resolver, step: 2}
