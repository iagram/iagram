    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: silver, in: group:Store, at: [1, 2]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: gold, in: group:Store, at: [1, 3]}
    - {tf: azurerm_storage_account, name: stdatalake, in: group:Store, at: [2, 1, 1, 3]}
    - {tf: azurerm_machine_learning_workspace, name: mlw-serving, in: group:Serve, at: [1, 1, 1, 2]}
    - {tf: azurerm_powerbi_embedded, name: power-bi, in: group:Serve, at: [2, 1, 1, 2]}
    - {tf: azurerm_fabric_capacity, name: fabric-capacity, in: group:Serve, at: [3, 1, 1, 2]}
    - {tf: azurerm_databricks_access_connector, name: unity-catalog-access-connector, in: group:Discover and govern, at: [1, 1]}
    - {tf: azurerm_purview_account, name: pview-governance, in: group:Discover and govern, at: [1, 2]}
    - {tf: azurerm_consumption_budget_subscription, name: cost-management-budget, in: group:Platform, at: [1, 1]}
    - {tf: azurerm_key_vault, name: kv-lakehouse, in: group:Platform, at: [1, 2]}
    - {tf: azurerm_log_analytics_workspace, name: law-lakehouse, in: group:Platform, at: [1, 3]}
