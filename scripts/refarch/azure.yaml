- slug: aks-baseline-microservices
  title: AKS baseline cluster with microservices behind Application Gateway
  category: containers
  tags: [aks, microservices, application-gateway, hub-spoke, private-cluster, acr, key-vault, ingress]
  source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/containers/aks/baseline-aks
  description: A private AKS cluster with a system and a user node pool runs in a spoke virtual network peered to a hub that provides Azure Firewall egress, Azure Bastion access and a gateway to the on-premises network; Application Gateway with WAF terminates public TLS and forwards to an internal load balancer fronting the ingress that routes to microservice pods, while operators reach the API server through Bastion and the internal load balancer of the API server VNet integration subnet. Container Registry and Key Vault are reached only through private endpoints, all egress is forced through the hub firewall by user-defined routes, and Azure Monitor Container Insights collects cluster telemetry.
  containers:
    - subscription: connectivity
      resource_group: {name: rg-enterprise-networking-hubs, location: westeurope}
      vnets:
        - name: vnet-hub
          cidr: 10.200.0.0/24
          subnets:
            - {name: AzureBastionSubnet, cidr: 10.200.0.96/27, at: [1, 1]}
            - {name: AzureFirewallSubnet, cidr: 10.200.0.0/26, at: [1, 2]}
            - {name: GatewaySubnet, cidr: 10.200.0.128/27, at: [1, 3]}
    - subscription: workload
      resource_group: {name: rg-bu0001a0008, location: westeurope}
      vnets:
        - name: vnet-spoke-bu0001a0008
          cidr: 10.240.0.0/16
          subnets:
            - {name: snet-privatelinkendpoints, cidr: 10.240.4.32/28, at: [1, 1]}
            - {name: snet-apiserver, cidr: 10.240.4.64/28, at: [1, 2]}
            - {name: snet-clusteringressservices, cidr: 10.240.4.0/28, at: [1, 3]}
            - {name: snet-applicationgateway, cidr: 10.240.5.0/24, at: [1, 4]}
            - {name: snet-clusternodes, cidr: 10.240.0.0/22, at: [2, 1, 1, 4]}
  elements:
    - {tf: azurerm_bastion_host, name: bastion-hub, in: subnet:AzureBastionSubnet, at: [1, 1]}
    - {tf: azurerm_firewall, name: fw-hub, in: subnet:AzureFirewallSubnet, at: [1, 1]}
    - {tf: azurerm_virtual_network_gateway, name: vpngw-hub, in: subnet:GatewaySubnet, at: [1, 1]}
    - {tf: azurerm_private_endpoint, name: pe-acr, in: subnet:snet-privatelinkendpoints, at: [1, 1]}
    - {tf: azurerm_lb, name: ilb-apiserver, in: subnet:snet-apiserver, at: [1, 1]}
    - {tf: azurerm_lb, name: ilb-ingress, in: subnet:snet-clusteringressservices, at: [1, 1]}
    - {tf: azurerm_application_gateway, name: appgw-waf, in: subnet:snet-applicationgateway, at: [1, 1]}
    - {tf: azurerm_kubernetes_cluster, name: aks-private, in: subnet:snet-clusternodes, at: [1, 1]}
    - {tf: azurerm_kubernetes_cluster_node_pool, name: nodepool-user, in: subnet:snet-clusternodes, at: [1, 2]}
    - {tf: azurerm_key_vault, name: kv-aks, in: resource_group:rg-bu0001a0008, at: [1, 1]}
    - {tf: azurerm_container_registry, name: acr-premium, in: resource_group:rg-bu0001a0008, at: [2, 1]}
    - {tf: azurerm_log_analytics_workspace, name: law-aks, in: resource_group:rg-bu0001a0008, at: [1, 3, 2, 1]}
  actors: [{type: user, name: operator, at: [1, 1]}, {type: datacenter, name: on-premises network, at: [1, 3]}, {type: internet, at: [1, 4]}, {type: users, at: [2, 3]}]
  flows:
    - {from: users, to: appgw-waf, label: HTTPS bicycle.contoso.com, step: 1}
    - {from: appgw-waf, to: ilb-ingress, label: HTTPS *.aks-ingress.contoso.com, step: 2}
    - {from: ilb-ingress, to: aks-private, label: ingress controller, step: 3}
    - {from: vnet:vnet-hub, to: vnet:vnet-spoke-bu0001a0008, link: azurerm_virtual_network_peering, label: virtual network peering}
    - {from: aks-private, to: fw-hub, label: egress via UDR, step: 4}
    - {from: fw-hub, to: internet, label: allowed FQDNs only}
    - {from: datacenter, to: vpngw-hub, label: to on-premises}
    - {from: aks-private, to: pe-acr, label: image pull (private link)}
    - {from: pe-acr, to: acr-premium}
    - {from: pe-acr, to: kv-aks, label: Secrets Store CSI driver}
    - {from: operator, to: bastion-hub, label: Azure Bastion tunnel (kubectl)}
    - {from: bastion-hub, to: ilb-apiserver, label: private IP address}
    - {from: ilb-apiserver, to: aks-private, label: API server VNet integration}
    - {from: aks-private, to: nodepool-user, label: system and user node pools}
    - {from: aks-private, to: law-aks, label: Container Insights}

- slug: databricks-lakehouse-data-lake
  title: Modern analytics with Azure Databricks and Data Lake Storage
  category: data
  tags: [data-lake, databricks, delta-lake, medallion, event-hubs, data-factory, power-bi]
  source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/azure-databricks-modern-analytics-architecture
