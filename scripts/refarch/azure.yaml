        - {label: Store, at: [2, 2]}
        - {label: Serve, at: [1, 3, 2, 1]}
        - {label: Discover and govern, at: [3, 1, 1, 3]}
        - {label: Platform, at: [4, 1, 1, 3]}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-telemetry, in: group:Sources, at: [1, 1]}
    - {tf: azurerm_data_factory, name: adf-batch-ingest, in: group:Sources, at: [2, 1]}
