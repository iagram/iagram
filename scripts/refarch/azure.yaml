    - {from: adf-batch-ingest, to: bronze, label: batch load, step: 2}
    - {from: dbw-lakehouse, to: bronze, label: raw Delta tables, step: 3}
    - {from: dbw-lakehouse, to: silver, label: cleansed Delta tables, step: 4}
    - {from: bronze, to: silver, label: refine}
    - {from: silver, to: gold, label: aggregate}
    - {from: dbw-lakehouse, to: mlw-serving, label: MLflow model deploy, step: 5}
    - {from: gold, to: dbw-lakehouse, label: SQL warehouse queries, step: 6}
    - {from: stdatalake, to: fabric-capacity, label: OneLake shortcut to Delta tables, step: 7}
    - {from: dbw-lakehouse, to: power-bi, label: SQL warehouse to Power BI, step: 8}
    - {from: unity-catalog-access-connector, to: stdatalake, label: Unity Catalog governance, step: 9}
    - {from: pview-governance, to: stdatalake, label: scan and classify, step: 9}
    - {from: Microsoft Entra ID, to: dbw-lakehouse, label: SSO and SCIM}
    - {from: dbw-lakehouse, to: kv-lakehouse, label: secret scope}
    - {from: dbw-lakehouse, to: law-lakehouse, label: Azure Monitor}
    - {from: Azure DevOps and GitHub, to: dbw-lakehouse, label: CI/CD (Databricks Repos)}

- slug: stream-analytics-event-hubs
  title: Stream processing with Event Hubs and Stream Analytics
  category: data
