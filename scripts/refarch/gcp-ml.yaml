    - {tf: google_firestore_database, name: session-store, in: region}
    - {tf: google_bigquery_dataset, name: enterprise-data, in: region}
    - {tf: google_secret_manager_secret, name: tool-api-keys, in: region}
    - {tf: google_artifact_registry_repository, name: agent-images, in: region}
  actors: [users]
  flows:
    - {from: users, to: chat-frontend, label: HTTPS prompt, step: 1}
    - {from: chat-frontend, to: adk-agent, label: forward request, step: 2}
    - {from: adk-agent, to: session-store, label: read/write session state, step: 3}
    - {from: adk-agent, to: mcp-tools-server, label: tool call (MCP), step: 4}
    - {from: mcp-tools-server, to: enterprise-data, label: query data, step: 5}
    - {from: mcp-tools-server, to: tool-api-keys, label: fetch credentials}
    - {from: adk-agent, to: chat-frontend, label: grounded response, step: 6}
    - {from: agent-images, to: adk-agent, label: container image}

- slug: mlops-vertex-pipelines-cloud-build
  title: MLOps with Vertex AI Pipelines, Model Registry and Cloud Build
  category: ml
  tags: [mlops, vertex ai pipelines, model registry, cloud build, tfx, continuous training]
  source: https://docs.cloud.google.com/architecture/architecture-for-mlops-using-tfx-kubeflow-pipelines-and-cloud-build
  description: Cloud Build runs CI on the pipeline source, builds component images into Artifact Registry and compiles the pipeline definition to Cloud Storage, from where Vertex AI Pipelines executes data validation, transformation with Dataflow, training and evaluation steps. Validated models are registered in Vertex AI Model Registry and deployed to an online endpoint, while Cloud Scheduler and Pub/Sub trigger continuous training runs on new data in BigQuery.
