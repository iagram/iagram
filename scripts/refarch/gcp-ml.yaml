    - {tf: google_storage_bucket, name: model-artifacts, in: region}
    - {tf: google_bigquery_dataset, name: predictions-dataset, in: region}
    - {tf: google_pubsub_topic, name: predictions-ready, in: region}
    - {tf: google_cloudfunctions2_function, name: notify-consumers-fn, in: region}
  actors: [client]
  flows:
    - {from: nightly-schedule, to: batch-predict-wf, label: cron trigger, step: 1}
    - {from: batch-predict-wf, to: model-artifacts, label: create batch prediction job, step: 2}
    - {from: features-dataset, to: model-artifacts, label: BigQuery input table, step: 3}
    - {from: batch-input-bucket, to: model-artifacts, label: JSONL input files, step: 3}
    - {from: model-artifacts, to: predictions-dataset, label: write predictions, step: 4}
    - {from: batch-predict-wf, to: predictions-ready, label: publish completion, step: 5}
    - {from: predictions-ready, to: notify-consumers-fn, label: trigger, step: 6}
