- slug: model-monitoring-skew-drift
  title: Model monitoring for skew and drift on Vertex AI endpoints
  category: ml
  tags: [model monitoring, drift, skew, vertex ai endpoint, bigquery, alerting, retraining]
  source: https://docs.cloud.google.com/vertex-ai/docs/model-monitoring/overview
  description: Requests to a Vertex AI online endpoint are logged to BigQuery, and a Vertex AI model monitor compares the serving feature distributions against the training baseline in Cloud Storage on a schedule to detect skew and drift. Threshold breaches raise Cloud Monitoring alerts that publish to Pub/Sub, where a Cloud Run function triggers the retraining pipeline in Vertex AI Pipelines to refresh the deployed model.
  containers:
    - project: monitoring-prj
      region: us-central1
  elements:
    - {tf: google_vertex_ai_endpoint, name: prod-endpoint, in: region}
    - {tf: google_bigquery_dataset, name: prediction-logs, in: region}
    - {tf: google_storage_bucket, name: training-baseline, in: region}
    - {tf: google_cloud_scheduler_job, name: monitor-schedule, in: region}
    - {tf: google_monitoring_alert_policy, name: drift-alert, in: region}
    - {tf: google_pubsub_topic, name: drift-detected, in: region}
    - {tf: google_cloudfunctions2_function, name: trigger-retrain-fn, in: region}
    - {tf: google_storage_bucket, name: retrain-pipeline-root, in: region}
  actors: [client, user]
  flows:
    - {from: client, to: prod-endpoint, label: online predictions, step: 1}
    - {from: prod-endpoint, to: prediction-logs, label: request-response logging, step: 2}
    - {from: monitor-schedule, to: prediction-logs, label: scheduled monitoring job reads serving data, step: 3}
    - {from: training-baseline, to: prediction-logs, label: baseline distribution comparison, step: 4}
    - {from: prediction-logs, to: drift-alert, label: skew/drift metrics, step: 5}
    - {from: drift-alert, to: drift-detected, label: notification channel, step: 6}
    - {from: drift-alert, to: user, label: email / chat alert, step: 6}
    - {from: drift-detected, to: trigger-retrain-fn, label: trigger, step: 7}
    - {from: trigger-retrain-fn, to: retrain-pipeline-root, label: submit retraining pipeline, step: 8}
    - {from: retrain-pipeline-root, to: prod-endpoint, label: deploy refreshed model, step: 9}
