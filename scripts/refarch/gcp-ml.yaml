      region: us-central1
      groups: [{label: ci-cd}, {label: training}, {label: serving}]
  elements:
    - {tf: google_sourcerepo_repository, name: pipeline-source, in: group:ci-cd}
    - {tf: google_cloudbuild_trigger, name: pipeline-ci, in: group:ci-cd}
    - {tf: google_artifact_registry_repository, name: component-images, in: group:ci-cd}
    - {tf: google_storage_bucket, name: pipeline-root, in: group:training}
    - {tf: google_bigquery_dataset, name: training-data, in: group:training}
    - {tf: google_cloud_scheduler_job, name: retrain-schedule, in: group:training}
    - {tf: google_pubsub_topic, name: pipeline-trigger, in: group:training}
    - {tf: google_cloudfunctions2_function, name: submit-pipeline-fn, in: group:training}
    - {tf: google_vertex_ai_endpoint, name: prod-endpoint, in: group:serving}
  actors: [user, client]
  flows:
    - {from: user, to: pipeline-source, label: push pipeline code, step: 1}
    - {from: pipeline-source, to: pipeline-ci, label: trigger build, step: 2}
    - {from: pipeline-ci, to: component-images, label: push component images, step: 3}
    - {from: pipeline-ci, to: pipeline-root, label: upload compiled pipeline, step: 4}
    - {from: retrain-schedule, to: pipeline-trigger, label: cron message, step: 5}
    - {from: pipeline-trigger, to: submit-pipeline-fn, label: trigger, step: 6}
    - {from: submit-pipeline-fn, to: pipeline-root, label: run Vertex AI pipeline, step: 7}
    - {from: training-data, to: pipeline-root, label: extract + validate + train, step: 8}
    - {from: pipeline-root, to: prod-endpoint, label: register + deploy model, step: 9}
    - {from: client, to: prod-endpoint, label: online prediction, step: 10}

- slug: gke-gpu-tpu-training
