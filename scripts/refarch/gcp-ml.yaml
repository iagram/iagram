    - {tf: google_vertex_ai_endpoint, name: model-endpoint, in: region}
    - {tf: google_redis_instance, name: feature-cache, in: region}
    - {tf: google_storage_bucket, name: model-artifacts, in: region}
    - {tf: google_bigquery_dataset, name: request-logs, in: region}
