- slug: rag-vector-search-cloud-run
  title: RAG infrastructure with Vertex AI Vector Search and Cloud Run
  category: ml
  tags: [rag, vector search, embeddings, cloud run, pub/sub, gemini]
  source: https://docs.cloud.google.com/architecture/gen-ai-rag-vertex-ai-vector-search
  description: Document uploads to Cloud Storage publish Pub/Sub notifications that trigger a Cloud Run function to chunk the content, call the Vertex AI embeddings API and upsert vectors into a Vector Search index deployed on an index endpoint. A frontend Cloud Run service forwards user queries to a backend service that embeds the query, retrieves grounding chunks from Vector Search, augments the prompt for a Gemini model and applies safety filters before answering.
  containers:
    - project: rag-prj
      region: europe-west1
      groups: [{label: ingestion}, {label: serving}]
  elements:
    - {tf: google_storage_bucket, name: raw-docs-bucket, in: group:ingestion}
    - {tf: google_pubsub_topic, name: doc-uploaded-topic, in: group:ingestion}
    - {tf: google_cloudfunctions2_function, name: embed-fn, in: group:ingestion}
    - {tf: google_vertex_ai_index, name: docs-index, in: group:serving}
    - {tf: google_vertex_ai_index_endpoint, name: docs-index-endpoint, in: group:serving}
    - {tf: google_cloud_run_v2_service, name: chat-frontend, in: group:serving}
    - {tf: google_cloud_run_v2_service, name: rag-backend, in: group:serving}
    - {tf: google_bigquery_dataset, name: eval-scores, in: region}
  actors: [users]
  flows:
    - {from: raw-docs-bucket, to: doc-uploaded-topic, label: object finalize notification, step: 1}
    - {from: doc-uploaded-topic, to: embed-fn, label: push trigger, step: 2}
    - {from: embed-fn, to: docs-index, label: chunk + embed + upsert, step: 3}
    - {from: docs-index, to: docs-index-endpoint, label: deployed index}
    - {from: users, to: chat-frontend, label: HTTPS prompt, step: 4}
    - {from: chat-frontend, to: rag-backend, label: query, step: 5}
    - {from: rag-backend, to: docs-index-endpoint, label: nearest-neighbour lookup, step: 6}
    - {from: rag-backend, to: eval-scores, label: response quality scores, step: 7}

- slug: rag-alloydb-pgvector
  title: RAG infrastructure with AlloyDB for PostgreSQL as the vector store
  category: ml
  tags: [rag, alloydb, pgvector, embeddings, cloud run functions, evaluation]
  source: https://docs.cloud.google.com/architecture/rag-capable-gen-ai-app-using-vertex-ai
  description: Uploaded data lands in Cloud Storage, a Pub/Sub message triggers a Cloud Run function that chunks the content and stores Vertex AI embeddings as pgvector columns in an AlloyDB cluster. The serving path embeds the user query, runs a semantic search in AlloyDB, builds a grounded prompt for the Vertex AI LLM, and an asynchronous evaluation function scores responses and loads the results into BigQuery.
  containers:
    - project: rag-alloydb-prj
      region: europe-west4
      vpcs:
        - name: rag-vpc
          cidr: 10.30.0.0/16
          subnets:
            - {name: db-sub, cidr: 10.30.1.0/24, region: europe-west4}
  elements:
    - {tf: google_storage_bucket, name: source-data-bucket, in: region}
    - {tf: google_pubsub_topic, name: ingest-topic, in: region}
    - {tf: google_cloudfunctions2_function, name: chunk-embed-fn, in: region}
    - {tf: google_alloydb_cluster, name: vector-store, in: subnet:db-sub}
    - {tf: google_cloud_run_v2_service, name: rag-app, in: region}
    - {tf: google_pubsub_topic, name: eval-topic, in: region}
    - {tf: google_cloudfunctions2_function, name: eval-fn, in: region}
    - {tf: google_bigquery_dataset, name: eval-dataset, in: region}
    - {tf: google_secret_manager_secret, name: db-password, in: region}
  actors: [users]
  flows:
    - {from: source-data-bucket, to: ingest-topic, label: object notification, step: 1}
    - {from: ingest-topic, to: chunk-embed-fn, label: trigger, step: 2}
    - {from: chunk-embed-fn, to: vector-store, label: INSERT embeddings (pgvector), step: 3}
    - {from: users, to: rag-app, label: HTTPS question, step: 4}
    - {from: rag-app, to: vector-store, label: similarity search, step: 5}
    - {from: rag-app, to: db-password, label: fetch credentials}
    - {from: rag-app, to: eval-topic, label: publish response for scoring, step: 6}
    - {from: eval-topic, to: eval-fn, label: trigger, step: 7}
    - {from: eval-fn, to: eval-dataset, label: load evaluation scores, step: 8}

- slug: rag-vertex-ai-search-datastore
  title: RAG with a Vertex AI Search data store and Gemini Enterprise
  category: ml
  tags: [rag, vertex ai search, discovery engine, gemini enterprise, managed data store]
  source: https://docs.cloud.google.com/architecture/rag-genai-gemini-enterprise-vertexai
