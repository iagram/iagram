    - {tf: google_storage_bucket, name: docs-bucket, in: group:ingestion}
    - {tf: google_pubsub_topic, name: docs-topic, in: group:ingestion}
    - {tf: google_cloudfunctions2_function, name: metadata-fn, in: group:ingestion}
    - {tf: google_storage_bucket, name: metadata-bucket, in: group:ingestion}
    - {tf: google_discovery_engine_data_store, name: enterprise-datastore, in: group:serving}
    - {tf: google_discovery_engine_search_engine, name: enterprise-search-app, in: group:serving}
    - {tf: google_cloud_run_v2_service, name: web-frontend, in: group:serving}
    - {tf: google_cloud_run_v2_service, name: api-backend, in: group:serving}
  actors: [users]
  flows:
    - {from: docs-bucket, to: docs-topic, label: upload event, step: 1}
    - {from: docs-topic, to: metadata-fn, label: trigger, step: 2}
    - {from: metadata-fn, to: metadata-bucket, label: write JSONL metadata, step: 3}
    - {from: metadata-bucket, to: enterprise-datastore, label: import + chunk + embed, step: 4}
    - {from: enterprise-datastore, to: enterprise-search-app, label: indexed content}
    - {from: users, to: web-frontend, label: HTTPS question, step: 5}
    - {from: web-frontend, to: api-backend, label: query, step: 6}
    - {from: api-backend, to: enterprise-search-app, label: search + grounded generation, step: 7}

- slug: single-agent-adk-cloud-run
  title: Single-agent AI system with ADK, MCP tools and Cloud Run
  category: ml
  tags: [agent, adk, function calling, mcp, cloud run, gemini]
  source: https://docs.cloud.google.com/architecture/single-agent-ai-system-adk-cloud-run
