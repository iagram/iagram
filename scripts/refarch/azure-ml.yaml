  tags: [fine-tuning, azure-openai, foundry, jsonl, lora, model-deployment, evaluation]
  source: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning
  description: Training and validation data in JSONL chat-completions format are uploaded from Blob Storage to a Foundry resource, where a supervised, DPO, or reinforcement fine-tuning job customises a base model such as GPT-4o or GPT-4.1 with LoRA-based training and emits loss and token-accuracy metrics and per-epoch checkpoints. The resulting fine-tuned model is deployed as its own deployment, evaluated in the playground and with the Evaluation SDK, and consumed by applications through the standard inference endpoint.
  containers:
    - subscription: genai-platform
      resource_group: {name: rg-finetune, location: swedencentral}
  elements:
    - {tf: azurerm_storage_account, name: stfinetunedata, in: resource_group:rg-finetune}
    - {tf: azurerm_cognitive_account, name: foundry-finetune, in: resource_group:rg-finetune}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-base, in: resource_group:rg-finetune}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-finetuned-v1, in: resource_group:rg-finetune}
    - {tf: azurerm_machine_learning_workspace, name: mlw-eval-finetune, in: resource_group:rg-finetune}
    - {tf: azurerm_linux_web_app, name: app-finetuned-consumer, in: resource_group:rg-finetune}
    - {tf: azurerm_key_vault, name: kv-finetune, in: resource_group:rg-finetune}
    - {tf: azurerm_application_insights, name: appi-finetune, in: resource_group:rg-finetune}
    - {tf: azurerm_log_analytics_workspace, name: law-finetune, in: resource_group:rg-finetune}
  actors: [user, users]
  flows:
    - {from: user, to: stfinetunedata, label: upload JSONL training / validation sets, step: 1}
    - {from: stfinetunedata, to: foundry-finetune, label: import training files, step: 2}
    - {from: user, to: foundry-finetune, label: create fine-tuning job (SFT / DPO / RFT), step: 3}
    - {from: gpt-4o-base, to: gpt-4o-finetuned-v1, label: base model + LoRA weights, step: 4}
    - {from: foundry-finetune, to: gpt-4o-finetuned-v1, label: deploy checkpoint, step: 5}
    - {from: mlw-eval-finetune, to: gpt-4o-finetuned-v1, label: evaluation runs vs base, step: 6}
    - {from: users, to: app-finetuned-consumer, label: HTTPS, step: 7}
    - {from: app-finetuned-consumer, to: gpt-4o-finetuned-v1, label: inference on fine-tuned deployment, step: 8}
    - {from: app-finetuned-consumer, to: kv-finetune, label: endpoint secrets}
    - {from: foundry-finetune, to: appi-finetune, label: job metrics and usage}
    - {from: appi-finetune, to: law-finetune, label: logs}

- slug: conversational-bot-bot-service-language
  title: Conversational bot with Azure AI Bot Service and Language
  category: ml
  tags: [bot-service, bot-framework, channels, teams, conversational-language-understanding, question-answering, app-service]
  source: https://learn.microsoft.com/en-us/azure/bot-service/bot-builder-basics
  description: Azure AI Bot Service connects channels such as Microsoft Teams and web chat to a bot web application on App Service, exchanging message and conversation-update activities over HTTPS POST within 15-second turns. The bot uses Azure AI Language conversational language understanding and custom question answering to interpret intents and answer FAQs, persists conversation state in Cosmos DB, and reports telemetry to Application Insights.
  containers:
    - subscription: bots-prod
      resource_group: {name: rg-conversational-bot, location: westeurope}
  elements:
    - {tf: azurerm_bot_service_azure_bot, name: bot-enterprise-assistant, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_service_plan, name: asp-bot, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_linux_web_app, name: app-bot-messaging, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_cognitive_account, name: language-clu-qna, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_search_service, name: srch-qna-knowledge, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_cosmosdb_account, name: cosmos-bot-state, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_storage_account, name: stbottranscripts, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_key_vault, name: kv-bot, in: resource_group:rg-conversational-bot}
    - {tf: azurerm_application_insights, name: appi-bot, in: resource_group:rg-conversational-bot}
  actors: [users, saas]
  flows:
    - {from: users, to: saas, label: Teams / web chat channel, step: 1}
    - {from: saas, to: bot-enterprise-assistant, label: channel activity, step: 2}
    - {from: bot-enterprise-assistant, to: app-bot-messaging, label: "HTTPS POST /api/messages", step: 3}
    - {from: app-bot-messaging, to: language-clu-qna, label: CLU intents and custom question answering, step: 4}
    - {from: language-clu-qna, to: srch-qna-knowledge, label: knowledge base index}
    - {from: app-bot-messaging, to: cosmos-bot-state, label: conversation and user state, step: 5}
    - {from: app-bot-messaging, to: stbottranscripts, label: transcript logging}
    - {from: app-bot-messaging, to: bot-enterprise-assistant, label: reply activity, step: 6}
    - {from: app-bot-messaging, to: kv-bot, label: app ID and secrets}
    - {from: app-bot-messaging, to: appi-bot, label: telemetry}

- slug: rag-ingestion-pipeline-semantic-search
  title: RAG data pipeline and semantic search with Azure AI Search
  category: ml
  tags: [rag, semantic-search, chunking, embeddings, hybrid-search, ai-search, orchestrator, evaluation]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-solution-design-and-evaluation-guide
  description: A data pipeline pulls documents from Blob Storage, chunks and enriches them with metadata, generates embeddings with an Azure OpenAI embedding model, and persists the chunks into an AI Search index configured for vector, full-text, and hybrid queries with semantic ranking. At request time an orchestrator on App Service issues the search, packages the top results and the user query into a prompt for the chat model, and returns the grounded response to the intelligent application.
  containers:
    - subscription: knowledge-apps
      resource_group: {name: rg-rag-search, location: eastus}
  elements:
    - {tf: azurerm_storage_account, name: stragsources, in: resource_group:rg-rag-search}
    - {tf: azurerm_linux_function_app, name: func-rag-pipeline, in: resource_group:rg-rag-search}
    - {tf: azurerm_cognitive_account, name: docintel-layout, in: resource_group:rg-rag-search}
    - {tf: azurerm_cognitive_account, name: foundry-rag, in: resource_group:rg-rag-search}
    - {tf: azurerm_cognitive_deployment, name: text-embedding-3-large, in: resource_group:rg-rag-search}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-chat, in: resource_group:rg-rag-search}
    - {tf: azurerm_search_service, name: srch-hybrid-index, in: resource_group:rg-rag-search}
    - {tf: azurerm_service_plan, name: asp-rag, in: resource_group:rg-rag-search}
    - {tf: azurerm_linux_web_app, name: app-rag-orchestrator, in: resource_group:rg-rag-search}
    - {tf: azurerm_key_vault, name: kv-rag, in: resource_group:rg-rag-search}
    - {tf: azurerm_application_insights, name: appi-rag, in: resource_group:rg-rag-search}
  actors: [users, client]
  flows:
    - {from: stragsources, to: func-rag-pipeline, label: documents pushed / pulled, step: 1}
    - {from: func-rag-pipeline, to: docintel-layout, label: document layout analysis for chunking, step: 2}
    - {from: func-rag-pipeline, to: text-embedding-3-large, label: embed chunks and metadata, step: 3}
    - {from: text-embedding-3-large, to: foundry-rag, label: model deployment}
    - {from: func-rag-pipeline, to: srch-hybrid-index, label: persist chunks (vector + text fields), step: 4}
    - {from: users, to: client, label: intelligent application UI}
    - {from: client, to: app-rag-orchestrator, label: query API, step: 5}
    - {from: app-rag-orchestrator, to: srch-hybrid-index, label: hybrid search + semantic ranker, step: 6}
    - {from: app-rag-orchestrator, to: gpt-4o-chat, label: prompt with top-N chunks, step: 7}
    - {from: gpt-4o-chat, to: foundry-rag, label: model deployment}
    - {from: app-rag-orchestrator, to: kv-rag, label: secrets}
    - {from: app-rag-orchestrator, to: appi-rag, label: telemetry}

- slug: next-order-forecasting-recommendation
  title: Next-order forecasting and product recommendations with Azure Machine Learning
  category: ml
  tags: [recommendation, forecasting, parallel-jobs, compute-cluster, online-endpoint, data-factory, sql-database]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/idea/next-order-forecasting
  description: Azure Data Factory ingests order, customer, merchandise, and partner data into a Data Lake Storage and SQL Database staging area, and Azure Machine Learning parallel jobs on a compute cluster train a forecasting model for every customer-store and SKU combination. Registered models are deployed to managed online endpoints, predictions are written back to the analytical stores, and a web app, Power BI, or Power Apps surface recommended SKUs and quantities to customers.
  containers:
    - subscription: distribution-analytics
      resource_group: {name: rg-order-forecast, location: centralus}
  elements:
    - {tf: azurerm_mssql_server, name: sql-orders-staging, in: resource_group:rg-order-forecast}
    - {tf: azurerm_data_factory, name: adf-order-ingest, in: resource_group:rg-order-forecast}
    - {tf: azurerm_storage_account, name: storderlake, in: resource_group:rg-order-forecast}
    - {tf: azurerm_machine_learning_workspace, name: mlw-forecast, in: resource_group:rg-order-forecast}
    - {tf: azurerm_machine_learning_compute_cluster, name: cpu-cluster-forecast, in: resource_group:rg-order-forecast}
    - {tf: azurerm_machine_learning_inference_cluster, name: online-endpoint-forecast, in: resource_group:rg-order-forecast}
    - {tf: azurerm_container_registry, name: acrforecast, in: resource_group:rg-order-forecast}
    - {tf: azurerm_key_vault, name: kv-forecast, in: resource_group:rg-order-forecast}
    - {tf: azurerm_service_plan, name: asp-recommendations, in: resource_group:rg-order-forecast}
    - {tf: azurerm_linux_web_app, name: app-recommendations, in: resource_group:rg-order-forecast}
    - {tf: azurerm_application_insights, name: appi-forecast, in: resource_group:rg-order-forecast}
  actors: [saas, users, database]
  flows:
    - {from: database, to: adf-order-ingest, label: orders, customers, merchandise, step: 1}
    - {from: saas, to: adf-order-ingest, label: partner data (weather, events)}
    - {from: adf-order-ingest, to: storderlake, label: staging (data lake), step: 2}
    - {from: adf-order-ingest, to: sql-orders-staging, label: staging (SQL)}
    - {from: storderlake, to: cpu-cluster-forecast, label: per store-SKU datasets, step: 3}
    - {from: cpu-cluster-forecast, to: mlw-forecast, label: parallel jobs register models, step: 4}
    - {from: mlw-forecast, to: online-endpoint-forecast, label: deploy to managed online endpoint, step: 5}
    - {from: acrforecast, to: online-endpoint-forecast, label: scoring environment}
    - {from: online-endpoint-forecast, to: sql-orders-staging, label: write predictions, step: 6}
    - {from: app-recommendations, to: online-endpoint-forecast, label: real-time SKU and quantity forecast, step: 7}
    - {from: users, to: app-recommendations, label: recommended next order, step: 8}
    - {from: app-recommendations, to: kv-forecast, label: endpoint key}
    - {from: app-recommendations, to: appi-forecast, label: telemetry}
