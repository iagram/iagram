# Azure reference architectures: machine learning and generative AI
# Sources verified against learn.microsoft.com on 2026-09-13.

- slug: baseline-foundry-chat-rag
  title: Baseline Microsoft Foundry chat with RAG
  category: ml
  tags: [rag, azure-openai, ai-search, app-service, private-endpoint, application-gateway, foundry-agent]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
  description: A zone-redundant App Service chat UI behind Application Gateway with WAF calls a Foundry Agent Service prompt agent over a private endpoint; the agent grounds Azure OpenAI completions with vector results from Azure AI Search and persists conversation state in Cosmos DB and Blob Storage. Every PaaS dependency is reached through private endpoints in a segmented virtual network, and agent egress to public tools and MCP servers is forced through Azure Firewall FQDN rules.
  containers:
    - subscription: workload-prod
      resource_group: {name: rg-chat-baseline, location: eastus2}
      vnets:
        - name: vnet-chat
          cidr: 10.0.0.0/16
          subnets:
            - {name: snet-appGateway, cidr: 10.0.1.0/24, public: true}
            - {name: snet-appServicePlan, cidr: 10.0.2.0/24}
            - {name: snet-privateEndpoints, cidr: 10.0.3.0/24}
            - {name: snet-agentsEgress, cidr: 10.0.4.0/24}
            - {name: AzureFirewallSubnet, cidr: 10.0.5.0/26}
  elements:
    - {tf: azurerm_application_gateway, name: agw-chat, in: subnet:snet-appGateway}
    - {tf: azurerm_service_plan, name: asp-chat, in: subnet:snet-appServicePlan}
    - {tf: azurerm_linux_web_app, name: app-chat-ui, in: subnet:snet-appServicePlan}
    - {tf: azurerm_private_endpoint, name: pe-foundry, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_cognitive_account, name: foundry-chat, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-deployment, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_search_service, name: srch-grounding, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_cosmosdb_account, name: cosmos-enterprise-memory, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_storage_account, name: stchatfiles, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_key_vault, name: kv-chat-tls, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_firewall, name: afw-egress, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_application_insights, name: appi-chat, in: resource_group:rg-chat-baseline}
    - {tf: azurerm_log_analytics_workspace, name: law-chat, in: resource_group:rg-chat-baseline}
  actors: [users, internet]
  flows:
    - {from: users, to: agw-chat, label: HTTPS (WAF), step: 1}
    - {from: agw-chat, to: app-chat-ui, label: route to chat UI, step: 2}
    - {from: app-chat-ui, to: pe-foundry, label: Responses API (managed identity), step: 3}
    - {from: pe-foundry, to: foundry-chat, label: private link}
    - {from: foundry-chat, to: srch-grounding, label: AI Search tool (vector + semantic), step: 4}
    - {from: foundry-chat, to: afw-egress, label: public tool / MCP egress, step: 5}
    - {from: afw-egress, to: internet, label: FQDN-allowed egress}
    - {from: foundry-chat, to: gpt-4o-deployment, label: model inference, step: 6}
    - {from: foundry-chat, to: cosmos-enterprise-memory, label: persist conversation items, step: 7}
    - {from: foundry-chat, to: stchatfiles, label: uploaded files}
    - {from: agw-chat, to: kv-chat-tls, label: TLS certificate}
    - {from: app-chat-ui, to: appi-chat, label: telemetry}
    - {from: appi-chat, to: law-chat, label: logs}

- slug: foundry-agents-landing-zone
  title: Baseline Foundry chat and agents in an Azure landing zone
  category: ml
  tags: [landing-zone, foundry-agent, hub-spoke, azure-openai, private-dns, firewall, platform-team]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-landing-zone
  description: The baseline Foundry chat workload is deployed into an application landing zone spoke whose virtual network is peered to a platform-owned connectivity hub that supplies Azure Firewall, private DNS zones, and hybrid connectivity. The workload team owns App Service, Foundry Agent Service, AI Search, Cosmos DB, and their private endpoints, while internet egress and DNS resolution are delegated to the platform team through hub routing.
  containers:
    - subscription: platform-connectivity
      resource_group: {name: rg-hub, location: eastus2}
      vnets:
        - name: vnet-hub
          cidr: 10.100.0.0/22
          subnets:
            - {name: AzureFirewallSubnet, cidr: 10.100.0.0/26}
            - {name: AzureBastionSubnet, cidr: 10.100.1.0/26}
    - subscription: app-landing-zone
      resource_group: {name: rg-chat-alz, location: eastus2}
      vnets:
        - name: vnet-spoke-chat
          cidr: 10.1.0.0/22
          subnets:
            - {name: snet-appGateway, cidr: 10.1.0.0/24, public: true}
            - {name: snet-appServicePlan, cidr: 10.1.1.0/24}
            - {name: snet-privateEndpoints, cidr: 10.1.2.0/24}
            - {name: snet-agentsEgress, cidr: 10.1.3.0/24}
  elements:
    - {tf: azurerm_firewall, name: afw-hub, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_bastion_host, name: bas-hub, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_log_analytics_workspace, name: law-platform, in: resource_group:rg-hub}
    - {tf: azurerm_application_gateway, name: agw-chat-alz, in: subnet:snet-appGateway}
    - {tf: azurerm_linux_web_app, name: app-chat-alz, in: subnet:snet-appServicePlan}
    - {tf: azurerm_private_endpoint, name: pe-foundry-alz, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_cognitive_account, name: foundry-alz, in: resource_group:rg-chat-alz}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-alz, in: resource_group:rg-chat-alz}
    - {tf: azurerm_search_service, name: srch-alz, in: resource_group:rg-chat-alz}
    - {tf: azurerm_cosmosdb_account, name: cosmos-alz, in: resource_group:rg-chat-alz}
    - {tf: azurerm_storage_account, name: stalzagent, in: resource_group:rg-chat-alz}
    - {tf: azurerm_key_vault, name: kv-alz, in: resource_group:rg-chat-alz}
  actors: [users, internet, datacenter]
  flows:
    - {from: vnet:vnet-hub, to: vnet:vnet-spoke-chat, link: azurerm_virtual_network_peering, label: hub-spoke peering}
    - {from: users, to: agw-chat-alz, label: HTTPS (WAF), step: 1}
    - {from: agw-chat-alz, to: app-chat-alz, label: chat UI, step: 2}
    - {from: app-chat-alz, to: pe-foundry-alz, label: agent invocation, step: 3}
    - {from: pe-foundry-alz, to: foundry-alz, label: private link}
    - {from: foundry-alz, to: srch-alz, label: grounding query, step: 4}
    - {from: foundry-alz, to: gpt-4o-alz, label: completion, step: 5}
    - {from: foundry-alz, to: cosmos-alz, label: conversation state, step: 6}
    - {from: foundry-alz, to: afw-hub, label: "0.0.0.0/0 via UDR to hub", step: 7}
    - {from: afw-hub, to: internet, label: allowed FQDNs}
    - {from: datacenter, to: afw-hub, label: hybrid connectivity}
    - {from: bas-hub, to: app-chat-alz, label: ops access}
    - {from: foundry-alz, to: law-platform, label: diagnostics}

- slug: dynamic-ai-agents-at-scale
  title: Dynamic AI agents at scale on AKS with semantic agent selection
  category: ml
  tags: [multi-agent, aks, ai-search, semantic-cache, redis, foundry, azure-openai, orchestration]
  source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/ai-agents-at-scale
  description: An agent service on AKS receives user queries behind Application Gateway, and an agent selector queries an AI Search semantic cache of sample utterances to shortlist candidate agents before an LLM picks one or the top-scoring agent is invoked directly. An agent factory instantiates the selected agent, which calls Azure OpenAI models in Foundry, keeps multiturn context in Azure Managed Redis, and reaches external APIs or MCP servers through a firewall or NAT gateway.
  containers:
    - subscription: agents-prod
      resource_group: {name: rg-agents-scale, location: westus3}
      vnets:
        - name: vnet-agents
          cidr: 10.20.0.0/16
          subnets:
            - {name: snet-gateway, cidr: 10.20.0.0/24, public: true}
            - {name: snet-cluster, cidr: 10.20.16.0/20}
            - {name: snet-privateEndpoints, cidr: 10.20.1.0/24}
            - {name: AzureFirewallSubnet, cidr: 10.20.2.0/26}
  elements:
    - {tf: azurerm_application_gateway, name: agw-agents, in: subnet:snet-gateway}
    - {tf: azurerm_kubernetes_cluster, name: aks-agents, in: subnet:snet-cluster}
    - {tf: azurerm_container_registry, name: acragents, in: resource_group:rg-agents-scale}
    - {tf: azurerm_search_service, name: srch-semantic-cache, in: resource_group:rg-agents-scale}
    - {tf: azurerm_cognitive_account, name: foundry-agents, in: resource_group:rg-agents-scale}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-agents, in: resource_group:rg-agents-scale}
    - {tf: azurerm_redis_cache, name: redis-conversation, in: resource_group:rg-agents-scale}
    - {tf: azurerm_cosmosdb_account, name: cosmos-agent-registry, in: resource_group:rg-agents-scale}
    - {tf: azurerm_storage_account, name: stagentlogs, in: resource_group:rg-agents-scale}
    - {tf: azurerm_key_vault, name: kv-agents, in: resource_group:rg-agents-scale}
    - {tf: azurerm_private_endpoint, name: pe-search-cache, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_firewall, name: afw-agents, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_application_insights, name: appi-agents, in: resource_group:rg-agents-scale}
    - {tf: azurerm_log_analytics_workspace, name: law-agents, in: resource_group:rg-agents-scale}
  actors: [users, internet]
  flows:
    - {from: users, to: agw-agents, label: HTTPS (WAF), step: 1}
    - {from: agw-agents, to: aks-agents, label: AI agent service, step: 2}
    - {from: aks-agents, to: pe-search-cache, label: vector similarity on utterances, step: 3}
    - {from: pe-search-cache, to: srch-semantic-cache, label: private link}
    - {from: aks-agents, to: cosmos-agent-registry, label: agent definitions (code / YAML), step: 4}
    - {from: aks-agents, to: gpt-4o-agents, label: agent selection and response, step: 5}
    - {from: gpt-4o-agents, to: foundry-agents, label: hosted in Foundry}
    - {from: aks-agents, to: redis-conversation, label: chat history (TTL)}
    - {from: aks-agents, to: afw-agents, label: external APIs / MCP, step: 6}
    - {from: afw-agents, to: internet, label: static outbound IP}
    - {from: acragents, to: aks-agents, label: agent images}
    - {from: aks-agents, to: appi-agents, label: OpenTelemetry traces}
    - {from: appi-agents, to: law-agents, label: logs and KQL}

- slug: document-classification-durable-functions
  title: Automated document classification with Durable Functions and Document Intelligence
  category: ml
  tags: [document-intelligence, durable-functions, service-bus, ai-search, embeddings, rag, cosmos-db]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/automate-document-classification-durable-functions
  description: A web app stores uploaded multi-document files in Blob Storage and enqueues a Service Bus command that starts a Durable Functions orchestration, whose activities call Document Intelligence to split and classify each embedded document, store metadata in Cosmos DB, chunk the text, and write text-embedding-3-large vectors into an AI Search index. A pre-deployed Foundry Agent Service prompt agent with the AI Search tool then answers user questions over the indexed content with inline citations.
  containers:
    - subscription: docs-prod
      resource_group: {name: rg-doc-classify, location: eastus}
  elements:
    - {tf: azurerm_service_plan, name: asp-docs, in: resource_group:rg-doc-classify}
    - {tf: azurerm_linux_web_app, name: app-doc-upload, in: resource_group:rg-doc-classify}
    - {tf: azurerm_storage_account, name: stdocfiles, in: resource_group:rg-doc-classify}
    - {tf: azurerm_servicebus_namespace, name: sb-doc-commands, in: resource_group:rg-doc-classify}
    - {tf: azurerm_linux_function_app, name: func-doc-orchestrator, in: resource_group:rg-doc-classify}
    - {tf: azurerm_cognitive_account, name: docintel-analyze, in: resource_group:rg-doc-classify}
    - {tf: azurerm_cosmosdb_account, name: cosmos-doc-metadata, in: resource_group:rg-doc-classify}
    - {tf: azurerm_cognitive_account, name: foundry-docs, in: resource_group:rg-doc-classify}
    - {tf: azurerm_cognitive_deployment, name: text-embedding-3-large, in: resource_group:rg-doc-classify}
    - {tf: azurerm_cognitive_deployment, name: gpt-4-1-agent-model, in: resource_group:rg-doc-classify}
    - {tf: azurerm_search_service, name: srch-doc-index, in: resource_group:rg-doc-classify}
    - {tf: azurerm_application_insights, name: appi-docs, in: resource_group:rg-doc-classify}
  actors: [user]
  flows:
    - {from: user, to: app-doc-upload, label: upload PDF / TIFF, step: 1}
    - {from: app-doc-upload, to: stdocfiles, label: store document file (1a)}
    - {from: app-doc-upload, to: sb-doc-commands, label: enqueue command (1b)}
    - {from: sb-doc-commands, to: func-doc-orchestrator, label: trigger orchestration, step: 2}
    - {from: func-doc-orchestrator, to: docintel-analyze, label: Analyze Document API, step: 3}
    - {from: func-doc-orchestrator, to: cosmos-doc-metadata, label: type, location, page range, step: 4}
    - {from: func-doc-orchestrator, to: text-embedding-3-large, label: chunk and embed, step: 5}
    - {from: func-doc-orchestrator, to: srch-doc-index, label: write vectors + correlation ID}
    - {from: app-doc-upload, to: foundry-docs, label: call prompt agent (AI Projects SDK), step: 6}
    - {from: foundry-docs, to: srch-doc-index, label: hybrid query via AI Search tool, step: 7}
    - {from: foundry-docs, to: gpt-4-1-agent-model, label: cited answer}
    - {from: func-doc-orchestrator, to: appi-docs, label: telemetry}

- slug: mlops-v2-azure-machine-learning
  title: MLOps v2 with Azure Machine Learning
  category: ml
  tags: [mlops, azure-machine-learning, ci-cd, model-registry, compute-cluster, online-endpoint, monitoring]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/machine-learning-operations-v2
  description: Data scientists iterate in a development workspace, and a CI/CD pipeline promotes code and trained models through a shared Azure Machine Learning registry into a production workspace where a compute cluster retrains and a managed online endpoint serves predictions. Data drift and model performance monitoring in Azure Monitor and Application Insights close the loop by triggering retraining, with Data Lake Storage, Key Vault, and Container Registry as the workspace dependencies.
  containers:
    - subscription: ml-platform
      resource_group: {name: rg-mlops-dev, location: westeurope}
    - subscription: ml-platform
      resource_group: {name: rg-mlops-prod, location: westeurope}
      vnets:
        - name: vnet-mlops-prod
          cidr: 10.30.0.0/16
          subnets:
            - {name: snet-training, cidr: 10.30.1.0/24}
            - {name: snet-privateEndpoints, cidr: 10.30.2.0/24}
  elements:
    - {tf: azurerm_machine_learning_workspace, name: mlw-dev, in: resource_group:rg-mlops-dev}
    - {tf: azurerm_machine_learning_compute_instance, name: ci-datascientist, in: resource_group:rg-mlops-dev}
    - {tf: azurerm_storage_account, name: stmlopsdev, in: resource_group:rg-mlops-dev}
    - {tf: azurerm_machine_learning_workspace, name: mlw-prod, in: resource_group:rg-mlops-prod}
    - {tf: azurerm_machine_learning_compute_cluster, name: cpu-cluster-prod, in: subnet:snet-training}
    - {tf: azurerm_machine_learning_inference_cluster, name: aks-inference-prod, in: subnet:snet-training}
    - {tf: azurerm_private_endpoint, name: pe-mlw-prod, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_storage_account, name: stmlopsdatalake, in: resource_group:rg-mlops-prod}
    - {tf: azurerm_container_registry, name: acrmlops, in: resource_group:rg-mlops-prod}
    - {tf: azurerm_key_vault, name: kv-mlops-prod, in: resource_group:rg-mlops-prod}
    - {tf: azurerm_application_insights, name: appi-mlops-prod, in: resource_group:rg-mlops-prod}
    - {tf: azurerm_log_analytics_workspace, name: law-mlops, in: resource_group:rg-mlops-prod}
  actors: [user, client, saas]
  flows:
    - {from: user, to: ci-datascientist, label: experiment (inner loop), step: 1}
    - {from: ci-datascientist, to: mlw-dev, label: track runs and register model, step: 2}
    - {from: stmlopsdev, to: ci-datascientist, label: sample data}
    - {from: saas, to: mlw-prod, label: "CI/CD: promote pipeline and model", step: 3}
    - {from: mlw-prod, to: cpu-cluster-prod, label: retraining pipeline job, step: 4}
    - {from: stmlopsdatalake, to: cpu-cluster-prod, label: training data}
    - {from: acrmlops, to: aks-inference-prod, label: scoring environment image}
    - {from: mlw-prod, to: aks-inference-prod, label: deploy registered model, step: 5}
    - {from: client, to: pe-mlw-prod, label: score request (private), step: 6}
    - {from: pe-mlw-prod, to: aks-inference-prod, label: online scoring}
    - {from: aks-inference-prod, to: appi-mlops-prod, label: inference telemetry and drift signals, step: 7}
    - {from: appi-mlops-prod, to: law-mlops, label: logs}
    - {from: mlw-prod, to: kv-mlops-prod, label: secrets}

- slug: many-models-batch-scoring
  title: Many-models training and batch scoring with Azure Machine Learning
  category: ml
  tags: [batch-scoring, many-models, parallel-run-step, compute-cluster, data-factory, data-lake, synapse]
  source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/idea/many-models-machine-learning-azure-machine-learning
  description: Azure Data Factory copies source data into Data Lake Storage, and Azure Machine Learning pipelines on a compute cluster use ParallelRunStep to train one model per data partition, register qualifying models, and batch-score every partition in parallel. Predictions are written back to the data lake and served from Synapse SQL to Power BI, while a managed online endpoint loads models on demand for real-time requests.
  containers:
    - subscription: forecasting-prod
      resource_group: {name: rg-many-models, location: northeurope}
  elements:
    - {tf: azurerm_mssql_server, name: sql-source-orders, in: resource_group:rg-many-models}
    - {tf: azurerm_data_factory, name: adf-ingest, in: resource_group:rg-many-models}
    - {tf: azurerm_storage_account, name: stmanymodelslake, in: resource_group:rg-many-models}
    - {tf: azurerm_machine_learning_workspace, name: mlw-many-models, in: resource_group:rg-many-models}
    - {tf: azurerm_machine_learning_compute_cluster, name: cpu-cluster-parallel, in: resource_group:rg-many-models}
    - {tf: azurerm_machine_learning_inference_cluster, name: aks-realtime-scoring, in: resource_group:rg-many-models}
    - {tf: azurerm_container_registry, name: acrmanymodels, in: resource_group:rg-many-models}
    - {tf: azurerm_key_vault, name: kv-many-models, in: resource_group:rg-many-models}
    - {tf: azurerm_synapse_workspace, name: syn-predictions, in: resource_group:rg-many-models}
    - {tf: azurerm_application_insights, name: appi-many-models, in: resource_group:rg-many-models}
  actors: [saas, client, users]
  flows:
    - {from: sql-source-orders, to: adf-ingest, label: copy source data, step: 1}
    - {from: adf-ingest, to: stmanymodelslake, label: land tabular dataset, step: 2}
    - {from: stmanymodelslake, to: cpu-cluster-parallel, label: partitioned datasets, step: 3}
    - {from: cpu-cluster-parallel, to: mlw-many-models, label: ParallelRunStep trains and registers models, step: 4}
    - {from: saas, to: mlw-many-models, label: "DevOps promotion: evaluate and register", step: 5}
    - {from: mlw-many-models, to: cpu-cluster-parallel, label: batch-scoring pipeline (tag lookup), step: 6}
    - {from: cpu-cluster-parallel, to: stmanymodelslake, label: write predictions (DataTransferStep), step: 7}
    - {from: stmanymodelslake, to: syn-predictions, label: load to Synapse SQL, step: 8}
    - {from: syn-predictions, to: users, label: Power BI dashboards, step: 9}
    - {from: client, to: aks-realtime-scoring, label: real-time scoring (models loaded on demand)}
    - {from: acrmanymodels, to: aks-realtime-scoring, label: scoring image}
    - {from: aks-realtime-scoring, to: appi-many-models, label: telemetry}

- slug: realtime-scoring-online-endpoint-apim
  title: Real-time scoring with managed online endpoints behind API Management
  category: ml
  tags: [online-endpoint, real-time-inference, blue-green, api-management, private-endpoint, autoscale]
  source: https://learn.microsoft.com/en-us/azure/machine-learning/concept-endpoints-online
  description: A managed online endpoint hosts blue and green deployments of a registered model with a traffic split for safe rollout and traffic mirroring, and inbound scoring calls reach it through the workspace private endpoint while the managed virtual network isolates outbound traffic. API Management fronts the endpoint to apply authentication, rate limits, and versioning for client applications, with Azure Monitor and Application Insights collecting latency, request, and container metrics.
  containers:
    - subscription: inference-prod
      resource_group: {name: rg-realtime-scoring, location: uksouth}
      vnets:
        - name: vnet-scoring
          cidr: 10.40.0.0/16
          subnets:
            - {name: snet-apim, cidr: 10.40.0.0/24, public: true}
            - {name: snet-privateEndpoints, cidr: 10.40.1.0/24}
            - {name: snet-scoring, cidr: 10.40.2.0/24}
  elements:
    - {tf: azurerm_api_management, name: apim-scoring, in: subnet:snet-apim}
    - {tf: azurerm_private_endpoint, name: pe-mlw-scoring, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_machine_learning_workspace, name: mlw-scoring, in: resource_group:rg-realtime-scoring}
    - {tf: azurerm_machine_learning_inference_cluster, name: online-endpoint-blue-green, in: subnet:snet-scoring}
    - {tf: azurerm_container_registry, name: acrscoring, in: resource_group:rg-realtime-scoring}
    - {tf: azurerm_storage_account, name: stscoringmodels, in: resource_group:rg-realtime-scoring}
    - {tf: azurerm_key_vault, name: kv-scoring, in: resource_group:rg-realtime-scoring}
    - {tf: azurerm_application_insights, name: appi-scoring, in: resource_group:rg-realtime-scoring}
    - {tf: azurerm_log_analytics_workspace, name: law-scoring, in: resource_group:rg-realtime-scoring}
  actors: [client, mobile]
  flows:
    - {from: client, to: apim-scoring, label: "POST /score (subscription key / JWT)", step: 1}
    - {from: mobile, to: apim-scoring, label: HTTPS}
    - {from: apim-scoring, to: pe-mlw-scoring, label: forward to scoring URI, step: 2}
    - {from: pe-mlw-scoring, to: online-endpoint-blue-green, label: "traffic split 90/10 blue/green", step: 3}
