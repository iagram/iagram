    - {from: pe-aoai-west, to: aoai-west-standard, label: private link}
    - {from: aoai-west-standard, to: gpt-4o-west, label: standard deployment}
    - {from: apim-genai-gateway, to: evh-gateway-logs, label: log-to-eventhub prompts and tokens, step: 5}
    - {from: apim-genai-gateway, to: appi-gateway, label: llm-emit-token-metric}
    - {from: appi-gateway, to: law-gateway, label: chargeback queries}
    - {from: apim-genai-gateway, to: kv-gateway, label: backend credentials}

- slug: content-safety-gateway-apim
  title: Content safety gateway with API Management and Azure AI Content Safety
  category: ml
  tags: [content-safety, prompt-shield, api-management, llm-content-safety, blocklist, azure-openai, guardrails]
  source: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
  description: API Management applies the llm-content-safety policy to inbound prompts and outbound completions, sending them through a managed-identity backend to Azure AI Content Safety, which scores hate, self-harm, sexual, and violence categories, matches custom blocklists, and runs prompt shields for jailbreak attempts. Requests above the configured severity thresholds are blocked with a 403 before they reach the Azure OpenAI deployment, and the same policy protects MCP tool and agent APIs managed by the gateway.
  containers:
    - subscription: ai-platform
      resource_group: {name: rg-content-safety-gw, location: swedencentral}
      vnets:
        - name: vnet-safety-gw
          cidr: 10.70.0.0/16
          subnets:
            - {name: snet-apim, cidr: 10.70.0.0/24, public: true}
            - {name: snet-privateEndpoints, cidr: 10.70.1.0/24}
  elements:
    - {tf: azurerm_api_management, name: apim-safety-gateway, in: subnet:snet-apim}
    - {tf: azurerm_cognitive_account, name: contentsafety-guardrails, in: resource_group:rg-content-safety-gw}
    - {tf: azurerm_private_endpoint, name: pe-contentsafety, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_cognitive_account, name: aoai-protected, in: resource_group:rg-content-safety-gw}
    - {tf: azurerm_cognitive_deployment, name: gpt-4o-protected, in: resource_group:rg-content-safety-gw}
    - {tf: azurerm_private_endpoint, name: pe-aoai-protected, in: subnet:snet-privateEndpoints}
    - {tf: azurerm_linux_web_app, name: app-chat-client, in: resource_group:rg-content-safety-gw}
    - {tf: azurerm_key_vault, name: kv-safety-gw, in: resource_group:rg-content-safety-gw}
    - {tf: azurerm_application_insights, name: appi-safety-gw, in: resource_group:rg-content-safety-gw}
    - {tf: azurerm_log_analytics_workspace, name: law-safety-gw, in: resource_group:rg-content-safety-gw}
  actors: [users]
  flows:
    - {from: users, to: app-chat-client, label: HTTPS, step: 1}
    - {from: app-chat-client, to: apim-safety-gateway, label: chat completion request, step: 2}
    - {from: apim-safety-gateway, to: pe-contentsafety, label: "inbound: analyze prompt + shield-prompt", step: 3}
    - {from: pe-contentsafety, to: contentsafety-guardrails, label: managed identity backend}
    - {from: apim-safety-gateway, to: pe-aoai-protected, label: forward if below thresholds, step: 4}
    - {from: pe-aoai-protected, to: aoai-protected, label: private link}
    - {from: aoai-protected, to: gpt-4o-protected, label: completion}
    - {from: apim-safety-gateway, to: pe-contentsafety, label: "outbound: analyze completion (enforce-on-completions)", step: 5}
    - {from: apim-safety-gateway, to: app-chat-client, label: "200 response or 403 blocked", step: 6}
    - {from: apim-safety-gateway, to: appi-safety-gw, label: blocked-request telemetry}
    - {from: appi-safety-gw, to: law-safety-gw, label: logs}
    - {from: apim-safety-gateway, to: kv-safety-gw, label: named values}

