    - {tf: azurerm_redis_cache, name: redis-semantic-cache, in: resource_group:rg-genai-gateway}
    - {tf: azurerm_key_vault, name: kv-gateway, in: resource_group:rg-genai-gateway}
    - {tf: azurerm_application_insights, name: appi-gateway, in: resource_group:rg-genai-gateway}
    - {tf: azurerm_log_analytics_workspace, name: law-gateway, in: resource_group:rg-genai-gateway}
