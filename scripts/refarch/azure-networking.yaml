    - {tf: azurerm_application_security_group, name: asg-web, in: resource_group:rg-segmentation}
    - {tf: azurerm_application_security_group, name: asg-logic, in: resource_group:rg-segmentation}
    - {tf: azurerm_application_security_group, name: asg-db, in: resource_group:rg-segmentation}
    - {tf: azurerm_linux_virtual_machine, name: vm-web-1, in: subnet:subnet-web}
    - {tf: azurerm_linux_virtual_machine, name: vm-web-2, in: subnet:subnet-web}
    - {tf: azurerm_linux_virtual_machine, name: vm-logic, in: subnet:subnet-web}
    - {tf: azurerm_linux_virtual_machine, name: vm-db, in: subnet:subnet-data}
    - {tf: azurerm_network_watcher, name: nw-flow-logs, in: resource_group:rg-segmentation}
