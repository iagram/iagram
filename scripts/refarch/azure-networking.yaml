  source: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  description: Virtual machine NICs are grouped into AsgWeb, AsgLogic and AsgDb application security groups, and a single network security group on both subnets allows HTTP from the internet only to AsgWeb, allows SQL from AsgLogic to AsgDb, and denies all other traffic to AsgDb ahead of the default AllowVNetInBound rule. Security policy follows the application structure without maintaining explicit IP addresses, and flow logs feed traffic analytics.
