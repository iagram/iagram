  description: The Azure VMware Solution private cloud reaches an Azure virtual network through its Microsoft-managed ExpressRoute circuit, which is attached with an authorization key to an ExpressRoute gateway using the Ultra Performance SKU with FastPath for 10 Gbps. Because ExpressRoute gateways do not transit between circuits, ExpressRoute Global Reach links the private cloud circuit to the customer's on-premises circuit so vMotion and management traffic flow directly at the Microsoft edge.
