- slug: firewall-forced-tunneling
  title: Azure Firewall forced tunneling to an on-premises edge
  category: networking
  tags: [azure firewall, forced tunneling, management nic, default route, vpn gateway, bgp, egress]
  source: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling
  description: Azure Firewall is deployed with the management network interface enabled, so its own operational traffic uses a dedicated public IP while the tenant data path carries a 0.0.0.0/0 route toward the VPN or ExpressRoute gateway, either learned over BGP or set as a user-defined route on AzureFirewallSubnet. Internet-bound traffic from spokes is inspected by the firewall and then sent to the on-premises edge firewall before it reaches the internet, and DNAT inbound is not supported in this mode.
  containers:
    - datacenter: on-premises
    - subscription: connectivity
      resource_group: {name: rg-fw-forced, location: westeurope}
      vnets:
        - name: hub-forced
          cidr: 10.0.0.0/16
          subnets:
            - {name: AzureFirewallSubnet, cidr: 10.0.0.0/26}
            - {name: AzureFirewallManagementSubnet, cidr: 10.0.1.0/26}
            - {name: GatewaySubnet, cidr: 10.0.2.0/27}
    - subscription: landing-zone
      resource_group: {name: rg-spoke-forced, location: westeurope}
      vnets:
        - name: spoke-forced
          cidr: 10.1.0.0/16
          subnets: [{name: snet-app-forced, cidr: 10.1.0.0/24}]
  elements:
    - {tf: azurerm_firewall, name: fw-forced, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_public_ip, name: pip-fw-management, in: resource_group:rg-fw-forced}
    - {tf: azurerm_firewall_policy, name: fwpol-forced, in: resource_group:rg-fw-forced}
    - {tf: azurerm_virtual_network_gateway, name: vpngw-forced, in: subnet:GatewaySubnet}
    - {tf: azurerm_local_network_gateway, name: lng-edge, in: resource_group:rg-fw-forced}
    - {tf: azurerm_log_analytics_workspace, name: law-forced, in: resource_group:rg-fw-forced}
    - {tf: azurerm_linux_virtual_machine, name: vm-app-forced, in: subnet:snet-app-forced}
  actors: [datacenter, internet]
  flows:
    - {from: vnet:hub-forced, to: vnet:spoke-forced, link: azurerm_virtual_network_peering}
    - {from: vm-app-forced, to: fw-forced, label: "UDR 0.0.0.0/0 to firewall", step: 1}
    - {from: fw-forced, to: vpngw-forced, label: "0.0.0.0/0 via BGP or UDR on AzureFirewallSubnet", step: 2}
    - {from: vpngw-forced, to: lng-edge, link: azurerm_virtual_network_gateway_connection, label: "IPsec / ExpressRoute"}
    - {from: lng-edge, to: datacenter, label: "on-prem edge firewall inspects", step: 3}
    - {from: datacenter, to: internet, label: "egress from on-premises", step: 4}
    - {from: pip-fw-management, to: fw-forced, label: "management NIC (platform traffic only)"}
    - {from: fwpol-forced, to: fw-forced, label: "policy (SNAT private range 0.0.0.0/0)"}
    - {from: fw-forced, to: law-forced, label: "firewall logs"}

- slug: route-server-nva-bgp
  title: Dynamic routing with Azure Route Server and BGP-capable NVAs
  category: networking
  tags: [route server, bgp, nva, sd-wan, dynamic routing, ecmp, hub-spoke]
  source: https://learn.microsoft.com/en-us/azure/route-server/overview
  description: Azure Route Server in the RouteServerSubnet peers over BGP with an SD-WAN appliance that advertises on-premises prefixes and with a security appliance that advertises a default route, and programs both into the effective routes of every VM in the hub and peered spokes without user-defined routes. Branch-to-branch route exchange with the ExpressRoute gateway lets the NVAs learn and advertise routes alongside the circuit, with ECMP across multiple NVA instances.
  containers:
    - datacenter: on-premises
    - subscription: connectivity
      resource_group: {name: rg-hub-routeserver, location: westeurope}
      vnets:
        - name: hub-rs
          cidr: 10.1.0.0/16
          subnets:
            - {name: RouteServerSubnet, cidr: 10.1.0.0/27}
            - {name: snet-nva-rs, cidr: 10.1.1.0/24}
            - {name: rs-GatewaySubnet, cidr: 10.1.2.0/27}
    - subscription: landing-zone
      resource_group: {name: rg-spoke-routeserver, location: westeurope}
      vnets:
        - name: spoke-rs
          cidr: 10.2.0.0/16
          subnets: [{name: snet-app-rs, cidr: 10.2.0.0/24}]
  elements:
    - {tf: azurerm_route_server, name: route-server, in: subnet:RouteServerSubnet}
    - {tf: azurerm_public_ip, name: pip-route-server, in: resource_group:rg-hub-routeserver}
    - {tf: azurerm_linux_virtual_machine, name: nva-sdwan, in: subnet:snet-nva-rs}
    - {tf: azurerm_linux_virtual_machine, name: nva-security, in: subnet:snet-nva-rs}
    - {tf: azurerm_virtual_network_gateway, name: ergw-rs, in: subnet:rs-GatewaySubnet}
    - {tf: azurerm_express_route_circuit, name: er-circuit-rs, in: resource_group:rg-hub-routeserver}
    - {tf: azurerm_log_analytics_workspace, name: law-rs, in: resource_group:rg-hub-routeserver}
    - {tf: azurerm_linux_virtual_machine, name: vm-app-rs, in: subnet:snet-app-rs}
  actors: [datacenter, internet]
  flows:
    - {from: vnet:hub-rs, to: vnet:spoke-rs, link: azurerm_virtual_network_peering, label: "peering (use remote route server)"}
    - {from: pip-route-server, to: route-server, label: "required public IP"}
    - {from: route-server, to: nva-sdwan, link: azurerm_route_server_bgp_connection, label: "eBGP peering"}
    - {from: route-server, to: nva-security, link: azurerm_route_server_bgp_connection, label: "eBGP peering"}
    - {from: datacenter, to: nva-sdwan, label: "SD-WAN tunnel", step: 1}
    - {from: nva-sdwan, to: route-server, label: "advertise 10.250.0.0/16", step: 2}
    - {from: nva-security, to: route-server, label: "advertise 0.0.0.0/0"}
    - {from: route-server, to: vm-app-rs, label: "program effective routes (ECMP)", step: 3}
    - {from: vm-app-rs, to: nva-security, label: "internet-bound via learned default", step: 4}
    - {from: nva-security, to: internet, label: "SNAT egress", step: 5}
    - {from: vm-app-rs, to: nva-sdwan, label: "on-prem prefixes via SD-WAN"}
    - {from: er-circuit-rs, to: ergw-rs, link: azurerm_virtual_network_gateway_connection, label: "ExpressRoute connection"}
    - {from: route-server, to: ergw-rs, label: "branch-to-branch route exchange"}
    - {from: nva-security, to: law-rs, label: "NVA logs"}

- slug: arc-servers-private-link
