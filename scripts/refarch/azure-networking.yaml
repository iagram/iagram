    - {from: asg-web, to: vm-web-1, label: "NIC member"}
    - {from: asg-web, to: vm-web-2, label: "NIC member"}
    - {from: asg-logic, to: vm-logic, label: "NIC member"}
    - {from: asg-db, to: vm-db, label: "NIC member"}
    - {from: internet, to: vm-web-1, label: "Allow-HTTP-Inbound-Internet to AsgWeb 80", step: 1}
    - {from: vm-web-1, to: vm-logic, label: "AllowVNetInBound default", step: 2}
    - {from: vm-logic, to: vm-db, label: "Allow-Database-BusinessLogic AsgLogic to AsgDb 1433", step: 3}
    - {from: vm-web-2, to: vm-db, label: "Deny-Database-All 1433 (denied)"}
