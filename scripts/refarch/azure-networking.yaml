- slug: cross-region-load-balancer
  title: Global tier Azure Load Balancer across regional Standard Load Balancers
  category: networking
  tags: [global load balancer, cross-region, anycast, geo-proximity, standard load balancer, multi-region, layer 4]
  source: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
  description: A global tier Standard Load Balancer deployed in a home region exposes a static anycast public IP and holds regional public Standard Load Balancers in its backend pool, routing each flow from the closest participating region over the Microsoft backbone to the nearest healthy regional deployment. Health checks every 5 seconds remove a failed region from rotation, client IP is preserved as Layer 4 pass-through, and outbound traffic uses regional outbound rules or a NAT gateway.
  containers:
    - subscription: web-global
      resource_group: {name: rg-glb-home, location: westeurope}
    - subscription: web-global
      resource_group: {name: rg-glb-westus, location: westus}
      vnets:
        - name: vnet-westus
          cidr: 10.1.0.0/16
          subnets: [{name: snet-web-westus, cidr: 10.1.0.0/24}]
    - subscription: web-global
      resource_group: {name: rg-glb-northeurope, location: northeurope}
      vnets:
        - name: vnet-northeurope
          cidr: 10.2.0.0/16
          subnets: [{name: snet-web-northeurope, cidr: 10.2.0.0/24}]
  elements:
    - {tf: azurerm_lb, name: glb-global, in: resource_group:rg-glb-home}
    - {tf: azurerm_public_ip, name: pip-global-anycast, in: resource_group:rg-glb-home}
    - {tf: azurerm_log_analytics_workspace, name: law-glb, in: resource_group:rg-glb-home}
    - {tf: azurerm_lb, name: lb-westus, in: subnet:snet-web-westus}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-westus, in: subnet:snet-web-westus}
    - {tf: azurerm_nat_gateway, name: natgw-westus, in: subnet:snet-web-westus}
    - {tf: azurerm_lb, name: lb-northeurope, in: subnet:snet-web-northeurope}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-northeurope, in: subnet:snet-web-northeurope}
  actors: [users, internet]
  flows:
    - {from: users, to: pip-global-anycast, label: "static anycast IP, enters closest participating region", step: 1}
    - {from: pip-global-anycast, to: glb-global, label: "global tier frontend"}
    - {from: glb-global, to: lb-westus, label: "geo-proximity over Microsoft backbone, probe every 5 s", step: 2}
    - {from: glb-global, to: lb-northeurope, label: "failover when a region reports unhealthy"}
    - {from: lb-westus, to: vmss-westus, label: "matching backend port, client IP preserved", step: 3}
    - {from: lb-northeurope, to: vmss-northeurope, label: "matching backend port"}
    - {from: vmss-westus, to: natgw-westus, label: "outbound (no outbound rules on global tier)"}
    - {from: natgw-westus, to: subnet:snet-web-westus, link: azurerm_subnet_nat_gateway_association}
    - {from: natgw-westus, to: internet, label: "SNAT egress"}
    - {from: glb-global, to: law-glb, label: "metrics"}
