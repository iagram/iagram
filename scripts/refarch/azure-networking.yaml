- slug: ddos-protection-hub-spoke
  title: DDoS Network Protection on a hub-spoke with Azure Firewall and Bastion
  category: networking
  tags: [ddos protection, network protection, hub-spoke, azure firewall, bastion, public ip]
  source: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-reference-architectures
  description: A DDoS protection plan is enabled on the hub virtual network so every public IP in it, including the Azure Firewall and Azure Bastion frontends, receives Layer 3 and 4 mitigation with adaptive tuning and telemetry. Spokes are peered to the hub with no direct spoke-to-spoke path, the firewall controls ingress from the internet, and Bastion provides administrative access without public IPs on the workload VMs.
  containers:
    - subscription: connectivity
      resource_group: {name: rg-ddos-hub, location: westeurope}
      vnets:
        - name: hub-ddos
          cidr: 10.0.0.0/16
          subnets:
            - {name: AzureFirewallSubnet, cidr: 10.0.0.0/26}
            - {name: AzureBastionSubnet, cidr: 10.0.1.0/26}
    - subscription: landing-zone
      resource_group: {name: rg-ddos-spokes, location: westeurope}
      vnets:
        - name: spoke-web
          cidr: 10.1.0.0/16
          subnets: [{name: snet-web, cidr: 10.1.0.0/24}]
        - name: spoke-data
          cidr: 10.2.0.0/16
          subnets: [{name: snet-data, cidr: 10.2.0.0/24}]
  elements:
    - {tf: azurerm_network_ddos_protection_plan, name: ddos-plan, in: resource_group:rg-ddos-hub}
    - {tf: azurerm_firewall, name: fw-hub, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_public_ip, name: pip-firewall, in: resource_group:rg-ddos-hub}
    - {tf: azurerm_bastion_host, name: bastion-hub, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_public_ip, name: pip-bastion, in: resource_group:rg-ddos-hub}
    - {tf: azurerm_log_analytics_workspace, name: law-ddos, in: resource_group:rg-ddos-hub}
    - {tf: azurerm_linux_virtual_machine, name: vm-web, in: subnet:snet-web}
    - {tf: azurerm_linux_virtual_machine, name: vm-data, in: subnet:snet-data}
  actors: [internet, user]
  flows:
    - {from: ddos-plan, to: vnet:hub-ddos, label: "DDoS Network Protection on hub VNet (all public IPs)"}
    - {from: vnet:hub-ddos, to: vnet:spoke-web, link: azurerm_virtual_network_peering}
    - {from: vnet:hub-ddos, to: vnet:spoke-data, link: azurerm_virtual_network_peering}
    - {from: internet, to: pip-firewall, label: "ingress (L3/L4 mitigation)", step: 1}
    - {from: pip-firewall, to: fw-hub, label: "protected frontend"}
    - {from: fw-hub, to: vm-web, label: "DNAT to web tier", step: 2}
    - {from: vm-web, to: vm-data, label: "spoke-to-spoke via firewall route", step: 3}
    - {from: user, to: pip-bastion, label: "RDP/SSH over TLS"}
    - {from: pip-bastion, to: bastion-hub, label: "protected frontend"}
    - {from: bastion-hub, to: vm-web, label: "private IP"}
    - {from: ddos-plan, to: law-ddos, label: "mitigation metrics and alerts"}

- slug: nsg-asg-segmentation
  title: Tiered segmentation with network security groups and application security groups
  category: networking
