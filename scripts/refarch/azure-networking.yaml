    - subscription: avs
      resource_group: {name: rg-avs, location: westeurope}
      vnets:
        - name: vnet-avs-hub
          cidr: 10.0.0.0/16
          subnets:
            - {name: avs-GatewaySubnet, cidr: 10.0.0.0/27}
            - {name: snet-jumpbox, cidr: 10.0.1.0/24}
            - {name: AzureBastionSubnet, cidr: 10.0.2.0/26}
  elements:
    - {tf: azurerm_vmware_private_cloud, name: avs-private-cloud, in: resource_group:rg-avs}
    - {tf: azurerm_vmware_express_route_authorization, name: avs-er-authorization, in: resource_group:rg-avs}
    - {tf: azurerm_express_route_circuit, name: er-circuit-onprem, in: resource_group:rg-avs}
    - {tf: azurerm_virtual_network_gateway, name: ergw-avs, in: subnet:avs-GatewaySubnet}
    - {tf: azurerm_windows_virtual_machine, name: vm-jumpbox, in: subnet:snet-jumpbox}
    - {tf: azurerm_bastion_host, name: bastion-avs, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_log_analytics_workspace, name: law-avs, in: resource_group:rg-avs}
  actors: [datacenter, user, internet]
  flows:
