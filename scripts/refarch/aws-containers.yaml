- slug: eks-gitops-flux-codepipeline-ecr
  title: GitOps CI/CD on EKS with CodeCommit, CodePipeline, CodeBuild and Flux
  category: devops
  tags: [eks, gitops, flux, codepipeline, codebuild, codecommit, ecr]
  source: https://aws.amazon.com/blogs/devops/ci-cd-on-amazon-eks-using-aws-codecommit-aws-codepipeline-aws-codebuild-and-fluxcd/
  description: A commit to the application repository in CodeCommit starts a CodePipeline whose CodeBuild stage builds the container image, tags it with the commit hash and pushes it to ECR. Flux running on the EKS node group watches a separate Kubernetes manifest repository and the ECR registry; when a new tag appears it updates the manifest and reconciles the cluster so the desired state always lives in Git.
  containers:
    - region: eu-west-1
      groups: [{label: codecommit, at: [1, 1, 2, 1]}]
      vpcs:
        - name: eks
          cidr: 10.0.0.0/16
          at: [2, 3, 1, 2]
  elements:
    - {tf: aws_codecommit_repository, name: app-repo, in: group:codecommit, at: [1, 1]}
    - {tf: aws_codecommit_repository, name: k8s-manifests-repo, in: group:codecommit, at: [2, 1]}
    - {tf: aws_codepipeline, name: build-pipeline, in: region, at: [1, 2]}
    - {tf: aws_codebuild_project, name: image-build, in: region, at: [1, 3]}
    - {tf: aws_ecr_repository, name: app-image, in: region, at: [1, 4]}
    - {tf: aws_eks_cluster, name: gitops-cluster, in: vpc:eks, at: [1, 1]}
    - {tf: aws_eks_node_group, name: app-nodes, in: vpc:eks, at: [1, 1]}
  actors: [{type: users, name: users, at: [1, 1]}]
  flows:
    - {from: users, to: app-repo, label: git push application code, step: 1}
    - {from: users, to: k8s-manifests-repo, label: git push manifests, step: 1}
    - {from: app-repo, to: build-pipeline, label: trigger, step: 2}
    - {from: build-pipeline, to: image-build, label: build stage, step: 3}
    - {from: image-build, to: app-image, label: "docker push :<commit-sha>", step: 4}
    - {from: app-nodes, to: app-image, label: Flux image automation scans tags, step: 5}
    - {from: k8s-manifests-repo, to: app-nodes, label: Flux reconciles manifests, step: 6}
    - {from: app-image, to: app-nodes, label: pull image for new pods, step: 7}

- slug: ecr-multi-account-image-pipeline
  title: Central ECR image pipeline with scanning and cross-account replication
  category: devops
  tags: [ecr, codebuild, image scanning, inspector, replication, pull-through cache, multi-account]
  source: https://aws.amazon.com/blogs/containers/amazon-ecr-in-multi-account-and-multi-region-architectures/
  description: The development account's ECR registry caches upstream images from ECR Public and Quay in a pull-through cache repository, and a CodePipeline whose CodeBuild stage builds application images pushes them to a development repository where Amazon Inspector scans them on push and reports findings to Security Hub. Clean images are promoted to a production repository in the same registry; CodeDeploy rolls them out to the development ECS cluster and to the ECS cluster in the production account, which pulls the images through a VPC endpoint rather than over the internet.
  containers:
    - account: development
      region: eu-west-1
      groups: [{label: ecr-registry, at: [1, 1, 1, 2]}, {label: codepipeline, at: [2, 2]}]
    - account: production
      region: eu-west-1
      at: [1, 1]
  elements:
    - {tf: aws_ecr_repository, name: pull-through-cache-repo, in: group:ecr-registry, at: [1, 1]}
    - {tf: aws_ecr_repository, name: development-repo, in: group:ecr-registry, at: [1, 2]}
    - {tf: aws_ecr_repository, name: production-repo, in: group:ecr-registry, at: [1, 3]}
    - {tf: aws_inspector2_enabler, name: inspector-scanning, in: region, at: [1, 3]}
    - {tf: aws_securityhub_account, name: security-hub, in: region, at: [2, 1]}
    - {tf: aws_codepipeline, name: image-pipeline, in: group:codepipeline, at: [2, 1]}
    - {tf: aws_codebuild_project, name: image-build, in: group:codepipeline, at: [1, 1]}
    - {tf: aws_codedeploy_app, name: ecs-deploy, in: group:codepipeline, at: [1, 2]}
    - {tf: aws_ecs_cluster, name: dev-cluster, in: region, at: [3, 2]}
    - {tf: aws_vpc_endpoint, name: ecr-endpoint, in: account:production, at: [1, 1]}
    - {tf: aws_ecs_cluster, name: prod-cluster, in: account:production, at: [1, 2]}
  actors: [{type: saas, name: ecr-public, at: [1, 1]}, {type: saas, name: quay-io, at: [2, 1]}]
  flows:
    - {from: ecr-public, to: pull-through-cache-repo, label: pull-through cache, step: 1}
    - {from: quay-io, to: pull-through-cache-repo, label: pull-through cache, step: 1}
    - {from: pull-through-cache-repo, to: image-build, label: vetted base image, step: 2}
    - {from: image-build, to: development-repo, label: "docker push, scan on push", step: 3}
    - {from: inspector-scanning, to: development-repo, label: image scanning}
    - {from: inspector-scanning, to: security-hub, label: Inspector scan findings}
    - {from: pull-through-cache-repo, to: development-repo, label: base image}
    - {from: development-repo, to: production-repo, label: promote clean image, step: 4}
    - {from: production-repo, to: ecs-deploy, label: release image, step: 5}
    - {from: ecs-deploy, to: dev-cluster, label: deploy to development, step: 6}
    - {from: ecs-deploy, to: prod-cluster, label: deploy to production, step: 7}
    - {from: prod-cluster, to: ecr-endpoint, label: image pull, step: 8}
    - {from: ecr-endpoint, to: production-repo, label: PrivateLink cross-account pull}

- slug: apprunner-web-service-vpc-connector
  title: App Runner web service reaching a private RDS database through a VPC connector
  category: containers
  tags: [app runner, vpc connector, rds, secrets manager, ecr, serverless containers]
  source: https://aws.amazon.com/blogs/containers/deploy-and-scale-django-applications-on-aws-app-runner/
  description: App Runner deploys the web application from a GitHub repository and runs it in an AWS-managed VPC, terminating TLS, load balancing and scaling instances on concurrent requests. A VPC connector attaches the service to the customer VPC through AWS PrivateLink (Hyperplane ENIs in the private subnet) so outbound calls reach an RDS for PostgreSQL instance that has no public endpoint, and the database credentials are injected from Secrets Manager.
