- slug: eks-karpenter-nodepool-autoscaling
  title: Just-in-time node provisioning on EKS with Karpenter
  category: containers
  tags: [eks, karpenter, autoscaling, nodepool, spot, interruption handling]
  source: https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html
  description: Karpenter runs on a small managed node group (or Fargate) and watches for unschedulable pods, then calls the EC2 Fleet API directly to launch right-sized instances from a diverse set of types defined in a NodePool, without Auto Scaling groups. An EventBridge rule forwards Spot interruption and instance health events to an SQS queue that Karpenter drains so it can cordon and replace nodes ahead of termination, and consolidation removes under-used nodes.
  containers:
    - region: us-west-2
      vpcs:
        - name: eks
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.0.16.0/20, az: a, public: false}
            - {name: private-b, cidr: 10.0.32.0/20, az: b, public: false}
            - {name: private-c, cidr: 10.0.48.0/20, az: c, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:eks}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_eks_cluster, name: karpenter-cluster, in: vpc:eks}
    - {tf: aws_eks_node_group, name: karpenter-controller-nodes, in: subnet:private-a}
    - {tf: aws_iam_role, name: karpenter-controller-role, in: region}
    - {tf: aws_iam_role, name: karpenter-node-role, in: region}
    - {tf: aws_sqs_queue, name: interruption-queue, in: region}
    - {tf: aws_cloudwatch_event_rule, name: spot-interruption-rule, in: region}
    - {tf: aws_instance, name: karpenter-node-b, in: subnet:private-b}
