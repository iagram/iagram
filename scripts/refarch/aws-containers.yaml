- slug: ecs-ec2-capacity-provider-alb
  title: ECS on EC2 with an Auto Scaling group capacity provider behind an ALB
  category: containers
  tags: [ecs, ec2 launch type, capacity provider, cluster auto scaling, alb]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/asg-capacity-providers.html
  description: An ECS cluster registers container instances from an Auto Scaling group that is wrapped in a capacity provider with managed scaling, so ECS publishes a CapacityProviderReservation metric and a target-tracking policy grows or shrinks the group as tasks are placed. An internet-facing ALB in the public subnets forwards to a target group of instance targets in private subnets, and a NAT gateway gives the instances outbound access for image pulls and agent traffic.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: web-alb, in: vpc:main}
    - {tf: aws_lb_target_group, name: web-tg, in: vpc:main}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: ec2-cluster, in: vpc:main}
    - {tf: aws_ecs_capacity_provider, name: asg-capacity-provider, in: region}
    - {tf: aws_autoscaling_group, name: container-instances-asg, in: vpc:main}
    - {tf: aws_launch_template, name: ecs-optimized-lt, in: region}
    - {tf: aws_ecs_service, name: web-service, in: subnet:private-a}
    - {tf: aws_ecr_repository, name: web-image, in: region}
    - {tf: aws_cloudwatch_log_group, name: web-logs, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: web-alb, step: 2}
    - {from: web-alb, to: web-tg, label: listener forward, step: 3}
    - {from: web-tg, to: web-service, label: HTTP to bridge-mode host ports, step: 4}
    - {from: web-service, to: ec2-cluster, label: tasks placed on container instances}
    - {from: ec2-cluster, to: asg-capacity-provider, label: CapacityProviderReservation metric}
    - {from: asg-capacity-provider, to: container-instances-asg, label: managed scaling target tracking}
    - {from: ecs-optimized-lt, to: container-instances-asg, label: ECS-optimized AMI + agent config}
    - {from: web-image, to: web-service, label: image pull}
    - {from: container-instances-asg, to: nat-a, label: outbound (ECR, ECS agent)}
    - {from: web-service, to: web-logs, label: awslogs driver}

- slug: ecs-cloud-map-service-discovery
  title: ECS service discovery with an AWS Cloud Map private DNS namespace
  category: containers
  tags: [ecs, cloud map, service discovery, private dns, route 53, fargate]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-discovery.html
  description: Each ECS service registers its task IP addresses as instances of an AWS Cloud Map service inside a private DNS namespace, which is backed by a Route 53 private hosted zone that only the VPC can resolve. The frontend calls backend.internal by name; ECS keeps the A and SRV records current as tasks start, stop or fail health checks, so no internal load balancer is needed.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: frontend-alb, in: vpc:main}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: app-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: frontend-service, in: subnet:private-a}
    - {tf: aws_ecs_service, name: backend-service, in: subnet:private-b}
    - {tf: aws_service_discovery_private_dns_namespace, name: internal-namespace, in: vpc:main}
    - {tf: aws_service_discovery_service, name: backend-discovery, in: region}
    - {tf: aws_route53_zone, name: internal-zone, in: vpc:main}
    - {tf: aws_ecr_repository, name: frontend-image, in: region}
    - {tf: aws_ecr_repository, name: backend-image, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: frontend-alb, step: 2}
    - {from: frontend-alb, to: frontend-service, label: HTTP :3000, step: 3}
    - {from: frontend-service, to: internal-zone, label: resolve backend.internal, step: 4}
    - {from: frontend-service, to: backend-service, label: HTTP :8080 to task IPs, step: 5}
    - {from: backend-service, to: backend-discovery, label: register / deregister task IPs}
    - {from: backend-discovery, to: internal-namespace, label: service in namespace}
    - {from: internal-namespace, to: internal-zone, label: creates private hosted zone}
    - {from: frontend-image, to: frontend-service, label: image pull}
    - {from: backend-image, to: backend-service, label: image pull}
    - {from: backend-service, to: nat-a, label: outbound}

- slug: ecs-service-connect-microservices
  title: Microservices on ECS Fargate connected with ECS Service Connect
  category: containers
  tags: [ecs, service connect, cloud map, envoy, fargate, microservices]
  source: https://aws.amazon.com/blogs/aws/new-amazon-ecs-service-connect-enabling-easy-communication-between-microservices/
  description: ECS Service Connect adds an ECS-managed Envoy proxy container to every task and registers each service under a logical name in a Cloud Map HTTP namespace, so the checkout service reaches orders and catalog by short name with client-side load balancing, retries and outlier detection. Only the UI service is exposed through an ALB; all other traffic stays service to service, and Service Connect publishes per-service request, error and latency metrics to CloudWatch.
  containers:
    - region: us-east-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: ui-alb, in: vpc:main}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: shop-cluster, in: vpc:main}
    - {tf: aws_service_discovery_http_namespace, name: shop-namespace, in: region}
    - {tf: aws_ecs_service, name: ui-service, in: subnet:private-a}
    - {tf: aws_ecs_service, name: checkout-service, in: subnet:private-a}
    - {tf: aws_ecs_service, name: orders-service, in: subnet:private-b}
    - {tf: aws_ecs_service, name: catalog-service, in: subnet:private-b}
    - {tf: aws_dynamodb_table, name: orders-table, in: region}
    - {tf: aws_cloudwatch_log_group, name: service-connect-logs, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: ui-alb, step: 2}
    - {from: ui-alb, to: ui-service, label: HTTP :80, step: 3}
    - {from: ui-service, to: checkout-service, label: "http://checkout via Envoy proxy", step: 4}
    - {from: checkout-service, to: orders-service, label: "http://orders", step: 5}
    - {from: checkout-service, to: catalog-service, label: "http://catalog", step: 5}
    - {from: orders-service, to: orders-table, label: PutItem, step: 6}
    - {from: shop-cluster, to: shop-namespace, label: default Service Connect namespace}
    - {from: orders-service, to: shop-namespace, label: registers logical name orders}
    - {from: catalog-service, to: shop-namespace, label: registers logical name catalog}
    - {from: checkout-service, to: service-connect-logs, label: proxy access logs + metrics}
    - {from: catalog-service, to: nat-a, label: outbound}

- slug: ecs-app-mesh-envoy-sidecars
  title: Service mesh on ECS with AWS App Mesh and Envoy sidecars
  category: containers
  tags: [app mesh, envoy, service mesh, ecs, cloud map, x-ray]
  source: https://aws.amazon.com/blogs/architecture/deploying-service-mesh-based-architectures-using-aws-app-mesh-and-amazon-ecs/
  description: An App Mesh mesh models each ECS service as a virtual node discovered through Cloud Map, and a virtual router with weighted routes fronts the backend as a virtual service that the frontend addresses by name. Every task runs an Envoy sidecar that App Mesh configures, so all service-to-service traffic is intercepted, routed and exported as metrics, logs and traces to CloudWatch and X-Ray without code changes.
  containers:
    - region: us-west-2
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: edge-alb, in: vpc:main}
    - {tf: aws_ecs_cluster, name: mesh-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: frontend-service, in: subnet:private-a}
    - {tf: aws_ecs_service, name: backend-v1-service, in: subnet:private-b}
    - {tf: aws_ecs_service, name: backend-v2-service, in: subnet:private-b}
    - {tf: aws_service_discovery_private_dns_namespace, name: mesh-namespace, in: vpc:main}
    - {tf: aws_appmesh_mesh, name: app-mesh, in: region}
    - {tf: aws_appmesh_virtual_node, name: backend-v1-node, in: region}
    - {tf: aws_appmesh_virtual_node, name: backend-v2-node, in: region}
    - {tf: aws_appmesh_virtual_router, name: backend-router, in: region}
    - {tf: aws_appmesh_virtual_service, name: backend-virtual-service, in: region}
    - {tf: aws_cloudwatch_log_group, name: envoy-logs, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: edge-alb, step: 2}
    - {from: edge-alb, to: frontend-service, label: HTTP :8080, step: 3}
    - {from: frontend-service, to: backend-virtual-service, label: "backend.mesh.local via Envoy", step: 4}
    - {from: backend-virtual-service, to: backend-router, label: provider, step: 5}
    - {from: backend-router, to: backend-v1-node, label: route weight 90, step: 6}
    - {from: backend-router, to: backend-v2-node, label: route weight 10, step: 6}
    - {from: backend-v1-node, to: backend-v1-service, label: Cloud Map service discovery}
    - {from: backend-v2-node, to: backend-v2-service, label: Cloud Map service discovery}
    - {from: backend-v1-service, to: mesh-namespace, label: registers tasks}
    - {from: app-mesh, to: backend-router, label: mesh owns router and nodes}
    - {from: frontend-service, to: envoy-logs, label: Envoy access logs, X-Ray segments}

- slug: ecs-bluegreen-codedeploy-pipeline
  title: Blue/green ECS deployments with CodeDeploy and CodePipeline
  category: devops
  tags: [ecs, codedeploy, blue/green, canary, codepipeline, alb, ecr]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-bluegreen.html
  description: An ECS service with the CODE_DEPLOY controller sits behind an ALB that has two target groups and a production plus a test listener; CodeDeploy creates a replacement task set in the green target group, exposes it on the test listener, then shifts production traffic all at once, linearly or by canary. A CodePipeline triggered by a new ECR image pushes the task definition and appspec to CodeDeploy, and a failed CloudWatch alarm rolls traffic back to the blue task set.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: app-alb, in: vpc:main}
    - {tf: aws_lb_target_group, name: blue-tg, in: vpc:main}
    - {tf: aws_lb_target_group, name: green-tg, in: vpc:main}
    - {tf: aws_ecs_cluster, name: app-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: app-service, in: subnet:private-a}
    - {tf: aws_codedeploy_app, name: ecs-deploy-app, in: region}
    - {tf: aws_codedeploy_deployment_group, name: app-deployment-group, in: region}
    - {tf: aws_codepipeline, name: release-pipeline, in: region}
    - {tf: aws_ecr_repository, name: app-image, in: region}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: green-5xx-alarm, in: region}
  actors: [users, user]
  flows:
    - {from: user, to: app-image, label: docker push new tag, step: 1}
    - {from: app-image, to: release-pipeline, label: ECR source action, step: 2}
    - {from: release-pipeline, to: pipeline-artifacts, label: taskdef.json + appspec.yaml}
    - {from: release-pipeline, to: ecs-deploy-app, label: ECS blue/green deploy action, step: 3}
    - {from: ecs-deploy-app, to: app-deployment-group, step: 4}
    - {from: app-deployment-group, to: app-service, label: create replacement (green) task set, step: 5}
    - {from: app-deployment-group, to: app-alb, label: "test listener :8080 to green, then shift production listener", step: 6}
    - {from: users, to: igw, label: HTTPS, step: 7}
    - {from: igw, to: app-alb, step: 8}
    - {from: app-alb, to: blue-tg, label: production listener (before cutover)}
    - {from: app-alb, to: green-tg, label: production listener (after cutover)}
    - {from: blue-tg, to: app-service, label: original task set}
    - {from: green-tg, to: app-service, label: replacement task set}
    - {from: green-5xx-alarm, to: app-deployment-group, label: alarm triggers rollback}

- slug: batch-fargate-s3-file-processing
  title: Serverless batch file processing with AWS Batch on Fargate
  category: containers
  tags: [aws batch, fargate, job queue, s3 event, lambda, dynamodb]
  source: https://aws.amazon.com/blogs/developer/aws-batch-application-orchestration-using-aws-fargate/
  description: An object uploaded to S3 triggers a Lambda function that submits a job to an AWS Batch job queue mapped to a Fargate compute environment, so no EC2 instances are managed and capacity scales up to the configured maximum vCPUs. The job definition points at a container image in ECR; the task reads the file from S3, writes parsed rows to DynamoDB and streams its output to CloudWatch Logs.
  containers:
    - region: us-east-1
      vpcs:
        - name: batch
          cidr: 10.20.0.0/16
          subnets:
            - {name: public-a, cidr: 10.20.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.20.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.20.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_s3_bucket, name: input-bucket, in: region}
    - {tf: aws_lambda_function, name: submit-job-fn, in: region}
    - {tf: aws_batch_job_queue, name: fargate-queue, in: region}
    - {tf: aws_batch_compute_environment, name: fargate-ce, in: subnet:private-a}
    - {tf: aws_batch_job_definition, name: csv-processor-jobdef, in: region}
    - {tf: aws_ecr_repository, name: csv-processor-image, in: region}
    - {tf: aws_dynamodb_table, name: records-table, in: region}
    - {tf: aws_iam_role, name: batch-job-role, in: region}
    - {tf: aws_cloudwatch_log_group, name: batch-job-logs, in: region}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_internet_gateway, name: igw, in: vpc:batch}
  actors: [user]
  flows:
    - {from: user, to: input-bucket, label: upload CSV, step: 1}
    - {from: input-bucket, to: submit-job-fn, link: aws_s3_bucket_notification, label: "s3:ObjectCreated", step: 2}
    - {from: submit-job-fn, to: fargate-queue, label: SubmitJob, step: 3}
    - {from: fargate-queue, to: fargate-ce, label: scheduler places job (FARGATE / FARGATE_SPOT), step: 4}
    - {from: csv-processor-jobdef, to: fargate-ce, label: container spec, vCPU and memory}
    - {from: csv-processor-image, to: fargate-ce, label: image pull, step: 5}
    - {from: fargate-ce, to: input-bucket, label: GetObject, step: 6}
    - {from: fargate-ce, to: records-table, label: BatchWriteItem, step: 7}
    - {from: fargate-ce, to: batch-job-logs, label: awslogs}
    - {from: batch-job-role, to: fargate-ce, label: task role}
    - {from: fargate-ce, to: nat-a, label: outbound to AWS APIs}
    - {from: nat-a, to: igw}

- slug: eks-baseline-managed-nodes-fargate
