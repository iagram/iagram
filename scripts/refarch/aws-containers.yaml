- slug: apigw-vpc-link-ecs-private-integration
  title: HTTP API with a VPC Link private integration to ECS services
  category: containers
  tags: [api gateway, http api, vpc link, ecs, fargate, cloud map, alb]
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-private-integration.html
  description: An API Gateway HTTP API terminates client requests and forwards them through a VPC Link into private subnets, either to an internal ALB in front of ECS services or directly to task IPs registered in a Cloud Map service. The ECS tasks never receive internet traffic, and API Gateway supplies authorization, throttling and routing while a single VPC link fans out to many backend routes.
  containers:
    - region: us-east-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_apigatewayv2_api, name: shop-http-api, in: region}
    - {tf: aws_apigatewayv2_vpc_link, name: private-vpc-link, in: subnet:private-a}
    - {tf: aws_lb, name: internal-alb, in: vpc:main}
    - {tf: aws_lb_target_group, name: orders-tg, in: vpc:main}
    - {tf: aws_ecs_cluster, name: api-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: orders-service, in: subnet:private-a}
    - {tf: aws_ecs_service, name: inventory-service, in: subnet:private-b}
    - {tf: aws_service_discovery_private_dns_namespace, name: api-namespace, in: vpc:main}
    - {tf: aws_service_discovery_service, name: inventory-discovery, in: region}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_rds_cluster, name: orders-aurora, in: subnet:private-b}
  actors: [client]
  flows:
    - {from: client, to: shop-http-api, label: HTTPS /orders, /inventory, step: 1}
    - {from: shop-http-api, to: private-vpc-link, label: private integration, step: 2}
    - {from: private-vpc-link, to: internal-alb, label: "route /orders -> ALB listener", step: 3}
    - {from: internal-alb, to: orders-tg, step: 4}
    - {from: orders-tg, to: orders-service, label: HTTP :8080, step: 5}
    - {from: private-vpc-link, to: inventory-discovery, label: "route /inventory -> Cloud Map DiscoverInstances", step: 3}
    - {from: inventory-discovery, to: inventory-service, label: healthy task IPs (SRV), step: 5}
    - {from: inventory-service, to: api-namespace, label: registers tasks}
    - {from: orders-service, to: orders-aurora, label: SQL, step: 6}
    - {from: orders-service, to: nat-a, label: outbound}

- slug: event-driven-microservices-eventbridge-sqs-ecs
  title: Event-driven microservices with EventBridge, SQS and ECS Fargate consumers
  category: containers
  tags: [eventbridge, sqs, ecs, fargate, event-driven, queue processing, autoscaling]
  source: https://aws.amazon.com/blogs/compute/extending-a-serverless-event-driven-architecture-to-existing-container-workloads/
  description: Producers publish domain events to a custom EventBridge event bus; rules match on detail-type and deliver matching events to per-consumer SQS queues so each containerized service polls its own queue at its own pace. The settlement service on ECS Fargate scales on queue depth, persists results to DynamoDB and emits a follow-up event back to the bus, while a dead-letter queue captures messages that repeatedly fail.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_cloudwatch_event_bus, name: payments-bus, in: region}
    - {tf: aws_cloudwatch_event_rule, name: fraud-not-detected-rule, in: region}
    - {tf: aws_cloudwatch_event_rule, name: settlement-finalized-rule, in: region}
    - {tf: aws_sqs_queue, name: settlement-queue, in: region}
    - {tf: aws_sqs_queue, name: settlement-dlq, in: region}
    - {tf: aws_lambda_function, name: fraud-detection-fn, in: region}
    - {tf: aws_lambda_function, name: notification-fn, in: region}
    - {tf: aws_ecs_cluster, name: payments-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: settlement-service, in: subnet:private-a}
    - {tf: aws_dynamodb_table, name: settlements-table, in: region}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecr_repository, name: settlement-image, in: region}
  actors: [client]
  flows:
    - {from: client, to: fraud-detection-fn, label: payment request, step: 1}
    - {from: fraud-detection-fn, to: payments-bus, label: PutEvents Fraud.Not.Detected, step: 2}
    - {from: payments-bus, to: fraud-not-detected-rule, label: rule match on detail-type, step: 3}
    - {from: fraud-not-detected-rule, to: settlement-queue, link: aws_cloudwatch_event_target, step: 4}
    - {from: settlement-service, to: settlement-queue, label: long poll ReceiveMessage, step: 5}
    - {from: settlement-queue, to: settlement-dlq, label: redrive after maxReceiveCount}
    - {from: settlement-service, to: settlements-table, label: PutItem, step: 6}
    - {from: settlement-service, to: payments-bus, label: PutEvents Settlement.Finalized, step: 7}
    - {from: payments-bus, to: settlement-finalized-rule, step: 8}
    - {from: settlement-finalized-rule, to: notification-fn, link: aws_cloudwatch_event_target, step: 9}
    - {from: settlement-image, to: settlement-service, label: image pull}
    - {from: settlement-service, to: nat-a, label: outbound to SQS, DynamoDB, EventBridge}

- slug: container-insights-ecs-eks-observability
  title: Container observability with CloudWatch Container Insights on ECS and EKS
  category: observability
  tags: [cloudwatch, container insights, enhanced observability, fluent bit, cloudwatch agent, ecs, eks]
  source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
  description: Container Insights with enhanced observability collects CPU, memory, disk and network metrics down to the container level from an ECS cluster (via the ECS agent) and from an EKS cluster (via the Amazon CloudWatch Observability add-on, which installs the CloudWatch agent and Fluent Bit). Metrics land in the ContainerInsights namespace, container logs and performance log events go to CloudWatch Logs, and curated dashboards plus alarms that notify an SNS topic give operators cluster-to-container drill-down.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_ecs_cluster, name: web-ecs-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: web-service, in: subnet:private-a}
    - {tf: aws_eks_cluster, name: api-eks-cluster, in: vpc:main}
    - {tf: aws_eks_node_group, name: api-nodes, in: subnet:private-b}
    - {tf: aws_eks_addon, name: cloudwatch-observability-addon, in: region}
    - {tf: aws_cloudwatch_log_group, name: ecs-performance-logs, in: region}
    - {tf: aws_cloudwatch_log_group, name: eks-application-logs, in: region}
    - {tf: aws_cloudwatch_dashboard, name: container-insights-dashboard, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: pod-restart-alarm, in: region}
    - {tf: aws_sns_topic, name: ops-alerts, in: region}
    - {tf: aws_iam_role, name: cloudwatch-agent-role, in: region}
  actors: [user]
  flows:
    - {from: web-ecs-cluster, to: ecs-performance-logs, label: ECS agent performance log events (containerInsights enhanced), step: 1}
    - {from: web-service, to: web-ecs-cluster, label: task and container metrics}
    - {from: cloudwatch-observability-addon, to: api-eks-cluster, label: installs CloudWatch agent + Fluent Bit, step: 1}
    - {from: api-nodes, to: eks-application-logs, label: Fluent Bit container logs, step: 2}
    - {from: api-nodes, to: ecs-performance-logs, label: CloudWatch agent node/pod/container metrics, step: 2}
    - {from: cloudwatch-agent-role, to: api-nodes, label: IRSA / node role for PutLogEvents}
    - {from: ecs-performance-logs, to: container-insights-dashboard, label: metrics extracted to ContainerInsights namespace, step: 3}
    - {from: eks-application-logs, to: container-insights-dashboard, label: Logs Insights queries}
    - {from: pod-restart-alarm, to: ops-alerts, label: ALARM notification, step: 4}
    - {from: user, to: container-insights-dashboard, label: cluster to container drill-down, step: 5}

- slug: eks-managed-prometheus-grafana
  title: Monitoring EKS workloads with Amazon Managed Service for Prometheus and Amazon Managed Grafana
  category: observability
  tags: [eks, amazon managed prometheus, amazon managed grafana, adot, opentelemetry, alerting]
  source: https://docs.aws.amazon.com/solutions/monitoring-amazon-eks-workloads-using-amazon-managed-services-for-prometheus-and-grafana/
  description: An AWS Distro for OpenTelemetry collector deployed in the EKS cluster scrapes pod, node and application metrics and remote-writes them to an Amazon Managed Service for Prometheus workspace, where recording and alerting rules evaluate them and alert manager forwards firing alerts to SNS. An Amazon Managed Grafana workspace queries the Prometheus workspace as a data source, users authenticate through IAM Identity Center, and dashboards are provisioned by the AWS Observability Accelerator.
  containers:
