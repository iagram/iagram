- slug: ecr-multi-account-image-pipeline
  title: Central ECR image pipeline with scanning and cross-account replication
  category: devops
  tags: [ecr, codebuild, image scanning, inspector, replication, pull-through cache, multi-account]
  source: https://aws.amazon.com/blogs/containers/amazon-ecr-in-multi-account-and-multi-region-architectures/
  description: A platform account caches upstream public images through an ECR pull-through cache and a tooling account builds application images with CodeBuild, scanning them with Amazon Inspector on push and promoting clean images while quarantining ones with critical CVEs. ECR replication copies promoted images to the production account and to a second Region for disaster recovery, and workload clusters pull from their local registry through VPC endpoints rather than across accounts.
  containers:
