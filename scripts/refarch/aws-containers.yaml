- slug: lambda-container-image-http-api
  title: Lambda functions packaged as container images behind an HTTP API
  category: containers
  tags: [lambda, container image, ecr, api gateway, codebuild, serverless]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/deploy-lambda-functions-with-container-images.html
  description: A developer pushes a Dockerfile and handler to a Git repository; CodeBuild builds an image from a Lambda base image and pushes it to an ECR registry, and the Lambda function is created from that image URI (up to 10 GB) so Lambda pulls and caches it in its execution environment. The user invokes the function directly or through an API Gateway HTTP API, keeping Docker-based tooling while running serverless.
  containers:
    - region: eu-west-1
      account_at: [1, 2]
  elements:
    - {tf: aws_codecommit_repository, name: git-repository, in: region, at: [1, 1]}
    - {tf: aws_codebuild_project, name: image-build, in: region, at: [1, 2]}
    - {tf: aws_ecr_repository, name: ecr-registry, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: container-image-fn, in: region, at: [2, 1]}
    - {tf: aws_apigatewayv2_api, name: http-api, in: region, at: [2, 2]}
  actors:
    - {type: user, name: user, at: [1, 1]}
  flows:
    - {from: user, to: git-repository, label: git push Dockerfile + handler, step: 1}
    - {from: git-repository, to: image-build, label: build trigger, step: 2}
    - {from: image-build, to: ecr-registry, label: docker push, step: 3}
    - {from: user, to: container-image-fn, label: invoke function, step: 4}
    - {from: ecr-registry, to: container-image-fn, label: ImageUri deployment package}
    - {from: http-api, to: container-image-fn, label: Lambda proxy integration}

- slug: apigw-vpc-link-ecs-private-integration
  title: HTTP API with a VPC Link private integration to ECS services
  category: containers
  tags: [api gateway, http api, vpc link, ecs, fargate, cloud map, alb]
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-private-integration.html
  description: An API Gateway HTTP API terminates client requests and forwards them through a VPC Link into the VPC, where an internal Application Load Balancer fronts an ECS Fargate service. The tasks never receive internet traffic, and API Gateway supplies authorization, throttling and routing while a single VPC link can fan out to many backend routes.
  containers:
    - region: us-east-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          at: [1, 2]
  elements:
    - {tf: aws_apigatewayv2_api, name: shop-http-api, in: region, at: [1, 1]}
    - {tf: aws_apigatewayv2_vpc_link, name: private-vpc-link, in: vpc:main, at: [1, 1]}
    - {tf: aws_lb, name: internal-alb, in: vpc:main, at: [1, 2]}
    - {tf: aws_ecs_cluster, name: api-cluster, in: vpc:main, at: [1, 3]}
    - {tf: aws_ecs_service, name: fargate-service, in: vpc:main, at: [1, 1]}
  actors: [{type: client, name: clients, at: [1, 1]}]
  flows:
    - {from: clients, to: shop-http-api, label: HTTPS, step: 1}
    - {from: shop-http-api, to: private-vpc-link, label: private integration, step: 2}
    - {from: private-vpc-link, to: internal-alb, label: "route -> ALB listener", step: 3}
    - {from: internal-alb, to: fargate-service, label: "HTTP :8080", step: 4}

- slug: event-driven-microservices-eventbridge-sqs-ecs
  title: Event-driven microservices with EventBridge, SQS and ECS Fargate consumers
  category: containers
  tags: [eventbridge, sqs, ecs, fargate, event-driven, queue processing, autoscaling]
  source: https://aws.amazon.com/blogs/compute/extending-a-serverless-event-driven-architecture-to-existing-container-workloads/
  description: Users call API Gateway endpoints (signup, FNOL, claims, customer) that publish domain events to a custom EventBridge event bus acting as the event broker; rules match on detail-type and deliver the events to the customer service on Step Functions, the claims and fraud services on Lambda and a documents service built on S3 and Step Functions. The settlement service, an existing container workload on ECS Fargate, consumes its events through an SQS queue so it polls at its own pace, every service emits follow-up events back to the bus, and a notification rule triggers the Lambda notification service that answers the users.
  containers:
    - region: eu-west-1
      account_at: [1, 2]
      groups:
        - {label: documents-service, at: [1, 1, 1, 5]}
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          at: [5, 5]
  elements:
    - {tf: aws_s3_bucket, name: documents-bucket, in: group:documents-service, at: [1, 1]}
    - {tf: aws_sfn_state_machine, name: documents-workflow, in: group:documents-service, at: [1, 2]}
    - {tf: aws_apigatewayv2_api, name: signup-api, in: region, at: [2, 1]}
    - {tf: aws_apigatewayv2_api, name: fnol-api, in: region, at: [3, 1]}
    - {tf: aws_apigatewayv2_api, name: claims-api, in: region, at: [4, 1]}
    - {tf: aws_apigatewayv2_api, name: customer-api, in: region, at: [5, 1]}
    - {tf: aws_cloudwatch_event_bus, name: event-broker, in: region, at: [2, 2, 5, 1]}
    - {tf: aws_cloudwatch_event_rule, name: customer-rule, in: region, at: [2, 3]}
    - {tf: aws_cloudwatch_event_rule, name: claims-rule, in: region, at: [3, 3]}
    - {tf: aws_cloudwatch_event_rule, name: fraud-rule, in: region, at: [4, 3]}
    - {tf: aws_cloudwatch_event_rule, name: settlement-rule, in: region, at: [5, 3]}
    - {tf: aws_cloudwatch_event_rule, name: notification-rule, in: region, at: [6, 3]}
    - {tf: aws_sfn_state_machine, name: customer-service, in: region, at: [2, 4, 1, 2]}
    - {tf: aws_lambda_function, name: claims-service, in: region, at: [3, 4, 1, 2]}
    - {tf: aws_lambda_function, name: fraud-service, in: region, at: [4, 4, 1, 2]}
    - {tf: aws_sqs_queue, name: settlement-queue, in: region, at: [5, 4]}
    - {tf: aws_ecs_cluster, name: settlement-cluster, in: vpc:main, at: [1, 1]}
    - {tf: aws_ecs_service, name: settlement-service, in: vpc:main, at: [1, 1]}
    - {tf: aws_lambda_function, name: notification-service, in: region, at: [6, 1]}
  actors:
    - {type: users, name: users, at: [1, 1]}
  flows:
    - {from: users, to: signup-api, label: POST, step: 1}
    - {from: users, to: fnol-api, label: POST}
    - {from: users, to: claims-api, label: GET}
    - {from: users, to: customer-api, label: GET}
    - {from: users, to: documents-bucket, label: upload documents}
    - {from: signup-api, to: event-broker, label: PutEvents, step: 2}
    - {from: fnol-api, to: event-broker, label: PutEvents}
    - {from: event-broker, to: documents-workflow, label: document events}
    - {from: documents-workflow, to: event-broker, label: PutEvents}
    - {from: event-broker, to: customer-rule, label: rule match on detail-type, step: 3}
    - {from: customer-rule, to: customer-service, link: aws_cloudwatch_event_target}
    - {from: customer-service, to: event-broker, label: PutEvents}
    - {from: event-broker, to: claims-rule, label: rule match on detail-type}
    - {from: claims-rule, to: claims-service, link: aws_cloudwatch_event_target}
    - {from: claims-service, to: event-broker, label: PutEvents}
    - {from: event-broker, to: fraud-rule, label: rule match on detail-type}
    - {from: fraud-rule, to: fraud-service, link: aws_cloudwatch_event_target}
    - {from: fraud-service, to: event-broker, label: PutEvents}
    - {from: event-broker, to: settlement-rule, label: rule match on detail-type}
    - {from: settlement-rule, to: settlement-queue, link: aws_cloudwatch_event_target, step: 4}
    - {from: settlement-service, to: settlement-queue, label: long poll ReceiveMessage, step: 5}
    - {from: settlement-service, to: event-broker, label: PutEvents Settlement.Finalized, step: 6}
    - {from: event-broker, to: notification-rule, label: rule match on detail-type, step: 7}
    - {from: notification-rule, to: notification-service, link: aws_cloudwatch_event_target, step: 8}
    - {from: notification-service, to: users, label: notification, step: 9}

- slug: container-insights-ecs-eks-observability
  title: Container observability with CloudWatch Container Insights on ECS and EKS
  category: observability
  tags: [cloudwatch, container insights, enhanced observability, fluent bit, cloudwatch agent, ecs, eks]
  source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
  description: Container Insights with enhanced observability collects CPU, memory, disk and network metrics down to the container level from an ECS cluster (via the ECS agent) and from an EKS cluster (via the Amazon CloudWatch Observability add-on, which installs the CloudWatch agent and Fluent Bit). Metrics land in the ContainerInsights namespace, container logs and performance log events go to CloudWatch Logs, and curated dashboards plus alarms that notify an SNS topic give operators cluster-to-container drill-down.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_ecs_cluster, name: web-ecs-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: web-service, in: subnet:private-a}
    - {tf: aws_eks_cluster, name: api-eks-cluster, in: vpc:main}
    - {tf: aws_eks_node_group, name: api-nodes, in: subnet:private-b}
    - {tf: aws_eks_addon, name: cloudwatch-observability-addon, in: region}
    - {tf: aws_cloudwatch_log_group, name: ecs-performance-logs, in: region}
    - {tf: aws_cloudwatch_log_group, name: eks-application-logs, in: region}
    - {tf: aws_cloudwatch_dashboard, name: container-insights-dashboard, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: pod-restart-alarm, in: region}
    - {tf: aws_sns_topic, name: ops-alerts, in: region}
    - {tf: aws_iam_role, name: cloudwatch-agent-role, in: region}
  actors: [user]
  flows:
    - {from: web-ecs-cluster, to: ecs-performance-logs, label: ECS agent performance log events (containerInsights enhanced), step: 1}
    - {from: web-service, to: web-ecs-cluster, label: task and container metrics}
    - {from: cloudwatch-observability-addon, to: api-eks-cluster, label: installs CloudWatch agent + Fluent Bit, step: 1}
    - {from: api-nodes, to: eks-application-logs, label: Fluent Bit container logs, step: 2}
    - {from: api-nodes, to: ecs-performance-logs, label: CloudWatch agent node/pod/container metrics, step: 2}
    - {from: cloudwatch-agent-role, to: api-nodes, label: IRSA / node role for PutLogEvents}
    - {from: ecs-performance-logs, to: container-insights-dashboard, label: metrics extracted to ContainerInsights namespace, step: 3}
    - {from: eks-application-logs, to: container-insights-dashboard, label: Logs Insights queries}
    - {from: pod-restart-alarm, to: ops-alerts, label: ALARM notification, step: 4}
    - {from: user, to: container-insights-dashboard, label: cluster to container drill-down, step: 5}

- slug: eks-managed-prometheus-grafana
  title: Monitoring EKS workloads with Amazon Managed Service for Prometheus and Amazon Managed Grafana
  category: observability
  tags: [eks, amazon managed prometheus, amazon managed grafana, adot, opentelemetry, alerting]
  source: https://docs.aws.amazon.com/solutions/monitoring-amazon-eks-workloads-using-amazon-managed-services-for-prometheus-and-grafana/
  description: DevOps engineers provision the stack with Terraform; an AWS Distro for OpenTelemetry collector deployed in the EKS cluster scrapes the application pods and, through an IAM role, remote-writes the metrics to a multi-AZ Amazon Managed Service for Prometheus workspace whose ruler and alert manager evaluate recording and alerting rules and ship their logs to CloudWatch and S3. An Amazon Managed Grafana workspace queries the Prometheus workspace as a data source through its own IAM role, users authenticate with IAM Identity Center to visualise the dashboards, and CloudTrail records the API audit logs of both workspaces.
  containers:
    - region: us-west-2
      account_at: [1, 2, 3, 1]
      groups:
        - {label: amazon-managed-prometheus, at: [2, 2, 3, 1]}
        - {label: amazon-managed-grafana, at: [2, 3, 3, 2]}
      vpcs:
        - name: eks
          cidr: 10.0.0.0/16
          at: [1, 1, 2, 1]
  elements:
    - {tf: aws_prometheus_scraper, name: adot-collector, in: vpc:eks, at: [1, 1]}
    - {tf: aws_eks_cluster, name: workload-cluster, in: vpc:eks, at: [2, 1]}
    - {tf: aws_eks_node_group, name: app-nodes, in: vpc:eks, at: [1, 1]}
    - {tf: aws_iam_role, name: adot-collector-role, in: vpc:eks, at: [3, 1]}
    - {tf: aws_cloudtrail, name: audit-trail, in: region, at: [1, 2]}
    - {tf: aws_iam_openid_connect_provider, name: eks-oidc-provider, in: region, at: [1, 3]}
    - {tf: aws_ssoadmin_application, name: iam-identity-center, in: region, at: [1, 4]}
    - {tf: aws_prometheus_workspace, name: metrics-workspace, in: group:amazon-managed-prometheus, at: [1, 1]}
    - {tf: aws_iam_role, name: prometheus-workspace-role, in: group:amazon-managed-prometheus, at: [2, 1]}
    - {tf: aws_grafana_workspace, name: dashboards-workspace, in: group:amazon-managed-grafana, at: [1, 1]}
    - {tf: aws_iam_role, name: grafana-workspace-role, in: group:amazon-managed-grafana, at: [2, 1]}
    - {tf: aws_cloudwatch_log_group, name: alert-manager-logs, in: region, at: [3, 1]}
    - {tf: aws_s3_bucket, name: ruler-logs-bucket, in: region, at: [4, 1]}
  actors:
    - {type: client, name: terraform, at: [1, 1]}
    - {type: users, name: devops-engineers, at: [2, 1]}
    - {type: users, name: grafana-users, at: [3, 1]}
  flows:
    - {from: devops-engineers, to: terraform, label: terraform apply}
    - {from: terraform, to: workload-cluster, label: "provisions EKS, Prometheus and Grafana workspaces", step: 1}
    - {from: adot-collector-role, to: adot-collector, label: "IAM role (IRSA aps:RemoteWrite)", step: 2}
    - {from: eks-oidc-provider, to: adot-collector-role, label: IRSA trust}
    - {from: adot-collector, to: app-nodes, label: scrapes app metrics, step: 6}
    - {from: adot-collector, to: metrics-workspace, label: remote write endpoint (SigV4), step: 7}
    - {from: prometheus-workspace-role, to: metrics-workspace, label: IAM role}
    - {from: metrics-workspace, to: audit-trail, label: API audit logs}
    - {from: metrics-workspace, to: alert-manager-logs, label: alert manager / ruler logs}
    - {from: metrics-workspace, to: ruler-logs-bucket, label: alert manager / ruler logs}
    - {from: dashboards-workspace, to: metrics-workspace, label: query endpoint (PromQL data source), step: 8}
    - {from: grafana-workspace-role, to: dashboards-workspace, label: "IAM role (aps:QueryMetrics)"}
    - {from: dashboards-workspace, to: audit-trail, label: audit logs}
    - {from: iam-identity-center, to: dashboards-workspace, label: user authentication, step: 9}
    - {from: grafana-users, to: dashboards-workspace, label: visualization, step: 10}

- slug: eks-istio-service-mesh
  title: Istio service mesh on EKS with an ingress gateway behind an NLB
  category: containers
  tags: [eks, istio, service mesh, envoy, nlb, mtls, kiali]
  source: https://aws.amazon.com/blogs/opensource/getting-started-with-istio-on-amazon-eks/
  description: Istio's control plane (istiod) runs on an EKS cluster with managed node groups and injects Envoy sidecars into pods of namespaces labelled istio-injection=enabled, giving mutual TLS, retries and traffic splitting between service versions. The Istio ingress gateway is exposed as a LoadBalancer service that the AWS Load Balancer Controller realizes as a Network Load Balancer, and Gateway and VirtualService resources route edge traffic to the application; Kiali, Prometheus, Grafana and Jaeger add-ons visualize the mesh.
  containers:
    - region: us-west-2
      vpcs:
        - name: eks
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.16.0/20, az: a, public: false}
            - {name: private-b, cidr: 10.0.32.0/20, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:eks}
    - {tf: aws_lb, name: istio-ingress-nlb, in: vpc:eks}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_eks_cluster, name: mesh-cluster, in: vpc:eks}
    - {tf: aws_eks_node_group, name: istio-system-nodes, in: subnet:private-a}
    - {tf: aws_eks_node_group, name: app-nodes, in: subnet:private-b}
    - {tf: aws_ecr_repository, name: productpage-image, in: region}
    - {tf: aws_ecr_repository, name: reviews-image, in: region}
    - {tf: aws_iam_role, name: lb-controller-role, in: region}
    - {tf: aws_prometheus_workspace, name: mesh-metrics, in: region}
    - {tf: aws_grafana_workspace, name: mesh-dashboards, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTP/HTTPS, step: 1}
    - {from: igw, to: istio-ingress-nlb, step: 2}
    - {from: istio-ingress-nlb, to: istio-system-nodes, label: istio-ingressgateway pods (IP targets), step: 3}
    - {from: istio-system-nodes, to: app-nodes, label: Gateway + VirtualService route to productpage, step: 4}
    - {from: app-nodes, to: app-nodes, label: sidecar-to-sidecar mTLS (reviews v1/v2/v3 traffic split), step: 5}
    - {from: istio-system-nodes, to: app-nodes, label: istiod pushes xDS config to Envoy sidecars}
    - {from: mesh-cluster, to: istio-ingress-nlb, label: AWS Load Balancer Controller creates NLB}
    - {from: lb-controller-role, to: mesh-cluster, label: IRSA}
    - {from: productpage-image, to: app-nodes, label: image pull}
    - {from: reviews-image, to: app-nodes, label: image pull}
    - {from: app-nodes, to: mesh-metrics, label: Envoy telemetry (Prometheus remote write)}
    - {from: mesh-dashboards, to: mesh-metrics, label: Kiali / Grafana queries}
    - {from: app-nodes, to: nat-a, label: outbound}

- slug: copilot-three-tier-fargate-app
  title: Three-tier ECS Fargate application scaffolded with AWS Copilot
  category: containers
  tags: [copilot, ecs, fargate, load balanced web service, backend service, aurora serverless, cloud map]
  source: https://aws.github.io/copilot-cli/docs/concepts/services/
  description: Copilot provisions an environment (a VPC with a public and a private subnet in each of two Availability Zones, an ECS cluster and an ALB) and deploys a Load Balanced Web Service whose Fargate tasks run in the public subnet of every zone; the ALB listener rule forwards internet traffic to a target group that fans out to the tasks in both zones. A Backend Service reachable only by its service discovery name inside the environment completes the application tier, and a storage addon adds an Aurora Serverless v2 PostgreSQL cluster in the private subnets.
  containers:
    - region: us-east-1
      vpcs:
        - name: copilot-env
          cidr: 10.0.0.0/16
          at: [1, 1]
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: private-a, cidr: 10.0.2.0/24, az: a, public: false, at: [2, 1]}
            - {name: private-b, cidr: 10.0.3.0/24, az: b, public: false, at: [2, 1]}
  elements:
    - {tf: aws_lb, name: env-alb, in: vpc:copilot-env, at: [1, 2]}
    - {tf: aws_lb_target_group, name: web-target-group, in: vpc:copilot-env, at: [2, 2]}
    - {tf: aws_ecs_cluster, name: env-cluster, in: vpc:copilot-env, at: [3, 2]}
    - {tf: aws_ecs_service, name: frontend-lb-web-service, in: vpc:copilot-env, at: [1, 1]}
    - {tf: aws_ecs_service, name: api-backend-service, in: vpc:copilot-env, at: [2, 1]}
    - {tf: aws_ecs_task_definition, name: web-task-a, in: subnet:public-a, at: [1, 1]}
    - {tf: aws_ecs_task_definition, name: web-task-b, in: subnet:public-b, at: [1, 1]}
    - {tf: aws_rds_cluster, name: api-aurora-serverless, in: subnet:private-b, at: [1, 1]}
  actors: [{type: users, name: users, at: [1, 1]}]
  flows:
    - {from: users, to: env-alb, label: HTTPS, step: 1}
    - {from: env-alb, to: web-target-group, label: "listener rule: forward", step: 2}
    - {from: web-target-group, to: web-task-a, label: "HTTP :80", step: 3}
    - {from: web-target-group, to: web-task-b, label: "HTTP :80", step: 3}
    - {from: frontend-lb-web-service, to: web-task-a, label: one Load Balanced Web Service task per AZ}
    - {from: frontend-lb-web-service, to: web-task-b, label: one Load Balanced Web Service task per AZ}
    - {from: frontend-lb-web-service, to: api-backend-service, label: "http://api.<env>.<app>.local:8080", step: 4}
    - {from: api-backend-service, to: api-aurora-serverless, label: PostgreSQL, step: 5}
