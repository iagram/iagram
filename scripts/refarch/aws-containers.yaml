- slug: ecs-ec2-capacity-provider-alb
  title: ECS on EC2 with an Auto Scaling group capacity provider behind an ALB
  category: containers
  tags: [ecs, ec2 launch type, capacity provider, cluster auto scaling, alb]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/asg-capacity-providers.html
  description: An ECS cluster registers container instances from an Auto Scaling group that is wrapped in a capacity provider with managed scaling, so ECS publishes a CapacityProviderReservation metric and a target-tracking policy grows or shrinks the group as tasks are placed. An internet-facing ALB in the public subnets forwards to a target group of instance targets in private subnets, and a NAT gateway gives the instances outbound access for image pulls and agent traffic.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: web-alb, in: vpc:main}
    - {tf: aws_lb_target_group, name: web-tg, in: vpc:main}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: ec2-cluster, in: vpc:main}
    - {tf: aws_ecs_capacity_provider, name: asg-capacity-provider, in: region}
    - {tf: aws_autoscaling_group, name: container-instances-asg, in: vpc:main}
    - {tf: aws_launch_template, name: ecs-optimized-lt, in: region}
    - {tf: aws_ecs_service, name: web-service, in: subnet:private-a}
    - {tf: aws_ecr_repository, name: web-image, in: region}
    - {tf: aws_cloudwatch_log_group, name: web-logs, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: web-alb, step: 2}
    - {from: web-alb, to: web-tg, label: listener forward, step: 3}
    - {from: web-tg, to: web-service, label: HTTP to bridge-mode host ports, step: 4}
    - {from: web-service, to: ec2-cluster, label: tasks placed on container instances}
    - {from: ec2-cluster, to: asg-capacity-provider, label: CapacityProviderReservation metric}
    - {from: asg-capacity-provider, to: container-instances-asg, label: managed scaling target tracking}
    - {from: ecs-optimized-lt, to: container-instances-asg, label: ECS-optimized AMI + agent config}
    - {from: web-image, to: web-service, label: image pull}
    - {from: container-instances-asg, to: nat-a, label: outbound (ECR, ECS agent)}
    - {from: web-service, to: web-logs, label: awslogs driver}

- slug: ecs-cloud-map-service-discovery
  title: ECS service discovery with an AWS Cloud Map private DNS namespace
  category: containers
  tags: [ecs, cloud map, service discovery, private dns, route 53, fargate]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-discovery.html
  description: Each ECS service registers its task IP addresses as instances of an AWS Cloud Map service inside a private DNS namespace, which is backed by a Route 53 private hosted zone that only the VPC can resolve. The frontend calls backend.internal by name; ECS keeps the A and SRV records current as tasks start, stop or fail health checks, so no internal load balancer is needed.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: frontend-alb, in: vpc:main}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: app-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: frontend-service, in: subnet:private-a}
    - {tf: aws_ecs_service, name: backend-service, in: subnet:private-b}
    - {tf: aws_service_discovery_private_dns_namespace, name: internal-namespace, in: vpc:main}
    - {tf: aws_service_discovery_service, name: backend-discovery, in: region}
    - {tf: aws_route53_zone, name: internal-zone, in: vpc:main}
    - {tf: aws_ecr_repository, name: frontend-image, in: region}
    - {tf: aws_ecr_repository, name: backend-image, in: region}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: frontend-alb, step: 2}
    - {from: frontend-alb, to: frontend-service, label: HTTP :3000, step: 3}
    - {from: frontend-service, to: internal-zone, label: resolve backend.internal, step: 4}
    - {from: frontend-service, to: backend-service, label: HTTP :8080 to task IPs, step: 5}
    - {from: backend-service, to: backend-discovery, label: register / deregister task IPs}
    - {from: backend-discovery, to: internal-namespace, label: service in namespace}
    - {from: internal-namespace, to: internal-zone, label: creates private hosted zone}
    - {from: frontend-image, to: frontend-service, label: image pull}
    - {from: backend-image, to: backend-service, label: image pull}
    - {from: backend-service, to: nat-a, label: outbound}

- slug: ecs-service-connect-microservices
  title: Microservices on ECS Fargate connected with ECS Service Connect
  category: containers
  tags: [ecs, service connect, cloud map, envoy, fargate, microservices]
  source: https://aws.amazon.com/blogs/aws/new-amazon-ecs-service-connect-enabling-easy-communication-between-microservices/
  description: ECS Service Connect adds an ECS-managed Envoy proxy container to every task and registers each service under a logical name (ui, checkout, orders, catalog on port 80) in the svcconnect Cloud Map namespace, so the checkout service reaches orders and catalog by short name with client-side load balancing, retries and outlier detection. Only the UI service is exposed through Elastic Load Balancing; all other traffic stays service to service through the Service Connect proxies.
  containers:
    - region: us-east-1
      groups: [{label: amazon-ecs, at: [1, 2]}]
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          at: [1, 1]
  elements:
    - {tf: aws_lb, name: ui-alb, in: vpc:main, at: [1, 1]}
    - {tf: aws_ecs_cluster, name: shop-cluster, in: group:amazon-ecs, at: [1, 1, 4, 1]}
    - {tf: aws_ecs_service, name: ui-service, in: group:amazon-ecs, at: [1, 1]}
    - {tf: aws_ecs_service, name: checkout-service, in: group:amazon-ecs, at: [2, 1]}
    - {tf: aws_ecs_service, name: orders-service, in: group:amazon-ecs, at: [3, 1]}
    - {tf: aws_ecs_service, name: catalog-service, in: group:amazon-ecs, at: [4, 1]}
    - {tf: aws_service_discovery_service, name: ui-svcconnect, in: group:amazon-ecs, at: [1, 2]}
    - {tf: aws_service_discovery_service, name: checkout-svcconnect, in: group:amazon-ecs, at: [2, 2]}
    - {tf: aws_service_discovery_service, name: orders-svcconnect, in: group:amazon-ecs, at: [3, 2]}
    - {tf: aws_service_discovery_service, name: catalog-svcconnect, in: group:amazon-ecs, at: [4, 2]}
    - {tf: aws_service_discovery_http_namespace, name: shop-namespace, in: region, at: [1, 3]}
  actors: [{type: users, name: users, at: [1, 1]}]
  flows:
    - {from: users, to: ui-alb, label: HTTPS, step: 1}
    - {from: ui-alb, to: ui-service, label: "HTTP :80", step: 2}
    - {from: ui-service, to: ui-svcconnect, label: "Service Connect proxy ui.svcconnect:80"}
    - {from: checkout-service, to: checkout-svcconnect, label: "Service Connect proxy checkout.svcconnect:80"}
    - {from: orders-service, to: orders-svcconnect, label: "Service Connect proxy orders.svcconnect:80"}
    - {from: catalog-service, to: catalog-svcconnect, label: "Service Connect proxy catalog.svcconnect:80"}
    - {from: ui-service, to: checkout-service, label: "http://checkout via Envoy proxy", step: 3}
    - {from: checkout-service, to: orders-service, label: "http://orders", step: 4}
    - {from: checkout-service, to: catalog-service, label: "http://catalog", step: 4}
    - {from: shop-cluster, to: shop-namespace, label: default Service Connect namespace svcconnect}
    - {from: ui-svcconnect, to: shop-namespace, label: registers ui.svcconnect}
    - {from: checkout-svcconnect, to: shop-namespace, label: registers checkout.svcconnect}
    - {from: orders-svcconnect, to: shop-namespace, label: registers orders.svcconnect}
    - {from: catalog-svcconnect, to: shop-namespace, label: registers catalog.svcconnect}

- slug: ecs-app-mesh-envoy-sidecars
  title: Service mesh on ECS with AWS App Mesh and Envoy sidecars
  category: containers
  tags: [app mesh, envoy, service mesh, ecs, cloud map, x-ray]
  source: https://aws.amazon.com/blogs/architecture/deploying-service-mesh-based-architectures-using-aws-app-mesh-and-amazon-ecs/
  description: The control plane is an App Mesh mesh that models each ECS service (inventory, order and UI) as a virtual node discovered through Cloud Map and pushes routing configuration to the Envoy proxy running as a sidecar in every ECS task next to the application container. In the data plane all service-to-service traffic flows between the Envoy proxies over mTLS and is exported as traces to X-Ray and as logs and metrics to CloudWatch without code changes.
  containers:
    - region: us-west-2
      groups: [{label: control-plane, at: [1, 2]}, {label: data-plane, at: [2, 2, 2, 1]}]
  elements:
    - {tf: aws_service_discovery_http_namespace, name: mesh-namespace, in: group:control-plane, at: [1, 1]}
    - {tf: aws_appmesh_mesh, name: app-mesh, in: group:control-plane, at: [1, 2]}
    - {tf: aws_ecs_cluster, name: mesh-cluster, in: group:data-plane, at: [1, 1, 1, 3]}
    - {tf: aws_ecs_service, name: inventory-service, in: group:data-plane, at: [1, 1]}
    - {tf: aws_ecs_service, name: order-service, in: group:data-plane, at: [1, 2]}
    - {tf: aws_ecs_service, name: ui-service, in: group:data-plane, at: [1, 3]}
    - {tf: aws_ecs_task_definition, name: inventory-task, in: group:data-plane, at: [2, 1]}
    - {tf: aws_ecs_task_definition, name: order-task, in: group:data-plane, at: [2, 2]}
    - {tf: aws_ecs_task_definition, name: ui-task, in: group:data-plane, at: [2, 3]}
    - {tf: aws_xray_group, name: xray-traces, in: region, at: [2, 1]}
    - {tf: aws_cloudwatch_log_group, name: envoy-logs, in: region, at: [3, 1]}
  actors: []
  flows:
    - {from: app-mesh, to: mesh-namespace, label: discover running containers, step: 1}
    - {from: app-mesh, to: mesh-cluster, label: Envoy configurations, step: 2}
    - {from: inventory-service, to: inventory-task, label: ECS task with Envoy proxy sidecar and application container}
    - {from: order-service, to: order-task, label: ECS task with Envoy proxy sidecar and application container}
    - {from: ui-service, to: ui-task, label: ECS task with Envoy proxy sidecar and application container}
    - {from: inventory-service, to: order-service, label: mTLS connection established, step: 3}
    - {from: order-service, to: ui-service, label: mTLS connection established, step: 3}
    - {from: mesh-cluster, to: xray-traces, label: trace network requests, step: 4}
    - {from: mesh-cluster, to: envoy-logs, label: logs and metrics, step: 5}

- slug: ecs-bluegreen-codedeploy-pipeline
  title: Blue/green ECS deployments with CodeDeploy and CodePipeline
  category: devops
  tags: [ecs, codedeploy, blue/green, canary, codepipeline, alb, ecr]
  source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-bluegreen.html
  description: An ECS service with the CODE_DEPLOY controller sits behind an ALB that has two target groups and a production plus a test listener; CodeDeploy creates a replacement task set in the green target group, exposes it on the test listener, then shifts production traffic all at once, linearly or by canary. A CodePipeline triggered by a new ECR image pushes the task definition and appspec to CodeDeploy, and a failed CloudWatch alarm rolls traffic back to the blue task set.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: app-alb, in: vpc:main}
    - {tf: aws_lb_target_group, name: blue-tg, in: vpc:main}
    - {tf: aws_lb_target_group, name: green-tg, in: vpc:main}
    - {tf: aws_ecs_cluster, name: app-cluster, in: vpc:main}
    - {tf: aws_ecs_service, name: app-service, in: subnet:private-a}
    - {tf: aws_codedeploy_app, name: ecs-deploy-app, in: region}
    - {tf: aws_codedeploy_deployment_group, name: app-deployment-group, in: region}
    - {tf: aws_codepipeline, name: release-pipeline, in: region}
    - {tf: aws_ecr_repository, name: app-image, in: region}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: green-5xx-alarm, in: region}
  actors: [users, user]
  flows:
    - {from: user, to: app-image, label: docker push new tag, step: 1}
    - {from: app-image, to: release-pipeline, label: ECR source action, step: 2}
    - {from: release-pipeline, to: pipeline-artifacts, label: taskdef.json + appspec.yaml}
    - {from: release-pipeline, to: ecs-deploy-app, label: ECS blue/green deploy action, step: 3}
    - {from: ecs-deploy-app, to: app-deployment-group, step: 4}
    - {from: app-deployment-group, to: app-service, label: create replacement (green) task set, step: 5}
    - {from: app-deployment-group, to: app-alb, label: "test listener :8080 to green, then shift production listener", step: 6}
    - {from: users, to: igw, label: HTTPS, step: 7}
    - {from: igw, to: app-alb, step: 8}
    - {from: app-alb, to: blue-tg, label: production listener (before cutover)}
    - {from: app-alb, to: green-tg, label: production listener (after cutover)}
    - {from: blue-tg, to: app-service, label: original task set}
    - {from: green-tg, to: app-service, label: replacement task set}
    - {from: green-5xx-alarm, to: app-deployment-group, label: alarm triggers rollback}

- slug: batch-fargate-s3-file-processing
  title: Serverless batch file processing with AWS Batch on Fargate
  category: containers
  tags: [aws batch, fargate, job queue, s3 event, lambda, dynamodb]
  source: https://aws.amazon.com/blogs/developer/aws-batch-application-orchestration-using-aws-fargate/
  description: An object uploaded to S3 raises a CloudWatch Event that triggers a Lambda function, which submits a job (job definition and job queue) to an AWS Batch Fargate compute environment in the private subnet, so no EC2 instances are managed and capacity scales up to the configured maximum vCPUs. The task pulls its container image from ECR through an interface endpoint, reads the file from S3 and writes parsed rows to DynamoDB through gateway endpoints, streams its output to CloudWatch, and the whole stack is provisioned by CloudFormation.
  containers:
    - region: us-east-1
      vpcs:
        - name: batch
          cidr: 10.0.0.0/16
          at: [1, 1, 2, 3]
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, public: true, at: [1, 1]}
            - {name: private-a, cidr: 10.0.1.0/24, public: false, at: [1, 2]}
  elements:
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a, at: [1, 1]}
    - {tf: aws_network_interface, name: fargate-eni, in: subnet:public-a, at: [1, 2]}
    - {tf: aws_batch_compute_environment, name: fargate-ce, in: subnet:private-a, at: [1, 1]}
    - {tf: aws_vpc_endpoint, name: s3-gateway-endpoint, in: vpc:batch, at: [1, 3]}
    - {tf: aws_vpc_endpoint, name: ecr-interface-endpoint, in: vpc:batch, at: [2, 1]}
    - {tf: aws_vpc_endpoint, name: dynamodb-gateway-endpoint, in: vpc:batch, at: [2, 2]}
    - {tf: aws_cloudwatch_log_group, name: batch-job-logs, in: region, at: [1, 4]}
    - {tf: aws_s3_bucket, name: input-bucket, in: region, at: [2, 4]}
    - {tf: aws_ecr_repository, name: csv-processor-image, in: region, at: [3, 1]}
    - {tf: aws_dynamodb_table, name: records-table, in: region, at: [3, 2]}
    - {tf: aws_lambda_function, name: submit-job-fn, in: region, at: [3, 3]}
    - {tf: aws_cloudwatch_event_rule, name: s3-upload-event, in: region, at: [3, 4]}
    - {tf: aws_cloudformation_stack, name: batch-stack, in: region, at: [4, 1]}
  actors: [{type: user, name: user, at: [2, 2]}, {type: client, name: batch-processor-script, at: [3, 1]}]
  flows:
    - {from: batch-processor-script, to: csv-processor-image, label: push application image, step: 1}
    - {from: user, to: input-bucket, label: file upload, step: 2}
    - {from: input-bucket, to: s3-upload-event, label: trigger event, step: 3}
    - {from: s3-upload-event, to: submit-job-fn, link: aws_cloudwatch_event_target, label: trigger Lambda, step: 4}
    - {from: submit-job-fn, to: fargate-ce, label: SubmitJob with Batch job definition and job queue, step: 5}
    - {from: csv-processor-image, to: ecr-interface-endpoint, label: load application image, step: 6}
    - {from: ecr-interface-endpoint, to: fargate-ce, label: image pull, step: 6}
    - {from: input-bucket, to: s3-gateway-endpoint, label: read S3 file, step: 7}
    - {from: s3-gateway-endpoint, to: fargate-ce, label: GetObject, step: 7}
    - {from: fargate-ce, to: dynamodb-gateway-endpoint, label: process data, step: 8}
    - {from: dynamodb-gateway-endpoint, to: records-table, label: BatchWriteItem, step: 8}
    - {from: fargate-ce, to: batch-job-logs, label: awslogs}
    - {from: fargate-ce, to: fargate-eni, label: outbound}
    - {from: fargate-eni, to: nat-a}

- slug: eks-baseline-managed-nodes-fargate
  title: EKS baseline cluster with managed node groups and a Fargate profile
  category: containers
  tags: [eks, managed node groups, fargate profile, eks blueprints, add-ons, irsa]
  source: https://aws.amazon.com/blogs/containers/bootstrapping-clusters-with-eks-blueprints/
  description: A private-subnet EKS cluster runs a small managed node group for system add-ons and a second group for applications across two Availability Zones, while a Fargate profile schedules pods in a selected namespace on serverless compute. Managed add-ons (VPC CNI, CoreDNS, kube-proxy) and an IAM OIDC provider for IAM roles for service accounts are created with the cluster, and NAT gateways give nodes outbound access to ECR and the EKS API.
  containers:
    - region: eu-west-1
      vpcs:
        - name: eks
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.16.0/20, az: a, public: false}
            - {name: private-b, cidr: 10.0.32.0/20, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:eks}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b}
    - {tf: aws_eks_cluster, name: baseline-cluster, in: vpc:eks}
    - {tf: aws_eks_node_group, name: system-nodes, in: subnet:private-a}
    - {tf: aws_eks_node_group, name: app-nodes, in: subnet:private-b}
    - {tf: aws_eks_fargate_profile, name: serverless-namespace-profile, in: vpc:eks}
    - {tf: aws_eks_addon, name: vpc-cni-addon, in: region}
    - {tf: aws_eks_addon, name: coredns-addon, in: region}
    - {tf: aws_iam_openid_connect_provider, name: cluster-oidc, in: region}
    - {tf: aws_iam_role, name: node-role, in: region}
    - {tf: aws_ecr_repository, name: app-image, in: region}
    - {tf: aws_cloudwatch_log_group, name: control-plane-logs, in: region}
  actors: [user]
  flows:
    - {from: user, to: baseline-cluster, label: kubectl to API endpoint, step: 1}
    - {from: baseline-cluster, to: system-nodes, label: schedule add-on pods, step: 2}
    - {from: baseline-cluster, to: app-nodes, label: schedule application pods, step: 2}
    - {from: baseline-cluster, to: serverless-namespace-profile, label: pods matching namespace selector run on Fargate, step: 2}
    - {from: vpc-cni-addon, to: baseline-cluster, label: managed add-on}
    - {from: coredns-addon, to: baseline-cluster, label: managed add-on}
    - {from: cluster-oidc, to: baseline-cluster, label: IRSA identity provider}
    - {from: node-role, to: app-nodes, label: node IAM role}
    - {from: app-image, to: app-nodes, label: image pull, step: 3}
    - {from: app-nodes, to: nat-b, label: outbound}
    - {from: nat-b, to: igw}
    - {from: baseline-cluster, to: control-plane-logs, label: audit, authenticator logs}

- slug: eks-karpenter-nodepool-autoscaling
  title: Just-in-time node provisioning on EKS with Karpenter
  category: containers
  tags: [eks, karpenter, autoscaling, nodepool, spot, interruption handling]
  source: https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html
  description: Karpenter runs on a small managed node group (or Fargate) and watches for unschedulable pods, then calls the EC2 Fleet API directly to launch right-sized instances from a diverse set of types defined in a NodePool, without Auto Scaling groups. An EventBridge rule forwards Spot interruption and instance health events to an SQS queue that Karpenter drains so it can cordon and replace nodes ahead of termination, and consolidation removes under-used nodes.
  containers:
    - region: us-west-2
      vpcs:
        - name: eks
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.0.16.0/20, az: a, public: false}
            - {name: private-b, cidr: 10.0.32.0/20, az: b, public: false}
            - {name: private-c, cidr: 10.0.48.0/20, az: c, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:eks}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
