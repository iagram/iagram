    - {from: vgw, to: private-cluster, label: private API endpoint only, step: 2}
    - {from: private-nodes, to: private-cluster, label: node registration via private endpoint, step: 3}
    - {from: private-nodes, to: ecr-api-endpoint, label: GetAuthorizationToken, step: 4}
    - {from: private-nodes, to: ecr-dkr-endpoint, label: image manifest pull, step: 5}
    - {from: private-nodes, to: s3-gateway-endpoint, label: image layers from ECR S3 buckets, step: 6}
    - {from: ecr-dkr-endpoint, to: mirrored-images, label: PrivateLink}
    - {from: private-nodes, to: sts-endpoint, label: AssumeRoleWithWebIdentity (IRSA)}
    - {from: private-nodes, to: ec2-endpoint, label: DescribeInstances (node DNS name)}
    - {from: private-nodes, to: logs-endpoint, label: PutLogEvents}
    - {from: logs-endpoint, to: cluster-logs}

- slug: eks-multi-region-global-accelerator
  title: Multi-Region stateless application on EKS with Global Accelerator failover
  category: containers
  tags: [eks, multi-region, global accelerator, route 53, alb, failover]
  source: https://aws.amazon.com/blogs/containers/operating-a-multi-regional-stateless-application-using-amazon-eks/
  description: Identical stateless deployments run on EKS clusters in two Regions, each exposed through an ALB created by the AWS Load Balancer Controller. Global Accelerator publishes two static anycast IPs, sends 100 percent of traffic to the primary endpoint group and 0 percent to the secondary, and health-checks both ALBs so failover happens at the accelerator without waiting for DNS propagation; Route 53 maps the application domain to the accelerator.
  containers:
    - region: us-west-2
      label: primary
      vpcs:
        - name: primary-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: p-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: p-public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: p-private-a, cidr: 10.0.16.0/20, az: a, public: false}
    - region: us-east-1
      label: secondary
      vpcs:
        - name: secondary-vpc
          cidr: 10.1.0.0/16
          subnets:
            - {name: s-public-a, cidr: 10.1.0.0/24, az: a, public: true}
            - {name: s-public-b, cidr: 10.1.1.0/24, az: b, public: true}
            - {name: s-private-a, cidr: 10.1.16.0/20, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: example-zone, in: region:us-west-2}
    - {tf: aws_globalaccelerator_accelerator, name: app-accelerator, in: region:us-west-2}
    - {tf: aws_internet_gateway, name: primary-igw, in: vpc:primary-vpc}
    - {tf: aws_lb, name: primary-alb, in: vpc:primary-vpc}
    - {tf: aws_eks_cluster, name: primary-cluster, in: vpc:primary-vpc}
    - {tf: aws_eks_node_group, name: primary-nodes, in: subnet:p-private-a}
    - {tf: aws_ecr_repository, name: app-image, in: region:us-west-2}
    - {tf: aws_internet_gateway, name: secondary-igw, in: vpc:secondary-vpc}
    - {tf: aws_lb, name: secondary-alb, in: vpc:secondary-vpc}
    - {tf: aws_eks_cluster, name: secondary-cluster, in: vpc:secondary-vpc}
    - {tf: aws_eks_node_group, name: secondary-nodes, in: subnet:s-private-a}
    - {tf: aws_ecr_repository, name: app-image-replica, in: region:us-east-1}
  actors: [users]
  flows:
    - {from: users, to: example-zone, label: DNS, step: 1}
    - {from: example-zone, to: app-accelerator, label: alias to accelerator DNS name, step: 2}
    - {from: users, to: app-accelerator, label: "TCP :443 to anycast IPs", step: 3}
    - {from: app-accelerator, to: primary-alb, label: endpoint group traffic dial 100, step: 4}
    - {from: app-accelerator, to: secondary-alb, label: endpoint group traffic dial 0 (failover)}
    - {from: primary-alb, to: primary-nodes, label: Ingress target group (pod IPs), step: 5}
    - {from: secondary-alb, to: secondary-nodes, label: Ingress target group (pod IPs)}
    - {from: primary-cluster, to: primary-alb, label: AWS Load Balancer Controller}
    - {from: secondary-cluster, to: secondary-alb, label: AWS Load Balancer Controller}
    - {from: app-image, to: app-image-replica, label: ECR cross-Region replication}
    - {from: app-image, to: primary-nodes, label: image pull}
    - {from: app-image-replica, to: secondary-nodes, label: image pull}

