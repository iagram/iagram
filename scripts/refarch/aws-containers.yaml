    - {tf: aws_vpc_endpoint, name: privatelink-endpoint, in: region, at: [1, 2]}
    - {tf: aws_apprunner_vpc_connector, name: data-vpc-connector, in: vpc:customer, at: [1, 1]}
    - {tf: aws_db_instance, name: app-postgres, in: subnet:private-a, at: [1, 1]}
    - {tf: aws_secretsmanager_secret, name: db-credentials, in: region, at: [2, 1]}
  actors: [{type: users, name: users, at: [1, 1]}, {type: saas, name: github-repository, at: [2, 1]}]
  flows:
    - {from: users, to: web-app, label: HTTPS to App Runner domain, step: 1}
    - {from: github-repository, to: web-app, label: source code deploy on push, step: 2}
    - {from: db-credentials, to: web-app, label: database credentials as runtime secret}
