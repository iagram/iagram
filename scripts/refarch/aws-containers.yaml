          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.16.0/20, az: a, public: false}
            - {name: private-b, cidr: 10.0.32.0/20, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: example-zone, in: region}
    - {tf: aws_acm_certificate, name: app-certificate, in: region}
    - {tf: aws_internet_gateway, name: igw, in: vpc:eks}
    - {tf: aws_lb, name: ingress-alb, in: vpc:eks}
    - {tf: aws_lb_target_group, name: web-pods-tg, in: vpc:eks}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_eks_cluster, name: web-cluster, in: vpc:eks}
    - {tf: aws_eks_node_group, name: web-nodes, in: subnet:private-a}
    - {tf: aws_iam_role, name: lb-controller-role, in: region}
    - {tf: aws_iam_openid_connect_provider, name: cluster-oidc, in: region}
  actors: [users]
  flows:
    - {from: users, to: example-zone, label: DNS app.example.com, step: 1}
    - {from: example-zone, to: ingress-alb, label: alias record, step: 2}
    - {from: users, to: igw, label: HTTPS, step: 3}
    - {from: igw, to: ingress-alb, step: 4}
    - {from: app-certificate, to: ingress-alb, label: TLS listener certificate}
    - {from: ingress-alb, to: web-pods-tg, label: "host/path rule from Ingress", step: 5}
    - {from: web-pods-tg, to: web-nodes, label: IP targets = pod IPs, step: 6}
    - {from: web-cluster, to: ingress-alb, label: controller reconciles Ingress into ALB}
    - {from: lb-controller-role, to: web-cluster, label: IRSA for aws-load-balancer-controller}
    - {from: cluster-oidc, to: lb-controller-role, label: trust}
