      region: eu-west-1
      groups: [{label: organization, accounts: [platform, production]}]
      vpcs:
        - name: workloads
          cidr: 10.0.0.0/16
          subnets:
            - {name: private-a, cidr: 10.0.16.0/20, az: a, public: false}
            - {name: endpoints-a, cidr: 10.0.32.0/24, az: a, public: false}
    - account: production
      region: eu-central-1
      label: dr
  elements:
    - {tf: aws_ecr_pull_through_cache_rule, name: public-cache-rule, in: account:platform}
    - {tf: aws_ecr_repository, name: cached-base-images, in: account:platform}
    - {tf: aws_codecommit_repository, name: app-source, in: region:eu-west-1}
    - {tf: aws_codebuild_project, name: image-build, in: region:eu-west-1}
    - {tf: aws_ecr_repository, name: app-build-repo, in: region:eu-west-1}
    - {tf: aws_ecr_repository, name: app-quarantine-repo, in: region:eu-west-1}
    - {tf: aws_cloudwatch_event_rule, name: scan-complete-rule, in: region:eu-west-1}
    - {tf: aws_lambda_function, name: promote-or-quarantine-fn, in: region:eu-west-1}
    - {tf: aws_ecr_replication_configuration, name: replicate-to-prod, in: region:eu-west-1}
    - {tf: aws_ecr_repository, name: prod-app-repo, in: account:production}
    - {tf: aws_ecr_repository, name: prod-dr-app-repo, in: region:eu-central-1}
    - {tf: aws_vpc_endpoint, name: ecr-dkr-endpoint, in: subnet:endpoints-a}
    - {tf: aws_eks_cluster, name: prod-cluster, in: vpc:workloads}
  actors: [user]
  flows:
    - {from: public-cache-rule, to: cached-base-images, label: pull-through cache from ECR Public / Quay, step: 1}
    - {from: cached-base-images, to: image-build, label: vetted base image (cross-account pull), step: 2}
    - {from: user, to: app-source, label: git push, step: 3}
    - {from: app-source, to: image-build, label: build trigger, step: 4}
    - {from: image-build, to: app-build-repo, label: docker push, scan on push, step: 5}
    - {from: scan-complete-rule, to: promote-or-quarantine-fn, link: aws_cloudwatch_event_target, label: ECR image scan completed, step: 6}
    - {from: promote-or-quarantine-fn, to: app-quarantine-repo, label: critical CVEs found}
    - {from: promote-or-quarantine-fn, to: prod-app-repo, label: promote clean image, step: 7}
    - {from: replicate-to-prod, to: prod-app-repo, label: cross-account replication rule}
    - {from: prod-app-repo, to: prod-dr-app-repo, label: cross-Region replication, step: 8}
    - {from: prod-cluster, to: ecr-dkr-endpoint, label: image pull, step: 9}
    - {from: ecr-dkr-endpoint, to: prod-app-repo, label: PrivateLink}

- slug: apprunner-web-service-vpc-connector
