- slug: eks-private-cluster-vpc-endpoints
  title: Fully private EKS cluster with VPC endpoints and no internet egress
  category: containers
  tags: [eks, private cluster, vpc endpoints, privatelink, ecr, air gap]
  source: https://docs.aws.amazon.com/eks/latest/userguide/private-clusters.html
  description: The cluster has only private API endpoint access and its nodes live in subnets with no route to the internet, so every dependency is reached through interface endpoints (ECR API and DKR, EC2, STS, CloudWatch Logs, EKS Auth) and an S3 gateway endpoint for image layers. Images are copied into an ECR registry in the same account, and operators reach the API server from a bastion or over Direct Connect rather than from the internet.
  containers:
    - datacenter: on-premises
    - region: eu-west-1
      vpcs:
        - name: private-eks
          cidr: 10.50.0.0/16
          subnets:
            - {name: nodes-a, cidr: 10.50.0.0/20, az: a, public: false}
            - {name: nodes-b, cidr: 10.50.16.0/20, az: b, public: false}
            - {name: endpoints-a, cidr: 10.50.32.0/24, az: a, public: false}
  elements:
    - {tf: aws_customer_gateway, name: onprem-router, in: datacenter}
    - {tf: aws_vpn_gateway, name: vgw, in: vpc:private-eks}
    - {tf: aws_eks_cluster, name: private-cluster, in: vpc:private-eks}
    - {tf: aws_eks_node_group, name: private-nodes, in: subnet:nodes-a}
    - {tf: aws_vpc_endpoint, name: ecr-api-endpoint, in: subnet:endpoints-a}
    - {tf: aws_vpc_endpoint, name: ecr-dkr-endpoint, in: subnet:endpoints-a}
    - {tf: aws_vpc_endpoint, name: s3-gateway-endpoint, in: vpc:private-eks}
    - {tf: aws_vpc_endpoint, name: sts-endpoint, in: subnet:endpoints-a}
    - {tf: aws_vpc_endpoint, name: ec2-endpoint, in: subnet:endpoints-a}
    - {tf: aws_vpc_endpoint, name: logs-endpoint, in: subnet:endpoints-a}
    - {tf: aws_ecr_repository, name: mirrored-images, in: region}
    - {tf: aws_cloudwatch_log_group, name: cluster-logs, in: region}
  actors: [datacenter]
  flows:
    - {from: onprem-router, to: vgw, link: aws_vpn_connection, label: kubectl over Site-to-Site VPN, step: 1}
    - {from: vgw, to: private-cluster, label: private API endpoint only, step: 2}
    - {from: private-nodes, to: private-cluster, label: node registration via private endpoint, step: 3}
    - {from: private-nodes, to: ecr-api-endpoint, label: GetAuthorizationToken, step: 4}
    - {from: private-nodes, to: ecr-dkr-endpoint, label: image manifest pull, step: 5}
    - {from: private-nodes, to: s3-gateway-endpoint, label: image layers from ECR S3 buckets, step: 6}
    - {from: ecr-dkr-endpoint, to: mirrored-images, label: PrivateLink}
    - {from: private-nodes, to: sts-endpoint, label: AssumeRoleWithWebIdentity (IRSA)}
    - {from: private-nodes, to: ec2-endpoint, label: DescribeInstances (node DNS name)}
    - {from: private-nodes, to: logs-endpoint, label: PutLogEvents}
    - {from: logs-endpoint, to: cluster-logs}

- slug: eks-multi-region-global-accelerator
  title: Multi-Region stateless application on EKS with Global Accelerator failover
  category: containers
  tags: [eks, multi-region, global accelerator, route 53, alb, failover]
  source: https://aws.amazon.com/blogs/containers/operating-a-multi-regional-stateless-application-using-amazon-eks/
  description: Identical stateless deployments run on EKS clusters in two Regions; each cluster's control plane lives in an AWS-owned VPC that operators reach with kubectl and attaches elastic network interfaces to the worker nodes in the customer VPC's Availability Zones, and each deployment is exposed through an ALB created by the AWS Load Balancer Controller. Global Accelerator publishes two static anycast IPs, sends 100 percent of traffic to the primary endpoint group and 0 percent to the secondary, and health-checks both ALBs so failover happens at the accelerator without waiting for DNS propagation; Route 53 maps the application domain to the accelerator.
  containers:
    - region: us-west-2
      label: primary
      account_at: [1, 2]
      at: [1, 1]
      vpcs:
        - name: primary-control-plane
          cidr: 172.16.0.0/16
          at: [1, 1]
        - name: primary-vpc
          cidr: 10.0.0.0/16
          at: [1, 2]
          subnets:
            - {name: p-private-a, cidr: 10.0.16.0/20, az: a, public: false, at: [1, 1]}
            - {name: p-private-b, cidr: 10.0.32.0/20, az: b, public: false, at: [1, 1]}
    - region: us-east-1
      label: secondary
      at: [2, 1]
      vpcs:
        - name: secondary-control-plane
          cidr: 172.17.0.0/16
          at: [1, 1]
        - name: secondary-vpc
          cidr: 10.1.0.0/16
          at: [1, 2]
          subnets:
            - {name: s-private-a, cidr: 10.1.16.0/20, az: a, public: false, at: [1, 1]}
  elements:
    - {tf: aws_globalaccelerator_accelerator, name: app-accelerator, in: account, at: [1, 2, 2, 1]}
    - {tf: aws_route53_zone, name: example-zone, in: account, at: [1, 3, 2, 1]}
    - {tf: aws_eks_cluster, name: primary-cluster, in: vpc:primary-control-plane, at: [1, 1]}
    - {tf: aws_network_interface, name: primary-eni-a, in: subnet:p-private-a, at: [1, 1]}
    - {tf: aws_instance, name: primary-node-a, in: subnet:p-private-a, at: [1, 2]}
    - {tf: aws_network_interface, name: primary-eni-b, in: subnet:p-private-b, at: [1, 1]}
    - {tf: aws_instance, name: primary-node-b, in: subnet:p-private-b, at: [1, 2]}
    - {tf: aws_lb, name: primary-alb, in: vpc:primary-vpc, at: [1, 2, 2, 1]}
    - {tf: aws_eks_cluster, name: secondary-cluster, in: vpc:secondary-control-plane, at: [1, 1]}
    - {tf: aws_network_interface, name: secondary-eni-a, in: subnet:s-private-a, at: [1, 1]}
    - {tf: aws_instance, name: secondary-node-a, in: subnet:s-private-a, at: [1, 2]}
    - {tf: aws_lb, name: secondary-alb, in: vpc:secondary-vpc, at: [1, 2, 2, 1]}
  actors:
    - {type: user, name: kubectl-operator, at: [1, 1]}
    - {type: users, name: users, at: [1, 3]}
  flows:
    - {from: kubectl-operator, to: primary-cluster, label: kubectl}
    - {from: kubectl-operator, to: secondary-cluster, label: kubectl}
    - {from: users, to: example-zone, label: DNS, step: 1}
    - {from: example-zone, to: app-accelerator, label: alias to accelerator DNS name, step: 2}
    - {from: users, to: app-accelerator, label: "TCP :443 to anycast IPs", step: 3}
    - {from: app-accelerator, to: primary-alb, label: endpoint group traffic dial 100, step: 4}
    - {from: app-accelerator, to: secondary-alb, label: endpoint group traffic dial 0 (failover)}
    - {from: primary-alb, to: primary-node-a, label: Ingress target group (pod IPs), step: 5}
    - {from: primary-alb, to: primary-node-b, label: Ingress target group (pod IPs)}
    - {from: secondary-alb, to: secondary-node-a, label: Ingress target group (pod IPs)}
    - {from: primary-cluster, to: primary-eni-a, label: control-plane ENI}
    - {from: primary-cluster, to: primary-eni-b, label: control-plane ENI}
    - {from: secondary-cluster, to: secondary-eni-a, label: control-plane ENI}
    - {from: primary-node-a, to: primary-cluster, label: kubelet to API server}
    - {from: primary-node-b, to: primary-cluster, label: kubelet to API server}
    - {from: secondary-node-a, to: secondary-cluster, label: kubelet to API server}
    - {from: primary-cluster, to: primary-alb, label: AWS Load Balancer Controller}
    - {from: secondary-cluster, to: secondary-alb, label: AWS Load Balancer Controller}

- slug: eks-anywhere-hybrid-connector
