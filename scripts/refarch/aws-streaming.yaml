    - {tf: aws_kinesis_stream, name: enriched-events, in: region, at: [1, 3, 2, 1]}
  flows:
    - {from: reference-data, to: enrichment-flink-app, label: load all reference data into task slot heap memory, step: 1}
    - {from: main-events, to: enrichment-flink-app, label: partitioned input stream, step: 2}
    - {from: enrichment-flink-app, to: enriched-events, label: output stream, step: 3}

- slug: kinesis-event-sourcing-replay
