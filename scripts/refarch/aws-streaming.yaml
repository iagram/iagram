  source: https://aws.amazon.com/blogs/database/near-real-time-processing-with-amazon-kinesis-amazon-timestream-and-grafana/
  description: Simulated IoT devices publish events to a Kinesis data stream; a Managed Service for Apache Flink application transforms records, detects out-of-order timestamps and writes them to an Amazon Timestream table. A parallel Firehose consumer archives raw events to S3, and Grafana queries Timestream for operational dashboards.
