  description: A Managed Service for Apache Flink data enrichment application preloads reference data from an S3 bucket into the heap memory of every task slot on each TaskManager when the job starts, then enriches the partitioned input stream (one partition per key such as developer, project manager or accountant) with in-memory lookups. Enriched events are written to a Kinesis output stream; the same pattern can swap the S3 preload for asynchronous per-record lookups against a database.
