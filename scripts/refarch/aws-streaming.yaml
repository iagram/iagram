# AWS reference architectures: streaming and real-time analytics
# Sources: AWS Solutions Library, AWS Big Data / Database / Compute / Mobile / ML / Architecture blogs, AWS docs.

- slug: kinesis-api-proxy-lambda-consumer
  title: Kinesis Data Streams with API Gateway proxy and Lambda consumer
  category: data
  tags: [kinesis data streams, api gateway, lambda, streaming data solution]
  source: https://docs.aws.amazon.com/solutions/latest/streaming-data-solution-for-amazon-kinesis/architecture.html
  description: Option 1 of the Streaming Data Solution for Amazon Kinesis. An API Gateway REST API acts as a proxy that writes records into a Kinesis data stream; a Lambda function consumes the stream, failed batches are recorded in an SQS queue, and a CloudWatch dashboard and alarms monitor stream health.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: processing}]
  elements:
    - {tf: aws_api_gateway_rest_api, name: ingest-api, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: data-stream, in: group:ingestion}
    - {tf: aws_lambda_function, name: record-processor, in: group:processing}
    - {tf: aws_sqs_queue, name: failed-records-queue, in: group:processing}
    - {tf: aws_cloudwatch_dashboard, name: stream-dashboard, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: iterator-age-alarm, in: region}
  actors: [client]
  flows:
    - {from: client, to: ingest-api, label: "PutRecord via HTTPS", step: 1}
    - {from: ingest-api, to: data-stream, label: Kinesis proxy integration, step: 2}
    - {from: data-stream, to: record-processor, link: aws_lambda_event_source_mapping, step: 3}
    - {from: record-processor, to: failed-records-queue, label: failed batch metadata, step: 4}
    - {from: data-stream, to: stream-dashboard, label: metrics, step: 5}

- slug: kinesis-kpl-flink-studio-s3
  title: Kinesis Producer Library to Flink Studio notebook and S3
  category: data
  tags: [kinesis data streams, kpl, managed service for apache flink, studio notebook, s3]
  source: https://docs.aws.amazon.com/streams/latest/dev/examples-streaming-solution.html
  description: Option 2 of the Streaming Data Solution for Amazon Kinesis. An EC2 instance running the Kinesis Producer Library generates records into a Kinesis data stream; a Managed Service for Apache Flink Studio notebook queries and transforms the stream with Flink SQL and writes results to an S3 bucket.
  containers:
    - region: us-east-1
      vpcs:
        - name: producer-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: producer-subnet, cidr: 10.0.1.0/24, az: a, public: true}
  elements:
    - {tf: aws_instance, name: kpl-producer, in: subnet:producer-subnet}
    - {tf: aws_kinesis_stream, name: data-stream, in: region}
    - {tf: aws_kinesisanalyticsv2_application, name: flink-studio-notebook, in: region}
    - {tf: aws_glue_catalog_database, name: notebook-catalog, in: region}
    - {tf: aws_s3_bucket, name: output-bucket, in: region}
    - {tf: aws_cloudwatch_dashboard, name: stream-dashboard, in: region}
  actors: []
  flows:
    - {from: kpl-producer, to: data-stream, label: KPL PutRecords, step: 1}
    - {from: data-stream, to: flink-studio-notebook, label: Flink Kinesis source, step: 2}
    - {from: flink-studio-notebook, to: notebook-catalog, label: table metadata, step: 3}
    - {from: flink-studio-notebook, to: output-bucket, label: Flink S3 sink, step: 4}
    - {from: data-stream, to: stream-dashboard, label: metrics, step: 5}

- slug: msk-lambda-firehose-s3
  title: Amazon MSK with Lambda consumer and Firehose delivery to S3
  category: data
  tags: [msk, kafka, lambda, firehose, s3, streaming data solution]
  source: https://docs.aws.amazon.com/solutions/latest/streaming-data-solution-for-amazon-msk/architecture-overview.html
  description: Option 3 of the Streaming Data Solution for Amazon MSK. An EC2 client produces to an MSK cluster inside a VPC; a Lambda function consumes the Kafka topic through an event source mapping and forwards records to a Firehose delivery stream that buffers and writes them to S3.
  containers:
    - region: us-east-1
      vpcs:
        - name: msk-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: broker-a, cidr: 10.0.1.0/24, az: a}
            - {name: broker-b, cidr: 10.0.2.0/24, az: b}
            - {name: client-subnet, cidr: 10.0.10.0/24, az: a, public: true}
  elements:
    - {tf: aws_instance, name: kafka-client, in: subnet:client-subnet}
    - {tf: aws_msk_cluster, name: msk-cluster, in: vpc:msk-vpc}
    - {tf: aws_lambda_function, name: topic-consumer, in: vpc:msk-vpc}
    - {tf: aws_kinesis_firehose_delivery_stream, name: delivery-stream, in: region}
    - {tf: aws_s3_bucket, name: output-bucket, in: region}
    - {tf: aws_cloudwatch_dashboard, name: msk-dashboard, in: region}
  actors: []
  flows:
    - {from: kafka-client, to: msk-cluster, label: Kafka produce, step: 1}
    - {from: msk-cluster, to: topic-consumer, link: aws_lambda_event_source_mapping, step: 2}
    - {from: topic-consumer, to: delivery-stream, label: PutRecordBatch, step: 3}
    - {from: delivery-stream, to: output-bucket, label: buffered delivery, step: 4}
    - {from: msk-cluster, to: msk-dashboard, label: broker metrics, step: 5}

