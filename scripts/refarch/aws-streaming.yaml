- slug: clickstream-anomaly-kinesis-opensearch
  title: Near real-time clickstream anomaly detection to OpenSearch
  category: analytics-bi
  tags: [kinesis data streams, kinesis data analytics, random cut forest, firehose, opensearch, clickstream]
  source: https://aws.amazon.com/blogs/big-data/perform-near-real-time-analytics-on-streaming-data-with-amazon-kinesis-and-amazon-elasticsearch-service/
  description: Web clickstream events are ingested into a Kinesis data stream and scored by a Kinesis Data Analytics application using the RANDOM_CUT_FOREST anomaly detection function. Scored records are exported through a Firehose delivery stream into an OpenSearch Service domain, where dashboards visualize anomalies in near real time.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: analytics}]
  elements:
    - {tf: aws_kinesis_stream, name: clickstream, in: group:ingestion}
    - {tf: aws_kinesisanalyticsv2_application, name: anomaly-detector, in: group:analytics}
    - {tf: aws_kinesis_stream, name: scored-stream, in: group:analytics}
    - {tf: aws_kinesis_firehose_delivery_stream, name: opensearch-delivery, in: group:analytics}
    - {tf: aws_opensearch_domain, name: clickstream-domain, in: region}
    - {tf: aws_s3_bucket, name: firehose-backup, in: region}
  actors: [users]
  flows:
    - {from: users, to: clickstream, label: page views and clicks, step: 1}
    - {from: clickstream, to: anomaly-detector, label: streaming SQL input, step: 2}
    - {from: anomaly-detector, to: scored-stream, label: anomaly scores, step: 3}
    - {from: scored-stream, to: opensearch-delivery, label: Firehose source, step: 4}
    - {from: opensearch-delivery, to: clickstream-domain, label: index documents, step: 5}
    - {from: opensearch-delivery, to: firehose-backup, label: failed records backup, step: 6}

- slug: redshift-streaming-ingestion-kinesis
  title: Redshift streaming ingestion from Kinesis Data Streams
  category: analytics-bi
  tags: [redshift, streaming ingestion, materialized view, kinesis data streams, quicksight]
  source: https://aws.amazon.com/blogs/big-data/real-time-analytics-with-amazon-redshift-streaming-ingestion/
  description: Amazon Redshift streaming ingestion consumes a Kinesis data stream directly through a materialized view, removing the S3 staging step of the traditional Firehose and COPY pipeline. Transformations run in Redshift SQL against the auto-refreshed view and QuickSight visualizes the results with seconds of latency.
  containers:
    - region: us-east-1
      vpcs:
        - name: analytics-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: redshift-a, cidr: 10.0.1.0/24, az: a}
            - {name: redshift-b, cidr: 10.0.2.0/24, az: b}
  elements:
    - {tf: aws_kinesis_stream, name: events-stream, in: region}
    - {tf: aws_redshift_cluster, name: analytics-cluster, in: vpc:analytics-vpc}
    - {tf: aws_iam_role, name: redshift-stream-role, in: region}
    - {tf: aws_s3_bucket, name: legacy-staging-bucket, in: region}
    - {tf: aws_kinesis_firehose_delivery_stream, name: legacy-delivery, in: region}
    - {tf: aws_quicksight_data_source, name: redshift-source, in: region}
  actors: [client, users]
  flows:
    - {from: client, to: events-stream, label: Kinesis Data Generator, step: 1}
    - {from: events-stream, to: analytics-cluster, label: streaming materialized view, step: 2}
    - {from: events-stream, to: legacy-delivery, label: "legacy path: Firehose", step: 3}
    - {from: legacy-delivery, to: legacy-staging-bucket, label: staged files, step: 4}
    - {from: legacy-staging-bucket, to: analytics-cluster, label: COPY, step: 5}
    - {from: analytics-cluster, to: redshift-source, label: SQL queries, step: 6}
    - {from: redshift-source, to: users, label: dashboards, step: 7}

- slug: redshift-ml-streaming-fraud-detection
  title: Near real-time fraud detection with Redshift streaming ingestion and Redshift ML
  category: analytics-bi
  tags: [fraud detection, redshift ml, streaming ingestion, kinesis data streams]
  source: https://aws.amazon.com/blogs/big-data/near-real-time-fraud-detection-using-amazon-redshift-streaming-ingestion-with-amazon-kinesis-data-streams-and-amazon-redshift-ml
  description: A producer on EC2 simulates credit card transactions into a Kinesis data stream, which Redshift ingests through a streaming materialized view. A Redshift ML model trained on historical transactions scores the incoming records with a SQL prediction function so fraudulent transactions are flagged within seconds.
  containers:
    - region: us-east-1
      vpcs:
        - name: fraud-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: app-subnet, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: redshift-a, cidr: 10.0.1.0/24, az: a}
            - {name: redshift-b, cidr: 10.0.2.0/24, az: b}
  elements:
    - {tf: aws_instance, name: transaction-simulator, in: subnet:app-subnet}
    - {tf: aws_kinesis_stream, name: transactions-stream, in: region}
    - {tf: aws_redshift_cluster, name: fraud-cluster, in: vpc:fraud-vpc}
    - {tf: aws_s3_bucket, name: training-data-bucket, in: region}
    - {tf: aws_sagemaker_model, name: fraud-model, in: region}
    - {tf: aws_iam_role, name: redshift-ml-role, in: region}
  actors: [users]
  flows:
    - {from: transaction-simulator, to: transactions-stream, label: PutRecords, step: 1}
    - {from: transactions-stream, to: fraud-cluster, label: streaming materialized view, step: 2}
    - {from: training-data-bucket, to: fraud-cluster, label: historical training set, step: 3}
    - {from: fraud-cluster, to: fraud-model, label: CREATE MODEL via SageMaker Autopilot, step: 4}
    - {from: fraud-cluster, to: users, label: fraud predictions, step: 5}

- slug: flink-sagemaker-in-stream-inference
  title: Real-time in-stream fraud inference with Flink and SageMaker
  category: ml
  tags: [fraud detection, managed service for apache flink, sagemaker, api gateway, async io]
  source: https://aws.amazon.com/blogs/architecture/realtime-in-stream-inference-kinesis-sagemaker-flink/
  description: Credit card transactions are ingested into Kinesis Data Streams with the Kinesis Producer Library and processed by a Managed Service for Apache Flink application. The Flink job uses asynchronous I/O to call an API Gateway endpoint that fronts a SageMaker inference endpoint, so each transaction is scored for fraud in-stream instead of in batch.
  containers:
    - region: us-east-1
      groups: [{label: streaming}, {label: inference}]
  elements:
    - {tf: aws_kinesis_stream, name: transactions-stream, in: group:streaming}
    - {tf: aws_kinesisanalyticsv2_application, name: fraud-flink-app, in: group:streaming}
    - {tf: aws_kinesis_stream, name: scored-transactions, in: group:streaming}
    - {tf: aws_api_gateway_rest_api, name: inference-api, in: group:inference}
    - {tf: aws_sagemaker_endpoint, name: fraud-endpoint, in: group:inference}
    - {tf: aws_s3_bucket, name: model-artifacts, in: region}
    - {tf: aws_cloudwatch_log_group, name: flink-logs, in: region}
  actors: [client]
  flows:
    - {from: client, to: transactions-stream, label: KPL PutRecords, step: 1}
    - {from: transactions-stream, to: fraud-flink-app, label: Flink Kinesis source, step: 2}
    - {from: fraud-flink-app, to: inference-api, label: async HTTPS invoke, step: 3}
    - {from: inference-api, to: fraud-endpoint, label: InvokeEndpoint, step: 4}
    - {from: model-artifacts, to: fraud-endpoint, label: model artifact, step: 5}
    - {from: fraud-flink-app, to: scored-transactions, label: enriched records, step: 6}
    - {from: fraud-flink-app, to: flink-logs, label: logs, step: 7}

- slug: appsync-live-sports-realtime-updates
  title: Real-time live sports updates with Kinesis, Lambda, DynamoDB and AppSync
  category: serverless
  tags: [appsync, graphql subscriptions, kinesis data streams, lambda, dynamodb, pinpoint, real-time dashboard]
  source: https://aws.amazon.com/blogs/mobile/appsync-real-time-live-sports/
  description: Score feeds enter through an API Gateway ingestion endpoint into a Kinesis data stream; a Lambda consumer transforms the events and calls AppSync GraphQL mutations that persist them in DynamoDB and fan out to connected clients over WebSocket subscriptions. A DynamoDB Stream triggers a second Lambda that sends push notifications through Amazon Pinpoint to offline users.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: api}]
  elements:
    - {tf: aws_api_gateway_rest_api, name: feed-ingest-api, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: scores-stream, in: group:ingestion}
    - {tf: aws_lambda_function, name: transform-and-mutate, in: group:ingestion}
    - {tf: aws_appsync_graphql_api, name: live-scores-api, in: group:api}
    - {tf: aws_dynamodb_table, name: game-updates, in: group:api}
    - {tf: aws_lambda_function, name: push-notifier, in: group:api}
    - {tf: aws_pinpoint_app, name: fan-notifications, in: region}
  actors: [saas, mobile]
  flows:
    - {from: saas, to: feed-ingest-api, label: sports data feed, step: 1}
    - {from: feed-ingest-api, to: scores-stream, label: PutRecord, step: 2}
    - {from: scores-stream, to: transform-and-mutate, link: aws_lambda_event_source_mapping, step: 3}
    - {from: transform-and-mutate, to: live-scores-api, label: GraphQL mutation, step: 4}
    - {from: live-scores-api, to: game-updates, label: DynamoDB resolver, step: 5}
    - {from: live-scores-api, to: mobile, label: WebSocket subscription, step: 6}
    - {from: game-updates, to: push-notifier, link: aws_lambda_event_source_mapping, step: 7}
    - {from: push-notifier, to: fan-notifications, label: push notification, step: 8}

- slug: serverless-realtime-leaderboard
  title: Serverless real-time leaderboard with Kinesis tumbling windows
  category: serverless
  tags: [leaderboard, kinesis data streams, lambda tumbling window, dynamodb streams, iot core, api gateway]
  source: https://aws.amazon.com/blogs/compute/building-serverless-applications-with-streaming-data-part-4/
  description: Race telemetry lands in a Kinesis data stream where a Lambda consumer with tumbling windows aggregates scores every few seconds and writes them to DynamoDB, while a second consumer persists final results. DynamoDB Streams trigger a publisher Lambda that pushes updates to live leaderboards through IoT Core, and an API Gateway endpoint serves historical rankings sorted by a global secondary index.
  containers:
    - region: us-east-1
      groups: [{label: stream processing}, {label: serving}]
  elements:
    - {tf: aws_kinesis_stream, name: race-telemetry, in: group:stream processing}
    - {tf: aws_lambda_function, name: tumbling-window-aggregator, in: group:stream processing}
    - {tf: aws_lambda_function, name: final-results, in: group:stream processing}
    - {tf: aws_dynamodb_table, name: leaderboard-table, in: group:serving}
    - {tf: aws_lambda_function, name: publish-updates, in: group:serving}
    - {tf: aws_iot_topic_rule, name: leaderboard-topic, in: group:serving}
    - {tf: aws_api_gateway_rest_api, name: leaderboard-api, in: group:serving}
    - {tf: aws_lambda_function, name: get-leaderboard, in: group:serving}
  actors: [device, users]
  flows:
    - {from: device, to: race-telemetry, label: competitor metrics, step: 1}
    - {from: race-telemetry, to: tumbling-window-aggregator, link: aws_lambda_event_source_mapping, step: 2}
    - {from: race-telemetry, to: final-results, link: aws_lambda_event_source_mapping, step: 3}
    - {from: tumbling-window-aggregator, to: leaderboard-table, label: aggregated scores, step: 4}
    - {from: final-results, to: leaderboard-table, label: final scores, step: 5}
    - {from: leaderboard-table, to: publish-updates, link: aws_lambda_event_source_mapping, step: 6}
    - {from: publish-updates, to: leaderboard-topic, label: MQTT publish, step: 7}
    - {from: leaderboard-topic, to: users, label: live leaderboard, step: 8}
    - {from: users, to: leaderboard-api, label: historical results, step: 9}
    - {from: leaderboard-api, to: get-leaderboard, label: Lambda proxy, step: 10}
    - {from: get-leaderboard, to: leaderboard-table, label: query GSI, step: 11}

- slug: cloudwatch-logs-kinesis-opensearch-pipeline
  title: CloudWatch Logs to Kinesis to OpenSearch log analytics pipeline
  category: observability
  tags: [log analytics, cloudwatch logs, subscription filter, kinesis data streams, opensearch, centralized logging]
  source: https://docs.aws.amazon.com/solutions/latest/centralized-logging-with-opensearch/service-log-analytics-pipeline.html
  description: In the Centralized Logging with OpenSearch solution, service logs such as CloudTrail and VPC Flow Logs are written to CloudWatch Logs and redelivered in real time to a Kinesis data stream through a subscription filter. The stream invokes a Log Processor Lambda that parses the records and indexes them into an OpenSearch Service domain, exporting failed records to an S3 backup bucket.
  containers:
    - region: us-east-1
      vpcs:
        - name: logging-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: opensearch-a, cidr: 10.0.1.0/24, az: a}
            - {name: opensearch-b, cidr: 10.0.2.0/24, az: b}
  elements:
    - {tf: aws_cloudwatch_log_group, name: vpc-flow-logs, in: region}
    - {tf: aws_cloudwatch_log_group, name: cloudtrail-logs, in: region}
    - {tf: aws_kinesis_stream, name: log-stream, in: region}
    - {tf: aws_lambda_function, name: log-processor, in: vpc:logging-vpc}
    - {tf: aws_opensearch_domain, name: log-domain, in: vpc:logging-vpc}
    - {tf: aws_s3_bucket, name: backup-bucket, in: region}
  actors: [users]
  flows:
    - {from: vpc-flow-logs, to: log-stream, label: subscription filter, step: 1}
    - {from: cloudtrail-logs, to: log-stream, label: subscription filter, step: 2}
    - {from: log-stream, to: log-processor, link: aws_lambda_event_source_mapping, step: 3}
    - {from: log-processor, to: log-domain, label: bulk index, step: 4}
    - {from: log-processor, to: backup-bucket, label: failed records, step: 5}
    - {from: users, to: log-domain, label: OpenSearch Dashboards, step: 6}

- slug: dynamodb-cdc-kinesis-firehose-datalake
  title: Streaming DynamoDB changes into a centralized data lake
  category: data
  tags: [dynamodb, change data capture, kinesis data streams for dynamodb, firehose, s3, data lake]
  source: https://aws.amazon.com/blogs/big-data/streaming-amazon-dynamodb-data-into-a-centralized-data-lake/
  description: Kinesis Data Streams for DynamoDB captures item-level modifications from a table and replicates them to a Kinesis data stream. A Firehose delivery stream reads the stream, invokes a Lambda transformation to flatten the nested change records, and delivers compressed batches to an S3 data lake that is catalogued in Glue and queried with Athena.
  containers:
    - region: us-east-1
      groups: [{label: source}, {label: data lake}]
  elements:
    - {tf: aws_dynamodb_table, name: orders-table, in: group:source}
    - {tf: aws_kinesis_stream, name: orders-cdc-stream, in: group:source}
    - {tf: aws_kinesis_firehose_delivery_stream, name: datalake-delivery, in: group:data lake}
    - {tf: aws_lambda_function, name: flatten-transform, in: group:data lake}
    - {tf: aws_s3_bucket, name: datalake-bucket, in: group:data lake}
    - {tf: aws_glue_catalog_database, name: datalake-catalog, in: group:data lake}
    - {tf: aws_athena_workgroup, name: analysts, in: group:data lake}
  actors: [client, users]
  flows:
    - {from: client, to: orders-table, label: application writes, step: 1}
    - {from: orders-table, to: orders-cdc-stream, label: Kinesis Data Streams for DynamoDB, step: 2}
    - {from: orders-cdc-stream, to: datalake-delivery, label: Firehose source, step: 3}
    - {from: datalake-delivery, to: flatten-transform, label: data transformation, step: 4}
    - {from: datalake-delivery, to: datalake-bucket, label: compressed batches, step: 5}
    - {from: datalake-catalog, to: datalake-bucket, label: table definitions, step: 6}
    - {from: users, to: analysts, label: SQL queries, step: 7}

- slug: dms-cdc-to-kinesis
  title: Change data capture from relational databases to Kinesis with AWS DMS
  category: database
  tags: [dms, change data capture, kinesis data streams, firehose, s3, oracle]
  source: https://aws.amazon.com/blogs/database/use-the-aws-database-migration-service-to-stream-change-data-to-amazon-kinesis-data-streams/
  description: An AWS DMS replication instance reads the transaction log of a relational database such as Oracle on RDS and publishes insert, update and delete events to a Kinesis data stream as the target endpoint. Consumers such as Lambda process the changes in near real time while a Firehose delivery stream archives them to S3 for analytics.
  containers:
    - region: us-east-1
      vpcs:
        - name: data-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: db-a, cidr: 10.0.1.0/24, az: a}
            - {name: db-b, cidr: 10.0.2.0/24, az: b}
  elements:
    - {tf: aws_db_instance, name: source-oracle, in: vpc:data-vpc}
    - {tf: aws_dms_replication_instance, name: dms-replication, in: vpc:data-vpc}
    - {tf: aws_dms_endpoint, name: kinesis-target, in: region}
    - {tf: aws_kinesis_stream, name: cdc-stream, in: region}
    - {tf: aws_lambda_function, name: change-consumer, in: region}
    - {tf: aws_kinesis_firehose_delivery_stream, name: archive-delivery, in: region}
    - {tf: aws_s3_bucket, name: cdc-archive, in: region}
  actors: [client]
  flows:
    - {from: client, to: source-oracle, label: OLTP writes, step: 1}
    - {from: source-oracle, to: dms-replication, label: transaction log CDC, step: 2}
    - {from: dms-replication, to: kinesis-target, label: DMS task, step: 3}
    - {from: kinesis-target, to: cdc-stream, label: PutRecords JSON, step: 4}
    - {from: cdc-stream, to: change-consumer, link: aws_lambda_event_source_mapping, step: 5}
    - {from: cdc-stream, to: archive-delivery, label: Firehose source, step: 6}
    - {from: archive-delivery, to: cdc-archive, label: archive, step: 7}

- slug: msk-connect-debezium-cdc
  title: End-to-end CDC with MSK Connect, Debezium and Glue Schema Registry
  category: data
  tags: [msk connect, debezium, kafka connect, aurora mysql, glue schema registry, s3 sink]
  source: https://aws.amazon.com/blogs/big-data/build-an-end-to-end-change-data-capture-with-amazon-msk-connect-and-aws-glue-schema-registry/
  description: A Debezium MySQL source connector on MSK Connect monitors an Aurora MySQL cluster and pushes row-level changes to Kafka topics on an MSK cluster, serializing records against schemas in the AWS Glue Schema Registry. A Confluent S3 sink connector, also on MSK Connect, deserializes the topics and writes Parquet files to an S3 bucket for downstream consumers.
  containers:
    - region: us-east-1
      vpcs:
        - name: cdc-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: private-a, cidr: 10.0.1.0/24, az: a}
            - {name: private-b, cidr: 10.0.2.0/24, az: b}
            - {name: private-c, cidr: 10.0.3.0/24, az: c}
  elements:
    - {tf: aws_rds_cluster, name: aurora-mysql, in: vpc:cdc-vpc}
    - {tf: aws_mskconnect_connector, name: debezium-source, in: vpc:cdc-vpc}
    - {tf: aws_msk_cluster, name: msk-cluster, in: vpc:cdc-vpc}
    - {tf: aws_glue_registry, name: schema-registry, in: region}
    - {tf: aws_mskconnect_connector, name: s3-sink, in: vpc:cdc-vpc}
    - {tf: aws_s3_bucket, name: cdc-bucket, in: region}
    - {tf: aws_mskconnect_custom_plugin, name: connector-plugins, in: region}
  actors: [client]
  flows:
    - {from: client, to: aurora-mysql, label: transactions, step: 1}
    - {from: aurora-mysql, to: debezium-source, label: binlog CDC, step: 2}
    - {from: debezium-source, to: schema-registry, label: register schema, step: 3}
    - {from: debezium-source, to: msk-cluster, label: change events to topics, step: 4}
    - {from: msk-cluster, to: s3-sink, label: consume topics, step: 5}
    - {from: s3-sink, to: schema-registry, label: fetch schema, step: 6}
    - {from: s3-sink, to: cdc-bucket, label: Parquet objects, step: 7}
    - {from: connector-plugins, to: debezium-source, label: custom plugin, step: 8}

- slug: kinesis-video-rekognition-face-analysis
