    - {from: streaming-join-job, to: hudi-datalake, label: Hudi upsert, step: 6}
    - {from: streaming-join-job, to: enriched-catalog, label: sync table, step: 7}
    - {from: users, to: analytics, label: Athena SQL, step: 8}
