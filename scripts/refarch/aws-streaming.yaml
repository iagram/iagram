    - region: us-east-1
      vpcs:
        - name: msk-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: broker-a, cidr: 10.0.1.0/24, az: a}
            - {name: broker-b, cidr: 10.0.2.0/24, az: b}
            - {name: broker-c, cidr: 10.0.3.0/24, az: c}
  elements:
    - {tf: aws_instance, name: kafka-producer, in: subnet:broker-a}
    - {tf: aws_msk_cluster, name: msk-cluster, in: vpc:msk-vpc}
    - {tf: aws_kinesisanalyticsv2_application, name: flink-app, in: vpc:msk-vpc}
    - {tf: aws_s3_bucket, name: flink-code-bucket, in: region}
    - {tf: aws_s3_bucket, name: output-bucket, in: region}
    - {tf: aws_cloudwatch_log_group, name: flink-logs, in: region}
  actors: []
  flows:
    - {from: kafka-producer, to: msk-cluster, label: Kafka produce, step: 1}
    - {from: msk-cluster, to: flink-app, label: Flink Kafka source, step: 2}
    - {from: flink-code-bucket, to: flink-app, label: application JAR, step: 3}
    - {from: flink-app, to: output-bucket, label: Flink FileSink, step: 4}
    - {from: flink-app, to: flink-logs, label: application logs, step: 5}

- slug: clickstream-anomaly-kinesis-opensearch
  title: Near real-time clickstream anomaly detection to OpenSearch
  category: analytics-bi
  tags: [kinesis data streams, kinesis data analytics, random cut forest, firehose, opensearch, clickstream]
  source: https://aws.amazon.com/blogs/big-data/perform-near-real-time-analytics-on-streaming-data-with-amazon-kinesis-and-amazon-elasticsearch-service/
  description: Clickstream events from sensors and web clients are ingested into a Kinesis data stream and scored by a Kinesis Data Analytics application using the RANDOM_CUT_FOREST anomaly detection function. The application writes the scored records to a Firehose delivery stream that indexes them into an OpenSearch Service domain, where dashboards visualize anomalies in near real time.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_kinesis_stream, name: clickstream, in: region, at: [1, 1]}
    - {tf: aws_kinesisanalyticsv2_application, name: anomaly-detector, in: region, at: [1, 2]}
    - {tf: aws_kinesis_firehose_delivery_stream, name: opensearch-delivery, in: region, at: [1, 3]}
    - {tf: aws_opensearch_domain, name: clickstream-domain, in: region, at: [1, 4]}
  actors: [{type: device, name: sensors, at: [1, 1]}]
  flows:
    - {from: sensors, to: clickstream, label: clickstream events, step: 1}
    - {from: clickstream, to: anomaly-detector, label: streaming SQL input, step: 2}
    - {from: anomaly-detector, to: opensearch-delivery, label: anomaly scores, step: 3}
    - {from: opensearch-delivery, to: clickstream-domain, label: index documents, step: 4}

- slug: redshift-streaming-ingestion-kinesis
  title: Redshift streaming ingestion from Kinesis Data Streams
  category: analytics-bi
  tags: [redshift, streaming ingestion, materialized view, kinesis data streams, quicksight]
  source: https://aws.amazon.com/blogs/big-data/real-time-analytics-with-amazon-redshift-streaming-ingestion/
  description: Amazon Redshift streaming ingestion consumes a Kinesis data stream or an Amazon MSK topic directly into a streaming table that a real-time materialized view refreshes, removing the S3 staging step of the traditional Firehose and COPY pipeline. Transformations run in Redshift SQL against the auto-refreshed view and its results are joined with permanent tables with seconds of latency.
  containers:
    - region: us-east-1
      groups: [{label: Amazon Redshift, at: [1, 2, 2, 1]}]
  elements:
    - {tf: aws_kinesis_stream, name: events-stream, in: region, at: [1, 1]}
    - {tf: aws_msk_cluster, name: msk-source, in: region, at: [2, 1]}
    - {tf: aws_redshift_cluster, name: analytics-cluster, in: group:Amazon Redshift, at: [1, 1]}
    - {tf: aws_redshiftdata_statement, name: realtime-materialized-view, in: group:Amazon Redshift, at: [1, 2]}
    - {tf: aws_redshiftdata_statement, name: streaming-table, in: group:Amazon Redshift, at: [2, 1]}
    - {tf: aws_redshiftdata_statement, name: permanent-tables, in: group:Amazon Redshift, at: [2, 2]}
  actors: [{type: client, at: [1, 1]}]
  flows:
    - {from: client, to: events-stream, label: producers, step: 1}
    - {from: client, to: msk-source, label: producers, step: 1}
    - {from: events-stream, to: streaming-table, label: streaming ingestion, step: 2}
    - {from: msk-source, to: streaming-table, label: streaming ingestion, step: 2}
    - {from: streaming-table, to: realtime-materialized-view, label: REFRESH MATERIALIZED VIEW, step: 3}
    - {from: realtime-materialized-view, to: permanent-tables, label: join and load, step: 4}

- slug: redshift-ml-streaming-fraud-detection
  title: Near real-time fraud detection with Redshift streaming ingestion and Redshift ML
  category: analytics-bi
  tags: [fraud detection, redshift ml, streaming ingestion, kinesis data streams]
  source: https://aws.amazon.com/blogs/big-data/near-real-time-fraud-detection-using-amazon-redshift-streaming-ingestion-with-amazon-kinesis-data-streams-and-amazon-redshift-ml
  description: A Python Boto3 producer on EC2 simulates credit card transactions into a Kinesis data stream, which Redshift ingests through a streaming materialized view. A Redshift ML model trained on the customer payment history scores the incoming records into a predictions table, and a Lambda function reads the flagged transactions to alert customers through Amazon Pinpoint and to block the card in the payment application.
  containers:
    - region: us-east-1
      groups: [{label: Stream Producer, at: [1, 1]}, {label: Stream Consumer, at: [1, 3]}]
  elements:
    - {tf: aws_ec2_fleet, name: transaction-simulator, in: group:Stream Producer, at: [1, 1]}
    - {tf: aws_kinesis_stream, name: transactions-stream, in: region, at: [1, 2]}
    - {tf: aws_redshiftdata_statement, name: streaming-materialized-view, in: group:Stream Consumer, at: [1, 1, 1, 2]}
    - {tf: aws_sagemaker_model, name: fraud-model, in: group:Stream Consumer, at: [2, 2]}
    - {tf: aws_redshiftdata_statement, name: predictions-table, in: group:Stream Consumer, at: [2, 3]}
    - {tf: aws_redshiftdata_statement, name: customer-payment-history, in: group:Stream Consumer, at: [3, 1]}
    - {tf: aws_redshift_cluster, name: fraud-cluster, in: group:Stream Consumer, at: [3, 3]}
    - {tf: aws_lambda_function, name: alert-handler, in: region, at: [1, 4]}
    - {tf: aws_pinpoint_app, name: customer-alerts, in: region, at: [1, 5]}
  actors: [{type: users, name: customers, at: [1, 2]}, {type: server, name: payment application, at: [2, 2]}]
  flows:
    - {from: transaction-simulator, to: transactions-stream, label: PutRecords, step: 1}
    - {from: transactions-stream, to: streaming-materialized-view, label: Redshift streaming ingestion, step: 2}
    - {from: streaming-materialized-view, to: fraud-model, label: streaming data ingestion, step: 3}
    - {from: customer-payment-history, to: fraud-model, label: training and test sets (CREATE MODEL), step: 4}
    - {from: fraud-model, to: predictions-table, label: deployed model predictions, step: 5}
    - {from: fraud-cluster, to: predictions-table, label: customer data}
    - {from: predictions-table, to: alert-handler, label: flagged transactions, step: 6}
    - {from: alert-handler, to: customer-alerts, label: alert customers}
    - {from: customer-alerts, to: customers, label: notifications}
    - {from: alert-handler, to: payment application, label: block credit card}

- slug: flink-sagemaker-in-stream-inference
  title: Real-time in-stream fraud inference with Flink and SageMaker
  category: ml
  tags: [fraud detection, managed service for apache flink, sagemaker, api gateway, async io]
  source: https://aws.amazon.com/blogs/architecture/realtime-in-stream-inference-kinesis-sagemaker-flink/
  description: A producer on an EC2 instance writes credit card transactions into Kinesis Data Streams with the Kinesis Producer Library and a Managed Service for Apache Flink application processes them. The Flink job uses asynchronous I/O to call an API Gateway endpoint backed by a Lambda function, or optionally a SageMaker inference endpoint, so each transaction is scored for fraud in-stream while CloudWatch metrics and alarms monitor the application.
  containers:
    - region: us-east-1
      groups:
        - {label: CloudWatch console, at: [1, 2, 1, 2]}
        - {label: options, at: [3, 4, 1, 2]}
  elements:
    - {tf: aws_ec2_fleet, name: transaction-producer, in: region, at: [2, 1]}
    - {tf: aws_kinesis_stream, name: transactions-stream, in: region, at: [2, 2]}
    - {tf: aws_kinesisanalyticsv2_application, name: fraud-flink-app, in: region, at: [2, 3]}
    - {tf: aws_api_gateway_rest_api, name: inference-api, in: region, at: [2, 4]}
    - {tf: aws_lambda_function, name: inference-function, in: region, at: [2, 5]}
    - {tf: aws_sagemaker_endpoint, name: fraud-endpoint, in: group:options, at: [1, 1]}
    - {tf: aws_cloudwatch_log_group, name: flink-logs, in: group:CloudWatch console, at: [1, 1]}
    - {tf: aws_cloudwatch_metric_alarm, name: flink-alarms, in: group:CloudWatch console, at: [1, 2]}
  flows:
    - {from: transaction-producer, to: transactions-stream, label: KPL PutRecords, step: 1}
    - {from: transactions-stream, to: fraud-flink-app, label: Flink Kinesis source, step: 2}
    - {from: fraud-flink-app, to: inference-api, label: async HTTPS invoke, step: 3}
    - {from: inference-api, to: inference-function, label: Lambda integration, step: 4}
    - {from: inference-api, to: fraud-endpoint, label: "option: InvokeEndpoint", step: 5}
    - {from: fraud-flink-app, to: flink-logs, label: metrics and logs, step: 6}
    - {from: flink-logs, to: flink-alarms, label: alarms, step: 7}

- slug: appsync-live-sports-realtime-updates
  title: Real-time live sports updates with Kinesis, Lambda, DynamoDB and AppSync
  category: serverless
  tags: [appsync, graphql subscriptions, kinesis data streams, lambda, dynamodb, pinpoint, real-time dashboard]
  source: https://aws.amazon.com/blogs/mobile/appsync-real-time-live-sports/
  description: Score feeds enter through an API Gateway ingestion endpoint into a Kinesis data stream; a Lambda consumer transforms the events and calls AppSync GraphQL mutations that persist them in DynamoDB and fan out to connected clients over WebSocket subscriptions. A DynamoDB Stream triggers a second Lambda that sends push notifications through Amazon Pinpoint to offline users.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: api}]
  elements:
    - {tf: aws_api_gateway_rest_api, name: feed-ingest-api, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: scores-stream, in: group:ingestion}
    - {tf: aws_lambda_function, name: transform-and-mutate, in: group:ingestion}
    - {tf: aws_appsync_graphql_api, name: live-scores-api, in: group:api}
    - {tf: aws_dynamodb_table, name: game-updates, in: group:api}
    - {tf: aws_lambda_function, name: push-notifier, in: group:api}
    - {tf: aws_pinpoint_app, name: fan-notifications, in: region}
  actors: [saas, mobile]
  flows:
    - {from: saas, to: feed-ingest-api, label: sports data feed, step: 1}
    - {from: feed-ingest-api, to: scores-stream, label: PutRecord, step: 2}
    - {from: scores-stream, to: transform-and-mutate, link: aws_lambda_event_source_mapping, step: 3}
    - {from: transform-and-mutate, to: live-scores-api, label: GraphQL mutation, step: 4}
    - {from: live-scores-api, to: game-updates, label: DynamoDB resolver, step: 5}
    - {from: live-scores-api, to: mobile, label: WebSocket subscription, step: 6}
    - {from: game-updates, to: push-notifier, link: aws_lambda_event_source_mapping, step: 7}
    - {from: push-notifier, to: fan-notifications, label: push notification, step: 8}

- slug: serverless-realtime-leaderboard
  title: Serverless real-time leaderboard with Kinesis tumbling windows
  category: serverless
  tags: [leaderboard, kinesis data streams, lambda tumbling window, dynamodb streams, iot core, api gateway]
  source: https://aws.amazon.com/blogs/compute/building-serverless-applications-with-streaming-data-part-4/
  description: Race telemetry lands in a Kinesis data stream where a Lambda consumer with tumbling windows aggregates scores every few seconds and writes them to a DynamoDB table, while a second consumer records final race results in a second table. DynamoDB Streams trigger a publisher Lambda that pushes updates to the live leaderboard through an IoT Core topic, and an API Gateway endpoint with a fetch-results Lambda serves the final rankings to the bike frontend application.
  containers:
    - region: us-east-1
      account_at: [1, 1]
      groups: [{label: Real-time updates, at: [1, 2]}, {label: Record final race results, at: [2, 2]}]
  elements:
    - {tf: aws_kinesis_stream, name: race-telemetry, in: region, at: [1, 1, 2, 1]}
    - {tf: aws_lambda_function, name: tumbling-window-aggregator, in: group:Real-time updates, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: leaderboard-table, in: group:Real-time updates, at: [1, 2]}
    - {tf: aws_lambda_function, name: publish-updates, in: region, at: [1, 3]}
    - {tf: aws_iot_topic_rule, name: leaderboard-topic, in: region, at: [1, 4]}
    - {tf: aws_lambda_function, name: final-results, in: group:Record final race results, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: race-results-table, in: group:Record final race results, at: [1, 2]}
    - {tf: aws_lambda_function, name: fetch-results, in: region, at: [2, 3]}
    - {tf: aws_api_gateway_rest_api, name: leaderboard-api, in: region, at: [2, 4]}
  actors: [{type: users, name: bike frontend application, at: [1, 2]}]
  flows:
    - {from: race-telemetry, to: tumbling-window-aggregator, link: aws_lambda_event_source_mapping, step: 1}
    - {from: tumbling-window-aggregator, to: leaderboard-table, label: aggregated scores}
    - {from: leaderboard-table, to: publish-updates, link: aws_lambda_event_source_mapping, step: 2}
    - {from: publish-updates, to: leaderboard-topic, label: MQTT publish}
    - {from: leaderboard-topic, to: bike frontend application, label: live leaderboard}
    - {from: race-telemetry, to: final-results, link: aws_lambda_event_source_mapping, step: 3}
    - {from: final-results, to: race-results-table, label: final scores}
    - {from: bike frontend application, to: leaderboard-api, label: fetch final results, step: 4}
    - {from: leaderboard-api, to: fetch-results, label: Lambda proxy}
    - {from: fetch-results, to: race-results-table, label: query results}

- slug: cloudwatch-logs-kinesis-opensearch-pipeline
  title: CloudWatch Logs to Kinesis to OpenSearch log analytics pipeline
  category: observability
  tags: [log analytics, cloudwatch logs, subscription filter, kinesis data streams, opensearch, centralized logging]
  source: https://docs.aws.amazon.com/solutions/latest/centralized-logging-with-opensearch/service-log-analytics-pipeline.html
  description: In the Centralized Logging with OpenSearch solution, service logs such as CloudTrail and VPC Flow Logs are written to CloudWatch Logs and redelivered in real time to a Kinesis data stream through a subscription filter. The stream invokes a Log Processor Lambda that parses the records and indexes them into an OpenSearch Service domain, exporting failed records to an S3 backup bucket.
  containers:
    - region: us-east-1
      vpcs:
        - name: logging-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: opensearch-a, cidr: 10.0.1.0/24, az: a}
            - {name: opensearch-b, cidr: 10.0.2.0/24, az: b}
  elements:
    - {tf: aws_cloudwatch_log_group, name: vpc-flow-logs, in: region}
    - {tf: aws_cloudwatch_log_group, name: cloudtrail-logs, in: region}
    - {tf: aws_kinesis_stream, name: log-stream, in: region}
    - {tf: aws_lambda_function, name: log-processor, in: vpc:logging-vpc}
    - {tf: aws_opensearch_domain, name: log-domain, in: vpc:logging-vpc}
    - {tf: aws_s3_bucket, name: backup-bucket, in: region}
  actors: [users]
  flows:
    - {from: vpc-flow-logs, to: log-stream, label: subscription filter, step: 1}
    - {from: cloudtrail-logs, to: log-stream, label: subscription filter, step: 2}
    - {from: log-stream, to: log-processor, link: aws_lambda_event_source_mapping, step: 3}
    - {from: log-processor, to: log-domain, label: bulk index, step: 4}
    - {from: log-processor, to: backup-bucket, label: failed records, step: 5}
    - {from: users, to: log-domain, label: OpenSearch Dashboards, step: 6}

- slug: dynamodb-cdc-kinesis-firehose-datalake
  title: Streaming DynamoDB changes into a centralized data lake
  category: data
  tags: [dynamodb, change data capture, kinesis data streams for dynamodb, firehose, s3, data lake]
  source: https://aws.amazon.com/blogs/big-data/streaming-amazon-dynamodb-data-into-a-centralized-data-lake/
  description: Kinesis Data Streams for DynamoDB captures item-level modifications from a table and replicates them to a Kinesis data stream. A Firehose delivery stream reads the stream, invokes a Lambda transformation running in a private subnet through a Firehose VPC endpoint to flatten the nested change records, and delivers compressed batches to an S3 data lake bucket.
  containers:
    - region: us-east-1
      vpcs:
        - name: transform-vpc
          cidr: 10.0.0.0/16
          at: [2, 3, 1, 2]
          subnets:
            - {name: private-a, cidr: 10.0.1.0/24, at: [1, 1]}
  elements:
    - {tf: aws_dynamodb_table, name: orders-table, in: region, at: [1, 1]}
    - {tf: aws_kinesis_stream, name: orders-cdc-stream, in: region, at: [1, 2]}
    - {tf: aws_kinesis_firehose_delivery_stream, name: datalake-delivery, in: region, at: [1, 3]}
    - {tf: aws_s3_bucket, name: datalake-bucket, in: region, at: [1, 4]}
    - {tf: aws_vpc_endpoint, name: firehose-endpoint, in: vpc:transform-vpc, at: [1, 2]}
