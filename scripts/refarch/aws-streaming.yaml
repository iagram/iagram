    - {from: face-search-processor, to: face-matches, label: match records, step: 4}
    - {from: face-matches, to: match-handler, link: aws_lambda_event_source_mapping, step: 5}
    - {from: match-handler, to: match-alerts, label: Publish, step: 6}
    - {from: match-alerts, to: users, label: email, step: 7}

- slug: kinesis-flink-timestream-grafana
  title: Near real-time IoT time series processing with Kinesis, Flink, Timestream and Grafana
  category: iot
