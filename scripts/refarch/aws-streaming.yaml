- slug: flink-streaming-data-enrichment
  title: Streaming data enrichment patterns in Managed Service for Apache Flink
  category: data
  tags: [stream enrichment, managed service for apache flink, async io, dynamodb, reference data, kinesis data streams]
  source: https://aws.amazon.com/blogs/big-data/common-streaming-data-enrichment-patterns-in-amazon-managed-service-for-apache-flink/
  description: A Managed Service for Apache Flink application enriches each event on the main Kinesis data stream with reference data, either by asynchronous per-record lookups against DynamoDB or by joining against a second reference stream fed by change data capture. Enriched events are written to an output stream and delivered to S3 by Firehose.
  containers:
    - region: us-east-1
      groups: [{label: streams}, {label: reference data}]
  elements:
    - {tf: aws_kinesis_stream, name: main-events, in: group:streams}
    - {tf: aws_kinesis_stream, name: reference-updates, in: group:streams}
    - {tf: aws_dynamodb_table, name: reference-table, in: group:reference data}
    - {tf: aws_kinesisanalyticsv2_application, name: enrichment-flink-app, in: region}
    - {tf: aws_kinesis_stream, name: enriched-events, in: group:streams}
    - {tf: aws_kinesis_firehose_delivery_stream, name: enriched-delivery, in: region}
    - {tf: aws_s3_bucket, name: enriched-bucket, in: region}
  actors: [client, database]
  flows:
    - {from: client, to: main-events, label: raw events, step: 1}
    - {from: database, to: reference-updates, label: CDC of reference data, step: 2}
    - {from: main-events, to: enrichment-flink-app, label: main stream, step: 3}
    - {from: reference-updates, to: enrichment-flink-app, label: reference stream join, step: 4}
    - {from: enrichment-flink-app, to: reference-table, label: async lookup, step: 5}
    - {from: enrichment-flink-app, to: enriched-events, label: enriched records, step: 6}
    - {from: enriched-events, to: enriched-delivery, label: Firehose source, step: 7}
    - {from: enriched-delivery, to: enriched-bucket, label: delivery, step: 8}

- slug: kinesis-event-sourcing-replay
  title: Event-sourcing microservices with Kinesis replay and Flink state snapshots
  category: serverless
  tags: [event sourcing, event replay, kinesis data streams, retention, managed service for apache flink, lambda]
  source: https://aws.amazon.com/blogs/big-data/architectural-patterns-for-real-time-analytics-using-amazon-kinesis-data-streams-part-1/
  description: Kinesis Data Streams acts as the centralized event store for event-sourcing microservices, retaining events for up to 365 days so consumers can replay them by resetting their position. A Managed Service for Apache Flink application maintains stateful aggregates with snapshots persisted to S3, and emits derived events to output streams consumed by Lambda-based microservices behind API Gateway.
  containers:
    - region: us-east-1
      groups: [{label: event store}, {label: microservices}]
  elements:
    - {tf: aws_kinesis_stream, name: event-store, in: group:event store}
    - {tf: aws_kinesisanalyticsv2_application, name: stateful-processor, in: region}
    - {tf: aws_s3_bucket, name: state-snapshots, in: region}
    - {tf: aws_kinesis_stream, name: derived-events, in: group:event store}
    - {tf: aws_lambda_function, name: order-service, in: group:microservices}
    - {tf: aws_lambda_function, name: replay-consumer, in: group:microservices}
    - {tf: aws_api_gateway_rest_api, name: commands-api, in: group:microservices}
  actors: [client]
  flows:
    - {from: client, to: commands-api, label: commands, step: 1}
    - {from: commands-api, to: event-store, label: append events, step: 2}
    - {from: event-store, to: stateful-processor, label: Flink Kinesis source, step: 3}
    - {from: stateful-processor, to: state-snapshots, label: state snapshots, step: 4}
    - {from: stateful-processor, to: derived-events, label: aggregated events, step: 5}
    - {from: derived-events, to: order-service, link: aws_lambda_event_source_mapping, step: 6}
    - {from: event-store, to: replay-consumer, label: "replay: TRIM_HORIZON or AT_TIMESTAMP", step: 7}

