    - {tf: aws_rds_cluster, name: aurora-reference-db, in: vpc:source-vpc}
    - {tf: aws_dms_replication_instance, name: reference-replication, in: vpc:source-vpc}
    - {tf: aws_dynamodb_table, name: reference-lookup, in: region}
    - {tf: aws_kinesis_stream, name: app-events, in: region}
    - {tf: aws_glue_job, name: streaming-join-job, in: region}
    - {tf: aws_s3_bucket, name: hudi-datalake, in: region}
    - {tf: aws_glue_catalog_database, name: enriched-catalog, in: region}
    - {tf: aws_athena_workgroup, name: analytics, in: region}
  actors: [client, users]
  flows:
