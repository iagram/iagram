    - {tf: aws_kinesis_firehose_delivery_stream, name: raw-archive-delivery, in: group:storage}
    - {tf: aws_s3_bucket, name: raw-events-bucket, in: group:storage}
    - {tf: aws_grafana_workspace, name: ops-grafana, in: region}
