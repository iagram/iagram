    - {tf: google_healthcare_fhir_store, name: fhir-store, in: project:health-prj}
    - {tf: google_bigquery_dataset, name: fhir-analytics, in: project:health-prj}
    - {tf: google_pubsub_topic, name: fhir-notifications, in: project:health-prj}
    - {tf: google_cloudfunctions2_function, name: fhir-event-fn, in: project:health-prj}
    - {tf: google_storage_bucket, name: fhir-import-bucket, in: project:health-prj}
  actors: [users, saas]
  flows:
    - {from: users, to: clinical-app-glb, label: clinicians HTTPS, step: 1}
    - {from: clinical-app-glb, to: clinical-app, label: serverless NEG, step: 2}
    - {from: clinical-app, to: fhir-store, label: FHIR REST read/write, step: 3}
    - {from: clinical-dataset, to: fhir-store, label: contains}
    - {from: fhir-store, to: fhir-analytics, label: streaming export (StreamConfigs), step: 4}
    - {from: fhir-store, to: fhir-notifications, label: resource change notification, step: 5}
    - {from: fhir-notifications, to: fhir-event-fn, link: google_pubsub_subscription}
    - {from: saas, to: fhir-import-bucket, label: EHR bulk FHIR bundles, step: 6}
    - {from: fhir-import-bucket, to: fhir-store, label: FHIR import, step: 7}
    - {from: users, to: fhir-analytics, label: analysts SQL / Looker, step: 8}

- slug: financial-services-data-mesh
  title: Financial services data mesh with domain BigQuery products, Dataplex and Analytics Hub
  category: data
  tags: [data mesh, financial services, bigquery, dataplex, analytics hub, domain ownership]
  source: https://docs.cloud.google.com/architecture/design-self-service-data-platform-data-mesh
  description: A central data platform team runs a self-service data platform whose common services are a metadata and discovery layer (Data Catalog tag templates and lineage, Knowledge Catalog logical data organisation and glossary) and central policy management (policy tag taxonomies), plus a data products development environment template that bundles data operations (IAM groups, Cloud Logging, Cloud Monitoring freshness alerts), data storage (Cloud Storage, BigQuery, Bigtable, Pub/Sub), data processing (Dataflow, Managed Service for Apache Spark), an Agent Platform endpoint and a Cloud Run data product interface. A data workspace project factory built from Cloud Build and Terraform templates provisions the domain projects (for example payments) where Pub/Sub and Dataflow feed BigQuery data products catalogued as Dataplex lake assets and shared through an Analytics Hub exchange.
  containers:
    - project: data-platform-prj
      region: europe-west1
      account_at: [1, 1, 2, 1]
      groups:
        - {label: metadata-discovery, at: [1, 1]}
        - {label: central-policy, at: [1, 2]}
        - {label: product-template, at: [2, 1, 1, 2]}
        - {label: project-factory, at: [3, 1]}
    - project: payments-domain-prj
      region: europe-west1
      account_at: [1, 2]
  elements:
    - {tf: google_dataplex_aspect_type, name: catalog-tag-templates, in: group:metadata-discovery, at: [1, 1]}
    - {tf: google_data_catalog_entry, name: catalog-lineage-entries, in: group:metadata-discovery, at: [1, 2]}
    - {tf: google_dataplex_glossary, name: logical-data-glossary, in: group:metadata-discovery, at: [1, 3]}
    - {tf: google_data_catalog_taxonomy, name: policy-tag-taxonomy, in: group:central-policy, at: [1, 1]}
    - {tf: google_cloud_identity_group, name: data-ops-iam-groups, in: group:product-template, at: [1, 1]}
    - {tf: google_logging_project_bucket_config, name: template-logs, in: group:product-template, at: [1, 2]}
    - {tf: google_monitoring_alert_policy, name: product-freshness-alert, in: group:product-template, at: [1, 3]}
    - {tf: google_storage_bucket, name: template-storage, in: group:product-template, at: [2, 1]}
    - {tf: google_bigquery_dataset, name: template-bigquery, in: group:product-template, at: [2, 2]}
    - {tf: google_bigtable_instance, name: template-bigtable, in: group:product-template, at: [2, 3]}
    - {tf: google_pubsub_topic, name: template-pubsub, in: group:product-template, at: [2, 4]}
    - {tf: google_dataflow_job, name: template-dataflow, in: group:product-template, at: [3, 1]}
    - {tf: google_dataproc_batch, name: template-managed-spark, in: group:product-template, at: [3, 2]}
    - {tf: google_vertex_ai_endpoint, name: template-agent-platform, in: group:product-template, at: [3, 3]}
    - {tf: google_cloud_run_v2_service, name: template-product-interface, in: group:product-template, at: [3, 4]}
    - {tf: google_cloudbuild_trigger, name: domain-provisioning-trigger, in: group:project-factory, at: [1, 1]}
