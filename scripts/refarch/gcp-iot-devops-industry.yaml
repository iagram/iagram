- slug: media-transcoding-transcoder-api
  title: Media transcoding pipeline with Cloud Storage, Transcoder API, Pub/Sub and Cloud CDN
  category: media
  tags: [transcoder api, cloud storage, pub/sub, cloud functions, cloud cdn, hls, dash]
  source: https://docs.cloud.google.com/transcoder/docs/concepts/overview
  description: Source assets are uploaded to a Cloud Storage bucket, and an Eventarc-triggered function submits a Transcoder API job from a reusable job template (such as preset/web-hd) that produces HLS, MPEG-DASH and MP4 renditions into an output bucket. Job status changes are published to a Pub/Sub topic consumed by a catalog service, and viewers fetch the renditions through a global load balancer with Cloud CDN in front of the output bucket.
  containers:
    - project: media-prj
      region: europe-west1
  elements:
    - {tf: google_storage_bucket, name: media-input, in: project:media-prj}
    - {tf: google_cloudfunctions2_function, name: submit-transcode-fn, in: project:media-prj}
    - {tf: google_transcoder_job_template, name: web-hd-template, in: project:media-prj}
    - {tf: google_storage_bucket, name: media-output, in: project:media-prj}
    - {tf: google_pubsub_topic, name: transcode-status, in: project:media-prj}
    - {tf: google_cloud_run_v2_service, name: media-catalog-svc, in: project:media-prj}
    - {tf: google_sql_database_instance, name: catalog-db, in: project:media-prj}
    - {tf: google_compute_backend_bucket, name: media-cdn-backend, in: project:media-prj}
    - {tf: google_compute_global_forwarding_rule, name: media-cdn-glb, in: project:media-prj}
  actors: [user, users]
  flows:
    - {from: user, to: media-input, label: upload source asset, step: 1}
    - {from: media-input, to: submit-transcode-fn, link: google_eventarc_trigger}
    - {from: submit-transcode-fn, to: web-hd-template, label: create job from template, step: 2}
    - {from: web-hd-template, to: media-output, label: HLS / DASH / MP4 renditions, step: 3}
    - {from: web-hd-template, to: transcode-status, label: job state notification, step: 4}
    - {from: transcode-status, to: media-catalog-svc, link: google_pubsub_subscription}
    - {from: media-catalog-svc, to: catalog-db, label: update asset record, step: 5}
    - {from: users, to: media-cdn-glb, label: playback HTTPS, step: 6}
