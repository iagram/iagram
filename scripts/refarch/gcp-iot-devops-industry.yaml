- slug: mqtt-broker-gke-pubsub-dataflow
  title: IoT telemetry with an MQTT broker on GKE, Pub/Sub, Dataflow and BigQuery
  category: iot
  tags: [mqtt, gke, pub/sub, dataflow, bigquery, network load balancer, iot]
  source: https://docs.cloud.google.com/architecture/connected-devices/mqtt-broker-architecture
  description: Edge devices open TLS MQTT sessions through a regional external passthrough Network Load Balancer with session affinity to a three-node standards-based MQTT broker cluster hosted on GKE, which authenticates devices against a credential store in Cloud SQL. The broker bridges topics to Pub/Sub, and Dataflow (Apache Beam MQTT driver or Pub/Sub source) processes the stream into BigQuery while commands flow back to devices through the same broker.
  containers:
    - project: iot-prj
      region: europe-west1
      vpcs:
        - name: iot-vpc
          cidr: 10.40.0.0/16
          subnets:
            - {name: broker-sub, cidr: 10.40.1.0/24, region: europe-west1}
  elements:
    - {tf: google_compute_forwarding_rule, name: mqtt-nlb, in: vpc:iot-vpc}
    - {tf: google_container_cluster, name: mqtt-broker-gke, in: subnet:broker-sub}
    - {tf: google_sql_database_instance, name: device-credential-db, in: vpc:iot-vpc}
    - {tf: google_pubsub_topic, name: telemetry-topic, in: project:iot-prj}
    - {tf: google_pubsub_topic, name: command-topic, in: project:iot-prj}
    - {tf: google_dataflow_job, name: telemetry-stream-job, in: project:iot-prj}
    - {tf: google_bigquery_dataset, name: telemetry-ds, in: project:iot-prj}
    - {tf: google_bigquery_table, name: telemetry-raw, in: project:iot-prj}
    - {tf: google_cloud_run_v2_service, name: device-command-api, in: project:iot-prj}
  actors: [device, users]
  flows:
    - {from: device, to: mqtt-nlb, label: MQTT over TLS 8883, step: 1}
    - {from: mqtt-nlb, to: mqtt-broker-gke, label: session-affine TCP, step: 2}
    - {from: mqtt-broker-gke, to: device-credential-db, label: device auth lookup, step: 3}
    - {from: mqtt-broker-gke, to: telemetry-topic, label: topic bridge publish, step: 4}
    - {from: telemetry-topic, to: telemetry-stream-job, link: google_pubsub_subscription}
    - {from: telemetry-stream-job, to: telemetry-raw, label: streaming insert, step: 5}
    - {from: users, to: device-command-api, label: send command, step: 6}
    - {from: device-command-api, to: command-topic, label: publish command, step: 7}
    - {from: command-topic, to: mqtt-broker-gke, link: google_pubsub_subscription}
    - {from: mqtt-broker-gke, to: device, label: MQTT command topic, step: 8}

