- slug: manufacturing-data-engine
  title: Manufacturing Data Engine with Manufacturing Connect edge, Pub/Sub, Bigtable and BigQuery
  category: industry
  tags: [manufacturing, opc ua, mqtt, pub/sub, dataflow, bigtable, bigquery, looker]
  source: https://docs.cloud.google.com/manufacturing-data-engine/docs/overview
  description: Manufacturing Connect edge gateways on the factory floor translate industrial protocols (OPC UA, MQTT) into standardised messages on the input-messages Pub/Sub topic, where the Message Mapper and Metadata Manager transform them with Whistle mappings and enrich them with asset metadata. Processed records are written to BigQuery, Bigtable and Cloud Storage sinks, republished on an output topic, and exposed through a Federation API and Looker for analytics.
  containers:
    - datacenter: factory-floor
    - project: mde-prj
      region: europe-west1
      vpcs:
        - name: mde-vpc
          cidr: 10.70.0.0/16
          subnets:
            - {name: mde-sub, cidr: 10.70.1.0/24, region: europe-west1}
  elements:
    - {tf: google_compute_instance, name: mc-edge-gateway, in: datacenter:factory-floor}
    - {tf: google_pubsub_topic, name: input-messages, in: project:mde-prj}
    - {tf: google_container_cluster, name: mde-processing-gke, in: subnet:mde-sub}
    - {tf: google_dataflow_job, name: mde-stream-job, in: project:mde-prj}
    - {tf: google_bigquery_dataset, name: mde-warehouse, in: project:mde-prj}
    - {tf: google_bigtable_instance, name: mde-timeseries, in: project:mde-prj}
    - {tf: google_storage_bucket, name: mde-archive, in: project:mde-prj}
    - {tf: google_pubsub_topic, name: output-messages, in: project:mde-prj}
    - {tf: google_cloud_run_v2_service, name: federation-api, in: project:mde-prj}
  actors: [device, users]
  flows:
    - {from: device, to: mc-edge-gateway, label: OPC UA / MQTT from PLCs, step: 1}
    - {from: mc-edge-gateway, to: input-messages, label: standardised messages, step: 2}
    - {from: input-messages, to: mde-processing-gke, link: google_pubsub_subscription}
    - {from: mde-processing-gke, to: mde-stream-job, label: mapped and enriched records, step: 3}
    - {from: mde-stream-job, to: mde-warehouse, label: BigQuery sink, step: 4}
    - {from: mde-stream-job, to: mde-timeseries, label: Bigtable sink, step: 4}
    - {from: mde-stream-job, to: mde-archive, label: archive sink, step: 4}
    - {from: mde-stream-job, to: output-messages, label: republish, step: 5}
    - {from: federation-api, to: mde-warehouse, label: federated query, step: 6}
    - {from: federation-api, to: mde-timeseries, label: point lookup, step: 6}
    - {from: users, to: federation-api, label: Looker and apps, step: 7}

