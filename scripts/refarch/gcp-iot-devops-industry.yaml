- slug: observability-managed-prometheus-monitoring
  title: Observability with Cloud Monitoring, Cloud Logging, Cloud Trace and Managed Service for Prometheus
  category: observability
  tags: [managed prometheus, cloud monitoring, cloud logging, cloud trace, ops agent, grafana, promql]
  source: https://docs.cloud.google.com/stackdriver/docs/managed-prometheus
  description: Prometheus-based collectors (managed collection on GKE, the Ops Agent on Compute Engine, an OpenTelemetry sidecar on Cloud Run, self-deployed collectors in other clouds and on-premises) write metrics using push through the Cloud Monitoring ingest API into Monarch, the Cloud Monitoring time-series store that also holds free platform metrics and log-based metrics for 24 months. Read clients (Grafana, the Cloud Monitoring UI and PromQL alerting rules) read using PromQL through the OSS PromQL query API, and Grafana dashboards and Prometheus alert rules can be imported into Cloud Monitoring.
  containers:
    - project: obs-prj
      region: europe-west1
      account_at: [1, 1, 3, 1]
      vpcs:
        - name: app-vpc
          cidr: 10.130.0.0/16
          at: [1, 1, 1, 3]
          subnets:
            - {name: app-sub, cidr: 10.130.1.0/24, region: europe-west1, at: [1, 1, 1, 3]}
  elements:
    - {tf: google_container_cluster, name: app-gke, in: subnet:app-sub, at: [1, 1]}
    - {tf: google_compute_instance, name: legacy-app-vm, in: subnet:app-sub, at: [1, 2]}
    - {tf: google_compute_instance, name: grafana-vm, in: subnet:app-sub, at: [1, 3]}
    - {tf: google_cloud_run_v2_service, name: cloud-run-app, in: project:obs-prj, at: [1, 4]}
    - {tf: google_monitoring_monitored_project, name: monarch-metrics-scope, in: project:obs-prj, at: [2, 1, 1, 2]}
    - {tf: google_monitoring_dashboard, name: golden-signals-dashboard, in: project:obs-prj, at: [2, 3]}
    - {tf: google_monitoring_alert_policy, name: promql-error-rate-alert, in: project:obs-prj, at: [2, 4]}
    - {tf: google_logging_metric, name: log-based-metrics, in: project:obs-prj, at: [3, 1]}
  actors: [{type: datacenter, name: on-prem, at: [1, 2]}, {type: saas, name: other-clouds, at: [2, 2]}, {type: user, name: sre, at: [3, 2]}]
  flows:
    - {from: app-gke, to: monarch-metrics-scope, label: managed collection writes using push, step: 1}
    - {from: legacy-app-vm, to: monarch-metrics-scope, label: Ops Agent Prometheus receiver push, step: 1}
    - {from: cloud-run-app, to: monarch-metrics-scope, label: OTel sidecar collector push, step: 1}
    - {from: datacenter, to: monarch-metrics-scope, label: self-deployed collector push, step: 1}
    - {from: other-clouds, to: monarch-metrics-scope, label: self-deployed collector push, step: 1}
    - {from: log-based-metrics, to: monarch-metrics-scope, label: log-based and free platform metrics, step: 2}
    - {from: grafana-vm, to: monarch-metrics-scope, label: reads using PromQL (query API), step: 3}
    - {from: golden-signals-dashboard, to: monarch-metrics-scope, label: Cloud Monitoring UI PromQL, step: 3}
    - {from: promql-error-rate-alert, to: monarch-metrics-scope, label: alerting rules evaluated with PromQL, step: 4}
    - {from: grafana-vm, to: golden-signals-dashboard, label: import Grafana dashboards and Prometheus alerts}
    - {from: sre, to: grafana-vm, label: SRE dashboards, step: 5}

- slug: slo-monitoring-burn-rate-alerts
  title: SLO monitoring with Cloud Monitoring services, SLIs and burn-rate alerts
  category: observability
  tags: [slo, sli, error budget, burn rate, cloud monitoring, alerting]
  source: https://docs.cloud.google.com/stackdriver/docs/solutions/slo-monitoring
  description: A Cloud Run API behind a global load balancer is modelled as a Cloud Monitoring service with request-based availability and latency SLIs, each attached to an SLO with a rolling compliance period that defines an error budget. Fast-burn and slow-burn alerting policies watch error-budget consumption and page on-call through PagerDuty and email notification channels.
  containers:
    - project: slo-prj
      region: europe-west1
  elements:
    - {tf: google_compute_global_forwarding_rule, name: checkout-glb, in: project:slo-prj}
    - {tf: google_cloud_run_v2_service, name: checkout-api, in: project:slo-prj}
    - {tf: google_sql_database_instance, name: checkout-db, in: project:slo-prj}
    - {tf: google_monitoring_custom_service, name: checkout-service, in: project:slo-prj}
    - {tf: google_monitoring_slo, name: availability-slo, in: project:slo-prj}
    - {tf: google_monitoring_slo, name: latency-slo, in: project:slo-prj}
    - {tf: google_monitoring_alert_policy, name: fast-burn-alert, in: project:slo-prj}
    - {tf: google_monitoring_alert_policy, name: slow-burn-alert, in: project:slo-prj}
    - {tf: google_monitoring_notification_channel, name: pagerduty-channel, in: project:slo-prj}
    - {tf: google_monitoring_notification_channel, name: email-channel, in: project:slo-prj}
  actors: [users]
  flows:
    - {from: users, to: checkout-glb, label: HTTPS, step: 1}
    - {from: checkout-glb, to: checkout-api, label: serverless NEG, step: 2}
    - {from: checkout-api, to: checkout-db, label: SQL, step: 3}
    - {from: checkout-api, to: checkout-service, label: request count and latency metrics, step: 4}
    - {from: checkout-service, to: availability-slo, label: good / total requests SLI}
    - {from: checkout-service, to: latency-slo, label: latency threshold SLI}
    - {from: availability-slo, to: fast-burn-alert, label: 1h burn rate, step: 5}
    - {from: availability-slo, to: slow-burn-alert, label: 24h burn rate, step: 5}
    - {from: latency-slo, to: slow-burn-alert, label: 24h burn rate, step: 5}
    - {from: fast-burn-alert, to: pagerduty-channel, label: page on-call, step: 6}
    - {from: slow-burn-alert, to: email-channel, label: ticket / email, step: 6}

- slug: log-routing-aggregated-sinks
  title: Centralised log routing with aggregated sinks to BigQuery, Cloud Storage and Pub/Sub
  category: observability
  tags: [cloud logging, aggregated sink, log bucket, bigquery, cloud storage, pub/sub, siem]
  source: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
  description: An organization-level aggregated sink with an inclusion filter routes audit and workload logs from every project to a central logging project, where they land in a Cloud Logging bucket for search, a BigQuery dataset for analysis, a Cloud Storage bucket for long-term retention and a Pub/Sub topic for an external SIEM such as Splunk. The sink's service account is granted write access on each destination.
  containers:
    - project: central-logging-prj
      region: europe-west1
    - project: workload-prj
      region: europe-west1
      vpcs:
        - name: workload-vpc
          cidr: 10.140.0.0/16
          subnets:
            - {name: workload-sub, cidr: 10.140.1.0/24, region: europe-west1}
  elements:
    - {tf: google_logging_organization_sink, name: org-aggregated-sink, in: project:central-logging-prj}
    - {tf: google_logging_project_bucket_config, name: central-log-bucket, in: project:central-logging-prj}
    - {tf: google_bigquery_dataset, name: logs-analytics-ds, in: project:central-logging-prj}
    - {tf: google_storage_bucket, name: logs-archive-bucket, in: project:central-logging-prj}
    - {tf: google_pubsub_topic, name: logs-to-siem, in: project:central-logging-prj}
    - {tf: google_logging_project_sink, name: siem-project-sink, in: project:central-logging-prj}
    - {tf: google_cloud_run_v2_service, name: workload-svc, in: project:workload-prj}
    - {tf: google_compute_instance, name: workload-vm, in: subnet:workload-sub}
    - {tf: google_sql_database_instance, name: workload-db, in: project:workload-prj}
  actors: [saas, users]
  flows:
    - {from: workload-svc, to: org-aggregated-sink, label: request and audit logs, step: 1}
    - {from: workload-vm, to: org-aggregated-sink, label: Ops Agent logs, step: 1}
    - {from: workload-db, to: org-aggregated-sink, label: data-access audit logs, step: 1}
    - {from: org-aggregated-sink, to: central-log-bucket, label: route to log bucket, step: 2}
    - {from: org-aggregated-sink, to: logs-analytics-ds, label: route to BigQuery, step: 2}
    - {from: org-aggregated-sink, to: logs-archive-bucket, label: route to Cloud Storage, step: 2}
    - {from: siem-project-sink, to: logs-to-siem, label: security logs to Pub/Sub, step: 3}
    - {from: logs-to-siem, to: saas, link: google_pubsub_subscription}
    - {from: users, to: logs-analytics-ds, label: security analysts SQL, step: 4}

- slug: incident-alerting-pubsub-cloud-run
  title: Incident automation with alerting policies, a Pub/Sub notification channel and Cloud Run handlers
  category: observability
  tags: [alerting, notification channel, pub/sub, cloud run, workflows, incident automation]
  source: https://docs.cloud.google.com/monitoring/support/notification-options
  description: Cloud Monitoring alerting policies send incident notifications to a Pub/Sub notification channel in addition to Slack for redundancy, and a push subscription delivers each JSON notification to a Cloud Run handler. The handler enriches the incident and starts a Workflows remediation run, while a BigQuery subscription on the same topic keeps a queryable history of every alert.
  containers:
    - project: ops-prj
      region: europe-west1
  elements:
    - {tf: google_cloud_run_v2_service, name: monitored-api, in: project:ops-prj}
    - {tf: google_monitoring_alert_policy, name: error-rate-alert, in: project:ops-prj}
    - {tf: google_monitoring_notification_channel, name: pubsub-channel, in: project:ops-prj}
    - {tf: google_monitoring_notification_channel, name: slack-channel, in: project:ops-prj}
    - {tf: google_pubsub_topic, name: alert-notifications, in: project:ops-prj}
    - {tf: google_cloud_run_v2_service, name: incident-handler, in: project:ops-prj}
    - {tf: google_workflows_workflow, name: remediation-workflow, in: project:ops-prj}
    - {tf: google_bigquery_dataset, name: alert-history-ds, in: project:ops-prj}
    - {tf: google_cloudfunctions2_function, name: rollback-fn, in: project:ops-prj}
  actors: [users, saas]
  flows:
    - {from: users, to: monitored-api, label: HTTPS, step: 1}
    - {from: monitored-api, to: error-rate-alert, label: 5xx ratio metric, step: 2}
    - {from: error-rate-alert, to: pubsub-channel, label: incident opened, step: 3}
    - {from: error-rate-alert, to: slack-channel, label: redundant notification, step: 3}
    - {from: slack-channel, to: saas, label: Slack, step: 4}
    - {from: pubsub-channel, to: alert-notifications, label: publish notification JSON, step: 4}
    - {from: alert-notifications, to: incident-handler, link: google_pubsub_subscription}
    - {from: alert-notifications, to: alert-history-ds, link: google_pubsub_subscription}
    - {from: incident-handler, to: remediation-workflow, label: start execution, step: 5}
    - {from: remediation-workflow, to: rollback-fn, label: rollback step, step: 6}
    - {from: rollback-fn, to: monitored-api, label: redeploy previous revision, step: 7}
