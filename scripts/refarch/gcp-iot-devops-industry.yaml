- slug: mqtt-broker-gke-pubsub-dataflow
  title: IoT telemetry with an MQTT broker on GKE, Pub/Sub, Dataflow and BigQuery
  category: iot
  tags: [mqtt, gke, pub/sub, dataflow, bigquery, network load balancer, iot]
  source: https://docs.cloud.google.com/architecture/connected-devices/mqtt-broker-architecture
  description: Edge devices connect through an edge gateway (certificate store, edge software, device connectors) and cloud clients connect directly, all opening TLS MQTT sessions through Cloud Load Balancing to a standards-based MQTT broker cluster hosted on GKE; a broker administration tier authenticates and authorises devices against a device credential store in Cloud SQL and exposes a broker administration API. Google Cloud connectors (an Apache Beam MqttIO Dataflow job and an MQTT Pub/Sub connector) move telemetry into BigQuery and downstream processing, while Cloud IAM, Cloud Logging and Cloud Monitoring are the project-level resources.
  containers:
    - project: iot-prj
      region: europe-west1
      account_at: [1, 2, 3, 1]
      groups:
        - {label: gcp-connectors, at: [1, 4]}
        - {label: project-level-resources, at: [2, 1, 1, 5]}
      vpcs:
        - name: iot-vpc
          cidr: 10.40.0.0/16
          at: [1, 1, 1, 3]
          subnets:
            - {name: broker-sub, cidr: 10.40.1.0/24, region: europe-west1, at: [1, 2, 1, 2]}
            - {name: broker-admin-sub, cidr: 10.40.2.0/24, region: europe-west1, at: [2, 3]}
  elements:
    - {tf: google_compute_forwarding_rule, name: mqtt-nlb, in: vpc:iot-vpc, at: [1, 1, 2, 1]}
    - {tf: google_container_cluster, name: mqtt-broker-gke, in: subnet:broker-sub, at: [1, 1]}
    - {tf: google_sql_database_instance, name: device-credential-db, in: vpc:iot-vpc, at: [2, 2]}
    - {tf: google_compute_instance, name: device-auth-service, in: subnet:broker-admin-sub, at: [1, 1]}
    - {tf: google_compute_instance, name: broker-admin-api, in: subnet:broker-admin-sub, at: [1, 2]}
    - {tf: google_dataflow_job, name: telemetry-stream-job, in: group:gcp-connectors, at: [1, 1]}
    - {tf: google_pubsub_topic, name: telemetry-topic, in: group:gcp-connectors, at: [2, 1]}
    - {tf: google_bigquery_dataset, name: telemetry-ds, in: project:iot-prj, at: [1, 5]}
    - {tf: google_service_account, name: broker-iam-service-account, in: group:project-level-resources, at: [1, 1]}
    - {tf: google_logging_project_bucket_config, name: broker-logs, in: group:project-level-resources, at: [1, 2]}
    - {tf: google_monitoring_dashboard, name: broker-monitoring, in: group:project-level-resources, at: [1, 3]}
  actors: [{type: device, name: edge-devices, at: [1, 1]}, {type: server, name: edge-gateway, at: [2, 1]}, {type: client, name: cloud-clients, at: [3, 1]}]
  flows:
    - {from: edge-devices, to: edge-gateway, label: device connectors, certificate store / SE, step: 1}
    - {from: edge-gateway, to: mqtt-nlb, label: MQTT with TLS 8883, step: 2}
    - {from: cloud-clients, to: mqtt-nlb, label: MQTT with TLS 8883, step: 2}
    - {from: mqtt-nlb, to: mqtt-broker-gke, label: session-affine TCP to broker 1..N, step: 3}
    - {from: mqtt-broker-gke, to: device-auth-service, label: device authentication and authorization, step: 4}
    - {from: device-auth-service, to: device-credential-db, label: credential lookup}
    - {from: broker-admin-api, to: mqtt-broker-gke, label: broker administration API (HTTPS/gRPC)}
    - {from: mqtt-broker-gke, to: telemetry-stream-job, label: Beam MqttIO connector, step: 5}
    - {from: mqtt-broker-gke, to: telemetry-topic, label: MQTT Pub/Sub connector, step: 6}
    - {from: telemetry-stream-job, to: telemetry-ds, label: streaming insert, step: 7}
    - {from: mqtt-broker-gke, to: edge-gateway, label: command topics over MQTT with TLS, step: 8}

- slug: distributed-cloud-connected-edge
  title: Google Distributed Cloud connected edge clusters managed from a Google Cloud region
  category: edge
  tags: [google distributed cloud, edge, gke, cloud vpn, fleet, config sync]
  source: https://docs.cloud.google.com/distributed-cloud/edge/latest/docs/overview
  description: Google Distributed Cloud connected runs GKE clusters on Google-provided hardware installed at the customer site, and each deployment reaches Google Cloud services and the customer VPC over a Cloud VPN connection. Clusters are registered to a fleet so that container images, configuration and monitoring are managed centrally from the region while workloads (containers, VMs, GPU jobs) run locally at the edge.
  containers:
    - datacenter: edge-site
    - project: edge-mgmt-prj
      region: europe-west1
      vpcs:
        - name: core-vpc
          cidr: 10.50.0.0/16
          subnets:
            - {name: core-sub, cidr: 10.50.1.0/24, region: europe-west1}
  elements:
    - {tf: google_edgecontainer_cluster, name: edge-gke-cluster, in: datacenter:edge-site}
    - {tf: google_edgecontainer_node_pool, name: edge-nodepool, in: datacenter:edge-site}
    - {tf: google_compute_ha_vpn_gateway, name: edge-vpn-gw, in: vpc:core-vpc}
    - {tf: google_compute_router, name: edge-router, in: vpc:core-vpc}
    - {tf: google_gke_hub_membership, name: edge-fleet-membership, in: project:edge-mgmt-prj}
    - {tf: google_gke_hub_feature, name: config-management-feature, in: project:edge-mgmt-prj}
    - {tf: google_artifact_registry_repository, name: edge-images, in: project:edge-mgmt-prj}
    - {tf: google_pubsub_topic, name: edge-events, in: project:edge-mgmt-prj}
    - {tf: google_bigquery_dataset, name: edge-analytics, in: project:edge-mgmt-prj}
    - {tf: google_compute_instance, name: core-backend-vm, in: subnet:core-sub}
  actors: [device, users]
  flows:
    - {from: device, to: edge-gke-cluster, label: local sensors and cameras, step: 1}
    - {from: edge-gke-cluster, to: edge-vpn-gw, link: google_edgecontainer_vpn_connection}
    - {from: edge-vpn-gw, to: edge-router, label: BGP over Cloud VPN, step: 2}
    - {from: edge-gke-cluster, to: edge-fleet-membership, label: fleet registration, step: 3}
    - {from: config-management-feature, to: edge-gke-cluster, label: Config Sync policies, step: 4}
    - {from: edge-images, to: edge-gke-cluster, label: image pull, step: 5}
    - {from: edge-gke-cluster, to: edge-events, label: aggregated events, step: 6}
    - {from: edge-events, to: edge-analytics, link: google_pubsub_subscription}
    - {from: edge-gke-cluster, to: core-backend-vm, label: private VPC access, step: 7}
    - {from: users, to: edge-fleet-membership, label: fleet console, step: 8}

- slug: connected-vehicle-telemetry-platform
  title: Connected vehicle telemetry platform with Pub/Sub, Dataflow, Bigtable and BigQuery
  category: iot
  tags: [connected vehicles, automotive, pub/sub, dataflow, bigtable, bigquery, fleet]
  source: https://cloud.google.com/solutions/automotive
  description: Vehicles stream telemetry through a global load balancer to a connectivity gateway on GKE that publishes normalised events to Pub/Sub, where Dataflow enriches them, writes the latest vehicle state to Bigtable for low-latency lookups and lands history in BigQuery and Cloud Storage. Fleet operators and driver apps query vehicle state through a Cloud Run API, and remote commands travel back through a dedicated topic.
  containers:
    - project: vehicle-prj
      region: europe-west1
      vpcs:
        - name: vehicle-vpc
          cidr: 10.60.0.0/16
          subnets:
            - {name: gateway-sub, cidr: 10.60.1.0/24, region: europe-west1}
  elements:
    - {tf: google_compute_global_forwarding_rule, name: vehicle-ingest-glb, in: project:vehicle-prj}
    - {tf: google_container_cluster, name: vehicle-gateway-gke, in: subnet:gateway-sub}
    - {tf: google_pubsub_topic, name: vehicle-telemetry, in: project:vehicle-prj}
    - {tf: google_pubsub_topic, name: vehicle-commands, in: project:vehicle-prj}
    - {tf: google_dataflow_job, name: telemetry-enrich-job, in: project:vehicle-prj}
    - {tf: google_bigtable_instance, name: vehicle-state-bt, in: project:vehicle-prj}
    - {tf: google_bigquery_dataset, name: fleet-analytics, in: project:vehicle-prj}
    - {tf: google_storage_bucket, name: raw-telemetry-lake, in: project:vehicle-prj}
    - {tf: google_cloud_run_v2_service, name: fleet-api, in: project:vehicle-prj}
  actors: [device, mobile, users]
  flows:
    - {from: device, to: vehicle-ingest-glb, label: telemetry over TLS, step: 1}
    - {from: vehicle-ingest-glb, to: vehicle-gateway-gke, label: MQTT / gRPC gateway, step: 2}
    - {from: vehicle-gateway-gke, to: vehicle-telemetry, label: publish events, step: 3}
    - {from: vehicle-telemetry, to: telemetry-enrich-job, link: google_pubsub_subscription}
    - {from: telemetry-enrich-job, to: vehicle-state-bt, label: latest vehicle state, step: 4}
    - {from: telemetry-enrich-job, to: fleet-analytics, label: trip history, step: 5}
    - {from: telemetry-enrich-job, to: raw-telemetry-lake, label: raw archive, step: 6}
    - {from: mobile, to: fleet-api, label: driver app, step: 7}
    - {from: users, to: fleet-api, label: fleet operator console, step: 7}
    - {from: fleet-api, to: vehicle-state-bt, label: point lookup, step: 8}
    - {from: fleet-api, to: vehicle-commands, label: remote command, step: 9}
    - {from: vehicle-commands, to: vehicle-gateway-gke, link: google_pubsub_subscription}

- slug: smart-retail-commerce-search-analytics
  title: Smart retail analytics with AI Commerce Search, Pub/Sub user events and BigQuery
  category: industry
  tags: [retail, commerce search, recommendations, user events, bigquery, pub/sub, cloud run]
  source: https://docs.cloud.google.com/retail/docs/overview
  description: The product catalog (from BigQuery, Cloud Storage or the API) and global and local inventories are ingested into Vertex AI Search for commerce, and an e-commerce frontend on Cloud Run calls its search, browse and recommendations API while recording user events (ranking, personalisation, dynamic facets) in real time. Google Tag Manager transforms and pushes the analytics stream into the user events topic, products and user events are exported to BigQuery, and Google Analytics 4 receives the streamed analytics while its export is imported into BigQuery for measurement.
  containers:
    - project: retail-prj
      region: europe-west1
      account_at: [1, 1, 4, 1]
  elements:
    - {tf: google_bigquery_table, name: product-catalog, in: project:retail-prj, at: [1, 1]}
    - {tf: google_storage_bucket, name: catalog-import-bucket, in: project:retail-prj, at: [2, 1]}
    - {tf: google_bigquery_table, name: inventories, in: project:retail-prj, at: [3, 1]}
    - {tf: google_discovery_engine_search_engine, name: vais-commerce, in: project:retail-prj, at: [1, 2, 2, 1]}
    - {tf: google_cloud_run_v2_service, name: storefront-api, in: project:retail-prj, at: [1, 3, 2, 1]}
    - {tf: google_bigquery_dataset, name: retail-analytics, in: project:retail-prj, at: [3, 2]}
    - {tf: google_pubsub_topic, name: user-events, in: project:retail-prj, at: [3, 3]}
  actors: [users, mobile, {type: saas, name: Google Tag Manager, at: [3, 2]}, {type: saas, name: Google Analytics 4, at: [4, 2]}]
  flows:
    - {from: product-catalog, to: vais-commerce, label: "catalog: format and ingest (BigQuery)", step: 1}
    - {from: catalog-import-bucket, to: vais-commerce, label: catalog import (Cloud Storage)}
    - {from: inventories, to: vais-commerce, label: "inventories: setInventories / addLocalInventories API", step: 3}
    - {from: users, to: storefront-api, label: HTTPS}
    - {from: mobile, to: storefront-api, label: HTTPS}
    - {from: storefront-api, to: vais-commerce, label: search / browse / recommendations API, step: 4}
    - {from: storefront-api, to: user-events, label: "user events: ranking, personalisation, dynamic facets", step: 2}
    - {from: user-events, to: vais-commerce, label: user events API}
    - {from: vais-commerce, to: retail-analytics, label: products and user events}
    - {from: storefront-api, to: Google Tag Manager, label: analytics stream}
    - {from: Google Tag Manager, to: user-events, label: transform and push}
    - {from: storefront-api, to: Google Analytics 4, label: stream analytics}
    - {from: Google Analytics 4, to: retail-analytics, label: GA4 export}
    - {from: retail-analytics, to: user-events, label: GA4 import}

- slug: manufacturing-data-engine
  title: Manufacturing Data Engine with Manufacturing Connect edge, Pub/Sub, Bigtable and BigQuery
  category: industry
  tags: [manufacturing, opc ua, mqtt, pub/sub, dataflow, bigtable, bigquery, looker]
  source: https://docs.cloud.google.com/manufacturing-data-engine/docs/overview
  description: Manufacturing Connect edge gateways in the customer factory (drawn as an external server next to the PLC devices) translate industrial protocols (OPC UA, MQTT) into standardised messages on the input-messages Pub/Sub topic, while batch files from other sources land in a Cloud Storage bucket read by a GCS reader Dataflow job. Inside the VPC the Message Mapper (Whistle source classes), Configuration Manager (tag creation, backed by Cloud SQL and Memorystore for Redis) and Metadata Manager (metadata enrichment) run on GKE and hand records to the sinks, Pub/Sub sink and BigQuery sink on GKE and Bigtable writer, GCS writer and transformations (event change window) Dataflow jobs, which write to the output topic, BigQuery, Bigtable and Cloud Storage; a Federation API on GKE exposes the data to Looker and applications.
  containers:
    - project: mde-prj
      region: europe-west1
      account_at: [1, 2, 3, 1]
      vpcs:
        - name: mde-vpc
          cidr: 10.70.0.0/16
          at: [1, 2, 6, 1]
          subnets:
            - {name: federation-sub, cidr: 10.70.4.0/24, region: europe-west1, at: [1, 4]}
            - {name: sinks-sub, cidr: 10.70.3.0/24, region: europe-west1, at: [2, 4, 2, 1]}
            - {name: processing-sub, cidr: 10.70.1.0/24, region: europe-west1, at: [3, 1, 1, 3]}
  elements:
    - {tf: google_storage_bucket, name: batch-ingestion-bucket, in: project:mde-prj, at: [1, 1]}
    - {tf: google_dataflow_job, name: gcs-reader-job, in: project:mde-prj, at: [2, 1]}
    - {tf: google_pubsub_topic, name: input-messages, in: project:mde-prj, at: [3, 1]}
    - {tf: google_container_cluster, name: message-mapper-gke, in: subnet:processing-sub, at: [1, 1]}
    - {tf: google_container_cluster, name: config-manager-gke, in: subnet:processing-sub, at: [1, 2]}
    - {tf: google_container_cluster, name: metadata-manager-gke, in: subnet:processing-sub, at: [1, 3]}
    - {tf: google_sql_database_instance, name: config-db, in: vpc:mde-vpc, at: [2, 2]}
    - {tf: google_redis_instance, name: config-cache, in: vpc:mde-vpc, at: [2, 3]}
    - {tf: google_container_cluster, name: federation-api-gke, in: subnet:federation-sub, at: [1, 1]}
    - {tf: google_container_cluster, name: pubsub-sink-gke, in: subnet:sinks-sub, at: [1, 1]}
    - {tf: google_container_cluster, name: bq-sink-gke, in: subnet:sinks-sub, at: [2, 1]}
    - {tf: google_dataflow_job, name: bigtable-writer-job, in: vpc:mde-vpc, at: [4, 4]}
    - {tf: google_dataflow_job, name: gcs-writer-job, in: vpc:mde-vpc, at: [5, 4]}
    - {tf: google_dataflow_job, name: transformations-job, in: vpc:mde-vpc, at: [6, 4]}
    - {tf: google_pubsub_topic, name: output-messages, in: project:mde-prj, at: [2, 3]}
    - {tf: google_bigquery_dataset, name: mde-warehouse, in: project:mde-prj, at: [3, 3]}
    - {tf: google_bigtable_instance, name: mde-timeseries, in: project:mde-prj, at: [4, 3]}
    - {tf: google_storage_bucket, name: mde-archive, in: project:mde-prj, at: [5, 3]}
  actors: [{type: device, name: plc-devices, at: [1, 1]}, {type: server, name: mc-edge-gateway, at: [2, 1]}, {type: server, name: other-sources, at: [3, 1]}, {type: users, name: users, at: [1, 3, 3, 1]}]
  flows:
    - {from: plc-devices, to: mc-edge-gateway, label: OPC UA / MQTT from PLCs, step: 1}
    - {from: mc-edge-gateway, to: input-messages, label: standardised messages, step: 2}
    - {from: other-sources, to: batch-ingestion-bucket, label: batch files}
    - {from: batch-ingestion-bucket, to: gcs-reader-job, label: GCS reader}
    - {from: gcs-reader-job, to: input-messages, label: batch messages}
    - {from: input-messages, to: message-mapper-gke, link: google_pubsub_subscription}
    - {from: message-mapper-gke, to: config-manager-gke, label: source classes / Whistle mappings, step: 3}
    - {from: config-manager-gke, to: config-db, label: configuration store}
    - {from: config-manager-gke, to: config-cache, label: configuration cache}
    - {from: config-manager-gke, to: metadata-manager-gke, label: tag creation, step: 4}
    - {from: metadata-manager-gke, to: pubsub-sink-gke, label: enriched records, step: 5}
    - {from: metadata-manager-gke, to: bq-sink-gke, label: enriched records, step: 5}
    - {from: metadata-manager-gke, to: bigtable-writer-job, label: enriched records, step: 5}
    - {from: metadata-manager-gke, to: gcs-writer-job, label: enriched records, step: 5}
    - {from: metadata-manager-gke, to: transformations-job, label: enriched records, step: 5}
    - {from: pubsub-sink-gke, to: output-messages, label: Pub/Sub sink}
    - {from: bq-sink-gke, to: mde-warehouse, label: BigQuery sink}
