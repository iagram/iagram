  elements:
    - {tf: google_compute_global_forwarding_rule, name: vehicle-ingest-glb, in: project:vehicle-prj}
    - {tf: google_container_cluster, name: vehicle-gateway-gke, in: subnet:gateway-sub}
    - {tf: google_pubsub_topic, name: vehicle-telemetry, in: project:vehicle-prj}
    - {tf: google_pubsub_topic, name: vehicle-commands, in: project:vehicle-prj}
    - {tf: google_dataflow_job, name: telemetry-enrich-job, in: project:vehicle-prj}
    - {tf: google_bigtable_instance, name: vehicle-state-bt, in: project:vehicle-prj}
    - {tf: google_bigquery_dataset, name: fleet-analytics, in: project:vehicle-prj}
    - {tf: google_storage_bucket, name: raw-telemetry-lake, in: project:vehicle-prj}
    - {tf: google_cloud_run_v2_service, name: fleet-api, in: project:vehicle-prj}
  actors: [device, mobile, users]
  flows:
    - {from: device, to: vehicle-ingest-glb, label: telemetry over TLS, step: 1}
    - {from: vehicle-ingest-glb, to: vehicle-gateway-gke, label: MQTT / gRPC gateway, step: 2}
    - {from: vehicle-gateway-gke, to: vehicle-telemetry, label: publish events, step: 3}
    - {from: vehicle-telemetry, to: telemetry-enrich-job, link: google_pubsub_subscription}
    - {from: telemetry-enrich-job, to: vehicle-state-bt, label: latest vehicle state, step: 4}
    - {from: telemetry-enrich-job, to: fleet-analytics, label: trip history, step: 5}
    - {from: telemetry-enrich-job, to: raw-telemetry-lake, label: raw archive, step: 6}
    - {from: mobile, to: fleet-api, label: driver app, step: 7}
    - {from: users, to: fleet-api, label: fleet operator console, step: 7}
    - {from: fleet-api, to: vehicle-state-bt, label: point lookup, step: 8}
    - {from: fleet-api, to: vehicle-commands, label: remote command, step: 9}
