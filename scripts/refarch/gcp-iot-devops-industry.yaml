    - {from: gcs-writer-job, to: mde-archive, label: raw and processed archive}
    - {from: transformations-job, to: config-manager-gke, label: event change window transformations}
    - {from: federation-api-gke, to: mde-warehouse, label: federated query, step: 6}
    - {from: federation-api-gke, to: mde-timeseries, label: point lookup, step: 6}
    - {from: users, to: federation-api-gke, label: Looker and apps, step: 7}

- slug: healthcare-fhir-bigquery-analytics
  title: Healthcare data platform with Cloud Healthcare API FHIR store streaming to BigQuery
  category: industry
  tags: [healthcare, fhir, cloud healthcare api, bigquery, pub/sub, cloud run]
  source: https://docs.cloud.google.com/healthcare-api/docs/how-tos/fhir-bigquery-streaming
  description: Clinical applications read and write FHIR resources through a Cloud Healthcare API FHIR store inside a healthcare dataset, and a StreamConfigs export streams every create, update, patch and delete to BigQuery tables in near real time using the Analytics schema. Pub/Sub notifications from the FHIR store trigger a function for downstream workflows, and bulk FHIR bundles are imported from Cloud Storage.
