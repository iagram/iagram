- slug: streaming-kinesis-firehose-s3
  title: Streaming ingestion with Kinesis Data Streams and Firehose to S3
  category: data
  tags: [kinesis, firehose, streaming, s3, lambda transform, athena]
  source: https://docs.aws.amazon.com/solutions/latest/streaming-data-solution-for-amazon-kinesis/option3.html
  description: Producers write records to a Kinesis data stream; a Firehose delivery stream reads the stream, optionally invokes a Lambda transform, converts records to Parquet, and buffers them into S3 by size or time. Glue and Athena make the landed data queryable, and CloudWatch alarms watch stream throughput.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_kinesis_stream, name: events-stream, in: region}
    - {tf: aws_kinesis_firehose_delivery_stream, name: events-to-s3, in: region}
    - {tf: aws_lambda_function, name: record-transformer, in: region}
    - {tf: aws_s3_bucket, name: streaming-landing, in: region}
    - {tf: aws_glue_catalog_database, name: events-db, in: region}
    - {tf: aws_athena_workgroup, name: streaming-wg, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: iterator-age-alarm, in: region}
  actors: [server, device]
  flows:
    - {from: server, to: events-stream, label: PutRecords, step: 1}
    - {from: device, to: events-stream, label: PutRecords, step: 1}
    - {from: events-stream, to: events-to-s3, label: Kinesis source, step: 2}
    - {from: events-to-s3, to: record-transformer, label: transform batch, step: 3}
    - {from: events-to-s3, to: streaming-landing, label: Parquet, buffered 60s/128MB, step: 4}
    - {from: events-to-s3, to: events-db, label: schema for format conversion}
    - {from: streaming-wg, to: streaming-landing, label: SQL over landed data, step: 5}
    - {from: events-stream, to: iterator-age-alarm, label: GetRecords.IteratorAgeMilliseconds}

- slug: rag-bedrock-knowledge-base-opensearch
  title: RAG with Amazon Bedrock Knowledge Bases and OpenSearch Serverless
  category: ml
  tags: [rag, bedrock, knowledge base, opensearch serverless, vector search, generative ai]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-fully-managed-bedrock.html
  description: A user's query goes to a Bedrock agent, which retrieves the most similar chunks from a Bedrock Knowledge Base backed by an OpenSearch Serverless vector collection and passes the augmented prompt to a foundation model that composes the grounded response. Documents in S3 are the knowledge base's data source; a sync job chunks and embeds them into the collection.
  containers:
    - region: us-east-1
      groups:
        - {label: Amazon Bedrock, at: [1, 1, 2, 1]}
  elements:
    - {tf: aws_bedrockagent_agent, name: rag-agent, in: group:Amazon Bedrock, at: [1, 1]}
    - {tf: aws_bedrockagent_knowledge_base, name: enterprise-kb, in: group:Amazon Bedrock, at: [1, 2]}
    - {tf: aws_bedrock_inference_profile, name: claude-generation, in: group:Amazon Bedrock, at: [2, 1]}
    - {tf: aws_opensearchserverless_collection, name: kb-vectors, in: region, at: [1, 2]}
    - {tf: aws_s3_bucket, name: knowledge-docs, in: region, at: [2, 2]}
  actors: [{type: user, at: [1, 1]}]
  flows:
    - {from: user, to: rag-agent, label: query, step: 1}
    - {from: rag-agent, to: enterprise-kb, label: Retrieve, step: 2}
    - {from: enterprise-kb, to: kb-vectors, label: k-NN similarity search, step: 3}
    - {from: rag-agent, to: claude-generation, label: augmented prompt, step: 4}
    - {from: claude-generation, to: user, label: response, step: 5}
    - {from: knowledge-docs, to: enterprise-kb, label: "sync: chunk + Titan embeddings"}
    - {from: enterprise-kb, to: kb-vectors, label: index vectors}

- slug: multi-region-active-passive-aurora-global
  title: Multi-Region active/passive with Route 53 failover and Aurora Global Database
  category: resilience
  tags: [disaster recovery, multi-region, warm standby, route 53 failover, aurora global database]
  source: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  description: The primary Region serves all traffic while a scaled-down copy of the stack runs in a secondary Region as a warm standby. Aurora Global Database replicates data cross-Region with sub-second lag, S3 replicates objects, and a Route 53 failover record backed by a health check redirects users when the primary fails.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: primary-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: p-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: p-public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: p-private-a, cidr: 10.0.10.0/24, az: a, public: false}
    - region: us-west-2
      label: secondary
      vpcs:
        - name: secondary-vpc
          cidr: 10.1.0.0/16
          subnets:
            - {name: s-public-a, cidr: 10.1.0.0/24, az: a, public: true}
            - {name: s-public-b, cidr: 10.1.1.0/24, az: b, public: true}
            - {name: s-private-a, cidr: 10.1.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: example-com, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: primary-health, in: region:us-east-1}
    - {tf: aws_lb, name: primary-alb, in: vpc:primary-vpc}
    - {tf: aws_autoscaling_group, name: primary-asg, in: vpc:primary-vpc}
    - {tf: aws_rds_global_cluster, name: global-db, in: region:us-east-1}
    - {tf: aws_rds_cluster, name: aurora-primary, in: subnet:p-private-a}
    - {tf: aws_s3_bucket, name: assets-primary, in: region:us-east-1}
    - {tf: aws_lb, name: secondary-alb, in: vpc:secondary-vpc}
    - {tf: aws_autoscaling_group, name: secondary-asg, in: vpc:secondary-vpc}
    - {tf: aws_rds_cluster, name: aurora-secondary, in: subnet:s-private-a}
    - {tf: aws_s3_bucket, name: assets-secondary, in: region:us-west-2}
  actors: [users]
  flows:
    - {from: users, to: example-com, label: DNS, step: 1}
    - {from: example-com, to: primary-alb, label: PRIMARY record, step: 2}
    - {from: example-com, to: secondary-alb, label: SECONDARY record (on health check failure)}
    - {from: primary-health, to: primary-alb, label: HTTPS health check}
    - {from: primary-alb, to: primary-asg, step: 3}
    - {from: primary-asg, to: aurora-primary, label: read/write, step: 4}
    - {from: global-db, to: aurora-primary, label: primary cluster}
    - {from: global-db, to: aurora-secondary, label: secondary cluster}
    - {from: aurora-primary, to: aurora-secondary, label: storage-level replication (< 1s lag)}
    - {from: assets-primary, to: assets-secondary, label: S3 cross-Region replication}
    - {from: secondary-alb, to: secondary-asg, label: scaled-down standby}
    - {from: secondary-asg, to: aurora-secondary, label: read-only until promoted}

- slug: iot-core-kinesis-s3
  title: IoT telemetry pipeline with IoT Core, Kinesis, and S3
  category: iot
  tags: [iot core, mqtt, rules engine, kinesis, firehose, s3, telemetry]
  source: https://docs.aws.amazon.com/wellarchitected/latest/iot-lens/workload-architecture.html
  description: Devices publish MQTT telemetry to the IoT Core message broker, where a topic rule forwards matching messages into a Kinesis data stream that decouples ingestion rate from processing. A Lambda consumer serves real-time alerts and hot state, while Firehose batches the same stream into S3 for durable storage and Athena analytics.
  containers:
    - region: eu-west-1
      groups:
        - {label: connectivity}
        - {label: ingestion}
        - {label: processing and storage}
  elements:
    - {tf: aws_iot_thing, name: sensor-fleet, in: group:connectivity}
    - {tf: aws_iot_topic_rule, name: telemetry-to-kinesis, in: group:connectivity}
    - {tf: aws_kinesis_stream, name: telemetry-stream, in: group:ingestion}
    - {tf: aws_lambda_function, name: anomaly-detector, in: group:processing and storage}
    - {tf: aws_dynamodb_table, name: device-latest-state, in: group:processing and storage}
    - {tf: aws_kinesis_firehose_delivery_stream, name: telemetry-to-s3, in: group:processing and storage}
    - {tf: aws_s3_bucket, name: telemetry-archive, in: group:processing and storage}
    - {tf: aws_athena_workgroup, name: telemetry-wg, in: group:processing and storage}
  actors: [device, users]
  flows:
    - {from: device, to: sensor-fleet, label: MQTT over TLS, step: 1}
    - {from: sensor-fleet, to: telemetry-to-kinesis, label: SELECT * FROM 'sensors/+/telemetry', step: 2}
    - {from: telemetry-to-kinesis, to: telemetry-stream, label: kinesis action, step: 3}
    - {from: telemetry-stream, to: anomaly-detector, link: aws_lambda_event_source_mapping, step: 4}
    - {from: anomaly-detector, to: device-latest-state, label: UpdateItem, step: 5}
    - {from: telemetry-stream, to: telemetry-to-s3, label: Kinesis source, step: 4}
    - {from: telemetry-to-s3, to: telemetry-archive, label: buffered Parquet by date partition, step: 5}
    - {from: users, to: telemetry-wg, label: SQL over archive, step: 6}
    - {from: telemetry-wg, to: telemetry-archive, label: scan}

- slug: codepipeline-cicd-ecs
  title: CI/CD pipeline with CodePipeline, CodeBuild, and ECR deploying to ECS
  category: devops
  tags: [codepipeline, codebuild, ecr, ecs, ci/cd, continuous deployment]
  source: https://docs.aws.amazon.com/codepipeline/latest/userguide/ecs-cd-pipeline.html
  description: A push to the source repository starts a CodePipeline execution whose build stage runs CodeBuild to build the container image, push it to ECR, and emit an imagedefinitions.json artifact. The deploy stage updates the ECS service with the new task definition revision, and the service performs a rolling replacement behind its load balancer.
  containers:
    - region: us-east-1
      groups:
        - {label: pipeline}
      vpcs:
        - name: app
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_codestarconnections_connection, name: github-connection, in: group:pipeline}
    - {tf: aws_codepipeline, name: app-pipeline, in: group:pipeline}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: group:pipeline}
    - {tf: aws_codebuild_project, name: docker-build, in: group:pipeline}
    - {tf: aws_ecr_repository, name: app-image, in: group:pipeline}
    - {tf: aws_ecs_cluster, name: app-cluster, in: vpc:app}
    - {tf: aws_lb, name: app-alb, in: vpc:app}
  actors: [user, users]
  flows:
    - {from: user, to: github-connection, label: git push, step: 1}
    - {from: github-connection, to: app-pipeline, label: Source stage trigger, step: 2}
    - {from: app-pipeline, to: pipeline-artifacts, label: source artifact, step: 3}
    - {from: app-pipeline, to: docker-build, label: Build stage, step: 4}
    - {from: docker-build, to: app-image, label: docker push :commit-sha, step: 5}
    - {from: docker-build, to: pipeline-artifacts, label: imagedefinitions.json, step: 6}
    - {from: app-pipeline, to: app-cluster, label: Deploy stage (ECS action), step: 7}
    - {from: app-image, to: app-cluster, label: pull image, step: 8}
    - {from: users, to: app-alb, label: HTTPS}
    - {from: app-alb, to: app-cluster, label: rolling update, min healthy 100%}
