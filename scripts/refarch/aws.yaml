- slug: tgw-hub-and-spoke
  title: Transit Gateway hub and spoke
  category: networking
  tags: [transit gateway, hub and spoke, multi-vpc, centralized egress]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/transit-gateway.html
  description: A regional Transit Gateway acts as the hub; each spoke VPC attaches once and its VPC route table sends non-local traffic to the Transit Gateway, whose own route tables decide which attachment receives it. A shared egress VPC with NAT gateways centralizes outbound traffic so spokes hold no internet gateway of their own.
  containers:
    - region: eu-west-1
      at: [1, 1]
      vpcs:
        - name: egress
          cidr: 10.0.0.0/16
          at: [1, 3, 3, 1]
          subnets:
            - {name: egress-public-a, cidr: 10.0.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: egress-public-b, cidr: 10.0.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: egress-tgw-a, cidr: 10.0.10.0/28, az: a, public: false, at: [2, 1]}
        - name: spoke-a
          cidr: 10.1.0.0/16
          at: [1, 1]
          subnets:
            - {name: app-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
        - name: spoke-b
          cidr: 10.2.0.0/16
          at: [3, 1]
          subnets:
            - {name: app-b, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [2, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: spoke-rt, in: region, at: [1, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: egress-rt, in: region, at: [3, 2]}
    - {tf: aws_route_table, name: spoke-a-rt, in: vpc:spoke-a, at: [1, 2]}
    - {tf: aws_route_table, name: spoke-b-rt, in: vpc:spoke-b, at: [1, 2]}
    - {tf: aws_route_table, name: egress-vpc-rt, in: vpc:egress, at: [2, 3]}
    - {tf: aws_internet_gateway, name: egress-igw, in: vpc:egress, at: [1, 3]}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:egress-public-a, at: [1, 1]}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:egress-public-b, at: [1, 1]}
  actors: [{type: internet, at: [1, 2]}]
  flows:
    - {from: hub-tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: spoke-a-rt, to: hub-tgw, label: 0.0.0.0/0 via tgw, step: 1}
    - {from: spoke-b-rt, to: hub-tgw, label: 0.0.0.0/0 via tgw}
    - {from: spoke-rt, to: hub-tgw, label: "spoke attachments: default route to the egress VPC"}
    - {from: egress-rt, to: hub-tgw, label: "egress attachment: 10.0.0.0/8 back to the spokes"}
    - {from: hub-tgw, to: nat-a, label: egress-rt default route, step: 2}
    - {from: nat-a, to: egress-igw, step: 3}
    - {from: egress-igw, to: internet, step: 4}
    - {from: egress-vpc-rt, to: hub-tgw, label: 10.0.0.0/8 via tgw (return traffic)}
    - {from: vpc:spoke-a, to: vpc:spoke-b, label: east-west via spoke-rt}

- slug: vpc-peering-shared-services
  title: VPC peering to a central shared-services VPC
  category: networking
  tags: [vpc peering, shared services, hub, private routing]
  source: https://docs.aws.amazon.com/vpc/latest/peering/peering-scenarios.html
  description: Two application VPCs each peer with a central VPC that hosts shared resources such as directory and monitoring servers. Peering is not transitive, so the spokes cannot reach each other through the hub; each VPC route table carries a route for the peer CIDR through its peering connection.
  containers:
    - region: us-east-1
      vpcs:
        - name: shared
          cidr: 10.0.0.0/16
          subnets:
            - {name: shared-private-a, cidr: 10.0.1.0/24, az: a, public: false}
        - name: app-a
          cidr: 10.1.0.0/16
          subnets:
            - {name: app-a-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: app-b
          cidr: 10.2.0.0/16
          subnets:
            - {name: app-b-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_vpc_peering_connection, name: pcx-shared-a, in: region}
    - {tf: aws_vpc_peering_connection, name: pcx-shared-b, in: region}
    - {tf: aws_instance, name: directory-server, in: subnet:shared-private-a}
    - {tf: aws_instance, name: app-a-server, in: subnet:app-a-private-a}
    - {tf: aws_instance, name: app-b-server, in: subnet:app-b-private-a}
  actors: []
  flows:
    - {from: vpc:app-a, to: pcx-shared-a, label: requester, step: 1}
    - {from: pcx-shared-a, to: vpc:shared, label: accepter, step: 2}
    - {from: vpc:app-b, to: pcx-shared-b, label: requester}
    - {from: pcx-shared-b, to: vpc:shared, label: accepter}
    - {from: app-a-server, to: directory-server, label: 10.0.0.0/16 via pcx-shared-a}
    - {from: app-b-server, to: directory-server, label: 10.0.0.0/16 via pcx-shared-b}

- slug: hybrid-dx-primary-vpn-backup
  title: Hybrid connectivity with Direct Connect primary and Site-to-Site VPN backup
  category: networking
  tags: [direct connect, site-to-site vpn, hybrid, transit gateway, bgp failover]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/hybrid-connectivity-transit-gateway/hybrid-dx-primary-vpn-backup.html
  description: Two spoke VPCs attach to a Transit Gateway through Transit Gateway ENIs in dedicated subnets; each VPC route table sends the office prefix to the Transit Gateway, whose spoke and on-premises route tables steer traffic to a Direct Connect gateway or to the Site-to-Site VPN attachment. Direct Connect, with a transit virtual interface from the router at the DX location, is the primary path and the VPN over the internet is the encrypted backup; BGP prefers the Direct Connect route and fails over when it withdraws.
  containers:
    - {datacenter: office-branch, at: [2, 2]}
    - region: eu-central-1
      groups:
        - {label: DX location, at: [1, 5, 2, 1]}
      vpcs:
        - name: spoke-a
          cidr: 10.0.0.0/16
          at: [1, 1]
          subnets:
            - {name: workload-a, cidr: 10.0.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: tgw-a, cidr: 10.0.2.0/28, az: a, public: false, at: [2, 1]}
        - name: spoke-b
          cidr: 10.1.0.0/16
          at: [2, 1]
          subnets:
            - {name: tgw-b, cidr: 10.1.2.0/28, az: a, public: false, at: [1, 1]}
            - {name: workload-b, cidr: 10.1.1.0/24, az: a, public: false, at: [2, 1]}
  elements:
    - {tf: aws_instance, name: app-a, in: subnet:workload-a, at: [1, 1]}
    - {tf: aws_network_interface, name: tgw-eni-a, in: subnet:tgw-a, at: [1, 1]}
    - {tf: aws_route_table, name: spoke-a-rt, in: vpc:spoke-a, at: [1, 2]}
    - {tf: aws_instance, name: app-b, in: subnet:workload-b, at: [1, 1]}
    - {tf: aws_network_interface, name: tgw-eni-b, in: subnet:tgw-b, at: [1, 1]}
    - {tf: aws_route_table, name: spoke-b-rt, in: vpc:spoke-b, at: [1, 2]}
    - {tf: aws_ec2_transit_gateway, name: tgw, in: region, at: [1, 2, 2, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: spoke-vpc-tgw-rt, in: region, at: [1, 3]}
    - {tf: aws_ec2_transit_gateway_route_table, name: onprem-tgw-rt, in: region, at: [2, 3]}
    - {tf: aws_dx_gateway, name: dxgw, in: region, at: [1, 4, 2, 1]}
    - {tf: aws_dx_connection, name: dx-1g, in: group:DX location, at: [1, 1]}
  actors: [datacenter, {type: internet, at: [1, 2]}]
  flows:
    - {from: tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw, to: vpc:spoke-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: spoke-a-rt, to: tgw-eni-a, label: 10.10.0.0/24 via tgw}
    - {from: spoke-b-rt, to: tgw-eni-b, label: 10.10.0.0/24 via tgw}
    - {from: spoke-vpc-tgw-rt, to: tgw, label: "spoke VPC route table: 10.10.0.0/24 via DX gateway, VPN as backup"}
    - {from: onprem-tgw-rt, to: tgw, label: "on-premises route table: 10.0.0.0/16 and 10.1.0.0/16 to the spokes"}
    - {from: app-b, to: tgw-eni-b, label: to office branch 10.10.0.0/24, step: 1}
    - {from: tgw-eni-b, to: tgw, step: 2}
    - {from: tgw, to: dxgw, link: aws_dx_gateway_association, label: primary path, step: 3}
    - {from: dxgw, to: dx-1g, label: transit VIF + BGP, step: 4}
    - {from: dx-1g, to: datacenter, label: dedicated fibre to the DX router, step: 5}
    - {from: datacenter, to: internet, label: backup path, step: 6}
    - {from: datacenter, to: tgw, link: aws_vpn_connection, label: "Site-to-Site VPN over the internet, IPsec tunnels x2", step: 7}

- slug: static-site-s3-cloudfront-route53
  title: Secure static website with S3, CloudFront, and Route 53
  category: web
  tags: [static website, s3, cloudfront, route 53, acm, origin access control]
  source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/getting-started-secure-static-website-cloudformation-template.html
  description: Static assets live in a private S3 bucket that only CloudFront can read through origin access control. Route 53 alias records point the apex and www names at the CloudFront distribution, which terminates TLS with an ACM certificate issued in us-east-1, fetches objects from the bucket on a cache miss and serves them from edge locations worldwide.
  containers:
    - region: us-east-1
      groups:
        - {label: global edge, at: [1, 2]}
  elements:
    - {tf: aws_route53_zone, name: example-com, in: region, at: [1, 1]}
    - {tf: aws_acm_certificate, name: site-cert, in: region, at: [2, 2]}
    - {tf: aws_cloudfront_distribution, name: site-cdn, in: group:global edge, at: [1, 1]}
    - {tf: aws_s3_bucket, name: site-content, in: region, at: [1, 3]}
  actors: [{type: users, at: [1, 1]}]
  flows:
    - {from: users, to: example-com, label: DNS lookup, step: 1}
    - {from: example-com, to: site-cdn, label: alias A/AAAA}
    - {from: users, to: site-cdn, label: HTTPS GET (ACM cert), step: 2}
    - {from: site-cdn, to: site-content, label: origin fetch via OAC on cache miss, step: 3}
    - {from: site-content, to: site-cdn, label: object, step: 4}
    - {from: site-cdn, to: users, label: response cached at the edge, step: 5}
    - {from: site-cert, to: site-cdn, label: TLS certificate}

- slug: sns-sqs-fanout-lambda
  title: SNS to SQS fan-out with Lambda consumers
  category: serverless
  tags: [fanout, sns, sqs, lambda, pub/sub, dead-letter queue]
  source: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  description: A producer publishes each order event once to an SNS topic, which replicates the message to several subscribed SQS queues so downstream services process it independently and at their own pace. Lambda functions poll each queue via event source mappings, and a dead-letter queue captures messages that repeatedly fail.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: region}
    - {tf: aws_lambda_function, name: order-publisher, in: region}
    - {tf: aws_sns_topic, name: order-events, in: region}
    - {tf: aws_sqs_queue, name: fulfillment-queue, in: region}
    - {tf: aws_sqs_queue, name: analytics-queue, in: region}
    - {tf: aws_sqs_queue, name: fulfillment-dlq, in: region}
    - {tf: aws_lambda_function, name: fulfillment-worker, in: region}
    - {tf: aws_lambda_function, name: analytics-worker, in: region}
    - {tf: aws_dynamodb_table, name: shipments, in: region}
    - {tf: aws_s3_bucket, name: order-archive, in: region}
  actors: [client]
  flows:
    - {from: client, to: orders-api, label: POST /orders, step: 1}
    - {from: orders-api, to: order-publisher, step: 2}
    - {from: order-publisher, to: order-events, label: Publish, step: 3}
    - {from: order-events, to: fulfillment-queue, link: aws_sns_topic_subscription, step: 4}
    - {from: order-events, to: analytics-queue, link: aws_sns_topic_subscription, step: 4}
    - {from: fulfillment-queue, to: fulfillment-worker, link: aws_lambda_event_source_mapping, step: 5}
    - {from: analytics-queue, to: analytics-worker, link: aws_lambda_event_source_mapping, step: 5}
    - {from: fulfillment-worker, to: shipments, label: PutItem, step: 6}
    - {from: analytics-worker, to: order-archive, label: PutObject, step: 6}
    - {from: fulfillment-queue, to: fulfillment-dlq, label: redrive after maxReceiveCount}

- slug: apigw-lambda-dynamodb-rest
  title: Serverless REST microservice with API Gateway, Lambda, and DynamoDB
  category: serverless
  tags: [api gateway, lambda, dynamodb, rest, crud, serverless]
  source: https://docs.aws.amazon.com/lambda/latest/dg/services-apigateway-tutorial.html
  description: A client calls an API Gateway REST API that proxies each CRUD request to a single Lambda function, which reads and writes a DynamoDB users table. A permissions policy attached to the function's execution role scopes it to the table and to CloudWatch Logs, with no servers to manage at any tier.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: rest-api, in: region, at: [2, 1]}
    - {tf: aws_lambda_function, name: crud-user-function, in: region, at: [2, 2]}
    - {tf: aws_iam_policy, name: permissions-policy, in: region, at: [1, 2]}
    - {tf: aws_dynamodb_table, name: users-table, in: region, at: [2, 3]}
  actors: [{type: client, at: [1, 1]}]
  flows:
    - {from: client, to: rest-api, label: HTTPS GET/POST/PUT/DELETE, step: 1}
    - {from: rest-api, to: crud-user-function, label: Lambda proxy integration, step: 2}
    - {from: crud-user-function, to: users-table, label: GetItem / PutItem / UpdateItem / DeleteItem, step: 3}
    - {from: permissions-policy, to: crud-user-function, label: attached to the execution role}

- slug: eventbridge-event-driven
  title: Event-driven application with EventBridge
  category: serverless
  tags: [eventbridge, event bus, rules, event-driven, step functions, choreography]
  source: https://aws.amazon.com/blogs/compute/building-an-event-driven-application-with-amazon-eventbridge/
  description: Three kinds of event source publish to EventBridge event buses. AWS services emit to the default bus, applications put custom events on a custom bus and SaaS partners deliver to a partner event bus; rules on each bus match event patterns and route events to targets such as Lambda functions, Kinesis streams, Step Functions workflows, API Gateway endpoints and event buses in other accounts, so producers and consumers stay decoupled.
  containers:
    - region: us-east-1
      groups:
        - {label: event sources, at: [1, 1, 3, 1]}
        - {label: event targets, at: [1, 3, 3, 1]}
  elements:
    - {tf: aws_s3_bucket, name: uploads-bucket, in: group:event sources, at: [1, 1]}
    - {tf: aws_lambda_function, name: custom-event-producer, in: group:event sources, at: [2, 1]}
    - {tf: aws_cloudwatch_event_bus, name: default-bus, in: region, at: [1, 2]}
    - {tf: aws_cloudwatch_event_bus, name: custom-bus, in: region, at: [2, 2]}
    - {tf: aws_cloudwatch_event_bus, name: saas-bus, in: region, at: [3, 2]}
    - {tf: aws_lambda_function, name: target-function, in: group:event targets, at: [1, 1]}
    - {tf: aws_kinesis_stream, name: events-stream, in: group:event targets, at: [2, 1]}
    - {tf: aws_sfn_state_machine, name: orders-workflow, in: group:event targets, at: [3, 1]}
    - {tf: aws_api_gateway_rest_api, name: webhook-api, in: group:event targets, at: [4, 1]}
    - {tf: aws_cloudwatch_event_bus, name: other-account-bus, in: group:event targets, at: [5, 1]}
  actors: [{type: saas, at: [1, 1]}]
  flows:
    - {from: uploads-bucket, to: default-bus, label: AWS service events, step: 1}
    - {from: custom-event-producer, to: custom-bus, label: PutEvents custom events, step: 1}
    - {from: saas, to: saas-bus, label: partner event source, step: 1}
    - {from: default-bus, to: target-function, label: rule match, step: 2}
    - {from: custom-bus, to: events-stream, label: rule match, step: 2}
    - {from: custom-bus, to: orders-workflow, label: rule match, step: 2}
    - {from: saas-bus, to: webhook-api, label: rule match, step: 2}
    - {from: custom-bus, to: other-account-bus, label: cross-account rule, step: 2}

- slug: ecs-fargate-microservices-alb
  title: ECS Fargate microservices behind an Application Load Balancer
  category: containers
  tags: [ecs, fargate, microservices, alb, path-based routing, ecr]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/deploy-java-microservices-on-amazon-ecs-using-amazon-ecr-and-load-balancing.html
  description: An internet-facing ALB in public subnets uses path-based listener rules to send /orders and /payments traffic to separate target groups, each backed by an ECS service running Fargate tasks in private subnets across two Availability Zones. Container images are pulled from ECR, and NAT gateways provide tasks with outbound access.
  containers:
    - region: eu-west-1
      vpcs:
        - name: main
          cidr: 10.0.0.0/16
          subnets:
            - {name: public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: private-a, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: private-b, cidr: 10.0.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_internet_gateway, name: igw, in: vpc:main}
    - {tf: aws_lb, name: services-alb, in: vpc:main}
    - {tf: aws_lb_target_group, name: orders-tg, in: vpc:main}
    - {tf: aws_lb_target_group, name: payments-tg, in: vpc:main}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: services-cluster, in: vpc:main}
    - {tf: aws_ecr_repository, name: orders-image, in: region}
    - {tf: aws_ecr_repository, name: payments-image, in: region}
    - {tf: aws_db_instance, name: orders-db, in: subnet:private-b}
  actors: [users]
  flows:
    - {from: users, to: igw, label: HTTPS, step: 1}
    - {from: igw, to: services-alb, step: 2}
    - {from: services-alb, to: orders-tg, label: path /orders/*, step: 3}
    - {from: services-alb, to: payments-tg, label: path /payments/*, step: 3}
    - {from: orders-tg, to: services-cluster, label: HTTP :8080 to orders service, step: 4}
    - {from: payments-tg, to: services-cluster, label: HTTP :8080 to payments service, step: 4}
    - {from: services-cluster, to: orders-db, label: SQL, step: 5}
    - {from: orders-image, to: services-cluster, label: image pull}
    - {from: payments-image, to: services-cluster, label: image pull}
    - {from: services-cluster, to: nat-a, label: outbound}

- slug: data-lake-s3-glue-athena
  title: Data lake with S3, Glue, Lake Formation, and Athena
  category: data
  tags: [data lake, s3, glue, athena, lake formation, etl]
  source: https://docs.aws.amazon.com/solutions/data-lakes-on-aws/
  description: Data uploaded to a raw S3 bucket raises an EventBridge event that is queued in SQS and triggers a Lambda function, which starts a Step Functions ingestion workflow whose Lambda steps validate the data, record pipeline state in DynamoDB and write it to a stage bucket. An EventBridge Scheduler schedule then starts a second Step Functions workflow in which a Glue job transforms stage data into an analytics bucket and a Glue crawler registers the tables in the Glue Data Catalog; Lake Formation governs the buckets and the catalog, and business analysts query them with Athena.
  containers:
    - region: us-east-1
      groups:
        - {label: ingestion workflow, at: [1, 2]}
        - {label: analytics workflow, at: [1, 4, 2, 1]}
        - {label: Lake Formation, at: [3, 2, 1, 4]}
  elements:
    - {tf: aws_lambda_function, name: ingestion-trigger, in: region, at: [1, 1]}
    - {tf: aws_sqs_queue, name: raw-events-queue, in: region, at: [2, 1]}
    - {tf: aws_cloudwatch_event_rule, name: raw-object-created, in: region, at: [3, 1]}
    - {tf: aws_sfn_state_machine, name: ingestion-workflow, in: group:ingestion workflow, at: [1, 1]}
    - {tf: aws_lambda_function, name: validate-raw, in: group:ingestion workflow, at: [1, 2]}
    - {tf: aws_lambda_function, name: raw-to-stage, in: group:ingestion workflow, at: [1, 3]}
    - {tf: aws_scheduler_schedule, name: analytics-schedule, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: analytics-trigger, in: region, at: [2, 3]}
    - {tf: aws_sfn_state_machine, name: analytics-workflow, in: group:analytics workflow, at: [1, 1]}
    - {tf: aws_lambda_function, name: prepare-analytics, in: group:analytics workflow, at: [1, 2]}
    - {tf: aws_glue_job, name: stage-to-analytics, in: group:analytics workflow, at: [2, 1]}
    - {tf: aws_glue_crawler, name: analytics-crawler, in: group:analytics workflow, at: [2, 2]}
    - {tf: aws_dynamodb_table, name: pipeline-state, in: region, at: [1, 5]}
    - {tf: aws_s3_bucket, name: raw-bucket, in: group:Lake Formation, at: [1, 1]}
    - {tf: aws_s3_bucket, name: stage-bucket, in: group:Lake Formation, at: [1, 2]}
    - {tf: aws_s3_bucket, name: analytics-bucket, in: group:Lake Formation, at: [1, 3]}
    - {tf: aws_glue_catalog_database, name: analytics-database, in: group:Lake Formation, at: [1, 4]}
    - {tf: aws_athena_workgroup, name: analytics-wg, in: group:Lake Formation, at: [2, 4]}
  actors: [{type: client, at: [1, 1]}, {type: users, at: [1, 3]}]
  flows:
    - {from: client, to: raw-bucket, label: upload raw data, step: 1}
    - {from: raw-bucket, to: raw-object-created, label: object created event, step: 2}
