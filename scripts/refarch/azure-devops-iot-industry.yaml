# Azure reference architectures: DevOps & observability, IoT & edge, industry.
# Sources verified on learn.microsoft.com (2026-09). One official page per item.

- slug: pipelines-cicd-baseline
  title: CI/CD baseline architecture with Azure Pipelines
  category: devops
  tags: [azure pipelines, ci/cd, pull request, staging, artifacts, key vault]
  source: https://learn.microsoft.com/en-us/azure/devops/pipelines/architectures/devops-pipelines-baseline-architecture
  description: A developer pushes to Azure Repos Git; a pull request pipeline runs code analysis, lint, security scanning, restore, build, unit tests and PR review, and a merge triggers a CI pipeline that gets secrets from Key Vault, restores packages from Azure Artifacts, runs integration tests and publishes build artifacts. The published artifact triggers a CD pipeline that deploys to a Staging environment of App Services and virtual machines, runs acceptance tests, waits for an optional manual intervention and releases to Production, while each pipeline reports its results back to the developer.
  containers:
    - subscription: workload
      resource_group: {name: rg-cicd-baseline, location: westeurope}
      groups:
        - {label: Staging, at: [1, 2]}
        - {label: Production, at: [2, 2]}
  elements:
    - {tf: azurerm_key_vault, name: kv-pipeline-secrets, in: resource_group:rg-cicd-baseline, at: [1, 1, 2, 1]}
    - {tf: azurerm_linux_web_app, name: app-staging, in: group:Staging, at: [1, 1]}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-staging, in: group:Staging, at: [1, 2]}
    - {tf: azurerm_linux_web_app, name: app-prod, in: group:Production, at: [1, 1]}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-prod, in: group:Production, at: [1, 2]}
  actors:
    - {type: user, name: Developer, at: [2, 1]}
    - {type: saas, name: Azure Repos, at: [2, 2]}
    - {type: saas, name: Azure Pipelines (PR), at: [2, 3]}
    - {type: saas, name: Azure Pipelines (CI), at: [2, 4]}
    - {type: saas, name: Azure Pipelines (CD), at: [2, 5]}
    - {type: saas, name: Azure Artifacts, at: [1, 3, 1, 2]}
  flows:
    - {from: Developer, to: Azure Repos, label: git push}
    - {from: Azure Repos, to: Azure Pipelines (PR), label: "pull request: code analysis, lint, security scanning, restore, build, unit tests, PR review", step: 1}
    - {from: Azure Pipelines (PR), to: Azure Pipelines (CI), label: merge to main triggers CI, step: 2}
    - {from: Azure Artifacts, to: Azure Pipelines (PR), label: package feed}
    - {from: Azure Artifacts, to: Azure Pipelines (CI), label: package feed and published build artifacts}
    - {from: kv-pipeline-secrets, to: Azure Pipelines (CI), label: get secrets}
    - {from: Azure Pipelines (CI), to: Azure Pipelines (CD), label: published build artifact triggers CD, step: 3}
    - {from: Azure Pipelines (CD), to: app-staging, label: deploy to staging and run acceptance tests, step: 4}
    - {from: Azure Pipelines (CD), to: vmss-staging, label: deploy to staging}
    - {from: Azure Pipelines (CD), to: app-prod, label: release after optional manual intervention, step: 5}
    - {from: Azure Pipelines (CD), to: vmss-prod, label: release}
    - {from: Azure Pipelines (PR), to: Developer, label: PR pipeline results}
    - {from: Azure Pipelines (CI), to: Developer, label: CI pipeline results}
    - {from: Azure Pipelines (CD), to: Developer, label: CD pipeline results}

- slug: app-service-pipelines-slot-swap
  title: CI/CD for Azure Web Apps with deployment slot swap
  category: devops
  tags: [azure pipelines, app service, deployment slots, web deploy, slot swap, rollback]
  source: https://learn.microsoft.com/en-us/azure/devops/pipelines/architectures/devops-pipelines-azure-web-apps-architecture
  description: A variant of the Azure Pipelines baseline where the CI pipeline produces a Web Deploy package and the CD pipeline deploys it to a staging slot of an App Service web app. Release to production is a swap of the staging and production slots, and rollback swaps them back; Azure Monitor, Application Insights and Log Analytics provide observability.
  containers:
    - subscription: workload
      resource_group: {name: rg-webapp-cicd, location: westeurope}
  elements:
    - {tf: azurerm_key_vault, name: kv-webapp-cicd, in: resource_group:rg-webapp-cicd}
    - {tf: azurerm_service_plan, name: plan-webapp, in: resource_group:rg-webapp-cicd}
    - {tf: azurerm_linux_web_app, name: app-production-slot, in: resource_group:rg-webapp-cicd}
    - {tf: azurerm_linux_web_app_slot, name: app-staging-slot, in: resource_group:rg-webapp-cicd}
    - {tf: azurerm_application_insights, name: appi-webapp, in: resource_group:rg-webapp-cicd}
    - {tf: azurerm_log_analytics_workspace, name: law-webapp, in: resource_group:rg-webapp-cicd}
  actors: [user, saas, users]
  flows:
    - {from: user, to: saas, label: commit to Azure Repos, step: 1}
    - {from: saas, to: kv-webapp-cicd, label: CI gets secrets, step: 2}
    - {from: saas, to: app-staging-slot, label: deploy Web Deploy package, step: 3}
    - {from: app-staging-slot, to: app-production-slot, label: slot swap = release, step: 4}
    - {from: users, to: app-production-slot, label: HTTPS, step: 5}
    - {from: app-production-slot, to: appi-webapp, label: telemetry}
    - {from: appi-webapp, to: law-webapp, label: logs and metrics}

- slug: functions-github-actions-oidc
  title: Deploy to Azure Functions with GitHub Actions and OIDC
  category: devops
  tags: [github actions, azure functions, oidc, workload identity federation, flex consumption, zip deploy]
  source: https://learn.microsoft.com/en-us/azure/azure-functions/functions-how-to-github-actions
  description: A GitHub Actions workflow builds the function project on push and authenticates to Azure with OpenID Connect through a Microsoft Entra workload identity federation, so no publish profile or long-lived secret is stored in GitHub. The Azure Functions action deploys the package to the function app, whose runtime state and deployment package live in a storage account and whose telemetry flows to Application Insights.
  containers:
    - subscription: workload
      resource_group: {name: rg-functions-gha, location: westeurope}
  elements:
    - {tf: azurerm_service_plan, name: plan-flex-consumption, in: resource_group:rg-functions-gha}
    - {tf: azurerm_linux_function_app, name: func-api, in: resource_group:rg-functions-gha}
    - {tf: azurerm_storage_account, name: stfuncdeploy, in: resource_group:rg-functions-gha}
    - {tf: azurerm_application_insights, name: appi-func, in: resource_group:rg-functions-gha}
    - {tf: azurerm_log_analytics_workspace, name: law-func, in: resource_group:rg-functions-gha}
    - {tf: azurerm_key_vault, name: kv-func-settings, in: resource_group:rg-functions-gha}
  actors: [user, saas, idp, client]
  flows:
    - {from: user, to: saas, label: push to GitHub, step: 1}
    - {from: saas, to: idp, label: OIDC token exchange (federated credential), step: 2}
    - {from: saas, to: func-api, label: functions-action deploy, step: 3}
    - {from: func-api, to: stfuncdeploy, label: deployment package + runtime state}
    - {from: func-api, to: kv-func-settings, label: Key Vault references}
    - {from: client, to: func-api, label: HTTPS trigger, step: 4}
    - {from: func-api, to: appi-func, label: telemetry}
    - {from: appi-func, to: law-func, label: workspace}

- slug: aks-blue-green-clusters
  title: Blue-green deployment of AKS clusters
  category: devops
  tags: [aks, blue-green, front door, application gateway, dns switch, cluster upgrade]
  source: https://learn.microsoft.com/en-us/azure/architecture/guide/aks/blue-green-deployment-for-aks
  description: A new (green) AKS cluster is deployed next to the live (blue) cluster, its Kubernetes state is synced by CI/CD or GitOps, and it is validated with Azure Monitor metrics before traffic is switched. Each cluster sits behind its own Application Gateway; Azure Front Door and Azure DNS A/CNAME record changes perform the switch, after which the blue cluster is destroyed.
  containers:
    - subscription: workload
      resource_group: {name: rg-aks-bluegreen, location: westeurope}
      groups:
        - {label: Global edge}
      vnets:
        - name: vnet-aks
          cidr: 10.20.0.0/16
          subnets:
            - {name: snet-appgw-blue, cidr: 10.20.0.0/24}
            - {name: snet-appgw-green, cidr: 10.20.1.0/24}
            - {name: snet-aks-blue, cidr: 10.20.16.0/20}
            - {name: snet-aks-green, cidr: 10.20.32.0/20}
  elements:
    - {tf: azurerm_cdn_frontdoor_profile, name: afd-official-host, in: group:Global edge}
    - {tf: azurerm_dns_zone, name: dns-contoso, in: group:Global edge}
    - {tf: azurerm_application_gateway, name: agw-blue, in: subnet:snet-appgw-blue}
    - {tf: azurerm_application_gateway, name: agw-green, in: subnet:snet-appgw-green}
    - {tf: azurerm_kubernetes_cluster, name: aks-blue, in: subnet:snet-aks-blue}
    - {tf: azurerm_kubernetes_cluster, name: aks-green, in: subnet:snet-aks-green}
    - {tf: azurerm_container_registry, name: acr-shared, in: resource_group:rg-aks-bluegreen}
    - {tf: azurerm_key_vault, name: kv-aks-shared, in: resource_group:rg-aks-bluegreen}
    - {tf: azurerm_log_analytics_workspace, name: law-aks, in: resource_group:rg-aks-bluegreen}
  actors: [users, saas]
  flows:
    - {from: users, to: afd-official-host, label: HTTPS official-aks.contoso.com, step: 1}
    - {from: afd-official-host, to: dns-contoso, label: origin resolves aks.contoso.com, step: 2}
    - {from: dns-contoso, to: agw-blue, label: "A record: live (T0)", step: 3}
    - {from: dns-contoso, to: agw-green, label: "A record: after switch (T3)", step: 5}
    - {from: agw-blue, to: aks-blue, label: ingress}
    - {from: agw-green, to: aks-green, label: ingress}
    - {from: saas, to: aks-green, label: "T2: sync Kubernetes state (CI/CD or GitOps)", step: 4}
    - {from: acr-shared, to: aks-green, label: images + Helm charts}
    - {from: aks-green, to: kv-aks-shared, label: secrets + certificates}
    - {from: aks-blue, to: law-aks, label: Container insights}
    - {from: aks-green, to: law-aks, label: "T1 validation: Azure Monitor metrics"}

- slug: container-apps-blue-green-revisions
  title: Blue-green deployment in Azure Container Apps
  category: devops
  tags: [container apps, revisions, traffic weights, revision labels, blue-green, rollback]
  source: https://learn.microsoft.com/en-us/azure/container-apps/blue-green-deployment
  description: A container app runs in multiple-active-revisions mode; the current release is a revision labelled blue that receives 100% of the traffic weight, and a new image is deployed as a second revision labelled green with 0% weight but reachable on its own label FQDN for testing. Switching production is a traffic-weight update to green=100, rollback reverses the weights, and a GitHub workflow or Bicep template drives the cycle.
  containers:
    - subscription: workload
      resource_group: {name: rg-aca-bluegreen, location: westeurope}
  elements:
    - {tf: azurerm_container_registry, name: acr-aca, in: resource_group:rg-aca-bluegreen}
    - {tf: azurerm_log_analytics_workspace, name: law-aca, in: resource_group:rg-aca-bluegreen}
    - {tf: azurerm_container_app_environment, name: cae-prod, in: resource_group:rg-aca-bluegreen}
    - {tf: azurerm_container_app, name: ca-app-blue-green, in: resource_group:rg-aca-bluegreen}
    - {tf: azurerm_key_vault, name: kv-aca, in: resource_group:rg-aca-bluegreen}
    - {tf: azurerm_application_insights, name: appi-aca, in: resource_group:rg-aca-bluegreen}
  actors: [saas, users, user]
  flows:
    - {from: saas, to: acr-aca, label: GitHub workflow pushes image tag = commit, step: 1}
    - {from: saas, to: ca-app-blue-green, label: az containerapp update (green revision, weight 0), step: 2}
    - {from: acr-aca, to: ca-app-blue-green, label: pull image}
    - {from: user, to: ca-app-blue-green, label: test app---green FQDN, step: 3}
    - {from: saas, to: ca-app-blue-green, label: "traffic set blue=0 green=100", step: 4}
    - {from: users, to: ca-app-blue-green, label: production FQDN, step: 5}
    - {from: ca-app-blue-green, to: kv-aca, label: secrets}
    - {from: cae-prod, to: law-aca, label: console + system logs}
    - {from: ca-app-blue-green, to: appi-aca, label: telemetry}

- slug: aks-canary-pipelines-manifest
  title: Canary deployment strategy for Kubernetes with Azure Pipelines
  category: devops
  tags: [aks, canary, kubernetes manifest task, azure pipelines, promote, reject, load test]
  source: https://learn.microsoft.com/en-us/azure/devops/pipelines/ecosystems/kubernetes/canary-demo
  description: A build stage pushes the image to Azure Container Registry and publishes manifests; a deploy stage uses the KubernetesManifest task with the canary strategy to run baseline and canary pods next to the stable deployment at a 25% share and deploys Fortio to generate load. An approval-gated environment then promotes the canary to stable or rejects it, which rolls the workload back.
  containers:
    - subscription: workload
      resource_group: {name: rg-aks-canary, location: westeurope}
      vnets:
        - name: vnet-canary
          cidr: 10.30.0.0/16
          subnets:
            - {name: snet-aks, cidr: 10.30.0.0/20}
  elements:
    - {tf: azurerm_container_registry, name: acr-canary, in: resource_group:rg-aks-canary}
    - {tf: azurerm_kubernetes_cluster, name: aks-canary, in: subnet:snet-aks}
    - {tf: azurerm_log_analytics_workspace, name: law-canary, in: resource_group:rg-aks-canary}
    - {tf: azurerm_monitor_workspace, name: amw-canary, in: resource_group:rg-aks-canary}
    - {tf: azurerm_dashboard_grafana, name: grafana-canary, in: resource_group:rg-aks-canary}
    - {tf: azurerm_key_vault, name: kv-canary, in: resource_group:rg-aks-canary}
  actors: [user, saas]
  flows:
    - {from: user, to: saas, label: push to GitHub fork, step: 1}
    - {from: saas, to: acr-canary, label: "Build stage: Docker@2 buildAndPush", step: 2}
    - {from: saas, to: aks-canary, label: "DeployCanary: strategy canary, percentage 25", step: 3}
    - {from: acr-canary, to: aks-canary, label: imagePullSecret pull}
    - {from: aks-canary, to: amw-canary, label: baseline vs canary metrics (Fortio load)}
    - {from: amw-canary, to: grafana-canary, label: compare success rates, step: 4}
    - {from: saas, to: aks-canary, label: "PromoteRejectCanary: promote or reject after approval", step: 5}
    - {from: aks-canary, to: law-canary, label: container logs}
    - {from: aks-canary, to: kv-canary, label: secrets}

- slug: aks-gitops-flux
  title: GitOps application deployments with Flux v2 on AKS and Arc-enabled Kubernetes
  category: devops
  tags: [gitops, flux, aks, azure arc, kustomize, helm, pull-based deployment]
  source: https://learn.microsoft.com/en-us/azure/azure-arc/kubernetes/conceptual-gitops-flux2
  description: The microsoft.flux cluster extension installs the Flux source, kustomize, helm and notification controllers in the cluster, and fluxConfigurations resources created through Azure Resource Manager tell them which Git repository, Bucket or Azure Blob source and kustomizations to reconcile. Reconciliation is pull-based from inside the cluster so no external CI system needs cluster credentials, and Azure Policy can assign the same configuration to fleets of AKS and Arc-enabled clusters.
  containers:
    - datacenter: factory-edge
    - subscription: platform
      resource_group: {name: rg-gitops, location: westeurope}
      vnets:
        - name: vnet-gitops
          cidr: 10.40.0.0/16
          subnets:
            - {name: snet-aks, cidr: 10.40.0.0/20}
  elements:
    - {tf: azurerm_kubernetes_cluster, name: aks-gitops, in: subnet:snet-aks}
    - {tf: azurerm_kubernetes_cluster_extension, name: ext-microsoft-flux, in: subnet:snet-aks}
    - {tf: azurerm_kubernetes_flux_configuration, name: fluxcfg-apps, in: subnet:snet-aks}
    - {tf: azurerm_arc_kubernetes_cluster, name: arc-k8s-factory, in: datacenter}
    - {tf: azurerm_container_registry, name: acr-gitops, in: resource_group:rg-gitops}
    - {tf: azurerm_storage_account, name: stfluxbucket, in: resource_group:rg-gitops}
    - {tf: azurerm_log_analytics_workspace, name: law-gitops, in: resource_group:rg-gitops}
  actors: [user, saas]
  flows:
    - {from: user, to: saas, label: commit manifests / Helm / Kustomize to Git, step: 1}
    - {from: user, to: fluxcfg-apps, label: az k8s-configuration flux create, step: 2}
    - {from: fluxcfg-apps, to: ext-microsoft-flux, label: fluxconfig-agent applies GitRepository + Kustomization, step: 3}
    - {from: ext-microsoft-flux, to: saas, label: source controller pulls Git (pull-based), step: 4}
    - {from: ext-microsoft-flux, to: stfluxbucket, label: alternative source (Azure Blob / Bucket)}
    - {from: ext-microsoft-flux, to: aks-gitops, label: kustomize + helm controllers apply desired state, step: 5}
    - {from: acr-gitops, to: aks-gitops, label: pull images / OCI Helm charts}
    - {from: fluxcfg-apps, to: arc-k8s-factory, label: same configuration via Azure Policy at scale}
    - {from: aks-gitops, to: law-gitops, label: Flux status + reconciliation logs}

- slug: devsecops-iac-github-defender
  title: DevSecOps for infrastructure as code with GitHub and Defender for Cloud
  category: devops
  tags: [devsecops, infrastructure as code, bicep, azure verified modules, deployment stacks, github advanced security, defender for devops]
  source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/devsecops-infrastructure-as-code
  description: Infrastructure definitions, tests and policy-as-code checks are written with GitHub Copilot and committed to GitHub repositories; pull requests run GitHub Actions workflows that generate deployment previews, GitHub Advanced Security scans secrets and dependencies, and the Microsoft Security DevOps action reports IaC misconfigurations to DevOps security in Defender for Cloud. The workflow deploys Azure Verified Modules through Azure Resource Manager deployment stacks with deny settings, Azure Policy and Defender for Cloud evaluate the deployed resources, and a Logic Apps workflow opens GitHub Issues for configuration drifts and reconciliation.
  containers:
    - subscription: workload
      resource_group: {name: rg-iac-target, location: westeurope}
    - subscription: security
      resource_group: {name: rg-secops, location: westeurope}
  elements:
    - {tf: azurerm_resource_group_template_deployment, name: arm-deployment-stack, in: resource_group:rg-iac-target, at: [1, 1]}
    - {tf: azurerm_subscription_policy_assignment, name: policy-iac-guardrails, in: resource_group:rg-iac-target, at: [2, 1]}
    - {tf: azurerm_security_center_subscription_pricing, name: defender-devops-security, in: resource_group:rg-secops, at: [1, 1]}
    - {tf: azurerm_logic_app_workflow, name: logic-create-github-issue, in: resource_group:rg-secops, at: [2, 1]}
  actors:
    - {type: user, at: [1, 1]}
    - {type: saas, name: GitHub Copilot, at: [1, 2]}
    - {type: saas, name: GitHub repos, at: [1, 3]}
    - {type: saas, name: GitHub Actions, at: [1, 4]}
    - {type: saas, name: GitHub Advanced Security, at: [1, 5]}
    - {type: saas, name: GitHub Issues, at: [2, 4, 1, 2]}
  flows:
    - {from: user, to: GitHub Copilot, label: infrastructure as code and tests, policy as code, step: 1}
    - {from: GitHub Copilot, to: GitHub repos, label: commit and pull request, step: 2}
    - {from: GitHub repos, to: GitHub Actions, label: workflow run with deployment preview, step: 3}
    - {from: GitHub Actions, to: GitHub Advanced Security, label: secret, dependency and code scanning, step: 4}
    - {from: GitHub Actions, to: defender-devops-security, label: Microsoft Security DevOps IaC findings, step: 5}
    - {from: GitHub Actions, to: arm-deployment-stack, label: Azure Verified Modules deployed as deployment stacks, step: 6}
    - {from: arm-deployment-stack, to: policy-iac-guardrails, label: Azure Policy evaluates deployed resources, step: 7}
    - {from: policy-iac-guardrails, to: defender-devops-security, label: compliance and drift findings}
    - {from: defender-devops-security, to: logic-create-github-issue, label: misconfiguration or drift alert}
    - {from: logic-create-github-issue, to: GitHub Issues, label: configuration drifts and reconciliation, step: 8}
    - {from: GitHub Issues, to: GitHub repos, label: reconcile drift in code}

- slug: devsecops-aks-github
  title: DevSecOps on Azure Kubernetes Service
  category: security
  tags: [devsecops, aks, github actions, github advanced security, defender for containers, azure policy, key vault, sentinel]
  source: https://learn.microsoft.com/en-us/azure/architecture/guide/devsecops/devsecops-on-aks
  description: Developers authenticate to GitHub through Microsoft Entra ID and commit to a governed repository where GitHub Advanced Security runs code, secret and dependency scanning; GitHub Actions builds the container image, pushes it to Azure Container Registry and deploys to AKS after environment approvals. Defender for Containers scans the registry and cluster, Azure Policy enforces admission rules through Gatekeeper, Key Vault injects secrets at runtime, and Azure Monitor with Managed Prometheus, Log Analytics and Microsoft Sentinel provide monitoring and SIEM.
  containers:
    - subscription: workload
      resource_group: {name: rg-devsecops-aks, location: westeurope}
      vnets:
        - name: vnet-devsecops
          cidr: 10.50.0.0/16
          subnets:
            - {name: snet-aks, cidr: 10.50.0.0/20}
  elements:
    - {tf: azurerm_container_registry, name: acr-secure, in: resource_group:rg-devsecops-aks}
    - {tf: azurerm_kubernetes_cluster, name: aks-secure, in: subnet:snet-aks}
    - {tf: azurerm_key_vault, name: kv-runtime-secrets, in: resource_group:rg-devsecops-aks}
    - {tf: azurerm_security_center_subscription_pricing, name: defender-containers, in: resource_group:rg-devsecops-aks}
    - {tf: azurerm_monitor_workspace, name: amw-prometheus, in: resource_group:rg-devsecops-aks}
    - {tf: azurerm_dashboard_grafana, name: grafana-aks, in: resource_group:rg-devsecops-aks}
    - {tf: azurerm_log_analytics_workspace, name: law-aks-secure, in: resource_group:rg-devsecops-aks}
    - {tf: azurerm_sentinel_log_analytics_workspace_onboarding, name: sentinel-aks, in: resource_group:rg-devsecops-aks}
  actors: [user, idp, saas]
  flows:
    - {from: user, to: idp, label: Entra ID sign-in with MFA, step: 1}
    - {from: user, to: saas, label: commit to GitHub Enterprise (Advanced Security scans), step: 2}
    - {from: saas, to: acr-secure, label: GitHub Actions CI builds and pushes image, step: 3}
    - {from: defender-containers, to: acr-secure, label: image vulnerability scan, step: 4}
    - {from: saas, to: aks-secure, label: CD after environment approval (OIDC), step: 5}
    - {from: acr-secure, to: aks-secure, label: pull only trusted registries (Azure Policy)}
    - {from: aks-secure, to: kv-runtime-secrets, label: secrets injected at runtime}
    - {from: defender-containers, to: aks-secure, label: runtime threat protection}
    - {from: aks-secure, to: amw-prometheus, label: Managed Prometheus metrics}
    - {from: amw-prometheus, to: grafana-aks, label: dashboards}
    - {from: aks-secure, to: law-aks-secure, label: container logs + audit}
    - {from: law-aks-secure, to: sentinel-aks, label: SIEM correlation}

- slug: azure-monitor-observability-platform
  title: Azure Monitor observability platform
  category: observability
  tags: [azure monitor, log analytics, azure monitor workspace, application insights, opentelemetry, prometheus, alerts, action groups, grafana]
  source: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview
  description: Azure Monitor collects metrics, logs and traces from applications and workloads, infrastructure, the Azure platform and custom sources into an Azure Monitor workspace for Prometheus metrics, a Log Analytics workspace for logs queried with KQL and Application Insights for distributed traces. Insights (Application, Kubernetes, VM, Network) curate that data, workbooks, Azure dashboards, Grafana and Power BI visualize it, Log Analytics query packs analyze it, and metric and log alerts drive action groups that notify or automate a response.
  containers:
    - subscription: platform
      resource_group: {name: rg-monitoring, location: westeurope}
      groups:
