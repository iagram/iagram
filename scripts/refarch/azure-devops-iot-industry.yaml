  title: Automotive connected fleets reference architecture
  category: industry
  tags: [connected vehicles, telematics, event grid mqtt, iot hub, event hubs, azure data explorer, cosmos db, synapse, fleet management]
  source: https://learn.microsoft.com/en-us/industry/mobility/architecture/automotive-connected-fleets-content
  description: Vehicles publish protobuf or JSON telemetry over MQTT to Azure Event Grid (or IoT Hub); Azure Functions validate metadata, decode, enrich and route messages using configuration and vehicle registrations stored in Cosmos DB, and archive raw, decoded and failed messages in a data lake. The fleet integration layer receives standardized payloads on Event Hubs, ingests status, events and trips into Azure Data Explorer, exposes vehicle APIs through API Management, and Synapse pipelines build bronze/silver/gold tables for Power BI and Dynamics 365 business processes.
  containers:
    - subscription: mobility
      resource_group: {name: rg-connected-fleets, location: westeurope}
      groups:
        - {label: Telematics}
        - {label: Fleet integration}
        - {label: Analytics}
  elements:
    - {tf: azurerm_eventgrid_namespace, name: egns-vehicle-mqtt, in: group:Telematics}
    - {tf: azurerm_iothub_dps, name: dps-vehicles, in: group:Telematics}
    - {tf: azurerm_linux_function_app, name: func-message-processing, in: group:Telematics}
    - {tf: azurerm_cosmosdb_account, name: cosmos-vehicles-config, in: group:Telematics}
    - {tf: azurerm_api_management, name: apim-fleet, in: group:Telematics}
    - {tf: azurerm_eventhub_namespace, name: evhns-fleet-integration, in: group:Fleet integration}
    - {tf: azurerm_eventhub, name: evh-vehicle-status, in: group:Fleet integration}
    - {tf: azurerm_eventhub, name: evh-vehicle-events, in: group:Fleet integration}
    - {tf: azurerm_kusto_cluster, name: adx-fleet, in: group:Analytics}
    - {tf: azurerm_storage_account, name: stfleetlake, in: group:Analytics}
    - {tf: azurerm_synapse_workspace, name: synw-fleet, in: group:Analytics}
    - {tf: azurerm_linux_web_app, name: app-fleet-portal, in: group:Fleet integration}
    - {tf: azurerm_maps_account, name: maps-fleet, in: group:Fleet integration}
  actors: [device, users, saas]
  flows:
    - {from: device, to: dps-vehicles, label: zero-touch provisioning}
    - {from: device, to: egns-vehicle-mqtt, label: MQTT telemetry (protobuf / JSON, headers), step: 1}
    - {from: egns-vehicle-mqtt, to: func-message-processing, label: validate, decode, enrich, route, step: 2}
    - {from: func-message-processing, to: cosmos-vehicles-config, label: message types, claims, vehicle registry, step: 3}
    - {from: func-message-processing, to: stfleetlake, label: raw, decoded and failed messages, step: 4}
    - {from: func-message-processing, to: evh-vehicle-status, label: routed by message type, step: 5}
    - {from: func-message-processing, to: evh-vehicle-events, label: alerts, notifications, trips}
    - {from: evh-vehicle-status, to: adx-fleet, link: azurerm_kusto_eventhub_data_connection, label: native ingestion, step: 6}
    - {from: evh-vehicle-events, to: adx-fleet, link: azurerm_kusto_eventhub_data_connection, label: events and trips tables}
    - {from: apim-fleet, to: cosmos-vehicles-config, label: vehicle and device management API}
    - {from: saas, to: apim-fleet, label: Power Platform connector triggers and actions}
    - {from: stfleetlake, to: synw-fleet, label: bronze / silver / gold pipelines, step: 7}
    - {from: users, to: app-fleet-portal, label: fleet operations portal}
    - {from: app-fleet-portal, to: maps-fleet, label: geospatial services}

- slug: banking-saga-eft-processing
  title: Banking cloud transformation with a serverless saga and KEDA-scaled EFT processing
  category: industry
  tags: [financial services, payments, saga, durable functions, event hubs, cosmos db, keda, aks, load testing]
  source: https://learn.microsoft.com/en-us/industry/financial-services/architecture/patterns-and-implementations-content
  description: Distributed financial transactions are coordinated with an orchestration-based saga implemented in Azure Durable Functions, with saga participants as Azure Functions, Event Hubs as the streaming platform and Cosmos DB as the state store. An electronic funds transfer processor on AKS scales with KEDA using the Kafka topic trigger against Event Hubs, and Azure Load Testing with JMeter scripts validates performance in the CI/CD pipeline.
  containers:
    - subscription: banking
      resource_group: {name: rg-banking-core, location: westeurope}
      groups:
        - {label: Saga orchestration}
        - {label: EFT processing}
      vnets:
        - name: vnet-banking
          cidr: 10.80.0.0/16
          subnets:
            - {name: snet-aks, cidr: 10.80.0.0/20}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-transactions, in: group:Saga orchestration}
    - {tf: azurerm_eventhub, name: evh-eft-requests, in: group:Saga orchestration}
    - {tf: azurerm_linux_function_app, name: func-saga-orchestrator, in: group:Saga orchestration}
    - {tf: azurerm_linux_function_app, name: func-saga-participants, in: group:Saga orchestration}
    - {tf: azurerm_storage_account, name: stdurablestate, in: group:Saga orchestration}
    - {tf: azurerm_cosmosdb_account, name: cosmos-ledger, in: group:Saga orchestration}
    - {tf: azurerm_kubernetes_cluster, name: aks-eft-processor, in: subnet:snet-aks}
    - {tf: azurerm_container_registry, name: acr-banking, in: group:EFT processing}
    - {tf: azurerm_load_test, name: alt-jmeter, in: group:EFT processing}
    - {tf: azurerm_application_insights, name: appi-banking, in: group:EFT processing}
  actors: [client, saas]
  flows:
    - {from: client, to: func-saga-orchestrator, label: transfer request, step: 1}
    - {from: func-saga-orchestrator, to: stdurablestate, label: Durable Functions state + timeouts}
    - {from: func-saga-orchestrator, to: evh-eft-requests, label: publish saga commands, step: 2}
    - {from: evh-eft-requests, to: func-saga-participants, label: participant triggers, step: 3}
    - {from: func-saga-participants, to: cosmos-ledger, label: local transactions / compensations, step: 4}
    - {from: func-saga-participants, to: evh-eft-requests, label: reply events}
    - {from: evh-eft-requests, to: aks-eft-processor, label: KEDA Kafka topic trigger scales EFT pods, step: 5}
    - {from: acr-banking, to: aks-eft-processor, label: EFT processor image}
    - {from: aks-eft-processor, to: cosmos-ledger, label: settle transfers}
    - {from: saas, to: alt-jmeter, label: CI/CD pipeline runs load test, step: 6}
    - {from: alt-jmeter, to: func-saga-orchestrator, label: JMeter traffic}
    - {from: aks-eft-processor, to: appi-banking, label: saga workflow observability}

- slug: fraud-detection-stream-analytics
  title: Real-time fraud detection with Stream Analytics
  category: industry
  tags: [financial services, fraud detection, event hubs, stream analytics, power bi, self-join, tumbling window]
  source: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-real-time-fraud-detection
  description: A generator sends call detail records to an Event Hubs namespace; a Stream Analytics job reads the stream with a dedicated consumer group and uses a self-join with DATEDIFF to flag calls from the same subscriber identity in different regions within five seconds, aggregated over tumbling windows. Flagged records are written to a Power BI streaming dataset for a live dashboard, and the same technique applies to credit card fraud and identity theft.
  containers:
    - subscription: fraud-analytics
      resource_group: {name: rg-fraud-detection, location: westeurope}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-calls, in: resource_group:rg-fraud-detection}
    - {tf: azurerm_eventhub, name: evh-call-stream, in: resource_group:rg-fraud-detection}
    - {tf: azurerm_stream_analytics_job, name: asa-fraud, in: resource_group:rg-fraud-detection}
    - {tf: azurerm_powerbi_embedded, name: pbi-fraud-dashboard, in: resource_group:rg-fraud-detection}
    - {tf: azurerm_storage_account, name: stfraudarchive, in: resource_group:rg-fraud-detection}
    - {tf: azurerm_linux_web_app, name: app-embedded-dashboard, in: resource_group:rg-fraud-detection}
  actors: [client, users]
  flows:
    - {from: client, to: evh-call-stream, label: TelcoGenerator call records (AMQP), step: 1}
    - {from: evh-call-stream, to: asa-fraud, label: CallStream input, consumer group, step: 2}
    - {from: asa-fraud, to: asa-fraud, label: "self-join: same IMSI, different switch within 5 s", step: 3}
    - {from: asa-fraud, to: pbi-fraud-dashboard, label: Power BI streaming dataset output, step: 4}
    - {from: evh-call-stream, to: stfraudarchive, label: Event Hubs Capture archive}
    - {from: pbi-fraud-dashboard, to: app-embedded-dashboard, label: embedded dashboard}
    - {from: users, to: app-embedded-dashboard, label: fraudulent calls dashboard, step: 5}

- slug: risk-modeling-big-compute-batch
  title: Financial risk modeling with the big compute architecture style on Azure Batch
  category: industry
  tags: [financial services, risk modeling, monte carlo, big compute, azure batch, hpc, infiniband, burst]
  source: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/big-compute
  description: Big compute workloads such as financial risk modeling and Monte Carlo simulations split into thousands of finite tasks that a client submits through a job queue to a scheduler and coordinator, Azure Batch, which distributes them across burst-provisioned pools of compute-intensive VMs that scale back to zero when the run finishes. Embarrassingly parallel tasks each read their inputs from and write their results to Azure Storage independently, while tightly coupled tasks run on RDMA-capable H-series VMs in a pool that exchanges intermediate results over the network and shares one storage account.
  containers:
    - subscription: risk
      resource_group: {name: rg-risk-grid, location: westeurope}
      groups:
        - {label: Parallel tasks, at: [1, 2]}
        - {label: Tightly coupled tasks, at: [2, 2]}
  elements:
    - {tf: azurerm_batch_account, name: batch-risk, in: resource_group:rg-risk-grid, at: [1, 1, 2, 1]}
    - {tf: azurerm_storage_account, name: st-task-inputs, in: group:Parallel tasks, at: [1, 1]}
    - {tf: azurerm_batch_pool, name: pool-parallel, in: group:Parallel tasks, at: [1, 2]}
    - {tf: azurerm_storage_account, name: st-task-results, in: group:Parallel tasks, at: [1, 3]}
    - {tf: azurerm_storage_account, name: st-shared-data, in: group:Tightly coupled tasks, at: [1, 1]}
    - {tf: azurerm_batch_pool, name: pool-hb-rdma, in: group:Tightly coupled tasks, at: [2, 1]}
  actors:
    - {type: client, name: Client, at: [1, 1]}
  flows:
    - {from: Client, to: batch-risk, label: job queue (Monte Carlo tasks), step: 1}
    - {from: Client, to: st-task-inputs, label: upload market data and application packages}
    - {from: batch-risk, to: pool-parallel, label: schedule independent tasks, provision VMs, autoscale, step: 2}
    - {from: batch-risk, to: pool-hb-rdma, label: schedule MPI tasks on RDMA-capable nodes, step: 2}
    - {from: st-task-inputs, to: pool-parallel, label: read inputs, step: 3}
    - {from: pool-parallel, to: st-task-results, label: write results, step: 4}
    - {from: pool-hb-rdma, to: st-shared-data, label: shared input and results}
    - {from: pool-hb-rdma, to: pool-hb-rdma, label: node-to-node InfiniBand exchange}

- slug: health-data-fhir-dicom
  title: Health data platform with Azure Health Data Services (FHIR and DICOM)
  category: industry
  tags: [healthcare, fhir, dicom, medical imaging, health data services, smart on fhir, data lake, de-identification]
  source: https://learn.microsoft.com/en-us/azure/healthcare-apis/healthcare-apis-overview
  description: An Azure Health Data Services workspace hosts a managed FHIR service for clinical records and a DICOM service for medical imaging, with Microsoft Entra RBAC, private link, customer-managed keys and per-instance data isolation. EHR systems and SMART on FHIR apps exchange data through the FHIR API, DICOMweb clients store and query imaging studies whose metadata can be projected into FHIR ImagingStudy resources, and exports feed a data lake for de-identification, analytics and machine learning.
  containers:
    - datacenter: hospital
    - subscription: healthcare
      resource_group: {name: rg-health-data, location: westeurope}
      vnets:
        - name: vnet-health
          cidr: 10.100.0.0/16
          subnets:
            - {name: snet-private-endpoints, cidr: 10.100.1.0/24}
  elements:
    - {tf: azurerm_healthcare_workspace, name: ahds-workspace, in: resource_group:rg-health-data}
    - {tf: azurerm_healthcare_fhir_service, name: fhir-clinical, in: resource_group:rg-health-data}
    - {tf: azurerm_healthcare_dicom_service, name: dicom-imaging, in: resource_group:rg-health-data}
    - {tf: azurerm_private_endpoint, name: pe-ahds, in: subnet:snet-private-endpoints}
    - {tf: azurerm_storage_account, name: sthealthlake, in: resource_group:rg-health-data}
    - {tf: azurerm_synapse_workspace, name: synw-health, in: resource_group:rg-health-data}
    - {tf: azurerm_key_vault, name: kv-health-cmk, in: resource_group:rg-health-data}
    - {tf: azurerm_linux_web_app, name: app-smart-on-fhir, in: resource_group:rg-health-data}
    - {tf: azurerm_log_analytics_workspace, name: law-health-audit, in: resource_group:rg-health-data}
  actors: [datacenter, users, idp]
  flows:
    - {from: datacenter, to: fhir-clinical, label: EHR sends FHIR bundles (RESTful API), step: 1}
    - {from: datacenter, to: dicom-imaging, label: modalities / PACS store via DICOMweb STOW-RS, step: 2}
    - {from: users, to: app-smart-on-fhir, label: patient / provider app}
    - {from: app-smart-on-fhir, to: idp, label: SMART on FHIR authorization (Entra ID), step: 3}
    - {from: app-smart-on-fhir, to: fhir-clinical, label: FHIR queries with bearer token, step: 4}
    - {from: dicom-imaging, to: fhir-clinical, label: DICOMcast projects ImagingStudy metadata}
    - {from: pe-ahds, to: ahds-workspace, label: private link}
    - {from: fhir-clinical, to: sthealthlake, label: $export to data lake, step: 5}
    - {from: dicom-imaging, to: sthealthlake, label: export DICOM files}
    - {from: sthealthlake, to: synw-health, label: de-identified analytics and ML, step: 6}
    - {from: ahds-workspace, to: kv-health-cmk, label: customer-managed keys}
    - {from: ahds-workspace, to: law-health-audit, label: audit logs}

- slug: gaming-backend-cosmos-db
  title: Gaming backend with Azure Cosmos DB
  category: industry
  tags: [gaming, cosmos db, leaderboards, player profiles, app service, functions, notification hubs, event hubs]
  source: https://learn.microsoft.com/en-us/azure/cosmos-db/use-cases
  description: Game clients call a stateless API tier that stores player profiles, in-game stats, guild membership and leaderboards in Azure Cosmos DB, whose automatic indexing supports lookups by player ID or social identities and whose throughput scales elastically for launches and feature updates. Telemetry and match events are ingested through Event Hubs and Azure Functions, notifications reach players through Notification Hubs, and Traffic Manager routes clients to the closest region of a multi-region Cosmos DB account.
  containers:
    - subscription: gaming
      resource_group: {name: rg-game-backend, location: westeurope}
      groups:
        - {label: API tier}
        - {label: Data and events}
  elements:
    - {tf: azurerm_traffic_manager_profile, name: tm-game-api, in: resource_group:rg-game-backend}
    - {tf: azurerm_service_plan, name: plan-game-api, in: group:API tier}
    - {tf: azurerm_linux_web_app, name: app-game-api, in: group:API tier}
    - {tf: azurerm_redis_cache, name: redis-leaderboard-cache, in: group:API tier}
    - {tf: azurerm_cosmosdb_account, name: cosmos-players, in: group:Data and events}
    - {tf: azurerm_eventhub_namespace, name: evhns-game-telemetry, in: group:Data and events}
    - {tf: azurerm_eventhub, name: evh-match-events, in: group:Data and events}
    - {tf: azurerm_linux_function_app, name: func-event-processor, in: group:Data and events}
    - {tf: azurerm_notification_hub_namespace, name: nhns-game, in: group:Data and events}
    - {tf: azurerm_notification_hub, name: nh-player-push, in: group:Data and events}
    - {tf: azurerm_storage_account, name: stgameassets, in: group:Data and events}
  actors: [mobile, users]
  flows:
    - {from: mobile, to: tm-game-api, label: nearest region, step: 1}
    - {from: tm-game-api, to: app-game-api, label: route to API tier, step: 2}
    - {from: app-game-api, to: cosmos-players, label: profiles, stats, guilds, leaderboards (ms latency), step: 3}
    - {from: app-game-api, to: redis-leaderboard-cache, label: hot leaderboard cache}
    - {from: app-game-api, to: evh-match-events, label: in-game events, step: 4}
    - {from: evh-match-events, to: func-event-processor, label: Event Hubs trigger, step: 5}
    - {from: func-event-processor, to: cosmos-players, label: update stats / high scores}
    - {from: cosmos-players, to: func-event-processor, label: change feed}
    - {from: func-event-processor, to: nh-player-push, label: achievements, challenges, step: 6}
    - {from: nh-player-push, to: mobile, label: push notifications}
    - {from: users, to: stgameassets, label: static game content}
