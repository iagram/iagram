- slug: chaos-studio-resilience-testing
  title: Resilience testing with Azure Chaos Studio
  category: resilience
  tags: [chaos studio, chaos engineering, fault injection, service-direct faults, agent-based faults, game day, ci/cd gate]
  source: https://learn.microsoft.com/en-us/azure/chaos-studio/chaos-studio-overview
  description: Chaos Studio Workspaces discover the resources in a subscription or resource group scope and run Scenarios such as Compute Zone Down or DNS Outage against onboarded targets; the classic Experiments model composes service-direct faults (VM shutdown, SQL failover, Redis flush) and agent-based in-guest faults into steps and branches. Results are paired with Azure Monitor telemetry to assess recovery, and experiments can run as deployment gates in CI/CD pipelines or in game days.
  containers:
    - subscription: workload
      resource_group: {name: rg-chaos-target, location: westeurope}
      vnets:
        - name: vnet-target
          cidr: 10.70.0.0/16
          subnets:
            - {name: snet-web, cidr: 10.70.0.0/24}
            - {name: snet-aks, cidr: 10.70.16.0/20}
  elements:
    - {tf: azurerm_chaos_studio_experiment, name: chaos-zone-down, in: resource_group:rg-chaos-target}
    - {tf: azurerm_chaos_studio_target, name: chaos-target-vmss, in: resource_group:rg-chaos-target}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-web, in: subnet:snet-web}
    - {tf: azurerm_kubernetes_cluster, name: aks-target, in: subnet:snet-aks}
    - {tf: azurerm_mssql_server, name: sql-target, in: resource_group:rg-chaos-target}
    - {tf: azurerm_redis_cache, name: redis-target, in: resource_group:rg-chaos-target}
    - {tf: azurerm_log_analytics_workspace, name: law-chaos, in: resource_group:rg-chaos-target}
    - {tf: azurerm_application_insights, name: appi-chaos, in: resource_group:rg-chaos-target}
    - {tf: azurerm_load_test, name: alt-baseline, in: resource_group:rg-chaos-target}
  actors: [user, saas]
  flows:
    - {from: saas, to: chaos-zone-down, label: pipeline stage starts experiment (deployment gate), step: 1}
    - {from: user, to: chaos-zone-down, label: game day run}
    - {from: chaos-zone-down, to: chaos-target-vmss, label: agent-based fault (CPU pressure, process kill), step: 2}
    - {from: chaos-target-vmss, to: vmss-web, label: onboarded target}
    - {from: chaos-zone-down, to: aks-target, label: service-direct fault (Chaos Mesh pod faults), step: 2}
    - {from: chaos-zone-down, to: sql-target, label: service-direct fault (failover), step: 2}
    - {from: chaos-zone-down, to: redis-target, label: service-direct fault (cache flush), step: 2}
    - {from: alt-baseline, to: vmss-web, label: load during experiment, step: 3}
    - {from: vmss-web, to: appi-chaos, label: application telemetry}
    - {from: aks-target, to: law-chaos, label: platform metrics and logs}
    - {from: appi-chaos, to: user, label: assess recovery with Scenario report, step: 4}

- slug: iot-hub-cloud-connected
