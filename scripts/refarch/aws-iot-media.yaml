    - {from: edge-inference-server, to: control-plane-api, label: VPC local route to region, step: 3}
    - {from: control-plane-api, to: session-db, label: session state, step: 4}
    - {from: model-artifacts, to: edge-container-cluster, label: model pull at task start}
