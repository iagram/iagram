- slug: wavelength-5g-edge-application
  title: 5G edge application in an AWS Wavelength Zone
  category: edge
  tags: [wavelength, 5g, carrier gateway, edge compute, low latency]
  source: https://docs.aws.amazon.com/wavelength/latest/developerguide/how-wavelengths-work.html
  description: A VPC in the parent region spans two regional Availability Zones (A and B) and is extended with a subnet in a Wavelength Zone inside the communications service provider (CSP) network; each subnet hosts EC2 instances. A carrier gateway at the edge of the Wavelength Zone NATs Carrier IP addresses and admits only traffic from the CSP network, so mobile devices on the 5G network reach the edge instances with minimal latency while the regional subnets keep the rest of the application in the parent region.
  containers:
    - region: us-east-1
      at: [1, 1, 2, 1]
      vpcs:
        - name: edge-app
          cidr: 10.40.0.0/16
          at: [1, 1]
          subnets:
            - {name: region-private-a, cidr: 10.40.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: region-private-b, cidr: 10.40.2.0/24, az: b, public: false, at: [1, 1]}
            - {name: wavelength-bos, cidr: 10.40.10.0/24, az: wl1-bos-wlz-1, public: true, at: [1, 1]}
  elements:
    - {tf: aws_instance, name: app-server-a, in: subnet:region-private-a, at: [1, 1]}
    - {tf: aws_instance, name: app-server-b, in: subnet:region-private-b, at: [1, 1]}
    - {tf: aws_instance, name: edge-server, in: subnet:wavelength-bos, at: [1, 1]}
    - {tf: aws_ec2_carrier_gateway, name: carrier-gw, in: vpc:edge-app, at: [1, 4]}
  actors: [{type: internet, name: CSP network, at: [1, 2]}, {type: mobile, name: mobile device, at: [2, 2]}]
  flows:
    - {from: mobile device, to: CSP network, label: 5G access}
    - {from: CSP network, to: carrier-gw, label: Carrier IP traffic from the carrier network}
    - {from: carrier-gw, to: edge-server, label: NAT to instance private IP}

