    - {tf: aws_kinesis_video_stream, name: field-camera-stream, in: group:ingestion}
    - {tf: aws_kinesisanalyticsv2_application, name: flink-insights, in: group:analytics}
    - {tf: aws_sns_topic, name: farmer-alerts, in: group:analytics}
    - {tf: aws_opensearch_domain, name: farm-search, in: group:analytics}
    - {tf: aws_s3_bucket, name: farm-data-lake, in: group:analytics}
    - {tf: aws_glue_crawler, name: lake-crawler, in: group:analytics}
    - {tf: aws_athena_workgroup, name: farm-athena, in: group:analytics}
    - {tf: aws_api_gateway_rest_api, name: insights-api, in: group:analytics}
    - {tf: aws_sagemaker_endpoint, name: crop-model-endpoint, in: group:ml}
