- slug: kinesis-video-streams-ingestion
  title: Video ingestion and analytics with Kinesis Video Streams
  category: media
  tags: [kinesis video streams, cameras, video analytics, sagemaker, computer vision]
  source: https://docs.aws.amazon.com/kinesisvideostreams/latest/dg/how-it-works.html
  description: Cameras and other producers push time-encoded media into Kinesis video streams with the producer SDK; the service durably stores and time-indexes fragments for the configured retention. Consumer applications on EC2 read fragments with the parser library and call a SageMaker endpoint for frame-level inference, publishing detections to a Kinesis data stream that a Lambda function writes to DynamoDB and, for alerts, to SNS.
  containers:
    - region: us-west-2
      vpcs:
        - name: analytics
          cidr: 10.30.0.0/16
          subnets:
            - {name: consumers-a, cidr: 10.30.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_kinesis_video_stream, name: camera-stream, in: region}
    - {tf: aws_instance, name: kvs-consumer-app, in: subnet:consumers-a}
    - {tf: aws_sagemaker_endpoint, name: object-detection-endpoint, in: region}
    - {tf: aws_kinesis_stream, name: detections-stream, in: region}
    - {tf: aws_lambda_function, name: detections-writer, in: region}
    - {tf: aws_dynamodb_table, name: detections-table, in: region}
    - {tf: aws_sns_topic, name: security-alerts, in: region}
    - {tf: aws_s3_bucket, name: clip-archive, in: region}
  actors: [device, users]
  flows:
    - {from: device, to: camera-stream, label: PutMedia via producer SDK, step: 1}
    - {from: camera-stream, to: kvs-consumer-app, label: GetMedia fragments, step: 2}
    - {from: kvs-consumer-app, to: object-detection-endpoint, label: frame inference, step: 3}
    - {from: kvs-consumer-app, to: detections-stream, label: detection events, step: 4}
    - {from: detections-stream, to: detections-writer, link: aws_lambda_event_source_mapping}
    - {from: detections-writer, to: detections-table, label: persist detections, step: 5}
    - {from: detections-writer, to: security-alerts, label: high-severity alert, step: 5}
    - {from: kvs-consumer-app, to: clip-archive, label: export clips of interest}
    - {from: users, to: camera-stream, label: HLS/DASH playback of live or archived video}

- slug: live-streaming-on-aws
  title: Live Streaming on AWS
  category: media
  tags: [medialive, mediapackage, cloudfront, hls, dash, live streaming]
  source: https://docs.aws.amazon.com/solutions/latest/live-streaming-on-aws/architecture-overview.html
  description: MediaLive ingests two redundant contribution feeds and transcodes them into adaptive bitrate HLS; MediaPackage packages the output into HLS, DASH and CMAF endpoints and acts as the origin. CloudFront delivers the stream to viewers, authenticating to MediaPackage with a CDN identifier header stored in Secrets Manager, and a demo player is hosted from an S3 bucket.
  containers:
    - region: us-east-1
      groups: [{label: ingest and transcode}, {label: package and deliver}]
  elements:
