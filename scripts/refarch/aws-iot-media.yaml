    - {tf: aws_api_gateway_rest_api, name: m2c-api, in: region, at: [2, 2]}
    - {tf: aws_cloudfront_distribution, name: m2c-web, in: region, at: [3, 2]}
    - {tf: aws_sfn_state_machine, name: main-state-machine, in: group:main state machine, at: [1, 1, 2, 1]}
    - {tf: aws_sfn_state_machine, name: ingestion-workflow, in: group:main state machine, at: [1, 2]}
    - {tf: aws_sfn_state_machine, name: analysis-workflow, in: group:main state machine, at: [2, 2]}
    - {tf: aws_media_convert_queue, name: proxy-transcode-queue, in: group:media services and tools, at: [1, 1]}
    - {tf: aws_lambda_function, name: open-source-tools, in: group:media services and tools, at: [1, 2]}
    - {tf: aws_rekognition_collection, name: face-collection, in: group:AI/ML services, at: [1, 1]}
    - {tf: aws_transcribe_vocabulary, name: transcribe-vocabulary, in: group:AI/ML services, at: [1, 2]}
    - {tf: aws_comprehend_entity_recognizer, name: comprehend-recognizer, in: group:AI/ML services, at: [1, 3]}
    - {tf: aws_dynamodb_table, name: ingest-table, in: group:datastore services, at: [1, 1]}
    - {tf: aws_opensearch_domain, name: media-search, in: group:datastore services, at: [1, 2]}
    - {tf: aws_iot_topic_rule, name: workflow-progress-topic, in: group:notification services, at: [1, 1]}
    - {tf: aws_sns_topic, name: m2c-events, in: group:notification services, at: [1, 2]}
