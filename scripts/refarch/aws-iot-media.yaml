    - {tf: aws_s3_bucket, name: ingest-bucket, in: group:storage services, at: [1, 3]}
    - {tf: aws_s3_bucket, name: logs-bucket, in: group:storage services, at: [1, 4]}
  actors: [{type: users, name: users, at: [1, 1]}, {type: server, name: downstream process, at: [2, 3]}]
  flows:
    - {from: users, to: m2c-users, label: Cognito sign-in, step: 1}
    - {from: m2c-users, to: m2c-api, label: authenticated REST calls, step: 2}
    - {from: users, to: m2c-web, label: web application, step: 3}
    - {from: m2c-web, to: web-bucket, label: static web app origin}
    - {from: m2c-api, to: main-state-machine, label: start workflow, step: 4}
    - {from: main-state-machine, to: ingestion-workflow, label: ingest sub-workflow, step: 5}
    - {from: main-state-machine, to: analysis-workflow, label: analysis sub-workflow, step: 6}
    - {from: ingestion-workflow, to: proxy-transcode-queue, label: proxy generation}
    - {from: ingestion-workflow, to: open-source-tools, label: media, image and document tools}
    - {from: analysis-workflow, to: face-collection, label: Rekognition analysis}
    - {from: analysis-workflow, to: transcribe-vocabulary, label: Transcribe jobs}
    - {from: analysis-workflow, to: comprehend-recognizer, label: Comprehend jobs}
    - {from: main-state-machine, to: ingest-table, label: workflow artifacts, step: 7}
    - {from: main-state-machine, to: media-search, label: index ML metadata, step: 8}
