    - {from: greengrass-gateway, to: field-camera-stream, label: live video}
    - {from: greengrass-gateway, to: device-management-fleet-index, label: fleet management}
    - {from: greengrass-gateway, to: device-defender-audit, label: security audit and detect}
    - {from: crop-model, to: edge-inference-model, label: enable ML and edge inference, step: 4}
    - {from: ground-truth-labeling, to: crop-model, label: labelled training data}
    - {from: farm-data-lake, to: crop-model, label: training data}
    - {from: sensor-stream, to: flink-insights, label: streaming analytics}
