- slug: iot-telemetry-rules-kinesis-firehose
  title: IoT Core telemetry pipeline with rules, Kinesis, Firehose and Timestream
  category: iot
  tags: [iot core, rules engine, kinesis, firehose, timestream, telemetry]
  source: https://docs.aws.amazon.com/wellarchitected/latest/iot-lens/device-telemetry.html
  description: Devices publish read-only telemetry on a data/ topic namespace to the IoT Core message broker; topic rules fan the same messages out to a Kinesis data stream for real-time processing, a Firehose delivery stream that lands raw records in S3, and a Timestream table for time-series queries. A Lambda consumer on the Kinesis stream writes latest-state records to DynamoDB while Glue and Athena query the S3 archive.
  containers:
    - region: eu-west-1
      groups: [{label: ingestion}, {label: hot path}, {label: cold path}]
  elements:
    - {tf: aws_iot_thing, name: sensor-thing, in: group:ingestion}
    - {tf: aws_iot_topic_rule, name: telemetry-rule, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: telemetry-stream, in: group:hot path}
    - {tf: aws_lambda_function, name: state-processor, in: group:hot path}
    - {tf: aws_dynamodb_table, name: device-state, in: group:hot path}
    - {tf: aws_timestreamwrite_database, name: telemetry-tsdb, in: group:hot path}
    - {tf: aws_grafana_workspace, name: ops-dashboards, in: group:hot path}
    - {tf: aws_kinesis_firehose_delivery_stream, name: telemetry-firehose, in: group:cold path}
    - {tf: aws_s3_bucket, name: telemetry-lake, in: group:cold path}
    - {tf: aws_glue_catalog_database, name: telemetry-catalog, in: group:cold path}
    - {tf: aws_athena_workgroup, name: telemetry-athena, in: group:cold path}
  actors: [device]
  flows:
    - {from: device, to: sensor-thing, label: "MQTT publish data/<device>/<sensor>", step: 1}
    - {from: sensor-thing, to: telemetry-rule, label: rules engine SQL select, step: 2}
    - {from: telemetry-rule, to: telemetry-stream, label: kinesis action, step: 3}
    - {from: telemetry-rule, to: telemetry-firehose, label: firehose action, step: 3}
    - {from: telemetry-rule, to: telemetry-tsdb, label: timestream action, step: 3}
    - {from: telemetry-stream, to: state-processor, link: aws_lambda_event_source_mapping}
    - {from: state-processor, to: device-state, label: put latest state, step: 4}
    - {from: telemetry-firehose, to: telemetry-lake, label: buffered parquet objects, step: 4}
    - {from: telemetry-catalog, to: telemetry-lake, label: crawled schema}
    - {from: telemetry-athena, to: telemetry-catalog, label: SQL over archive}
    - {from: ops-dashboards, to: telemetry-tsdb, label: time-series queries}

- slug: iot-fleet-provisioning-by-claim
  title: IoT fleet provisioning by claim with pre-provisioning hook
  category: iot
  tags: [iot core, fleet provisioning, claim certificate, provisioning template, pre-provisioning hook]
  source: https://docs.aws.amazon.com/iot/latest/developerguide/provision-wo-cert.html
  description: Devices leave the factory with a shared claim certificate; on first connection they call CreateKeysAndCertificate and RegisterThing against a provisioning template, and IoT Core issues a unique X.509 certificate signed by the Amazon Root CA. A pre-provisioning hook Lambda validates the device serial against an allow-list in DynamoDB before the template creates the thing, attaches the policy and activates the certificate.
  containers:
    - region: us-east-1
      groups: [{label: provisioning}, {label: registry}]
  elements:
    - {tf: aws_iot_certificate, name: claim-certificate, in: group:provisioning}
    - {tf: aws_iot_policy, name: claim-policy, in: group:provisioning}
    - {tf: aws_iot_provisioning_template, name: fleet-template, in: group:provisioning}
    - {tf: aws_lambda_function, name: pre-provisioning-hook, in: group:provisioning}
    - {tf: aws_dynamodb_table, name: device-allowlist, in: group:provisioning}
    - {tf: aws_iot_thing, name: provisioned-thing, in: group:registry}
    - {tf: aws_iot_thing_group, name: production-fleet, in: group:registry}
    - {tf: aws_iot_policy, name: device-policy, in: group:registry}
    - {tf: aws_sns_topic, name: provisioning-alerts, in: group:registry}
  actors: [device]
  flows:
    - {from: device, to: claim-certificate, label: mTLS connect with claim cert, step: 1}
    - {from: claim-certificate, to: claim-policy, label: restricted to provisioning topics}
    - {from: device, to: fleet-template, label: "CreateKeysAndCertificate + RegisterThing", step: 2}
    - {from: fleet-template, to: pre-provisioning-hook, label: invoke hook with device parameters, step: 3}
    - {from: pre-provisioning-hook, to: device-allowlist, label: check serial number, step: 4}
    - {from: fleet-template, to: provisioned-thing, label: create thing from template, step: 5}
    - {from: provisioned-thing, to: production-fleet, label: add to thing group}
    - {from: fleet-template, to: device-policy, label: attach policy to new cert, step: 5}
    - {from: pre-provisioning-hook, to: provisioning-alerts, label: rejected device notification}
    - {from: device, to: provisioned-thing, label: reconnect with unique cert, step: 6}

- slug: iot-just-in-time-provisioning
  title: IoT just-in-time provisioning with a registered CA
  category: iot
  tags: [iot core, jitp, ca certificate, provisioning template, x509]
  source: https://docs.aws.amazon.com/iot/latest/developerguide/jit-provisioning.html
  description: A customer CA certificate is registered in IoT Core with auto-registration enabled and a JITP provisioning template attached. When a device presents a certificate signed by that CA for the first time, IoT Core registers the certificate as PENDING_ACTIVATION, runs RegisterThing with values extracted from the certificate subject, creates the thing, policy and thing-group membership, and flips the certificate to ACTIVE.
  containers:
    - region: eu-central-1
      groups: [{label: trust}, {label: registry}, {label: audit}]
  elements:
    - {tf: aws_iot_ca_certificate, name: manufacturer-ca, in: group:trust}
    - {tf: aws_iot_provisioning_template, name: jitp-template, in: group:trust}
    - {tf: aws_iot_thing_type, name: lightbulb-v1, in: group:registry}
    - {tf: aws_iot_thing, name: bulb-thing, in: group:registry}
    - {tf: aws_iot_thing_group, name: v1-lightbulbs, in: group:registry}
    - {tf: aws_iot_policy, name: bulb-policy, in: group:registry}
    - {tf: aws_iot_topic_rule, name: registration-events-rule, in: group:audit}
    - {tf: aws_lambda_function, name: registration-auditor, in: group:audit}
    - {tf: aws_dynamodb_table, name: registration-log, in: group:audit}
  actors: [device]
  flows:
    - {from: device, to: manufacturer-ca, label: TLS with CA-signed device cert, step: 1}
    - {from: manufacturer-ca, to: jitp-template, label: template associated with CA, step: 2}
    - {from: jitp-template, to: bulb-thing, label: create thing from cert CommonName, step: 3}
    - {from: bulb-thing, to: lightbulb-v1, label: thing type}
    - {from: bulb-thing, to: v1-lightbulbs, label: thing group}
    - {from: jitp-template, to: bulb-policy, label: attach policy and activate cert, step: 4}
    - {from: jitp-template, to: registration-events-rule, label: "$aws/events/certificates/registered", step: 5}
    - {from: registration-events-rule, to: registration-auditor, label: lambda action}
    - {from: registration-auditor, to: registration-log, label: record provisioning result}

- slug: greengrass-edge-ml-inference
  title: IoT Greengrass edge ML inference with cloud-trained models
  category: iot
  tags: [greengrass, edge inference, sagemaker, ml components, iot core]
  source: https://docs.aws.amazon.com/greengrass/v2/developerguide/perform-machine-learning-inference.html
  description: Models are trained in SageMaker and stored in S3, then deployed to Greengrass core devices as model, runtime and inference components so that inference runs locally on camera or sensor data. Inference results and low-confidence samples are published through IoT Core to a Kinesis stream and an S3 bucket that feeds the next training round.
  containers:
    - datacenter: factory-site
    - region: eu-west-1
      groups: [{label: model build}, {label: results}]
  elements:
    - {tf: aws_iot_thing, name: greengrass-core, in: datacenter}
    - {tf: aws_iot_thing_group, name: edge-fleet, in: region}
    - {tf: aws_sagemaker_model, name: defect-detector, in: group:model build}
    - {tf: aws_sagemaker_endpoint, name: model-validation-endpoint, in: group:model build}
    - {tf: aws_s3_bucket, name: model-artifacts, in: group:model build}
    - {tf: aws_iot_topic_rule, name: inference-results-rule, in: group:results}
    - {tf: aws_kinesis_stream, name: inference-stream, in: group:results}
    - {tf: aws_lambda_function, name: results-aggregator, in: group:results}
    - {tf: aws_dynamodb_table, name: inference-results, in: group:results}
    - {tf: aws_s3_bucket, name: retraining-samples, in: group:results}
  actors: [device]
  flows:
    - {from: defect-detector, to: model-artifacts, label: export compiled model, step: 1}
    - {from: model-artifacts, to: greengrass-core, label: model component artifact download, step: 2}
    - {from: edge-fleet, to: greengrass-core, label: component deployment target}
    - {from: device, to: greengrass-core, label: camera frames over local network, step: 3}
    - {from: greengrass-core, to: inference-results-rule, label: MQTT inference results, step: 4}
    - {from: inference-results-rule, to: inference-stream, label: kinesis action}
    - {from: inference-stream, to: results-aggregator, link: aws_lambda_event_source_mapping}
    - {from: results-aggregator, to: inference-results, label: per-line quality metrics, step: 5}
    - {from: greengrass-core, to: retraining-samples, label: low-confidence images via stream manager, step: 6}
    - {from: retraining-samples, to: defect-detector, label: next training dataset}
    - {from: model-validation-endpoint, to: defect-detector, label: cloud validation of candidate model}

- slug: smart-farm-on-aws
