    - {tf: aws_ecs_cluster, name: edge-container-cluster, in: subnet:wavelength-bos}
    - {tf: aws_instance, name: control-plane-api, in: subnet:region-private-a}
    - {tf: aws_rds_cluster, name: session-db, in: subnet:region-private-a}
    - {tf: aws_s3_bucket, name: model-artifacts, in: region}
    - {tf: aws_route53_zone, name: edge-dns, in: region}
  actors: [mobile]
  flows:
