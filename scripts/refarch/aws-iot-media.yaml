- slug: live-streaming-on-aws
  title: Live Streaming on AWS
  category: media
  tags: [medialive, mediapackage, cloudfront, hls, dash, live streaming]
  source: https://docs.aws.amazon.com/solutions/latest/live-streaming-on-aws/architecture-overview.html
  description: MediaLive ingests two redundant contribution feeds (primary and backup inputs) from the live channel source and transcodes them into adaptive bitrate HLS; MediaPackage packages the output just in time into HLS, DASH, MSS and CMAF endpoints and acts as the origin (MediaPackage channels are configuration in Terraform, so the packaging hop is drawn as the MediaLive to CloudFront edge). CloudFront delivers the stream to OTT playback devices, authenticating to MediaPackage with a CDN identifier header stored in Secrets Manager, and a demo preview player is hosted from an S3 bucket behind a second CloudFront distribution.
  containers:
    - region: us-east-1
      at: [1, 2, 2, 1]
      groups: [{label: ingest and transcode, at: [1, 1]}, {label: package and deliver, at: [1, 2]}]
  elements:
    - {tf: aws_medialive_input, name: primary-input, in: group:ingest and transcode, at: [1, 1]}
    - {tf: aws_medialive_input, name: backup-input, in: group:ingest and transcode, at: [2, 1]}
    - {tf: aws_medialive_channel, name: live-channel, in: group:ingest and transcode, at: [1, 2, 2, 1]}
    - {tf: aws_secretsmanager_secret, name: cdn-identifier, in: group:package and deliver, at: [2, 1]}
    - {tf: aws_cloudfront_distribution, name: live-cdn, in: group:package and deliver, at: [1, 1, 1, 2]}
    - {tf: aws_s3_bucket, name: demo-player-site, in: group:package and deliver, at: [2, 2]}
    - {tf: aws_cloudfront_distribution, name: demo-player-cdn, in: group:package and deliver, at: [2, 3]}
  actors: [{type: server, name: live channel source, at: [1, 1]}, {type: mobile, name: OTT devices, at: [1, 3]}, {type: users, name: users, at: [2, 3]}]
  flows:
    - {from: live channel source, to: primary-input, label: primary contribution feed, step: 1}
    - {from: live channel source, to: backup-input, label: backup feed (dual ingest), step: 1}
    - {from: primary-input, to: live-channel, label: attached input}
    - {from: backup-input, to: live-channel, label: attached input}
    - {from: live-channel, to: live-cdn, label: "ABR HLS output packaged by MediaPackage into HLS, DASH, MSS and CMAF origin endpoints", step: 2}
    - {from: live-cdn, to: cdn-identifier, label: CDN identifier header verification, step: 3}
    - {from: live-cdn, to: OTT devices, label: live stream playback on multiple devices, step: 4}
    - {from: demo-player-cdn, to: demo-player-site, label: demo preview player origin, step: 5}
    - {from: users, to: demo-player-cdn, label: open demo player}

- slug: video-on-demand-on-aws
  title: Video on Demand on AWS
  category: media
  tags: [mediaconvert, step functions, vod, transcoding, cloudfront, dynamodb]
  source: https://docs.aws.amazon.com/solutions/latest/video-on-demand-on-aws/architecture-overview.html
  description: Uploading a source video or a video plus metadata file to the source S3 bucket (with a lifecycle policy to S3 Glacier Flexible Retrieval) starts Step Functions ingest, process and publish workflows implemented with Lambda functions; MediaInfo probes the source during ingest. MediaConvert transcodes the asset into the destination bucket (MediaPackage VOD packaging is configuration and is not drawn), CloudWatch Events rules capture job status changes, DynamoDB tracks workflow state, SNS sends ingest, encoding and workflow summaries, SQS captures workflow outputs, and CloudFront delivers the encoded content.
  containers:
    - region: us-east-1
      at: [1, 2]
      groups: [{label: source, at: [2, 1]}, {label: ingest workflow, at: [2, 2]}, {label: process workflow, at: [2, 3]}, {label: publish workflow, at: [2, 4]}, {label: delivery, at: [2, 5]}]
  elements:
    - {tf: aws_s3_bucket, name: source-bucket, in: group:source, at: [1, 1]}
    - {tf: aws_glacier_vault, name: glacier-flexible-retrieval, in: group:source, at: [2, 1]}
    - {tf: aws_lambda_function, name: workflow-steps, in: region, at: [1, 2]}
    - {tf: aws_dynamodb_table, name: vod-workflow-table, in: region, at: [1, 3]}
    - {tf: aws_sfn_state_machine, name: ingest-workflow, in: group:ingest workflow, at: [1, 1]}
    - {tf: aws_lambda_function, name: mediainfo, in: group:ingest workflow, at: [2, 1]}
    - {tf: aws_sfn_state_machine, name: process-workflow, in: group:process workflow, at: [1, 1]}
    - {tf: aws_media_convert_queue, name: transcode-queue, in: group:process workflow, at: [2, 1]}
    - {tf: aws_cloudwatch_event_rule, name: mediaconvert-status-rule, in: group:process workflow, at: [3, 1]}
    - {tf: aws_sfn_state_machine, name: publish-workflow, in: group:publish workflow, at: [1, 1]}
    - {tf: aws_s3_bucket, name: destination-bucket, in: group:publish workflow, at: [2, 1]}
    - {tf: aws_cloudfront_distribution, name: vod-cdn, in: group:delivery, at: [1, 1]}
    - {tf: aws_sns_topic, name: workflow-notifications, in: region, at: [3, 2]}
    - {tf: aws_sqs_queue, name: workflow-outputs, in: region, at: [3, 4]}
  actors: [{type: client, name: source video, at: [1, 1]}]
  flows:
    - {from: source video, to: source-bucket, label: new video uploaded, step: 1}
    - {from: source-bucket, to: glacier-flexible-retrieval, label: lifecycle policy}
    - {from: source-bucket, to: ingest-workflow, label: S3 event starts ingest, step: 2}
    - {from: workflow-steps, to: ingest-workflow, label: Lambda tasks, step: 3}
    - {from: workflow-steps, to: process-workflow, label: Lambda tasks}
    - {from: workflow-steps, to: publish-workflow, label: Lambda tasks}
    - {from: workflow-steps, to: vod-workflow-table, label: record workflow state, step: 4}
    - {from: ingest-workflow, to: mediainfo, label: probe source media}
    - {from: ingest-workflow, to: process-workflow, label: encoding profile selected}
    - {from: process-workflow, to: transcode-queue, label: submit MediaConvert job, step: 5}
    - {from: transcode-queue, to: mediaconvert-status-rule, label: logging and CloudWatch Events rules, step: 6}
    - {from: ingest-workflow, to: workflow-notifications, label: ingest summary, step: 7}
    - {from: mediaconvert-status-rule, to: workflow-notifications, label: encoding complete}
    - {from: mediaconvert-status-rule, to: publish-workflow, link: aws_cloudwatch_event_target}
    - {from: publish-workflow, to: destination-bucket, label: MediaPackage destination file storage, step: 8}
    - {from: transcode-queue, to: destination-bucket, label: HLS/DASH/MP4 outputs, step: 9}
    - {from: destination-bucket, to: vod-cdn, label: delivery origin, step: 10}
    - {from: destination-bucket, to: workflow-outputs, label: workflow outputs, step: 11}
    - {from: publish-workflow, to: workflow-notifications, label: workflow summary}

- slug: media2cloud-asset-management
  title: Media asset management with Media2Cloud on AWS
  category: media
  tags: [media asset management, media2cloud, rekognition, transcribe, opensearch, step functions]
  source: https://docs.aws.amazon.com/solutions/latest/media2cloud-on-aws/architecture-overview.html
  description: Users sign in through Cognito and call API Gateway, which starts a main Step Functions state machine whose ingestion sub-workflow creates proxies with MediaConvert and open-source tools and whose analysis sub-workflow runs Rekognition, Transcribe, Comprehend and Textract jobs (Textract has no Terraform resource and is not drawn). DynamoDB holds workflow artifacts, OpenSearch indexes the extracted metadata, web, proxy, ingest and logs S3 buckets store the assets, CloudWatch and EventBridge capture job state changes for optional downstream integration, an IoT Core topic pushes progress over MQTT to the web app served through CloudFront, and SNS publishes ingest and analysis completion events.
  containers:
    - region: us-east-1
      at: [1, 2, 2, 1]
      groups:
        - {label: main state machine, at: [1, 3, 2, 1]}
        - {label: media services and tools, at: [1, 4]}
        - {label: AI/ML services, at: [2, 4]}
        - {label: datastore services, at: [3, 3]}
        - {label: notification services, at: [3, 4]}
        - {label: events services, at: [3, 5]}
        - {label: storage services, at: [4, 3, 1, 2]}
  elements:
