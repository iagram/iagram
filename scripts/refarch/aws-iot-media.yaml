- slug: ivs-interactive-live-streaming
  title: Interactive live streaming with Amazon IVS, chat and auto-record to S3
  category: media
  tags: [amazon ivs, low latency, live chat, auto-record, eventbridge, cloudfront]
  source: https://docs.aws.amazon.com/ivs/latest/LowLatencyUserGuide/record-to-s3.html
  description: Broadcasters push RTMPS to an IVS channel whose recording configuration auto-records HLS renditions and thumbnails into an S3 bucket; IVS emits Recording State Change events to EventBridge, and a Lambda target reads the recording metadata to publish VOD playlists through CloudFront with origin access control. An IVS Chat room with a Lambda message-review handler provides moderated chat, and a serverless API issues stream keys and chat tokens.
  containers:
    - region: us-west-2
      groups: [{label: live}, {label: recordings}, {label: app}]
  elements:
    - {tf: aws_ivs_channel, name: creator-channel, in: group:live}
    - {tf: aws_ivs_recording_configuration, name: auto-record-config, in: group:live}
    - {tf: aws_ivschat_room, name: creator-chat-room, in: group:live}
    - {tf: aws_lambda_function, name: chat-message-review, in: group:live}
    - {tf: aws_s3_bucket, name: recordings-bucket, in: group:recordings}
    - {tf: aws_cloudwatch_event_rule, name: recording-state-rule, in: group:recordings}
    - {tf: aws_lambda_function, name: vod-publisher, in: group:recordings}
    - {tf: aws_dynamodb_table, name: vod-catalog, in: group:recordings}
    - {tf: aws_cloudfront_distribution, name: vod-cdn, in: group:recordings}
    - {tf: aws_api_gateway_rest_api, name: streaming-app-api, in: group:app}
    - {tf: aws_lambda_function, name: token-issuer, in: group:app}
    - {tf: aws_cognito_user_pool, name: viewer-users, in: group:app}
  actors: [users, client]
  flows:
    - {from: client, to: creator-channel, label: RTMPS ingest with stream key, step: 1}
    - {from: creator-channel, to: auto-record-config, label: recording configuration}
    - {from: auto-record-config, to: recordings-bucket, label: HLS renditions and thumbnails, step: 2}
    - {from: creator-channel, to: recording-state-rule, label: IVS Recording State Change, step: 3}
    - {from: recording-state-rule, to: vod-publisher, link: aws_cloudwatch_event_target}
    - {from: vod-publisher, to: recordings-bucket, label: read recording-ended.json, step: 4}
    - {from: vod-publisher, to: vod-catalog, label: register VOD asset, step: 4}
    - {from: vod-cdn, to: recordings-bucket, label: origin access control, step: 5}
    - {from: users, to: creator-channel, label: low-latency playback, step: 6}
    - {from: users, to: vod-cdn, label: on-demand playback}
    - {from: users, to: streaming-app-api, label: chat and stream tokens}
    - {from: streaming-app-api, to: token-issuer, label: CreateChatToken}
    - {from: token-issuer, to: viewer-users, label: verify viewer identity}
    - {from: users, to: creator-chat-room, label: WebSocket chat}
    - {from: creator-chat-room, to: chat-message-review, label: message review handler}
