    - {tf: aws_instance, name: lax-web-server, in: subnet:lax-private}
    - {tf: aws_db_instance, name: app-db, in: subnet:region-private-a}
    - {tf: aws_sqs_queue, name: async-jobs, in: region}
    - {tf: aws_lambda_function, name: job-worker, in: region}
    - {tf: aws_dx_connection, name: onprem-dx, in: region}
    - {tf: aws_instance, name: legacy-app-server, in: datacenter}
  actors: [users]
  flows:
    - {from: users, to: app-igw, label: HTTPS via Local Zone internet egress, step: 1}
    - {from: app-igw, to: lax-alb, step: 1}
    - {from: lax-alb, to: lax-web-server, label: target group, step: 2}
    - {from: lax-web-asg, to: lax-web-server, label: capacity in Local Zone}
    - {from: lax-web-server, to: app-db, label: reads and writes to parent region, step: 3}
    - {from: lax-web-server, to: async-jobs, label: enqueue background work, step: 4}
    - {from: async-jobs, to: job-worker, link: aws_lambda_event_source_mapping}
    - {from: legacy-app-server, to: onprem-dx, label: private connectivity, step: 5}
    - {from: onprem-dx, to: lax-web-server, label: shortest path to Local Zone subnet, step: 5}

- slug: outposts-on-premises-extension
