- slug: connected-vehicle-ingestion-pipeline
  title: Connected vehicle ingestion pipeline
  category: industry
  tags: [connected vehicle, iot core, msk, flink, dynamodb, appsync, automotive]
  source: https://docs.aws.amazon.com/solutions/connected-mobility-on-aws/
  description: Vehicles authenticate to IoT Core with X.509 mTLS and publish compressed telemetry; an IoT rule with Basic Ingest writes directly to an Amazon MSK topic using SCRAM credentials from Secrets Manager, while bulk telemetry is uploaded to S3 through pre-signed URLs. Managed Service for Apache Flink decodes and enriches the Kafka stream and sinks the last known vehicle state to DynamoDB, which AppSync exposes to the companion app as a GraphQL API behind CloudFront.
  containers:
    - region: eu-west-1
      vpcs:
        - name: telemetry
          cidr: 10.20.0.0/16
          subnets:
            - {name: streaming-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: streaming-b, cidr: 10.20.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_iot_thing, name: vehicle-thing, in: region}
    - {tf: aws_iot_topic_rule, name: telemetry-to-kafka, in: region}
    - {tf: aws_secretsmanager_secret, name: msk-scram-credentials, in: region}
    - {tf: aws_msk_cluster, name: vehicle-telemetry-msk, in: subnet:streaming-a}
    - {tf: aws_kinesisanalyticsv2_application, name: telemetry-decoder, in: subnet:streaming-b}
    - {tf: aws_s3_bucket, name: batch-telemetry-uploads, in: region}
    - {tf: aws_dynamodb_table, name: vehicle-last-known-state, in: region}
    - {tf: aws_appsync_graphql_api, name: companion-graphql-api, in: region}
    - {tf: aws_cloudfront_distribution, name: companion-edge, in: region}
    - {tf: aws_elasticache_replication_group, name: connection-state-cache, in: subnet:streaming-a}
  actors: [device, mobile]
  flows:
    - {from: device, to: vehicle-thing, label: MQTT over mTLS, step: 1}
    - {from: vehicle-thing, to: telemetry-to-kafka, label: Basic Ingest topic, step: 2}
    - {from: telemetry-to-kafka, to: vehicle-telemetry-msk, label: kafka rule action, step: 2}
    - {from: telemetry-to-kafka, to: msk-scram-credentials, label: SASL/SCRAM secret lookup, step: 3}
    - {from: device, to: batch-telemetry-uploads, label: pre-signed URL batch upload, step: 4}
    - {from: vehicle-telemetry-msk, to: telemetry-decoder, label: consume raw topic, step: 5}
    - {from: telemetry-decoder, to: vehicle-telemetry-msk, label: republish enriched topic, step: 5}
    - {from: telemetry-decoder, to: vehicle-last-known-state, label: DynamoDB sink connector, step: 6}
    - {from: companion-graphql-api, to: vehicle-last-known-state, label: GraphQL resolvers}
    - {from: companion-graphql-api, to: connection-state-cache, label: subscriber connection state}
    - {from: mobile, to: companion-edge, label: HTTPS, step: 7}
    - {from: companion-edge, to: companion-graphql-api, label: lowest-latency region origin}

- slug: iot-sitewise-smart-factory
  title: Smart factory with IoT SiteWise Edge and asset models
  category: iot
  tags: [iot sitewise, opc ua, greengrass, industrial iot, oee, smart factory]
  source: https://docs.aws.amazon.com/iot-sitewise/latest/userguide/what-is-sitewise.html
  description: A SiteWise Edge gateway running on Greengrass V2 reads OPC UA servers on the plant floor and streams equipment data to the cloud, where asset models compute transforms and metrics such as OEE and SiteWise Monitor renders operator dashboards. IoT Core rules ingest MQTT devices into asset properties, alarms notify through SNS, and cold-tier data is exported to a customer S3 bucket for Athena queries.
  containers:
    - datacenter: plant
    - region: eu-central-1
      groups: [{label: ingestion}, {label: storage and analytics}]
  elements:
    - {tf: aws_iot_thing, name: sitewise-edge-gateway, in: datacenter}
    - {tf: aws_instance, name: opc-ua-server, in: datacenter}
    - {tf: aws_iot_thing, name: mqtt-plc-thing, in: group:ingestion}
    - {tf: aws_iot_topic_rule, name: to-sitewise-rule, in: group:ingestion}
    - {tf: aws_lambda_function, name: asset-model-sync, in: group:ingestion}
    - {tf: aws_sns_topic, name: equipment-alarms, in: group:ingestion}
    - {tf: aws_s3_bucket, name: sitewise-cold-tier, in: group:storage and analytics}
    - {tf: aws_glue_catalog_database, name: sitewise-catalog, in: group:storage and analytics}
    - {tf: aws_athena_workgroup, name: plant-analytics, in: group:storage and analytics}
    - {tf: aws_grafana_workspace, name: plant-dashboards, in: group:storage and analytics}
  actors: [users]
  flows:
    - {from: opc-ua-server, to: sitewise-edge-gateway, label: OPC UA subscriptions, step: 1}
    - {from: sitewise-edge-gateway, to: asset-model-sync, label: Greengrass stream to SiteWise asset properties, step: 2}
    - {from: mqtt-plc-thing, to: to-sitewise-rule, label: MQTT device data, step: 3}
    - {from: to-sitewise-rule, to: asset-model-sync, label: iotSiteWise rule action BatchPutAssetPropertyValue, step: 3}
    - {from: asset-model-sync, to: equipment-alarms, label: alarm state change, step: 4}
    - {from: asset-model-sync, to: sitewise-cold-tier, label: cold tier export, step: 5}
    - {from: sitewise-catalog, to: sitewise-cold-tier, label: table over exported data}
    - {from: plant-analytics, to: sitewise-catalog, label: historical SQL}
    - {from: users, to: plant-dashboards, label: OEE and MTBF dashboards, step: 6}
    - {from: plant-dashboards, to: asset-model-sync, label: SiteWise datasource queries}

- slug: iot-twinmaker-digital-twin
  title: Digital twin with IoT TwinMaker, SiteWise and Kinesis Video Streams
  category: iot
  tags: [iot twinmaker, digital twin, sitewise, kinesis video streams, grafana, scene composer]
  source: https://docs.aws.amazon.com/iot-twinmaker/latest/guide/what-is-twinmaker.html
  description: A TwinMaker workspace stores its entity-component knowledge graph and 3D scene assets in an S3 bucket, with built-in connectors to SiteWise time series and Kinesis Video Streams camera feeds plus a Lambda-backed custom connector to Timestream telemetry. Operators view the scenes with data overlays in Amazon Managed Grafana through the TwinMaker plugin.
  containers:
    - region: us-east-1
      groups: [{label: data sources}, {label: twin}, {label: visualisation}]
  elements:
    - {tf: aws_iot_thing, name: plant-gateway, in: group:data sources}
    - {tf: aws_iot_topic_rule, name: telemetry-rule, in: group:data sources}
    - {tf: aws_timestreamwrite_database, name: telemetry-tsdb, in: group:data sources}
    - {tf: aws_kinesis_video_stream, name: line-camera, in: group:data sources}
    - {tf: aws_s3_bucket, name: twinmaker-workspace-bucket, in: group:twin}
    - {tf: aws_lambda_function, name: timestream-connector, in: group:twin}
    - {tf: aws_lambda_function, name: alarm-connector, in: group:twin}
    - {tf: aws_grafana_workspace, name: twin-dashboards, in: group:visualisation}
    - {tf: aws_sns_topic, name: twin-alarms, in: group:visualisation}
  actors: [device, users]
  flows:
    - {from: device, to: plant-gateway, label: equipment telemetry, step: 1}
    - {from: plant-gateway, to: telemetry-rule, label: MQTT}
    - {from: telemetry-rule, to: telemetry-tsdb, label: timestream action, step: 2}
