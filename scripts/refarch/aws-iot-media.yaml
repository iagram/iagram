- slug: location-asset-tracking-geofences
  title: Asset tracking with Amazon Location Service trackers and geofences
  category: iot
  tags: [amazon location, trackers, geofences, maps, eventbridge, fleet tracking]
  source: https://docs.aws.amazon.com/location/latest/developerguide/what-is.html
  description: Mobile devices and vehicles send position updates to a Location Service tracker, which evaluates them against a linked geofence collection and emits ENTER and EXIT events to EventBridge. A Lambda target persists position history in DynamoDB and notifies dispatchers through SNS, while a web app renders map tiles, place search and routes through API Gateway.
  containers:
    - region: eu-west-1
      groups: [{label: location resources}, {label: events}, {label: app}]
  elements:
    - {tf: aws_location_tracker, name: fleet-tracker, in: group:location resources}
    - {tf: aws_location_geofence_collection, name: depot-geofences, in: group:location resources}
    - {tf: aws_location_map, name: fleet-map, in: group:location resources}
    - {tf: aws_location_place_index, name: address-search, in: group:location resources}
    - {tf: aws_location_route_calculator, name: delivery-routes, in: group:location resources}
    - {tf: aws_cloudwatch_event_rule, name: geofence-events-rule, in: group:events}
    - {tf: aws_lambda_function, name: geofence-handler, in: group:events}
    - {tf: aws_dynamodb_table, name: position-history, in: group:events}
    - {tf: aws_sns_topic, name: dispatch-notifications, in: group:events}
    - {tf: aws_api_gateway_rest_api, name: fleet-api, in: group:app}
    - {tf: aws_cognito_user_pool, name: dispatcher-users, in: group:app}
  actors: [mobile, users]
  flows:
    - {from: mobile, to: fleet-tracker, label: BatchUpdateDevicePosition, step: 1}
    - {from: fleet-tracker, to: depot-geofences, label: tracker association evaluates geofences, step: 2}
    - {from: depot-geofences, to: geofence-events-rule, label: ENTER/EXIT events to EventBridge, step: 3}
    - {from: geofence-events-rule, to: geofence-handler, link: aws_cloudwatch_event_target}
    - {from: geofence-handler, to: position-history, label: store arrival and departure, step: 4}
    - {from: geofence-handler, to: dispatch-notifications, label: notify dispatch, step: 4}
    - {from: users, to: fleet-api, label: dispatcher console, step: 5}
    - {from: fleet-api, to: dispatcher-users, label: Cognito authorizer}
    - {from: fleet-api, to: fleet-map, label: map tiles}
    - {from: fleet-api, to: address-search, label: geocode delivery addresses}
    - {from: fleet-api, to: delivery-routes, label: calculate routes}
    - {from: fleet-api, to: fleet-tracker, label: GetDevicePosition}

- slug: chime-sdk-meetings-with-capture
  title: Chime SDK meetings with media capture pipelines
  category: media
  tags: [chime sdk, webrtc, meetings, media capture pipeline, transcription, recording]
  source: https://docs.aws.amazon.com/chime-sdk/latest/dg/capture-pipe-config.html
  description: A serverless backend creates Chime SDK meetings and attendees and returns join tokens to browser and mobile clients that exchange WebRTC media with the Chime media service. A media capture pipeline records audio, video, content share and data messages into an S3 bucket, a concatenation step assembles the artifacts, and a media insights pipeline configuration streams call analytics into Kinesis.
  containers:
    - region: us-east-1
      groups: [{label: meeting backend}, {label: media pipelines}]
  elements:
    - {tf: aws_cognito_user_pool, name: meeting-users, in: group:meeting backend}
    - {tf: aws_api_gateway_rest_api, name: meetings-api, in: group:meeting backend}
    - {tf: aws_lambda_function, name: create-meeting, in: group:meeting backend}
    - {tf: aws_dynamodb_table, name: meetings-table, in: group:meeting backend}
    - {tf: aws_cloudwatch_event_rule, name: meeting-lifecycle-rule, in: group:meeting backend}
    - {tf: aws_lambda_function, name: pipeline-controller, in: group:media pipelines}
    - {tf: aws_s3_bucket, name: capture-bucket, in: group:media pipelines}
    - {tf: aws_kms_key, name: capture-key, in: group:media pipelines}
    - {tf: aws_chimesdkmediapipelines_media_insights_pipeline_configuration, name: call-insights-config, in: group:media pipelines}
    - {tf: aws_kinesis_stream, name: insights-stream, in: group:media pipelines}
    - {tf: aws_media_convert_queue, name: recording-postprocess, in: group:media pipelines}
  actors: [users]
  flows:
    - {from: users, to: meetings-api, label: join request, step: 1}
    - {from: meetings-api, to: meeting-users, label: Cognito authorizer}
    - {from: meetings-api, to: create-meeting, label: proxy integration, step: 2}
    - {from: create-meeting, to: meetings-table, label: "CreateMeeting + CreateAttendee tokens", step: 3}
    - {from: create-meeting, to: pipeline-controller, label: CreateMediaCapturePipeline, step: 4}
    - {from: pipeline-controller, to: capture-bucket, label: audio, video and data-channel artifacts, step: 5}
    - {from: capture-bucket, to: capture-key, label: SSE-KMS}
    - {from: meeting-lifecycle-rule, to: pipeline-controller, link: aws_cloudwatch_event_target}
    - {from: pipeline-controller, to: recording-postprocess, label: concatenate and transcode recording, step: 6}
    - {from: call-insights-config, to: insights-stream, label: transcription and analytics events, step: 7}

- slug: ivs-interactive-live-streaming
  title: Interactive live streaming with Amazon IVS, chat and auto-record to S3
  category: media
  tags: [amazon ivs, low latency, live chat, auto-record, eventbridge, cloudfront]
  source: https://docs.aws.amazon.com/ivs/latest/LowLatencyUserGuide/record-to-s3.html
  description: Broadcasters push RTMPS to an IVS channel whose recording configuration auto-records HLS renditions and thumbnails into an S3 bucket; IVS emits Recording State Change events to EventBridge, and a Lambda target reads the recording metadata to publish VOD playlists through CloudFront with origin access control. An IVS Chat room with a Lambda message-review handler provides moderated chat, and a serverless API issues stream keys and chat tokens.
  containers:
    - region: us-west-2
      groups: [{label: live}, {label: recordings}, {label: app}]
  elements:
    - {tf: aws_ivs_channel, name: creator-channel, in: group:live}
    - {tf: aws_ivs_recording_configuration, name: auto-record-config, in: group:live}
    - {tf: aws_ivschat_room, name: creator-chat-room, in: group:live}
    - {tf: aws_lambda_function, name: chat-message-review, in: group:live}
    - {tf: aws_s3_bucket, name: recordings-bucket, in: group:recordings}
    - {tf: aws_cloudwatch_event_rule, name: recording-state-rule, in: group:recordings}
    - {tf: aws_lambda_function, name: vod-publisher, in: group:recordings}
    - {tf: aws_dynamodb_table, name: vod-catalog, in: group:recordings}
    - {tf: aws_cloudfront_distribution, name: vod-cdn, in: group:recordings}
    - {tf: aws_api_gateway_rest_api, name: streaming-app-api, in: group:app}
    - {tf: aws_lambda_function, name: token-issuer, in: group:app}
    - {tf: aws_cognito_user_pool, name: viewer-users, in: group:app}
  actors: [users, client]
  flows:
    - {from: client, to: creator-channel, label: RTMPS ingest with stream key, step: 1}
    - {from: creator-channel, to: auto-record-config, label: recording configuration}
    - {from: auto-record-config, to: recordings-bucket, label: HLS renditions and thumbnails, step: 2}
    - {from: creator-channel, to: recording-state-rule, label: IVS Recording State Change, step: 3}
    - {from: recording-state-rule, to: vod-publisher, link: aws_cloudwatch_event_target}
    - {from: vod-publisher, to: recordings-bucket, label: read recording-ended.json, step: 4}
    - {from: vod-publisher, to: vod-catalog, label: register VOD asset, step: 4}
    - {from: vod-cdn, to: recordings-bucket, label: origin access control, step: 5}
    - {from: users, to: creator-channel, label: low-latency playback, step: 6}
    - {from: users, to: vod-cdn, label: on-demand playback}
    - {from: users, to: streaming-app-api, label: chat and stream tokens}
    - {from: streaming-app-api, to: token-issuer, label: CreateChatToken}
    - {from: token-issuer, to: viewer-users, label: verify viewer identity}
    - {from: users, to: creator-chat-room, label: WebSocket chat}
    - {from: creator-chat-room, to: chat-message-review, label: message review handler}
