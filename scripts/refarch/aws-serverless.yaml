    - {from: beanstalk-app, to: inventory-aurora, label: Data API endpoint}
    - {from: app-images, to: ecs-apps, label: pull image}
    - {from: ecs-apps, to: inventory-aurora, label: Data API endpoint}
    - {from: add-record, to: inventory-aurora, label: Data API ExecuteStatement INSERT, step: 1}
    - {from: get-records, to: inventory-aurora, label: Data API ExecuteStatement SELECT, step: 2}
    - {from: on-prem-apps, to: inventory-aurora, label: Data API endpoint over HTTPS}

- slug: private-api-gateway-vpc-endpoint
  title: Private REST API consumed through an execute-api VPC endpoint
  category: security
  tags: [private api, api gateway, vpc endpoint, privatelink, cross-account]
  source: https://aws.amazon.com/blogs/compute/architecture-patterns-for-consuming-private-apis-cross-account/
  description: A producer account exposes a private API Gateway REST API whose resource policy allows calls only from a named execute-api interface endpoint. A consumer account creates that endpoint in its VPC, and its callers, a regional API Gateway, a Lambda function, an ECS service and an EC2 instance, reach the private API over PrivateLink without traversing the internet.
  containers:
    - region: eu-west-1
      account: api-consumer
      account_at: [1, 1]
      at: [2, 1]
      vpcs:
        - name: consumer
          cidr: 10.60.0.0/16
          at: [2, 1]
          subnets:
            - {name: consumer-private-a, cidr: 10.60.1.0/24, az: a, public: false, at: [1, 1]}
    - region: eu-west-1
      account: api-producer
      account_at: [1, 2]
      at: [2, 1]
  elements:
