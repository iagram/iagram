    - {tf: aws_nat_gateway, name: nat-b, in: subnet:public-b, at: [1, 1]}
    - {tf: aws_msk_cluster, name: events-cluster, in: vpc:streaming, at: [2, 1, 1, 2]}
    - {tf: aws_instance, name: producer-app, in: subnet:kafka-a, at: [1, 1]}
    - {tf: aws_secretsmanager_secret, name: kafka-scram-credentials, in: region, at: [2, 2]}
