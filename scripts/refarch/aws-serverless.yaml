# AWS reference architectures: serverless and application integration.
# Format: see FORMAT.md. 25 items, provider aws.

- slug: apigw-rest-lambda-dynamodb-crud
  title: REST API with API Gateway, Lambda and DynamoDB
  category: serverless
  tags: [api gateway, lambda, dynamodb, rest, crud]
  source: https://serverlessland.com/patterns/apigw-lambda-dynamodb
  description: An API Gateway REST API fronts a single Lambda function that serves the CRUD routes; the function reads and writes items in one DynamoDB table using the on-demand capacity mode. API Gateway handles throttling and request validation so the function contains only business logic.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: items-api, in: region, at: [1, 1]}
    - {tf: aws_lambda_function, name: items-function, in: region, at: [1, 2]}
    - {tf: aws_dynamodb_table, name: items, in: region, at: [1, 3]}
  flows:
    - {from: items-api, to: items-function, label: Lambda proxy integration, step: 1}
    - {from: items-function, to: items, label: PutItem / GetItem / Query, step: 2}

- slug: websocket-api-chat-lambda-dynamodb
  title: WebSocket chat API with API Gateway, Lambda and DynamoDB
  category: serverless
  tags: [websocket, api gateway, lambda, dynamodb, real-time]
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/websocket-api-chat-app.html
  description: An API Gateway WebSocket API routes $connect, $disconnect, $default and sendmessage frames to four Lambda functions. Connection IDs are stored in a DynamoDB table so the sendmessage handler can broadcast to every connected client through the API Gateway management endpoint.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_apigatewayv2_api, name: chat-websocket-api, in: region, at: [1, 1, 4, 1]}
    - {tf: aws_lambda_function, name: on-connect, in: region, at: [1, 2]}
    - {tf: aws_lambda_function, name: on-default, in: region, at: [2, 2]}
    - {tf: aws_lambda_function, name: send-message, in: region, at: [3, 2]}
    - {tf: aws_lambda_function, name: on-disconnect, in: region, at: [4, 2]}
    - {tf: aws_dynamodb_table, name: connections, in: region, at: [1, 3, 4, 1]}
  actors: [{type: users, name: clients, at: [1, 1]}]
  flows:
    - {from: clients, to: chat-websocket-api, label: "wss:// $connect", step: 1}
    - {from: chat-websocket-api, to: on-connect, label: "$connect route", step: 2}
    - {from: on-connect, to: connections, label: PutItem connectionId, step: 3}
    - {from: clients, to: chat-websocket-api, label: sendmessage frame, step: 4}
    - {from: chat-websocket-api, to: send-message, label: sendmessage route, step: 5}
    - {from: send-message, to: connections, label: Scan connections, step: 6}
    - {from: send-message, to: chat-websocket-api, label: PostToConnection, step: 7}
    - {from: chat-websocket-api, to: on-default, label: "$default route"}
    - {from: chat-websocket-api, to: on-disconnect, label: "$disconnect route"}
    - {from: on-disconnect, to: connections, label: DeleteItem}

- slug: sns-sqs-fanout-order-processing
  title: SNS to SQS fan-out with parallel Lambda consumers
  category: serverless
  tags: [sns, sqs, fan-out, lambda, decoupling]
  source: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  description: A producer publishes one order event to an SNS topic; three SQS queues subscribed to the topic each receive a copy, so inventory, shipping and analytics consumers process independently and at their own pace. Each queue has a dead-letter queue and a Lambda function attached through an event source mapping.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_lambda_function, name: order-api-handler, in: region}
    - {tf: aws_sns_topic, name: order-events, in: region}
    - {tf: aws_sqs_queue, name: inventory-queue, in: region}
    - {tf: aws_sqs_queue, name: shipping-queue, in: region}
    - {tf: aws_sqs_queue, name: analytics-queue, in: region}
    - {tf: aws_sqs_queue, name: fanout-dlq, in: region}
    - {tf: aws_lambda_function, name: inventory-consumer, in: region}
    - {tf: aws_lambda_function, name: shipping-consumer, in: region}
    - {tf: aws_lambda_function, name: analytics-consumer, in: region}
  actors: [client]
  flows:
    - {from: client, to: order-api-handler, label: place order, step: 1}
    - {from: order-api-handler, to: order-events, label: Publish, step: 2}
    - {from: order-events, to: inventory-queue, link: aws_sns_topic_subscription}
    - {from: order-events, to: shipping-queue, link: aws_sns_topic_subscription}
    - {from: order-events, to: analytics-queue, link: aws_sns_topic_subscription}
    - {from: inventory-queue, to: inventory-consumer, link: aws_lambda_event_source_mapping}
    - {from: shipping-queue, to: shipping-consumer, link: aws_lambda_event_source_mapping}
    - {from: analytics-queue, to: analytics-consumer, link: aws_lambda_event_source_mapping}
    - {from: inventory-queue, to: fanout-dlq, label: redrive after maxReceiveCount}
    - {from: shipping-queue, to: fanout-dlq, label: redrive after maxReceiveCount}

- slug: eventbridge-central-bus-multi-account
  title: Centralized EventBridge event bus across accounts
  category: serverless
  tags: [eventbridge, event bus, multi-account, resource policy, archive]
  source: https://aws.amazon.com/blogs/compute/simplifying-cross-account-access-with-amazon-eventbridge-resource-policies
  description: A Lambda function in a web-store producer account publishes "New order created" events straight to a central event bus in a shared account; a resource policy on the central bus grants PutEvents to the organization. Rules on the central bus subscribe consumer accounts, forwarding the event to an invoice-processing bus whose rule invokes a Lambda function and to a forecasting bus whose rule starts a Step Functions workflow.
  containers:
    - region: us-east-1
      account: web-store
      at: [1, 1]
    - region: us-east-1
      account: central-events
      at: [1, 1]
    - region: us-east-1
      account: invoice-processing
      at: [1, 1]
    - region: us-east-1
      account: forecasting
      at: [1, 1]
  elements:
    - {tf: aws_lambda_function, name: order-service, in: account:web-store, at: [1, 1]}
    - {tf: aws_cloudwatch_event_bus, name: ecommerce-event-bus, in: account:central-events, at: [1, 1, 2, 1]}
    - {tf: aws_cloudwatch_event_rule, name: route-to-invoicing, in: account:central-events, at: [1, 2]}
    - {tf: aws_cloudwatch_event_rule, name: route-to-forecasting, in: account:central-events, at: [2, 2]}
    - {tf: aws_cloudwatch_event_bus, name: invoicing-bus, in: account:invoice-processing, at: [1, 1]}
    - {tf: aws_cloudwatch_event_rule, name: invoice-rule, in: account:invoice-processing, at: [1, 2]}
    - {tf: aws_lambda_function, name: invoice-service, in: account:invoice-processing, at: [1, 3]}
    - {tf: aws_cloudwatch_event_bus, name: forecasting-bus, in: account:forecasting, at: [1, 1]}
    - {tf: aws_cloudwatch_event_rule, name: forecasting-rule, in: account:forecasting, at: [1, 2]}
    - {tf: aws_sfn_state_machine, name: forecast-workflow, in: account:forecasting, at: [1, 3]}
  actors: []
  flows:
    - {from: order-service, to: ecommerce-event-bus, label: publishes New order created, step: 1}
    - {from: ecommerce-event-bus, to: route-to-invoicing, label: rules, step: 2}
    - {from: ecommerce-event-bus, to: route-to-forecasting, label: rules}
    - {from: route-to-invoicing, to: invoicing-bus, link: aws_cloudwatch_event_target, label: subscribes New order created, step: 3}
    - {from: route-to-forecasting, to: forecasting-bus, link: aws_cloudwatch_event_target, label: subscribes New order created}
    - {from: invoicing-bus, to: invoice-rule, label: Invoice rule, step: 4}
    - {from: invoice-rule, to: invoice-service, link: aws_cloudwatch_event_target}
    - {from: forecasting-bus, to: forecasting-rule, label: Forecasting rule}
    - {from: forecasting-rule, to: forecast-workflow, link: aws_cloudwatch_event_target}

- slug: eventbridge-pipes-sqs-enrich-step-functions
  title: EventBridge Pipes from SQS with enrichment to Step Functions
  category: serverless
  tags: [eventbridge pipes, sqs, enrichment, step functions, point-to-point]
  source: https://aws.amazon.com/blogs/compute/implementing-architectural-patterns-with-amazon-eventbridge-pipes/
  description: A pipe polls an SQS order queue, filters messages, calls a Lambda enrichment step that looks up the customer record in DynamoDB, and starts a Step Functions execution with the enriched payload. No consumer code is written for the queue; batching, filtering and the target invocation are handled by the pipe.
  containers:
    - region: eu-central-1
  elements:
    - {tf: aws_sqs_queue, name: orders-queue, in: region}
    - {tf: aws_pipes_pipe, name: orders-pipe, in: region}
    - {tf: aws_lambda_function, name: enrich-customer, in: region}
    - {tf: aws_dynamodb_table, name: customers, in: region}
    - {tf: aws_sfn_state_machine, name: process-order, in: region}
    - {tf: aws_sqs_queue, name: orders-pipe-dlq, in: region}
    - {tf: aws_cloudwatch_log_group, name: pipe-logs, in: region}
  actors: [client]
  flows:
    - {from: client, to: orders-queue, label: SendMessage, step: 1}
    - {from: orders-queue, to: orders-pipe, label: source with filter, step: 2}
    - {from: orders-pipe, to: enrich-customer, label: enrichment invoke, step: 3}
    - {from: enrich-customer, to: customers, label: GetItem customerId, step: 4}
    - {from: orders-pipe, to: process-order, label: StartExecution target, step: 5}
    - {from: orders-pipe, to: orders-pipe-dlq, label: failed events}
    - {from: orders-pipe, to: pipe-logs, label: execution logs}

- slug: eventbridge-scheduler-campaigns
  title: Scheduled jobs at scale with EventBridge Scheduler
  category: serverless
  tags: [eventbridge scheduler, cron, one-time schedule, lambda, ses]
  source: https://aws.amazon.com/blogs/compute/scheduling-email-campaigns-at-scale-with-amazon-eventbridge-scheduler/
  description: A Step Functions Distributed Map (the campaign scheduler) iterates over the recipient list and creates one one-time EventBridge Scheduler schedule per recipient inside a schedule group, each firing at 9:00 AM in the recipient's own time zone. When a schedule fires it calls SES directly through the Scheduler universal target to send the email, and completed one-time schedules are deleted automatically.
  containers:
    - region: us-east-1
      groups: [{label: campaign schedule group, at: [1, 2, 3, 1]}]
  elements:
    - {tf: aws_sfn_state_machine, name: campaign-scheduler, in: region, at: [2, 1]}
    - {tf: aws_scheduler_schedule, name: schedule-recipient-a-9am-est, in: "group:campaign schedule group", at: [1, 1]}
    - {tf: aws_scheduler_schedule, name: schedule-recipient-b-9am-pst, in: "group:campaign schedule group", at: [2, 1]}
    - {tf: aws_scheduler_schedule, name: schedule-recipient-x-9am-cet, in: "group:campaign schedule group", at: [3, 1]}
    - {tf: aws_ses_email_identity, name: marketing-sender, in: region, at: [2, 3]}
  flows:
    - {from: campaign-scheduler, to: schedule-recipient-a-9am-est, label: Create Schedule, step: 1}
    - {from: campaign-scheduler, to: schedule-recipient-b-9am-pst, label: Create Schedule}
    - {from: campaign-scheduler, to: schedule-recipient-x-9am-cet, label: Create Schedule}
    - {from: schedule-recipient-b-9am-pst, to: marketing-sender, label: Send email, step: 2}

- slug: step-functions-saga-orchestration
  title: Saga orchestration with Step Functions
  category: serverless
  tags: [step functions, saga, compensating transactions, distributed transaction, lambda]
  source: https://aws.amazon.com/blogs/compute/building-a-serverless-distributed-application-using-a-saga-orchestration-pattern
  description: A Place Order request starts a Step Functions standard workflow that calls the order, inventory and payment Lambda services in sequence, each writing to its own DynamoDB table. Catch blocks route InventoryUpdateFailed or PaymentFailed to compensating functions that undo earlier steps in reverse order so the distributed transaction ends consistent.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: order-api, in: region, at: [1, 1, 3, 1]}
    - {tf: aws_sfn_state_machine, name: order-saga, in: region, at: [1, 2, 3, 1]}
    - {tf: aws_lambda_function, name: order-service, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: inventory-service, in: region, at: [1, 4]}
    - {tf: aws_lambda_function, name: payment-service, in: region, at: [1, 5]}
    - {tf: aws_lambda_function, name: cancel-order, in: region, at: [2, 3]}
    - {tf: aws_lambda_function, name: revert-inventory, in: region, at: [2, 4]}
    - {tf: aws_lambda_function, name: refund-payment, in: region, at: [2, 5]}
    - {tf: aws_dynamodb_table, name: orders, in: region, at: [3, 3]}
    - {tf: aws_dynamodb_table, name: inventory, in: region, at: [3, 4]}
    - {tf: aws_dynamodb_table, name: payments, in: region, at: [3, 5]}
  actors: [client]
  flows:
    - {from: client, to: order-api, label: Place Order, step: 1}
    - {from: order-api, to: order-saga, label: StartExecution, step: 2}
    - {from: order-saga, to: order-service, label: PlaceOrder, step: 3}
    - {from: order-service, to: orders, label: PutItem}
    - {from: order-saga, to: inventory-service, label: OrderPlaced, step: 4}
    - {from: inventory-service, to: inventory, label: UpdateItem}
    - {from: order-saga, to: payment-service, label: InventoryUpdated, step: 5}
    - {from: payment-service, to: payments, label: PutItem}
    - {from: payment-service, to: order-saga, label: PaymentProcessed, step: 6}
    - {from: order-saga, to: refund-payment, label: "PaymentFailed: compensate"}
    - {from: order-saga, to: revert-inventory, label: "InventoryUpdateFailed: compensate"}
    - {from: order-saga, to: cancel-order, label: compensate}

- slug: step-functions-parallel-fan-out-fan-in
  title: Parallel fan-out and fan-in with nested Step Functions
  category: serverless
  tags: [step functions, parallel, map, fan-out, nested workflows]
  source: https://aws.amazon.com/blogs/compute/accelerating-workloads-using-parallelism-in-aws-step-functions/
  description: An orchestrator state machine uses a Parallel state and a Map state to start many child workflow executions concurrently, each running a Lambda task and writing its result to DynamoDB. When all branches complete, an aggregation function reads the results, writes a report to S3 and publishes a completion notification.
  containers:
    - region: us-west-2
  elements:
    - {tf: aws_sfn_state_machine, name: test-orchestrator, in: region}
    - {tf: aws_sfn_state_machine, name: test-case-worker, in: region}
    - {tf: aws_lambda_function, name: prepare-test-set, in: region}
    - {tf: aws_lambda_function, name: run-test-case, in: region}
    - {tf: aws_lambda_function, name: aggregate-results, in: region}
    - {tf: aws_dynamodb_table, name: test-results, in: region}
    - {tf: aws_s3_bucket, name: test-reports, in: region}
    - {tf: aws_sns_topic, name: run-completed, in: region}
  actors: [user]
  flows:
    - {from: user, to: test-orchestrator, label: StartExecution, step: 1}
    - {from: test-orchestrator, to: prepare-test-set, step: 2}
    - {from: test-orchestrator, to: test-case-worker, label: Map state StartExecution.sync, step: 3}
    - {from: test-case-worker, to: run-test-case, label: Parallel branches, step: 4}
    - {from: run-test-case, to: test-results, label: PutItem, step: 5}
    - {from: test-orchestrator, to: aggregate-results, label: fan-in, step: 6}
    - {from: aggregate-results, to: test-results, label: Query}
    - {from: aggregate-results, to: test-reports, label: PutObject report, step: 7}
    - {from: aggregate-results, to: run-completed, label: Publish, step: 8}

- slug: step-functions-distributed-map-s3
  title: Large-scale S3 processing with Step Functions Distributed Map
  category: serverless
  tags: [step functions, distributed map, s3, parallel processing, etl]
  source: https://aws.amazon.com/blogs/aws/step-functions-distributed-map-a-serverless-solution-for-large-scale-parallel-data-processing/
  description: An EventBridge rule starts a state machine when a manifest lands in S3; a Distributed Map state lists the objects under a prefix and runs up to 10,000 concurrent child executions, each invoking a Lambda function per object or batch. Child results are written back to S3 and summarized by a final function.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_s3_bucket, name: input-data, in: region}
    - {tf: aws_cloudwatch_event_rule, name: manifest-uploaded, in: region}
    - {tf: aws_sfn_state_machine, name: distributed-map-processor, in: region}
    - {tf: aws_lambda_function, name: transform-batch, in: region}
    - {tf: aws_lambda_function, name: summarize-run, in: region}
    - {tf: aws_s3_bucket, name: map-results, in: region}
    - {tf: aws_sns_topic, name: processing-complete, in: region}
  actors: [client]
  flows:
    - {from: client, to: input-data, label: PutObject manifest, step: 1}
    - {from: input-data, to: manifest-uploaded, label: Object Created event via EventBridge, step: 2}
    - {from: manifest-uploaded, to: distributed-map-processor, link: aws_cloudwatch_event_target}
    - {from: distributed-map-processor, to: input-data, label: ListObjectsV2 prefix, step: 3}
    - {from: distributed-map-processor, to: transform-batch, label: child executions, step: 4}
    - {from: distributed-map-processor, to: map-results, label: ResultWriter, step: 5}
    - {from: distributed-map-processor, to: summarize-run, step: 6}
    - {from: summarize-run, to: processing-complete, label: Publish, step: 7}

- slug: step-functions-human-approval-callback
  title: Human approval step with Step Functions task token
  category: serverless
  tags: [step functions, human approval, task token, callback, api gateway]
  source: https://aws.amazon.com/blogs/compute/implementing-serverless-manual-approval-steps-in-aws-step-functions-and-amazon-api-gateway/
  description: A CloudWatch schedule invokes a Lambda function that polls the Step Functions activity with GetActivityTask and, through Amazon SES, emails the approver links that embed the task token. Clicking a link in the email client calls an API Gateway endpoint that invokes SendTaskSuccess or SendTaskFailure, and the workflow resumes without any long-running process waiting.
  containers:
    - region: us-east-1
      groups: [{label: manual-approval, at: [2, 1, 1, 2]}]
  elements:
    - {tf: aws_cloudwatch_event_rule, name: approval-poll-schedule, in: region, at: [1, 1]}
    - {tf: aws_lambda_function, name: send-approval-email, in: region, at: [1, 2]}
    - {tf: aws_sfn_state_machine, name: approval-workflow, in: region, at: [1, 3]}
    - {tf: aws_ses_email_identity, name: approvals-sender, in: group:manual-approval, at: [1, 1]}
    - {tf: aws_api_gateway_rest_api, name: approval-callback-api, in: region, at: [2, 3]}
  actors: [{type: client, name: user-email-client, at: [2, 1]}]
  flows:
    - {from: approval-poll-schedule, to: send-approval-email, label: Schedule, step: 1, link: aws_cloudwatch_event_target}
    - {from: send-approval-email, to: approval-workflow, label: GetActivityTask, step: 2}
    - {from: send-approval-email, to: approvals-sender, label: TaskToken, step: 3}
    - {from: approvals-sender, to: user-email-client, label: email, step: 4}
    - {from: user-email-client, to: approval-callback-api, label: Succeed/Fail, step: 5}
    - {from: approval-callback-api, to: approval-workflow, label: SendTaskSuccess / SendTaskFailure, step: 6}

- slug: kinesis-lambda-enhanced-fan-out
  title: Kinesis Data Streams with Lambda enhanced fan-out consumers
  category: serverless
  tags: [kinesis, lambda, enhanced fan-out, stream processing, event source mapping]
  source: https://aws.amazon.com/blogs/compute/increasing-real-time-stream-processing-performance-with-amazon-kinesis-data-streams-enhanced-fan-out-and-aws-lambda/
  description: Producers write records to a Kinesis data stream that three Lambda functions consume through event source mappings; with the default shared-throughput consumers the pollers read intermittently via the GetRecords API, and registering enhanced fan-out consumers gives each function dedicated 2 MB/s per shard over HTTP/2 instead. The functions land their results in an S3 bucket, a DynamoDB table and a downstream Kinesis data stream.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_kinesis_stream, name: clickstream, in: region, at: [1, 1, 3, 1]}
    - {tf: aws_lambda_function, name: archive-records, in: region, at: [1, 2]}
    - {tf: aws_lambda_function, name: aggregate-metrics, in: region, at: [2, 2]}
    - {tf: aws_lambda_function, name: enrich-and-forward, in: region, at: [3, 2]}
    - {tf: aws_s3_bucket, name: clickstream-archive, in: region, at: [1, 3]}
    - {tf: aws_dynamodb_table, name: realtime-metrics, in: region, at: [2, 3]}
    - {tf: aws_kinesis_stream, name: enriched-stream, in: region, at: [3, 3]}
  flows:
    - {from: clickstream, to: archive-records, link: aws_lambda_event_source_mapping, label: intermittent polling via GetRecords API, step: 1}
    - {from: clickstream, to: aggregate-metrics, link: aws_lambda_event_source_mapping, label: intermittent polling via GetRecords API}
    - {from: clickstream, to: enrich-and-forward, link: aws_lambda_event_source_mapping, label: intermittent polling via GetRecords API}
    - {from: archive-records, to: clickstream-archive, label: PutObject, step: 2}
    - {from: aggregate-metrics, to: realtime-metrics, label: UpdateItem counters}
    - {from: enrich-and-forward, to: enriched-stream, label: PutRecords}

- slug: dynamodb-streams-lambda-cdc
  title: DynamoDB Streams change data capture with Lambda
  category: serverless
  tags: [dynamodb streams, lambda, change data capture, event-driven, sns]
  source: https://aws.amazon.com/blogs/database/build-scalable-event-driven-architectures-with-amazon-dynamodb-and-aws-lambda/
  description: Writes to an orders table are captured by DynamoDB Streams and delivered in order per partition key to a Lambda function through an event source mapping with filtering. The function publishes domain events to SNS and indexes documents in OpenSearch; failed batches are routed to an SQS on-failure destination.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: region}
    - {tf: aws_lambda_function, name: orders-handler, in: region}
    - {tf: aws_dynamodb_table, name: orders, in: region}
    - {tf: aws_lambda_function, name: stream-processor, in: region}
    - {tf: aws_sns_topic, name: order-status-events, in: region}
    - {tf: aws_opensearch_domain, name: orders-search, in: region}
    - {tf: aws_sqs_queue, name: stream-failures, in: region}
  actors: [client]
  flows:
    - {from: client, to: orders-api, label: "PUT /orders/{id}", step: 1}
    - {from: orders-api, to: orders-handler, step: 2}
    - {from: orders-handler, to: orders, label: UpdateItem, step: 3}
    - {from: orders, to: stream-processor, link: aws_lambda_event_source_mapping}
    - {from: stream-processor, to: order-status-events, label: Publish MODIFY events, step: 4}
    - {from: stream-processor, to: orders-search, label: index document, step: 5}
    - {from: stream-processor, to: stream-failures, label: on-failure destination}

- slug: msk-lambda-kafka-consumer
  title: Amazon MSK as a Lambda event source
  category: serverless
  tags: [msk, kafka, lambda, event source mapping, sasl scram]
  source: https://aws.amazon.com/blogs/compute/using-amazon-msk-as-an-event-source-for-aws-lambda/
  description: An MSK cluster spreads its brokers over the private subnets of two Availability Zones; a NAT gateway in each public subnet gives the private subnets their outbound path to the Lambda and STS control plane. A Lambda event source mapping polls a topic on the cluster, authenticating with SASL/SCRAM credentials from Secrets Manager, and invokes the function with batches of records.
  containers:
    - region: eu-west-1
      vpcs:
        - name: streaming
          cidr: 10.20.0.0/16
          at: [1, 1, 2, 1]
          subnets:
