- slug: sqs-dlq-replay-exponential-backoff
  title: Dead-letter queue replay with exponential backoff
  category: resilience
  tags: [sqs, dead-letter queue, replay, redrive, exponential backoff]
  source: https://aws.amazon.com/blogs/compute/using-amazon-sqs-dead-letter-queues-to-replay-messages
  description: Messages that fail processing land in a dead-letter queue; a replay Lambda function moves them back to the main queue with a delay computed by exponential backoff and a retry counter in message attributes. Messages that exceed the retry limit are parked in a second dead-letter queue for manual inspection, and an alarm tracks its depth.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_sqs_queue, name: main-queue, in: region}
    - {tf: aws_sqs_queue, name: main-dlq, in: region}
    - {tf: aws_sqs_queue, name: manual-review-dlq, in: region}
    - {tf: aws_lambda_function, name: message-consumer, in: region}
    - {tf: aws_lambda_function, name: dlq-replay, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: manual-dlq-alarm, in: region}
    - {tf: aws_sns_topic, name: operator-alerts, in: region}
  actors: [client]
  flows:
    - {from: client, to: main-queue, label: SendMessage, step: 1}
    - {from: main-queue, to: message-consumer, link: aws_lambda_event_source_mapping}
    - {from: main-queue, to: main-dlq, label: maxReceiveCount exceeded, step: 2}
    - {from: main-dlq, to: dlq-replay, link: aws_lambda_event_source_mapping}
    - {from: dlq-replay, to: main-queue, label: SendMessage with DelaySeconds backoff, step: 3}
    - {from: dlq-replay, to: manual-review-dlq, label: retry limit reached, step: 4}
    - {from: manual-review-dlq, to: manual-dlq-alarm, label: queue depth metric}
    - {from: manual-dlq-alarm, to: operator-alerts, label: ALARM action}

- slug: lambda-destinations-async-routing
