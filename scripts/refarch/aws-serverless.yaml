  description: An event-triggered AppFlow flow forwards Salesforce change events to an EventBridge partner event bus, where a rule invokes a Lambda function that upserts the record into DynamoDB. A DynamoDB stream handler writes status CSV files to S3, and a scheduled AppFlow flow pushes them back to Salesforce while SNS notifies users.
