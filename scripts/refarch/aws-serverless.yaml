    - {tf: aws_wafv2_web_acl, name: edge-waf, in: region}
    - {tf: aws_cognito_user_pool, name: app-users, in: region}
    - {tf: aws_api_gateway_rest_api, name: backend-api, in: region}
    - {tf: aws_lambda_function, name: request-ride, in: region}
    - {tf: aws_lambda_function, name: list-rides, in: region}
    - {tf: aws_dynamodb_table, name: rides, in: region}
  actors: [users]
  flows:
    - {from: users, to: site-cdn, label: HTTPS GET /, step: 1}
    - {from: site-cdn, to: edge-waf, label: WAF inspection}
    - {from: site-cdn, to: spa-static-site, label: S3 origin OAC, step: 2}
    - {from: users, to: app-users, label: "sign in, get JWT", step: 3}
    - {from: users, to: backend-api, label: POST /ride with Authorization JWT, step: 4}
    - {from: backend-api, to: app-users, label: Cognito authorizer validates token, step: 5}
    - {from: backend-api, to: request-ride, step: 6}
    - {from: request-ride, to: rides, label: PutItem, step: 7}
    - {from: backend-api, to: list-rides, label: GET /rides}
    - {from: list-rides, to: rides, label: Query}

- slug: s3-event-file-processing-eventbridge
  title: File processing from S3 events routed through EventBridge
  category: serverless
  tags: [s3 event notifications, eventbridge, lambda, file processing, content-based routing]
  source: https://aws.amazon.com/blogs/compute/using-dynamic-amazon-s3-event-handling-with-amazon-eventbridge
  description: Object uploads to an S3 bucket are recorded as CloudTrail data events, which EventBridge receives and matches with a rule on the bucket name and object key so a Lambda function processes each new file. The rule pattern is changed in EventBridge without touching the bucket's notification configuration.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_s3_bucket, name: uploads, in: region, at: [1, 1]}
    - {tf: aws_cloudtrail, name: s3-data-events-trail, in: region, at: [1, 2]}
    - {tf: aws_cloudwatch_event_rule, name: object-created-rule, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: process-file, in: region, at: [1, 4]}
  actors: [{type: users, name: users, at: [1, 1]}]
  flows:
    - {from: users, to: uploads, label: Data, step: 1}
    - {from: uploads, to: s3-data-events-trail, label: PutObject data event, step: 2}
    - {from: s3-data-events-trail, to: object-created-rule, label: PutObject event, step: 3}
    - {from: object-created-rule, to: process-file, label: matched rule, step: 4, link: aws_cloudwatch_event_target}

- slug: cloudfront-lambda-image-optimization
  title: On-the-fly image optimization with CloudFront and Lambda
  category: edge
  tags: [cloudfront, image resizing, lambda function url, s3, origin failover]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/image-optimization-using-amazon-cloudfront-and-aws-lambda/
  description: A CloudFront Function normalizes the requested width and format on the viewer request; CloudFront first tries an S3 bucket of already transformed images and, on a 403 miss, fails over to a Lambda function URL. The function fetches the original from S3, resizes it with Sharp, stores the variant back in the transformed bucket and returns it for caching.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_cloudfront_distribution, name: image-cdn, in: region, at: [1, 2, 3, 1]}
    - {tf: aws_cloudfront_function, name: normalize-image-url, in: region, at: [1, 1, 3, 1]}
    - {tf: aws_s3_bucket, name: transformed-images, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: image-transformer, in: region, at: [2, 3]}
    - {tf: aws_s3_bucket, name: original-images, in: region, at: [3, 3]}
  actors: [users]
  flows:
    - {from: users, to: normalize-image-url, label: "image request /image.jpg?format=auto&width=256", step: 1}
    - {from: normalize-image-url, to: image-cdn, label: "normalize and rewrite path /image.jpg/format=avif,width=256", step: 2}
    - {from: image-cdn, to: transformed-images, label: fetch image from S3 if generated, step: 3}
    - {from: image-cdn, to: image-transformer, label: otherwise generate the variant via the function URL, step: 4}
    - {from: image-transformer, to: original-images, label: fetch the original image, step: 4a}
    - {from: image-transformer, to: transformed-images, label: store the generated variant, step: 4b}

- slug: lambda-edge-request-customization
  title: Request customization at the edge with Lambda@Edge
  category: edge
  tags: [lambda@edge, cloudfront, authorization, a/b testing, origin selection]
  source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-at-the-edge.html
  description: Lambda@Edge functions replicated from us-east-1 run at CloudFront edge locations on viewer-request and origin-request events. The viewer-request function validates a JWT and redirects unauthenticated users; the origin-request function selects the S3 or ALB origin based on a cookie, enabling A/B tests and geo-based routing without touching the origin servers.
  containers:
    - region: us-east-1
