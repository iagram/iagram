- slug: sqs-fifo-ordered-processing
  title: Ordered processing with SQS FIFO and Lambda
  category: serverless
  tags: [sqs fifo, ordering, message group id, lambda, http api]
  source: https://aws.amazon.com/blogs/compute/new-for-aws-lambda-sqs-fifo-as-an-event-source/
  description: An HTTP API integrates directly with an SQS FIFO queue using the customer ID as the message group ID, so events for one customer are delivered in order and deduplicated. Lambda processes one batch per message group at a time while scaling across groups, and failed messages redrive to a FIFO dead-letter queue.
