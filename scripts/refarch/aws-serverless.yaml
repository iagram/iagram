      vpcs:
        - name: messaging
          cidr: 10.30.0.0/16
          subnets:
            - {name: broker-a, cidr: 10.30.1.0/24, az: a, public: false}
            - {name: broker-b, cidr: 10.30.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_mq_broker, name: rabbitmq-broker, in: subnet:broker-a}
    - {tf: aws_instance, name: legacy-order-app, in: subnet:broker-b}
    - {tf: aws_secretsmanager_secret, name: rabbitmq-credentials, in: region}
    - {tf: aws_lambda_function, name: order-consumer, in: region}
    - {tf: aws_dynamodb_table, name: orders, in: region}
    - {tf: aws_sqs_queue, name: consumer-failures, in: region}
  actors: []
  flows:
    - {from: legacy-order-app, to: rabbitmq-broker, label: AMQP publish, step: 1}
    - {from: rabbitmq-broker, to: order-consumer, link: aws_lambda_event_source_mapping}
    - {from: order-consumer, to: rabbitmq-credentials, label: broker credentials, step: 2}
    - {from: order-consumer, to: orders, label: PutItem, step: 3}
    - {from: order-consumer, to: consumer-failures, label: on-failure destination}

- slug: appflow-salesforce-dynamodb-bidirectional
  title: Bidirectional Salesforce integration with AppFlow and EventBridge
  category: serverless
  tags: [appflow, salesforce, eventbridge, dynamodb, saas integration]
  source: https://aws.amazon.com/blogs/architecture/integrating-salesforce-with-aws-dynamodb-using-amazon-appflow-bi-directionally/
  description: An event-triggered AppFlow flow forwards Salesforce change events to an EventBridge partner event bus, where a rule invokes a Lambda function that upserts the record into DynamoDB. A DynamoDB stream handler writes status CSV files to S3, and a scheduled AppFlow flow pushes them back to Salesforce while SNS notifies users.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_appflow_flow, name: salesforce-to-eventbridge, in: region, at: [3, 1]}
    - {tf: aws_cloudwatch_event_bus, name: appflow-partner-bus, in: region, at: [3, 2]}
    - {tf: aws_lambda_function, name: upsert-account, in: region, at: [3, 3]}
    - {tf: aws_dynamodb_table, name: accounts, in: region, at: [3, 5]}
    - {tf: aws_lambda_function, name: write-status-csv, in: region, at: [2, 3]}
    - {tf: aws_s3_bucket, name: sync-status-files, in: region, at: [2, 2]}
    - {tf: aws_appflow_flow, name: s3-to-salesforce, in: region, at: [2, 1]}
    - {tf: aws_lambda_function, name: notify-sync-status, in: region, at: [1, 5]}
    - {tf: aws_sns_topic, name: sync-notifications, in: region, at: [1, 6]}
    - {tf: aws_lambda_function, name: connect-account-lookup, in: region, at: [3, 6]}
    - {tf: aws_connect_instance, name: contact-center, in: region, at: [3, 7]}
    - {tf: aws_cloudwatch_event_bus, name: flow-break-bus, in: region, at: [4, 1]}
    - {tf: aws_lambda_function, name: flow-break-alert, in: region, at: [4, 2]}
    - {tf: aws_sns_topic, name: support-alerts, in: region, at: [4, 3]}
  actors:
    - {type: users, name: business-users, at: [1, 1]}
    - {type: saas, name: salesforce, at: [2, 1]}
    - {type: users, name: business-users-and-support-team, at: [1, 3]}
    - {type: users, name: aws-solution-support-team, at: [2, 3]}
  flows:
    - {from: business-users, to: salesforce, label: account changes}
    - {from: salesforce, to: salesforce-to-eventbridge, label: event request payload as input, step: 1}
    - {from: salesforce-to-eventbridge, to: appflow-partner-bus, label: PutEvents, step: 2}
    - {from: appflow-partner-bus, to: upsert-account, link: aws_cloudwatch_event_target, step: 3}
    - {from: upsert-account, to: accounts, label: UpdateItem, step: 4}
    - {from: accounts, to: write-status-csv, link: aws_lambda_event_source_mapping, label: DynamoDB Streams, step: 6}
    - {from: write-status-csv, to: sync-status-files, label: PutObject status.csv, step: 7}
    - {from: sync-status-files, to: s3-to-salesforce, label: scheduled flow source, step: 8}
    - {from: s3-to-salesforce, to: salesforce, label: event request status as output, step: 9}
    - {from: accounts, to: notify-sync-status, link: aws_lambda_event_source_mapping, label: DynamoDB Streams, step: 10}
    - {from: notify-sync-status, to: sync-notifications, label: Publish, step: 11}
    - {from: sync-notifications, to: business-users-and-support-team, link: aws_sns_topic_subscription, label: email}
    - {from: salesforce-to-eventbridge, to: flow-break-bus, label: if any flow breaks, step: 12}
    - {from: flow-break-bus, to: flow-break-alert, link: aws_cloudwatch_event_target, step: 13}
    - {from: flow-break-alert, to: support-alerts, label: Publish, step: 14}
    - {from: support-alerts, to: aws-solution-support-team, link: aws_sns_topic_subscription, label: email}
    - {from: contact-center, to: connect-account-lookup, label: contact flow invokes, step: 15}
    - {from: connect-account-lookup, to: accounts, label: GetItem / UpdateItem, step: 16}

- slug: sqs-fifo-ordered-processing
  title: Ordered processing with SQS FIFO and Lambda
  category: serverless
  tags: [sqs fifo, ordering, message group id, lambda, http api]
  source: https://aws.amazon.com/blogs/compute/new-for-aws-lambda-sqs-fifo-as-an-event-source/
  description: An HTTP API integrates directly with an SQS FIFO queue using the customer ID as the message group ID, so events for one customer are delivered in order and deduplicated. Lambda processes one batch per message group at a time while scaling across groups, and failed messages redrive to a FIFO dead-letter queue.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_apigatewayv2_api, name: orders-http-api, in: region}
    - {tf: aws_sqs_queue, name: orders-fifo, in: region}
    - {tf: aws_sqs_queue, name: orders-fifo-dlq, in: region}
    - {tf: aws_lambda_function, name: order-state-processor, in: region}
    - {tf: aws_dynamodb_table, name: order-ledger, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: fifo-dlq-depth, in: region}
  actors: [client]
  flows:
    - {from: client, to: orders-http-api, label: POST /orders, step: 1}
    - {from: orders-http-api, to: orders-fifo, label: "SendMessage MessageGroupId=customerId", step: 2}
    - {from: orders-fifo, to: order-state-processor, link: aws_lambda_event_source_mapping}
    - {from: order-state-processor, to: order-ledger, label: TransactWriteItems, step: 3}
    - {from: orders-fifo, to: orders-fifo-dlq, label: redrive policy}
    - {from: orders-fifo-dlq, to: fifo-dlq-depth, label: ApproximateNumberOfMessagesVisible}

- slug: sqs-dlq-replay-exponential-backoff
  title: Dead-letter queue replay with exponential backoff
  category: resilience
  tags: [sqs, dead-letter queue, replay, redrive, exponential backoff]
  source: https://aws.amazon.com/blogs/compute/using-amazon-sqs-dead-letter-queues-to-replay-messages
  description: An application producer sends messages to a main queue that an application consumer reads; messages that fail processing land in a dead-letter queue, and a replay Lambda function moves them back to the main queue with a delay computed by exponential backoff and a retry counter in message attributes. Messages that exceed the retry limit are parked in a second dead-letter queue that operators inspect manually.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_sqs_queue, name: main-queue, in: region, at: [1, 1]}
    - {tf: aws_sqs_queue, name: main-dlq, in: region, at: [2, 1]}
    - {tf: aws_lambda_function, name: dlq-replay, in: region, at: [2, 2]}
    - {tf: aws_sqs_queue, name: manual-review-dlq, in: region, at: [3, 3]}
  actors:
    - {type: server, name: application-producer, at: [1, 1]}
    - {type: server, name: application-consumer, at: [1, 3]}
    - {type: users, name: operators, at: [2, 2]}
  flows:
    - {from: application-producer, to: main-queue, label: SendMessage, step: 1}
    - {from: main-queue, to: application-consumer, label: ReceiveMessage, step: 2}
    - {from: main-queue, to: main-dlq, label: maxReceiveCount exceeded, step: 3}
    - {from: main-dlq, to: dlq-replay, label: replay, step: 4, link: aws_lambda_event_source_mapping}
    - {from: dlq-replay, to: main-queue, label: "max retries not reached: SendMessage with DelaySeconds backoff", step: 5}
    - {from: dlq-replay, to: manual-review-dlq, label: max retries exceeded, step: 6}
    - {from: manual-review-dlq, to: operators, label: manual inspection}

- slug: lambda-destinations-async-routing
  title: Asynchronous Lambda invocation with destinations
  category: serverless
  tags: [lambda destinations, asynchronous invocation, eventbridge, sqs, error handling]
  source: https://aws.amazon.com/blogs/compute/introducing-aws-lambda-destinations/
  description: An HTTP API invokes a Lambda function asynchronously; the function's OnSuccess destination sends the execution record to an EventBridge bus and its OnFailure destination sends it to an SQS queue, with no code in the function for either. A rule on the bus triggers a notification function and a triage function drains the failure queue.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_apigatewayv2_api, name: ingest-api, in: region}
    - {tf: aws_lambda_function, name: process-order, in: region}
    - {tf: aws_cloudwatch_event_bus, name: order-results-bus, in: region}
    - {tf: aws_cloudwatch_event_rule, name: order-processed, in: region}
    - {tf: aws_lambda_function, name: notify-customer, in: region}
    - {tf: aws_sqs_queue, name: process-failures, in: region}
    - {tf: aws_lambda_function, name: triage-failures, in: region}
    - {tf: aws_dynamodb_table, name: orders, in: region}
  actors: [client]
  flows:
    - {from: client, to: ingest-api, label: POST /orders, step: 1}
    - {from: ingest-api, to: process-order, label: InvocationType Event, step: 2}
    - {from: process-order, to: orders, label: PutItem, step: 3}
    - {from: process-order, to: order-results-bus, label: OnSuccess destination, step: 4}
    - {from: process-order, to: process-failures, label: OnFailure destination after retries}
    - {from: order-results-bus, to: order-processed, step: 5}
    - {from: order-processed, to: notify-customer, link: aws_cloudwatch_event_target}
    - {from: process-failures, to: triage-failures, link: aws_lambda_event_source_mapping}

- slug: serverless-web-app-cloudfront-cognito
  title: Serverless web application with S3, CloudFront, Cognito and API Gateway
  category: web
  tags: [serverless web app, s3, cloudfront, cognito, api gateway, lambda, dynamodb]
  source: https://docs.aws.amazon.com/whitepapers/latest/serverless-multi-tier-architectures-api-gateway-lambda/serverless-multi-tier-architectures-api-gateway-lambda.html
  description: A single-page application is served from S3 through CloudFront with WAF in front; users sign in with a Cognito user pool and present JWTs to an API Gateway REST API protected by a Cognito authorizer. Lambda functions implement the logic tier and DynamoDB the data tier, so no tier runs on servers.
