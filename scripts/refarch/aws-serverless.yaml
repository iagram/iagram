# AWS reference architectures: serverless and application integration.
# Format: see FORMAT.md. 25 items, provider aws.

- slug: apigw-rest-lambda-dynamodb-crud
  title: REST API with API Gateway, Lambda and DynamoDB
  category: serverless
  tags: [api gateway, lambda, dynamodb, rest, crud]
  source: https://serverlessland.com/patterns/apigw-lambda-dynamodb
  description: An API Gateway REST API fronts one Lambda function per route; each function reads or writes items in a single DynamoDB table using the on-demand capacity mode. API Gateway handles throttling, request validation and access logging so the functions contain only business logic.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: items-api, in: region}
    - {tf: aws_lambda_function, name: create-item, in: region}
    - {tf: aws_lambda_function, name: get-item, in: region}
    - {tf: aws_lambda_function, name: list-items, in: region}
    - {tf: aws_dynamodb_table, name: items, in: region}
    - {tf: aws_cloudwatch_log_group, name: api-access-logs, in: region}
  actors: [client]
  flows:
    - {from: client, to: items-api, label: HTTPS POST /items, step: 1}
    - {from: items-api, to: create-item, label: Lambda proxy integration, step: 2}
    - {from: create-item, to: items, label: PutItem, step: 3}
    - {from: items-api, to: get-item, label: "GET /items/{id}"}
    - {from: items-api, to: list-items, label: GET /items}
    - {from: get-item, to: items, label: GetItem}
    - {from: list-items, to: items, label: Query}
    - {from: items-api, to: api-access-logs, label: access logs}

- slug: websocket-api-chat-lambda-dynamodb
  title: WebSocket chat API with API Gateway, Lambda and DynamoDB
  category: serverless
  tags: [websocket, api gateway, lambda, dynamodb, real-time]
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/websocket-api-chat-app.html
  description: An API Gateway WebSocket API routes $connect, $disconnect and sendmessage frames to three Lambda functions. Connection IDs are stored in a DynamoDB table so the sendmessage handler can broadcast to every connected client through the API Gateway management endpoint.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_apigatewayv2_api, name: chat-websocket-api, in: region}
    - {tf: aws_lambda_function, name: on-connect, in: region}
    - {tf: aws_lambda_function, name: on-disconnect, in: region}
    - {tf: aws_lambda_function, name: send-message, in: region}
    - {tf: aws_dynamodb_table, name: connections, in: region}
    - {tf: aws_cloudwatch_log_group, name: websocket-logs, in: region}
  actors: [users]
  flows:
    - {from: users, to: chat-websocket-api, label: "wss:// $connect", step: 1}
    - {from: chat-websocket-api, to: on-connect, label: "$connect route", step: 2}
    - {from: on-connect, to: connections, label: PutItem connectionId, step: 3}
    - {from: users, to: chat-websocket-api, label: sendmessage frame, step: 4}
    - {from: chat-websocket-api, to: send-message, label: sendmessage route, step: 5}
    - {from: send-message, to: connections, label: Scan connections, step: 6}
    - {from: send-message, to: chat-websocket-api, label: PostToConnection, step: 7}
    - {from: chat-websocket-api, to: on-disconnect, label: "$disconnect route"}
    - {from: on-disconnect, to: connections, label: DeleteItem}

- slug: sns-sqs-fanout-order-processing
  title: SNS to SQS fan-out with parallel Lambda consumers
  category: serverless
  tags: [sns, sqs, fan-out, lambda, decoupling]
  source: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  description: A producer publishes one order event to an SNS topic; three SQS queues subscribed to the topic each receive a copy, so inventory, shipping and analytics consumers process independently and at their own pace. Each queue has a dead-letter queue and a Lambda function attached through an event source mapping.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_lambda_function, name: order-api-handler, in: region}
    - {tf: aws_sns_topic, name: order-events, in: region}
    - {tf: aws_sqs_queue, name: inventory-queue, in: region}
    - {tf: aws_sqs_queue, name: shipping-queue, in: region}
    - {tf: aws_sqs_queue, name: analytics-queue, in: region}
    - {tf: aws_sqs_queue, name: fanout-dlq, in: region}
    - {tf: aws_lambda_function, name: inventory-consumer, in: region}
    - {tf: aws_lambda_function, name: shipping-consumer, in: region}
    - {tf: aws_lambda_function, name: analytics-consumer, in: region}
  actors: [client]
  flows:
    - {from: client, to: order-api-handler, label: place order, step: 1}
    - {from: order-api-handler, to: order-events, label: Publish, step: 2}
    - {from: order-events, to: inventory-queue, link: aws_sns_topic_subscription}
    - {from: order-events, to: shipping-queue, link: aws_sns_topic_subscription}
    - {from: order-events, to: analytics-queue, link: aws_sns_topic_subscription}
    - {from: inventory-queue, to: inventory-consumer, link: aws_lambda_event_source_mapping}
    - {from: shipping-queue, to: shipping-consumer, link: aws_lambda_event_source_mapping}
    - {from: analytics-queue, to: analytics-consumer, link: aws_lambda_event_source_mapping}
    - {from: inventory-queue, to: fanout-dlq, label: redrive after maxReceiveCount}
    - {from: shipping-queue, to: fanout-dlq, label: redrive after maxReceiveCount}

- slug: eventbridge-central-bus-multi-account
  title: Centralized EventBridge event bus across accounts
  category: serverless
  tags: [eventbridge, event bus, multi-account, resource policy, archive]
  source: https://aws.amazon.com/blogs/compute/simplifying-cross-account-access-with-amazon-eventbridge-resource-policies
  description: Producer accounts forward domain events from their local event bus to a central bus in a shared account; a resource policy on the central bus grants PutEvents to the organization. Rules on the central bus route events on to consumer-account buses and an archive keeps a replayable copy.
  containers:
    - region: us-east-1
      account: orders-producer
    - region: us-east-1
      account: central-events
    - region: us-east-1
      account: billing-consumer
  elements:
    - {tf: aws_lambda_function, name: order-service, in: account:orders-producer}
    - {tf: aws_cloudwatch_event_bus, name: orders-local-bus, in: account:orders-producer}
    - {tf: aws_cloudwatch_event_rule, name: forward-to-central, in: account:orders-producer}
    - {tf: aws_cloudwatch_event_bus, name: central-bus, in: account:central-events}
    - {tf: aws_cloudwatch_event_archive, name: central-archive, in: account:central-events}
    - {tf: aws_cloudwatch_event_rule, name: route-order-created, in: account:central-events}
    - {tf: aws_cloudwatch_event_bus, name: billing-bus, in: account:billing-consumer}
    - {tf: aws_cloudwatch_event_rule, name: invoice-on-order, in: account:billing-consumer}
    - {tf: aws_lambda_function, name: billing-service, in: account:billing-consumer}
  actors: []
  flows:
    - {from: order-service, to: orders-local-bus, label: PutEvents OrderCreated, step: 1}
    - {from: orders-local-bus, to: forward-to-central, label: match source, step: 2}
    - {from: forward-to-central, to: central-bus, link: aws_cloudwatch_event_target}
    - {from: central-bus, to: central-archive, label: archive all events}
    - {from: central-bus, to: route-order-created, label: detail-type OrderCreated, step: 3}
    - {from: route-order-created, to: billing-bus, link: aws_cloudwatch_event_target}
    - {from: billing-bus, to: invoice-on-order, step: 4}
    - {from: invoice-on-order, to: billing-service, link: aws_cloudwatch_event_target}

- slug: eventbridge-pipes-sqs-enrich-step-functions
  title: EventBridge Pipes from SQS with enrichment to Step Functions
  category: serverless
  tags: [eventbridge pipes, sqs, enrichment, step functions, point-to-point]
  source: https://aws.amazon.com/blogs/compute/implementing-architectural-patterns-with-amazon-eventbridge-pipes/
  description: A pipe polls an SQS order queue, filters messages, calls a Lambda enrichment step that looks up the customer record in DynamoDB, and starts a Step Functions execution with the enriched payload. No consumer code is written for the queue; batching, filtering and the target invocation are handled by the pipe.
  containers:
    - region: eu-central-1
  elements:
    - {tf: aws_sqs_queue, name: orders-queue, in: region}
    - {tf: aws_pipes_pipe, name: orders-pipe, in: region}
    - {tf: aws_lambda_function, name: enrich-customer, in: region}
    - {tf: aws_dynamodb_table, name: customers, in: region}
    - {tf: aws_sfn_state_machine, name: process-order, in: region}
    - {tf: aws_sqs_queue, name: orders-pipe-dlq, in: region}
    - {tf: aws_cloudwatch_log_group, name: pipe-logs, in: region}
  actors: [client]
  flows:
    - {from: client, to: orders-queue, label: SendMessage, step: 1}
    - {from: orders-queue, to: orders-pipe, label: source with filter, step: 2}
    - {from: orders-pipe, to: enrich-customer, label: enrichment invoke, step: 3}
    - {from: enrich-customer, to: customers, label: GetItem customerId, step: 4}
    - {from: orders-pipe, to: process-order, label: StartExecution target, step: 5}
    - {from: orders-pipe, to: orders-pipe-dlq, label: failed events}
    - {from: orders-pipe, to: pipe-logs, label: execution logs}

- slug: eventbridge-scheduler-campaigns
  title: Scheduled jobs at scale with EventBridge Scheduler
  category: serverless
  tags: [eventbridge scheduler, cron, one-time schedule, lambda, ses]
  source: https://aws.amazon.com/blogs/compute/scheduling-email-campaigns-at-scale-with-amazon-eventbridge-scheduler/
  description: An API creates one-time or recurring EventBridge Scheduler schedules inside a schedule group, one per campaign; when a schedule fires it invokes a Lambda function that personalizes and sends email through SES. Failed invocations go to a dead-letter queue and completed one-time schedules are deleted automatically.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: campaign-api, in: region}
    - {tf: aws_lambda_function, name: create-schedule, in: region}
    - {tf: aws_dynamodb_table, name: campaigns, in: region}
    - {tf: aws_scheduler_schedule_group, name: campaign-schedules, in: region}
    - {tf: aws_scheduler_schedule, name: send-campaign, in: region}
    - {tf: aws_lambda_function, name: send-personalized-email, in: region}
    - {tf: aws_ses_email_identity, name: marketing-sender, in: region}
    - {tf: aws_sqs_queue, name: scheduler-dlq, in: region}
  actors: [user]
  flows:
    - {from: user, to: campaign-api, label: POST /campaigns, step: 1}
    - {from: campaign-api, to: create-schedule, step: 2}
    - {from: create-schedule, to: campaigns, label: PutItem, step: 3}
    - {from: create-schedule, to: send-campaign, label: "CreateSchedule at(...)", step: 4}
    - {from: send-campaign, to: send-personalized-email, label: invoke at scheduled time, step: 5}
    - {from: send-personalized-email, to: campaigns, label: read recipients, step: 6}
    - {from: send-personalized-email, to: marketing-sender, label: SES SendEmail, step: 7}
    - {from: send-campaign, to: scheduler-dlq, label: undeliverable invocations}

- slug: step-functions-saga-orchestration
  title: Saga orchestration with Step Functions
  category: serverless
  tags: [step functions, saga, compensating transactions, distributed transaction, lambda]
  source: https://aws.amazon.com/blogs/compute/building-a-serverless-distributed-application-using-a-saga-orchestration-pattern
  description: A booking request starts a Step Functions standard workflow that calls flight, hotel and payment Lambda functions in sequence, each writing to its own DynamoDB table. Catch blocks route any failure to compensating functions that cancel earlier steps in reverse order so the distributed transaction ends consistent.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: booking-api, in: region}
    - {tf: aws_sfn_state_machine, name: booking-saga, in: region}
    - {tf: aws_lambda_function, name: reserve-flight, in: region}
    - {tf: aws_lambda_function, name: reserve-hotel, in: region}
    - {tf: aws_lambda_function, name: charge-payment, in: region}
    - {tf: aws_lambda_function, name: cancel-flight, in: region}
    - {tf: aws_lambda_function, name: cancel-hotel, in: region}
    - {tf: aws_lambda_function, name: refund-payment, in: region}
    - {tf: aws_dynamodb_table, name: flights, in: region}
    - {tf: aws_dynamodb_table, name: hotels, in: region}
    - {tf: aws_dynamodb_table, name: payments, in: region}
  actors: [client]
  flows:
    - {from: client, to: booking-api, label: POST /bookings, step: 1}
    - {from: booking-api, to: booking-saga, label: StartExecution, step: 2}
    - {from: booking-saga, to: reserve-flight, step: 3}
    - {from: reserve-flight, to: flights, label: PutItem}
    - {from: booking-saga, to: reserve-hotel, step: 4}
    - {from: reserve-hotel, to: hotels, label: PutItem}
    - {from: booking-saga, to: charge-payment, step: 5}
    - {from: charge-payment, to: payments, label: PutItem}
    - {from: booking-saga, to: refund-payment, label: Catch compensate}
    - {from: booking-saga, to: cancel-hotel, label: Catch compensate}
    - {from: booking-saga, to: cancel-flight, label: Catch compensate}

- slug: step-functions-parallel-fan-out-fan-in
  title: Parallel fan-out and fan-in with nested Step Functions
  category: serverless
  tags: [step functions, parallel, map, fan-out, nested workflows]
  source: https://aws.amazon.com/blogs/compute/accelerating-workloads-using-parallelism-in-aws-step-functions/
  description: An orchestrator state machine uses a Parallel state and a Map state to start many child workflow executions concurrently, each running a Lambda task and writing its result to DynamoDB. When all branches complete, an aggregation function reads the results, writes a report to S3 and publishes a completion notification.
  containers:
    - region: us-west-2
  elements:
    - {tf: aws_sfn_state_machine, name: test-orchestrator, in: region}
    - {tf: aws_sfn_state_machine, name: test-case-worker, in: region}
    - {tf: aws_lambda_function, name: prepare-test-set, in: region}
    - {tf: aws_lambda_function, name: run-test-case, in: region}
    - {tf: aws_lambda_function, name: aggregate-results, in: region}
    - {tf: aws_dynamodb_table, name: test-results, in: region}
    - {tf: aws_s3_bucket, name: test-reports, in: region}
    - {tf: aws_sns_topic, name: run-completed, in: region}
  actors: [user]
  flows:
    - {from: user, to: test-orchestrator, label: StartExecution, step: 1}
    - {from: test-orchestrator, to: prepare-test-set, step: 2}
    - {from: test-orchestrator, to: test-case-worker, label: Map state StartExecution.sync, step: 3}
    - {from: test-case-worker, to: run-test-case, label: Parallel branches, step: 4}
    - {from: run-test-case, to: test-results, label: PutItem, step: 5}
    - {from: test-orchestrator, to: aggregate-results, label: fan-in, step: 6}
    - {from: aggregate-results, to: test-results, label: Query}
    - {from: aggregate-results, to: test-reports, label: PutObject report, step: 7}
    - {from: aggregate-results, to: run-completed, label: Publish, step: 8}

- slug: step-functions-distributed-map-s3
  title: Large-scale S3 processing with Step Functions Distributed Map
  category: serverless
  tags: [step functions, distributed map, s3, parallel processing, etl]
  source: https://aws.amazon.com/blogs/aws/step-functions-distributed-map-a-serverless-solution-for-large-scale-parallel-data-processing/
  description: An EventBridge rule starts a state machine when a manifest lands in S3; a Distributed Map state lists the objects under a prefix and runs up to 10,000 concurrent child executions, each invoking a Lambda function per object or batch. Child results are written back to S3 and summarized by a final function.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_s3_bucket, name: input-data, in: region}
    - {tf: aws_cloudwatch_event_rule, name: manifest-uploaded, in: region}
    - {tf: aws_sfn_state_machine, name: distributed-map-processor, in: region}
    - {tf: aws_lambda_function, name: transform-batch, in: region}
    - {tf: aws_lambda_function, name: summarize-run, in: region}
    - {tf: aws_s3_bucket, name: map-results, in: region}
    - {tf: aws_sns_topic, name: processing-complete, in: region}
  actors: [client]
  flows:
    - {from: client, to: input-data, label: PutObject manifest, step: 1}
    - {from: input-data, to: manifest-uploaded, label: Object Created event via EventBridge, step: 2}
    - {from: manifest-uploaded, to: distributed-map-processor, link: aws_cloudwatch_event_target}
    - {from: distributed-map-processor, to: input-data, label: ListObjectsV2 prefix, step: 3}
    - {from: distributed-map-processor, to: transform-batch, label: child executions, step: 4}
    - {from: distributed-map-processor, to: map-results, label: ResultWriter, step: 5}
    - {from: distributed-map-processor, to: summarize-run, step: 6}
    - {from: summarize-run, to: processing-complete, label: Publish, step: 7}

- slug: step-functions-human-approval-callback
  title: Human approval step with Step Functions task token
  category: serverless
  tags: [step functions, human approval, task token, callback, api gateway]
  source: https://aws.amazon.com/blogs/compute/implementing-serverless-manual-approval-steps-in-aws-step-functions-and-amazon-api-gateway/
  description: The workflow pauses at a waitForTaskToken step and a Lambda function emails the approver links that embed the task token. Clicking a link calls an API Gateway endpoint that invokes SendTaskSuccess or SendTaskFailure, and the workflow resumes without any long-running process waiting.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: request-api, in: region}
    - {tf: aws_sfn_state_machine, name: approval-workflow, in: region}
    - {tf: aws_lambda_function, name: send-approval-email, in: region}
    - {tf: aws_ses_email_identity, name: approvals-sender, in: region}
    - {tf: aws_api_gateway_rest_api, name: approval-callback-api, in: region}
    - {tf: aws_lambda_function, name: fulfil-request, in: region}
    - {tf: aws_dynamodb_table, name: approval-requests, in: region}
  actors: [user, client]
  flows:
    - {from: client, to: request-api, label: submit request, step: 1}
    - {from: request-api, to: approval-workflow, label: StartExecution, step: 2}
    - {from: approval-workflow, to: send-approval-email, label: waitForTaskToken, step: 3}
    - {from: send-approval-email, to: approval-requests, label: store token}
    - {from: send-approval-email, to: approvals-sender, label: email approve/reject links, step: 4}
    - {from: approvals-sender, to: user, label: approval email, step: 5}
    - {from: user, to: approval-callback-api, label: "GET /approve?token=", step: 6}
    - {from: approval-callback-api, to: approval-workflow, label: SendTaskSuccess, step: 7}
    - {from: approval-workflow, to: fulfil-request, step: 8}

- slug: kinesis-lambda-enhanced-fan-out
  title: Kinesis Data Streams with Lambda enhanced fan-out consumers
  category: serverless
  tags: [kinesis, lambda, enhanced fan-out, stream processing, event source mapping]
  source: https://aws.amazon.com/blogs/compute/increasing-real-time-stream-processing-performance-with-amazon-kinesis-data-streams-enhanced-fan-out-and-aws-lambda/
  description: Producers write clickstream records to a Kinesis data stream; two Lambda functions consume the same stream through registered enhanced fan-out consumers so each gets dedicated 2 MB/s per shard over HTTP/2. Batches that exhaust retries are sent to an SQS on-failure destination and raw records are archived to S3 through Firehose.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_kinesis_stream, name: clickstream, in: region}
    - {tf: aws_kinesis_stream_consumer, name: metrics-consumer, in: region}
    - {tf: aws_kinesis_stream_consumer, name: fraud-consumer, in: region}
    - {tf: aws_lambda_function, name: aggregate-metrics, in: region}
    - {tf: aws_lambda_function, name: detect-fraud, in: region}
    - {tf: aws_dynamodb_table, name: realtime-metrics, in: region}
    - {tf: aws_sqs_queue, name: stream-failures, in: region}
    - {tf: aws_kinesis_firehose_delivery_stream, name: raw-archive, in: region}
    - {tf: aws_s3_bucket, name: clickstream-archive, in: region}
  actors: [mobile]
  flows:
    - {from: mobile, to: clickstream, label: PutRecords, step: 1}
    - {from: clickstream, to: metrics-consumer, label: SubscribeToShard HTTP/2, step: 2}
    - {from: clickstream, to: fraud-consumer, label: SubscribeToShard HTTP/2}
    - {from: metrics-consumer, to: aggregate-metrics, link: aws_lambda_event_source_mapping}
    - {from: fraud-consumer, to: detect-fraud, link: aws_lambda_event_source_mapping}
    - {from: aggregate-metrics, to: realtime-metrics, label: UpdateItem counters, step: 3}
    - {from: aggregate-metrics, to: stream-failures, label: on-failure destination}
    - {from: clickstream, to: raw-archive, label: Firehose source}
    - {from: raw-archive, to: clickstream-archive, label: buffered PutObject}

- slug: dynamodb-streams-lambda-cdc
  title: DynamoDB Streams change data capture with Lambda
  category: serverless
  tags: [dynamodb streams, lambda, change data capture, event-driven, sns]
  source: https://aws.amazon.com/blogs/database/build-scalable-event-driven-architectures-with-amazon-dynamodb-and-aws-lambda/
  description: Writes to an orders table are captured by DynamoDB Streams and delivered in order per partition key to a Lambda function through an event source mapping with filtering. The function publishes domain events to SNS and indexes documents in OpenSearch; failed batches are routed to an SQS on-failure destination.
  containers:
    - region: eu-west-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: orders-api, in: region}
    - {tf: aws_lambda_function, name: orders-handler, in: region}
    - {tf: aws_dynamodb_table, name: orders, in: region}
    - {tf: aws_lambda_function, name: stream-processor, in: region}
    - {tf: aws_sns_topic, name: order-status-events, in: region}
    - {tf: aws_opensearch_domain, name: orders-search, in: region}
    - {tf: aws_sqs_queue, name: stream-failures, in: region}
  actors: [client]
  flows:
    - {from: client, to: orders-api, label: "PUT /orders/{id}", step: 1}
    - {from: orders-api, to: orders-handler, step: 2}
    - {from: orders-handler, to: orders, label: UpdateItem, step: 3}
    - {from: orders, to: stream-processor, link: aws_lambda_event_source_mapping}
    - {from: stream-processor, to: order-status-events, label: Publish MODIFY events, step: 4}
    - {from: stream-processor, to: orders-search, label: index document, step: 5}
    - {from: stream-processor, to: stream-failures, label: on-failure destination}

- slug: msk-lambda-kafka-consumer
  title: Amazon MSK as a Lambda event source
  category: serverless
  tags: [msk, kafka, lambda, event source mapping, sasl scram]
  source: https://aws.amazon.com/blogs/compute/using-amazon-msk-as-an-event-source-for-aws-lambda/
  description: A Lambda event source mapping polls a topic on an MSK cluster inside private subnets, authenticating with SASL/SCRAM credentials from Secrets Manager, and invokes the function with batches of records. Interface endpoints for Lambda and STS in the cluster VPC let the poller reach the control plane without a NAT gateway.
  containers:
    - region: eu-west-1
      vpcs:
        - name: streaming
          cidr: 10.20.0.0/16
          subnets:
            - {name: kafka-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: kafka-b, cidr: 10.20.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_msk_cluster, name: events-cluster, in: vpc:streaming}
    - {tf: aws_instance, name: producer-app, in: subnet:kafka-a}
    - {tf: aws_secretsmanager_secret, name: kafka-scram-credentials, in: region}
    - {tf: aws_vpc_endpoint, name: lambda-endpoint, in: subnet:kafka-a}
