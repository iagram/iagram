- slug: webhook-ingestion-verify-store-route
  title: Webhook ingestion with verification, storage and routing
  category: serverless
  tags: [webhooks, api gateway, hmac verification, dynamodb streams, eventbridge pipes]
  source: https://aws.amazon.com/blogs/compute/sending-and-receiving-webhooks-on-aws-innovate-with-event-notifications/
  description: A SaaS provider posts webhooks to an API Gateway endpoint; a Lambda function verifies the HMAC signature with a secret from Secrets Manager, deduplicates by event ID, stores the payload in S3 and the metadata in DynamoDB. An EventBridge pipe reads the DynamoDB stream and routes each event type to a Step Functions workflow or a Lambda handler.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: webhook-api, in: region}
    - {tf: aws_lambda_function, name: verify-and-store, in: region}
    - {tf: aws_secretsmanager_secret, name: webhook-hmac-secret, in: region}
    - {tf: aws_s3_bucket, name: webhook-payloads, in: region}
    - {tf: aws_dynamodb_table, name: webhook-events, in: region}
    - {tf: aws_pipes_pipe, name: route-webhook-events, in: region}
    - {tf: aws_sfn_state_machine, name: handle-payment-event, in: region}
    - {tf: aws_lambda_function, name: handle-refund-event, in: region}
    - {tf: aws_sqs_queue, name: routing-dlq, in: region}
  actors: [saas]
  flows:
    - {from: saas, to: webhook-api, label: POST /webhook with signature header, step: 1}
    - {from: webhook-api, to: verify-and-store, step: 2}
    - {from: verify-and-store, to: webhook-hmac-secret, label: fetch signing secret, step: 3}
    - {from: verify-and-store, to: webhook-payloads, label: PutObject payload, step: 4}
    - {from: verify-and-store, to: webhook-events, label: PutItem idempotent on eventId, step: 5}
    - {from: webhook-events, to: route-webhook-events, label: DynamoDB stream source, step: 6}
    - {from: route-webhook-events, to: handle-payment-event, label: filter eventType payment, step: 7}
    - {from: route-webhook-events, to: handle-refund-event, label: filter eventType refund}
    - {from: route-webhook-events, to: routing-dlq, label: failed deliveries}
