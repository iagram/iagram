      vpcs:
        - name: data
          cidr: 10.50.0.0/16
          at: [2, 1, 1, 3]
          subnets:
            - {name: db-a, cidr: 10.50.1.0/24, az: a, public: false}
            - {name: db-b, cidr: 10.50.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_autoscaling_group, name: ec2-app-fleet, in: group:ec2-vm-apps, at: [1, 1]}
    - {tf: aws_elastic_beanstalk_application, name: beanstalk-app, in: group:ec2-vm-apps, at: [1, 2]}
    - {tf: aws_ecr_repository, name: app-images, in: group:containerized-apps, at: [1, 1]}
    - {tf: aws_ecs_cluster, name: ecs-apps, in: group:containerized-apps, at: [1, 2]}
    - {tf: aws_lambda_function, name: add-record, in: group:serverless-apps, at: [1, 1]}
    - {tf: aws_lambda_function, name: get-records, in: group:serverless-apps, at: [1, 2]}
    - {tf: aws_rds_cluster, name: inventory-aurora, in: vpc:data, at: [1, 1, 2, 1]}
  actors:
