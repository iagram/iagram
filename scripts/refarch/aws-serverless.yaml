          cidr: 10.40.0.0/16
          subnets:
            - {name: app-public-a, cidr: 10.40.0.0/24, az: a, public: true}
            - {name: app-public-b, cidr: 10.40.1.0/24, az: b, public: true}
  elements:
    - {tf: aws_cloudfront_distribution, name: site-cdn, in: region}
    - {tf: aws_lambda_function, name: viewer-request-auth, in: region}
    - {tf: aws_lambda_function, name: origin-request-router, in: region}
    - {tf: aws_s3_bucket, name: static-origin, in: region}
    - {tf: aws_lb, name: dynamic-origin-alb, in: vpc:app}
    - {tf: aws_wafv2_web_acl, name: edge-waf, in: region}
  actors: [users]
  flows:
    - {from: users, to: site-cdn, label: HTTPS request, step: 1}
    - {from: site-cdn, to: edge-waf, label: WAF inspection}
    - {from: site-cdn, to: viewer-request-auth, label: viewer-request trigger validates JWT, step: 2}
    - {from: site-cdn, to: origin-request-router, label: origin-request trigger on cache miss, step: 3}
    - {from: origin-request-router, to: static-origin, label: variant A cookie, step: 4}
    - {from: origin-request-router, to: dynamic-origin-alb, label: variant B cookie}

- slug: aurora-serverless-data-api-crud
  title: Serverless data API with Aurora Serverless and the Data API
  category: serverless
