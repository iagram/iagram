# AWS reference architectures: resilience, disaster recovery and migration.
# Format: scripts/refarch/FORMAT.md. Sources verified 2026-09-13.

- slug: backup-restore-rapid-recovery
  title: Backup and restore with event-driven rapid recovery
  category: resilience
  tags: [disaster recovery, backup and restore, aws backup, eventbridge, cloudformation, golden ami]
  source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-ii-backup-and-restore-with-rapid-recovery/
  description: AWS Backup takes point-in-time recovery points of EBS, RDS, EFS and DynamoDB in the primary Region and copies them to a vault in the recovery Region. An EventBridge rule on CloudWatch alarms and AWS Health events triggers a Lambda function that redeploys the stack from CloudFormation and golden AMIs, then restores data from the copied recovery points.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: prod-primary
          cidr: 10.0.0.0/16
          subnets:
            - {name: bp-app-a, cidr: 10.0.1.0/24, az: a, public: false}
            - {name: bp-db-a, cidr: 10.0.10.0/24, az: a, public: false}
    - region: us-west-2
      label: secondary
      vpcs:
        - name: prod-recovery
          cidr: 10.1.0.0/16
          subnets:
            - {name: bp-rec-app-a, cidr: 10.1.1.0/24, az: a, public: false}
            - {name: bp-rec-db-a, cidr: 10.1.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_instance, name: app-server, in: subnet:bp-app-a}
    - {tf: aws_db_instance, name: app-db, in: subnet:bp-db-a}
    - {tf: aws_efs_file_system, name: app-files, in: vpc:prod-primary}
    - {tf: aws_dynamodb_table, name: sessions, in: region:us-east-1}
    - {tf: aws_backup_plan, name: daily-plan, in: region:us-east-1}
    - {tf: aws_backup_vault, name: primary-vault, in: region:us-east-1}
    - {tf: aws_backup_vault, name: recovery-vault, in: region:us-west-2}
    - {tf: aws_cloudwatch_event_rule, name: disaster-detected, in: region:us-west-2}
    - {tf: aws_lambda_function, name: recovery-orchestrator, in: region:us-west-2}
    - {tf: aws_cloudformation_stack, name: workload-stack, in: region:us-west-2}
    - {tf: aws_ami, name: golden-ami, in: region:us-west-2}
    - {tf: aws_instance, name: restored-app-server, in: subnet:bp-rec-app-a}
    - {tf: aws_db_instance, name: restored-db, in: subnet:bp-rec-db-a}
  actors: [users]
  flows:
    - {from: daily-plan, to: app-server, label: EBS snapshot, step: 1}
    - {from: daily-plan, to: app-db, label: RDS snapshot}
    - {from: daily-plan, to: app-files, label: EFS backup}
    - {from: daily-plan, to: sessions, label: DynamoDB backup}
    - {from: daily-plan, to: primary-vault, label: recovery points, step: 2}
    - {from: primary-vault, to: recovery-vault, label: cross-Region copy job, step: 3}
    - {from: disaster-detected, to: recovery-orchestrator, label: CloudWatch alarm / AWS Health event, step: 4}
    - {from: recovery-orchestrator, to: workload-stack, label: deploy IaC, step: 5}
    - {from: workload-stack, to: golden-ami, label: launch from pre-baked AMI}
    - {from: workload-stack, to: restored-app-server, step: 6}
    - {from: recovery-vault, to: restored-db, label: restore recovery point, step: 7}
    - {from: recovery-vault, to: restored-app-server, label: attach restored EBS volume}
    - {from: users, to: restored-app-server, label: traffic after DNS update, step: 8}

- slug: backup-cross-account-cross-region-vaults
  title: AWS Backup cross-account and cross-Region vault copies
  category: resilience
  tags: [aws backup, backup vault, cross-account, cross-region, organizations, ransomware]
  source: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
  description: A backup plan in the production account stores recovery points in a local vault and copies them to a vault owned by a separate backup account in the same AWS Organization, and to a vault in a second Region. The destination vault carries a resource policy allowing backup:CopyIntoBackupVault and its own KMS key, so a compromised production account cannot delete the copies.
  containers:
    - region: eu-west-1
      account: production
      label: primary
      vpcs:
        - name: prod-workload
          cidr: 10.20.0.0/16
          subnets:
            - {name: cab-app-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: cab-db-a, cidr: 10.20.10.0/24, az: a, public: false}
    - region: eu-central-1
      account: backup
      label: secondary
  elements:
    - {tf: aws_instance, name: erp-server, in: subnet:cab-app-a}
    - {tf: aws_db_instance, name: erp-db, in: subnet:cab-db-a}
    - {tf: aws_efs_file_system, name: erp-files, in: vpc:prod-workload}
    - {tf: aws_backup_plan, name: prod-backup-plan, in: region:eu-west-1}
    - {tf: aws_backup_vault, name: prod-vault, in: region:eu-west-1}
    - {tf: aws_kms_key, name: prod-backup-key, in: region:eu-west-1}
    - {tf: aws_backup_vault, name: central-vault, in: region:eu-central-1}
    - {tf: aws_kms_key, name: central-vault-key, in: region:eu-central-1}
    - {tf: aws_sns_topic, name: copy-job-events, in: region:eu-central-1}
  actors: []
  flows:
    - {from: prod-backup-plan, to: erp-server, label: EC2 backup selection, step: 1}
    - {from: prod-backup-plan, to: erp-db, label: RDS backup selection}
    - {from: prod-backup-plan, to: erp-files, label: EFS backup selection}
    - {from: prod-backup-plan, to: prod-vault, label: recovery points, step: 2}
    - {from: prod-backup-key, to: prod-vault, label: encrypts source vault}
    - {from: prod-vault, to: central-vault, label: copy job to external vault ARN (cross-account + cross-Region), step: 3}
    - {from: central-vault-key, to: central-vault, label: re-encrypts copies}
    - {from: central-vault, to: copy-job-events, label: copy job completed / failed, step: 4}

- slug: dr-pilot-light
  title: Pilot light disaster recovery across two Regions
  category: resilience
  tags: [disaster recovery, pilot light, aurora global database, s3 replication, route 53, application recovery controller]
  source: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  description: Data stores are always on in the recovery Region through Aurora Global Database and S3 Cross-Region Replication, while the application tier is deployed from the same CloudFormation template with its Auto Scaling group at zero capacity. On failover the secondary Aurora cluster is promoted, the group is scaled out and Route 53 traffic is switched using a health check or an ARC routing control.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: pl-primary
          cidr: 10.0.0.0/16
          subnets:
            - {name: pl-p-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: pl-p-public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: pl-p-db-a, cidr: 10.0.10.0/24, az: a, public: false}
    - region: us-west-2
      label: secondary
      vpcs:
        - name: pl-secondary
          cidr: 10.1.0.0/16
          subnets:
            - {name: pl-s-public-a, cidr: 10.1.0.0/24, az: a, public: true}
            - {name: pl-s-public-b, cidr: 10.1.1.0/24, az: b, public: true}
            - {name: pl-s-db-a, cidr: 10.1.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: app-zone, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: primary-check, in: region:us-east-1}
    - {tf: aws_lb, name: primary-alb, in: vpc:pl-primary}
    - {tf: aws_autoscaling_group, name: primary-asg, in: vpc:pl-primary}
    - {tf: aws_rds_global_cluster, name: orders-global, in: region:us-east-1}
    - {tf: aws_rds_cluster, name: orders-primary, in: subnet:pl-p-db-a}
    - {tf: aws_s3_bucket, name: media-primary, in: region:us-east-1}
    - {tf: aws_cloudformation_stack, name: standby-stack, in: region:us-west-2}
    - {tf: aws_lb, name: standby-alb, in: vpc:pl-secondary}
    - {tf: aws_autoscaling_group, name: standby-asg, in: vpc:pl-secondary}
    - {tf: aws_rds_cluster, name: orders-secondary, in: subnet:pl-s-db-a}
    - {tf: aws_s3_bucket, name: media-secondary, in: region:us-west-2}
  actors: [users]
  flows:
    - {from: users, to: app-zone, label: DNS, step: 1}
    - {from: app-zone, to: primary-alb, label: PRIMARY failover record, step: 2}
    - {from: primary-check, to: primary-alb, label: HTTPS health check}
    - {from: primary-alb, to: primary-asg, step: 3}
    - {from: primary-asg, to: orders-primary, label: read/write, step: 4}
    - {from: primary-asg, to: media-primary, label: objects}
    - {from: orders-global, to: orders-primary, label: primary cluster}
    - {from: orders-global, to: orders-secondary, label: secondary cluster (read-only)}
    - {from: orders-primary, to: orders-secondary, label: storage-level replication, typically < 1 s}
    - {from: media-primary, to: media-secondary, label: S3 Cross-Region Replication}
    - {from: standby-stack, to: standby-asg, label: deployed with desired capacity 0}
    - {from: standby-stack, to: standby-alb, label: core infrastructure pre-created}
    - {from: app-zone, to: standby-alb, label: SECONDARY record, used after failover}
    - {from: standby-alb, to: standby-asg, label: scale out on failover}
    - {from: standby-asg, to: orders-secondary, label: read/write after promotion}

- slug: dr-warm-standby
  title: Warm standby with a scaled-down stack in the recovery Region
  category: resilience
  tags: [disaster recovery, warm standby, auto scaling, dynamodb global tables, rds read replica, route 53]
  source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-iii-pilot-light-and-warm-standby/
  description: A fully functional copy of the workload runs in the recovery Region with one instance per tier behind its own load balancer, continuously serving test traffic. DynamoDB global tables and a cross-Region RDS read replica keep data current; on failover Route 53 redirects users and the Auto Scaling group is raised to production capacity.
  containers:
    - region: eu-west-1
      label: primary
      vpcs:
        - name: ws-primary
          cidr: 10.30.0.0/16
          subnets:
            - {name: ws-p-public-a, cidr: 10.30.0.0/24, az: a, public: true}
            - {name: ws-p-public-b, cidr: 10.30.1.0/24, az: b, public: true}
            - {name: ws-p-db-a, cidr: 10.30.10.0/24, az: a, public: false}
    - region: eu-central-1
      label: secondary
      vpcs:
        - name: ws-standby
          cidr: 10.31.0.0/16
          subnets:
            - {name: ws-s-public-a, cidr: 10.31.0.0/24, az: a, public: true}
            - {name: ws-s-public-b, cidr: 10.31.1.0/24, az: b, public: true}
            - {name: ws-s-db-a, cidr: 10.31.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: shop-zone, in: region:eu-west-1}
    - {tf: aws_route53_health_check, name: shop-primary-check, in: region:eu-west-1}
    - {tf: aws_lb, name: shop-primary-alb, in: vpc:ws-primary}
    - {tf: aws_autoscaling_group, name: shop-primary-asg, in: vpc:ws-primary}
    - {tf: aws_db_instance, name: catalog-primary, in: subnet:ws-p-db-a}
    - {tf: aws_dynamodb_table, name: cart-eu-west-1, in: region:eu-west-1}
    - {tf: aws_lb, name: shop-standby-alb, in: vpc:ws-standby}
    - {tf: aws_autoscaling_group, name: shop-standby-asg, in: vpc:ws-standby}
    - {tf: aws_db_instance, name: catalog-replica, in: subnet:ws-s-db-a}
    - {tf: aws_dynamodb_table, name: cart-eu-central-1, in: region:eu-central-1}
    - {tf: aws_cloudwatch_event_rule, name: failover-trigger, in: region:eu-central-1}
    - {tf: aws_lambda_function, name: scale-up-standby, in: region:eu-central-1}
  actors: [users]
  flows:
    - {from: users, to: shop-zone, label: DNS, step: 1}
    - {from: shop-zone, to: shop-primary-alb, label: PRIMARY record, step: 2}
    - {from: shop-primary-check, to: shop-primary-alb, label: health check}
    - {from: shop-primary-alb, to: shop-primary-asg, step: 3}
    - {from: shop-primary-asg, to: catalog-primary, label: read/write}
    - {from: shop-primary-asg, to: cart-eu-west-1, label: read/write}
    - {from: catalog-primary, to: catalog-replica, label: cross-Region read replica (async)}
    - {from: cart-eu-west-1, to: cart-eu-central-1, label: global table replication}
    - {from: shop-zone, to: shop-standby-alb, label: SECONDARY record}
    - {from: shop-standby-alb, to: shop-standby-asg, label: one instance per tier, serves test traffic}
    - {from: shop-standby-asg, to: catalog-replica, label: reads; writes after promotion}
    - {from: shop-standby-asg, to: cart-eu-central-1, label: read/write}
    - {from: failover-trigger, to: scale-up-standby, label: health check alarm}
    - {from: scale-up-standby, to: shop-standby-asg, label: raise desired capacity}
    - {from: scale-up-standby, to: catalog-replica, label: promote read replica}

- slug: dr-multi-site-active-active
  title: Multi-site active/active across two Regions
  category: resilience
  tags: [disaster recovery, active-active, multi-region, route 53 latency, dynamodb global tables, aurora write forwarding, elasticache global datastore]
  source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-iv-multi-site-active-active/
  description: Both Regions serve production traffic, with Route 53 latency-based records backed by health checks sending each user to the nearest healthy stack. Reads are local everywhere; DynamoDB global tables accept writes in both Regions (write-local), Aurora Global Database with write forwarding keeps a single write Region for relational data (write-global), and an ElastiCache Global Datastore replicates session state.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: aa-east
          cidr: 10.40.0.0/16
          subnets:
            - {name: aa-e-public-a, cidr: 10.40.0.0/24, az: a, public: true}
            - {name: aa-e-public-b, cidr: 10.40.1.0/24, az: b, public: true}
            - {name: aa-e-data-a, cidr: 10.40.10.0/24, az: a, public: false}
    - region: eu-west-1
      label: secondary
      vpcs:
        - name: aa-west
          cidr: 10.41.0.0/16
          subnets:
            - {name: aa-w-public-a, cidr: 10.41.0.0/24, az: a, public: true}
            - {name: aa-w-public-b, cidr: 10.41.1.0/24, az: b, public: true}
            - {name: aa-w-data-a, cidr: 10.41.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: global-zone, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: east-check, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: west-check, in: region:us-east-1}
    - {tf: aws_lb, name: east-alb, in: vpc:aa-east}
    - {tf: aws_ecs_cluster, name: east-ecs, in: vpc:aa-east}
    - {tf: aws_dynamodb_table, name: profiles-us-east-1, in: region:us-east-1}
    - {tf: aws_rds_global_cluster, name: ledger-global, in: region:us-east-1}
    - {tf: aws_rds_cluster, name: ledger-east, in: subnet:aa-e-data-a}
    - {tf: aws_elasticache_global_replication_group, name: sessions-global, in: region:us-east-1}
    - {tf: aws_elasticache_replication_group, name: sessions-east, in: subnet:aa-e-data-a}
    - {tf: aws_lb, name: west-alb, in: vpc:aa-west}
    - {tf: aws_ecs_cluster, name: west-ecs, in: vpc:aa-west}
    - {tf: aws_dynamodb_table, name: profiles-eu-west-1, in: region:eu-west-1}
    - {tf: aws_rds_cluster, name: ledger-west, in: subnet:aa-w-data-a}
  actors: [users]
  flows:
    - {from: users, to: global-zone, label: DNS, step: 1}
    - {from: global-zone, to: east-alb, label: latency record us-east-1, step: 2}
    - {from: global-zone, to: west-alb, label: latency record eu-west-1}
    - {from: east-check, to: east-alb, label: health check}
    - {from: west-check, to: west-alb, label: health check}
    - {from: east-alb, to: east-ecs, step: 3}
    - {from: west-alb, to: west-ecs}
    - {from: east-ecs, to: profiles-us-east-1, label: read-local / write-local, step: 4}
    - {from: west-ecs, to: profiles-eu-west-1, label: read-local / write-local}
    - {from: profiles-us-east-1, to: profiles-eu-west-1, label: global table replication, last writer wins}
    - {from: ledger-global, to: ledger-east, label: primary (write) cluster}
    - {from: ledger-global, to: ledger-west, label: secondary cluster}
    - {from: east-ecs, to: ledger-east, label: read/write}
    - {from: west-ecs, to: ledger-west, label: read-local; writes forwarded to primary}
    - {from: ledger-east, to: ledger-west, label: storage replication < 1 s}
    - {from: sessions-global, to: sessions-east, label: primary cluster}
    - {from: east-ecs, to: sessions-east, label: session reads/writes}

- slug: arc-routing-control-regional-failover
  title: Regional failover with Application Recovery Controller routing controls
  category: resilience
  tags: [application recovery controller, routing control, safety rule, readiness check, route 53, data plane failover]
  source: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html
  description: An ARC cluster exposes a highly available data-plane API in five Regions; routing controls on its control panel act as on/off switches bound to Route 53 health checks that front the failover records for each Regional replica. A safety rule asserts that at least one control is always on, and a readiness check monitors quotas and capacity of the standby replica so failover can be scripted without depending on Regional control planes.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: arc-primary
          cidr: 10.50.0.0/16
          subnets:
            - {name: arc-p-public-a, cidr: 10.50.0.0/24, az: a, public: true}
            - {name: arc-p-public-b, cidr: 10.50.1.0/24, az: b, public: true}
    - region: us-west-2
      label: secondary
      vpcs:
        - name: arc-secondary
          cidr: 10.51.0.0/16
          subnets:
            - {name: arc-s-public-a, cidr: 10.51.0.0/24, az: a, public: true}
            - {name: arc-s-public-b, cidr: 10.51.1.0/24, az: b, public: true}
  elements:
    - {tf: aws_route53recoverycontrolconfig_cluster, name: arc-cluster, in: region:us-east-1}
    - {tf: aws_route53recoverycontrolconfig_control_panel, name: payments-panel, in: region:us-east-1}
    - {tf: aws_route53recoverycontrolconfig_routing_control, name: east-on, in: region:us-east-1}
    - {tf: aws_route53recoverycontrolconfig_routing_control, name: west-on, in: region:us-east-1}
    - {tf: aws_route53recoverycontrolconfig_safety_rule, name: at-least-one-on, in: region:us-east-1}
    - {tf: aws_route53recoveryreadiness_recovery_group, name: payments-readiness, in: region:us-east-1}
    - {tf: aws_route53_zone, name: payments-zone, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: east-routing-check, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: west-routing-check, in: region:us-east-1}
    - {tf: aws_lb, name: payments-east-alb, in: vpc:arc-primary}
    - {tf: aws_autoscaling_group, name: payments-east-asg, in: vpc:arc-primary}
    - {tf: aws_lb, name: payments-west-alb, in: vpc:arc-secondary}
    - {tf: aws_autoscaling_group, name: payments-west-asg, in: vpc:arc-secondary}
  actors: [users]
  flows:
    - {from: arc-cluster, to: payments-panel, label: hosts control panel}
    - {from: payments-panel, to: east-on, label: routing control (ON)}
    - {from: payments-panel, to: west-on, label: routing control (OFF)}
    - {from: at-least-one-on, to: payments-panel, label: assertion rule}
    - {from: east-on, to: east-routing-check, label: routing control health check, step: 1}
    - {from: west-on, to: west-routing-check, label: routing control health check}
    - {from: east-routing-check, to: payments-zone, label: gates PRIMARY failover record, step: 2}
    - {from: west-routing-check, to: payments-zone, label: gates SECONDARY failover record}
    - {from: users, to: payments-zone, label: DNS, step: 3}
    - {from: payments-zone, to: payments-east-alb, label: active replica, step: 4}
    - {from: payments-zone, to: payments-west-alb, label: standby replica}
    - {from: payments-east-alb, to: payments-east-asg, step: 5}
    - {from: payments-west-alb, to: payments-west-asg}
    - {from: payments-readiness, to: payments-west-asg, label: readiness check on quotas and capacity}
    - {from: payments-readiness, to: payments-east-asg, label: readiness check}

- slug: arc-zonal-shift-multi-az
  title: Zonal shift away from an impaired Availability Zone
  category: resilience
  tags: [application recovery controller, zonal shift, zonal autoshift, multi-az, load balancer, availability zone impairment]
  source: https://docs.aws.amazon.com/r53recovery/latest/dg/arc-zonal-shift.html
  description: A load balancer and Auto Scaling group are pre-scaled across three Availability Zones with a Multi-AZ database behind them. When one zone is impaired, an ARC zonal shift (manual or autoshift) temporarily stops the load balancer from sending traffic to that zone for up to three days, without changing the application deployment.
  containers:
    - region: eu-west-1
      vpcs:
        - name: zs-app
          cidr: 10.60.0.0/16
          subnets:
            - {name: zs-public-a, cidr: 10.60.0.0/24, az: a, public: true}
            - {name: zs-public-b, cidr: 10.60.1.0/24, az: b, public: true}
            - {name: zs-public-c, cidr: 10.60.2.0/24, az: c, public: true}
            - {name: zs-app-a, cidr: 10.60.10.0/24, az: a, public: false}
            - {name: zs-app-b, cidr: 10.60.11.0/24, az: b, public: false}
            - {name: zs-app-c, cidr: 10.60.12.0/24, az: c, public: false}
            - {name: zs-db-a, cidr: 10.60.20.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: api-zone, in: region}
    - {tf: aws_lb, name: api-alb, in: vpc:zs-app}
    - {tf: aws_autoscaling_group, name: api-asg, in: vpc:zs-app}
    - {tf: aws_instance, name: api-az-a, in: subnet:zs-app-a}
    - {tf: aws_instance, name: api-az-b, in: subnet:zs-app-b}
    - {tf: aws_instance, name: api-az-c, in: subnet:zs-app-c}
    - {tf: aws_db_instance, name: api-db-multi-az, in: subnet:zs-db-a}
    - {tf: aws_cloudwatch_metric_alarm, name: az-a-error-rate, in: region}
  actors: [users]
  flows:
    - {from: users, to: api-zone, label: DNS, step: 1}
    - {from: api-zone, to: api-alb, step: 2}
    - {from: api-alb, to: api-az-a, label: shifted away during zonal shift}
    - {from: api-alb, to: api-az-b, label: healthy AZ, step: 3}
    - {from: api-alb, to: api-az-c, label: healthy AZ}
    - {from: api-asg, to: api-az-a, label: pre-scaled capacity per AZ}
    - {from: api-asg, to: api-az-b}
    - {from: api-asg, to: api-az-c}
    - {from: api-az-b, to: api-db-multi-az, label: synchronous standby in another AZ, step: 4}
    - {from: az-a-error-rate, to: api-alb, label: per-AZ alarm triggers operator or autoshift}

- slug: dynamodb-global-tables-serverless-multi-region
  title: Serverless API in two Regions on DynamoDB global tables
  category: resilience
  tags: [dynamodb global tables, multi-region, serverless, api gateway, lambda, route 53 latency, multi-active]
  source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
  description: Identical API Gateway and Lambda stacks are deployed in two Regions, each reading and writing its local DynamoDB replica of a global table. Route 53 latency records with health checks direct clients to the nearest Region and drop an unhealthy one, giving low or zero RPO with last-writer-wins reconciliation (or multi-Region strong consistency when configured).
  containers:
    - region: us-east-1
      label: primary
    - region: ap-southeast-1
      label: secondary
  elements:
    - {tf: aws_route53_zone, name: api-global-zone, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: api-east-check, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: api-sg-check, in: region:us-east-1}
    - {tf: aws_api_gateway_rest_api, name: orders-api-east, in: region:us-east-1}
    - {tf: aws_lambda_function, name: orders-fn-east, in: region:us-east-1}
    - {tf: aws_dynamodb_table, name: orders-us-east-1, in: region:us-east-1}
    - {tf: aws_api_gateway_rest_api, name: orders-api-sg, in: region:ap-southeast-1}
    - {tf: aws_lambda_function, name: orders-fn-sg, in: region:ap-southeast-1}
    - {tf: aws_dynamodb_table, name: orders-ap-southeast-1, in: region:ap-southeast-1}
  actors: [mobile]
  flows:
    - {from: mobile, to: api-global-zone, label: DNS, step: 1}
    - {from: api-global-zone, to: orders-api-east, label: latency record, step: 2}
    - {from: api-global-zone, to: orders-api-sg, label: latency record}
    - {from: api-east-check, to: orders-api-east, label: health check}
    - {from: api-sg-check, to: orders-api-sg, label: health check}
    - {from: orders-api-east, to: orders-fn-east, step: 3}
    - {from: orders-api-sg, to: orders-fn-sg}
    - {from: orders-fn-east, to: orders-us-east-1, label: local read/write, step: 4}
    - {from: orders-fn-sg, to: orders-ap-southeast-1, label: local read/write}
    - {from: orders-us-east-1, to: orders-ap-southeast-1, label: global table replication (bidirectional)}

- slug: s3-multi-region-access-point-two-way-replication
  title: S3 Multi-Region Access Point with two-way replication
  category: resilience
  tags: [s3, multi-region access point, cross-region replication, two-way replication, failover controls, global accelerator]
  source: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiRegionAccessPoints.html
  description: Applications in two Regions read and write through a single Multi-Region Access Point global endpoint, which routes over the AWS global network to the nearest bucket with an active routing status. Bidirectional Cross-Region Replication with replica modification sync keeps the two buckets in sync, and failover controls shift all S3 traffic to one Region within minutes.
  containers:
    - region: us-west-2
      label: primary
      vpcs:
        - name: mrap-west
          cidr: 10.70.0.0/16
          subnets:
            - {name: mrap-w-app-a, cidr: 10.70.1.0/24, az: a, public: false}
    - region: eu-central-1
      label: secondary
      vpcs:
        - name: mrap-eu
          cidr: 10.71.0.0/16
          subnets:
            - {name: mrap-e-app-a, cidr: 10.71.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_s3control_multi_region_access_point, name: media-mrap, in: region:us-west-2}
    - {tf: aws_s3_bucket, name: media-us-west-2, in: region:us-west-2}
    - {tf: aws_s3_bucket, name: media-eu-central-1, in: region:eu-central-1}
    - {tf: aws_ecs_cluster, name: uploader-west, in: subnet:mrap-w-app-a}
    - {tf: aws_ecs_cluster, name: uploader-eu, in: subnet:mrap-e-app-a}
    - {tf: aws_cloudfront_distribution, name: media-cdn, in: region:us-west-2}
  actors: [users]
  flows:
    - {from: uploader-west, to: media-mrap, label: PUT/GET via global endpoint, step: 1}
    - {from: uploader-eu, to: media-mrap, label: PUT/GET via global endpoint}
    - {from: media-mrap, to: media-us-west-2, label: routed to closest active bucket, step: 2}
    - {from: media-mrap, to: media-eu-central-1, label: routed to closest active bucket}
    - {from: media-us-west-2, to: media-eu-central-1, label: two-way CRR with replica modification sync, step: 3}
    - {from: users, to: media-cdn, label: HTTPS, step: 4}
    - {from: media-cdn, to: media-mrap, label: origin}

- slug: elastic-disaster-recovery-onprem-to-aws
  title: Elastic Disaster Recovery from on-premises servers into AWS
  category: resilience
  tags: [elastic disaster recovery, drs, block-level replication, staging area, pilot light, failback]
  source: https://docs.aws.amazon.com/drs/latest/userguide/what-is-drs.html
  description: The AWS Replication Agent on each source server streams block-level changes over TCP 1500 to lightweight replication servers in a staging area subnet, where data lands on low-cost EBS volumes. For drills or recovery, DRS converts the servers to boot natively and launches full-size recovery instances in the recovery subnets from the launch template; after the incident, replication reverses for failback.
  containers:
    - datacenter: on-premises
    - region: eu-west-1
      vpcs:
        - name: drs-recovery
          cidr: 10.80.0.0/16
          subnets:
            - {name: drs-staging-a, cidr: 10.80.100.0/24, az: a, public: false}
            - {name: drs-public-a, cidr: 10.80.0.0/24, az: a, public: true}
            - {name: drs-recovery-a, cidr: 10.80.10.0/24, az: a, public: false}
            - {name: drs-recovery-b, cidr: 10.80.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: dc-router, in: datacenter}
    - {tf: aws_drs_replication_configuration_template, name: replication-settings, in: region}
    - {tf: aws_instance, name: replication-server, in: subnet:drs-staging-a}
    - {tf: aws_vpc_endpoint, name: s3-gateway-endpoint, in: vpc:drs-recovery}
    - {tf: aws_launch_template, name: recovery-launch-template, in: region}
    - {tf: aws_instance, name: recovered-app-1, in: subnet:drs-recovery-a}
    - {tf: aws_instance, name: recovered-app-2, in: subnet:drs-recovery-b}
    - {tf: aws_instance, name: recovered-db, in: subnet:drs-recovery-a}
    - {tf: aws_lb, name: recovery-alb, in: subnet:drs-public-a}
    - {tf: aws_route53_zone, name: app-dns, in: region}
  actors: [server, database, users]
  flows:
    - {from: server, to: replication-server, label: agent replication over TCP 1500 (TLS), step: 1}
    - {from: database, to: replication-server, label: block-level replication}
    - {from: dc-router, to: vpc:drs-recovery, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: replication-settings, to: replication-server, label: staging subnet, instance type, EBS settings}
    - {from: replication-server, to: s3-gateway-endpoint, label: software download over TCP 443, step: 2}
    - {from: recovery-launch-template, to: recovered-app-1, label: drill or recovery launch, step: 3}
    - {from: recovery-launch-template, to: recovered-app-2}
    - {from: recovery-launch-template, to: recovered-db}
    - {from: replication-server, to: recovered-app-1, label: point-in-time snapshot volumes}
    - {from: replication-server, to: recovered-db}
    - {from: users, to: app-dns, label: DNS after failover, step: 4}
    - {from: app-dns, to: recovery-alb, step: 5}
    - {from: recovery-alb, to: recovered-app-1, step: 6}
    - {from: recovery-alb, to: recovered-app-2}
    - {from: recovered-app-1, to: recovered-db}
    - {from: recovered-db, to: database, label: failback replication when site restored}

- slug: multi-az-three-tier-rel10
  title: Multi-AZ three-tier workload (REL10-BP01)
  category: resilience
  tags: [well-architected, reliability, multi-az, auto scaling, rds multi-az, load balancer]
  source: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_fault_isolation_multiaz_region_system.html
  description: Web and application tiers run in Auto Scaling groups spread over three Availability Zones behind an Application Load Balancer, while RDS Multi-AZ keeps a synchronous standby in a second zone and S3 and DynamoDB are Multi-AZ by design. Loss of any one zone leaves capacity and data intact and the load balancer stops routing to unreachable targets.
  containers:
    - region: us-east-1
      vpcs:
        - name: three-tier
