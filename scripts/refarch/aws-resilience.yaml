      vpcs:
        - name: sgw-cloud
          cidr: 10.170.0.0/16
          subnets:
            - {name: sgw-private-a, cidr: 10.170.1.0/24, az: a, public: false}
    - region: us-west-2
      label: secondary
  elements:
    - {tf: aws_storagegateway_gateway, name: file-gateway-vm, in: datacenter}
    - {tf: aws_customer_gateway, name: sgw-dc-router, in: datacenter}
    - {tf: aws_storagegateway_nfs_file_share, name: engineering-nfs, in: region:us-east-1}
    - {tf: aws_storagegateway_smb_file_share, name: finance-smb, in: region:us-east-1}
    - {tf: aws_s3_bucket, name: engineering-files, in: region:us-east-1}
    - {tf: aws_s3_bucket, name: finance-files, in: region:us-east-1}
    - {tf: aws_vpc_endpoint, name: storagegateway-endpoint, in: subnet:sgw-private-a}
    - {tf: aws_instance, name: analytics-worker, in: subnet:sgw-private-a}
    - {tf: aws_s3_bucket, name: files-dr-copy, in: region:us-west-2}
  actors: [users]
  flows:
    - {from: users, to: file-gateway-vm, label: NFS v3/v4.1 and SMB mounts, step: 1}
    - {from: file-gateway-vm, to: engineering-nfs, label: file share}
    - {from: file-gateway-vm, to: finance-smb, label: file share}
    - {from: sgw-dc-router, to: vpc:sgw-cloud, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: file-gateway-vm, to: storagegateway-endpoint, label: gateway traffic over private VPC endpoint, step: 2}
    - {from: engineering-nfs, to: engineering-files, label: files stored as objects, step: 3}
    - {from: finance-smb, to: finance-files, label: files stored as objects}
    - {from: analytics-worker, to: engineering-files, label: direct S3 access from the cloud, step: 4}
    - {from: engineering-files, to: files-dr-copy, label: Cross-Region Replication}
    - {from: finance-files, to: files-dr-copy, label: Cross-Region Replication}

- slug: transfer-family-sftp-s3
  title: Managed SFTP with Transfer Family into S3
  category: migration
  tags: [transfer family, sftp, managed file transfer, s3, custom identity provider, managed workflows]
  source: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
  description: A Transfer Family SFTP server endpoint replaces the on-premises file transfer host so partners keep their existing clients, hostnames and credentials. A Lambda-backed custom identity provider authenticates users against the corporate directory, files land in an S3 bucket, and a managed workflow copies, tags and decrypts each upload before downstream processing.
