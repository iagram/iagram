            - {name: sql-app-b, cidr: 10.150.2.0/24, az: b, public: false}
            - {name: sql-db-a, cidr: 10.150.10.0/24, az: a, public: false}
            - {name: sql-db-b, cidr: 10.150.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: sql-dc-router, in: datacenter}
    - {tf: aws_s3_bucket, name: sql-backup-bucket, in: region}
    - {tf: aws_kms_key, name: sql-backup-key, in: region}
    - {tf: aws_db_instance, name: rds-sqlserver-multi-az, in: subnet:sql-db-a}
    - {tf: aws_directory_service_directory, name: managed-ad, in: vpc:sql-target}
    - {tf: aws_dms_replication_instance, name: sql-cdc-repl, in: subnet:sql-app-a}
    - {tf: aws_dms_endpoint, name: sql-onprem-source, in: region}
    - {tf: aws_dms_endpoint, name: rds-sql-target, in: region}
    - {tf: aws_dms_replication_task, name: sql-cdc-only, in: region}
    - {tf: aws_instance, name: windows-app-1, in: subnet:sql-app-a}
    - {tf: aws_instance, name: windows-app-2, in: subnet:sql-app-b}
    - {tf: aws_lb, name: windows-app-alb, in: vpc:sql-target}
  actors: [database, users]
  flows:
    - {from: sql-dc-router, to: vpc:sql-target, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: database, to: sql-backup-bucket, label: .bak full + differential upload, step: 1}
    - {from: sql-backup-key, to: sql-backup-bucket, label: SSE-KMS}
    - {from: sql-backup-bucket, to: rds-sqlserver-multi-az, label: rds_restore_database (native restore), step: 2}
    - {from: sql-onprem-source, to: database, label: source endpoint}
    - {from: rds-sql-target, to: rds-sqlserver-multi-az, label: target endpoint}
    - {from: sql-cdc-only, to: sql-cdc-repl, label: CDC-only task from backup LSN, step: 3}
