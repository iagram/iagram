    - {from: web-alb, to: web-c}
    - {from: web-asg, to: web-a, label: Auto Scaling group spans 3 AZs}
    - {from: web-asg, to: web-b}
    - {from: web-asg, to: web-c}
    - {from: web-a, to: orders-db-primary, label: read/write, step: 3}
    - {from: orders-db-primary, to: orders-db-standby, label: synchronous Multi-AZ standby, automatic failover}
    - {from: web-a, to: session-table, label: Multi-AZ by default}
    - {from: web-a, to: static-assets, label: Multi-AZ by default}
