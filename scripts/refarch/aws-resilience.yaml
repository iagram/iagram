    - {tf: aws_secretsmanager_secret, name: partner-credentials, in: region}
    - {tf: aws_transfer_workflow, name: post-upload-workflow, in: region}
    - {tf: aws_s3_bucket, name: inbound-files, in: region}
    - {tf: aws_lambda_function, name: file-processor, in: region}
    - {tf: aws_sqs_queue, name: processing-queue, in: region}
  actors: [saas, users]
  flows:
    - {from: saas, to: sftp-zone, label: sftp.example.com, step: 1}
    - {from: sftp-zone, to: partner-sftp, label: CNAME to server endpoint, step: 2}
    - {from: partner-sftp, to: custom-idp, label: authenticate user, step: 3}
    - {from: custom-idp, to: partner-credentials, label: lookup password / SSH key}
    - {from: partner-sftp, to: inbound-files, label: upload written to S3, step: 4}
    - {from: partner-sftp, to: post-upload-workflow, label: on upload complete, step: 5}
    - {from: post-upload-workflow, to: inbound-files, label: copy, tag, decrypt}
    - {from: post-upload-workflow, to: file-processor, label: custom step}
    - {from: file-processor, to: processing-queue, step: 6}
    - {from: users, to: inbound-files, label: internal consumers}

- slug: evs-vmware-cloud-foundation-migration
