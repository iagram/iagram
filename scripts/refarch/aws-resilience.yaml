          at: [1, 1]
          subnets:
            - {name: ss-app-a, cidr: 10.100.10.0/24, az: a, public: false, at: [1, 1]}
            - {name: ss-app-b, cidr: 10.100.11.0/24, az: b, public: false, at: [1, 1]}
            - {name: ss-app-c, cidr: 10.100.12.0/24, az: c, public: false, at: [1, 1]}
  elements:
    - {tf: aws_lb, name: fleet-alb, in: vpc:ss-fleet, at: [1, 1, 1, 3]}
    - {tf: aws_autoscaling_group, name: fleet-asg-150pct, in: vpc:ss-fleet, at: [2, 1, 1, 3]}
    - {tf: aws_instance, name: fleet-a, in: subnet:ss-app-a, at: [1, 1]}
    - {tf: aws_instance, name: fleet-b, in: subnet:ss-app-b, at: [1, 1]}
    - {tf: aws_instance, name: fleet-c, in: subnet:ss-app-c, at: [1, 1]}
  actors: [users]
  flows:
    - {from: users, to: fleet-alb, label: HTTPS, step: 1}
    - {from: fleet-alb, to: fleet-a, label: zone-local target, step: 2}
    - {from: fleet-alb, to: fleet-b, label: zone-local target}
    - {from: fleet-alb, to: fleet-c, label: zone-local target}
    - {from: fleet-asg-150pct, to: fleet-a, label: 50% headroom per AZ, no launch needed on AZ loss}
    - {from: fleet-asg-150pct, to: fleet-b}
    - {from: fleet-asg-150pct, to: fleet-c}

- slug: fis-chaos-experiment-az-impairment
  title: Chaos engineering with Fault Injection Service simulating an AZ impairment
  category: resilience
  tags: [fault injection service, chaos engineering, experiment template, stop condition, availability zone, cloudwatch alarm]
  source: https://docs.aws.amazon.com/fis/latest/userguide/what-is.html
  description: Two FIS experiment templates each define targets, actions and stop conditions. Template A targets specific EC2 instances with two actions (stop instances, disrupt network connectivity in one Availability Zone) and stops on a single CloudWatch alarm; template B targets EC2 instances selected by tag with three actions and stops when either of two CloudWatch alarms fires, rolling the experiment back automatically.
  containers:
    - region: eu-west-1
      vpcs:
        - name: fis-target
          cidr: 10.110.0.0/16
          at: [1, 1, 1, 3]
          subnets:
            - {name: fis-app-a, cidr: 10.110.10.0/24, az: a, public: false, at: [1, 1]}
            - {name: fis-app-b, cidr: 10.110.11.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_instance, name: target-az-a-1, in: subnet:fis-app-a, at: [1, 1]}
    - {tf: aws_instance, name: target-az-a-2, in: subnet:fis-app-a, at: [1, 2]}
    - {tf: aws_instance, name: tagged-target-az-b, in: subnet:fis-app-b, at: [1, 1]}
    - {tf: aws_fis_experiment_template, name: experiment-template-a, in: region, at: [2, 1]}
    - {tf: aws_fis_experiment_template, name: experiment-template-b, in: region, at: [2, 2, 1, 2]}
    - {tf: aws_cloudwatch_metric_alarm, name: template-a-stop-alarm, in: region, at: [3, 1]}
    - {tf: aws_cloudwatch_metric_alarm, name: template-b-error-rate-alarm, in: region, at: [3, 2]}
    - {tf: aws_cloudwatch_metric_alarm, name: template-b-latency-alarm, in: region, at: [3, 3]}
  flows:
    - {from: experiment-template-a, to: target-az-a-1, label: 'action 1: aws:ec2:stop-instances (specific instances)', step: 1}
    - {from: experiment-template-a, to: target-az-a-2, label: 'action 2: aws:network:disrupt-connectivity (AZ a)'}
    - {from: template-a-stop-alarm, to: experiment-template-a, label: stop condition, step: 2}
    - {from: experiment-template-b, to: tagged-target-az-b, label: 'action 1: aws:ec2:stop-instances (by tag)', step: 3}
    - {from: experiment-template-b, to: tagged-target-az-b, label: 'action 2: aws:ssm:send-command (CPU stress)'}
    - {from: experiment-template-b, to: vpc:fis-target, label: 'action 3: aws:network:disrupt-connectivity (AZ b)'}
    - {from: template-b-error-rate-alarm, to: experiment-template-b, label: stop condition, step: 4}
    - {from: template-b-latency-alarm, to: experiment-template-b, label: stop condition}

- slug: cell-based-architecture
  title: Cell-based architecture with a thin cell router
  category: resilience
  tags: [cell-based architecture, bulkhead, fault isolation, shuffle sharding, cell router, scope of impact]
  source: https://docs.aws.amazon.com/wellarchitected/latest/reducing-scope-of-impact-with-cell-based-architecture/reducing-scope-of-impact-with-cell-based-architecture.html
  description: The workload is deployed as independent, identically sized cells, each with its own load balancer, compute and database so a failure is contained to the customers mapped to that cell. A thin, highly available cell router looks up the partition key (for example tenant ID) in a mapping table and forwards the request to the owning cell; cells never call each other.
  containers:
    - region: us-east-1
      groups: [{label: cell-router}, {label: cell-1}, {label: cell-2}]
      vpcs:
        - name: cells
          cidr: 10.120.0.0/16
          subnets:
            - {name: c1-app-a, cidr: 10.120.1.0/24, az: a, public: false}
            - {name: c1-db-a, cidr: 10.120.2.0/24, az: a, public: false}
            - {name: c2-app-a, cidr: 10.120.11.0/24, az: a, public: false}
            - {name: c2-db-a, cidr: 10.120.12.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: tenant-zone, in: region}
    - {tf: aws_api_gateway_rest_api, name: router-api, in: group:cell-router}
    - {tf: aws_lambda_function, name: router-fn, in: group:cell-router}
    - {tf: aws_dynamodb_table, name: tenant-to-cell-map, in: group:cell-router}
    - {tf: aws_lb, name: cell-1-alb, in: group:cell-1}
    - {tf: aws_ecs_cluster, name: cell-1-ecs, in: subnet:c1-app-a}
    - {tf: aws_rds_cluster, name: cell-1-db, in: subnet:c1-db-a}
    - {tf: aws_sqs_queue, name: cell-1-queue, in: group:cell-1}
    - {tf: aws_lb, name: cell-2-alb, in: group:cell-2}
    - {tf: aws_ecs_cluster, name: cell-2-ecs, in: subnet:c2-app-a}
    - {tf: aws_rds_cluster, name: cell-2-db, in: subnet:c2-db-a}
    - {tf: aws_sqs_queue, name: cell-2-queue, in: group:cell-2}
  actors: [users]
  flows:
    - {from: users, to: tenant-zone, label: DNS, step: 1}
    - {from: tenant-zone, to: router-api, step: 2}
    - {from: router-api, to: router-fn, step: 3}
    - {from: router-fn, to: tenant-to-cell-map, label: lookup partition key, step: 4}
    - {from: router-fn, to: cell-1-alb, label: forward to owning cell, step: 5}
    - {from: router-fn, to: cell-2-alb, label: forward to owning cell}
    - {from: cell-1-alb, to: cell-1-ecs, step: 6}
    - {from: cell-1-ecs, to: cell-1-db, label: cell-local data}
    - {from: cell-1-ecs, to: cell-1-queue, label: cell-local async work}
    - {from: cell-2-alb, to: cell-2-ecs}
    - {from: cell-2-ecs, to: cell-2-db, label: cell-local data}
    - {from: cell-2-ecs, to: cell-2-queue, label: cell-local async work}

- slug: mgn-rehost-lift-and-shift
  title: Rehost migration with Application Migration Service (MGN)
  category: migration
  tags: [application migration service, mgn, rehost, lift and shift, block-level replication, cutover, waves]
  source: https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html
  description: MGN agents on the source servers continuously replicate disks to replication servers in a staging area subnet, and servers are grouped into applications and waves for bulk operations. Test and then cutover instances are launched from the launch template into the target subnets with cutover windows of minutes; after cutover the source servers are archived.
  containers:
    - datacenter: on-premises
    - region: eu-central-1
      vpcs:
        - name: mgn-target
          cidr: 10.130.0.0/16
          subnets:
            - {name: mgn-staging-a, cidr: 10.130.100.0/24, az: a, public: false}
            - {name: mgn-public-a, cidr: 10.130.0.0/24, az: a, public: true}
            - {name: mgn-app-a, cidr: 10.130.10.0/24, az: a, public: false}
            - {name: mgn-app-b, cidr: 10.130.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: mgn-dc-router, in: datacenter}
    - {tf: aws_dx_connection, name: mgn-dx, in: region}
    - {tf: aws_ec2_transit_gateway, name: mgn-tgw, in: region}
    - {tf: aws_vpc_endpoint, name: mgn-service-endpoint, in: vpc:mgn-target}
    - {tf: aws_instance, name: mgn-replication-server, in: subnet:mgn-staging-a}
    - {tf: aws_launch_template, name: mgn-launch-template, in: region}
    - {tf: aws_instance, name: web-cutover-1, in: subnet:mgn-app-a}
    - {tf: aws_instance, name: web-cutover-2, in: subnet:mgn-app-b}
    - {tf: aws_instance, name: db-cutover, in: subnet:mgn-app-a}
    - {tf: aws_lb, name: migrated-alb, in: subnet:mgn-public-a}
  actors: [server, database, users]
  flows:
    - {from: mgn-dc-router, to: mgn-dx, label: private connectivity, step: 1}
    - {from: mgn-dx, to: mgn-tgw, link: aws_dx_gateway_association}
    - {from: mgn-tgw, to: vpc:mgn-target, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: server, to: mgn-replication-server, label: agent block-level replication over TCP 1500, step: 2}
    - {from: database, to: mgn-replication-server, label: continuous replication}
    - {from: server, to: mgn-service-endpoint, label: agent control channel TCP 443}
    - {from: mgn-launch-template, to: web-cutover-1, label: test then cutover launch, step: 3}
    - {from: mgn-launch-template, to: web-cutover-2}
    - {from: mgn-launch-template, to: db-cutover}
    - {from: mgn-replication-server, to: web-cutover-1, label: converted boot volumes}
    - {from: mgn-replication-server, to: db-cutover}
    - {from: users, to: migrated-alb, label: traffic after DNS cutover, step: 4}
    - {from: migrated-alb, to: web-cutover-1, step: 5}
    - {from: migrated-alb, to: web-cutover-2}
    - {from: web-cutover-1, to: db-cutover}

- slug: dms-oracle-to-aurora-postgresql
  title: Oracle to Aurora PostgreSQL with AWS SCT and DMS
  category: migration
  tags: [dms, schema conversion tool, oracle, aurora postgresql, heterogeneous migration, cdc]
  source: https://docs.aws.amazon.com/dms/latest/oracle-to-aurora-postgresql-migration-playbook/chap-oracle-aurora-pg.html
  description: AWS SCT (or DMS Schema Conversion) converts the Oracle schema, PL/SQL and code objects to PostgreSQL and applies them to an Aurora PostgreSQL cluster. A DMS replication instance then runs a full-load-plus-CDC task from the on-premises Oracle source endpoint to the Aurora target endpoint over a VPN, keeping both databases in sync until the application is repointed.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      vpcs:
        - name: dms-target
          cidr: 10.140.0.0/16
          subnets:
            - {name: dms-private-a, cidr: 10.140.1.0/24, az: a, public: false}
            - {name: dms-db-a, cidr: 10.140.10.0/24, az: a, public: false}
            - {name: dms-db-b, cidr: 10.140.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: dms-dc-router, in: datacenter}
    - {tf: aws_dms_replication_instance, name: oracle-pg-repl, in: subnet:dms-private-a}
    - {tf: aws_dms_endpoint, name: oracle-source, in: region}
    - {tf: aws_dms_endpoint, name: aurora-pg-target, in: region}
    - {tf: aws_dms_replication_task, name: full-load-cdc, in: region}
    - {tf: aws_rds_cluster, name: aurora-pg, in: subnet:dms-db-a}
    - {tf: aws_rds_cluster_instance, name: aurora-pg-writer, in: subnet:dms-db-a}
    - {tf: aws_rds_cluster_instance, name: aurora-pg-reader, in: subnet:dms-db-b}
    - {tf: aws_secretsmanager_secret, name: db-credentials, in: region}
    - {tf: aws_s3_bucket, name: sct-assessment-reports, in: region}
    - {tf: aws_instance, name: app-server-pg, in: subnet:dms-private-a}
  actors: [database]
  flows:
    - {from: dms-dc-router, to: vpc:dms-target, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: database, to: sct-assessment-reports, label: SCT assessment report, step: 1}
    - {from: database, to: aurora-pg, label: converted schema applied by SCT, step: 2}
    - {from: oracle-source, to: database, label: Oracle source endpoint (LogMiner / Binary Reader)}
    - {from: aurora-pg-target, to: aurora-pg, label: PostgreSQL target endpoint}
    - {from: db-credentials, to: oracle-source, label: credentials}
    - {from: db-credentials, to: aurora-pg-target}
    - {from: full-load-cdc, to: oracle-pg-repl, label: task runs on replication instance, step: 3}
    - {from: oracle-pg-repl, to: oracle-source, label: full load then CDC reads, step: 4}
    - {from: oracle-pg-repl, to: aurora-pg-target, label: apply changes, step: 5}
    - {from: aurora-pg, to: aurora-pg-writer, label: writer}
    - {from: aurora-pg, to: aurora-pg-reader, label: reader}
    - {from: app-server-pg, to: aurora-pg-writer, label: repointed application after validation, step: 6}

- slug: sql-server-to-rds-native-backup-restore
  title: SQL Server migration to RDS for SQL Server with native backup and restore
  category: migration
  tags: [sql server, rds for sql server, native backup restore, s3, dms, active directory, windows migration]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/migration-sql-server/introduction.html
  description: Full and differential backups of the on-premises SQL Server databases are copied to an S3 bucket and restored into a Multi-AZ RDS for SQL Server instance using the native backup and restore option. DMS change data capture closes the gap between the last backup and cutover, while an AWS Managed Microsoft AD directory provides Windows authentication for the migrated application servers.
  containers:
    - datacenter: on-premises
    - region: us-west-2
      vpcs:
        - name: sql-target
          cidr: 10.150.0.0/16
          subnets:
            - {name: sql-app-a, cidr: 10.150.1.0/24, az: a, public: false}
            - {name: sql-app-b, cidr: 10.150.2.0/24, az: b, public: false}
            - {name: sql-db-a, cidr: 10.150.10.0/24, az: a, public: false}
            - {name: sql-db-b, cidr: 10.150.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: sql-dc-router, in: datacenter}
    - {tf: aws_s3_bucket, name: sql-backup-bucket, in: region}
    - {tf: aws_kms_key, name: sql-backup-key, in: region}
    - {tf: aws_db_instance, name: rds-sqlserver-multi-az, in: subnet:sql-db-a}
    - {tf: aws_directory_service_directory, name: managed-ad, in: vpc:sql-target}
    - {tf: aws_dms_replication_instance, name: sql-cdc-repl, in: subnet:sql-app-a}
    - {tf: aws_dms_endpoint, name: sql-onprem-source, in: region}
    - {tf: aws_dms_endpoint, name: rds-sql-target, in: region}
    - {tf: aws_dms_replication_task, name: sql-cdc-only, in: region}
    - {tf: aws_instance, name: windows-app-1, in: subnet:sql-app-a}
    - {tf: aws_instance, name: windows-app-2, in: subnet:sql-app-b}
    - {tf: aws_lb, name: windows-app-alb, in: vpc:sql-target}
  actors: [database, users]
  flows:
    - {from: sql-dc-router, to: vpc:sql-target, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: database, to: sql-backup-bucket, label: .bak full + differential upload, step: 1}
    - {from: sql-backup-key, to: sql-backup-bucket, label: SSE-KMS}
    - {from: sql-backup-bucket, to: rds-sqlserver-multi-az, label: rds_restore_database (native restore), step: 2}
    - {from: sql-onprem-source, to: database, label: source endpoint}
    - {from: rds-sql-target, to: rds-sqlserver-multi-az, label: target endpoint}
    - {from: sql-cdc-only, to: sql-cdc-repl, label: CDC-only task from backup LSN, step: 3}
    - {from: sql-cdc-repl, to: sql-onprem-source, label: read transaction log}
    - {from: sql-cdc-repl, to: rds-sql-target, label: apply changes until cutover}
    - {from: managed-ad, to: rds-sqlserver-multi-az, label: Windows authentication}
    - {from: managed-ad, to: windows-app-1, label: domain join}
    - {from: users, to: windows-app-alb, label: HTTPS, step: 4}
    - {from: windows-app-alb, to: windows-app-1, step: 5}
    - {from: windows-app-alb, to: windows-app-2}
    - {from: windows-app-1, to: rds-sqlserver-multi-az, label: connection string repointed at cutover, step: 6}

- slug: datasync-hybrid-file-migration
  title: DataSync migration of on-premises NFS and SMB shares to S3 and EFS
  category: migration
  tags: [datasync, nfs, smb, s3, efs, direct connect, vpc endpoint, online data transfer]
  source: https://docs.aws.amazon.com/datasync/latest/userguide/how-datasync-transfer-works.html
  description: A DataSync agent deployed as a VM next to the source file servers (on-premises or in another cloud) reads the NFS and SMB shares and transfers data over TLS to the DataSync service in the AWS Region. DataSync tasks write the files to the AWS storage services (S3 bucket, EFS file system, FSx for Windows File Server, FSx for Lustre, FSx for OpenZFS and FSx for NetApp ONTAP), verifying checksums and running on a schedule to copy only changed data until cutover.
  containers:
    - region: eu-west-1
      groups: [{label: AWS storage services, at: [1, 2]}]
  elements:
    - {tf: aws_datasync_task, name: datasync-service, in: region, at: [1, 1]}
    - {tf: aws_efs_file_system, name: efs-file-system, in: group:AWS storage services, at: [1, 1]}
    - {tf: aws_s3_bucket, name: s3-bucket, in: group:AWS storage services, at: [1, 2]}
    - {tf: aws_fsx_windows_file_system, name: fsx-windows-file-server, in: group:AWS storage services, at: [2, 1]}
    - {tf: aws_fsx_lustre_file_system, name: fsx-lustre, in: group:AWS storage services, at: [2, 2]}
    - {tf: aws_fsx_openzfs_file_system, name: fsx-openzfs, in: group:AWS storage services, at: [3, 1]}
    - {tf: aws_fsx_ontap_file_system, name: fsx-netapp-ontap, in: group:AWS storage services, at: [3, 2]}
  actors: [{type: server, name: source-file-storage, at: [1, 1]}, {type: server, name: datasync-agent, at: [1, 2]}]
  flows:
    - {from: source-file-storage, to: datasync-agent, label: NFS / SMB reads, step: 1}
    - {from: datasync-agent, to: datasync-service, label: TLS, step: 2}
    - {from: datasync-service, to: efs-file-system, label: scheduled incremental copies with verification, step: 3}
    - {from: datasync-service, to: s3-bucket}
    - {from: datasync-service, to: fsx-windows-file-server}
    - {from: datasync-service, to: fsx-lustre}
    - {from: datasync-service, to: fsx-openzfs}
    - {from: datasync-service, to: fsx-netapp-ontap}

- slug: storage-gateway-s3-file-gateway-hybrid
  title: Hybrid file storage with S3 File Gateway
  category: storage
  tags: [storage gateway, s3 file gateway, nfs, smb, hybrid storage, local cache, cross-region replication]
  source: https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html
  description: An S3 File Gateway VM in the data center exposes NFS and SMB file shares that map to S3 buckets, keeping recently used data in a local cache while objects are stored durably in S3. Cloud applications read the same objects directly, lifecycle rules tier them to colder classes, and Cross-Region Replication provides an off-site copy.
  containers:
    - datacenter: on-premises
    - region: us-east-1
