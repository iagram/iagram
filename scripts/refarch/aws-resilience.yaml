          subnets:
            - {name: tt-public-a, cidr: 10.90.0.0/24, az: a, public: true}
            - {name: tt-public-b, cidr: 10.90.1.0/24, az: b, public: true}
            - {name: tt-public-c, cidr: 10.90.2.0/24, az: c, public: true}
            - {name: tt-app-a, cidr: 10.90.10.0/24, az: a, public: false}
            - {name: tt-app-b, cidr: 10.90.11.0/24, az: b, public: false}
            - {name: tt-app-c, cidr: 10.90.12.0/24, az: c, public: false}
            - {name: tt-db-a, cidr: 10.90.20.0/24, az: a, public: false}
            - {name: tt-db-b, cidr: 10.90.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_zone, name: site-zone, in: region}
    - {tf: aws_lb, name: web-alb, in: vpc:three-tier}
    - {tf: aws_autoscaling_group, name: web-asg, in: vpc:three-tier}
    - {tf: aws_lb, name: app-internal-alb, in: vpc:three-tier}
    - {tf: aws_autoscaling_group, name: app-asg, in: vpc:three-tier}
    - {tf: aws_db_instance, name: orders-db-primary, in: subnet:tt-db-a}
    - {tf: aws_db_instance, name: orders-db-standby, in: subnet:tt-db-b}
    - {tf: aws_s3_bucket, name: static-assets, in: region}
    - {tf: aws_dynamodb_table, name: session-table, in: region}
    - {tf: aws_nat_gateway, name: nat-a, in: subnet:tt-public-a}
    - {tf: aws_nat_gateway, name: nat-b, in: subnet:tt-public-b}
    - {tf: aws_nat_gateway, name: nat-c, in: subnet:tt-public-c}
  actors: [users]
  flows:
    - {from: users, to: site-zone, label: DNS (alias, short TTL), step: 1}
    - {from: site-zone, to: web-alb, step: 2}
    - {from: web-alb, to: web-asg, label: targets in 3 AZs, step: 3}
    - {from: web-asg, to: app-internal-alb, step: 4}
    - {from: app-internal-alb, to: app-asg, label: targets in 3 AZs, step: 5}
    - {from: app-asg, to: orders-db-primary, label: read/write, step: 6}
    - {from: orders-db-primary, to: orders-db-standby, label: synchronous Multi-AZ standby, automatic failover}
    - {from: app-asg, to: session-table, label: Multi-AZ by default}
    - {from: web-asg, to: static-assets, label: Multi-AZ by default}
    - {from: app-asg, to: nat-a, label: per-AZ egress}
    - {from: app-asg, to: nat-b}
    - {from: app-asg, to: nat-c}

- slug: static-stability-overprovisioned-azs
  title: Static stability with pre-provisioned capacity across Availability Zones
  category: resilience
  tags: [static stability, builders library, availability zones, overprovisioning, control plane, data plane]
  source: https://aws.amazon.com/builders-library/static-stability-using-availability-zones/
  description: The fleet is overprovisioned so that the instances in any two of three Availability Zones can carry full load; an AZ impairment therefore requires no new launches and no dependency on EC2 or Auto Scaling control planes. Golden AMIs and launch templates are pre-baked, the database runs active-standby across zones, and cross-zone traffic is kept zone-local where possible.
  containers:
    - region: us-west-2
      vpcs:
        - name: ss-fleet
          cidr: 10.100.0.0/16
          subnets:
            - {name: ss-public-a, cidr: 10.100.0.0/24, az: a, public: true}
            - {name: ss-public-b, cidr: 10.100.1.0/24, az: b, public: true}
            - {name: ss-public-c, cidr: 10.100.2.0/24, az: c, public: true}
            - {name: ss-app-a, cidr: 10.100.10.0/24, az: a, public: false}
            - {name: ss-app-b, cidr: 10.100.11.0/24, az: b, public: false}
            - {name: ss-app-c, cidr: 10.100.12.0/24, az: c, public: false}
            - {name: ss-db-a, cidr: 10.100.20.0/24, az: a, public: false}
            - {name: ss-db-b, cidr: 10.100.21.0/24, az: b, public: false}
  elements:
    - {tf: aws_lb, name: fleet-alb, in: vpc:ss-fleet}
    - {tf: aws_autoscaling_group, name: fleet-asg-150pct, in: vpc:ss-fleet}
    - {tf: aws_launch_template, name: fleet-launch-template, in: region}
    - {tf: aws_ami, name: fleet-golden-ami, in: region}
    - {tf: aws_instance, name: fleet-a, in: subnet:ss-app-a}
    - {tf: aws_instance, name: fleet-b, in: subnet:ss-app-b}
    - {tf: aws_instance, name: fleet-c, in: subnet:ss-app-c}
    - {tf: aws_db_instance, name: state-db-active, in: subnet:ss-db-a}
    - {tf: aws_db_instance, name: state-db-standby, in: subnet:ss-db-b}
  actors: [users]
  flows:
    - {from: users, to: fleet-alb, label: HTTPS, step: 1}
    - {from: fleet-alb, to: fleet-a, label: zone-local target, step: 2}
    - {from: fleet-alb, to: fleet-b, label: zone-local target}
    - {from: fleet-alb, to: fleet-c, label: zone-local target}
    - {from: fleet-asg-150pct, to: fleet-a, label: 50% headroom per AZ, no launch needed on AZ loss}
    - {from: fleet-asg-150pct, to: fleet-b}
    - {from: fleet-asg-150pct, to: fleet-c}
    - {from: fleet-launch-template, to: fleet-golden-ami, label: pre-baked image, no build at recovery time}
    - {from: fleet-asg-150pct, to: fleet-launch-template, label: replacement only, not on the critical path}
    - {from: fleet-a, to: state-db-active, label: writes, step: 3}
    - {from: state-db-active, to: state-db-standby, label: warm standby in another AZ, DNS repoint on failover}

- slug: fis-chaos-experiment-az-impairment
  title: Chaos engineering with Fault Injection Service simulating an AZ impairment
  category: resilience
  tags: [fault injection service, chaos engineering, experiment template, stop condition, availability zone, cloudwatch alarm]
  source: https://docs.aws.amazon.com/fis/latest/userguide/what-is.html
  description: An FIS experiment template defines actions (for example stopping instances or disrupting network connectivity in one Availability Zone), targets selected by tag, and stop conditions tied to CloudWatch alarms on the application's error rate. Running the experiment against the multi-AZ stack validates that the load balancer, Auto Scaling group and Multi-AZ database recover as designed, with automatic rollback if the guardrail alarm fires.
  containers:
    - region: eu-west-1
      vpcs:
        - name: fis-target
          cidr: 10.110.0.0/16
          subnets:
            - {name: fis-public-a, cidr: 10.110.0.0/24, az: a, public: true}
            - {name: fis-public-b, cidr: 10.110.1.0/24, az: b, public: true}
            - {name: fis-app-a, cidr: 10.110.10.0/24, az: a, public: false}
            - {name: fis-app-b, cidr: 10.110.11.0/24, az: b, public: false}
            - {name: fis-db-a, cidr: 10.110.20.0/24, az: a, public: false}
  elements:
    - {tf: aws_fis_experiment_template, name: az-a-impairment, in: region}
    - {tf: aws_cloudwatch_metric_alarm, name: error-rate-guardrail, in: region}
    - {tf: aws_sns_topic, name: experiment-notifications, in: region}
    - {tf: aws_lb, name: target-alb, in: vpc:fis-target}
    - {tf: aws_autoscaling_group, name: target-asg, in: vpc:fis-target}
    - {tf: aws_instance, name: target-az-a, in: subnet:fis-app-a}
    - {tf: aws_instance, name: target-az-b, in: subnet:fis-app-b}
    - {tf: aws_db_instance, name: target-db-multi-az, in: subnet:fis-db-a}
  actors: [users]
  flows:
    - {from: az-a-impairment, to: target-az-a, label: action aws:ec2:stop-instances on tag az=a, step: 1}
    - {from: az-a-impairment, to: target-asg, label: action aws:network:disrupt-connectivity (AZ a)}
    - {from: error-rate-guardrail, to: az-a-impairment, label: stop condition, step: 2}
    - {from: az-a-impairment, to: experiment-notifications, label: experiment state changes}
    - {from: users, to: target-alb, label: synthetic load during experiment, step: 3}
    - {from: target-alb, to: target-az-b, label: traffic shifts to healthy AZ, step: 4}
    - {from: target-alb, to: target-az-a, label: unhealthy targets removed}
    - {from: target-asg, to: target-az-a, label: replaces stopped instances, step: 5}
    - {from: target-az-b, to: target-db-multi-az, label: Multi-AZ failover observed}
    - {from: target-alb, to: error-rate-guardrail, label: 5xx metric}

- slug: cell-based-architecture
  title: Cell-based architecture with a thin cell router
  category: resilience
  tags: [cell-based architecture, bulkhead, fault isolation, shuffle sharding, cell router, scope of impact]
  source: https://docs.aws.amazon.com/wellarchitected/latest/reducing-scope-of-impact-with-cell-based-architecture/reducing-scope-of-impact-with-cell-based-architecture.html
  description: The workload is deployed as independent, identically sized cells, each with its own load balancer, compute and database so a failure is contained to the customers mapped to that cell. A thin, highly available cell router looks up the partition key (for example tenant ID) in a mapping table and forwards the request to the owning cell; cells never call each other.
  containers:
    - region: us-east-1
      groups: [{label: cell-router}, {label: cell-1}, {label: cell-2}]
      vpcs:
        - name: cells
          cidr: 10.120.0.0/16
          subnets:
            - {name: c1-app-a, cidr: 10.120.1.0/24, az: a, public: false}
            - {name: c1-db-a, cidr: 10.120.2.0/24, az: a, public: false}
            - {name: c2-app-a, cidr: 10.120.11.0/24, az: a, public: false}
            - {name: c2-db-a, cidr: 10.120.12.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: tenant-zone, in: region}
    - {tf: aws_api_gateway_rest_api, name: router-api, in: group:cell-router}
    - {tf: aws_lambda_function, name: router-fn, in: group:cell-router}
    - {tf: aws_dynamodb_table, name: tenant-to-cell-map, in: group:cell-router}
    - {tf: aws_lb, name: cell-1-alb, in: group:cell-1}
    - {tf: aws_ecs_cluster, name: cell-1-ecs, in: subnet:c1-app-a}
    - {tf: aws_rds_cluster, name: cell-1-db, in: subnet:c1-db-a}
    - {tf: aws_sqs_queue, name: cell-1-queue, in: group:cell-1}
    - {tf: aws_lb, name: cell-2-alb, in: group:cell-2}
    - {tf: aws_ecs_cluster, name: cell-2-ecs, in: subnet:c2-app-a}
    - {tf: aws_rds_cluster, name: cell-2-db, in: subnet:c2-db-a}
    - {tf: aws_sqs_queue, name: cell-2-queue, in: group:cell-2}
  actors: [users]
  flows:
    - {from: users, to: tenant-zone, label: DNS, step: 1}
    - {from: tenant-zone, to: router-api, step: 2}
    - {from: router-api, to: router-fn, step: 3}
    - {from: router-fn, to: tenant-to-cell-map, label: lookup partition key, step: 4}
    - {from: router-fn, to: cell-1-alb, label: forward to owning cell, step: 5}
    - {from: router-fn, to: cell-2-alb, label: forward to owning cell}
    - {from: cell-1-alb, to: cell-1-ecs, step: 6}
    - {from: cell-1-ecs, to: cell-1-db, label: cell-local data}
    - {from: cell-1-ecs, to: cell-1-queue, label: cell-local async work}
    - {from: cell-2-alb, to: cell-2-ecs}
    - {from: cell-2-ecs, to: cell-2-db, label: cell-local data}
    - {from: cell-2-ecs, to: cell-2-queue, label: cell-local async work}

- slug: mgn-rehost-lift-and-shift
  title: Rehost migration with Application Migration Service (MGN)
  category: migration
  tags: [application migration service, mgn, rehost, lift and shift, block-level replication, cutover, waves]
  source: https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html
  description: MGN agents on the source servers continuously replicate disks to replication servers in a staging area subnet, and servers are grouped into applications and waves for bulk operations. Test and then cutover instances are launched from the launch template into the target subnets with cutover windows of minutes; after cutover the source servers are archived.
  containers:
    - datacenter: on-premises
    - region: eu-central-1
      vpcs:
        - name: mgn-target
          cidr: 10.130.0.0/16
