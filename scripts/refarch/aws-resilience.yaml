- slug: mainframe-modernization-replatform
  title: Mainframe replatform with AWS Mainframe Modernization
  category: migration
  tags: [mainframe modernization, replatform, cobol, managed runtime, rocket software, dms, aurora]
  source: https://docs.aws.amazon.com/m2/latest/userguide/what-is-m2.html
  description: COBOL and PL/I applications are recompiled largely unchanged and deployed from S3 into an AWS Mainframe Modernization managed runtime environment (Rocket Software / Micro Focus replatform pattern) fronted by a load balancer. DB2 and VSAM data is migrated with DMS into Aurora PostgreSQL, batch and application files move to EFS or FSx, and CI/CD is driven from CloudFormation.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      vpcs:
        - name: m2-vpc
          cidr: 10.200.0.0/16
          subnets:
            - {name: m2-private-a, cidr: 10.200.1.0/24, az: a, public: false}
            - {name: m2-private-b, cidr: 10.200.2.0/24, az: b, public: false}
            - {name: m2-db-a, cidr: 10.200.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_customer_gateway, name: m2-dc-router, in: datacenter}
    - {tf: aws_s3_bucket, name: application-binaries, in: region}
    - {tf: aws_m2_environment, name: cobol-runtime-env, in: vpc:m2-vpc}
    - {tf: aws_m2_application, name: cardholder-app, in: region}
    - {tf: aws_lb, name: m2-nlb, in: vpc:m2-vpc}
    - {tf: aws_rds_cluster, name: cardholder-aurora-pg, in: subnet:m2-db-a}
    - {tf: aws_efs_file_system, name: batch-files, in: vpc:m2-vpc}
    - {tf: aws_dms_replication_instance, name: db2-repl, in: subnet:m2-private-a}
    - {tf: aws_dms_replication_task, name: db2-to-aurora, in: region}
    - {tf: aws_cloudformation_stack, name: m2-cicd-stack, in: region}
  actors: [server, database, users]
  flows:
    - {from: m2-dc-router, to: vpc:m2-vpc, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: server, to: application-binaries, label: recompiled COBOL/PL-I artifacts and definitions, step: 1}
    - {from: m2-cicd-stack, to: cardholder-app, label: create / deploy application version, step: 2}
    - {from: application-binaries, to: cardholder-app, label: application definition and binaries}
    - {from: cardholder-app, to: cobol-runtime-env, label: deployed to managed runtime, step: 3}
    - {from: db2-to-aurora, to: db2-repl, label: full load + CDC task}
    - {from: db2-repl, to: database, label: read DB2 / VSAM source, step: 4}
    - {from: db2-repl, to: cardholder-aurora-pg, label: load migrated data, step: 5}
