# AWS reference architectures: resilience, disaster recovery and migration.
# Format: scripts/refarch/FORMAT.md. Sources verified 2026-09-13.

- slug: backup-restore-rapid-recovery
  title: Backup and restore with event-driven rapid recovery
  category: resilience
  tags: [disaster recovery, backup and restore, aws backup, eventbridge, cloudformation, golden ami]
  source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-ii-backup-and-restore-with-rapid-recovery/
  description: AWS Backup takes point-in-time recovery points of EBS and RDS in the primary Region and copies them to a vault in the recovery Region. On recovery, CloudFormation redeploys the EC2 infrastructure while AWS Backup restores the EBS volume; the restore-job COMPLETED event on EventBridge creates a Systems Manager OpsItem in OpsCenter for operators and invokes a Lambda function that attaches the restored volume to the new instance.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: prod-primary
          cidr: 10.0.0.0/16
          subnets:
            - {name: bp-app-a, cidr: 10.0.1.0/24, az: a, public: false}
            - {name: bp-db-a, cidr: 10.0.10.0/24, az: a, public: false}
    - region: us-west-2
      label: secondary
      vpcs:
        - name: prod-recovery
          cidr: 10.1.0.0/16
          at: [1, 2]
          subnets:
            - {name: bp-rec-app-a, cidr: 10.1.1.0/24, az: a, public: false}
            - {name: bp-rec-db-a, cidr: 10.1.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_instance, name: app-server, in: subnet:bp-app-a}
    - {tf: aws_db_instance, name: app-db, in: subnet:bp-db-a}
    - {tf: aws_backup_plan, name: daily-plan, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_backup_vault, name: primary-vault, in: region:us-east-1, at: [1, 2]}
    - {tf: aws_backup_vault, name: recovery-vault, in: region:us-west-2, at: [1, 1]}
    - {tf: aws_cloudformation_stack, name: workload-stack, in: region:us-west-2, at: [1, 3]}
    - {tf: aws_cloudwatch_event_rule, name: restore-job-completed, in: region:us-west-2, at: [2, 1]}
    - {tf: aws_lambda_function, name: reconnect-function, in: region:us-west-2, at: [2, 2]}
    - {tf: aws_ssm_document, name: systems-manager-opsitem, in: region:us-west-2, at: [3, 1]}
    - {tf: aws_ssmincidents_response_plan, name: opscenter, in: region:us-west-2, at: [3, 2]}
    - {tf: aws_ebs_volume, name: restored-volume, in: subnet:bp-rec-app-a, at: [1, 1]}
    - {tf: aws_instance, name: restored-app-server, in: subnet:bp-rec-app-a, at: [1, 2]}
    - {tf: aws_db_instance, name: restored-db, in: subnet:bp-rec-db-a}
  actors: [users, {type: users, name: operators, at: [2, 2]}]
  flows:
    - {from: daily-plan, to: app-server, label: EBS snapshot, step: 1}
    - {from: daily-plan, to: app-db, label: RDS snapshot}
    - {from: daily-plan, to: primary-vault, label: recovery points, step: 2}
    - {from: primary-vault, to: recovery-vault, label: cross-Region copy job, step: 3}
    - {from: workload-stack, to: restored-app-server, label: deploy infrastructure, step: 4A}
    - {from: recovery-vault, to: restored-volume, label: restore data from backup, step: 4B}
    - {from: recovery-vault, to: restored-db, label: restore recovery point}
    - {from: recovery-vault, to: restore-job-completed, label: restore job COMPLETED, step: 5}
    - {from: restore-job-completed, to: systems-manager-opsitem, label: create OpsItem, step: 6A}
    - {from: restore-job-completed, to: reconnect-function, label: invoke logic to reconnect, step: 6B}
    - {from: systems-manager-opsitem, to: opscenter, label: OpsItem}
    - {from: opscenter, to: operators, label: operators / developers}
    - {from: reconnect-function, to: restored-app-server, label: reconnect infrastructure to data, step: 7}
    - {from: restored-app-server, to: restored-volume, label: attach, step: 8}
    - {from: users, to: restored-app-server, label: traffic after DNS update, step: 9}

- slug: backup-cross-account-cross-region-vaults
  title: AWS Backup cross-account and cross-Region vault copies
  category: resilience
  tags: [aws backup, backup vault, cross-account, cross-region, organizations, ransomware]
  source: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
  description: A backup plan in the production account stores recovery points in a local vault and copies them to a vault owned by a separate backup account in the same AWS Organization, and to a vault in a second Region. The destination vault carries a resource policy allowing backup:CopyIntoBackupVault and its own KMS key, so a compromised production account cannot delete the copies.
  containers:
    - region: eu-west-1
      account: production
      label: primary
      vpcs:
        - name: prod-workload
          cidr: 10.20.0.0/16
          subnets:
            - {name: cab-app-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: cab-db-a, cidr: 10.20.10.0/24, az: a, public: false}
    - region: eu-central-1
      account: backup
      label: secondary
  elements:
    - {tf: aws_instance, name: erp-server, in: subnet:cab-app-a}
    - {tf: aws_db_instance, name: erp-db, in: subnet:cab-db-a}
    - {tf: aws_efs_file_system, name: erp-files, in: vpc:prod-workload}
    - {tf: aws_backup_plan, name: prod-backup-plan, in: region:eu-west-1}
    - {tf: aws_backup_vault, name: prod-vault, in: region:eu-west-1}
    - {tf: aws_kms_key, name: prod-backup-key, in: region:eu-west-1}
    - {tf: aws_backup_vault, name: central-vault, in: region:eu-central-1}
    - {tf: aws_kms_key, name: central-vault-key, in: region:eu-central-1}
    - {tf: aws_sns_topic, name: copy-job-events, in: region:eu-central-1}
  actors: []
  flows:
    - {from: prod-backup-plan, to: erp-server, label: EC2 backup selection, step: 1}
    - {from: prod-backup-plan, to: erp-db, label: RDS backup selection}
    - {from: prod-backup-plan, to: erp-files, label: EFS backup selection}
    - {from: prod-backup-plan, to: prod-vault, label: recovery points, step: 2}
    - {from: prod-backup-key, to: prod-vault, label: encrypts source vault}
    - {from: prod-vault, to: central-vault, label: copy job to external vault ARN (cross-account + cross-Region), step: 3}
    - {from: central-vault-key, to: central-vault, label: re-encrypts copies}
    - {from: central-vault, to: copy-job-events, label: copy job completed / failed, step: 4}

- slug: dr-pilot-light
  title: Pilot light disaster recovery across two Regions
  category: resilience
  tags: [disaster recovery, pilot light, aurora global database, s3 replication, route 53, application recovery controller]
  source: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  description: Data stores are always on in the recovery Region through Aurora Global Database and S3 Cross-Region Replication, while the application tier is deployed from the same CloudFormation template with its Auto Scaling group at zero capacity. On failover the secondary Aurora cluster is promoted, the group is scaled out and Route 53 traffic is switched using a health check or an ARC routing control.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: pl-primary
          cidr: 10.0.0.0/16
          subnets:
            - {name: pl-p-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: pl-p-public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: pl-p-db-a, cidr: 10.0.10.0/24, az: a, public: false}
    - region: us-west-2
      label: secondary
      vpcs:
        - name: pl-secondary
          cidr: 10.1.0.0/16
          subnets:
            - {name: pl-s-public-a, cidr: 10.1.0.0/24, az: a, public: true}
            - {name: pl-s-public-b, cidr: 10.1.1.0/24, az: b, public: true}
            - {name: pl-s-db-a, cidr: 10.1.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_route53_zone, name: app-zone, in: region:us-east-1}
    - {tf: aws_route53_health_check, name: primary-check, in: region:us-east-1}
    - {tf: aws_lb, name: primary-alb, in: vpc:pl-primary}
    - {tf: aws_autoscaling_group, name: primary-asg, in: vpc:pl-primary}
    - {tf: aws_rds_global_cluster, name: orders-global, in: region:us-east-1}
    - {tf: aws_rds_cluster, name: orders-primary, in: subnet:pl-p-db-a}
    - {tf: aws_s3_bucket, name: media-primary, in: region:us-east-1}
    - {tf: aws_cloudformation_stack, name: standby-stack, in: region:us-west-2}
    - {tf: aws_lb, name: standby-alb, in: vpc:pl-secondary}
    - {tf: aws_autoscaling_group, name: standby-asg, in: vpc:pl-secondary}
    - {tf: aws_rds_cluster, name: orders-secondary, in: subnet:pl-s-db-a}
    - {tf: aws_s3_bucket, name: media-secondary, in: region:us-west-2}
  actors: [users]
  flows:
    - {from: users, to: app-zone, label: DNS, step: 1}
    - {from: app-zone, to: primary-alb, label: PRIMARY failover record, step: 2}
    - {from: primary-check, to: primary-alb, label: HTTPS health check}
    - {from: primary-alb, to: primary-asg, step: 3}
    - {from: primary-asg, to: orders-primary, label: read/write, step: 4}
    - {from: primary-asg, to: media-primary, label: objects}
    - {from: orders-global, to: orders-primary, label: primary cluster}
    - {from: orders-global, to: orders-secondary, label: secondary cluster (read-only)}
    - {from: orders-primary, to: orders-secondary, label: storage-level replication, typically < 1 s}
    - {from: media-primary, to: media-secondary, label: S3 Cross-Region Replication}
    - {from: standby-stack, to: standby-asg, label: deployed with desired capacity 0}
    - {from: standby-stack, to: standby-alb, label: core infrastructure pre-created}
    - {from: app-zone, to: standby-alb, label: SECONDARY record, used after failover}
    - {from: standby-alb, to: standby-asg, label: scale out on failover}
    - {from: standby-asg, to: orders-secondary, label: read/write after promotion}

- slug: dr-warm-standby
  title: Warm standby with a scaled-down stack in the recovery Region
  category: resilience
  tags: [disaster recovery, warm standby, auto scaling, dynamodb global tables, rds read replica, route 53]
  source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-iii-pilot-light-and-warm-standby/
  description: A fully functional but scaled-down copy of the workload runs in the recovery Region, with front end and application servers in Auto Scaling groups across two Availability Zones behind Elastic Load Balancing, while Route 53 keeps the secondary Region inactive for production traffic. An Aurora primary and replica share the cluster volume in the primary Region and Aurora Global Database replicates asynchronously to a replica in the recovery Region, where a cluster snapshot is also kept; on failover Route 53 redirects users and the Auto Scaling groups are raised to production capacity.
  containers:
    - region: eu-west-1
      label: primary
      vpcs:
        - name: ws-primary
          cidr: 10.30.0.0/16
          at: [2, 1]
          subnets:
            - {name: ws-p-public-a, cidr: 10.30.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: ws-p-public-b, cidr: 10.30.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: ws-p-app-a, cidr: 10.30.10.0/24, az: a, public: false, at: [2, 1]}
            - {name: ws-p-app-b, cidr: 10.30.11.0/24, az: b, public: false, at: [2, 1]}
            - {name: ws-p-db-a, cidr: 10.30.20.0/24, az: a, public: false, at: [3, 1]}
            - {name: ws-p-db-b, cidr: 10.30.21.0/24, az: b, public: false, at: [3, 1]}
    - region: eu-central-1
      label: secondary
      vpcs:
        - name: ws-standby
          cidr: 10.31.0.0/16
          at: [1, 1]
          subnets:
            - {name: ws-s-public-a, cidr: 10.31.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: ws-s-public-b, cidr: 10.31.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: ws-s-app-a, cidr: 10.31.10.0/24, az: a, public: false, at: [2, 1]}
            - {name: ws-s-app-b, cidr: 10.31.11.0/24, az: b, public: false, at: [2, 1]}
            - {name: ws-s-db-a, cidr: 10.31.20.0/24, az: a, public: false, at: [3, 1]}
            - {name: ws-s-db-b, cidr: 10.31.21.0/24, az: b, public: false, at: [3, 1]}
  elements:
    - {tf: aws_route53_zone, name: shop-zone, in: region:eu-west-1, at: [1, 1]}
    - {tf: aws_lb, name: shop-primary-alb, in: vpc:ws-primary, at: [1, 1, 1, 3]}
    - {tf: aws_instance, name: primary-front-end-a, in: subnet:ws-p-public-a, at: [1, 1]}
    - {tf: aws_instance, name: primary-front-end-b, in: subnet:ws-p-public-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: primary-front-end-asg, in: vpc:ws-primary, at: [2, 2]}
    - {tf: aws_instance, name: primary-app-server-a, in: subnet:ws-p-app-a, at: [1, 1]}
    - {tf: aws_instance, name: primary-app-server-b, in: subnet:ws-p-app-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: primary-app-server-asg, in: vpc:ws-primary, at: [3, 2]}
    - {tf: aws_rds_cluster, name: aurora-primary, in: subnet:ws-p-db-a, at: [1, 1]}
    - {tf: aws_rds_cluster_instance, name: aurora-replica, in: subnet:ws-p-db-b, at: [1, 1]}
    - {tf: aws_lb, name: shop-standby-alb, in: vpc:ws-standby, at: [1, 1, 1, 3]}
    - {tf: aws_instance, name: standby-front-end-a, in: subnet:ws-s-public-a, at: [1, 1]}
    - {tf: aws_instance, name: standby-front-end-b, in: subnet:ws-s-public-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: standby-front-end-asg, in: vpc:ws-standby, at: [2, 2]}
    - {tf: aws_instance, name: standby-app-server-a, in: subnet:ws-s-app-a, at: [1, 1]}
    - {tf: aws_instance, name: standby-app-server-b, in: subnet:ws-s-app-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: standby-app-server-asg, in: vpc:ws-standby, at: [3, 2]}
    - {tf: aws_rds_cluster, name: aurora-secondary-replica, in: subnet:ws-s-db-a, at: [1, 1]}
    - {tf: aws_db_cluster_snapshot, name: aurora-cluster-snapshot, in: subnet:ws-s-db-b, at: [1, 1]}
  actors: [users]
  flows:
    - {from: users, to: shop-zone, label: DNS, step: 1}
    - {from: shop-zone, to: shop-primary-alb, label: Active, step: 2}
    - {from: shop-zone, to: shop-standby-alb, label: inactive for production traffic}
    - {from: shop-primary-alb, to: primary-front-end-a, step: 3}
    - {from: shop-primary-alb, to: primary-front-end-b}
    - {from: primary-front-end-a, to: primary-app-server-a, step: 4}
    - {from: primary-front-end-b, to: primary-app-server-b}
    - {from: primary-app-server-a, to: aurora-primary, label: read/write, step: 5}
    - {from: primary-app-server-b, to: aurora-replica, label: reads}
    - {from: aurora-primary, to: aurora-replica, label: shared cluster data volume}
    - {from: aurora-primary, to: aurora-secondary-replica, label: asynchronous cross-Region replication (Aurora Global Database), step: 6}
    - {from: aurora-secondary-replica, to: aurora-cluster-snapshot, label: cluster snapshot}
    - {from: shop-standby-alb, to: standby-front-end-a, label: scaled-down, serves test traffic}
    - {from: shop-standby-alb, to: standby-front-end-b}
    - {from: standby-front-end-a, to: standby-app-server-a}
    - {from: standby-front-end-b, to: standby-app-server-b}
    - {from: standby-app-server-a, to: aurora-secondary-replica, label: reads; writes after promotion}
    - {from: standby-app-server-b, to: aurora-secondary-replica}

- slug: dr-multi-site-active-active
  title: Multi-site active/active across two Regions
  category: resilience
  tags: [disaster recovery, active-active, multi-region, route 53 latency, dynamodb global tables, aurora write forwarding, elasticache global datastore]
  source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-iv-multi-site-active-active/
  description: Both Regions serve production traffic, with Route 53 sending each user to the nearest healthy stack of Elastic Load Balancing, front end servers and application servers in Auto Scaling groups across two Availability Zones. DynamoDB global tables accept reads and writes locally in both Regions with automatic replication, and continuous backup protects each Regional table.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: aa-east
          cidr: 10.40.0.0/16
          at: [2, 1, 1, 2]
          subnets:
            - {name: aa-e-public-a, cidr: 10.40.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: aa-e-public-b, cidr: 10.40.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: aa-e-app-a, cidr: 10.40.10.0/24, az: a, public: false, at: [2, 1]}
            - {name: aa-e-app-b, cidr: 10.40.11.0/24, az: b, public: false, at: [2, 1]}
    - region: eu-west-1
      label: secondary
      vpcs:
        - name: aa-west
          cidr: 10.41.0.0/16
          at: [1, 1, 1, 2]
          subnets:
            - {name: aa-w-public-a, cidr: 10.41.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: aa-w-public-b, cidr: 10.41.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: aa-w-app-a, cidr: 10.41.10.0/24, az: a, public: false, at: [2, 1]}
            - {name: aa-w-app-b, cidr: 10.41.11.0/24, az: b, public: false, at: [2, 1]}
  elements:
    - {tf: aws_route53_zone, name: global-zone, in: region:us-east-1, at: [1, 1, 1, 2]}
    - {tf: aws_lb, name: east-alb, in: vpc:aa-east, at: [1, 1, 1, 3]}
    - {tf: aws_instance, name: east-front-end-a, in: subnet:aa-e-public-a, at: [1, 1]}
    - {tf: aws_instance, name: east-front-end-b, in: subnet:aa-e-public-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: east-front-end-asg, in: vpc:aa-east, at: [2, 2]}
    - {tf: aws_instance, name: east-app-server-a, in: subnet:aa-e-app-a, at: [1, 1]}
    - {tf: aws_instance, name: east-app-server-b, in: subnet:aa-e-app-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: east-app-server-asg, in: vpc:aa-east, at: [3, 2]}
    - {tf: aws_backup_vault, name: profiles-us-east-1-continuous-backup, in: region:us-east-1, at: [3, 1]}
    - {tf: aws_dynamodb_table, name: profiles-us-east-1, in: region:us-east-1, at: [3, 2]}
    - {tf: aws_lb, name: west-alb, in: vpc:aa-west, at: [1, 1, 1, 3]}
    - {tf: aws_instance, name: west-front-end-a, in: subnet:aa-w-public-a, at: [1, 1]}
    - {tf: aws_instance, name: west-front-end-b, in: subnet:aa-w-public-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: west-front-end-asg, in: vpc:aa-west, at: [2, 2]}
    - {tf: aws_instance, name: west-app-server-a, in: subnet:aa-w-app-a, at: [1, 1]}
    - {tf: aws_instance, name: west-app-server-b, in: subnet:aa-w-app-b, at: [1, 1]}
    - {tf: aws_autoscaling_group, name: west-app-server-asg, in: vpc:aa-west, at: [3, 2]}
    - {tf: aws_dynamodb_table, name: profiles-eu-west-1, in: region:eu-west-1, at: [2, 1]}
    - {tf: aws_backup_vault, name: profiles-eu-west-1-continuous-backup, in: region:eu-west-1, at: [2, 2]}
  actors: [users]
  flows:
    - {from: users, to: global-zone, label: DNS, step: 1}
    - {from: global-zone, to: east-alb, label: Active, step: 2}
    - {from: global-zone, to: west-alb, label: Active}
    - {from: east-alb, to: east-front-end-a, step: 3}
    - {from: east-alb, to: east-front-end-b}
    - {from: east-front-end-a, to: east-app-server-a, step: 4}
    - {from: east-front-end-b, to: east-app-server-b}
    - {from: east-app-server-a, to: profiles-us-east-1, label: read-local / write-local, step: 5}
    - {from: east-app-server-b, to: profiles-us-east-1}
    - {from: profiles-us-east-1, to: profiles-us-east-1-continuous-backup, label: continuous backup}
    - {from: west-alb, to: west-front-end-a}
    - {from: west-alb, to: west-front-end-b}
    - {from: west-front-end-a, to: west-app-server-a}
    - {from: west-front-end-b, to: west-app-server-b}
    - {from: west-app-server-a, to: profiles-eu-west-1, label: read-local / write-local}
    - {from: west-app-server-b, to: profiles-eu-west-1}
    - {from: profiles-eu-west-1, to: profiles-eu-west-1-continuous-backup, label: continuous backup}
    - {from: profiles-us-east-1, to: profiles-eu-west-1, label: DynamoDB global tables automatic replication, step: 6}

- slug: arc-routing-control-regional-failover
  title: Regional failover with Application Recovery Controller routing controls
  category: resilience
  tags: [application recovery controller, routing control, safety rule, readiness check, route 53, data plane failover]
  source: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html
  description: An ARC cluster exposes a highly available data-plane API in five Regions; routing controls on its control panel act as on/off switches bound to Route 53 health checks that front the failover records for each Regional replica. A safety rule asserts that at least one control is always on, and a readiness check monitors quotas and capacity of the standby replica so failover can be scripted without depending on Regional control planes.
  containers:
    - region: us-east-1
      label: primary
      vpcs:
        - name: arc-primary
