    - {tf: aws_instance, name: web-c, in: subnet:tt-app-c, at: [1, 1]}
    - {tf: aws_db_instance, name: orders-db-primary, in: subnet:tt-db-a}
    - {tf: aws_db_instance, name: orders-db-standby, in: subnet:tt-db-b}
    - {tf: aws_s3_bucket, name: static-assets, in: region, at: [1, 2]}
    - {tf: aws_dynamodb_table, name: session-table, in: region, at: [2, 2]}
