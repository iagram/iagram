    - {from: managed-ad, to: windows-app-1, label: domain join}
    - {from: users, to: windows-app-alb, label: HTTPS, step: 4}
    - {from: windows-app-alb, to: windows-app-1, step: 5}
    - {from: windows-app-alb, to: windows-app-2}
    - {from: windows-app-1, to: rds-sqlserver-multi-az, label: connection string repointed at cutover, step: 6}

- slug: datasync-hybrid-file-migration
