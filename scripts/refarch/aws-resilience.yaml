- slug: dms-oracle-to-aurora-postgresql
  title: Oracle to Aurora PostgreSQL with AWS SCT and DMS
  category: migration
  tags: [dms, schema conversion tool, oracle, aurora postgresql, heterogeneous migration, cdc]
  source: https://docs.aws.amazon.com/dms/latest/oracle-to-aurora-postgresql-migration-playbook/chap-oracle-aurora-pg.html
  description: AWS SCT (or DMS Schema Conversion) converts the Oracle schema, PL/SQL and code objects to PostgreSQL and applies them to an Aurora PostgreSQL cluster. A DMS replication instance then runs a full-load-plus-CDC task from the on-premises Oracle source endpoint to the Aurora target endpoint over a VPN, keeping both databases in sync until the application is repointed.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      vpcs:
        - name: dms-target
          cidr: 10.140.0.0/16
          subnets:
            - {name: dms-private-a, cidr: 10.140.1.0/24, az: a, public: false}
            - {name: dms-db-a, cidr: 10.140.10.0/24, az: a, public: false}
            - {name: dms-db-b, cidr: 10.140.11.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: dms-dc-router, in: datacenter}
    - {tf: aws_dms_replication_instance, name: oracle-pg-repl, in: subnet:dms-private-a}
    - {tf: aws_dms_endpoint, name: oracle-source, in: region}
    - {tf: aws_dms_endpoint, name: aurora-pg-target, in: region}
    - {tf: aws_dms_replication_task, name: full-load-cdc, in: region}
    - {tf: aws_rds_cluster, name: aurora-pg, in: subnet:dms-db-a}
    - {tf: aws_rds_cluster_instance, name: aurora-pg-writer, in: subnet:dms-db-a}
    - {tf: aws_rds_cluster_instance, name: aurora-pg-reader, in: subnet:dms-db-b}
    - {tf: aws_secretsmanager_secret, name: db-credentials, in: region}
    - {tf: aws_s3_bucket, name: sct-assessment-reports, in: region}
    - {tf: aws_instance, name: app-server-pg, in: subnet:dms-private-a}
  actors: [database]
  flows:
    - {from: dms-dc-router, to: vpc:dms-target, link: aws_vpn_connection, label: Site-to-Site VPN}
    - {from: database, to: sct-assessment-reports, label: SCT assessment report, step: 1}
    - {from: database, to: aurora-pg, label: converted schema applied by SCT, step: 2}
    - {from: oracle-source, to: database, label: Oracle source endpoint (LogMiner / Binary Reader)}
    - {from: aurora-pg-target, to: aurora-pg, label: PostgreSQL target endpoint}
    - {from: db-credentials, to: oracle-source, label: credentials}
    - {from: db-credentials, to: aurora-pg-target}
    - {from: full-load-cdc, to: oracle-pg-repl, label: task runs on replication instance, step: 3}
    - {from: oracle-pg-repl, to: oracle-source, label: full load then CDC reads, step: 4}
    - {from: oracle-pg-repl, to: aurora-pg-target, label: apply changes, step: 5}
    - {from: aurora-pg, to: aurora-pg-writer, label: writer}
    - {from: aurora-pg, to: aurora-pg-reader, label: reader}
    - {from: app-server-pg, to: aurora-pg-writer, label: repointed application after validation, step: 6}

- slug: sql-server-to-rds-native-backup-restore
