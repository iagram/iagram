    - {tf: aws_wafv2_web_acl, name: web-acl, in: group:deployment-dashboard, at: [2, 1]}
    - {tf: aws_api_gateway_rest_api, name: deployment-api, in: group:deployment-dashboard, at: [2, 2]}
    - {tf: aws_lambda_function, name: authorizer-fn, in: group:deployment-dashboard, at: [2, 3]}
    - {tf: aws_lambda_function, name: use-case-mgmt-fn, in: group:deployment-dashboard, at: [2, 4]}
    - {tf: aws_cloudformation_stack, name: use-case-stacks, in: group:deployment-dashboard, at: [2, 5]}
    - {tf: aws_cloudfront_distribution, name: web-ui-cdn, in: group:deployment-dashboard, at: [3, 1]}
    - {tf: aws_cognito_user_pool, name: solution-users, in: group:deployment-dashboard, at: [3, 2]}
    - {tf: aws_dynamodb_table, name: policy-store, in: group:deployment-dashboard, at: [3, 3]}
    - {tf: aws_dynamodb_table, name: use-case-configs, in: group:deployment-dashboard, at: [3, 4]}
    - {tf: aws_dynamodb_table, name: llm-config-store, in: group:deployment-dashboard, at: [3, 5]}
    - {tf: aws_s3_bucket, name: web-ui-bucket, in: group:deployment-dashboard, at: [4, 1]}
    - {tf: aws_ssm_parameter, name: web-ui-parameters, in: group:deployment-dashboard, at: [4, 2]}
    - {tf: aws_apigatewayv2_api, name: chat-websocket-api, in: group:text-use-case}
    - {tf: aws_sqs_queue, name: chat-request-queue, in: group:text-use-case}
    - {tf: aws_lambda_function, name: chat-fn, in: group:text-use-case}
    - {tf: aws_dynamodb_table, name: conversation-history, in: group:text-use-case}
    - {tf: aws_bedrockagent_knowledge_base, name: use-case-kb, in: group:text-use-case}
    - {tf: aws_kendra_index, name: use-case-kendra, in: group:text-use-case}
  actors: [users, user]
  flows:
    - {from: user, to: web-ui-cdn, label: admin opens dashboard, step: 1}
    - {from: web-ui-cdn, to: web-ui-bucket, label: Web app (UI), step: 2}
    - {from: web-ui-parameters, to: web-ui-bucket, label: runtime configuration}
    - {from: user, to: web-acl, label: REST API calls, step: 3}
    - {from: web-acl, to: deployment-api, step: 4}
    - {from: deployment-api, to: authorizer-fn, label: custom authorizer, step: 5}
    - {from: authorizer-fn, to: solution-users, label: validate token}
    - {from: authorizer-fn, to: policy-store, label: policies for authenticated users}
    - {from: deployment-api, to: use-case-mgmt-fn, label: backing functions, step: 6}
    - {from: use-case-mgmt-fn, to: use-case-configs, label: use cases store, step: 7}
    - {from: use-case-mgmt-fn, to: use-case-stacks, label: Stack ID, step: 8}
    - {from: solutions-artifacts, to: use-case-stacks, label: use case and nested templates}
    - {from: use-case-mgmt-fn, to: llm-config-store, label: 'Store LLM configuration: prompt, temperature, model parameters', step: 9}
    - {from: use-case-stacks, to: ops-dashboard, label: custom dashboard, step: 10}
    - {from: users, to: chat-websocket-api, label: WSS chat, step: 11}
    - {from: chat-websocket-api, to: chat-request-queue, step: 12}
    - {from: chat-request-queue, to: chat-fn, link: aws_lambda_event_source_mapping}
