    - {tf: aws_comprehend_entity_recognizer, name: pii-entity-recognizer, in: group:extraction and enrichment, at: [2, 1]}
    - {tf: aws_bedrock_inference_profile, name: claude-extraction, in: group:extraction and enrichment, at: [3, 1]}
