- slug: step-functions-bedrock-prompt-chaining
  title: Agentic prompt chaining with Step Functions and Amazon Bedrock
  category: serverless
  tags: [step functions, bedrock, prompt chaining, agentic workflow, model customization]
  source: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrock.html
  description: A Step Functions state machine uses the optimized Bedrock integration to call InvokeModel in successive Task states, passing each model output as input to the next prompt and reading large payloads from or writing them to S3. The same integration runs CreateModelCustomizationJob.sync to fine-tune a custom model, and a Lambda post-processes results into DynamoDB with an SNS notification on completion.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_api_gateway_rest_api, name: workflow-api, in: region}
    - {tf: aws_sfn_state_machine, name: prompt-chain, in: region}
    - {tf: aws_s3_bucket, name: prompt-inputs, in: region}
    - {tf: aws_s3_bucket, name: model-outputs, in: region}
    - {tf: aws_bedrock_custom_model, name: domain-tuned-model, in: region}
    - {tf: aws_lambda_function, name: post-process-fn, in: region}
    - {tf: aws_dynamodb_table, name: chain-results, in: region}
    - {tf: aws_sns_topic, name: chain-complete, in: region}
  actors: [client]
  flows:
    - {from: client, to: workflow-api, label: POST /run, step: 1}
    - {from: workflow-api, to: prompt-chain, label: StartExecution, step: 2}
    - {from: prompt-inputs, to: prompt-chain, label: "bedrock:invokeModel Input S3Uri", step: 3}
    - {from: prompt-chain, to: prompt-chain, label: chained Task states outline then draft then review, step: 4}
    - {from: prompt-chain, to: model-outputs, label: Output S3Uri, step: 5}
    - {from: prompt-chain, to: domain-tuned-model, label: "bedrock:createModelCustomizationJob.sync"}
    - {from: prompt-chain, to: post-process-fn, step: 6}
    - {from: post-process-fn, to: chain-results, label: PutItem, step: 7}
    - {from: prompt-chain, to: chain-complete, label: Publish, step: 8}

- slug: opensearch-semantic-search-neural
