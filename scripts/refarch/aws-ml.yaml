    - {from: genai-gateway-api, to: orchestrator, step: 2}
    - {from: genai-gateway-api, to: playground-ui}
    - {from: genai-gateway-api, to: tenant-users, label: authentication}
    - {from: genai-gateway-api, to: authorization, label: authorization}
    - {from: orchestrator, to: tenant-config, label: model, quota and KB per tenant, step: 3}
    - {from: orchestrator, to: prompt-catalog, label: prompt lookup, step: 4}
    - {from: orchestrator, to: agent}
    - {from: orchestrator, to: prompt-chaining}
    - {from: orchestrator, to: tenant-a-kb, label: hybrid search with tenant metadata filter, step: 5}
