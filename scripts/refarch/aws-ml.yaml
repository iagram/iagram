  source: https://aws.amazon.com/blogs/machine-learning/intelligent-document-processing-with-amazon-textract-amazon-bedrock-and-langchain/
  description: Documents captured in S3 are OCR'd with Textract and categorised and tagged by a Comprehend custom classifier or a Bedrock Anthropic Claude model. The categorised documents then go through extraction and enrichment, Textract queries, forms and tables, Comprehend entity and PII redaction and Claude summarisation, normalisation and Q&A over a vector store, before a verification stage routes low-confidence predictions to a human-in-the-loop review and high-confidence ones, plus Claude spell corrections, to a post-processing Lambda that integrates the results into downstream databases and applications.
