- slug: rag-kb-opensearch-serverless
  title: Fully managed RAG with Bedrock Knowledge Bases on OpenSearch Serverless
  category: ml
  tags: [rag, bedrock knowledge bases, opensearch serverless, vector search, generative ai]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-fully-managed-bedrock.html
  description: Documents in S3 are chunked, embedded and indexed by a Bedrock knowledge base into an OpenSearch Serverless vector collection during ingestion. At query time a Bedrock agent retrieves the relevant passages from the knowledge base, passes them with the user's query to the foundation model and returns the generated response to the user.
  containers:
    - region: us-east-1
      account_at: [1, 2]
      groups: [{label: amazon-bedrock, at: [1, 1, 2, 1]}]
  elements:
    - {tf: aws_bedrockagent_agent, name: agent, in: group:amazon-bedrock, at: [1, 1]}
    - {tf: aws_bedrockagent_knowledge_base, name: docs-kb, in: group:amazon-bedrock, at: [1, 2]}
    - {tf: aws_bedrock_inference_profile, name: llm, in: group:amazon-bedrock, at: [2, 1]}
    - {tf: aws_opensearchserverless_collection, name: vector-collection, in: region, at: [1, 2]}
    - {tf: aws_s3_bucket, name: source-docs, in: region, at: [2, 2]}
  actors: [{type: user, at: [1, 1]}]
  flows:
    - {from: source-docs, to: docs-kb, link: aws_bedrockagent_data_source}
    - {from: docs-kb, to: vector-collection, label: Titan embeddings written to vector index}
    - {from: user, to: agent, label: query, step: 1}
    - {from: agent, to: docs-kb, label: Retrieve, step: 2}
    - {from: docs-kb, to: vector-collection, label: k-NN similarity search, step: 3}
    - {from: agent, to: llm, label: prompt with retrieved passages, step: 4}
    - {from: llm, to: user, label: response, step: 5}

- slug: rag-kb-aurora-pgvector
  title: RAG with Bedrock Knowledge Bases on Aurora PostgreSQL pgvector
  category: ml
  tags: [rag, aurora postgresql, pgvector, bedrock knowledge bases, vector store]
  source: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
  description: An Aurora PostgreSQL Serverless v2 cluster with the pgvector extension is the vector store for a Bedrock knowledge base; Bedrock reaches it through the RDS Data API using credentials in Secrets Manager. Embeddings from S3 documents land in a table with an HNSW index and are retrieved at query time by a Lambda function that calls the knowledge base.
  containers:
    - region: us-east-1
      vpcs:
        - name: data
          cidr: 10.20.0.0/16
          subnets:
            - {name: db-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: db-b, cidr: 10.20.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_rds_cluster, name: aurora-pgvector, in: subnet:db-a}
    - {tf: aws_secretsmanager_secret, name: pgvector-credentials, in: region}
    - {tf: aws_bedrockagent_knowledge_base, name: pg-kb, in: region}
    - {tf: aws_s3_bucket, name: source-docs, in: region}
    - {tf: aws_api_gateway_rest_api, name: chat-api, in: region}
    - {tf: aws_lambda_function, name: query-fn, in: region}
    - {tf: aws_cognito_user_pool, name: app-users, in: region}
  actors: [users]
  flows:
    - {from: source-docs, to: pg-kb, link: aws_bedrockagent_data_source}
    - {from: pg-kb, to: pgvector-credentials, label: read DB secret, step: 1}
    - {from: pg-kb, to: aurora-pgvector, label: RDS Data API insert embeddings, step: 2}
    - {from: users, to: chat-api, label: HTTPS, step: 3}
    - {from: chat-api, to: query-fn, step: 4}
    - {from: query-fn, to: pg-kb, label: Retrieve, step: 5}
    - {from: pg-kb, to: aurora-pgvector, label: "SELECT ... ORDER BY embedding <=> query", step: 6}

- slug: rag-kb-kendra-genai-index
  title: Bedrock Knowledge Base backed by an Amazon Kendra GenAI index
  category: ml
  tags: [kendra, genai index, bedrock knowledge bases, enterprise search, connectors]
  source: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-kendra-genai-index-create.html
  description: A Kendra GenAI index crawls enterprise sources such as S3 and SaaS repositories through Kendra data source connectors and provides managed semantic retrieval. A Bedrock knowledge base wraps the index and is attached to a Bedrock agent so the foundation model grounds its answers on Kendra results without a separate vector database.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_s3_bucket, name: policy-docs, in: region}
    - {tf: aws_kendra_index, name: genai-index, in: region}
    - {tf: aws_bedrockagent_knowledge_base, name: kendra-kb, in: region}
    - {tf: aws_bedrockagent_agent, name: hr-assistant, in: region}
    - {tf: aws_lambda_function, name: invoke-agent-fn, in: region}
    - {tf: aws_api_gateway_rest_api, name: assistant-api, in: region}
    - {tf: aws_cognito_user_pool, name: employees, in: region}
  actors: [users, saas]
  flows:
    - {from: policy-docs, to: genai-index, link: aws_kendra_data_source}
    - {from: saas, to: genai-index, label: SharePoint/Confluence connector sync}
    - {from: kendra-kb, to: genai-index, label: Kendra Retrieve API, step: 4}
    - {from: hr-assistant, to: kendra-kb, link: aws_bedrockagent_agent_knowledge_base_association}
    - {from: users, to: assistant-api, label: HTTPS, step: 1}
    - {from: assistant-api, to: invoke-agent-fn, step: 2}
    - {from: invoke-agent-fn, to: hr-assistant, label: InvokeAgent, step: 3}

- slug: bedrock-agent-action-groups-athena
  title: Bedrock agent with Lambda action groups over documents and Athena
  category: ml
  tags: [bedrock agents, action groups, lambda, athena, text-to-sql, streamlit]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/develop-a-fully-automated-chat-based-assistant-by-using-amazon-bedrock-agents-and-knowledge-bases.html
  description: A Streamlit task on an ECS cluster behind an Application Load Balancer calls an Invocation Lambda that sends prompts to a Bedrock agent. The agent answers documentation questions from a knowledge base on OpenSearch Serverless fed by an S3 documentation bucket, and delegates database questions through an OpenAPI action-group schema to an executor Lambda that generates SQL and runs it in Athena against a Glue Data Catalog table that a Glue crawler loads from a CSV bucket.
  containers:
    - region: us-east-1
      vpcs:
        - name: app
          cidr: 10.30.0.0/16
          subnets:
            - {name: public-a, cidr: 10.30.0.0/24, az: a, public: true}
            - {name: private-a, cidr: 10.30.10.0/24, az: a, public: false}
  elements:
    - {tf: aws_lb, name: streamlit-alb, in: subnet:public-a}
    - {tf: aws_ecs_cluster, name: streamlit-cluster, in: subnet:private-a, at: [1, 1]}
    - {tf: aws_ecs_task_definition, name: streamlit-app, in: subnet:private-a, at: [1, 2]}
    - {tf: aws_lambda_function, name: invocation-fn, in: region}
    - {tf: aws_bedrockagent_agent, name: chatbot-agent, in: region}
    - {tf: aws_lambda_function, name: agent-executor-fn, in: region}
    - {tf: aws_bedrockagent_knowledge_base, name: docs-kb, in: region}
    - {tf: aws_opensearchserverless_collection, name: kb-vectors, in: region}
    - {tf: aws_athena_workgroup, name: chatbot-athena, in: region}
    - {tf: aws_glue_catalog_database, name: tabular-db, in: region}
    - {tf: aws_glue_crawler, name: csv-crawler, in: region, at: [3, 7]}
    - {tf: aws_s3_bucket, name: assets-bucket, in: region}
    - {tf: aws_s3_bucket, name: csv-data-bucket, in: region, at: [4, 7]}
  actors: [users]
  flows:
    - {from: users, to: streamlit-alb, label: HTTP, step: 1}
    - {from: streamlit-alb, to: streamlit-cluster, step: 2}
    - {from: streamlit-cluster, to: streamlit-app, label: runs task}
    - {from: streamlit-app, to: invocation-fn, label: Invoke, step: 3}
    - {from: invocation-fn, to: chatbot-agent, label: Prompt request / Response, step: 4}
    - {from: assets-bucket, to: docs-kb, link: aws_bedrockagent_data_source}
    - {from: docs-kb, to: chatbot-agent, link: aws_bedrockagent_agent_knowledge_base_association}
    - {from: docs-kb, to: kb-vectors, label: vector index}
    - {from: chatbot-agent, to: agent-executor-fn, label: Agent actions API schema, link: aws_bedrockagent_agent_action_group}
    - {from: agent-executor-fn, to: chatbot-athena, label: Text to SQL request, step: 5}
    - {from: chatbot-athena, to: tabular-db, label: Data Catalog table}
    - {from: chatbot-athena, to: csv-data-bucket, label: scan CSV files}
    - {from: csv-data-bucket, to: csv-crawler, label: crawl CSV data files}
    - {from: csv-crawler, to: tabular-db, label: load Glue database}
- slug: bedrock-guardrails-chat-api
  title: Guardrailed chat API with Amazon Bedrock Guardrails
  category: ml
  tags: [bedrock guardrails, responsible ai, content filters, pii redaction, chat]
  source: https://aws.amazon.com/blogs/machine-learning/build-safe-and-responsible-generative-ai-applications-with-guardrails/
  description: A Lambda function behind API Gateway invokes a Bedrock foundation model with a guardrail identifier so denied topics, content filters, word filters and PII redaction are applied to both prompt and completion. Model invocation logging writes full request and response payloads to CloudWatch Logs and S3, and session state lives in DynamoDB.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_cognito_user_pool, name: chat-users, in: region}
    - {tf: aws_api_gateway_rest_api, name: chat-api, in: region}
    - {tf: aws_lambda_function, name: chat-fn, in: region}
    - {tf: aws_bedrock_guardrail, name: safety-guardrail, in: region}
    - {tf: aws_dynamodb_table, name: sessions, in: region}
    - {tf: aws_cloudwatch_log_group, name: bedrock-invocation-logs, in: region}
    - {tf: aws_s3_bucket, name: invocation-log-archive, in: region}
    - {tf: aws_sns_topic, name: blocked-prompt-alerts, in: region}
  actors: [users]
  flows:
    - {from: users, to: chat-api, label: HTTPS with Cognito JWT, step: 1}
    - {from: chat-api, to: chat-fn, step: 2}
    - {from: chat-fn, to: safety-guardrail, label: InvokeModel with guardrailIdentifier, step: 3}
    - {from: safety-guardrail, to: chat-fn, label: filtered completion or blocked message, step: 4}
    - {from: chat-fn, to: sessions, label: persist turn}
    - {from: safety-guardrail, to: bedrock-invocation-logs, label: model invocation logging}
    - {from: bedrock-invocation-logs, to: invocation-log-archive, label: S3 log delivery}
    - {from: chat-fn, to: blocked-prompt-alerts, label: GUARDRAIL_INTERVENED}

- slug: genai-application-builder-chatbot
  title: Generative AI Application Builder on AWS text chat use case
  category: ml
  tags: [solutions library, chatbot, bedrock, websocket, cognito, cloudfront]
  source: https://docs.aws.amazon.com/solutions/latest/generative-ai-application-builder-on-aws/architecture-overview.html
  description: Admin users open the deployment dashboard, a React web app served by CloudFront from S3 with its runtime settings in Parameter Store; REST calls pass AWS WAF and API Gateway, where a Lambda custom authorizer checks the Cognito token against a DynamoDB policy store before backing Lambdas record use cases in DynamoDB, launch a CloudFormation stack per use case from nested templates in the solutions artifact bucket and store the LLM configuration, all watched by a CloudWatch custom dashboard. In the deployed text use case a WebSocket API queues chat messages in SQS for a chat Lambda that calls Bedrock, optionally grounded by a Bedrock knowledge base or Kendra index.
