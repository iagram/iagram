    - {tf: aws_cognito_identity_pool, name: assistant-identity, in: group:authentication, at: [1, 3]}
    - {tf: aws_iam_role, name: assistant-role, in: group:authentication, at: [1, 4]}
    - {tf: aws_bedrock_inference_profile, name: assistant-model, in: region, at: [2, 1]}
    - {tf: aws_s3_bucket, name: synthesized-audio, in: region, at: [3, 1]}
    - {tf: aws_transcribe_vocabulary, name: domain-vocabulary, in: region, at: [4, 1]}
  actors: [{type: user, at: [2, 1]}, {type: client, at: [2, 2]}]
  flows:
    - {from: user, to: client, label: speak into browser, step: 1}
    - {from: client, to: voice-assistant-web, label: load web app}
    - {from: client, to: assistant-users, label: sign in, step: 2}
    - {from: assistant-users, to: assistant-identity, label: identity token exchange, step: 3}
    - {from: assistant-identity, to: assistant-role, label: temporary credentials}
    - {from: client, to: domain-vocabulary, label: StartStreamTranscription over WebSocket, step: 4}
    - {from: client, to: assistant-model, label: InvokeModel with transcript and history, step: 5}
    - {from: client, to: synthesized-audio, label: Polly SynthesizeSpeech output, step: 6}
