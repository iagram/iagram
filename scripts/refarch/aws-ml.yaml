- slug: multi-tenant-genai-gateway
  title: Multi-tenant generative AI gateway on Amazon Bedrock
  category: ml
  tags: [multi-tenant, saas, generative ai gateway, bedrock, cost allocation, cognito]
  source: https://aws.amazon.com/blogs/machine-learning/build-a-multi-tenant-generative-ai-environment-for-your-enterprise-on-aws/
  description: A shared generative AI environment exposes one HTTPS endpoint in front of an orchestrator and a playground UI; the orchestrator combines Bedrock and SageMaker models, application components (agent, prompt catalog, prompt-chaining flow, hybrid-search knowledge base) and responsible AI components (guardrail, model monitoring, human review, model evaluation). Core services provide logging, metering and auditing, a model registry for onboarding, tenant onboarding in DynamoDB and authentication and authorization, while each tenant keeps its own API layer, business logic, cache, vector store, data sources and data pipelines and calls the endpoint with a tenant JWT.
  containers:
    - region: us-east-1
      account_at: [1, 1, 2, 1]
      groups:
        - {label: model-components, at: [1, 1]}
        - {label: application-components, at: [1, 2]}
        - {label: responsible-ai, at: [1, 3]}
        - {label: core-services, at: [2, 1, 1, 3]}
        - {label: tenant, at: [1, 6, 2, 1]}
  elements:
    - {tf: aws_bedrock_custom_model, name: custom-models, in: group:model-components, at: [1, 1]}
    - {tf: aws_sagemaker_endpoint, name: sagemaker-models, in: group:model-components, at: [1, 2]}
    - {tf: aws_bedrockagent_agent, name: agent, in: group:application-components, at: [1, 1]}
    - {tf: aws_bedrockagent_prompt, name: prompt-catalog, in: group:application-components, at: [1, 2]}
    - {tf: aws_bedrockagent_flow, name: prompt-chaining, in: group:application-components, at: [2, 1]}
    - {tf: aws_bedrockagent_knowledge_base, name: tenant-a-kb, in: group:application-components, at: [2, 2]}
    - {tf: aws_bedrock_guardrail, name: tenant-guardrail, in: group:responsible-ai, at: [1, 1]}
    - {tf: aws_sagemaker_monitoring_schedule, name: model-monitoring, in: group:responsible-ai, at: [1, 2]}
    - {tf: aws_sagemaker_flow_definition, name: human-in-the-loop, in: group:responsible-ai, at: [2, 1]}
    - {tf: aws_bedrock_evaluation_job, name: model-evaluation, in: group:responsible-ai, at: [2, 2]}
    - {tf: aws_cloudwatch_log_group, name: model-invocation-logs, in: group:core-services, at: [1, 1]}
    - {tf: aws_dynamodb_table, name: usage-metering, in: group:core-services, at: [1, 2]}
    - {tf: aws_s3_bucket, name: invocation-log-archive, in: group:core-services, at: [1, 3]}
    - {tf: aws_athena_workgroup, name: cost-allocation, in: group:core-services, at: [1, 4]}
    - {tf: aws_sagemaker_model_package_group, name: model-registry, in: group:core-services, at: [2, 1]}
    - {tf: aws_dynamodb_table, name: tenant-config, in: group:core-services, at: [2, 2]}
    - {tf: aws_cognito_user_pool, name: tenant-users, in: group:core-services, at: [2, 3]}
    - {tf: aws_verifiedpermissions_policy_store, name: authorization, in: group:core-services, at: [2, 4]}
    - {tf: aws_lambda_function, name: orchestrator, in: region, at: [1, 4]}
    - {tf: aws_amplify_app, name: playground-ui, in: region, at: [2, 4]}
    - {tf: aws_api_gateway_rest_api, name: genai-gateway-api, in: region, at: [1, 5, 2, 1]}
    - {tf: aws_api_gateway_rest_api, name: tenant-api-layer, in: group:tenant, at: [1, 1, 1, 2]}
    - {tf: aws_lambda_function, name: tenant-business-logic, in: group:tenant, at: [2, 1]}
    - {tf: aws_elasticache_serverless_cache, name: application-cache, in: group:tenant, at: [2, 2]}
    - {tf: aws_opensearchserverless_collection, name: tenant-vectors, in: group:tenant, at: [3, 1]}
    - {tf: aws_s3_bucket, name: tenant-documents, in: group:tenant, at: [3, 2]}
    - {tf: aws_glue_job, name: data-pipelines, in: group:tenant, at: [4, 1]}
  actors: [{type: user, name: Admin, at: [1, 2]}]
