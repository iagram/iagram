- slug: voice-chatbot-transcribe-bedrock-polly
  title: Serverless voice assistant with Transcribe, Bedrock and Polly
  category: ml
  tags: [voice assistant, transcribe streaming, bedrock, polly, amplify, cognito]
  source: https://aws.amazon.com/blogs/machine-learning/build-a-serverless-voice-based-contextual-chatbot-for-people-with-disabilities-using-amazon-bedrock/
  description: A client browser loads the Amplify-hosted web application, signs in with a Cognito user pool and exchanges the token at a Cognito identity pool for temporary credentials of an IAM role, then streams microphone audio directly to Amazon Transcribe streaming. The transcript is sent to a Bedrock model with conversation context and the reply is synthesized by Amazon Polly and played back in the browser.
