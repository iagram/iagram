- slug: lex-lambda-genai-agent-kendra
  title: Lex chatbot with a Lambda LangChain agent over Bedrock, DynamoDB and Kendra
  category: ml
  tags: [amazon lex, lambda fulfillment, langchain, bedrock, kendra, dynamodb]
  source: https://aws.amazon.com/blogs/machine-learning/build-generative-ai-agents-with-amazon-bedrock-amazon-dynamodb-amazon-kendra-amazon-lex-and-langchain/
  description: Customers reach a Lex V2 natural-language chatbot over the web through an Amplify-hosted website, over SMS, over voice through an Amazon Connect contact center, or from Slack. Lex hands fulfillment to a Lambda bot logic handler that runs a LangChain agent on a fine-tunable Bedrock Anthropic Claude 2.1 model, reads user account information from DynamoDB and retrieves FAQ answers from a Kendra index whose web crawler ingests public pages; customer data in S3 can fine-tune the model.
  containers:
    - region: us-east-1
      groups:
        - {label: your-company.com, at: [1, 1, 3, 1]}
  elements:
    - {tf: aws_amplify_app, name: company-website, in: group:your-company.com, at: [1, 1]}
    - {tf: aws_lexv2models_bot, name: financial-services-bot, in: group:your-company.com, at: [2, 1]}
    - {tf: aws_lambda_function, name: bot-logic-handler-fn, in: group:your-company.com, at: [1, 2, 2, 1]}
    - {tf: aws_connect_instance, name: contact-center, in: region, at: [4, 1]}
    - {tf: aws_dynamodb_table, name: user-accounts, in: region, at: [1, 2]}
    - {tf: aws_bedrock_custom_model, name: claude-2-1-fm, in: region, at: [2, 2]}
    - {tf: aws_s3_bucket, name: customer-data, in: region, at: [2, 3]}
    - {tf: aws_kendra_index, name: faq-search-index, in: region, at: [3, 2]}
  actors:
    - {type: user, name: Customer, at: [1, 1]}
    - {type: saas, name: Slack, at: [2, 1]}
    - {type: internet, at: [1, 3]}
  flows:
    - {from: Customer, to: company-website, label: Web, step: 1}
    - {from: Customer, to: financial-services-bot, label: SMS}
    - {from: Customer, to: contact-center, label: Voice}
    - {from: company-website, to: financial-services-bot, label: chat widget}
    - {from: contact-center, to: financial-services-bot, label: voice conversation}
    - {from: Slack, to: financial-services-bot, label: Slack channel}
    - {from: financial-services-bot, to: bot-logic-handler-fn, label: Lex bot logic handler, step: 2}
    - {from: bot-logic-handler-fn, to: user-accounts, label: User account information, step: 3}
    - {from: bot-logic-handler-fn, to: claude-2-1-fm, label: Anthropic Claude 2.1 FM}
    - {from: customer-data, to: claude-2-1-fm, label: fine-tunable}
    - {from: bot-logic-handler-fn, to: faq-search-index, label: FAQ search index}
    - {from: internet, to: faq-search-index, label: Web Crawler}
- slug: sagemaker-realtime-inference-apigw-lambda
