    - {tf: aws_api_gateway_rest_api, name: fraud-api, in: region, at: [1, 1, 2, 1]}
    - {tf: aws_lambda_function, name: score-transaction-fn, in: region, at: [1, 2, 2, 1]}
    - {tf: aws_sagemaker_endpoint, name: rcf-endpoint, in: group:anomaly detection, at: [1, 1]}
