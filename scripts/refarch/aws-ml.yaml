    - {tf: aws_s3_bucket, name: product-catalog, in: region}
    - {tf: aws_lambda_function, name: indexer-fn, in: subnet:search-b}
    - {tf: aws_api_gateway_rest_api, name: search-api, in: region}
    - {tf: aws_lambda_function, name: search-fn, in: subnet:search-b}
    - {tf: aws_cognito_user_pool, name: search-users, in: region}
