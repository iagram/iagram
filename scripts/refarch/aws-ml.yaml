    - {from: categorized-documents, to: vector-db, label: Vector DB}
    - {from: vector-db, to: claude-extraction, label: 'Claude: summary, normalization, Q&A', step: 5}
    - {from: textract-analyze-fn, to: human-review-loop, label: Route low confidence predictions, step: 6}
    - {from: textract-analyze-fn, to: post-processing-fn, label: Route high confidence predictions, step: 7}
    - {from: claude-extraction, to: claude-spell-check, label: 'Claude: spell check, corrections'}
