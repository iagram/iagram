- slug: rag-kb-opensearch-serverless
  title: Fully managed RAG with Bedrock Knowledge Bases on OpenSearch Serverless
  category: ml
  tags: [rag, bedrock knowledge bases, opensearch serverless, vector search, generative ai]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/retrieval-augmented-generation-options/rag-fully-managed-bedrock.html
  description: Documents in S3 are chunked, embedded and indexed by a Bedrock knowledge base into an OpenSearch Serverless vector collection during ingestion. A Lambda function behind API Gateway calls RetrieveAndGenerate so the foundation model answers with retrieved passages as context; Cognito authenticates callers and DynamoDB keeps chat history.
  containers:
    - region: us-east-1
      groups: [{label: ingestion}, {label: retrieval}]
  elements:
    - {tf: aws_s3_bucket, name: source-docs, in: group:ingestion}
    - {tf: aws_bedrockagent_knowledge_base, name: docs-kb, in: group:ingestion}
    - {tf: aws_opensearchserverless_collection, name: vector-collection, in: group:ingestion}
    - {tf: aws_cognito_user_pool, name: app-users, in: group:retrieval}
    - {tf: aws_api_gateway_rest_api, name: chat-api, in: group:retrieval}
    - {tf: aws_lambda_function, name: query-fn, in: group:retrieval}
    - {tf: aws_dynamodb_table, name: chat-history, in: group:retrieval}
  actors: [users]
  flows:
    - {from: source-docs, to: docs-kb, link: aws_bedrockagent_data_source}
    - {from: docs-kb, to: vector-collection, label: Titan embeddings written to vector index, step: 1}
    - {from: users, to: chat-api, label: HTTPS with Cognito JWT, step: 2}
    - {from: chat-api, to: query-fn, step: 3}
    - {from: query-fn, to: docs-kb, label: RetrieveAndGenerate, step: 4}
    - {from: docs-kb, to: vector-collection, label: k-NN similarity search, step: 5}
    - {from: query-fn, to: chat-history, label: store turn}

- slug: rag-kb-aurora-pgvector
  title: RAG with Bedrock Knowledge Bases on Aurora PostgreSQL pgvector
  category: ml
  tags: [rag, aurora postgresql, pgvector, bedrock knowledge bases, vector store]
  source: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
  description: An Aurora PostgreSQL Serverless v2 cluster with the pgvector extension is the vector store for a Bedrock knowledge base; Bedrock reaches it through the RDS Data API using credentials in Secrets Manager. Embeddings from S3 documents land in a table with an HNSW index and are retrieved at query time by a Lambda function that calls the knowledge base.
  containers:
    - region: us-east-1
      vpcs:
        - name: data
          cidr: 10.20.0.0/16
          subnets:
            - {name: db-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: db-b, cidr: 10.20.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_rds_cluster, name: aurora-pgvector, in: subnet:db-a}
    - {tf: aws_secretsmanager_secret, name: pgvector-credentials, in: region}
    - {tf: aws_bedrockagent_knowledge_base, name: pg-kb, in: region}
    - {tf: aws_s3_bucket, name: source-docs, in: region}
    - {tf: aws_api_gateway_rest_api, name: chat-api, in: region}
    - {tf: aws_lambda_function, name: query-fn, in: region}
    - {tf: aws_cognito_user_pool, name: app-users, in: region}
  actors: [users]
  flows:
    - {from: source-docs, to: pg-kb, link: aws_bedrockagent_data_source}
    - {from: pg-kb, to: pgvector-credentials, label: read DB secret, step: 1}
    - {from: pg-kb, to: aurora-pgvector, label: RDS Data API insert embeddings, step: 2}
    - {from: users, to: chat-api, label: HTTPS, step: 3}
    - {from: chat-api, to: query-fn, step: 4}
    - {from: query-fn, to: pg-kb, label: Retrieve, step: 5}
    - {from: pg-kb, to: aurora-pgvector, label: "SELECT ... ORDER BY embedding <=> query", step: 6}

- slug: rag-kb-kendra-genai-index
  title: Bedrock Knowledge Base backed by an Amazon Kendra GenAI index
  category: ml
  tags: [kendra, genai index, bedrock knowledge bases, enterprise search, connectors]
  source: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-kendra-genai-index-create.html
  description: A Kendra GenAI index crawls enterprise sources such as S3 and SaaS repositories through Kendra data source connectors and provides managed semantic retrieval. A Bedrock knowledge base wraps the index and is attached to a Bedrock agent so the foundation model grounds its answers on Kendra results without a separate vector database.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_s3_bucket, name: policy-docs, in: region}
    - {tf: aws_kendra_index, name: genai-index, in: region}
    - {tf: aws_bedrockagent_knowledge_base, name: kendra-kb, in: region}
    - {tf: aws_bedrockagent_agent, name: hr-assistant, in: region}
    - {tf: aws_lambda_function, name: invoke-agent-fn, in: region}
    - {tf: aws_api_gateway_rest_api, name: assistant-api, in: region}
    - {tf: aws_cognito_user_pool, name: employees, in: region}
  actors: [users, saas]
  flows:
    - {from: policy-docs, to: genai-index, link: aws_kendra_data_source}
    - {from: saas, to: genai-index, label: SharePoint/Confluence connector sync}
    - {from: kendra-kb, to: genai-index, label: Kendra Retrieve API, step: 4}
    - {from: hr-assistant, to: kendra-kb, link: aws_bedrockagent_agent_knowledge_base_association}
    - {from: users, to: assistant-api, label: HTTPS, step: 1}
    - {from: assistant-api, to: invoke-agent-fn, step: 2}
    - {from: invoke-agent-fn, to: hr-assistant, label: InvokeAgent, step: 3}

- slug: bedrock-agent-action-groups-athena
