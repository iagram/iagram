- slug: feature-store-streaming-ingestion
  title: Streaming feature ingestion into SageMaker Feature Store for real-time fraud scoring
  category: ml
  tags: [feature store, kinesis, managed flink, streaming aggregates, real-time inference]
  source: https://aws.amazon.com/blogs/machine-learning/using-streaming-ingestion-with-amazon-sagemaker-feature-store-to-make-ml-backed-decisions-in-near-real-time/
  description: Historical transactions and fraud labels in an S3 data lake feed a nightly PySpark job that builds the training data for a SageMaker training job and materialises one-week aggregates into a batch online-only feature group. Live credit card transactions arrive on a Kinesis data stream; a Kinesis Data Analytics SQL application computes sliding ten-minute aggregates and a Lambda pushes them into a second online-only feature group, while a second Lambda consumes the same stream, reads the latest aggregates with GetRecord, calls the fraud detection endpoint and writes results that trigger alerts and feed a dashboard.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_s3_bucket, name: raw-data-lake, in: region, at: [1, 1]}
    - {tf: aws_glue_job, name: nightly-aggregates-job, in: region, at: [1, 2]}
    - {tf: aws_sagemaker_training_job, name: fraud-model-training, in: region, at: [1, 3]}
    - {tf: aws_sagemaker_feature_group, name: cc-agg-batch-features, in: region, at: [1, 4]}
    - {tf: aws_kinesis_stream, name: cc-transactions, in: region, at: [2, 1, 2, 1]}
    - {tf: aws_kinesisanalyticsv2_application, name: window-aggregates, in: region, at: [2, 2]}
    - {tf: aws_lambda_function, name: ingest-features-fn, in: region, at: [2, 3]}
    - {tf: aws_sagemaker_feature_group, name: cc-agg-features, in: region, at: [2, 4]}
    - {tf: aws_lambda_function, name: predict-fn, in: region, at: [3, 2]}
    - {tf: aws_sagemaker_endpoint, name: fraud-endpoint, in: region, at: [3, 3]}
    - {tf: aws_s3_bucket, name: results-store, in: region, at: [4, 2]}
  actors: [device]
  flows:
    - {from: raw-data-lake, to: nightly-aggregates-job, label: 'Nightly batch: fraud labels and transactions', step: 2}
    - {from: nightly-aggregates-job, to: fraud-model-training, label: training data, step: 3}
    - {from: fraud-model-training, to: fraud-endpoint, label: model deployment}
    - {from: nightly-aggregates-job, to: cc-agg-batch-features, label: nightly update last 1 week aggregations}
    - {from: device, to: cc-transactions, label: PutRecord transaction}
    - {from: cc-transactions, to: window-aggregates, label: Streaming aggregation, step: 4}
    - {from: window-aggregates, to: ingest-features-fn, label: push aggregate features}
    - {from: ingest-features-fn, to: cc-agg-features, label: sliding last 10 mins aggregations}
    - {from: cc-transactions, to: predict-fn, label: Streaming predictions, step: 5, link: aws_lambda_event_source_mapping}
    - {from: cc-agg-features, to: predict-fn, label: GetRecord latest aggregates}
    - {from: predict-fn, to: fraud-endpoint, label: InvokeEndpoint}
    - {from: predict-fn, to: results-store, label: results, trigger alerts, feed dashboard}
- slug: idp-textract-bedrock-comprehend
