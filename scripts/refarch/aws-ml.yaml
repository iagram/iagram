    - {tf: aws_s3_bucket, name: transform-output, in: region}
    - {tf: aws_cloudwatch_event_rule, name: weekly-schedule, in: region}
    - {tf: aws_sns_topic, name: workflow-complete, in: region}
  actors: [user]
  flows:
    - {from: weekly-schedule, to: train-and-transform, link: aws_cloudwatch_event_target}
    - {from: user, to: train-and-transform, label: StartExecution}
    - {from: train-and-transform, to: seed-data-fn, label: Generate dataset task, step: 1}
