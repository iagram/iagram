    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: region}
    - {tf: aws_sagemaker_model_package_group, name: churn-models, in: region}
    - {tf: aws_sagemaker_model, name: churn-model, in: region}
    - {tf: aws_sagemaker_endpoint, name: churn-endpoint, in: region}
    - {tf: aws_cloudwatch_event_rule, name: nightly-retrain, in: region}
