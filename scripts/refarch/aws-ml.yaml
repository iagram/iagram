    - {from: invoke-endpoint-fn, to: predict-endpoint, label: InvokeEndpoint CSV payload, step: 3}
    - {from: predict-endpoint, to: endpoint-logs, label: invocation metrics}

- slug: sagemaker-pipelines-model-registry
  title: SageMaker Pipelines training workflow with Feature Store and Model Registry
  category: ml
  tags: [sagemaker pipelines, model registry, feature store, training, model evaluation]
  source: https://docs.aws.amazon.com/sagemaker/latest/dg/pipelines.html
  description: A SageMaker pipeline chains processing, training, evaluation and a condition step that registers approved models in a Model Registry package group. Features come from a Feature Store group, artifacts land in S3, and an approved model version is deployed as a real-time endpoint; the pipeline is authored from a SageMaker Studio domain and can run on an EventBridge schedule.
  containers:
    - region: us-east-1
  elements:
    - {tf: aws_sagemaker_domain, name: studio-domain, in: region}
    - {tf: aws_s3_bucket, name: raw-data, in: region}
    - {tf: aws_sagemaker_feature_group, name: customer-features, in: region}
    - {tf: aws_sagemaker_pipeline, name: train-evaluate-register, in: region}
    - {tf: aws_ecr_repository, name: training-image, in: region}
    - {tf: aws_s3_bucket, name: pipeline-artifacts, in: region}
    - {tf: aws_sagemaker_model_package_group, name: churn-models, in: region}
    - {tf: aws_sagemaker_model, name: churn-model, in: region}
    - {tf: aws_sagemaker_endpoint, name: churn-endpoint, in: region}
    - {tf: aws_cloudwatch_event_rule, name: nightly-retrain, in: region}
  actors: [user]
  flows:
    - {from: user, to: studio-domain, label: author pipeline definition}
    - {from: studio-domain, to: train-evaluate-register, label: upsert and start}
    - {from: nightly-retrain, to: train-evaluate-register, link: aws_cloudwatch_event_target}
    - {from: raw-data, to: train-evaluate-register, label: ProcessingStep input, step: 1}
    - {from: train-evaluate-register, to: customer-features, label: ingest features, step: 2}
    - {from: training-image, to: train-evaluate-register, label: TrainingStep container}
    - {from: train-evaluate-register, to: pipeline-artifacts, label: model and evaluation.json, step: 3}
    - {from: train-evaluate-register, to: churn-models, label: RegisterModel when accuracy above threshold, step: 4}
    - {from: churn-models, to: churn-model, label: approved package, step: 5}
    - {from: churn-model, to: churn-endpoint, label: deploy, step: 6}

- slug: mlops-sagemaker-projects-codepipeline
  title: MLOps CI/CD with SageMaker Projects and CodePipeline
  category: devops
  tags: [mlops, codepipeline, codebuild, sagemaker projects, model registry, staging production]
  source: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-projects-templates-sm.html
  description: The SageMaker-provided MLOps template with third-party Git repositories seeds a model-build and a model-deploy GitHub repository through a CodeBuild project and a Lambda check-in function, then a model-build pipeline (CodePipeline or Jenkins) checks out the build repository through a CodeStar connection, installs the AWS CLI and runs a SageMaker pipeline whose processing, training and evaluation steps write model artifacts to S3 and register the model in the Model Registry. On model approval an EventBridge rule invokes a Lambda that triggers the model-deploy pipeline, which builds CloudFormation templates into S3 and deploys the stack to a staging endpoint and, after testing and manual approval, to production.
  containers:
    - region: eu-west-1
      groups:
        - {label: model-build, at: [1, 2]}
        - {label: model-deploy, at: [1, 3, 1, 2]}
        - {label: seeding, at: [2, 1]}
        - {label: sagemaker pipelines, at: [2, 2]}
        - {label: model registry, at: [2, 3]}
