    - {tf: aws_sagemaker_pipeline, name: abalone-pipeline, in: group:model-build}
    - {tf: aws_sagemaker_model_package_group, name: abalone-models, in: group:model-build}
    - {tf: aws_s3_bucket, name: mlops-artifacts, in: region}
    - {tf: aws_cloudwatch_event_rule, name: model-approved-rule, in: group:model-deploy}
