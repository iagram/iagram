- slug: warm-standby-dr-snapshots-dns
  title: Warm standby disaster recovery with snapshots and Cloud DNS failover
  category: resilience
  tags: [disaster recovery, warm standby, cold, hot, snapshots, cloud dns, managed instance group, rpo]
  source: https://docs.cloud.google.com/architecture/dr-scenarios-for-applications
  description: The production region serves traffic from a managed instance group and a Cloud SQL primary, while the DR region keeps a minimal warm environment, a scaled-down instance group built from images and a read replica receiving continuous replication, cheaper than a hot active/active setup but faster to recover than a cold rebuild from Cloud Storage backups. Scheduled disk snapshots and image copies keep the DR templates current, and on failover the replica is promoted, the instance group is scaled up and a Cloud DNS record switches users to the DR load balancer.
  containers:
    - project: prj-p-erp
      region: us-central1
      vpcs:
        - name: erp-vpc
          subnets:
            - {name: prod-sub-usc1, cidr: 10.160.0.0/24, region: us-central1}
            - {name: dr-sub-usw1, cidr: 10.160.1.0/24, region: us-west1}
  elements:
    - {tf: google_dns_managed_zone, name: erp-public-zone, in: project:prj-p-erp}
    - {tf: google_dns_record_set, name: erp-a-record, in: project:prj-p-erp}
    - {tf: google_compute_forwarding_rule, name: prod-lb-usc1, in: subnet:prod-sub-usc1}
    - {tf: google_compute_forwarding_rule, name: dr-lb-usw1, in: subnet:dr-sub-usw1}
    - {tf: google_compute_region_instance_group_manager, name: erp-mig-prod, in: subnet:prod-sub-usc1}
    - {tf: google_compute_region_instance_group_manager, name: erp-mig-dr-warm, in: subnet:dr-sub-usw1}
    - {tf: google_compute_resource_policy, name: nightly-snapshot-schedule, in: project:prj-p-erp}
    - {tf: google_compute_image, name: erp-golden-image, in: project:prj-p-erp}
    - {tf: google_sql_database_instance, name: erp-pg-primary, in: vpc:erp-vpc}
    - {tf: google_sql_database_instance, name: erp-pg-dr-replica, in: vpc:erp-vpc}
    - {tf: google_storage_bucket, name: erp-cold-backups, in: project:prj-p-erp}
  actors: [users]
  flows:
    - {from: users, to: erp-a-record, label: DNS lookup, step: 1}
    - {from: erp-a-record, to: prod-lb-usc1, label: normal operation, step: 2}
    - {from: prod-lb-usc1, to: erp-mig-prod, label: HTTPS, step: 3}
    - {from: erp-mig-prod, to: erp-pg-primary, label: SQL, step: 4}
    - {from: erp-pg-primary, to: erp-pg-dr-replica, label: continuous replication, step: 5}
    - {from: nightly-snapshot-schedule, to: erp-mig-prod, label: scheduled disk snapshots, step: 6}
    - {from: nightly-snapshot-schedule, to: erp-golden-image, label: refresh DR image, step: 7}
    - {from: erp-pg-primary, to: erp-cold-backups, label: exported backups (cold fallback), step: 8}
    - {from: erp-a-record, to: dr-lb-usw1, label: failover TTL switch, step: 9}
    - {from: dr-lb-usw1, to: erp-mig-dr-warm, label: scaled-up from image, step: 10}
    - {from: erp-mig-dr-warm, to: erp-pg-dr-replica, label: promoted primary, step: 11}

- slug: gke-multi-cluster-gateway-failover
  title: GKE multi-cluster Gateway with cross-region failover
  category: containers
  tags: [gke, multi-cluster gateway, fleet, config cluster, serviceexport, global load balancer, failover]
  source: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/deploying-multi-cluster-gateways
  description: Two GKE clusters in us-west1 and us-east1 are registered to one fleet with multi-cluster Services and Gateway enabled, and the config cluster gke-west-1 hosts the external-http Gateway of class gke-l7-global-external-managed-mc plus HTTPRoutes for store.example.com. Each cluster runs the store pods in a store namespace exported as a fleet-wide ServiceImport, and the resulting global external Application Load Balancer routes store.example.com/west and /east to the matching cluster and every other path to the healthy cluster closest to the client, failing over automatically when a cluster or region becomes unhealthy.
  containers:
    - project: prj-p-fleet
      region: us-west1
      groups: [{label: external-http Gateway, at: [1, 1]}]
      vpcs:
        - name: fleet-vpc
          at: [2, 1]
          subnets:
            - {name: gke-sub-usw1, cidr: 10.170.0.0/20, region: us-west1, at: [1, 1]}
            - {name: gke-sub-use1, cidr: 10.170.16.0/20, region: us-east1, at: [1, 2]}
  elements:
    - {tf: google_compute_global_forwarding_rule, name: store-external-gateway, in: group:external-http Gateway, at: [1, 1]}
    - {tf: google_container_cluster, name: gke-west-1, in: subnet:gke-sub-usw1, at: [1, 1]}
    - {tf: google_compute_network_endpoint_group, name: store-pods-west, in: subnet:gke-sub-usw1, at: [2, 1]}
    - {tf: google_container_cluster, name: gke-east-1, in: subnet:gke-sub-use1, at: [1, 1]}
    - {tf: google_compute_network_endpoint_group, name: store-pods-east, in: subnet:gke-sub-use1, at: [2, 1]}
    - {tf: google_gke_hub_feature, name: multiclusteringress-config-cluster, in: project:prj-p-fleet, at: [3, 1]}
  actors: [{type: client, name: Internet Client, at: [1, 1]}]
  flows:
    - {from: Internet Client, to: store-external-gateway, label: "store.example.com/* /west /east", step: 1}
    - {from: store-external-gateway, to: store-pods-west, label: "/west and nearest healthy", step: 2}
    - {from: store-external-gateway, to: store-pods-east, label: "/east and failover", step: 2}
    - {from: gke-west-1, to: store-pods-west, label: store namespace}
    - {from: gke-east-1, to: store-pods-east, label: store namespace}
    - {from: multiclusteringress-config-cluster, to: gke-west-1, label: config cluster hosts Gateway, step: 3}
    - {from: gke-west-1, to: store-external-gateway, label: Gateway reconciles global external ALB, step: 4}

- slug: cloud-dns-failover-routing-policy
  title: DNS-based failover with Cloud DNS routing policies and health checks
  category: resilience
  tags: [cloud dns, routing policy, failover, geolocation, health check, internal load balancer]
  source: https://docs.cloud.google.com/dns/docs/zones/manage-routing-policies
  description: A Cloud DNS private zone record uses a failover routing policy whose primary target is the regional internal Application Load Balancer forwarding rule in us-central1 and whose backup geolocation policy points to the us-east1 load balancer. Cloud DNS health-checks the forwarding rules and, when all primary endpoints are unhealthy, answers queries with the backup so internal clients move to the surviving region without application changes.
  containers:
    - project: prj-p-internal-api
      region: us-central1
      vpcs:
        - name: internal-vpc
          subnets:
            - {name: api-sub-usc1, cidr: 10.180.0.0/24, region: us-central1}
            - {name: api-sub-use1, cidr: 10.180.1.0/24, region: us-east1}
            - {name: client-sub-usc1, cidr: 10.180.10.0/24, region: us-central1}
  elements:
    - {tf: google_dns_managed_zone, name: internal-private-zone, in: vpc:internal-vpc}
    - {tf: google_dns_record_set, name: api-failover-record, in: vpc:internal-vpc}
    - {tf: google_compute_forwarding_rule, name: api-ilb-usc1, in: subnet:api-sub-usc1}
    - {tf: google_compute_forwarding_rule, name: api-ilb-use1, in: subnet:api-sub-use1}
    - {tf: google_compute_region_backend_service, name: api-backend-usc1, in: subnet:api-sub-usc1}
    - {tf: google_compute_region_backend_service, name: api-backend-use1, in: subnet:api-sub-use1}
    - {tf: google_compute_region_instance_group_manager, name: api-mig-usc1, in: subnet:api-sub-usc1}
    - {tf: google_compute_region_instance_group_manager, name: api-mig-use1, in: subnet:api-sub-use1}
    - {tf: google_compute_health_check, name: api-health-check, in: project:prj-p-internal-api}
    - {tf: google_compute_instance, name: internal-client-vm, in: subnet:client-sub-usc1}
  actors: [client]
  flows:
    - {from: internal-client-vm, to: api-failover-record, label: "resolve api.internal", step: 1}
    - {from: api-failover-record, to: api-ilb-usc1, label: primary target, step: 2}
    - {from: api-failover-record, to: api-ilb-use1, label: backup geolocation target, step: 3}
    - {from: api-health-check, to: api-ilb-usc1, label: Cloud DNS health check, step: 4}
    - {from: api-ilb-usc1, to: api-backend-usc1, label: regional internal ALB, step: 5}
    - {from: api-backend-usc1, to: api-mig-usc1, label: HTTP, step: 6}
    - {from: api-ilb-use1, to: api-backend-use1, label: regional internal ALB, step: 7}
    - {from: api-backend-use1, to: api-mig-use1, label: HTTP, step: 8}
    - {from: client, to: internal-client-vm, label: internal consumers, step: 9}

- slug: log-based-alerting-cloud-monitoring
  title: Log-based alerting on audit logs with Cloud Monitoring
  category: observability
  tags: [cloud monitoring, log-based alert, logmatch, notification channel, audit logs, pub/sub, incident]
  source: https://docs.cloud.google.com/logging/docs/alerting/log-based-alerts
  description: A Cloud Monitoring alert policy with a LogMatch condition watches Cloud Audit Logs for sensitive events such as a human principal decrypting with a KMS key or accessing a Secret Manager secret version, extracting labels from the log entry into the notification. Incidents route through email and Pub/Sub notification channels, and a Cloud Run function subscribed to the topic posts to the on-call chat tool, while a log-based metric on the same filter provides counts for a dashboard.
  containers:
    - project: prj-c-secrets
      region: us-central1
    - project: prj-c-monitoring
      region: us-central1
  elements:
    - {tf: google_kms_crypto_key, name: payroll-key, in: project:prj-c-secrets}
    - {tf: google_secret_manager_secret, name: payroll-db-secret, in: project:prj-c-secrets}
    - {tf: google_logging_project_sink, name: audit-to-monitoring-sink, in: project:prj-c-secrets}
    - {tf: google_logging_project_bucket_config, name: security-audit-bucket, in: project:prj-c-monitoring}
    - {tf: google_monitoring_alert_policy, name: human-key-access-alert, in: project:prj-c-monitoring}
    - {tf: google_logging_metric, name: human-key-access-count, in: project:prj-c-monitoring}
    - {tf: google_monitoring_notification_channel, name: security-email-channel, in: project:prj-c-monitoring}
    - {tf: google_monitoring_notification_channel, name: security-pubsub-channel, in: project:prj-c-monitoring}
    - {tf: google_pubsub_topic, name: security-alerts-topic, in: project:prj-c-monitoring}
    - {tf: google_cloudfunctions2_function, name: alert-to-chat-fn, in: project:prj-c-monitoring}
    - {tf: google_monitoring_dashboard, name: key-access-dashboard, in: project:prj-c-monitoring}
  actors: [user, users, saas]
  flows:
    - {from: user, to: payroll-key, label: interactive Decrypt call, step: 1}
    - {from: user, to: payroll-db-secret, label: AccessSecretVersion, step: 1}
    - {from: payroll-key, to: audit-to-monitoring-sink, label: Data Access audit log, step: 2}
    - {from: audit-to-monitoring-sink, to: security-audit-bucket, label: route to central bucket, step: 3}
    - {from: security-audit-bucket, to: human-key-access-alert, label: LogMatch on non-service-account principal, step: 4}
    - {from: security-audit-bucket, to: human-key-access-count, label: log-based metric, step: 5}
    - {from: human-key-access-alert, to: security-email-channel, label: incident notification, step: 6}
    - {from: human-key-access-alert, to: security-pubsub-channel, label: incident notification, step: 6}
    - {from: security-pubsub-channel, to: security-alerts-topic, label: publish JSON payload, step: 7}
    - {from: security-alerts-topic, to: alert-to-chat-fn, link: google_cloudfunctions2_function}
    - {from: alert-to-chat-fn, to: saas, label: chat webhook, step: 8}
    - {from: security-email-channel, to: users, label: email security team, step: 9}
    - {from: human-key-access-count, to: key-access-dashboard, label: chart, step: 10}
