    - {tf: google_artifact_registry_repository, name: app-images, in: project:prj-p-platform}
    - {tf: google_kms_key_ring, name: binauthz-key-ring, in: project:prj-p-platform}
    - {tf: google_kms_crypto_key, name: attestor-signing-key, in: project:prj-p-platform}
    - {tf: google_container_analysis_note, name: build-verified-note, in: project:prj-p-platform}
    - {tf: google_binary_authorization_attestor, name: build-verified-attestor, in: project:prj-p-platform}
