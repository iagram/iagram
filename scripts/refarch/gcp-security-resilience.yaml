    - {from: app-source-repo, to: build-sign-trigger, label: trigger build, step: 2}
    - {from: build-sign-trigger, to: app-images, label: push image and vulnerability scan, step: 3}
    - {from: build-sign-trigger, to: attestor-signing-key, label: sign digest, step: 4}
    - {from: build-sign-trigger, to: build-verified-note, label: create attestation occurrence, step: 5}
    - {from: build-verified-attestor, to: build-verified-note, label: trusts note and public key, step: 6}
    - {from: require-attestation-policy, to: build-verified-attestor, label: required attestor, step: 7}
