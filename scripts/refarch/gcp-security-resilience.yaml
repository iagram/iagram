# Google Cloud reference architectures: security, identity, governance, resilience and DR
# Format: see FORMAT.md. 20 distinct official architectures.

- slug: enterprise-foundations-landing-zone
  title: Enterprise foundations blueprint landing zone
  category: security
  tags: [landing zone, folders, shared vpc, org policy, resource hierarchy, enterprise foundations]
  source: https://docs.cloud.google.com/architecture/security-foundations
  description: The enterprise foundations blueprint organizes the organization into bootstrap, common, networking and per-environment folders, with centralized projects for Terraform state, logging, secrets, KMS and Security Command Center under the common folder. Shared VPC host projects in the networking folder serve workload projects in each environment, while organization policies and aggregated log sinks are attached at the organization and folder level.
  containers:
    - group: fldr-bootstrap
    - group: fldr-common
    - group: fldr-network
    - group: fldr-production
    - project: prj-b-seed
      region: us-central1
    - project: prj-c-logging
      region: us-central1
    - project: prj-c-kms
      region: us-central1
    - project: prj-c-secrets
      region: us-central1
    - project: prj-net-prod-svpc
      region: us-central1
      vpcs:
        - name: vpc-p-shared-base
          subnets:
            - {name: sb-p-shared-base-us-central1, cidr: 10.8.0.0/18, region: us-central1}
            - {name: sb-p-shared-base-us-west1, cidr: 10.8.64.0/18, region: us-west1}
    - project: prj-p-workload
      region: us-central1
  elements:
    - {tf: google_folder, name: bootstrap-folder, in: group:fldr-bootstrap}
    - {tf: google_folder, name: common-folder, in: group:fldr-common}
    - {tf: google_folder, name: network-folder, in: group:fldr-network}
    - {tf: google_folder, name: production-folder, in: group:fldr-production}
    - {tf: google_org_policy_policy, name: restrict-external-ip-policy, in: group:fldr-production}
    - {tf: google_org_policy_policy, name: allowed-member-domains-policy, in: group:fldr-common}
    - {tf: google_storage_bucket, name: tf-state-bucket, in: project:prj-b-seed}
    - {tf: google_logging_organization_sink, name: sk-c-logging-la, in: project:prj-c-logging}
    - {tf: google_kms_key_ring, name: org-key-ring, in: project:prj-c-kms}
    - {tf: google_secret_manager_secret, name: org-shared-secret, in: project:prj-c-secrets}
    - {tf: google_compute_shared_vpc_host_project, name: shared-vpc-host, in: project:prj-net-prod-svpc}
    - {tf: google_compute_router_nat, name: prod-nat, in: vpc:vpc-p-shared-base}
    - {tf: google_compute_instance, name: workload-vm, in: subnet:sb-p-shared-base-us-central1}
  actors: [users]
  flows:
    - {from: users, to: tf-state-bucket, label: foundation pipeline applies Terraform, step: 1}
    - {from: shared-vpc-host, to: project:prj-p-workload, link: google_compute_shared_vpc_service_project}
    - {from: restrict-external-ip-policy, to: workload-vm, label: org policy inherited, step: 2}
    - {from: workload-vm, to: sk-c-logging-la, label: audit and flow logs, step: 3}
    - {from: workload-vm, to: org-key-ring, label: CMEK encrypt/decrypt, step: 4}
    - {from: workload-vm, to: org-shared-secret, label: secret access, step: 5}

- slug: centralized-logging-aggregated-sinks
  title: Centralized log storage with organization aggregated sinks
  category: observability
  tags: [cloud logging, aggregated sink, log bucket, log analytics, bigquery, siem export]
  source: https://docs.cloud.google.com/logging/docs/central-log-storage
  description: Organization-level aggregated sinks with include-children route Admin Activity, System Event, Policy Denied, VPC Flow and firewall logs from every project into a central logging project. One sink lands in a Cloud Logging bucket with Log Analytics and a linked BigQuery dataset, a second archives to a Cloud Storage bucket for compliance retention, and a third publishes to Pub/Sub for SIEM consumption.
  containers:
    - group: fldr-production
    - project: prj-c-logging
      region: us-central1
    - project: prj-p-app-a
      region: us-central1
    - project: prj-p-app-b
      region: us-central1
  elements:
    - {tf: google_folder, name: production-folder, in: group:fldr-production}
    - {tf: google_logging_organization_sink, name: sk-c-logging-la, in: project:prj-c-logging}
    - {tf: google_logging_organization_sink, name: sk-c-logging-bkt, in: project:prj-c-logging}
    - {tf: google_logging_organization_sink, name: sk-c-logging-pub, in: project:prj-c-logging}
    - {tf: google_logging_project_bucket_config, name: central-log-bucket, in: project:prj-c-logging}
    - {tf: google_bigquery_dataset, name: log-analytics-linked-dataset, in: project:prj-c-logging}
    - {tf: google_storage_bucket, name: log-archive-bucket, in: project:prj-c-logging}
    - {tf: google_pubsub_topic, name: siem-export-topic, in: project:prj-c-logging}
    - {tf: google_compute_instance, name: app-a-vm, in: project:prj-p-app-a}
    - {tf: google_cloud_run_v2_service, name: app-b-service, in: project:prj-p-app-b}
  actors: [users, saas]
  flows:
    - {from: app-a-vm, to: sk-c-logging-la, label: audit and VPC flow logs, step: 1}
    - {from: app-b-service, to: sk-c-logging-la, label: request and audit logs, step: 1}
    - {from: sk-c-logging-la, to: central-log-bucket, label: Log Analytics bucket, step: 2}
    - {from: central-log-bucket, to: log-analytics-linked-dataset, label: linked dataset, step: 3}
    - {from: sk-c-logging-bkt, to: log-archive-bucket, label: long-term retention, step: 4}
    - {from: sk-c-logging-pub, to: siem-export-topic, label: stream, step: 5}
    - {from: siem-export-topic, to: saas, label: SIEM pull, step: 6}
    - {from: users, to: log-analytics-linked-dataset, label: SQL over logs, step: 7}

- slug: cloud-identity-federation-external-idp
  title: Cloud Identity federation with an external identity provider
  category: identity
  tags: [cloud identity, gcds, saml sso, active directory, workforce identity federation, iam]
  source: https://docs.cloud.google.com/architecture/identity/reference-architectures
  description: An on-premises Active Directory stays the authoritative source while Google Cloud Directory Sync provisions users and groups one-way into Cloud Identity and AD FS handles SAML single sign-on, so MFA and password policies are inherited from the corporate IdP. Alternatively Workforce Identity Federation exchanges OIDC or SAML tokens from Entra ID or Okta for short-lived Google Cloud credentials without synchronizing accounts, and IAM bindings target Cloud Identity groups or workforce pool principal sets.
  containers:
    - datacenter: corp-dc
    - project: prj-c-identity
      region: us-central1
    - project: prj-p-workload
      region: us-central1
  elements:
    - {tf: google_compute_instance, name: active-directory-dc, in: datacenter:corp-dc}
    - {tf: google_compute_instance, name: gcds-sync-server, in: datacenter:corp-dc}
    - {tf: google_compute_instance, name: adfs-sso-server, in: datacenter:corp-dc}
    - {tf: google_cloud_identity_group, name: gcp-platform-admins, in: project:prj-c-identity}
    - {tf: google_iam_workforce_pool, name: employees-pool, in: project:prj-c-identity}
    - {tf: google_iam_workforce_pool_provider, name: entra-id-oidc-provider, in: project:prj-c-identity}
    - {tf: google_project_iam_custom_role, name: platform-operator-role, in: project:prj-p-workload}
    - {tf: google_storage_bucket, name: workload-data-bucket, in: project:prj-p-workload}
  actors: [users, idp]
  flows:
    - {from: active-directory-dc, to: gcds-sync-server, label: LDAP read, step: 1}
    - {from: gcds-sync-server, to: gcp-platform-admins, label: one-way user and group sync, step: 2}
    - {from: users, to: adfs-sso-server, label: SAML sign-in, step: 3}
    - {from: adfs-sso-server, to: gcp-platform-admins, label: SAML assertion to Cloud Identity, step: 4}
    - {from: idp, to: entra-id-oidc-provider, label: OIDC token exchange RFC 8693, step: 5}
    - {from: entra-id-oidc-provider, to: employees-pool, label: attribute mapping, step: 6}
    - {from: employees-pool, to: platform-operator-role, label: principalSet IAM binding, step: 7}
    - {from: gcp-platform-admins, to: workload-data-bucket, label: group-based IAM access, step: 8}

- slug: iap-zero-trust-context-aware-access
  title: Zero trust application access with Identity-Aware Proxy
  category: identity
  tags: [iap, beyondcorp, zero trust, access context manager, context-aware access, chrome enterprise premium]
  source: https://docs.cloud.google.com/iap/docs/cloud-iap-context-aware-access-howto
  description: Identity-Aware Proxy sits in front of a global external Application Load Balancer backend and authenticates every request with Google or federated identities, then authorizes it against the IAP-secured Web App User role. Access levels defined in Access Context Manager, based on corporate IP ranges and device posture from Chrome Enterprise Premium, are attached as IAM conditions so only trusted users on healthy devices reach the internal application without a VPN.
  containers:
    - project: prj-p-intranet
      region: us-central1
      vpcs:
        - name: intranet-vpc
          subnets:
            - {name: app-sub, cidr: 10.30.0.0/24, region: us-central1}
  elements:
    - {tf: google_compute_global_forwarding_rule, name: intranet-https-rule, in: project:prj-p-intranet}
    - {tf: google_compute_backend_service, name: intranet-backend, in: vpc:intranet-vpc}
    - {tf: google_compute_region_instance_group_manager, name: intranet-mig, in: subnet:app-sub}
    - {tf: google_iap_client, name: intranet-oauth-client, in: project:prj-p-intranet}
    - {tf: google_access_context_manager_access_policy, name: corp-access-policy, in: project:prj-p-intranet}
    - {tf: google_access_context_manager_access_level, name: trusted-device-corp-ip, in: project:prj-p-intranet}
    - {tf: google_compute_firewall, name: allow-iap-only, in: vpc:intranet-vpc}
  actors: [users, device, idp]
  flows:
    - {from: users, to: intranet-https-rule, label: HTTPS, step: 1}
    - {from: intranet-https-rule, to: intranet-oauth-client, label: IAP sign-in redirect, step: 2}
    - {from: intranet-oauth-client, to: idp, label: Google or federated authentication, step: 3}
    - {from: device, to: trusted-device-corp-ip, label: device posture and IP, step: 4}
    - {from: trusted-device-corp-ip, to: intranet-backend, label: IAM condition on IAP role, step: 5}
    - {from: intranet-backend, to: intranet-mig, label: signed JWT header, step: 6}
    - {from: allow-iap-only, to: intranet-mig, label: allow only 35.235.240.0/20, step: 7}

- slug: vpc-service-controls-data-perimeter
  title: VPC Service Controls perimeter for data exfiltration protection
  category: security
  tags: [vpc service controls, service perimeter, restricted googleapis, access level, data exfiltration]
  source: https://docs.cloud.google.com/vpc-service-controls/docs/overview
  description: A service perimeter encloses the authorized project and its VPC project holding a Cloud Storage bucket with sensitive data and a BigQuery dataset, so those APIs can only be called from inside the perimeter and copies to outside projects are blocked even with stolen credentials. An unauthorized client on the internet, a VM in an unauthorized VPC project using Private Google Access, a VM inside the perimeter calling a service in an unauthorized project and a service-to-service copy into that project are all denied, while the VM inside the perimeter reads and writes the bucket freely.
  containers:
    - project: prj-p-data-restricted
      region: us-central1
      account_at: [1, 2]
      vpcs:
        - name: restricted-vpc
          at: [2, 1]
          subnets:
            - {name: restricted-sub, cidr: 10.40.0.0/24, region: us-central1, at: [1, 1]}
    - project: prj-p-analytics-restricted
      region: us-central1
      account_at: [2, 2]
    - project: prj-unauthorized-vpc
      region: us-central1
      account_at: [2, 1]
      vpcs:
        - name: unauthorized-vpc
          at: [1, 1]
          subnets:
            - {name: unauthorized-sub, cidr: 10.50.0.0/24, region: us-central1, at: [1, 1]}
    - project: prj-unauthorized
      region: us-central1
      account_at: [1, 3, 2, 1]
      vpcs:
        - name: unauthorized-project-vpc
          at: [1, 1]
          subnets:
            - {name: unauthorized-project-sub, cidr: 10.60.0.0/24, region: us-central1, at: [1, 1]}
  elements:
    - {tf: google_access_context_manager_service_perimeter, name: data-perimeter, in: project:prj-p-data-restricted, at: [1, 1]}
    - {tf: google_compute_instance, name: etl-worker, in: subnet:restricted-sub, at: [1, 1]}
    - {tf: google_storage_bucket, name: raw-data-bucket, in: project:prj-p-data-restricted, at: [3, 1]}
    - {tf: google_bigquery_dataset, name: analytics-dataset, in: project:prj-p-analytics-restricted, at: [1, 1]}
    - {tf: google_compute_instance, name: unauthorized-vpc-vm, in: subnet:unauthorized-sub, at: [1, 1]}
    - {tf: google_compute_instance, name: unauthorized-vm, in: subnet:unauthorized-project-sub, at: [1, 1]}
    - {tf: google_storage_bucket, name: unauthorized-bucket, in: project:prj-unauthorized, at: [2, 1]}
  actors: [{type: client, name: Unauthorized Client, at: [1, 1]}]
  flows:
    - {from: Unauthorized Client, to: raw-data-bucket, label: "access from internet: denied", step: 1}
    - {from: unauthorized-vpc-vm, to: raw-data-bucket, label: "private access: denied", step: 2}
    - {from: etl-worker, to: unauthorized-bucket, label: "VM -> GCP service outside perimeter: denied", step: 3}
    - {from: raw-data-bucket, to: unauthorized-bucket, label: "GCP service <-> GCP service copy: denied", step: 4}
    - {from: etl-worker, to: raw-data-bucket, label: inside perimeter, step: 5}
    - {from: etl-worker, to: analytics-dataset, label: load inside perimeter, step: 6}
    - {from: data-perimeter, to: project:prj-p-analytics-restricted, label: perimeter member, step: 7}
    - {from: unauthorized-vm, to: analytics-dataset, label: "query from outside: denied", step: 8}

- slug: cmek-cloud-kms-hsm-key-project
  title: Customer-managed encryption keys with Cloud KMS and Cloud HSM
  category: security
  tags: [cmek, cloud kms, cloud hsm, key ring, separation of duties, encryption at rest]
  source: https://docs.cloud.google.com/kms/docs/cmek
  description: A dedicated key project owned by the security team hosts key rings whose crypto keys use SOFTWARE or FIPS 140-2 Level 3 HSM protection levels, kept separate from the workload projects that consume them. Cloud Storage buckets, Cloud SQL instances, Compute Engine disks and BigQuery datasets in the workload project reference those keys as CMEK, and per-service agents are granted only the encrypter/decrypter role so key administrators and data owners are different principals.
  containers:
    - project: prj-c-kms
      region: us-central1
    - project: prj-p-workload
      region: us-central1
      vpcs:
        - name: workload-vpc
          subnets:
            - {name: app-sub, cidr: 10.50.0.0/24, region: us-central1}
  elements:
    - {tf: google_kms_key_ring, name: us-central1-key-ring, in: project:prj-c-kms}
    - {tf: google_kms_crypto_key, name: storage-hsm-key, in: project:prj-c-kms}
    - {tf: google_kms_crypto_key, name: database-hsm-key, in: project:prj-c-kms}
    - {tf: google_kms_crypto_key, name: disk-software-key, in: project:prj-c-kms}
    - {tf: google_storage_bucket, name: cmek-bucket, in: project:prj-p-workload}
    - {tf: google_sql_database_instance, name: cmek-postgres, in: vpc:workload-vpc}
    - {tf: google_compute_disk, name: cmek-data-disk, in: subnet:app-sub}
    - {tf: google_compute_instance, name: app-vm, in: subnet:app-sub}
    - {tf: google_bigquery_dataset, name: cmek-dataset, in: project:prj-p-workload}
  actors: [users]
  flows:
    - {from: users, to: us-central1-key-ring, label: key admin rotates keys, step: 1}
    - {from: cmek-bucket, to: storage-hsm-key, label: CMEK wrap/unwrap, step: 2}
    - {from: cmek-postgres, to: database-hsm-key, label: CMEK, step: 3}
    - {from: cmek-data-disk, to: disk-software-key, label: CMEK, step: 4}
    - {from: cmek-dataset, to: storage-hsm-key, label: CMEK, step: 5}
    - {from: app-vm, to: cmek-bucket, label: read/write objects, step: 6}
    - {from: app-vm, to: cmek-postgres, label: SQL, step: 7}

- slug: secret-manager-workload-secrets
  title: Application secrets with Secret Manager and rotation notifications
  category: security
  tags: [secret manager, secret versions, rotation, cmek, workload identity, cloud run, gke]
  source: https://docs.cloud.google.com/secret-manager/docs/overview
  description: Application credentials are stored as versioned Secret Manager secrets with user-managed replication to the serving regions and encrypted with a Cloud KMS CMEK key, and access is granted per secret to the workload service accounts of a Cloud Run service and a GKE cluster. A rotation schedule publishes to a Pub/Sub topic that triggers a Cloud Run function to generate a new database password, add a new secret version and update the Cloud SQL user.
  containers:
    - project: prj-c-secrets
      region: us-central1
    - project: prj-p-app
      region: us-central1
      vpcs:
        - name: app-vpc
          subnets:
            - {name: gke-sub, cidr: 10.60.0.0/20, region: us-central1}
  elements:
    - {tf: google_secret_manager_secret, name: db-password-secret, in: project:prj-c-secrets}
    - {tf: google_secret_manager_secret, name: api-key-secret, in: project:prj-c-secrets}
    - {tf: google_kms_crypto_key, name: secrets-cmek-key, in: project:prj-c-secrets}
    - {tf: google_pubsub_topic, name: secret-rotation-topic, in: project:prj-c-secrets}
    - {tf: google_cloudfunctions2_function, name: rotate-db-password-fn, in: project:prj-c-secrets}
    - {tf: google_service_account, name: app-runtime-sa, in: project:prj-p-app}
    - {tf: google_cloud_run_v2_service, name: api-service, in: project:prj-p-app}
    - {tf: google_container_cluster, name: app-gke, in: subnet:gke-sub}
    - {tf: google_sql_database_instance, name: app-postgres, in: vpc:app-vpc}
  actors: [users]
  flows:
    - {from: db-password-secret, to: secrets-cmek-key, label: CMEK, step: 1}
    - {from: api-service, to: db-password-secret, label: accessVersion as app-runtime-sa, step: 2}
    - {from: app-gke, to: api-key-secret, label: mounted via Secret Manager add-on, step: 3}
    - {from: api-service, to: app-postgres, label: SQL with fetched password, step: 4}
    - {from: db-password-secret, to: secret-rotation-topic, label: rotation schedule event, step: 5}
    - {from: secret-rotation-topic, to: rotate-db-password-fn, link: google_cloudfunctions2_function}
    - {from: rotate-db-password-fn, to: app-postgres, label: ALTER USER password, step: 6}
    - {from: rotate-db-password-fn, to: db-password-secret, label: add new version, step: 7}
    - {from: users, to: db-password-secret, label: secret admin IAM, step: 8}

- slug: scc-findings-pubsub-remediation
  title: Security Command Center findings to Pub/Sub with automated remediation
  category: security
  tags: [security command center, notification config, pub/sub, cloud run functions, auto remediation, bigquery]
  source: https://docs.cloud.google.com/security-command-center/docs/how-to-notifications
  description: An organization-level Security Command Center NotificationConfig with a findings filter publishes new high and critical findings to a Pub/Sub topic in near real time. A Cloud Run function subscribed to the topic enriches and remediates findings such as public buckets or open firewall rules, forwards the event to a chat webhook, and a BigQuery export sink keeps findings history for dashboards.
  containers:
    - project: prj-c-scc
      region: us-central1
    - project: prj-p-workload
      region: us-central1
      vpcs:
        - name: workload-vpc
          cidr: 10.70.0.0/16
  elements:
    - {tf: google_scc_notification_config, name: high-critical-findings-notification, in: project:prj-c-scc}
    - {tf: google_pubsub_topic, name: scc-findings-topic, in: project:prj-c-scc}
    - {tf: google_pubsub_subscription, name: scc-findings-sub, in: project:prj-c-scc}
    - {tf: google_cloudfunctions2_function, name: remediate-findings-fn, in: project:prj-c-scc}
    - {tf: google_bigquery_dataset, name: scc-findings-dataset, in: project:prj-c-scc}
    - {tf: google_monitoring_notification_channel, name: security-oncall-channel, in: project:prj-c-scc}
    - {tf: google_storage_bucket, name: exposed-bucket, in: project:prj-p-workload}
    - {tf: google_compute_firewall, name: open-ssh-rule, in: vpc:workload-vpc}
  actors: [users, saas]
  flows:
    - {from: exposed-bucket, to: high-critical-findings-notification, label: PUBLIC_BUCKET_ACL finding, step: 1}
    - {from: open-ssh-rule, to: high-critical-findings-notification, label: OPEN_SSH_PORT finding, step: 1}
    - {from: high-critical-findings-notification, to: scc-findings-topic, label: filtered findings, step: 2}
    - {from: scc-findings-topic, to: scc-findings-sub, link: google_pubsub_subscription}
    - {from: scc-findings-sub, to: remediate-findings-fn, label: push trigger, step: 3}
    - {from: remediate-findings-fn, to: exposed-bucket, label: remove allUsers binding, step: 4}
    - {from: remediate-findings-fn, to: open-ssh-rule, label: disable rule, step: 4}
    - {from: remediate-findings-fn, to: saas, label: chat webhook, step: 5}
    - {from: high-critical-findings-notification, to: scc-findings-dataset, label: BigQuery export, step: 6}
    - {from: security-oncall-channel, to: users, label: page on-call, step: 7}

- slug: cloud-armor-waf-ddos-edge
  title: Cloud Armor WAF and DDoS protection at the edge
  category: security
  tags: [cloud armor, waf, owasp, ddos, rate limiting, adaptive protection, global load balancer]
  source: https://docs.cloud.google.com/armor/docs/cloud-armor-overview
  description: Users reach the anycast frontend of a global external Application Load Balancer through their ISP, and the request terminates at the nearest Google Edge point of presence where a Cloud Armor security policy enforces IP allow/deny lists, preconfigured OWASP Core Rule Set WAF rules, rate limiting and geo-based rules before any traffic crosses into Google's network. Always-on Layer 3/4 DDoS mitigation absorbs volumetric attacks at the edge, Adaptive Protection suggests Layer 7 mitigation rules, and only allowed requests travel over the Google backbone to the backend service, which spreads them across regional managed instance groups in Google data centers.
  containers:
    - project: prj-p-web
      region: us-central1
      groups: [{label: Cloud Edge, at: [2, 1]}]
      vpcs:
        - name: web-vpc
          at: [2, 3]
          subnets:
            - {name: web-sub-usc1, cidr: 10.80.0.0/24, region: us-central1, at: [1, 1]}
            - {name: web-sub-euw1, cidr: 10.80.1.0/24, region: europe-west1, at: [2, 1]}
            - {name: web-sub-apse1, cidr: 10.80.2.0/24, region: asia-southeast1, at: [3, 1]}
  elements:
    - {tf: google_compute_security_policy, name: web-waf-policy, in: project:prj-p-web, at: [1, 1, 1, 3]}
    - {tf: google_compute_target_https_proxy, name: edge-pop-1, in: group:Cloud Edge, at: [1, 1]}
    - {tf: google_compute_target_https_proxy, name: edge-pop-2, in: group:Cloud Edge, at: [2, 1]}
    - {tf: google_compute_target_https_proxy, name: edge-pop-3, in: group:Cloud Edge, at: [3, 1]}
    - {tf: google_compute_target_https_proxy, name: edge-pop-4, in: group:Cloud Edge, at: [4, 1]}
    - {tf: google_compute_global_forwarding_rule, name: web-https-rule, in: group:Cloud Edge, at: [1, 2, 4, 1]}
