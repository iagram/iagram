- slug: cloud-sql-ha-cross-region-replica-dr
  title: Cloud SQL regional HA with cross-region replica for DR
  category: database
  tags: [cloud sql, high availability, standby, cross-region replica, promotion, rpo, rto]
  source: https://docs.cloud.google.com/sql/docs/postgres/intro-to-cloud-sql-disaster-recovery
  description: The application writes through a global Cloud DNS name (myWriteEndpoint) that resolves to the primary Cloud SQL instance, which runs as a regional HA pair with a synchronous standby in a second zone of region R1 (us-central1), while a cross-region read replica in zone C of region R2 (us-east1) receives asynchronous replication. On a regional outage the replica is promoted to a standalone primary and the DNS record is repointed to it, accepting a small RPO from replication lag; after recovery a new standby and replica are rebuilt to restore the topology.
  containers:
    - project: prj-p-orders
      region: us-central1
      vpcs:
        - name: orders-vpc
          at: [1, 2, 2, 1]
  elements:
    - {tf: google_dns_managed_zone, name: orders-private-zone, in: project:prj-p-orders, at: [1, 1]}
    - {tf: google_dns_record_set, name: db-cname-record, in: project:prj-p-orders, at: [2, 1]}
    - {tf: google_sql_database_instance, name: orders-pg-primary-ha, in: vpc:orders-vpc, at: [1, 1]}
    - {tf: google_sql_database_instance, name: orders-pg-standby, in: vpc:orders-vpc, at: [1, 2]}
    - {tf: google_sql_database_instance, name: orders-pg-replica-use1, in: vpc:orders-vpc, at: [2, 1]}
  actors: [{type: client, name: Application, at: [1, 1]}]
  flows:
    - {from: Application, to: db-cname-record, label: myWriteEndpoint global DNS name, step: 1}
    - {from: orders-private-zone, to: db-cname-record, label: hosts record}
    - {from: db-cname-record, to: orders-pg-primary-ha, label: resolves to primary, step: 2}
    - {from: orders-pg-primary-ha, to: orders-pg-standby, label: synchronous replication to zone B standby, step: 3}
    - {from: orders-pg-primary-ha, to: orders-pg-replica-use1, label: asynchronous replication, step: 4}
    - {from: db-cname-record, to: orders-pg-replica-use1, label: repointed after promotion, step: 5}

- slug: backup-dr-service-vault
