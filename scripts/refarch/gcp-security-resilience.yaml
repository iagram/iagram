    - {tf: google_compute_backend_service, name: app-global-backend, in: vpc:global-app-vpc, at: [1, 1, 1, 2]}
    - {tf: google_compute_region_instance_group_manager, name: web-mig-use4, in: subnet:app-sub-use4, at: [1, 1]}
    - {tf: google_compute_forwarding_rule, name: app-ilb-use4, in: subnet:app-sub-use4, at: [2, 1]}
    - {tf: google_compute_region_instance_group_manager, name: app-mig-use4, in: subnet:app-sub-use4, at: [3, 1]}
    - {tf: google_compute_region_instance_group_manager, name: web-mig-use1, in: subnet:app-sub-use1, at: [1, 1]}
    - {tf: google_compute_forwarding_rule, name: app-ilb-use1, in: subnet:app-sub-use1, at: [2, 1]}
    - {tf: google_compute_region_instance_group_manager, name: app-mig-use1, in: subnet:app-sub-use1, at: [3, 1]}
    - {tf: google_spanner_instance, name: orders-spanner-nam3, in: project:prj-p-global-app, at: [3, 1]}
