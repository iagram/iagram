    - {from: web-mig-use4, to: app-ilb-use4, label: regional internal load balancer, step: 4}
    - {from: web-mig-use1, to: app-ilb-use1, label: regional internal load balancer, step: 4}
    - {from: app-ilb-use4, to: app-mig-use4, label: application tier, step: 5}
    - {from: app-ilb-use1, to: app-mig-use1, label: application tier, step: 5}
    - {from: app-mig-use4, to: orders-db, label: strongly consistent reads and writes, step: 6}
    - {from: app-mig-use1, to: orders-db, label: strongly consistent reads and writes, step: 6}
    - {from: orders-spanner-nam3, to: orders-db, label: nam3 read-write replicas plus witness, step: 7}
