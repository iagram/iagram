- slug: hub-and-spoke-ncc
  title: Hub-and-spoke network with Network Connectivity Center
  category: networking
  tags: [ncc, hub and spoke, vpc spokes, cloud nat, hybrid]
  source: https://docs.cloud.google.com/architecture/deploy-hub-spoke-vpc-network-topology
  description: A single project holds a hub (routing) VPC with a shared-services VM and two workload VPCs, each with a VM in its subnet, that all attach to a Network Connectivity Center hub resource for transitive, full-bandwidth routing between the spokes. Every VPC keeps its own Cloud NAT gateway for outbound internet, and the second workload VPC also hosts a GKE cluster.
  containers:
    - project: hub-spoke-prj
      region: europe-west1
      account_at: [1, 1]
      vpcs:
        - name: hub
          at: [1, 1, 1, 2]
          subnets: [{name: hub-sub, cidr: 10.0.1.0/24, region: europe-west1, at: [1, 1, 2, 1]}]
        - name: spoke-a
          at: [3, 1]
          subnets: [{name: spoke-a-sub, cidr: 10.1.1.0/24, region: europe-west1, at: [1, 1]}]
        - name: spoke-b
          at: [3, 2]
          subnets: [{name: spoke-b-sub, cidr: 10.2.1.0/24, region: europe-west1, at: [1, 1]}]
  elements:
    - {tf: google_compute_instance, name: shared-svc-vm, in: subnet:hub-sub, at: [1, 1]}
    - {tf: google_compute_router_nat, name: hub-nat, in: vpc:hub, at: [2, 2]}
    - {tf: google_network_connectivity_hub, name: ncc-hub, in: project:hub-spoke-prj, at: [2, 1, 1, 2]}
    - {tf: google_compute_instance, name: workload-a-vm, in: subnet:spoke-a-sub, at: [1, 1]}
    - {tf: google_compute_router_nat, name: spoke-a-nat, in: vpc:spoke-a, at: [2, 1]}
    - {tf: google_compute_instance, name: workload-b-vm, in: subnet:spoke-b-sub, at: [1, 1]}
    - {tf: google_container_cluster, name: workload-b-gke, in: subnet:spoke-b-sub, at: [2, 1]}
    - {tf: google_compute_router_nat, name: spoke-b-nat, in: vpc:spoke-b, at: [2, 1]}
  flows:
    - {from: ncc-hub, to: vpc:hub, link: google_network_connectivity_spoke}
    - {from: ncc-hub, to: vpc:spoke-a, link: google_network_connectivity_spoke}
    - {from: ncc-hub, to: vpc:spoke-b, link: google_network_connectivity_spoke}
    - {from: workload-a-vm, to: workload-b-vm, label: transitive via NCC, step: 1}
    - {from: workload-a-vm, to: shared-svc-vm, label: shared services, step: 2}

- slug: hybrid-interconnect-shared-vpc
  title: Hybrid connectivity with Cloud Interconnect, HA VPN and Shared VPC
  category: networking
  tags: [cloud interconnect, ha vpn, shared vpc, cloud router, bgp, hybrid]
  source: https://docs.cloud.google.com/architecture/network-hybrid-multicloud
  description: An on-premises data center connects to a Shared VPC host project over redundant Dedicated or Partner Interconnect VLAN attachments, with HA VPN as an encrypted backup path, and Cloud Router exchanges routes over BGP. Service projects attach to the Shared VPC so workloads consume the hybrid link and centrally managed subnets without owning network resources.
  containers:
    - datacenter: on-prem-dc
    - project: net-host-prj
      region: europe-west1
      vpcs:
        - name: shared-vpc
          subnets:
            - {name: prod-sub-ew1, cidr: 10.10.0.0/20, region: europe-west1}
            - {name: prod-sub-ew4, cidr: 10.20.0.0/20, region: europe-west4}
    - project: app-svc-prj
      region: europe-west1
  elements:
    - {tf: google_compute_interconnect_attachment, name: vlan-attach-1, in: vpc:shared-vpc}
    - {tf: google_compute_interconnect_attachment, name: vlan-attach-2, in: vpc:shared-vpc}
    - {tf: google_compute_router, name: hybrid-router, in: vpc:shared-vpc}
    - {tf: google_compute_ha_vpn_gateway, name: backup-vpn-gw, in: vpc:shared-vpc}
    - {tf: google_compute_external_vpn_gateway, name: onprem-vpn-peer, in: datacenter:on-prem-dc}
    - {tf: google_compute_instance, name: app-vm, in: subnet:prod-sub-ew1}
    - {tf: google_dns_managed_zone, name: onprem-forwarding-zone, in: vpc:shared-vpc}
  actors: [datacenter, users]
  flows:
    - {from: datacenter, to: vlan-attach-1, label: Dedicated Interconnect 10G, step: 1}
    - {from: datacenter, to: vlan-attach-2, label: redundant VLAN attachment, step: 1}
    - {from: onprem-vpn-peer, to: backup-vpn-gw, label: HA VPN backup, step: 2}
    - {from: vlan-attach-1, to: hybrid-router, label: BGP, step: 3}
    - {from: hybrid-router, to: app-vm, label: dynamic routes to subnets, step: 4}
    - {from: project:app-svc-prj, to: vpc:shared-vpc, label: Shared VPC service project}
    - {from: app-vm, to: onprem-forwarding-zone, label: DNS forwarding to on-prem, step: 5}

- slug: three-tier-web-app
  title: Three-tier web app with global load balancer, Cloud Run and Cloud SQL
  category: web
  tags: [three tier, application load balancer, cloud run, cloud sql, memorystore]
  source: https://docs.cloud.google.com/application-design-center/docs/three-tier-web-app
  description: A regional external Application Load Balancer fronts a Cloud Run frontend service, which calls a Cloud Run backend service through a second, internal regional load balancer. The backend reads through a Memorystore for Redis cache and falls back to a Cloud SQL for PostgreSQL database.
  containers:
    - project: web-app-prj
      region: europe-west1
      account_at: [2, 1]
      vpcs:
        - {name: app-vpc, at: [5, 1, 1, 2]}
  elements:
    - {tf: google_compute_forwarding_rule, name: regional-lb-frontend, in: project:web-app-prj, at: [1, 1, 1, 2]}
    - {tf: google_compute_forwarding_rule, name: regional-lb-backend, in: project:web-app-prj, at: [2, 1, 1, 2]}
    - {tf: google_cloud_run_v2_service, name: frontend-service-cloud-run, in: project:web-app-prj, at: [3, 1, 1, 2]}
    - {tf: google_cloud_run_v2_service, name: backend-service-cloud-run, in: project:web-app-prj, at: [4, 1, 1, 2]}
    - {tf: google_sql_database_instance, name: database-postgresql, in: vpc:app-vpc, at: [1, 1]}
    - {tf: google_redis_instance, name: memorystore, in: vpc:app-vpc, at: [1, 2]}
  actors: [users]
  flows:
    - {from: users, to: regional-lb-frontend, label: HTTPS, step: 1}
    - {from: regional-lb-frontend, to: frontend-service-cloud-run, label: serverless NEG, step: 2}
    - {from: frontend-service-cloud-run, to: regional-lb-backend, label: REST/JSON, step: 3}
    - {from: regional-lb-backend, to: backend-service-cloud-run, label: serverless NEG, step: 4}
    - {from: backend-service-cloud-run, to: database-postgresql, label: SQL, step: 5}
    - {from: backend-service-cloud-run, to: memorystore, label: Redis cache, step: 6}

- slug: static-site-storage-cdn
  title: Static website with Cloud Storage, Cloud CDN and HTTPS load balancer
  category: web
  tags: [static site, cloud storage, cloud cdn, backend bucket, cloud dns]
  source: https://docs.cloud.google.com/storage/docs/hosting-static-website
  description: Static assets sit in a Cloud Storage bucket exposed through an external Application Load Balancer backend bucket with Cloud CDN enabled, because Cloud Storage alone cannot serve custom domains over HTTPS. A Google-managed SSL certificate terminates TLS and a Cloud DNS A record points the domain at the load balancer anycast IP.
  containers:
    - project: static-site-prj
      region: europe-west1
  elements:
    - {tf: google_storage_bucket, name: www-site-bucket, in: project:static-site-prj}
    - {tf: google_compute_backend_bucket, name: site-backend-bucket, in: project:static-site-prj}
    - {tf: google_compute_url_map, name: site-url-map, in: project:static-site-prj}
    - {tf: google_compute_managed_ssl_certificate, name: site-cert, in: project:static-site-prj}
    - {tf: google_compute_target_https_proxy, name: site-https-proxy, in: project:static-site-prj}
    - {tf: google_compute_global_forwarding_rule, name: site-https-rule, in: project:static-site-prj}
    - {tf: google_dns_managed_zone, name: example-zone, in: project:static-site-prj}
  actors: [users]
  flows:
    - {from: users, to: example-zone, label: DNS lookup, step: 1}
    - {from: users, to: site-https-rule, label: HTTPS 443, step: 2}
    - {from: site-https-rule, to: site-https-proxy, label: TLS termination, step: 3}
    - {from: site-cert, to: site-https-proxy, label: managed certificate}
    - {from: site-https-proxy, to: site-url-map, label: route, step: 4}
    - {from: site-url-map, to: site-backend-bucket, label: Cloud CDN cache, step: 5}
    - {from: site-backend-bucket, to: www-site-bucket, label: origin fetch on miss, step: 6}

- slug: pubsub-fanout-cloud-run
  title: Event-driven fan-out with Pub/Sub, Eventarc and Cloud Run
  category: serverless
  tags: [pubsub, cloud run, eventarc, fan out, push subscription, cloud functions]
  source: https://docs.cloud.google.com/run/docs/tutorials/pubsub
  description: Producers publish to a Pub/Sub topic whose push subscriptions deliver each message to Cloud Run services and a Cloud Run function in parallel, authenticated with OIDC tokens from a dedicated invoker service account. An Eventarc trigger adds Cloud Storage object-finalized events to the same topic-driven flow, so uploads and application events share one serverless processing path.
  containers:
    - project: events-prj
      region: europe-west1
  elements:
    - {tf: google_pubsub_topic, name: orders-topic, in: project:events-prj}
    - {tf: google_pubsub_subscription, name: orders-push-billing, in: project:events-prj}
    - {tf: google_pubsub_subscription, name: orders-push-notify, in: project:events-prj}
    - {tf: google_cloud_run_v2_service, name: billing-svc, in: project:events-prj}
    - {tf: google_cloud_run_v2_service, name: notify-svc, in: project:events-prj}
    - {tf: google_cloudfunctions2_function, name: audit-fn, in: project:events-prj}
    - {tf: google_eventarc_trigger, name: upload-finalized-trigger, in: project:events-prj}
    - {tf: google_storage_bucket, name: uploads-bucket, in: project:events-prj}
    - {tf: google_artifact_registry_repository, name: images-repo, in: project:events-prj}
  actors: [client, users]
  flows:
    - {from: client, to: orders-topic, label: publish message, step: 1}
    - {from: orders-topic, to: orders-push-billing, label: fan-out, step: 2}
    - {from: orders-topic, to: orders-push-notify, label: fan-out, step: 2}
    - {from: orders-push-billing, to: billing-svc, label: HTTPS push + OIDC, step: 3}
    - {from: orders-push-notify, to: notify-svc, label: HTTPS push + OIDC, step: 3}
    - {from: users, to: uploads-bucket, label: upload object, step: 4}
    - {from: uploads-bucket, to: upload-finalized-trigger, label: object.finalized event, step: 5}
    - {from: upload-finalized-trigger, to: audit-fn, label: CloudEvent, step: 6}
    - {from: images-repo, to: billing-svc, label: container image}

- slug: api-gateway-cloud-run-firestore
  title: Serverless API with API Gateway, Cloud Run and Firestore
  category: serverless
  tags: [api gateway, cloud run, firestore, openapi, serverless api]
  source: https://docs.cloud.google.com/api-gateway/docs/get-started-cloud-run
  description: An API front door (API Gateway in the reference; drawn here as the global load balancer, API Gateway being google-beta only) validates API keys and JWTs and routes requests to a Cloud Run service that it invokes with a service account holding run.invoker. The Cloud Run backend persists documents in a Firestore native-mode database and emits structured logs and metrics to Cloud Logging and Monitoring.
  containers:
    - project: api-prj
      region: europe-west1
  elements:
    - {tf: google_compute_global_forwarding_rule, name: orders-gateway, in: project:api-prj}
    - {tf: google_cloud_run_v2_service, name: orders-backend, in: project:api-prj}
    - {tf: google_service_account, name: gateway-invoker-sa, in: project:api-prj}
    - {tf: google_firestore_database, name: orders-db, in: project:api-prj}
    - {tf: google_artifact_registry_repository, name: api-images, in: project:api-prj}
  actors: [mobile, client, idp]
  flows:
    - {from: mobile, to: orders-gateway, label: HTTPS + API key / JWT, step: 1}
    - {from: client, to: orders-gateway, label: HTTPS, step: 1}
    - {from: idp, to: orders-gateway, label: JWT validation (JWKS)}
    - {from: orders-gateway, to: orders-backend, label: x-google-backend, OIDC invoker, step: 3}
    - {from: gateway-invoker-sa, to: orders-backend, label: run.invoker}
    - {from: orders-backend, to: orders-db, label: Firestore reads/writes, step: 4}
    - {from: api-images, to: orders-backend, label: container image}

- slug: gke-microservices-gateway
  title: Microservices on GKE exposed through GKE Gateway and Cloud Service Mesh
  category: containers
  tags: [gke, microservices, gateway api, service mesh, cloud armor, online boutique]
  source: https://docs.cloud.google.com/architecture/exposing-service-mesh-apps-through-gke-ingress
  description: The Online Boutique microservices run on a GKE cluster inside Cloud Service Mesh, and an external load balancer provisioned by GKE Gateway sends client traffic to the mesh ingress gateway proxies. The ingress gateway routes each request to the application pods, whose sidecar proxies handle mTLS and application-level routing between services.
  containers:
    - project: gke-prj
      region: europe-west1
      account_at: [1, 2]
      groups: [{label: Cloud Service Mesh, at: [1, 3, 2, 1]}]
      vpcs:
        - name: gke-vpc
          at: [1, 2, 2, 1]
          subnets: [{name: gke-sub, cidr: 10.40.0.0/20, region: europe-west1, at: [1, 1]}]
  elements:
    - {tf: google_compute_global_forwarding_rule, name: gke-gateway-lb, in: project:gke-prj, at: [1, 1]}
    - {tf: google_compute_backend_service, name: mesh-ingress-backend, in: project:gke-prj, at: [2, 1]}
    - {tf: google_container_cluster, name: boutique-cluster, in: subnet:gke-sub, at: [1, 1]}
    - {tf: google_network_services_gateway, name: mesh-ingress-gateway, in: group:Cloud Service Mesh, at: [1, 1]}
    - {tf: google_container_node_pool, name: boutique-app-pods, in: group:Cloud Service Mesh, at: [1, 2]}
    - {tf: google_network_services_mesh, name: boutique-mesh, in: group:Cloud Service Mesh, at: [2, 1, 1, 2]}
  actors: [{type: client, name: external-client, at: [1, 1]}]
  flows:
    - {from: external-client, to: gke-gateway-lb, label: HTTPS, step: 1}
    - {from: gke-gateway-lb, to: mesh-ingress-backend, label: container NEG, step: 2}
    - {from: mesh-ingress-backend, to: mesh-ingress-gateway, label: ingress gateway proxies, step: 3}
    - {from: mesh-ingress-gateway, to: boutique-app-pods, label: mTLS to sidecar proxies, step: 4}
    - {from: boutique-mesh, to: boutique-cluster, label: mesh runs on the cluster}

- slug: lakehouse-storage-dataproc-bigquery
  title: Data lakehouse with Cloud Storage, Dataproc Spark and BigQuery
  category: data
  tags: [data lake, lakehouse, iceberg, dataproc, bigquery, biglake, cloud storage]
  source: https://docs.cloud.google.com/dataproc/docs/guides/create-lakehouse
  description: Spark jobs on a Dataproc cluster read and write Apache Iceberg tables whose data files live in a Cloud Storage bucket, while an Iceberg REST catalog (the lakehouse runtime catalog, here a Dataproc Metastore service) holds the table metadata. BigQuery queries the same Iceberg tables through the catalog as BigLake tables, so batch and interactive engines share one copy of the data.
  containers:
    - project: lake-prj
      region: europe-west1
      account_at: [1, 1]
      groups: [{label: lakehouse, at: [1, 2, 2, 1]}]
      vpcs:
        - name: lake-vpc
          at: [1, 1, 2, 1]
          subnets: [{name: dataproc-sub, cidr: 10.50.0.0/22, region: europe-west1, at: [1, 1]}]
  elements:
    - {tf: google_dataproc_cluster, name: spark-cluster, in: subnet:dataproc-sub, at: [1, 1]}
    - {tf: google_dataproc_metastore_service, name: iceberg-rest-catalog, in: group:lakehouse, at: [1, 1]}
    - {tf: google_storage_bucket, name: iceberg-warehouse-bucket, in: group:lakehouse, at: [2, 1]}
    - {tf: google_bigquery_dataset, name: analytics_ds, in: project:lake-prj, at: [1, 3]}
  flows:
    - {from: spark-cluster, to: iceberg-rest-catalog, label: Iceberg REST catalog, step: 1}
    - {from: spark-cluster, to: iceberg-warehouse-bucket, label: read / write Iceberg data, step: 2}
    - {from: analytics_ds, to: iceberg-rest-catalog, label: BigLake Iceberg tables, step: 3}

- slug: streaming-pubsub-dataflow-bigquery
  title: Streaming analytics with Pub/Sub, Dataflow and BigQuery
  category: data
  tags: [streaming, pubsub, dataflow, bigquery, apache beam, real time]
  source: https://docs.cloud.google.com/dataflow/docs/tutorials/dataflow-stream-to-bigquery
  description: Event producers publish JSON to a Pub/Sub topic, a Dataflow streaming job built from the Pub/Sub Subscription to BigQuery template reads the subscription, applies optional UDF transforms and streams rows into a BigQuery table. Failed records go to a dead-letter table, a Cloud Storage bucket holds temp and staging files, and Looker Studio dashboards query the warehouse.
  containers:
    - project: stream-prj
      region: europe-west1
      vpcs:
        - name: stream-vpc
          subnets: [{name: dataflow-sub, cidr: 10.60.0.0/22, region: europe-west1}]
  elements:
    - {tf: google_pubsub_topic, name: clickstream-topic, in: project:stream-prj}
    - {tf: google_pubsub_subscription, name: clickstream-sub, in: project:stream-prj}
    - {tf: google_dataflow_job, name: pubsub-to-bq-stream, in: subnet:dataflow-sub}
    - {tf: google_storage_bucket, name: dataflow-temp-bucket, in: project:stream-prj}
    - {tf: google_bigquery_dataset, name: events_ds, in: project:stream-prj}
    - {tf: google_cloud_scheduler_job, name: sample-publisher, in: project:stream-prj}
  actors: [device, users]
  flows:
    - {from: device, to: clickstream-topic, label: publish events, step: 1}
    - {from: sample-publisher, to: clickstream-topic, label: synthetic messages}
    - {from: clickstream-topic, to: clickstream-sub, label: pull subscription, step: 2}
    - {from: clickstream-sub, to: pubsub-to-bq-stream, label: PubsubIO read, step: 3}
    - {from: pubsub-to-bq-stream, to: dataflow-temp-bucket, label: temp / staging}
    - {from: pubsub-to-bq-stream, to: events_ds, label: streaming inserts + dead-letter table, step: 4}
    - {from: users, to: events_ds, label: BI queries, step: 5}

- slug: rag-vertex-ai
  title: RAG for generative AI with Vertex AI, Vector Search and Cloud Run
  category: ml
  tags: [rag, vertex ai, vector search, embeddings, gemini, cloud run, alloydb]
  source: https://docs.cloud.google.com/architecture/rag-capable-gen-ai-app-using-vertex-ai
  description: Uploaded documents land in Cloud Storage and trigger Pub/Sub-driven Cloud Run functions in the data ingestion subsystem, which chunk the text, generate Vertex AI embeddings and store vectors in the databases tier (Vertex AI Vector Search and AlloyDB pgvector). The serving subsystem on Cloud Run embeds each user query, retrieves nearest neighbours, grounds a Gemini prompt with the results and hands the answer to the quality evaluation subsystem, which also runs on an external evaluation trigger and logs scores to BigQuery.
  containers:
    - project: genai-prj
      region: europe-west4
      account_at: [1, 2, 3, 1]
      groups:
        - {label: data ingestion, at: [1, 1, 1, 2]}
        - {label: databases, at: [2, 1, 1, 2]}
        - {label: quality evaluation, at: [3, 1, 1, 2]}
        - {label: serving, at: [1, 3, 3, 1]}
  elements:
    - {tf: google_storage_bucket, name: docs-ingest-bucket, in: group:data ingestion, at: [1, 1]}
    - {tf: google_pubsub_topic, name: new-document-topic, in: group:data ingestion, at: [1, 2]}
    - {tf: google_cloudfunctions2_function, name: chunk-embed-fn, in: group:data ingestion, at: [1, 3]}
    - {tf: google_vertex_ai_index, name: docs-vector-index, in: group:databases, at: [1, 1]}
    - {tf: google_alloydb_cluster, name: rag-alloydb, in: group:databases, at: [1, 2]}
    - {tf: google_cloud_run_v2_service, name: rag-serving-svc, in: group:serving, at: [1, 1]}
    - {tf: google_cloud_run_v2_service, name: quality-eval-svc, in: group:quality evaluation, at: [1, 1]}
    - {tf: google_bigquery_dataset, name: rag_logs_ds, in: group:quality evaluation, at: [1, 2]}
  actors: [{type: client, name: data-upload, at: [1, 1]}, {type: server, name: evaluation-trigger, at: [3, 1]}, {type: users, name: application-users, at: [1, 3]}]
  flows:
    - {from: data-upload, to: docs-ingest-bucket, label: "data upload (RAG data, evaluation prompts)", step: 1}
    - {from: docs-ingest-bucket, to: new-document-topic, label: object notification, step: 2}
    - {from: new-document-topic, to: chunk-embed-fn, label: trigger, step: 3}
    - {from: chunk-embed-fn, to: docs-vector-index, label: "Vertex AI embeddings, upsert vectors", step: 4}
    - {from: chunk-embed-fn, to: rag-alloydb, label: store chunks + pgvector, step: 4}
    - {from: application-users, to: rag-serving-svc, label: request / response, step: 5}
    - {from: rag-serving-svc, to: docs-vector-index, label: nearest-neighbour query, step: 6}
    - {from: rag-serving-svc, to: rag-alloydb, label: fetch matching chunks, step: 6}
    - {from: rag-serving-svc, to: quality-eval-svc, label: "Gemini answer, async evaluation", step: 7}
    - {from: evaluation-trigger, to: quality-eval-svc, label: evaluation trigger}
    - {from: quality-eval-svc, to: rag_logs_ds, label: scores and logs, step: 8}

- slug: global-multi-region-spanner
  title: Global multi-region deployment with Compute Engine and Spanner
  category: resilience
  tags: [multi region, spanner, global load balancer, active active, managed instance groups]
  source: https://docs.cloud.google.com/architecture/global-deployment-compute-engine-spanner
  description: A global external Application Load Balancer sends users to the nearest healthy of three regions, where regional managed instance groups spanning three zones run the web tier and a cross-region internal load balancer forwards to application-tier MIGs. All regions read and write a synchronously replicated multi-region Spanner instance, so a full regional outage fails over without data loss.
  containers:
    - project: global-app-prj
      region: europe-west1
      account_at: [2, 1]
      vpcs:
        - name: global-vpc
          at: [2, 1]
          subnets:
            - {name: web-sub-ew1, cidr: 10.80.1.0/24, region: europe-west1, at: [1, 1]}
            - {name: app-sub-ew1, cidr: 10.80.2.0/24, region: europe-west1, at: [3, 1]}
            - {name: web-sub-ew4, cidr: 10.81.1.0/24, region: europe-west4, at: [1, 2]}
            - {name: app-sub-ew4, cidr: 10.81.2.0/24, region: europe-west4, at: [3, 2]}
            - {name: web-sub-ew3, cidr: 10.82.1.0/24, region: europe-west3, at: [1, 3]}
            - {name: app-sub-ew3, cidr: 10.82.2.0/24, region: europe-west3, at: [3, 3]}
  elements:
    - {tf: google_compute_global_forwarding_rule, name: global-https-lb, in: project:global-app-prj, at: [1, 1]}
    - {tf: google_compute_region_instance_group_manager, name: web-mig-ew1, in: subnet:web-sub-ew1, at: [1, 1]}
    - {tf: google_compute_region_instance_group_manager, name: web-mig-ew4, in: subnet:web-sub-ew4, at: [1, 1]}
    - {tf: google_compute_region_instance_group_manager, name: web-mig-ew3, in: subnet:web-sub-ew3, at: [1, 1]}
    - {tf: google_compute_forwarding_rule, name: app-internal-lb, in: vpc:global-vpc, at: [2, 1, 1, 3]}
    - {tf: google_compute_region_instance_group_manager, name: app-mig-ew1, in: subnet:app-sub-ew1, at: [1, 1]}
    - {tf: google_compute_region_instance_group_manager, name: app-mig-ew4, in: subnet:app-sub-ew4, at: [1, 1]}
    - {tf: google_compute_region_instance_group_manager, name: app-mig-ew3, in: subnet:app-sub-ew3, at: [1, 1]}
    - {tf: google_spanner_instance, name: global-spanner, in: project:global-app-prj, at: [3, 1]}
