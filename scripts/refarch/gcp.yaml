    - {from: global-https-lb, to: web-mig-ew1, label: nearest region, step: 2}
    - {from: global-https-lb, to: web-mig-ew4, label: nearest region, step: 2}
    - {from: global-https-lb, to: web-mig-ew3, label: nearest region, step: 2}
    - {from: web-mig-ew1, to: app-internal-lb, label: internal HTTP, step: 3}
    - {from: web-mig-ew4, to: app-internal-lb, label: internal HTTP, step: 3}
    - {from: web-mig-ew3, to: app-internal-lb, label: internal HTTP, step: 3}
    - {from: app-internal-lb, to: app-mig-ew1, label: cross-region ILB, step: 4}
    - {from: app-internal-lb, to: app-mig-ew4, label: cross-region ILB, step: 4}
    - {from: app-internal-lb, to: app-mig-ew3, label: cross-region ILB, step: 4}
    - {from: app-mig-ew1, to: global-spanner, label: read/write, step: 5}
    - {from: app-mig-ew4, to: global-spanner, label: read/write, step: 5}
