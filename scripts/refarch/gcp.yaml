- slug: gitops-cloud-build-gke
  title: GitOps CI/CD with Cloud Build, Artifact Registry and GKE
  category: devops
  tags: [ci cd, cloud build, gitops, artifact registry, gke, kubectl]
  source: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/gitops-cloud-build
  description: A developer's push to the application source repository triggers a Cloud Build pipeline that runs tests, builds the container, pushes the image to Artifact Registry and updates the Kubernetes manifest on the candidate branch of a separate deployment-manifests repository. A second Cloud Build trigger on that repository deploys the manifest to the GKE cluster with kubectl (the cluster pulls the image from Artifact Registry) and copies it to the production branch on success, so build history doubles as deployment history.
  containers:
    - project: cicd-prj
      region: europe-west1
      account_at: [1, 2]
      vpcs:
        - name: cicd-vpc
          at: [1, 4, 2, 1]
          subnets: [{name: gke-sub, cidr: 10.90.0.0/20, region: europe-west1, at: [1, 1]}]
  elements:
    - {tf: google_sourcerepo_repository, name: hello-cloudbuild-app, in: project:cicd-prj, at: [1, 1]}
    - {tf: google_cloudbuild_trigger, name: app-ci-trigger, in: project:cicd-prj, at: [1, 2]}
    - {tf: google_artifact_registry_repository, name: my-repository, in: project:cicd-prj, at: [1, 3]}
    - {tf: google_sourcerepo_repository, name: hello-cloudbuild-env, in: project:cicd-prj, at: [2, 2]}
    - {tf: google_cloudbuild_trigger, name: env-cd-trigger, in: project:cicd-prj, at: [2, 3]}
    - {tf: google_container_cluster, name: hello-cloudbuild-cluster, in: subnet:gke-sub, at: [1, 1]}
  actors: [{type: user, name: developer, at: [1, 1]}]
  flows:
    - {from: developer, to: hello-cloudbuild-app, label: push, step: 1}
    - {from: hello-cloudbuild-app, to: app-ci-trigger, label: triggers, step: 2}
    - {from: app-ci-trigger, to: my-repository, label: push image, step: 3}
    - {from: app-ci-trigger, to: hello-cloudbuild-env, label: updates manifest on candidate branch, step: 4}
    - {from: hello-cloudbuild-env, to: env-cd-trigger, label: triggers, step: 5}
    - {from: env-cd-trigger, to: hello-cloudbuild-cluster, label: deploys with kubectl apply, step: 6}
    - {from: hello-cloudbuild-cluster, to: my-repository, label: pull image, step: 7}
    - {from: env-cd-trigger, to: hello-cloudbuild-env, label: copy manifest to production branch, step: 8}
