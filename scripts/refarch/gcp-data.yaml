# Google Cloud reference architectures: data & analytics
# Format: scripts/refarch/FORMAT.md. Provider: gcp.

- slug: analytics-lakehouse-biglake-iceberg
  title: Analytics lakehouse with BigLake and Apache Iceberg
  category: data
  tags: [lakehouse, biglake, iceberg, dataproc, bigquery, dataplex]
  source: https://docs.cloud.google.com/architecture/big-data-analytics/analytics-lakehouse
  description: Raw files land in Cloud Storage and are transformed by Dataproc Spark jobs into Apache Iceberg tables on Cloud Storage that BigQuery reads through BigLake tables via a Cloud Resource connection. Dataplex manages the lake zones and metadata, Cloud Workflows orchestrates the load, and analysts query the same open-format data from BigQuery or Spark without copies.
  containers:
    - project: lakehouse
      region: us-central1
      groups: [{label: landing}, {label: processing}, {label: serving}]
  elements:
    - {tf: google_storage_bucket, name: raw-landing-bucket, in: group:landing}
    - {tf: google_storage_bucket, name: iceberg-warehouse-bucket, in: group:landing}
    - {tf: google_dataproc_cluster, name: spark-transform-cluster, in: group:processing}
    - {tf: google_workflows_workflow, name: lakehouse-load-workflow, in: group:processing}
    - {tf: google_dataplex_lake, name: analytics-lake, in: group:processing}
    - {tf: google_bigquery_connection, name: biglake-gcs-connection, in: group:serving}
    - {tf: google_bigquery_dataset, name: lakehouse-dataset, in: group:serving}
    - {tf: google_bigquery_table, name: iceberg-biglake-table, in: group:serving}
    - {tf: google_looker_instance, name: lakehouse-looker, in: group:serving}
  actors: [server, users]
  flows:
    - {from: server, to: raw-landing-bucket, label: upload raw files, step: 1}
    - {from: lakehouse-load-workflow, to: spark-transform-cluster, label: submit Spark job, step: 2}
    - {from: spark-transform-cluster, to: raw-landing-bucket, label: read raw, step: 3}
    - {from: spark-transform-cluster, to: iceberg-warehouse-bucket, label: write Iceberg tables, step: 4}
    - {from: analytics-lake, to: iceberg-warehouse-bucket, label: discover and catalog, step: 5}
    - {from: iceberg-biglake-table, to: biglake-gcs-connection, label: read via connection, step: 6}
    - {from: biglake-gcs-connection, to: iceberg-warehouse-bucket, label: Parquet and Iceberg metadata, step: 7}
    - {from: lakehouse-looker, to: lakehouse-dataset, label: SQL queries, step: 8}
    - {from: users, to: lakehouse-looker, label: dashboards, step: 9}

- slug: bigquery-data-warehouse-jump-start
  title: Data warehouse with BigQuery jump start solution
  category: data
  tags: [data warehouse, bigquery, workflows, looker studio, bigquery ml]
  source: https://docs.cloud.google.com/architecture/big-data-analytics/data-warehouse
  description: Cloud Workflows loads sample data from a Cloud Storage bucket into BigQuery datasets, then runs stored procedures that build views and a BigQuery ML model. Looker Studio dashboards query the curated tables, and Cloud Scheduler triggers periodic refreshes of the warehouse.
  containers:
    - project: warehouse
      region: us-central1
      groups: [{label: ingest}, {label: warehouse}, {label: consume}]
  elements:
    - {tf: google_storage_bucket, name: staging-bucket, in: group:ingest}
    - {tf: google_workflows_workflow, name: dw-load-workflow, in: group:ingest}
    - {tf: google_cloud_scheduler_job, name: dw-refresh-schedule, in: group:ingest}
    - {tf: google_bigquery_dataset, name: dw-raw-dataset, in: group:warehouse}
    - {tf: google_bigquery_dataset, name: dw-curated-dataset, in: group:warehouse}
    - {tf: google_bigquery_table, name: orders-fact-table, in: group:warehouse}
    - {tf: google_bigquery_routine, name: build-views-procedure, in: group:warehouse}
    - {tf: google_looker_instance, name: warehouse-looker, in: group:consume}
  actors: [users]
  flows:
    - {from: dw-refresh-schedule, to: dw-load-workflow, label: cron trigger, step: 1}
    - {from: dw-load-workflow, to: staging-bucket, label: list source files, step: 2}
    - {from: dw-load-workflow, to: dw-raw-dataset, label: BigQuery load jobs, step: 3}
    - {from: dw-load-workflow, to: build-views-procedure, label: CALL procedure, step: 4}
    - {from: build-views-procedure, to: dw-curated-dataset, label: create tables and ML model, step: 5}
    - {from: warehouse-looker, to: orders-fact-table, label: query, step: 6}
    - {from: users, to: warehouse-looker, label: dashboards, step: 7}

- slug: dataform-elt-bigquery
  title: ELT in BigQuery with Dataform and scheduled workflows
  category: data
  tags: [elt, dataform, bigquery, sqlx, scheduled queries, looker]
  source: https://docs.cloud.google.com/dataform/docs/overview
  description: Raw data is loaded into BigQuery staging datasets from Cloud Storage and BigQuery Data Transfer Service, and a Dataform repository of SQLX definitions compiles into a dependency tree of tables, views and assertions executed inside BigQuery. A Dataform workflow configuration runs the release on a schedule and Looker models the resulting marts for business users.
  containers:
    - project: analytics
      region: europe-west1
      groups: [{label: load}, {label: transform}, {label: serve}]
  elements:
    - {tf: google_storage_bucket, name: raw-export-bucket, in: group:load}
    - {tf: google_bigquery_data_transfer_config, name: saas-transfer, in: group:load}
    - {tf: google_bigquery_dataset, name: staging-dataset, in: group:load}
    - {tf: google_dataform_repository, name: analytics-dataform-repo, in: group:transform}
    - {tf: google_dataform_repository_release_config, name: prod-release, in: group:transform}
    - {tf: google_dataform_repository_workflow_config, name: nightly-run, in: group:transform}
    - {tf: google_bigquery_dataset, name: marts-dataset, in: group:serve}
    - {tf: google_bigquery_table, name: revenue-mart-table, in: group:serve}
    - {tf: google_looker_instance, name: analytics-looker, in: group:serve}
  actors: [saas, users]
  flows:
    - {from: saas, to: saas-transfer, label: API extract, step: 1}
    - {from: saas-transfer, to: staging-dataset, label: load, step: 2}
    - {from: raw-export-bucket, to: staging-dataset, label: load CSV/Parquet, step: 3}
    - {from: nightly-run, to: prod-release, label: run compiled release, step: 4}
    - {from: prod-release, to: analytics-dataform-repo, label: compile SQLX, step: 5}
    - {from: nightly-run, to: staging-dataset, label: read sources, step: 6}
    - {from: nightly-run, to: marts-dataset, label: create tables, views, assertions, step: 7}
    - {from: analytics-looker, to: revenue-mart-table, label: LookML queries, step: 8}
    - {from: users, to: analytics-looker, label: explore, step: 9}

- slug: pubsub-dataflow-bigquery-streaming
  title: Streaming analytics with Pub/Sub, Dataflow and BigQuery
  category: analytics-bi
  tags: [streaming, pub/sub, dataflow, bigquery, dead letter]
  source: https://docs.cloud.google.com/dataflow/docs/tutorials/dataflow-stream-to-bigquery
  description: Producers publish JSON events to a Pub/Sub topic and a Dataflow streaming job reads them, applies a user-defined transform, and writes rows to a BigQuery table with the Storage Write API. Records that fail parsing are routed to a dead-letter BigQuery table, and the raw stream is optionally archived to Cloud Storage.
  containers:
    - project: streaming
      region: us-central1
      groups: [{label: ingest}, {label: process}, {label: store}]
  elements:
    - {tf: google_pubsub_topic, name: events-topic, in: group:ingest}
    - {tf: google_pubsub_subscription, name: events-dataflow-sub, in: group:ingest}
    - {tf: google_dataflow_flex_template_job, name: pubsub-to-bq-job, in: group:process}
    - {tf: google_storage_bucket, name: dataflow-temp-bucket, in: group:process}
    - {tf: google_bigquery_dataset, name: events-dataset, in: group:store}
    - {tf: google_bigquery_table, name: events-table, in: group:store}
    - {tf: google_bigquery_table, name: events-deadletter-table, in: group:store}
    - {tf: google_looker_instance, name: events-looker, in: group:store}
  actors: [device, users]
  flows:
    - {from: device, to: events-topic, label: publish JSON events, step: 1}
    - {from: events-topic, to: events-dataflow-sub, label: fan out, step: 2}
    - {from: events-dataflow-sub, to: pubsub-to-bq-job, label: pull, step: 3}
    - {from: pubsub-to-bq-job, to: dataflow-temp-bucket, label: staging and temp files, step: 4}
    - {from: pubsub-to-bq-job, to: events-table, label: Storage Write API, step: 5}
    - {from: pubsub-to-bq-job, to: events-deadletter-table, label: failed records, step: 6}
    - {from: events-looker, to: events-dataset, label: query, step: 7}
    - {from: users, to: events-looker, label: dashboards, step: 8}

- slug: managed-kafka-dataflow-bigquery
  title: Kafka to BigQuery with Managed Service for Apache Kafka and Dataflow
  category: data
  tags: [kafka, managed kafka, dataflow, bigquery, avro]
  source: https://docs.cloud.google.com/dataflow/docs/guides/templates/provided/kafka-to-bigquery
  description: Application producers write Avro or JSON records to topics on a Managed Service for Apache Kafka cluster deployed inside a VPC. The Kafka to BigQuery Dataflow template consumes the topics, decodes records against a schema, and writes them to BigQuery tables, sending malformed messages to a dead-letter table.
  containers:
    - project: kafka-analytics
      region: europe-west4
      vpcs:
        - name: kafka-vpc
          cidr: 10.20.0.0/16
          subnets:
            - {name: kafka-subnet, cidr: 10.20.1.0/24, region: europe-west4}
            - {name: dataflow-subnet, cidr: 10.20.2.0/24, region: europe-west4}
  elements:
    - {tf: google_managed_kafka_cluster, name: events-kafka-cluster, in: subnet:kafka-subnet}
    - {tf: google_managed_kafka_topic, name: orders-topic, in: subnet:kafka-subnet}
    - {tf: google_cloud_run_v2_service, name: order-producer-service, in: region}
    - {tf: google_dataflow_flex_template_job, name: kafka-to-bq-job, in: subnet:dataflow-subnet}
    - {tf: google_storage_bucket, name: kafka-dataflow-temp-bucket, in: region}
    - {tf: google_bigquery_dataset, name: orders-dataset, in: region}
    - {tf: google_bigquery_table, name: orders-table, in: region}
    - {tf: google_bigquery_table, name: orders-deadletter-table, in: region}
  actors: [users]
  flows:
    - {from: users, to: order-producer-service, label: HTTPS orders, step: 1}
    - {from: order-producer-service, to: orders-topic, label: produce Avro, step: 2}
    - {from: orders-topic, to: kafka-to-bq-job, label: consume, step: 3}
    - {from: kafka-to-bq-job, to: kafka-dataflow-temp-bucket, label: temp files, step: 4}
    - {from: kafka-to-bq-job, to: orders-table, label: write rows, step: 5}
    - {from: kafka-to-bq-job, to: orders-deadletter-table, label: failed records, step: 6}

- slug: composer-dataflow-batch-etl
  title: Batch ETL with Cloud Composer and Dataflow templates
  category: data
  tags: [batch etl, cloud composer, airflow, dataflow, bigquery]
  source: https://docs.cloud.google.com/composer/docs/how-to/using/using-dataflow-template-operator
  description: An Airflow DAG in Cloud Composer waits for input files in a Cloud Storage bucket and launches the GCS Text to BigQuery Dataflow template with a JavaScript UDF and JSON schema stored alongside the data. Dataflow transforms the files and loads them into a BigQuery table, and downstream DAG tasks run BigQuery SQL to build aggregates.
  containers:
    - project: batch-etl
      region: us-central1
      vpcs:
        - name: composer-vpc
          cidr: 10.30.0.0/16
          subnets:
            - {name: composer-subnet, cidr: 10.30.1.0/24, region: us-central1}
  elements:
    - {tf: google_storage_bucket, name: input-files-bucket, in: region}
    - {tf: google_storage_bucket, name: udf-schema-bucket, in: region}
    - {tf: google_composer_environment, name: etl-composer-env, in: subnet:composer-subnet}
    - {tf: google_dataflow_job, name: gcs-text-to-bq-job, in: subnet:composer-subnet}
    - {tf: google_storage_bucket, name: dataflow-staging-bucket, in: region}
    - {tf: google_bigquery_dataset, name: etl-dataset, in: region}
    - {tf: google_bigquery_table, name: transformed-table, in: region}
    - {tf: google_bigquery_table, name: daily-aggregate-table, in: region}
  actors: [server]
  flows:
    - {from: server, to: input-files-bucket, label: nightly file drop, step: 1}
    - {from: etl-composer-env, to: input-files-bucket, label: GCS sensor, step: 2}
    - {from: etl-composer-env, to: gcs-text-to-bq-job, label: DataflowTemplatedJobStartOperator, step: 3}
    - {from: gcs-text-to-bq-job, to: udf-schema-bucket, label: read UDF and schema, step: 4}
    - {from: gcs-text-to-bq-job, to: dataflow-staging-bucket, label: staging, step: 5}
    - {from: gcs-text-to-bq-job, to: transformed-table, label: load rows, step: 6}
    - {from: etl-composer-env, to: daily-aggregate-table, label: BigQueryInsertJobOperator, step: 7}

- slug: datastream-cdc-to-bigquery
  title: Change data capture from Cloud SQL to BigQuery with Datastream
  category: data
  tags: [cdc, datastream, cloud sql, postgresql, bigquery]
  source: https://docs.cloud.google.com/datastream/docs/quickstart-replication-to-bigquery
  description: Datastream reads the PostgreSQL logical replication slot of a Cloud SQL instance through a private connectivity configuration and streams inserts, updates and deletes directly into BigQuery. Destination tables are created automatically per source schema and merged with a configurable staleness, giving near real-time replicas for analytics without a Dataflow pipeline.
  containers:
    - project: cdc
      region: us-central1
      vpcs:
        - name: db-vpc
          cidr: 10.40.0.0/16
          subnets:
            - {name: db-subnet, cidr: 10.40.1.0/24, region: us-central1}
            - {name: datastream-subnet, cidr: 10.40.2.0/29, region: us-central1}
  elements:
    - {tf: google_sql_database_instance, name: orders-postgres, in: subnet:db-subnet}
    - {tf: google_datastream_private_connection, name: datastream-private-conn, in: subnet:datastream-subnet}
    - {tf: google_datastream_connection_profile, name: postgres-source-profile, in: region}
    - {tf: google_datastream_connection_profile, name: bigquery-dest-profile, in: region}
    - {tf: google_datastream_stream, name: orders-cdc-stream, in: region}
    - {tf: google_bigquery_dataset, name: orders-replica-dataset, in: region}
    - {tf: google_bigquery_table, name: orders-replica-table, in: region}
  actors: [users, client]
  flows:
    - {from: client, to: orders-postgres, label: OLTP writes, step: 1}
    - {from: orders-cdc-stream, to: postgres-source-profile, label: source, step: 2}
    - {from: postgres-source-profile, to: datastream-private-conn, label: VPC peering, step: 3}
    - {from: datastream-private-conn, to: orders-postgres, label: read replication slot, step: 4}
    - {from: orders-cdc-stream, to: bigquery-dest-profile, label: destination, step: 5}
    - {from: bigquery-dest-profile, to: orders-replica-table, label: merge CDC events, step: 6}
    - {from: users, to: orders-replica-dataset, label: analytics queries, step: 7}

- slug: datastream-dataflow-cdc-analytics
  title: CDC analytics with Datastream, Cloud Storage and Dataflow templates
  category: data
  tags: [cdc, datastream, dataflow template, pub/sub, cloud storage, bigquery]
  source: https://docs.cloud.google.com/datastream/docs/implementing-datastream-dataflow-analytics
  description: Datastream captures MySQL change events and writes them as Avro files to a Cloud Storage bucket whose object notifications publish to Pub/Sub. The Datastream to BigQuery Dataflow template consumes those notifications, loads change events into staging tables and merges them into replica tables, allowing custom transformations in the pipeline.
  containers:
    - project: cdc-dataflow
      region: us-central1
      vpcs:
        - name: mysql-vpc
          cidr: 10.50.0.0/16
          subnets:
            - {name: mysql-subnet, cidr: 10.50.1.0/24, region: us-central1}
  elements:
    - {tf: google_sql_database_instance, name: source-mysql, in: subnet:mysql-subnet}
    - {tf: google_datastream_connection_profile, name: mysql-source-profile, in: region}
    - {tf: google_datastream_stream, name: mysql-to-gcs-stream, in: region}
    - {tf: google_storage_bucket, name: cdc-avro-bucket, in: region}
    - {tf: google_storage_notification, name: cdc-object-notification, in: region}
    - {tf: google_pubsub_topic, name: cdc-files-topic, in: region}
    - {tf: google_pubsub_subscription, name: cdc-files-sub, in: region}
    - {tf: google_dataflow_flex_template_job, name: datastream-to-bq-job, in: region}
    - {tf: google_bigquery_dataset, name: cdc-staging-dataset, in: region}
    - {tf: google_bigquery_dataset, name: cdc-replica-dataset, in: region}
  actors: [client]
  flows:
    - {from: client, to: source-mysql, label: transactions, step: 1}
    - {from: mysql-to-gcs-stream, to: mysql-source-profile, label: binlog read, step: 2}
    - {from: mysql-source-profile, to: source-mysql, label: CDC, step: 3}
    - {from: mysql-to-gcs-stream, to: cdc-avro-bucket, label: write Avro files, step: 4}
    - {from: cdc-avro-bucket, to: cdc-files-topic, label: object finalize, step: 5, link: google_storage_notification}
    - {from: cdc-files-topic, to: cdc-files-sub, label: notifications, step: 6}
    - {from: cdc-files-sub, to: datastream-to-bq-job, label: pull file events, step: 7}
    - {from: datastream-to-bq-job, to: cdc-staging-dataset, label: load change events, step: 8}
    - {from: datastream-to-bq-job, to: cdc-replica-dataset, label: MERGE replicas, step: 9}

- slug: data-fusion-visual-etl-pipeline
  title: Visual ETL pipeline with Cloud Data Fusion
  category: data
  tags: [data fusion, cdap, etl, wrangler, dataproc, bigquery]
  source: https://docs.cloud.google.com/data-fusion/docs/tutorials/targeting-campaign-pipeline
  description: A Cloud Data Fusion instance hosts a visual CDAP pipeline that reads customer CSV files from Cloud Storage, cleans them with Wrangler transformations, joins them against a lookup table in BigQuery and writes the result to a BigQuery output table. Each pipeline run executes on an ephemeral Dataproc cluster provisioned by Data Fusion.
