    - {tf: google_data_fusion_instance, name: etl-fusion-instance, in: region}
    - {tf: google_dataproc_cluster, name: fusion-ephemeral-dataproc, in: subnet:dataproc-subnet}
    - {tf: google_bigquery_dataset, name: campaign-dataset, in: region}
    - {tf: google_bigquery_table, name: state-abbreviations-table, in: region}
    - {tf: google_bigquery_table, name: campaign-targets-table, in: region}
    - {tf: google_storage_bucket, name: fusion-temp-bucket, in: region}
  actors: [users]
  flows:
    - {from: users, to: etl-fusion-instance, label: design pipeline in Studio, step: 1}
    - {from: etl-fusion-instance, to: fusion-ephemeral-dataproc, label: provision and run, step: 2}
    - {from: fusion-ephemeral-dataproc, to: customers-csv-bucket, label: read CSV, step: 3}
    - {from: fusion-ephemeral-dataproc, to: state-abbreviations-table, label: join lookup, step: 4}
    - {from: fusion-ephemeral-dataproc, to: fusion-temp-bucket, label: staging, step: 5}
    - {from: fusion-ephemeral-dataproc, to: campaign-targets-table, label: write output, step: 6}

- slug: dataplex-data-governance
  title: Data governance with Dataplex lakes, zones and data quality scans
  category: data
  tags: [dataplex, governance, data catalog, data quality, biglake]
  source: https://docs.cloud.google.com/dataplex/docs/introduction
  description: A Dataplex lake groups Cloud Storage buckets and BigQuery datasets into raw and curated zones as assets, automatically discovering schemas and registering metadata in the catalog. Data profiling and data quality scans run on a schedule against curated tables, and Dataplex-managed IAM applies consistent access policies across the underlying storage.
