    - {tf: google_bigquery_table, name: customers-curated-table, in: group:curated zone}
    - {tf: google_dataplex_lake, name: enterprise-lake, in: group:governance}
    - {tf: google_dataplex_zone, name: raw-dataplex-zone, in: group:governance}
    - {tf: google_dataplex_zone, name: curated-dataplex-zone, in: group:governance}
    - {tf: google_dataplex_asset, name: raw-bucket-asset, in: group:governance}
    - {tf: google_dataplex_asset, name: curated-dataset-asset, in: group:governance}
    - {tf: google_dataplex_datascan, name: customers-quality-scan, in: group:governance}
    - {tf: google_data_catalog_tag_template, name: data-owner-tag-template, in: group:governance}
  actors: [users]
  flows:
    - {from: raw-bucket-asset, to: raw-zone-bucket, label: attach asset, step: 1, link: google_dataplex_asset}
