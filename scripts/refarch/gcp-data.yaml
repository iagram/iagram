    - {from: enterprise-lake, to: curated-dataplex-zone, label: discovery, step: 4}
    - {from: customers-quality-scan, to: customers-curated-table, label: scheduled data quality rules, step: 5}
    - {from: data-owner-tag-template, to: customers-curated-table, label: business metadata tags, step: 6}
    - {from: users, to: enterprise-lake, label: search catalog, step: 7}

- slug: bigquery-data-mesh-domains
  title: Data mesh with BigQuery domain projects and central governance
  category: data
  tags: [data mesh, bigquery, dataplex, domains, data products]
  source: https://docs.cloud.google.com/architecture/data-mesh
  description: Domain teams own producer projects where they ingest and curate data products in BigQuery, while a central governance project runs Dataplex to catalog, classify and apply policies across domains. Consumer projects query authorized views and shared datasets without copying data, and a platform team provides the common infrastructure and Pub/Sub ingestion.
  containers:
    - project: sales-domain
      region: europe-west1
    - project: marketing-domain
      region: europe-west1
    - project: central-governance
      region: europe-west1
    - project: consumer-analytics
      region: europe-west1
  elements:
    - {tf: google_pubsub_topic, name: sales-events-topic, in: project:sales-domain}
    - {tf: google_dataflow_job, name: sales-ingest-job, in: project:sales-domain}
    - {tf: google_bigquery_dataset, name: sales-product-dataset, in: project:sales-domain}
    - {tf: google_storage_bucket, name: marketing-raw-bucket, in: project:marketing-domain}
    - {tf: google_bigquery_dataset, name: marketing-product-dataset, in: project:marketing-domain}
    - {tf: google_dataplex_lake, name: mesh-catalog-lake, in: project:central-governance}
    - {tf: google_dataplex_asset, name: sales-product-asset, in: project:central-governance}
    - {tf: google_dataplex_asset, name: marketing-product-asset, in: project:central-governance}
    - {tf: google_bigquery_dataset, name: consumer-views-dataset, in: project:consumer-analytics}
    - {tf: google_looker_instance, name: consumer-looker, in: project:consumer-analytics}
  actors: [users, device]
  flows:
    - {from: device, to: sales-events-topic, label: events, step: 1}
    - {from: sales-events-topic, to: sales-ingest-job, label: stream, step: 2}
