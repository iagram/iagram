- slug: s2s-vpn-tgw-ecmp-scaling
  title: Scaling Site-to-Site VPN throughput with Transit Gateway ECMP
  category: networking
  tags: [site-to-site vpn, transit gateway, ecmp, bgp, ipsec, throughput]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/scaling-vpn-throughput-using-aws-transit-gateway/
  description: In the baseline drawn by the post, an on-premises customer gateway router carries one Site-to-Site VPN connection to a virtual private gateway on each of three VPCs, so every VPC is capped at the bandwidth of a single tunnel pair. Moving the same VPN connections onto one Transit Gateway with ECMP enabled lets each connection contribute two IPsec tunnels; with BGP advertising identical prefixes over every tunnel the Transit Gateway hashes flows across all of them, so aggregate bandwidth scales past the single-tunnel limit while each individual flow stays bound to one tunnel.
  containers:
    - datacenter: on-premises
      at: [1, 3]
    - region: us-east-1
      account_at: [1, 1, 2, 1]
      vpcs:
        - {name: vpc-1, cidr: 10.1.0.0/16, at: [1, 1]}
        - {name: vpc-2, cidr: 10.2.0.0/16, at: [2, 1]}
        - {name: vpc-3, cidr: 10.3.0.0/16, at: [3, 1]}
  elements:
    - {tf: aws_vpn_gateway, name: vgw-1, in: vpc:vpc-1, at: [1, 1]}
    - {tf: aws_vpn_gateway, name: vgw-2, in: vpc:vpc-2, at: [1, 1]}
    - {tf: aws_vpn_gateway, name: vgw-3, in: vpc:vpc-3, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [1, 2, 3, 1]}
    - {tf: aws_customer_gateway, name: dc-cgw, in: region, at: [1, 3, 3, 1]}
    - {tf: aws_vpn_connection, name: vpn-1, in: region}
    - {tf: aws_vpn_connection, name: vpn-2, in: region}
    - {tf: aws_vpn_connection, name: vpn-3, in: region}
  actors:
    - {type: server, name: customer-gateway-router, at: [1, 2, 2, 1]}
    - {type: client, name: workstations, at: [2, 3]}
  flows:
    - {from: workstations, to: customer-gateway-router, label: on-premises LAN}
    - {from: customer-gateway-router, to: dc-cgw, label: BGP router registered as customer gateway, step: 1}
    - {from: dc-cgw, to: vgw-1, label: "baseline: one VPN connection per VGW", step: 2}
    - {from: dc-cgw, to: vgw-2, label: "baseline: one VPN connection per VGW"}
    - {from: dc-cgw, to: vgw-3, label: "baseline: one VPN connection per VGW"}
    - {from: dc-cgw, to: vpn-1, label: "2 IPsec tunnels, BGP"}
    - {from: dc-cgw, to: vpn-2, label: "2 IPsec tunnels, BGP"}
    - {from: dc-cgw, to: vpn-3, label: "2 IPsec tunnels, BGP"}
    - {from: vpn-1, to: hub-tgw, label: "VPN attachment, ECMP"}
    - {from: vpn-2, to: hub-tgw, label: "VPN attachment, ECMP"}
    - {from: vpn-3, to: hub-tgw, label: "VPN attachment, ECMP"}
    - {from: hub-tgw, to: vpc:vpc-1, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:vpc-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:vpc-3, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vgw-1, label: "scaled: flows 5-tuple hashed across 6 tunnels replace the per-VPC VGW", step: 3}
- slug: accelerated-s2s-vpn-tgw
  title: Accelerated Site-to-Site VPN to a Transit Gateway
  category: networking
  tags: [site-to-site vpn, accelerated vpn, global accelerator, transit gateway, anycast, edge]
  source: https://docs.aws.amazon.com/whitepapers/latest/hybrid-connectivity/aws-accelerated-site-to-site-vpn-aws-transit-gateway-single-aws-region.html
  description: An accelerated Site-to-Site VPN attaches to a Transit Gateway that interconnects three VPCs, each spanning two Availability Zones, and uses AWS Global Accelerator so that each IPsec tunnel terminates at anycast IPs announced from the nearest AWS point of presence instead of at the Region. Traffic from the customer gateway router leaves the corporate data center through its local ISP, enters the AWS global network close to the site and rides the backbone to the Regional Transit Gateway, reducing jitter and path variability compared with traversing the public internet all the way to the Region.
  containers:
    - {datacenter: corporate-data-center, at: [1, 3]}
    - region: ap-southeast-2
      at: [1, 1]
      vpcs:
        - name: workload-1
          cidr: 10.1.0.0/16
          at: [1, 1]
          subnets:
            - {name: workload-1-az-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: workload-1-az-b, cidr: 10.1.2.0/24, az: b, public: false, at: [1, 1]}
        - name: workload-2
          cidr: 10.2.0.0/16
          at: [2, 1]
          subnets:
            - {name: workload-2-az-a, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: workload-2-az-b, cidr: 10.2.2.0/24, az: b, public: false, at: [1, 1]}
        - name: workload-3
          cidr: 10.3.0.0/16
          at: [3, 1]
          subnets:
            - {name: workload-3-az-a, cidr: 10.3.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: workload-3-az-b, cidr: 10.3.2.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [1, 2, 3, 1]}
    - {tf: aws_networkmanager_global_network, name: aws-global-network, in: account, at: [1, 2]}
    - {tf: aws_globalaccelerator_accelerator, name: vpn-accelerator-pop, in: account, at: [1, 3]}
    - {tf: aws_customer_gateway, name: dc-cgw, in: account, at: [1, 4]}
  actors: [{type: internet, name: internet-local-isp, at: [1, 2]}]
  flows:
    - {from: datacenter, to: dc-cgw, label: customer gateway router}
    - {from: dc-cgw, to: internet-local-isp, label: IPsec tunnels to anycast IPs, step: 1}
    - {from: internet-local-isp, to: vpn-accelerator-pop, label: nearest AWS PoP, step: 2}
    - {from: vpn-accelerator-pop, to: aws-global-network, label: AWS global network, step: 3}
    - {from: aws-global-network, to: hub-tgw, step: 4}
    - {from: dc-cgw, to: hub-tgw, link: aws_vpn_connection, label: Site-to-Site IPsec connection}
    - {from: hub-tgw, to: vpc:workload-1, link: aws_ec2_transit_gateway_vpc_attachment, label: inter-VPC communication}
    - {from: hub-tgw, to: vpc:workload-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:workload-3, link: aws_ec2_transit_gateway_vpc_attachment}
- slug: client-vpn-tgw-remote-access
  title: Remote user access to multiple VPCs with Client VPN and Transit Gateway
  category: networking
  tags: [client vpn, remote access, transit gateway, openvpn, split tunnel, hybrid]
  source: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-tgw.html
  description: A Client VPN endpoint associated directly with a Transit Gateway gives remote users coming in over the internet access to every VPC attached to that hub without an intermediate VPC. Routes for each destination CIDR are added to the Client VPN endpoint together with authorization rules, split tunnel keeps internet traffic local to the user, and the client source IP is preserved because no source NAT is applied.
  containers:
    - region: eu-west-1
      at: [1, 2]
      vpcs:
        - name: a
          cidr: 10.1.0.0/16
          at: [1, 2]
          subnets:
            - {name: a-private, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
        - name: b
          cidr: 10.2.0.0/16
          at: [2, 3]
          subnets:
            - {name: b-private, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
  elements:
    - {tf: aws_ec2_client_vpn_endpoint, name: client-vpn-endpoint, in: account, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway, name: transit-gateway, in: region, at: [2, 1]}
    - {tf: aws_instance, name: instance-a, in: subnet:a-private, at: [1, 1]}
    - {tf: aws_instance, name: instance-b, in: subnet:b-private, at: [1, 1]}
  actors: [{type: users, name: users, at: [1, 1]}, {type: internet, name: internet, at: [1, 2]}]
  flows:
    - {from: users, to: internet, label: OpenVPN TLS 443, step: 1}
    - {from: internet, to: client-vpn-endpoint, step: 2}
    - {from: client-vpn-endpoint, to: transit-gateway, label: "Transit Gateway association, no SNAT", step: 3}
    - {from: transit-gateway, to: vpc:a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: transit-gateway, to: vpc:b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: transit-gateway, to: instance-a, label: authorization rule 10.1.0.0/16, step: 4}
    - {from: transit-gateway, to: instance-b, label: authorization rule 10.2.0.0/16}
- slug: hybrid-dns-route53-resolver-shared-services
  title: Hybrid DNS resolution with Route 53 Resolver endpoints in a shared-services VPC
  category: networking
  tags: [route 53 resolver, hybrid dns, inbound endpoint, outbound endpoint, forwarding rules, ram, multi-account]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/set-up-dns-resolution-for-hybrid-networks-in-a-multi-account-aws-environment.html
  description: A shared-services VPC hosts an outbound Route 53 Resolver endpoint that reaches the corporate data center over AWS Direct Connect or Site-to-Site VPN. A Resolver forwarding rule for onprem.example.com targets the on-premises DNS server through the outbound endpoint; the rule is shared to the production account with AWS RAM and associated with the production VPC, so queries from EC2 instances to the VPC's Route 53 Resolver are forwarded to the on-premises private DNS zone.
  containers:
    - {datacenter: corporate-data-center, at: [1, 3]}
    - region: us-east-1
      account: production
      vpcs:
        - name: production
          cidr: 10.1.0.0/16
          at: [1, 1]
          subnets:
            - {name: production-private-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
    - region: us-east-1
      account: shared-services
      vpcs:
        - name: shared-services
          cidr: 10.0.0.0/16
          at: [1, 1]
          subnets:
            - {name: dns-private-a, cidr: 10.0.1.0/24, az: a, public: false, at: [1, 1]}
  elements:
    - {tf: aws_instance, name: ec2-instance-1, in: subnet:production-private-a, at: [1, 1]}
    - {tf: aws_instance, name: ec2-instance-2, in: subnet:production-private-a, at: [1, 2]}
    - {tf: aws_route53_resolver_config, name: production-vpc-resolver, in: vpc:production, at: [1, 2]}
    - {tf: aws_route53_resolver_rule, name: production-forward-rule, in: account:production, at: [2, 1]}
    - {tf: aws_route53_resolver_endpoint, name: outbound-resolver-endpoint, in: subnet:dns-private-a, at: [1, 1]}
    - {tf: aws_route53_resolver_rule, name: onprem-forward-rule, in: account:shared-services, at: [2, 1]}
  actors: [{type: server, name: on-prem-dns-server, at: [2, 3]}]
  flows:
    - {from: ec2-instance-1, to: production-vpc-resolver, label: "Q: db.onprem.example.com", step: 1}
    - {from: production-vpc-resolver, to: production-forward-rule, label: matching forward rule, step: 2}
    - {from: onprem-forward-rule, to: production-forward-rule, label: cross-account sharing (RAM) and association}
    - {from: production-forward-rule, to: vpc:production, link: aws_route53_resolver_rule_association}
    - {from: onprem-forward-rule, to: outbound-resolver-endpoint, label: "rule type forward, domain onprem.example.com"}
    - {from: outbound-resolver-endpoint, to: on-prem-dns-server, label: forward over Direct Connect or Site-to-Site VPN, step: 3}
    - {from: on-prem-dns-server, to: outbound-resolver-endpoint, label: "A: db.onprem.example.com 1.2.3.4", step: 4}
    - {from: datacenter, to: on-prem-dns-server, label: onprem.example.com private DNS zone}
- slug: dns-firewall-centralized-firewall-manager
  title: Centralized DNS Firewall rule groups enforced with Firewall Manager
  category: networking
  tags: [dns firewall, route 53 resolver, firewall manager, multi-account, dns exfiltration, security]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/securing-hybrid-workloads-using-amazon-route-53-resolver-dns-firewall/
  description: A Route 53 Resolver DNS Firewall rule group with block and allow domain lists is associated with the hybrid-DNS VPC, and AWS Firewall Manager policies can distribute the same rule group to every VPC in the organization, including new ones. On-premises clients ask their DNS server, which forwards over highly resilient Direct Connect or Site-to-Site VPN through the virtual private gateway to inbound Resolver endpoint ENIs in two Availability Zones; the Route 53 Resolver evaluates each query against the DNS Firewall before answering from the private hosted zone or from external authoritative name servers.
  containers:
    - region: us-east-1
      account: hybrid-dns-protection
      at: [1, 2]
      vpcs:
        - name: hybrid-dns
          cidr: 10.1.0.0/16
          at: [1, 2]
          subnets:
            - {name: private-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: private-b, cidr: 10.1.2.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_customer_gateway, name: customer-gateway, in: account:hybrid-dns-protection, at: [1, 1]}
    - {tf: aws_vpn_gateway, name: virtual-private-gateway, in: region, at: [1, 1]}
    - {tf: aws_route53_resolver_endpoint, name: inbound-resolver-endpoint, in: vpc:hybrid-dns, at: [3, 1]}
    - {tf: aws_network_interface, name: inbound-eni-a, in: subnet:private-a, at: [1, 1]}
    - {tf: aws_network_interface, name: inbound-eni-b, in: subnet:private-b, at: [1, 1]}
    - {tf: aws_route53_resolver_firewall_rule_group, name: dns-firewall, in: vpc:hybrid-dns, at: [1, 2, 2, 1]}
    - {tf: aws_route53_zone, name: private-hosted-zone, in: vpc:hybrid-dns, at: [1, 3]}
    - {tf: aws_route53_resolver_config, name: route53-resolver, in: vpc:hybrid-dns, at: [2, 3]}
    - {tf: aws_route53_resolver_firewall_domain_list, name: blocked-domains, in: region, at: [2, 1]}
    - {tf: aws_fms_policy, name: dns-firewall-policy, in: region, at: [2, 2]}
  actors: [{type: client, name: on-prem-client, at: [1, 1]}, {type: server, name: on-prem-dns-server, at: [2, 1]}, {type: internet, name: external-authoritative-name-servers, at: [1, 3]}]
  flows:
    - {from: on-prem-client, to: on-prem-dns-server, label: DNS query, step: 1}
    - {from: on-prem-dns-server, to: customer-gateway, label: conditional forwarding for AWS domains, step: 2}
    - {from: customer-gateway, to: virtual-private-gateway, link: aws_vpn_connection, label: highly resilient Direct Connect or Site-to-Site VPN, step: 3}
    - {from: virtual-private-gateway, to: inbound-eni-a, step: 4}
    - {from: virtual-private-gateway, to: inbound-eni-b}
    - {from: inbound-resolver-endpoint, to: inbound-eni-a, label: one ENI per subnet}
    - {from: inbound-resolver-endpoint, to: inbound-eni-b}
    - {from: inbound-eni-a, to: dns-firewall, label: query evaluated against rule group, step: 5}
    - {from: inbound-eni-b, to: dns-firewall}
    - {from: dns-firewall, to: route53-resolver, step: 6}
    - {from: route53-resolver, to: private-hosted-zone, label: private names}
    - {from: route53-resolver, to: external-authoritative-name-servers, label: recursive resolution}
    - {from: blocked-domains, to: dns-firewall, label: BLOCK list}
    - {from: dns-firewall-policy, to: dns-firewall, label: Firewall Manager policy}
- slug: global-accelerator-multi-region-alb
  title: Multi-Region application fronted by AWS Global Accelerator
  category: networking
  tags: [global accelerator, anycast, multi-region, application load balancer, failover, traffic dials]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/deploying-multi-region-applications-in-aws-using-aws-global-accelerator/
  description: A standard accelerator provides two static anycast IP addresses announced over BGP from AWS edge locations, and a listener with one endpoint group per Region (us-west-1 and eu-west-1) whose endpoints are EC2 instances spread across two Availability Zones. Client traffic enters the AWS network at the nearest edge location and is routed to the closest healthy endpoint group; health checks, endpoint-group traffic dials and per-instance endpoint weights drive automatic failover and controlled shifts between Regions.
  containers:
    - region: us-west-1
      at: [1, 1]
      groups: [{label: aws-edge-locations-us, at: [1, 1]}]
      vpcs:
        - name: app-us
          cidr: 10.1.0.0/16
          at: [3, 1]
          subnets:
            - {name: us-private-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: us-private-b, cidr: 10.1.2.0/24, az: b, public: false, at: [1, 1]}
    - region: eu-west-1
      at: [1, 2]
      groups: [{label: aws-edge-locations-eu, at: [1, 1]}]
      vpcs:
        - name: app-eu
          cidr: 10.2.0.0/16
          at: [3, 1]
          subnets:
            - {name: eu-private-a, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: eu-private-b, cidr: 10.2.2.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_globalaccelerator_accelerator, name: accelerator-us-edge, in: group:aws-edge-locations-us, at: [1, 1]}
    - {tf: aws_globalaccelerator_accelerator, name: accelerator-eu-edge, in: group:aws-edge-locations-eu, at: [1, 1]}
    - {tf: aws_globalaccelerator_endpoint_group, name: endpoint-group-1, in: region:us-west-1, at: [2, 1]}
    - {tf: aws_globalaccelerator_endpoint_group, name: endpoint-group-2, in: region:eu-west-1, at: [2, 1]}
    - {tf: aws_instance, name: us-instance-1, in: subnet:us-private-a, at: [1, 1]}
    - {tf: aws_instance, name: us-instance-2, in: subnet:us-private-a, at: [1, 2]}
    - {tf: aws_instance, name: us-instance-3, in: subnet:us-private-b, at: [1, 1]}
    - {tf: aws_instance, name: us-instance-4, in: subnet:us-private-b, at: [1, 2]}
    - {tf: aws_instance, name: eu-instance-1, in: subnet:eu-private-a, at: [1, 1]}
    - {tf: aws_instance, name: eu-instance-2, in: subnet:eu-private-a, at: [1, 2]}
    - {tf: aws_instance, name: eu-instance-3, in: subnet:eu-private-b, at: [1, 1]}
    - {tf: aws_instance, name: eu-instance-4, in: subnet:eu-private-b, at: [1, 2]}
  actors: [{type: users, name: users-us-region, at: [1, 1]}, {type: users, name: users-eu-region, at: [1, 2]}, {type: internet, name: internet, at: [2, 1, 1, 2]}]
  flows:
    - {from: users-us-region, to: internet, label: TCP 443}
    - {from: users-eu-region, to: internet, label: TCP 443}
    - {from: internet, to: accelerator-us-edge, label: anycast IP (BGP) at nearest edge}
    - {from: internet, to: accelerator-eu-edge, label: anycast IP (BGP) at nearest edge}
    - {from: accelerator-us-edge, to: endpoint-group-1, label: "traffic dial 0-100%"}
    - {from: accelerator-eu-edge, to: endpoint-group-2, label: "traffic dial 0-100%"}
    - {from: accelerator-us-edge, to: endpoint-group-2, label: failover to healthy Region}
    - {from: endpoint-group-1, to: us-instance-1, label: weight 1-255}
    - {from: endpoint-group-1, to: us-instance-2}
    - {from: endpoint-group-1, to: us-instance-3}
    - {from: endpoint-group-1, to: us-instance-4}
    - {from: endpoint-group-2, to: eu-instance-1, label: weight 1-255}
    - {from: endpoint-group-2, to: eu-instance-2}
    - {from: endpoint-group-2, to: eu-instance-3}
    - {from: endpoint-group-2, to: eu-instance-4}
- slug: ipv6-dual-stack-centralized-ipv4-egress
  title: Dual-stack VPCs with centralized IPv4 egress and decentralized IPv6 egress
  category: networking
  tags: [ipv6, dual-stack, egress-only internet gateway, centralized egress, nat gateway, transit gateway]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-egress-for-ipv6.html
  description: Spoke VPCs carry both an IPv4 CIDR and an Amazon-provided IPv6 CIDR; IPv4 default routes go through the Transit Gateway ENIs in each private subnet to the Transit Gateway and out through NAT gateways in the two Availability Zones of a central egress VPC, which also has an internet gateway and an egress-only internet gateway. Because IPv6 addresses are globally unique and NAT is not required, each spoke keeps its own egress-only internet gateway for the "::/0" route, so IPv6 traffic leaves locally while inbound IPv6 connections remain blocked.
  containers:
    - region: us-east-1
      vpcs:
        - name: egress
          cidr: 192.168.0.0/16
          at: [1, 1, 1, 2]
          subnets:
            - {name: egress-public-a, cidr: 192.168.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: egress-private-a, cidr: 192.168.4.0/24, az: a, public: false, at: [2, 1]}
            - {name: egress-public-b, cidr: 192.168.1.0/24, az: b, public: true, at: [1, 1]}
            - {name: egress-private-b, cidr: 192.168.5.0/24, az: b, public: false, at: [2, 1]}
        - name: app1
          cidr: 10.0.0.0/16
          at: [3, 1]
          subnets:
            - {name: app1-private-a, cidr: 10.0.0.0/24, az: a, public: false, at: [1, 1]}
            - {name: app1-private-b, cidr: 10.0.1.0/24, az: b, public: false, at: [1, 1]}
        - name: app2
          cidr: 10.1.0.0/16
          at: [3, 2]
          subnets:
            - {name: app2-private-a, cidr: 10.1.0.0/24, az: a, public: false, at: [1, 1]}
            - {name: app2-private-b, cidr: 10.1.1.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [2, 1, 1, 2]}
    - {tf: aws_internet_gateway, name: egress-igw, in: vpc:egress, at: [1, 1]}
    - {tf: aws_egress_only_internet_gateway, name: egress-eigw, in: vpc:egress, at: [1, 2]}
    - {tf: aws_nat_gateway, name: nat64-gateway-a, in: subnet:egress-public-a, at: [1, 1]}
    - {tf: aws_nat_gateway, name: nat64-gateway-b, in: subnet:egress-public-b, at: [1, 1]}
    - {tf: aws_network_interface, name: egress-tgw-eni-a, in: subnet:egress-private-a, at: [1, 1]}
    - {tf: aws_network_interface, name: egress-tgw-eni-b, in: subnet:egress-private-b, at: [1, 1]}
    - {tf: aws_egress_only_internet_gateway, name: app1-eigw, in: vpc:app1, at: [1, 1]}
    - {tf: aws_egress_only_internet_gateway, name: app2-eigw, in: vpc:app2, at: [1, 1]}
    - {tf: aws_instance, name: app1-instance-a, in: subnet:app1-private-a, at: [1, 1]}
    - {tf: aws_network_interface, name: app1-tgw-eni-a, in: subnet:app1-private-a, at: [1, 2]}
    - {tf: aws_instance, name: app1-instance-b, in: subnet:app1-private-b, at: [1, 1]}
    - {tf: aws_network_interface, name: app1-tgw-eni-b, in: subnet:app1-private-b, at: [1, 2]}
    - {tf: aws_network_interface, name: app2-tgw-eni-a, in: subnet:app2-private-a, at: [1, 1]}
    - {tf: aws_instance, name: app2-instance-a, in: subnet:app2-private-a, at: [1, 2]}
    - {tf: aws_network_interface, name: app2-tgw-eni-b, in: subnet:app2-private-b, at: [1, 1]}
    - {tf: aws_instance, name: app2-instance-b, in: subnet:app2-private-b, at: [1, 2]}
  flows:
    - {from: hub-tgw, to: vpc:app1, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:app2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: app1-instance-a, to: app1-tgw-eni-a, label: "IPv4 0.0.0.0/0 to TGW ENI", step: 1}
    - {from: app1-tgw-eni-a, to: hub-tgw, step: 2}
    - {from: hub-tgw, to: egress-tgw-eni-a, label: egress attachment, step: 3}
    - {from: egress-tgw-eni-a, to: nat64-gateway-a, label: "0.0.0.0/0 to NAT gateway", step: 4}
    - {from: nat64-gateway-a, to: egress-igw, label: IPv4 out, step: 5}
    - {from: app1-instance-a, to: app1-eigw, label: "IPv6 ::/0 local, outbound only", step: 6}
    - {from: app1-instance-b, to: app1-tgw-eni-b, label: IPv4 0.0.0.0/0}
    - {from: app1-instance-b, to: app1-eigw, label: "IPv6 ::/0"}
    - {from: app2-instance-a, to: app2-tgw-eni-a, label: IPv4 0.0.0.0/0}
    - {from: app2-instance-a, to: app2-eigw, label: "IPv6 ::/0"}
    - {from: app2-instance-b, to: app2-tgw-eni-b, label: IPv4 0.0.0.0/0}
    - {from: app2-instance-b, to: app2-eigw, label: "IPv6 ::/0"}
    - {from: egress-tgw-eni-b, to: nat64-gateway-b, label: 0.0.0.0/0}
    - {from: nat64-gateway-b, to: egress-igw}
- slug: ipv6-only-centralized-egress-nat64
  title: IPv6-only workloads reaching IPv4 destinations with centralized NAT64 and DNS64
  category: networking
  tags: [ipv6-only, nat64, dns64, nat gateway, transit gateway, centralized egress]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/ipv6-vpc-architectures/ipv6-centralized-egress-nat64.html
  description: An instance in the IPv6-only private subnet of spoke VPC A enables DNS64 so that IPv4-only destinations resolve to synthesized addresses in the 64:ff9b::/96 well-known prefix; the subnet route table sends that prefix and "::/0" to the Transit Gateway ENI in the spoke's TGW subnet. The Transit Gateway route table forwards to the egress VPC, whose TGW subnet route table points 64:ff9b::/96 at the NAT gateway in the public subnet; the NAT gateway performs NAT64 to translate to IPv4 and the public subnet route table sends the traffic through the internet gateway to the internet.
  containers:
    - region: us-east-1
      vpcs:
        - name: spoke-a
          cidr: 10.0.0.0/16
          at: [2, 1]
          subnets:
            - {name: spoke-a-private, cidr: 10.0.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: spoke-a-tgw, cidr: 10.0.0.224/28, az: a, public: false, at: [2, 1]}
        - name: egress
          cidr: 10.10.0.0/16
          at: [2, 3]
          subnets:
            - {name: egress-public, cidr: 10.10.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: egress-tgw, cidr: 10.10.1.224/28, az: a, public: false, at: [2, 1]}
  elements:
    - {tf: aws_route_table, name: spoke-a-private-route-table, in: region, at: [1, 1]}
    - {tf: aws_instance, name: ec2-instance-a, in: subnet:spoke-a-private, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke-a-tgw-eni, in: subnet:spoke-a-tgw, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [2, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: tgw-route-table, in: region, at: [3, 2]}
    - {tf: aws_internet_gateway, name: egress-igw, in: vpc:egress, at: [1, 2]}
    - {tf: aws_nat_gateway, name: nat64-gateway, in: subnet:egress-public, at: [1, 1]}
    - {tf: aws_network_interface, name: egress-tgw-eni, in: subnet:egress-tgw, at: [1, 1]}
    - {tf: aws_route_table, name: egress-public-route-table, in: vpc:egress, at: [2, 2]}
    - {tf: aws_route_table, name: egress-tgw-route-table, in: vpc:egress, at: [3, 2]}
  actors: [{type: internet, name: internet, at: [1, 2]}]
  flows:
    - {from: hub-tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment, label: TGW attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment, label: TGW attachment}
    - {from: ec2-instance-a, to: spoke-a-tgw-eni, label: "DNS64 answer 64:ff9b::/96 and ::/0 -> TGW-ENI", step: 1}
    - {from: spoke-a-tgw-eni, to: hub-tgw, label: TGW attachment, step: 2}
    - {from: hub-tgw, to: egress-tgw-eni, label: "TGW route table: 64:ff9b::/96 -> Egress VPC", step: 3}
    - {from: egress-tgw-eni, to: nat64-gateway, label: "TGW subnet route table: 64:ff9b::/96 -> NATGW-ID", step: 4}
    - {from: nat64-gateway, to: egress-igw, label: "NAT64 to IPv4 source, 0.0.0.0/0 -> IGW-ID", step: 5}
    - {from: egress-igw, to: internet, label: IPv4-only destination}
    - {from: spoke-a-private-route-table, to: spoke-a-tgw-eni, label: "spoke VPC A private subnet route table"}
    - {from: tgw-route-table, to: hub-tgw, label: "10.0.0.0/16 -> Spoke VPC A, 64:ff9b::/96 -> Egress VPC"}
    - {from: egress-public-route-table, to: nat64-gateway, label: egress VPC public subnet route table}
    - {from: egress-tgw-route-table, to: egress-tgw-eni, label: egress VPC TGW subnet route table}
- slug: shared-vpc-ram-multi-account
  title: Shared VPC with subnets shared to participant accounts via AWS RAM
  category: networking
  tags: [vpc sharing, ram, shared subnets, multi-account, organizations, cost optimization]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/vpc-sharing-a-new-approach-to-multiple-accounts-and-vpc-management/
  description: A central network account owns one large VPC and shares individual subnets with participant accounts in the same organization through AWS RAM; participants launch instances, load balancers, and databases into the shared subnets while the owner keeps control of route tables, NAT gateways, and VPC-level networking. The pattern reduces the number of VPCs, endpoints, and NAT gateways to manage, and participant resources communicate over the VPC network without peering or Transit Gateway.
  containers:
    - region: us-east-1
      account: network
      vpcs:
        - name: shared-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: shared-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: team-a-private, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: team-b-private, cidr: 10.0.20.0/24, az: a, public: false}
    - region: us-east-1
      account: team-a
    - region: us-east-1
      account: team-b
  elements:
    - {tf: aws_ram_resource_share, name: subnet-share-team-a, in: account:network}
    - {tf: aws_ram_resource_share, name: subnet-share-team-b, in: account:network}
    - {tf: aws_internet_gateway, name: shared-igw, in: vpc:shared-vpc}
    - {tf: aws_nat_gateway, name: shared-nat, in: subnet:shared-public-a}
    - {tf: aws_vpc_endpoint, name: shared-s3-endpoint, in: vpc:shared-vpc}
    - {tf: aws_instance, name: team-a-app, in: subnet:team-a-private}
    - {tf: aws_lb, name: team-a-alb-application, in: subnet:shared-public-a}
    - {tf: aws_db_instance, name: team-b-db, in: subnet:team-b-private}
  actors: [internet]
  flows:
    - {from: subnet-share-team-a, to: account:team-a, label: share team-a-private, step: 1}
    - {from: subnet-share-team-b, to: account:team-b, label: share team-b-private}
    - {from: account:team-a, to: team-a-app, label: participant launches into shared subnet, step: 2}
    - {from: account:team-b, to: team-b-db, label: participant launches into shared subnet}
    - {from: team-a-app, to: team-b-db, label: "intra-VPC, no peering", step: 3}
    - {from: team-a-app, to: shared-nat, label: owner-managed egress}
    - {from: shared-nat, to: shared-igw}
    - {from: shared-igw, to: internet}
    - {from: team-a-app, to: shared-s3-endpoint, label: owner-managed gateway endpoint}
    - {from: internet, to: team-a-alb-application, label: HTTPS}
- slug: tgw-isolated-vpcs-shared-services
  title: Network segmentation with Transit Gateway route tables and a shared-services VPC
  category: networking
  tags: [transit gateway, segmentation, route tables, isolated vpcs, shared services]
  source: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-isolated-shared.html
  description: "VPCs A, B and C each attach to one Transit Gateway from a public and a private subnet whose instances carry their own network interfaces. Two Transit Gateway route tables implement segmentation: the isolated VPCs A and B are associated with a route table that only holds a propagated route to the shared-services VPC C, so they cannot reach each other, while the shared-services attachment uses a second route table that propagates routes from every VPC; every workload reaches shared tooling but workload VPCs stay mutually isolated without any VPC peering."
  containers:
    - region: eu-west-1
      account_at: [1, 1]
      at: [1, 1]
      vpcs:
        - name: vpc-b
          cidr: 10.2.0.0/16
          at: [1, 1]
          subnets:
            - {name: vpc-b-public, cidr: 10.2.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: vpc-b-private, cidr: 10.2.1.0/24, az: a, public: false, at: [2, 1]}
        - name: vpc-a
          cidr: 10.1.0.0/16
          at: [1, 3]
          subnets:
            - {name: vpc-a-public, cidr: 10.1.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: vpc-a-private, cidr: 10.1.1.0/24, az: a, public: false, at: [2, 1]}
        - name: vpc-c
          cidr: 10.0.0.0/16
          at: [3, 2]
          subnets:
            - {name: vpc-c-public, cidr: 10.0.0.0/24, az: a, public: true, at: [1, 1]}
            - {name: vpc-c-private, cidr: 10.0.1.0/24, az: a, public: false, at: [2, 1]}
  elements:
    - {tf: aws_instance, name: vpc-b-public-instance, in: subnet:vpc-b-public, at: [1, 1]}
    - {tf: aws_network_interface, name: vpc-b-public-eni, in: subnet:vpc-b-public, at: [1, 2]}
    - {tf: aws_instance, name: vpc-b-private-instance, in: subnet:vpc-b-private, at: [1, 1]}
    - {tf: aws_network_interface, name: vpc-b-private-eni, in: subnet:vpc-b-private, at: [1, 2]}
    - {tf: aws_instance, name: vpc-a-public-instance, in: subnet:vpc-a-public, at: [1, 1]}
    - {tf: aws_network_interface, name: vpc-a-public-eni, in: subnet:vpc-a-public, at: [1, 2]}
    - {tf: aws_instance, name: vpc-a-private-instance, in: subnet:vpc-a-private, at: [1, 1]}
    - {tf: aws_network_interface, name: vpc-a-private-eni, in: subnet:vpc-a-private, at: [1, 2]}
    - {tf: aws_instance, name: vpc-c-public-instance, in: subnet:vpc-c-public, at: [1, 1]}
    - {tf: aws_network_interface, name: vpc-c-public-eni, in: subnet:vpc-c-public, at: [1, 2]}
    - {tf: aws_instance, name: vpc-c-private-instance, in: subnet:vpc-c-private, at: [1, 1]}
    - {tf: aws_network_interface, name: vpc-c-private-eni, in: subnet:vpc-c-private, at: [1, 2]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [2, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: isolated-rt, in: region, at: [2, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: shared-rt, in: region, at: [2, 3]}
  actors: []
  flows:
    - {from: hub-tgw, to: vpc:vpc-a, link: aws_ec2_transit_gateway_vpc_attachment, label: associated with isolated-rt}
    - {from: hub-tgw, to: vpc:vpc-b, link: aws_ec2_transit_gateway_vpc_attachment, label: associated with isolated-rt}
    - {from: hub-tgw, to: vpc:vpc-c, link: aws_ec2_transit_gateway_vpc_attachment, label: associated with shared-rt}
    - {from: isolated-rt, to: vpc:vpc-c, label: "isolated-rt: propagated route to VPC C only"}
    - {from: shared-rt, to: vpc:vpc-a, label: "shared-rt: propagated from VPC A"}
    - {from: shared-rt, to: vpc:vpc-b, label: "shared-rt: propagated from VPC B"}
    - {from: vpc-a-private-instance, to: hub-tgw, label: isolated-rt (route to VPC C only), step: 1}
    - {from: hub-tgw, to: vpc-c-private-instance, step: 2}
    - {from: vpc-c-private-instance, to: hub-tgw, label: shared-rt has all VPC routes, step: 3}
    - {from: hub-tgw, to: vpc-b-private-instance, step: 4}
    - {from: vpc-a-private-instance, to: vpc-b-private-instance, label: "blocked, no route in isolated-rt"}
