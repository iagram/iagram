- slug: sd-wan-tgw-connect-vpc-transport
  title: SD-WAN appliances integrated with Transit Gateway Connect over a VPC attachment
  category: networking
  tags: [sd-wan, transit gateway connect, gre, bgp, virtual appliance, branch offices]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/simplify-sd-wan-connectivity-with-aws-transit-gateway-connect/
  description: A third-party SD-WAN virtual appliance runs in a dedicated Connect VPC whose VPC attachment serves as the underlay for a Transit Gateway Connect attachment; the appliance is a Connect peer that builds a GRE tunnel to the Transit Gateway and exchanges routes over BGP, and three workload VPCs (A, B, C) hang off the same Transit Gateway through VPC attachments. The corporate SD-WAN site reaches the appliance over Direct Connect and the SD-WAN overlay, branch sites reach it through the overlay over Site-to-Site VPN, and their prefixes are propagated dynamically into TGW route tables without IPsec throughput limits or static routes.
  containers:
    - datacenter: corporate-sd-wan
      at: [1, 2]
    - region: us-east-1
      account_at: [1, 1, 3, 1]
      vpcs:
        - name: vpc-a
          cidr: 10.0.0.0/16
          at: [1, 1]
          subnets:
            - {name: vpc-a-private, cidr: 10.0.1.0/24, az: a, public: false, at: [1, 1]}
        - name: vpc-b
          cidr: 10.1.0.0/16
          at: [2, 1]
          subnets:
            - {name: vpc-b-private, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
        - name: vpc-c
          cidr: 10.2.0.0/16
          at: [3, 1]
          subnets:
            - {name: vpc-c-private, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
        - name: connect-vpc
          cidr: 172.31.0.0/16
          at: [2, 3]
          subnets:
            - {name: connect-appliance, cidr: 172.31.0.0/24, az: a, public: true, at: [1, 1]}
  elements:
    - {tf: aws_instance, name: vpc-a-instance, in: subnet:vpc-a-private, at: [1, 1]}
    - {tf: aws_instance, name: vpc-b-instance, in: subnet:vpc-b-private, at: [1, 1]}
    - {tf: aws_instance, name: vpc-c-instance, in: subnet:vpc-c-private, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [2, 2]}
    - {tf: aws_ec2_transit_gateway_connect, name: sdwan-connect, in: region, at: [1, 3]}
    - {tf: aws_instance, name: third-party-virtual-appliance, in: subnet:connect-appliance, at: [1, 1]}
    - {tf: aws_dx_connection, name: direct-connect, in: region, at: [1, 4]}
  actors:
    - {type: client, name: branch-office-1, at: [2, 2]}
    - {type: mobile, name: branch-office-2, at: [3, 2]}
  flows:
    - {from: hub-tgw, to: vpc:vpc-a, link: aws_ec2_transit_gateway_vpc_attachment, label: VPC attachment}
    - {from: hub-tgw, to: vpc:vpc-b, link: aws_ec2_transit_gateway_vpc_attachment, label: VPC attachment}
    - {from: hub-tgw, to: vpc:vpc-c, link: aws_ec2_transit_gateway_vpc_attachment, label: VPC attachment}
    - {from: hub-tgw, to: vpc:connect-vpc, link: aws_ec2_transit_gateway_vpc_attachment, label: transport VPC attachment}
    - {from: sdwan-connect, to: hub-tgw, label: Connect attachment over the transport attachment}
    - {from: third-party-virtual-appliance, to: hub-tgw, label: "GRE tunnel + BGP peering (Connect peer)", step: 1}
    - {from: datacenter, to: direct-connect, label: Direct Connect, step: 2}
    - {from: direct-connect, to: third-party-virtual-appliance, label: Direct Connect}
    - {from: datacenter, to: third-party-virtual-appliance, label: SD-WAN overlay}
    - {from: branch-office-1, to: third-party-virtual-appliance, label: SD-WAN overlay over Site-to-Site VPN, step: 3}
    - {from: branch-office-2, to: third-party-virtual-appliance, label: SD-WAN overlay over Site-to-Site VPN}
    - {from: hub-tgw, to: vpc-a-instance, label: branch prefixes propagated via BGP, step: 4}
- slug: sd-wan-tgw-connect-direct-connect
  title: SD-WAN headend reaching Transit Gateway Connect over Direct Connect
  category: networking
  tags: [sd-wan, transit gateway connect, direct connect, transit vif, gre, bgp]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/sd-wan-solutions/sdwan-dx-tgw.html
  description: The corporate SD-WAN device behind the customer gateway terminates a Direct Connect transit virtual interface at the Direct Connect location, reaching a Direct Connect gateway associated with the Transit Gateway; that Direct Connect attachment is the transport for a Connect attachment, and the SD-WAN device is a Connect peer that runs a GRE tunnel and BGP peering directly to the Transit Gateway. Two dual-stack spoke VPCs each hold a workload subnet and a TGW subnet with the Transit Gateway ENI, their VPC route tables send 0.0.0.0/0 and ::/0 to the Transit Gateway, and the spoke and appliance Transit Gateway route tables map the SD-WAN segments into AWS with higher bandwidth and the larger BGP prefix limit of Connect peers.
  containers:
    - datacenter: corporate-data-center
      at: [1, 2]
    - region: eu-west-1
      account_at: [1, 1]
      groups: [{label: dx-location, at: [1, 5, 4, 1]}]
      vpcs:
        - name: spoke-a
          cidr: 10.0.0.0/16
          at: [2, 1]
          subnets:
            - {name: spoke-a-workload, cidr: 10.0.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: spoke-a-tgw, cidr: 10.0.0.0/28, az: a, public: false, at: [2, 1]}
        - name: spoke-b
          cidr: 10.1.0.0/16
          at: [3, 1]
          subnets:
            - {name: spoke-b-tgw, cidr: 10.1.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: spoke-b-workload, cidr: 10.1.1.0/24, az: a, public: false, at: [2, 1]}
  elements:
    - {tf: aws_route_table, name: spoke-a-route-table, in: region, at: [1, 1]}
    - {tf: aws_route_table, name: spoke-b-route-table, in: region, at: [4, 1]}
    - {tf: aws_instance, name: spoke-a-instance, in: subnet:spoke-a-workload, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke-a-tgw-eni, in: subnet:spoke-a-tgw, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke-b-tgw-eni, in: subnet:spoke-b-tgw, at: [1, 1]}
