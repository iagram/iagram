    - {from: dx-connection-1, to: dxgw, label: "virtual interface, BGP", step: 2}
    - {from: dx-connection-2, to: dxgw, label: "virtual interface, BGP"}
    - {from: dxgw, to: tgw-us-east-1, link: aws_dx_gateway_association, step: 3}
    - {from: dxgw, to: tgw-us-east-2, link: aws_dx_gateway_association}
    - {from: tgw-us-east-1, to: vpc:east-1-vpc-1, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-us-east-1, to: vpc:east-1-vpc-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-us-east-1, to: vpc:east-1-vpc-3, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-us-east-2, to: vpc:east-2-vpc-1, link: aws_ec2_transit_gateway_vpc_attachment}
