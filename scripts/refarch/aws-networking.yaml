- slug: tgw-centralized-egress-network-firewall
  title: Centralized IPv4 egress with NAT gateway and AWS Network Firewall
  category: networking
  tags: [transit gateway, centralized egress, network firewall, nat gateway, multi-vpc]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-nat-gateway-with-firewall.html
  description: Spoke VPCs A and B send their default route to a Transit Gateway whose route table 1 forwards all internet-bound traffic to a dedicated egress VPC and blackholes the private range, while route table 2 returns traffic to the right spoke. Inside the egress VPC each Availability Zone has a TGW subnet with the Transit Gateway ENI, a firewall subnet with an AWS Network Firewall endpoint and a public subnet with a NAT gateway; per-subnet route tables chain TGW ENI to firewall endpoint to NAT gateway to the internet gateway, and return traffic follows the same path in reverse.
  containers:
    - region: eu-west-1
      vpcs:
        - name: vpc-a
          cidr: 10.1.0.0/16
          at: [1, 1]
          subnets:
            - {name: vpc-a-private, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
        - name: vpc-b
          cidr: 10.2.0.0/16
          at: [1, 2]
          subnets:
            - {name: vpc-b-private, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
        - name: egress
          cidr: 10.0.0.0/16
          at: [1, 4, 3, 1]
          subnets:
            - {name: egress-tgw-a, cidr: 10.0.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: egress-firewall-a, cidr: 10.0.1.0/28, az: a, public: false, at: [1, 2]}
            - {name: egress-public-a, cidr: 10.0.2.0/24, az: a, public: true, at: [1, 3]}
            - {name: egress-tgw-b, cidr: 10.0.0.16/28, az: b, public: false, at: [1, 1]}
            - {name: egress-firewall-b, cidr: 10.0.1.16/28, az: b, public: false, at: [1, 2]}
            - {name: egress-public-b, cidr: 10.0.3.0/24, az: b, public: true, at: [1, 3]}
  elements:
    - {tf: aws_instance, name: vpc-a-instance, in: subnet:vpc-a-private, at: [1, 1]}
    - {tf: aws_instance, name: vpc-b-instance, in: subnet:vpc-b-private, at: [1, 1]}
    - {tf: aws_route_table, name: spoke-route-table, in: region, at: [1, 3]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [2, 1, 1, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: tgw-route-table-1, in: region, at: [3, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: tgw-route-table-2, in: region, at: [3, 2]}
    - {tf: aws_route_table, name: tgw-subnet-rt-a, in: vpc:egress, at: [1, 1]}
    - {tf: aws_route_table, name: firewall-subnet-rt-a, in: vpc:egress, at: [1, 2]}
    - {tf: aws_route_table, name: public-subnet-rt-a, in: vpc:egress, at: [1, 3]}
    - {tf: aws_network_interface, name: tgw-eni-a, in: subnet:egress-tgw-a, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-1, in: subnet:egress-firewall-a, at: [1, 1]}
    - {tf: aws_nat_gateway, name: nat-gw-1, in: subnet:egress-public-a, at: [1, 1]}
    - {tf: aws_network_interface, name: tgw-eni-b, in: subnet:egress-tgw-b, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-2, in: subnet:egress-firewall-b, at: [1, 1]}
    - {tf: aws_nat_gateway, name: nat-gw-2, in: subnet:egress-public-b, at: [1, 1]}
    - {tf: aws_route_table, name: tgw-subnet-rt-b, in: vpc:egress, at: [4, 1]}
    - {tf: aws_route_table, name: firewall-subnet-rt-b, in: vpc:egress, at: [4, 2]}
    - {tf: aws_route_table, name: public-subnet-rt-b, in: vpc:egress, at: [4, 3]}
    - {tf: aws_internet_gateway, name: egress-igw, in: region, at: [1, 5, 3, 1]}
  actors: []
  flows:
    - {from: hub-tgw, to: vpc:vpc-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:vpc-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: vpc-a-instance, to: hub-tgw, label: "0.0.0.0/0 -> TGW", step: 1}
    - {from: vpc-b-instance, to: hub-tgw, label: "0.0.0.0/0 -> TGW"}
    - {from: spoke-route-table, to: hub-tgw, label: "spoke route table: 0.0.0.0/0 -> TGW"}
    - {from: hub-tgw, to: tgw-route-table-1, label: "route table 1: 0.0.0.0/0 -> Egress VPC, 10.0.0.0/8 -> Blackhole", step: 2}
    - {from: tgw-route-table-2, to: vpc:vpc-a, label: "route table 2: 10.1.0.0/16 -> VPC A"}
    - {from: tgw-route-table-2, to: vpc:vpc-b, label: "route table 2: 10.2.0.0/16 -> VPC B"}
    - {from: hub-tgw, to: tgw-eni-a, label: egress VPC attachment, step: 3}
    - {from: tgw-eni-a, to: firewall-endpoint-1, label: "TGW subnet RT: 0.0.0.0/0 -> FW-VPCE-AZ-A", step: 4}
    - {from: firewall-endpoint-1, to: nat-gw-1, label: "firewall subnet RT: 0.0.0.0/0 -> NAT-GW-A", step: 5}
    - {from: nat-gw-1, to: egress-igw, label: "public subnet RT: 0.0.0.0/0 -> IGW, 10.0.0.0/8 -> FW-VPCE-AZ-A", step: 6}
    - {from: hub-tgw, to: tgw-eni-b}
    - {from: tgw-eni-b, to: firewall-endpoint-2, label: "0.0.0.0/0 -> FW-VPCE-AZ-B"}
    - {from: firewall-endpoint-2, to: nat-gw-2, label: "0.0.0.0/0 -> NAT-GW-B"}
    - {from: nat-gw-2, to: egress-igw, label: "0.0.0.0/0 -> IGW"}
    - {from: tgw-subnet-rt-a, to: tgw-eni-a, label: Route Table Egx 1}
    - {from: firewall-subnet-rt-a, to: firewall-endpoint-1}
    - {from: public-subnet-rt-a, to: nat-gw-1}
    - {from: tgw-subnet-rt-b, to: tgw-eni-b, label: Route Table Egx 2}
    - {from: firewall-subnet-rt-b, to: firewall-endpoint-2}
    - {from: public-subnet-rt-b, to: nat-gw-2}
- slug: tgw-inspection-vpc-east-west-network-firewall
  title: Centralized east-west and hybrid inspection with an inspection VPC
  category: networking
  tags: [transit gateway, inspection vpc, network firewall, east-west, appliance mode, hybrid]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-network-security-for-vpc-to-vpc-and-on-premises-to-vpc-traffic.html
  description: A third-party VPC, a prod VPC and two dev VPCs attach to a Transit Gateway whose untrusted, prod, dev and security route tables send every default route to a security VPC and return known prefixes to the right attachment, Direct Connect gateway or Site-to-Site VPN. The security VPC (10.4.0.0/16) has per Availability Zone a TGW subnet with the Transit Gateway ENI and a firewall subnet with an AWS Network Firewall endpoint; the TGW subnet route table points 0.0.0.0/0 at the firewall endpoint, the firewall subnet route table returns internal prefixes to the Transit Gateway and sends internet-bound traffic to the internet gateway, and appliance mode on the attachment keeps both directions of a flow in the same zone.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      at: [1, 1]
      groups: [{label: transit-gateway, at: [2, 1, 1, 4]}]
      vpcs:
        - name: third-party
          cidr: 172.16.1.0/24
          at: [1, 1]
          subnets:
            - {name: third-party-private-a, cidr: 172.16.1.0/28, az: a, public: false, at: [1, 1]}
        - name: prod
          cidr: 10.1.0.0/16
          at: [1, 2]
          subnets:
            - {name: prod-private-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
        - name: dev-a
          cidr: 10.2.0.0/16
          at: [1, 3]
          subnets:
            - {name: dev-a-private-a, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
        - name: dev-b
          cidr: 10.3.0.0/16
          at: [1, 4]
          subnets:
            - {name: dev-b-private-a, cidr: 10.3.1.0/24, az: a, public: false, at: [1, 1]}
        - name: security
          cidr: 10.4.0.0/16
          at: [1, 5, 3, 1]
          subnets:
            - {name: sec-tgw-a, cidr: 10.4.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: sec-firewall-a, cidr: 10.4.1.0/28, az: a, public: false, at: [1, 2]}
            - {name: sec-tgw-b, cidr: 10.4.2.0/28, az: b, public: false, at: [1, 1]}
            - {name: sec-firewall-b, cidr: 10.4.3.0/28, az: b, public: false, at: [1, 2]}
  elements:
    - {tf: aws_instance, name: third-party-app, in: subnet:third-party-private-a, at: [1, 1]}
    - {tf: aws_instance, name: prod-app, in: subnet:prod-private-a, at: [1, 1]}
    - {tf: aws_instance, name: dev-a-app, in: subnet:dev-a-private-a, at: [1, 1]}
    - {tf: aws_instance, name: dev-b-app, in: subnet:dev-b-private-a, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: group:transit-gateway, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: route-table-untrusted, in: group:transit-gateway, at: [2, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: route-table-prod, in: group:transit-gateway, at: [2, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: route-table-dev, in: group:transit-gateway, at: [2, 3]}
    - {tf: aws_ec2_transit_gateway_route_table, name: route-table-sec, in: group:transit-gateway, at: [2, 4]}
    - {tf: aws_dx_gateway, name: aws-direct-connect, in: region, at: [3, 3]}
    - {tf: aws_route_table, name: tgw-subnet-route-table, in: vpc:security, at: [1, 1]}
    - {tf: aws_route_table, name: firewall-subnet-route-table, in: vpc:security, at: [1, 2]}
    - {tf: aws_internet_gateway, name: security-igw, in: vpc:security, at: [2, 3, 3, 1]}
    - {tf: aws_networkfirewall_firewall, name: network-firewall, in: vpc:security, at: [3, 1, 1, 2]}
    - {tf: aws_network_interface, name: tgw-eni-a, in: subnet:sec-tgw-a, at: [1, 1]}
    - {tf: aws_vpc_endpoint, name: firewall-endpoint-1, in: subnet:sec-firewall-a, at: [1, 1]}
    - {tf: aws_network_interface, name: tgw-eni-b, in: subnet:sec-tgw-b, at: [1, 1]}
    - {tf: aws_vpc_endpoint, name: firewall-endpoint-2, in: subnet:sec-firewall-b, at: [1, 1]}
  actors: [{type: datacenter, name: on-premises, at: [2, 1]}]
  flows:
    - {from: hub-tgw, to: vpc:third-party, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:prod, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:dev-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:dev-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:security, link: aws_ec2_transit_gateway_vpc_attachment, label: appliance mode}
    - {from: route-table-untrusted, to: vpc:security, label: "untrusted: 0.0.0.0/0 -> Security VPC, a.b.c.d/n -> Blackhole"}
    - {from: route-table-prod, to: vpc:prod, label: "prod: 10.1.0.0/16 -> Prod VPC"}
    - {from: route-table-prod, to: aws-direct-connect, label: "prod: w.x.y.z/n -> DXGW"}
    - {from: route-table-prod, to: vpc:security, label: "prod: 0.0.0.0/0 -> Security VPC"}
    - {from: route-table-dev, to: vpc:dev-a, label: "dev: 10.2.0.0/16 -> Dev VPC A"}
    - {from: route-table-dev, to: vpc:dev-b, label: "dev: 10.3.0.0/16 -> Dev VPC B"}
    - {from: route-table-dev, to: vpc:security, label: "dev: 0.0.0.0/0 -> Security VPC, a.b.c.d/n -> Blackhole"}
    - {from: route-table-sec, to: vpc:prod, label: "sec: 10.1.0.0/16 -> Prod VPC"}
    - {from: route-table-sec, to: vpc:dev-a, label: "sec: 10.2.0.0/16 -> Dev VPC A"}
    - {from: route-table-sec, to: vpc:dev-b, label: "sec: 10.3.0.0/16 -> Dev VPC B"}
    - {from: route-table-sec, to: vpc:third-party, label: "sec: 172.16.1.0/24 -> Third Party VPC"}
    - {from: route-table-sec, to: aws-direct-connect, label: "sec: w.x.y.z/n -> DXGW"}
    - {from: route-table-sec, to: datacenter, label: "sec: a.b.c.d/n -> VPN"}
    - {from: datacenter, to: hub-tgw, link: aws_vpn_connection, label: Site-to-Site VPN (100 prefixes)}
    - {from: datacenter, to: aws-direct-connect, label: Direct Connect (100 prefixes combined IPv4/IPv6)}
    - {from: aws-direct-connect, to: hub-tgw, link: aws_dx_gateway_association}
    - {from: prod-app, to: hub-tgw, label: "0.0.0.0/0 -> TGW", step: 1}
    - {from: hub-tgw, to: tgw-eni-a, label: security VPC attachment, step: 2}
    - {from: tgw-eni-a, to: firewall-endpoint-1, label: "TGW subnet RT: 0.0.0.0/0 -> FW-EP-1", step: 3}
    - {from: firewall-endpoint-1, to: network-firewall, label: stateful inspection}
    - {from: firewall-endpoint-1, to: tgw-eni-a, label: "firewall subnet RT: 10.0.0.0/8, w.x.y.z, a.b.c.d/n, 172.16.1.0/24 -> TGW", step: 4}
    - {from: firewall-endpoint-1, to: security-igw, label: "firewall subnet RT: 0.0.0.0/0 -> IGW"}
    - {from: hub-tgw, to: dev-a-app, label: "sec: 10.2.0.0/16 -> Dev VPC A", step: 5}
    - {from: tgw-subnet-route-table, to: tgw-eni-a}
    - {from: firewall-subnet-route-table, to: firewall-endpoint-1}
    - {from: tgw-eni-b, to: firewall-endpoint-2, label: "0.0.0.0/0 -> FW-EP-2"}
    - {from: firewall-endpoint-2, to: network-firewall}
- slug: tgw-gwlb-appliance-inspection
  title: Centralized inspection with Gateway Load Balancer and Transit Gateway
  category: networking
  tags: [gateway load balancer, transit gateway, third-party firewall, appliance vpc, geneve]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-inspection-architecture-with-aws-gateway-load-balancer-and-aws-transit-gateway/
  description: Two spoke VPCs (10.0.0.0/24 and 10.0.1.0/24) attach to a Transit Gateway through a TGW ENI in each Availability Zone; the TGW egress route table sends 0.0.0.0/0 to the appliance VPC attachment and the transit route table returns each spoke prefix to its own attachment. The appliance VPC (192.168.1.0/24) has, per Availability Zone, a Transit Gateway subnet with the TGW ENI, an appliance subnet with a Gateway Load Balancer endpoint and third-party virtual appliances, and a NAT gateway subnet; a Gateway Load Balancer fronts the appliances, traffic reaches them GENEVE-encapsulated through the endpoint, and inspected traffic leaves through the NAT gateway and the internet gateway, with appliance mode on the attachment keeping flows symmetric.
  containers:
    - region: us-west-2
      at: [1, 1]
      vpcs:
        - name: spoke1
          cidr: 10.0.0.0/24
          at: [1, 1, 2, 1]
          subnets:
            - {name: spoke1-b-1, cidr: 10.0.0.32/28, az: b, public: false, at: [1, 1]}
            - {name: spoke1-b-tgw, cidr: 10.0.0.48/28, az: b, public: false, at: [1, 2]}
            - {name: spoke1-a-1, cidr: 10.0.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: spoke1-a-tgw, cidr: 10.0.0.16/28, az: a, public: false, at: [1, 2]}
        - name: spoke2
          cidr: 10.0.1.0/24
          at: [3, 1, 2, 1]
          subnets:
            - {name: spoke2-a-1, cidr: 10.0.1.0/28, az: a, public: false, at: [1, 1]}
            - {name: spoke2-a-tgw, cidr: 10.0.1.16/28, az: a, public: false, at: [1, 2]}
            - {name: spoke2-b-1, cidr: 10.0.1.32/28, az: b, public: false, at: [1, 1]}
            - {name: spoke2-b-tgw, cidr: 10.0.1.48/28, az: b, public: false, at: [1, 2]}
        - name: appliance
          cidr: 192.168.1.0/24
          at: [1, 3, 4, 1]
          subnets:
            - {name: appliance-tgw-a, cidr: 192.168.1.0/28, az: a, public: false, at: [1, 1]}
            - {name: appliance-appliance-a, cidr: 192.168.1.16/28, az: a, public: false, at: [1, 2]}
            - {name: appliance-nat-a, cidr: 192.168.1.32/28, az: a, public: true, at: [1, 3]}
            - {name: appliance-tgw-b, cidr: 192.168.1.48/28, az: b, public: false, at: [1, 1]}
            - {name: appliance-appliance-b, cidr: 192.168.1.64/28, az: b, public: false, at: [1, 2]}
            - {name: appliance-nat-b, cidr: 192.168.1.80/28, az: b, public: true, at: [1, 3]}
  elements:
    - {tf: aws_instance, name: spoke1-app, in: subnet:spoke1-a-1, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke1-tgw-eni-a, in: subnet:spoke1-a-tgw, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke1-tgw-eni-b, in: subnet:spoke1-b-tgw, at: [1, 1]}
    - {tf: aws_instance, name: spoke2-app, in: subnet:spoke2-a-1, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke2-tgw-eni-a, in: subnet:spoke2-a-tgw, at: [1, 1]}
    - {tf: aws_network_interface, name: spoke2-tgw-eni-b, in: subnet:spoke2-b-tgw, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [1, 2, 2, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: tgw-egress-route-table, in: region, at: [3, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: tgw-transit-route-table, in: region, at: [4, 2]}
    - {tf: aws_internet_gateway, name: appliance-igw, in: vpc:appliance, at: [1, 1]}
    - {tf: aws_lb, name: inspection-gwlb, in: vpc:appliance, at: [3, 1]}
    - {tf: aws_network_interface, name: appliance-tgw-eni-a, in: subnet:appliance-tgw-a, at: [1, 1]}
    - {tf: aws_vpc_endpoint, name: gwlb-endpoint-a, in: subnet:appliance-appliance-a, at: [1, 1]}
    - {tf: aws_instance, name: virtual-appliances-a, in: subnet:appliance-appliance-a, at: [1, 2]}
    - {tf: aws_nat_gateway, name: nat-gateway-a, in: subnet:appliance-nat-a, at: [1, 1]}
    - {tf: aws_network_interface, name: appliance-tgw-eni-b, in: subnet:appliance-tgw-b, at: [1, 1]}
    - {tf: aws_vpc_endpoint, name: gwlb-endpoint-b, in: subnet:appliance-appliance-b, at: [1, 1]}
    - {tf: aws_instance, name: virtual-appliances-b, in: subnet:appliance-appliance-b, at: [1, 2]}
    - {tf: aws_nat_gateway, name: nat-gateway-b, in: subnet:appliance-nat-b, at: [1, 1]}
  flows:
    - {from: hub-tgw, to: vpc:spoke1, link: aws_ec2_transit_gateway_vpc_attachment, label: Spoke1 VPC association}
    - {from: hub-tgw, to: vpc:spoke2, link: aws_ec2_transit_gateway_vpc_attachment, label: Spoke2 VPC association}
    - {from: hub-tgw, to: vpc:appliance, link: aws_ec2_transit_gateway_vpc_attachment, label: appliance VPC association (appliance mode)}
    - {from: tgw-egress-route-table, to: vpc:appliance, label: 0.0.0.0/0 to appliance VPC attachment}
    - {from: tgw-transit-route-table, to: vpc:spoke1, label: 10.0.0.0/24 to Spoke1 VPC attachment}
    - {from: tgw-transit-route-table, to: vpc:spoke2, label: 10.0.1.0/24 to Spoke2 VPC attachment}
    - {from: spoke1-app, to: spoke1-tgw-eni-a, label: default route to TGW, step: 1}
    - {from: spoke1-tgw-eni-a, to: hub-tgw, step: 2}
    - {from: hub-tgw, to: appliance-tgw-eni-a, label: egress route table, step: 3}
    - {from: appliance-tgw-eni-a, to: gwlb-endpoint-a, label: TGW subnet route to GWLBE, step: 4}
    - {from: gwlb-endpoint-a, to: inspection-gwlb, label: PrivateLink, step: 5}
    - {from: inspection-gwlb, to: virtual-appliances-a, label: GENEVE 6081, step: 6}
    - {from: gwlb-endpoint-a, to: nat-gateway-a, label: egress after inspection, step: 7}
    - {from: nat-gateway-a, to: appliance-igw, step: 8}
    - {from: hub-tgw, to: spoke2-tgw-eni-a, label: east-west after inspection}
- slug: tgw-centralized-ingress-network-firewall
  title: Centralized ingress with AWS Network Firewall and a shared ALB
  category: networking
  tags: [centralized ingress, network firewall, application load balancer, transit gateway, deep packet inspection]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-network-firewall-for-centralized-ingress.html
  description: An ingress VPC exposes a single internet-facing Application Load Balancer; the internet gateway ingress route table forces inbound packets through an AWS Network Firewall endpoint in each of three Availability Zones before they reach the load balancer. The ALB terminates TLS and forwards across the Transit Gateway to a Network Load Balancer in front of the application instances in each spoke VPC, so spoke VPCs stay private and share one inspected entry point.
  containers:
    - region: eu-central-1
      vpcs:
        - name: spoke-1
          cidr: 10.1.0.0/16
          at: [1, 1]
          subnets:
            - {name: spoke-1-private-a, cidr: 10.1.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: spoke-1-private-b, cidr: 10.1.2.0/24, az: b, public: false, at: [1, 1]}
        - name: spoke-2
          cidr: 10.2.0.0/16
          at: [2, 1]
          subnets:
            - {name: spoke-2-private-a, cidr: 10.2.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: spoke-2-private-b, cidr: 10.2.2.0/24, az: b, public: false, at: [1, 1]}
        - name: ingress
          cidr: 10.0.0.0/16
          at: [1, 3, 2, 1]
          subnets:
            - {name: ingress-firewall-a, cidr: 10.0.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: ingress-firewall-b, cidr: 10.0.0.16/28, az: b, public: false, at: [1, 1]}
            - {name: ingress-firewall-c, cidr: 10.0.0.32/28, az: c, public: false, at: [1, 1]}
  elements:
    - {tf: aws_instance, name: spoke-1-app-a, in: subnet:spoke-1-private-a, at: [1, 1]}
    - {tf: aws_instance, name: spoke-1-app-b, in: subnet:spoke-1-private-b, at: [1, 1]}
    - {tf: aws_lb, name: spoke-1-nlb-network, in: vpc:spoke-1, at: [1, 2, 2, 1]}
    - {tf: aws_instance, name: spoke-2-app-a, in: subnet:spoke-2-private-a, at: [1, 1]}
    - {tf: aws_instance, name: spoke-2-app-b, in: subnet:spoke-2-private-b, at: [1, 1]}
    - {tf: aws_lb, name: spoke-2-nlb-network, in: vpc:spoke-2, at: [1, 2, 2, 1]}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region, at: [1, 2, 2, 1]}
    - {tf: aws_lb, name: ingress-alb-application, in: vpc:ingress, at: [1, 1, 3, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-az1, in: subnet:ingress-firewall-a, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-az2, in: subnet:ingress-firewall-b, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-az3, in: subnet:ingress-firewall-c, at: [1, 1]}
    - {tf: aws_internet_gateway, name: ingress-igw, in: vpc:ingress, at: [1, 3, 3, 1]}
    - {tf: aws_route_table, name: igw-ingress-route-table, in: vpc:ingress, at: [4, 3]}
  actors: [{type: users, name: users, at: [1, 2]}]
  flows:
    - {from: hub-tgw, to: vpc:ingress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-1, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: users, to: ingress-igw, label: HTTPS, step: 1}
    - {from: igw-ingress-route-table, to: ingress-igw, label: "IGW ingress route table: ALB subnet AZn -> VPCe AZn"}
    - {from: ingress-igw, to: firewall-endpoint-az2, label: ingress routing to the firewall endpoint of the AZ, step: 2}
    - {from: firewall-endpoint-az2, to: ingress-alb-application, label: inspected, step: 3}
    - {from: ingress-igw, to: firewall-endpoint-az1}
    - {from: ingress-igw, to: firewall-endpoint-az3}
    - {from: firewall-endpoint-az1, to: ingress-alb-application}
    - {from: firewall-endpoint-az3, to: ingress-alb-application}
    - {from: ingress-alb-application, to: hub-tgw, label: IP targets in spoke, step: 4}
    - {from: hub-tgw, to: spoke-1-nlb-network, step: 5}
    - {from: spoke-1-nlb-network, to: spoke-1-app-a, step: 6}
    - {from: spoke-1-nlb-network, to: spoke-1-app-b}
    - {from: hub-tgw, to: spoke-2-nlb-network}
    - {from: spoke-2-nlb-network, to: spoke-2-app-a}
    - {from: spoke-2-nlb-network, to: spoke-2-app-b}
- slug: tgw-inter-region-peering-global-network
  title: Global network with Transit Gateway inter-Region peering
  category: networking
  tags: [transit gateway, inter-region peering, multi-region, global network, encrypted backbone]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/building-a-global-network-using-aws-transit-gateway-inter-region-peering/
  description: Transit Gateways in eu-west-2 and ap-northeast-2 each attach two VPCs (192.168.0.0/20 and 192.168.16.0/20 in London, 192.168.128.0/20 and 192.168.144.0/20 in Seoul) and are joined by an inter-Region peering attachment that rides the encrypted AWS global network instead of the public internet. Branch offices in LA, London and Seoul reach the nearest Transit Gateway over accelerated Site-to-Site VPN tunnels that enter at an AWS edge location, the London data centre lands on a Direct Connect gateway associated with the London Transit Gateway, and because peering attachments do not propagate routes each TGW route table carries static routes for the remote Region's prefixes.
  containers:
    - region: eu-west-2
      account_at: [1, 4, 2, 1]
      at: [1, 2]
      vpcs:
        - {name: vpc-a-eu-west-2, cidr: 192.168.0.0/20, at: [1, 3]}
        - {name: vpc-b-eu-west-2, cidr: 192.168.16.0/20, at: [2, 3]}
    - region: ap-northeast-2
      at: [3, 2]
      vpcs:
        - {name: vpc-a-ap-northeast-2, cidr: 192.168.128.0/20, at: [1, 2]}
        - {name: vpc-b-ap-northeast-2, cidr: 192.168.144.0/20, at: [2, 2]}
  elements:
    - {tf: aws_ec2_transit_gateway, name: tgw-eu-west-2, in: region:eu-west-2, at: [1, 2]}
    - {tf: aws_ec2_transit_gateway, name: tgw-ap-northeast-2, in: region:ap-northeast-2, at: [2, 1]}
    - {tf: aws_dx_gateway, name: dxgw-eu-west-2, in: account, at: [1, 1]}
    - {tf: aws_networkmanager_global_network, name: aws-global-network, in: account, at: [2, 1, 1, 2]}
  actors:
    - {type: server, name: branch-la, at: [1, 1]}
    - {type: server, name: branch-london, at: [1, 2]}
    - {type: datacenter, name: data-centre-london, at: [1, 3]}
    - {type: server, name: branch-seoul, at: [2, 1]}
  flows:
    - {from: tgw-eu-west-2, to: vpc:vpc-a-eu-west-2, link: aws_ec2_transit_gateway_vpc_attachment, label: "static route 192.168.128.0/20 -> peering", step: 3}
    - {from: tgw-eu-west-2, to: vpc:vpc-b-eu-west-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-ap-northeast-2, to: vpc:vpc-a-ap-northeast-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-ap-northeast-2, to: vpc:vpc-b-ap-northeast-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: vpc:vpc-a-ap-northeast-2, to: tgw-ap-northeast-2, label: "static route 192.168.0.0/20 -> peering attachment", step: 1}
    - {from: tgw-ap-northeast-2, to: tgw-eu-west-2, link: aws_ec2_transit_gateway_peering_attachment, label: inter-region peering over the AWS global network (encrypted), step: 2}
    - {from: branch-la, to: tgw-eu-west-2, link: aws_vpn_connection, label: IPsec accelerated Site-to-Site VPN vpn-lax (172.16.0.0/24, via AWS edge location)}
    - {from: branch-london, to: tgw-eu-west-2, link: aws_vpn_connection, label: IPsec accelerated Site-to-Site VPN vpn-lhr (172.16.1.0/24, via AWS edge location)}
    - {from: branch-seoul, to: tgw-ap-northeast-2, link: aws_vpn_connection, label: IPsec accelerated Site-to-Site VPN vpn-icn (172.16.2.0/24, via AWS edge location)}
    - {from: datacenter, to: dxgw-eu-west-2, label: Direct Connect (10.0.0.0/8)}
    - {from: dxgw-eu-west-2, to: tgw-eu-west-2, link: aws_dx_gateway_association}
    - {from: aws-global-network, to: tgw-eu-west-2, label: registered transit gateway}
    - {from: aws-global-network, to: tgw-ap-northeast-2, label: registered transit gateway}
- slug: cloud-wan-segmented-global-network
  title: AWS Cloud WAN core network with segments across Regions
  category: networking
  tags: [cloud wan, core network, segments, multi-region, policy-based routing]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-cloud-wan.html
  description: A single global core network, defined by a core network policy inside a Network Manager global network, places a core network edge in every chosen Region and joins them over the AWS backbone. Attachments (VPCs, Site-to-Site VPNs, SD-WAN Connect and peered existing transit gateways) are mapped to development, production and shared segments, each an isolated routing domain with its own route table; segment actions share the shared-services segment with the workload segments while keeping production and development apart.
  containers:
    - region: us-east-1
      at: [1, 1]
      groups: [{label: attachments, at: [1, 3]}, {label: development-segment, at: [2, 1, 1, 4]}, {label: production-segment, at: [3, 1, 1, 4]}, {label: shared-segment, at: [4, 1, 1, 4]}]
      vpcs:
        - {name: prod-east, cidr: 10.1.0.0/16, at: [5, 2]}
        - {name: shared-east, cidr: 10.9.0.0/16, at: [5, 3]}
    - region: eu-west-1
      at: [1, 2]
      vpcs:
        - {name: prod-eu, cidr: 10.11.0.0/16, at: [1, 2]}
        - {name: dev-eu, cidr: 10.12.0.0/16, at: [1, 3]}
    - region: ap-southeast-1
      at: [1, 3]
  elements:
    - {tf: aws_networkmanager_global_network, name: global-network, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_networkmanager_core_network, name: core-network, in: region:us-east-1, at: [1, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: development-segment-routes, in: group:development-segment, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: production-segment-routes, in: group:production-segment, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: shared-segment-routes, in: group:shared-segment, at: [1, 1]}
    - {tf: aws_networkmanager_core_network, name: core-network-edge-us-east-1, in: region:us-east-1, at: [5, 1]}
    - {tf: aws_networkmanager_core_network, name: core-network-edge-eu-west-1, in: region:eu-west-1, at: [1, 1]}
    - {tf: aws_networkmanager_core_network, name: core-network-edge-ap-southeast-1, in: region:ap-southeast-1, at: [1, 1]}
    - {tf: aws_customer_gateway, name: site-to-site-vpn-cgw, in: group:attachments, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway_connect, name: sd-wan-connect, in: group:attachments, at: [2, 1]}
    - {tf: aws_ec2_transit_gateway, name: existing-tgw-east, in: region:us-east-1, at: [5, 4]}
    - {tf: aws_ec2_transit_gateway, name: existing-tgw-eu, in: region:eu-west-1, at: [1, 4]}
  actors: []
  flows:
    - {from: global-network, to: core-network, label: core network policy (CNP)}
    - {from: core-network, to: core-network-edge-us-east-1, label: core network edge}
    - {from: core-network, to: core-network-edge-eu-west-1, label: core network edge}
    - {from: core-network, to: core-network-edge-ap-southeast-1, label: core network edge}
    - {from: core-network-edge-us-east-1, to: core-network-edge-eu-west-1, label: AWS backbone}
    - {from: core-network-edge-eu-west-1, to: core-network-edge-ap-southeast-1, label: AWS backbone}
    - {from: core-network, to: development-segment-routes, label: development segment}
    - {from: core-network, to: production-segment-routes, label: production segment}
    - {from: core-network, to: shared-segment-routes, label: shared segment (shared with all)}
    - {from: core-network-edge-us-east-1, to: vpc:prod-east, link: aws_networkmanager_vpc_attachment, label: "segment: production"}
    - {from: core-network-edge-us-east-1, to: vpc:shared-east, link: aws_networkmanager_vpc_attachment, label: "segment: shared"}
    - {from: core-network-edge-eu-west-1, to: vpc:prod-eu, link: aws_networkmanager_vpc_attachment, label: "segment: production"}
    - {from: core-network-edge-eu-west-1, to: vpc:dev-eu, link: aws_networkmanager_vpc_attachment, label: "segment: development"}
    - {from: site-to-site-vpn-cgw, to: core-network, label: Site-to-Site VPN attachment}
    - {from: sd-wan-connect, to: core-network, label: Connect attachment (SD-WAN)}
    - {from: existing-tgw-east, to: core-network-edge-us-east-1, label: Transit Gateway peering}
    - {from: existing-tgw-eu, to: core-network-edge-eu-west-1, label: Transit Gateway peering}
- slug: cloud-wan-centralized-outbound-inspection
  title: Centralized outbound inspection with Cloud WAN service insertion
  category: networking
  tags: [cloud wan, service insertion, network function group, network firewall, centralized egress]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-outbound-inspection-architecture-in-aws-cloud-wan/
  description: A production VPC and an outbound inspection VPC hosting AWS Network Firewall endpoints and NAT gateways in two Availability Zones are attached to an AWS Cloud WAN core network through core network ENIs in dedicated subnets. The production segment's route table carries a static 0.0.0.0/0 route to the inspection VPC attachment while the security segment learns both attachments by propagation, so internet-bound traffic from the production workload is steered through the firewall endpoint and NAT gateway and leaves through the inspection VPC's internet gateway in the same Region.
  containers:
    - region: us-east-1
      groups: [{label: security-segment, at: [3, 1, 1, 2]}, {label: production-segment, at: [4, 1, 1, 2]}]
      vpcs:
        - name: prod
          cidr: 10.1.0.0/16
          at: [1, 1]
          subnets:
            - {name: prod-private-a, cidr: 10.1.0.0/24, az: a, public: false, at: [1, 1]}
            - {name: prod-private-b, cidr: 10.1.1.0/24, az: b, public: false, at: [1, 1]}
        - name: outbound-inspection
          cidr: 10.2.0.0/16
          at: [1, 2]
          subnets:
            - {name: natgw-a, cidr: 10.2.3.0/28, az: a, public: true, at: [1, 1]}
            - {name: network-firewall-a, cidr: 10.2.2.0/28, az: a, public: false, at: [2, 1]}
            - {name: core-network-a, cidr: 10.2.1.0/28, az: a, public: false, at: [3, 1]}
            - {name: natgw-b, cidr: 10.2.13.0/28, az: b, public: true, at: [1, 1]}
            - {name: network-firewall-b, cidr: 10.2.12.0/28, az: b, public: false, at: [2, 1]}
            - {name: core-network-b, cidr: 10.2.11.0/28, az: b, public: false, at: [3, 1]}
  elements:
    - {tf: aws_networkmanager_core_network, name: core-network, in: region, at: [2, 1, 1, 2]}
    - {tf: aws_ec2_transit_gateway_route_table, name: security-segment-routes, in: group:security-segment, at: [1, 1]}
    - {tf: aws_ec2_transit_gateway_route_table, name: production-segment-routes, in: group:production-segment, at: [1, 1]}
    - {tf: aws_instance, name: prod-app-a, in: subnet:prod-private-a, at: [1, 1]}
    - {tf: aws_network_interface, name: prod-core-network-eni-a, in: subnet:prod-private-a, at: [1, 2]}
    - {tf: aws_instance, name: prod-app-b, in: subnet:prod-private-b, at: [1, 1]}
    - {tf: aws_network_interface, name: prod-core-network-eni-b, in: subnet:prod-private-b, at: [1, 2]}
    - {tf: aws_nat_gateway, name: nat-gateway-a, in: subnet:natgw-a, at: [1, 1]}
    - {tf: aws_nat_gateway, name: nat-gateway-b, in: subnet:natgw-b, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-a, in: subnet:network-firewall-a, at: [1, 1]}
    - {tf: aws_networkfirewall_firewall, name: firewall-endpoint-b, in: subnet:network-firewall-b, at: [1, 1]}
    - {tf: aws_network_interface, name: inspection-core-network-eni-a, in: subnet:core-network-a, at: [1, 1]}
    - {tf: aws_network_interface, name: inspection-core-network-eni-b, in: subnet:core-network-b, at: [1, 1]}
    - {tf: aws_internet_gateway, name: internet-gateway, in: vpc:outbound-inspection, at: [1, 3]}
  actors: [{type: internet, name: internet, at: [1, 2]}]
  flows:
    - {from: core-network, to: vpc:prod, link: aws_networkmanager_vpc_attachment, label: production segment}
    - {from: core-network, to: vpc:outbound-inspection, link: aws_networkmanager_vpc_attachment, label: security segment}
    - {from: production-segment-routes, to: core-network, label: static 0.0.0.0/0 to inspection VPC attachment}
    - {from: security-segment-routes, to: core-network, label: propagated prod and inspection attachments}
    - {from: prod-app-a, to: prod-core-network-eni-a, label: 0.0.0.0/0 to core network, step: 1}
    - {from: prod-core-network-eni-a, to: core-network, label: production segment, step: 2}
    - {from: core-network, to: inspection-core-network-eni-a, label: security segment, step: 3}
    - {from: inspection-core-network-eni-a, to: firewall-endpoint-a, step: 4}
    - {from: firewall-endpoint-a, to: nat-gateway-a, step: 5}
    - {from: nat-gateway-a, to: internet-gateway, step: 6}
    - {from: internet-gateway, to: internet, step: 7}
- slug: vpc-peering-full-mesh
  title: Full-mesh VPC peering between three VPCs
  category: networking
  tags: [vpc peering, full mesh, non-transitive, private routing]
  source: https://docs.aws.amazon.com/vpc/latest/peering/peering-configurations-full-access.html
  description: A central VPC A holds one VPC peering connection to each of VPCs B, C, D, E, F and G so that every peer can reach VPC A's full CIDR block and VPC A can reach each of theirs. VPC peering is not transitive, so VPC A cannot relay traffic between its peers; two spokes that also need to talk to each other must be peered directly, which taken to its end gives a full mesh, and each VPC's route table carries one route per peer CIDR pointing at the corresponding peering connection.
  containers:
    - region: us-west-2
      at: [1, 1]
      vpcs:
        - {name: vpc-c, cidr: 10.2.0.0/16, at: [1, 1]}
        - {name: vpc-d, cidr: 10.3.0.0/16, at: [1, 2]}
        - {name: vpc-e, cidr: 10.4.0.0/16, at: [1, 3]}
        - {name: vpc-a, cidr: 10.0.0.0/16, at: [2, 2]}
        - {name: vpc-b, cidr: 10.1.0.0/16, at: [2, 1, 2, 1]}
        - {name: vpc-f, cidr: 10.5.0.0/16, at: [2, 3, 2, 1]}
        - {name: vpc-g, cidr: 10.6.0.0/16, at: [3, 2]}
  elements: []
  actors: []
  flows:
    - {from: vpc:vpc-a, to: vpc:vpc-b, link: aws_vpc_peering_connection, label: pcx-ab}
    - {from: vpc:vpc-a, to: vpc:vpc-c, link: aws_vpc_peering_connection, label: pcx-ac}
    - {from: vpc:vpc-a, to: vpc:vpc-d, link: aws_vpc_peering_connection, label: pcx-ad}
    - {from: vpc:vpc-a, to: vpc:vpc-e, link: aws_vpc_peering_connection, label: pcx-ae}
    - {from: vpc:vpc-a, to: vpc:vpc-f, link: aws_vpc_peering_connection, label: pcx-af}
    - {from: vpc:vpc-a, to: vpc:vpc-g, link: aws_vpc_peering_connection, label: pcx-ag}
- slug: privatelink-saas-provider-consumer
  title: SaaS service exposed to consumers over AWS PrivateLink
  category: networking
  tags: [privatelink, endpoint service, network load balancer, saas, interface endpoint, private dns]
  source: https://aws.amazon.com/blogs/architecture/building-saas-services-for-aws-customers-with-privatelink/
  description: The provider places its auto-scaled application instances, protected by a security group, behind a Network Load Balancer that spans two Availability Zones and is registered as a VPC endpoint service. Each consumer creates an interface endpoint in its own VPC that surfaces as an elastic network interface in each Availability Zone, next to the consumer instances and inside their security group, so the service is reached across the account boundary without internet exposure, peering, or overlapping-CIDR concerns.
  containers:
    - region: us-east-1
      account: provider
      account_at: [1, 1]
      vpcs:
        - name: provider
          cidr: 10.3.0.0/25
          subnets:
            - {name: provider-private-a, cidr: 10.3.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: provider-private-b, cidr: 10.3.0.16/28, az: b, public: false, at: [1, 1]}
    - region: us-east-1
      account: consumer
      account_at: [1, 2]
      vpcs:
        - name: consumer
          cidr: 10.0.0.0/25
          subnets:
            - {name: consumer-private-a, cidr: 10.0.0.0/28, az: a, public: false, at: [1, 1]}
            - {name: consumer-private-b, cidr: 10.0.0.16/28, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_lb, name: provider-nlb-network, in: vpc:provider, at: [1, 2, 2, 1]}
    - {tf: aws_autoscaling_group, name: saas-app-fleet-a, in: subnet:provider-private-a, at: [1, 1]}
    - {tf: aws_security_group, name: saas-app-sg-a, in: subnet:provider-private-a, at: [1, 2]}
