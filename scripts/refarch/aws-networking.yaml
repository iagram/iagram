- slug: tgw-centralized-egress-network-firewall
  title: Centralized IPv4 egress with NAT gateway and AWS Network Firewall
  category: networking
  tags: [transit gateway, centralized egress, network firewall, nat gateway, multi-vpc]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-nat-gateway-with-firewall.html
  description: Spoke VPCs send their default route to a Transit Gateway whose egress route table forwards all internet-bound traffic to a dedicated egress VPC. Inside the egress VPC the traffic passes through AWS Network Firewall endpoints for stateful inspection before a NAT gateway in a public subnet forwards it to the internet gateway; return traffic follows the same path in reverse.
  containers:
    - region: eu-west-1
      vpcs:
        - name: egress
          cidr: 10.0.0.0/16
          subnets:
            - {name: egress-tgw-a, cidr: 10.0.0.0/28, az: a, public: false}
            - {name: egress-firewall-a, cidr: 10.0.1.0/28, az: a, public: false}
            - {name: egress-public-a, cidr: 10.0.2.0/24, az: a, public: true}
            - {name: egress-public-b, cidr: 10.0.3.0/24, az: b, public: true}
        - name: spoke-app
          cidr: 10.1.0.0/16
          subnets:
            - {name: app-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: spoke-data
          cidr: 10.2.0.0/16
          subnets:
            - {name: data-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_networkfirewall_firewall, name: egress-firewall, in: subnet:egress-firewall-a}
    - {tf: aws_nat_gateway, name: egress-nat-a, in: subnet:egress-public-a}
    - {tf: aws_nat_gateway, name: egress-nat-b, in: subnet:egress-public-b}
    - {tf: aws_internet_gateway, name: egress-igw, in: vpc:egress}
    - {tf: aws_instance, name: app-server, in: subnet:app-private-a}
    - {tf: aws_instance, name: data-server, in: subnet:data-private-a}
  actors: [internet]
  flows:
    - {from: hub-tgw, to: vpc:spoke-app, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-data, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: app-server, to: hub-tgw, label: "0.0.0.0/0 via TGW", step: 1}
    - {from: hub-tgw, to: egress-firewall, label: egress route table to firewall endpoint, step: 2}
    - {from: egress-firewall, to: egress-nat-a, label: inspected traffic, step: 3}
    - {from: egress-nat-a, to: egress-igw, label: SNAT, step: 4}
    - {from: egress-igw, to: internet, step: 5}

- slug: tgw-inspection-vpc-east-west-network-firewall
  title: Centralized east-west and hybrid inspection with an inspection VPC
  category: networking
  tags: [transit gateway, inspection vpc, network firewall, east-west, appliance mode, hybrid]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-network-security-for-vpc-to-vpc-and-on-premises-to-vpc-traffic.html
  description: A Transit Gateway with two route tables steers all VPC-to-VPC and on-premises-to-VPC traffic through a dedicated inspection VPC that hosts AWS Network Firewall endpoints in their own subnets, separate from the TGW attachment subnets. Appliance mode on the inspection VPC attachment keeps both directions of a flow on the same Availability Zone so the stateful firewall sees symmetric traffic.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      vpcs:
        - name: inspection
          cidr: 100.64.0.0/16
          subnets:
            - {name: insp-tgw-a, cidr: 100.64.0.0/28, az: a, public: false}
            - {name: insp-firewall-a, cidr: 100.64.1.0/28, az: a, public: false}
            - {name: insp-tgw-b, cidr: 100.64.2.0/28, az: b, public: false}
            - {name: insp-firewall-b, cidr: 100.64.3.0/28, az: b, public: false}
        - name: spoke-prod
          cidr: 10.1.0.0/16
          subnets:
            - {name: prod-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: spoke-dev
          cidr: 10.2.0.0/16
          subnets:
            - {name: dev-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_ec2_transit_gateway_route_table, name: spoke-rt, in: region}
    - {tf: aws_ec2_transit_gateway_route_table, name: firewall-rt, in: region}
    - {tf: aws_networkfirewall_firewall, name: inspection-firewall, in: subnet:insp-firewall-a}
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_vpn_connection, name: dc-vpn, in: region}
    - {tf: aws_instance, name: prod-app, in: subnet:prod-private-a}
    - {tf: aws_instance, name: dev-app, in: subnet:dev-private-a}
  actors: [datacenter]
  flows:
    - {from: hub-tgw, to: vpc:spoke-prod, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-dev, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:inspection, link: aws_ec2_transit_gateway_vpc_attachment, label: appliance mode}
    - {from: dc-cgw, to: dc-vpn, label: IPsec}
    - {from: dc-vpn, to: hub-tgw, label: VPN attachment}
    - {from: prod-app, to: hub-tgw, label: spoke-rt default to inspection, step: 1}
    - {from: hub-tgw, to: inspection-firewall, label: stateful inspection, step: 2}
    - {from: inspection-firewall, to: hub-tgw, label: firewall-rt to destination, step: 3}
    - {from: hub-tgw, to: dev-app, step: 4}
    - {from: datacenter, to: dc-cgw, label: on-prem to VPC also inspected}

- slug: tgw-gwlb-appliance-inspection
  title: Centralized inspection with Gateway Load Balancer and Transit Gateway
  category: networking
  tags: [gateway load balancer, transit gateway, third-party firewall, appliance vpc, geneve]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-inspection-architecture-with-aws-gateway-load-balancer-and-aws-transit-gateway/
  description: A security VPC hosts a Gateway Load Balancer fronting a fleet of third-party firewall appliances in an Auto Scaling group; Gateway Load Balancer endpoints in the same VPC are the routable next hop for traffic arriving from the Transit Gateway. East-west and egress traffic from spoke VPCs is routed to the endpoints, encapsulated in GENEVE to the appliances, and returned transparently to the Transit Gateway, with appliance mode ensuring symmetric flows.
  containers:
    - region: us-east-1
      vpcs:
        - name: security
          cidr: 10.0.0.0/16
          subnets:
            - {name: sec-tgw-a, cidr: 10.0.0.0/28, az: a, public: false}
            - {name: sec-gwlbe-a, cidr: 10.0.1.0/28, az: a, public: false}
            - {name: sec-appliance-a, cidr: 10.0.2.0/24, az: a, public: false}
            - {name: sec-public-a, cidr: 10.0.3.0/24, az: a, public: true}
        - name: spoke-a
          cidr: 10.1.0.0/16
          subnets:
            - {name: spoke-a-private, cidr: 10.1.1.0/24, az: a, public: false}
        - name: spoke-b
          cidr: 10.2.0.0/16
          subnets:
            - {name: spoke-b-private, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_lb, name: inspection-gwlb, in: subnet:sec-appliance-a}
    - {tf: aws_vpc_endpoint, name: gwlb-endpoint-a, in: subnet:sec-gwlbe-a}
    - {tf: aws_autoscaling_group, name: firewall-appliances, in: subnet:sec-appliance-a}
    - {tf: aws_instance, name: firewall-appliance-1, in: subnet:sec-appliance-a}
    - {tf: aws_nat_gateway, name: sec-nat-a, in: subnet:sec-public-a}
    - {tf: aws_internet_gateway, name: sec-igw, in: vpc:security}
    - {tf: aws_instance, name: app-a, in: subnet:spoke-a-private}
    - {tf: aws_instance, name: app-b, in: subnet:spoke-b-private}
  actors: [internet]
  flows:
    - {from: hub-tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:security, link: aws_ec2_transit_gateway_vpc_attachment, label: appliance mode}
    - {from: app-a, to: hub-tgw, label: route to security VPC, step: 1}
    - {from: hub-tgw, to: gwlb-endpoint-a, label: TGW subnet route to GWLBE, step: 2}
    - {from: gwlb-endpoint-a, to: inspection-gwlb, label: PrivateLink, step: 3}
    - {from: inspection-gwlb, to: firewall-appliance-1, label: GENEVE 6081, step: 4}
    - {from: firewall-appliance-1, to: inspection-gwlb, label: return, step: 5}
    - {from: gwlb-endpoint-a, to: sec-nat-a, label: egress after inspection}
    - {from: sec-nat-a, to: sec-igw}
    - {from: sec-igw, to: internet}
    - {from: hub-tgw, to: app-b, label: east-west after inspection}

- slug: tgw-centralized-ingress-network-firewall
  title: Centralized ingress with AWS Network Firewall and a shared ALB
  category: networking
  tags: [centralized ingress, network firewall, application load balancer, transit gateway, deep packet inspection]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-network-firewall-for-centralized-ingress.html
  description: An ingress VPC exposes a single internet-facing Application Load Balancer; the internet gateway route table (ingress routing) forces inbound packets through AWS Network Firewall endpoints before they reach the load balancer subnets. The ALB terminates TLS and forwards to application targets in spoke VPCs across the Transit Gateway, so spoke VPCs stay private and share one inspected entry point.
  containers:
    - region: eu-central-1
      vpcs:
        - name: ingress
          cidr: 10.0.0.0/16
          subnets:
            - {name: ingress-firewall-a, cidr: 10.0.0.0/28, az: a, public: false}
            - {name: ingress-alb-a, cidr: 10.0.1.0/24, az: a, public: true}
            - {name: ingress-alb-b, cidr: 10.0.2.0/24, az: b, public: true}
            - {name: ingress-tgw-a, cidr: 10.0.3.0/28, az: a, public: false}
        - name: spoke-web
          cidr: 10.1.0.0/16
          subnets:
            - {name: web-private-a, cidr: 10.1.1.0/24, az: a, public: false}
            - {name: web-private-b, cidr: 10.1.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_internet_gateway, name: ingress-igw, in: vpc:ingress}
    - {tf: aws_networkfirewall_firewall, name: ingress-firewall, in: subnet:ingress-firewall-a}
    - {tf: aws_lb, name: ingress-alb-application, in: subnet:ingress-alb-a}
    - {tf: aws_acm_certificate, name: web-cert, in: region}
    - {tf: aws_instance, name: web-1, in: subnet:web-private-a}
    - {tf: aws_instance, name: web-2, in: subnet:web-private-b}
  actors: [users]
  flows:
    - {from: hub-tgw, to: vpc:ingress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-web, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: users, to: ingress-igw, label: HTTPS, step: 1}
    - {from: ingress-igw, to: ingress-firewall, label: IGW ingress route to firewall endpoint, step: 2}
    - {from: ingress-firewall, to: ingress-alb-application, label: inspected, step: 3}
    - {from: ingress-alb-application, to: hub-tgw, label: IP targets in spoke, step: 4}
    - {from: hub-tgw, to: web-1, step: 5}
    - {from: web-cert, to: ingress-alb-application, label: TLS certificate}

- slug: tgw-inter-region-peering-global-network
  title: Global network with Transit Gateway inter-Region peering
  category: networking
  tags: [transit gateway, inter-region peering, multi-region, global network, encrypted backbone]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/building-a-global-network-using-aws-transit-gateway-inter-region-peering/
  description: Each Region runs its own Transit Gateway hub with local VPC attachments, and the two hubs are joined by a peering attachment that carries traffic over the encrypted AWS global backbone rather than the public internet. Peering attachments do not propagate routes, so each TGW route table holds static routes for the remote Region's CIDRs; on-premises sites connected to one hub can reach VPCs in the other Region through the peering.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      vpcs:
        - name: east-app
          cidr: 10.1.0.0/16
          subnets:
            - {name: east-app-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: east-shared
          cidr: 10.2.0.0/16
          subnets:
            - {name: east-shared-private-a, cidr: 10.2.1.0/24, az: a, public: false}
    - region: eu-west-1
      vpcs:
        - name: eu-app
          cidr: 10.11.0.0/16
          subnets:
            - {name: eu-app-private-a, cidr: 10.11.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: tgw-east, in: region:us-east-1}
    - {tf: aws_ec2_transit_gateway, name: tgw-eu, in: region:eu-west-1}
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_vpn_connection, name: dc-vpn, in: region:us-east-1}
    - {tf: aws_instance, name: east-app-server, in: subnet:east-app-private-a}
    - {tf: aws_instance, name: east-directory, in: subnet:east-shared-private-a}
    - {tf: aws_instance, name: eu-app-server, in: subnet:eu-app-private-a}
  actors: [datacenter]
  flows:
    - {from: tgw-east, to: vpc:east-app, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-east, to: vpc:east-shared, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-eu, to: vpc:eu-app, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: tgw-east, to: tgw-eu, link: aws_ec2_transit_gateway_peering_attachment, label: inter-Region peering (static routes)}
    - {from: datacenter, to: dc-cgw, label: IPsec}
    - {from: dc-cgw, to: dc-vpn}
    - {from: dc-vpn, to: tgw-east, label: VPN attachment}
    - {from: eu-app-server, to: tgw-eu, label: "10.2.0.0/16 via peering", step: 1}
    - {from: tgw-eu, to: tgw-east, label: "AWS backbone, encrypted", step: 2}
    - {from: tgw-east, to: east-directory, step: 3}

- slug: cloud-wan-segmented-global-network
  title: AWS Cloud WAN core network with segments across Regions
  category: networking
  tags: [cloud wan, core network, segments, multi-region, policy-based routing]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-cloud-wan.html
  description: A single global core network defined by a core network policy places a core network edge in every chosen Region and joins them over the AWS backbone; VPC attachments are mapped to production, development, and shared segments using attachment tags. Segments are isolated routing domains, and the policy's segment actions share the shared-services segment with the workload segments while keeping production and development apart.
  containers:
    - region: us-east-1
      vpcs:
        - name: prod-east
          cidr: 10.1.0.0/16
          subnets:
            - {name: prod-east-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: shared-east
          cidr: 10.9.0.0/16
          subnets:
            - {name: shared-east-private-a, cidr: 10.9.1.0/24, az: a, public: false}
    - region: eu-west-1
      vpcs:
        - name: prod-eu
          cidr: 10.11.0.0/16
          subnets:
            - {name: prod-eu-private-a, cidr: 10.11.1.0/24, az: a, public: false}
        - name: dev-eu
          cidr: 10.12.0.0/16
          subnets:
            - {name: dev-eu-private-a, cidr: 10.12.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_networkmanager_global_network, name: global-network, in: region:us-east-1}
    - {tf: aws_networkmanager_core_network, name: core-network, in: region:us-east-1}
    - {tf: aws_instance, name: prod-east-app, in: subnet:prod-east-private-a}
    - {tf: aws_instance, name: shared-directory, in: subnet:shared-east-private-a}
    - {tf: aws_instance, name: prod-eu-app, in: subnet:prod-eu-private-a}
    - {tf: aws_instance, name: dev-eu-app, in: subnet:dev-eu-private-a}
  actors: []
  flows:
    - {from: core-network, to: vpc:prod-east, link: aws_networkmanager_vpc_attachment, label: "segment: production"}
    - {from: core-network, to: vpc:prod-eu, link: aws_networkmanager_vpc_attachment, label: "segment: production"}
    - {from: core-network, to: vpc:dev-eu, link: aws_networkmanager_vpc_attachment, label: "segment: development"}
    - {from: core-network, to: vpc:shared-east, link: aws_networkmanager_vpc_attachment, label: "segment: shared (shared to all)"}
    - {from: global-network, to: core-network, label: policy document}
    - {from: prod-eu-app, to: core-network, label: "same segment, cross-Region", step: 1}
    - {from: core-network, to: prod-east-app, label: core network edge to edge, step: 2}
    - {from: dev-eu-app, to: shared-directory, label: via shared segment}

- slug: cloud-wan-centralized-outbound-inspection
  title: Centralized outbound inspection with Cloud WAN service insertion
  category: networking
  tags: [cloud wan, service insertion, network function group, network firewall, centralized egress]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-outbound-inspection-architecture-in-aws-cloud-wan/
  description: Inspection VPCs hosting AWS Network Firewall endpoints and NAT gateways are attached to the core network as a network function group instead of a segment. A send-to action in the core network policy steers the default route of the production and development segments into the network function group, so internet-bound traffic is inspected in the local Region before leaving through the inspection VPC's NAT gateways.
  containers:
    - region: us-east-1
      vpcs:
        - name: inspection-east
          cidr: 100.64.0.0/16
          subnets:
            - {name: insp-cwan-a, cidr: 100.64.0.0/28, az: a, public: false}
            - {name: insp-firewall-a, cidr: 100.64.1.0/28, az: a, public: false}
            - {name: insp-public-a, cidr: 100.64.2.0/24, az: a, public: true}
        - name: prod-east
          cidr: 10.1.0.0/16
          subnets:
            - {name: prod-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: dev-east
          cidr: 10.2.0.0/16
          subnets:
            - {name: dev-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_networkmanager_global_network, name: global-network, in: region}
    - {tf: aws_networkmanager_core_network, name: core-network, in: region}
    - {tf: aws_networkfirewall_firewall, name: inspection-firewall, in: subnet:insp-firewall-a}
    - {tf: aws_nat_gateway, name: inspection-nat, in: subnet:insp-public-a}
    - {tf: aws_internet_gateway, name: inspection-igw, in: vpc:inspection-east}
    - {tf: aws_instance, name: prod-app, in: subnet:prod-private-a}
    - {tf: aws_instance, name: dev-app, in: subnet:dev-private-a}
  actors: [internet]
  flows:
    - {from: core-network, to: vpc:prod-east, link: aws_networkmanager_vpc_attachment, label: "segment: production"}
    - {from: core-network, to: vpc:dev-east, link: aws_networkmanager_vpc_attachment, label: "segment: development"}
    - {from: core-network, to: vpc:inspection-east, link: aws_networkmanager_vpc_attachment, label: network function group}
    - {from: global-network, to: core-network}
    - {from: prod-app, to: core-network, label: "0.0.0.0/0", step: 1}
    - {from: core-network, to: inspection-firewall, label: send-to network function group, step: 2}
    - {from: inspection-firewall, to: inspection-nat, step: 3}
    - {from: inspection-nat, to: inspection-igw, step: 4}
    - {from: inspection-igw, to: internet, step: 5}

- slug: vpc-peering-full-mesh
  title: Full-mesh VPC peering between three VPCs
  category: networking
  tags: [vpc peering, full mesh, non-transitive, private routing]
  source: https://docs.aws.amazon.com/vpc/latest/peering/peering-configurations-full-access.html
  description: Three VPCs that need to reach each other's full CIDR blocks are peered pairwise, because VPC peering is not transitive and a hub cannot relay traffic between spokes. Each VPC's route table carries one route per peer CIDR pointing at the corresponding peering connection, and security groups may reference peer security groups within the same Region.
  containers:
    - region: us-west-2
      vpcs:
        - name: vpc-a
          cidr: 10.0.0.0/16
          subnets:
            - {name: a-private, cidr: 10.0.1.0/24, az: a, public: false}
        - name: vpc-b
          cidr: 10.1.0.0/16
          subnets:
            - {name: b-private, cidr: 10.1.1.0/24, az: a, public: false}
        - name: vpc-c
          cidr: 10.2.0.0/16
          subnets:
            - {name: c-private, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_instance, name: server-a, in: subnet:a-private}
    - {tf: aws_instance, name: server-b, in: subnet:b-private}
    - {tf: aws_instance, name: server-c, in: subnet:c-private}
    - {tf: aws_route_table, name: rt-a, in: vpc:vpc-a}
    - {tf: aws_route_table, name: rt-b, in: vpc:vpc-b}
    - {tf: aws_route_table, name: rt-c, in: vpc:vpc-c}
  actors: []
  flows:
    - {from: vpc:vpc-a, to: vpc:vpc-b, link: aws_vpc_peering_connection, label: pcx-ab}
    - {from: vpc:vpc-b, to: vpc:vpc-c, link: aws_vpc_peering_connection, label: pcx-bc}
    - {from: vpc:vpc-a, to: vpc:vpc-c, link: aws_vpc_peering_connection, label: pcx-ac}
