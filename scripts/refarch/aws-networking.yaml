- slug: privatelink-saas-provider-consumer
  title: SaaS service exposed to consumers over AWS PrivateLink
  category: networking
  tags: [privatelink, endpoint service, network load balancer, saas, interface endpoint, private dns]
  source: https://aws.amazon.com/blogs/architecture/building-saas-services-for-aws-customers-with-privatelink/
  description: The provider places its application behind a Network Load Balancer and registers the load balancer with a VPC endpoint service, optionally with a verified private DNS name and acceptance rules for consumer accounts. Each consumer creates an interface endpoint in its own VPC that surfaces as elastic network interfaces with private IPs, so the service is reached without internet exposure, peering, or overlapping-CIDR concerns.
  containers:
    - region: us-east-1
      account: provider
      vpcs:
        - name: provider
          cidr: 10.0.0.0/16
          subnets:
            - {name: provider-private-a, cidr: 10.0.1.0/24, az: a, public: false}
            - {name: provider-private-b, cidr: 10.0.2.0/24, az: b, public: false}
    - region: us-east-1
      account: consumer
      vpcs:
        - name: consumer
          cidr: 10.0.0.0/16
          subnets:
            - {name: consumer-private-a, cidr: 10.0.1.0/24, az: a, public: false}
            - {name: consumer-private-b, cidr: 10.0.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_lb, name: provider-nlb-network, in: subnet:provider-private-a}
    - {tf: aws_vpc_endpoint_service, name: saas-endpoint-service, in: vpc:provider}
    - {tf: aws_autoscaling_group, name: saas-app-fleet, in: subnet:provider-private-a}
    - {tf: aws_instance, name: saas-app-1, in: subnet:provider-private-a}
    - {tf: aws_instance, name: saas-app-2, in: subnet:provider-private-b}
    - {tf: aws_vpc_endpoint, name: saas-interface-endpoint, in: subnet:consumer-private-a}
    - {tf: aws_route53_zone, name: saas-private-dns, in: vpc:consumer}
    - {tf: aws_instance, name: consumer-app, in: subnet:consumer-private-a}
  actors: []
  flows:
    - {from: consumer-app, to: saas-private-dns, label: resolve api.saas.example.com, step: 1}
    - {from: consumer-app, to: saas-interface-endpoint, label: TLS to endpoint ENI, step: 2}
    - {from: saas-interface-endpoint, to: saas-endpoint-service, label: PrivateLink (overlapping CIDRs allowed), step: 3}
    - {from: saas-endpoint-service, to: provider-nlb-network, step: 4}
    - {from: provider-nlb-network, to: saas-app-1, step: 5}
    - {from: provider-nlb-network, to: saas-app-2}

- slug: privatelink-centralized-interface-endpoints
  title: Centralized interface endpoints shared across VPCs via Transit Gateway
  category: networking
  tags: [privatelink, interface endpoint, shared services vpc, private hosted zone, transit gateway, cost optimization]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-access-to-vpc-private-endpoints.html
  description: Interface endpoints for AWS services are provisioned once in a shared-services VPC instead of in every spoke, and spokes reach them across the Transit Gateway. Because the endpoint's managed private DNS only resolves inside its own VPC, private DNS is disabled and a Route 53 private hosted zone matching the service name with an alias record to the endpoint is associated with every spoke VPC.
  containers:
    - region: eu-west-1
      vpcs:
        - name: shared-services
          cidr: 10.0.0.0/16
          subnets:
            - {name: shared-endpoints-a, cidr: 10.0.1.0/24, az: a, public: false}
            - {name: shared-endpoints-b, cidr: 10.0.2.0/24, az: b, public: false}
        - name: spoke-1
          cidr: 10.1.0.0/16
          subnets:
            - {name: spoke-1-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: spoke-2
          cidr: 10.2.0.0/16
          subnets:
            - {name: spoke-2-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_vpc_endpoint, name: sqs-endpoint, in: subnet:shared-endpoints-a}
    - {tf: aws_vpc_endpoint, name: ssm-endpoint, in: subnet:shared-endpoints-a}
    - {tf: aws_route53_zone, name: phz-sqs-eu-west-1, in: vpc:shared-services}
    - {tf: aws_route53_zone, name: phz-ssm-eu-west-1, in: vpc:shared-services}
    - {tf: aws_instance, name: spoke-1-app, in: subnet:spoke-1-private-a}
    - {tf: aws_instance, name: spoke-2-app, in: subnet:spoke-2-private-a}
  actors: []
  flows:
    - {from: hub-tgw, to: vpc:shared-services, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-1, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-2, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: phz-sqs-eu-west-1, to: vpc:spoke-1, link: aws_route53_zone_association}
    - {from: phz-sqs-eu-west-1, to: vpc:spoke-2, link: aws_route53_zone_association}
    - {from: spoke-1-app, to: phz-sqs-eu-west-1, label: resolve sqs.eu-west-1.amazonaws.com to endpoint IP, step: 1}
    - {from: spoke-1-app, to: hub-tgw, label: "10.0.0.0/16 via TGW", step: 2}
    - {from: hub-tgw, to: sqs-endpoint, step: 3}
    - {from: spoke-2-app, to: ssm-endpoint, label: same shared endpoints}

- slug: vpc-lattice-multi-account-service-network
  title: Multi-account service-to-service connectivity with Amazon VPC Lattice
  category: networking
  tags: [vpc lattice, service network, multi-account, ram, application networking, iam auth]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/build-secure-multi-account-multi-vpc-connectivity-for-your-applications-with-amazon-vpc-lattice/
  description: A central networking account owns a VPC Lattice service network and shares it with workload accounts through AWS RAM; each workload account associates its VPC with the service network and registers its own services with target groups pointing at instances, containers, or Lambda functions. Consumers call services by their Lattice DNS names through the link-local Lattice prefix, with IAM auth policies on the service network and services controlling who may invoke what, independent of VPC CIDRs.
  containers:
    - region: us-west-2
      account: networking
    - region: us-west-2
      account: payments
      vpcs:
        - name: payments
          cidr: 10.1.0.0/16
          subnets:
            - {name: payments-private-a, cidr: 10.1.1.0/24, az: a, public: false}
    - region: us-west-2
      account: orders
      vpcs:
        - name: orders
          cidr: 10.1.0.0/16
          subnets:
            - {name: orders-private-a, cidr: 10.1.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_vpclattice_service_network, name: corp-service-network, in: account:networking}
    - {tf: aws_ram_resource_share, name: service-network-share, in: account:networking}
    - {tf: aws_vpclattice_service, name: payments-service, in: account:payments}
    - {tf: aws_vpclattice_target_group, name: payments-targets, in: vpc:payments}
    - {tf: aws_instance, name: payments-api, in: subnet:payments-private-a}
    - {tf: aws_vpclattice_service, name: orders-service, in: account:orders}
    - {tf: aws_lambda_function, name: orders-handler, in: vpc:orders}
    - {tf: aws_instance, name: orders-client, in: subnet:orders-private-a}
  actors: []
  flows:
    - {from: corp-service-network, to: vpc:payments, link: aws_vpclattice_service_network_vpc_association}
    - {from: corp-service-network, to: vpc:orders, link: aws_vpclattice_service_network_vpc_association}
    - {from: corp-service-network, to: payments-service, link: aws_vpclattice_service_network_service_association}
    - {from: corp-service-network, to: orders-service, link: aws_vpclattice_service_network_service_association}
    - {from: service-network-share, to: account:payments, label: RAM share}
    - {from: service-network-share, to: account:orders, label: RAM share}
    - {from: orders-client, to: corp-service-network, label: "HTTPS to payments Lattice DNS name, SigV4", step: 1}
    - {from: corp-service-network, to: payments-service, label: auth policy evaluated, step: 2}
    - {from: payments-service, to: payments-targets, step: 3}
    - {from: payments-targets, to: payments-api, step: 4}
    - {from: orders-service, to: orders-handler, label: Lambda target}

- slug: dx-maximum-resiliency-transit-vif
  title: Direct Connect maximum resiliency with transit VIFs to a Transit Gateway
  category: networking
  tags: [direct connect, maximum resiliency, transit virtual interface, direct connect gateway, transit gateway, bgp]
  source: https://docs.aws.amazon.com/directconnect/latest/UserGuide/maximum_resiliency.html
  description: Two Direct Connect locations each terminate two dedicated connections on separate devices, giving four physical paths that survive device, connection, and complete location failure. A transit virtual interface on each connection peers over BGP with a Direct Connect gateway that is associated with the Regional Transit Gateway, so every attached VPC is reachable from the data center over private connectivity with a 99.99 percent SLA target.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      groups: [{label: dx-location-1}, {label: dx-location-2}]
      vpcs:
        - name: prod
          cidr: 10.1.0.0/16
          subnets:
            - {name: prod-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: shared
          cidr: 10.2.0.0/16
          subnets:
            - {name: shared-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_dx_connection, name: dx-loc1-conn-a, in: group:dx-location-1}
    - {tf: aws_dx_connection, name: dx-loc1-conn-b, in: group:dx-location-1}
    - {tf: aws_dx_connection, name: dx-loc2-conn-a, in: group:dx-location-2}
    - {tf: aws_dx_connection, name: dx-loc2-conn-b, in: group:dx-location-2}
    - {tf: aws_dx_transit_virtual_interface, name: transit-vif-1a, in: group:dx-location-1}
    - {tf: aws_dx_transit_virtual_interface, name: transit-vif-2a, in: group:dx-location-2}
    - {tf: aws_dx_gateway, name: dx-gateway, in: region}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_instance, name: prod-app, in: subnet:prod-private-a}
    - {tf: aws_instance, name: shared-server, in: subnet:shared-private-a}
  actors: [datacenter]
  flows:
    - {from: datacenter, to: dx-loc1-conn-a, label: "router 1, cross-connect"}
    - {from: datacenter, to: dx-loc1-conn-b, label: "router 2, cross-connect"}
    - {from: datacenter, to: dx-loc2-conn-a, label: "router 3, cross-connect"}
    - {from: datacenter, to: dx-loc2-conn-b, label: "router 4, cross-connect"}
    - {from: dx-loc1-conn-a, to: transit-vif-1a, label: "VLAN, BGP"}
    - {from: dx-loc2-conn-a, to: transit-vif-2a, label: "VLAN, BGP"}
    - {from: transit-vif-1a, to: dx-gateway}
    - {from: transit-vif-2a, to: dx-gateway}
    - {from: dx-gateway, to: hub-tgw, link: aws_dx_gateway_association, label: allowed prefixes}
    - {from: hub-tgw, to: vpc:prod, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:shared, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: prod-app, label: on-prem to VPC}

- slug: dx-gateway-private-vif-multi-region
  title: Direct Connect gateway with a private VIF reaching VPCs in multiple Regions
  category: networking
  tags: [direct connect, private virtual interface, direct connect gateway, virtual private gateway, multi-region]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/hybrid-cloud-architectures-using-aws-direct-connect-gateway/
  description: A single Direct Connect connection carries a private virtual interface to a globally scoped Direct Connect gateway, which is associated with virtual private gateways attached to VPCs in two different Regions. Routes for each VPC are advertised to the customer router over one BGP session, and the gateway does not forward traffic between the associated VPCs or back toward on-premises through another VIF.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      groups: [{label: dx-location}]
      vpcs:
        - name: east-app
          cidr: 10.1.0.0/16
          subnets:
            - {name: east-private-a, cidr: 10.1.1.0/24, az: a, public: false}
    - region: ap-southeast-1
      vpcs:
        - name: apac-app
          cidr: 10.21.0.0/16
          subnets:
            - {name: apac-private-a, cidr: 10.21.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_dx_connection, name: dx-connection, in: group:dx-location}
    - {tf: aws_dx_private_virtual_interface, name: private-vif, in: group:dx-location}
    - {tf: aws_dx_gateway, name: dx-gateway, in: region:us-east-1}
    - {tf: aws_vpn_gateway, name: east-vgw, in: vpc:east-app}
    - {tf: aws_vpn_gateway, name: apac-vgw, in: vpc:apac-app}
    - {tf: aws_instance, name: east-server, in: subnet:east-private-a}
    - {tf: aws_instance, name: apac-server, in: subnet:apac-private-a}
  actors: [datacenter]
  flows:
    - {from: datacenter, to: dx-connection, label: 1 or 10 Gbps cross-connect, step: 1}
    - {from: dx-connection, to: private-vif, label: "802.1Q VLAN, BGP", step: 2}
    - {from: private-vif, to: dx-gateway, step: 3}
    - {from: dx-gateway, to: east-vgw, link: aws_dx_gateway_association}
    - {from: dx-gateway, to: apac-vgw, link: aws_dx_gateway_association}
    - {from: east-vgw, to: east-server, label: propagated route, step: 4}
    - {from: apac-vgw, to: apac-server, label: cross-Region over AWS backbone}

- slug: sd-wan-tgw-connect-vpc-transport
  title: SD-WAN appliances integrated with Transit Gateway Connect over a VPC attachment
  category: networking
  tags: [sd-wan, transit gateway connect, gre, bgp, virtual appliance, branch offices]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/simplify-sd-wan-connectivity-with-aws-transit-gateway-connect/
  description: SD-WAN virtual appliances run in a dedicated transport VPC whose attachment serves as the underlay for a Transit Gateway Connect attachment; each appliance is a Connect peer that builds a GRE tunnel to the Transit Gateway and exchanges routes over BGP. Branch sites reach the appliances through the SD-WAN overlay across the internet, and their prefixes are propagated dynamically into TGW route tables without IPsec throughput limits or static routes.
  containers:
    - datacenter: branch-offices
    - region: us-east-1
      vpcs:
        - name: sdwan-transport
          cidr: 10.0.0.0/16
          subnets:
            - {name: sdwan-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: sdwan-public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: sdwan-tgw-a, cidr: 10.0.2.0/28, az: a, public: false}
        - name: workload
          cidr: 10.1.0.0/16
          subnets:
            - {name: workload-private-a, cidr: 10.1.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_ec2_transit_gateway_connect, name: sdwan-connect, in: region}
    - {tf: aws_instance, name: sdwan-appliance-a, in: subnet:sdwan-public-a}
    - {tf: aws_instance, name: sdwan-appliance-b, in: subnet:sdwan-public-b}
    - {tf: aws_internet_gateway, name: sdwan-igw, in: vpc:sdwan-transport}
    - {tf: aws_instance, name: workload-server, in: subnet:workload-private-a}
  actors: [datacenter, internet]
  flows:
    - {from: hub-tgw, to: vpc:sdwan-transport, link: aws_ec2_transit_gateway_vpc_attachment, label: transport attachment}
    - {from: hub-tgw, to: vpc:workload, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: sdwan-connect, to: hub-tgw, label: Connect attachment over transport}
    - {from: sdwan-appliance-a, to: sdwan-connect, link: aws_ec2_transit_gateway_connect_peer, label: GRE + BGP}
    - {from: sdwan-appliance-b, to: sdwan-connect, link: aws_ec2_transit_gateway_connect_peer, label: GRE + BGP}
    - {from: datacenter, to: internet, label: SD-WAN overlay tunnels, step: 1}
    - {from: internet, to: sdwan-igw, step: 2}
    - {from: sdwan-igw, to: sdwan-appliance-a, step: 3}
    - {from: sdwan-appliance-a, to: hub-tgw, label: "GRE tunnel, branch prefixes via BGP", step: 4}
    - {from: hub-tgw, to: workload-server, step: 5}

- slug: sd-wan-tgw-connect-direct-connect
  title: SD-WAN headend reaching Transit Gateway Connect over Direct Connect
  category: networking
  tags: [sd-wan, transit gateway connect, direct connect, transit vif, gre, bgp]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/sd-wan-solutions/sdwan-dx-tgw.html
  description: The on-premises SD-WAN device terminates a Direct Connect transit virtual interface through a Direct Connect gateway associated with the Transit Gateway, and that Direct Connect attachment is the transport for a Connect attachment. The SD-WAN device is a Connect peer that runs GRE and BGP directly to the Transit Gateway, extending SD-WAN segmentation into AWS with higher bandwidth and the larger BGP prefix limit of Connect peers.
