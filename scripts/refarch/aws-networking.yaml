    - {from: sdwan-headend, to: sdwan-connect, link: aws_ec2_transit_gateway_connect_peer, label: "GRE over DX, BGP"}
    - {from: hub-tgw, to: vpc:prod, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:dev, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: prod-app, label: SD-WAN segment mapped to TGW route table, step: 4}

- slug: s2s-vpn-tgw-ecmp-scaling
  title: Scaling Site-to-Site VPN throughput with Transit Gateway ECMP
  category: networking
  tags: [site-to-site vpn, transit gateway, ecmp, bgp, ipsec, throughput]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/scaling-vpn-throughput-using-aws-transit-gateway/
  description: Several Site-to-Site VPN connections from the same customer gateway terminate on one Transit Gateway with ECMP enabled, and each connection contributes two IPsec tunnels. With BGP advertising identical prefixes over every tunnel, the Transit Gateway hashes flows across all tunnels, so aggregate bandwidth scales past the single-tunnel limit while each individual flow stays bound to one tunnel.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      vpcs:
        - name: app
          cidr: 10.1.0.0/16
          subnets:
            - {name: app-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: data
          cidr: 10.2.0.0/16
          subnets:
            - {name: data-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_vpn_connection, name: vpn-1, in: region}
    - {tf: aws_vpn_connection, name: vpn-2, in: region}
    - {tf: aws_vpn_connection, name: vpn-3, in: region}
    - {tf: aws_instance, name: app-server, in: subnet:app-private-a}
    - {tf: aws_instance, name: data-server, in: subnet:data-private-a}
  actors: [datacenter]
  flows:
    - {from: datacenter, to: dc-cgw, label: BGP router, step: 1}
    - {from: dc-cgw, to: vpn-1, label: "2 IPsec tunnels, BGP"}
    - {from: dc-cgw, to: vpn-2, label: "2 IPsec tunnels, BGP"}
    - {from: dc-cgw, to: vpn-3, label: "2 IPsec tunnels, BGP"}
    - {from: vpn-1, to: hub-tgw, label: "VPN attachment, ECMP"}
    - {from: vpn-2, to: hub-tgw, label: "VPN attachment, ECMP"}
    - {from: vpn-3, to: hub-tgw, label: "VPN attachment, ECMP"}
    - {from: hub-tgw, to: vpc:app, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:data, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: app-server, label: 5-tuple hashed across 6 tunnels, step: 2}

- slug: accelerated-s2s-vpn-tgw
  title: Accelerated Site-to-Site VPN to a Transit Gateway
  category: networking
  tags: [site-to-site vpn, accelerated vpn, global accelerator, transit gateway, anycast, edge]
  source: https://docs.aws.amazon.com/whitepapers/latest/hybrid-connectivity/aws-accelerated-site-to-site-vpn-aws-transit-gateway-single-aws-region.html
  description: An accelerated Site-to-Site VPN attaches to a Transit Gateway and uses AWS Global Accelerator so that each IPsec tunnel terminates at anycast IPs announced from the nearest AWS edge location instead of at the Region. The customer gateway's traffic enters the AWS global network close to the site and rides the backbone to the Regional Transit Gateway, reducing jitter and path variability compared with traversing the public internet all the way to the Region.
  containers:
    - datacenter: on-premises
    - region: ap-southeast-2
      groups: [{label: aws-edge-location}]
      vpcs:
        - name: workload
          cidr: 10.1.0.0/16
          subnets:
            - {name: workload-private-a, cidr: 10.1.1.0/24, az: a, public: false}
            - {name: workload-private-b, cidr: 10.1.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_globalaccelerator_accelerator, name: vpn-accelerator, in: group:aws-edge-location}
    - {tf: aws_vpn_connection, name: accelerated-vpn, in: region}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_instance, name: workload-a, in: subnet:workload-private-a}
    - {tf: aws_instance, name: workload-b, in: subnet:workload-private-b}
  actors: [datacenter, internet]
  flows:
    - {from: datacenter, to: dc-cgw, step: 1}
    - {from: dc-cgw, to: internet, label: IPsec to anycast tunnel endpoints, step: 2}
    - {from: internet, to: vpn-accelerator, label: nearest edge location, step: 3}
    - {from: vpn-accelerator, to: accelerated-vpn, label: AWS global network, step: 4}
    - {from: accelerated-vpn, to: hub-tgw, label: VPN attachment, step: 5}
    - {from: hub-tgw, to: vpc:workload, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: workload-a, step: 6}

- slug: client-vpn-tgw-remote-access
  title: Remote user access to multiple VPCs with Client VPN and Transit Gateway
  category: networking
  tags: [client vpn, remote access, transit gateway, openvpn, split tunnel, hybrid]
  source: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-tgw.html
  description: A Client VPN endpoint associated directly with a Transit Gateway gives remote users access to every VPC and on-premises network attached to that hub without an intermediate VPC. Routes for each destination CIDR are added to the Client VPN endpoint together with authorization rules, split tunnel keeps internet traffic local to the user, and the client source IP is preserved because no source NAT is applied.
  containers:
    - datacenter: on-premises
    - region: eu-west-1
      vpcs:
        - name: app
          cidr: 10.1.0.0/16
          subnets:
            - {name: app-private-a, cidr: 10.1.1.0/24, az: a, public: false}
        - name: tools
          cidr: 10.2.0.0/16
          subnets:
            - {name: tools-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_client_vpn_endpoint, name: corp-client-vpn, in: region}
    - {tf: aws_acm_certificate, name: vpn-server-cert, in: region}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_vpn_connection, name: dc-vpn, in: region}
    - {tf: aws_instance, name: app-server, in: subnet:app-private-a}
    - {tf: aws_instance, name: jump-host, in: subnet:tools-private-a}
  actors: [users, idp, datacenter]
  flows:
    - {from: users, to: corp-client-vpn, label: OpenVPN TLS 443, step: 1}
    - {from: corp-client-vpn, to: idp, label: SAML federated authentication, step: 2}
    - {from: vpn-server-cert, to: corp-client-vpn, label: server certificate}
    - {from: corp-client-vpn, to: hub-tgw, label: "Transit Gateway association, no SNAT", step: 3}
    - {from: hub-tgw, to: vpc:app, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:tools, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: app-server, label: authorization rule 10.1.0.0/16, step: 4}
    - {from: hub-tgw, to: jump-host}
    - {from: datacenter, to: dc-cgw}
    - {from: dc-cgw, to: dc-vpn, label: IPsec}
    - {from: dc-vpn, to: hub-tgw, label: users also reach on-prem}

- slug: hybrid-dns-route53-resolver-shared-services
  title: Hybrid DNS resolution with Route 53 Resolver endpoints in a shared-services VPC
  category: networking
  tags: [route 53 resolver, hybrid dns, inbound endpoint, outbound endpoint, forwarding rules, ram, multi-account]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/set-up-dns-resolution-for-hybrid-networks-in-a-multi-account-aws-environment.html
  description: A shared-services VPC connected to on-premises through a Transit Gateway hosts one inbound and one outbound Route 53 Resolver endpoint spanning two Availability Zones. On-premises DNS servers forward AWS domains to the inbound endpoint, while Resolver forwarding rules for the corporate domain target the on-premises servers via the outbound endpoint and are shared to workload accounts with AWS RAM and associated with their VPCs, together with the private hosted zone.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      account: shared-services
      vpcs:
        - name: shared-services
          cidr: 10.0.0.0/16
          subnets:
            - {name: dns-private-a, cidr: 10.0.1.0/24, az: a, public: false}
            - {name: dns-private-b, cidr: 10.0.2.0/24, az: b, public: false}
    - region: us-east-1
      account: workload
      vpcs:
        - name: workload
          cidr: 10.1.0.0/16
          subnets:
            - {name: workload-private-a, cidr: 10.1.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_instance, name: onprem-dns, in: datacenter}
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_vpn_connection, name: dc-vpn, in: region}
    - {tf: aws_route53_resolver_endpoint, name: inbound-resolver, in: subnet:dns-private-a}
    - {tf: aws_route53_resolver_endpoint, name: outbound-resolver, in: subnet:dns-private-b}
    - {tf: aws_route53_resolver_rule, name: forward-corp-example-com, in: vpc:shared-services}
    - {tf: aws_route53_zone, name: aws-corp-private-zone, in: vpc:shared-services}
    - {tf: aws_ram_resource_share, name: dns-rules-share, in: account:shared-services}
    - {tf: aws_instance, name: workload-server, in: subnet:workload-private-a}
  actors: [datacenter]
  flows:
    - {from: datacenter, to: dc-cgw}
    - {from: dc-cgw, to: dc-vpn, label: IPsec}
    - {from: dc-vpn, to: hub-tgw}
    - {from: hub-tgw, to: vpc:shared-services, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:workload, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: onprem-dns, to: inbound-resolver, label: "forward aws.corp.example.com (UDP/TCP 53)", step: 1}
    - {from: inbound-resolver, to: aws-corp-private-zone, label: resolve in private hosted zone, step: 2}
    - {from: workload-server, to: forward-corp-example-com, label: "query corp.example.com", step: 3}
    - {from: forward-corp-example-com, to: outbound-resolver, step: 4}
    - {from: outbound-resolver, to: onprem-dns, label: forward to on-prem DNS via TGW, step: 5}
    - {from: dns-rules-share, to: account:workload, label: RAM share of rules}
    - {from: forward-corp-example-com, to: vpc:workload, link: aws_route53_resolver_rule_association}
    - {from: aws-corp-private-zone, to: vpc:workload, link: aws_route53_zone_association}

- slug: dns-firewall-centralized-firewall-manager
  title: Centralized DNS Firewall rule groups enforced with Firewall Manager
  category: networking
  tags: [dns firewall, route 53 resolver, firewall manager, multi-account, dns exfiltration, security]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/securing-hybrid-workloads-using-amazon-route-53-resolver-dns-firewall/
  description: A Route 53 Resolver DNS Firewall rule group with block and allow domain lists is authored in the security tooling account and distributed by AWS Firewall Manager policies to every VPC in the organization, including new ones. The Route 53 Resolver in each VPC evaluates queries from workloads against the associated rule group before resolving, and on-premises queries that arrive through inbound Resolver endpoints receive the same treatment.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      account: security-tooling
    - region: us-east-1
      account: workload
      vpcs:
        - name: workload
          cidr: 10.1.0.0/16
          subnets:
            - {name: workload-private-a, cidr: 10.1.1.0/24, az: a, public: false}
            - {name: workload-private-b, cidr: 10.1.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_route53_resolver_firewall_rule_group, name: corp-dns-firewall-rules, in: account:security-tooling}
    - {tf: aws_route53_resolver_firewall_domain_list, name: blocked-domains, in: account:security-tooling}
    - {tf: aws_fms_policy, name: dns-firewall-policy, in: account:security-tooling}
    - {tf: aws_route53_resolver_endpoint, name: inbound-resolver, in: subnet:workload-private-a}
    - {tf: aws_instance, name: workload-server, in: subnet:workload-private-a}
    - {tf: aws_cloudwatch_log_group, name: dns-firewall-logs, in: account:security-tooling}
  actors: [datacenter, internet]
  flows:
    - {from: blocked-domains, to: corp-dns-firewall-rules, label: BLOCK list}
    - {from: dns-firewall-policy, to: corp-dns-firewall-rules, label: Firewall Manager policy}
    - {from: corp-dns-firewall-rules, to: vpc:workload, link: aws_route53_resolver_firewall_rule_group_association, label: auto-associated to every VPC}
    - {from: workload-server, to: corp-dns-firewall-rules, label: DNS query evaluated by Resolver, step: 1}
    - {from: corp-dns-firewall-rules, to: internet, label: allowed query resolved, step: 2}
    - {from: corp-dns-firewall-rules, to: dns-firewall-logs, label: "query logs, blocked events", step: 3}
    - {from: datacenter, to: inbound-resolver, label: on-prem forwarders}
    - {from: inbound-resolver, to: corp-dns-firewall-rules, label: same rules applied}

- slug: global-accelerator-multi-region-alb
  title: Multi-Region application fronted by AWS Global Accelerator
  category: networking
  tags: [global accelerator, anycast, multi-region, application load balancer, failover, traffic dials]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/deploying-multi-region-applications-in-aws-using-aws-global-accelerator/
  description: A standard accelerator provides two static anycast IP addresses and a listener with one endpoint group per Region, each containing the Region's internet-facing Application Load Balancer. Client traffic enters the AWS network at the nearest edge location and is routed to the closest healthy endpoint group; health checks, traffic dials, and endpoint weights drive automatic failover and controlled shifts between Regions.
  containers:
    - region: us-east-1
      vpcs:
        - name: app-east
          cidr: 10.1.0.0/16
          subnets:
            - {name: east-public-a, cidr: 10.1.0.0/24, az: a, public: true}
            - {name: east-private-a, cidr: 10.1.1.0/24, az: a, public: false}
    - region: eu-west-1
      vpcs:
        - name: app-eu
          cidr: 10.2.0.0/16
          subnets:
            - {name: eu-public-a, cidr: 10.2.0.0/24, az: a, public: true}
            - {name: eu-private-a, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_globalaccelerator_accelerator, name: app-accelerator, in: region:us-east-1}
    - {tf: aws_globalaccelerator_listener, name: tcp-443-listener, in: region:us-east-1}
    - {tf: aws_globalaccelerator_endpoint_group, name: endpoint-group-east, in: region:us-east-1}
    - {tf: aws_globalaccelerator_endpoint_group, name: endpoint-group-eu, in: region:eu-west-1}
    - {tf: aws_lb, name: east-alb-application, in: subnet:east-public-a}
    - {tf: aws_lb, name: eu-alb-application, in: subnet:eu-public-a}
    - {tf: aws_autoscaling_group, name: east-web-fleet, in: subnet:east-private-a}
    - {tf: aws_autoscaling_group, name: eu-web-fleet, in: subnet:eu-private-a}
    - {tf: aws_route53_zone, name: public-zone, in: region:us-east-1}
  actors: [users]
  flows:
    - {from: users, to: public-zone, label: resolve app.example.com to static anycast IPs, step: 1}
    - {from: users, to: app-accelerator, label: TCP 443 to nearest edge, step: 2}
    - {from: app-accelerator, to: tcp-443-listener, step: 3}
    - {from: tcp-443-listener, to: endpoint-group-east, label: traffic dial 100}
    - {from: tcp-443-listener, to: endpoint-group-eu, label: traffic dial 100}
    - {from: endpoint-group-east, to: east-alb-application, label: health-checked endpoint, step: 4}
    - {from: endpoint-group-eu, to: eu-alb-application, label: health-checked endpoint}
    - {from: east-alb-application, to: east-web-fleet, step: 5}
    - {from: eu-alb-application, to: eu-web-fleet}

- slug: ipv6-dual-stack-centralized-ipv4-egress
  title: Dual-stack VPCs with centralized IPv4 egress and decentralized IPv6 egress
  category: networking
  tags: [ipv6, dual-stack, egress-only internet gateway, centralized egress, nat gateway, transit gateway]
  source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-egress-for-ipv6.html
  description: Spoke VPCs carry both an IPv4 CIDR and an Amazon-provided IPv6 CIDR; IPv4 default routes go to the Transit Gateway and out through NAT gateways in a central egress VPC. Because IPv6 addresses are globally unique and NAT is not required, each spoke keeps its own egress-only internet gateway for the "::/0" route, so IPv6 traffic leaves locally while inbound IPv6 connections remain blocked.
  containers:
    - region: us-east-1
      vpcs:
        - name: egress
          cidr: 10.0.0.0/16
          subnets:
            - {name: egress-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: egress-tgw-a, cidr: 10.0.10.0/28, az: a, public: false}
        - name: spoke-a
          cidr: 10.1.0.0/16
          subnets:
            - {name: spoke-a-private, cidr: 10.1.1.0/24, az: a, public: false}
        - name: spoke-b
          cidr: 10.2.0.0/16
          subnets:
            - {name: spoke-b-private, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_nat_gateway, name: egress-nat-a, in: subnet:egress-public-a}
    - {tf: aws_internet_gateway, name: egress-igw, in: vpc:egress}
    - {tf: aws_egress_only_internet_gateway, name: spoke-a-eigw, in: vpc:spoke-a}
    - {tf: aws_egress_only_internet_gateway, name: spoke-b-eigw, in: vpc:spoke-b}
    - {tf: aws_instance, name: app-a, in: subnet:spoke-a-private}
    - {tf: aws_instance, name: app-b, in: subnet:spoke-b-private}
  actors: [internet]
  flows:
    - {from: hub-tgw, to: vpc:spoke-a, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:spoke-b, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: app-a, to: hub-tgw, label: "IPv4 0.0.0.0/0 via TGW", step: 1}
    - {from: hub-tgw, to: egress-nat-a, step: 2}
    - {from: egress-nat-a, to: egress-igw, step: 3}
    - {from: egress-igw, to: internet, label: IPv4, step: 4}
    - {from: app-a, to: spoke-a-eigw, label: "IPv6 ::/0 local", step: 5}
    - {from: spoke-a-eigw, to: internet, label: IPv6 outbound only, step: 6}
    - {from: app-b, to: spoke-b-eigw, label: "IPv6 ::/0 local"}

- slug: ipv6-only-centralized-egress-nat64
  title: IPv6-only workloads reaching IPv4 destinations with centralized NAT64 and DNS64
  category: networking
  tags: [ipv6-only, nat64, dns64, nat gateway, transit gateway, centralized egress]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/ipv6-vpc-architectures/ipv6-centralized-egress-nat64.html
  description: Workloads in IPv6-only subnets enable DNS64 so that IPv4-only destinations resolve to synthesized addresses in the 64:ff9b::/96 well-known prefix, and a route for that prefix points at the Transit Gateway. The Transit Gateway forwards to a central egress VPC where NAT gateways perform NAT64 to translate to IPv4 and send the traffic through the internet gateway, while native IPv6 traffic exits through the egress VPC's egress-only internet gateway.
  containers:
    - region: us-east-1
      vpcs:
        - name: egress
          cidr: 10.0.0.0/16
          subnets:
            - {name: egress-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: egress-public-b, cidr: 10.0.1.0/24, az: b, public: true}
            - {name: egress-tgw-a, cidr: 10.0.10.0/28, az: a, public: false}
        - name: spoke-ipv6
          cidr: 10.1.0.0/16
          subnets:
            - {name: ipv6-only-a, cidr: 10.1.1.0/24, az: a, public: false}
            - {name: ipv6-only-b, cidr: 10.1.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_nat_gateway, name: nat64-a, in: subnet:egress-public-a}
    - {tf: aws_nat_gateway, name: nat64-b, in: subnet:egress-public-b}
    - {tf: aws_internet_gateway, name: egress-igw, in: vpc:egress}
    - {tf: aws_egress_only_internet_gateway, name: egress-eigw, in: vpc:egress}
    - {tf: aws_instance, name: ipv6-app-a, in: subnet:ipv6-only-a}
    - {tf: aws_instance, name: ipv6-app-b, in: subnet:ipv6-only-b}
  actors: [internet]
  flows:
    - {from: hub-tgw, to: vpc:spoke-ipv6, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: hub-tgw, to: vpc:egress, link: aws_ec2_transit_gateway_vpc_attachment}
    - {from: ipv6-app-a, to: hub-tgw, label: "DNS64 answer 64:ff9b::/96 routed to TGW", step: 1}
    - {from: hub-tgw, to: nat64-a, label: egress route table, step: 2}
    - {from: nat64-a, to: egress-igw, label: NAT64 to IPv4 source, step: 3}
    - {from: egress-igw, to: internet, label: IPv4-only destination, step: 4}
    - {from: ipv6-app-b, to: hub-tgw, label: "native IPv6 ::/0"}
    - {from: hub-tgw, to: egress-eigw, label: IPv6 destinations}
    - {from: egress-eigw, to: internet, label: IPv6}

- slug: shared-vpc-ram-multi-account
  title: Shared VPC with subnets shared to participant accounts via AWS RAM
  category: networking
  tags: [vpc sharing, ram, shared subnets, multi-account, organizations, cost optimization]
  source: https://aws.amazon.com/blogs/networking-and-content-delivery/vpc-sharing-a-new-approach-to-multiple-accounts-and-vpc-management/
  description: A central network account owns one large VPC and shares individual subnets with participant accounts in the same organization through AWS RAM; participants launch instances, load balancers, and databases into the shared subnets while the owner keeps control of route tables, NAT gateways, and VPC-level networking. The pattern reduces the number of VPCs, endpoints, and NAT gateways to manage, and participant resources communicate over the VPC network without peering or Transit Gateway.
  containers:
    - region: us-east-1
      account: network
      vpcs:
        - name: shared-vpc
          cidr: 10.0.0.0/16
          subnets:
            - {name: shared-public-a, cidr: 10.0.0.0/24, az: a, public: true}
            - {name: team-a-private, cidr: 10.0.10.0/24, az: a, public: false}
            - {name: team-b-private, cidr: 10.0.20.0/24, az: a, public: false}
    - region: us-east-1
      account: team-a
    - region: us-east-1
      account: team-b
  elements:
    - {tf: aws_ram_resource_share, name: subnet-share-team-a, in: account:network}
    - {tf: aws_ram_resource_share, name: subnet-share-team-b, in: account:network}
    - {tf: aws_internet_gateway, name: shared-igw, in: vpc:shared-vpc}
    - {tf: aws_nat_gateway, name: shared-nat, in: subnet:shared-public-a}
    - {tf: aws_vpc_endpoint, name: shared-s3-endpoint, in: vpc:shared-vpc}
    - {tf: aws_instance, name: team-a-app, in: subnet:team-a-private}
    - {tf: aws_lb, name: team-a-alb-application, in: subnet:shared-public-a}
    - {tf: aws_db_instance, name: team-b-db, in: subnet:team-b-private}
  actors: [internet]
  flows:
    - {from: subnet-share-team-a, to: account:team-a, label: share team-a-private, step: 1}
    - {from: subnet-share-team-b, to: account:team-b, label: share team-b-private}
    - {from: account:team-a, to: team-a-app, label: participant launches into shared subnet, step: 2}
    - {from: account:team-b, to: team-b-db, label: participant launches into shared subnet}
    - {from: team-a-app, to: team-b-db, label: "intra-VPC, no peering", step: 3}
    - {from: team-a-app, to: shared-nat, label: owner-managed egress}
    - {from: shared-nat, to: shared-igw}
    - {from: shared-igw, to: internet}
    - {from: team-a-app, to: shared-s3-endpoint, label: owner-managed gateway endpoint}
    - {from: internet, to: team-a-alb-application, label: HTTPS}

- slug: tgw-isolated-vpcs-shared-services
  title: Network segmentation with Transit Gateway route tables and a shared-services VPC
  category: networking
  tags: [transit gateway, segmentation, route tables, isolated vpcs, shared services]
  source: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-isolated-shared.html
  description: "Two Transit Gateway route tables implement segmentation: the isolated VPCs are associated with a route table that only holds a propagated route to the shared-services VPC and the VPN, so they cannot reach each other, while the shared-services and VPN attachments use a second route table that propagates routes from every VPC. The result is a hub where every workload reaches shared tooling and on-premises, but workload VPCs stay mutually isolated without any VPC peering."
  containers:
    - datacenter: on-premises
    - region: eu-west-1
      vpcs:
        - name: shared-services
          cidr: 10.0.0.0/16
          subnets:
            - {name: shared-private-a, cidr: 10.0.1.0/24, az: a, public: false}
        - name: isolated-a
          cidr: 10.1.0.0/16
          subnets:
            - {name: isolated-a-private, cidr: 10.1.1.0/24, az: a, public: false}
        - name: isolated-b
          cidr: 10.2.0.0/16
          subnets:
            - {name: isolated-b-private, cidr: 10.2.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_ec2_transit_gateway, name: hub-tgw, in: region}
    - {tf: aws_ec2_transit_gateway_route_table, name: isolated-rt, in: region}
    - {tf: aws_ec2_transit_gateway_route_table, name: shared-rt, in: region}
    - {tf: aws_customer_gateway, name: dc-cgw, in: datacenter}
    - {tf: aws_vpn_connection, name: dc-vpn, in: region}
    - {tf: aws_instance, name: directory-server, in: subnet:shared-private-a}
    - {tf: aws_instance, name: app-a, in: subnet:isolated-a-private}
    - {tf: aws_instance, name: app-b, in: subnet:isolated-b-private}
  actors: [datacenter]
  flows:
    - {from: hub-tgw, to: vpc:isolated-a, link: aws_ec2_transit_gateway_vpc_attachment, label: associated with isolated-rt}
    - {from: hub-tgw, to: vpc:isolated-b, link: aws_ec2_transit_gateway_vpc_attachment, label: associated with isolated-rt}
    - {from: hub-tgw, to: vpc:shared-services, link: aws_ec2_transit_gateway_vpc_attachment, label: associated with shared-rt}
    - {from: datacenter, to: dc-cgw}
    - {from: dc-cgw, to: dc-vpn, label: IPsec}
    - {from: dc-vpn, to: hub-tgw, label: "VPN attachment, shared-rt"}
    - {from: app-a, to: hub-tgw, label: isolated-rt (shared + VPN routes only), step: 1}
    - {from: hub-tgw, to: directory-server, step: 2}
    - {from: directory-server, to: hub-tgw, label: shared-rt has all VPC routes, step: 3}
    - {from: hub-tgw, to: app-b, step: 4}
    - {from: app-a, to: app-b, label: "blocked, no route in isolated-rt"}
