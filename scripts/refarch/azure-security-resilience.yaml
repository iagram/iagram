- slug: availability-zones-zone-redundant-web-tier
  title: Zone-redundant web application across availability zones
  category: resilience
  tags: [availability zones, zone-redundant, application gateway v2, vmss, zone-redundant sql, zrs storage, high availability]
  source: https://learn.microsoft.com/en-us/azure/well-architected/design-guides/regions-availability-zones
  description: Every tier is spread across the region's three availability zones so the loss of one zone does not take the workload down: a zone-redundant Application Gateway v2 with a zone-redundant public IP fronts a scale set whose instances are distributed across zones, the database is a zone-redundant Azure SQL tier with replicas in each zone, and storage uses ZRS for synchronous cross-zone replication. Key Vault and Log Analytics are zone-resilient platform services.
  containers:
    - subscription: workload
      resource_group: {name: rg-web-zr, location: westeurope}
      vnets:
        - name: vnet-web
          cidr: 10.90.0.0/16
          subnets:
            - {name: snet-appgw, cidr: 10.90.0.0/24}
            - {name: snet-web, cidr: 10.90.1.0/24}
            - {name: snet-pe, cidr: 10.90.2.0/24}
