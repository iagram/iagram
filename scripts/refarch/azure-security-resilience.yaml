    - {tf: azurerm_container_registry, name: acr-global, in: group:Global}
    - {tf: azurerm_log_analytics_workspace, name: law-global, in: group:Global}
    - {tf: azurerm_kubernetes_cluster, name: aks-we, in: subnet:snet-aks-we}
    - {tf: azurerm_eventhub_namespace, name: evh-we, in: resource_group:rg-stamp-westeurope}
    - {tf: azurerm_key_vault, name: kv-we, in: resource_group:rg-stamp-westeurope}
    - {tf: azurerm_application_insights, name: appi-we, in: resource_group:rg-stamp-westeurope}
    - {tf: azurerm_kubernetes_cluster, name: aks-ne, in: subnet:snet-aks-ne}
    - {tf: azurerm_eventhub_namespace, name: evh-ne, in: resource_group:rg-stamp-northeurope}
    - {tf: azurerm_key_vault, name: kv-ne, in: resource_group:rg-stamp-northeurope}
    - {tf: azurerm_application_insights, name: appi-ne, in: resource_group:rg-stamp-northeurope}
