    - {from: aks-ne, to: kv-ne, label: stamp secrets}
    - {from: aks-we, to: appi-we, label: stamp telemetry}
    - {from: aks-ne, to: appi-ne, label: stamp telemetry}
    - {from: appi-we, to: law-global, label: health model aggregation, step: 5}
