- slug: firewall-premium-appgw-tls-inspection
  title: Application Gateway WAF in front of Azure Firewall Premium with TLS inspection and IDPS
  category: security
  tags: [azure firewall premium, tls inspection, idps, application gateway, waf, hub-spoke, egress filtering]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/gateway/firewall-application-gateway
  description: Application Gateway terminates TLS and applies WAF rules, then user-defined routes send the re-encrypted request through Azure Firewall Premium, which uses an intermediate CA certificate from Key Vault to decrypt, run IDPS signatures and URL filtering, and forward to the web tier. Outbound traffic from the workload takes the same firewall path for FQDN and category filtering with SNAT, and all firewall and WAF logs land in Log Analytics.
  containers:
    - subscription: connectivity
      resource_group: {name: rg-hub, location: westeurope}
      vnets:
        - name: hub
          cidr: 10.0.0.0/16
          subnets:
            - {name: AzureFirewallSubnet, cidr: 10.0.1.0/26}
            - {name: snet-appgw, cidr: 10.0.2.0/24}
    - subscription: landing-zone-web
      resource_group: {name: rg-web, location: westeurope}
      vnets:
        - name: spoke-web
          cidr: 10.1.0.0/16
          subnets:
            - {name: snet-web, cidr: 10.1.1.0/24}
  elements:
    - {tf: azurerm_public_ip, name: pip-appgw, in: resource_group:rg-hub}
    - {tf: azurerm_application_gateway, name: appgw-waf, in: subnet:snet-appgw}
    - {tf: azurerm_web_application_firewall_policy, name: waf-policy-owasp, in: resource_group:rg-hub}
    - {tf: azurerm_firewall, name: fw-premium, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_firewall_policy, name: fw-policy-premium, in: resource_group:rg-hub}
    - {tf: azurerm_key_vault, name: kv-fw-ca-cert, in: resource_group:rg-hub}
    - {tf: azurerm_user_assigned_identity, name: id-firewall, in: resource_group:rg-hub}
    - {tf: azurerm_log_analytics_workspace, name: law-hub, in: resource_group:rg-hub}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-web, in: subnet:snet-web}
  actors: [internet]
  flows:
    - {from: internet, to: pip-appgw, label: HTTPS, step: 1}
    - {from: pip-appgw, to: appgw-waf, label: TLS termination}
    - {from: waf-policy-owasp, to: appgw-waf, label: OWASP CRS, prevention mode}
    - {from: appgw-waf, to: fw-premium, label: UDR: re-encrypted HTTPS to firewall, step: 2}
    - {from: fw-policy-premium, to: fw-premium, label: TLS inspection + IDPS + URL filtering}
    - {from: id-firewall, to: kv-fw-ca-cert, label: fetch intermediate CA cert, step: 3}
    - {from: fw-premium, to: vmss-web, label: inspected request, step: 4}
    - {from: vnet:hub, to: vnet:spoke-web, link: azurerm_virtual_network_peering, label: hub-spoke peering}
    - {from: vmss-web, to: fw-premium, label: "0.0.0.0/0 egress via UDR", step: 5}
    - {from: fw-premium, to: internet, label: FQDN filtering + SNAT, step: 6}
    - {from: fw-premium, to: law-hub, label: firewall logs}
    - {from: appgw-waf, to: law-hub, label: WAF logs}

- slug: ddos-waf-n-tier-web
  title: DDoS Network Protection and Application Gateway WAF for an N-tier web application
  category: security
  tags: [ddos protection, waf, application gateway, n-tier, vmss, load balancer, alerts]
  source: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-reference-architectures
  description: A DDoS Network Protection plan enabled on the virtual network protects every public IP in it at layers 3 and 4, while an Application Gateway WAF v2 in prevention mode blocks layer 7 attacks such as SQL injection before requests reach the web tier. Web and business tiers run as scale sets behind the gateway and an internal load balancer so they can scale out under attack, and DDoS mitigation metrics raise alerts through Azure Monitor.
  containers:
    - subscription: workload
      resource_group: {name: rg-web, location: westeurope}
      vnets:
        - name: vnet-web
          cidr: 10.30.0.0/16
          subnets:
            - {name: snet-appgw, cidr: 10.30.0.0/24}
            - {name: snet-web, cidr: 10.30.1.0/24}
            - {name: snet-business, cidr: 10.30.2.0/24}
            - {name: snet-data, cidr: 10.30.3.0/24}
  elements:
    - {tf: azurerm_network_ddos_protection_plan, name: ddos-plan, in: resource_group:rg-web}
    - {tf: azurerm_public_ip, name: pip-appgw, in: resource_group:rg-web}
    - {tf: azurerm_application_gateway, name: appgw-waf, in: subnet:snet-appgw}
    - {tf: azurerm_web_application_firewall_policy, name: waf-prevention, in: resource_group:rg-web}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-web, in: subnet:snet-web}
    - {tf: azurerm_lb, name: ilb-business, in: subnet:snet-business}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-business, in: subnet:snet-business}
    - {tf: azurerm_windows_virtual_machine, name: sql-vm-1, in: subnet:snet-data}
    - {tf: azurerm_log_analytics_workspace, name: law-web, in: resource_group:rg-web}
    - {tf: azurerm_monitor_action_group, name: ag-ddos-alerts, in: resource_group:rg-web}
  actors: [internet]
  flows:
    - {from: internet, to: pip-appgw, label: HTTPS, step: 1}
    - {from: ddos-plan, to: vnet:vnet-web, label: DDoS Network Protection (L3/L4) on all public IPs}
    - {from: waf-prevention, to: appgw-waf, label: L7 OWASP rules, prevention mode}
    - {from: pip-appgw, to: appgw-waf}
    - {from: appgw-waf, to: vmss-web, label: web tier, step: 2}
    - {from: vmss-web, to: ilb-business, label: internal LB, step: 3}
    - {from: ilb-business, to: vmss-business, label: business tier}
    - {from: vmss-business, to: sql-vm-1, label: data tier, step: 4}
    - {from: ddos-plan, to: law-web, label: mitigation metrics + flow logs, step: 5}
    - {from: law-web, to: ag-ddos-alerts, label: "DDoS attack alert"}

- slug: policy-remediation-deploy-if-not-exists
  title: Azure Policy compliance and remediation with deployIfNotExists and managed identity
  category: security
  tags: [azure policy, remediation, deployifnotexists, initiative, managed identity, management groups, diagnostics]
  source: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  description: Custom policy definitions with deployIfNotExists and modify effects are grouped in an initiative and assigned at the landing zones management group with a user-assigned managed identity that holds the roles listed in each definition's roleDefinitionIds. Compliance evaluation flags existing resources as non-compliant, and remediation tasks use the assignment identity to deploy the missing configuration, such as diagnostic settings that route resource logs to the central Log Analytics workspace.
  containers:
    - group: landing-zones
      subscriptions:
        - subscription: corp-prod
          resource_group: {name: rg-app, location: westeurope}
          vnets:
            - name: vnet-app
              cidr: 10.40.0.0/16
              subnets:
                - {name: snet-app, cidr: 10.40.1.0/24}
    - subscription: management
      resource_group: {name: rg-management, location: westeurope}
  elements:
    - {tf: azurerm_management_group, name: mg-landing-zones, in: group:landing-zones}
    - {tf: azurerm_policy_definition, name: pol-deploy-diagnostics, in: group:landing-zones}
    - {tf: azurerm_policy_set_definition, name: initiative-baseline, in: group:landing-zones}
    - {tf: azurerm_management_group_policy_assignment, name: assign-baseline, in: group:landing-zones}
    - {tf: azurerm_management_group_policy_remediation, name: remediate-diagnostics, in: group:landing-zones}
    - {tf: azurerm_user_assigned_identity, name: id-policy-remediation, in: resource_group:rg-management}
    - {tf: azurerm_log_analytics_workspace, name: law-central, in: resource_group:rg-management}
    - {tf: azurerm_storage_account, name: st-app-noncompliant, in: resource_group:rg-app}
    - {tf: azurerm_key_vault, name: kv-app, in: resource_group:rg-app}
    - {tf: azurerm_linux_virtual_machine, name: vm-app, in: subnet:snet-app}
  actors: [users]
  flows:
    - {from: pol-deploy-diagnostics, to: initiative-baseline, label: included definition}
    - {from: initiative-baseline, to: assign-baseline, label: assigned at mg-landing-zones}
    - {from: assign-baseline, to: mg-landing-zones, label: scope}
    - {from: assign-baseline, to: id-policy-remediation, label: assignment identity (roleDefinitionIds)}
    - {from: assign-baseline, to: st-app-noncompliant, label: "compliance evaluation: non-compliant", step: 1}
    - {from: users, to: remediate-diagnostics, label: create remediation task, step: 2}
    - {from: remediate-diagnostics, to: id-policy-remediation, label: runs as identity, step: 3}
    - {from: id-policy-remediation, to: st-app-noncompliant, label: deployIfNotExists template deployment, step: 4}
    - {from: st-app-noncompliant, to: law-central, label: diagnostic settings deployed, step: 5}
    - {from: kv-app, to: law-central, label: diagnostic settings}
    - {from: vm-app, to: law-central, label: diagnostic settings}

- slug: bcdr-backup-site-recovery
  title: Azure VM business continuity with Azure Backup and Site Recovery cross-region replication
  category: resilience
  tags: [site recovery, azure backup, recovery services vault, backup vault, replication policy, disaster recovery, cross-region]
  source: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
  description: The Site Recovery Mobility service on each protected VM writes disk changes to a cache storage account in the source region, and Site Recovery replicates them to replica managed disks in the target region, creating crash-consistent recovery points every five minutes and app-consistent points per the replication policy. On failover VMs are created in the mapped target virtual network from a chosen recovery point; the same Recovery Services vault also holds daily VM backups, and a Backup vault protects blob data.
  containers:
    - subscription: workload
      resource_group: {name: rg-app-primary, location: westeurope}
      vnets:
        - name: vnet-primary
          cidr: 10.50.0.0/16
          subnets:
            - {name: snet-app-primary, cidr: 10.50.1.0/24}
    - subscription: workload
      resource_group: {name: rg-app-secondary-asr, location: northeurope}
      vnets:
        - name: vnet-secondary-asr
          cidr: 10.60.0.0/16
          subnets:
            - {name: snet-app-secondary, cidr: 10.60.1.0/24}
  elements:
    - {tf: azurerm_linux_virtual_machine, name: vm-app-1, in: subnet:snet-app-primary}
    - {tf: azurerm_storage_account, name: st-asr-cache, in: resource_group:rg-app-primary}
    - {tf: azurerm_storage_account, name: st-app-data, in: resource_group:rg-app-primary}
    - {tf: azurerm_recovery_services_vault, name: rsv-bcdr, in: resource_group:rg-app-secondary-asr}
    - {tf: azurerm_site_recovery_replication_policy, name: asr-policy-24h, in: resource_group:rg-app-secondary-asr}
    - {tf: azurerm_backup_policy_vm, name: backup-policy-daily, in: resource_group:rg-app-secondary-asr}
    - {tf: azurerm_data_protection_backup_vault, name: bv-blobs, in: resource_group:rg-app-secondary-asr}
    - {tf: azurerm_managed_disk, name: disk-app-1-asrreplica, in: resource_group:rg-app-secondary-asr}
    - {tf: azurerm_linux_virtual_machine, name: vm-app-1-failover, in: subnet:snet-app-secondary}
  actors: [users]
  flows:
    - {from: vm-app-1, to: st-asr-cache, label: "Mobility service: disk writes to cache", step: 1}
    - {from: st-asr-cache, to: disk-app-1-asrreplica, label: continuous replication to replica disk, step: 2}
    - {from: asr-policy-24h, to: rsv-bcdr, label: recovery point retention + app-consistent frequency}
    - {from: vm-app-1, to: rsv-bcdr, link: azurerm_site_recovery_replicated_vm, label: protected item}
    - {from: vnet:vnet-primary, to: vnet:vnet-secondary-asr, link: azurerm_site_recovery_network_mapping, label: network mapping}
    - {from: rsv-bcdr, to: vm-app-1-failover, label: "failover: create VM from recovery point", step: 3, style: {dash: dashed}}
    - {from: backup-policy-daily, to: rsv-bcdr, label: daily schedule + retention}
    - {from: vm-app-1, to: rsv-bcdr, link: azurerm_backup_protected_vm, label: VM backup}
    - {from: st-app-data, to: bv-blobs, link: azurerm_data_protection_backup_instance_blob_storage, label: blob backup}
    - {from: users, to: rsv-bcdr, label: test failover / recovery plan, step: 4}

- slug: sql-failover-group-active-passive
  title: Active-passive multi-region web app with Azure SQL failover groups and private endpoints
  category: resilience
  tags: [failover group, azure sql, active-passive, front door, private endpoint, geo-replication, disaster recovery]
  source: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  description: A failover group replicates the application's databases from the primary logical server to a secondary server in the paired region and exposes read-write and read-only listener endpoints whose DNS is updated on failover, so application connection strings never change. Front Door sends traffic to the primary region's App Service and fails over to the secondary on failed health probes; each region reaches SQL through private endpoints, and the recommended customer-managed failover policy keeps the failover decision with the operations team.
  containers:
    - subscription: workload
      groups: [{label: Global}]
      resource_group: {name: rg-app-primary, location: westeurope}
      vnets:
        - name: vnet-primary
          cidr: 10.70.0.0/16
          subnets:
            - {name: snet-app-int-primary, cidr: 10.70.1.0/24}
            - {name: snet-pe-primary, cidr: 10.70.2.0/24}
    - subscription: workload
      resource_group: {name: rg-app-secondary, location: northeurope}
      vnets:
        - name: vnet-secondary
          cidr: 10.71.0.0/16
          subnets:
            - {name: snet-app-int-secondary, cidr: 10.71.1.0/24}
            - {name: snet-pe-secondary, cidr: 10.71.2.0/24}
  elements:
    - {tf: azurerm_cdn_frontdoor_profile, name: afd-app, in: group:Global}
    - {tf: azurerm_service_plan, name: plan-primary, in: resource_group:rg-app-primary}
    - {tf: azurerm_linux_web_app, name: web-primary, in: subnet:snet-app-int-primary}
    - {tf: azurerm_mssql_server, name: sql-primary, in: resource_group:rg-app-primary}
    - {tf: azurerm_private_endpoint, name: pe-sql-primary, in: subnet:snet-pe-primary}
    - {tf: azurerm_mssql_failover_group, name: fog-app, in: resource_group:rg-app-primary}
    - {tf: azurerm_private_dns_zone, name: pdz-sql, in: resource_group:rg-app-primary}
    - {tf: azurerm_service_plan, name: plan-secondary, in: resource_group:rg-app-secondary}
    - {tf: azurerm_linux_web_app, name: web-secondary, in: subnet:snet-app-int-secondary}
    - {tf: azurerm_mssql_server, name: sql-secondary, in: resource_group:rg-app-secondary}
    - {tf: azurerm_private_endpoint, name: pe-sql-secondary, in: subnet:snet-pe-secondary}
  actors: [users]
  flows:
    - {from: users, to: afd-app, label: HTTPS, step: 1}
    - {from: afd-app, to: web-primary, label: priority 1 origin, step: 2}
    - {from: afd-app, to: web-secondary, label: priority 2 origin (after failed probes), style: {dash: dashed}}
    - {from: web-primary, to: pe-sql-primary, label: "<fog>.database.windows.net read-write listener", step: 3}
    - {from: pe-sql-primary, to: sql-primary, label: Private Link}
    - {from: fog-app, to: sql-primary, label: primary server}
    - {from: fog-app, to: sql-secondary, label: secondary server}
    - {from: sql-primary, to: sql-secondary, label: async geo-replication, step: 4}
    - {from: web-secondary, to: pe-sql-secondary, label: "<fog>.secondary read-only listener / rw after failover", style: {dash: dashed}}
    - {from: pe-sql-secondary, to: sql-secondary, label: Private Link}
    - {from: pdz-sql, to: vnet:vnet-primary, link: azurerm_private_dns_zone_virtual_network_link}
    - {from: pdz-sql, to: vnet:vnet-secondary, link: azurerm_private_dns_zone_virtual_network_link}
    - {from: users, to: fog-app, label: customer-managed failover, step: 5, style: {dash: dashed}}

- slug: mission-critical-active-active-cosmos
