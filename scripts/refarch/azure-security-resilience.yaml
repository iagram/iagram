# Azure reference architectures: security, identity, governance, resilience and DR
# Format: see FORMAT.md. 20 distinct official architectures. Provider: azure.
# Management groups are modelled as top-level `group:` containers holding `subscriptions:`.

- slug: alz-management-group-hierarchy
  title: Azure landing zone management group hierarchy with platform and application subscriptions
  category: security
  tags: [landing zone, management groups, platform landing zone, connectivity, identity, policy, cloud adoption framework]
  source: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/
  description: A platform landing zone (management group hierarchy plus centralized management, connectivity and identity subscriptions) provides governance and shared services for application landing zone subscriptions placed under Corp, Online or Sandbox management groups. Azure Policy assigned at management group scope is inherited by every subscription, while the connectivity hub (firewall, gateways, DDoS) and the central Log Analytics workspace serve all workloads.
  containers:
    - datacenter: on-premises
    - group: platform
      subscriptions:
        - subscription: management
          resource_group: {name: rg-management, location: westeurope}
        - subscription: connectivity
          resource_group: {name: rg-connectivity, location: westeurope}
          vnets:
            - name: hub
              cidr: 10.0.0.0/16
              subnets:
                - {name: AzureFirewallSubnet, cidr: 10.0.1.0/26}
                - {name: GatewaySubnet, cidr: 10.0.0.0/27}
        - subscription: identity
          resource_group: {name: rg-identity, location: westeurope}
          vnets:
            - name: vnet-identity
              cidr: 10.10.0.0/24
              subnets:
                - {name: snet-adds, cidr: 10.10.0.0/26}
    - group: landing-zones
      subscriptions:
        - subscription: corp-app-1
          resource_group: {name: rg-corp-app-1, location: westeurope}
          vnets:
            - name: vnet-corp-app-1
              cidr: 10.1.0.0/16
              subnets:
                - {name: snet-corp-app, cidr: 10.1.1.0/24}
        - subscription: online-app-1
          resource_group: {name: rg-online-app-1, location: westeurope}
    - group: sandbox
      subscriptions:
        - subscription: sandbox-1
          resource_group: {name: rg-sandbox, location: westeurope}
  elements:
    - {tf: azurerm_management_group, name: mg-platform, in: group:platform}
    - {tf: azurerm_management_group, name: mg-landing-zones, in: group:landing-zones}
    - {tf: azurerm_management_group, name: mg-sandbox, in: group:sandbox}
    - {tf: azurerm_management_group_policy_assignment, name: alz-guardrails, in: group:landing-zones}
    - {tf: azurerm_log_analytics_workspace, name: law-central, in: resource_group:rg-management}
    - {tf: azurerm_firewall, name: hub-fw, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_virtual_network_gateway, name: hub-ergw, in: subnet:GatewaySubnet}
    - {tf: azurerm_network_ddos_protection_plan, name: ddos-plan, in: resource_group:rg-connectivity}
    - {tf: azurerm_windows_virtual_machine, name: adds-dc-1, in: subnet:snet-adds}
    - {tf: azurerm_linux_virtual_machine, name: vm-corp-app, in: subnet:snet-corp-app}
    - {tf: azurerm_linux_web_app, name: web-online-app, in: resource_group:rg-online-app-1}
    - {tf: azurerm_linux_virtual_machine, name: vm-sandbox, in: resource_group:rg-sandbox}
  actors: [datacenter, internet]
  flows:
    - {from: datacenter, to: hub-ergw, label: ExpressRoute / VPN, step: 1}
    - {from: vnet:hub, to: vnet:vnet-corp-app-1, link: azurerm_virtual_network_peering, label: hub-spoke peering}
    - {from: vnet:hub, to: vnet:vnet-identity, link: azurerm_virtual_network_peering, label: hub-spoke peering}
    - {from: vm-corp-app, to: hub-fw, label: "0.0.0.0/0 via UDR", step: 2}
    - {from: hub-fw, to: internet, label: SNAT egress, step: 3}
    - {from: vm-corp-app, to: adds-dc-1, label: domain authentication, step: 4}
    - {from: alz-guardrails, to: subscription:corp-app-1, label: policy inheritance}
    - {from: alz-guardrails, to: subscription:online-app-1, label: policy inheritance}
    - {from: hub-fw, to: law-central, label: diagnostics}
    - {from: web-online-app, to: law-central, label: diagnostics}
    - {from: ddos-plan, to: vnet:hub, label: DDoS Network Protection}

- slug: subscription-vending
  title: Subscription vending for application landing zones
  category: security
  tags: [subscription vending, landing zone, automation, management groups, budget, workload identity, ipam]
  source: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/subscription-vending
  description: Application teams request a subscription through an ITSM front door; a platform pipeline creates the subscription programmatically with infrastructure as code, places it under the right management group, peers its virtual network to the connectivity hub from a non-overlapping IP range, and configures budgets, tags, subscription owners and workload identities before handing it over. Governance stays with the platform team through Azure Policy assigned on the management group hierarchy.
  containers:
    - group: landing-zones
      subscriptions:
        - subscription: vended-app-1
          resource_group: {name: rg-app-1-network, location: westeurope}
          vnets:
            - name: vnet-app-1
              cidr: 10.5.0.0/22
              subnets:
                - {name: snet-app-1, cidr: 10.5.0.0/24}
    - subscription: connectivity
      resource_group: {name: rg-connectivity, location: westeurope}
      vnets:
        - name: hub
          cidr: 10.0.0.0/16
          subnets:
            - {name: AzureFirewallSubnet, cidr: 10.0.1.0/26}
    - subscription: management
      resource_group: {name: rg-management, location: westeurope}
  elements:
    - {tf: azurerm_management_group, name: mg-corp, in: group:landing-zones}
    - {tf: azurerm_management_group_policy_assignment, name: corp-guardrails, in: group:landing-zones}
    - {tf: azurerm_subscription, name: sub-app-1, in: group:landing-zones}
    - {tf: azurerm_consumption_budget_subscription, name: budget-app-1, in: subscription:vended-app-1}
    - {tf: azurerm_user_assigned_identity, name: id-app-1-deploy, in: resource_group:rg-app-1-network}
    - {tf: azurerm_linux_virtual_machine, name: vm-app-1, in: subnet:snet-app-1}
    - {tf: azurerm_firewall, name: hub-fw, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_log_analytics_workspace, name: law-central, in: resource_group:rg-management}
  actors: [users, server]
  flows:
    - {from: users, to: sub-app-1, label: subscription request (ITSM intake), step: 1}
    - {from: server, to: sub-app-1, label: create subscription (IaC pipeline), step: 2}
    - {from: sub-app-1, to: mg-corp, link: azurerm_management_group_subscription_association, label: placement}
    - {from: corp-guardrails, to: mg-corp, label: policy-driven governance}
    - {from: vnet:hub, to: vnet:vnet-app-1, link: azurerm_virtual_network_peering, label: peer to hub (IPAM range), step: 3}
    - {from: server, to: budget-app-1, label: budget + tags, step: 4}
    - {from: server, to: id-app-1-deploy, label: workload identity + RBAC, step: 5}
    - {from: users, to: vm-app-1, label: deploy workload, step: 6}
    - {from: vm-app-1, to: hub-fw, label: egress via hub}
    - {from: vm-app-1, to: law-central, label: diagnostics}

- slug: central-log-analytics-sentinel
  title: Centralized Log Analytics workspace with Microsoft Sentinel SIEM
  category: security
  tags: [log analytics, sentinel, siem, soar, azure monitor agent, data collection rules, logic apps]
  source: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
  description: Operational and security data is consolidated into a single Log Analytics workspace in the management subscription, with Microsoft Sentinel enabled on the workspace so analytics rules, incidents and SOAR playbooks operate on the same data that Azure Monitor collects. Azure Monitor Agent sends VM and Arc-enabled server logs through data collection rules, PaaS resources stream diagnostic settings, and data export to Event Hubs and a storage account supports downstream SIEMs and long-term retention.
  containers:
    - datacenter: on-premises
    - subscription: management
      resource_group: {name: rg-management, location: westeurope}
    - subscription: landing-zone-prod
      resource_group: {name: rg-app, location: westeurope}
      vnets:
        - name: vnet-app
          cidr: 10.20.0.0/16
          subnets:
            - {name: snet-app, cidr: 10.20.1.0/24}
  elements:
    - {tf: azurerm_log_analytics_workspace, name: law-security, in: resource_group:rg-management}
    - {tf: azurerm_sentinel_log_analytics_workspace_onboarding, name: sentinel-onboarding, in: resource_group:rg-management}
    - {tf: azurerm_monitor_data_collection_rule, name: dcr-security-events, in: resource_group:rg-management}
    - {tf: azurerm_logic_app_workflow, name: playbook-isolate-host, in: resource_group:rg-management}
    - {tf: azurerm_eventhub_namespace, name: evh-siem-export, in: resource_group:rg-management}
    - {tf: azurerm_storage_account, name: st-log-archive, in: resource_group:rg-management}
    - {tf: azurerm_linux_virtual_machine, name: vm-app, in: subnet:snet-app}
    - {tf: azurerm_key_vault, name: kv-app, in: resource_group:rg-app}
    - {tf: azurerm_arc_machine, name: arc-server-onprem, in: datacenter}
  actors: [users]
  flows:
    - {from: vm-app, to: dcr-security-events, label: Azure Monitor Agent, step: 1}
    - {from: arc-server-onprem, to: dcr-security-events, label: Azure Monitor Agent, step: 1}
    - {from: dcr-security-events, to: law-security, label: ingest, step: 2}
    - {from: kv-app, to: law-security, label: diagnostic settings}
    - {from: law-security, to: sentinel-onboarding, label: analytics rules -> incidents, step: 3}
    - {from: sentinel-onboarding, to: playbook-isolate-host, label: automation rule triggers playbook, step: 4}
    - {from: playbook-isolate-host, to: vm-app, label: isolate / remediate, step: 5}
    - {from: law-security, to: evh-siem-export, label: data export}
    - {from: law-security, to: st-log-archive, label: long-term archive}
    - {from: users, to: sentinel-onboarding, label: SOC investigation}

- slug: defender-for-cloud-cnapp
  title: Microsoft Defender for Cloud posture management and workload protection
  category: security
  tags: [defender for cloud, cnapp, cspm, cwpp, defender plans, secure score, multicloud]
  source: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
  description: Defender for Cloud plans are enabled per subscription (Defender for Servers, Storage, Containers, Databases and CSPM) to assess posture against the Microsoft cloud security benchmark and detect threats on VMs, storage accounts, AKS clusters and SQL servers, including Arc-enabled on-premises machines and connected AWS/GCP accounts. Alerts and recommendations flow to a Log Analytics workspace shared with Microsoft Sentinel for correlation and response.
  containers:
    - datacenter: on-premises
    - subscription: management
      resource_group: {name: rg-security, location: westeurope}
    - subscription: landing-zone-prod
      resource_group: {name: rg-workload, location: westeurope}
      vnets:
        - name: vnet-workload
          cidr: 10.30.0.0/16
          subnets:
            - {name: snet-web, cidr: 10.30.1.0/24}
            - {name: snet-aks, cidr: 10.30.8.0/21}
  elements:
    - {tf: azurerm_security_center_subscription_pricing, name: defender-servers-p2, in: subscription:landing-zone-prod}
    - {tf: azurerm_security_center_subscription_pricing, name: defender-storage, in: subscription:landing-zone-prod}
    - {tf: azurerm_security_center_subscription_pricing, name: defender-containers, in: subscription:landing-zone-prod}
    - {tf: azurerm_subscription_policy_assignment, name: mcsb-initiative, in: subscription:landing-zone-prod}
    - {tf: azurerm_linux_virtual_machine, name: vm-web, in: subnet:snet-web}
    - {tf: azurerm_storage_account, name: st-data, in: resource_group:rg-workload}
    - {tf: azurerm_kubernetes_cluster, name: aks-prod, in: subnet:snet-aks}
    - {tf: azurerm_mssql_server, name: sql-prod, in: resource_group:rg-workload}
    - {tf: azurerm_arc_machine, name: arc-onprem-srv, in: datacenter}
    - {tf: azurerm_log_analytics_workspace, name: law-security, in: resource_group:rg-security}
    - {tf: azurerm_sentinel_log_analytics_workspace_onboarding, name: sentinel-onboarding, in: resource_group:rg-security}
  actors: [users, saas]
  flows:
    - {from: mcsb-initiative, to: vm-web, label: MCSB assessment -> secure score, step: 1}
    - {from: defender-servers-p2, to: vm-web, label: agentless scanning + Defender for Endpoint, step: 2}
    - {from: defender-servers-p2, to: arc-onprem-srv, label: hybrid server protection}
    - {from: defender-storage, to: st-data, label: malware scanning + sensitive data threats}
    - {from: defender-containers, to: aks-prod, label: vulnerability assessment + runtime protection}
    - {from: sql-prod, to: law-security, label: Defender for SQL alerts}
    - {from: saas, to: law-security, label: AWS / GCP connectors, step: 3}
    - {from: vm-web, to: law-security, label: security alerts, step: 4}
    - {from: law-security, to: sentinel-onboarding, label: alerts -> incidents, step: 5}
    - {from: users, to: sentinel-onboarding, label: SOC triage}

- slug: key-vault-managed-identity-app-secrets
  title: App Service secrets with Key Vault references and managed identity over Private Link
  category: security
  tags: [key vault, managed identity, key vault references, private endpoint, secrets, rbac]
  source: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
  description: App settings hold Key Vault references instead of secret values; App Service resolves them at startup with a user-assigned managed identity that has the Key Vault Secrets User role, and refetches rotated versions every 24 hours. The vault denies public access and is reached through a private endpoint over regional VNet integration, so no credential is ever stored in configuration or code.
  containers:
    - subscription: workload
      resource_group: {name: rg-web, location: westeurope}
      vnets:
        - name: vnet-web
          cidr: 10.40.0.0/16
          subnets:
            - {name: snet-app-integration, cidr: 10.40.1.0/24}
            - {name: snet-private-endpoints, cidr: 10.40.2.0/24}
  elements:
    - {tf: azurerm_service_plan, name: plan-web, in: resource_group:rg-web}
    - {tf: azurerm_linux_web_app, name: web-app, in: subnet:snet-app-integration}
    - {tf: azurerm_user_assigned_identity, name: id-web-app, in: resource_group:rg-web}
    - {tf: azurerm_key_vault, name: kv-web, in: resource_group:rg-web}
    - {tf: azurerm_private_endpoint, name: pe-kv, in: subnet:snet-private-endpoints}
    - {tf: azurerm_private_dns_zone, name: pdz-vaultcore, in: resource_group:rg-web}
    - {tf: azurerm_mssql_server, name: sql-web, in: resource_group:rg-web}
    - {tf: azurerm_private_endpoint, name: pe-sql, in: subnet:snet-private-endpoints}
    - {tf: azurerm_log_analytics_workspace, name: law-web, in: resource_group:rg-web}
    - {tf: azurerm_application_insights, name: appi-web, in: resource_group:rg-web}
  actors: [users]
  flows:
    - {from: users, to: web-app, label: HTTPS, step: 1}
    - {from: web-app, to: id-web-app, label: keyVaultReferenceIdentity, step: 2}
    - {from: id-web-app, to: kv-web, label: Key Vault Secrets User (RBAC), step: 3}
    - {from: web-app, to: pe-kv, label: "@Microsoft.KeyVault(SecretUri=...) via VNet integration", step: 4}
    - {from: pe-kv, to: kv-web, label: Private Link}
    - {from: web-app, to: pe-sql, label: connection string from secret, step: 5}
    - {from: pe-sql, to: sql-web, label: Private Link}
    - {from: pdz-vaultcore, to: vnet:vnet-web, link: azurerm_private_dns_zone_virtual_network_link, label: privatelink.vaultcore.azure.net}
    - {from: kv-web, to: law-web, label: audit logs}
    - {from: web-app, to: appi-web, label: telemetry}

- slug: entra-b2c-customer-identity
  title: Customer identity with Azure AD B2C, custom domain and API connectors
  category: identity
  tags: [azure ad b2c, ciam, oidc, social identity providers, user flows, custom policies, api connectors, front door]
  source: https://learn.microsoft.com/en-us/azure/active-directory-b2c/technical-overview
  description: A dedicated Azure AD B2C tenant stores consumer accounts and runs sign-up/sign-in user flows or custom policies, federating with social and enterprise identity providers over OIDC, OAuth 2.0 and SAML before returning tokens to registered web and mobile applications. Azure Front Door fronts the tenant for a custom login domain, API connectors call a REST API to validate and enrich user data, and audit logs and Application Insights telemetry provide usage and security visibility.
  containers:
    - subscription: identity
      resource_group: {name: rg-b2c, location: westeurope}
    - subscription: workload
      resource_group: {name: rg-customer-app, location: westeurope}
  elements:
    - {tf: azurerm_aadb2c_directory, name: b2c-tenant, in: resource_group:rg-b2c}
    - {tf: azurerm_cdn_frontdoor_profile, name: afd-login-custom-domain, in: resource_group:rg-b2c}
    - {tf: azurerm_application_insights, name: appi-b2c-journeys, in: resource_group:rg-b2c}
    - {tf: azurerm_log_analytics_workspace, name: law-b2c, in: resource_group:rg-b2c}
    - {tf: azurerm_service_plan, name: plan-customer-app, in: resource_group:rg-customer-app}
    - {tf: azurerm_linux_web_app, name: web-customer-portal, in: resource_group:rg-customer-app}
    - {tf: azurerm_linux_function_app, name: func-api-connector, in: resource_group:rg-customer-app}
    - {tf: azurerm_cosmosdb_account, name: cosmos-customer-profiles, in: resource_group:rg-customer-app}
  actors: [users, mobile, idp]
  flows:
    - {from: users, to: web-customer-portal, label: browse, step: 1}
    - {from: web-customer-portal, to: afd-login-custom-domain, label: OIDC authorize (login.contoso.com), step: 2}
    - {from: mobile, to: afd-login-custom-domain, label: OIDC / MSAL}
    - {from: afd-login-custom-domain, to: b2c-tenant, label: custom domain to b2clogin.com, step: 3}
    - {from: b2c-tenant, to: idp, label: federate (OIDC / SAML), step: 4}
    - {from: b2c-tenant, to: func-api-connector, label: API connector (validate / enrich), step: 5}
    - {from: func-api-connector, to: cosmos-customer-profiles, label: loyalty / CRM lookup}
    - {from: b2c-tenant, to: web-customer-portal, label: ID + access tokens, step: 6}
    - {from: b2c-tenant, to: appi-b2c-journeys, label: custom policy telemetry}
    - {from: b2c-tenant, to: law-b2c, label: audit logs}

- slug: hybrid-identity-adds-extend-domain
  title: Extend on-premises Active Directory Domain Services into an Azure virtual network
  category: identity
  tags: [active directory, ad ds, domain controllers, hybrid identity, vpn gateway, replication, bastion]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
  description: Two domain controller VMs in a dedicated AD DS subnet, spread across availability zones with static private IPs and a restrictive NSG, replicate with on-premises domain controllers over a VPN or ExpressRoute gateway and serve authentication and DNS to workloads in Azure. Administrative access uses Azure Bastion rather than public IPs, DDoS Protection covers the perimeter, and Recovery Services backs up the domain controllers' system state.
  containers:
    - datacenter: on-premises
    - subscription: identity
      resource_group: {name: rg-identity, location: westeurope}
      vnets:
        - name: vnet-identity
          cidr: 10.10.0.0/16
          subnets:
            - {name: GatewaySubnet, cidr: 10.10.255.0/27}
            - {name: snet-adds, cidr: 10.10.1.0/24}
            - {name: snet-app, cidr: 10.10.2.0/24}
            - {name: AzureBastionSubnet, cidr: 10.10.3.0/26}
  elements:
    - {tf: azurerm_virtual_network_gateway, name: vpngw-identity, in: subnet:GatewaySubnet}
    - {tf: azurerm_local_network_gateway, name: lng-onprem, in: datacenter}
    - {tf: azurerm_windows_virtual_machine, name: dc-az-1, in: subnet:snet-adds}
    - {tf: azurerm_windows_virtual_machine, name: dc-az-2, in: subnet:snet-adds}
    - {tf: azurerm_network_security_group, name: nsg-adds, in: resource_group:rg-identity}
    - {tf: azurerm_windows_virtual_machine, name: app-vm-1, in: subnet:snet-app}
    - {tf: azurerm_bastion_host, name: bastion-identity, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_network_ddos_protection_plan, name: ddos-identity, in: resource_group:rg-identity}
    - {tf: azurerm_recovery_services_vault, name: rsv-identity, in: resource_group:rg-identity}
  actors: [datacenter, user]
  flows:
    - {from: datacenter, to: vpngw-identity, label: IPsec S2S VPN / ExpressRoute, step: 1}
    - {from: vpngw-identity, to: lng-onprem, link: azurerm_virtual_network_gateway_connection, label: S2S connection}
    - {from: dc-az-1, to: datacenter, label: AD DS replication (site link), step: 2}
    - {from: app-vm-1, to: dc-az-1, label: Kerberos / LDAP authentication, step: 3}
    - {from: app-vm-1, to: dc-az-2, label: DNS (custom DNS servers)}
    - {from: nsg-adds, to: dc-az-1, label: AD ports only}
    - {from: user, to: bastion-identity, label: RDP over TLS 443, step: 4}
    - {from: bastion-identity, to: dc-az-1, label: RDP (private IP)}
    - {from: dc-az-1, to: rsv-identity, label: system-state backup}
    - {from: ddos-identity, to: vnet:vnet-identity, label: DDoS Network Protection}

- slug: zero-trust-private-link-hub-spoke
  title: Zero-trust PaaS access with Private Link and private DNS in a hub-and-spoke network
  category: security
  tags: [private link, private endpoint, private dns zone, dns private resolver, hub-spoke, zero trust, expressroute]
  source: https://learn.microsoft.com/en-us/azure/architecture/networking/guide/private-link-hub-spoke-network
  description: PaaS services are reached only through private endpoints; shared endpoints used from on-premises or by several workloads live in a dedicated hub subnet behind the firewall, while single-application endpoints sit in the spoke, and public endpoints are disabled. Centralized private DNS zones linked to every virtual network resolve the privatelink FQDNs, and a DNS Private Resolver inbound endpoint lets on-premises resolvers answer the same names over ExpressRoute.
  containers:
    - datacenter: on-premises
    - subscription: connectivity
      resource_group: {name: rg-hub, location: westeurope}
      vnets:
        - name: hub
          cidr: 10.0.0.0/16
          subnets:
            - {name: GatewaySubnet, cidr: 10.0.0.0/27}
            - {name: AzureFirewallSubnet, cidr: 10.0.1.0/26}
            - {name: snet-hub-private-endpoints, cidr: 10.0.2.0/24}
            - {name: snet-dns-resolver-inbound, cidr: 10.0.3.0/28}
    - subscription: landing-zone-app
      resource_group: {name: rg-spoke, location: westeurope}
      vnets:
        - name: spoke
          cidr: 10.1.0.0/16
          subnets:
            - {name: snet-app, cidr: 10.1.1.0/24}
            - {name: snet-spoke-private-endpoints, cidr: 10.1.2.0/24}
  elements:
    - {tf: azurerm_virtual_network_gateway, name: ergw-hub, in: subnet:GatewaySubnet}
    - {tf: azurerm_firewall, name: hub-fw, in: subnet:AzureFirewallSubnet}
    - {tf: azurerm_private_dns_resolver, name: dns-resolver-hub, in: subnet:snet-dns-resolver-inbound}
    - {tf: azurerm_private_dns_zone, name: pdz-blob, in: resource_group:rg-hub}
    - {tf: azurerm_private_dns_zone, name: pdz-sql, in: resource_group:rg-hub}
    - {tf: azurerm_network_security_group, name: nsg-hub-pe, in: resource_group:rg-hub}
    - {tf: azurerm_private_endpoint, name: pe-shared-storage, in: subnet:snet-hub-private-endpoints}
    - {tf: azurerm_storage_account, name: st-shared, in: resource_group:rg-hub}
    - {tf: azurerm_linux_virtual_machine, name: vm-app, in: subnet:snet-app}
