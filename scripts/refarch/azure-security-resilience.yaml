- slug: chaos-studio-resilience-testing
  title: Resilience testing with Azure Chaos Studio experiments
  category: resilience
  tags: [chaos studio, chaos engineering, fault injection, game day, experiments, targets, capabilities]
  source: https://learn.microsoft.com/en-us/azure/chaos-studio/chaos-studio-overview
  description: Resources are onboarded as Chaos Studio targets with enabled capabilities, and an experiment with a managed identity that holds the required roles runs service-direct faults (such as shutting down scale set instances in one zone or failing over Azure SQL) and agent-based in-guest faults in sequential steps and parallel branches. Application Insights and Log Analytics capture the impact so teams can validate recovery in game days or as CI/CD gates.
  containers:
    - subscription: workload
      resource_group: {name: rg-app, location: westeurope}
      resource_groups:
        - {name: rg-chaos, location: westeurope}
      vnets:
        - name: vnet-app
          cidr: 10.100.0.0/16
          subnets:
            - {name: snet-app, cidr: 10.100.1.0/24}
  elements:
    - {tf: azurerm_chaos_studio_experiment, name: exp-zone-down, in: resource_group:rg-chaos}
    - {tf: azurerm_user_assigned_identity, name: id-chaos, in: resource_group:rg-chaos}
    - {tf: azurerm_chaos_studio_target, name: target-vmss-app, in: resource_group:rg-app}
    - {tf: azurerm_chaos_studio_capability, name: cap-vmss-shutdown, in: resource_group:rg-app}
    - {tf: azurerm_linux_virtual_machine_scale_set, name: vmss-app, in: subnet:snet-app}
    - {tf: azurerm_lb, name: lb-app, in: subnet:snet-app}
    - {tf: azurerm_mssql_server, name: sql-app, in: resource_group:rg-app}
    - {tf: azurerm_application_insights, name: appi-app, in: resource_group:rg-app}
    - {tf: azurerm_log_analytics_workspace, name: law-app, in: resource_group:rg-app}
    - {tf: azurerm_monitor_action_group, name: ag-oncall, in: resource_group:rg-app}
  actors: [users, server]
  flows:
    - {from: users, to: exp-zone-down, label: run experiment (game day), step: 1}
    - {from: server, to: exp-zone-down, label: CI/CD gate, step: 1}
    - {from: exp-zone-down, to: id-chaos, label: experiment identity (RBAC on targets)}
    - {from: exp-zone-down, to: target-vmss-app, label: "service-direct fault: shutdown zone 1 instances", step: 2}
    - {from: cap-vmss-shutdown, to: target-vmss-app, label: capability enabled}
    - {from: target-vmss-app, to: vmss-app, label: onboarded resource}
    - {from: exp-zone-down, to: sql-app, label: "service-direct fault: failover", step: 3}
    - {from: lb-app, to: vmss-app, label: health probes reroute traffic, step: 4}
    - {from: vmss-app, to: appi-app, label: latency / error telemetry, step: 5}
    - {from: appi-app, to: law-app, label: workspace-based}
    - {from: law-app, to: ag-oncall, label: alerts during experiment}

- slug: arc-enabled-servers-governance
  title: Govern on-premises servers with Azure Arc, Policy, Monitor and Update Manager
  category: security
  tags: [azure arc, arc-enabled servers, machine configuration, azure monitor agent, update manager, defender for servers, private link]
  source: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
  description: The Connected Machine agent projects on-premises Windows and Linux servers into Azure as Arc-enabled server resources with their own resource IDs and managed identities, so Azure RBAC, tags and Azure Policy machine configuration apply to them like native VMs. Azure Monitor Agent sends logs through data collection rules to a central Log Analytics workspace, Update Manager schedules patching, Defender for Servers protects them, and an Arc Private Link Scope keeps agent traffic on a private endpoint reached over the site-to-site connection.
  containers:
    - datacenter: on-premises
    - subscription: management
      resource_group: {name: rg-management, location: westeurope}
    - subscription: hybrid
      resource_group: {name: rg-arc-servers, location: westeurope}
      vnets:
        - name: vnet-hybrid
          cidr: 10.110.0.0/16
          subnets:
            - {name: GatewaySubnet, cidr: 10.110.0.0/27}
            - {name: snet-pe, cidr: 10.110.1.0/24}
  elements:
    - {tf: azurerm_arc_machine, name: arc-srv-01, in: datacenter}
    - {tf: azurerm_arc_machine, name: arc-srv-02, in: datacenter}
    - {tf: azurerm_virtual_network_gateway, name: vpngw-hybrid, in: subnet:GatewaySubnet}
    - {tf: azurerm_arc_private_link_scope, name: arc-pls, in: resource_group:rg-arc-servers}
    - {tf: azurerm_private_endpoint, name: pe-arc, in: subnet:snet-pe}
    - {tf: azurerm_security_center_subscription_pricing, name: defender-servers, in: subscription:hybrid}
    - {tf: azurerm_log_analytics_workspace, name: law-hybrid, in: resource_group:rg-management}
    - {tf: azurerm_monitor_data_collection_rule, name: dcr-vm-insights, in: resource_group:rg-management}
    - {tf: azurerm_policy_set_definition, name: initiative-machine-config, in: subscription:management}
    - {tf: azurerm_maintenance_configuration, name: mc-monthly-patching, in: resource_group:rg-management}
    - {tf: azurerm_automation_account, name: aa-hybrid-runbooks, in: resource_group:rg-management}
  actors: [datacenter, users]
  flows:
    - {from: datacenter, to: vpngw-hybrid, label: S2S VPN / ExpressRoute, step: 1}
    - {from: arc-srv-01, to: pe-arc, label: Connected Machine agent over Private Link, step: 2}
    - {from: pe-arc, to: arc-pls, label: Arc Private Link Scope}
    - {from: arc-srv-01, to: dcr-vm-insights, label: Azure Monitor Agent, step: 3}
    - {from: dcr-vm-insights, to: law-hybrid, label: logs + VM insights}
    - {from: initiative-machine-config, to: arc-srv-01, label: machine configuration audit, step: 4}
    - {from: mc-monthly-patching, to: arc-srv-01, label: Update Manager schedule, step: 5}
    - {from: defender-servers, to: arc-srv-02, label: Defender for Endpoint + vulnerability assessment}
    - {from: aa-hybrid-runbooks, to: arc-srv-02, label: runbooks (hybrid worker)}
    - {from: users, to: arc-srv-01, label: manage as Azure resource (RBAC, tags)}

- slug: confidential-computing-attested-workload
  title: Confidential computing with attested AKS confidential nodes, Managed HSM and secure key release
  category: security
  tags: [confidential computing, sev-snp, attestation, managed hsm, secure key release, confidential containers, confidential ledger]
  source: https://learn.microsoft.com/en-us/azure/confidential-computing/overview-azure-products
  description: Containers run on AMD SEV-SNP confidential VM node pools in AKS (with confidential containers on Azure Container Instances for isolated jobs) so data is encrypted in memory and hidden from the cloud operator. Azure Attestation verifies the trusted execution environment and issues a token that Managed HSM checks before releasing data-encryption keys, and a confidential ledger records tamper-evident audit entries.
  containers:
    - subscription: workload
      resource_group: {name: rg-confidential, location: westeurope}
      vnets:
        - name: vnet-cc
          cidr: 10.120.0.0/16
          subnets:
            - {name: snet-aks-cc, cidr: 10.120.0.0/20}
            - {name: snet-cvm, cidr: 10.120.16.0/24}
            - {name: snet-pe, cidr: 10.120.17.0/24}
  elements:
    - {tf: azurerm_kubernetes_cluster, name: aks-confidential-nodes, in: subnet:snet-aks-cc}
    - {tf: azurerm_container_group, name: aci-confidential-job, in: resource_group:rg-confidential}
    - {tf: azurerm_linux_virtual_machine, name: cvm-dcasv5, in: subnet:snet-cvm}
    - {tf: azurerm_attestation_provider, name: attest-cc, in: resource_group:rg-confidential}
    - {tf: azurerm_key_vault_managed_hardware_security_module, name: mhsm-data-keys, in: resource_group:rg-confidential}
    - {tf: azurerm_private_endpoint, name: pe-mhsm, in: subnet:snet-pe}
    - {tf: azurerm_user_assigned_identity, name: id-confidential-workload, in: resource_group:rg-confidential}
    - {tf: azurerm_container_registry, name: acr-cc, in: resource_group:rg-confidential}
    - {tf: azurerm_storage_account, name: st-encrypted-data, in: resource_group:rg-confidential}
    - {tf: azurerm_confidential_ledger, name: ledger-audit, in: resource_group:rg-confidential}
  actors: [users]
  flows:
    - {from: acr-cc, to: aks-confidential-nodes, label: pull signed image, step: 1}
    - {from: aks-confidential-nodes, to: attest-cc, label: SEV-SNP attestation evidence, step: 2}
    - {from: attest-cc, to: aks-confidential-nodes, label: attestation token}
    - {from: aks-confidential-nodes, to: pe-mhsm, label: key request with token + identity, step: 3}
    - {from: pe-mhsm, to: mhsm-data-keys, label: Private Link}
    - {from: id-confidential-workload, to: mhsm-data-keys, label: Managed HSM Crypto User}
    - {from: mhsm-data-keys, to: aks-confidential-nodes, label: secure key release (policy validated), step: 4}
    - {from: st-encrypted-data, to: aks-confidential-nodes, label: encrypted data decrypted inside TEE only, step: 5}
    - {from: aks-confidential-nodes, to: ledger-audit, label: tamper-evident audit records, step: 6}
    - {from: aci-confidential-job, to: attest-cc, label: CCE policy attestation}
    - {from: cvm-dcasv5, to: attest-cc, label: guest attestation}
    - {from: users, to: aks-confidential-nodes, label: HTTPS}

- slug: immutable-blob-storage-compliance
  title: WORM records retention with immutable Blob Storage and locked retention policies
  category: storage
  tags: [immutable storage, worm, time-based retention, legal hold, sec 17a-4, compliance, private endpoint, lifecycle]
  source: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
  description: Records are written as block or append blobs into a container protected by a locked time-based retention policy, so no user, including account administrators, can modify or delete them until the interval expires, and a legal hold can extend protection indefinitely with tagged holds. The account is reached only over a private endpoint, lifecycle management tiers immutable data to cool and archive, and resource logs plus the policy audit log are retained in Log Analytics and an archive account for SEC 17a-4(f), FINRA and CFTC evidence.
  containers:
    - subscription: compliance
      resource_group: {name: rg-records, location: westeurope}
      vnets:
        - name: vnet-records
          cidr: 10.130.0.0/16
          subnets:
            - {name: snet-app-integration, cidr: 10.130.1.0/24}
            - {name: snet-pe, cidr: 10.130.2.0/24}
  elements:
    - {tf: azurerm_service_plan, name: plan-records, in: resource_group:rg-records}
    - {tf: azurerm_linux_web_app, name: app-records-ingest, in: subnet:snet-app-integration}
    - {tf: azurerm_private_endpoint, name: pe-blob, in: subnet:snet-pe}
    - {tf: azurerm_private_dns_zone, name: pdz-blob, in: resource_group:rg-records}
    - {tf: azurerm_storage_account, name: st-worm-records, in: resource_group:rg-records}
    - {tf: azurerm_storage_container, name: ct-trade-records, in: resource_group:rg-records}
    - {tf: azurerm_storage_container_immutability_policy, name: worm-7y-locked, in: resource_group:rg-records}
    - {tf: azurerm_storage_management_policy, name: lifecycle-tiering, in: resource_group:rg-records}
    - {tf: azurerm_log_analytics_workspace, name: law-compliance, in: resource_group:rg-records}
    - {tf: azurerm_storage_account, name: st-audit-archive, in: resource_group:rg-records}
  actors: [users, client]
  flows:
    - {from: client, to: app-records-ingest, label: submit records, step: 1}
    - {from: app-records-ingest, to: pe-blob, label: write block / append blobs over Private Link, step: 2}
    - {from: pe-blob, to: st-worm-records, label: public access disabled}
    - {from: st-worm-records, to: ct-trade-records, label: versioning enabled, GRS}
    - {from: worm-7y-locked, to: ct-trade-records, label: locked time-based retention (7 years), step: 3}
    - {from: users, to: ct-trade-records, label: read only; overwrite / delete denied, step: 4}
    - {from: users, to: worm-7y-locked, label: legal hold with tags, style: {dash: dashed}}
    - {from: lifecycle-tiering, to: ct-trade-records, label: tier to cool / archive}
    - {from: st-worm-records, to: law-compliance, label: resource logs + policy audit log, step: 5}
    - {from: law-compliance, to: st-audit-archive, label: long-term export}
    - {from: pdz-blob, to: vnet:vnet-records, link: azurerm_private_dns_zone_virtual_network_link}

- slug: bastion-only-admin-access
  title: Bastion-only administrative access to VMs without public IPs
  category: security
  tags: [azure bastion, jump host, rdp, ssh, tls 443, no public ip, session recording, hub-spoke]
  source: https://learn.microsoft.com/en-us/azure/bastion/bastion-overview
  description: Azure Bastion is deployed in the hub's AzureBastionSubnet with a single public IP and brokers RDP and SSH over TLS on port 443 from the Azure portal or native clients to VMs in peered spoke networks, so no VM needs a public IP, agent or open management port. Entra ID authentication with MFA and just-in-time role activation gate access, SSH keys come from Key Vault, and Bastion audit logs and Premium session recordings provide the compliance trail.
  containers:
    - subscription: connectivity
      resource_group: {name: rg-hub, location: westeurope}
      vnets:
        - name: hub
          cidr: 10.0.0.0/16
          subnets:
            - {name: AzureBastionSubnet, cidr: 10.0.4.0/26}
    - subscription: landing-zone-prod
      resource_group: {name: rg-prod, location: westeurope}
      vnets:
        - name: spoke-prod
          cidr: 10.1.0.0/16
          subnets:
            - {name: snet-app, cidr: 10.1.1.0/24}
            - {name: snet-data, cidr: 10.1.2.0/24}
  elements:
    - {tf: azurerm_public_ip, name: pip-bastion, in: resource_group:rg-hub}
    - {tf: azurerm_bastion_host, name: bastion-hub, in: subnet:AzureBastionSubnet}
    - {tf: azurerm_network_security_group, name: nsg-bastion, in: resource_group:rg-hub}
    - {tf: azurerm_network_ddos_protection_plan, name: ddos-hub, in: resource_group:rg-hub}
    - {tf: azurerm_key_vault, name: kv-admin-ssh-keys, in: resource_group:rg-hub}
    - {tf: azurerm_log_analytics_workspace, name: law-hub, in: resource_group:rg-hub}
    - {tf: azurerm_storage_account, name: st-session-recordings, in: resource_group:rg-hub}
    - {tf: azurerm_linux_virtual_machine, name: vm-app-1, in: subnet:snet-app}
    - {tf: azurerm_windows_virtual_machine, name: vm-sql-1, in: subnet:snet-data}
  actors: [user, internet]
  flows:
    - {from: user, to: pip-bastion, label: TLS 443 (portal / native client, Entra ID + MFA + PIM), step: 1}
    - {from: pip-bastion, to: bastion-hub}
    - {from: nsg-bastion, to: bastion-hub, label: allow 443 in, 22/3389 out to VNet}
    - {from: ddos-hub, to: vnet:hub, label: protects Bastion public IP}
    - {from: vnet:hub, to: vnet:spoke-prod, link: azurerm_virtual_network_peering, label: hub-spoke peering}
    - {from: kv-admin-ssh-keys, to: bastion-hub, label: SSH private key from Key Vault, step: 2}
    - {from: bastion-hub, to: vm-app-1, label: SSH 22 to private IP, step: 3}
    - {from: bastion-hub, to: vm-sql-1, label: RDP 3389 to private IP, step: 3}
    - {from: internet, to: vm-app-1, label: no public IP; 22/3389 closed, style: {dash: dashed}}
    - {from: bastion-hub, to: law-hub, label: BastionAuditLogs, step: 4}
    - {from: bastion-hub, to: st-session-recordings, label: session recording (Premium)}
