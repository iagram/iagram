    - {from: datacenter, to: dns-resolver-hub, label: conditional forwarder for privatelink zones, step: 2}
    - {from: dns-resolver-hub, to: pdz-blob, label: resolve privatelink.blob.core.windows.net}
    - {from: datacenter, to: pe-shared-storage, label: private IP over ExpressRoute, step: 3}
    - {from: nsg-hub-pe, to: pe-shared-storage, label: inbound filtering}
    - {from: pe-shared-storage, to: st-shared, label: Private Link (public endpoint disabled)}
    - {from: vm-app, to: hub-fw, label: UDR to firewall (SNAT + logging), step: 4}
    - {from: hub-fw, to: pe-shared-storage, label: inspected traffic}
    - {from: vm-app, to: pe-sql-app, label: single-app endpoint in spoke, step: 5}
