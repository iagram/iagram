- slug: centralized-log-analytics-opensearch
  title: Centralized service log analytics with OpenSearch
  category: observability
  tags: [opensearch, log analytics, kinesis firehose, cloudwatch logs, sqs, lambda, s3]
  source: https://docs.aws.amazon.com/solutions/latest/centralized-logging-with-opensearch/service-log-analytics-pipeline.html
  description: AWS service logs such as CloudTrail, ALB access logs and VPC flow logs are delivered to a log bucket, either directly or through CloudWatch Logs and a Kinesis Data Firehose subscription; S3 event notifications queue new objects in SQS and a log processor Lambda parses and indexes them into an OpenSearch domain. Records that fail processing are written to a backup bucket and dashboards are served from OpenSearch Dashboards.
  containers:
    - region: us-east-1
      groups: [{label: log sources}]
      vpcs:
        - name: logging
          cidr: 10.170.0.0/16
          subnets:
            - {name: log-private-a, cidr: 10.170.1.0/24, az: a, public: false}
            - {name: log-private-b, cidr: 10.170.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_lb, name: app-alb, in: group:log sources}
    - {tf: aws_cloudtrail, name: org-trail, in: group:log sources}
    - {tf: aws_cloudwatch_log_group, name: lambda-logs, in: group:log sources}
    - {tf: aws_kinesis_firehose_delivery_stream, name: cwl-to-s3, in: region}
    - {tf: aws_s3_bucket, name: log-bucket, in: region}
    - {tf: aws_sqs_queue, name: new-log-objects, in: region}
    - {tf: aws_lambda_function, name: log-processor, in: subnet:log-private-a}
    - {tf: aws_opensearch_domain, name: logs-domain, in: subnet:log-private-b}
    - {tf: aws_s3_bucket, name: backup-bucket, in: region}
  actors: [users]
  flows:
    - {from: app-alb, to: log-bucket, label: access logs, step: 1}
    - {from: org-trail, to: log-bucket, label: CloudTrail logs, step: 1}
    - {from: lambda-logs, to: cwl-to-s3, label: subscription filter, step: 1}
    - {from: cwl-to-s3, to: log-bucket, label: batched delivery, step: 1}
    - {from: log-bucket, to: new-log-objects, label: S3 event notification, step: 2}
    - {from: new-log-objects, to: log-processor, link: aws_lambda_event_source_mapping}
    - {from: log-processor, to: log-bucket, label: read and parse log file, step: 3}
    - {from: log-processor, to: logs-domain, label: bulk index, step: 4}
    - {from: log-processor, to: backup-bucket, label: failed records, step: 5}
    - {from: users, to: logs-domain, label: OpenSearch Dashboards, step: 6}

- slug: medallion-iceberg-materialized-views
  title: Medallion architecture with Iceberg materialized views in SageMaker
  category: data
  tags: [medallion, bronze silver gold, apache iceberg, s3 tables, glue, sagemaker unified studio, athena, redshift]
  source: https://aws.amazon.com/blogs/big-data/building-medallion-architecture-with-iceberg-materialized-views-in-amazon-sagemaker/
  description: Raw bronze data is ingested into Iceberg tables in an S3 table bucket, and the silver and gold layers are each defined as a scheduled Iceberg materialized view authored in SageMaker Unified Studio. Glue uses Iceberg change-tracking metadata to refresh only changed rows through Spark, nested views give implicit lineage, and Athena and Redshift query the gold layer.
  containers:
    - region: us-east-1
      groups: [{label: bronze}, {label: silver}, {label: gold}]
  elements:
    - {tf: aws_kinesis_firehose_delivery_stream, name: bronze-ingest, in: region}
    - {tf: aws_s3tables_table_bucket, name: lakehouse-tables, in: region}
    - {tf: aws_s3tables_table, name: bronze-orders, in: group:bronze}
    - {tf: aws_s3tables_table, name: silver-orders-mv, in: group:silver}
    - {tf: aws_s3tables_table, name: gold-daily-kpis-mv, in: group:gold}
    - {tf: aws_glue_catalog_database, name: lakehouse-catalog, in: region}
    - {tf: aws_glue_job, name: mv-refresh-spark, in: region}
    - {tf: aws_sagemaker_domain, name: unified-studio, in: region}
    - {tf: aws_athena_workgroup, name: gold-athena, in: region}
    - {tf: aws_redshiftserverless_workgroup, name: gold-redshift, in: region}
  actors: [device, users]
  flows:
    - {from: device, to: bronze-ingest, label: raw events, step: 1}
    - {from: bronze-ingest, to: bronze-orders, label: append to Iceberg, step: 2}
    - {from: bronze-orders, to: lakehouse-tables, label: stored in table bucket}
    - {from: unified-studio, to: lakehouse-catalog, label: CREATE MATERIALIZED VIEW with SCHEDULE REFRESH, step: 3}
    - {from: mv-refresh-spark, to: bronze-orders, label: read changed rows only, step: 4}
    - {from: mv-refresh-spark, to: silver-orders-mv, label: clean and deduplicate, step: 4}
    - {from: mv-refresh-spark, to: gold-daily-kpis-mv, label: aggregate KPIs, step: 5}
    - {from: silver-orders-mv, to: gold-daily-kpis-mv, label: nested view lineage}
    - {from: gold-athena, to: gold-daily-kpis-mv, label: SQL, step: 6}
    - {from: gold-redshift, to: gold-daily-kpis-mv, label: SQL, step: 6}
    - {from: users, to: gold-athena, step: 7}

