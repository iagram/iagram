- slug: emr-eks-spark-sql-etl
  title: Spark SQL ETL pipeline on Amazon EMR on EKS
  category: data
  tags: [emr on eks, spark, fargate, kubernetes, etl, s3]
  source: https://aws.amazon.com/blogs/big-data/run-a-spark-sql-based-etl-pipeline-with-amazon-emr-on-amazon-eks/
  description: An EMR virtual cluster is registered against an EKS cluster whose Spark application namespace runs on Fargate across two Availability Zones next to other applications, and a declarative Spark SQL job definition kept in GitHub is submitted through the EMR on EKS job API; each driver and executor runs as an isolated pod that scales from zero and is torn down when the job completes. The NYC TLC ETL job reads raw trip data from S3, validates schema, aggregates and writes Parquet results back to an output bucket with pod-level IAM roles.
  containers:
    - region: us-east-1
      at: [1, 1]
      account_at: [2, 2]
      vpcs:
        - name: eks
          cidr: 10.80.0.0/16
          at: [2, 2]
          subnets:
            - {name: eks-private-a, cidr: 10.80.1.0/24, az: a, public: false, at: [1, 1]}
            - {name: eks-private-b, cidr: 10.80.2.0/24, az: b, public: false, at: [1, 1]}
  elements:
    - {tf: aws_eks_cluster, name: analytics-eks, in: vpc:eks, at: [1, 1, 1, 2]}
    - {tf: aws_eks_node_group, name: spark-application, in: analytics-eks, at: [1, 1]}
    - {tf: aws_eks_node_group, name: other-applications, in: analytics-eks, at: [2, 1]}
    - {tf: aws_emrcontainers_virtual_cluster, name: emr-virtual-cluster, in: region, at: [2, 1]}
    - {tf: aws_s3_bucket, name: raw-taxi-data, in: region, at: [1, 2]}
    - {tf: aws_s3_bucket, name: etl-output, in: region, at: [2, 3]}
  actors: [{type: user, at: [2, 1]}, {type: saas, name: GitHub, at: [1, 2]}]
  flows:
    - {from: user, to: emr-virtual-cluster, label: start-job-run with SQL job spec, step: 1}
    - {from: GitHub, to: emr-virtual-cluster, label: ETL job definition, step: 1}
    - {from: emr-virtual-cluster, to: analytics-eks, label: 'config, artifact URLs', step: 2}
    - {from: analytics-eks, to: spark-application, label: driver and executor pods on Fargate, step: 2}
    - {from: raw-taxi-data, to: spark-application, label: 's3://nyc-tlc/trip data', step: 3}
    - {from: spark-application, to: etl-output, label: write aggregated Parquet to s3://output, step: 4}
- slug: emr-serverless-mwaa-athena-validation
  title: EMR Serverless Spark jobs orchestrated by MWAA with Athena validation
  category: data
  tags: [emr serverless, mwaa, airflow, spark, athena, glue catalog]
  source: https://aws.amazon.com/blogs/big-data/orchestrate-amazon-emr-serverless-spark-jobs-with-amazon-mwaa-and-data-validation-using-amazon-athena/
  description: An Airflow DAG in MWAA submits three sequential PySpark jobs to an EMR Serverless application, which scales workers up and down per job without a managed cluster. The jobs join and aggregate taxi trip data from an input bucket into Parquet in an output bucket, register tables in the Glue Data Catalog and the DAG runs an Athena query to validate the summary table for the user.
  containers:
