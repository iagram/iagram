# AWS reference architectures: data lakes, warehouses and batch analytics.
# Format: see FORMAT.md. One official source page per item.

- slug: modern-data-analytics-lakehouse
  title: Modern data analytics lake house on AWS
  category: data
  tags: [lake house, lake formation, glue, athena, redshift spectrum, emr, quicksight]
  source: https://docs.aws.amazon.com/architecture-diagrams/latest/modern-data-analytics-on-aws/modern-data-analytics-on-aws.html
  description: Enterprise databases, file shares, devices, logs, social and media feeds, SaaS applications and flat files are ingested through DMS, DataSync, Kinesis, MSK, IoT Core, AppFlow and Transfer Family, joined by third-party datasets from AWS Data Exchange, into an S3 data lake registered with Lake Formation and catalogued in the Glue Data Catalog. Glue moves and transforms the data, and purpose-built services (Kinesis Data Analytics, QuickSight, OpenSearch, Redshift and Redshift Spectrum, EMR, SageMaker, Athena and Aurora) consume it under Lake Formation governance.
  containers:
    - datacenter: on-premises
      at: [1, 1]
    - region: us-east-1
      account_at: [1, 2, 3, 1]
      groups:
        - {label: data ingestion, at: [1, 1, 2, 1]}
        - {label: scalable data lake, at: [2, 2]}
        - {label: seamless data movement, at: [2, 3]}
        - {label: purpose-built analytics and insights, at: [1, 4, 2, 1]}
  elements:
    - {tf: aws_dms_replication_instance, name: dms-replication, in: group:data ingestion, at: [1, 1]}
    - {tf: aws_datasync_task, name: datasync-files, in: group:data ingestion, at: [2, 1]}
    - {tf: aws_kinesis_stream, name: event-stream, in: group:data ingestion, at: [3, 1]}
    - {tf: aws_msk_cluster, name: msk-stream, in: group:data ingestion, at: [4, 1]}
    - {tf: aws_iot_topic_rule, name: iot-core-ingest, in: group:data ingestion, at: [5, 1]}
    - {tf: aws_appflow_flow, name: appflow-saas, in: group:data ingestion, at: [6, 1]}
    - {tf: aws_transfer_server, name: sftp-endpoint, in: group:data ingestion, at: [7, 1]}
    - {tf: aws_dataexchange_data_set, name: data-exchange, in: region, at: [1, 2]}
    - {tf: aws_s3_bucket, name: data-lake, in: group:scalable data lake, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: lake-catalog, in: group:scalable data lake, at: [2, 1]}
    - {tf: aws_lakeformation_resource, name: lake-formation-location, in: group:scalable data lake, at: [3, 1]}
    - {tf: aws_glue_job, name: glue-etl, in: group:seamless data movement, at: [1, 1]}
    - {tf: aws_kinesisanalyticsv2_application, name: kinesis-analytics, in: group:purpose-built analytics and insights, at: [1, 1]}
    - {tf: aws_quicksight_dashboard, name: quicksight-bi, in: group:purpose-built analytics and insights, at: [2, 1]}
    - {tf: aws_opensearch_domain, name: opensearch-ops, in: group:purpose-built analytics and insights, at: [3, 1]}
    - {tf: aws_redshift_cluster, name: redshift-dw, in: group:purpose-built analytics and insights, at: [4, 1]}
    - {tf: aws_emr_cluster, name: emr-spark, in: group:purpose-built analytics and insights, at: [5, 1]}
    - {tf: aws_sagemaker_domain, name: sagemaker-ml, in: group:purpose-built analytics and insights, at: [6, 1]}
    - {tf: aws_athena_workgroup, name: athena-analytics, in: group:purpose-built analytics and insights, at: [7, 1]}
    - {tf: aws_rds_cluster, name: aurora-serving, in: group:purpose-built analytics and insights, at: [8, 1]}
  actors: [datacenter, {type: device, at: [2, 1]}, {type: saas, at: [3, 1]}, {type: users, at: [2, 3]}]
  flows:
    - {from: datacenter, to: dms-replication, label: SQL and NoSQL databases, step: 1}
    - {from: datacenter, to: datasync-files, label: file shares and flat files, step: 1}
    - {from: device, to: event-stream, label: devices and logs, step: 1}
    - {from: device, to: msk-stream, label: social and media streams, step: 1}
    - {from: device, to: iot-core-ingest, label: IoT telemetry, step: 1}
    - {from: saas, to: appflow-saas, label: SaaS applications, step: 1}
    - {from: saas, to: sftp-endpoint, label: SFTP drops, step: 1}
    - {from: dms-replication, to: data-lake, label: Parquet, step: 2}
    - {from: datasync-files, to: data-lake, step: 2}
    - {from: event-stream, to: data-lake, step: 2}
    - {from: msk-stream, to: data-lake, step: 2}
    - {from: iot-core-ingest, to: data-lake, step: 2}
    - {from: appflow-saas, to: data-lake, step: 2}
    - {from: sftp-endpoint, to: data-lake, step: 2}
    - {from: data-exchange, to: data-lake, label: third-party datasets, step: 3}
    - {from: lake-formation-location, to: data-lake, label: registered location, step: 4}
    - {from: glue-etl, to: data-lake, label: transform and enrich, step: 5}
    - {from: glue-etl, to: lake-catalog, label: catalog tables, step: 5}
    - {from: kinesis-analytics, to: event-stream, label: streaming analytics, step: 6}
    - {from: opensearch-ops, to: data-lake, label: operational analytics, step: 6}
    - {from: redshift-dw, to: lake-catalog, label: Spectrum external schema, step: 6}
    - {from: emr-spark, to: data-lake, label: Spark processing, step: 6}
    - {from: sagemaker-ml, to: data-lake, label: model training, step: 6}
    - {from: athena-analytics, to: lake-catalog, label: SQL, step: 6}
    - {from: glue-etl, to: aurora-serving, label: load serving tables, step: 6}
    - {from: quicksight-bi, to: athena-analytics, step: 7}
    - {from: quicksight-bi, to: redshift-dw, step: 7}
    - {from: users, to: quicksight-bi, label: dashboards, step: 8}
- slug: supply-chain-data-lake
  title: Supply chain data lake
  category: industry
  tags: [supply chain, data lake, lake formation, glue, athena, quicksight, neptune]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/supply-chain-data-lake/supply-chain-data-lake.html
  description: Supply chain data from on-premises SQL/NoSQL databases and file shares, logs, devices, social and media streams and SaaS ERP/CRM applications is ingested with DMS, DataSync, Kinesis Data Streams, MSK, IoT Core, AppFlow and Data Exchange into an S3 data lake governed by Lake Formation that holds demand plans, production plans, transfer orders, shipment status, external events, pick orders, carriers, weather, product inventory, product returns, fleet data and tenders. Glue crawlers and ETL jobs maintain the Data Catalog, while Athena and QuickSight give planners scorecards, Redshift and EMR handle warehouse and big data processing, SageMaker trains models and Neptune answers network queries.
  containers:
    - region: us-east-1
      account_at: [1, 2, 7, 1]
      groups:
        - {label: data ingestion, at: [1, 1]}
        - {label: scalable supply chain data lake, at: [1, 2]}
        - {label: seamless data movement, at: [1, 3]}
        - {label: purpose-built analytics and insights, at: [1, 4]}
