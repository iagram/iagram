  source: https://aws.amazon.com/blogs/big-data/transform-your-data-to-amazon-s3-tables-with-amazon-athena/
  description: Partitioned Parquet files in a general purpose bucket are registered as an external Glue table, and an Athena CREATE TABLE AS SELECT writes them into a fully managed Iceberg table inside an S3 table bucket namespace with a day partition transform. Enabling the analytics integration creates the s3tablescatalog in the Glue Data Catalog under Lake Formation, and Athena INSERT, UPDATE and DELETE run with ACID guarantees while S3 Tables handles compaction and maintenance.
