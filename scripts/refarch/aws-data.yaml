- slug: glue-data-quality-alerts
  title: Data quality evaluation with alerts using Glue Data Quality
  category: data
  tags: [glue data quality, step functions, eventbridge, lambda, sns, glue catalog]
  source: https://aws.amazon.com/blogs/big-data/set-up-alerts-and-orchestrate-data-quality-rules-with-aws-glue-data-quality/
  description: Users start a Step Functions workflow that runs a Glue Data Quality evaluation of a ruleset against a Glue Data Catalog table. When the evaluation result event reaches EventBridge, a rule invokes a Lambda that formats the scores and failed rules, stores the results in S3 and publishes an email notification through SNS to the target recipients.
  containers:
    - region: us-east-1
      account_at: [1, 2]
  elements:
    - {tf: aws_glue_data_quality_ruleset, name: orders-ruleset, in: region, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: staging-db, in: region, at: [1, 2]}
    - {tf: aws_sfn_state_machine, name: dq-orchestrator, in: region, at: [2, 1]}
    - {tf: aws_cloudwatch_event_rule, name: dq-results-available, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: format-results, in: region, at: [1, 4]}
    - {tf: aws_s3_bucket, name: dq-results, in: region, at: [1, 5]}
    - {tf: aws_sns_topic, name: dq-alerts, in: region, at: [2, 4]}
  actors: [{type: users, at: [1, 1]}, {type: users, name: target-recipients, at: [1, 3]}]
  flows:
    - {from: users, to: dq-orchestrator, label: start execution, step: 1}
    - {from: dq-orchestrator, to: orders-ruleset, label: StartDataQualityRulesetEvaluationRun, step: 2}
    - {from: orders-ruleset, to: staging-db, label: data quality job run, step: 2}
    - {from: orders-ruleset, to: dq-results-available, label: Data Quality Evaluations Results Available, step: 3}
    - {from: dq-results-available, to: format-results, link: aws_cloudwatch_event_target, step: 4}
    - {from: format-results, to: dq-alerts, label: publish score and failed rules, step: 5}
    - {from: format-results, to: dq-results, label: data quality result, step: 6}
    - {from: dq-alerts, to: target-recipients, label: email notification, step: 7}
- slug: sfn-etl-validate-transform-partition
  title: Serverless ETL with validation, transformation and partitioning on Step Functions
  category: data
  tags: [step functions, glue, lambda, sns, s3, parquet, partitioning]
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/orchestrate-an-etl-pipeline-with-validation-transformation-and-partitioning-using-aws-step-functions.html
  description: A CSV upload to the source folder triggers a Lambda that starts a Step Functions state machine; a validation Lambda checks schema and types, moving good files to a stage folder and bad files to an error folder with an SNS alert. A Glue crawler catalogs the staged file, a Glue job converts it to compressed Parquet partitioned by year, month and day, a second crawl registers the result for Athena and SNS reports success or failure.
  containers:
    - region: us-east-1
      groups: [{label: bucket folders}]
  elements:
    - {tf: aws_s3_bucket, name: etl-bucket, in: group:bucket folders}
    - {tf: aws_lambda_function, name: start-pipeline, in: region}
    - {tf: aws_sfn_state_machine, name: etl-state-machine, in: region}
    - {tf: aws_lambda_function, name: validate-csv, in: region}
    - {tf: aws_lambda_function, name: move-file, in: region}
    - {tf: aws_glue_crawler, name: stage-crawler, in: region}
    - {tf: aws_glue_job, name: csv-to-parquet, in: region}
    - {tf: aws_glue_catalog_database, name: etl-db, in: region}
    - {tf: aws_sns_topic, name: pipeline-notifications, in: region}
    - {tf: aws_athena_workgroup, name: adhoc-queries, in: region}
  actors: [user, users]
  flows:
    - {from: user, to: etl-bucket, label: upload CSV to source folder, step: 1}
    - {from: etl-bucket, to: start-pipeline, label: S3 event notification, step: 2}
    - {from: start-pipeline, to: etl-state-machine, label: StartExecution, step: 2}
    - {from: etl-state-machine, to: validate-csv, label: schema and type validation, step: 3}
    - {from: etl-state-machine, to: move-file, label: stage or error folder, step: 4}
    - {from: move-file, to: etl-bucket, step: 4}
    - {from: etl-state-machine, to: stage-crawler, label: crawl staged CSV, step: 5}
    - {from: stage-crawler, to: etl-db, step: 5}
    - {from: etl-state-machine, to: csv-to-parquet, label: run Glue job, step: 6}
    - {from: csv-to-parquet, to: etl-bucket, label: Parquet partitioned by year/month/day, step: 7}
    - {from: stage-crawler, to: etl-bucket, label: crawl transform folder, step: 8}
    - {from: etl-state-machine, to: pipeline-notifications, label: success or failure, step: 9}
    - {from: pipeline-notifications, to: users, label: email}
    - {from: adhoc-queries, to: etl-db, label: ad hoc SQL}

- slug: s3-tables-athena-iceberg
  title: Transform Parquet into S3 Tables with Athena
  category: data
  tags: [s3 tables, apache iceberg, athena, glue catalog, lake formation, ctas]
  source: https://aws.amazon.com/blogs/big-data/transform-your-data-to-amazon-s3-tables-with-amazon-athena/
  description: Partitioned Parquet files in a general purpose bucket are registered as an external Glue table, and an Athena CREATE TABLE AS SELECT writes them into a fully managed Iceberg table inside an S3 table bucket namespace with a day partition transform. Enabling the analytics integration creates the s3tablescatalog in the Glue Data Catalog under Lake Formation, and Athena INSERT, UPDATE and DELETE run with ACID guarantees while S3 Tables handles compaction and maintenance.
  containers:
    - region: us-east-1
      groups: [{label: general purpose storage}, {label: table storage}]
  elements:
    - {tf: aws_s3_bucket, name: reviews-parquet, in: group:general purpose storage}
    - {tf: aws_glue_catalog_database, name: source-db, in: region}
    - {tf: aws_glue_catalog_table, name: reviews-external, in: region}
    - {tf: aws_s3tables_table_bucket, name: analytics-table-bucket, in: group:table storage}
    - {tf: aws_s3tables_namespace, name: reviews-namespace, in: group:table storage}
    - {tf: aws_s3tables_table, name: reviews-iceberg, in: group:table storage}
    - {tf: aws_lakeformation_data_lake_settings, name: s3tables-integration, in: region}
    - {tf: aws_athena_workgroup, name: iceberg-athena, in: region}
    - {tf: aws_redshiftserverless_workgroup, name: warehouse-reader, in: region}
  actors: [users]
  flows:
    - {from: reviews-external, to: reviews-parquet, label: MSCK REPAIR TABLE partitions, step: 1}
    - {from: reviews-external, to: source-db, step: 1}
    - {from: s3tables-integration, to: analytics-table-bucket, label: s3tablescatalog in Glue Data Catalog, step: 2}
    - {from: reviews-namespace, to: analytics-table-bucket, step: 2}
    - {from: iceberg-athena, to: reviews-external, label: CTAS reads Parquet, step: 3}
    - {from: iceberg-athena, to: reviews-iceberg, label: 'CTAS with day(review_date) partition', step: 4}
    - {from: reviews-iceberg, to: reviews-namespace, step: 4}
    - {from: iceberg-athena, to: reviews-iceberg, label: 'INSERT, UPDATE, DELETE with ACID', step: 5}
    - {from: warehouse-reader, to: reviews-iceberg, label: query via s3tablescatalog, step: 6}
    - {from: users, to: iceberg-athena, step: 7}
