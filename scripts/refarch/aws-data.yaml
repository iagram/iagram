    - {tf: aws_glue_catalog_table, name: reviews-external, in: region}
    - {tf: aws_s3tables_table_bucket, name: analytics-table-bucket, in: group:table storage}
    - {tf: aws_s3tables_namespace, name: reviews-namespace, in: group:table storage}
    - {tf: aws_s3tables_table, name: reviews-iceberg, in: group:table storage}
    - {tf: aws_lakeformation_data_lake_settings, name: s3tables-integration, in: region}
    - {tf: aws_athena_workgroup, name: iceberg-athena, in: region}
    - {tf: aws_redshiftserverless_workgroup, name: warehouse-reader, in: region}
  actors: [users]
  flows:
    - {from: reviews-external, to: reviews-parquet, label: MSCK REPAIR TABLE partitions, step: 1}
    - {from: reviews-external, to: source-db, step: 1}
    - {from: s3tables-integration, to: analytics-table-bucket, label: s3tablescatalog in Glue Data Catalog, step: 2}
    - {from: reviews-namespace, to: analytics-table-bucket, step: 2}
    - {from: iceberg-athena, to: reviews-external, label: CTAS reads Parquet, step: 3}
    - {from: iceberg-athena, to: reviews-iceberg, label: 'CTAS with day(review_date) partition', step: 4}
    - {from: reviews-iceberg, to: reviews-namespace, step: 4}
    - {from: iceberg-athena, to: reviews-iceberg, label: 'INSERT, UPDATE, DELETE with ACID', step: 5}
    - {from: warehouse-reader, to: reviews-iceberg, label: query via s3tablescatalog, step: 6}
    - {from: users, to: iceberg-athena, step: 7}
