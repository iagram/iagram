    - {tf: aws_quicksight_data_set, name: spice-dataset, in: region, at: [1, 3]}
    - {tf: aws_redshiftserverless_workgroup, name: bi-workgroup, in: region, at: [2, 2, 1, 2]}
    - {tf: aws_quicksight_data_source, name: athena-source, in: region, at: [1, 4]}
    - {tf: aws_quicksight_data_source, name: redshift-source, in: region, at: [2, 4]}
