- slug: data-mesh-lf-tag-based-access
  title: Data mesh with Lake Formation tag-based access control
  category: data
  tags: [data mesh, lake formation, lf-tags, cross-account, ram, athena]
  source: https://aws.amazon.com/blogs/big-data/build-a-modern-data-architecture-and-data-mesh-pattern-at-scale-using-aws-lake-formation-tag-based-access-control/
  description: A producer account stores domain data in S3 and registers it with its own Lake Formation as databases and tables, a central governance account owns the Lake Formation catalog and the LF-tag ontology (line of business, function, classification) and shares tagged tables cross-account through AWS RAM, and a consumer account queries through resource links with Athena. Permissions are granted on tags rather than on individual tables, so producer stewards keep ownership while the data mesh owner keeps governance central and consumer admins grant access to their analysts.
  containers:
    - region: us-east-1
      account: producer
      at: [1, 2, 3, 1]
    - region: us-east-1
      account: governance
      at: [4, 1, 1, 2]
    - region: us-east-1
      account: consumer
      at: [3, 1, 1, 3]
  elements:
    - {tf: aws_lakeformation_data_lake_settings, name: producer-lakeformation, in: account:producer, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: producer-database-a, in: account:producer, at: [2, 1]}
    - {tf: aws_glue_catalog_database, name: producer-database-b, in: account:producer, at: [3, 1]}
    - {tf: aws_s3_bucket, name: retail-raw, in: account:producer, at: [1, 1]}
    - {tf: aws_s3_bucket, name: cards-raw, in: account:producer, at: [2, 1]}
    - {tf: aws_lakeformation_data_lake_settings, name: lf-admin-settings, in: account:governance, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: central-catalog, in: account:governance, at: [1, 2]}
    - {tf: aws_lakeformation_lf_tag, name: lob-tag, in: account:governance, at: [2, 1]}
    - {tf: aws_lakeformation_lf_tag, name: classification-tag, in: account:governance, at: [2, 2]}
    - {tf: aws_lakeformation_resource, name: central-lake-location, in: account:governance, at: [3, 1]}
    - {tf: aws_lakeformation_data_lake_settings, name: consumer-lakeformation, in: account:consumer, at: [1, 1, 2, 1]}
    - {tf: aws_glue_catalog_database, name: consumer-resource-link, in: account:consumer, at: [1, 2]}
    - {tf: aws_athena_workgroup, name: analyst-workgroup, in: account:consumer, at: [1, 3]}
    - {tf: aws_glue_catalog_database, name: consumer-resource-link-b, in: account:consumer, at: [2, 2]}
    - {tf: aws_athena_workgroup, name: analyst-workgroup-b, in: account:consumer, at: [2, 3]}
  actors:
    - {type: user, name: producer steward, at: [2, 1]}
    - {type: user, name: data mesh owner, at: [2, 2]}
    - {type: user, name: consumer admin, at: [2, 3]}
    - {type: users, name: consumer analysts, at: [1, 4]}
  flows:
    - {from: producer steward, to: producer-lakeformation, label: registers data and requests tags, step: 1}
    - {from: producer-lakeformation, to: producer-database-a, label: 'Database A, Table X', step: 1}
    - {from: producer-lakeformation, to: producer-database-b, label: 'Database B, Table Y', step: 1}
    - {from: producer-database-a, to: retail-raw, label: table data, step: 1}
    - {from: producer-database-b, to: cards-raw, label: table data, step: 1}
    - {from: producer-database-a, to: central-catalog, label: shared to central catalog, step: 2}
    - {from: producer-database-b, to: central-catalog, label: shared to central catalog, step: 2}
    - {from: central-lake-location, to: retail-raw, label: registered S3 location, step: 2}
    - {from: data mesh owner, to: lf-admin-settings, label: defines central tag ontology, step: 3}
    - {from: lf-admin-settings, to: lob-tag, label: 'LF-tag LOB, LOB:Function', step: 3}
    - {from: lf-admin-settings, to: classification-tag, label: 'LF-tag Classification: Sensitive, Not Sensitive', step: 3}
    - {from: lob-tag, to: central-catalog, label: tags databases and tables, step: 4}
    - {from: classification-tag, to: central-catalog, label: tags columns, step: 4}
    - {from: central-catalog, to: consumer-resource-link, label: RAM resource share of tagged tables, step: 5}
    - {from: central-catalog, to: consumer-resource-link-b, label: RAM resource share of tagged tables, step: 5}
    - {from: consumer admin, to: consumer-lakeformation, label: grants tag-based permissions, step: 6}
    - {from: consumer-lakeformation, to: consumer-resource-link, label: resource link Database A, step: 6}
    - {from: consumer-lakeformation, to: consumer-resource-link-b, label: resource link Database B, step: 6}
    - {from: analyst-workgroup, to: consumer-resource-link, label: Athena SQL, step: 7}
    - {from: analyst-workgroup-b, to: consumer-resource-link-b, label: Athena SQL, step: 7}
    - {from: consumer analysts, to: analyst-workgroup, label: consumer analyst 1, step: 8}
    - {from: consumer analysts, to: analyst-workgroup-b, label: consumer analyst 2, step: 8}

- slug: data-mesh-datazone
  title: Data mesh with Amazon DataZone
  category: data
  tags: [data mesh, datazone, glue, redshift, governance, subscription]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/data-mesh-datazone/data-mesh-datazone.html
  description: Producer accounts ingest raw data with AppFlow, DMS, Kinesis, IoT Core and MSK into S3, RDS, Redshift and third-party sources, transform it with Glue, measure quality with Glue Data Quality and publish the assets to a DataZone domain hosted in a central governance account whose data portal, projects and catalog are reached through IAM Identity Center. Consumers search the DataZone portal, subscribe to assets and, once the owner approves, analyse them with Athena, Redshift, QuickSight and SageMaker in their own account.
  containers:
    - region: us-east-1
      account: producer
      at: [1, 2, 5, 1]
      groups: [{label: data storage, at: [1, 1]}, {label: data processing, at: [2, 1]}]
    - region: us-east-1
      account: governance
      at: [2, 1, 1, 2]
      groups: [{label: data portal, at: [1, 1]}]
    - region: us-east-1
      account: consumer
      at: [1, 2, 3, 1]
      groups: [{label: analytics and reporting, at: [1, 1]}]
  elements:
    - {tf: aws_appflow_flow, name: saas-ingest, in: account:producer, at: [1, 1]}
    - {tf: aws_dms_replication_instance, name: db-ingest, in: account:producer, at: [2, 1]}
    - {tf: aws_kinesis_stream, name: stream-ingest, in: account:producer, at: [3, 1]}
    - {tf: aws_iot_topic_rule, name: iot-ingest, in: account:producer, at: [4, 1]}
    - {tf: aws_msk_cluster, name: msk-ingest, in: account:producer, at: [5, 1]}
    - {tf: aws_s3_bucket, name: producer-lake, in: group:data storage, at: [1, 1]}
    - {tf: aws_rds_cluster, name: producer-rds, in: group:data storage, at: [1, 2]}
    - {tf: aws_redshift_cluster, name: producer-warehouse, in: group:data storage, at: [2, 1]}
    - {tf: aws_glue_connection, name: third-party-sources, in: group:data storage, at: [2, 2]}
    - {tf: aws_glue_job, name: producer-transform, in: group:data processing, at: [1, 1, 1, 2]}
    - {tf: aws_glue_data_quality_ruleset, name: producer-dq, in: group:data processing, at: [2, 1]}
    - {tf: aws_glue_catalog_database, name: producer-catalog, in: group:data processing, at: [2, 2]}
    - {tf: aws_datazone_domain, name: mesh-domain, in: account:governance, at: [1, 1]}
    - {tf: aws_ssoadmin_permission_set, name: iam-identity-center, in: account:governance, at: [1, 2]}
    - {tf: aws_datazone_project, name: producer-project, in: group:data portal, at: [1, 1]}
    - {tf: aws_sagemaker_domain, name: consumer-ml, in: account:consumer, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: consumer-catalog, in: account:consumer, at: [2, 1]}
    - {tf: aws_datazone_project, name: consumer-project, in: account:consumer, at: [3, 1]}
    - {tf: aws_athena_workgroup, name: consumer-athena, in: group:analytics and reporting, at: [1, 1]}
    - {tf: aws_redshift_cluster, name: consumer-warehouse, in: group:analytics and reporting, at: [2, 1]}
    - {tf: aws_quicksight_data_source, name: consumer-bi, in: group:analytics and reporting, at: [3, 1]}
  actors: [saas, database, {type: device, at: [3, 1]}, {type: server, at: [4, 1]}, users, idp]
  flows:
    - {from: saas, to: saas-ingest, step: 1}
    - {from: database, to: db-ingest, step: 1}
    - {from: device, to: iot-ingest, step: 1}
    - {from: server, to: msk-ingest, label: logs and files, step: 1}
    - {from: saas-ingest, to: producer-lake, step: 2}
    - {from: db-ingest, to: producer-rds, step: 2}
    - {from: stream-ingest, to: producer-lake, step: 2}
    - {from: iot-ingest, to: stream-ingest, step: 2}
    - {from: msk-ingest, to: producer-lake, step: 2}
    - {from: producer-transform, to: producer-lake, label: transform raw data, step: 3}
    - {from: producer-transform, to: producer-warehouse, label: load curated tables, step: 3}
    - {from: producer-dq, to: producer-catalog, label: quality scores, step: 3}
    - {from: producer-transform, to: producer-catalog, label: technical metadata, step: 3}
    - {from: producer-catalog, to: mesh-domain, label: data source job publishes assets, step: 4}
    - {from: producer-warehouse, to: mesh-domain, label: Redshift assets, step: 4}
    - {from: mesh-domain, to: producer-project, label: domain units and projects, step: 4}
