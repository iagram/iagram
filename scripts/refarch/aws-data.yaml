# AWS reference architectures: data lakes, warehouses and batch analytics.
# Format: see FORMAT.md. One official source page per item.

- slug: modern-data-analytics-lakehouse
  title: Modern data analytics lake house on AWS
  category: data
  tags: [lake house, lake formation, glue, athena, redshift spectrum, emr, quicksight]
  source: https://docs.aws.amazon.com/architecture-diagrams/latest/modern-data-analytics-on-aws/modern-data-analytics-on-aws.html
  description: Enterprise, SaaS, device and file sources are ingested through DMS, DataSync, Kinesis and Transfer Family into an S3 data lake registered with Lake Formation and catalogued in the Glue Data Catalog. Glue transforms the data, EMR and Redshift process it, and Athena, Redshift Spectrum, QuickSight and OpenSearch consume it under Lake Formation governance.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      groups: [{label: ingestion}, {label: lake storage and governance}, {label: consumption}]
      vpcs:
        - name: analytics
          cidr: 10.20.0.0/16
          subnets:
            - {name: analytics-private-a, cidr: 10.20.1.0/24, az: a, public: false}
            - {name: analytics-private-b, cidr: 10.20.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_dms_replication_instance, name: dms-replication, in: subnet:analytics-private-a}
    - {tf: aws_datasync_task, name: datasync-files, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: event-stream, in: group:ingestion}
    - {tf: aws_transfer_server, name: sftp-endpoint, in: group:ingestion}
    - {tf: aws_s3_bucket, name: data-lake, in: group:lake storage and governance}
    - {tf: aws_lakeformation_resource, name: lake-formation-location, in: group:lake storage and governance}
    - {tf: aws_glue_catalog_database, name: lake-catalog, in: group:lake storage and governance}
    - {tf: aws_glue_job, name: glue-etl, in: group:lake storage and governance}
    - {tf: aws_emr_cluster, name: emr-spark, in: subnet:analytics-private-b}
    - {tf: aws_redshift_cluster, name: redshift-dw, in: subnet:analytics-private-a}
    - {tf: aws_opensearch_domain, name: opensearch-ops, in: subnet:analytics-private-b}
    - {tf: aws_athena_workgroup, name: athena-analytics, in: group:consumption}
    - {tf: aws_quicksight_data_source, name: quicksight-bi, in: group:consumption}
  actors: [datacenter, saas, device, users]
  flows:
    - {from: datacenter, to: dms-replication, label: database CDC, step: 1}
    - {from: datacenter, to: datasync-files, label: file shares, step: 1}
    - {from: device, to: event-stream, label: telemetry, step: 1}
    - {from: saas, to: sftp-endpoint, label: SFTP drops, step: 1}
    - {from: dms-replication, to: data-lake, label: Parquet, step: 2}
    - {from: datasync-files, to: data-lake, step: 2}
    - {from: event-stream, to: data-lake, step: 2}
    - {from: sftp-endpoint, to: data-lake, step: 2}
    - {from: lake-formation-location, to: data-lake, label: registered location, step: 3}
    - {from: glue-etl, to: data-lake, label: transform and enrich, step: 4}
    - {from: glue-etl, to: lake-catalog, label: catalog tables, step: 4}
    - {from: emr-spark, to: data-lake, label: Spark processing, step: 5}
    - {from: redshift-dw, to: lake-catalog, label: Spectrum external schema, step: 5}
    - {from: athena-analytics, to: lake-catalog, label: SQL, step: 6}
    - {from: quicksight-bi, to: athena-analytics, step: 7}
    - {from: quicksight-bi, to: redshift-dw, step: 7}
    - {from: opensearch-ops, to: data-lake, label: operational analytics}
    - {from: users, to: quicksight-bi, label: dashboards, step: 8}

- slug: supply-chain-data-lake
  title: Supply chain data lake
  category: industry
  tags: [supply chain, data lake, lake formation, glue, athena, quicksight, neptune]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/supply-chain-data-lake/supply-chain-data-lake.html
  description: Planning, execution and shipment-status data from ERP and CRM systems, edge devices and streams is ingested with DMS, DataSync, Kinesis and AppFlow into an S3 data lake built with Lake Formation and transformed by Glue. Athena and QuickSight give planners cross-category scorecards, Redshift and EMR handle warehouse and big data processing, SageMaker trains models and Neptune answers network queries.
  containers:
    - datacenter: on-premises
    - region: us-east-1
      groups: [{label: ingestion}, {label: data lake}, {label: analytics}]
      vpcs:
        - name: supply-chain
          cidr: 10.30.0.0/16
          subnets:
            - {name: sc-private-a, cidr: 10.30.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_dms_replication_instance, name: erp-dms, in: subnet:sc-private-a}
    - {tf: aws_datasync_task, name: plan-files-sync, in: group:ingestion}
    - {tf: aws_kinesis_stream, name: shipment-events, in: group:ingestion}
    - {tf: aws_appflow_flow, name: crm-appflow, in: group:ingestion}
    - {tf: aws_s3_bucket, name: supply-chain-lake, in: group:data lake}
    - {tf: aws_lakeformation_resource, name: lake-location, in: group:data lake}
    - {tf: aws_glue_job, name: glue-etl, in: group:data lake}
    - {tf: aws_glue_catalog_database, name: supply-chain-catalog, in: group:data lake}
    - {tf: aws_athena_workgroup, name: planner-athena, in: group:analytics}
    - {tf: aws_quicksight_data_source, name: scorecards, in: group:analytics}
    - {tf: aws_redshift_cluster, name: supply-chain-dw, in: subnet:sc-private-a}
    - {tf: aws_emr_cluster, name: emr-processing, in: subnet:sc-private-a}
    - {tf: aws_sagemaker_domain, name: demand-ml, in: group:analytics}
    - {tf: aws_neptune_cluster, name: network-graph, in: subnet:sc-private-a}
  actors: [datacenter, saas, device, users]
  flows:
    - {from: datacenter, to: erp-dms, label: ERP tables, step: 1}
    - {from: datacenter, to: plan-files-sync, label: planning files, step: 1}
    - {from: device, to: shipment-events, label: shipment status, step: 1}
    - {from: saas, to: crm-appflow, label: CRM objects, step: 1}
    - {from: erp-dms, to: supply-chain-lake, step: 2}
    - {from: plan-files-sync, to: supply-chain-lake, step: 2}
    - {from: shipment-events, to: supply-chain-lake, step: 2}
    - {from: crm-appflow, to: supply-chain-lake, step: 2}
    - {from: lake-location, to: supply-chain-lake, label: Lake Formation registration, step: 3}
    - {from: glue-etl, to: supply-chain-lake, label: transform, step: 4}
    - {from: glue-etl, to: supply-chain-catalog, label: catalog, step: 4}
    - {from: planner-athena, to: supply-chain-catalog, label: SQL, step: 5}
    - {from: scorecards, to: planner-athena, step: 6}
    - {from: users, to: scorecards, label: planners drill down, step: 7}
    - {from: supply-chain-dw, to: supply-chain-lake, label: warehouse loads}
    - {from: emr-processing, to: supply-chain-lake, label: open-source processing}
    - {from: demand-ml, to: supply-chain-lake, label: train models}
    - {from: network-graph, to: glue-etl, label: graph loads}

- slug: data-mesh-lf-tag-based-access
  title: Data mesh with Lake Formation tag-based access control
  category: data
  tags: [data mesh, lake formation, lf-tags, cross-account, ram, athena]
  source: https://aws.amazon.com/blogs/big-data/build-a-modern-data-architecture-and-data-mesh-pattern-at-scale-using-aws-lake-formation-tag-based-access-control/
  description: A producer account stores domain data in S3 and crawls it with Glue, a central governance account owns the Lake Formation catalog, LF-tag ontology and cross-account shares through AWS RAM, and a consumer account queries through resource links with Athena. Permissions are granted on tags such as line of business and classification rather than on individual tables, so producers keep ownership while governance stays central.
  containers:
    - region: us-east-1
      account: producer
    - region: us-east-1
      account: governance
    - region: us-east-1
      account: consumer
  elements:
    - {tf: aws_s3_bucket, name: retail-raw, in: account:producer}
    - {tf: aws_s3_bucket, name: cards-raw, in: account:producer}
    - {tf: aws_glue_crawler, name: producer-crawler, in: account:producer}
    - {tf: aws_glue_catalog_database, name: producer-resource-link, in: account:producer}
    - {tf: aws_lakeformation_resource, name: central-lake-location, in: account:governance}
    - {tf: aws_glue_catalog_database, name: central-catalog, in: account:governance}
    - {tf: aws_lakeformation_data_lake_settings, name: lf-admin-settings, in: account:governance}
    - {tf: aws_ram_resource_share, name: catalog-share, in: account:governance}
    - {tf: aws_glue_catalog_database, name: consumer-resource-link, in: account:consumer}
    - {tf: aws_athena_workgroup, name: analyst-workgroup, in: account:consumer}
  actors: [users]
  flows:
    - {from: producer-crawler, to: retail-raw, label: crawl, step: 1}
    - {from: producer-crawler, to: cards-raw, label: crawl, step: 1}
    - {from: producer-crawler, to: producer-resource-link, label: tables via resource link, step: 2}
    - {from: producer-resource-link, to: central-catalog, label: points to shared database, step: 2}
    - {from: central-lake-location, to: retail-raw, label: registered S3 location, step: 3}
    - {from: lf-admin-settings, to: central-catalog, label: 'LF-tags: LOB, Classification', step: 4}
    - {from: catalog-share, to: consumer-resource-link, label: RAM share of tagged tables, step: 5}
    - {from: consumer-resource-link, to: central-catalog, label: resource link, step: 5}
    - {from: analyst-workgroup, to: consumer-resource-link, label: Athena SQL, step: 6}
    - {from: users, to: analyst-workgroup, label: analysts, step: 7}

- slug: data-mesh-datazone
  title: Data mesh with Amazon DataZone
  category: data
  tags: [data mesh, datazone, glue, redshift, governance, subscription]
  source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/data-mesh-datazone/data-mesh-datazone.html
  description: Producer accounts ingest raw data with AppFlow, DMS and Kinesis, transform it with Glue, measure quality with Glue Data Quality and publish S3, Redshift and RDS assets to a DataZone catalog hosted in a central governance account. Consumers search the DataZone portal, subscribe to assets and, once the owner approves, analyse them with Athena, Redshift, QuickSight and SageMaker in their own account.
  containers:
    - region: us-east-1
      account: producer
    - region: us-east-1
      account: governance
    - region: us-east-1
      account: consumer
  elements:
    - {tf: aws_appflow_flow, name: saas-ingest, in: account:producer}
    - {tf: aws_dms_replication_instance, name: db-ingest, in: account:producer}
    - {tf: aws_kinesis_stream, name: stream-ingest, in: account:producer}
    - {tf: aws_s3_bucket, name: producer-lake, in: account:producer}
    - {tf: aws_glue_job, name: producer-transform, in: account:producer}
    - {tf: aws_glue_data_quality_ruleset, name: producer-dq, in: account:producer}
    - {tf: aws_glue_catalog_database, name: producer-catalog, in: account:producer}
    - {tf: aws_redshift_cluster, name: producer-warehouse, in: account:producer}
    - {tf: aws_datazone_domain, name: mesh-domain, in: account:governance}
    - {tf: aws_datazone_project, name: consumer-project, in: account:consumer}
    - {tf: aws_athena_workgroup, name: consumer-athena, in: account:consumer}
    - {tf: aws_quicksight_data_source, name: consumer-bi, in: account:consumer}
    - {tf: aws_sagemaker_domain, name: consumer-ml, in: account:consumer}
  actors: [saas, database, users, idp]
  flows:
    - {from: saas, to: saas-ingest, step: 1}
    - {from: database, to: db-ingest, step: 1}
    - {from: saas-ingest, to: producer-lake, step: 2}
    - {from: db-ingest, to: producer-lake, step: 2}
    - {from: stream-ingest, to: producer-lake, step: 2}
    - {from: producer-transform, to: producer-lake, label: transform raw data, step: 3}
    - {from: producer-dq, to: producer-catalog, label: quality scores, step: 3}
    - {from: producer-transform, to: producer-catalog, label: technical metadata, step: 3}
    - {from: producer-catalog, to: mesh-domain, label: data source job publishes assets, step: 4}
    - {from: producer-warehouse, to: mesh-domain, label: Redshift assets, step: 4}
    - {from: idp, to: mesh-domain, label: SSO to data portal, step: 5}
    - {from: users, to: mesh-domain, label: search and subscribe, step: 6}
    - {from: mesh-domain, to: consumer-project, label: approved subscription grant, step: 7}
    - {from: consumer-athena, to: consumer-project, label: query subscribed assets, step: 8}
    - {from: consumer-bi, to: consumer-athena, step: 8}
    - {from: consumer-ml, to: consumer-project, label: model development, step: 8}

- slug: enterprise-lake-lf-cross-account
  title: Enterprise data lake with Lake Formation cross-account access
  category: data
  tags: [lake formation, cross-account, resource links, ram, glue, athena, redshift spectrum]
  source: https://aws.amazon.com/blogs/big-data/design-patterns-for-an-enterprise-data-lake-using-aws-lake-formation-cross-account-access/
  description: A central enterprise data lake account holds the shared S3 buckets, Glue Data Catalog and Lake Formation permissions; producer accounts write into it with Glue jobs, and consumer accounts read through resource links with Athena, EMR or Redshift Spectrum. Lake Formation creates AWS RAM resource shares for every grant, so catalog changes are visible immediately in all accounts with no copy or sync.
  containers:
    - region: eu-west-1
      account: data-lake
    - region: eu-west-1
      account: producer
    - region: eu-west-1
      account: consumer
  elements:
    - {tf: aws_s3_bucket, name: edla-raw, in: account:data-lake}
    - {tf: aws_s3_bucket, name: edla-curated, in: account:data-lake}
    - {tf: aws_lakeformation_resource, name: edla-location, in: account:data-lake}
    - {tf: aws_glue_catalog_database, name: edla-catalog, in: account:data-lake}
    - {tf: aws_ram_resource_share, name: edla-share, in: account:data-lake}
    - {tf: aws_glue_job, name: producer-etl, in: account:producer}
    - {tf: aws_glue_catalog_database, name: producer-link, in: account:producer}
    - {tf: aws_glue_catalog_database, name: consumer-link, in: account:consumer}
    - {tf: aws_athena_workgroup, name: consumer-athena, in: account:consumer}
    - {tf: aws_redshift_cluster, name: consumer-redshift, in: account:consumer}
    - {tf: aws_quicksight_data_source, name: consumer-quicksight, in: account:consumer}
  actors: [users]
  flows:
    - {from: edla-location, to: edla-raw, label: registered, step: 1}
    - {from: edla-location, to: edla-curated, label: registered, step: 1}
    - {from: edla-share, to: producer-link, label: write grant via RAM, step: 2}
    - {from: producer-link, to: edla-catalog, label: resource link, step: 2}
    - {from: producer-etl, to: edla-raw, label: read, step: 3}
    - {from: producer-etl, to: edla-curated, label: write curated tables, step: 3}
    - {from: producer-etl, to: producer-link, label: update catalog, step: 3}
    - {from: edla-share, to: consumer-link, label: read grant via RAM, step: 4}
    - {from: consumer-link, to: edla-catalog, label: resource link, step: 4}
    - {from: consumer-athena, to: consumer-link, label: SELECT, step: 5}
    - {from: consumer-redshift, to: consumer-link, label: Spectrum external schema, step: 5}
    - {from: consumer-quicksight, to: consumer-athena, step: 6}
    - {from: users, to: consumer-quicksight, step: 7}

- slug: redshift-spectrum-lf-governance
  title: Redshift Spectrum on a Lake Formation governed data lake
  category: data
  tags: [redshift spectrum, lake formation, glue catalog, column-level security, data lake]
  source: https://aws.amazon.com/blogs/big-data/centralize-governance-for-your-data-lake-using-aws-lake-formation-while-enabling-a-modern-data-architecture-with-amazon-redshift-spectrum
  description: An S3 data lake registered with Lake Formation is catalogued by a Glue crawler, and Lake Formation grants table and column permissions to an IAM role used by a Redshift cluster. Redshift Spectrum creates an external schema over the Glue database so warehouse users join hot data in Redshift with lake data in S3 while Lake Formation enforces the same policies that Athena and Glue honour.
  containers:
    - region: us-east-1
      groups: [{label: governed data lake}]
      vpcs:
        - name: warehouse
          cidr: 10.40.0.0/16
          subnets:
            - {name: dw-private-a, cidr: 10.40.1.0/24, az: a, public: false}
            - {name: dw-private-b, cidr: 10.40.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_s3_bucket, name: lake-bucket, in: group:governed data lake}
    - {tf: aws_lakeformation_resource, name: lake-registration, in: group:governed data lake}
    - {tf: aws_glue_crawler, name: lake-crawler, in: group:governed data lake}
    - {tf: aws_glue_catalog_database, name: lake-db, in: group:governed data lake}
    - {tf: aws_redshift_cluster, name: analytics-dw, in: subnet:dw-private-a}
    - {tf: aws_athena_workgroup, name: adhoc-athena, in: region}
    - {tf: aws_quicksight_data_source, name: bi-dashboards, in: region}
  actors: [users]
  flows:
    - {from: lake-registration, to: lake-bucket, label: register S3 location, step: 1}
    - {from: lake-crawler, to: lake-bucket, label: crawl Parquet, step: 2}
    - {from: lake-crawler, to: lake-db, label: create tables, step: 2}
    - {from: analytics-dw, to: lake-db, label: external schema (Spectrum), step: 3}
    - {from: analytics-dw, to: lake-bucket, label: Spectrum scans governed columns, step: 4}
    - {from: adhoc-athena, to: lake-db, label: same Lake Formation grants, step: 4}
    - {from: bi-dashboards, to: analytics-dw, label: JDBC, step: 5}
    - {from: users, to: bi-dashboards, step: 6}

- slug: redshift-serverless-glue-mwaa-etl
  title: End-to-end ETL into Redshift Serverless orchestrated by MWAA
  category: data
  tags: [mwaa, airflow, glue, redshift serverless, vpc peering, cross-account]
  source: https://aws.amazon.com/blogs/big-data/orchestrate-an-end-to-end-etl-pipeline-using-amazon-s3-aws-glue-and-amazon-redshift-serverless-with-amazon-mwaa/
  description: An Airflow DAG in MWAA waits for date-partitioned files in a source bucket, runs a Glue crawler and Glue job to stage them, loads a Redshift Serverless workgroup in private subnets, runs stored procedures and unloads the result back to a target bucket in the central account. The MWAA VPC peers with the Redshift VPC and reaches S3 and Secrets Manager through VPC endpoints.
  containers:
    - region: us-east-1
      account: central-data
    - region: us-east-1
      account: processing
      vpcs:
        - name: mwaa
          cidr: 10.50.0.0/16
          subnets:
            - {name: mwaa-private-a, cidr: 10.50.1.0/24, az: a, public: false}
            - {name: mwaa-private-b, cidr: 10.50.2.0/24, az: b, public: false}
        - name: redshift
          cidr: 10.60.0.0/16
          subnets:
            - {name: rs-private-a, cidr: 10.60.1.0/24, az: a, public: false}
            - {name: rs-private-b, cidr: 10.60.2.0/24, az: b, public: false}
            - {name: rs-private-c, cidr: 10.60.3.0/24, az: c, public: false}
  elements:
    - {tf: aws_s3_bucket, name: source-products, in: account:central-data}
    - {tf: aws_s3_bucket, name: target-unload, in: account:central-data}
    - {tf: aws_mwaa_environment, name: airflow, in: subnet:mwaa-private-a}
    - {tf: aws_glue_crawler, name: products-crawler, in: account:processing}
    - {tf: aws_glue_catalog_database, name: staging-db, in: account:processing}
    - {tf: aws_glue_job, name: products-etl, in: account:processing}
    - {tf: aws_redshiftserverless_namespace, name: dw-namespace, in: account:processing}
    - {tf: aws_redshiftserverless_workgroup, name: dw-workgroup, in: subnet:rs-private-a}
    - {tf: aws_vpc_endpoint, name: s3-endpoint, in: vpc:redshift}
  actors: []
  flows:
    - {from: airflow, to: vpc:redshift, link: aws_vpc_peering_connection}
    - {from: airflow, to: source-products, label: S3KeySensor waits for partition, step: 1}
    - {from: airflow, to: products-crawler, label: start crawler, step: 2}
    - {from: products-crawler, to: staging-db, label: update catalog, step: 2}
    - {from: airflow, to: products-etl, label: run Glue job, step: 3}
    - {from: products-etl, to: staging-db, label: read staged table, step: 3}
    - {from: products-etl, to: dw-workgroup, label: load into Redshift, step: 4}
    - {from: dw-workgroup, to: dw-namespace, label: stored procedures, step: 5}
    - {from: airflow, to: dw-workgroup, label: RedshiftToS3Operator UNLOAD, step: 6}
    - {from: dw-workgroup, to: s3-endpoint, step: 6}
    - {from: s3-endpoint, to: target-unload, label: cross-account write, step: 7}

- slug: aurora-redshift-zero-etl
  title: Aurora zero-ETL integration with Amazon Redshift
  category: database
  tags: [zero-etl, aurora, redshift, near real-time analytics, operational analytics]
  source: https://aws.amazon.com/blogs/big-data/getting-started-guide-for-near-real-time-operational-analytics-using-amazon-aurora-zero-etl-integration-with-amazon-redshift
  description: A zero-ETL integration replicates transactional tables from an Aurora MySQL cluster into a Redshift data warehouse within seconds of commit, with no pipeline code to write or operate. Analysts query the replicated database in Redshift alongside other warehouse data and can build materialized views and dashboards on it.
  containers:
    - region: us-east-1
      vpcs:
        - name: oltp-analytics
          cidr: 10.70.0.0/16
          subnets:
            - {name: db-private-a, cidr: 10.70.1.0/24, az: a, public: false}
            - {name: db-private-b, cidr: 10.70.2.0/24, az: b, public: false}
            - {name: dw-private-a, cidr: 10.70.11.0/24, az: a, public: false}
            - {name: app-private-a, cidr: 10.70.21.0/24, az: a, public: false}
  elements:
    - {tf: aws_rds_cluster, name: orders-aurora, in: subnet:db-private-a}
    - {tf: aws_rds_cluster_instance, name: orders-writer, in: subnet:db-private-a}
    - {tf: aws_rds_cluster_parameter_group, name: binlog-params, in: region}
    - {tf: aws_redshift_cluster, name: analytics-dw, in: subnet:dw-private-a}
    - {tf: aws_instance, name: order-app, in: subnet:app-private-a}
    - {tf: aws_quicksight_data_source, name: ops-dashboards, in: region}
  actors: [users]
  flows:
    - {from: orders-aurora, to: analytics-dw, link: aws_rds_integration}
    - {from: order-app, to: orders-writer, label: OLTP writes, step: 1}
    - {from: orders-writer, to: orders-aurora, label: writer instance, step: 1}
    - {from: binlog-params, to: orders-aurora, label: enhanced binlog enabled, step: 1}
    - {from: orders-aurora, to: analytics-dw, label: zero-ETL replication in seconds, step: 2}
    - {from: ops-dashboards, to: analytics-dw, label: query replicated database, step: 3}
