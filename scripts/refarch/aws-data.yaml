    - {tf: aws_emrserverless_application, name: spark-app, in: region, at: [2, 2]}
    - {tf: aws_s3_bucket, name: taxi-output, in: region, at: [2, 3]}
    - {tf: aws_glue_catalog_database, name: taxi-db, in: region, at: [1, 3]}
    - {tf: aws_athena_workgroup, name: validation-athena, in: region, at: [2, 4]}
  actors: [{type: user, at: [1, 2]}]
  flows:
    - {from: airflow, to: spark-app, label: 'EmrServerlessStartJobOperator: green, yellow, summary', step: 1}
    - {from: taxi-input, to: spark-app, label: read raw trips and zones, step: 2}
    - {from: spark-app, to: taxi-output, label: write Parquet, step: 3}
    - {from: taxi-output, to: taxi-db, label: external tables, step: 3}
    - {from: airflow, to: validation-athena, label: AthenaOperator query, step: 4}
    - {from: taxi-db, to: validation-athena, label: ny_taxi_summary metadata, step: 4}
    - {from: taxi-output, to: validation-athena, label: scan Parquet, step: 4}
    - {from: validation-athena, to: user, label: validation result, step: 5}
- slug: emr-hive-metastore-lf-federation
