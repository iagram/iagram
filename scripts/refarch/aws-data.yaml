    - {from: athena-source, to: bi-dashboard, step: 4}
    - {from: redshift-source, to: bi-dashboard, step: 4}
    - {from: external-users, to: bi-dashboard, label: embedded dashboards, step: 5}
    - {from: internal-users, to: bi-dashboard, label: self-service analyses, step: 5}
- slug: centralized-log-analytics-opensearch
  title: Centralized service log analytics with OpenSearch
  category: observability
  tags: [opensearch, log analytics, kinesis firehose, cloudwatch logs, sqs, lambda, s3]
  source: https://docs.aws.amazon.com/solutions/latest/centralized-logging-with-opensearch/service-log-analytics-pipeline.html
  description: For AWS service logs that are only reachable through an API, such as RDS and WAF logs, an EventBridge schedule triggers a log-retrieval Lambda that pulls the logs and writes them to a log bucket; S3 event notifications reach an EventBridge rule that triggers a log processor Lambda, which reads each object, parses it and indexes it into an OpenSearch domain. Records that fail processing are written to a backup bucket and dashboards are served from OpenSearch Dashboards.
  containers:
    - region: us-east-1
      groups: [{label: log sources, at: [1, 1, 2, 1]}]
      vpcs:
        - name: logging
          cidr: 10.170.0.0/16
          at: [2, 5]
          subnets:
            - {name: log-private-a, cidr: 10.170.1.0/24, az: a, public: false}
            - {name: log-private-b, cidr: 10.170.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_rds_cluster, name: app-rds, in: group:log sources, at: [1, 1]}
    - {tf: aws_wafv2_web_acl, name: edge-waf, in: group:log sources, at: [2, 1]}
    - {tf: aws_cloudwatch_event_rule, name: api-poll-schedule, in: region, at: [1, 2]}
    - {tf: aws_lambda_function, name: log-retriever, in: region, at: [2, 2]}
    - {tf: aws_s3_bucket, name: log-bucket, in: region, at: [2, 3]}
    - {tf: aws_cloudwatch_event_rule, name: log-object-created, in: region, at: [2, 4]}
    - {tf: aws_lambda_function, name: log-processor, in: subnet:log-private-a}
    - {tf: aws_opensearch_domain, name: logs-domain, in: subnet:log-private-b}
    - {tf: aws_s3_bucket, name: backup-bucket, in: region, at: [3, 5]}
  actors: [users]
  flows:
    - {from: api-poll-schedule, to: log-retriever, label: scheduled trigger, step: 1}
    - {from: app-rds, to: log-retriever, label: retrieve logs via API, step: 2}
    - {from: edge-waf, to: log-retriever, label: retrieve logs via API, step: 2}
    - {from: log-retriever, to: log-bucket, label: write logs, step: 3}
    - {from: log-bucket, to: log-object-created, label: send events, step: 4}
    - {from: log-object-created, to: log-processor, label: trigger, step: 5}
    - {from: log-processor, to: log-bucket, label: read log file, step: 6}
    - {from: log-processor, to: logs-domain, label: bulk upload, step: 7}
    - {from: log-processor, to: backup-bucket, label: failed records, step: 8}
    - {from: users, to: logs-domain, label: OpenSearch Dashboards}

- slug: medallion-iceberg-materialized-views
  title: Medallion architecture with Iceberg materialized views in SageMaker
  category: data
  tags: [medallion, bronze silver gold, apache iceberg, s3 tables, glue, sagemaker unified studio, athena, redshift]
  source: https://aws.amazon.com/blogs/big-data/building-medallion-architecture-with-iceberg-materialized-views-in-amazon-sagemaker/
  description: Raw trips are appended to a bronze Iceberg table in an S3 table bucket, the silver layer is a scheduled Iceberg materialized view that cleans and enriches only new or changed rows, and two gold materialized views (city daily metrics and vehicle performance) refresh daily from it; all views are authored in SageMaker Unified Studio and nested views give implicit lineage. Athena, Amazon Quick, Redshift and Iceberg REST API clients query the gold layer.
  containers:
    - region: us-east-1
      account_at: [1, 2, 3, 1]
      groups: [{label: bronze, at: [1, 2, 1, 2]}, {label: silver, at: [2, 2, 1, 2]}, {label: gold, at: [3, 2, 1, 2]}]
  elements:
    - {tf: aws_s3tables_table_bucket, name: lakehouse-tables, in: region, at: [1, 4]}
