- slug: enterprise-lake-lf-cross-account
  title: Enterprise data lake with Lake Formation cross-account access
  category: data
  tags: [lake formation, cross-account, resource links, ram, glue, athena, redshift spectrum]
  source: https://aws.amazon.com/blogs/big-data/design-patterns-for-an-enterprise-data-lake-using-aws-lake-formation-cross-account-access/
  description: A central enterprise data lake account holds the shared S3 buckets and Glue Data Catalog registered with Lake Formation as the hub; a producer account writes into it with Glue ETL jobs, and a consumer account reads through Lake Formation grants with Athena, an EMR notebook, Redshift Spectrum, SageMaker and QuickSight. Lake Formation shares every grant across accounts, so catalog changes are visible immediately with no copy or sync.
  containers:
    - region: eu-west-1
      account: data-lake
      at: [1, 1, 1, 2]
      account_at: [1, 1]
    - region: eu-west-1
      account: producer
      at: [1, 1]
      account_at: [2, 1]
    - region: eu-west-1
      account: consumer
      at: [1, 1, 1, 3]
      account_at: [1, 2, 2, 1]
  elements:
    - {tf: aws_s3_bucket, name: edla-raw, in: account:data-lake, at: [1, 1]}
    - {tf: aws_s3_bucket, name: edla-curated, in: account:data-lake, at: [1, 2]}
    - {tf: aws_glue_catalog_database, name: edla-catalog, in: account:data-lake, at: [2, 1]}
    - {tf: aws_lakeformation_resource, name: edla-location, in: account:data-lake, at: [2, 2]}
    - {tf: aws_glue_job, name: producer-etl, in: account:producer, at: [2, 1]}
    - {tf: aws_sagemaker_notebook_instance, name: consumer-sagemaker, in: account:consumer, at: [2, 1]}
    - {tf: aws_emr_cluster, name: consumer-emr-notebook, in: account:consumer, at: [2, 2]}
    - {tf: aws_redshift_cluster, name: consumer-redshift, in: account:consumer, at: [2, 3]}
    - {tf: aws_athena_workgroup, name: consumer-athena, in: account:consumer, at: [3, 1]}
    - {tf: aws_quicksight_dashboard, name: consumer-quicksight, in: account:consumer, at: [3, 3]}
  actors: [{type: users, at: [1, 3, 2, 1]}]
  flows:
    - {from: edla-location, to: edla-raw, label: registered with Lake Formation, step: 1}
    - {from: edla-location, to: edla-curated, label: registered with Lake Formation, step: 1}
    - {from: producer-etl, to: edla-raw, label: read, step: 2}
    - {from: producer-etl, to: edla-curated, label: write curated tables, step: 2}
    - {from: producer-etl, to: edla-catalog, label: update catalog through cross-account grant, step: 2}
    - {from: consumer-athena, to: edla-catalog, label: SELECT through resource link, step: 3}
    - {from: consumer-emr-notebook, to: edla-catalog, label: Spark SQL notebook, step: 3}
    - {from: consumer-redshift, to: edla-catalog, label: Spectrum external schema, step: 3}
    - {from: consumer-sagemaker, to: edla-catalog, label: Data Wrangler or notebook SDK, step: 3}
    - {from: consumer-quicksight, to: consumer-athena, step: 4}
    - {from: users, to: consumer-quicksight, step: 5}
- slug: redshift-spectrum-lf-governance
  title: Redshift Spectrum on a Lake Formation governed data lake
  category: data
  tags: [redshift spectrum, lake formation, glue catalog, column-level security, data lake]
  source: https://aws.amazon.com/blogs/big-data/centralize-governance-for-your-data-lake-using-aws-lake-formation-while-enabling-a-modern-data-architecture-with-amazon-redshift-spectrum
  description: In a single AWS account an S3 data lake is crawled into the Glue Data Catalog and registered with Lake Formation, which grants table and column permissions on the marketing and finance tables to admin, marketing and finance IAM roles. A Redshift cluster assumes those roles and exposes the lake through per-department external schemas (Redshift Spectrum) so marketing and finance users querying from SQL interfaces only see the columns Lake Formation allows their group.
  containers:
    - region: us-east-1
      account_at: [1, 1, 2, 1]
      groups:
        - {label: AWS Glue, at: [1, 2, 2, 1]}
        - {label: IAM, at: [1, 4]}
        - {label: Amazon Redshift, at: [2, 3, 1, 2]}
  elements:
    - {tf: aws_s3_bucket, name: lake-bucket, in: region, at: [1, 1]}
    - {tf: aws_glue_crawler, name: lake-crawler, in: group:AWS Glue, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: lake-db, in: group:AWS Glue, at: [2, 1]}
    - {tf: aws_lakeformation_resource, name: lake-registration, in: region, at: [1, 3]}
    - {tf: aws_iam_role, name: admin-role, in: group:IAM, at: [1, 1, 1, 2]}
    - {tf: aws_iam_role, name: marketing-role, in: group:IAM, at: [2, 1]}
    - {tf: aws_iam_role, name: finance-role, in: group:IAM, at: [2, 2]}
    - {tf: aws_redshift_cluster, name: analytics-dw, in: group:Amazon Redshift, at: [1, 1]}
    - {tf: aws_redshiftdata_statement, name: admin-group, in: group:Amazon Redshift, at: [1, 2]}
    - {tf: aws_redshiftdata_statement, name: marketing-group, in: group:Amazon Redshift, at: [2, 1]}
    - {tf: aws_redshiftdata_statement, name: finance-group, in: group:Amazon Redshift, at: [2, 2]}
    - {tf: aws_redshiftdata_statement, name: marketing-external-schema, in: group:Amazon Redshift, at: [3, 1]}
    - {tf: aws_redshiftdata_statement, name: finance-external-schema, in: group:Amazon Redshift, at: [3, 2]}
  actors:
    - {type: client, name: SQL Interfaces, at: [1, 2, 2, 1]}
    - {type: users, name: Marketing Users, at: [1, 3]}
    - {type: users, name: Finance Users, at: [2, 3]}
  flows:
    - {from: lake-crawler, to: lake-bucket, label: crawl marketing and finance data, step: 1}
    - {from: lake-crawler, to: lake-db, label: create marketing and finance tables, step: 2}
    - {from: lake-db, to: lake-registration, label: Lake Formation governs the catalog, step: 3}
    - {from: lake-registration, to: admin-role, label: grant table permissions, step: 4}
    - {from: lake-registration, to: marketing-role, label: grant marketing columns, step: 4}
    - {from: lake-registration, to: finance-role, label: grant finance columns, step: 4}
    - {from: marketing-external-schema, to: lake-db, label: external schema over marketing tables, step: 5}
    - {from: finance-external-schema, to: lake-db, label: external schema over finance tables, step: 5}
    - {from: admin-group, to: admin-role, label: cluster assumes chained roles, step: 6}
    - {from: SQL Interfaces, to: analytics-dw, label: query as group member, step: 7}
    - {from: Marketing Users, to: SQL Interfaces}
    - {from: Finance Users, to: SQL Interfaces}

- slug: redshift-serverless-glue-mwaa-etl
  title: End-to-end ETL into Redshift Serverless orchestrated by MWAA
  category: data
  tags: [mwaa, airflow, glue, redshift serverless, vpc peering, cross-account]
  source: https://aws.amazon.com/blogs/big-data/orchestrate-an-end-to-end-etl-pipeline-using-amazon-s3-aws-glue-and-amazon-redshift-serverless-with-amazon-mwaa/
  description: Data engineers push DAGs from GitHub to an S3 configs bucket read by MWAA; the Airflow DAG waits for date-partitioned files in a source bucket, runs a Glue crawler and Glue job to stage them, loads a Redshift Serverless workgroup in private subnets, runs stored procedures and unloads the result back to a target bucket in the central account for downstream applications, while data scientists query Redshift directly. The MWAA VPC peers with the Redshift VPC, connection secrets come from Secrets Manager and task logs go to CloudWatch.
  containers:
    - region: us-east-1
      account: central-data
      at: [1, 1]
      account_at: [1, 2]
    - region: us-east-1
      account: processing
      at: [1, 1]
      account_at: [1, 3]
      vpcs:
        - name: mwaa
          cidr: 10.50.0.0/16
          at: [2, 1, 1, 2]
          subnets:
            - {name: mwaa-private-a, cidr: 10.50.1.0/24, az: a, public: false}
            - {name: mwaa-private-b, cidr: 10.50.2.0/24, az: b, public: false}
        - name: redshift
          cidr: 10.60.0.0/16
          at: [2, 3, 1, 2]
          subnets:
            - {name: rs-private-a, cidr: 10.60.1.0/24, az: a, public: false}
            - {name: rs-private-b, cidr: 10.60.2.0/24, az: b, public: false}
  elements:
    - {tf: aws_s3_bucket, name: target-unload, in: account:central-data, at: [1, 1]}
    - {tf: aws_s3_bucket, name: source-products, in: account:central-data, at: [2, 1]}
    - {tf: aws_cloudwatch_log_group, name: airflow-logs, in: region:us-east-1, at: [1, 1]}
    - {tf: aws_secretsmanager_secret, name: redshift-secret, in: region:us-east-1, at: [1, 3]}
    - {tf: aws_mwaa_environment, name: airflow, in: subnet:mwaa-private-a}
    - {tf: aws_redshiftserverless_namespace, name: dw-namespace, in: region:us-east-1, at: [1, 4]}
    - {tf: aws_redshiftserverless_workgroup, name: dw-workgroup, in: subnet:rs-private-a}
    - {tf: aws_s3_bucket, name: dags-configs, in: region:us-east-1, at: [3, 1]}
    - {tf: aws_glue_crawler, name: products-crawler, in: region:us-east-1, at: [3, 2]}
    - {tf: aws_glue_job, name: products-etl, in: region:us-east-1, at: [3, 3]}
    - {tf: aws_glue_catalog_database, name: staging-db, in: region:us-east-1, at: [3, 4]}
  actors:
    - {type: client, name: downstream-applications, at: [1, 1]}
    - {type: users, name: data-engineers, at: [2, 1]}
    - {type: saas, name: GitHub, at: [2, 2]}
    - {type: users, name: data-scientists, at: [1, 4]}
  flows:
    - {from: vpc:mwaa, to: vpc:redshift, link: aws_vpc_peering_connection}
    - {from: data-engineers, to: GitHub, label: push DAGs}
    - {from: GitHub, to: dags-configs, label: deploy DAGs and Airflow configs}
    - {from: airflow, to: dags-configs, label: load DAGs}
    - {from: airflow, to: airflow-logs, label: task logs}
    - {from: airflow, to: redshift-secret, label: Redshift credentials}
    - {from: airflow, to: source-products, label: S3KeySensor waits for partition, step: 1}
    - {from: airflow, to: products-crawler, label: start crawler, step: 2}
    - {from: products-crawler, to: staging-db, label: update catalog, step: 2}
    - {from: airflow, to: products-etl, label: run Glue job, step: 3}
    - {from: products-etl, to: staging-db, label: read staged table, step: 3}
    - {from: products-etl, to: dw-workgroup, label: load into Redshift, step: 4}
    - {from: dw-workgroup, to: dw-namespace, label: stored procedures, step: 5}
    - {from: airflow, to: dw-workgroup, label: RedshiftToS3Operator UNLOAD, step: 6}
    - {from: dw-workgroup, to: target-unload, label: cross-account UNLOAD, step: 7}
    - {from: target-unload, to: downstream-applications, label: files, step: 8}
    - {from: dw-workgroup, to: data-scientists, label: analysis, step: 8}
- slug: aurora-redshift-zero-etl
  title: Aurora zero-ETL integration with Amazon Redshift
  category: database
  tags: [zero-etl, aurora, redshift, near real-time analytics, operational analytics]
