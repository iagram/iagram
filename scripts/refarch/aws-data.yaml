    - {tf: aws_datasync_task, name: plan-files-sync, in: group:data ingestion, at: [2, 1]}
    - {tf: aws_kinesis_stream, name: shipment-events, in: group:data ingestion, at: [3, 1]}
    - {tf: aws_msk_cluster, name: supply-chain-msk, in: group:data ingestion, at: [4, 1]}
    - {tf: aws_iot_topic_rule, name: device-telemetry, in: group:data ingestion, at: [5, 1]}
    - {tf: aws_appflow_flow, name: crm-appflow, in: group:data ingestion, at: [6, 1]}
    - {tf: aws_dataexchange_data_set, name: third-party-data, in: group:data ingestion, at: [7, 1]}
