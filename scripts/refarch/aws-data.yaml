  tags: [cdc, dms, kinesis, glue streaming, apache hudi, athena, quicksight]
  source: https://aws.amazon.com/blogs/big-data/create-an-apache-hudi-based-near-real-time-transactional-data-lake-using-aws-dms-amazon-kinesis-aws-glue-streaming-etl-and-data-visualization-using-amazon-quicksight
  description: DMS captures changes from an RDS MySQL database and publishes them to a Kinesis data stream, where a Glue streaming job using the Apache Hudi connector consumes them continuously and upserts into Hudi tables on S3. The Hudi tables are registered in the Glue Data Catalog so Athena ad hoc queries and QuickSight dashboards reflect inserts and updates within minutes.
  containers:
    - region: us-east-1
      vpcs:
        - name: source
          cidr: 10.120.0.0/16
          subnets:
            - {name: src-private-a, cidr: 10.120.1.0/24, az: a, public: false}
  elements:
    - {tf: aws_db_instance, name: source-rds, in: subnet:src-private-a}
    - {tf: aws_dms_replication_instance, name: cdc-dms, in: subnet:src-private-a}
    - {tf: aws_kinesis_stream, name: cdc-stream, in: region}
    - {tf: aws_glue_job, name: hudi-streaming-job, in: region}
    - {tf: aws_glue_connection, name: hudi-connector, in: region, at: [3, 3]}
    - {tf: aws_s3_bucket, name: hudi-lake, in: region}
    - {tf: aws_glue_catalog_database, name: hudi-db, in: region}
    - {tf: aws_athena_workgroup, name: hudi-athena, in: region}
    - {tf: aws_quicksight_data_source, name: hudi-dashboards, in: region}
  actors: [users]
  flows:
    - {from: source-rds, to: cdc-dms, label: transaction log CDC, step: 1}
    - {from: cdc-dms, to: cdc-stream, label: change records, step: 2}
    - {from: cdc-stream, to: hudi-streaming-job, label: Glue streaming consumer, step: 3}
    - {from: hudi-connector, to: hudi-streaming-job, label: Apache Hudi connector, step: 3}
    - {from: hudi-streaming-job, to: hudi-lake, label: Hudi upserts, step: 4}
    - {from: hudi-streaming-job, to: hudi-db, label: register Hudi tables, step: 4}
    - {from: hudi-db, to: hudi-athena, label: table metadata, step: 5}
    - {from: hudi-lake, to: hudi-athena, label: query Hudi tables, step: 5}
    - {from: hudi-athena, to: hudi-dashboards, label: dashboard, step: 6}
    - {from: hudi-athena, to: users, label: ad hoc analysis, step: 7}
    - {from: hudi-dashboards, to: users, label: dashboard, step: 7}

- slug: dms-glue-iceberg-transactional-lake
  title: Replicate relational sources into an Iceberg transactional data lake
  category: data
  tags: [apache iceberg, dms, glue, cdc, merge, lake formation, athena]
  source: https://aws.amazon.com/blogs/big-data/automate-replication-of-relational-sources-into-a-transactional-data-lake-with-apache-iceberg-and-aws-glue/
  description: A DMS replication task runs a full load and then CDC from a relational source into a raw S3 bucket organised by data source, schema and table as Parquet files; a Glue ETL job deployed by a CloudFormation stack, scheduled by EventBridge, configured through job and table parameters in Parameter Store and running a Python script kept in a Glue bucket, deduplicates the change files and merges them into Iceberg tables in a stage bucket organised by domain and table. The Iceberg tables are registered in per-domain Glue Data Catalog databases and queried with Athena.
  containers:
    - region: us-east-1
      groups:
        - {label: raw layer, at: [1, 2, 3, 1]}
        - {label: CloudFormation stack, at: [1, 3, 3, 1]}
        - {label: stage layer, at: [1, 4, 3, 1]}
        - {label: Glue Data Catalog, at: [1, 5, 3, 1]}
  elements:
    - {tf: aws_dms_replication_task, name: replication, in: region, at: [2, 1]}
    - {tf: aws_s3_bucket, name: raw-bucket, in: group:raw layer, at: [1, 1]}
    - {tf: aws_cloudwatch_event_rule, name: hourly-schedule, in: group:CloudFormation stack, at: [1, 1]}
    - {tf: aws_glue_job, name: iceberg-merge-job, in: group:CloudFormation stack, at: [1, 2]}
    - {tf: aws_ssm_parameter, name: job-config, in: group:CloudFormation stack, at: [2, 1]}
    - {tf: aws_ssm_parameter, name: table-config, in: group:CloudFormation stack, at: [2, 2]}
    - {tf: aws_s3_bucket, name: glue-scripts-bucket, in: region, at: [4, 3]}
    - {tf: aws_s3_bucket, name: stage-bucket, in: group:stage layer, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: iceberg-db, in: group:Glue Data Catalog, at: [1, 1]}
    - {tf: aws_glue_catalog_database, name: iceberg-db-b, in: group:Glue Data Catalog, at: [2, 1]}
    - {tf: aws_athena_workgroup, name: iceberg-athena, in: region, at: [2, 6]}
  flows:
    - {from: replication, to: raw-bucket, label: 'full load then CDC, Parquet per schema/table', step: 1}
    - {from: hourly-schedule, to: iceberg-merge-job, label: job scheduling, step: 2}
    - {from: job-config, to: iceberg-merge-job, label: job configuration, step: 2}
    - {from: table-config, to: iceberg-merge-job, label: primary keys and partitions, step: 2}
    - {from: glue-scripts-bucket, to: iceberg-merge-job, label: Python script and temporal folder, step: 2}
    - {from: iceberg-merge-job, to: raw-bucket, label: read new files via job bookmark, step: 3}
    - {from: iceberg-merge-job, to: stage-bucket, label: Iceberg MERGE upserts per domain/table, step: 4}
    - {from: stage-bucket, to: iceberg-db, label: domain database tables, step: 5}
    - {from: stage-bucket, to: iceberg-db-b, label: domain database tables, step: 5}
    - {from: iceberg-athena, to: iceberg-db, label: SQL with time travel, step: 6}
    - {from: iceberg-athena, to: iceberg-db-b, label: SQL with time travel, step: 6}

- slug: datasync-nfs-to-s3-lake
  title: Synchronize on-premises NFS shares into S3 with DataSync
  category: storage
  tags: [datasync, nfs, on-premises, s3, incremental transfer, cloudwatch]
  source: https://aws.amazon.com/blogs/storage/synchronizing-your-data-to-amazon-s3-using-aws-datasync/
  description: A DataSync agent deployed as a VM next to an on-premises Linux NFS server reads the shares over NFS and transfers them over TLS to the DataSync service, which writes them to an S3 bucket through a scheduled task with incremental transfer and checksum verification enabled. Each run compares source metadata against S3 objects and uploads only new or changed files.
  containers:
    - datacenter: on-premises
    - region: eu-west-1
  elements:
    - {tf: aws_datasync_agent, name: nfs-agent, in: datacenter, at: [1, 1]}
    - {tf: aws_datasync_task, name: nightly-sync, in: region, at: [1, 2]}
    - {tf: aws_s3_bucket, name: landing-bucket, in: region, at: [1, 3]}
  actors: [server]
  flows:
    - {from: server, to: nfs-agent, label: NFS, step: 1}
    - {from: nfs-agent, to: nightly-sync, label: TLS, step: 2}
    - {from: nightly-sync, to: landing-bucket, label: only new or changed objects, step: 3}

- slug: transfer-family-managed-file-transfer
  title: Managed file transfer with AWS Transfer Family and S3
  category: storage
  tags: [transfer family, sftp, s3, lambda, cognito, aurora, route 53]
  source: https://aws.amazon.com/blogs/architecture/managed-file-transfer-using-aws-transfer-family-and-amazon-s3/
  description: Partners connect over SFTP or FTPS from an FTP client to a Transfer Family server resolved through Route 53; a custom identity provider built on API Gateway and Lambda authenticates them against Cognito, looks up entitlements in Aurora and returns a scoped IAM policy with logical directory mappings into S3. Inbound files land in S3 and trigger an outbound Lambda that runs an AWS Batch transform job when needed and an AWS Batch send job that pushes outputs to the partner FTP server.
  containers:
    - region: us-east-1
      account_at: [1, 2]
      groups:
        - {label: inbound transfer, at: [1, 2]}
        - {label: outbound transfer, at: [2, 2]}
  elements:
    - {tf: aws_route53_zone, name: transfer-dns, in: region, at: [1, 1, 2, 1]}
    - {tf: aws_api_gateway_rest_api, name: idp-api, in: group:inbound transfer, at: [1, 1]}
    - {tf: aws_lambda_function, name: authorizer, in: group:inbound transfer, at: [1, 2]}
    - {tf: aws_rds_cluster, name: entitlements-db, in: group:inbound transfer, at: [1, 3]}
    - {tf: aws_transfer_server, name: sftp-server, in: group:inbound transfer, at: [2, 1]}
    - {tf: aws_s3_bucket, name: file-exchange, in: group:inbound transfer, at: [2, 2]}
    - {tf: aws_cognito_user_pool, name: partner-users, in: region, at: [1, 3]}
    - {tf: aws_lambda_function, name: outbound-router, in: group:outbound transfer, at: [1, 1]}
    - {tf: aws_batch_job_definition, name: transform-job, in: group:outbound transfer, at: [1, 2]}
    - {tf: aws_batch_job_definition, name: send-job, in: group:outbound transfer, at: [1, 3]}
  actors:
    - {type: client, name: Partner FTP client, at: [1, 1]}
    - {type: server, name: Partner FTP server, at: [1, 3]}
  flows:
    - {from: Partner FTP client, to: transfer-dns, label: resolve SFTP hostname, step: 1}
    - {from: transfer-dns, to: sftp-server, label: 'SFTP/FTPS: user and key', step: 2}
    - {from: sftp-server, to: idp-api, label: custom identity provider, step: 3}
    - {from: idp-api, to: authorizer, label: auth logic, step: 4}
    - {from: authorizer, to: partner-users, label: validate credentials, step: 5}
    - {from: authorizer, to: entitlements-db, label: entitlements and transactions, step: 6}
    - {from: sftp-server, to: file-exchange, label: read and write files, step: 7}
    - {from: file-exchange, to: outbound-router, label: S3 trigger, step: 8}
    - {from: outbound-router, to: transform-job, label: transform, step: 9}
    - {from: transform-job, to: send-job, step: 10}
    - {from: send-job, to: Partner FTP server, label: deliver to partner SFTP, step: 11}
    - {from: outbound-router, to: send-job, label: send without transformation, step: 12}

- slug: lf-row-level-security-athena
  title: Row-level access control with Lake Formation data filters
  category: security
  tags: [lake formation, data filters, row-level security, athena, glue catalog]
  source: https://docs.aws.amazon.com/lake-formation/latest/dg/cbac-tutorial.html
  description: A product reviews table in S3 is catalogued in the Glue Data Catalog and governed by Lake Formation, where a data lake administrator creates data filters with row expressions such as marketplace equals US or JP. Each analyst role is granted SELECT through its filter, so the same Athena query returns only the rows the user is allowed to see and access is audited centrally.
  containers:
    - region: us-east-1
      groups: [{label: governed data lake}]
  elements:
    - {tf: aws_s3_bucket, name: reviews-bucket, in: group:governed data lake}
    - {tf: aws_lakeformation_resource, name: reviews-location, in: group:governed data lake}
    - {tf: aws_glue_catalog_database, name: reviews-db, in: group:governed data lake}
    - {tf: aws_glue_catalog_table, name: amazon-reviews, in: group:governed data lake}
    - {tf: aws_lakeformation_data_lake_settings, name: lf-admin, in: group:governed data lake}
    - {tf: aws_iam_role, name: analyst-us, in: region}
    - {tf: aws_iam_role, name: analyst-jp, in: region}
    - {tf: aws_athena_workgroup, name: reviews-athena, in: region}
  actors: [users]
  flows:
    - {from: reviews-location, to: reviews-bucket, label: register location, step: 1}
    - {from: amazon-reviews, to: reviews-bucket, label: partitioned Parquet, step: 1}
    - {from: amazon-reviews, to: reviews-db, step: 1}
    - {from: lf-admin, to: amazon-reviews, label: 'data filters: marketplace=US, marketplace=JP', step: 2}
    - {from: lf-admin, to: analyst-us, label: grant SELECT via US filter, step: 3}
    - {from: lf-admin, to: analyst-jp, label: grant SELECT via JP filter, step: 3}
    - {from: users, to: reviews-athena, label: analysts query, step: 4}
    - {from: reviews-athena, to: analyst-us, label: assume role, step: 4}
    - {from: reviews-athena, to: amazon-reviews, label: rows filtered at query time, step: 5}

- slug: databrew-pii-masking-pipeline
  title: Discover and mask PII with Glue DataBrew orchestrated by Step Functions
  category: data
  tags: [glue databrew, pii, step functions, eventbridge, lambda, s3]
  source: https://aws.amazon.com/blogs/big-data/build-a-data-pipeline-to-automatically-discover-and-mask-pii-data-with-aws-glue-databrew/
  description: An object landing in the data input bucket sends an S3 event to EventBridge, which starts a Step Functions workflow; the workflow runs a DataBrew profile job to detect PII columns and writes the profile to the output bucket, a Lambda reads the profile and builds a recipe of masking transformations, and a DataBrew recipe job applies it. The recipe job reads its hashing secret from Secrets Manager and writes the masked output to the data output bucket.
  containers:
    - region: us-east-1
      groups: [{label: Step Functions workflow, at: [1, 2, 3, 1]}]
  elements:
    - {tf: aws_s3_bucket, name: raw-uploads, in: region, at: [1, 1]}
    - {tf: aws_cloudwatch_event_rule, name: object-created, in: region, at: [2, 1]}
    - {tf: aws_sfn_state_machine, name: pii-workflow, in: group:Step Functions workflow, at: [1, 1]}
    - {tf: aws_glue_job, name: databrew-profile-job, in: group:Step Functions workflow, at: [2, 1]}
    - {tf: aws_lambda_function, name: build-mask-recipe, in: group:Step Functions workflow, at: [3, 1]}
    - {tf: aws_glue_job, name: databrew-recipe-job, in: group:Step Functions workflow, at: [4, 1]}
    - {tf: aws_s3_bucket, name: masked-output, in: region, at: [2, 3]}
    - {tf: aws_secretsmanager_secret, name: masking-secret, in: region, at: [3, 3]}
  actors: [user]
  flows:
    - {from: user, to: raw-uploads, label: new data uploaded to the S3 bucket, step: 1}
    - {from: raw-uploads, to: object-created, label: S3 event notification, step: 2}
    - {from: object-created, to: pii-workflow, link: aws_cloudwatch_event_target}
    - {from: pii-workflow, to: databrew-profile-job, label: run profile job with PII detection}
    - {from: databrew-profile-job, to: raw-uploads, label: read input dataset, step: 3}
    - {from: databrew-profile-job, to: masked-output, label: profile results, step: 3}
    - {from: build-mask-recipe, to: masked-output, label: read profile results, step: 4}
    - {from: build-mask-recipe, to: databrew-recipe-job, label: 'create recipe (hash, redact)', step: 5}
    - {from: databrew-recipe-job, to: masking-secret, label: hashing secret, step: 6}
    - {from: databrew-recipe-job, to: masked-output, label: masked output, step: 7}

- slug: athena-federated-query
  title: Athena federated query across data sources with Lambda connectors
  category: analytics-bi
  tags: [athena, federated query, lambda connectors, dynamodb, rds, cloudwatch logs, redshift]
  source: https://aws.amazon.com/blogs/big-data/query-any-data-source-with-amazon-athenas-new-federated-query/
  description: Athena runs a single SQL statement against external sources through Lambda data source connectors deployed in the customer account, one connector per source such as DynamoDB, an RDS database or CloudWatch Logs. Connectors run on demand, push predicates down to the source, spill large results to an S3 spill bucket that Athena reads back, and let analysts query in place without first copying data into the lake.
  containers:
    - region: us-east-1
      groups: [{label: data sources, at: [3, 1, 1, 3]}]
  elements:
    - {tf: aws_athena_workgroup, name: federated-athena, in: region, at: [1, 1, 1, 3]}
    - {tf: aws_lambda_function, name: dynamodb-connector, in: region, at: [2, 1]}
    - {tf: aws_lambda_function, name: jdbc-connector, in: region, at: [2, 2]}
    - {tf: aws_lambda_function, name: cwlogs-connector, in: region, at: [2, 3]}
    - {tf: aws_s3_bucket, name: spill-bucket, in: region, at: [2, 4]}
    - {tf: aws_dynamodb_table, name: orders-table, in: group:data sources, at: [1, 1]}
    - {tf: aws_rds_cluster, name: customers-postgres, in: group:data sources, at: [1, 2]}
    - {tf: aws_cloudwatch_log_group, name: app-logs, in: group:data sources, at: [1, 3]}
  actors: [{type: users, at: [1, 2]}]
  flows:
    - {from: users, to: federated-athena, label: SQL query joining sources, step: 1}
    - {from: federated-athena, to: dynamodb-connector, label: invoke connector, step: 2}
    - {from: federated-athena, to: jdbc-connector, label: invoke connector, step: 2}
    - {from: federated-athena, to: cwlogs-connector, label: invoke connector, step: 2}
    - {from: dynamodb-connector, to: orders-table, label: scan with pushdown, step: 3}
    - {from: jdbc-connector, to: customers-postgres, label: JDBC, step: 3}
    - {from: cwlogs-connector, to: app-logs, label: filter log events, step: 3}
    - {from: cwlogs-connector, to: spill-bucket, label: spill large results, step: 4}
    - {from: federated-athena, to: spill-bucket, label: read spilled results, step: 4}

- slug: quicksight-data-lake-spice-dashboards
  title: QuickSight dashboards over a data lake via Athena and Redshift Serverless
  category: analytics-bi
  tags: [quicksight, spice, athena, redshift serverless, data lake, business users]
  source: https://aws.amazon.com/blogs/business-intelligence/enable-business-users-to-analyze-large-datasets-in-your-data-lake-with-amazon-quicksight/
  description: Partitioned datasets in an S3 data lake are exposed to QuickSight two ways, through Athena queries whose results are imported into SPICE for fast, high-concurrency dashboards, and through curated tables loaded into Redshift Serverless for datasets that need correction or multi-client access. External and internal business users in marketing, product and sales read the QuickSight dashboard without help from the data team.
