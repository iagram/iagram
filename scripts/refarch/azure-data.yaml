- slug: cosmos-synapse-link-htap
  title: HTAP with Azure Cosmos DB analytical store and Azure Synapse Link
  category: data
  tags: [cosmos-db, analytical-store, synapse-link, htap, synapse-spark, serverless-sql, private-endpoint, customer-managed-keys]
  source: https://learn.microsoft.com/en-us/azure/cosmos-db/synapse-link
  description: Enabling Synapse Link on an Azure Cosmos DB account creates a fully isolated column-oriented analytical store that auto-syncs inserts, updates and deletes from the transactional store with no ETL and no request-unit consumption. Azure Synapse Spark pools and serverless SQL pools query the analytical store directly for near real-time BI, data science and Power BI, with separate managed private endpoints per store and customer-managed keys from Key Vault. Microsoft now steers new projects to Cosmos DB mirroring in Fabric.
