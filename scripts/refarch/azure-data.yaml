- slug: debezium-cdc-event-hubs-postgres
  title: Change data capture with Debezium, Kafka Connect and Event Hubs
  category: data
  tags: [cdc, debezium, kafka-connect, event-hubs, postgresql, logical-decoding, kafka-api]
  source: https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-kafka-connect-debezium
  description: A Kafka Connect worker running the Debezium PostgreSQL connector uses logical decoding on Azure Database for PostgreSQL to capture row-level create, update and delete operations and publishes them as change events to Kafka topics hosted on an Event Hubs namespace over SASL_SSL. Connect stores its config, offset and status topics in Event Hubs, one event hub is auto-created per captured table, and sink connectors or consumers read the change stream downstream.
  containers:
    - subscription: integration
      resource_group: {name: rg-cdc-debezium, location: westeurope}
      vnets:
        - name: vnet-cdc
          cidr: 10.30.0.0/16
          subnets:
            - {name: snet-connect, cidr: 10.30.1.0/24}
            - {name: snet-postgres, cidr: 10.30.2.0/24}
  elements:
    - {tf: azurerm_postgresql_flexible_server, name: psql-source-orders, in: subnet:snet-postgres}
    - {tf: azurerm_linux_virtual_machine, name: vm-kafka-connect, in: subnet:snet-connect}
    - {tf: azurerm_eventhub_namespace, name: evhns-kafka-cdc, in: resource_group:rg-cdc-debezium}
    - {tf: azurerm_eventhub, name: evh-public-todos, in: resource_group:rg-cdc-debezium}
    - {tf: azurerm_eventhub, name: evh-connect-offsets, in: resource_group:rg-cdc-debezium}
    - {tf: azurerm_storage_account, name: stcdc-sink, in: resource_group:rg-cdc-debezium}
    - {tf: azurerm_linux_function_app, name: func-cdc-consumer, in: resource_group:rg-cdc-debezium}
    - {tf: azurerm_key_vault, name: kv-connect-secrets, in: resource_group:rg-cdc-debezium}
  actors: [client, users]
  flows:
    - {from: client, to: psql-source-orders, label: INSERT / UPDATE / DELETE, step: 1}
    - {from: psql-source-orders, to: vm-kafka-connect, label: logical decoding (wal2json), step: 2}
    - {from: vm-kafka-connect, to: evh-public-todos, label: change events over Kafka API (SASL_SSL), step: 3}
    - {from: vm-kafka-connect, to: evh-connect-offsets, label: connect config / offset / status topics}
    - {from: evh-public-todos, to: func-cdc-consumer, label: consume change stream, step: 4}
    - {from: evh-public-todos, to: stcdc-sink, label: Event Hubs Capture (Avro), step: 4}
    - {from: vm-kafka-connect, to: kv-connect-secrets, label: connection strings}
    - {from: users, to: vm-kafka-connect, label: Connect REST API (connector config)}

