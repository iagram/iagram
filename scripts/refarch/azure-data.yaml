  flows:
    - {from: users, to: app-tenant-api, label: HTTPS, step: 1}
    - {from: app-tenant-api, to: pe-citus-coordinator, label: pgBouncer port 6432, step: 2}
    - {from: pe-citus-coordinator, to: citus-multitenant, label: private endpoint to coordinator}
    - {from: citus-multitenant, to: citus-multitenant, label: shard queries to worker nodes (tenant_id), step: 3}
    - {from: device, to: evhns-clickstream, label: events, step: 1}
    - {from: evhns-clickstream, to: asa-rollups, label: stream input, step: 2}
    - {from: asa-rollups, to: citus-multitenant, label: PostgreSQL output (rollup tables), step: 3}
    - {from: adf-batch-ingest, to: citus-multitenant, label: COPY batch loads}
    - {from: app-tenant-api, to: kv-db-credentials, label: connection secret}
    - {from: citus-multitenant, to: law-citus-metrics, label: metrics and slow query logs}

- slug: redis-write-through-cache-sql
  title: Write-through caching with Azure Managed Redis and Azure SQL Database
  category: database
  tags: [redis, write-through, cache-aside, azure-sql, functions, app-service, outbox, private-endpoint]
  source: https://learn.microsoft.com/en-us/azure/architecture/databases/architecture/write-through-caching-azure-sql-managed-redis
  description: App Service serves reads from Azure Managed Redis and falls back to Azure SQL Database on a cache miss, while every write goes through an HTTP-triggered Azure Function that validates idempotency, commits to SQL with a durable outbox row, then updates the versioned Redis key before returning. A repair function replays pending outbox entries when Redis updates fail, SQL and Redis are reached only through private endpoints, and Azure Monitor tracks hit ratio and outbox depth.
  containers:
    - subscription: web-platform
      resource_group: {name: rg-redis-write-through, location: westeurope}
      vnets:
        - name: vnet-app
          cidr: 10.70.0.0/16
          subnets:
            - {name: snet-app-integration, cidr: 10.70.1.0/24}
            - {name: snet-functions, cidr: 10.70.2.0/24}
            - {name: snet-private-endpoints, cidr: 10.70.3.0/24}
  elements:
    - {tf: azurerm_linux_web_app, name: app-catalog-web, in: subnet:snet-app-integration}
    - {tf: azurerm_linux_function_app, name: func-write-through, in: subnet:snet-functions}
    - {tf: azurerm_linux_function_app, name: func-outbox-repair, in: subnet:snet-functions}
    - {tf: azurerm_redis_cache, name: redis-read-cache, in: resource_group:rg-redis-write-through}
    - {tf: azurerm_mssql_server, name: sql-system-of-record, in: resource_group:rg-redis-write-through}
    - {tf: azurerm_private_endpoint, name: pe-redis, in: subnet:snet-private-endpoints}
    - {tf: azurerm_private_endpoint, name: pe-sql, in: subnet:snet-private-endpoints}
    - {tf: azurerm_application_insights, name: appi-cache-telemetry, in: resource_group:rg-redis-write-through}
  actors: [client]
  flows:
    - {from: client, to: app-catalog-web, label: HTTPS read / write, step: 1}
    - {from: app-catalog-web, to: pe-redis, label: cache lookup (deterministic key), step: 2}
    - {from: pe-redis, to: redis-read-cache, label: Private Link}
    - {from: app-catalog-web, to: pe-sql, label: cache-miss read, step: 3}
    - {from: pe-sql, to: sql-system-of-record, label: Private Link}
    - {from: app-catalog-web, to: func-write-through, label: write request (idempotency key), step: 4}
    - {from: func-write-through, to: pe-sql, label: commit + outbox row, step: 5}
    - {from: func-write-through, to: pe-redis, label: set versioned key with TTL, step: 6}
    - {from: func-outbox-repair, to: pe-sql, label: read pending outbox entries}
    - {from: func-outbox-repair, to: pe-redis, label: idempotent repair}
    - {from: func-write-through, to: appi-cache-telemetry, label: traces, outbox metrics}

- slug: data-share-cross-organization
  title: Cross-organization data sharing with Azure Data Share
  category: data
  tags: [data-share, snapshot-sharing, in-place-sharing, data-lake-storage, synapse, azure-data-explorer, provider-consumer]
  source: https://learn.microsoft.com/en-us/azure/data-share/overview
  description: A data provider creates a share of datasets from Data Lake Storage, Blob Storage, Azure SQL Database or Azure Synapse Analytics, sets terms of use and a snapshot schedule, and invites consumers in other Azure subscriptions. Consumers accept the invitation and receive full or incremental snapshots into their own storage or SQL targets, or use in-place sharing for Azure Data Explorer where a symbolic link exposes live data without copying; providers can revoke access at any time.
  containers:
    - subscription: data-provider
      resource_group: {name: rg-share-provider, location: westeurope}
      groups:
        - {label: Provider sources}
    - subscription: data-consumer
      resource_group: {name: rg-share-consumer, location: northeurope}
      groups:
        - {label: Consumer targets}
  elements:
    - {tf: azurerm_data_share_account, name: dsa-provider, in: group:Provider sources}
    - {tf: azurerm_data_share, name: ds-pos-daily, in: group:Provider sources}
    - {tf: azurerm_storage_account, name: stprovider-lake, in: group:Provider sources}
    - {tf: azurerm_synapse_workspace, name: synw-provider-dw, in: group:Provider sources}
    - {tf: azurerm_kusto_cluster, name: adx-provider-live, in: group:Provider sources}
    - {tf: azurerm_data_share_account, name: dsa-consumer, in: group:Consumer targets}
    - {tf: azurerm_storage_account, name: stconsumer-lake, in: group:Consumer targets}
    - {tf: azurerm_mssql_server, name: sql-consumer-analytics, in: group:Consumer targets}
    - {tf: azurerm_kusto_cluster, name: adx-consumer-follower, in: group:Consumer targets}
  actors: [users]
  flows:
    - {from: stprovider-lake, to: ds-pos-daily, link: azurerm_data_share_dataset_data_lake_gen2, label: add ADLS Gen2 dataset, step: 1}
    - {from: synw-provider-dw, to: ds-pos-daily, label: add SQL dataset, step: 1}
    - {from: adx-provider-live, to: ds-pos-daily, link: azurerm_data_share_dataset_kusto_database, label: add Kusto database (in-place), step: 1}
