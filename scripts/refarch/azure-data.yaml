    - {from: dce-ingestion-pipeline, to: law-central, label: ingestion pipeline writes workspace tables, step: 1}
    - {from: dce-ingestion-pipeline, to: stlogarchive, label: export selected tables (hourly blobs), step: 2}
    - {from: dce-ingestion-pipeline, to: evh-am-containerlog, label: export selected tables (near real time), step: 2}
    - {from: evh-am-containerlog, to: adxdb-logs, link: azurerm_kusto_eventhub_data_connection, label: Event Hubs data connection, step: 3}
    - {from: stlogarchive, to: adxdb-logs, label: historical ingestion (LightIngest)}
