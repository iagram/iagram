    - {from: dsa-consumer, to: stconsumer-lake, label: scheduled snapshot (hourly / daily), step: 3}
    - {from: dsa-consumer, to: sql-consumer-analytics, label: snapshot into SQL target, step: 3}
    - {from: adx-provider-live, to: adx-consumer-follower, label: in-place share (symbolic link), step: 3}
