- slug: adf-medallion-landing-zone-baseline
  title: Azure Data Factory baseline architecture in an Azure landing zone
  category: data
  tags: [data-factory, self-hosted-integration-runtime, medallion, databricks, azure-sql, purview, private-link, landing-zone]
  source: https://learn.microsoft.com/en-us/azure/architecture/databases/architecture/azure-data-factory-on-azure-landing-zones-baseline
  description: Data Factory with a self-hosted integration runtime on Azure VMs ingests an on-premises finance system nightly into the bronze layer of Data Lake Storage, and Azure Databricks notebooks refine the data through bronze, silver and gold Delta Lake tables. The gold layer loads the conformed enterprise model into Azure SQL Database, Power BI serves dashboards from SQL and Databricks, and a monitor-and-govern layer of Azure DevOps, Microsoft Entra ID, Key Vault, Azure Monitor, Cost Management, Microsoft Purview and Site Recovery (protecting the SHIR VMs, reached over Private Link) surrounds the platform.
  containers:
    - datacenter: on-premises
    - subscription: data-landing-zone
      resource_group: {name: rg-adf-baseline, location: westeurope}
      groups:
        - {label: Ingest, at: [1, 1, 2, 1]}
        - {label: Process, at: [1, 2]}
        - {label: Store, at: [2, 2]}
        - {label: Serve, at: [1, 3, 2, 1]}
        - {label: Monitor and govern, at: [4, 1, 1, 3]}
      vnets:
        - name: vnet-data
          cidr: 10.20.0.0/16
          at: [3, 1, 1, 3]
          subnets:
            - {name: snet-shir, cidr: 10.20.1.0/24, at: [1, 1]}
            - {name: snet-private-endpoints, cidr: 10.20.2.0/24, at: [1, 2]}
  elements:
    - {tf: azurerm_data_factory, name: adf-finance, in: group:Ingest, at: [1, 1]}
    - {tf: azurerm_windows_virtual_machine, name: vm-shir-01, in: subnet:snet-shir, at: [1, 1]}
    - {tf: azurerm_databricks_workspace, name: dbw-finance, in: group:Process, at: [1, 1]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: lake-bronze, in: group:Store, at: [1, 1]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: lake-silver, in: group:Store, at: [1, 2]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: lake-gold, in: group:Store, at: [1, 3]}
    - {tf: azurerm_storage_account, name: stfinancelake, in: group:Store, at: [2, 1, 1, 3]}
