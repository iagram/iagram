    - {from: iot-vehicle-positions, to: evhns-location-events, label: message routing, step: 2}
    - {from: evhns-location-events, to: func-geocode-geofence, label: trigger, step: 3}
    - {from: func-geocode-geofence, to: maps-location-services, label: reverse geocode, geofence, route APIs, step: 3}
    - {from: evhns-location-events, to: adxdb-positions, link: azurerm_kusto_eventhub_data_connection, label: telemetry ingestion, step: 4}
    - {from: stgeojson-reference, to: adxdb-positions, label: GeoJSON polygons (external table)}
    - {from: adxdb-positions, to: fabric-rti-maps, label: KQL geo queries to Maps in Fabric / Power BI visual, step: 5}
