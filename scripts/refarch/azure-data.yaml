- slug: cosmos-db-postgresql-distributed
  title: Distributed PostgreSQL with Azure Cosmos DB for PostgreSQL (Citus)
  category: database
  tags: [cosmos-db-for-postgresql, citus, distributed-tables, sharding, pgbouncer, multi-tenant-saas, real-time-analytics, stream-analytics]
  source: https://learn.microsoft.com/en-us/azure/cosmos-db/postgresql/introduction
  description: Azure Cosmos DB for PostgreSQL runs PostgreSQL extended with the Citus extension so a cluster starts as a single node and transparently scales to a coordinator plus worker nodes by distributing tables, serving multi-tenant SaaS, real-time operational analytics and high-throughput transactional apps. The managed service adds high availability, read replicas, built-in pgBouncer, private endpoints and ingestion from Stream Analytics and Data Factory; Microsoft now recommends Elastic Clusters in Azure Database for PostgreSQL for new projects.
  containers:
    - subscription: saas-platform
      resource_group: {name: rg-citus-analytics, location: westeurope}
      vnets:
        - name: vnet-saas
          cidr: 10.60.0.0/16
          subnets:
            - {name: snet-app, cidr: 10.60.1.0/24}
            - {name: snet-private-endpoints, cidr: 10.60.2.0/24}
  elements:
    - {tf: azurerm_linux_web_app, name: app-tenant-api, in: subnet:snet-app}
    - {tf: azurerm_private_endpoint, name: pe-citus-coordinator, in: subnet:snet-private-endpoints}
    - {tf: azurerm_cosmosdb_postgresql_cluster, name: citus-multitenant, in: resource_group:rg-citus-analytics}
    - {tf: azurerm_eventhub_namespace, name: evhns-clickstream, in: resource_group:rg-citus-analytics}
    - {tf: azurerm_stream_analytics_job, name: asa-rollups, in: resource_group:rg-citus-analytics}
    - {tf: azurerm_data_factory, name: adf-batch-ingest, in: resource_group:rg-citus-analytics}
    - {tf: azurerm_key_vault, name: kv-db-credentials, in: resource_group:rg-citus-analytics}
    - {tf: azurerm_log_analytics_workspace, name: law-citus-metrics, in: resource_group:rg-citus-analytics}
