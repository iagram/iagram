# Azure reference architectures: data and analytics
# Format: see FORMAT.md. Provider: azure. One official Microsoft Learn source per entry.

- slug: databricks-medallion-analytics
  title: Modern analytics architecture with Azure Databricks (medallion)
  category: data
  tags: [databricks, delta-lake, medallion, data-lake-storage, event-hubs, mlflow, unity-catalog, power-bi]
  source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/azure-databricks-modern-analytics-architecture
  description: Azure Databricks ingests streaming data from Event Hubs with Lakeflow declarative pipelines while Data Factory lands batch data in Data Lake Storage, then organises Delta Lake tables into Bronze, Silver and Gold layers. MLflow tracks models served through Azure Machine Learning, Databricks SQL warehouses feed Power BI, and Unity Catalog, Microsoft Purview, Key Vault and Azure Monitor provide governance and operations.
  containers:
    - subscription: data-platform
      resource_group: {name: rg-databricks-analytics, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Lakehouse}
        - {label: Serve}
        - {label: Platform}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-stream-ingest, in: group:Ingest}
    - {tf: azurerm_data_factory, name: adf-batch-ingest, in: group:Ingest}
    - {tf: azurerm_storage_account, name: stdatalake, in: group:Lakehouse}
    - {tf: azurerm_databricks_workspace, name: dbw-medallion, in: group:Lakehouse}
    - {tf: azurerm_machine_learning_workspace, name: mlw-model-serving, in: group:Serve}
    - {tf: azurerm_kubernetes_cluster, name: aks-inference, in: group:Serve}
    - {tf: azurerm_purview_account, name: pview-catalog, in: group:Platform}
    - {tf: azurerm_key_vault, name: kv-secrets, in: group:Platform}
    - {tf: azurerm_log_analytics_workspace, name: law-platform, in: group:Platform}
  actors: [device, database, users]
  flows:
    - {from: device, to: evhns-stream-ingest, label: raw events, step: 1}
    - {from: evhns-stream-ingest, to: dbw-medallion, label: Lakeflow streaming pipeline, step: 2}
    - {from: database, to: adf-batch-ingest, label: batch extract, step: 1}
    - {from: adf-batch-ingest, to: stdatalake, label: raw batch load, step: 2}
    - {from: dbw-medallion, to: stdatalake, label: "Delta Lake: bronze / silver / gold", step: 3}
    - {from: dbw-medallion, to: mlw-model-serving, label: MLflow model registry, step: 4}
    - {from: mlw-model-serving, to: aks-inference, label: Kubernetes online endpoint, step: 5}
    - {from: dbw-medallion, to: users, label: SQL warehouse to Power BI (Direct Lake), step: 6}
    - {from: pview-catalog, to: stdatalake, label: scan, classify, lineage}
    - {from: dbw-medallion, to: kv-secrets, label: Key Vault-backed secret scope}
    - {from: dbw-medallion, to: law-platform, label: diagnostics}

- slug: databricks-stream-processing-cosmos
  title: Stream processing with Azure Databricks
  category: data
  tags: [databricks, event-hubs, structured-streaming, cosmos-db, fabric-mirroring, log-analytics]
  source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/data/stream-processing-databricks
  description: Two real-time streams (taxi rides and fares) are published to separate event hubs; an Azure Databricks Spark Structured Streaming job joins and enriches them with neighbourhood lookup data and computes windowed averages. Results are written to Azure Cosmos DB for NoSQL, mirrored into Microsoft Fabric for analytics, and Spark metrics and logs land in a Log Analytics workspace.
  containers:
    - subscription: streaming
      resource_group: {name: rg-stream-databricks, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Process}
        - {label: Store and analyze}
        - {label: Monitor}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-taxi, in: group:Ingest}
    - {tf: azurerm_eventhub, name: evh-taxi-ride, in: group:Ingest}
    - {tf: azurerm_eventhub, name: evh-taxi-fare, in: group:Ingest}
    - {tf: azurerm_databricks_workspace, name: dbw-stream-job, in: group:Process}
    - {tf: azurerm_storage_account, name: stdbfsroot, in: group:Process}
    - {tf: azurerm_cosmosdb_account, name: cosmos-taxi-results, in: group:Store and analyze}
    - {tf: azurerm_fabric_capacity, name: fabric-mirroring, in: group:Store and analyze}
    - {tf: azurerm_key_vault, name: kv-databricks-scope, in: group:Monitor}
    - {tf: azurerm_log_analytics_workspace, name: law-spark-metrics, in: group:Monitor}
  actors: [device, users]
  flows:
    - {from: device, to: evh-taxi-ride, label: ride events (JSON), step: 1}
    - {from: device, to: evh-taxi-fare, label: fare events (CSV), step: 1}
    - {from: evh-taxi-ride, to: dbw-stream-job, label: readStream (eventhubs), step: 2}
    - {from: evh-taxi-fare, to: dbw-stream-job, label: readStream (eventhubs), step: 2}
    - {from: stdbfsroot, to: dbw-stream-job, label: neighbourhood shapefile lookup}
    - {from: dbw-stream-job, to: cosmos-taxi-results, label: writeStream cosmos.oltp, step: 3}
    - {from: cosmos-taxi-results, to: fabric-mirroring, label: Fabric mirroring (no ETL), step: 4}
    - {from: fabric-mirroring, to: users, label: SQL endpoint / KQL / Power BI, step: 5}
    - {from: dbw-stream-job, to: kv-databricks-scope, label: secret scope}
    - {from: dbw-stream-job, to: law-spark-metrics, label: Dropwizard sink logs and metrics}

- slug: synapse-data-warehouse-adf
  title: Data warehousing and analytics with Azure Synapse and Data Factory
  category: data
  tags: [synapse, dedicated-sql-pool, data-factory, polybase, analysis-services, power-bi, data-lake-storage]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/data/data-warehouse
  description: Updates from on-premises SQL Server and Oracle, Azure SQL Database, Table Storage and Azure Cosmos DB are exported to a staging area in Data Lake Storage, then Data Factory incrementally loads and transforms them into Azure Synapse Analytics using PolyBase. An Azure Analysis Services tabular model is refreshed after each load and business analysts query it from Power BI, authenticated through Microsoft Entra ID.
  containers:
    - datacenter: on-premises
    - subscription: analytics
      resource_group: {name: rg-synapse-dw, location: westeurope}
      groups:
        - {label: Sources}
        - {label: Ingest}
        - {label: Warehouse}
        - {label: Serve}
  elements:
    - {tf: azurerm_mssql_server, name: sql-sales-source, in: group:Sources}
    - {tf: azurerm_cosmosdb_account, name: cosmos-web-events, in: group:Sources}
    - {tf: azurerm_storage_account, name: sttablestorage, in: group:Sources}
    - {tf: azurerm_storage_account, name: stdatalake-staging, in: group:Ingest}
    - {tf: azurerm_data_factory, name: adf-warehouse-load, in: group:Ingest}
    - {tf: azurerm_synapse_workspace, name: synw-enterprise, in: group:Warehouse}
    - {tf: azurerm_synapse_sql_pool, name: syndp-warehouse, in: group:Warehouse}
    - {tf: azurerm_analysis_services_server, name: asazure-semantic, in: group:Serve}
  actors: [datacenter, users]
  flows:
    - {from: datacenter, to: stdatalake-staging, label: SQL Server / Oracle exports, step: 1}
    - {from: sql-sales-source, to: stdatalake-staging, label: periodic export, step: 1}
    - {from: cosmos-web-events, to: stdatalake-staging, label: periodic export, step: 1}
    - {from: sttablestorage, to: stdatalake-staging, label: periodic export, step: 1}
    - {from: adf-warehouse-load, to: stdatalake-staging, label: read staged files, step: 2}
    - {from: adf-warehouse-load, to: syndp-warehouse, label: PolyBase incremental load, step: 2}
    - {from: syndp-warehouse, to: asazure-semantic, label: tabular model refresh, step: 3}
    - {from: users, to: asazure-semantic, label: Power BI (Entra ID auth), step: 4}

- slug: synapse-near-real-time-lakehouse-cdc
  title: Near real-time lakehouse processing with Azure Synapse Analytics
  category: data
  tags: [synapse, spark-pool, event-hubs, debezium, cdc, delta-lake, cosmos-db, ai-search, machine-learning]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/data/real-time-lakehouse-data-processing
  description: Debezium connectors capture row-level changes from OLTP databases and publish them to Event Hubs, which streams into Azure Synapse Spark pools or lands raw data in Data Lake Storage. Spark validates and writes Delta Lake tables, loads curated data into a dedicated SQL pool for Power BI, and denormalised documents into Azure Cosmos DB and Azure AI Search for low-latency APIs, while serverless SQL pools and Azure Machine Learning consume the validated zone.
  containers:
    - subscription: analytics
      resource_group: {name: rg-synapse-realtime, location: westeurope}
      groups:
        - {label: Change capture}
        - {label: Lake and processing}
        - {label: Serve}
  elements:
    - {tf: azurerm_mssql_server, name: sql-oltp-source, in: group:Change capture}
    - {tf: azurerm_container_app, name: ca-debezium-connect, in: group:Change capture}
    - {tf: azurerm_eventhub_namespace, name: evhns-cdc, in: group:Change capture}
    - {tf: azurerm_storage_account, name: stlakehouse, in: group:Lake and processing}
    - {tf: azurerm_synapse_workspace, name: synw-realtime, in: group:Lake and processing}
    - {tf: azurerm_synapse_spark_pool, name: synsp-streaming, in: group:Lake and processing}
    - {tf: azurerm_synapse_sql_pool, name: syndp-serving, in: group:Serve}
    - {tf: azurerm_cosmosdb_account, name: cosmos-api-store, in: group:Serve}
    - {tf: azurerm_search_service, name: srch-api-index, in: group:Serve}
    - {tf: azurerm_machine_learning_workspace, name: mlw-training, in: group:Serve}
  actors: [client, users]
  flows:
    - {from: sql-oltp-source, to: ca-debezium-connect, label: CDC log read, step: 1}
    - {from: ca-debezium-connect, to: evhns-cdc, label: change events (Kafka API), step: 2}
    - {from: evhns-cdc, to: synsp-streaming, label: structured streaming, step: 3}
    - {from: evhns-cdc, to: stlakehouse, label: Event Hubs Capture (raw zone), step: 3}
    - {from: synsp-streaming, to: stlakehouse, label: validated Delta Lake zone, step: 4}
    - {from: synsp-streaming, to: syndp-serving, label: curated load, step: 5}
    - {from: syndp-serving, to: users, label: Power BI dashboards, step: 6}
    - {from: synsp-streaming, to: cosmos-api-store, label: denormalised documents, step: 7}
    - {from: cosmos-api-store, to: srch-api-index, label: index for full-text search, step: 8}
    - {from: srch-api-index, to: client, label: low-latency API responses}
    - {from: stlakehouse, to: mlw-training, label: model training on validated data}

- slug: fabric-greenfield-lakehouse
  title: Greenfield lakehouse on Microsoft Fabric
  category: data
  tags: [fabric, onelake, lakehouse, medallion, eventstream, eventhouse, data-factory, power-bi, direct-lake]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/data/greenfield-lakehouse-fabric
  description: A Lambda-style design on Microsoft Fabric where Data Factory pipelines ingest batch data into bronze, silver and gold lakehouses refined by Spark notebooks and dataflows, and eventstreams ingest real-time data into eventhouses and the bronze lakehouse. Data is served through SQL analytics endpoints, notebooks, Power BI Direct Lake semantic models, Real-Time Intelligence dashboards and Fabric Activator triggers, with OneLake and Microsoft Purview as foundations.
  containers:
    - subscription: fabric-platform
      resource_group: {name: rg-fabric-lakehouse, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Fabric capacity}
        - {label: Governance}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-iot-events, in: group:Ingest}
    - {tf: azurerm_storage_account, name: stlanding-files, in: group:Ingest}
    - {tf: azurerm_data_factory, name: adf-batch-orchestration, in: group:Ingest}
    - {tf: azurerm_fabric_capacity, name: fabric-lakehouse-f64, in: group:Fabric capacity}
    - {tf: azurerm_purview_account, name: pview-lakehouse, in: group:Governance}
    - {tf: azurerm_key_vault, name: kv-fabric-connections, in: group:Governance}
  actors: [database, device, users]
  flows:
    - {from: database, to: adf-batch-orchestration, label: relational and file sources, step: 1}
    - {from: adf-batch-orchestration, to: stlanding-files, label: stage semi-structured files, step: 1}
    - {from: adf-batch-orchestration, to: fabric-lakehouse-f64, label: pipelines into bronze lakehouse, step: 2}
    - {from: device, to: evhns-iot-events, label: sensor streams, step: 3}
    - {from: evhns-iot-events, to: fabric-lakehouse-f64, label: eventstream to eventhouse and bronze, step: 4}
    - {from: fabric-lakehouse-f64, to: users, label: Power BI Direct Lake and RTI dashboards, step: 5}
    - {from: pview-lakehouse, to: fabric-lakehouse-f64, label: catalog, lineage, sensitivity labels}
    - {from: fabric-lakehouse-f64, to: kv-fabric-connections, label: connection credentials}

- slug: fabric-analytics-end-to-end
  title: Analytics end-to-end with Microsoft Fabric
  category: data
  tags: [fabric, onelake, mirroring, eventstream, eventhouse, data-warehouse, purview, machine-learning, power-bi]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/dataplate2e/data-platform-end-to-end
  description: OneLake is the single store for a Fabric platform that mirrors Azure SQL Database, Azure Databricks and Snowflake sources, ingests files with Data Factory pipelines and streams events into eventhouses through eventstreams. Lakehouses, warehouses and KQL databases serve Power BI, Fabric data agents and GraphQL APIs, while Azure Machine Learning shares the same Data Lake Storage via shortcuts and Microsoft Purview, Key Vault, Entra ID and Azure Policy govern the estate.
  containers:
    - subscription: data-platform
      resource_group: {name: rg-fabric-e2e, location: westeurope}
      groups:
        - {label: Sources}
        - {label: Ingest}
        - {label: Fabric}
        - {label: Enrich and govern}
  elements:
    - {tf: azurerm_mssql_server, name: sql-operational-db, in: group:Sources}
    - {tf: azurerm_databricks_workspace, name: dbw-unity-catalog, in: group:Sources}
    - {tf: azurerm_storage_account, name: stadls-shortcuts, in: group:Sources}
    - {tf: azurerm_eventhub_namespace, name: evhns-realtime, in: group:Ingest}
    - {tf: azurerm_fabric_capacity, name: fabric-onelake, in: group:Fabric}
    - {tf: azurerm_machine_learning_workspace, name: mlw-batch-endpoints, in: group:Enrich and govern}
    - {tf: azurerm_purview_account, name: pview-unified-catalog, in: group:Enrich and govern}
    - {tf: azurerm_key_vault, name: kv-gateway-credentials, in: group:Enrich and govern}
  actors: [saas, device, users]
  flows:
    - {from: sql-operational-db, to: fabric-onelake, label: mirroring (CDC to Delta), step: 1}
    - {from: dbw-unity-catalog, to: fabric-onelake, label: Databricks mirroring / shortcuts, step: 1}
    - {from: saas, to: fabric-onelake, label: Data Factory pipelines and Dataflow Gen2, step: 2}
    - {from: stadls-shortcuts, to: fabric-onelake, label: OneLake shortcuts (zero copy), step: 2}
    - {from: device, to: evhns-realtime, label: telemetry, step: 3}
    - {from: evhns-realtime, to: fabric-onelake, label: eventstream to eventhouse, step: 4}
    - {from: fabric-onelake, to: mlw-batch-endpoints, label: shared Data Lake Storage for training}
    - {from: fabric-onelake, to: users, label: Power BI, data agents, GraphQL API, step: 5}
    - {from: pview-unified-catalog, to: fabric-onelake, label: scan, lineage, sensitivity labels}
    - {from: fabric-onelake, to: kv-gateway-credentials, label: Key Vault references}

- slug: adf-medallion-landing-zone-baseline
  title: Azure Data Factory baseline architecture in an Azure landing zone
  category: data
  tags: [data-factory, self-hosted-integration-runtime, medallion, databricks, azure-sql, purview, private-link, landing-zone]
  source: https://learn.microsoft.com/en-us/azure/architecture/databases/architecture/azure-data-factory-on-azure-landing-zones-baseline
  description: Data Factory with a self-hosted integration runtime on Azure VMs ingests an on-premises finance system nightly into Data Lake Storage and orchestrates Azure Databricks notebooks that build bronze, silver and gold Delta Lake tables. Azure SQL Database hosts the conformed enterprise model for Power BI, Microsoft Purview catalogs the platform, Key Vault and Private Link secure access, and Site Recovery protects the SHIR VMs.
  containers:
    - datacenter: on-premises
    - subscription: data-landing-zone
      resource_group: {name: rg-adf-baseline, location: westeurope}
      vnets:
        - name: vnet-data
          cidr: 10.20.0.0/16
          subnets:
            - {name: snet-shir, cidr: 10.20.1.0/24}
            - {name: snet-private-endpoints, cidr: 10.20.2.0/24}
            - {name: snet-databricks-public, cidr: 10.20.3.0/24}
            - {name: snet-databricks-private, cidr: 10.20.4.0/24}
  elements:
    - {tf: azurerm_data_factory, name: adf-finance, in: resource_group:rg-adf-baseline}
    - {tf: azurerm_windows_virtual_machine, name: vm-shir-01, in: subnet:snet-shir}
    - {tf: azurerm_storage_account, name: stfinancelake, in: resource_group:rg-adf-baseline}
    - {tf: azurerm_private_endpoint, name: pe-datalake, in: subnet:snet-private-endpoints}
    - {tf: azurerm_databricks_workspace, name: dbw-finance, in: subnet:snet-databricks-private}
    - {tf: azurerm_mssql_server, name: sql-enterprise-model, in: resource_group:rg-adf-baseline}
    - {tf: azurerm_purview_account, name: pview-finance, in: resource_group:rg-adf-baseline}
    - {tf: azurerm_key_vault, name: kv-adf-secrets, in: resource_group:rg-adf-baseline}
    - {tf: azurerm_recovery_services_vault, name: rsv-shir-protection, in: resource_group:rg-adf-baseline}
    - {tf: azurerm_log_analytics_workspace, name: law-data-platform, in: resource_group:rg-adf-baseline}
  actors: [datacenter, users]
  flows:
    - {from: datacenter, to: vm-shir-01, label: nightly batch over private connectivity, step: 1}
    - {from: vm-shir-01, to: adf-finance, label: self-hosted integration runtime, step: 1}
    - {from: adf-finance, to: pe-datalake, label: copy to bronze via private endpoint, step: 2}
    - {from: pe-datalake, to: stfinancelake, label: Private Link}
    - {from: adf-finance, to: dbw-finance, label: orchestrate notebooks, step: 3}
    - {from: dbw-finance, to: stfinancelake, label: silver / gold Delta tables, step: 3}
    - {from: adf-finance, to: sql-enterprise-model, label: load conformed hierarchies, step: 4}
    - {from: sql-enterprise-model, to: users, label: Power BI management dashboards, step: 5}
    - {from: pview-finance, to: stfinancelake, label: catalog and lineage}
    - {from: adf-finance, to: kv-adf-secrets, label: linked service secrets}
    - {from: rsv-shir-protection, to: vm-shir-01, label: Site Recovery replication}
    - {from: adf-finance, to: law-data-platform, label: pipeline diagnostics}

- slug: stream-analytics-taxi-pipeline
  title: Stream processing with Azure Stream Analytics
  category: data
  tags: [stream-analytics, event-hubs, cosmos-db, hopping-window, temporal-join, power-bi, azure-monitor]
  source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/data/stream-processing-stream-analytics
  description: Two event hubs ingest taxi ride and fare streams partitioned by the same key so a Stream Analytics job can correlate them with a temporal join and compute average tip per mile over a five-minute hopping window. Results are written as JSON documents to Azure Cosmos DB for Power BI analysis, Azure Monitor tracks streaming units and throttling, and a network security perimeter restricts access to Event Hubs.
  containers:
    - subscription: streaming
      resource_group: {name: rg-stream-analytics, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Process}
        - {label: Store and report}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-taxi-streams, in: group:Ingest}
    - {tf: azurerm_eventhub, name: evh-taxi-ride, in: group:Ingest}
    - {tf: azurerm_eventhub, name: evh-taxi-fare, in: group:Ingest}
    - {tf: azurerm_stream_analytics_job, name: asa-tip-per-mile, in: group:Process}
    - {tf: azurerm_cosmosdb_account, name: cosmos-taxi-drain, in: group:Store and report}
    - {tf: azurerm_log_analytics_workspace, name: law-streaming, in: group:Store and report}
    - {tf: azurerm_monitor_action_group, name: ag-streaming-alerts, in: group:Store and report}
  actors: [device, users]
  flows:
    - {from: device, to: evh-taxi-ride, label: ride data (partition key medallion), step: 1}
    - {from: device, to: evh-taxi-fare, label: fare data (same partition key), step: 1}
    - {from: evh-taxi-ride, to: asa-tip-per-mile, label: input TaxiRide, step: 2}
    - {from: evh-taxi-fare, to: asa-tip-per-mile, label: input TaxiFare, step: 2}
    - {from: asa-tip-per-mile, to: cosmos-taxi-drain, label: hopping-window output (JSON), step: 3}
    - {from: cosmos-taxi-drain, to: users, label: Power BI historical analysis, step: 4}
    - {from: asa-tip-per-mile, to: law-streaming, label: SU utilisation and throttling metrics}
    - {from: law-streaming, to: ag-streaming-alerts, label: scale-out alerts}

- slug: adx-real-time-analytics-platform
  title: Real-time analytics with Azure Data Explorer
  category: data
  tags: [azure-data-explorer, kusto, kql, event-hubs, event-grid, streaming-ingestion, power-bi, grafana]
  source: https://learn.microsoft.com/en-us/azure/data-explorer/data-explorer-overview
  description: An Azure Data Explorer cluster hosts databases and tables of automatically indexed, partitioned extents; events arrive by queued or streaming ingestion through Event Hubs and blob-arrival Event Grid notifications, while Data Factory copies historical batches. Analysts run KQL time series, anomaly detection and geospatial queries in the web UI, dashboards, Power BI and Grafana, and continuous export writes Parquet back to Data Lake Storage.
  containers:
    - subscription: analytics
      resource_group: {name: rg-adx-realtime, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Analytics engine}
        - {label: Consume}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-app-telemetry, in: group:Ingest}
    - {tf: azurerm_storage_account, name: stlanding-blobs, in: group:Ingest}
    - {tf: azurerm_eventgrid_system_topic, name: egst-blob-created, in: group:Ingest}
    - {tf: azurerm_data_factory, name: adf-historical-load, in: group:Ingest}
    - {tf: azurerm_kusto_cluster, name: adx-analytics, in: group:Analytics engine}
    - {tf: azurerm_kusto_database, name: adxdb-telemetry, in: group:Analytics engine}
    - {tf: azurerm_storage_account, name: stcontinuous-export, in: group:Consume}
    - {tf: azurerm_linux_web_app, name: app-grafana-dashboards, in: group:Consume}
  actors: [device, server, users]
  flows:
    - {from: device, to: evhns-app-telemetry, label: events and logs, step: 1}
    - {from: evhns-app-telemetry, to: adxdb-telemetry, link: azurerm_kusto_eventhub_data_connection, label: streaming / queued ingestion, step: 2}
    - {from: server, to: stlanding-blobs, label: batch files, step: 1}
    - {from: stlanding-blobs, to: egst-blob-created, label: BlobCreated event}
    - {from: egst-blob-created, to: adxdb-telemetry, link: azurerm_kusto_eventgrid_data_connection, label: Event Grid ingestion, step: 2}
    - {from: adf-historical-load, to: adxdb-telemetry, label: copy activity (historical), step: 2}
    - {from: adxdb-telemetry, to: stcontinuous-export, label: continuous export (Parquet), step: 3}
