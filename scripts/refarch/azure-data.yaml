      vnets:
        - name: vnet-sqlmi
          cidr: 10.50.0.0/16
          subnets:
            - {name: snet-managed-instance, cidr: 10.50.1.0/24}
            - {name: snet-dms, cidr: 10.50.2.0/24}
            - {name: GatewaySubnet, cidr: 10.50.255.0/27}
  elements:
    - {tf: azurerm_virtual_network_gateway, name: vpngw-hybrid, in: subnet:GatewaySubnet}
    - {tf: azurerm_mssql_managed_instance, name: sqlmi-prod-bc, in: subnet:snet-managed-instance}
    - {tf: azurerm_database_migration_service, name: dms-sqlserver, in: subnet:snet-dms}
    - {tf: azurerm_storage_account, name: stbackups-lrs, in: resource_group:rg-sqlmi-migration}
    - {tf: azurerm_key_vault, name: kv-tde-certificates, in: resource_group:rg-sqlmi-migration}
    - {tf: azurerm_log_analytics_workspace, name: law-sql-insights, in: resource_group:rg-sqlmi-migration}
