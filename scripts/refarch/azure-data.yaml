    - {tf: azurerm_synapse_workspace, name: synw-link, in: group:Analytical}
    - {tf: azurerm_synapse_spark_pool, name: synsp-analytics, in: group:Analytical}
    - {tf: azurerm_storage_account, name: stsynapse-primary, in: group:Analytical}
    - {tf: azurerm_private_endpoint, name: pe-analytical-store, in: group:Security}
    - {tf: azurerm_key_vault, name: kv-cmk, in: group:Security}
  actors: [users, client]
  flows:
    - {from: client, to: app-orders-api, label: HTTPS, step: 1}
    - {from: app-orders-api, to: cosmos-orders-htap, label: transactional writes (row store), step: 2}
    - {from: cosmos-orders-htap, to: cosmos-orders-htap, label: auto-sync to analytical column store, step: 3}
    - {from: synsp-analytics, to: pe-analytical-store, label: Spark reads analytical store, step: 4}
    - {from: pe-analytical-store, to: cosmos-orders-htap, label: managed private endpoint}
    - {from: synw-link, to: cosmos-orders-htap, label: serverless SQL OPENROWSET, step: 4}
