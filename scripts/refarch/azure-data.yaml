    - {from: datacenter, to: sqlmi-prod-bc, label: Managed Instance link (distributed AG), step: 2}
    - {from: datacenter, to: stbackups-lrs, label: full, differential and log backups, step: 2}
    - {from: stbackups-lrs, to: sqlmi-prod-bc, label: Log Replay Service / native restore, step: 3}
    - {from: dms-sqlserver, to: sqlmi-prod-bc, label: logins, SQL Agent jobs, SSIS packages, step: 4}
