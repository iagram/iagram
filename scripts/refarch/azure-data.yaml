# Azure reference architectures: data and analytics
# Format: see FORMAT.md. Provider: azure. One official Microsoft Learn source per entry.

- slug: databricks-medallion-analytics
  title: Modern analytics architecture with Azure Databricks (medallion)
  category: data
  tags: [databricks, delta-lake, medallion, data-lake-storage, event-hubs, mlflow, unity-catalog, power-bi]
  source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/azure-databricks-modern-analytics-architecture
  description: Azure Databricks ingests streaming data from Event Hubs with Lakeflow declarative pipelines while Fabric Data Factory lands batch data in Data Lake Storage, then Apache Spark organises Delta Lake tables into Bronze, Silver and Gold layers. MLflow hands models to Azure Machine Learning, Databricks SQL warehouses query the gold layer for Power BI, the gold tables are shared with Microsoft Fabric, and Unity Catalog and Microsoft Purview govern the estate on a platform of Microsoft Entra ID, Cost Management, Key Vault, Azure Monitor, Azure DevOps and GitHub.
  containers:
    - subscription: data-platform
      resource_group: {name: rg-databricks-analytics, location: westeurope}
      groups:
        - {label: Sources, at: [1, 1, 2, 1]}
        - {label: Process, at: [1, 2]}
        - {label: Store, at: [2, 2]}
        - {label: Serve, at: [1, 3, 2, 1]}
        - {label: Discover and govern, at: [3, 1, 1, 3]}
        - {label: Platform, at: [4, 1, 1, 3]}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-stream-ingest, in: group:Sources, at: [1, 1]}
    - {tf: azurerm_data_factory, name: adf-batch-ingest, in: group:Sources, at: [2, 1]}
    - {tf: azurerm_databricks_workspace, name: dbw-medallion, in: group:Process, at: [1, 1]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: lake-bronze, in: group:Store, at: [1, 1]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: lake-silver, in: group:Store, at: [1, 2]}
    - {tf: azurerm_storage_data_lake_gen2_filesystem, name: lake-gold, in: group:Store, at: [1, 3]}
    - {tf: azurerm_storage_account, name: stdatalake, in: group:Store, at: [2, 1, 1, 3]}
    - {tf: azurerm_machine_learning_workspace, name: mlw-model-serving, in: group:Serve, at: [1, 1]}
    - {tf: azurerm_powerbi_embedded, name: pbi-analytics-reports, in: group:Serve, at: [2, 1]}
    - {tf: azurerm_fabric_capacity, name: fabric-onelake, in: group:Serve, at: [3, 1]}
    - {tf: azurerm_databricks_access_connector, name: unity-catalog-access-connector, in: group:Discover and govern, at: [1, 1]}
    - {tf: azurerm_purview_account, name: pview-catalog, in: group:Discover and govern, at: [1, 2]}
    - {tf: azurerm_key_vault, name: kv-secrets, in: group:Platform, at: [1, 1]}
    - {tf: azurerm_log_analytics_workspace, name: law-platform, in: group:Platform, at: [1, 2]}
  actors:
    - {type: device, at: [1, 1]}
    - {type: database, at: [2, 1]}
    - {type: idp, name: Microsoft Entra ID, at: [3, 2]}
    - {type: saas, name: Microsoft Cost Management, at: [3, 3]}
    - {type: saas, name: Azure DevOps, at: [3, 4]}
    - {type: saas, name: GitHub, at: [3, 5]}
  flows:
    - {from: device, to: evhns-stream-ingest, label: raw events}
    - {from: database, to: adf-batch-ingest, label: batch extract}
    - {from: evhns-stream-ingest, to: dbw-medallion, label: Lakeflow streaming pipeline, step: 1}
    - {from: adf-batch-ingest, to: lake-bronze, label: batch load into bronze, step: 2}
    - {from: dbw-medallion, to: lake-bronze, label: Apache Spark reads and writes bronze, step: 3}
    - {from: dbw-medallion, to: lake-silver, label: Apache Spark cleanses into silver, step: 4}
    - {from: lake-bronze, to: lake-silver, label: Delta Lake}
    - {from: lake-silver, to: lake-gold, label: Delta Lake}
    - {from: dbw-medallion, to: mlw-model-serving, label: MLflow models to Azure Machine Learning, step: 5}
    - {from: lake-gold, to: dbw-medallion, label: Databricks SQL warehouses query gold, step: 6}
    - {from: lake-gold, to: fabric-onelake, label: gold tables shared with Microsoft Fabric, step: 7}
    - {from: dbw-medallion, to: pbi-analytics-reports, label: SQL warehouse to Power BI, step: 8}
    - {from: unity-catalog-access-connector, to: stdatalake, label: Unity Catalog governs the lake, step: 9}
    - {from: pview-catalog, to: stdatalake, label: scan, classify, lineage}
    - {from: dbw-medallion, to: kv-secrets, label: Key Vault-backed secret scope}
    - {from: dbw-medallion, to: law-platform, label: diagnostics to Azure Monitor}
    - {from: Microsoft Entra ID, to: dbw-medallion, label: single sign-on and SCIM provisioning}
    - {from: Microsoft Cost Management, to: dbw-medallion, label: cluster cost monitoring}
    - {from: Azure DevOps, to: dbw-medallion, label: CI/CD pipelines}
    - {from: GitHub, to: dbw-medallion, label: Git folders for notebooks}
- slug: databricks-stream-processing-cosmos
  title: Stream processing with Azure Databricks
  category: data
  tags: [databricks, event-hubs, structured-streaming, cosmos-db, fabric-mirroring, log-analytics]
  source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/data/stream-processing-databricks
  description: Two real-time streams (taxi rides and fares) are published to separate event hubs; an Azure Databricks Spark Structured Streaming job joins and enriches them with neighbourhood lookup data and computes windowed averages. Results are written to Azure Cosmos DB for NoSQL, mirrored into Microsoft Fabric for analytics, and Spark metrics and logs land in a Log Analytics workspace.
  containers:
    - subscription: streaming
      resource_group: {name: rg-stream-databricks, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Process}
        - {label: Store and analyze}
        - {label: Monitor}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-taxi, in: group:Ingest}
    - {tf: azurerm_eventhub, name: evh-taxi-ride, in: group:Ingest}
    - {tf: azurerm_eventhub, name: evh-taxi-fare, in: group:Ingest}
    - {tf: azurerm_databricks_workspace, name: dbw-stream-job, in: group:Process}
    - {tf: azurerm_storage_account, name: stdbfsroot, in: group:Process}
    - {tf: azurerm_cosmosdb_account, name: cosmos-taxi-results, in: group:Store and analyze}
    - {tf: azurerm_fabric_capacity, name: fabric-mirroring, in: group:Store and analyze}
    - {tf: azurerm_key_vault, name: kv-databricks-scope, in: group:Monitor}
    - {tf: azurerm_log_analytics_workspace, name: law-spark-metrics, in: group:Monitor}
  actors: [device, users]
  flows:
    - {from: device, to: evh-taxi-ride, label: ride events (JSON), step: 1}
    - {from: device, to: evh-taxi-fare, label: fare events (CSV), step: 1}
    - {from: evh-taxi-ride, to: dbw-stream-job, label: readStream (eventhubs), step: 2}
    - {from: evh-taxi-fare, to: dbw-stream-job, label: readStream (eventhubs), step: 2}
    - {from: stdbfsroot, to: dbw-stream-job, label: neighbourhood shapefile lookup}
    - {from: dbw-stream-job, to: cosmos-taxi-results, label: writeStream cosmos.oltp, step: 3}
    - {from: cosmos-taxi-results, to: fabric-mirroring, label: Fabric mirroring (no ETL), step: 4}
    - {from: fabric-mirroring, to: users, label: SQL endpoint / KQL / Power BI, step: 5}
    - {from: dbw-stream-job, to: kv-databricks-scope, label: secret scope}
    - {from: dbw-stream-job, to: law-spark-metrics, label: Dropwizard sink logs and metrics}

- slug: synapse-data-warehouse-adf
  title: Data warehousing and analytics with Azure Synapse and Data Factory
  category: data
  tags: [synapse, dedicated-sql-pool, data-factory, polybase, analysis-services, power-bi, data-lake-storage]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/data/data-warehouse
  description: Updates from on-premises SQL Server and other relational databases, Azure SQL Database, Table Storage and Azure Cosmos DB are exported to a staging area in Data Lake Storage, then Data Factory incrementally loads and transforms them into an Azure Synapse Analytics dedicated SQL pool using PolyBase. An Azure Analysis Services tabular model is refreshed after each load and business analysts query it from Power BI, authenticated through Microsoft Entra ID.
  containers:
    - datacenter: on-premises
    - subscription: analytics
      resource_group: {name: rg-synapse-dw, location: westeurope}
      groups:
        - {label: Sources, at: [1, 1]}
        - {label: Ingest, at: [1, 2]}
        - {label: Warehouse, at: [1, 3]}
        - {label: Serve, at: [1, 4]}
  elements:
    - {tf: azurerm_mssql_server, name: sql-sales-source, in: group:Sources, at: [1, 1]}
    - {tf: azurerm_storage_account, name: sttablestorage, in: group:Sources, at: [2, 1]}
    - {tf: azurerm_cosmosdb_account, name: cosmos-web-events, in: group:Sources, at: [3, 1]}
    - {tf: azurerm_storage_account, name: stdatalake-staging, in: group:Ingest, at: [1, 1]}
    - {tf: azurerm_data_factory, name: adf-warehouse-load, in: group:Ingest, at: [2, 1]}
    - {tf: azurerm_synapse_sql_pool, name: syndp-warehouse, in: group:Warehouse, at: [1, 1]}
    - {tf: azurerm_analysis_services_server, name: asazure-semantic, in: group:Serve, at: [1, 1]}
    - {tf: azurerm_powerbi_embedded, name: pbi-reports, in: group:Serve, at: [2, 1]}
  actors:
    - datacenter
    - {type: database, name: other relational databases, at: [2, 1]}
    - {type: users, at: [1, 3]}
    - {type: idp, name: Microsoft Entra ID, at: [2, 3]}
  flows:
    - {from: datacenter, to: stdatalake-staging, label: SQL Server (on-premises) exports, step: 1}
    - {from: other relational databases, to: stdatalake-staging, label: Oracle and other on-premises exports, step: 1}
    - {from: sql-sales-source, to: stdatalake-staging, label: periodic export, step: 1}
    - {from: sttablestorage, to: stdatalake-staging, label: periodic export, step: 1}
    - {from: cosmos-web-events, to: stdatalake-staging, label: periodic export, step: 1}
    - {from: adf-warehouse-load, to: stdatalake-staging, label: orchestrate staging}
    - {from: stdatalake-staging, to: syndp-warehouse, label: PolyBase incremental load, step: 2}
    - {from: adf-warehouse-load, to: syndp-warehouse, label: orchestrate load and transforms}
    - {from: syndp-warehouse, to: asazure-semantic, label: tabular model refresh, step: 3}
    - {from: pbi-reports, to: asazure-semantic, label: live connection to the tabular model, step: 4}
    - {from: users, to: pbi-reports, label: business analysts}
    - {from: Microsoft Entra ID, to: asazure-semantic, label: authentication}
- slug: synapse-near-real-time-lakehouse-cdc
  title: Near real-time lakehouse processing with Azure Synapse Analytics
  category: data
  tags: [synapse, spark-pool, event-hubs, debezium, cdc, delta-lake, cosmos-db, ai-search, machine-learning]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/data/real-time-lakehouse-data-processing
  description: Debezium connectors capture row-level changes from OLTP databases and publish them to Event Hubs, which streams into Azure Synapse Spark pools or lands raw data in Data Lake Storage. Spark validates and writes Delta Lake tables, loads curated data into a dedicated SQL pool for Power BI, and denormalised documents into Azure Cosmos DB and Azure AI Search for low-latency APIs, while serverless SQL pools and Azure Machine Learning consume the validated zone.
  containers:
    - subscription: analytics
      resource_group: {name: rg-synapse-realtime, location: westeurope}
      groups:
        - {label: Change capture}
        - {label: Lake and processing}
        - {label: Serve}
  elements:
    - {tf: azurerm_mssql_server, name: sql-oltp-source, in: group:Change capture}
    - {tf: azurerm_container_app, name: ca-debezium-connect, in: group:Change capture}
    - {tf: azurerm_eventhub_namespace, name: evhns-cdc, in: group:Change capture}
    - {tf: azurerm_storage_account, name: stlakehouse, in: group:Lake and processing}
    - {tf: azurerm_synapse_workspace, name: synw-realtime, in: group:Lake and processing}
    - {tf: azurerm_synapse_spark_pool, name: synsp-streaming, in: group:Lake and processing}
    - {tf: azurerm_synapse_sql_pool, name: syndp-serving, in: group:Serve}
    - {tf: azurerm_cosmosdb_account, name: cosmos-api-store, in: group:Serve}
    - {tf: azurerm_search_service, name: srch-api-index, in: group:Serve}
    - {tf: azurerm_machine_learning_workspace, name: mlw-training, in: group:Serve}
  actors: [client, users]
  flows:
    - {from: sql-oltp-source, to: ca-debezium-connect, label: CDC log read, step: 1}
    - {from: ca-debezium-connect, to: evhns-cdc, label: change events (Kafka API), step: 2}
    - {from: evhns-cdc, to: synsp-streaming, label: structured streaming, step: 3}
    - {from: evhns-cdc, to: stlakehouse, label: Event Hubs Capture (raw zone), step: 3}
    - {from: synsp-streaming, to: stlakehouse, label: validated Delta Lake zone, step: 4}
    - {from: synsp-streaming, to: syndp-serving, label: curated load, step: 5}
    - {from: syndp-serving, to: users, label: Power BI dashboards, step: 6}
    - {from: synsp-streaming, to: cosmos-api-store, label: denormalised documents, step: 7}
    - {from: cosmos-api-store, to: srch-api-index, label: index for full-text search, step: 8}
    - {from: srch-api-index, to: client, label: low-latency API responses}
    - {from: stlakehouse, to: mlw-training, label: model training on validated data}

- slug: fabric-greenfield-lakehouse
  title: Greenfield lakehouse on Microsoft Fabric
  category: data
  tags: [fabric, onelake, lakehouse, medallion, eventstream, eventhouse, data-factory, power-bi, direct-lake]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/data/greenfield-lakehouse-fabric
  description: A Lambda-style design on Microsoft Fabric where Data Factory pipelines ingest batch data into bronze, silver and gold lakehouses refined by Spark notebooks and dataflows, and eventstreams ingest real-time data into eventhouses and the bronze lakehouse. Data is served through SQL analytics endpoints, notebooks, Power BI Direct Lake semantic models, Real-Time Intelligence dashboards and Fabric Activator triggers, with OneLake and Microsoft Purview as foundations.
  containers:
    - subscription: fabric-platform
      resource_group: {name: rg-fabric-lakehouse, location: westeurope}
      groups:
        - {label: Ingest}
        - {label: Fabric capacity}
        - {label: Governance}
  elements:
    - {tf: azurerm_eventhub_namespace, name: evhns-iot-events, in: group:Ingest}
    - {tf: azurerm_storage_account, name: stlanding-files, in: group:Ingest}
    - {tf: azurerm_data_factory, name: adf-batch-orchestration, in: group:Ingest}
    - {tf: azurerm_fabric_capacity, name: fabric-lakehouse-f64, in: group:Fabric capacity}
    - {tf: azurerm_purview_account, name: pview-lakehouse, in: group:Governance}
    - {tf: azurerm_key_vault, name: kv-fabric-connections, in: group:Governance}
  actors: [database, device, users]
  flows:
    - {from: database, to: adf-batch-orchestration, label: relational and file sources, step: 1}
    - {from: adf-batch-orchestration, to: stlanding-files, label: stage semi-structured files, step: 1}
    - {from: adf-batch-orchestration, to: fabric-lakehouse-f64, label: pipelines into bronze lakehouse, step: 2}
    - {from: device, to: evhns-iot-events, label: sensor streams, step: 3}
    - {from: evhns-iot-events, to: fabric-lakehouse-f64, label: eventstream to eventhouse and bronze, step: 4}
    - {from: fabric-lakehouse-f64, to: users, label: Power BI Direct Lake and RTI dashboards, step: 5}
    - {from: pview-lakehouse, to: fabric-lakehouse-f64, label: catalog, lineage, sensitivity labels}
    - {from: fabric-lakehouse-f64, to: kv-fabric-connections, label: connection credentials}

- slug: fabric-analytics-end-to-end
  title: Analytics end-to-end with Microsoft Fabric
  category: data
  tags: [fabric, onelake, mirroring, eventstream, eventhouse, data-warehouse, purview, machine-learning, power-bi]
  source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/dataplate2e/data-platform-end-to-end
  description: OneLake is the single store for a Fabric provider tenant that mirrors Azure SQL Database, Azure Cosmos DB, Azure Database for PostgreSQL, Azure Databricks and Snowflake sources, ingests on-premises, AWS and Google Cloud data with Data Factory pipelines and streams IoT Hub and Event Hubs events into eventhouses through eventstreams. Lakehouses, warehouses and eventhouses serve Power BI, data agents and a consumer tenant, Data Lake Storage and Blob storage are attached as zero-copy shortcuts, and Microsoft Purview, Key Vault, Microsoft Entra ID, Cost Management and GitHub govern the platform.
  containers:
    - {datacenter: on-premises, at: [1, 1]}
    - subscription: data-platform
      resource_group: {name: rg-fabric-e2e, location: westeurope}
      groups:
        - {label: Sources, at: [1, 1]}
        - {label: Streaming data, at: [2, 1]}
        - {label: Ingest, at: [1, 2, 2, 1]}
        - {label: Fabric, at: [1, 3, 2, 1]}
        - {label: Serve, at: [1, 4, 2, 1]}
        - {label: Shortcuts, at: [3, 1, 1, 2]}
        - {label: Enrich and govern, at: [3, 3, 1, 2]}
  elements:
    - {tf: azurerm_mssql_server, name: sql-operational-db, in: group:Sources, at: [1, 1]}
    - {tf: azurerm_cosmosdb_account, name: cosmos-operational, in: group:Sources, at: [1, 2]}
    - {tf: azurerm_postgresql_flexible_server, name: pg-operational, in: group:Sources, at: [2, 1]}
    - {tf: azurerm_databricks_workspace, name: dbw-unity-catalog, in: group:Sources, at: [2, 2]}
    - {tf: azurerm_iothub, name: iot-telemetry, in: group:Streaming data, at: [1, 1]}
    - {tf: azurerm_eventhub_namespace, name: evhns-realtime, in: group:Streaming data, at: [1, 2]}
    - {tf: azurerm_data_factory, name: adf-pipelines, in: group:Ingest, at: [1, 1]}
    - {tf: azurerm_fabric_capacity, name: fabric-onelake, in: group:Fabric, at: [1, 1]}
    - {tf: azurerm_powerbi_embedded, name: pbi-reports, in: group:Serve, at: [1, 1]}
    - {tf: azurerm_storage_account, name: stadls-shortcuts, in: group:Shortcuts, at: [1, 1]}
    - {tf: azurerm_storage_account, name: stblob-shortcuts, in: group:Shortcuts, at: [1, 2]}
    - {tf: azurerm_purview_account, name: pview-unified-catalog, in: group:Enrich and govern, at: [1, 1]}
    - {tf: azurerm_key_vault, name: kv-gateway-credentials, in: group:Enrich and govern, at: [1, 2]}
  actors:
    - datacenter
    - {type: saas, name: Snowflake, at: [2, 1]}
    - {type: saas, name: Amazon Web Services, at: [3, 1]}
    - {type: saas, name: Google Cloud, at: [4, 1]}
    - {type: users, at: [1, 3]}
    - {type: saas, name: consumer tenant OneLake, at: [2, 3]}
    - {type: idp, name: Microsoft Entra ID, at: [5, 1]}
    - {type: saas, name: Microsoft Cost Management, at: [5, 2]}
    - {type: saas, name: GitHub, at: [5, 3]}
  flows:
    - {from: sql-operational-db, to: fabric-onelake, label: mirroring (CDC to Delta), step: 1}
    - {from: cosmos-operational, to: fabric-onelake, label: mirroring, step: 1}
    - {from: pg-operational, to: fabric-onelake, label: mirroring, step: 1}
    - {from: dbw-unity-catalog, to: fabric-onelake, label: Databricks mirroring / shortcuts, step: 1}
    - {from: Snowflake, to: fabric-onelake, label: mirroring, step: 1}
    - {from: datacenter, to: adf-pipelines, label: on-premises structured and semistructured data, step: 2}
    - {from: Amazon Web Services, to: adf-pipelines, label: AWS sources, step: 2}
    - {from: Google Cloud, to: adf-pipelines, label: Google Cloud sources, step: 2}
    - {from: adf-pipelines, to: fabric-onelake, label: Data Factory pipelines and notebooks to lakehouse and warehouse, step: 2}
    - {from: iot-telemetry, to: fabric-onelake, label: eventstream to eventhouse, step: 3}
    - {from: evhns-realtime, to: fabric-onelake, label: eventstream to eventhouse, step: 3}
    - {from: stadls-shortcuts, to: fabric-onelake, label: OneLake shortcut (zero copy), step: 4}
    - {from: stblob-shortcuts, to: fabric-onelake, label: OneLake shortcut (zero copy), step: 4}
    - {from: Amazon Web Services, to: fabric-onelake, label: Amazon S3 shortcut}
    - {from: Google Cloud, to: fabric-onelake, label: Google Cloud Storage shortcut}
    - {from: fabric-onelake, to: pbi-reports, label: Power BI Direct Lake, step: 5}
    - {from: pbi-reports, to: users, label: reports, data agents, GraphQL API, step: 5}
