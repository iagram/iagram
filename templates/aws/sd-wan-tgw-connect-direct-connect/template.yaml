image: https://docs.aws.amazon.com/images/reference-architecture-diagrams/latest/sd-wan-solutions/images/sd-wan-solutions-6.png
source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/sd-wan-solutions/sdwan-dx-tgw.html
description: The corporate SD-WAN device behind the customer gateway terminates a Direct Connect transit virtual interface at the Direct Connect location, reaching a Direct Connect gateway associated with
  the Transit Gateway; that Direct Connect attachment is the transport for a Connect attachment, and the SD-WAN device is a Connect peer that runs a GRE tunnel and BGP peering directly to the Transit Gateway.
  Two dual-stack spoke VPCs each hold a workload subnet and a TGW subnet with the Transit Gateway ENI, their VPC route tables send 0.0.0.0/0 and ::/0 to the Transit Gateway, and the spoke and appliance
  Transit Gateway route tables map the SD-WAN segments into AWS with higher bandwidth and the larger BGP prefix limit of Connect peers.
