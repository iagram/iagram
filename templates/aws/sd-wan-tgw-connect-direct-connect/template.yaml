description: The on-premises SD-WAN device terminates a Direct Connect transit virtual interface through a Direct Connect gateway associated with the Transit Gateway, and that Direct Connect attachment
  is the transport for a Connect attachment. The SD-WAN device is a Connect peer that runs GRE and BGP directly to the Transit Gateway, extending SD-WAN segmentation into AWS with higher bandwidth and the
  larger BGP prefix limit of Connect peers.
