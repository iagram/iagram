# Generated from the official reference (https://docs.aws.amazon.com/omics/latest/dev/workflows.html); edit freely.
title: Genomics secondary analysis with AWS HealthOmics workflows and Batch
category: industry
tags:
- life sciences
- genomics
- healthomics
- batch
- nextflow
- secondary analysis
- variant calling
source: https://docs.aws.amazon.com/omics/latest/dev/workflows.html
description: Sequencer output in FASTQ format lands in an S3 bucket and a Step Functions state machine starts a HealthOmics workflow run whose containerised tasks are pulled from ECR; custom tertiary steps
  that need bespoke compute run on an AWS Batch compute environment. Variant calls and QC reports are written back to S3, catalogued in Glue and queried with Athena, and SNS notifies researchers when a
  sample completes.
