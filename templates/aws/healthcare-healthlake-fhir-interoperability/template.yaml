description: Clinical systems land FHIR R4 bundles and legacy C-CDA or CSV exports in an S3 staging bucket, from which a Lambda function starts HealthLake import jobs into a managed FHIR data store; integrated
  NLP enriches unstructured notes and stores the extracted entities as FHIR resources. SMART on FHIR applications authenticate with Cognito and call the data store through API Gateway, EventBridge routes
  data store events, and Lake Formation governs Athena SQL analytics over the exported data.
