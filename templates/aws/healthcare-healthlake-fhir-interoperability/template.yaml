description: Provider EHRs, HIEs, payors and monitoring devices land bulk FHIR R4 bundles and legacy C-CDA or CSV exports in S3 staging buckets, from which a Lambda function starts HealthLake bulk import
  jobs (via the HealthLake Data Transformation Agent for non-FHIR formats) into a managed FHIR data store. SMART on FHIR applications authenticate with an external identity provider and call the data store's
  FHIR APIs through API Gateway, while Lake Formation governs Redshift and Athena query engines and SageMaker and QuickSight analysis over the data store.
