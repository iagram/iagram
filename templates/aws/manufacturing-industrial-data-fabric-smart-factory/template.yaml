description: Guidance for Manufacturing on AWS connects plant equipment through IoT Greengrass and SiteWise Edge gateways that stream OT data to IoT Core, Kinesis and MSK, while Storage Gateway and Glue
  move IT data from on-premises applications and ERP into S3. The cloud side catalogues the data in the Glue Data Catalog, processes streams with Managed Service for Apache Flink, unifies S3 and Redshift
  in a lakehouse and exposes it to SageMaker models and Bedrock agents, with Grafana dashboards for operators.
