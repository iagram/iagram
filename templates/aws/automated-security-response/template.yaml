description: Security Hub custom actions or automatic rules send findings through EventBridge to a Step Functions orchestrator in the security administrator account, which assumes a cross-account role and
  runs Systems Manager Automation runbooks that remediate the resource in the member account. Every action is logged to CloudWatch Logs and notified via SNS, with playbooks mapped to CIS, FSBP, PCI DSS
  and NIST 800-53 controls.
