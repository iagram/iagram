description: A root CA and a subordinate issuing CA run in a dedicated CA account; the subordinate CA is shared to workload accounts through AWS Resource Access Manager. Teams in the workload accounts request
  private certificates through ACM from the shared CA and attach them to load balancers, so certificate private keys never leave the workload account while CA control stays central.
