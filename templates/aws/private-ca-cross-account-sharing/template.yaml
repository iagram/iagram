description: A private CA runs in ACM Private CA in a central account and is added to an AWS Resource Access Manager resource share, which is shared either with the whole organization or organizational
  units (4a) or with individual accounts as principals (4b). Teams in the shared accounts request private certificates through ACM from the shared CA, so certificate private keys never leave their account
  while CA control stays central.
