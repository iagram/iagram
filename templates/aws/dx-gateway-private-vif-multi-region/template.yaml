description: A single Direct Connect connection carries a private virtual interface to a globally scoped Direct Connect gateway, which is associated with virtual private gateways attached to VPCs in two
  different Regions. Routes for each VPC are advertised to the customer router over one BGP session, and the gateway does not forward traffic between the associated VPCs or back toward on-premises through
  another VIF.
