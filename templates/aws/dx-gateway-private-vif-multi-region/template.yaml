description: Two Direct Connect connections at separate Direct Connect locations carry virtual interfaces to a single globally scoped Direct Connect gateway, which is associated with Transit Gateways in
  us-east-1 and us-east-2 that each attach three VPCs. Routes for every VPC are advertised over BGP to the redundant customer gateway routers of the corporate WAN, and the gateway does not forward traffic
  between the associated Regions or back toward on-premises through another virtual interface.
