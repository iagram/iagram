source: https://docs.aws.amazon.com/cur/latest/userguide/cur-query-athena.html
description: A Cost and Usage Report configured for Athena integration is delivered in Parquet to an S3 bucket, and the CloudFormation template shipped alongside it creates a Glue database, a Glue crawler
  and two Lambda functions that are triggered by S3 event notifications to refresh partitions whenever a new report lands. Athena queries the resulting table through a dedicated workgroup and QuickSight
  connects to Athena as a data source to build cost dashboards, with query results and SPICE refreshes scheduled daily.
