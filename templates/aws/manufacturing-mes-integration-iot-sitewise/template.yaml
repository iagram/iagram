source: https://docs.aws.amazon.com/iot-sitewise/latest/userguide/what-is-sitewise.html
description: A SiteWise Edge gateway running on IoT Greengrass reads OPC UA tags from PLCs and the MES historian and streams them to IoT SiteWise, where asset models compute OEE and other metrics; MES work
  orders and material data arrive through IoT Core rules and a Lambda API integration. Cold-tier exports land in S3 for Athena analysis, alarms publish to SNS, and operators use Grafana dashboards, while
  the MES receives production counts back through an API Gateway integration.
