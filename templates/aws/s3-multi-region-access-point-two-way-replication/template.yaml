source: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiRegionAccessPoints.html
description: A multi-Region application client reads and writes through a single Multi-Region Access Point global endpoint; requests from the internet, a VPC or PrivateLink are accelerated over the AWS
  Global Accelerator network to the bucket with the lowest latency among three Regions. Bidirectional Cross-Region Replication with replica modification sync keeps the buckets in sync, and failover controls
  shift all S3 traffic to one Region within minutes.
