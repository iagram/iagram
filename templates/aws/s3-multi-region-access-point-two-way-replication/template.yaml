description: Applications in two Regions read and write through a single Multi-Region Access Point global endpoint, which routes over the AWS global network to the nearest bucket with an active routing
  status. Bidirectional Cross-Region Replication with replica modification sync keeps the two buckets in sync, and failover controls shift all S3 traffic to one Region within minutes.
