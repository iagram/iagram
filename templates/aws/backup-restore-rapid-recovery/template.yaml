description: AWS Backup takes point-in-time recovery points of EBS, RDS, EFS and DynamoDB in the primary Region and copies them to a vault in the recovery Region. An EventBridge rule on CloudWatch alarms
  and AWS Health events triggers a Lambda function that redeploys the stack from CloudFormation and golden AMIs, then restores data from the copied recovery points.
