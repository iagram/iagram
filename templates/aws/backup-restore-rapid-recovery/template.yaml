description: AWS Backup takes point-in-time recovery points of EBS and RDS in the primary Region and copies them to a vault in the recovery Region. On recovery, CloudFormation redeploys the EC2 infrastructure
  while AWS Backup restores the EBS volume; the restore-job COMPLETED event on EventBridge creates a Systems Manager OpsItem in OpsCenter for operators and invokes a Lambda function that attaches the restored
  volume to the new instance.
