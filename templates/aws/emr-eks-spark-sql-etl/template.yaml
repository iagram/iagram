source: https://aws.amazon.com/blogs/big-data/run-a-spark-sql-based-etl-pipeline-with-amazon-emr-on-amazon-eks/
description: An EMR virtual cluster is registered against an EKS cluster whose Spark application namespace runs on Fargate across two Availability Zones next to other applications, and a declarative Spark
  SQL job definition kept in GitHub is submitted through the EMR on EKS job API; each driver and executor runs as an isolated pod that scales from zero and is torn down when the job completes. The NYC TLC
  ETL job reads raw trip data from S3, validates schema, aggregates and writes Parquet results back to an output bucket with pod-level IAM roles.
