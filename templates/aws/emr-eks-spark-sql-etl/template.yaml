description: An EMR virtual cluster is registered against an EKS cluster running on Fargate, and declarative Spark SQL jobs are submitted through the EMR on EKS job API; each driver and executor runs as
  an isolated pod that scales from zero and is torn down when the job completes. Jobs read raw data from S3, validate schema, aggregate and write Parquet results back to S3 with pod-level IAM roles.
