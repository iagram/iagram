description: Producers write records to a Kinesis data stream; a Firehose delivery stream reads the stream, optionally invokes a Lambda transform, converts records to Parquet, and buffers them into S3 by
  size or time. Glue and Athena make the landed data queryable, and CloudWatch alarms watch stream throughput.
