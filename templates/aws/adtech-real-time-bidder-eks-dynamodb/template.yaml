description: Guidance for Building a Real Time Bidder for Advertising on AWS receives OpenRTB bid requests from supply-side platforms on a public load balancer and routes them to bidder pods on an EKS cluster
  running Graviton instances. The bidder reads audience, campaign and budget tables in DynamoDB through VPC endpoints, updates budgets on wins, and sends compressed transaction micro-batches to Kinesis
  Data Streams and Firehose for delivery to S3, with KMS encryption and ECR-hosted container images.
