description: Guidance for Building a Real Time Bidder for Advertising on AWS receives OpenRTB bid requests from a publisher's supply-side platform on a public load balancer and routes them to bidder pods
  on an EKS cluster running Graviton instances. Through three VPC endpoints the bidder reads audience, campaign and budget tables in DynamoDB (or an Aerospike cluster on EC2), updates budgets on wins, pulls
  container images from ECR and sends compressed transaction micro-batches to Kinesis Data Streams and Firehose for delivery to S3; KMS and IAM secure the stack, which CodePipeline, CodeBuild and CloudFormation
  deploy.
