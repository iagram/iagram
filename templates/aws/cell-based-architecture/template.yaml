source: https://docs.aws.amazon.com/wellarchitected/latest/reducing-scope-of-impact-with-cell-based-architecture/reducing-scope-of-impact-with-cell-based-architecture.html
description: The workload is deployed as independent, identically sized cells, each with its own load balancer, compute and database so a failure is contained to the customers mapped to that cell. A thin,
  highly available cell router looks up the partition key (for example tenant ID) in a mapping table and forwards the request to the owning cell; cells never call each other.
