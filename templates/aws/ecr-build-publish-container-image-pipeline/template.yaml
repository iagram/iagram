source: https://docs.aws.amazon.com/codepipeline/latest/userguide/tutorials-ecr-build-publish.html
description: A V2 pipeline sources a repository containing a Dockerfile and imagedefinitions.json through a GitHub App connection, then the managed ECRBuildAndPublish build action logs in to ECR, builds
  the image on CodePipeline-managed CodeBuild compute and pushes it without a buildspec. An Amazon ECS standard deploy action registers a new task definition revision with the pushed image URI and updates
  the service; ECR enhanced scanning with Amazon Inspector evaluates each pushed image for vulnerabilities.
