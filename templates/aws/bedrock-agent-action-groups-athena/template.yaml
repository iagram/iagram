image: https://docs.aws.amazon.com/images/prescriptive-guidance/latest/patterns/images/pattern-img/15372718-3a5d-4918-9cfa-422c455f288d/images/ff19152e-0bb6-4758-a6dd-4f6140e55113.png
source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/develop-a-fully-automated-chat-based-assistant-by-using-amazon-bedrock-agents-and-knowledge-bases.html
description: A Streamlit task on an ECS cluster behind an Application Load Balancer calls an Invocation Lambda that sends prompts to a Bedrock agent. The agent answers documentation questions from a knowledge
  base on OpenSearch Serverless fed by an S3 documentation bucket, and delegates database questions through an OpenAPI action-group schema to an executor Lambda that generates SQL and runs it in Athena
  against a Glue Data Catalog table that a Glue crawler loads from a CSV bucket.
