source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-access-to-vpc-private-endpoints.html
description: Interface endpoints for AWS services are provisioned once in a shared-services VPC instead of in every spoke, and spokes reach them across the Transit Gateway. Because the endpoint's managed
  private DNS only resolves inside its own VPC, private DNS is disabled and a Route 53 private hosted zone matching the service name with an alias record to the endpoint is associated with every spoke VPC.
