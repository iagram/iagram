description: A user authenticates against a Cognito user pool and presents the token to API Gateway, which passes it to a custom authorizer Lambda function that verifies the JWT and looks up the matching
  IAM policy document in a DynamoDB policy store. The authorizer returns the policy and context to API Gateway, which evaluates the policy before invoking the service Lambda function with that context.
