description: Users authenticate against a Cognito user pool and present the access token to API Gateway, which invokes a Lambda authorizer that validates the JWT against the cached Cognito public keys.
  The authorizer maps the user's Cognito group to an IAM policy stored in DynamoDB and returns it, so API Gateway allows or denies each method before invoking the backend Lambda function.
