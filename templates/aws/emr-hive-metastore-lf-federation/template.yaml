description: A producer account runs an EMR cluster whose Hive metastore describes tables stored in S3; a central catalog account federates that metastore into the Glue Data Catalog through a Lambda connector
  and applies Lake Formation database, table and column permissions. Consumer accounts query the federated tables through resource links with Athena, EMR Serverless or SageMaker while data stays in the
  producer account.
