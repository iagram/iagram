source: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
description: A backup plan in the production account stores recovery points in a local vault and copies them to a vault owned by a separate backup account in the same AWS Organization, and to a vault in
  a second Region. The destination vault carries a resource policy allowing backup:CopyIntoBackupVault and its own KMS key, so a compromised production account cannot delete the copies.
