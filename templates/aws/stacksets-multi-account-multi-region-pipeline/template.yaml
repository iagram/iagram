description: A pipeline in the administration account takes a zipped template, parameters file and accounts list from an S3 source bucket, then runs a CloudFormationStackSet action to create the stack set
  and a CloudFormationStackInstances action to roll the stacks out to target accounts and Regions with failure tolerance and concurrency limits. Self-managed permissions use AWSCloudFormationStackSetAdministrationRole
  in the administration account and AWSCloudFormationStackSetExecutionRole trusted from each target account.
