description: An object uploaded to S3 triggers a Lambda function that submits a job to an AWS Batch job queue mapped to a Fargate compute environment, so no EC2 instances are managed and capacity scales
  up to the configured maximum vCPUs. The job definition points at a container image in ECR; the task reads the file from S3, writes parsed rows to DynamoDB and streams its output to CloudWatch Logs.
