source: https://aws.amazon.com/blogs/developer/aws-batch-application-orchestration-using-aws-fargate/
description: An object uploaded to S3 raises a CloudWatch Event that triggers a Lambda function, which submits a job (job definition and job queue) to an AWS Batch Fargate compute environment in the private
  subnet, so no EC2 instances are managed and capacity scales up to the configured maximum vCPUs. The task pulls its container image from ECR through an interface endpoint, reads the file from S3 and writes
  parsed rows to DynamoDB through gateway endpoints, streams its output to CloudWatch, and the whole stack is provisioned by CloudFormation.
