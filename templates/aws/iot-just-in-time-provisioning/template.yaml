source: https://docs.aws.amazon.com/iot/latest/developerguide/jit-provisioning.html
description: A customer CA certificate is registered in IoT Core with auto-registration enabled and a JITP provisioning template attached. When a device presents a certificate signed by that CA for the
  first time, IoT Core registers the certificate as PENDING_ACTIVATION, runs RegisterThing with values extracted from the certificate subject, creates the thing, policy and thing-group membership, and flips
  the certificate to ACTIVE.
