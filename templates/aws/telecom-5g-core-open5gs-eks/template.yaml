source: https://aws.amazon.com/blogs/opensource/open-source-mobile-core-network-implementation-on-amazon-elastic-kubernetes-service/
description: Open5GS control-plane network functions (MME, HSS, PCRF, SMF, AMF) and user-plane functions (SGW-U, UPF) run as containers on separate EKS managed node groups, with Multus CNI attaching additional
  ENIs for the S1, N2 and N3 interfaces. Subscriber profiles live in Amazon DocumentDB, Route 53 private hosted zones give the network functions service discovery, and custom controllers automate DNS records
  and secondary IP assignment on the worker instances.
