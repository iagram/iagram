description: A regional Transit Gateway acts as the hub; each spoke VPC attaches once and its VPC route table sends non-local traffic to the Transit Gateway, whose own route tables decide which attachment
  receives it. A shared egress VPC with NAT gateways centralizes outbound traffic so spokes hold no internet gateway of their own.
