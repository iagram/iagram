description: A central VPC A holds one VPC peering connection to each of VPCs B, C, D, E, F and G so that every peer can reach VPC A's full CIDR block and VPC A can reach each of theirs. VPC peering is
  not transitive, so VPC A cannot relay traffic between its peers; two spokes that also need to talk to each other must be peered directly, which taken to its end gives a full mesh, and each VPC's route
  table carries one route per peer CIDR pointing at the corresponding peering connection.
