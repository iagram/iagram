description: Three VPCs that need to reach each other's full CIDR blocks are peered pairwise, because VPC peering is not transitive and a hub cannot relay traffic between spokes. Each VPC's route table
  carries one route per peer CIDR pointing at the corresponding peering connection, and security groups may reference peer security groups within the same Region.
