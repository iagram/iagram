image: https://d2908q01vomqb2.cloudfront.net/5b384ce32d8cdef02bc3a139d4cac0a22bb029e8/2020/02/02/Picture1.png
source: https://aws.amazon.com/blogs/networking-and-content-delivery/scaling-vpn-throughput-using-aws-transit-gateway/
description: In the baseline drawn by the post, an on-premises customer gateway router carries one Site-to-Site VPN connection to a virtual private gateway on each of three VPCs, so every VPC is capped
  at the bandwidth of a single tunnel pair. Moving the same VPN connections onto one Transit Gateway with ECMP enabled lets each connection contribute two IPsec tunnels; with BGP advertising identical prefixes
  over every tunnel the Transit Gateway hashes flows across all of them, so aggregate bandwidth scales past the single-tunnel limit while each individual flow stays bound to one tunnel.
