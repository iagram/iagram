description: Several Site-to-Site VPN connections from the same customer gateway terminate on one Transit Gateway with ECMP enabled, and each connection contributes two IPsec tunnels. With BGP advertising
  identical prefixes over every tunnel, the Transit Gateway hashes flows across all tunnels, so aggregate bandwidth scales past the single-tunnel limit while each individual flow stays bound to one tunnel.
