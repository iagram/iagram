description: A dedicated Security Tooling account in the Security OU is the delegated administrator for Security Hub CSPM, Security Hub, GuardDuty, Detective, Inspector, Macie, Config, Firewall Manager,
  Audit Manager, IAM Access Analyzer and Security Lake across the organization, and also hosts the CloudTrail organization trail with its CloudWatch log group, a Private CA, an EventBridge bus that triggers
  Lambda response functions, KMS keys and the least-privilege permissions and roles that operate the tooling. Findings from every member account aggregate there while long-term exports go to S3 buckets
  in the Log Archive account.
