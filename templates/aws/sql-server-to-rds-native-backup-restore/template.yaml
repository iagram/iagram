description: Full and differential backups of the on-premises SQL Server databases are copied to an S3 bucket and restored into a Multi-AZ RDS for SQL Server instance using the native backup and restore
  option. DMS change data capture closes the gap between the last backup and cutover, while an AWS Managed Microsoft AD directory provides Windows authentication for the migrated application servers.
