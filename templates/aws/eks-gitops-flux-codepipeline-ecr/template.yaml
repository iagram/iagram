description: A commit to the application repository in CodeCommit starts a CodePipeline whose CodeBuild stage builds the container image, tags it with the commit hash and pushes it to ECR. Flux running
  on the EKS node group watches a separate Kubernetes manifest repository and the ECR registry; when a new tag appears it updates the manifest and reconciles the cluster so the desired state always lives
  in Git.
