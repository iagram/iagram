source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-network-firewall-for-centralized-ingress.html
description: An ingress VPC exposes a single internet-facing Application Load Balancer; the internet gateway route table (ingress routing) forces inbound packets through AWS Network Firewall endpoints before
  they reach the load balancer subnets. The ALB terminates TLS and forwards to application targets in spoke VPCs across the Transit Gateway, so spoke VPCs stay private and share one inspected entry point.
