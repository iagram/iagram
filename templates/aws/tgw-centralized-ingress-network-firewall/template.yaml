title: Centralized ingress with AWS Network Firewall and a shared ALB
category: networking
tags:
- centralized ingress
- network firewall
- application load balancer
- transit gateway
- deep packet inspection
image: https://docs.aws.amazon.com/images/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/images/ingress-inspection-using-aws-nf.png
source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-network-firewall-for-centralized-ingress.html
description: An ingress VPC exposes a single internet-facing Application Load Balancer; the internet gateway ingress route table forces inbound packets through an AWS Network Firewall endpoint in each of
  three Availability Zones before they reach the load balancer. The ALB terminates TLS and forwards across the Transit Gateway to a Network Load Balancer in front of the application instances in each spoke
  VPC, so spoke VPCs stay private and share one inspected entry point.
