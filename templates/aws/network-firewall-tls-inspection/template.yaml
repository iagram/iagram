description: Ingress traffic enters through the internet gateway, whose ingress route table sends it to the Network Firewall endpoint in a dedicated firewall subnet before the firewall subnet and customer
  subnet route tables forward it to the EC2 instances. The firewall policy runs packets through the stateless rules engine and then the stateful rules engine; a TLS inspection configuration that references
  an ACM certificate issued by Private CA lets the firewall decrypt in-scope TLS sessions, inspect the plaintext and re-encrypt before forwarding.
