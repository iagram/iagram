description: A Network Firewall TLS inspection configuration references a certificate in ACM, issued by Private CA, so the firewall decrypts in-scope TLS sessions, applies stateful Suricata rules to the
  plaintext and re-encrypts before forwarding to the target. Ingress traffic from an internet gateway passes through the firewall endpoint subnet before reaching the load balancer, and decrypted-session
  alerts are logged to S3.
