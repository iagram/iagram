description: Devices publish read-only telemetry on a data/ topic namespace to the IoT Core message broker; topic rules fan the same messages out to a Kinesis data stream for real-time processing, a Firehose
  delivery stream that lands raw records in S3, and a Timestream table for time-series queries. A Lambda consumer on the Kinesis stream writes latest-state records to DynamoDB while Glue and Athena query
  the S3 archive.
