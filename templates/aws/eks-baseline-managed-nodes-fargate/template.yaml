source: https://aws.amazon.com/blogs/containers/bootstrapping-clusters-with-eks-blueprints/
description: A private-subnet EKS cluster runs a small managed node group for system add-ons and a second group for applications across two Availability Zones, while a Fargate profile schedules pods in
  a selected namespace on serverless compute. Managed add-ons (VPC CNI, CoreDNS, kube-proxy) and an IAM OIDC provider for IAM roles for service accounts are created with the cluster, and NAT gateways give
  nodes outbound access to ECR and the EKS API.
