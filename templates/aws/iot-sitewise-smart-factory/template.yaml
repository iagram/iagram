source: https://docs.aws.amazon.com/iot-sitewise/latest/userguide/what-is-sitewise.html
description: A SiteWise Edge gateway running on Greengrass V2 reads OPC UA servers on the plant floor and streams equipment data to the cloud, where asset models compute transforms and metrics such as OEE
  and SiteWise Monitor renders operator dashboards. IoT Core rules ingest MQTT devices into asset properties, alarms notify through SNS, and cold-tier data is exported to a customer S3 bucket for Athena
  queries.
