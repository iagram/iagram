description: Control Tower creates a Security OU holding a Log Archive account and an Audit account, plus a Sandbox OU for workload accounts, under the organization root managed from the management account.
  Preventive controls are enforced as service control policies on OUs, detective controls run as Config rules aggregated in the Audit account, and the organization trail lands in the Log Archive bucket.
