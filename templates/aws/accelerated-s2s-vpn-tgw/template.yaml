image: https://docs.aws.amazon.com/images/whitepapers/latest/hybrid-connectivity/images/managed-vpn-tg-single-region.png
source: https://docs.aws.amazon.com/whitepapers/latest/hybrid-connectivity/aws-accelerated-site-to-site-vpn-aws-transit-gateway-single-aws-region.html
description: An accelerated Site-to-Site VPN attaches to a Transit Gateway and uses AWS Global Accelerator so that each IPsec tunnel terminates at anycast IPs announced from the nearest AWS edge location
  instead of at the Region. The customer gateway's traffic enters the AWS global network close to the site and rides the backbone to the Regional Transit Gateway, reducing jitter and path variability compared
  with traversing the public internet all the way to the Region.
