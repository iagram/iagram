title: Accelerated Site-to-Site VPN to a Transit Gateway
category: networking
tags:
- site-to-site vpn
- accelerated vpn
- global accelerator
- transit gateway
- anycast
- edge
image: https://docs.aws.amazon.com/images/whitepapers/latest/hybrid-connectivity/images/managed-vpn-tg-single-region.png
source: https://docs.aws.amazon.com/whitepapers/latest/hybrid-connectivity/aws-accelerated-site-to-site-vpn-aws-transit-gateway-single-aws-region.html
description: An accelerated Site-to-Site VPN attaches to a Transit Gateway that interconnects three VPCs, each spanning two Availability Zones, and uses AWS Global Accelerator so that each IPsec tunnel
  terminates at anycast IPs announced from the nearest AWS point of presence instead of at the Region. Traffic from the customer gateway router leaves the corporate data center through its local ISP, enters
  the AWS global network close to the site and rides the backbone to the Regional Transit Gateway, reducing jitter and path variability compared with traversing the public internet all the way to the Region.
