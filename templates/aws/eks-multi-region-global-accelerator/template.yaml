image: https://d2908q01vomqb2.cloudfront.net/fe2ef495a1152561572949784c16bf23abb28057/2020/12/05/image-10.jpg
source: https://aws.amazon.com/blogs/containers/operating-a-multi-regional-stateless-application-using-amazon-eks/
description: Identical stateless deployments run on EKS clusters in two Regions; each cluster's control plane lives in an AWS-owned VPC that operators reach with kubectl and attaches elastic network interfaces
  to the worker nodes in the customer VPC's Availability Zones, and each deployment is exposed through an ALB created by the AWS Load Balancer Controller. Global Accelerator publishes two static anycast
  IPs, sends 100 percent of traffic to the primary endpoint group and 0 percent to the secondary, and health-checks both ALBs so failover happens at the accelerator without waiting for DNS propagation;
  Route 53 maps the application domain to the accelerator.
