description: Guidance for Meter Data Analytics on AWS ingests interval reads from meter data management or head-end systems through Transfer Family SFTP for batch files and Kinesis for streaming, stores
  time series in Timestream and raw data in S3. Glue and EMR run ETL into a curated data lake catalogued in the Glue Data Catalog, Athena and Redshift serve SQL analytics, Grafana publishes dashboards and
  SageMaker models detect grid anomalies and forecast demand.
