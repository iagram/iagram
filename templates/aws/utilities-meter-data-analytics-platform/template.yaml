description: Guidance for Meter Data Analytics on AWS ingests data from a customer information system, weather feeds, the metering head-end and the MDMS through a custom Lambda adapter, Transfer Family
  SFTP and Storage Gateway for batch files, and Kinesis with SQS and SNS for streaming, then stores time series in Timestream and raw data in S3 with Glacier archival. Glue and EMR run ETL into a cleaned
  S3 bucket governed by Lake Formation and catalogued in the Glue Data Catalog; EMR, Athena and Redshift serve analytics, Managed Grafana and QuickSight publish dashboards to enterprise applications, and
  SageMaker predictions drive proactive customer engagement through Pinpoint.
