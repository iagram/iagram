source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/set-up-dns-resolution-for-hybrid-networks-in-a-multi-account-aws-environment.html
description: A shared-services VPC connected to on-premises through a Transit Gateway hosts one inbound and one outbound Route 53 Resolver endpoint spanning two Availability Zones. On-premises DNS servers
  forward AWS domains to the inbound endpoint, while Resolver forwarding rules for the corporate domain target the on-premises servers via the outbound endpoint and are shared to workload accounts with
  AWS RAM and associated with their VPCs, together with the private hosted zone.
