description: A shared-services VPC hosts an outbound Route 53 Resolver endpoint that reaches the corporate data center over AWS Direct Connect or Site-to-Site VPN. A Resolver forwarding rule for onprem.example.com
  targets the on-premises DNS server through the outbound endpoint; the rule is shared to the production account with AWS RAM and associated with the production VPC, so queries from EC2 instances to the
  VPC's Route 53 Resolver are forwarded to the on-premises private DNS zone.
