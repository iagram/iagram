description: A Lambda function behind API Gateway invokes a Bedrock foundation model with a guardrail identifier so denied topics, content filters, word filters and PII redaction are applied to both prompt
  and completion. Model invocation logging writes full request and response payloads to CloudWatch Logs and S3, and session state lives in DynamoDB.
