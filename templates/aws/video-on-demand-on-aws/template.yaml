description: Uploading a source video or a video plus metadata file to the source S3 bucket starts Step Functions ingest, process and publish workflows implemented with Lambda functions. MediaConvert transcodes
  the asset into the destination bucket, EventBridge rules capture job status changes, DynamoDB tracks workflow state, SNS sends notifications, SQS captures outputs, and CloudFront delivers the encoded
  content.
