source: https://docs.aws.amazon.com/solutions/latest/video-on-demand-on-aws/architecture-overview.html
description: Uploading a source video or a video plus metadata file to the source S3 bucket (with a lifecycle policy to S3 Glacier Flexible Retrieval) starts Step Functions ingest, process and publish workflows
  implemented with Lambda functions; MediaInfo probes the source during ingest. MediaConvert transcodes the asset into the destination bucket (MediaPackage VOD packaging is configuration and is not drawn),
  CloudWatch Events rules capture job status changes, DynamoDB tracks workflow state, SNS sends ingest, encoding and workflow summaries, SQS captures workflow outputs, and CloudFront delivers the encoded
  content.
