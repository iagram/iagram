description: EKS Anywhere runs the EKS Distro Kubernetes on customer hardware (vSphere, bare metal, Nutanix or Snow) with a management cluster that provisions workload clusters through Cluster API. When
  connected to a Region, the EKS Connector agent registers each cluster in the EKS console over Systems Manager, IAM identities authenticate to the cluster, and optional integrations pull images from ECR
  and ship metrics and logs to Amazon Managed Service for Prometheus and CloudWatch over Direct Connect or VPN.
