description: A Kendra GenAI index crawls enterprise sources such as S3 and SaaS repositories through Kendra data source connectors and provides managed semantic retrieval. A Bedrock knowledge base wraps
  the index and is attached to a Bedrock agent so the foundation model grounds its answers on Kendra results without a separate vector database.
