description: Admin users open the deployment dashboard, a React web app served by CloudFront from S3 with its runtime settings in Parameter Store; REST calls pass AWS WAF and API Gateway, where a Lambda
  custom authorizer checks the Cognito token against a DynamoDB policy store before backing Lambdas record use cases in DynamoDB, launch a CloudFormation stack per use case from nested templates in the
  solutions artifact bucket and store the LLM configuration, all watched by a CloudWatch custom dashboard. In the deployed text use case a WebSocket API queues chat messages in SQS for a chat Lambda that
  calls Bedrock, optionally grounded by a Bedrock knowledge base or Kendra index.
