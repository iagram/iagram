description: CloudFront serves a React web UI from S3 and Cognito authenticates users of both the deployment dashboard and the chat use case. A REST API drives use-case management Lambdas that record configurations
  in DynamoDB, while a WebSocket API queues chat messages in SQS for a chat Lambda that calls Bedrock, optionally grounded by a Bedrock knowledge base or Kendra index.
