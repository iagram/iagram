image: https://docs.aws.amazon.com/images/wellarchitected/latest/saas-lens/images/image2.png
source: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/serverless-saas.html
description: A shared web application hosted on S3 signs tenants in through a Cognito user pool whose JWTs carry tenant ID and tier as custom claims. API Gateway usage plans throttle each tier and a Lambda
  authorizer maps the claims to scoped credentials before the JWT with tenant context reaches the application microservices, each a set of Lambda functions with its own data store partitioned by tenant,
  while a column of shared services (registration, user and tenant management, provisioning, system and tenant admin, billing and metrics) onboards and operates tenants.
