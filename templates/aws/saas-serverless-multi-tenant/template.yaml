source: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/serverless-saas.html
description: A shared web application on S3 and CloudFront signs tenants in through Cognito user pools whose JWTs carry tenant ID and tier as custom claims. API Gateway calls a Lambda authorizer that maps
  the claims to scoped IAM credentials, so pooled tenants share Lambda functions and DynamoDB tables partitioned by tenant while premium tenants get dedicated siloed stacks, and an onboarding service provisions
  each new tenant.
