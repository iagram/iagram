description: In the Centralized Logging with OpenSearch solution, service logs such as CloudTrail and VPC Flow Logs are written to CloudWatch Logs and redelivered in real time to a Kinesis data stream through
  a subscription filter. The stream invokes a Log Processor Lambda that parses the records and indexes them into an OpenSearch Service domain, exporting failed records to an S3 backup bucket.
