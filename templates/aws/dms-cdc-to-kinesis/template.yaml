description: AWS DMS reads the transaction logs of data producers such as RDS MySQL, Oracle, SQL Server and PostgreSQL, DynamoDB and an on-premises DB2 LUW database and publishes insert, update and delete
  events to a Kinesis data stream as the target endpoint. A streaming layer of EMR Spark reads the raw stream and writes processed records to a second stream that feeds consumers such as Redshift, DynamoDB,
  QuickSight, CloudSearch, Athena and Kinesis-enabled applications, while Firehose archives both streams to S3 as the persistent layer.
