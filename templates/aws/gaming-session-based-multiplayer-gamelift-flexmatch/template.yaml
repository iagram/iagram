description: Guidance for Multiplayer Session-Based Game Hosting on AWS has game clients read Regional endpoints from a DynamoDB table to measure latency, then call an API Gateway HTTP API that validates
  the player against a custom identity component and whose Lambda function submits a StartMatchmaking request to Amazon GameLift FlexMatch; the GameLift queue places the match on the lowest-latency location
  of a multi-location fleet. Matchmaking events flow to an SNS topic and a Lambda function records ticket status in a DynamoDB matchmaking table, the client polls for the game session IP and port through
  a second Lambda function, connects directly to the game server and the fleet instances ship logs and metrics to CloudWatch.
