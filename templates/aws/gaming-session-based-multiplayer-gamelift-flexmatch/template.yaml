description: Guidance for Multiplayer Session-Based Game Hosting on AWS has game clients measure Region latency, then call an API Gateway backend whose Lambda function submits a StartMatchmaking request
  to Amazon GameLift FlexMatch; the GameLift queue places the match on the lowest-latency fleet location. Matchmaking events flow to an SNS topic and a Lambda function records ticket status in DynamoDB,
  the client polls for the game session IP and port, connects directly to the game server and instances ship logs and metrics to CloudWatch.
