description: Game clients call a backend service that requests game session placements from GameLift Servers rather than holding AWS credentials themselves; the backend service also talks to external services
  such as identity or storefront providers. GameLift host management tools (a game session queue and placement) place sessions on managed EC2 fleets running the game server, and players connect directly
  to the assigned game server.
