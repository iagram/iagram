description: Game clients authenticate to a serverless backend service that requests game session placements from GameLift Servers rather than holding AWS credentials themselves. A game session queue places
  sessions on managed EC2 fleets built from an uploaded server build, players connect directly to the assigned game server, and DynamoDB stores player profiles and session records.
