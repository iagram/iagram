title: Container observability with CloudWatch Container Insights on ECS and EKS
category: observability
tags:
- cloudwatch
- container insights
- enhanced observability
- fluent bit
- cloudwatch agent
- ecs
- eks
source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
description: Container Insights with enhanced observability collects CPU, memory, disk and network metrics down to the container level from an ECS cluster (via the ECS agent) and from an EKS cluster (via
  the Amazon CloudWatch Observability add-on, which installs the CloudWatch agent and Fluent Bit). Metrics land in the ContainerInsights namespace, container logs and performance log events go to CloudWatch
  Logs, and curated dashboards plus alarms that notify an SNS topic give operators cluster-to-container drill-down.
