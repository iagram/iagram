description: A pipe polls an SQS order queue, filters messages, calls a Lambda enrichment step that looks up the customer record in DynamoDB, and starts a Step Functions execution with the enriched payload.
  No consumer code is written for the queue; batching, filtering and the target invocation are handled by the pipe.
