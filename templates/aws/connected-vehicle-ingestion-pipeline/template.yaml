description: Vehicles authenticate to IoT Core with X.509 mTLS and publish compressed telemetry; an IoT rule with Basic Ingest writes directly to an Amazon MSK topic using SCRAM credentials from Secrets
  Manager, while bulk telemetry is uploaded to S3 through pre-signed URLs. Managed Service for Apache Flink decodes and enriches the Kafka stream and sinks the last known vehicle state to DynamoDB, which
  AppSync exposes to the companion app as a GraphQL API behind CloudFront.
