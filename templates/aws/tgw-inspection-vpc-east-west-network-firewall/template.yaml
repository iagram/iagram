image: https://docs.aws.amazon.com/images/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/images/vpc-traffic-inspection.png
source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-network-security-for-vpc-to-vpc-and-on-premises-to-vpc-traffic.html
description: A third-party VPC, a prod VPC and two dev VPCs attach to a Transit Gateway whose untrusted, prod, dev and security route tables send every default route to a security VPC and return known prefixes
  to the right attachment, Direct Connect gateway or Site-to-Site VPN. The security VPC (10.4.0.0/16) has per Availability Zone a TGW subnet with the Transit Gateway ENI and a firewall subnet with an AWS
  Network Firewall endpoint; the TGW subnet route table points 0.0.0.0/0 at the firewall endpoint, the firewall subnet route table returns internal prefixes to the Transit Gateway and sends internet-bound
  traffic to the internet gateway, and appliance mode on the attachment keeps both directions of a flow in the same zone.
