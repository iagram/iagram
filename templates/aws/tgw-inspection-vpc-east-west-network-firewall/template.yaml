description: A Transit Gateway with two route tables steers all VPC-to-VPC and on-premises-to-VPC traffic through a dedicated inspection VPC that hosts AWS Network Firewall endpoints in their own subnets,
  separate from the TGW attachment subnets. Appliance mode on the inspection VPC attachment keeps both directions of a flow on the same Availability Zone so the stateful firewall sees symmetric traffic.
