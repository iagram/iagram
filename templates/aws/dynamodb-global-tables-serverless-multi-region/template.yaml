description: Identical API Gateway and Lambda stacks are deployed in two Regions, each reading and writing its local DynamoDB replica of a global table. Route 53 latency records with health checks direct
  clients to the nearest Region and drop an unhealthy one, giving low or zero RPO with last-writer-wins reconciliation (or multi-Region strong consistency when configured).
