description: A producer on an EC2 instance writes credit card transactions into Kinesis Data Streams with the Kinesis Producer Library and a Managed Service for Apache Flink application processes them.
  The Flink job uses asynchronous I/O to call an API Gateway endpoint backed by a Lambda function, or optionally a SageMaker inference endpoint, so each transaction is scored for fraud in-stream while CloudWatch
  metrics and alarms monitor the application.
