description: Macie in the delegated administrator account scans S3 buckets in member accounts and emits findings to EventBridge, which forwards them to a Step Functions state machine. The workflow either
  notifies analysts through Lambda or automatically moves the object to a quarantine prefix, tracks status in DynamoDB, and lets security staff release objects through an API Gateway endpoint.
