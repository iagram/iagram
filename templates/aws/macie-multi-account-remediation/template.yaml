description: An Organizations tag policy from the management account and an AWS Config rule in the development/production account enforce bucket tagging, with compliance events forwarded over EventBridge
  to the security account, where a Lambda function posts notifications to a Microsoft Teams DLP channel. Macie in the delegated administrator account publishes findings for the scanned bucket to EventBridge
  and a results bucket; a Step Functions workflow records the object in a DynamoDB quarantine tracker, moves it to quarantine and notifies the channel through Lambda, and the DLP admin releases objects
  through an API Gateway endpoint that starts a release workflow.
