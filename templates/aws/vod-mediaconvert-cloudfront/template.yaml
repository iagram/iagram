description: Uploading a source video to an S3 bucket triggers a job-submit Lambda function that creates a transcoding job in AWS Elemental MediaConvert using a stored job template. MediaConvert writes
  its logs to CloudWatch and HLS adaptive-bitrate renditions to a destination bucket that a CloudFront distribution serves to players, while EventBridge routes the job state change to a job-complete Lambda
  that reads the outputs, records job metadata back in the source bucket and publishes the status to SNS.
