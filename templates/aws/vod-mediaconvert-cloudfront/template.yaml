description: Uploading a source video to an S3 bucket triggers a Lambda function that submits a transcoding job to AWS Elemental MediaConvert using a stored job template. MediaConvert writes HLS adaptive-bitrate
  renditions to a destination bucket that a CloudFront distribution serves to players, a completion Lambda publishes job status to SNS, and CloudWatch logs and job metadata are kept for tracking.
