description: Guidance for Autonomous Driving Data Framework on AWS bulk-uploads drive recordings from copy stations over Direct Connect into an S3 staging bucket registered through API Gateway, then runs
  quality checks and rosbag extraction in AWS Batch containers. EMR enriches sensor data with weather and map matching, SageMaker Ground Truth labels low-confidence frames, MWAA orchestrates the pipelines,
  and Iceberg tables in the Glue Data Catalog are queried with Athena, Redshift and OpenSearch, with DynamoDB holding drive-level metadata.
