description: Guidance for Autonomous Driving Data Framework on AWS bulk-uploads drive recordings from test-vehicle copy stations over Direct Connect into an S3 staging bucket registered through API Gateway,
  then runs quality checks and rosbag extraction in AWS Batch containers. EMR enriches sensor data with weather and map matching, a Lambda function routes low-confidence frames to SageMaker Ground Truth
  for manual labelling, MWAA orchestrates the pipelines with Neptune recording data lineage, and Iceberg tables in the Glue Data Catalog are queried with Athena, Redshift, OpenSearch and QuickSight; Managed
  Grafana and SNS provide fleet monitoring and alerting, CodePipeline and CodeBuild deploy the framework modules, Step Functions orchestrate visualization instances on EKS and DynamoDB holds drive-level
  metadata.
