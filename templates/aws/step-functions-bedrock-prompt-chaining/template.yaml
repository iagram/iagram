description: A Step Functions state machine uses the optimized Bedrock integration to call InvokeModel in successive Task states, passing each model output as input to the next prompt and reading large
  payloads from or writing them to S3. The same integration runs CreateModelCustomizationJob.sync to fine-tune a custom model, and a Lambda post-processes results into DynamoDB with an SNS notification
  on completion.
