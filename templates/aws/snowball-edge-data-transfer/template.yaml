description: An import job ships a Snowball Edge device to a disconnected or bandwidth-constrained site, where local servers copy data onto it through the S3 adapter or NFS interface while EC2-compatible
  instances and Lambda functions run on the device for local processing. The device is shipped back and AWS imports the data into the target S3 bucket, after which Glue and Athena catalog and query it and
  lifecycle rules move it to cold storage.
