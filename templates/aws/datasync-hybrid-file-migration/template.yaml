description: A DataSync agent deployed as a VM next to the source file servers (on-premises or in another cloud) reads the NFS and SMB shares and transfers data over TLS to the DataSync service in the AWS
  Region. DataSync tasks write the files to the AWS storage services (S3 bucket, EFS file system, FSx for Windows File Server, FSx for Lustre, FSx for OpenZFS and FSx for NetApp ONTAP), verifying checksums
  and running on a schedule to copy only changed data until cutover.
