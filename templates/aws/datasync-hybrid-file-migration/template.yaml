description: A DataSync agent deployed as a VM next to the on-premises file servers reads the NFS and SMB locations and transfers data over TLS to a DataSync VPC service endpoint reached through Direct
  Connect. Separate tasks write the file shares to an S3 bucket and an EFS file system, verifying checksums and running on a schedule to copy only changed data until cutover.
