- fargate
source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-discovery.html
description: Each ECS service registers its task IP addresses as instances of an AWS Cloud Map service inside a private DNS namespace, which is backed by a Route 53 private hosted zone that only the VPC
  can resolve. The frontend calls backend.internal by name; ECS keeps the A and SRV records current as tasks start, stop or fail health checks, so no internal load balancer is needed.
