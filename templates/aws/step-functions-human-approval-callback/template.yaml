description: A CloudWatch schedule invokes a Lambda function that polls the Step Functions activity with GetActivityTask and, through Amazon SES, emails the approver links that embed the task token. Clicking
  a link in the email client calls an API Gateway endpoint that invokes SendTaskSuccess or SendTaskFailure, and the workflow resumes without any long-running process waiting.
