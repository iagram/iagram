description: A producer account exposes a private API Gateway REST API whose resource policy allows calls only from a named execute-api interface endpoint. A consumer account creates that endpoint in its
  VPC, and its callers, a regional API Gateway, a Lambda function, an ECS service and an EC2 instance, reach the private API over PrivateLink without traversing the internet.
