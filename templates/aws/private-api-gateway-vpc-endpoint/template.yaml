description: A producer account exposes a private API Gateway REST API backed by Lambda; its resource policy allows calls only from a named execute-api interface endpoint. A consumer account creates that
  endpoint in its VPC, resolves the API hostname through a Route 53 private hosted zone, and applications in private subnets call the API over PrivateLink without traversing the internet.
