image: https://d2908q01vomqb2.cloudfront.net/fc074d501302eb2b93e2554793fcaf50b3bf7291/2021/05/13/Figure-2.-Pilot-light-DR-strategy.png
source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-iii-pilot-light-and-warm-standby/
description: A fully functional but scaled-down copy of the workload runs in the recovery Region, with front end and application servers in Auto Scaling groups across two Availability Zones behind Elastic
  Load Balancing, while Route 53 keeps the secondary Region inactive for production traffic. An Aurora primary and replica share the cluster volume in the primary Region and Aurora Global Database replicates
  asynchronously to a replica in the recovery Region, where a cluster snapshot is also kept; on failover Route 53 redirects users and the Auto Scaling groups are raised to production capacity.
