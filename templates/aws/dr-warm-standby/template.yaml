description: A fully functional copy of the workload runs in the recovery Region with one instance per tier behind its own load balancer, continuously serving test traffic. DynamoDB global tables and a
  cross-Region RDS read replica keep data current; on failover Route 53 redirects users and the Auto Scaling group is raised to production capacity.
