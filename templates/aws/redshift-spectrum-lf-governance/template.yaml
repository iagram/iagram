description: In a single AWS account an S3 data lake is crawled into the Glue Data Catalog and registered with Lake Formation, which grants table and column permissions on the marketing and finance tables
  to admin, marketing and finance IAM roles. A Redshift cluster assumes those roles and exposes the lake through per-department external schemas (Redshift Spectrum) so marketing and finance users querying
  from SQL interfaces only see the columns Lake Formation allows their group.
