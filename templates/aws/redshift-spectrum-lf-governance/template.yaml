description: An S3 data lake registered with Lake Formation is catalogued by a Glue crawler, and Lake Formation grants table and column permissions to an IAM role used by a Redshift cluster. Redshift Spectrum
  creates an external schema over the Glue database so warehouse users join hot data in Redshift with lake data in S3 while Lake Formation enforces the same policies that Athena and Glue honour.
