description: An S3 bucket holding the labelled card transactions and the trained model artifacts backs two SageMaker real-time endpoints, an unsupervised Random Cut Forest anomaly detector and a supervised
  XGBoost fraud classifier. A REST API invokes a Lambda that scores each transaction against both endpoints and streams the enriched result through Kinesis Data Firehose into a results bucket, which an
  optional QuickSight dashboard reports on.
