description: A SageMaker notebook trains an unsupervised Random Cut Forest anomaly detector and a supervised XGBoost classifier on labelled card transactions from S3 and deploys both to real-time endpoints.
  A REST API invokes a Lambda that scores each transaction against both endpoints and streams the enriched result through Kinesis Data Firehose into S3 for reporting.
