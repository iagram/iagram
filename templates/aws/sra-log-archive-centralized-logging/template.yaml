description: The Log Archive account holds a central logs S3 bucket that receives the CloudTrail organization trail, S3 access logs, Route 53 Resolver DNS query logs and VPC flow logs, alongside an Amazon
  Security Lake data lake, with access limited to tightly scoped IAM permissions and roles. Security Hub CSPM, Security Hub, GuardDuty, Macie, AWS Config, IAM Access Analyzer and the organization trail
  are the log sources, run from the Security Tooling account so that ownership of the archive stays separate from the services that write to it.
