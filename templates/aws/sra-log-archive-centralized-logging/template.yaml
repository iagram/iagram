description: The Log Archive account receives the CloudTrail organization trail, Config snapshots, VPC flow logs and GuardDuty findings in dedicated S3 buckets encrypted with a controlled KMS key and protected
  by Object Lock and lifecycle rules. Access is limited to automated, monitored roles; the CloudTrail delegated administrator lives in the Security Tooling account while the buckets stay in Log Archive
  to separate duties.
