description: A DataSync agent deployed as a VM next to an on-premises Linux NFS server reads the shares and transfers them to an S3 bucket through a scheduled DataSync task with incremental transfer and
  checksum verification enabled. Each run compares source metadata against S3 objects and uploads only new or changed files, logging every transferred object to CloudWatch Logs.
