description: Documents uploaded to S3 start a Step Functions workflow that submits asynchronous Textract analysis jobs; completion notifications reach SQS through SNS and a Lambda collects the extracted
  text. A classification step routes each document through a Comprehend custom classifier or a Bedrock model, and a Bedrock extraction step returns structured fields that are stored in DynamoDB and S3.
