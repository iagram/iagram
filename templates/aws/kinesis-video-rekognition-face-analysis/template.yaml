description: A webcam streams live video into a Kinesis video stream, where a Rekognition Video stream processor compares detected faces against a face collection. Match results are written to a Kinesis
  data stream, a Lambda consumer formats them, and Amazon SNS delivers a text notification to the end user's phone.
