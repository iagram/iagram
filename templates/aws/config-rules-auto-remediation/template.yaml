description: Config records resource configuration and evaluates managed and custom rules; when a resource becomes non-compliant, a remediation configuration invokes a Systems Manager Automation runbook
  under an IAM role that fixes the resource, for example re-enabling S3 public access block or EBS encryption. Compliance changes are published to SNS and configuration history is delivered to an S3 bucket.
