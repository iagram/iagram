description: Data uploaded to a raw S3 bucket raises an EventBridge event that is queued in SQS and triggers a Lambda function, which starts a Step Functions ingestion workflow whose Lambda steps validate
  the data, record pipeline state in DynamoDB and write it to a stage bucket. An EventBridge Scheduler schedule then starts a second Step Functions workflow in which a Glue job transforms stage data into
  an analytics bucket and a Glue crawler registers the tables in the Glue Data Catalog; Lake Formation governs the buckets and the catalog, and business analysts query them with Athena.
