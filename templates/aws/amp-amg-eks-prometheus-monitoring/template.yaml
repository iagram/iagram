title: EKS metrics with Amazon Managed Service for Prometheus and Amazon Managed Grafana
category: observability
tags:
- prometheus
- grafana
- eks
- managed collector
- remote write
- alertmanager
source: https://docs.aws.amazon.com/prometheus/latest/userguide/AMP-collector.html
description: An AWS managed collector (scraper) attached to the EKS cluster discovers Prometheus-compatible endpoints such as the API server, kube-state-metrics and application pods, and remote-writes the
  samples into an Amazon Managed Service for Prometheus workspace through ENIs in the cluster subnets and a VPC endpoint, with no agent to operate. Amazon Managed Grafana queries the workspace with SigV4
  through the AWS data source configuration, and workspace alerting rules route firing alerts to an SNS topic.
