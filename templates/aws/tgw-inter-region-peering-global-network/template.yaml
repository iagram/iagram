source: https://aws.amazon.com/blogs/networking-and-content-delivery/building-a-global-network-using-aws-transit-gateway-inter-region-peering/
description: Each Region runs its own Transit Gateway hub with local VPC attachments, and the two hubs are joined by a peering attachment that carries traffic over the encrypted AWS global backbone rather
  than the public internet. Peering attachments do not propagate routes, so each TGW route table holds static routes for the remote Region's CIDRs; on-premises sites connected to one hub can reach VPCs
  in the other Region through the peering.
