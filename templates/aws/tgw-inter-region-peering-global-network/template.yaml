image: https://d2908q01vomqb2.cloudfront.net/5b384ce32d8cdef02bc3a139d4cac0a22bb029e8/2020/06/23/2-blog-post-tgw-enterprise-network-architecture-1024x869.jpg
source: https://aws.amazon.com/blogs/networking-and-content-delivery/building-a-global-network-using-aws-transit-gateway-inter-region-peering/
description: Transit Gateways in eu-west-2 and ap-northeast-2 each attach two VPCs (192.168.0.0/20 and 192.168.16.0/20 in London, 192.168.128.0/20 and 192.168.144.0/20 in Seoul) and are joined by an inter-Region
  peering attachment that rides the encrypted AWS global network instead of the public internet. Branch offices in LA, London and Seoul reach the nearest Transit Gateway over accelerated Site-to-Site VPN
  tunnels that enter at an AWS edge location, the London data centre lands on a Direct Connect gateway associated with the London Transit Gateway, and because peering attachments do not propagate routes
  each TGW route table carries static routes for the remote Region's prefixes.
