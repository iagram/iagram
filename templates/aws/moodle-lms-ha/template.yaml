description: Route 53 directs students to CloudFront, which caches Moodle content and forwards dynamic requests to an Application Load Balancer in front of Moodle application servers in a private-subnet
  Auto Scaling group across Availability Zones. Moodledata sits on EFS, sessions and the application cache in ElastiCache, and course data in an Aurora cluster, with a bastion host for administration.
