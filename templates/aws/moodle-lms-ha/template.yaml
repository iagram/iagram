description: Route 53 directs students to CloudFront, secured with an ACM certificate, which forwards dynamic requests through the internet gateway to an Application Load Balancer in front of Nginx and
  PHP-FPM containers running as ECS tasks on AWS Fargate in private subnets of two Availability Zones, with NAT gateways in the public subnets for outbound access. Each zone holds ElastiCache, EFS, and
  an Aurora DB writer that replicate with their peers, Secrets Manager supplies the database credentials, and Amazon ECR stores the container images.
