description: The cluster has only private API endpoint access and its nodes live in subnets with no route to the internet, so every dependency is reached through interface endpoints (ECR API and DKR, EC2,
  STS, CloudWatch Logs, EKS Auth) and an S3 gateway endpoint for image layers. Images are copied into an ECR registry in the same account, and operators reach the API server from a bastion or over Direct
  Connect rather than from the internet.
