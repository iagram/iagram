description: Spoke VPCs attach to a Transit Gateway whose route tables send all inter-VPC and egress traffic through a dedicated inspection VPC, where Network Firewall endpoints sit in their own subnets
  separate from the Transit Gateway attachment subnets. A central egress path through a NAT gateway and internet gateway lets the firewall enforce stateful domain and Suricata rules on all outbound flows.
