description: Two spoke VPCs attach to a Transit Gateway through Transit Gateway ENIs in dedicated subnets; each VPC route table sends the office prefix to the Transit Gateway, whose spoke and on-premises
  route tables steer traffic to a Direct Connect gateway or to the Site-to-Site VPN attachment. Direct Connect, with a transit virtual interface from the router at the DX location, is the primary path and
  the VPN over the internet is the encrypted backup; BGP prefers the Direct Connect route and fails over when it withdraws.
