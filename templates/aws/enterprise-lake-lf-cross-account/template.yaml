description: A central enterprise data lake account holds the shared S3 buckets, Glue Data Catalog and Lake Formation permissions; producer accounts write into it with Glue jobs, and consumer accounts read
  through resource links with Athena, EMR or Redshift Spectrum. Lake Formation creates AWS RAM resource shares for every grant, so catalog changes are visible immediately in all accounts with no copy or
  sync.
