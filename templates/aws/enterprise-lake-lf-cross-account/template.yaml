description: A central enterprise data lake account holds the shared S3 buckets and Glue Data Catalog registered with Lake Formation as the hub; a producer account writes into it with Glue ETL jobs, and
  a consumer account reads through Lake Formation grants with Athena, an EMR notebook, Redshift Spectrum, SageMaker and QuickSight. Lake Formation shares every grant across accounts, so catalog changes
  are visible immediately with no copy or sync.
