description: An advertiser and a publisher each register S3 datasets as Glue Data Catalog tables and associate them as configured tables with analysis rules in an AWS Clean Rooms collaboration, so neither
  party sees the other's raw rows. The member allowed to query runs aggregation or list queries that Clean Rooms executes against the original data locations, writes the results to the querying member's
  S3 bucket and catalogues them for Athena reporting, with CloudTrail logging every query.
