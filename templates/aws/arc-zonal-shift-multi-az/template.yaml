description: A load balancer and Auto Scaling group are pre-scaled across three Availability Zones with a Multi-AZ database behind them. When one zone is impaired, an ARC zonal shift (manual or autoshift)
  temporarily stops the load balancer from sending traffic to that zone for up to three days, without changing the application deployment.
