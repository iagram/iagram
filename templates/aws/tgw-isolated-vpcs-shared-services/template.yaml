title: Network segmentation with Transit Gateway route tables and a shared-services VPC
category: networking
tags:
- transit gateway
- segmentation
- route tables
- isolated vpcs
- shared services
image: https://docs.aws.amazon.com/images/vpc/latest/tgw/images/transit-gateway-overview.png
source: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-isolated-shared.html
description: 'VPCs A, B and C each attach to one Transit Gateway from a public and a private subnet whose instances carry their own network interfaces. Two Transit Gateway route tables implement segmentation:
  the isolated VPCs A and B are associated with a route table that only holds a propagated route to the shared-services VPC C, so they cannot reach each other, while the shared-services attachment uses
  a second route table that propagates routes from every VPC; every workload reaches shared tooling but workload VPCs stay mutually isolated without any VPC peering.'
