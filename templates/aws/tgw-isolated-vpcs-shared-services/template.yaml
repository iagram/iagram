title: Network segmentation with Transit Gateway route tables and a shared-services VPC
category: networking
tags:
- transit gateway
- segmentation
- route tables
- isolated vpcs
- shared services
image: https://docs.aws.amazon.com/images/vpc/latest/tgw/images/transit-gateway-overview.png
source: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-isolated-shared.html
description: 'Two Transit Gateway route tables implement segmentation: the isolated VPCs are associated with a route table that only holds a propagated route to the shared-services VPC and the VPN, so they
  cannot reach each other, while the shared-services and VPN attachments use a second route table that propagates routes from every VPC. The result is a hub where every workload reaches shared tooling and
  on-premises, but workload VPCs stay mutually isolated without any VPC peering.'
