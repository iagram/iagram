source: https://aws.amazon.com/blogs/big-data/streaming-amazon-dynamodb-data-into-a-centralized-data-lake/
description: Kinesis Data Streams for DynamoDB captures item-level modifications from a table and replicates them to a Kinesis data stream. A Firehose delivery stream reads the stream, invokes a Lambda
  transformation to flatten the nested change records, and delivers compressed batches to an S3 data lake that is catalogued in Glue and queried with Athena.
