description: A serverless backend creates Chime SDK meetings and attendees and returns join tokens to browser and mobile clients that exchange WebRTC media with the Chime media service. A media capture
  pipeline records audio, video, content share and data messages into an S3 bucket, a concatenation step assembles the artifacts, and a media insights pipeline configuration streams call analytics into
  Kinesis.
