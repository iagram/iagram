description: The provider places its auto-scaled application instances, protected by a security group, behind a Network Load Balancer that spans two Availability Zones and is registered as a VPC endpoint
  service. Each consumer creates an interface endpoint in its own VPC that surfaces as an elastic network interface in each Availability Zone, next to the consumer instances and inside their security group,
  so the service is reached across the account boundary without internet exposure, peering, or overlapping-CIDR concerns.
