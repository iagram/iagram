description: The provider places its application behind a Network Load Balancer and registers the load balancer with a VPC endpoint service, optionally with a verified private DNS name and acceptance rules
  for consumer accounts. Each consumer creates an interface endpoint in its own VPC that surfaces as elastic network interfaces with private IPs, so the service is reached without internet exposure, peering,
  or overlapping-CIDR concerns.
