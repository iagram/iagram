description: A monitoring account creates an Observability Access Manager sink, and source accounts across the organization create links to it that share CloudWatch metrics, log groups, X-Ray traces and
  Application Signals data without copying it. Dashboards, metric alarms and Logs Insights queries in the monitoring account then span every linked account, and alarm actions publish to an SNS topic for
  the operations team.
