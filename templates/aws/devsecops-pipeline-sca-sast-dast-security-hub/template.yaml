image: https://d2908q01vomqb2.cloudfront.net/7719a1c782a1ba91c031a682a0a2f8658209adbf/2021/01/21/pipeline-architecture.png
source: https://aws.amazon.com/blogs/devops/building-end-to-end-aws-devsecops-ci-cd-pipeline-with-open-source-sca-sast-and-dast-tools/
description: A CodeCommit push starts a CodePipeline in which CodeBuild projects run OWASP Dependency-Check (SCA) and SonarQube or PHPStan (SAST) in parallel, reading scanner secrets from Parameter Store;
  a Lambda function converts the scan reports to the AWS Security Finding Format and imports them into Security Hub, failing the stage when vulnerabilities exceed the threshold. Clean builds are deployed
  by CodeDeploy to an Elastic Beanstalk staging application where a CodeBuild project runs OWASP ZAP (DAST), and after a manual approval a second CodeDeploy stage promotes the release to production; EventBridge
  rules publish pipeline state changes to an SNS topic that emails the team, CloudWatch Logs keeps the build logs, and IAM roles, CloudTrail and AWS Config provide audit and governance.
