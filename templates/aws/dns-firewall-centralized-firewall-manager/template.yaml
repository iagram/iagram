description: A Route 53 Resolver DNS Firewall rule group with block and allow domain lists is authored in the security tooling account and distributed by AWS Firewall Manager policies to every VPC in the
  organization, including new ones. The Route 53 Resolver in each VPC evaluates queries from workloads against the associated rule group before resolving, and on-premises queries that arrive through inbound
  Resolver endpoints receive the same treatment.
