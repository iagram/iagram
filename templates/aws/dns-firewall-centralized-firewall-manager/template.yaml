description: A Route 53 Resolver DNS Firewall rule group with block and allow domain lists is associated with the hybrid-DNS VPC, and AWS Firewall Manager policies can distribute the same rule group to
  every VPC in the organization, including new ones. On-premises clients ask their DNS server, which forwards over highly resilient Direct Connect or Site-to-Site VPN through the virtual private gateway
  to inbound Resolver endpoint ENIs in two Availability Zones; the Route 53 Resolver evaluates each query against the DNS Firewall before answering from the private hosted zone or from external authoritative
  name servers.
