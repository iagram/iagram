source: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
description: An Aurora PostgreSQL Serverless v2 cluster with the pgvector extension is the vector store for a Bedrock knowledge base; Bedrock reaches it through the RDS Data API using credentials in Secrets
  Manager. Embeddings from S3 documents land in a table with an HNSW index and are retrieved at query time by a Lambda function that calls the knowledge base.
