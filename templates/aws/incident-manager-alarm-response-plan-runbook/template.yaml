source: https://docs.aws.amazon.com/incident-manager/latest/userguide/incident-creation.html
description: A CloudWatch alarm with a Systems Manager action and an EventBridge rule targeting a response plan both create incidents in Incident Manager, which deduplicates them, records the involved resources
  and opens a linked OpsItem in OpsCenter. The response plan engages on-call contacts through an escalation plan, posts to a chat channel via SNS and AWS Chatbot, and automatically starts a Systems Manager
  Automation runbook that receives the incident ARN and involved resource ARNs as parameters to remediate the fault.
