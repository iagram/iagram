source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-outbound-inspection-architecture-in-aws-cloud-wan/
description: Inspection VPCs hosting AWS Network Firewall endpoints and NAT gateways are attached to the core network as a network function group instead of a segment. A send-to action in the core network
  policy steers the default route of the production and development segments into the network function group, so internet-bound traffic is inspected in the local Region before leaving through the inspection
  VPC's NAT gateways.
