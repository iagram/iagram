title: Centralized outbound inspection with Cloud WAN service insertion
category: networking
tags:
- cloud wan
- service insertion
- network function group
- network firewall
- centralized egress
image: https://d2908q01vomqb2.cloudfront.net/5b384ce32d8cdef02bc3a139d4cac0a22bb029e8/2023/03/19/figure-1-1.png
source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-outbound-inspection-architecture-in-aws-cloud-wan/
description: A production VPC and an outbound inspection VPC hosting AWS Network Firewall endpoints and NAT gateways in two Availability Zones are attached to an AWS Cloud WAN core network through core
  network ENIs in dedicated subnets. The production segment's route table carries a static 0.0.0.0/0 route to the inspection VPC attachment while the security segment learns both attachments by propagation,
  so internet-bound traffic from the production workload is steered through the firewall endpoint and NAT gateway and leaves through the inspection VPC's internet gateway in the same Region.
