description: Cameras, mobile apps and other producers push time-encoded media data into Kinesis video streams with the producer SDK; the service durably stores and time-indexes fragments for the configured
  retention. Consumers read the media data either as batch consumers (archived fragments) or continuous consumers (live fragments), running on EC2 instances inside AWS or as applications on the public internet.
