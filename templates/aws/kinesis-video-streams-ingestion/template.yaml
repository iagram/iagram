source: https://docs.aws.amazon.com/kinesisvideostreams/latest/dg/how-it-works.html
description: Cameras and other producers push time-encoded media into Kinesis video streams with the producer SDK; the service durably stores and time-indexes fragments for the configured retention. Consumer
  applications on EC2 read fragments with the parser library and call a SageMaker endpoint for frame-level inference, publishing detections to a Kinesis data stream that a Lambda function writes to DynamoDB
  and, for alerts, to SNS.
