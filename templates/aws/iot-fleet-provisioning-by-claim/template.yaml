title: IoT fleet provisioning by claim with pre-provisioning hook
category: iot
tags:
- iot core
- fleet provisioning
- claim certificate
- provisioning template
- pre-provisioning hook
source: https://docs.aws.amazon.com/iot/latest/developerguide/provision-wo-cert.html
description: Devices leave the factory with a shared claim certificate; on first connection they call CreateKeysAndCertificate and RegisterThing against a provisioning template, and IoT Core issues a unique
  X.509 certificate signed by the Amazon Root CA. A pre-provisioning hook Lambda validates the device serial against an allow-list in DynamoDB before the template creates the thing, attaches the policy
  and activates the certificate.
