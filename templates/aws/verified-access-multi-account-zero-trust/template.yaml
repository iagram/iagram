description: A Verified Access instance is deployed in a shared networking account with IAM Identity Center as the trust provider, and Verified Access groups are shared to organizational units via AWS Resource
  Access Manager. Application teams create endpoints for their internal load balancers in workload accounts, and every request is evaluated per user identity and device posture with Cedar policies instead
  of network location.
