- alb
source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/asg-capacity-providers.html
description: An ECS cluster registers container instances from an Auto Scaling group that is wrapped in a capacity provider with managed scaling, so ECS publishes a CapacityProviderReservation metric and
  a target-tracking policy grows or shrinks the group as tasks are placed. An internet-facing ALB in the public subnets forwards to a target group of instance targets in private subnets, and a NAT gateway
  gives the instances outbound access for image pulls and agent traffic.
