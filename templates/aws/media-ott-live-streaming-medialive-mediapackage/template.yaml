description: Guidance for Live Streaming on AWS ingests two redundant contribution feeds from a live channel source into an AWS Elemental MediaLive channel that transcodes them into adaptive bitrate HLS,
  then AWS Elemental MediaPackage packages the output into HLS, DASH and CMAF endpoints. A CloudFront distribution uses the MediaPackage endpoints as its origin and authenticates with a CDN identifier stored
  in Secrets Manager to serve playback devices, and a demo preview player is hosted from an S3 bucket behind a second CloudFront distribution for users.
