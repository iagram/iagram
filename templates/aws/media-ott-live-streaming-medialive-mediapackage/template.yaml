description: Guidance for Live Streaming on AWS ingests two redundant contribution feeds into an AWS Elemental MediaLive channel that transcodes them into adaptive bitrate HLS, then AWS Elemental MediaPackage
  packages the output into HLS, DASH and CMAF endpoints. A CloudFront distribution uses the MediaPackage endpoints as its origin and authenticates with a CDN identifier stored in Secrets Manager, and a
  demo player is hosted from an S3 bucket behind the same distribution.
