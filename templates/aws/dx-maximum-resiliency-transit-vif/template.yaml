description: Two Direct Connect locations each terminate two dedicated connections on separate devices, giving four physical paths that survive device, connection, and complete location failure. A transit
  virtual interface on each connection peers over BGP with a Direct Connect gateway that is associated with the Regional Transit Gateway, so every attached VPC is reachable from the data center over private
  connectivity with a 99.99 percent SLA target.
