source: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
description: Secrets Manager stores database credentials encrypted with a KMS key and invokes a rotation Lambda function on a schedule; the function runs inside the database VPC, sets a new password in
  the database and updates the secret version. The application retrieves the current credentials at runtime through a Secrets Manager VPC endpoint instead of embedding them.
