title: Interactive live streaming with Amazon IVS, chat and auto-record to S3
category: media
tags:
- amazon ivs
- low latency
- live chat
- auto-record
- eventbridge
- cloudfront
image: https://docs.aws.amazon.com/images/ivs/latest/LowLatencyUserGuide/images/CORS_Configuration.png
source: https://docs.aws.amazon.com/ivs/latest/LowLatencyUserGuide/record-to-s3.html
description: Broadcasters push RTMPS to an IVS channel whose recording configuration auto-records HLS renditions and thumbnails into an S3 bucket; IVS emits Recording State Change events to EventBridge,
  and a Lambda target reads the recording metadata to publish VOD playlists through CloudFront with origin access control. An IVS Chat room with a Lambda message-review handler provides moderated chat,
  and a serverless API issues stream keys and chat tokens.
