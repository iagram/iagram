source: https://aws.amazon.com/blogs/big-data/architectural-patterns-for-real-time-analytics-using-amazon-kinesis-data-streams-part-1/
description: Kinesis Data Streams is the central stream storage of the pattern; producers such as mobile apps, clickstream and social feeds, application logs and IoT sensors reach it through the Kinesis
  SDK, the Kinesis Producer Library or Kinesis Agent on EC2, AWS DMS, IoT Core, DynamoDB streams and CloudWatch Logs subscriptions. Events are retained for up to 365 days so stream processors (Managed Service
  for Apache Flink, Lambda, Redshift streaming ingestion, KCL applications, Glue streaming and EMR) can replay them from any position and write results to destinations such as DynamoDB, S3, OpenSearch,
  RDS and event-driven applications.
