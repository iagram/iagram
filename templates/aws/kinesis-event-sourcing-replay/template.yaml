description: Kinesis Data Streams acts as the centralized event store for event-sourcing microservices, retaining events for up to 365 days so consumers can replay them by resetting their position. A Managed
  Service for Apache Flink application maintains stateful aggregates with snapshots persisted to S3, and emits derived events to output streams consumed by Lambda-based microservices behind API Gateway.
