description: Guidance for Product Substitutions on AWS embeds product names and descriptions with Lambda and stores the vectors in an Amazon OpenSearch Service k-NN index seeded from product data in S3
  and DynamoDB. A Cognito-authenticated API Gateway endpoint invokes a query Lambda that finds the nearest neighbours of an out-of-stock item and returns substitute products, with CloudWatch metrics and
  SNS alerts for operations.
