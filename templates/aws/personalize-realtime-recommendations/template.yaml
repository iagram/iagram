description: Historical interactions, items and users are exported to S3 and imported into a Personalize dataset group where a solution version is trained and deployed as a campaign. Clickstream events
  flow through Kinesis to a Lambda that calls PutEvents on the event tracker, and an API Gateway backed Lambda calls GetRecommendations and enriches results with item metadata from DynamoDB.
