description: Historical interactions, items and users are exported to S3 and bulk-imported into a Personalize dataset group, where a solution version is trained and deployed as a campaign (drawn as a Step
  Functions workflow because Personalize has no Terraform resource types); incremental records and clickstream events flow through Kinesis to a Lambda that calls PutEvents on the event tracker. An API Gateway
  backed Lambda calls GetRecommendations on the real-time recommendation API for the application, and a batch inference job reads its input from and writes its recommendations to an S3 bucket.
