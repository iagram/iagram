description: Clients reach a regional REST API only through a CloudFront distribution protected by an AWS WAF web ACL and AWS Shield; a Lambda@Edge function on the origin request signs each call with SigV4
  so API Gateway, configured for IAM authorization, accepts only requests that passed through the edge. A client that calls the API Gateway endpoint directly is rejected because its request carries no valid
  signature.
