description: A CloudFront distribution with a WAF web ACL fronts a regional REST API and injects a secret origin-verify header that a second web ACL on API Gateway requires, so callers cannot bypass the
  edge. The shared secret lives in Secrets Manager and is rotated by a Lambda function that updates both the distribution and the API-side rule.
