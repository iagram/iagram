source: https://aws.amazon.com/blogs/networking-and-content-delivery/serving-private-content-using-amazon-cloudfront-aws-lambdaedge/
description: Users authenticate against a Cognito user pool, and a Lambda@Edge viewer-request function validates the JWT before issuing CloudFront signed cookies whose private key is fetched from Secrets
  Manager. Protected objects stay in a private S3 bucket that only the distribution can read, so unauthenticated or expired requests are rejected at the edge.
