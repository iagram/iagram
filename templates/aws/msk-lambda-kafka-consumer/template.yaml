description: An MSK cluster spreads its brokers over the private subnets of two Availability Zones; a NAT gateway in each public subnet gives the private subnets their outbound path to the Lambda and STS
  control plane. A Lambda event source mapping polls a topic on the cluster, authenticating with SASL/SCRAM credentials from Secrets Manager, and invokes the function with batches of records.
