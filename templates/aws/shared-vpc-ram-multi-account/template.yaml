source: https://aws.amazon.com/blogs/networking-and-content-delivery/vpc-sharing-a-new-approach-to-multiple-accounts-and-vpc-management/
description: A central network account owns one large VPC and shares individual subnets with participant accounts in the same organization through AWS RAM; participants launch instances, load balancers,
  and databases into the shared subnets while the owner keeps control of route tables, NAT gateways, and VPC-level networking. The pattern reduces the number of VPCs, endpoints, and NAT gateways to manage,
  and participant resources communicate over the VPC network without peering or Transit Gateway.
