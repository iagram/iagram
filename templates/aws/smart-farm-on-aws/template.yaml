description: Third-party sensors, drones and FreeRTOS cameras and sensors send data to an IoT Greengrass gateway (with a Lambda protocol converter and a SageMaker edge model) that exports through stream
  manager into Kinesis Data Streams and Kinesis Video Streams; Kinesis Data Firehose loads the S3 data lake continuously while Managed Service for Apache Flink derives real-time insights and notifies users
  through SNS, and OpenSearch behind API Gateway serves queries to client, mobile and web users. Glue Data Catalog, Athena and QuickSight store, visualize and query the lake, SageMaker and Ground Truth
  train the edge models, IoT Core Device Management and Device Defender manage the fleet with a Lambda importer forwarding Defender reports to Security Hub, and Direct Connect and PrivateLink bring in existing
  on-premises data and third-party sensor data from S3.
