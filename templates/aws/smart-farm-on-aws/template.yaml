description: Field sensors and cameras send data through Greengrass stream manager into Kinesis Data Streams and Kinesis Video Streams; Managed Service for Apache Flink derives real-time insights and notifies
  users through SNS, while S3, Glue, Athena and OpenSearch form the analytics layer. SageMaker trains edge-inference models and a Lambda importer forwards Device Defender reports to Security Hub.
