description: A Lambda function in a web-store producer account publishes "New order created" events straight to a central event bus in a shared account; a resource policy on the central bus grants PutEvents
  to the organization. Rules on the central bus subscribe consumer accounts, forwarding the event to an invoice-processing bus whose rule invokes a Lambda function and to a forecasting bus whose rule starts
  a Step Functions workflow.
