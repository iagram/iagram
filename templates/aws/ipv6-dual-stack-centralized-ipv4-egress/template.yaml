image: https://docs.aws.amazon.com/images/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/images/centralized-ipv4-egress-and-decentralized-outbound-ipv6.png
source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-egress-for-ipv6.html
description: Spoke VPCs carry both an IPv4 CIDR and an Amazon-provided IPv6 CIDR; IPv4 default routes go to the Transit Gateway and out through NAT gateways in a central egress VPC. Because IPv6 addresses
  are globally unique and NAT is not required, each spoke keeps its own egress-only internet gateway for the "::/0" route, so IPv6 traffic leaves locally while inbound IPv6 connections remain blocked.
