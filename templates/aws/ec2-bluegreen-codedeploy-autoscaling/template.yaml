title: EC2 blue/green deployment with CodeDeploy, Auto Scaling and a load balancer
category: devops
tags:
- codedeploy
- ec2
- auto scaling
- blue/green
- elb
- codepipeline
source: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments-create-console-blue-green.html
description: A CodeDeploy deployment group on the EC2/On-premises platform copies the current (blue) Auto Scaling group into a replacement (green) group, installs the revision from the pipeline artifact
  bucket on the new instances, and registers them with the load balancer target group once healthy. Traffic is rerouted from the original instances to the replacement instances, and the original Auto Scaling
  group is terminated after a configurable wait so a rollback simply reregisters the blue fleet.
