description: An existing application publishes to a RabbitMQ queue on an Amazon MQ broker in a private subnet; a Lambda event source mapping polls the queue every 100 ms using broker credentials from Secrets
  Manager and invokes the function with a batch. Processed messages are persisted to DynamoDB, so the legacy producer is integrated without a consumer fleet.
