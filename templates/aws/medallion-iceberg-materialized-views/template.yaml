description: Raw trips are appended to a bronze Iceberg table in an S3 table bucket, the silver layer is a scheduled Iceberg materialized view that cleans and enriches only new or changed rows, and two
  gold materialized views (city daily metrics and vehicle performance) refresh daily from it; all views are authored in SageMaker Unified Studio and nested views give implicit lineage. Athena, Amazon Quick,
  Redshift and Iceberg REST API clients query the gold layer.
