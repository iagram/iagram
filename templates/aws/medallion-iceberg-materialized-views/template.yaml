description: Raw bronze data is ingested into Iceberg tables in an S3 table bucket, and the silver and gold layers are each defined as a scheduled Iceberg materialized view authored in SageMaker Unified
  Studio. Glue uses Iceberg change-tracking metadata to refresh only changed rows through Spark, nested views give implicit lineage, and Athena and Redshift query the gold layer.
