description: Amazon Redshift streaming ingestion consumes a Kinesis data stream or an Amazon MSK topic directly into a streaming table that a real-time materialized view refreshes, removing the S3 staging
  step of the traditional Firehose and COPY pipeline. Transformations run in Redshift SQL against the auto-refreshed view and its results are joined with permanent tables with seconds of latency.
