description: The fleet is overprovisioned so that the instances in any two of three Availability Zones can carry full load; an AZ impairment therefore requires no new launches and no dependency on EC2 or
  Auto Scaling control planes. Golden AMIs and launch templates are pre-baked, the database runs active-standby across zones, and cross-zone traffic is kept zone-local where possible.
