description: An Application Load Balancer fronts an Auto Scaling group whose EC2 instances are spread over three Availability Zones and overprovisioned so that the instances in any two zones can carry full
  load. An AZ impairment therefore requires no new launches and no dependency on the EC2 or Auto Scaling control planes; the load balancer simply stops routing to the impaired zone.
