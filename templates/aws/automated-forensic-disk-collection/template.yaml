source: https://aws.amazon.com/blogs/security/how-to-automate-forensic-disk-collection-in-aws/
description: A GuardDuty or Security Hub finding matched by an EventBridge rule invokes a Lambda function that starts a Step Functions workflow, which snapshots the suspect instance's EBS volumes, shares
  and copies them with KMS encryption into a separate forensics account. Collector instances in an isolated forensics VPC stream bit-for-bit disk images into an evidence S3 bucket while every step is logged
  for chain of custody.
