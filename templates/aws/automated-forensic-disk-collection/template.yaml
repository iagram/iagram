description: A GuardDuty finding in the monitored account is forwarded by Security Hub to the administrator in the security account, where an EventBridge rule invokes a Lambda function that starts a Step
  Functions workflow. The workflow assumes a member automation role, snapshots the compromised instance's attached EBS volumes as encrypted snapshots, shares them with the security account, creates volumes
  from the shared snapshots and attaches them to a collector instance that streams bit-for-bit disk images into an evidence S3 bucket.
