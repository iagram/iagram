description: For AWS service logs that are only reachable through an API, such as RDS and WAF logs, an EventBridge schedule triggers a log-retrieval Lambda that pulls the logs and writes them to a log bucket;
  S3 event notifications reach an EventBridge rule that triggers a log processor Lambda, which reads each object, parses it and indexes it into an OpenSearch domain. Records that fail processing are written
  to a backup bucket and dashboards are served from OpenSearch Dashboards.
