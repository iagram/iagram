source: https://docs.aws.amazon.com/solutions/latest/centralized-logging-with-opensearch/service-log-analytics-pipeline.html
description: AWS service logs such as CloudTrail, ALB access logs and VPC flow logs are delivered to a log bucket, either directly or through CloudWatch Logs and a Kinesis Data Firehose subscription; S3
  event notifications queue new objects in SQS and a log processor Lambda parses and indexes them into an OpenSearch domain. Records that fail processing are written to a backup bucket and dashboards are
  served from OpenSearch Dashboards.
