description: Guidance for Unified Commerce on AWS applies MACH principles so web, mobile, store and in-game channels reach frontend experience apps (CloudFront, S3, Cognito, WAF), serverless web and POS
  apps on Lambda and DynamoDB, and one AWS AppSync aggregation API that fronts product, pricing and customer microservices on DynamoDB and Neptune, Internet SaaS applications, COTS order management on EC2
  and RDS in a VPC, and enterprise WMS/ERP systems. Every service publishes events to an EventBridge custom bus; consumers stream them to an S3 data platform catalogued as a data lake and queried with Redshift
  and Athena, drive Pinpoint customer engagement, and feed SageMaker Canvas and SageMaker forecasts back to the channels.
