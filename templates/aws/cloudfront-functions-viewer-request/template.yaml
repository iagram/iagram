image: https://d2908q01vomqb2.cloudfront.net/da4b9237bacccdf19c0760cab7aec4a8359010b0/2021/04/01/cloudfront-functions-where-1024x532.png
source: https://aws.amazon.com/blogs/aws/introducing-cloudfront-functions-run-your-code-at-the-edge-with-low-latency-at-any-scale/
description: CloudFront Functions run sub-millisecond JavaScript at every edge location on viewer-request and viewer-response events for cache-key normalization, URL rewrites and redirects, header manipulation,
  and cookie-based A/B routing, so each client is served by the edge location closest to it. Heavier logic such as network calls or origin selection runs in Lambda@Edge at the regional edge location, which
  fetches from the origin on a cache miss.
