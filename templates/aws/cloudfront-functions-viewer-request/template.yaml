title: Lightweight edge logic with CloudFront Functions
category: edge
tags:
- cloudfront functions
- url rewrite
- header manipulation
- a/b testing
- cache key
source: https://aws.amazon.com/blogs/aws/introducing-cloudfront-functions-run-your-code-at-the-edge-with-low-latency-at-any-scale/
description: CloudFront Functions run sub-millisecond JavaScript at every edge location on viewer-request and viewer-response events for cache-key normalization, URL rewrites and redirects, header manipulation,
  and cookie-based A/B routing. Heavier logic such as network calls or origin selection stays in Lambda@Edge, while the origin content comes from S3 and an Application Load Balancer.
