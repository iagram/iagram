source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/trace-data.html
description: Each ECS task definition adds an aws-otel-collector sidecar container that receives OTLP spans and metrics from the instrumented application container over localhost, and its configuration
  is loaded from an SSM Parameter Store parameter. The collector exports traces to AWS X-Ray, application metrics to CloudWatch (EMF) or to an Amazon Managed Service for Prometheus workspace, and its own
  logs to CloudWatch Logs through the task role permissions.
