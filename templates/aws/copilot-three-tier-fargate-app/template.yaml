description: Copilot provisions an environment (a VPC with a public and a private subnet in each of two Availability Zones, an ECS cluster and an ALB) and deploys a Load Balanced Web Service whose Fargate
  tasks run in the public subnet of every zone; the ALB listener rule forwards internet traffic to a target group that fans out to the tasks in both zones. A Backend Service reachable only by its service
  discovery name inside the environment completes the application tier, and a storage addon adds an Aurora Serverless v2 PostgreSQL cluster in the private subnets.
