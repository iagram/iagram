title: Three-tier ECS Fargate application scaffolded with AWS Copilot
category: containers
tags:
- copilot
- ecs
- fargate
- load balanced web service
- backend service
- aurora serverless
- cloud map
image: https://user-images.githubusercontent.com/879348/86045951-39762880-ba01-11ea-9a47-fc9278600154.png
source: https://aws.github.io/copilot-cli/docs/concepts/services/
description: Copilot provisions an environment (VPC with public and private subnets, an ECS cluster, a Cloud Map namespace and an ALB) and then deploys a Load Balanced Web Service that receives internet
  traffic through the ALB plus a Backend Service that is reachable only by service discovery name inside the environment. A storage addon adds an Aurora Serverless v2 PostgreSQL cluster whose credentials
  are injected into the backend as a secret, each service gets its own ECR repository, and a Copilot pipeline can build and deploy on every push.
