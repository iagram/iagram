description: A Debezium MySQL source connector on MSK Connect monitors an Aurora MySQL cluster and pushes row-level changes to Kafka topics on an MSK cluster, serializing records against schemas in the
  AWS Glue Schema Registry. A Confluent S3 sink connector, also on MSK Connect, deserializes the topics and writes Parquet files to an S3 bucket for downstream consumers.
