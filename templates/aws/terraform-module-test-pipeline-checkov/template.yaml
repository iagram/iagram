- codebuild
- checkov
- terraform test
- infrastructure testing
image: https://d2908q01vomqb2.cloudfront.net/7719a1c782a1ba91c031a682a0a2f8658209adbf/2024/04/05/TF_MODULE_VALIDATION_PIPELINE_BASIC_WITH_KEY_NEW_UPDATED-2.png
source: https://aws.amazon.com/blogs/devops/terraform-ci-cd-and-testing-on-aws-with-the-new-terraform-test-framework/
description: Pushes to a CodeCommit repository trigger a CodePipeline whose first CodeBuild project runs Checkov static analysis against the Terraform module and whose second project runs terraform init,
  terraform validate and terraform test to create, assert and destroy ephemeral resources. Test runs use a CodeBuild service role scoped to the resources under test, and pipeline artifacts and test reports
  are stored in S3 so a failing check blocks promotion of the module.
