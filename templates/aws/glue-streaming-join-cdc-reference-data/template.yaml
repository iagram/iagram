description: AWS DMS continuously replicates a reference table from Aurora MySQL into DynamoDB while application events flow into a Kinesis data stream. An AWS Glue streaming job joins each micro-batch
  with the DynamoDB reference data and upserts the enriched records into an Apache Hudi table on S3 that Athena queries through the Glue Data Catalog.
