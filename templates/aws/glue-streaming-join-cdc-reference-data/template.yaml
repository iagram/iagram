description: A sample producer in an AWS Cloud9 environment writes records into a Kinesis data stream while AWS DMS continuously replicates a MySQL reference table into DynamoDB. An AWS Glue streaming job
  joins each micro-batch with the DynamoDB reference data and upserts the enriched records into an Apache Hudi table on S3, syncing the table to the Glue Data Catalog so analysts can query it with Athena.
