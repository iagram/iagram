title: Three-tier web application
category: web
tags: [three-tier, alb, auto scaling, rds, multi-az]
image: https://builder.aws.com/assets/og-hiXAX-on.png
source: https://docs.aws.amazon.com/whitepapers/latest/web-application-hosting-best-practices/an-aws-cloud-architecture-for-web-hosting.html
description: The classic AWS web hosting architecture. Route 53 and CloudFront front an Application Load Balancer; web servers in an Auto Scaling group span two Availability Zones and a Multi-AZ RDS database sits in private subnets.
nodes:
  - {id: users, type: common.users, name: users, step: "1", at: [1, 1]}
  - {id: acct, type: account, name: prod, at: [1, 2]}
  - {id: reg, type: region, name: eu-west-1, parent: acct, props: {region: eu-west-1}}
  - {id: dns, type: route53_zone, name: example.com, parent: reg, props: {domain: example.com}, at: [1, 1]}
  - {id: cdn, type: cloudfront_distribution, name: edge, parent: reg, at: [2, 1]}
  - {id: vpc, type: vpc, name: main, parent: reg, props: {cidr: 10.0.0.0/16}, at: [1, 2, 2, 1]}
  - {id: az-a, type: availability_zone, name: a, parent: vpc, props: {zone: a}, at: [2, 1]}
  - {id: az-b, type: availability_zone, name: b, parent: vpc, props: {zone: b}, at: [2, 2]}
  - {id: pub-a, type: subnet, name: public-a, parent: az-a, props: {cidr: 10.0.1.0/24, az: a, public: true}, at: [1, 1]}
  - {id: priv-a, type: subnet, name: private-a, parent: az-a, props: {cidr: 10.0.11.0/24, az: a}, at: [2, 1]}
  - {id: pub-b, type: subnet, name: public-b, parent: az-b, props: {cidr: 10.0.2.0/24, az: b, public: true}, at: [1, 1]}
  - {id: priv-b, type: subnet, name: private-b, parent: az-b, props: {cidr: 10.0.12.0/24, az: b}, at: [2, 1]}
  - {id: alb, type: alb, name: web-alb, parent: vpc, at: [1, 1, 1, 2]}
  - {id: web-a, type: ec2_instance, name: web-a, parent: pub-a}
  - {id: web-b, type: ec2_instance, name: web-b, parent: pub-b}
  - {id: db, type: rds_instance, name: app-db, parent: priv-a, props: {multi_az: true}}
  - {id: sg, type: security_group, name: web-sg, parent: vpc, at: [1, 3]}
edges:
  - {from: users, to: dns, label: DNS, step: "1"}
  - {from: dns, to: cdn}
  - {from: cdn, to: alb, step: "2"}
  - {from: alb, to: web-a, step: "3"}
  - {from: alb, to: web-b}
  - {from: sg, to: web-a}
  - {from: sg, to: web-b}
  - {from: web-a, to: db, step: "4"}
  - {from: web-b, to: db}
steps:
  - {n: "1", text: "Users resolve the site in Route 53 and reach the CloudFront edge."}
  - {n: "2", text: "CloudFront forwards dynamic requests to the Application Load Balancer."}
  - {n: "3", text: "The load balancer spreads traffic over web servers in two Availability Zones."}
  - {n: "4", text: "Web servers read and write the Multi-AZ RDS database in the private subnets."}
