source: https://aws.amazon.com/blogs/architecture/architecting-a-highly-available-serverless-microservices-based-ecommerce-site/
description: A static frontend on S3 and CloudFront talks to independently deployable product, cart, and order microservices exposed through API Gateway and implemented as Lambda functions, each owning
  its DynamoDB table. Checkout hands off to an SQS queue and a Step Functions workflow that processes payment and fulfilment asynchronously and confirms the order over SES, while Cognito authenticates shoppers.
