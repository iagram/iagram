source: https://aws.amazon.com/blogs/architecture/architecting-a-highly-available-serverless-microservices-based-ecommerce-site/
description: End users load the static storefront from S3 through CloudFront, authenticate against an authentication layer (Cognito), and send dynamic traffic to an API Gateway backed by a Lambda application
  server that validates the token and submits orders to DynamoDB. A second Lambda picks each new order from the table and starts a Step Functions workflow that updates the order status, confirms it over
  SES, charges the external payment system and hands batches to the external shipment system twice a week, with CloudWatch monitoring the whole flow.
