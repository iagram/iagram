description: Planning, execution and shipment-status data from ERP and CRM systems, edge devices and streams is ingested with DMS, DataSync, Kinesis and AppFlow into an S3 data lake built with Lake Formation
  and transformed by Glue. Athena and QuickSight give planners cross-category scorecards, Redshift and EMR handle warehouse and big data processing, SageMaker trains models and Neptune answers network queries.
