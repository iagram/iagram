source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/supply-chain-data-lake/supply-chain-data-lake.html
description: Supply chain data from on-premises SQL/NoSQL databases and file shares, logs, devices, social and media streams and SaaS ERP/CRM applications is ingested with DMS, DataSync, Kinesis Data Streams,
  MSK, IoT Core, AppFlow and Data Exchange into an S3 data lake governed by Lake Formation that holds demand plans, production plans, transfer orders, shipment status, external events, pick orders, carriers,
  weather, product inventory, product returns, fleet data and tenders. Glue crawlers and ETL jobs maintain the Data Catalog, while Athena and QuickSight give planners scorecards, Redshift and EMR handle
  warehouse and big data processing, SageMaker trains models and Neptune answers network queries.
