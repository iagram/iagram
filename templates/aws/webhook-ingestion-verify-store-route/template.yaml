description: A SaaS provider posts webhooks to an API Gateway endpoint; a Lambda function verifies the HMAC signature with a secret from Secrets Manager, deduplicates by event ID, stores the payload in
  S3 and the metadata in DynamoDB. An EventBridge pipe reads the DynamoDB stream and routes each event type to a Step Functions workflow or a Lambda handler.
