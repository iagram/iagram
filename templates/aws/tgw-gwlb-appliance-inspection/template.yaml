image: https://d2908q01vomqb2.cloudfront.net/5b384ce32d8cdef02bc3a139d4cac0a22bb029e8/2020/12/15/GWLB_TGW_FIGURE1.jpg
source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-inspection-architecture-with-aws-gateway-load-balancer-and-aws-transit-gateway/
description: Two spoke VPCs (10.0.0.0/24 and 10.0.1.0/24) attach to a Transit Gateway through a TGW ENI in each Availability Zone; the TGW egress route table sends 0.0.0.0/0 to the appliance VPC attachment
  and the transit route table returns each spoke prefix to its own attachment. The appliance VPC (192.168.1.0/24) has, per Availability Zone, a Transit Gateway subnet with the TGW ENI, an appliance subnet
  with a Gateway Load Balancer endpoint and third-party virtual appliances, and a NAT gateway subnet; a Gateway Load Balancer fronts the appliances, traffic reaches them GENEVE-encapsulated through the
  endpoint, and inspected traffic leaves through the NAT gateway and the internet gateway, with appliance mode on the attachment keeping flows symmetric.
