source: https://aws.amazon.com/blogs/networking-and-content-delivery/centralized-inspection-architecture-with-aws-gateway-load-balancer-and-aws-transit-gateway/
description: A security VPC hosts a Gateway Load Balancer fronting a fleet of third-party firewall appliances in an Auto Scaling group; Gateway Load Balancer endpoints in the same VPC are the routable next
  hop for traffic arriving from the Transit Gateway. East-west and egress traffic from spoke VPCs is routed to the endpoints, encapsulated in GENEVE to the appliances, and returned transparently to the
  Transit Gateway, with appliance mode ensuring symmetric flows.
