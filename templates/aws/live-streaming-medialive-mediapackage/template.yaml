source: https://docs.aws.amazon.com/solutions/latest/live-streaming-on-aws/solution-overview.html
description: A contribution encoder pushes a live feed to an AWS Elemental MediaLive input, and a MediaLive channel encodes it into an adaptive bitrate ladder that is sent to a MediaPackage channel. MediaPackage
  packages the stream as HLS, DASH, and CMAF endpoints that a CloudFront distribution delivers to viewers, with an optional demo player hosted on S3.
