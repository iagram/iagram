image: https://d2908q01vomqb2.cloudfront.net/5b384ce32d8cdef02bc3a139d4cac0a22bb029e8/2020/12/10/tgw-high-level-architecture-fig-1-v1.png
source: https://aws.amazon.com/blogs/networking-and-content-delivery/simplify-sd-wan-connectivity-with-aws-transit-gateway-connect/
description: A third-party SD-WAN virtual appliance runs in a dedicated Connect VPC whose VPC attachment serves as the underlay for a Transit Gateway Connect attachment; the appliance is a Connect peer
  that builds a GRE tunnel to the Transit Gateway and exchanges routes over BGP, and three workload VPCs (A, B, C) hang off the same Transit Gateway through VPC attachments. The corporate SD-WAN site reaches
  the appliance over Direct Connect and the SD-WAN overlay, branch sites reach it through the overlay over Site-to-Site VPN, and their prefixes are propagated dynamically into TGW route tables without IPsec
  throughput limits or static routes.
