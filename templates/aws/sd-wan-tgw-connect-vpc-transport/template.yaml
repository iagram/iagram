source: https://aws.amazon.com/blogs/networking-and-content-delivery/simplify-sd-wan-connectivity-with-aws-transit-gateway-connect/
description: SD-WAN virtual appliances run in a dedicated transport VPC whose attachment serves as the underlay for a Transit Gateway Connect attachment; each appliance is a Connect peer that builds a GRE
  tunnel to the Transit Gateway and exchanges routes over BGP. Branch sites reach the appliances through the SD-WAN overlay across the internet, and their prefixes are propagated dynamically into TGW route
  tables without IPsec throughput limits or static routes.
