source: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
description: A pipeline in the tooling account encrypts its S3 artifact store with a customer managed KMS key whose key policy and bucket policy grant the workload account access, and the CodePipeline service
  role is allowed to assume a cross-account role there. The deploy action runs with that role ARN against a CodeDeploy application and deployment group owned by the workload account, whose EC2 instance
  profile can read the artifact bucket and decrypt with the key.
