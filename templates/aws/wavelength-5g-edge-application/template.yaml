description: A VPC in the parent region is extended with a subnet in a Wavelength Zone inside the carrier network; EC2 instances there serve mobile devices through a carrier gateway that NATs Carrier IP
  addresses and admits only traffic from the carrier network. Latency-sensitive inference runs at the edge while state, control plane and analytics stay in regional subnets reached over the VPC local route.
