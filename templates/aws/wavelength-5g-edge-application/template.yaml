image: https://docs.aws.amazon.com/images/wavelength/latest/developerguide/images/aws-wz.png
source: https://docs.aws.amazon.com/wavelength/latest/developerguide/how-wavelengths-work.html
description: A VPC in the parent region spans two regional Availability Zones (A and B) and is extended with a subnet in a Wavelength Zone inside the communications service provider (CSP) network; each
  subnet hosts EC2 instances. A carrier gateway at the edge of the Wavelength Zone NATs Carrier IP addresses and admits only traffic from the CSP network, so mobile devices on the 5G network reach the edge
  instances with minimal latency while the regional subnets keep the rest of the application in the parent region.
