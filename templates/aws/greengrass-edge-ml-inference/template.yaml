description: Models are trained in SageMaker and stored in S3, then deployed to Greengrass core devices as model, runtime and inference components so that inference runs locally on camera or sensor data.
  Inference results and low-confidence samples are published through IoT Core to a Kinesis stream and an S3 bucket that feeds the next training round.
