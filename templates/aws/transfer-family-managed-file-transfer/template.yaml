description: Partners connect over SFTP or FTPS to a Transfer Family server resolved through Route 53; a custom identity provider built on API Gateway and Lambda authenticates them against Cognito, looks
  up entitlements in Aurora and returns a scoped IAM policy with logical directory mappings into S3. Inbound files land in S3 and trigger a Lambda that queries subscriptions, optionally runs AWS Batch transformations
  and pushes outputs to customer SFTP destinations.
