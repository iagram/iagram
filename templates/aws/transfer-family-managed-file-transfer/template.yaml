description: Partners connect over SFTP or FTPS from an FTP client to a Transfer Family server resolved through Route 53; a custom identity provider built on API Gateway and Lambda authenticates them against
  Cognito, looks up entitlements in Aurora and returns a scoped IAM policy with logical directory mappings into S3. Inbound files land in S3 and trigger an outbound Lambda that runs an AWS Batch transform
  job when needed and an AWS Batch send job that pushes outputs to the partner FTP server.
