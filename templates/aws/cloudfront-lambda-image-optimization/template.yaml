description: A CloudFront Function normalizes the requested width and format on the viewer request; CloudFront first tries an S3 bucket of already transformed images and, on a 403 miss, fails over to a
  Lambda function URL. The function fetches the original from S3, resizes it with Sharp, stores the variant back in the transformed bucket and returns it for caching.
