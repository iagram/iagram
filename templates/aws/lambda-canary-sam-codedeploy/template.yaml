source: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
description: AWS SAM publishes a new Lambda version, keeps a live alias, and hands traffic shifting to a CodeDeploy application on the Lambda compute platform using a preference such as Canary10Percent10Minutes
  or Linear10PercentEvery1Minute. Pre-traffic and post-traffic hook functions validate the release, and CloudWatch alarms on the alias error metrics trigger an automatic rollback if they fire during the
  shift.
