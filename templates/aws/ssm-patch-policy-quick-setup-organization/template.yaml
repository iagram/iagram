source: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-policies.html
description: A Quick Setup patch policy defined in the management account creates State Manager associations in every target account and Region that run the AWS-RunPatchBaseline document on separate scan
  and install schedules against the patch baseline selected per operating system. Patch compliance results are reported per account-Region pair, exported as CSV to an S3 bucket, and can be forwarded to
  Security Hub, while custom baselines are shared through an S3 bucket of baseline overrides.
