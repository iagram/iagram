image: https://docs.aws.amazon.com/images/sagemaker/latest/dg/images/projects/projects-templates-gitjenkins.png
source: https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-projects-templates-sm.html
description: The SageMaker-provided MLOps template with third-party Git repositories seeds a model-build and a model-deploy GitHub repository through a CodeBuild project and a Lambda check-in function,
  then a model-build pipeline (CodePipeline or Jenkins) checks out the build repository through a CodeStar connection, installs the AWS CLI and runs a SageMaker pipeline whose processing, training and evaluation
  steps write model artifacts to S3 and register the model in the Model Registry. On model approval an EventBridge rule invokes a Lambda that triggers the model-deploy pipeline, which builds CloudFormation
  templates into S3 and deploys the stack to a staging endpoint and, after testing and manual approval, to production.
