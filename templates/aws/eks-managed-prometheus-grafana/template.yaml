description: An AWS Distro for OpenTelemetry collector deployed in the EKS cluster scrapes pod, node and application metrics and remote-writes them to an Amazon Managed Service for Prometheus workspace,
  where recording and alerting rules evaluate them and alert manager forwards firing alerts to SNS. An Amazon Managed Grafana workspace queries the Prometheus workspace as a data source, users authenticate
  through IAM Identity Center, and dashboards are provisioned by the AWS Observability Accelerator.
