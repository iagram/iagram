description: DevOps engineers provision the stack with Terraform; an AWS Distro for OpenTelemetry collector deployed in the EKS cluster scrapes the application pods and, through an IAM role, remote-writes
  the metrics to a multi-AZ Amazon Managed Service for Prometheus workspace whose ruler and alert manager evaluate recording and alerting rules and ship their logs to CloudWatch and S3. An Amazon Managed
  Grafana workspace queries the Prometheus workspace as a data source through its own IAM role, users authenticate with IAM Identity Center to visualise the dashboards, and CloudTrail records the API audit
  logs of both workspaces.
