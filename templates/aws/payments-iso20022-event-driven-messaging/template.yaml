description: Guidance for ISO 20022 Messaging Workflows on AWS receives payment messages through a Cognito-protected API Gateway, assigns a transaction ID recorded in DynamoDB, and passes the message through
  incoming, processing and releasing microservices connected by FIFO SQS queues. Each stage persists the ISO 20022 payload to S3 and updates the transaction status (ACCP, ACTC, ACSP, ACSC or RJCT); a timeout
  function rejects transactions that exceed the SLA and SNS notifies consumers when an outgoing message is ready.
