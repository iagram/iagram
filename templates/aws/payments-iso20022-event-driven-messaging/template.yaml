description: Guidance for ISO 20022 Messaging Workflows on AWS receives payment messages through a Cognito-protected API Gateway reached via Route 53 and protected by AWS WAF, assigns a transaction ID recorded
  in DynamoDB, and passes the message through incoming, consuming and releasing microservices connected by FIFO SQS queues, with FIPS 140-2, KYC/AML and fraud/liquidity microservices invoked during consumption.
  Each stage persists the ISO 20022 payload to S3 and updates the transaction status (ACCP, ACTC, ACSP, ACSC or RJCT); a timeout function rejects transactions that exceed the SLA, SNS notifies consumers
  when an outgoing message is ready, and reader and writer MQ microservices bridge Amazon MQ to an on-premises messaging queue, mainframe and Db2 database over Direct Connect or Site-to-Site VPN.
