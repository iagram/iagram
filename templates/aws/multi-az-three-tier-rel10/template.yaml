description: Web and application tiers run in Auto Scaling groups spread over three Availability Zones behind an Application Load Balancer, while RDS Multi-AZ keeps a synchronous standby in a second zone
  and S3 and DynamoDB are Multi-AZ by design. Loss of any one zone leaves capacity and data intact and the load balancer stops routing to unreachable targets.
