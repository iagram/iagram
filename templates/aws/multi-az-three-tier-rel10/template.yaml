description: EC2 instances in an Auto Scaling group spread over three Availability Zones sit behind Elastic Load Balancing, with a NAT gateway per zone for egress, while RDS Multi-AZ keeps a synchronous
  standby in a second zone and S3 and DynamoDB are Multi-AZ by design. Loss of any one zone leaves capacity and data intact and the load balancer stops routing to unreachable targets.
