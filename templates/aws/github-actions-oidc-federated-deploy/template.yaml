title: GitHub Actions deploying to AWS with OIDC federation instead of access keys
category: devops
tags:
- github actions
- oidc
- iam
- sts
- ecr
- ecs
- keyless
source: https://aws.amazon.com/blogs/security/use-iam-roles-to-connect-github-actions-to-actions-in-aws/
description: An IAM OpenID Connect identity provider trusts token.actions.githubusercontent.com, and an IAM role trust policy restricts sts AssumeRoleWithWebIdentity to a specific repository and branch
  through the sub and aud claims. The workflow uses aws-actions/configure-aws-credentials to exchange the GitHub-issued JWT for short-lived credentials, then pushes an image to ECR and updates an ECS service,
  so no long-lived IAM user keys are stored as GitHub secrets.
