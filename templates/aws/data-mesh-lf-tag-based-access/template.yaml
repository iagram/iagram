source: https://aws.amazon.com/blogs/big-data/build-a-modern-data-architecture-and-data-mesh-pattern-at-scale-using-aws-lake-formation-tag-based-access-control/
description: A producer account stores domain data in S3 and crawls it with Glue, a central governance account owns the Lake Formation catalog, LF-tag ontology and cross-account shares through AWS RAM,
  and a consumer account queries through resource links with Athena. Permissions are granted on tags such as line of business and classification rather than on individual tables, so producers keep ownership
  while governance stays central.
