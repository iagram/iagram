source: https://aws.amazon.com/blogs/big-data/build-a-modern-data-architecture-and-data-mesh-pattern-at-scale-using-aws-lake-formation-tag-based-access-control/
description: A producer account stores domain data in S3 and registers it with its own Lake Formation as databases and tables, a central governance account owns the Lake Formation catalog and the LF-tag
  ontology (line of business, function, classification) and shares tagged tables cross-account through AWS RAM, and a consumer account queries through resource links with Athena. Permissions are granted
  on tags rather than on individual tables, so producer stewards keep ownership while the data mesh owner keeps governance central and consumer admins grant access to their analysts.
