source: https://aws.amazon.com/blogs/compute/using-amazon-sqs-dead-letter-queues-to-replay-messages
description: An application producer sends messages to a main queue that an application consumer reads; messages that fail processing land in a dead-letter queue, and a replay Lambda function moves them
  back to the main queue with a delay computed by exponential backoff and a retry counter in message attributes. Messages that exceed the retry limit are parked in a second dead-letter queue that operators
  inspect manually.
