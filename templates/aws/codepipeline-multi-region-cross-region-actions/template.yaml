source: https://aws.amazon.com/blogs/devops/using-aws-codepipeline-to-perform-multi-region-deployments/
description: A single pipeline in the primary Region takes application code from an S3 source bucket and declares one artifact store bucket per target Region; CodePipeline replicates the input artifact
  to the artifact store of each Region before a cross-Region action runs there. Parallel CloudFormation deploy actions in us-west-2, us-east-1 and ap-southeast-2 create or update stacks that provision EC2
  instances with the CodeDeploy agent and hand the revision to CodeDeploy, so every Region receives the same release in one execution.
