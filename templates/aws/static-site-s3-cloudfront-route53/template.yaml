- {id: reg-us-east-1, type: aws.region, name: us-east-1, parent: acct-prod, props: {region: us-east-1}}
- {id: grp-global-edge, type: common.group, name: global edge, parent: reg-us-east-1}
- {id: users, type: common.users, name: users}
- {id: example-com, type: aws.route53_zone, name: example-com, parent: reg-us-east-1, props: {domain: example.com}}
- {id: site-cert, type: aws.res.aws_acm_certificate, name: site-cert, parent: reg-us-east-1}
- {id: site-cdn, type: aws.cloudfront_distribution, name: site-cdn, parent: grp-global-edge}
- {id: site-content, type: aws.s3_bucket, name: site-content, parent: reg-us-east-1}
- {id: cdn-logs, type: aws.s3_bucket, name: cdn-logs, parent: reg-us-east-1}
edges:
- {from: users, to: example-com, label: DNS lookup, step: '1'}
- {from: example-com, to: site-cdn, label: alias A/AAAA, step: '2'}
- {from: users, to: site-cdn, label: HTTPS (ACM cert), step: '3'}
- {from: site-cdn, to: site-content, label: origin fetch via OAC on cache miss, step: '4'}
- {from: site-cdn, to: cdn-logs, label: access logs}
- {from: site-cert, to: site-cdn, label: TLS certificate}
steps:
- {n: '1', text: 'users → example-com: DNS lookup'}
