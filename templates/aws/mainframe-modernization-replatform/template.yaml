title: Mainframe replatform with AWS Mainframe Modernization
category: migration
tags:
- mainframe modernization
- replatform
- cobol
- managed runtime
- rocket software
- dms
- aurora
image: https://docs.aws.amazon.com/images/m2/latest/userguide/images/m2-workflow.png
source: https://docs.aws.amazon.com/m2/latest/userguide/what-is-m2.html
description: COBOL and PL/I applications are recompiled largely unchanged and deployed from S3 into an AWS Mainframe Modernization managed runtime environment (Rocket Software / Micro Focus replatform pattern)
  fronted by a load balancer. DB2 and VSAM data is migrated with DMS into Aurora PostgreSQL, batch and application files move to EFS or FSx, and CI/CD is driven from CloudFormation.
