source: https://docs.aws.amazon.com/solutions/latest/live-streaming-on-aws/architecture-overview.html
description: MediaLive ingests two redundant contribution feeds (primary and backup inputs) from the live channel source and transcodes them into adaptive bitrate HLS; MediaPackage packages the output just
  in time into HLS, DASH, MSS and CMAF endpoints and acts as the origin (MediaPackage channels are configuration in Terraform, so the packaging hop is drawn as the MediaLive to CloudFront edge). CloudFront
  delivers the stream to OTT playback devices, authenticating to MediaPackage with a CDN identifier header stored in Secrets Manager, and a demo preview player is hosted from an S3 bucket behind a second
  CloudFront distribution.
