description: MediaLive ingests two redundant contribution feeds and transcodes them into adaptive bitrate HLS; MediaPackage packages the output into HLS, DASH and CMAF endpoints and acts as the origin.
  CloudFront delivers the stream to viewers, authenticating to MediaPackage with a CDN identifier header stored in Secrets Manager, and a demo player is hosted from an S3 bucket.
