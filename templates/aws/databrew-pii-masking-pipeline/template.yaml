description: An object landing in the raw bucket sends an S3 event to EventBridge, which starts a Step Functions state machine; the workflow runs a DataBrew profile job to detect PII columns, a Lambda builds
  a recipe of masking transformations, and a DataBrew recipe job writes the masked output. Results land in a curated bucket and the workflow notifies operators through SNS.
