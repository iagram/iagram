description: An object landing in the data input bucket sends an S3 event to EventBridge, which starts a Step Functions workflow; the workflow runs a DataBrew profile job to detect PII columns and writes
  the profile to the output bucket, a Lambda reads the profile and builds a recipe of masking transformations, and a DataBrew recipe job applies it. The recipe job reads its hashing secret from Secrets
  Manager and writes the masked output to the data output bucket.
