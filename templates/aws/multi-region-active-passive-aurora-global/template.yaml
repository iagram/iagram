title: Multi-Region active/passive with Route 53 failover and Aurora Global Database
category: resilience
tags:
- disaster recovery
- multi-region
- warm standby
- route 53 failover
- aurora global database
image: https://docs.aws.amazon.com/images/whitepapers/latest/disaster-recovery-workloads-on-aws/images/backup-restore-architecture.png
