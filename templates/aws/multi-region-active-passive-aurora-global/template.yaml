description: The primary Region serves all traffic while a scaled-down copy of the stack runs in a secondary Region as a warm standby. Aurora Global Database replicates data cross-Region with sub-second
  lag, S3 replicates objects, and a Route 53 failover record backed by a health check redirects users when the primary fails.
