description: Writes to an orders table are captured by DynamoDB Streams and delivered in order per partition key to a Lambda function through an event source mapping with filtering. The function publishes
  domain events to SNS and indexes documents in OpenSearch; failed batches are routed to an SQS on-failure destination.
