description: Both Regions serve production traffic, with Route 53 sending each user to the nearest healthy stack of Elastic Load Balancing, front end servers and application servers in Auto Scaling groups
  across two Availability Zones. DynamoDB global tables accept reads and writes locally in both Regions with automatic replication, and continuous backup protects each Regional table.
