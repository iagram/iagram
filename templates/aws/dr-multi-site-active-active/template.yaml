title: Multi-site active/active across two Regions
category: resilience
tags:
- disaster recovery
- active-active
- multi-region
- route 53 latency
- dynamodb global tables
- aurora write forwarding
- elasticache global datastore
source: https://aws.amazon.com/blogs/architecture/disaster-recovery-dr-architecture-on-aws-part-iv-multi-site-active-active/
description: Both Regions serve production traffic, with Route 53 latency-based records backed by health checks sending each user to the nearest healthy stack. Reads are local everywhere; DynamoDB global
  tables accept writes in both Regions (write-local), Aurora Global Database with write forwarding keeps a single write Region for relational data (write-global), and an ElastiCache Global Datastore replicates
  session state.
