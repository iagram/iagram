source: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-tgw.html
description: A Client VPN endpoint associated directly with a Transit Gateway gives remote users coming in over the internet access to every VPC attached to that hub without an intermediate VPC. Routes
  for each destination CIDR are added to the Client VPN endpoint together with authorization rules, split tunnel keeps internet traffic local to the user, and the client source IP is preserved because no
  source NAT is applied.
