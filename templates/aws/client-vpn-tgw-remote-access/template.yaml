title: Remote user access to multiple VPCs with Client VPN and Transit Gateway
category: networking
tags:
- client vpn
- remote access
- transit gateway
- openvpn
- split tunnel
- hybrid
image: https://docs.aws.amazon.com/images/vpn/latest/clientvpn-admin/images/cvpn-tgw-traffic-flow.png
source: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-tgw.html
description: A Client VPN endpoint associated directly with a Transit Gateway gives remote users access to every VPC and on-premises network attached to that hub without an intermediate VPC. Routes for
  each destination CIDR are added to the Client VPN endpoint together with authorization rules, split tunnel keeps internet traffic local to the user, and the client source IP is preserved because no source
  NAT is applied.
