source: https://docs.aws.amazon.com/drs/latest/userguide/what-is-drs.html
description: The AWS Replication Agent on each source server streams block-level changes over TCP 1500 to lightweight replication servers in a staging area subnet, where data lands on low-cost EBS volumes.
  For drills or recovery, DRS converts the servers to boot natively and launches full-size recovery instances in the recovery subnets from the launch template; after the incident, replication reverses for
  failback.
