source: https://docs.aws.amazon.com/location/latest/developerguide/what-is.html
description: Mobile devices and vehicles send position updates to a Location Service tracker, which evaluates them against a linked geofence collection and emits ENTER and EXIT events to EventBridge. A
  Lambda target persists position history in DynamoDB and notifies dispatchers through SNS, while a web app renders map tiles, place search and routes through API Gateway.
