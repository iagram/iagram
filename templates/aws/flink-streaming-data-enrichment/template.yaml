description: A Managed Service for Apache Flink application enriches each event on the main Kinesis data stream with reference data, either by asynchronous per-record lookups against DynamoDB or by joining
  against a second reference stream fed by change data capture. Enriched events are written to an output stream and delivered to S3 by Firehose.
