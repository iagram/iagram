description: Amazon EVS deploys a VMware Cloud Foundation environment on EC2 bare-metal hosts inside the customer VPC, with VLAN subnets created from the CIDR ranges supplied at environment creation. Workloads
  are migrated from the on-premises vSphere estate over Direct Connect with HCX without changing IP addresses, and once in the VPC they reach native services such as RDS, S3 and FSx for NetApp ONTAP over
  the VPC network. (VMware Cloud on AWS is no longer resold by AWS since April 2024.)
