description: Three kinds of event source publish to EventBridge event buses. AWS services emit to the default bus, applications put custom events on a custom bus and SaaS partners deliver to a partner event
  bus; rules on each bus match event patterns and route events to targets such as Lambda functions, Kinesis streams, Step Functions workflows, API Gateway endpoints and event buses in other accounts, so
  producers and consumers stay decoupled.
