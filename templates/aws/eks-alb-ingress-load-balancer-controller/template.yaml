title: EKS ingress with the AWS Load Balancer Controller and an ALB
category: containers
tags:
- eks
- aws load balancer controller
- ingress
- alb
- ip targets
- acm
image: https://docs.aws.amazon.com/images/eks/latest/userguide/images/2048.png
source: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
description: The AWS Load Balancer Controller, running in the cluster with an IAM role for its service account, watches Kubernetes Ingress objects and creates an internet-facing ALB with a target group
  per backend; in IP target mode the ALB sends traffic straight to pod IPs assigned by the VPC CNI. An ACM certificate provides TLS on the listener and a Route 53 alias record points the application hostname
  at the ALB.
