description: Race telemetry lands in a Kinesis data stream where a Lambda consumer with tumbling windows aggregates scores every few seconds and writes them to DynamoDB, while a second consumer persists
  final results. DynamoDB Streams trigger a publisher Lambda that pushes updates to live leaderboards through IoT Core, and an API Gateway endpoint serves historical rankings sorted by a global secondary
  index.
