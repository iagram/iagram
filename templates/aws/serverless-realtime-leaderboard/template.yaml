description: Race telemetry lands in a Kinesis data stream where a Lambda consumer with tumbling windows aggregates scores every few seconds and writes them to a DynamoDB table, while a second consumer
  records final race results in a second table. DynamoDB Streams trigger a publisher Lambda that pushes updates to the live leaderboard through an IoT Core topic, and an API Gateway endpoint with a fetch-results
  Lambda serves the final rankings to the bike frontend application.
