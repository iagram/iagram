description: A citizen-facing web application deployed in the AWS GovCloud (US-West) Region for Controlled Unclassified Information, using FIPS 140-3 endpoints, WAF and an Application Load Balancer in front
  of an ECS service in private subnets and an encrypted Aurora cluster. Identity is federated from an agency IdP through Cognito, KMS customer managed keys encrypt all data at rest, and CloudTrail, AWS
  Config, GuardDuty and Security Hub provide the continuous monitoring evidence required by FedRAMP High.
