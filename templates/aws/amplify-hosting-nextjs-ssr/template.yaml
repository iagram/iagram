source: https://docs.aws.amazon.com/amplify/latest/userguide/server-side-rendering-amplify.html
description: Amplify Hosting connects to a Git repository, builds the Next.js app on each push, and deploys static pages and assets to an S3-backed CloudFront distribution while SSR routes run on Amplify
  Hosting compute. A custom domain from Route 53 is attached with an automatically managed certificate, and the rendered pages call a backend API and DynamoDB table.
