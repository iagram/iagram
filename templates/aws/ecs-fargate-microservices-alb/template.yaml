description: An internet-facing ALB in public subnets uses path-based listener rules to send /orders and /payments traffic to separate target groups, each backed by an ECS service running Fargate tasks
  in private subnets across two Availability Zones. Container images are pulled from ECR, and NAT gateways provide tasks with outbound access.
