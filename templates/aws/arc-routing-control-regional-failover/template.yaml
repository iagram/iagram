description: An ARC cluster exposes a highly available data-plane API in five Regions; routing controls on its control panel act as on/off switches bound to Route 53 health checks that front the failover
  records for each Regional replica. A safety rule asserts that at least one control is always on, and a readiness check monitors quotas and capacity of the standby replica so failover can be scripted without
  depending on Regional control planes.
