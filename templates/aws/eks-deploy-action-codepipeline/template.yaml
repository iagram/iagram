title: Continuous deployment to Amazon EKS with the CodePipeline EKS deploy action
category: devops
tags:
- codepipeline
- eks
- kubernetes
- helm
- kubectl
- ecr
- codeconnections
source: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-EKS.html
description: A V2 CodePipeline pulls application source through a CodeConnections GitHub connection, builds and pushes the image with the ECRBuildAndPublish action, then runs the EKSDeploy action, which
  applies Kubernetes manifests or a Helm chart from the source artifact on CodePipeline-managed CodeBuild compute. The action reaches private clusters through subnets and security groups of the cluster
  VPC and authenticates with an EKS access entry granted to the pipeline service role.
