description: An Elastic Beanstalk web server environment provisions an Application Load Balancer, an Auto Scaling group across two Availability Zones, and the EC2 instances that run the application, with
  application versions stored in an S3 bucket. The database is a Multi-AZ RDS instance created outside the environment so it survives environment rebuilds and blue/green swaps, and its endpoint is passed
  to the application as environment properties.
