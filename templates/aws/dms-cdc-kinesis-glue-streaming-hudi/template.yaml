description: DMS captures changes from an RDS database and publishes them to a Kinesis data stream, where a Glue streaming job consumes them continuously and upserts into Apache Hudi tables on S3. The Hudi
  tables are registered in the Glue Data Catalog so Athena queries and QuickSight dashboards reflect inserts and updates within minutes.
