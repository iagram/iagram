description: DMS captures changes from an RDS MySQL database and publishes them to a Kinesis data stream, where a Glue streaming job using the Apache Hudi connector consumes them continuously and upserts
  into Hudi tables on S3. The Hudi tables are registered in the Glue Data Catalog so Athena ad hoc queries and QuickSight dashboards reflect inserts and updates within minutes.
