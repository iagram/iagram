description: A VPC in the parent region us-west-2 spans two regional Availability Zones (us-west-2a and us-west-2b) and is extended with a third subnet in the Local Zone us-west-2-lax-1, which is close
  to end users. Each subnet hosts EC2 instances; the Local Zone subnet terminates latency-sensitive traffic through the Local Zone's own internet connection while the regional subnets keep the rest of the
  application in the parent region.
