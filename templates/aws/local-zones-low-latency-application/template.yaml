description: A regional VPC is extended with a subnet in a Local Zone close to end users; an Application Load Balancer and EC2 instances there terminate user traffic through the Local Zone's own internet
  connection while the database and asynchronous processing remain in the parent region. Direct Connect from an on-premises site takes the shortest path to the Local Zone without hairpinning through the
  region.
