image: https://d2908q01vomqb2.cloudfront.net/5b384ce32d8cdef02bc3a139d4cac0a22bb029e8/2022/07/15/CF-S3-active-active-geo-proximity-architecture-1024x636.png
source: https://aws.amazon.com/blogs/networking-and-content-delivery/using-amazon-cloudfront-and-amazon-s3-to-build-multi-region-active-active-geo-proximity-applications/
description: Content is written to an S3 bucket in each Region and kept in sync with two-way replication, and a single CloudFront distribution uses an origin-request Lambda@Edge function to route each cache
  miss to the bucket nearest the requesting edge location. A CloudFront origin group retries against the other Region when the primary returns an error, so a regional S3 impairment does not take the site
  down.
