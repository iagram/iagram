description: Audit Manager in the delegated administrator account runs assessments built from prebuilt frameworks such as PCI DSS or SOC 2 against in-scope accounts, continuously collecting evidence from
  Config rule evaluations, Security Hub checks and CloudTrail activity. Evidence is attached to controls, assessment reports are written to an encrypted S3 destination, and EventBridge events notify control
  owners when review is needed.
