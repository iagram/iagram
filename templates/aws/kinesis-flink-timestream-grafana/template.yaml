description: IoT devices publish events to a Kinesis data stream; a Managed Service for Apache Flink application transforms the device data and batch-inserts it into an Amazon Timestream database that Grafana
  queries for operational dashboards. A parallel Firehose consumer uses a Lambda function to transform batches and lands raw records in an S3 data lake bucket that analytics and machine learning services
  consume.
