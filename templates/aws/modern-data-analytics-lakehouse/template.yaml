description: Enterprise, SaaS, device and file sources are ingested through DMS, DataSync, Kinesis and Transfer Family into an S3 data lake registered with Lake Formation and catalogued in the Glue Data
  Catalog. Glue transforms the data, EMR and Redshift process it, and Athena, Redshift Spectrum, QuickSight and OpenSearch consume it under Lake Formation governance.
