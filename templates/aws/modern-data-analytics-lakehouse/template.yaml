description: Enterprise databases, file shares, devices, logs, social and media feeds, SaaS applications and flat files are ingested through DMS, DataSync, Kinesis, MSK, IoT Core, AppFlow and Transfer Family,
  joined by third-party datasets from AWS Data Exchange, into an S3 data lake registered with Lake Formation and catalogued in the Glue Data Catalog. Glue moves and transforms the data, and purpose-built
  services (Kinesis Data Analytics, QuickSight, OpenSearch, Redshift and Redshift Spectrum, EMR, SageMaker, Athena and Aurora) consume it under Lake Formation governance.
