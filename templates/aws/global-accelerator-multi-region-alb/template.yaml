source: https://aws.amazon.com/blogs/networking-and-content-delivery/deploying-multi-region-applications-in-aws-using-aws-global-accelerator/
description: A standard accelerator provides two static anycast IP addresses announced over BGP from AWS edge locations, and a listener with one endpoint group per Region (us-west-1 and eu-west-1) whose
  endpoints are EC2 instances spread across two Availability Zones. Client traffic enters the AWS network at the nearest edge location and is routed to the closest healthy endpoint group; health checks,
  endpoint-group traffic dials and per-instance endpoint weights drive automatic failover and controlled shifts between Regions.
