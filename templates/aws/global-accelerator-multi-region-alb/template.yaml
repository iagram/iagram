description: A standard accelerator provides two static anycast IP addresses and a listener with one endpoint group per Region, each containing the Region's internet-facing Application Load Balancer. Client
  traffic enters the AWS network at the nearest edge location and is routed to the closest healthy endpoint group; health checks, traffic dials, and endpoint weights drive automatic failover and controlled
  shifts between Regions.
