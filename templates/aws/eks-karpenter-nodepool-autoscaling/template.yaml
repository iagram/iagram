# Generated from the official reference (https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html); edit freely.
title: Just-in-time node provisioning on EKS with Karpenter
category: containers
tags:
- eks
- karpenter
- autoscaling
- nodepool
- spot
- interruption handling
source: https://docs.aws.amazon.com/eks/latest/best-practices/karpenter.html
description: Karpenter runs on a small managed node group (or Fargate) and watches for unschedulable pods, then calls the EC2 Fleet API directly to launch right-sized instances from a diverse set of types
  defined in a NodePool, without Auto Scaling groups. An EventBridge rule forwards Spot interruption and instance health events to an SQS queue that Karpenter drains so it can cordon and replace nodes ahead
  of termination, and consolidation removes under-used nodes.
