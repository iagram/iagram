description: Score feeds enter through an API Gateway ingestion endpoint into a Kinesis data stream; a Lambda consumer transforms the events and calls AppSync GraphQL mutations that persist them in DynamoDB
  and fan out to connected clients over WebSocket subscriptions. A DynamoDB Stream triggers a second Lambda that sends push notifications through Amazon Pinpoint to offline users.
