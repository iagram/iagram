description: A Transfer Family SFTP server endpoint replaces the on-premises file transfer host so partners keep their existing clients, hostnames and credentials. A Lambda-backed custom identity provider
  authenticates users against the corporate directory, files land in an S3 bucket, and a managed workflow copies, tags and decrypts each upload before downstream processing.
