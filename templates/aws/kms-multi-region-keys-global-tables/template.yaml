description: A KMS multi-Region primary key in us-east-1 is replicated to eu-west-1 so the replica key shares the same key ID and key material, and both ARNs differ only by Region. Data encrypted client-side
  with the primary key and replicated by DynamoDB global tables can be decrypted locally with the replica key, avoiding cross-Region KMS calls.
