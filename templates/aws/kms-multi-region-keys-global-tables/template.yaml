description: A primary KMS multi-Region key is replicated to a second Region so the replica shares the same key ID and key material; the application encrypts DynamoDB items client-side with the AWS Encryption
  SDK in one Region. DynamoDB global tables replicate the ciphertext and the application in the other Region decrypts locally with the replica key, avoiding cross-Region KMS calls.
