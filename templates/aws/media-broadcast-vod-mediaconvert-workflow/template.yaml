description: Guidance for Video on Demand on AWS stores source mezzanine files in an S3 bucket with a lifecycle policy to Glacier, and Step Functions state machines orchestrate Lambda functions for the
  ingest, processing and publishing stages. AWS Elemental MediaConvert transcodes to HLS and DASH, job metadata is recorded in DynamoDB, EventBridge rules capture MediaConvert notifications, SNS and SQS
  publish workflow outputs, optional MediaPackage repackages the assets and CloudFront delivers the distribution bucket to viewers.
