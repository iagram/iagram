description: An Airflow DAG in MWAA waits for date-partitioned files in a source bucket, runs a Glue crawler and Glue job to stage them, loads a Redshift Serverless workgroup in private subnets, runs stored
  procedures and unloads the result back to a target bucket in the central account. The MWAA VPC peers with the Redshift VPC and reaches S3 and Secrets Manager through VPC endpoints.
