title: End-to-end ETL into Redshift Serverless orchestrated by MWAA
category: data
tags:
- mwaa
- airflow
- glue
- redshift serverless
- vpc peering
- cross-account
image: https://d2908q01vomqb2.cloudfront.net/b6692ea5df920cad691c20319a6fffd7a4a766b8/2024/04/16/image001-2.png
source: https://aws.amazon.com/blogs/big-data/orchestrate-an-end-to-end-etl-pipeline-using-amazon-s3-aws-glue-and-amazon-redshift-serverless-with-amazon-mwaa/
description: Data engineers push DAGs from GitHub to an S3 configs bucket read by MWAA; the Airflow DAG waits for date-partitioned files in a source bucket, runs a Glue crawler and Glue job to stage them,
  loads a Redshift Serverless workgroup in private subnets, runs stored procedures and unloads the result back to a target bucket in the central account for downstream applications, while data scientists
  query Redshift directly. The MWAA VPC peers with the Redshift VPC, connection secrets come from Secrets Manager and task logs go to CloudWatch.
