description: MGN agents on the source servers continuously replicate disks to replication servers in a staging area subnet, and servers are grouped into applications and waves for bulk operations. Test
  and then cutover instances are launched from the launch template into the target subnets with cutover windows of minutes; after cutover the source servers are archived.
