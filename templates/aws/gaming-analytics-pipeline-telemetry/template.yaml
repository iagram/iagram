description: Guidance for Game Analytics Pipeline on AWS accepts telemetry from game clients and servers through an API Gateway endpoint backed by Lambda and DynamoDB for authentication and administration.
  An optional real-time path writes events to a Kinesis data stream processed by Managed Service for Apache Flink into OpenSearch dashboards, the data lake mode batches events through Kinesis Data Firehose
  as Parquet into an S3 data lake with Glue tables queried by Athena, and the data warehouse mode streams events from a second Kinesis data stream into Redshift.
