description: Guidance for Game Analytics Pipeline on AWS accepts telemetry from game clients and servers through an API Gateway backend backed by Lambda and DynamoDB for authentication and administration,
  and writes events to a Kinesis data stream. An optional real-time path processes the stream with Managed Service for Apache Flink into OpenSearch dashboards, while Kinesis Data Firehose batches events
  as Parquet into an S3 data lake with Glue tables queried by Athena, or alternatively streams them into Redshift Serverless.
