description: Devices publish MQTT telemetry to the IoT Core message broker, where a topic rule forwards matching messages into a Kinesis data stream that decouples ingestion rate from processing. A Lambda
  consumer serves real-time alerts and hot state, while Firehose batches the same stream into S3 for durable storage and Athena analytics.
