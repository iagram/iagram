description: A Python Boto3 producer on EC2 simulates credit card transactions into a Kinesis data stream, which Redshift ingests through a streaming materialized view. A Redshift ML model trained on the
  customer payment history scores the incoming records into a predictions table, and a Lambda function reads the flagged transactions to alert customers through Amazon Pinpoint and to block the card in
  the payment application.
