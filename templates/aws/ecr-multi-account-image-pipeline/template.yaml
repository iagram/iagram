image: https://d2908q01vomqb2.cloudfront.net/fe2ef495a1152561572949784c16bf23abb28057/2022/10/10/architecture-1.jpg
source: https://aws.amazon.com/blogs/containers/amazon-ecr-in-multi-account-and-multi-region-architectures/
description: The development account's ECR registry caches upstream images from ECR Public and Quay in a pull-through cache repository, and a CodePipeline whose CodeBuild stage builds application images
  pushes them to a development repository where Amazon Inspector scans them on push and reports findings to Security Hub. Clean images are promoted to a production repository in the same registry; CodeDeploy
  rolls them out to the development ECS cluster and to the ECS cluster in the production account, which pulls the images through a VPC endpoint rather than over the internet.
