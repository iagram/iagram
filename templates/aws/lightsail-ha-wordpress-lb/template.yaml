description: Multiple WordPress instances cloned from a snapshot and spread across Availability Zones sit behind a Lightsail load balancer that terminates TLS with a managed certificate. All instances write
  to one highly available Lightsail managed MySQL database, and media uploads are offloaded to a Lightsail bucket served through a Lightsail CDN distribution.
