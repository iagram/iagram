source: https://docs.aws.amazon.com/whitepapers/latest/serverless-multi-tier-architectures-api-gateway-lambda/serverless-multi-tier-architectures-api-gateway-lambda.html
description: A single-page application is served from S3 through CloudFront with WAF in front; users sign in with a Cognito user pool and present JWTs to an API Gateway REST API protected by a Cognito authorizer.
  Lambda functions implement the logic tier and DynamoDB the data tier, so no tier runs on servers.
