description: A Place Order request starts a Step Functions standard workflow that calls the order, inventory and payment Lambda services in sequence, each writing to its own DynamoDB table. Catch blocks
  route InventoryUpdateFailed or PaymentFailed to compensating functions that undo earlier steps in reverse order so the distributed transaction ends consistent.
