description: A booking request starts a Step Functions standard workflow that calls flight, hotel and payment Lambda functions in sequence, each writing to its own DynamoDB table. Catch blocks route any
  failure to compensating functions that cancel earlier steps in reverse order so the distributed transaction ends consistent.
