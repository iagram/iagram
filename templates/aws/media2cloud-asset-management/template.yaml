source: https://docs.aws.amazon.com/solutions/latest/media2cloud-on-aws/architecture-overview.html
description: Uploaded media triggers a main Step Functions state machine whose ingestion sub-workflow creates proxies with MediaConvert and whose analysis sub-workflow runs Rekognition, Transcribe, Comprehend
  and Textract jobs. DynamoDB holds workflow artifacts, OpenSearch indexes the extracted metadata for search, an IoT Core topic pushes progress to the web app served through CloudFront and API Gateway behind
  Cognito, and SNS publishes ingest and analysis completion events.
