description: Users sign in through Cognito and call API Gateway, which starts a main Step Functions state machine whose ingestion sub-workflow creates proxies with MediaConvert and open-source tools and
  whose analysis sub-workflow runs Rekognition, Transcribe, Comprehend and Textract jobs (Textract has no Terraform resource and is not drawn). DynamoDB holds workflow artifacts, OpenSearch indexes the
  extracted metadata, web, proxy, ingest and logs S3 buckets store the assets, CloudWatch and EventBridge capture job state changes for optional downstream integration, an IoT Core topic pushes progress
  over MQTT to the web app served through CloudFront, and SNS publishes ingest and analysis completion events.
