image: https://docs.aws.amazon.com/images/solutions/latest/media2cloud-on-aws/images/media2cloud-architecture-diagram.png
source: https://docs.aws.amazon.com/solutions/latest/media2cloud-on-aws/architecture-overview.html
description: Users sign in with Cognito and call an API Gateway that starts the main Step Functions state machine, whose ingest sub-workflow creates proxies with MediaConvert and whose analysis sub-workflow
  runs Rekognition, Transcribe, Comprehend and Textract jobs; the web app is served by CloudFront from the web bucket. Results and state are kept in DynamoDB and indexed into OpenSearch, media lives in
  the proxy, ingest and logs buckets, job status reaches the web app over IoT Core MQTT and SNS, and CloudWatch and EventBridge events allow an optional downstream integration.
