source: https://docs.aws.amazon.com/solutions/latest/media2cloud-on-aws/architecture-overview.html
description: Uploads to an ingest bucket start a main Step Functions state machine whose ingestion sub-workflow creates proxies with MediaConvert and whose analysis sub-workflow runs Rekognition, Transcribe,
  Comprehend and Textract jobs. Rekognition publishes video job status to SNS, results and state are kept in DynamoDB and indexed into OpenSearch for search from a CloudFront-hosted web app authenticated
  by Cognito.
