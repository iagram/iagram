description: Fluent Bit agents on EC2 instances (with the SSM Agent) and EKS nodes in a sources VPC upload application logs over a VPC peering connection and interface endpoints into a log buffer in the
  main account, either a Kinesis Data Streams stream or an S3 log bucket. In option (a) the stream emits events through Amazon EventBridge that trigger the Log Processor Lambda function, which reads the
  logs and bulk-uploads them into the Amazon OpenSearch Service domain; in option (b) S3 notifications on an SQS queue feed an OpenSearch Ingestion Service pipeline that reads the bucket and bulk-uploads
  to the same domain, and both paths write failed records to an S3 backup bucket.
