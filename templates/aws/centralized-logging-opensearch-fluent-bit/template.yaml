description: Fluent Bit agents installed on EC2 instances and EKS nodes by Systems Manager ship application logs to a Kinesis Data Streams log buffer; a Log Processor Lambda function triggered by the buffer
  parses the records and bulk-indexes them into an Amazon OpenSearch Service domain, writing failed batches to an S3 backup bucket. A separate service log pipeline loads AWS service logs (ALB, CloudFront,
  CloudTrail, WAF) from S3 through SQS notifications, and the solution console built on CloudFront, AppSync, Cognito and DynamoDB provisions each pipeline on demand with Step Functions.
