description: An Outpost rack at the customer site is homed to an Availability Zone and extends a regional VPC with Outpost subnets that host EC2, ECS, RDS and S3 on Outposts resources for low-latency and
  data-residency workloads. The service link carries encrypted VPC and management traffic back to the region, while the local gateway routes traffic between Outpost subnets and the on-premises network.
