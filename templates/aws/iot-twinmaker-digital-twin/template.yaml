description: A TwinMaker workspace stores its entity-component knowledge graph and 3D scene assets in an S3 bucket, with built-in connectors to SiteWise time series and Kinesis Video Streams camera feeds
  plus a Lambda-backed custom connector to Timestream telemetry. Operators view the scenes with data overlays in Amazon Managed Grafana through the TwinMaker plugin.
