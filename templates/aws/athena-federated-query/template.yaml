description: Athena runs a single SQL statement against external sources through Lambda data source connectors deployed in the customer account, one connector per source such as DynamoDB, an RDS database
  or CloudWatch Logs. Connectors run on demand, push predicates down to the source, spill large results to an S3 spill bucket that Athena reads back, and let analysts query in place without first copying
  data into the lake.
