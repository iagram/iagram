source: https://aws.amazon.com/blogs/big-data/query-any-data-source-with-amazon-athenas-new-federated-query/
description: Athena registers each external source as a data catalog backed by a Lambda data source connector, so one SQL statement can join S3 data with DynamoDB, an RDS database, CloudWatch Logs and Redshift.
  Connectors run on demand in Lambda, spill large results to an S3 spill bucket and let analysts query in place without first copying data into the lake.
