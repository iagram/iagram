source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
description: Synthetics canaries are Node.js, Python or Java scripts that CloudWatch runs as Lambda functions on a rate or cron schedule to exercise a public API and a browser user journey with Playwright
  or Puppeteer, and an in-VPC canary checks an internal endpoint. Each run stores HAR files, screenshots and logs in an S3 artifact bucket and publishes SuccessPercent and Duration metrics in the CloudWatchSynthetics
  namespace; alarms on those metrics notify SNS, and X-Ray active tracing places the canaries on the trace map next to the services they call.
