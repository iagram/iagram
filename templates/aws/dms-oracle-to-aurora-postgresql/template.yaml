description: AWS SCT (or DMS Schema Conversion) converts the Oracle schema, PL/SQL and code objects to PostgreSQL and applies them to an Aurora PostgreSQL cluster. A DMS replication instance then runs a
  full-load-plus-CDC task from the on-premises Oracle source endpoint to the Aurora target endpoint over a VPN, keeping both databases in sync until the application is repointed.
