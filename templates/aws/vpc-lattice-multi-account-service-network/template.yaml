description: A central networking account owns a VPC Lattice service network and shares it with workload accounts through AWS RAM; each workload account associates its VPC with the service network and registers
  its own services with target groups pointing at instances, containers, or Lambda functions. Consumers call services by their Lattice DNS names through the link-local Lattice prefix, with IAM auth policies
  on the service network and services controlling who may invoke what, independent of VPC CIDRs.
