description: Four applications live in three AWS accounts in us-west-2 with overlapping-prone, independent VPCs. App1 and App2 run as pods on Amazon EKS clusters with EC2 worker nodes in VPC-1 (10.1.0.0/16)
  and VPC-2 (10.2.0.0/16), App3 is a Lambda function in VPC-3 (10.3.0.0/16) and App4 an EC2 Auto Scaling group in VPC-4 (10.4.0.0/16). Account 1 owns a VPC Lattice service network and shares it with the
  other accounts through AWS RAM; each VPC is associated with the service network so the applications call each other by Lattice DNS names through the link-local Lattice prefix, with IAM auth policies deciding
  who may invoke what independently of VPC CIDRs.
