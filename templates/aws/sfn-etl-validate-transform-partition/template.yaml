- partitioning
image: https://docs.aws.amazon.com/images/prescriptive-guidance/latest/patterns/images/pattern-img/8eb792b0-d35b-4a63-ba2d-71eb8d2c1203/images/bd77de7b-4d04-44bb-95d2-3ec4599b3770.png
source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/orchestrate-an-etl-pipeline-with-validation-transformation-and-partitioning-using-aws-step-functions.html
description: A CSV upload to the source folder triggers a Lambda that starts a Step Functions state machine; a validation Lambda checks schema and types, moving good files to a stage folder and bad files
  to an error folder with an SNS alert. A Glue crawler catalogs the staged file, a Glue job converts it to compressed Parquet partitioned by year, month and day, a second crawl registers the result for
  Athena and SNS reports success or failure.
