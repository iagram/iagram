description: A Lex V2 bot handles intents and slot filling and hands fulfillment to a Lambda function that runs a LangChain conversational agent on a Bedrock model. The agent reads customer records from
  DynamoDB, retrieves curated answers from documents indexed by Kendra and falls back to model knowledge; the web chat UI is served by CloudFront with Cognito identity-pool credentials.
