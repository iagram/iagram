description: Customers reach a Lex V2 natural-language chatbot over the web through an Amplify-hosted website, over SMS, over voice through an Amazon Connect contact center, or from Slack. Lex hands fulfillment
  to a Lambda bot logic handler that runs a LangChain agent on a fine-tunable Bedrock Anthropic Claude 2.1 model, reads user account information from DynamoDB and retrieves FAQ answers from a Kendra index
  whose web crawler ingests public pages; customer data in S3 can fine-tune the model.
