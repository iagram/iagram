description: A hospital PACS or modality pushes DICOM studies to an S3 input bucket, a Lambda function starts a HealthImaging import job that creates image sets in a data store, and import results and metadata
  are written to an S3 output bucket and indexed in DynamoDB. Radiologists open a zero-footprint viewer served from CloudFront that authenticates with Cognito and retrieves image frames through API Gateway,
  while EventBridge routes import events for downstream AI inference on a SageMaker endpoint.
