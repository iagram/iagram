source: https://aws.amazon.com/blogs/machine-learning/using-streaming-ingestion-with-amazon-sagemaker-feature-store-to-make-ml-backed-decisions-in-near-real-time/
description: Credit card transactions arrive on a Kinesis data stream; a Managed Service for Apache Flink application computes sliding-window aggregates and a Lambda function writes them to an online Feature
  Store group, which replicates to the offline S3 store. A second Lambda consumes the same stream, reads the latest aggregates with GetRecord and calls a SageMaker endpoint to score each transaction.
