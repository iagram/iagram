source: https://aws.amazon.com/blogs/machine-learning/using-streaming-ingestion-with-amazon-sagemaker-feature-store-to-make-ml-backed-decisions-in-near-real-time/
description: Historical transactions and fraud labels in an S3 data lake feed a nightly PySpark job that builds the training data for a SageMaker training job and materialises one-week aggregates into a
  batch online-only feature group. Live credit card transactions arrive on a Kinesis data stream; a Kinesis Data Analytics SQL application computes sliding ten-minute aggregates and a Lambda pushes them
  into a second online-only feature group, while a second Lambda consumes the same stream, reads the latest aggregates with GetRecord, calls the fraud detection endpoint and writes results that trigger
  alerts and feed a dashboard.
