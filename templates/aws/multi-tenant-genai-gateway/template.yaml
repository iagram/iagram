description: A central API Gateway and Lambda gateway authenticates tenants with Cognito, looks up tenant configuration in DynamoDB and routes requests to Bedrock models with a guardrail and tenant-scoped
  knowledge base. Invocation logs and usage records land in S3 and are queried with Athena to allocate cost and enforce quotas per tenant.
