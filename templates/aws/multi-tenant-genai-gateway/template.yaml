source: https://aws.amazon.com/blogs/machine-learning/build-a-multi-tenant-generative-ai-environment-for-your-enterprise-on-aws/
description: A shared generative AI environment exposes one HTTPS endpoint in front of an orchestrator and a playground UI; the orchestrator combines Bedrock and SageMaker models, application components
  (agent, prompt catalog, prompt-chaining flow, hybrid-search knowledge base) and responsible AI components (guardrail, model monitoring, human review, model evaluation). Core services provide logging,
  metering and auditing, a model registry for onboarding, tenant onboarding in DynamoDB and authentication and authorization, while each tenant keeps its own API layer, business logic, cache, vector store,
  data sources and data pipelines and calls the endpoint with a tenant JWT.
