image: https://docs.aws.amazon.com/images/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/images/centralized-egress-rt.png
source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-nat-gateway-with-firewall.html
description: Spoke VPCs A and B send their default route to a Transit Gateway whose route table 1 forwards all internet-bound traffic to a dedicated egress VPC and blackholes the private range, while route
  table 2 returns traffic to the right spoke. Inside the egress VPC each Availability Zone has a TGW subnet with the Transit Gateway ENI, a firewall subnet with an AWS Network Firewall endpoint and a public
  subnet with a NAT gateway; per-subnet route tables chain TGW ENI to firewall endpoint to NAT gateway to the internet gateway, and return traffic follows the same path in reverse.
