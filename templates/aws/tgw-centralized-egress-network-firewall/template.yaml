source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/using-nat-gateway-with-firewall.html
description: Spoke VPCs send their default route to a Transit Gateway whose egress route table forwards all internet-bound traffic to a dedicated egress VPC. Inside the egress VPC the traffic passes through
  AWS Network Firewall endpoints for stateful inspection before a NAT gateway in a public subnet forwards it to the internet gateway; return traffic follows the same path in reverse.
