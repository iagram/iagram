title: App Runner web service reaching a private RDS database through a VPC connector
category: containers
tags:
- app runner
- vpc connector
- rds
- secrets manager
- ecr
- serverless containers
source: https://aws.amazon.com/blogs/containers/deploy-and-scale-django-applications-on-aws-app-runner/
description: App Runner builds and runs the web application in an AWS-managed VPC, terminating TLS, load balancing and scaling instances on concurrent requests. A VPC connector creates Hyperplane ENIs in
  the customer's private subnets so outbound calls reach an RDS for PostgreSQL instance that has no public endpoint, and the service's instance role reads the database credentials from Secrets Manager.
