- {id: app-postgres, type: aws.rds_instance, name: app-postgres, parent: sub-private-a}
- {id: db-credentials, type: aws.res.aws_secretsmanager_secret, name: db-credentials, parent: reg-us-east-1}
- {id: apprunner-instance-role, type: aws.res.aws_iam_role, name: apprunner-instance-role, parent: reg-us-east-1, props: {assume_role_policy: changeme}}
- {id: static-assets, type: aws.s3_bucket, name: static-assets, parent: reg-us-east-1}
- {id: apprunner-logs, type: aws.res.aws_cloudwatch_log_group, name: apprunner-logs, parent: reg-us-east-1}
