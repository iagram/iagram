description: App Runner deploys the web application from a GitHub repository and runs it in an AWS-managed VPC, terminating TLS, load balancing and scaling instances on concurrent requests. A VPC connector
  attaches the service to the customer VPC through AWS PrivateLink (Hyperplane ENIs in the private subnet) so outbound calls reach an RDS for PostgreSQL instance that has no public endpoint, and the database
  credentials are injected from Secrets Manager.
