- {id: sub-private-a, type: aws.subnet, name: private-a, parent: az-data-a, props: {cidr: 10.0.1.0/24, az: a, public: false}}
- {id: az-data-b, type: aws.availability_zone, name: b, parent: vpc-data, props: {zone: b}}
- {id: sub-private-b, type: aws.subnet, name: private-b, parent: az-data-b, props: {cidr: 10.0.2.0/24, az: b, public: false}}
- {id: users, type: common.users, name: users}
- {id: user, type: common.user, name: user}
- id: web-app
