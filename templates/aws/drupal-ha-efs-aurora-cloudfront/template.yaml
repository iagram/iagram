description: Drupal web servers in an Auto Scaling group behind an Application Load Balancer share the sites/default/files directory over an EFS file system so uploaded content is visible from every instance.
  CloudFront terminates TLS with an ACM certificate and caches pages, ElastiCache holds the Drupal cache bins, and an Aurora cluster provides the database across two Availability Zones.
