description: An edge-optimized REST API is reached through an API Gateway managed CloudFront distribution, so requests enter at the nearest point of presence and travel the AWS backbone to the regional
  API endpoint. A custom domain name with an ACM certificate issued in us-east-1 is mapped to the API stage and published as a Route 53 alias record, while Lambda functions and DynamoDB implement the resources.
