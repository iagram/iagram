description: A patient-facing web application built only from HIPAA Eligible Services under an AWS Business Associate Addendum, with CloudFront and WAF in front of an Application Load Balancer and ECS tasks
  in private subnets. Protected health information is stored in an encrypted Aurora cluster and S3 bucket using KMS customer managed keys, Cognito handles patient identity, and CloudTrail plus CloudWatch
  Logs provide the audit trail HIPAA requires.
