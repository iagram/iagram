description: A viewer-request Lambda@Edge function normalizes the requested dimensions and format into a canonical cache key, and on a cache miss the origin-response function fetches the source image from
  S3, resizes it, writes the derived image back to the bucket, and returns it. Later requests for the same variant are served from the CloudFront cache or directly from the pre-generated object.
