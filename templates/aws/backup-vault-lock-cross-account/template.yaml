source: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
description: An Organizations backup policy applied to workload OUs creates backup plans in every member account, and each plan copies recovery points to a locked vault in a dedicated backup account encrypted
  with its own KMS key. Vault Lock in compliance mode and cross-account monitoring from the delegated backup administrator guarantee retention that cannot be shortened even by account administrators.
