source: https://aws.amazon.com/blogs/architecture/deploying-service-mesh-based-architectures-using-aws-app-mesh-and-amazon-ecs/
description: An App Mesh mesh models each ECS service as a virtual node discovered through Cloud Map, and a virtual router with weighted routes fronts the backend as a virtual service that the frontend
  addresses by name. Every task runs an Envoy sidecar that App Mesh configures, so all service-to-service traffic is intercepted, routed and exported as metrics, logs and traces to CloudWatch and X-Ray
  without code changes.
