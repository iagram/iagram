source: https://aws.amazon.com/blogs/architecture/deploying-service-mesh-based-architectures-using-aws-app-mesh-and-amazon-ecs/
description: The control plane is an App Mesh mesh that models each ECS service (inventory, order and UI) as a virtual node discovered through Cloud Map and pushes routing configuration to the Envoy proxy
  running as a sidecar in every ECS task next to the application container. In the data plane all service-to-service traffic flows between the Envoy proxies over mTLS and is exported as traces to X-Ray
  and as logs and metrics to CloudWatch without code changes.
