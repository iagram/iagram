description: An Airflow DAG in MWAA submits three sequential PySpark jobs to an EMR Serverless application, which scales workers up and down per job without a managed cluster. The jobs join and aggregate
  taxi trip data from an input bucket into Parquet in an output bucket, register tables in the Glue Data Catalog and the DAG runs an Athena query to validate the summary table.
