source: https://aws.amazon.com/blogs/compute/extending-a-serverless-event-driven-architecture-to-existing-container-workloads/
description: Users call API Gateway endpoints (signup, FNOL, claims, customer) that publish domain events to a custom EventBridge event bus acting as the event broker; rules match on detail-type and deliver
  the events to the customer service on Step Functions, the claims and fraud services on Lambda and a documents service built on S3 and Step Functions. The settlement service, an existing container workload
  on ECS Fargate, consumes its events through an SQS queue so it polls at its own pace, every service emits follow-up events back to the bus, and a notification rule triggers the Lambda notification service
  that answers the users.
