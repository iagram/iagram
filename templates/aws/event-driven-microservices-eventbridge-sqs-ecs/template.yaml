source: https://aws.amazon.com/blogs/compute/extending-a-serverless-event-driven-architecture-to-existing-container-workloads/
description: Producers publish domain events to a custom EventBridge event bus; rules match on detail-type and deliver matching events to per-consumer SQS queues so each containerized service polls its
  own queue at its own pace. The settlement service on ECS Fargate scales on queue depth, persists results to DynamoDB and emits a follow-up event back to the bus, while a dead-letter queue captures messages
  that repeatedly fail.
