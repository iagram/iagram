source: https://docs.aws.amazon.com/whitepapers/latest/migrating-magento-open-source-adobe-commerce-to-aws/reference-architecture.html
description: Users reach the store through Route 53, AWS WAF, and CloudFront; an Application Load Balancer sends requests to Varnish cache instances in each Availability Zone, and cache misses go through
  a second load balancer to Magento EC2 instances in an Auto Scaling group. Magento uses Amazon MQ, OpenSearch for catalog search, ElastiCache for Redis for sessions and full-page cache, Aurora MySQL with
  a read replica, and S3 as remote storage for media, with Secrets Manager holding credentials, SES sending email, and NAT gateways and bastion hosts in the public subnets.
