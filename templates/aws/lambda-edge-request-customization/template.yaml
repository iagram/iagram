description: Lambda@Edge functions replicated from us-east-1 run at CloudFront edge locations on viewer-request and origin-request events. The viewer-request function validates a JWT and redirects unauthenticated
  users; the origin-request function selects the S3 or ALB origin based on a cookie, enabling A/B tests and geo-based routing without touching the origin servers.
