description: An EventBridge rule starts a state machine when a manifest lands in S3; a Distributed Map state lists the objects under a prefix and runs up to 10,000 concurrent child executions, each invoking
  a Lambda function per object or batch. Child results are written back to S3 and summarized by a final function.
