description: API Gateway routes REST calls to Lambda functions that run SQL against an Aurora Serverless cluster through the HTTPS Data API instead of a database driver, so the functions need no VPC attachment
  or connection pooling. Database credentials live in Secrets Manager and are referenced by ARN in each ExecuteStatement call.
