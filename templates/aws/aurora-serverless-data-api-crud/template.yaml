description: Applications of any kind, EC2 and Elastic Beanstalk fleets, containers on ECS pulled from ECR, Lambda functions and on-premises servers, run SQL against an Aurora Serverless cluster through
  the HTTPS Data API endpoint instead of a database driver, so callers need no VPC attachment or connection pooling. The cluster itself stays in private subnets; only the Data API endpoint is reachable
  by the callers.
