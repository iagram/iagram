source: https://docs.aws.amazon.com/lookout-for-equipment/latest/ug/what-is.html
description: Vibration, temperature and process sensors publish to IoT Core, a topic rule fans the readings into Kinesis Data Firehose for a historian in S3 and into Timestream for live dashboards, and
  historical data from SCADA systems is uploaded to the same bucket. A SageMaker model trained on the sensor history and labelled failure periods is deployed to an endpoint; a scheduled Lambda scores fresh
  windows and raises SNS alerts that create work orders in the maintenance system.
