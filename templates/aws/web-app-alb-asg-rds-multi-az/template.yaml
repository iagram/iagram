image: https://docs.aws.amazon.com/images/reference-architecture-diagrams/latest/web-application-architecture/images/web-application-architecture.png
source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/web-application-architecture/web-application-architecture.html
description: Route 53 and CloudFront front an internet-facing Application Load Balancer that spreads web servers in an Auto Scaling group across two Availability Zones, with AWS WAF filtering requests at
  the edge. Web instances read a Multi-AZ RDS database through an ElastiCache layer, and NAT gateways in the public subnets give the private tier outbound access.
