title: Istio service mesh on EKS with an ingress gateway behind an NLB
category: containers
tags:
- eks
- istio
- service mesh
- envoy
- nlb
- mtls
- kiali
source: https://aws.amazon.com/blogs/opensource/getting-started-with-istio-on-amazon-eks/
description: Istio's control plane (istiod) runs on an EKS cluster with managed node groups and injects Envoy sidecars into pods of namespaces labelled istio-injection=enabled, giving mutual TLS, retries
  and traffic splitting between service versions. The Istio ingress gateway is exposed as a LoadBalancer service that the AWS Load Balancer Controller realizes as a Network Load Balancer, and Gateway and
  VirtualService resources route edge traffic to the application; Kiali, Prometheus, Grafana and Jaeger add-ons visualize the mesh.
