description: A CDK Pipelines construct provisions a CodePipeline whose synth step runs cdk synth in CodeBuild, a self-mutate step that updates the pipeline itself when its definition changes, and asset
  publishing steps that push Docker images and file assets to the bootstrapped buckets and ECR repositories of each target environment. Application stages then deploy CloudFormation stacks into the test
  and production accounts through the CDK bootstrap roles, optionally gated by manual approvals and grouped into waves.
