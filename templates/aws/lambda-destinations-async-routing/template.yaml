description: An HTTP API invokes a Lambda function asynchronously; the function's OnSuccess destination sends the execution record to an EventBridge bus and its OnFailure destination sends it to an SQS
  queue, with no code in the function for either. A rule on the bus triggers a notification function and a triage function drains the failure queue.
