- application recovery controller
source: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
description: Data stores are always on in the recovery Region through Aurora Global Database and S3 Cross-Region Replication, while the application tier is deployed from the same CloudFormation template
  with its Auto Scaling group at zero capacity. On failover the secondary Aurora cluster is promoted, the group is scaled out and Route 53 traffic is switched using a health check or an ARC routing control.
