description: Historical card transactions and the trained model artifacts live in one S3 bucket; an unsupervised Random Cut Forest anomaly detector and a supervised XGBoost fraud classifier trained in SageMaker
  are deployed to two managed real-time endpoints. Client applications call an API Gateway REST API whose Lambda function invokes both endpoints and streams the anomaly score and fraud prediction through
  Kinesis Data Firehose to a results S3 bucket, which an optional QuickSight dashboard visualises.
