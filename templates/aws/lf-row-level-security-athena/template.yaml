description: A product reviews table in S3 is catalogued in the Glue Data Catalog and governed by Lake Formation, where a data lake administrator creates data filters with row expressions such as marketplace
  equals US or JP. Each analyst role is granted SELECT through its filter, so the same Athena query returns only the rows the user is allowed to see and access is audited centrally.
