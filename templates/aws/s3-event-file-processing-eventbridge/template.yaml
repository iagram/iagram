image: https://d2908q01vomqb2.cloudfront.net/1b6453892473a467d07372d45eb05abc2031647a/2020/05/07/eb1.png
source: https://aws.amazon.com/blogs/compute/using-dynamic-amazon-s3-event-handling-with-amazon-eventbridge
description: An uploads bucket sends Object Created notifications to EventBridge, where rules match on object key suffix so CSV files go to an import function and JSON manifests start a Step Functions workflow.
  Processed output is written to a second bucket and metadata to DynamoDB; failed deliveries land in a dead-letter queue.
