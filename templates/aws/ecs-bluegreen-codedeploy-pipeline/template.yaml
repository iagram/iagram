title: Blue/green ECS deployments with CodeDeploy and CodePipeline
category: devops
tags:
- ecs
- codedeploy
- blue/green
- canary
- codepipeline
- alb
- ecr
source: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-bluegreen.html
description: An ECS service with the CODE_DEPLOY controller sits behind an ALB that has two target groups and a production plus a test listener; CodeDeploy creates a replacement task set in the green target
  group, exposes it on the test listener, then shifts production traffic all at once, linearly or by canary. A CodePipeline triggered by a new ECR image pushes the task definition and appspec to CodeDeploy,
  and a failed CloudWatch alarm rolls traffic back to the blue task set.
