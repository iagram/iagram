- edge protection
source: https://docs.aws.amazon.com/whitepapers/latest/aws-best-practices-ddos-resiliency/aws-best-practices-ddos-resiliency.html
description: The DDoS-resilient reference architecture fronts the application with Route 53 and CloudFront, attaches a WAF web ACL with rate-based and managed rules, and enrols the edge and load balancer
  resources in Shield Advanced. Traffic reaches an Application Load Balancer in public subnets while EC2 targets sit in private subnets, and Shield Advanced health-based detection plus the Shield Response
  Team cover layer 3 to layer 7 events.
