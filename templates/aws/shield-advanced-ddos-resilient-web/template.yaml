title: DDoS-resilient web application with Shield Advanced, WAF, and CloudFront
category: edge
tags:
- ddos
- shield advanced
- waf
- cloudfront
- route 53
- rate-based rules
image: https://docs.aws.amazon.com/images/waf/latest/developerguide/images/shield-resilient-web-app-arch.png
source: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-resiliency-example-web.html
description: A Route 53 hosted zone, a CloudFront distribution, and an AWS WAF web ACL sit between users and the application so the origin is obscured, requests are answered close to users, and layer 7
  floods are detected and mitigated with rate-based rules. Shield Advanced protects the hosted zone and the distribution, and the Elastic Load Balancer in the VPC only accepts traffic carrying a secret
  header set by CloudFront before forwarding it to the EC2 web servers.
