# Generated from the official reference (https://docs.aws.amazon.com/waf/latest/developerguide/ddos-resiliency-example-web.html); edit freely.
title: DDoS-resilient web application with Shield Advanced, WAF, and CloudFront
category: edge
tags:
- ddos
- shield advanced
- waf
- cloudfront
- route 53
- rate-based rules
source: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-resiliency-example-web.html
description: Route 53 hosted zones, a CloudFront distribution, and an AWS WAF web ACL sit between users and the application so the origin is obscured, requests are answered close to users, and layer 7 floods
  are detected and mitigated with rate-based rules. Shield Advanced protects the hosted zone, distribution, and the Application Load Balancer, and the load balancer only accepts traffic carrying a secret
  header set by CloudFront.
