description: Security Hub findings, CloudTrail, VPC flow logs, GuardDuty and WAF logs from many accounts land in a central S3 bucket, where a Lambda ETL function normalizes each log type to Elastic Common
  Schema and indexes it into an OpenSearch domain. Analysts correlate events across sources in OpenSearch Dashboards and configure alerts, keeping findings searchable beyond the Security Hub retention window.
