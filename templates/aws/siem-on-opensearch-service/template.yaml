description: Security Hub findings aggregated by the administrator account, WAF logs through a Kinesis Data Firehose delivery stream, GuardDuty exports and CloudTrail logs replicated from member-account
  log buckets all land in a centralized S3 bucket in the log account. Each new object triggers the es-loader Lambda function, which normalizes the log to Elastic Common Schema, enriches it with a GeoIP
  database kept in S3 by a download function and indexes it into an OpenSearch domain; analysts work in OpenSearch Dashboards and receive alerts by email through SNS.
