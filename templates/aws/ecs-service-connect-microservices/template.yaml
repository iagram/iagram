description: ECS Service Connect adds an ECS-managed Envoy proxy container to every task and registers each service under a logical name (ui, checkout, orders, catalog on port 80) in the svcconnect Cloud
  Map namespace, so the checkout service reaches orders and catalog by short name with client-side load balancing, retries and outlier detection. Only the UI service is exposed through Elastic Load Balancing;
  all other traffic stays service to service through the Service Connect proxies.
