source: https://docs.aws.amazon.com/xray/latest/devguide/xray-services-lambda.html
description: API Gateway with X-Ray tracing enabled samples incoming requests and propagates the trace header to a Lambda function with active tracing, where the Lambda-managed daemon emits the invocation
  segment and the X-Ray SDK records subsegments for DynamoDB and SQS calls. A downstream Lambda consumer of the queue is linked to the producer trace so the service map and trace timeline show the whole
  request path, and an X-Ray group filters traces with faults for a CloudWatch alarm.
