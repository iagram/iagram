- lambda
source: https://aws.amazon.com/blogs/machine-learning/create-video-subtitles-with-translation-using-machine-learning/
description: A video dropped in S3 triggers a Lambda that starts an Amazon Transcribe job; on completion an EventBridge rule invokes a second Lambda that converts the transcript into timed captions and
  translates them with Amazon Translate. A third Lambda synthesizes the translated text with Amazon Polly to produce an alternate audio track, and captions and audio are written to an output bucket for
  delivery.
