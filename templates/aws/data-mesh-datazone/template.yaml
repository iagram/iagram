source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/data-mesh-datazone/data-mesh-datazone.html
description: Producer accounts ingest raw data with AppFlow, DMS and Kinesis, transform it with Glue, measure quality with Glue Data Quality and publish S3, Redshift and RDS assets to a DataZone catalog
  hosted in a central governance account. Consumers search the DataZone portal, subscribe to assets and, once the owner approves, analyse them with Athena, Redshift, QuickSight and SageMaker in their own
  account.
