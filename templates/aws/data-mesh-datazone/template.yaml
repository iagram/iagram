description: Producer accounts ingest raw data with AppFlow, DMS, Kinesis, IoT Core and MSK into S3, RDS, Redshift and third-party sources, transform it with Glue, measure quality with Glue Data Quality
  and publish the assets to a DataZone domain hosted in a central governance account whose data portal, projects and catalog are reached through IAM Identity Center. Consumers search the DataZone portal,
  subscribe to assets and, once the owner approves, analyse them with Athena, Redshift, QuickSight and SageMaker in their own account.
