image: https://docs.aws.amazon.com/images/elasticloadbalancing/latest/application/images/alb-user-auth-flow.png
source: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
description: An HTTPS listener on the Application Load Balancer redirects unauthenticated users to the Cognito hosted UI, exchanges the returned authorization code for tokens, and sets an encrypted session
  cookie. Subsequent requests are validated by the load balancer and forwarded to backend instances with the user claims in headers, so the application code carries no login logic.
