title: Application Load Balancer built-in authentication with Cognito
category: web
tags:
- cognito
- alb authentication
- oidc
- session cookie
- auto scaling
image: https://docs.aws.amazon.com/images/elasticloadbalancing/latest/application/images/alb-user-auth-flow.png
source: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
description: An HTTPS listener on the Application Load Balancer redirects unauthenticated users to the identity provider's authorization endpoint, exchanges the returned authorization code at the token
  endpoint, fetches claims from the user-info endpoint, and sets an encrypted session cookie. Subsequent requests are validated by the load balancer and forwarded to the target with the user claims in headers,
  so the application code carries no login logic; here the identity provider is a Cognito user pool.
