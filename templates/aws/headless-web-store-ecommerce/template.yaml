description: Browsers and mobile or in-store apps reach the storefront through Route 53, AWS WAF, and CloudFront, sign in with Cognito, and are load balanced onto a Fargate web tier (frontend/UI) backed
  by ElastiCache and DynamoDB, while REST calls go through API Gateway to a Fargate and Lambda app tier of e-commerce microservices with its own ElastiCache and DynamoDB. EventBridge, EFS, S3, SQS, and
  MSK connect the tiers with each other and with third-party services such as payment, OMS, PIM, and CMS, and OpenSearch, Pinpoint, Location Service, and Lex provide search, engagement, store locator, and
  conversational features.
