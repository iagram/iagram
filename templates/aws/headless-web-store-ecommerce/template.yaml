description: A React storefront is delivered from S3 through CloudFront with AWS WAF, and the browser calls a GraphQL API on AppSync and REST APIs on API Gateway that Lambda functions serve. Shoppers authenticate
  with Cognito, catalog search runs on OpenSearch, orders and carts live in DynamoDB, and product recommendations come from Amazon Personalize.
