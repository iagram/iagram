description: A single global core network defined by a core network policy places a core network edge in every chosen Region and joins them over the AWS backbone; VPC attachments are mapped to production,
  development, and shared segments using attachment tags. Segments are isolated routing domains, and the policy's segment actions share the shared-services segment with the workload segments while keeping
  production and development apart.
