title: AWS Cloud WAN core network with segments across Regions
category: networking
tags:
- cloud wan
- core network
- segments
- multi-region
- policy-based routing
image: https://docs.aws.amazon.com/images/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/images/cloud-wan-diagram.png
source: https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-cloud-wan.html
description: A single global core network, defined by a core network policy inside a Network Manager global network, places a core network edge in every chosen Region and joins them over the AWS backbone.
  Attachments (VPCs, Site-to-Site VPNs, SD-WAN Connect and peered existing transit gateways) are mapped to development, production and shared segments, each an isolated routing domain with its own route
  table; segment actions share the shared-services segment with the workload segments while keeping production and development apart.
