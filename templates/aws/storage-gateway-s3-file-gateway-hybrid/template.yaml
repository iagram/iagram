source: https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html
description: An S3 File Gateway VM in the data center exposes NFS and SMB file shares that map to S3 buckets, keeping recently used data in a local cache while objects are stored durably in S3. Cloud applications
  read the same objects directly, lifecycle rules tier them to colder classes, and Cross-Region Replication provides an off-site copy.
