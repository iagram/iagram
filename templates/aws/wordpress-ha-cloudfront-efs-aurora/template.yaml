description: Route 53 resolves the site to CloudFront, which caches content close to users, pulling static assets from an S3 bucket and dynamic pages through the internet gateway to an Application Load
  Balancer in front of an Auto Scaling group of WordPress instances in the private application subnets of two Availability Zones. NAT gateways and a bastion host live in the public subnets, every instance
  mounts a shared EFS file system through a mount target in each zone, caches queries in an ElastiCache for Memcached node per zone, and stores the WordPress database in an Aurora MySQL cluster whose writer
  is joined by a read replica.
