description: CloudFront caches content close to users, pulling static files from an S3 bucket and dynamic pages from an Application Load Balancer in front of an Auto Scaling group of WordPress instances.
  Every instance mounts a shared EFS file system through a mount target in each Availability Zone, caches queries in ElastiCache, and stores the WordPress database in Aurora MySQL.
