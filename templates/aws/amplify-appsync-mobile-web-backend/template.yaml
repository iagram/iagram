title: Modern serverless mobile and web backend with Amplify, Cognito, and AppSync
category: web
tags:
- amplify
- appsync
- graphql
- cognito
- mobile backend
- dynamodb
- pinpoint
image: https://docs.aws.amazon.com/images/reference-architecture-diagrams/latest/modern-serverless-mobile-web/images/modern-serverless-mobile-web.png
source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/modern-serverless-mobile-web/modern-serverless-mobile-web.html
description: Mobile and web clients built with the Amplify libraries authenticate against a Cognito user pool and send GraphQL queries, mutations, and subscriptions to AppSync, whose resolvers invoke Lambda,
  an API Gateway API, DynamoDB, and an Elasticsearch domain kept in sync by a DynamoDB Streams Lambda; Pinpoint pushes notifications back to the clients. API Gateway reaches an ECS Fargate application tier
  over PrivateLink and a Network and Application Load Balancer, with DAX and Redshift in private database subnets across two Availability Zones, a CodeCommit, CodeBuild, CodeDeploy, and CodePipeline pipeline
  publishing images to ECR, and Kinesis Data Firehose landing application data in S3 for Glue, Athena, and QuickSight.
