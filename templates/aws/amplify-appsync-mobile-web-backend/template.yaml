description: Mobile and web clients built with the Amplify libraries authenticate against a Cognito user pool and exchange the JWT for AWS credentials through an identity pool. Authenticated clients run
  GraphQL queries, mutations, and subscriptions on AppSync, whose resolvers read DynamoDB directly or invoke Lambda for business logic, while user files land in S3 and Pinpoint records analytics events.
