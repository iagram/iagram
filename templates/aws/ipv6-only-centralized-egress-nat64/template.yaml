source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/ipv6-vpc-architectures/ipv6-centralized-egress-nat64.html
description: Workloads in IPv6-only subnets enable DNS64 so that IPv4-only destinations resolve to synthesized addresses in the 64:ff9b::/96 well-known prefix, and a route for that prefix points at the
  Transit Gateway. The Transit Gateway forwards to a central egress VPC where NAT gateways perform NAT64 to translate to IPv4 and send the traffic through the internet gateway, while native IPv6 traffic
  exits through the egress VPC's egress-only internet gateway.
