title: IPv6-only workloads reaching IPv4 destinations with centralized NAT64 and DNS64
category: networking
tags:
- ipv6-only
- nat64
- dns64
- nat gateway
- transit gateway
- centralized egress
image: https://docs.aws.amazon.com/images/reference-architecture-diagrams/latest/ipv6-vpc-architectures/images/ipv6-vpc-architectures-11.png
source: https://docs.aws.amazon.com/reference-architecture-diagrams/latest/ipv6-vpc-architectures/ipv6-centralized-egress-nat64.html
description: An instance in the IPv6-only private subnet of spoke VPC A enables DNS64 so that IPv4-only destinations resolve to synthesized addresses in the 64:ff9b::/96 well-known prefix; the subnet route
  table sends that prefix and "::/0" to the Transit Gateway ENI in the spoke's TGW subnet. The Transit Gateway route table forwards to the egress VPC, whose TGW subnet route table points 64:ff9b::/96 at
  the NAT gateway in the public subnet; the NAT gateway performs NAT64 to translate to IPv4 and the public subnet route table sends the traffic through the internet gateway to the internet.
