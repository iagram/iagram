description: Producers write records to a Kinesis data stream that three Lambda functions consume through event source mappings; with the default shared-throughput consumers the pollers read intermittently
  via the GetRecords API, and registering enhanced fan-out consumers gives each function dedicated 2 MB/s per shard over HTTP/2 instead. The functions land their results in an S3 bucket, a DynamoDB table
  and a downstream Kinesis data stream.
