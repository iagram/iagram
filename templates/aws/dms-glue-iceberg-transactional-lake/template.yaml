description: DMS runs a full load and then CDC from a PostgreSQL source into a raw S3 layer organised by schema and table; a Glue job driven by Parameter Store configuration and job bookmarks deduplicates
  the change files and merges them into Iceberg tables in a stage layer. The Iceberg tables are registered in the Glue Data Catalog, optionally governed by Lake Formation, scheduled through EventBridge
  and queried with Athena.
