source: https://aws.amazon.com/blogs/big-data/automate-replication-of-relational-sources-into-a-transactional-data-lake-with-apache-iceberg-and-aws-glue/
description: A DMS replication task runs a full load and then CDC from a relational source into a raw S3 bucket organised by data source, schema and table as Parquet files; a Glue ETL job deployed by a
  CloudFormation stack, scheduled by EventBridge, configured through job and table parameters in Parameter Store and running a Python script kept in a Glue bucket, deduplicates the change files and merges
  them into Iceberg tables in a stage bucket organised by domain and table. The Iceberg tables are registered in per-domain Glue Data Catalog databases and queried with Athena.
