description: Documents in S3 are chunked and embedded by a Bedrock Knowledge Base, which stores vectors in an OpenSearch Serverless collection. At query time an orchestrating Lambda behind API Gateway calls
  RetrieveAndGenerate, so the knowledge base fetches the most similar chunks and a Bedrock foundation model composes a grounded answer.
