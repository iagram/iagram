description: A developer pushes a Dockerfile and handler to a Git repository; CodeBuild builds an image from a Lambda base image and pushes it to an ECR registry, and the Lambda function is created from
  that image URI (up to 10 GB) so Lambda pulls and caches it in its execution environment. The user invokes the function directly or through an API Gateway HTTP API, keeping Docker-based tooling while running
  serverless.
