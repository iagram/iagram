source: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/deploy-lambda-functions-with-container-images.html
description: CodeBuild builds an image from a Lambda base image and pushes it to ECR; the Lambda function is created from that image URI (up to 10 GB) and Lambda pulls and caches it in its execution environment.
  An API Gateway HTTP API routes requests to the function, which reads and writes a DynamoDB table, so a team keeps its Docker-based tooling while running serverless.
