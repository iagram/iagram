description: A change stream on a Spanner database records every insert, update and delete, and the Spanner change streams to BigQuery Dataflow template reads it, converts change records into rows with
  commit timestamp and modification type, and appends them to BigQuery tables. A separate Spanner metadata database tracks partition progress and failed records are written to a Cloud Storage dead-letter
  path.
