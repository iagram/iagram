title: End-user authentication with Identity Platform for a Cloud Run app on Cloud SQL
category: serverless
tags:
- identity platform
- cloud run
- cloud sql
- secret manager
- end user auth
- firebase sdk
source: https://docs.cloud.google.com/run/docs/tutorials/identity-platform
description: The browser client loaded from a Cloud Run service signs users in through Identity Platform with the Firebase SDK and obtains an ID token that it sends on each vote request; the service verifies
  the token with the Firebase Admin SDK before acting. The service uses its own least-privilege service account and a Secret Manager secret to connect to a Cloud SQL for PostgreSQL instance, keeping end-user
  identity separate from service-to-database credentials.
