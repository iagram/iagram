image: https://docs.cloud.google.com/static/run/docs/tutorials/images/idp-sql-architecture.png
source: https://docs.cloud.google.com/run/docs/tutorials/identity-platform
description: End users load the app from the Cloud Run server, which returns a login form built with the Firebase SDK; the form signs the user in with Google through Identity Platform, the authentication
  service and account store, and the resulting ID token is verified by the server with the Firebase Admin SDK on each vote request. The server reads its database credentials from a Secret Manager secret
  and stores votes in a Cloud SQL for PostgreSQL instance, keeping end-user identity separate from service-to-database credentials.
