source: https://docs.cloud.google.com/vertex-ai/docs/model-monitoring/overview
description: Requests to a Vertex AI online endpoint are logged to BigQuery, and a Vertex AI model monitor compares the serving feature distributions against the training baseline in Cloud Storage on a
  schedule to detect skew and drift. Threshold breaches raise Cloud Monitoring alerts that publish to Pub/Sub, where a Cloud Run function triggers the retraining pipeline in Vertex AI Pipelines to refresh
  the deployed model.
