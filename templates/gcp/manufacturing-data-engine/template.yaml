image: https://docs.cloud.google.com/static/manufacturing-data-engine/images/architecture.png
source: https://docs.cloud.google.com/manufacturing-data-engine/docs/overview
description: Manufacturing Connect edge gateways in the customer factory (drawn as an external server next to the PLC devices) translate industrial protocols (OPC UA, MQTT) into standardised messages on
  the input-messages Pub/Sub topic, while batch files from other sources land in a Cloud Storage bucket read by a GCS reader Dataflow job. Inside the VPC the Message Mapper (Whistle source classes), Configuration
  Manager (tag creation, backed by Cloud SQL and Memorystore for Redis) and Metadata Manager (metadata enrichment) run on GKE and hand records to the sinks, Pub/Sub sink and BigQuery sink on GKE and Bigtable
  writer, GCS writer and transformations (event change window) Dataflow jobs, which write to the output topic, BigQuery, Bigtable and Cloud Storage; a Federation API on GKE exposes the data to Looker and
  applications.
