image: https://docs.cloud.google.com/static/manufacturing-data-engine/images/architecture.png
source: https://docs.cloud.google.com/manufacturing-data-engine/docs/overview
description: Manufacturing Connect edge gateways on the factory floor translate industrial protocols (OPC UA, MQTT) into standardised messages on the input-messages Pub/Sub topic, where the Message Mapper
  and Metadata Manager transform them with Whistle mappings and enrich them with asset metadata. Processed records are written to BigQuery, Bigtable and Cloud Storage sinks, republished on an output topic,
  and exposed through a Federation API and Looker for analytics.
