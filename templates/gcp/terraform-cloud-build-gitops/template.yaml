source: https://docs.cloud.google.com/docs/terraform/resource-management/managing-infrastructure-as-code
description: A single GitHub repository holds Terraform code on short-lived feature branches plus a dev and a prod branch; Cloud Build triggers run terraform plan on feature-branch pushes and terraform
  init, plan and apply on merges to dev or prod, creating the firewall rules, subnet and Apache Compute Engine VM of each environment's VPC network. Terraform state is stored remotely in a Cloud Storage
  bucket and the Cloud Build service account carries the IAM permissions needed to create resources in the target environments.
