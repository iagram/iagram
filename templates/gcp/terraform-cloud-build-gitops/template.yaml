description: A single Git repository holds Terraform code with a dev and a prod branch, and Cloud Build triggers run terraform plan on feature-branch pull requests and terraform init, plan and apply on
  merges to an environment branch. Terraform state is stored remotely in a Cloud Storage bucket and the Cloud Build service account carries the IAM permissions needed to create resources in the target environments.
