description: On-premises connects to Google Cloud through a supported service provider whose peering edge meets the Google peering edge in a colocation facility; two Partner Interconnect VLAN attachments
  in separate edge availability domains terminate on a Cloud Router in the VPC region. For Layer 3 partners the provider's routers peer with the Cloud Router; for Layer 2 partners the customer's on-premises
  router runs BGP directly to the Cloud Router.
