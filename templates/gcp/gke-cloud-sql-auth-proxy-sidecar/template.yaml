title: GKE workload connecting to Cloud SQL through an Auth Proxy sidecar with Workload Identity
category: containers
tags:
- gke
- cloud sql
- cloud sql auth proxy
- sidecar
- workload identity federation
- iam database auth
source: https://docs.cloud.google.com/sql/docs/mysql/connect-kubernetes-engine
description: The application pod runs the Cloud SQL Auth Proxy as a sidecar so the app connects to localhost while the proxy opens an IAM-authenticated, TLS-encrypted tunnel to the Cloud SQL instance. The
  pod's Kubernetes service account is bound to a Google service account through Workload Identity Federation for GKE, so no key file is mounted; database credentials come from a Kubernetes Secret populated
  from Secret Manager.
