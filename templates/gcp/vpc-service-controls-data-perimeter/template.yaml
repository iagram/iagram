description: A service perimeter encloses the projects holding BigQuery datasets and Cloud Storage buckets so those APIs can only be called from inside the perimeter, blocking copies to outside projects
  even with stolen credentials. Workloads reach the APIs privately through the restricted.googleapis.com VIP via a Cloud DNS private zone and static route, while ingress rules with an access level admit
  on-premises analysts from corporate IP ranges.
