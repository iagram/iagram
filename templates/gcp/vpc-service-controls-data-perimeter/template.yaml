title: VPC Service Controls perimeter for data exfiltration protection
category: security
tags:
- vpc service controls
- service perimeter
- restricted googleapis
- access level
- data exfiltration
image: https://docs.cloud.google.com/static/vpc-service-controls/images/service_perimeter.png
source: https://docs.cloud.google.com/vpc-service-controls/docs/overview
description: A service perimeter encloses the authorized project and its VPC project holding a Cloud Storage bucket with sensitive data and a BigQuery dataset, so those APIs can only be called from inside
  the perimeter and copies to outside projects are blocked even with stolen credentials. An unauthorized client on the internet, a VM in an unauthorized VPC project using Private Google Access, a VM inside
  the perimeter calling a service in an unauthorized project and a service-to-service copy into that project are all denied, while the VM inside the perimeter reads and writes the bucket freely.
