source: https://docs.cloud.google.com/sql/docs/mysql/connect-app-engine-standard
description: An App Engine standard service in the same region as a Cloud SQL for MySQL instance connects through the /cloudsql Unix socket that App Engine provides, authorized by the app's service account
  holding Cloud SQL Client. For private IP the app uses a Serverless VPC Access connector into the instance's VPC, and database credentials are read from Secret Manager rather than environment variables;
  static assets are served from a Cloud Storage bucket.
