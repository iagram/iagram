source: https://docs.cloud.google.com/run/docs/tutorials/pubsub
description: Producers publish to a Pub/Sub topic whose push subscriptions deliver each message to Cloud Run services and a Cloud Run function in parallel, authenticated with OIDC tokens from a dedicated
  invoker service account. An Eventarc trigger adds Cloud Storage object-finalized events to the same topic-driven flow, so uploads and application events share one serverless processing path.
