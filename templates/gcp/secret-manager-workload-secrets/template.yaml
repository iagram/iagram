source: https://docs.cloud.google.com/secret-manager/docs/overview
description: Application credentials are stored as versioned Secret Manager secrets with user-managed replication to the serving regions and encrypted with a Cloud KMS CMEK key, and access is granted per
  secret to the workload service accounts of a Cloud Run service and a GKE cluster. A rotation schedule publishes to a Pub/Sub topic that triggers a Cloud Run function to generate a new database password,
  add a new secret version and update the Cloud SQL user.
