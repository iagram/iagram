description: A Memorystore for Redis instance is authorized on a VPC network and only exposes a private IP, so the Cloud Run service is deployed with Direct VPC egress into a subnet of that network and
  reaches Redis on port 6379 without a managed connector. A Serverless VPC Access connector is the alternative path for projects that cannot use Direct VPC egress, and the Redis host and port are passed
  to the container as environment variables.
