description: Developers iterate in Cloud Shell with Cloud Code against a minikube development cluster and push to a Cloud Source Repositories repository that is replicated from GitHub; each commit triggers
  Cloud Build to build and test the container, store build artifacts in Cloud Storage and push the image to Artifact Registry. Cloud Deploy then creates a release from the shared Skaffold configuration,
  stores the rendered deploy artifacts in a second bucket and promotes it from the staging GKE cluster to production after a manual approval.
