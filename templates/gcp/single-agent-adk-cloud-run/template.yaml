description: A frontend Cloud Run service forwards application user prompts to an Agent Development Kit agent whose runtime is a second Cloud Run service; the agent reasons with a Gemini model on Vertex
  AI and decides which tools to call. Tool calls go through built-in tools and Model Context Protocol servers to enterprise data such as BigQuery, session state is persisted in Firestore, and logs, traces
  and metrics flow to Google Cloud Observability.
