description: A frontend Cloud Run service forwards user prompts to an Agent Development Kit agent hosted on a second Cloud Run service, which reasons with a Gemini model on Vertex AI and decides which tools
  to call. Tool calls go through Model Context Protocol servers to enterprise data such as Firestore and BigQuery, session state is persisted, and logs and traces flow to Cloud Observability.
