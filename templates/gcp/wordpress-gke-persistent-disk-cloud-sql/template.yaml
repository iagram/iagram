description: A single-replica WordPress Deployment on a GKE cluster claims a 200 GB Persistent Disk through a PersistentVolumeClaim for wp-content, and a Cloud SQL Auth Proxy sidecar in the same pod tunnels
  database traffic to a Cloud SQL for MySQL instance using a service account key stored in a Kubernetes Secret. A Service of type LoadBalancer exposes the blog on an external IP over HTTP.
