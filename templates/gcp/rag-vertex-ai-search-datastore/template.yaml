description: Data engineers upload raw documents for RAG to Cloud Storage in the data ingestion subsystem, from where a Cloud Run data preparation function imports them into a managed Vertex AI Search data
  store that parses, chunks, embeds and indexes the content without a self-managed vector database. In the serving subsystem a Cloud Run frontend and backend forward application user questions to the Gemini
  Enterprise search app, which runs a vector semantic search over the data store, optimizes the prompt and returns a grounded answer.
