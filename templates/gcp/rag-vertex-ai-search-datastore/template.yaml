description: Raw documents uploaded to Cloud Storage trigger Cloud Run functions through Pub/Sub that generate metadata, after which a managed Vertex AI Search data store parses, chunks, embeds and indexes
  the content without a self-managed vector database. A Cloud Run frontend and backend forward user questions to the Gemini Enterprise API, which searches the data store, augments the prompt and returns
  a grounded answer.
