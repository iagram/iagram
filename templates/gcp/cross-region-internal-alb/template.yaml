description: A single global VPC spans two regions, each with a workload subnet holding a client VM and a global forwarding rule with a regional internal IP address, plus a proxy-only subnet for the managed
  Envoy proxies. Both forwarding rules point at the same global target proxy and URL map in front of one global internal backend service, and a Cloud DNS routing policy hands each client the IP of its own
  region while allowing failover to the other region's forwarding rule.
