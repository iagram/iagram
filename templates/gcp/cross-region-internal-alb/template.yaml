description: A single global VPC spans two regions, each with a workload subnet, a proxy-only subnet for the managed Envoy proxies and a managed instance group backend attached to one global internal backend
  service. Two forwarding rules with regional internal IPs point at the same global target proxy, so clients in either region hit local proxies and fail over to the other region's backends when needed.
