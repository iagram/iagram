source: https://docs.cloud.google.com/bigtable/docs/schema-design-time-series
description: Sensor readings are published to Pub/Sub and a Dataflow streaming job writes them into a Bigtable table using a time-bucketed row key design that spreads writes and keeps recent measurements
  adjacent. Serving applications read the latest rows from Bigtable with single-digit millisecond latency, and a nightly Dataflow batch exports history to BigQuery for analytics.
