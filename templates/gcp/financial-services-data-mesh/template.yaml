source: https://docs.cloud.google.com/architecture/design-self-service-data-platform-data-mesh
description: A central data platform team runs a self-service data platform whose common services are a metadata and discovery layer (Data Catalog tag templates and lineage, Knowledge Catalog logical data
  organisation and glossary) and central policy management (policy tag taxonomies), plus a data products development environment template that bundles data operations (IAM groups, Cloud Logging, Cloud Monitoring
  freshness alerts), data storage (Cloud Storage, BigQuery, Bigtable, Pub/Sub), data processing (Dataflow, Managed Service for Apache Spark), an Agent Platform endpoint and a Cloud Run data product interface.
  A data workspace project factory built from Cloud Build and Terraform templates provisions the domain projects (for example payments) where Pub/Sub and Dataflow feed BigQuery data products catalogued
  as Dataplex lake assets and shared through an Analytics Hub exchange.
