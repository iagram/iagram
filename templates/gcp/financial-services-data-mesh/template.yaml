description: Business domains (for example payments and risk) each own a project where Pub/Sub and Dataflow feed BigQuery data products that are catalogued as Dataplex lake assets and exposed through authorized
  views. A central platform team provides Terraform project templates via Cloud Build, an Analytics Hub exchange for cross-domain sharing, and common observability such as freshness alerts on data products.
