description: User interaction events streamed through Pub/Sub into BigQuery train a BigQuery ML matrix factorization model on implicit feedback, and ML.RECOMMEND materializes ranked item lists per user
  on a schedule. The precomputed recommendations are exported to Memorystore for low-latency reads by a Cloud Run API, while the model is also registered in Vertex AI Model Registry and deployed to an online
  endpoint for cold-start scoring.
