description: The product catalog (from BigQuery, Cloud Storage or the API) and global and local inventories are ingested into Vertex AI Search for commerce, and an e-commerce frontend on Cloud Run calls
  its search, browse and recommendations API while recording user events (ranking, personalisation, dynamic facets) in real time. Google Tag Manager transforms and pushes the analytics stream into the user
  events topic, products and user events are exported to BigQuery, and Google Analytics 4 receives the streamed analytics while its export is imported into BigQuery for measurement.
