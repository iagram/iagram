description: An Assured Workloads folder created for a compliance regime such as the EU Data Boundary applies a control package of organization policies, including gcp.resourceLocations restricted to EU
  regions and restricted service usage, to every project beneath it. A separate key management project in the same boundary provides CMEK keys for Cloud Storage and Cloud SQL, Access Transparency logs Google
  personnel actions, and violation monitoring raises alerts when a policy or resource drifts out of compliance.
