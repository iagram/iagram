title: Hub-and-spoke with VPC Network Peering
category: networking
tags:
- vpc peering
- hub and spoke
- custom route export
- non-transitive
image: https://docs.cloud.google.com/static/vpc/images/peering/network-peering-routes-global.svg
source: https://docs.cloud.google.com/vpc/docs/vpc-peering
description: Each spoke VPC is peered with a central hub VPC (importing and exporting custom routes) that hosts a shared-services subnet, an HA VPN gateway and a Cloud Router speaking BGP to on-premises;
  with global dynamic routing the hub exports the on-premises prefixes so spokes learn them, and each VPC also keeps its own static routes such as the default route to the internet gateway. Spoke A spans
  two regions; peering is non-transitive, so spokes cannot talk to each other through the hub unless a network virtual appliance or NCC is added.
