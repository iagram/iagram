description: Each spoke VPC is peered with a central hub VPC that hosts shared services and the hybrid connectivity to on-premises; the hub exports custom dynamic routes so spokes learn on-premises prefixes.
  Peering is non-transitive, so spokes cannot talk to each other through the hub unless a network virtual appliance or NCC is added.
