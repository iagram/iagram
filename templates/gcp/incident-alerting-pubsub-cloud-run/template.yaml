description: Cloud Monitoring alerting policies send incident notifications to a Pub/Sub notification channel in addition to Slack for redundancy, and a push subscription delivers each JSON notification
  to a Cloud Run handler. The handler enriches the incident and starts a Workflows remediation run, while a BigQuery subscription on the same topic keeps a queryable history of every alert.
