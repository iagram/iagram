description: Scheduled queries transform raw event tables into a feature dataset in BigQuery, and CREATE MODEL statements train BigQuery ML models in SQL directly on those features. Trained models are registered
  in Vertex AI Model Registry and deployed to an endpoint for online prediction, while batch predictions run with ML.PREDICT back into BigQuery tables.
