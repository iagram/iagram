source: https://docs.cloud.google.com/bigquery/docs/generate-multimodal-embeddings
description: Images and video frames uploaded to Cloud Storage are exposed as a BigQuery object table through a Cloud resource connection, and a remote model wrapping the Vertex AI multimodal embedding
  model generates embeddings with AI.GENERATE_EMBEDDING. A vector index over the embeddings table lets a Cloud Run search service run text-to-image semantic queries with VECTOR_SEARCH, with new uploads
  incrementally embedded by a scheduled query.
