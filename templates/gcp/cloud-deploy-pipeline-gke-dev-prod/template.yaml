description: A Cloud Deploy delivery pipeline defines a serial progression of two targets, each pointing at a GKE cluster, and a Skaffold configuration describes the Kubernetes manifests to render. Creating
  a release with a digest-qualified image from Artifact Registry automatically rolls out to the dev target; promoting the release creates a rollout to the prod target, and Cloud Deploy stores rendered manifests
  in a Cloud Storage bucket.
