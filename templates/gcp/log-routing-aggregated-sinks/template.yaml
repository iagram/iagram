source: https://docs.cloud.google.com/logging/docs/export/aggregated_sinks
description: An organization-level aggregated sink with an inclusion filter routes audit and workload logs from every project to a central logging project, where they land in a Cloud Logging bucket for
  search, a BigQuery dataset for analysis, a Cloud Storage bucket for long-term retention and a Pub/Sub topic for an external SIEM such as Splunk. The sink's service account is granted write access on each
  destination.
