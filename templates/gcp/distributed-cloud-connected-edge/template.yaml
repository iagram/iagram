description: Google Distributed Cloud connected runs GKE clusters on Google-provided hardware installed at the customer site, and each deployment reaches Google Cloud services and the customer VPC over
  a Cloud VPN connection. Clusters are registered to a fleet so that container images, configuration and monitoring are managed centrally from the region while workloads (containers, VMs, GPU jobs) run
  locally at the edge.
