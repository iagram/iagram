description: An on-premises data center connects to a Shared VPC host project over redundant Dedicated or Partner Interconnect VLAN attachments, with HA VPN as an encrypted backup path, and Cloud Router
  exchanges routes over BGP. Service projects attach to the Shared VPC so workloads consume the hybrid link and centrally managed subnets without owning network resources.
