description: An on-premises team copies data to a Transfer Appliance over NFS or SCP; the appliance encrypts it with AES-256 under a customer-managed Cloud KMS key and is shipped to Google, where the data
  is uploaded to the customer's Cloud Storage bucket. Once landed, a Dataproc cluster and BigQuery load jobs process the archive into analytics-ready tables.
