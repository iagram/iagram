description: A Cloud Run service runs under a dedicated service account holding the Cloud SQL Client role and reads the database password from a Secret Manager secret mounted at deploy time. With Direct
  VPC egress the revision gets an address in the VPC subnet and talks TCP 5432 to the private IP of a regional Cloud SQL instance in the same region; the container image is pulled from Artifact Registry.
