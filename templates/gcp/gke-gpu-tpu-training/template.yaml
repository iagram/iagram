description: A GKE cluster, whose Google-managed Kubernetes control plane (API server, scheduler, resource controllers and storage) is the cluster resource itself, schedules distributed training jobs submitted
  through JobSet and Kueue onto accelerator node pools. The multi-host TPU slice node pool runs ct5lp-hightpu-4t machines in a 4x4 topology whose TPU VMs exchange data over inter-chip interconnect (ICI)
  links, and an optional GPU node pool hosts NVIDIA workers.
