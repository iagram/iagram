description: A GKE cluster provides accelerator node pools, either multi-host TPU slices or NVIDIA GPU nodes, on which JobSet and Kueue schedule distributed training jobs built from images in Artifact Registry.
  Training data and checkpoints live in Cloud Storage mounted through Cloud Storage FUSE, and the finished model artifacts are uploaded to Vertex AI Model Registry for serving.
