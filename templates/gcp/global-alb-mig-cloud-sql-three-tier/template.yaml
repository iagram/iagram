title: Three-tier web app on managed instance groups behind a global external Application Load Balancer
category: web
tags:
- global external application load balancer
- managed instance group
- cloud sql
- memorystore
- three tier
- compute engine
image: https://docs.cloud.google.com/static/load-balancing/images/https-load-balancer-simple-gxlb.svg
source: https://docs.cloud.google.com/load-balancing/docs/https/setup-global-ext-https-compute
description: Internet clients reach the load balancer's global forwarding rule on a reserved IPv4 or IPv6 address, which hands HTTPS to a target HTTPS proxy holding a Google-managed SSL certificate; the
  URL map routes to a backend service whose backend is a managed instance group of web VMs in a zone of the web subnet. The web tier reads session state from Memorystore for Redis and persists data in a
  Cloud SQL instance reached over private IP in the same VPC.
