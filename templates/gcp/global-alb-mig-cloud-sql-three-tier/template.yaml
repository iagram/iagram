title: Three-tier web app on managed instance groups behind a global external Application Load Balancer
category: web
tags:
- global external application load balancer
- managed instance group
- cloud sql
- memorystore
- three tier
- compute engine
source: https://docs.cloud.google.com/load-balancing/docs/https/setup-global-ext-https-compute
description: A global forwarding rule on a reserved anycast IP hands HTTPS to a target HTTPS proxy holding a Google-managed certificate; the URL map routes to a backend service whose backends are regional
  managed instance groups built from an instance template and watched by an HTTP health check. The web tier reads session state from Memorystore for Redis and persists data in a regional Cloud SQL instance
  reached over private IP, while a Cloud NAT gateway gives the private VMs outbound access for package updates.
