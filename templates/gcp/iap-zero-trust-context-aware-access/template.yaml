source: https://docs.cloud.google.com/iap/docs/cloud-iap-context-aware-access-howto
description: Identity-Aware Proxy sits in front of a global external Application Load Balancer backend and authenticates every request with Google or federated identities, then authorizes it against the
  IAP-secured Web App User role. Access levels defined in Access Context Manager, based on corporate IP ranges and device posture from Chrome Enterprise Premium, are attached as IAM conditions so only trusted
  users on healthy devices reach the internal application without a VPN.
