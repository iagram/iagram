description: Four Dedicated Interconnect connections (int-lga1, int-lga2, int-iad1, int-iad2) are provisioned in two metropolitan areas, LGA (New York) and IAD (Ashburn), two per metro in separate colocation
  facilities and edge availability domains, each terminating on an on-premises customer router (ASN 12345). One VLAN attachment per connection lands on a Cloud Router in us-central1 or us-east1 with its
  own BGP session on a 169.254.x.x/29 link, and the VPC uses global dynamic routing so any region reaches on-premises over any surviving path.
