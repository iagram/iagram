description: Uploaded data lands in Cloud Storage, a Pub/Sub message triggers a Cloud Run function that chunks the content and stores Vertex AI embeddings as pgvector columns in an AlloyDB cluster. The
  serving path embeds the user query, runs a semantic search in AlloyDB, builds a grounded prompt for the Vertex AI LLM, and an asynchronous evaluation function scores responses and loads the results into
  BigQuery.
