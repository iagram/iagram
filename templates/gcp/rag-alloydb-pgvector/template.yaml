image: https://docs.cloud.google.com/static/architecture/images/rag-capable-gen-ai-app-using-vertex-ai-architecture.svg
source: https://docs.cloud.google.com/architecture/rag-capable-gen-ai-app-using-vertex-ai
description: Uploaded RAG data and evaluation prompts land in Cloud Storage in the data ingestion subsystem, a Pub/Sub message triggers a Cloud Run function that chunks the content and stores Vertex AI
  embeddings as pgvector columns in an AlloyDB cluster. The serving subsystem embeds the application user's query, runs a semantic search in AlloyDB and builds a grounded prompt for the Vertex AI LLM, while
  the quality evaluation subsystem, started by an evaluation trigger or by served responses, scores answers asynchronously and loads the results into BigQuery.
