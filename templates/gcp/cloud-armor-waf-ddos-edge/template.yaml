image: https://docs.cloud.google.com/static/armor/images/ip-bl-wl-1.svg
source: https://docs.cloud.google.com/armor/docs/cloud-armor-overview
description: Users reach the anycast frontend of a global external Application Load Balancer through their ISP, and the request terminates at the nearest Google Edge point of presence where a Cloud Armor
  security policy enforces IP allow/deny lists, preconfigured OWASP Core Rule Set WAF rules, rate limiting and geo-based rules before any traffic crosses into Google's network. Always-on Layer 3/4 DDoS
  mitigation absorbs volumetric attacks at the edge, Adaptive Protection suggests Layer 7 mitigation rules, and only allowed requests travel over the Google backbone to the backend service, which spreads
  them across regional managed instance groups in Google data centers.
