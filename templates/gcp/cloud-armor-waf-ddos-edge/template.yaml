source: https://docs.cloud.google.com/armor/docs/cloud-armor-overview
description: A Cloud Armor security policy attached to the backend service of a global external Application Load Balancer evaluates preconfigured OWASP Core Rule Set WAF rules, rate-limiting and geo-based
  rules at Google's edge before traffic enters the VPC. Always-on Layer 3/4 DDoS mitigation protects the anycast frontend, Adaptive Protection suggests Layer 7 mitigation rules, and Cloud CDN serves cacheable
  content while regional managed instance groups run the application.
