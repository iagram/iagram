title: Cloud Run behind a global external Application Load Balancer with a serverless NEG and Cloud Armor
category: web
tags:
- cloud run
- serverless neg
- global external application load balancer
- cloud armor
- cloud cdn
- multi-region
source: https://docs.cloud.google.com/load-balancing/docs/https/setup-global-ext-https-serverless
description: Cloud Run services in two regions are registered in regional serverless network endpoint groups that are the backends of one global backend service, so a single anycast IP with a Google-managed
  certificate routes users to the nearest healthy region. A Cloud Armor security policy attached to the backend service filters traffic at the edge and Cloud CDN caches cacheable responses; ingress on the
  services is restricted to internal-and-load-balancer traffic.
