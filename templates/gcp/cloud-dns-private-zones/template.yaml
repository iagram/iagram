image: https://docs.cloud.google.com/static/dns/images/Diagram-2-with-cross-project-binding.svg
source: https://docs.cloud.google.com/dns/docs/zones/zones-overview
description: In a Shared VPC organization each service project owns a private managed zone (service1.example.com, service2.example.com) that is bound across projects to the Shared VPC network of the host
  project, so instances in the shared subnet resolve internal names from both zones. The network admin grants the dns.networks.bindPrivateDNSZone IAM permission on the host project, and each application
  admin holds dns.managedZones.create on their own service project to create the zone and attach it to the shared network.
