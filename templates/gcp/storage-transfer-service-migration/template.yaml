source: https://docs.cloud.google.com/architecture/migration-to-google-cloud-transferring-your-large-datasets
description: Storage Transfer Service jobs copy objects from an on-premises file system through transfer agents and from Amazon S3 buckets over the internet or Interconnect into a Cloud Storage landing
  bucket, with checksums validating each object. Pub/Sub notifications report job completion, a Cloud Function moves validated data to a curated bucket, and BigQuery loads it for analytics.
