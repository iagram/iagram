# Generated from the official reference (https://docs.cloud.google.com/bigquery/docs/geospatial-intro); edit freely.
title: Geospatial analytics with BigQuery GEOGRAPHY and streaming locations
category: analytics-bi
tags:
- geospatial
- bigquery gis
- geography
- pub/sub
- dataflow
- looker
source: https://docs.cloud.google.com/bigquery/docs/geospatial-intro
description: Vehicle and customer location events stream through Pub/Sub and Dataflow into BigQuery tables with GEOGRAPHY columns, while static boundaries and store locations are loaded from GeoJSON and
  shapefiles in Cloud Storage. Geography functions such as ST_DWITHIN and ST_CONTAINS join the streams against polygons, and Looker and BigQuery Geo Viz render the results on maps.
