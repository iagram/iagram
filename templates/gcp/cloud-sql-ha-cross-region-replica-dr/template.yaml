title: Cloud SQL regional HA with cross-region replica for DR
category: database
tags:
- cloud sql
- high availability
- standby
- cross-region replica
- promotion
- rpo
- rto
image: https://docs.cloud.google.com/static/sql/images/advanced-dr-architecture.svg
source: https://docs.cloud.google.com/sql/docs/postgres/intro-to-cloud-sql-disaster-recovery
description: The primary Cloud SQL instance runs as a regional HA pair with a synchronous standby in a second zone of us-central1, and a cross-region read replica in us-east1 receives asynchronous replication.
  On a regional outage the replica is promoted to a standalone primary, the application tier in the secondary region is scaled up and a Cloud DNS record is repointed, accepting a small RPO from replication
  lag; after recovery a new standby and replica are rebuilt to restore the topology.
