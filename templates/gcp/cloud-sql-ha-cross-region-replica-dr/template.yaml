source: https://docs.cloud.google.com/sql/docs/postgres/intro-to-cloud-sql-disaster-recovery
description: The application writes through a global Cloud DNS name (myWriteEndpoint) that resolves to the primary Cloud SQL instance, which runs as a regional HA pair with a synchronous standby in a second
  zone of region R1 (us-central1), while a cross-region read replica in zone C of region R2 (us-east1) receives asynchronous replication. On a regional outage the replica is promoted to a standalone primary
  and the DNS record is repointed to it, accepting a small RPO from replication lag; after recovery a new standby and replica are rebuilt to restore the topology.
