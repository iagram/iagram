description: Laptops, phones and cameras upload raw images to Cloud Storage, whose object notifications flow through Pub/Sub to a streaming Dataflow pipeline that batches the file references and calls the
  Cloud Vision API to annotate the images with labels, objects and text. The annotations are written to a BigQuery data warehouse where analysts store and query them directly.
