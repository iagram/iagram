description: Document uploads to Cloud Storage publish Pub/Sub notifications that trigger a Cloud Run function to chunk the content, call the Vertex AI embeddings API and upsert vectors into a Vector Search
  index deployed on an index endpoint. A frontend Cloud Run service forwards user queries to a backend service that embeds the query, retrieves grounding chunks from Vector Search, augments the prompt for
  a Gemini model and applies safety filters before answering.
