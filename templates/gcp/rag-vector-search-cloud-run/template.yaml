description: Data engineers upload documents for RAG to Cloud Storage in the data ingestion subsystem, where a Cloud Run data preparation function chunks the content, generates embeddings with the Gemini
  Enterprise Agent Platform and upserts the vectors into a Vector Search index deployed on an index endpoint. In the serving subsystem a frontend Cloud Run service forwards application user queries to a
  backend service that embeds the query, retrieves grounding chunks from Vector Search, optimizes the prompt for a Gemini model and applies Responsible AI filters, while generative AI application developers
  supply sample prompts and evaluation scores and deploy the services through a Cloud Build CI/CD pipeline.
