description: Clinical applications read and write FHIR resources through a Cloud Healthcare API FHIR store inside a healthcare dataset, and a StreamConfigs export streams every create, update, patch and
  delete to BigQuery tables in near real time using the Analytics schema. Pub/Sub notifications from the FHIR store trigger a function for downstream workflows, and bulk FHIR bundles are imported from Cloud
  Storage.
