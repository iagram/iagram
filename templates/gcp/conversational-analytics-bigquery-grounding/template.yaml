description: A Cloud Run chat application sends natural-language questions to a Conversational Analytics data agent that is configured with BigQuery datasets as its grounding context, so Gemini generates
  and executes SQL against the governed data rather than answering from model memory. Conversation history is stored in Firestore, agent definitions and dataset descriptions are versioned in Cloud Storage,
  and query results plus generated charts are returned to the user.
