description: Cloud Build builds and scans a container image, pushes it to Artifact Registry and signs an attestation with a Cloud KMS asymmetric key that a Binary Authorization attestor trusts. The project
  Binary Authorization policy requires that attestation for deployment, so the GKE cluster admission controller blocks unsigned or unscanned images, logs violations to Cloud Audit Logs, and continuous validation
  flags running pods that drift from the policy.
