description: Raw files land in Cloud Storage and are transformed by Dataproc Spark jobs into Apache Iceberg tables on Cloud Storage that BigQuery reads through BigLake tables via a Cloud Resource connection.
  Dataplex manages the lake zones and metadata, Cloud Workflows orchestrates the load, and analysts query the same open-format data from BigQuery or Spark without copies.
