description: The enterprise foundations blueprint hub-and-spoke topology adds a hub Shared VPC that connects each environment's Shared VPC, with traffic between environments gated by network virtual appliances
  behind an internal passthrough load balancer used as next hop. Dedicated Interconnect terminates in the hub, Cloud NAT and Private Google Access provide controlled egress, and a DNS hub project centralizes
  hybrid resolution.
