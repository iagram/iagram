description: The enterprise foundations blueprint hub-and-spoke topology terminates four Dedicated Interconnect connections from the on-premises gateway in the hub Shared VPC host project, where a Cloud
  Router in each of two regions runs BGP over a VLAN attachment and advertises the restricted.googleapis.com range back to on-premises for Private Google Access. The hub Shared VPC peers with the production
  and non-production Shared VPCs, and traffic between environments and on-premises is gated by network virtual appliances behind an internal passthrough load balancer used as next hop.
