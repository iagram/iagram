description: A user reaches the anycast IP of a global external Application Load Balancer through their ISP; the connection terminates at the nearest of Google's edge points of presence, where the Cloud
  Armor security policy enforces the IP address allowlist / denylist, preconfigured WAF rules, rate limiting and adaptive protection before traffic enters Google's network. Allowed requests cross the Google
  backbone to the backend service, which spreads them across instances in three Google data centers, and Layer 3 and 4 volumetric attacks are absorbed by the load balancing infrastructure before reaching
  backends.
