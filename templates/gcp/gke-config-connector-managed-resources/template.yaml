description: Config Connector runs as an add-on in a GKE cluster and installs CRDs so Cloud SQL instances, Pub/Sub topics and Cloud Storage buckets are declared as Kubernetes objects committed to a Git
  repository and applied by a Cloud Build trigger. Its controllers reconcile the desired state against Google Cloud APIs using a dedicated IAM service account bound through Workload Identity, so developers
  never hold direct cloud permissions.
