source: https://docs.cloud.google.com/kubernetes-engine/enterprise/config-sync/docs/overview
description: Platform teams keep cluster-scoped and namespace-scoped Kubernetes configuration in a Git repository (or OCI image in Artifact Registry) that acts as the single source of truth for every cluster
  registered in the fleet. Config Sync, enabled as the Config Management fleet feature, continuously reconciles each cluster against that source and Policy Controller enforces constraints, preventing configuration
  drift across environments.
