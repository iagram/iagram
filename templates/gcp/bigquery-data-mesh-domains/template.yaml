image: https://docs.cloud.google.com/static/architecture/images/data-mesh-architecture.svg
source: https://docs.cloud.google.com/architecture/data-mesh
description: Domain teams own producer projects where operational sources such as Cloud Spanner and raw files in Cloud Storage are curated into data products stored natively in BigQuery or as BigLake tables,
  and exposed through authorized datasets as the product interface. A central services project provides management (IAM access control, Dataplex policy tags, BigQuery reservations) and discovery (Dataplex
  catalog, a Cloud Run search UI, documentation in Google Drive), while consumer projects run BigQuery SQL for reports in Looker, data science in Vertex AI Workbench and Spark jobs on Dataproc without copying
  data.
