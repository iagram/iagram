title: Cloud Storage dual-region bucket with turbo replication
category: storage
tags:
- cloud storage
- dual-region
- turbo replication
- geo-redundancy
- rto zero
- storage transfer
source: https://docs.cloud.google.com/storage/docs/locations
description: A dual-region bucket in the EUR4 pair replicates every object between europe-north1 and europe-west4 so a regional outage causes no path change and an RTO of zero, and turbo replication bounds
  the replication window to 15 minutes for a predictable RPO. Cloud Run services in both regions read and write the same bucket behind a global load balancer, and a Storage Transfer Service job feeds on-premises
  backups into the bucket.
