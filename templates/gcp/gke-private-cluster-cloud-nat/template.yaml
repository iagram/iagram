source: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/private-clusters
description: Nodes get only internal IP addresses and the control plane is reached through a DNS-based endpoint gated by IAM or an IP-based endpoint limited to authorized network ranges; a bastion VM in
  the VPC is one of those ranges for kubectl access. Because nodes have no external addresses, a Cloud Router with Cloud NAT provides outbound internet for image pulls from public registries, while Artifact
  Registry is reached over Private Google Access.
