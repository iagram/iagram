description: A data publisher project groups the BigQuery datasets and Pub/Sub topics it wants to share into shared resources and publishes each one as a listing in an Analytics Hub data exchange. Public
  exchanges make listings discoverable to any Google Cloud user while private exchanges restrict them to invited subscribers, and in both cases subscribers read the shared data in place so the publisher
  keeps a single copy.
