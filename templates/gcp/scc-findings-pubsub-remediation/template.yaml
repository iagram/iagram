description: An organization-level Security Command Center NotificationConfig with a findings filter publishes new high and critical findings to a Pub/Sub topic in near real time. A Cloud Run function subscribed
  to the topic enriches and remediates findings such as public buckets or open firewall rules, forwards the event to a chat webhook, and a BigQuery export sink keeps findings history for dashboards.
