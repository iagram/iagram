description: The enterprise foundations blueprint organizes the organization into bootstrap, common, networking and per-environment folders, with centralized projects for Terraform state, logging, secrets,
  KMS and Security Command Center under the common folder. Shared VPC host projects in the networking folder serve workload projects in each environment, while organization policies and aggregated log sinks
  are attached at the organization and folder level.
