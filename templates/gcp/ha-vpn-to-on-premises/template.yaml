description: An HA VPN gateway in us-central1 of VPC network-a has two interfaces, each carrying an IPsec tunnel over the internet to one interface of the on-premises peer VPN gateway, which is registered
  in the project as an external VPN gateway with two interfaces. Both tunnels must be up for the 99.99% availability SLA on the Google side; a missing tunnel on interface 1 leaves the connection without
  redundancy.
