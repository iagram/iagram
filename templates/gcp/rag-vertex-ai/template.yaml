source: https://docs.cloud.google.com/architecture/rag-capable-gen-ai-app-using-vertex-ai
description: Uploaded documents land in Cloud Storage and trigger Pub/Sub-driven Cloud Run functions in the data ingestion subsystem, which chunk the text, generate Vertex AI embeddings and store vectors
  in the databases tier (Vertex AI Vector Search and AlloyDB pgvector). The serving subsystem on Cloud Run embeds each user query, retrieves nearest neighbours, grounds a Gemini prompt with the results
  and hands the answer to the quality evaluation subsystem, which also runs on an external evaluation trigger and logs scores to BigQuery.
