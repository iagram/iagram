description: Documents uploaded to Cloud Storage trigger Pub/Sub-driven Cloud Run functions that chunk the text, generate Vertex AI embeddings and store vectors in a Vertex AI Vector Search index and AlloyDB
  pgvector. A Cloud Run serving service embeds each user query, retrieves nearest neighbours, grounds a Gemini prompt with the results, and logs request, response and evaluation scores to BigQuery.
