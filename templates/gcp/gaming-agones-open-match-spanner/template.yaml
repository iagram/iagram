description: Dedicated game servers run as Agones fleets on GKE clusters while backend microservices (frontend, profile, ping discovery, Open Match director and match function) run on GKE Autopilot with
  Memorystore for Redis backing Open Match state. Player profiles and in-game data live in Spanner, and Cloud Build builds images into Artifact Registry that Cloud Deploy rolls out to the clusters.
