image: https://github.com/googleforgames/global-multiplayer-demo/raw/main/images/architecture.png
source: https://github.com/googleforgames/global-multiplayer-demo
description: Players reach regional Cloud Load Balancers in us-central1, europe-west1 and asia-east1; in us-central1 a GKE Autopilot cluster runs the frontend (authenticating players with Google OAuth),
  the profile service and the Open Match components (core, match functions, director) with Memorystore for Redis backing Open Match state, while dedicated game servers run as Agones fleets (with allocator
  and ping services) on GKE clusters in all three regions, connected through Anthos Service Mesh. Player profiles and in-game data live in a globally replicated Spanner instance, and Cloud Build builds
  images into Artifact Registry that Cloud Deploy rolls out to the clusters.
