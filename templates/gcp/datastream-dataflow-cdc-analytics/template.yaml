description: Datastream captures MySQL change events and writes them as Avro files to a Cloud Storage bucket whose object notifications publish to Pub/Sub. The Datastream to BigQuery Dataflow template consumes
  those notifications, loads change events into staging tables and merges them into replica tables, allowing custom transformations in the pipeline.
