source: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/deploying-multi-cluster-gateways
description: Two GKE clusters in us-west1 and us-east1 are registered to one fleet with multi-cluster Services and Gateway enabled, and the config cluster gke-west-1 hosts the external-http Gateway of class
  gke-l7-global-external-managed-mc plus HTTPRoutes for store.example.com. Each cluster runs the store pods in a store namespace exported as a fleet-wide ServiceImport, and the resulting global external
  Application Load Balancer routes store.example.com/west and /east to the matching cluster and every other path to the healthy cluster closest to the client, failing over automatically when a cluster or
  region becomes unhealthy.
