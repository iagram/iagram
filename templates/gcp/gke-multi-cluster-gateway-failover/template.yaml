source: https://docs.cloud.google.com/kubernetes-engine/docs/how-to/deploying-multi-cluster-gateways
description: Two GKE clusters in different regions are registered to one fleet with multi-cluster Services and Gateway enabled, and the config cluster hosts a Gateway of class gke-l7-global-external-managed-mc
  plus HTTPRoutes. ServiceExport resources in each cluster become fleet-wide ServiceImports, and the resulting global external Application Load Balancer routes each request to the healthy cluster closest
  to the client, failing over automatically when a cluster or region becomes unhealthy.
