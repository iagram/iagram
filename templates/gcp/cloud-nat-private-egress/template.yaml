description: Compute Engine instances without external IPs reach internet destinations through a regional Public NAT gateway that maps their traffic to the static NAT IP 203.0.113.1, each VM being programmed
  with its own port range (32000-32063, 32101-32164, 32300-32363). Unlike a NAT proxy, Cloud NAT is a distributed software-defined service with no intermediate appliance in the data path, and it does not
  allow unsolicited inbound connections.
