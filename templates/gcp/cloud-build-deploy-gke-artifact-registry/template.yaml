description: A Cloud Build trigger fires on pushes to a connected Git repository and runs a three-step build that builds the container with the docker builder, pushes it to an Artifact Registry Docker repository
  and calls the gke-deploy builder. gke-deploy rewrites the Kubernetes manifests to the image digest, adds recommended labels, fetches cluster credentials and waits until the rollout on the GKE cluster
  is ready.
