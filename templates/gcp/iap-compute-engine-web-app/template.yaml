# Generated from the official reference (https://docs.cloud.google.com/iap/docs/enabling-compute-howto); edit freely.
title: Web app on Compute Engine protected by Identity-Aware Proxy behind an HTTPS load balancer
category: security
tags:
- identity-aware proxy
- iap
- compute engine
- managed instance group
- https load balancer
- zero trust
source: https://docs.cloud.google.com/iap/docs/enabling-compute-howto
description: A managed instance group behind a global external HTTPS load balancer is the IAP-protected backend service; enabling IAP on the backend service makes every request pass Google sign-in and an
  IAM check for the IAP-secured Web App User role before it reaches a VM. The app verifies the signed JWT header that IAP adds, a Cloud DNS record maps the domain to the load balancer IP, and a firewall
  rule allows only IAP and health-check ranges to reach the instances.
