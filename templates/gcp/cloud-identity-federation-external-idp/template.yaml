source: https://docs.cloud.google.com/architecture/identity/reference-architectures
description: An on-premises Active Directory stays the authoritative source while Google Cloud Directory Sync provisions users and groups one-way into Cloud Identity and AD FS handles SAML single sign-on,
  so MFA and password policies are inherited from the corporate IdP. Alternatively Workforce Identity Federation exchanges OIDC or SAML tokens from Entra ID or Okta for short-lived Google Cloud credentials
  without synchronizing accounts, and IAM bindings target Cloud Identity groups or workforce pool principal sets.
