description: Cloud Build runs CI on the pipeline source, builds component images into Artifact Registry and compiles the pipeline definition to Cloud Storage, from where Vertex AI Pipelines executes data
  validation, transformation with Dataflow, training and evaluation steps. Validated models are registered in Vertex AI Model Registry and deployed to an online endpoint, while Cloud Scheduler and Pub/Sub
  trigger continuous training runs on new data in BigQuery.
