description: Cloud Build builds the pipeline component images into Artifact Registry and compiles the pipeline definition into the Cloud Storage pipeline root, from where Vertex AI Pipelines runs the ML
  workflow, extracting and validating data from BigQuery, transforming it with Dataflow or Managed Service for Apache Spark, then training and evaluating the model with lineage recorded in Vertex ML Metadata.
  Validated models are registered in Vertex AI Model Registry and deployed to an online prediction endpoint on the ML platform that clients call.
