source: https://docs.cloud.google.com/datastream/docs/quickstart-replication-to-bigquery
description: Datastream reads the PostgreSQL logical replication slot of a Cloud SQL instance through a private connectivity configuration and streams inserts, updates and deletes directly into BigQuery.
  Destination tables are created automatically per source schema and merged with a configurable staleness, giving near real-time replicas for analytics without a Dataflow pipeline.
