title: Hybrid DNS with forwarding zones, peering zones and a DNS hub
category: networking
tags:
- cloud dns
- forwarding zone
- peering zone
- inbound server policy
- hub and spoke
- hybrid dns
image: https://docs.cloud.google.com/static/dns/images/hybrid-arch-using-hub-vpc-to-spoke-vpc.svg
source: https://docs.cloud.google.com/dns/docs/best-practices
description: A hub VPC hosts the Cloud Interconnect connectivity, a forwarding zone that sends corp.example.com queries to the on-premises DNS servers, peering zones for each spoke's private zone (project1.gcp.example.com,
  project2.gcp.example.com), and an inbound server policy that lets the on-premises resolvers query those zones through an inbound forwarder IP in the hub, with the Cloud Router advertising 35.199.192.0/19
  back to on-premises as a custom route. Each spoke project runs its own private zone next to a peering zone for example.com that points at the hub VPC, so spoke workloads resolve on-premises and shared
  private names without their own forwarding configuration.
