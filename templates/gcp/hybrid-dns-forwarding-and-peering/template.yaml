description: A hub VPC hosts the hybrid connectivity, a forwarding zone that sends corp.example.com queries to on-premises DNS servers, and an inbound server policy that lets on-premises resolvers query
  Cloud DNS private zones through a proxy IP in the hub. Spoke VPCs use peering zones that point at the hub VPC so their workloads resolve on-premises and shared private names without their own forwarding
  configuration.
