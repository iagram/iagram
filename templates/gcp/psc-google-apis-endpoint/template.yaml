description: A global forwarding rule with an internal IP from the VPC targets the all-apis or vpc-sc API bundle so workloads and on-premises hosts reach Google APIs through a private address. A Cloud DNS
  private zone maps googleapis.com names to the endpoint IP and the endpoint prefix is advertised to on-premises over Cloud Router.
