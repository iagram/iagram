source: https://docs.cloud.google.com/workflows/docs/tutorials/execute-cloud-run-jobs
description: An Eventarc trigger routes Cloud Storage object.finalized events for an input bucket to a Workflows workflow, which checks the event's bucket and then calls the Cloud Run Jobs API to run a
  job with environment variable overrides taken from the event. The job's parallel tasks each process a slice of the input file, and the workflow waits for completion and returns the execution result; the
  job image is built by Cloud Build into Artifact Registry.
