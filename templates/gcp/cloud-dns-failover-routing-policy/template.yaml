source: https://docs.cloud.google.com/dns/docs/zones/manage-routing-policies
description: A Cloud DNS private zone record uses a failover routing policy whose primary target is the regional internal Application Load Balancer forwarding rule in us-central1 and whose backup geolocation
  policy points to the us-east1 load balancer. Cloud DNS health-checks the forwarding rules and, when all primary endpoints are unhealthy, answers queries with the backup so internal clients move to the
  surviving region without application changes.
