title: Log-based alerting on audit logs with Cloud Monitoring
category: observability
tags:
- cloud monitoring
- log-based alert
- logmatch
- notification channel
- audit logs
- pub/sub
- incident
source: https://docs.cloud.google.com/logging/docs/alerting/log-based-alerts
description: A Cloud Monitoring alert policy with a LogMatch condition watches Cloud Audit Logs for sensitive events such as a human principal decrypting with a KMS key or accessing a Secret Manager secret
  version, extracting labels from the log entry into the notification. Incidents route through email and Pub/Sub notification channels, and a Cloud Run function subscribed to the topic posts to the on-call
  chat tool, while a log-based metric on the same filter provides counts for a dashboard.
