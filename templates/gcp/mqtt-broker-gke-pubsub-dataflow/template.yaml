image: https://docs.cloud.google.com/static/architecture/images/mqtt_broker_arch.svg
source: https://docs.cloud.google.com/architecture/connected-devices/mqtt-broker-architecture
description: Edge devices open TLS MQTT sessions through a regional external passthrough Network Load Balancer with session affinity to a three-node standards-based MQTT broker cluster hosted on GKE, which
  authenticates devices against a credential store in Cloud SQL. The broker bridges topics to Pub/Sub, and Dataflow (Apache Beam MQTT driver or Pub/Sub source) processes the stream into BigQuery while commands
  flow back to devices through the same broker.
