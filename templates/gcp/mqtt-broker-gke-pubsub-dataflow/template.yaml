title: IoT telemetry with an MQTT broker on GKE, Pub/Sub, Dataflow and BigQuery
category: iot
tags:
- mqtt
- gke
- pub/sub
- dataflow
- bigquery
- network load balancer
- iot
image: https://docs.cloud.google.com/static/architecture/images/mqtt_broker_arch.svg
source: https://docs.cloud.google.com/architecture/connected-devices/mqtt-broker-architecture
description: Edge devices connect through an edge gateway (certificate store, edge software, device connectors) and cloud clients connect directly, all opening TLS MQTT sessions through Cloud Load Balancing
  to a standards-based MQTT broker cluster hosted on GKE; a broker administration tier authenticates and authorises devices against a device credential store in Cloud SQL and exposes a broker administration
  API. Google Cloud connectors (an Apache Beam MqttIO Dataflow job and an MQTT Pub/Sub connector) move telemetry into BigQuery and downstream processing, while Cloud IAM, Cloud Logging and Cloud Monitoring
  are the project-level resources.
