description: Organization-level aggregated sinks with include-children route Admin Activity, System Event, Policy Denied, VPC Flow and firewall logs from every project into a central logging project. One
  sink lands in a Cloud Logging bucket with Log Analytics and a linked BigQuery dataset, a second archives to a Cloud Storage bucket for compliance retention, and a third publishes to Pub/Sub for SIEM consumption.
