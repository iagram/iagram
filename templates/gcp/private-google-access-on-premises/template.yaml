description: On-premises hosts reach Google APIs over Cloud VPN or Cloud Interconnect by resolving googleapis.com to the private.googleapis.com range 199.36.153.8/30 (or restricted.googleapis.com 199.36.153.4/30)
  through a Cloud DNS private zone with an inbound server policy. The Cloud Router advertises that range to on-premises with a custom route advertisement, and the VPC has a static route for it to the default
  internet gateway.
