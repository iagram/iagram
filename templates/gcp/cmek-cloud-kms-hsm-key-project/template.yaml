description: A dedicated key project owned by the security team hosts key rings whose crypto keys use SOFTWARE or FIPS 140-2 Level 3 HSM protection levels, kept separate from the workload projects that
  consume them. Cloud Storage buckets, Cloud SQL instances, Compute Engine disks and BigQuery datasets in the workload project reference those keys as CMEK, and per-service agents are granted only the encrypter/decrypter
  role so key administrators and data owners are different principals.
