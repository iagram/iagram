title: GitOps CI/CD with Cloud Build, Artifact Registry and GKE
category: devops
tags:
- ci cd
- cloud build
- gitops
- artifact registry
- gke
- kubectl
source: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/gitops-cloud-build
description: A commit to the app repository triggers a Cloud Build pipeline that runs tests, builds the container, pushes it to Artifact Registry and writes an updated Kubernetes manifest to the candidate
  branch of a separate env repository. A second Cloud Build trigger on the env repo applies the manifest to the GKE cluster with kubectl and promotes it to the production branch on success, so build history
  doubles as deployment history.
