source: https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/gitops-cloud-build
description: A developer's push to the application source repository triggers a Cloud Build pipeline that runs tests, builds the container, pushes the image to Artifact Registry and updates the Kubernetes
  manifest on the candidate branch of a separate deployment-manifests repository. A second Cloud Build trigger on that repository deploys the manifest to the GKE cluster with kubectl (the cluster pulls
  the image from Artifact Registry) and copies it to the production branch on success, so build history doubles as deployment history.
