description: Feature values are computed by Dataflow from streaming events and batch sources into BigQuery tables that act as the offline store, and feature groups in the Feature Registry point at those
  tables. A Feature Online Store syncs the latest values on a schedule and serves them at low latency to a Cloud Run prediction service that calls a Vertex AI endpoint, while training pipelines read point-in-time
  correct features from BigQuery.
