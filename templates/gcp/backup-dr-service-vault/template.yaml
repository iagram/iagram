source: https://docs.cloud.google.com/backup-disaster-recovery/docs/concepts/backup-dr
description: A Backup and DR management server orchestrates backup plans that capture Compute Engine VMs, Persistent Disks and Cloud SQL instances into a Google-managed backup vault whose WORM immutability
  and minimum enforced retention protect copies from deletion, including by project owners. A backup/recovery appliance in the on-premises data center protects VMware VMs and self-managed databases into
  the same console, and restores can target a different project or region for DR.
