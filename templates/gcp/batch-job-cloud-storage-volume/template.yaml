source: https://docs.cloud.google.com/batch/docs/create-run-job-storage
description: A Batch job specification declares a Cloud Storage bucket as a volume, so Batch provisions Compute Engine VMs from an instance template, mounts the bucket with Cloud Storage FUSE under /mnt/disks
  and runs each indexed task's script against that path. The job runs as a service account with Storage Object Viewer or Admin on the bucket, task logs stream to Cloud Logging, and a Cloud NAT gateway lets
  VMs without external IPs fetch packages.
