description: Managed collection on GKE and the Ops Agent on Compute Engine scrape Prometheus and OpenTelemetry metrics into Managed Service for Prometheus, which stores them for 24 months in Monarch alongside
  Cloud Monitoring system metrics, while logs and traces are collected by Cloud Logging and Cloud Trace. Teams query with PromQL from Cloud Monitoring dashboards or Grafana, and PromQL-based alerting policies
  notify on-call channels.
