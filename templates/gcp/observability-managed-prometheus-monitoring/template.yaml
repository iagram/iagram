description: Prometheus-based collectors (managed collection on GKE, the Ops Agent on Compute Engine, an OpenTelemetry sidecar on Cloud Run, self-deployed collectors in other clouds and on-premises) write
  metrics using push through the Cloud Monitoring ingest API into Monarch, the Cloud Monitoring time-series store that also holds free platform metrics and log-based metrics for 24 months. Read clients
  (Grafana, the Cloud Monitoring UI and PromQL alerting rules) read using PromQL through the OSS PromQL query API, and Grafana dashboards and Prometheus alert rules can be imported into Cloud Monitoring.
