source: https://docs.cloud.google.com/vpc/docs/configure-private-service-connect-producer
description: A service producer fronts its workload with an internal load balancer, allocates a PSC NAT subnet and publishes the load balancer through a service attachment with an accept list of consumer
  projects. Consumers create an endpoint (a forwarding rule with an internal IP in their own VPC) that targets the service attachment, so traffic never leaves Google's network and address spaces need not
  be unique.
