image: https://docs.cloud.google.com/telecom-network-automation/images/tna-service-orchestration.png
source: https://docs.cloud.google.com/telecom-network-automation/docs/overview
description: Telecom Network Automation is a managed Nephio deployment in which a GKE orchestration cluster runs Kubernetes operators that apply Configuration as Data blueprints (collections of Kubernetes
  CRDs) from a Git repository, provisions GKE and Google Distributed Cloud edge workload clusters through cloud infrastructure automation, and deploys CNF workloads onto them through Config Sync reconciliation,
  while an end-to-end service and slice orchestrator drives it over a declarative API. Administrative and data-access audit logs are routed to BigQuery for compliance reporting, and edge sites keep running
  if the management plane is disconnected.
