description: Telecom Network Automation is a managed Nephio deployment where a GKE orchestration cluster runs Kubernetes operators that apply Configuration as Data from a Git repository to network function
  clusters on Google Distributed Cloud edge sites through GitOps reconciliation and zero-touch provisioning. Administrative and data-access audit logs are routed to BigQuery for compliance reporting, and
  edge sites keep running if the management plane is disconnected.
