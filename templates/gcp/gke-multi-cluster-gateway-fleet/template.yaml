description: Two GKE clusters in different regions are registered to a fleet with Multi-cluster Services and the multi-cluster Gateway controller enabled, and gke-west-1 acts as the config cluster where
  the external-http Gateway and HTTPRoutes are applied. The Gateway of class gke-l7-global-external-managed-mc provisions a global external Application Load Balancer whose backends are ServiceImports of
  the store Service in both clusters' store namespaces, so store.example.com/west and /east pin to a region while the default path balances across both by health and capacity.
