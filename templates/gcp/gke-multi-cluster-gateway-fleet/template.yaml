description: Two GKE clusters in different regions are registered to a fleet with Multi-cluster Services and the multi-cluster Gateway controller enabled, and one of them acts as the config cluster where
  the Gateway and HTTPRoutes are applied. A Gateway of class gke-l7-global-external-managed-mc provisions a global external Application Load Balancer whose backends are ServiceImports spanning both clusters,
  so paths can pin to a region or balance across both by health and capacity.
