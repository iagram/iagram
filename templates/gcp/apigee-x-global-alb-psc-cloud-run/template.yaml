description: The Apigee organization's runtime instance lives in a Google-managed tenant project and is reached from the customer VPC through a Private Service Connect service attachment; a PSC network
  endpoint group makes that attachment the backend of a global external Application Load Balancer with a managed certificate. API proxies deployed to the Apigee environment forward to target services such
  as a Cloud Run backend, and Cloud Armor on the backend service protects the public entry point.
