- global external application load balancer
- cloud run
- api management
image: https://docs.cloud.google.com/static/apigee/docs/api-platform/images/apigee-arch-diagrams/apigee-arch-b.png
source: https://docs.cloud.google.com/apigee/docs/api-platform/architecture/overview
description: The Apigee organization's runtime instance lives in a Google-managed Apigee X runtime project and in Google's VPC, and is reached from the customer project's VPC through a Private Service Connect
  service attachment; a PSC network endpoint group in the customer VPC makes that attachment the backend of a global external Application Load Balancer with a managed certificate. API consumers call the
  load balancer from the internet, API proxies deployed to the Apigee environment forward to target services such as a Cloud Run backend in the customer project, and Cloud Armor on the backend service protects
  the public entry point.
