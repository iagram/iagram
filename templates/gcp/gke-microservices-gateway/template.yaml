description: The Online Boutique microservices run on a GKE cluster inside Cloud Service Mesh, and an external load balancer provisioned by GKE Gateway sends client traffic to the mesh ingress gateway proxies.
  The ingress gateway routes each request to the application pods, whose sidecar proxies handle mTLS and application-level routing between services.
