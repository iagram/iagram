description: The Online Boutique microservices run on a GKE cluster inside Cloud Service Mesh, and a global external Application Load Balancer provisioned by GKE Gateway sends traffic to the mesh ingress
  gateway. Cloud Armor and Certificate Manager provide edge security and TLS at the load balancer, while the mesh handles mTLS and application-level routing between services.
