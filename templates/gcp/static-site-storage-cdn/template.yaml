description: Static assets sit in a Cloud Storage bucket exposed through an external Application Load Balancer backend bucket with Cloud CDN enabled, because Cloud Storage alone cannot serve custom domains
  over HTTPS. A Google-managed SSL certificate terminates TLS and a Cloud DNS A record points the domain at the load balancer anycast IP.
