description: Cloud Audit, VPC Flow, Cloud DNS and firewall logs are exported to Google Security Operations either directly through organization-level ingestion settings or through an aggregated organization
  sink into a Pub/Sub topic consumed by a SecOps feed. Security Command Center findings and Cloud Asset Inventory metadata are exported alongside the logs so detections can be enriched with resource context
  and posture data.
