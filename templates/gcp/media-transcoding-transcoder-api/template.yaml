image: https://docs.cloud.google.com/static/transcoder/images/video-file-example.svg
source: https://docs.cloud.google.com/transcoder/docs/concepts/overview
description: Source assets are uploaded to a Cloud Storage bucket, and an Eventarc-triggered function submits a Transcoder API job from a reusable job template (such as preset/web-hd) that produces HLS,
  MPEG-DASH and MP4 renditions into an output bucket. Job status changes are published to a Pub/Sub topic consumed by a catalog service, and viewers fetch the renditions through a global load balancer with
  Cloud CDN in front of the output bucket.
