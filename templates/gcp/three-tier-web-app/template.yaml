description: A global external Application Load Balancer fronts a Cloud Run web frontend, which calls a Cloud Run API service that reads through a Memorystore for Redis cache and falls back to a Cloud SQL
  for PostgreSQL database. Secrets live in Secret Manager and the serverless tiers reach the private data tier through VPC egress into a dedicated subnet.
