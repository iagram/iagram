description: Evaluation datasets of prompts and reference answers stored in Cloud Storage and BigQuery feed a Vertex AI Pipelines run that calls the candidate model endpoints and the Gen AI evaluation service
  for computation-based and model-based metrics. Scores and pairwise AutoSxS judgements are written to BigQuery, a Cloud Run dashboard visualizes them, and a scheduled Cloud Run function re-evaluates production
  samples to detect regressions before promoting a new model or prompt version.
