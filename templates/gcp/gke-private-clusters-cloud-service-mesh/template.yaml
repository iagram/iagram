description: Two private GKE application clusters in separate regions run Cloud Service Mesh so a service with pods in both clusters is one distributed service with cross-cluster discovery and mTLS; each
  cluster's nodes use Cloud NAT for egress and authorized networks for control-plane access. A third small cluster is the Multi Cluster Ingress config cluster that programs a global external Application
  Load Balancer in front of the mesh ingress gateways in both application clusters.
