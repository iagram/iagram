description: Two private GKE application clusters in separate regions run Cloud Service Mesh, so the Bank of Anthos frontend with pods in both clusters' bank-of-anthos namespaces is one distributed service
  with cross-cluster discovery and mTLS, fronted by a mesh ingress gateway in each cluster's istio-system namespace. A third small cluster-ingress cluster is the Multi Cluster Ingress config cluster whose
  MultiClusterIngress and MultiClusterService program a global external Application Load Balancer that sends client traffic to the mesh ingress gateways in both application clusters.
