description: A Cloud Scheduler job fires on a unix-cron expression and sends an authenticated HTTP POST to the run endpoint of a Cloud Run job, using a service account that holds the Cloud Run Invoker role.
  The job runs its container tasks to completion, writes results to a Cloud Storage bucket and its logs land in Cloud Logging; the scheduler region does not need to match the job region.
