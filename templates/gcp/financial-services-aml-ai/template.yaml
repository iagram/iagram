image: https://docs.cloud.google.com/static/financial-services/anti-money-laundering/images/how-aml-ai-works.svg
source: https://docs.cloud.google.com/financial-services/anti-money-laundering/docs/concepts/overview
description: Core banking transactions, accounts, party data and historical AML data (suspicious activity reports) are prepared and landed in BigQuery tables that follow the AML AI schema; the bank calls
  the AML AI API, which trains a model on that data and writes customer risk scores with built-in explainability to a results dataset. Investigators review the scored parties against their risk tolerance,
  escalate cases and file suspicious activity reports using the model explainability, and the investigation outcomes feed back into the AML data in a dynamic feedback loop.
