description: Vehicles stream telemetry through a global load balancer to a connectivity gateway on GKE that publishes normalised events to Pub/Sub, where Dataflow enriches them, writes the latest vehicle
  state to Bigtable for low-latency lookups and lands history in BigQuery and Cloud Storage. Fleet operators and driver apps query vehicle state through a Cloud Run API, and remote commands travel back
  through a dedicated topic.
