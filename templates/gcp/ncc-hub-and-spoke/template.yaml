source: https://docs.cloud.google.com/architecture/deploy-hub-spoke-vpc-network-topology
description: A central hub VPC and per-workload spoke VPCs are attached as VPC spokes to a Network Connectivity Center hub, which exchanges subnet routes so all spokes reach each other with full bandwidth
  and transitivity. On-premises connectivity terminates on HA VPN in the hub VPC and is attached as a hybrid spoke, so spokes reach the data center through the hub.
