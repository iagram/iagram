description: In a single project a hub (routing) VPC and two workload spoke VPCs are attached as VPC spokes to a Network Connectivity Center hub, which exchanges subnet routes so the spokes reach each other
  and the hub with full bandwidth and transitivity. Each VPC has a subnet with a Compute Engine VM and a Cloud NAT gateway for outbound internet access; the second spoke also hosts a GKE cluster.
