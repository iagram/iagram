title: Bot management with Cloud Armor and reCAPTCHA on a global external Application Load Balancer
category: security
tags:
- cloud armor
- recaptcha
- bot management
- waf
- action token
- challenge page
- global external application load balancer
image: https://docs.cloud.google.com/static/armor/images/enforce-recaptcha-token.svg
source: https://docs.cloud.google.com/armor/docs/bot-management
description: End users load an application frontend whose reCAPTCHA JavaScript asks reCAPTCHA Enterprise to assess the interaction and return a token, which the frontend attaches to requests sent to the
  global external Application Load Balancer. reCAPTCHA WAF keys for action tokens, session tokens and a challenge page are associated with a Cloud Armor security policy attached to the load balancer's backend
  service; the policy deciphers the token inline at the edge and allows, denies, rate-limits or redirects suspicious requests to the reCAPTCHA challenge page, while legitimate requests pass through to the
  Cloud Run backend via a serverless NEG.
