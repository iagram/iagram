title: Log analytics with aggregated Cloud Logging sinks to BigQuery
category: observability
tags:
- cloud logging
- log sink
- bigquery
- security analytics
- looker studio
image: https://docs.cloud.google.com/static/architecture/images/security-analytics.png
source: https://docs.cloud.google.com/architecture/exporting-stackdriver-logging-for-security-and-access-analytics
description: Security data sources, namely Cloud Logging audit and platform logs, Cloud Asset Inventory asset changes and Security Command Center findings, are routed by an aggregated log sink into security
  analytics tools, a Log Analytics enabled log bucket and a partitioned BigQuery dataset in a dedicated analytics project, and can be forwarded to Google SecOps or a third-party SIEM. The Community Security
  Analytics rules, more than 40 detection queries, run over the log tables in BigQuery and Log Analytics.
