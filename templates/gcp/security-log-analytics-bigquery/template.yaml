description: An aggregated log sink routes audit, network and platform logs from all projects into a partitioned BigQuery dataset in a dedicated analytics project, while a Cloud Storage sink keeps a long-term
  archive. Scheduled queries and Community Security Analytics SQL detect anomalies over the log tables, and Looker Studio dashboards visualize the results.
