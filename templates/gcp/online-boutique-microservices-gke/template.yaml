image: https://github.com/GoogleCloudPlatform/microservices-demo/raw/main/docs/img/architecture-diagram.png
source: https://github.com/GoogleCloudPlatform/microservices-demo
description: Eleven microservices written in Go, C#, Node.js, Python and Java communicate over gRPC behind a Go frontend that is exposed by a LoadBalancer Service on a GKE cluster; the frontend calls the
  ad, recommendation, productcatalog, cart, shipping, currency and checkout services, checkout fans out to payment, email, productcatalog, cart, shipping and currency, and a load generator produces synthetic
  traffic. The cart service stores carts in an in-cluster Redis cache that can be swapped for Memorystore for Redis, the product catalog can move to Cloud Spanner or AlloyDB, and Kustomize variants add
  Cloud Service Mesh sidecars.
