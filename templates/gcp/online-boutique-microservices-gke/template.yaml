description: Eleven microservices written in Go, C#, Node.js, Python and Java communicate over gRPC behind a Go frontend that is exposed by a LoadBalancer Service on a GKE cluster, with a load generator
  producing synthetic traffic. The default in-cluster Redis cart store can be swapped for Memorystore for Redis, the product catalog can move to Cloud Spanner or AlloyDB, and Kustomize variants add Cloud
  Service Mesh sidecars and an Artifact Registry image source.
