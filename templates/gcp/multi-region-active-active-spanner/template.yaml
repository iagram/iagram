description: A global external Application Load Balancer sends users to the closest healthy region, where regional managed instance groups spread across three zones run the web and application tiers in
  isolated stacks. A Spanner multi-region instance in the nam3 configuration keeps read-write replicas in us-east4 and us-east1 with a witness in us-central1, giving both regions strongly consistent access
  to one database and a 99.999% availability SLA.
