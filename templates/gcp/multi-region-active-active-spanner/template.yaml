image: https://docs.cloud.google.com/static/architecture/images/multiregional-ra-gclb.svg
source: https://docs.cloud.google.com/architecture/multiregional-vms
description: A global external Application Load Balancer sends application users to the closest healthy region, where a regional managed instance group spread across three zones runs the web tier, a regional
  internal load balancer hands requests to a second regional managed instance group running the application tier, and both regions share one VPC. In place of the reference's replicated PostgreSQL VMs, a
  Spanner multi-region instance in the nam3 configuration keeps read-write replicas in us-east4 and us-east1 with a witness in us-central1, giving both regions strongly consistent access to one database
  and a 99.999% availability SLA, while dual-region Cloud Storage buckets hold shared assets.
