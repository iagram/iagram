description: Google provisions dedicated physical ports between its network and a remote cloud provider such as AWS or Azure in a supported location; the customer orders a primary and a redundant port in
  different edge availability domains, then configures VLAN attachments and Cloud Router BGP sessions to the remote provider's gateway. Ninety-nine point nine percent availability needs two connections
  in one metro and 99.99% needs pairs in two metros.
