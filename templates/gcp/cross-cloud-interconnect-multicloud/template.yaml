description: Google provisions dedicated physical ports between its network and a remote cloud provider such as AWS or Azure in colocation facilities; in each of two metropolitan areas the customer orders
  a primary and a redundant Cross-Cloud Interconnect connection in separate edge availability domains, each linking a Google router to a router run by the remote cloud. Cloud Routers in two regions of the
  VPC run BGP over VLAN attachments on those connections so Compute Engine VMs reach the remote virtual network with 99.99% availability, while a single metro pair gives 99.9%.
