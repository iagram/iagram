description: A front-end Cloud Run service enqueues HTTP target tasks into a Cloud Tasks queue that controls dispatch rate, concurrency and retries; each task carries an OIDC token minted for a service
  account in the same project. The queue dispatches the task over HTTPS to a private Cloud Run worker, which validates the token before processing the payload and persisting the result to Cloud SQL.
