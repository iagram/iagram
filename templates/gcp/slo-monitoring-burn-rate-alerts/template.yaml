description: A Cloud Run API behind a global load balancer is modelled as a Cloud Monitoring service with request-based availability and latency SLIs, each attached to an SLO with a rolling compliance period
  that defines an error budget. Fast-burn and slow-burn alerting policies watch error-budget consumption and page on-call through PagerDuty and email notification channels.
