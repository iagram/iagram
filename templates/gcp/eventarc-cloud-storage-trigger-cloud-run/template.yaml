description: An Eventarc trigger subscribes to google.cloud.storage.object.v1.finalized events from one bucket in the same region; Cloud Storage publishes each event to a Pub/Sub topic that Eventarc creates
  as the transport and a push subscription delivers the CloudEvent as an HTTP request to a Cloud Run service. The trigger runs as a service account with Eventarc Event Receiver and Cloud Run Invoker roles,
  and the Cloud Storage service agent needs Pub/Sub Publisher.
