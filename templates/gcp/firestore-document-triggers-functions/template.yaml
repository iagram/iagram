description: Second-generation Cloud Functions for Firebase register onDocumentCreated, onDocumentUpdated, onDocumentDeleted or onDocumentWritten handlers on a document path such as users/{userId}; Eventarc
  delivers each Firestore change as a CloudEvent carrying before and after snapshots. The handlers fan out side effects, for example publishing to a Pub/Sub topic and sending notifications, and must avoid
  writing back to the triggering document to prevent loops.
