description: Cloud Router is the managed BGP speaker for Cloud VPN, Cloud Interconnect and router appliances; it learns on-premises prefixes as dynamic routes and advertises VPC subnet ranges plus custom
  prefixes. With the VPC in global dynamic routing mode, routes learned by a Cloud Router in one region are programmed into all regions of the VPC.
