source: https://docs.cloud.google.com/architecture/dr-scenarios-for-applications
description: The production region serves traffic from a managed instance group and a Cloud SQL primary, while the DR region keeps a minimal warm environment, a scaled-down instance group built from images
  and a read replica receiving continuous replication, cheaper than a hot active/active setup but faster to recover than a cold rebuild from Cloud Storage backups. Scheduled disk snapshots and image copies
  keep the DR templates current, and on failover the replica is promoted, the instance group is scaled up and a Cloud DNS record switches users to the DR load balancer.
