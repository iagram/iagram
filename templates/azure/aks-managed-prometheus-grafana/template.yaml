description: The Azure Monitor agent add-on scrapes Prometheus metrics from the AKS cluster into an Azure Monitor workspace and Container insights sends stdout/stderr and Kubernetes events to a Log Analytics
  workspace, while control-plane diagnostic settings export API server and audit logs. Azure Managed Grafana visualizes both stores with prebuilt Kubernetes dashboards, and Prometheus recommended alert
  rules notify an action group.
