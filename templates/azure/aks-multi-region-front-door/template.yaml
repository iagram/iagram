description: Azure Front Door load balances across regional stamps, each consisting of a hub-spoke network with Azure Firewall for egress, an Application Gateway entry point and an AKS cluster, plus a regional
  Key Vault and Log Analytics workspace. A single geo-replicated Container Registry serves images to every cluster, and when a region fails Front Door health probes route all traffic to the remaining healthy
  regions.
