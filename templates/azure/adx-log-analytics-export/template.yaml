description: Log Analytics data export rules continuously copy selected workspace tables to a storage account and an Event Hubs namespace as records arrive, decoupling long-term retention and downstream
  analytics from Azure Monitor pricing tiers. An Azure Data Explorer cluster consumes the event hubs for cross-source KQL analysis over years of logs, and the storage account keeps immutable archives for
  compliance.
