description: Incoming data enters the Azure Monitor ingestion pipeline, which writes it to Log Analytics workspace tables while data export rules continuously copy selected tables to a storage account and
  an Event Hubs namespace as records arrive, decoupling long-term retention and downstream analytics from Azure Monitor pricing tiers. An Azure Data Explorer cluster consumes the event hubs for cross-source
  KQL analysis over years of logs, and the storage account keeps immutable archives for compliance.
