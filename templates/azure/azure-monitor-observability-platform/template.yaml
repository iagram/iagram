description: Azure Monitor collects metrics, logs and traces from applications and workloads, infrastructure, the Azure platform and custom sources into an Azure Monitor workspace for Prometheus metrics,
  a Log Analytics workspace for logs queried with KQL and Application Insights for distributed traces. Insights (Application, Kubernetes, VM, Network) curate that data, workbooks, Azure dashboards, Grafana
  and Power BI visualize it, Log Analytics query packs analyze it, and metric and log alerts drive action groups that notify or automate a response.
