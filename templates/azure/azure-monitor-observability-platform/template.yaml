description: Azure Monitor collects metrics, logs, traces and events from Azure resources, VMs, Kubernetes clusters and applications into two workspace types, a Log Analytics workspace for logs and traces
  queried with KQL and an Azure Monitor workspace for Prometheus and OpenTelemetry metrics queried with PromQL. Application Insights provides OpenTelemetry-based APM, workbooks and Grafana dashboards visualize
  the data, and alerts drive action groups that run Logic Apps or Automation runbooks and autoscale.
