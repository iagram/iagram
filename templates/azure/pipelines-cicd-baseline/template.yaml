description: A pull request pipeline runs lint, build and unit tests on Azure Repos Git; a merge triggers a CI pipeline that adds integration tests, pulls secrets from Key Vault and publishes build artifacts
  to Azure Artifacts feeds. The published artifact triggers a CD pipeline that deploys to staging, runs acceptance tests, waits for a manual validation and releases to production, while Azure Monitor, Application
  Insights and a Log Analytics workspace observe both environments.
