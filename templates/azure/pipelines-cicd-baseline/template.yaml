source: https://learn.microsoft.com/en-us/azure/devops/pipelines/architectures/devops-pipelines-baseline-architecture
description: A developer pushes to Azure Repos Git; a pull request pipeline runs code analysis, lint, security scanning, restore, build, unit tests and PR review, and a merge triggers a CI pipeline that
  gets secrets from Key Vault, restores packages from Azure Artifacts, runs integration tests and publishes build artifacts. The published artifact triggers a CD pipeline that deploys to a Staging environment
  of App Services and virtual machines, runs acceptance tests, waits for an optional manual intervention and releases to Production, while each pipeline reports its results back to the developer.
