source: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling
description: Azure Firewall is deployed with the management network interface enabled, so its own operational traffic uses a dedicated public IP while the tenant data path carries a 0.0.0.0/0 route toward
  the VPN or ExpressRoute gateway, either learned over BGP or set as a user-defined route on AzureFirewallSubnet. Internet-bound traffic from spokes is inspected by the firewall and then sent to the on-premises
  edge firewall before it reaches the internet, and DNAT inbound is not supported in this mode.
