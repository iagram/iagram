source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/idea/next-order-forecasting
description: Azure Data Factory ingests order, customer, merchandise, and partner data into a Data Lake Storage and SQL Database staging area, and Azure Machine Learning parallel jobs on a compute cluster
  train a forecasting model for every customer-store and SKU combination. Registered models are deployed to managed online endpoints, predictions are written back to the analytical stores, and a web app,
  Power BI, or Power Apps surface recommended SKUs and quantities to customers.
