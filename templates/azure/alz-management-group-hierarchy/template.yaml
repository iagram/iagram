description: In the Cloud Adoption Framework conceptual architecture a platform landing zone (the management group hierarchy with its Azure Policy guardrails plus the centralized management, connectivity
  and identity subscriptions) provides governance and centralized resources for application landing zone subscriptions that each host one Azure workload, and Microsoft Foundry with Foundry IQ can be added
  to any workload. Unified identity, security and governance come from Microsoft Entra, Microsoft Defender and Microsoft Agent 365 above the landing zone, while the central Log Analytics workspace and the
  hub firewall are shared by every workload.
