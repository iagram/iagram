description: Two device streams (taxi ride and fare data) are ingested into separate event hubs partitioned by the same key, joined and aggregated over a hopping window by a Stream Analytics job, and the
  results are written as JSON documents to Cosmos DB for Power BI analysis. Azure Monitor dashboards track throttling and streaming-unit utilization to trigger scale-out.
