source: https://learn.microsoft.com/en-us/azure/architecture/databases/architecture/write-through-caching-azure-sql-managed-redis
description: App Service serves reads from Azure Managed Redis and falls back to Azure SQL Database on a cache miss, while every write goes through an HTTP-triggered Azure Function that validates idempotency,
  commits to SQL with a durable outbox row, then updates the versioned Redis key before returning. A repair function replays pending outbox entries when Redis updates fail, SQL and Redis are reached only
  through private endpoints, and Azure Monitor tracks hit ratio and outbox depth.
