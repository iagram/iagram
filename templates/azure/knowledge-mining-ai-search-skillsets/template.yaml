description: An AI Search indexer cracks documents and images from Blob Storage and runs a skillset of built-in Vision OCR and Language entity and key-phrase skills plus a custom Azure Functions web API
  skill to enrich domain-specific content. Enriched documents are written to a full-text and vector search index and projected into a knowledge store in Blob and Table Storage, and an App Service web app
  queries the index.
