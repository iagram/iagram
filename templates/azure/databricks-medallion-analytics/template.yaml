image: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/media/azure-databricks-modern-analytics-architecture.svg
source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/azure-databricks-modern-analytics-architecture
description: Azure Databricks ingests streaming data from Event Hubs with Lakeflow declarative pipelines while Fabric Data Factory lands batch data in Data Lake Storage, then Apache Spark organises Delta
  Lake tables into Bronze, Silver and Gold layers. MLflow hands models to Azure Machine Learning, Databricks SQL warehouses query the gold layer for Power BI, the gold tables are shared with Microsoft Fabric,
  and Unity Catalog and Microsoft Purview govern the estate on a platform of Microsoft Entra ID, Cost Management, Key Vault, Azure Monitor, Azure DevOps and GitHub.
