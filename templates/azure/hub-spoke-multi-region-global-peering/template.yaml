description: Two regional hubs each host an Azure Firewall acting as the network virtual appliance, a workload subnet and a virtual network gateway, with local spokes attached by regional peering that allows
  gateway transit while the spokes use the remote gateway. A user-defined route table on each spoke subnet sends traffic to the hub firewall, and the hubs are joined by global virtual network peering so
  spoke-to-spoke traffic between regions stays on the Microsoft backbone and is inspected in each hub.
