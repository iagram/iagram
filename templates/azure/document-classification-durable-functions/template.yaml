source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/automate-document-classification-durable-functions
description: A web app stores uploaded multi-document files in Blob Storage and enqueues a Service Bus command that starts a Durable Functions orchestration, whose activities call Document Intelligence
  to split and classify each embedded document, store metadata in Cosmos DB, chunk the text, and write text-embedding-3-large vectors into an AI Search index. A pre-deployed Foundry Agent Service prompt
  agent with the AI Search tool then answers user questions over the indexed content with inline citations.
