description: Application Gateway with a Web Application Firewall policy is the public entry point and routes to an API Management instance deployed in internal virtual network mode, which exposes Azure
  Functions back ends reachable only through private endpoints; network security groups protect every subnet. Key Vault holds the gateway TLS certificates behind a private endpoint, private DNS zones resolve
  the internal endpoints, Application Insights and a Log Analytics workspace collect telemetry, and Cosmos DB is the serverless data store behind the API.
