source: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-global-transit-network-architecture
description: Microsoft-managed Virtual WAN hubs in two regions provide any-to-any transit between spoke virtual networks, branch sites connected by site-to-site VPN or ExpressRoute, and remote users connected
  by User VPN (point-to-site). Hubs in the same Virtual WAN are automatically interconnected over the Microsoft global network, giving branch-to-VNet, branch-to-branch, user-to-VNet and VNet-to-VNet paths
  across regions without customer-managed transit.
