source: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-global-transit-network-architecture
description: Microsoft-managed Virtual WAN hubs in two regions form a global transit network with any-to-any connectivity between four spoke virtual networks, a headquarters datacenter connected by ExpressRoute,
  three branch sites connected by site-to-site VPN, remote users connected by User VPN (point-to-site) and internet breakout through the hub. Hubs in the same Virtual WAN are automatically interconnected
  over the Microsoft global network, giving branch-to-VNet, branch-to-branch, user-to-VNet and VNet-to-VNet paths across regions without customer-managed transit.
