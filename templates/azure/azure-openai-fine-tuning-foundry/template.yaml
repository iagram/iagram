source: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/fine-tuning
description: Training and validation data in JSONL chat-completions format are uploaded from Blob Storage to a Foundry resource, where a supervised, DPO, or reinforcement fine-tuning job customises a base
  model such as GPT-4o or GPT-4.1 with LoRA-based training and emits loss and token-accuracy metrics and per-epoch checkpoints. The resulting fine-tuned model is deployed as its own deployment, evaluated
  in the playground and with the Evaluation SDK, and consumed by applications through the standard inference endpoint.
