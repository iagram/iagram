source: https://learn.microsoft.com/en-us/azure/architecture/web-apps/app-service-environment/architectures/app-service-environment-high-availability-deployment
description: Application Gateway WAF v2 in its own subnet forwards internet traffic to an internal-load-balancer App Service Environment v3 whose zone-redundant plans host a web app, a private API and a
  function app. Outbound traffic leaves through Azure Firewall, dependencies such as Azure Managed Redis, Service Bus, Cosmos DB, SQL Database and Key Vault are reached over private endpoints with private
  DNS zones, and GitHub Actions deploys through a jump box VM inside the network.
