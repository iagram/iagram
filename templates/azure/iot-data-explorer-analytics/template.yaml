source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/iot-azure-data-explorer
description: IoT Hub, Event Hubs or Kafka ingest high-volume device streams; Stream Analytics or Azure Functions process them in near real time and Cosmos DB stores JSON messages for the operational application.
  Azure Data Explorer ingests the same streams through its IoT Hub and Event Hubs connectors for time-series analytics, anomaly detection and forecasting, exposes results to dashboards, Power BI and Grafana,
  and integrates with Azure Digital Twins, Databricks and Machine Learning.
