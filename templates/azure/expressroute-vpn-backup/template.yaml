source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/hybrid-networking/expressroute-vpn-failover
description: ExpressRoute private peering is the primary path from the on-premises network to the virtual network, and an IPsec site-to-site VPN over the internet terminates on a route-based VPN gateway
  that coexists with the ExpressRoute gateway in the same GatewaySubnet. The on-premises edge prefers ExpressRoute routes through BGP local preference, so traffic converges onto the VPN tunnel only when
  the circuit or peering location fails.
