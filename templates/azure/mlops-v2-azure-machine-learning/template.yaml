description: Data scientists pull tabular data from the data estate (Storage, Data Lake Storage, SQL Database, Cosmos DB, Event Hubs and Fabric) into a development workspace for the inner loop, and a CI/CD
  pipeline promotes code and trained models through the Azure Machine Learning model registry into a staging workspace and, after gated approval, a production workspace where a compute cluster retrains,
  a batch cluster serves the batch managed endpoint and Kubernetes Services serve the online managed endpoint behind a private endpoint. Application Insights and Azure Monitor feed model, data and infrastructure
  monitoring whose action groups trigger scheduled metrics, availability and latency alerts and automated retraining, with Container Registry as the workspace dependency.
