description: Data scientists iterate in a development workspace, and a CI/CD pipeline promotes code and trained models through a shared Azure Machine Learning registry into a production workspace where
  a compute cluster retrains and a managed online endpoint serves predictions. Data drift and model performance monitoring in Azure Monitor and Application Insights close the loop by triggering retraining,
  with Data Lake Storage, Key Vault, and Container Registry as the workspace dependencies.
