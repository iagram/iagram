source: https://learn.microsoft.com/en-us/industry/mobility/architecture/automotive-connected-fleets-content
description: Vehicles publish protobuf or JSON telemetry over MQTT to Azure Event Grid (or IoT Hub); Azure Functions validate metadata, decode, enrich and route messages using configuration and vehicle
  registrations stored in Cosmos DB, and archive raw, decoded and failed messages in a data lake. The fleet integration layer receives standardized payloads on Event Hubs, ingests status, events and trips
  into Azure Data Explorer, exposes vehicle APIs through API Management, and Synapse pipelines build bronze/silver/gold tables for Power BI and Dynamics 365 business processes.
