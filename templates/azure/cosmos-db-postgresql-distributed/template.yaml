source: https://learn.microsoft.com/en-us/azure/cosmos-db/postgresql/introduction
description: Azure Cosmos DB for PostgreSQL runs PostgreSQL extended with the Citus extension so a cluster starts as a single node and transparently scales to a coordinator plus worker nodes by distributing
  tables, serving multi-tenant SaaS, real-time operational analytics and high-throughput transactional apps. The managed service adds high availability, read replicas, built-in pgBouncer, private endpoints
  and ingestion from Stream Analytics and Data Factory; Microsoft now recommends Elastic Clusters in Azure Database for PostgreSQL for new projects.
