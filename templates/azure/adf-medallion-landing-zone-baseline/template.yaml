description: Data Factory with a self-hosted integration runtime on Azure VMs ingests an on-premises finance system nightly into the bronze layer of Data Lake Storage, and Azure Databricks notebooks refine
  the data through bronze, silver and gold Delta Lake tables. The gold layer loads the conformed enterprise model into Azure SQL Database, Power BI serves dashboards from SQL and Databricks, and a monitor-and-govern
  layer of Azure DevOps, Microsoft Entra ID, Key Vault, Azure Monitor, Cost Management, Microsoft Purview and Site Recovery (protecting the SHIR VMs, reached over Private Link) surrounds the platform.
