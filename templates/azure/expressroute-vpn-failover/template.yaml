description: An on-premises network connects to an Azure virtual network through ExpressRoute private peering as the primary path, with an IPsec site-to-site VPN over the internet as a backup path terminating
  on a coexisting VPN gateway in the same GatewaySubnet. On-premises BGP local preference favors ExpressRoute, and traffic converges onto the VPN tunnel when the circuit or peering location fails.
