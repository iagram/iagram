source: https://learn.microsoft.com/en-us/azure/route-server/overview
description: Azure Route Server in the RouteServerSubnet peers over BGP with an SD-WAN appliance that advertises on-premises prefixes and with a security appliance that advertises a default route, and programs
  both into the effective routes of every VM in the hub and peered spokes without user-defined routes. Branch-to-branch route exchange with the ExpressRoute gateway lets the NVAs learn and advertise routes
  alongside the circuit, with ECMP across multiple NVA instances.
