description: A twin graph (floor contains room contains thermostat) is created in an Azure Digital Twins instance; an Event Grid subscription on IoT Hub device telemetry triggers a function that updates
  the thermostat twin's Temperature property. Twin property-change events are routed through an Azure Digital Twins endpoint to an Event Grid topic, where a second function propagates the change to the
  parent room twin.
