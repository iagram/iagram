description: Static content is hosted in an Azure Storage account and delivered through Azure Front Door Premium, which terminates TLS on a custom domain, applies WAF managed rules, caches responses at
  edge points of presence and connects to the origin over Private Link. The storage firewall blocks all direct internet access so every request is processed by Front Door.
