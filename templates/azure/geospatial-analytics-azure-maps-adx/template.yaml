description: Azure Maps provides render, search, geocoding, routing, geofencing, traffic and weather REST APIs and a WebGL Web SDK, while Azure Data Explorer evaluates geospatial KQL functions over high-volume
  location telemetry ingested from Event Hubs and IoT Hub. Functions enrich positions with Maps geocoding and geofence checks, results are visualised in the Azure Maps Power BI visual and Maps in Fabric
  Real-Time Intelligence, and GeoJSON reference data is kept in Data Lake Storage.
