source: https://learn.microsoft.com/en-us/azure/architecture/microservices/ci-cd-kubernetes
description: Commits and pull requests trigger Azure Pipelines that build and scan container images, push them and versioned Helm charts to Azure Container Registry, then a release pipeline deploys the
  chart to a dev/QA cluster, waits for approval, retags the image for production and deploys to the production AKS cluster. Key Vault supplies runtime secrets via the Secrets Store CSI driver, and Azure
  Monitor observes clusters and applications.
