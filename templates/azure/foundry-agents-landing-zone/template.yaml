description: The baseline Foundry chat workload is deployed into an application landing zone spoke whose virtual network is peered to a platform-owned connectivity hub that supplies Azure Firewall, private
  DNS zones, and hybrid connectivity. The workload team owns App Service, Foundry Agent Service, AI Search, Cosmos DB, and their private endpoints, while internet egress and DNS resolution are delegated
  to the platform team through hub routing.
