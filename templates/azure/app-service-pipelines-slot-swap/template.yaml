description: A variant of the Azure Pipelines baseline where the CI pipeline produces a Web Deploy package and the CD pipeline deploys it to a staging slot of an App Service web app. Release to production
  is a swap of the staging and production slots, and rollback swaps them back; Azure Monitor, Application Insights and Log Analytics provide observability.
