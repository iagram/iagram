description: A client application uploads input files and application packages to a storage account, then creates a pool of compute nodes, a job and tasks in a Batch account, and Batch schedules the tasks
  onto the nodes. Each task downloads its inputs from storage, runs the application and uploads results back to storage, where the client downloads them; the same job can also be orchestrated from Azure
  Data Factory as a custom activity.
