source: https://learn.microsoft.com/en-us/azure/architecture/web-apps/app-service/architectures/baseline-zone-redundant
description: Application Gateway with Web Application Firewall is the single public entry point and forwards requests over a private endpoint to a zone-redundant App Service plan whose public network access
  is disabled. App Service uses virtual network integration to reach SQL Database, Key Vault and Storage through private endpoints in a dedicated subnet, and self-hosted deployment agents inside the network
  upload release packages to the private storage account.
