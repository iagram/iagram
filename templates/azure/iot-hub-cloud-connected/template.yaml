description: In the cloud-connected pattern devices speak MQTT, AMQP or HTTPS directly to IoT Hub, are provisioned zero-touch by the Device Provisioning Service and are represented as Azure resources through
  Azure Device Registry. IoT Hub routes telemetry to Event Hubs and downstream analytics and storage, Azure Digital Twins models the environment, and commands flow back from the cloud to devices.
