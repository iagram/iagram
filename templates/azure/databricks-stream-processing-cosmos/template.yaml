description: Two real-time streams (taxi rides and fares) are published to separate event hubs; an Azure Databricks Spark Structured Streaming job joins and enriches them with neighbourhood lookup data
  and computes windowed averages. Results are written to Azure Cosmos DB for NoSQL, mirrored into Microsoft Fabric for analytics, and Spark metrics and logs land in a Log Analytics workspace.
