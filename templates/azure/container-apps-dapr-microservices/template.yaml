source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/serverless/microservices-with-container-apps-dapr
description: Ten .NET microservices of an order management system run in a single Container Apps environment whose managed Envoy ingress exposes only the UI, while internal services use Dapr service invocation
  and Dapr publish-subscribe over a Service Bus topic. Dapr state and binding components map the Makeline service to Azure Managed Redis, the loyalty service to Cosmos DB, the receipt service to Blob Storage
  and the accounting service to SQL Database, and KEDA scale rules scale consumers on Service Bus topic length down to zero.
