source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/infrastructure/multi-tier-app-disaster-recovery
description: Traffic Manager sends users to a public load balancer in the primary region that fronts web tier VMs, which call business tier VMs through an internal load balancer and then a SQL Server Always
  On availability group through a second internal load balancer, with each tier in its own subnet and VMs spread across availability zones. Site Recovery or SQL Always On asynchronous replication keeps
  a mirrored deployment in a secondary region, and Traffic Manager fails over to that region's public IP when the primary region is unavailable.
