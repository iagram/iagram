image: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/media/ai-agents-at-scale-architecture.svg
source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/ai-agents-at-scale
description: An agent service on AKS receives user queries behind Application Gateway with WAF policies that forward to load balancer front-end IPs in a private subnet, and an agent selector queries an
  AI Search semantic cache of sample utterances to shortlist candidate agents before an LLM picks one or the top-scoring agent is invoked directly. An agent factory instantiates the selected agent, which
  calls Azure OpenAI models through a Foundry project with a managed identity, keeps multiturn context in Azure Managed Redis and reaches Container Registry, Cosmos DB, Data Lake Storage and Key Vault over
  per-service private endpoints resolved by private DNS in a DDoS-protected virtual network; external APIs and MCP servers are reached through Azure Firewall.
