source: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
description: App settings hold Key Vault references instead of secret values; App Service resolves them at startup with a user-assigned managed identity that has the Key Vault Secrets User role, and refetches
  rotated versions every 24 hours. The vault denies public access and is reached through a private endpoint over regional VNet integration, so no credential is ever stored in configuration or code.
