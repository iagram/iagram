source: https://learn.microsoft.com/en-us/azure/chaos-studio/chaos-studio-overview
description: Chaos Studio Workspaces discover the resources in a subscription or resource group scope and run Scenarios such as Compute Zone Down or DNS Outage against onboarded targets; the classic Experiments
  model composes service-direct faults (VM shutdown, SQL failover, Redis flush) and agent-based in-guest faults into steps and branches. Results are paired with Azure Monitor telemetry to assess recovery,
  and experiments can run as deployment gates in CI/CD pipelines or in game days.
