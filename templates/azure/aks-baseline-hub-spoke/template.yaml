source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/containers/aks/baseline-aks
description: A private AKS cluster with system and user node pools runs in a spoke virtual network peered to a hub that hosts Azure Firewall, Azure Bastion and a gateway subnet whose virtual network gateway
  connects the on-premises network, with all cluster egress forced through the firewall by user-defined routes. Application Gateway with WAF terminates TLS and forwards to an internal load balancer and
  in-cluster ingress, operators reach the API server through an Azure Bastion tunnel to the internal load balancer of the API server VNet integration subnet, and the cluster reaches Container Registry and
  Key Vault only through private endpoints while Azure Monitor collects container insights.
