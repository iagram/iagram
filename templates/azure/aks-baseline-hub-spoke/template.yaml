description: A private AKS cluster with system and user node pools runs in a spoke virtual network peered to a hub that hosts Azure Firewall, a gateway subnet and Azure Bastion, with all cluster egress
  forced through the firewall by user-defined routes. Application Gateway with WAF terminates TLS and forwards to an internal load balancer and in-cluster ingress, and the cluster reaches Container Registry
  and Key Vault only through private endpoints.
