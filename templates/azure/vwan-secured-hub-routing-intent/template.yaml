- routing intent
- azure firewall
- firewall manager
- routing policies
source: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
description: Azure Firewall is deployed inside a Virtual WAN hub and routing intent applies an internet traffic routing policy and a private traffic routing policy, so all VNet-to-VNet, branch-to-VNet,
  branch-to-branch and internet-bound flows are steered through the firewall without user-defined routes in the spokes. Branches connect over site-to-site VPN and ExpressRoute, and Azure Firewall Manager
  governs the firewall policy.
