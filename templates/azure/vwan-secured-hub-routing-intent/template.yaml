source: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
description: Azure Firewall is deployed inside two Virtual WAN hubs and routing intent applies an internet traffic routing policy and a private traffic routing policy on each, so all VNet-to-VNet, branch-to-VNet,
  branch-to-branch, inter-hub and internet-bound flows are steered through the firewalls without user-defined routes in the spokes. Each secured hub serves two spoke virtual networks, a VPN/SD-WAN site,
  point-to-site users and an ExpressRoute circuit, the hubs are interconnected over the Microsoft global network, and Azure Firewall Manager governs the shared firewall policy.
