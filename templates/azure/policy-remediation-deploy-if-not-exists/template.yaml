description: Custom policy definitions with deployIfNotExists and modify effects are grouped in an initiative and assigned at the landing zones management group with a user-assigned managed identity that
  holds the roles listed in each definition's roleDefinitionIds. Compliance evaluation flags existing resources as non-compliant, and remediation tasks use the assignment identity to deploy the missing
  configuration, such as diagnostic settings that route resource logs to the central Log Analytics workspace.
