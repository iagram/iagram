description: Containers run on AMD SEV-SNP confidential VM node pools in AKS (with confidential containers on Azure Container Instances for isolated jobs) so data is encrypted in memory and hidden from
  the cloud operator. Azure Attestation verifies the trusted execution environment and issues a token that Managed HSM checks before releasing data-encryption keys, and a confidential ledger records tamper-evident
  audit entries.
