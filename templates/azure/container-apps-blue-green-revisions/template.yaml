source: https://learn.microsoft.com/en-us/azure/container-apps/blue-green-deployment
description: A container app runs in multiple-active-revisions mode; the current release is a revision labelled blue that receives 100% of the traffic weight, and a new image is deployed as a second revision
  labelled green with 0% weight but reachable on its own label FQDN for testing. Switching production is a traffic-weight update to green=100, rollback reverses the weights, and a GitHub workflow or Bicep
  template drives the cycle.
