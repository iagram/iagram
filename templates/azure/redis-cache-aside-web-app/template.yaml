title: Web app with Azure Cache for Redis using the Cache-Aside pattern
category: web
tags:
- redis
- cache-aside
- app service
- sql database
- distributed cache
- performance
source: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
description: App Service web app instances read frequently accessed items from a shared Redis cache first and, on a cache miss, load the item from the SQL data store, add it to the cache with an expiration
  and return it. On updates the app writes to the data store first and then invalidates the cached key, so a subsequent read repopulates the cache with fresh data.
