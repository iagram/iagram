source: https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-kafka-connect-debezium
description: A Kafka Connect worker running the Debezium PostgreSQL connector uses logical decoding on Azure Database for PostgreSQL to capture row-level create, update and delete operations and publishes
  them as change events to Kafka topics hosted on an Event Hubs namespace over SASL_SSL. Connect stores its config, offset and status topics in Event Hubs, one event hub is auto-created per captured table,
  and sink connectors or consumers read the change stream downstream.
