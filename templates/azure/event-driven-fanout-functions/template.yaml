description: Event producers publish events to an Event Grid custom topic; subscriptions fan the same event out to an Azure Function and to a Service Bus topic whose subscriptions feed further Functions
  for queue-based load leveling and competing consumers. Consumers are decoupled from producers and from each other and dead-letter failed messages.
