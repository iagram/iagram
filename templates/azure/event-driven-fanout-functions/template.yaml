image: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/images/event-driven.svg
source: https://learn.microsoft.com/en-us/azure/architecture/guide/architecture-styles/event-driven
description: Producers publish events to an Event Grid custom topic; subscriptions fan the same event out to Azure Functions and to a Service Bus topic whose subscriptions feed further Functions for queue-based
  load leveling and competing consumers. Consumers are decoupled from producers and from each other, persist results to Cosmos DB and dead-letter failed messages.
