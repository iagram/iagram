source: https://learn.microsoft.com/en-us/azure/data-share/overview
description: A data provider creates a share of datasets from Data Lake Storage, Blob Storage, Azure SQL Database or Azure Synapse Analytics, sets terms of use and a snapshot schedule, and invites consumers
  in other Azure subscriptions. Consumers accept the invitation and receive full or incremental snapshots into their own storage or SQL targets, or use in-place sharing for Azure Data Explorer where a symbolic
  link exposes live data without copying; providers can revoke access at any time.
