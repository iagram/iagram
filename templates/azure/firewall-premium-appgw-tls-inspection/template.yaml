source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/gateway/firewall-application-gateway
description: Application Gateway terminates TLS and applies WAF rules, then user-defined routes send the re-encrypted request through Azure Firewall Premium, which uses an intermediate CA certificate from
  Key Vault to decrypt, run IDPS signatures and URL filtering, and forward to the web tier. Outbound traffic from the workload takes the same firewall path for FQDN and category filtering with SNAT, and
  all firewall and WAF logs land in Log Analytics.
