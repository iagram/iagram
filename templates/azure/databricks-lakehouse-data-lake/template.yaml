description: Streaming data arrives through Event Hubs and batch data lands through Data Factory; Azure Databricks curates both into Bronze, Silver and Gold Delta Lake containers on Data Lake Storage, trains
  models tracked in MLflow that are served from Azure Machine Learning, and its SQL warehouses feed Power BI while Microsoft Fabric reads the lake directly. Unity Catalog and Microsoft Purview govern the
  lake, and Microsoft Entra ID, Cost Management, Key Vault, Azure Monitor and Azure DevOps/GitHub form the platform layer.
