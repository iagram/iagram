description: MP4 footage uploaded to Blob Storage triggers an Azure Machine Learning pipeline that runs FFmpeg on an inference cluster to extract frames into Data Lake Storage. A Logic Apps workflow detects
  the new images, calls Custom Vision for domain object detection and the Vision OCR API for text, parses the JSON results into a Fabric warehouse, and Power BI visualises the outcomes.
