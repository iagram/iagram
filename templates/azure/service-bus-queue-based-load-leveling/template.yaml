# Generated from the official reference (https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling); edit freely.
title: Queue-based load leveling with Service Bus and Azure Functions
category: serverless
tags:
- service bus
- queue-based load leveling
- functions
- app service
- target-based scaling
- dead-letter
source: https://learn.microsoft.com/en-us/azure/architecture/patterns/queue-based-load-leveling
description: App Service web app instances post work messages to a Service Bus queue instead of calling the data store directly, so bursts of requests are buffered rather than overwhelming the back end.
  An Azure Functions app reads the queue and performs the reads and writes against the data store at a controlled rate, scaling on queue backlog within configured bounds and routing unprocessable messages
  to a dead-letter queue.
