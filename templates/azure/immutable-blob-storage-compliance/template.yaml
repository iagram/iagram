- compliance
- private endpoint
- lifecycle
source: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
description: Records are written as block or append blobs into a container protected by a locked time-based retention policy, so no user, including account administrators, can modify or delete them until
  the interval expires, and a legal hold can extend protection indefinitely with tagged holds. The account is reached only over a private endpoint, lifecycle management tiers immutable data to cool and
  archive, and resource logs plus the policy audit log are retained in Log Analytics and an archive account for SEC 17a-4(f), FINRA and CFTC evidence.
