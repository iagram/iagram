description: Existing Azure Machine Learning pipelines are extended to chunk, enrich, embed, and index grounding documents into AI Search, and to run prompt and RAG evaluation jobs that score groundedness,
  relevance, coherence, and fluency with the Azure AI Evaluation SDK or Foundry evaluations. A CI/CD pipeline deploys the orchestrator and prompt assets to App Service behind an API Management gateway that
  logs inputs and outputs for production monitoring and human feedback.
