source: https://learn.microsoft.com/en-us/power-bi/developer/embedded/embedded-analytics-power-bi
description: In the embed-for-your-customers (app owns data) model an ISV web application authenticates to Power BI non-interactively with a service principal or master user, generates embed tokens and
  renders reports, dashboards and tiles in its own UI for external users who need no Power BI licence. Production embedding runs on a Power BI Embedded A-SKU capacity provisioned in Azure while semantic
  models query Azure SQL Database and Data Lake Storage.
