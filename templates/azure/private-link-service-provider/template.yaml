description: A service provider runs an application behind a Standard internal Load Balancer and creates a Private Link service that references the load balancer frontend and a NAT subnet whose addresses
  appear as the source of all consumer traffic. A consumer in another Microsoft Entra tenant and subscription creates a private endpoint (10.0.1.5) in a subnet guarded by a network security group with a
  deny-outbound rule, reaches it from on-premises through ExpressRoute private peering and an ExpressRoute gateway, and the provider approves the connection before traffic flows over the Microsoft network.
