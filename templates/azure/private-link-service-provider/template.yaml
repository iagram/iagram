description: A service provider runs an application behind a Standard internal Load Balancer and creates a Private Link service that references the load balancer frontend and a NAT subnet whose addresses
  appear as the source of all consumer traffic. Consumers in another subscription or tenant create a private endpoint that maps to the service alias, and the provider approves the connection request before
  traffic flows over the Azure backbone.
