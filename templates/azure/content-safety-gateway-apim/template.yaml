source: https://learn.microsoft.com/en-us/azure/api-management/llm-content-safety-policy
description: API Management applies the llm-content-safety policy to inbound prompts and outbound completions, sending them through a managed-identity backend to Azure AI Content Safety, which scores hate,
  self-harm, sexual, and violence categories, matches custom blocklists, and runs prompt shields for jailbreak attempts. Requests above the configured severity thresholds are blocked with a 403 before they
  reach the Azure OpenAI deployment, and the same policy protects MCP tool and agent APIs managed by the gateway.
