description: Infrastructure definitions, tests and policy-as-code checks live in GitHub; pull requests run GitHub Actions workflows that generate deployment previews, GitHub Advanced Security scans secrets
  and dependencies, and the Microsoft Security DevOps action reports IaC misconfigurations to Defender for Cloud. The pipeline deploys Azure Verified Modules through Azure Resource Manager deployment stacks
  with deny settings, and Azure Policy, Defender for Cloud, Microsoft Sentinel and Azure Monitor detect drift or threats and open GitHub Issues through a Logic Apps workflow.
