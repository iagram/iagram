description: Infrastructure definitions, tests and policy-as-code checks are written with GitHub Copilot and committed to GitHub repositories; pull requests run GitHub Actions workflows that generate deployment
  previews, GitHub Advanced Security scans secrets and dependencies, and the Microsoft Security DevOps action reports IaC misconfigurations to DevOps security in Defender for Cloud. The workflow deploys
  Azure Verified Modules through Azure Resource Manager deployment stacks with deny settings, Azure Policy and Defender for Cloud evaluate the deployed resources, and a Logic Apps workflow opens GitHub
  Issues for configuration drifts and reconciliation.
