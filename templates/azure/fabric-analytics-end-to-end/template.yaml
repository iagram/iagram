description: OneLake is the single store for a Fabric provider tenant that mirrors Azure SQL Database, Azure Cosmos DB, Azure Database for PostgreSQL, Azure Databricks and Snowflake sources, ingests on-premises,
  AWS and Google Cloud data with Data Factory pipelines and streams IoT Hub and Event Hubs events into eventhouses through eventstreams. Lakehouses, warehouses and eventhouses serve Power BI, data agents
  and a consumer tenant, Data Lake Storage and Blob storage are attached as zero-copy shortcuts, and Microsoft Purview, Key Vault, Microsoft Entra ID, Cost Management and GitHub govern the platform.
