source: https://learn.microsoft.com/en-us/azure/architecture/solution-ideas/articles/iot-azure-data-explorer
description: IoT Hub, Event Hubs or Kafka ingest device telemetry; Azure Functions or Stream Analytics process it and Azure Cosmos DB serves an operational app while Azure Data Explorer ingests the same
  streams through native connectors for near real-time analytics. Cosmos DB change feed triggers Functions that push events back to Event Hubs or Azure Digital Twins, and ADX feeds dashboards, Power BI,
  Grafana, Logic Apps alerts and Databricks or Machine Learning scoring.
