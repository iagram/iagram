source: https://learn.microsoft.com/en-us/azure/well-architected/mission-critical/mission-critical-architecture-pattern
description: Global resources (Front Door, a Cosmos DB account with multi-region writes, Container Registry and Log Analytics) are long-lived and geo-replicated, while each region hosts a replaceable, stateless
  deployment stamp of AKS, Event Hubs, Key Vault and Application Insights. Front Door health-probes every stamp and routes users to the closest healthy region; each stamp reads and writes Cosmos DB locally,
  and any region can be redeployed or lost without a global outage.
