title: Active-passive failover with Traffic Manager priority routing
category: networking
tags:
- traffic manager
- priority routing
- dns load balancing
- endpoint monitoring
- application gateway
- multi-region
image: https://learn.microsoft.com/en-us/azure/traffic-manager/media/traffic-manager-routing-methods/priority.png
source: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
description: A browser asks its recursive DNS service for www.contoso.com, the resolver follows the CNAME to the Traffic Manager profile, and the Priority routing method answers with the available endpoint
  of highest priority, here the Failover A Application Gateway (priority 2) because health checks report the Primary endpoint (priority 1) degraded while Failover B (priority 3) stays online in reserve.
  The client then connects directly to the returned endpoint because Traffic Manager is DNS-based and never sits in the data path.
