image: https://learn.microsoft.com/en-us/azure/traffic-manager/media/traffic-manager-routing-methods/priority.png
source: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
description: A Traffic Manager profile with the Priority routing method returns the primary region's Application Gateway for every DNS query while endpoint monitoring reports it healthy, and returns the
  secondary region's endpoint when probes fail or the endpoint is disabled. Clients connect directly to the returned endpoint because Traffic Manager is DNS-based and never sits in the data path.
