source: https://learn.microsoft.com/en-us/azure/architecture/guide/aks/blue-green-deployment-for-aks
description: A new (green) AKS cluster is deployed next to the live (blue) cluster, its Kubernetes state is synced by CI/CD or GitOps, and it is validated with Azure Monitor metrics before traffic is switched.
  Each cluster sits behind its own Application Gateway; Azure Front Door and Azure DNS A/CNAME record changes perform the switch, after which the blue cluster is destroyed.
