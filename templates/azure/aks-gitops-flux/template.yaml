description: The microsoft.flux cluster extension installs the Flux source, kustomize, helm and notification controllers in the cluster, and fluxConfigurations resources created through Azure Resource Manager
  tell them which Git repository, Bucket or Azure Blob source and kustomizations to reconcile. Reconciliation is pull-based from inside the cluster so no external CI system needs cluster credentials, and
  Azure Policy can assign the same configuration to fleets of AKS and Arc-enabled clusters.
