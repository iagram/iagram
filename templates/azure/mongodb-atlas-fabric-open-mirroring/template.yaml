source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/analytics/sync-mongodb-atlas-fabric-analytics
description: A Python mirroring accelerator hosted on Azure App Service performs an initial load and then subscribes to MongoDB Atlas change streams, writing insert, update and delete events as Parquet
  files into the landing zone of an open mirrored database in Fabric. Fabric converts the files to Delta tables in OneLake, keeps them synchronised, generates a default semantic model and exposes the data
  to lakehouses, warehouses and Power BI Direct Lake reports.
