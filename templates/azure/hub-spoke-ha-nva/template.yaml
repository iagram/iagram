source: https://learn.microsoft.com/en-us/azure/architecture/networking/guide/network-virtual-appliance-high-availability
description: A cluster of third-party firewall NVAs in the hub is fronted by an internal Standard Load Balancer with HA-ports rules for east-west and on-premises traffic and by a public Standard Load Balancer
  for internet ingress. Spoke subnets carry a 0.0.0.0/0 user-defined route to the internal load balancer, the NVAs SNAT inbound flows to keep traffic symmetric, and a NAT gateway on the NVA subnet provides
  scalable egress.
