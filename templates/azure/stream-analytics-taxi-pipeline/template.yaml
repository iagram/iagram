source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/data/stream-processing-stream-analytics
description: Two event hubs ingest taxi ride and fare streams partitioned by the same key so a Stream Analytics job can correlate them with a temporal join and compute average tip per mile over a five-minute
  hopping window. Results are written as JSON documents to Azure Cosmos DB for Power BI analysis, Azure Monitor tracks streaming units and throttling, and a network security perimeter restricts access to
  Event Hubs.
