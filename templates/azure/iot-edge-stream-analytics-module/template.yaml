source: https://learn.microsoft.com/en-us/azure/iot-edge/tutorial-deploy-stream-analytics
description: A Stream Analytics job with the Edge hosting environment is exported as a container definition to a storage account and deployed to an IoT Edge device through an IoT Hub deployment manifest,
  alongside a simulated temperature sensor module. Edge hub routes sensor telemetry into the job, which computes a 30-second tumbling-window average and sends a reset command back to the sensor module when
  the threshold is exceeded, while telemetry and alerts also flow upstream to IoT Hub.
