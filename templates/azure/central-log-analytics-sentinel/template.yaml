source: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
description: Operational and security data is consolidated into a single Log Analytics workspace in the management subscription, with Microsoft Sentinel enabled on the workspace so analytics rules, incidents
  and SOAR playbooks operate on the same data that Azure Monitor collects. Azure Monitor Agent sends VM and Arc-enabled server logs through data collection rules, PaaS resources stream diagnostic settings,
  and data export to Event Hubs and a storage account supports downstream SIEMs and long-term retention.
