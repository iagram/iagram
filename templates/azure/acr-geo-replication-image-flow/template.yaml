description: A Premium container registry is geo-replicated so that clients such as regional AKS nodes address a single global endpoint (myregistry.azurecr.io, serving the auth and data plane APIs) and
  Azure-managed routing sends each request to the geo-replica with the best network performance profile. The replica answers blob requests with a 307 redirect to its own data endpoint, backed by regional
  blob storage or a dedicated data endpoint, so image layers are pulled from the nearest region.
