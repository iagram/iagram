source: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-geo-replication
description: A Premium container registry in its home region is geo-replicated to additional regions so that a single global endpoint routes pushes and pulls to the nearest active-active replica, with content
  synced across replicas under eventual consistency. ACR Tasks build images in the home region, webhooks fire per replica when replication completes, and AKS clusters in each region pull their images from
  the local replica through the global or regional endpoint, optionally over private endpoints.
