description: An internet-facing multi-tier web application runs on separate front-end and back-end Virtual Machine Scale Sets spread across availability zones, fronted by a zone-redundant Application Gateway
  with WAF and an internal load balancer between tiers. Key Vault supplies TLS certificates over Private Link, Azure Bastion provides operator access, and a public load balancer with outbound rules handles
  SNAT egress.
