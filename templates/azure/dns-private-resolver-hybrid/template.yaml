description: DNS Private Resolver in the hub virtual network replaces DNS forwarder VMs, with an inbound endpoint that on-premises servers target through conditional forwarders and an outbound endpoint
  that forwards Azure queries for on-premises domains through a DNS forwarding ruleset. Private DNS zones for private endpoint services are linked to the hub and spoke virtual networks, and ExpressRoute
  or VPN with Azure Firewall provides the secured hybrid path.
