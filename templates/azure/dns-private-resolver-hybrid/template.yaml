image: https://learn.microsoft.com/en-us/azure/architecture/networking/architecture/_images/dns-forwarder-architecture.svg
source: https://learn.microsoft.com/en-us/azure/architecture/networking/architecture/azure-dns-private-resolver
description: An on-premises client asks the internal DNS server for a SQL Database name, a conditional forwarder for database.windows.net sends the query to the hub virtual network, where a DNS forwarder
  virtual machine (or the inbound endpoint of Azure DNS Private Resolver, which replaces it) hands it to Azure-provided DNS at 168.63.129.16; the Azure recursive resolver answers from the privatelink.database.windows.net
  private DNS zone linked to the hub, and the private endpoint IP travels back to the client, which then reaches the database over ExpressRoute or VPN. The resolver outbound endpoint forwards queries for
  on-premises domains back to the internal DNS server through a DNS forwarding ruleset.
