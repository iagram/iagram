description: A private AKS cluster runs in a spoke virtual network peered to a hub that provides Azure Firewall egress and Azure Bastion access; Application Gateway with WAF terminates public TLS and forwards
  to an internal load balancer fronting the ingress that routes to microservice pods. Container Registry and Key Vault are reached only through private endpoints and all egress is forced through the hub
  firewall by user-defined routes.
