source: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
description: The Site Recovery Mobility service on each protected VM writes disk changes to a cache storage account in the source region, and Site Recovery replicates them to replica managed disks in the
  target region, creating crash-consistent recovery points every five minutes and app-consistent points per the replication policy. On failover VMs are created in the mapped target virtual network from
  a chosen recovery point; the same Recovery Services vault also holds daily VM backups, and a Backup vault protects blob data.
