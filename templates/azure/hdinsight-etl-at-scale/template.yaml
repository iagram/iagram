source: https://learn.microsoft.com/en-us/azure/hdinsight/hadoop/apache-hadoop-etl-at-scale
description: Source files land in Azure Storage or Data Lake Storage (through Data Factory, DistCp or Sqoop) and HDInsight Hadoop, Spark and Kafka clusters clean and transform them with Hive, Pig and Spark
  SQL, coordinated by Apache Oozie inside the cluster or Data Factory as PaaS orchestration. Prepared results load into Azure Synapse Analytics, Azure SQL Database or HBase and are modelled in Azure Analysis
  Services for Power BI.
