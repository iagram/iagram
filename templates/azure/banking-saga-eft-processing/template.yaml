source: https://learn.microsoft.com/en-us/industry/financial-services/architecture/patterns-and-implementations-content
description: Distributed financial transactions are coordinated with an orchestration-based saga implemented in Azure Durable Functions, with saga participants as Azure Functions, Event Hubs as the streaming
  platform and Cosmos DB as the state store. An electronic funds transfer processor on AKS scales with KEDA using the Kafka topic trigger against Event Hubs, and Azure Load Testing with JMeter scripts validates
  performance in the CI/CD pipeline.
