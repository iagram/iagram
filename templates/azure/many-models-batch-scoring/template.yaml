source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/idea/many-models-machine-learning-azure-machine-learning
description: Azure Data Factory copies source data into Data Lake Storage, and Azure Machine Learning pipelines on a compute cluster use ParallelRunStep to train one model per data partition, register qualifying
  models, and batch-score every partition in parallel. Predictions are written back to the data lake and served from Synapse SQL to Power BI, while a managed online endpoint loads models on demand for real-time
  requests.
