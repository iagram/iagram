title: Govern on-premises servers with Azure Arc, Policy, Monitor and Update Manager
category: security
tags:
- azure arc
- arc-enabled servers
- machine configuration
- azure monitor agent
- update manager
- defender for servers
- private link
source: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
description: The Connected Machine agent projects on-premises Windows and Linux servers into Azure as Arc-enabled server resources with their own resource IDs and managed identities, so Azure RBAC, tags
  and Azure Policy machine configuration apply to them like native VMs. Azure Monitor Agent sends logs through data collection rules to a central Log Analytics workspace, Update Manager schedules patching,
  Defender for Servers protects them, and an Arc Private Link Scope keeps agent traffic on a private endpoint reached over the site-to-site connection.
