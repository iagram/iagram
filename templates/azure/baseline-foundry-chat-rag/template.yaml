image: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/_images/baseline-microsoft-foundry.svg
source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
description: A zone-redundant App Service chat UI behind Application Gateway with WAF calls a Foundry Agent Service prompt agent over a private endpoint; the agent grounds Azure OpenAI completions with
  vector results from Azure AI Search and persists conversation state in Cosmos DB and Blob Storage. Every PaaS dependency is reached through private endpoints in a segmented virtual network, and agent
  egress to public tools and MCP servers is forced through Azure Firewall FQDN rules.
