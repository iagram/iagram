description: A zone-redundant App Service chat UI behind Application Gateway with WAF is reached through its private endpoint and uses a user-assigned managed identity to call a Foundry Agent Service prompt
  agent over another private endpoint; the agent grounds Azure OpenAI completions with vector results from Azure AI Search and persists conversation state in Cosmos DB and Blob Storage. Key Vault, Storage,
  Foundry and AI Search each expose a private endpoint in a dedicated subnet of a DDoS-protected virtual network with linked private DNS zones, users and workload identities authenticate with Microsoft
  Entra ID, and agent egress to public tools and MCP servers is forced through Azure Firewall FQDN rules.
