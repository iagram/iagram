description: On-premises VMs reach a storage account in the landing zone only through a private endpoint in the spoke virtual network, over the ExpressRoute circuit and the hub-spoke peering, with the storage
  account's public endpoint disabled. The on-premises DNS servers conditionally forward privatelink.blob.core.windows.net to two DNS forwarder VMs in the hub, which forward to the Azure-provided DNS at
  168.63.129.16 so that the Azure recursive resolver answers from the private DNS zone linked to the hub virtual network; a DNS Private Resolver inbound endpoint can replace the forwarder VMs.
