- zero trust
- expressroute
image: https://learn.microsoft.com/en-us/azure/architecture/networking/guide/images/private-link-hub-spoke-network-basic-hub-spoke-diagram.svg
source: https://learn.microsoft.com/en-us/azure/architecture/networking/guide/private-link-hub-spoke-network
description: PaaS services are reached only through private endpoints; shared endpoints used from on-premises or by several workloads live in a dedicated hub subnet behind the firewall, while single-application
  endpoints sit in the spoke, and public endpoints are disabled. Centralized private DNS zones linked to every virtual network resolve the privatelink FQDNs, and a DNS Private Resolver inbound endpoint
  lets on-premises resolvers answer the same names over ExpressRoute.
