description: A NAT gateway is associated with the AzureFirewallSubnet in the hub so all internet-bound traffic that spokes send to Azure Firewall through a 0.0.0.0/0 route egresses through the NAT gateway,
  which provides 64,512 SNAT ports per public IP instead of the firewall's 2,496. Spoke workloads have no public IP and are reached for administration through Azure Bastion in the hub.
