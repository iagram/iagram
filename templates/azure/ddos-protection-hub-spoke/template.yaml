description: A DDoS protection plan is enabled on the hub virtual network so every public IP in it, including the Azure Firewall and Azure Bastion frontends, receives Layer 3 and 4 mitigation with adaptive
  tuning and telemetry. Spokes are peered to the hub with no direct spoke-to-spoke path, the firewall controls ingress from the internet, and Bastion provides administrative access without public IPs on
  the workload VMs.
