source: https://learn.microsoft.com/en-us/azure/architecture/reference-architectures/hybrid-networking/expressroute-private-peering-connectivity
description: An ExpressRoute circuit at a peering location provides a primary and a secondary link between the connectivity provider's partner edge router and Microsoft Enterprise Edge routers, with BGP
  sessions over Azure private peering for virtual networks and Microsoft peering for Microsoft 365 and Azure public services. An ExpressRoute virtual network gateway in the GatewaySubnet terminates the
  ExpressRoute connection so on-premises hosts reach workloads in the virtual network over the Microsoft global network.
