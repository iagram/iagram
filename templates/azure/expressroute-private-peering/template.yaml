description: An ExpressRoute circuit at a peering location provides two redundant links between the customer's local edge routers and Microsoft Enterprise Edge routers, with BGP sessions over Azure private
  peering. An ExpressRoute virtual network gateway in the GatewaySubnet terminates the ExpressRoute connection so on-premises hosts reach workloads in the virtual network over the Microsoft global network.
