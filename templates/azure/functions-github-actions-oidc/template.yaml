source: https://learn.microsoft.com/en-us/azure/azure-functions/functions-how-to-github-actions
description: A GitHub Actions workflow builds the function project on push and authenticates to Azure with OpenID Connect through a Microsoft Entra workload identity federation, so no publish profile or
  long-lived secret is stored in GitHub. The Azure Functions action deploys the package to the function app, whose runtime state and deployment package live in a storage account and whose telemetry flows
  to Application Insights.
