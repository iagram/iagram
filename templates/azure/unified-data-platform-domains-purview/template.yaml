description: Microsoft Entra ID, Agent 365, Purview and Defender govern the whole organization while a platform landing zone with management groups, Azure Policy and Azure Monitor hosts application landing
  zones per data domain, each owning Fabric capacities, Azure Databricks or Foundry agents that publish governed data products to OneLake. Azure databases are mirrored into Fabric, Foundry agents consume
  data products through Foundry IQ, and Power BI, data science tools, Copilot Studio and Microsoft 365 Copilot consume them from the OneLake catalog.
