source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/apps/apim-api-scenario
description: A travel e-commerce company hosts a new browser-based UI and new HTTP APIs on App Service while API Management acts as a facade over both the new APIs and the existing on-premises SOAP services,
  which only accept calls from the API Management IP address over TLS with client certificates. Users can be directed to the new UI or the legacy UI side by side, and functionality moves gradually behind
  the API Management configuration without changing the front end.
