source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
description: A chat UI on zone-redundant App Service behind Application Gateway with WAF invokes an agent that grounds Azure OpenAI model calls with vector search results from Azure AI Search and persists
  conversation state in Cosmos DB and Storage. All PaaS dependencies are reached over private endpoints from a segmented virtual network, and agent egress to external tools passes through Azure Firewall
  FQDN rules.
