source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/architecture/baseline-microsoft-foundry-chat
description: A chat UI on zone-redundant App Service behind Application Gateway with WAF invokes a Microsoft Foundry Agent Service agent through a private endpoint; the agent grounds Azure OpenAI model
  calls with retrieval from an AI Search knowledge store and keeps its dependencies (AI Search, Cosmos DB, Storage) behind private endpoints. All PaaS services are reached from a segmented virtual network
  with private DNS zones and DDoS protection, agent egress to internet sources passes through Azure Firewall, operators reach a jump box through Azure Bastion, build agents deploy the app, and Application
  Insights with Azure Monitor observe the workload.
