description: A generator sends call detail records to an Event Hubs namespace; a Stream Analytics job reads the stream with a dedicated consumer group and uses a self-join with DATEDIFF to flag calls from
  the same subscriber identity in different regions within five seconds, aggregated over tumbling windows. Flagged records are written to a Power BI streaming dataset for a live dashboard, and the same
  technique applies to credit card fraud and identity theft.
