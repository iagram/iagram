description: Two Microsoft-managed Virtual WAN hubs (vhubvnet1 and vhubvnet2) replace self-managed hub virtual networks and provide any-to-any transit between spoke virtual networks (including a shared
  services virtual network), branch VPN sites, ExpressRoute circuits and point-to-site VPN users, with hub-to-hub connectivity across regions. Virtual network connections except the shared services network
  use the RT_VNets route table while VPN, ExpressRoute, P2S and shared services connections use the default route table, and DDoS Protection covers the spokes.
