description: Microsoft-managed Virtual WAN hubs replace self-managed hub virtual networks and provide any-to-any transit between spoke virtual networks, branch VPN sites, ExpressRoute circuits and point-to-site
  users, with hub-to-hub connectivity across regions. Azure Firewall in a secured virtual hub inspects private and internet-bound traffic through routing intent, so spokes need no user-defined routes.
