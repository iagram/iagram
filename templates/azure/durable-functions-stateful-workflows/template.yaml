description: Durable Functions extends Azure Functions with orchestrator, activity and entity functions so that function chaining, fan-out/fan-in, monitor and human-interaction workflows run reliably over
  long periods. The runtime checkpoints orchestration state, retries and recovery into a task hub in the configured storage provider, and HTTP APIs start and query orchestration instances.
