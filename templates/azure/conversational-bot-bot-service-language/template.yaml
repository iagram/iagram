description: Azure AI Bot Service connects channels such as Microsoft Teams and web chat to a bot web application on App Service, exchanging message and conversation-update activities over HTTPS POST within
  15-second turns. The bot uses Azure AI Language conversational language understanding and custom question answering to interpret intents and answer FAQs, persists conversation state in Cosmos DB, and
  reports telemetry to Application Insights.
