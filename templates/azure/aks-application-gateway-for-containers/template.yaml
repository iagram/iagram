description: A private AKS cluster shares a single Application Gateway for Containers instance, deployed in a delegated /24 subnet with a public IP and a WAF security policy, as the layer-7 ingress for
  tenant namespaces that define their own Kubernetes Gateway API routes. Azure Bastion connects operators directly to the private API server, and the cluster reaches Container Registry and Key Vault over
  private endpoints with private DNS zones linked to the virtual network.
