description: Big compute workloads such as financial risk modeling and Monte Carlo simulations split into thousands of finite tasks that a client submits through a job queue to a scheduler and coordinator,
  Azure Batch, which distributes them across burst-provisioned pools of compute-intensive VMs that scale back to zero when the run finishes. Embarrassingly parallel tasks each read their inputs from and
  write their results to Azure Storage independently, while tightly coupled tasks run on RDMA-capable H-series VMs in a pool that exchanges intermediate results over the network and shares one storage account.
