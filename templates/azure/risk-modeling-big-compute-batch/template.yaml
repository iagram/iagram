description: Big compute workloads such as financial risk modeling and Monte Carlo simulations split into thousands of finite tasks that a scheduler distributes across a burst-provisioned pool of compute-intensive
  VMs, which scale back to zero when the run finishes. Azure Batch provisions the pool, assigns tasks, monitors progress and autoscales, with input data and results in Azure Storage; tightly coupled tasks
  use RDMA-capable H-series VMs, and an on-premises HPC Pack head node can burst into Azure over ExpressRoute or VPN.
