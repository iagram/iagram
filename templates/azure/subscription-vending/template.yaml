source: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/subscription-vending
description: Application teams request a subscription through an ITSM front door; a platform pipeline creates the subscription programmatically with infrastructure as code, places it under the right management
  group, peers its virtual network to the connectivity hub from a non-overlapping IP range, and configures budgets, tags, subscription owners and workload identities before handing it over. Governance stays
  with the platform team through Azure Policy assigned on the management group hierarchy.
