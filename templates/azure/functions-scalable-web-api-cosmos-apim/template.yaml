description: HTTP-triggered Azure Functions define the endpoints of a web API and write documents to Azure Cosmos DB through the Cosmos DB output binding, while API Management exposes the function endpoints
  as managed serverless APIs with an OpenAPI definition. A second function uses the Cosmos DB change feed trigger to react to database changes, and the function host stores its state in a storage account.
