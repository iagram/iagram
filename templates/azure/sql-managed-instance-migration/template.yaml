description: Azure Migrate assesses the on-premises SQL Server estate and recommends a service tier; databases then move to a SQL Managed Instance in a dedicated subnet via the Managed Instance link (distributed
  availability group replication for minimal downtime), the Log Replay Service restoring backups from Blob Storage, or native backup and restore. Azure Database Migration Service handles logins, SQL Agent
  jobs and SSIS packages, and Key Vault holds migrated TDE certificates.
