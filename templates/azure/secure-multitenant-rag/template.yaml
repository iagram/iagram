source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/secure-multitenant-rag
description: A multitenant intelligent application authenticates users with an identity provider and calls an orchestrator API that fetches grounding data only from stores the tenant and user are authorised
  to read, applying tenant discriminators and security filters before building the prompt for a Foundry model. A data-access API layer encapsulates routing to store-per-tenant AI Search indexes, a partitioned
  multitenant Cosmos DB store, and a shared PostgreSQL knowledge store, and logs grounding access for audit.
