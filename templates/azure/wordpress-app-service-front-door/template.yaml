title: WordPress on App Service with Azure Front Door and Azure Database for MySQL
category: web
tags:
- wordpress
- app service
- front door
- waf
- mysql flexible server
- blob storage
- private endpoint
source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/infrastructure/wordpress-app-service
description: Users reach WordPress through Azure Front Door with Web Application Firewall, which caches static content and distributes requests to App Service web apps that run WordPress. The app connects
  to an Azure Database for MySQL flexible server with a zone-redundant standby through a private endpoint, static content is hosted in Blob Storage, and private DNS zones linked to the virtual network resolve
  the private endpoints.
