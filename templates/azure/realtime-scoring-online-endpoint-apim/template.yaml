description: A managed online endpoint hosts blue and green deployments of a registered model with a traffic split for safe rollout and traffic mirroring, and inbound scoring calls reach it through the
  workspace private endpoint while the managed virtual network isolates outbound traffic. API Management fronts the endpoint to apply authentication, rate limits, and versioning for client applications,
  with Azure Monitor and Application Insights collecting latency, request, and container metrics.
