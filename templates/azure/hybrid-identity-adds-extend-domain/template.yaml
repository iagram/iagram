source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/identity/adds-extend-domain
description: Two domain controller VMs in a dedicated AD DS subnet, spread across availability zones with static private IPs and a restrictive NSG, replicate with on-premises domain controllers over a VPN
  or ExpressRoute gateway and serve authentication and DNS to workloads in Azure. Administrative access uses Azure Bastion rather than public IPs, DDoS Protection covers the perimeter, and Recovery Services
  backs up the domain controllers' system state.
