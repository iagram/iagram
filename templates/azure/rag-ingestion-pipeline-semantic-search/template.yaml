image: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/_images/rag-high-level-architecture-questions.svg
source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/rag/rag-solution-design-and-evaluation-guide
description: A data pipeline pulls documents from Blob Storage, chunks and enriches them with metadata, generates embeddings with an Azure OpenAI embedding model, and persists the chunks into an AI Search
  index configured for vector, full-text, and hybrid queries with semantic ranking. At request time an orchestrator on App Service issues the search, packages the top results and the user query into a prompt
  for the chat model, and returns the grounded response to the intelligent application.
