description: A dedicated Azure AD B2C tenant stores consumer accounts and runs sign-up/sign-in user flows or custom policies, federating with social and enterprise identity providers over OIDC, OAuth 2.0
  and SAML before returning tokens to registered web and mobile applications. Azure Front Door fronts the tenant for a custom login domain, API connectors call a REST API to validate and enrich user data,
  and audit logs and Application Insights telemetry provide usage and security visibility.
