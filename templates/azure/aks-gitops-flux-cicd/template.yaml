source: https://learn.microsoft.com/en-us/azure/architecture/example-scenario/gitops-aks/gitops-blueprint-aks
description: GitHub Actions builds a container image from committed application code, pushes it to Container Registry and updates the image tag in the Kubernetes manifests stored in the Git repository.
  The Flux v2 cluster extension on each AKS cluster polls the repository, detects drift and reconciles manifests, Helm charts or Kustomizations into the cluster without exposing cluster endpoints to build
  agents, so the same repository keeps primary and disaster-recovery clusters in a consistent state.
