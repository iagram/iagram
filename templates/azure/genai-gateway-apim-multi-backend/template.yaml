source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/azure-openai-gateway-multi-backend
description: Intelligent applications call a single API Management endpoint instead of Foundry data-plane APIs directly, and gateway policies load-balance across provisioned and standard model deployments
  in several Azure OpenAI instances and regions with priority routing, circuit breaking on 429 responses, token rate limits, and token metrics. Private endpoints connect the gateway to each backend, and
  Event Hubs plus Log Analytics receive usage and prompt logs for chargeback and auditing.
