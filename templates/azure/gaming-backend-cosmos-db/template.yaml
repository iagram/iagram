source: https://learn.microsoft.com/en-us/azure/cosmos-db/use-cases
description: Game clients call a stateless API tier that stores player profiles, in-game stats, guild membership and leaderboards in Azure Cosmos DB, whose automatic indexing supports lookups by player
  ID or social identities and whose throughput scales elastically for launches and feature updates. Telemetry and match events are ingested through Event Hubs and Azure Functions, notifications reach players
  through Notification Hubs, and Traffic Manager routes clients to the closest region of a multi-region Cosmos DB account.
