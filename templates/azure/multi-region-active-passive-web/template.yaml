source: https://learn.microsoft.com/en-us/azure/architecture/web-apps/guides/multi-region-app-service/multi-region-app-service
description: Identical App Service deployments run in a primary and a secondary region; Azure Front Door routes all traffic to the priority-1 primary origin and fails over to the priority-2 secondary origin
  when health probes detect an outage. Azure SQL Database replicates asynchronously to the secondary region through a failover group so the app always connects via the read-write listener.
