description: An Azure Data Explorer cluster hosts databases and tables of automatically indexed, partitioned extents; events arrive by queued or streaming ingestion through Event Hubs and blob-arrival Event
  Grid notifications, while Data Factory copies historical batches. Analysts run KQL time series, anomaly detection and geospatial queries in the web UI, dashboards, Power BI and Grafana, and continuous
  export writes Parquet back to Data Lake Storage.
