source: https://learn.microsoft.com/en-us/azure/architecture/guide/networking/global-web-applications/mission-critical-global-http-ingress
description: A weighted Traffic Manager profile normally resolves clients to Azure Front Door Premium, which applies WAF and reaches regional origins over Private Link. If Front Door is unavailable the
  endpoint is disabled and a nested performance-routing Traffic Manager profile sends clients to a WAF-enabled Application Gateway in each region, so both paths are protected and terminate on the same origin
  servers.
