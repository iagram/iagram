description: Azure Static Web Apps hosts the static front end and exposes a serverless API on the fixed /api route, either as managed HTTP-only functions deployed with the site or as a linked, self-managed
  Azure Functions app that supports all triggers, bindings, managed identity and Key Vault references. Requests to /api are proxied by Static Web Apps to the linked function app without custom CORS rules,
  and Application Insights on the function app collects logs.
