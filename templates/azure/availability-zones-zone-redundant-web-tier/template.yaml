source: https://learn.microsoft.com/en-us/azure/well-architected/design-guides/regions-availability-zones
description: Every tier is spread across the region's three availability zones so the loss of one zone does not take the workload down; a zone-redundant Application Gateway v2 with a zone-redundant public
  IP fronts a scale set whose instances are distributed across zones, the database is a zone-redundant Azure SQL tier with replicas in each zone, and storage uses ZRS for synchronous cross-zone replication.
  Key Vault and Log Analytics are zone-resilient platform services.
