description: A customer-managed hub virtual network hosts shared services (Azure Firewall, Azure Bastion, VPN/ExpressRoute gateway) and is peered to isolated spoke virtual networks that hold workloads.
  Spoke egress and spoke-to-spoke traffic are forced through the hub firewall with user-defined routes, and the hub gateway provides cross-premises connectivity for every spoke.
