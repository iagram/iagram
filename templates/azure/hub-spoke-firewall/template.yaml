description: A customer-managed hub virtual network hosts shared services (Azure Firewall, Azure Bastion, VPN gateway) and is connected through Azure Virtual Network Manager or peered to isolated production
  and nonproduction spoke virtual networks whose resource subnets hold virtual machines. Spoke egress is forced through the hub firewall with user-defined routes (forced tunnel), the hub VPN gateway connects
  the cross-premises network for every spoke, and Azure Monitor collects diagnostics from the hub services.
