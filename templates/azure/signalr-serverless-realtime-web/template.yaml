source: https://learn.microsoft.com/en-us/azure/azure-signalr/signalr-concept-serverless-development-config
description: Browser clients call an HTTP-triggered negotiate function to obtain a SignalR Service access token and endpoint, then connect to the SignalR Service instance configured in Serverless mode.
  Client messages are delivered to functions through the SignalR trigger and an upstream endpoint, and functions broadcast messages to all, grouped or specific users through the SignalR output binding,
  with API Management optionally adding CORS in front of the function app.
