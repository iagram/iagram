description: Azure IoT Operations runs an edge-native MQTT broker, Akri connectors (including the connector for OPC UA) and data flows on an Azure Arc-enabled Kubernetes cluster at the plant, normalizing
  and contextualizing OT data locally and tolerating up to 72 hours offline. Assets are registered in Azure Device Registry as ARM resources, and data flows forward processed messages to Event Hubs, Event
  Grid MQTT, Data Lake Storage, Azure Data Explorer or Microsoft Fabric OneLake for cloud analytics.
