description: Azure Bastion is deployed in the hub's AzureBastionSubnet with a single public IP and brokers RDP and SSH over TLS on port 443 from the Azure portal or native clients to VMs in peered spoke
  networks, so no VM needs a public IP, agent or open management port. Entra ID authentication with MFA and just-in-time role activation gate access, SSH keys come from Key Vault, and Bastion audit logs
  and Premium session recordings provide the compliance trail.
