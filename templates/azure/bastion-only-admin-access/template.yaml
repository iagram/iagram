description: Azure Bastion is deployed in the AzureBastionSubnet of the hub virtual network and, in this private-only deployment, is reached on its private IP address over TLS on port 443 from the Azure
  portal or a native client; it brokers RDP and SSH (ports 3389/22) to the private IP addresses of VMs in the peered spoke subnets, so no VM needs a public IP, agent or open management port. Network security
  groups on the Bastion subnet and on the target VM subnets limit traffic to the Bastion control plane and to remote-protocol ports from AzureBastionSubnet, and Entra ID authentication with MFA and just-in-time
  role activation gate access.
