description: A global tier Standard Load Balancer deployed in a home region exposes a static anycast frontend on TCP port 50000 and holds three regional public Standard Load Balancers in its backend pool,
  routing each flow from the closest participating region over the Microsoft backbone to the nearest healthy regional deployment. Each regional load balancer forwards to the web tier virtual machines on
  port 80, health checks every 5 seconds remove a failed region from rotation, and the client IP is preserved as Layer 4 pass-through.
