source: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
description: A global tier Standard Load Balancer deployed in a home region exposes a static anycast public IP and holds regional public Standard Load Balancers in its backend pool, routing each flow from
  the closest participating region over the Microsoft backbone to the nearest healthy regional deployment. Health checks every 5 seconds remove a failed region from rotation, client IP is preserved as Layer
  4 pass-through, and outbound traffic uses regional outbound rules or a NAT gateway.
