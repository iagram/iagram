description: The network interfaces of VM1 and VM2 join the AsgWeb application security group, NIC3 joins AsgLogic and NIC4 joins AsgDb, and a single network security group NSG1 on Subnet1 and Subnet2 allows
  HTTP on TCP port 80 from the internet only to AsgWeb, allows SQL on TCP port 1433 from AsgLogic to AsgDb, and denies all other traffic to AsgDb ahead of the default AllowVNetInBound rule. Security policy
  follows the application structure without maintaining explicit IP addresses.
