description: An Azure Arc Private Link Scope is attached to a private endpoint in the management virtual network so the Connected Machine agent on on-premises servers reaches the Hybrid Compute and Guest
  Configuration resource providers over ExpressRoute or site-to-site VPN instead of public endpoints, and Azure Monitor and Azure Automation use their own private endpoints in the same network. Authentication
  with Microsoft Entra ID, control-plane calls to Azure Resource Manager and Azure Relay sessions still leave through the on-premises proxy or firewall on HTTPS 443.
