description: An Azure Arc Private Link Scope is attached to a private endpoint in the management virtual network so the Connected Machine agent on on-premises servers reaches Azure Arc over ExpressRoute
  or site-to-site VPN instead of public endpoints. Private DNS zones for privatelink.his.arc.azure.com and privatelink.guestconfiguration.azure.com are linked to the network and resolved from on-premises
  through a DNS forwarder, and Azure Monitor collection uses its own private link scope.
