description: Debezium connectors capture row-level changes from OLTP databases and publish them to Event Hubs, which streams into Azure Synapse Spark pools or lands raw data in Data Lake Storage. Spark
  validates and writes Delta Lake tables, loads curated data into a dedicated SQL pool for Power BI, and denormalised documents into Azure Cosmos DB and Azure AI Search for low-latency APIs, while serverless
  SQL pools and Azure Machine Learning consume the validated zone.
