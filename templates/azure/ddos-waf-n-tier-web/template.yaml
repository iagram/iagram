source: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-reference-architectures
description: A DDoS Network Protection plan enabled on the virtual network protects every public IP in it at layers 3 and 4, while an Application Gateway WAF v2 in prevention mode blocks layer 7 attacks
  such as SQL injection before requests reach the web tier. Web and business tiers run as scale sets behind the gateway and an internal load balancer so they can scale out under attack, and DDoS mitigation
  metrics raise alerts through Azure Monitor.
