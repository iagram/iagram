description: A publisher application posts events to an Event Grid custom topic, and one event subscription per destination pushes filtered copies of each event to an Azure Function, a Service Bus queue,
  an Event Hubs instance, a Storage queue and a Logic Apps webhook. Push delivery retries for 24 hours with exponential backoff, and each handler processes its copy of the event independently.
