source: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
description: A failover group replicates the application's databases from the primary logical server to a secondary server in the paired region and exposes read-write and read-only listener endpoints whose
  DNS is updated on failover, so application connection strings never change. Front Door sends traffic to the primary region's App Service and fails over to the secondary on failed health probes; each region
  reaches SQL through private endpoints, and the recommended customer-managed failover policy keeps the failover decision with the operations team.
