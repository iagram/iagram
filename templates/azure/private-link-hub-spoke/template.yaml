description: A private endpoint in the landing zone virtual network gives a storage account a private IP that on-premises hosts reach over an ExpressRoute circuit terminated in the hub virtual network,
  with the hub and the landing zone joined by virtual network peering. On-premises DNS servers forward privatelink.blob.core.windows.net queries to two DNS forwarder virtual machines in the hub, which hand
  them to Azure-provided DNS at 168.63.129.16 so the Azure recursive resolver answers from the centralized private DNS zone linked to every virtual network.
