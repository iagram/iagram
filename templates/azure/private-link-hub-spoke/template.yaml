description: Private endpoints give PaaS resources a private IP inside the hub or a spoke, with shared endpoints placed in a dedicated hub subnet so Azure Firewall can inspect and SNAT traffic from spokes
  and from on-premises over ExpressRoute. DNS forwarders in the hub and centralized private DNS zones linked to every virtual network resolve privatelink names to the endpoint addresses.
