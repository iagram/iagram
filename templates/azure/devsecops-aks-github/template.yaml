source: https://learn.microsoft.com/en-us/azure/architecture/guide/devsecops/devsecops-on-aks
description: Developers authenticate to GitHub through Microsoft Entra ID and commit to a governed repository where GitHub Advanced Security runs code, secret and dependency scanning; GitHub Actions builds
  the container image, pushes it to Azure Container Registry and deploys to AKS after environment approvals. Defender for Containers scans the registry and cluster, Azure Policy enforces admission rules
  through Gatekeeper, Key Vault injects secrets at runtime, and Azure Monitor with Managed Prometheus, Log Analytics and Microsoft Sentinel provide monitoring and SIEM.
