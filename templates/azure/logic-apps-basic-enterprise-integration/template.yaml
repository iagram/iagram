description: Client applications call the API Management gateway over HTTP and authenticate with Microsoft Entra ID, and the gateway validates the token and forwards requests to a Logic Apps workflow imported
  as an API. Logic Apps orchestrates calls to back-end systems such as SaaS applications and line-of-business services through connectors, API Management and Logic Apps publish their interfaces to the developer
  portal where developers consume the API documentation, Key Vault holds secrets and Azure Monitor collects diagnostic logs.
