source: https://learn.microsoft.com/en-us/azure/healthcare-apis/healthcare-apis-overview
description: An Azure Health Data Services workspace hosts a managed FHIR service for clinical records and a DICOM service for medical imaging, with Microsoft Entra RBAC, private link, customer-managed
  keys and per-instance data isolation. EHR systems and SMART on FHIR apps exchange data through the FHIR API, DICOMweb clients store and query imaging studies whose metadata can be projected into FHIR
  ImagingStudy resources, and exports feed a data lake for de-identification, analytics and machine learning.
