description: An Azure Spring Apps Standard instance is injected into a customer virtual network with two dedicated subnets, one for the service runtime and one for the Spring applications, so that apps
  are isolated from the internet and can reach on-premises systems and services in other virtual networks. Azure Spring Apps manages network resources in two managed resource groups, supports bring-your-own
  route tables for egress control and resolves app endpoints through the private.azuremicroservices.io private DNS zone; the Basic, Standard and Enterprise plans entered retirement on 17 March 2025.
