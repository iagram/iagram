description: Producers send events over AMQP, Kafka or HTTPS to a partitioned event hub in an Event Hubs namespace, and Event Hubs Capture writes the raw events as Avro blobs to a storage account or Data
  Lake Storage Gen2 container, authenticating with a user-assigned managed identity that can also target a storage account in a second subscription. Separate consumer groups let an Azure Functions app and
  a Stream Analytics job read the same stream independently with checkpointing.
