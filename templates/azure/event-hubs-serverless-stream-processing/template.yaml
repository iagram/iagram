description: Producers send events over AMQP, Kafka or HTTPS to a partitioned event hub in an Event Hubs namespace, where they are retained for a configurable period. Separate consumer groups let an Azure
  Functions app and a Stream Analytics job read the same stream independently with checkpointing, while Capture writes the raw events to Blob Storage or Data Lake Storage for long-term retention.
