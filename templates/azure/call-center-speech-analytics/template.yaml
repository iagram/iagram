source: https://learn.microsoft.com/en-us/azure/architecture/ai-ml/openai/architecture/call-center-openai-analytics
description: Recorded call audio lands in Blob Storage and a blob or timer trigger starts an Azure Function that submits files to the Speech batch transcription API, redacts personal data with the Language
  conversation PII feature, and sends the transcript to a Foundry-hosted GPT model for intent, sentiment, entity, and summary extraction. Results are stored in a second Blob container for Power BI reporting,
  a web app, and CRM enrichment, with Content Understanding available as an alternative single-step audio analyzer.
