# Release pipeline: `git tag vX.Y.Z && git push --tags` triggers
# .github/workflows/release.yml, which runs this. The frontend is built first
# so `go build` embeds it.
version: 2
project_name: iagram

before:
  hooks:
    - sh -c "cd web && npm ci --silent && npm run build"
    - go mod tidy

builds:
  - id: iagram
    main: ./cmd/iagram
    binary: iagram
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/iagram/iagram/internal/cli.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, SECURITY.md]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:", "^test:"]

release:
  github:
    owner: iagram
    name: iagram
  draft: false
  prerelease: auto
  footer: |
    ## Install
    ```
    brew install --cask iagram/tap/iagram   # macOS / Linux
    curl -fsSL https://raw.githubusercontent.com/iagram/iagram/main/install.sh | sh
    pip install iagram
    docker run --rm -it -p 127.0.0.1:7777:7777 -v "$PWD:/work" ghcr.io/iagram/iagram:{{ .Version }}
    ```
    Binaries are verified against `{{ .ProjectName }}_{{ .Version }}_SHA256SUMS`.

# Container images on GHCR (multi-arch manifest). The Dockerfile.release
# copies the already-built binary instead of rebuilding.
dockers:
  - image_templates: ["ghcr.io/iagram/iagram:{{ .Version }}-amd64"]
    dockerfile: Dockerfile.release
    use: buildx
    goarch: amd64
    build_flag_templates: ["--platform=linux/amd64", "--label=org.opencontainers.image.source=https://github.com/iagram/iagram", "--label=org.opencontainers.image.version={{ .Version }}", "--label=org.opencontainers.image.licenses=Apache-2.0"]
  - image_templates: ["ghcr.io/iagram/iagram:{{ .Version }}-arm64"]
    dockerfile: Dockerfile.release
    use: buildx
    goarch: arm64
    build_flag_templates: ["--platform=linux/arm64", "--label=org.opencontainers.image.source=https://github.com/iagram/iagram", "--label=org.opencontainers.image.version={{ .Version }}", "--label=org.opencontainers.image.licenses=Apache-2.0"]
docker_manifests:
  - name_template: "ghcr.io/iagram/iagram:{{ .Version }}"
    image_templates: ["ghcr.io/iagram/iagram:{{ .Version }}-amd64", "ghcr.io/iagram/iagram:{{ .Version }}-arm64"]
  - name_template: "ghcr.io/iagram/iagram:latest"
    image_templates: ["ghcr.io/iagram/iagram:{{ .Version }}-amd64", "ghcr.io/iagram/iagram:{{ .Version }}-arm64"]

# Homebrew cask pushed to github.com/iagram/homebrew-tap. Skipped when the
# HOMEBREW_TAP_GITHUB_TOKEN secret is not configured, so releases never fail
# because the tap is not set up yet.
homebrew_casks:
  - name: iagram
    repository:
      owner: iagram
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/iagram/iagram
    description: "Infrastructure as diagram: draw your cloud architecture, OpenTofu builds it. Local-only."
    license: Apache-2.0
    binaries: [iagram]
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/iagram"]
          end
